<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>

<title>Protected Areas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Shared by every History page (built by tools/history/build.js).
   Layout: a manuscript folio — parchment paper, maroon ink, gold figures; one-column app with a bottom tab bar. */
:root{
  --paper:#f3efe4; --sheet:#fffdf6; --sunk:#e8e1cf;
  --ink:#241c14; --ink2:#5d5141; --rule:#d8cdb4;
  --blue:#7a2230; --on-blue:#ffffff; --blue-bg:#f4e2e1;
  --accent:#9a6a12; --accent-bg:#f8ecc9;
  --good:#1b6b4a; --good-bg:#ddefe4; --bad:#a8291f; --bad-bg:#f8e0dc;
  --warn-bg:#fcf0cf;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* era groups on the Learn screen */
.eras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.erac{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:grid;gap:6px}
.erac b{font-family:var(--f-display);font-size:15px;font-weight:700;line-height:1.25}
.erac .hi{font-size:12px;color:var(--ink2)}
.erac .mt{font-family:var(--f-num);font-size:11px;color:var(--ink2)}
.erac .meter{height:6px}
.erac[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.grph{display:flex;align-items:baseline;gap:8px;padding:14px 2px 4px;border-top:2px solid var(--ink);margin-top:4px}
.grph h2{font-size:17px}
.grph span{font-size:12px;color:var(--ink2);margin-left:auto;font-family:var(--f-num)}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}
.dots{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--rule);display:block}
.dots i.on{background:var(--accent)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.hot{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px;font-size:15px}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.facts.prose dd{font-weight:400;line-height:1.55}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap,.link{border-radius:var(--r);padding:12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.link{background:var(--sunk);border-color:transparent}
.trick .lab,.trap .lab,.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.link .lab{color:var(--ink2)}
.mn{font-family:var(--f-num);font-weight:600;background:var(--sheet);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.tag.src{background:var(--good-bg);color:var(--good)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:22px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
/* one-line revision rows (last week / last moment) */
.lines{display:grid;gap:0}
.lines div{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px dashed var(--rule);font-size:15px}
.lines div:first-child{border-top:0}
.lines b{font-weight:700}
.lines span{color:var(--ink2)}
.callout{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;font-size:15px}

/* plan maker */
.plancfg{display:grid;gap:12px}
.pday{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.pday > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pday > summary::-webkit-details-marker{display:none}
.pday .dno{font-family:var(--f-num);font-weight:700;font-size:13px;background:var(--sunk);border-radius:99px;padding:2px 10px;white-space:nowrap}
.pday.cur .dno{background:var(--blue);color:var(--on-blue)}
.pday.allgood .dno{background:var(--good-bg);color:var(--good)}
.pday .dt{min-width:0;font-weight:600;font-size:15px}
.pday .dt small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
.pday .dp{font-family:var(--f-num);font-size:12px;color:var(--ink2);white-space:nowrap}
.pday .body{padding:0 14px 12px;display:grid;gap:8px;border-top:1px dashed var(--rule);margin-top:2px;padding-top:10px}
.ptask{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;width:100%;font-size:15px}
.ptask .box{width:22px;height:22px;border-radius:6px;border:1.6px solid var(--rule);display:grid;place-items:center;font-size:14px;color:var(--on-blue);margin-top:1px}
.ptask[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.ptask[aria-pressed="true"] .lbl{text-decoration:line-through;color:var(--ink2)}
.ptask .lbl small{display:block;font-size:12px;color:var(--ink2);text-decoration:none}
/* the story first: plain-language opener for beginners */
.story{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;font-size:16.5px;line-height:1.65}
.story .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.story p{margin:0}
.story .key{background:var(--blue-bg);border-radius:8px;padding:8px 12px;font-size:15px;line-height:1.5}
.story .key b{color:var(--blue)}
/* hub: app cards and the beginner path */
.appcs{display:grid;gap:12px}
.appc{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;text-align:left;width:100%;cursor:pointer}
.appc:hover{border-color:var(--blue)}
.appc .hd{display:flex;align-items:center;gap:10px}
.appc .ic{font-size:26px;line-height:1}
.appc .hd b{font-family:var(--f-display);font-size:17px;font-weight:700;display:block}
.appc .hd small{font-size:12px;color:var(--ink2)}

{"id":"P1","heat":2,"title":"Protected areas: laws, types and projects","hi":"संरक्षित क्षेत्र: क़ानून, प्रकार और परियोजनाएँ","blocks":[{"k":"hot","h":"Asked again and again: the <b>year of each Act and Project<\/b> (Wildlife Act 1972, Project Tiger 1973, Project Elephant 1992), <b>national park vs sanctuary<\/b>, India's <b>first national park<\/b> (Hailey/Corbett, 1936) and the <b>counts<\/b> of each kind."},{"k":"story","h":"<p>Indian wildlife law begins with the <b>Wildlife (Protection) Act, 1972<\/b>. It lets states declare two main kinds of protected area. A <b>national park<\/b> is the strictest: no grazing, no private rights, and its boundary can be changed only by the state legislature. A <b>wildlife sanctuary<\/b> is looser: some human activity is allowed if it doesn't harm wildlife. In 2002 the Act added <b>conservation reserves<\/b> and <b>community reserves<\/b>.<\/p><p>Big species got their own missions: <b>Project Tiger<\/b> (1973), crocodiles (1975), <b>Project Elephant<\/b> (1992), snow leopards (2009), dolphins (2020) and <b>Project Cheetah<\/b> (2022). India's oldest park is <b>Jim Corbett<\/b>, set up as Hailey National Park in <b>1936<\/b>.<\/p>","key":"National park = strictest; sanctuary = some activity allowed; first park Hailey (Corbett) 1936; Wildlife Act 1972."},{"k":"facts","title":"India's protected areas (approximate, as of 2025–26)","rows":[["National parks","About 106 — largest Hemis (Ladakh), smallest South Button Island (Andaman)"],["Wildlife sanctuaries","About 570+ — largest the Indian Wild Ass Sanctuary (Gujarat)"],["Tiger reserves","58 — the latest Madhav (MP, March 2025)"],["Biosphere reserves","18 — 13 of them in UNESCO's world network"],["Ramsar sites","98 as of January 2026; about 100 reported by mid-2026"],["UNESCO World Heritage sites","44 as of 2025 (Sarnath reported as the 45th in July 2026)"],["Most national parks","Madhya Pradesh and Andaman & Nicobar Islands"],["Protected area share","About 5–6% of India's land"]]},{"k":"table","title":"Laws and projects by year","head":["Law / project","Year","Note"],"rows":[["Wildlife (Protection) Act","1972","Gives legal protection to national parks, sanctuaries and listed species; Schedules rationalised to four in 2022."],["Project Tiger","1973","Launched on 1 April 1973 at Jim Corbett National Park with 9 reserves."],["Crocodile Conservation Project","1975","Started in Odisha with help from the UNDP and FAO."],["Forest (Conservation) Act","1980","Renamed the Van (Sanrakshan Evam Samvardhan) Adhiniyam in 2023."],["Environment (Protection) Act","1986","Passed after the Bhopal gas tragedy (1984)."],["Project Elephant","1992","For elephants, their habitats and corridors."],["Biological Diversity Act","2002","Set up the National Biodiversity Authority (Chennai)."],["Scheduled Tribes and Other Traditional Forest Dwellers (Forest Rights) Act","2006",""],["Project Snow Leopard","2009","Covers the Himalayan states and Ladakh."],["Project Dolphin","2020","Announced on Independence Day 2020; the Gangetic dolphin is India's national aquatic animal."],["Project Cheetah","2022","Cheetahs from Namibia released at Kuno on 17 September 2022."],["First national park — Hailey (now Jim Corbett)","1936","Set up in the United Provinces, now Uttarakhand."],["International Big Cat Alliance","2023","Launched in April 2023 for seven big cats; HQ in India."]]},{"k":"table","title":"National park vs wildlife sanctuary","head":["","National park","Wildlife sanctuary"],"rows":[["Human activity","Not allowed (no grazing, no private rights)","Some allowed if it doesn't harm wildlife"],["Who declares","State or Centre","State or Centre"],["Changing the boundary","Only by the state legislature","Needs the State Board for Wildlife's advice"],["Protects","A whole ecosystem","Mostly a particular species"]]},{"k":"trick","h":"Years in a chain: <b>72 Act → 73 Tiger → 75 Croc → 80 Forest → 86 Environment → 92 Elephant → 2002 Biodiversity<\/b>. Think <b>“Tigers Come First, Elephants Behind”<\/b>."},{"k":"trap","h":"The <b>Wildlife Act is 1972<\/b> — the <b>Environment Act is 1986<\/b> (after Bhopal). India's <b>first marine national park<\/b> is in the <b>Gulf of Kutch<\/b>, not the Gulf of Mannar."}],"sum":["The Wildlife (Protection) Act, 1972 creates national parks and sanctuaries; conservation and community reserves were added in 2002.","National parks are the strictest; sanctuaries allow some activity.","India's first national park: Hailey (now Jim Corbett), 1936, Uttarakhand.","Project Tiger 1973, Crocodile 1975, Elephant 1992, Snow Leopard 2009, Dolphin 2020, Cheetah 2022.","About 106 national parks, about 570+ sanctuaries, 58 tiger reserves, 18 biosphere reserves (as of 2025–26)."],"part":["Part 1 · Parks and sanctuaries","राष्ट्रीय उद्यान और अभयारण्य"],"g":"pa"},
{"id":"P2","heat":3,"title":"National parks and their states","hi":"राष्ट्रीय उद्यान और राज्य","blocks":[{"k":"hot","h":"The most common question in this whole app: <b>“X National Park is in which state?”<\/b> Learn the famous ones with their animal — Kaziranga (rhino, Assam), Gir (lion, Gujarat), Keibul Lamjao (floating, Manipur), Hemis (largest, Ladakh)."},{"k":"story","h":"<p>Think of a journey around India. In the north, <b>Hemis<\/b> in Ladakh is the largest park, home to the snow leopard; <b>Dachigam<\/b> near Srinagar shelters the last hangul. In Uttarakhand, <b>Jim Corbett<\/b> was the first park, and <b>Valley of Flowers<\/b> and <b>Nanda Devi<\/b> are UNESCO sites.<\/p><p>In the east, <b>Kaziranga<\/b> and <b>Manas<\/b> (Assam) guard rhinos; <b>Keibul Lamjao<\/b> floats on Loktak Lake in Manipur. The heart of India — <b>Madhya Pradesh<\/b> — has Kanha, Bandhavgarh, Panna, Satpura and <b>Kuno<\/b> (cheetahs). In the south, Kerala has <b>Silent Valley<\/b>, <b>Eravikulam<\/b> and <b>Periyar<\/b>; Gujarat has <b>Gir<\/b> for lions and India's first <b>marine park<\/b>.<\/p>","key":"Link park + animal + state: Kaziranga–rhino–Assam; Gir–lion–Gujarat; Hemis–snow leopard–Ladakh; Keibul Lamjao–sangai–Manipur."},{"k":"table","title":"National parks","head":["Park","State / UT","Remember"],"rows":[["Jim Corbett","Uttarakhand","India's first national park (1936, as Hailey National Park)."],["Kaziranga","Assam","Home of the one-horned rhinoceros; UNESCO site."],["Ranthambore","Rajasthan","Famous for tigers among old fort ruins."],["Gir","Gujarat","The only wild home of the Asiatic lion."],["Kanha","Madhya Pradesh","Saved the barasingha; inspired The Jungle Book."],["Bandhavgarh","Madhya Pradesh","Highest density of tigers in India."],["Kuno","Madhya Pradesh","Cheetahs reintroduced here in 2022."],["Panna","Madhya Pradesh","Known for diamonds and the Ken river."],["Satpura","Madhya Pradesh",""],["Sundarbans","West Bengal","Largest mangrove forest; Royal Bengal tiger."],["Keibul Lamjao","Manipur","The only floating national park — on Loktak Lake; home of the sangai."],["Silent Valley","Kerala","Lion-tailed macaque; saved from a dam in the 1980s."],["Eravikulam","Kerala","Nilgiri tahr; Neelakurinji blooms every 12 years."],["Periyar","Kerala","Elephants and tigers around Periyar lake."],["Bandipur","Karnataka",""],["Nagarhole (Rajiv Gandhi)","Karnataka",""],["Kudremukh","Karnataka",""],["Dachigam","Jammu and Kashmir","Last home of the hangul (Kashmir stag)."],["Hemis","Ladakh","India's largest national park; snow leopards."],["Great Himalayan","Himachal Pradesh","UNESCO World Heritage site (2014)."],["Pin Valley","Himachal Pradesh","Cold desert park in Lahaul and Spiti."],["Valley of Flowers","Uttarakhand","UNESCO site, with Nanda Devi."],["Rajaji","Uttarakhand",""],["Gangotri","Uttarakhand",""],["Namdapha","Arunachal Pradesh","Has all four big cats: tiger, leopard, clouded leopard, snow leopard."],["Mouling","Arunachal Pradesh",""],["Manas","Assam","UNESCO site; pygmy hog and golden langur."],["Nameri","Assam",""],["Dibru-Saikhowa","Assam","Feral horses."],["Dudhwa","Uttar Pradesh","Swamp deer; rhinos reintroduced in 1984."],["Simlipal","Odisha","Melanistic (black) tigers."],["Bhitarkanika","Odisha","Mangroves and saltwater crocodiles."],["Sanjay Gandhi (Borivali)","Maharashtra","Inside the city of Mumbai."],["Tadoba","Maharashtra","Maharashtra's oldest national park."],["Desert","Rajasthan","Great Indian bustard; near Jaisalmer."],["Keoladeo (Bharatpur)","Rajasthan","Bird paradise; UNESCO site."],["Betla","Jharkhand",""],["Valmiki","Bihar","Bihar's only national park."],["Khangchendzonga","Sikkim","India's first 'mixed' UNESCO site (2016)."],["Guindy","Tamil Nadu","Inside the city of Chennai."],["Mudumalai","Tamil Nadu",""],["Gulf of Mannar Marine","Tamil Nadu","Coral reefs and dugongs."],["Marine National Park, Gulf of Kutch","Gujarat","India's first marine national park (1982)."],["Velavadar (Blackbuck)","Gujarat",""],["Mahatma Gandhi Marine (Wandoor)","Andaman and Nicobar Islands",""],["Indravati","Chhattisgarh","Wild water buffalo."],["Kanger Valley","Chhattisgarh","Limestone caves."],["Sultanpur","Haryana","Bird park near Gurugram."],["Kasu Brahmananda Reddy","Telangana","Inside Hyderabad."],["Papikonda","Andhra Pradesh",""],["Balphakram","Meghalaya",""],["Murlen","Mizoram",""],["Clouded Leopard","Tripura",""],["Neora Valley","West Bengal","Red pandas."],["Bhagwan Mahavir (Mollem)","Goa",""]]},{"k":"trick","h":"<b>“Silent Eravi Periyar”<\/b> — three Kerala parks. <b>“KBP-SK”<\/b> — Kanha, Bandhavgarh, Panna, Satpura, Kuno — all Madhya Pradesh, the 'Tiger State'."},{"k":"trap","h":"<b>Sanjay Gandhi NP<\/b> is in Mumbai (Maharashtra), not Delhi. <b>Rajiv Gandhi NP<\/b> is Nagarhole (Karnataka). <b>Dudhwa<\/b> is in UP, not Uttarakhand. <b>Valmiki<\/b> is in Bihar."}],"sum":["Jim Corbett (Uttarakhand) — first; Hemis (Ladakh) — largest.","Kaziranga and Manas — Assam; Keibul Lamjao — Manipur (floating).","Kanha, Bandhavgarh, Panna, Satpura, Kuno — Madhya Pradesh.","Silent Valley, Eravikulam, Periyar — Kerala; Bandipur, Nagarhole — Karnataka.","Gir and Marine NP (Gulf of Kutch) — Gujarat; Ranthambore, Desert, Keoladeo — Rajasthan."],"part":["Part 1 · Parks and sanctuaries","राष्ट्रीय उद्यान और अभयारण्य"],"g":"pa"},
{"id":"P3","heat":2,"title":"Wildlife sanctuaries","hi":"वन्यजीव अभयारण्य","blocks":[{"k":"hot","h":"Sanctuary questions usually pair a <b>famous animal<\/b> with a sanctuary: wild ass (Little Rann of Kutch), Olive Ridley turtles (Gahirmatha), hoolock gibbon (Hollongapar), giant squirrel (Bhimashankar), sloth bear (Daroji)."},{"k":"story","h":"<p>Sanctuaries often exist to protect one special animal. On the salt flats of Gujarat, the <b>Indian Wild Ass Sanctuary<\/b> — India's largest — keeps the khur alive. Each winter, lakhs of <b>Olive Ridley<\/b> turtles crawl ashore at <b>Gahirmatha<\/b> in Odisha. In Assam's <b>Hollongapar<\/b> forest you hear India's only ape, the hoolock gibbon, and at <b>Pobitora<\/b> rhinos live more densely than anywhere on Earth.<\/p><p>In Maharashtra, <b>Bhimashankar<\/b> is the home of the giant squirrel (shekru), Maharashtra's state animal. <b>Gandhi Sagar<\/b> in Madhya Pradesh became the second home of India's cheetahs in 2025.<\/p>","key":"Wild ass — Little Rann (Gujarat); Olive Ridley — Gahirmatha (Odisha); gibbon — Hollongapar (Assam); giant squirrel — Bhimashankar (Maharashtra)."},{"k":"table","title":"Wildlife sanctuaries","head":["Sanctuary","State / UT","Remember"],"rows":[["Pakhui (Pakke)","Arunachal Pradesh","Hornbills; now a tiger reserve."],["Sariska","Rajasthan","Tigers were wiped out by 2005 and brought back in 2008."],["Kumbhalgarh","Rajasthan",""],["Mount Abu","Rajasthan",""],["Tal Chhapar","Rajasthan","Blackbuck."],["Indian Wild Ass Sanctuary (Little Rann of Kutch)","Gujarat","India's largest wildlife sanctuary."],["Jessore Sloth Bear","Gujarat",""],["Pobitora","Assam","Highest density of one-horned rhinos in the world."],["Chakrashila","Assam","Golden langur."],["Hollongapar Gibbon","Assam","India's only ape — the hoolock gibbon."],["Chinnar","Kerala",""],["Thattekad (Salim Ali Bird Sanctuary)","Kerala","Kerala's first bird sanctuary."],["Neyyar","Kerala",""],["Bhimashankar","Maharashtra","Indian giant squirrel (shekru)."],["Great Indian Bustard (Nannaj)","Maharashtra",""],["Koyna","Maharashtra",""],["Dalma","Jharkhand","Elephants; near Jamshedpur."],["Hazaribagh","Jharkhand",""],["Kaimur","Bihar","Bihar's largest sanctuary."],["Coringa","Andhra Pradesh","Mangroves of the Godavari delta."],["Pocharam","Telangana",""],["Eturnagaram","Telangana",""],["Chandra Prabha","Uttar Pradesh","Where Asiatic lions were tried out in the 1950s."],["Sohagi Barwa","Uttar Pradesh",""],["Okhla Bird Sanctuary","Uttar Pradesh",""],["Asola Bhatti","Delhi",""],["Binsar","Uttarakhand",""],["Askot","Uttarakhand","Musk deer."],["Gahirmatha Marine","Odisha","World's largest nesting beach of Olive Ridley turtles."],["Debrigarh","Odisha","On the Hirakud reservoir."],["Daroji Bear","Karnataka","Sloth bears near Hampi."],["Dandeli","Karnataka",""],["Mahananda","West Bengal",""],["Barnawapara","Chhattisgarh",""],["Fambong Lho","Sikkim",""],["Changthang Cold Desert","Ladakh","Highest wildlife sanctuary in India."],["Karakoram (Nubra Shyok)","Ladakh",""],["Overa-Aru","Jammu and Kashmir",""],["Gandhi Sagar","Madhya Pradesh","India's second home for cheetahs (2025)."],["National Chambal","Madhya Pradesh, Rajasthan and Uttar Pradesh","Gharials and Gangetic dolphins on the Chambal river."],["Cotigao","Goa",""],["Shikari Devi","Himachal Pradesh",""],["Nongkhyllem","Meghalaya",""],["Sepahijala","Tripura","Spectacled monkey (Phayre's leaf monkey)."],["Yangoupokpi-Lokchao","Manipur",""],["Fakim","Nagaland",""],["Kyongnosla Alpine","Sikkim",""]]},{"k":"trick","h":"<b>“Pobitora = Plenty of rhinos”<\/b> (highest density). <b>“Gahirmatha = Gathering of turtles”<\/b>."},{"k":"trap","h":"<b>Sariska<\/b> and <b>Pakke<\/b> started as sanctuaries and are now tiger reserves too. The <b>National Chambal Sanctuary<\/b> spans three states — MP, Rajasthan and UP."}],"sum":["Indian Wild Ass Sanctuary (Little Rann of Kutch, Gujarat) is India's largest sanctuary.","Gahirmatha (Odisha) — Olive Ridley turtles; Pobitora (Assam) — densest rhinos.","Hollongapar (Assam) — hoolock gibbon; Bhimashankar (Maharashtra) — giant squirrel.","Daroji (Karnataka) — sloth bear; Dalma (Jharkhand) — elephants.","National Chambal Sanctuary (MP, Rajasthan, UP) — gharials; Gandhi Sagar (MP) — cheetahs since 2025."],"part":["Part 1 · Parks and sanctuaries","राष्ट्रीय उद्यान और अभयारण्य"],"g":"pa"},
{"id":"P4","heat":3,"title":"Tiger reserves and Project Tiger","hi":"बाघ अभयारण्य और प्रोजेक्ट टाइगर","blocks":[{"k":"hot","h":"Always asked: <b>Project Tiger 1973<\/b>, the <b>number of tiger reserves (58)<\/b> and the <b>newest<\/b> ones, the <b>largest<\/b> (Nagarjunasagar-Srisailam) and <b>smallest<\/b> (Bor), and the state with the most tigers (Madhya Pradesh)."},{"k":"story","h":"<p>In 1973 India had fewer than 2,000 tigers left. <b>Project Tiger<\/b> began on 1 April 1973 at Jim Corbett with <b>nine<\/b> reserves. In 2005 the <b>National Tiger Conservation Authority (NTCA)<\/b> was set up to run it. The tiger census held every four years counted at least <b>3,167<\/b> tigers in 2022 (estimated <b>3,682<\/b>) — about three-quarters of the world's wild tigers.<\/p><p>New reserves keep coming: <b>Srivilliputhur-Megamalai<\/b> (51st, TN, 2021), <b>Ramgarh Vishdhari<\/b> (52nd, Rajasthan), <b>Ranipur<\/b> (53rd, UP), <b>Dholpur-Karauli<\/b> (54th), <b>Veerangana Durgavati<\/b> (55th, MP), <b>Guru Ghasidas–Tamor Pingla<\/b> (56th, Chhattisgarh), <b>Ratapani<\/b> (57th, MP) and <b>Madhav<\/b> (58th, MP, March 2025). Madhya Pradesh now has 9 — the most.<\/p>","key":"Project Tiger 1973; NTCA 2005; 58 reserves; largest Nagarjunasagar-Srisailam, smallest Bor; 2022 census 3,682 (estimate)."},{"k":"facts","title":"Tiger numbers (2022 census, released 2023)","rows":[["India's tigers","3,682 (estimate); 3,167 counted"],["Most tigers","Madhya Pradesh (785), then Karnataka (563) and Uttarakhand (560)"],["Reserve with most tigers","Corbett"],["Most tiger reserves","Madhya Pradesh — 9"],["Largest reserve","Nagarjunasagar-Srisailam (Andhra Pradesh)"],["Smallest reserve","Bor (Maharashtra)"],["Run by","National Tiger Conservation Authority (NTCA), set up 2005"],["International Tiger Day","29 July — agreed at the St Petersburg summit, 2010"]]},{"k":"table","title":"Tiger reserves","head":["Reserve","State","Remember"],"rows":[["Nagarjunasagar-Srisailam","Andhra Pradesh","India's largest tiger reserve."],["Bor","Maharashtra","India's smallest tiger reserve."],["Corbett","Uttarakhand","The most tigers of any reserve (2022 census)."],["Mukundra Hills","Rajasthan",""],["Ramgarh Vishdhari","Rajasthan","India's 52nd tiger reserve (2022)."],["Dholpur-Karauli","Rajasthan","India's 54th tiger reserve (2023)."],["Sunderbans","West Bengal",""],["Buxa","West Bengal",""],["Palamau","Jharkhand","One of the first nine (1973); first-ever tiger census by pugmarks (1932)."],["Satkosia","Odisha",""],["Pilibhit","Uttar Pradesh","Won the first TX2 award (2020) for doubling tigers."],["Amangarh","Uttar Pradesh",""],["Ranipur","Uttar Pradesh","India's 53rd tiger reserve (2022)."],["Orang","Assam",""],["Kamlang","Arunachal Pradesh",""],["Dampa","Mizoram",""],["Parambikulam","Kerala",""],["Bhadra","Karnataka",""],["Kali (Dandeli-Anshi)","Karnataka",""],["Anamalai","Tamil Nadu",""],["Kalakad-Mundanthurai","Tamil Nadu",""],["Sathyamangalam","Tamil Nadu",""],["Srivilliputhur-Megamalai","Tamil Nadu","India's 51st tiger reserve (2021)."],["Kawal","Telangana",""],["Amrabad","Telangana",""],["Achanakmar","Chhattisgarh",""],["Udanti-Sitanadi","Chhattisgarh",""],["Guru Ghasidas–Tamor Pingla","Chhattisgarh","India's 56th tiger reserve (November 2024)."],["Melghat","Maharashtra","One of the first nine (1973)."],["Sahyadri","Maharashtra",""],["Navegaon-Nagzira","Maharashtra",""],["Sanjay-Dubri","Madhya Pradesh",""],["Veerangana Durgavati","Madhya Pradesh","India's 55th tiger reserve (2023)."],["Ratapani","Madhya Pradesh","India's 57th tiger reserve (December 2024), near Bhopal."],["Madhav","Madhya Pradesh","India's 58th tiger reserve (March 2025), Shivpuri."]]},{"k":"trick","h":"The newest four, in order — <b>“Very Good Rats Munch”<\/b>: <b>V<\/b>eerangana Durgavati (55), <b>G<\/b>uru Ghasidas (56), <b>R<\/b>atapani (57), <b>M<\/b>adhav (58)."},{"k":"trap","h":"Most <b>tigers<\/b> = Madhya Pradesh, but the single reserve with the most tigers is <b>Corbett<\/b> (Uttarakhand). The <b>largest<\/b> reserve is in <b>Andhra Pradesh<\/b>, not MP."}],"sum":["Project Tiger began 1 April 1973 at Jim Corbett with nine reserves; NTCA set up in 2005.","India has 58 tiger reserves (as of March 2025); Madhya Pradesh has the most (9).","Latest: Ratapani (57th, Dec 2024) and Madhav (58th, Mar 2025), both in MP.","Largest: Nagarjunasagar-Srisailam (AP); smallest: Bor (Maharashtra).","2022 census: 3,682 tigers (estimate); MP has the most tigers, Corbett the most of any reserve."],"part":["Part 1 · Parks and sanctuaries","राष्ट्रीय उद्यान और अभयारण्य"],"g":"pa"},
{"id":"P5","heat":3,"title":"Biosphere reserves","hi":"जैवमंडल आरक्षित क्षेत्र","blocks":[{"k":"hot","h":"Know the <b>18 biosphere reserves<\/b> with their states, the <b>first<\/b> (Nilgiri, 1986), the <b>largest<\/b> (Great Rann of Kutch) and <b>smallest<\/b> (Dibru-Saikhowa), and the <b>13 in UNESCO's list<\/b> — the newest, <b>Cold Desert<\/b>, joined in September 2025."},{"k":"story","h":"<p>A biosphere reserve protects a whole landscape <i>and<\/i> the people living in it. It has three rings: a strictly protected <b>core<\/b>, a <b>buffer<\/b> for research and education, and a <b>transition<\/b> zone where villages and farms carry on. The idea comes from UNESCO's <b>Man and the Biosphere (MAB)<\/b> programme, started in <b>1971<\/b>.<\/p><p>India's first was <b>Nilgiri<\/b> (1986), spread over Tamil Nadu, Kerala and Karnataka. Today there are <b>18<\/b>, the last being <b>Panna<\/b> (2011). <b>13<\/b> are in UNESCO's World Network — <b>Cold Desert<\/b> in Himachal Pradesh became the 13th in September 2025. Manas, Dibru-Saikhowa, Dihang-Dibang, Great Rann of Kutch and Seshachalam are not yet in it.<\/p>","key":"18 biosphere reserves; first Nilgiri 1986; 13 in UNESCO (latest Cold Desert 2025); largest Great Rann of Kutch; smallest Dibru-Saikhowa."},{"k":"table","title":"The 18 biosphere reserves","head":["Reserve","State(s)","Year / UNESCO"],"rows":[["Nilgiri","Tamil Nadu, Kerala and Karnataka","India's first (1986); UNESCO 2000."],["Nanda Devi","Uttarakhand","1988; UNESCO 2004."],["Nokrek","Meghalaya","1988; UNESCO 2009."],["Great Nicobar","Andaman and Nicobar Islands","1989; UNESCO 2013."],["Gulf of Mannar","Tamil Nadu","1989; UNESCO 2001 — India's first marine biosphere reserve."],["Manas","Assam","1989; not in the UNESCO list."],["Sundarban","West Bengal","1989; UNESCO 2001."],["Simlipal","Odisha","1994; UNESCO 2009."],["Dibru-Saikhowa","Assam","1997; India's smallest biosphere reserve."],["Dihang-Dibang","Arunachal Pradesh","1998."],["Pachmarhi","Madhya Pradesh","1999; UNESCO 2009."],["Khangchendzonga","Sikkim","2000; UNESCO 2018."],["Agasthyamalai","Kerala and Tamil Nadu","2001; UNESCO 2016."],["Achanakmar-Amarkantak","Madhya Pradesh and Chhattisgarh","2005; UNESCO 2012."],["Great Rann of Kutch","Gujarat","2008; India's largest biosphere reserve."],["Cold Desert","Himachal Pradesh","2009 (16th); UNESCO September 2025 — the 13th Indian site in the list."],["Seshachalam","Andhra Pradesh","2010."],["Panna","Madhya Pradesh","2011 (18th); UNESCO 2020."]]},{"k":"table","title":"When they joined UNESCO's World Network","head":["Reserve","Year"],"rows":[["Nilgiri","2000"],["Gulf of Mannar","2001"],["Sundarban","2001"],["Nanda Devi","2004"],["Nokrek","2009"],["Pachmarhi","2009"],["Simlipal","2009"],["Achanakmar-Amarkantak","2012"],["Great Nicobar","2013"],["Agasthyamalai","2016"],["Khangchendzonga","2018"],["Panna","2020"],["Cold Desert","2025"]]},{"k":"trick","h":"Five <b>not<\/b> in UNESCO — <b>“My Dear Dad Got Sick”<\/b>: <b>M<\/b>anas, <b>D<\/b>ibru-Saikhowa, <b>D<\/b>ihang-Dibang, <b>G<\/b>reat Rann of Kutch, <b>S<\/b>eshachalam."},{"k":"trap","h":"<b>Manas<\/b> is a UNESCO <i>World Heritage site<\/i> but <b>not<\/b> a UNESCO <i>biosphere reserve<\/i>. The <b>Great Rann of Kutch<\/b> is the largest biosphere reserve; the <b>Indian Wild Ass Sanctuary<\/b> (Little Rann) is the largest sanctuary."}],"sum":["India has 18 biosphere reserves; the first was Nilgiri (1986), the latest Panna (2011).","13 are in UNESCO's World Network; Cold Desert (Himachal Pradesh) joined in September 2025.","Largest: Great Rann of Kutch (Gujarat); smallest: Dibru-Saikhowa (Assam).","Gulf of Mannar is India's first marine biosphere reserve.","A biosphere reserve has a core, a buffer and a transition zone (UNESCO's MAB programme, 1971)."],"part":["Part 2 · Reserves and wetlands","आरक्षित क्षेत्र और आर्द्रभूमि"],"g":"pa"},
{"id":"P6","heat":3,"title":"Ramsar sites (wetlands)","hi":"रामसर स्थल (आर्द्रभूमि)","blocks":[{"k":"hot","h":"Ramsar questions are frequent in recent papers: <b>which state<\/b> a site is in, the <b>first<\/b> sites (Chilika and Keoladeo), the <b>largest<\/b> (Sundarban) and <b>smallest<\/b> (Renuka), the <b>Montreux Record<\/b>, and the <b>newest additions<\/b>."},{"k":"story","h":"<p>On <b>2 February 1971<\/b> — now World Wetlands Day — countries met in the Iranian town of <b>Ramsar<\/b> and signed a treaty to protect wetlands. India joined on <b>1 February 1982<\/b>, and its first two sites were <b>Chilika Lake<\/b> (Odisha) and <b>Keoladeo<\/b> (Rajasthan).<\/p><p>For decades India had only a few dozen sites; then came a rush. India had <b>98<\/b> by January 2026, after <b>Patna Bird Sanctuary<\/b> (Etah, UP — not Bihar!) and <b>Chhari-Dhand<\/b> (Kutch) were added, and about 100 were reported by mid-2026. <b>Tamil Nadu<\/b> has the most. Sites in trouble go on the <b>Montreux Record<\/b> — India's are <b>Keoladeo<\/b> and <b>Loktak<\/b>.<\/p>","key":"Ramsar Convention 1971 (Iran); India joined 1982; first sites Chilika and Keoladeo; Tamil Nadu has the most; Montreux Record — Keoladeo, Loktak."},{"k":"facts","title":"Ramsar records (as of 2026)","rows":[["Convention signed","2 February 1971, Ramsar (Iran) — World Wetlands Day"],["India joined","1 February 1982"],["India's sites","98 as of January 2026 (about 100 reported by mid-2026)"],["First Indian sites","Chilika Lake and Keoladeo (1981)"],["Largest site","Sundarban Wetland (West Bengal)"],["Smallest site","Renuka Wetland (Himachal Pradesh)"],["State with most sites","Tamil Nadu"],["Montreux Record (sites in danger)","Keoladeo and Loktak"]]},{"k":"table","title":"Ramsar sites by state","head":["Site","State / UT","Remember"],"rows":[["Chilika Lake","Odisha","India's first Ramsar site (1981) with Keoladeo; largest brackish-water lagoon in Asia."],["Keoladeo","Rajasthan","1981; on the Montreux Record."],["Wular Lake","Jammu and Kashmir","India's largest freshwater lake."],["Loktak Lake","Manipur","Floating phumdis; on the Montreux Record."],["Harike","Punjab","Where the Beas meets the Sutlej."],["Sambhar Lake","Rajasthan","India's largest inland salt lake."],["Tso Morari","Ladakh",""],["Tso Kar","Ladakh","High-altitude lake complex."],["Renuka","Himachal Pradesh","India's smallest Ramsar site."],["Chandra Taal","Himachal Pradesh",""],["Pong Dam","Himachal Pradesh",""],["Deepor Beel","Assam","Assam's only Ramsar site."],["Rudrasagar","Tripura",""],["East Kolkata Wetlands","West Bengal","Uses wastewater for fish farming."],["Sundarban Wetland","West Bengal","India's largest Ramsar site."],["Kolleru Lake","Andhra Pradesh",""],["Vembanad-Kol","Kerala","Kerala's largest wetland."],["Ashtamudi","Kerala",""],["Sasthamkotta","Kerala","Kerala's largest freshwater lake."],["Bhoj Wetland","Madhya Pradesh","The lakes of Bhopal."],["Sur Sarovar","Uttar Pradesh","Near Agra."],["Sarsai Nawar Jheel","Uttar Pradesh","Sarus cranes, Etawah."],["Patna Bird Sanctuary","Uttar Pradesh","In Etah district — added January 2026."],["Nandur Madhameshwar","Maharashtra","Maharashtra's first Ramsar site."],["Lonar Lake","Maharashtra","A crater lake made by a meteorite."],["Thane Creek","Maharashtra","Flamingos."],["Nal Sarovar","Gujarat",""],["Khijadia","Gujarat",""],["Thol","Gujarat",""],["Chhari-Dhand","Gujarat","In Kutch — added January 2026."],["Sultanpur","Haryana",""],["Bhindawas","Haryana",""],["Asan Barrage","Uttarakhand","Uttarakhand's first Ramsar site."],["Pala Wetland","Mizoram",""],["Hirakud Reservoir","Odisha",""],["Bhitarkanika Mangroves","Odisha",""],["Kabartal","Bihar","Bihar's first Ramsar site."],["Nanda Lake","Goa",""],["Ranganathittu","Karnataka",""],["Vedanthangal","Tamil Nadu",""],["Pallikaranai Marsh","Tamil Nadu",""],["Point Calimere","Tamil Nadu",""],["Pichavaram Mangrove","Tamil Nadu",""],["Yashwant Sagar","Madhya Pradesh",""],["Khecheopalri Lake","Sikkim","Sikkim's first Ramsar site (January 2025)."],["Udhwa Lake","Jharkhand","Jharkhand's first Ramsar site (January 2025)."],["Khichan","Rajasthan","Demoiselle cranes — added June 2025."],["Menar","Rajasthan","The 'bird village' near Udaipur — added June 2025."],["Hokera Wetland","Jammu and Kashmir",""],["Kanjli","Punjab",""]]},{"k":"trick","h":"<b>“Chilly Keo”<\/b> — Chilika and Keoladeo were first. <b>“Montreux = Mourning”<\/b> — the sites in mourning: Keoladeo and Loktak (<b>K-L<\/b>)."},{"k":"trap","h":"<b>Patna Bird Sanctuary<\/b> is in <b>Etah, Uttar Pradesh<\/b> — not Patna, Bihar. <b>Chilika<\/b> was removed from the Montreux Record in 2002. The convention was signed in 1971 but India joined in <b>1982<\/b>."}],"sum":["Ramsar Convention: 2 February 1971, Ramsar, Iran; India joined 1 February 1982.","India's first Ramsar sites: Chilika Lake (Odisha) and Keoladeo (Rajasthan).","Largest: Sundarban Wetland; smallest: Renuka (HP); Tamil Nadu has the most.","Montreux Record: Keoladeo and Loktak.","January 2026 additions: Patna Bird Sanctuary (Etah, UP) and Chhari-Dhand (Kutch, Gujarat) — 98 sites."],"part":["Part 2 · Reserves and wetlands","आरक्षित क्षेत्र और आर्द्रभूमि"],"g":"pa"},
{"id":"P7","heat":3,"title":"UNESCO World Heritage sites in India","hi":"भारत में यूनेस्को विश्व धरोहर स्थल","blocks":[{"k":"hot","h":"Asked every year: <b>which state<\/b> a heritage site is in, the <b>newest<\/b> sites (Moidams 2024, Maratha Military Landscapes 2025), the <b>first four<\/b> (1983) and the <b>natural<\/b> and <b>mixed<\/b> sites."},{"k":"story","h":"<p>India's heritage list began in <b>1983<\/b> with <b>Ajanta, Ellora, Agra Fort and the Taj Mahal<\/b>. Over four decades it grew to <b>44<\/b> sites by 2025 — <b>36 cultural, 7 natural and 1 mixed<\/b> (Khangchendzonga).<\/p><p>Recent years added <b>Dholavira<\/b> and <b>Ramappa Temple<\/b> (2021), <b>Santiniketan<\/b> and the <b>Hoysala temples<\/b> (2023), the <b>Moidams of Charaideo<\/b> in Assam (2024) and the <b>Maratha Military Landscapes<\/b> — 12 forts in Maharashtra and Tamil Nadu (2025). In July 2026 <b>Sarnath<\/b> was reported added as the 45th. Maharashtra has the most sites.<\/p>","key":"First four (1983): Ajanta, Ellora, Agra Fort, Taj; 44 sites by 2025 (36 cultural, 7 natural, 1 mixed); latest Maratha Military Landscapes (2025)."},{"k":"table","title":"World Heritage sites","head":["Site","State / UT","Year and note"],"rows":[["Ajanta Caves","Maharashtra","1983 — among India's first four sites."],["Ellora Caves","Maharashtra","1983 — Hindu, Buddhist and Jain caves."],["Agra Fort","Uttar Pradesh","1983."],["Taj Mahal","Uttar Pradesh","1983."],["Sun Temple, Konark","Odisha","1984 — the Black Pagoda."],["Group of Monuments at Mahabalipuram","Tamil Nadu","1984 — Pallava shore temples."],["Churches and Convents of Goa","Goa","1986."],["Khajuraho Group of Monuments","Madhya Pradesh","1986 — Chandela temples."],["Group of Monuments at Hampi","Karnataka","1986 — capital of Vijayanagara."],["Fatehpur Sikri","Uttar Pradesh","1986 — Akbar's capital."],["Group of Monuments at Pattadakal","Karnataka","1987 — Chalukya temples."],["Elephanta Caves","Maharashtra","1987."],["Great Living Chola Temples","Tamil Nadu","1987, extended 2004."],["Buddhist Monuments at Sanchi","Madhya Pradesh","1989."],["Humayun's Tomb","Delhi","1993."],["Qutb Minar and its Monuments","Delhi","1993."],["Mahabodhi Temple, Bodh Gaya","Bihar","2002."],["Rock Shelters of Bhimbetka","Madhya Pradesh","2003 — prehistoric paintings."],["Champaner-Pavagadh","Gujarat","2004."],["Chhatrapati Shivaji Terminus","Maharashtra","2004 — Victorian Gothic railway station."],["Red Fort Complex","Delhi","2007."],["Jantar Mantar, Jaipur","Rajasthan","2010 — Sawai Jai Singh's observatory."],["Hill Forts of Rajasthan","Rajasthan","2013 — six forts incl. Chittorgarh and Kumbhalgarh."],["Rani-ki-Vav, Patan","Gujarat","2014 — the stepwell on the ₹100 note."],["Archaeological Site of Nalanda Mahavihara","Bihar","2016."],["Capitol Complex (Le Corbusier)","Chandigarh","2016."],["Historic City of Ahmedabad","Gujarat","2017 — India's first World Heritage City."],["Victorian Gothic and Art Deco Ensembles of Mumbai","Maharashtra","2018."],["Jaipur City","Rajasthan","2019 — the Pink City."],["Dholavira","Gujarat","2021 — Harappan city in Kutch."],["Ramappa Temple (Kakatiya Rudreshwara)","Telangana","2021."],["Santiniketan","West Bengal","2023."],["Sacred Ensembles of the Hoysalas","Karnataka","2023 — Belur, Halebidu, Somanathapura."],["Moidams of Charaideo","Assam","2024 — Ahom royal burial mounds; first cultural site of the North-East."],["Maratha Military Landscapes","Maharashtra and Tamil Nadu","2025 — 12 forts incl. Raigad and Gingee; the 44th site."],["Sarnath","Uttar Pradesh","Reported inscribed July 2026 as the 45th site."],["Kaziranga National Park","Assam","1985 — natural."],["Manas Wildlife Sanctuary","Assam","1985 — natural."],["Keoladeo National Park","Rajasthan","1985 — natural."],["Sundarbans National Park","West Bengal","1987 — natural."],["Nanda Devi and Valley of Flowers","Uttarakhand","1988, extended 2005 — natural."],["Great Himalayan National Park","Himachal Pradesh","2014 — natural."],["Western Ghats","Kerala, Karnataka, Tamil Nadu and Maharashtra","2012 — natural; a biodiversity hotspot."],["Khangchendzonga National Park","Sikkim","2016 — India's only mixed site."]]},{"k":"trick","h":"The natural seven — <b>“Kaziranga Manas Keoladeo, Sundar Nanda, Himalaya Ghats”<\/b>: Kaziranga, Manas, Keoladeo, Sundarbans, Nanda Devi & Valley of Flowers, Great Himalayan NP, Western Ghats. Khangchendzonga is the one <b>mixed<\/b>."},{"k":"trap","h":"<b>Rani-ki-Vav<\/b> is in Patan, <b>Gujarat<\/b> — not Rajasthan. <b>Ramappa<\/b> is in <b>Telangana<\/b>. The <b>Hill Forts<\/b> are in Rajasthan, but the <b>Maratha forts<\/b> include <b>Gingee<\/b> in Tamil Nadu."}],"sum":["First four World Heritage sites (1983): Ajanta, Ellora, Agra Fort, Taj Mahal.","India had 44 sites by 2025 — 36 cultural, 7 natural, 1 mixed (Khangchendzonga).","Recent: Dholavira and Ramappa (2021), Santiniketan and Hoysala temples (2023), Moidams (2024), Maratha Military Landscapes (2025).","Ahmedabad (2017) was India's first World Heritage City; Jaipur followed in 2019.","Sarnath was reported as the 45th site in July 2026."],"part":["Part 2 · Reserves and wetlands","आरक्षित क्षेत्र और आर्द्रभूमि"],"g":"pa"},
{"id":"P8","heat":3,"title":"Animals and where to find them","hi":"वन्यजीव और उनके आवास","blocks":[{"k":"hot","h":"A favourite question type: <b>“Which park is famous for X?”<\/b> Learn one park per animal — rhino–Kaziranga, lion–Gir, sangai–Keibul Lamjao, hangul–Dachigam, barasingha–Kanha, Nilgiri tahr–Eravikulam, Olive Ridley–Gahirmatha."},{"k":"story","h":"<p>Many of India's rarest animals survive in just one place. The <b>Asiatic lion<\/b> lives wild only in <b>Gir<\/b>. The <b>sangai<\/b> deer dances on the floating meadows of <b>Keibul Lamjao<\/b>. The <b>hangul<\/b>, Kashmir's only red deer, clings on in <b>Dachigam<\/b>. In <b>Kanha<\/b>, rangers saved the <b>barasingha<\/b> from fewer than 70 animals.<\/p><p>Some come home after long journeys: <b>Olive Ridley<\/b> turtles return to <b>Gahirmatha<\/b> beach every winter, and <b>cheetahs<\/b> — extinct in India since 1952 — were brought from Namibia to <b>Kuno<\/b> in 2022. The <b>great Indian bustard<\/b> of the Thar Desert is now one of the world's rarest birds.<\/p>","key":"Lion — Gir; rhino — Kaziranga; sangai — Keibul Lamjao; hangul — Dachigam; barasingha — Kanha; tahr — Eravikulam; cheetah — Kuno."},{"k":"table","title":"Animal ↔ park","head":["Animal","Best-known home","Note"],"rows":[["One-horned rhinoceros","Kaziranga (Assam)","Also Pobitora, Manas, Orang and Jaldapara."],["Asiatic lion","Gir (Gujarat)","The only wild population in the world."],["Sangai (brow-antlered deer)","Keibul Lamjao (Manipur)","Manipur's state animal."],["Hangul (Kashmir stag)","Dachigam (Jammu and Kashmir)",""],["Barasingha (hard-ground swamp deer)","Kanha (Madhya Pradesh)","MP's state animal."],["Nilgiri tahr","Eravikulam (Kerala)","Tamil Nadu's state animal."],["Snow leopard","Hemis (Ladakh)",""],["Indian wild ass (khur)","Little Rann of Kutch (Gujarat)",""],["Cheetah (reintroduced)","Kuno (Madhya Pradesh)","Brought from Namibia in 2022."],["Olive Ridley turtle","Gahirmatha (Odisha)","Mass nesting is called 'arribada'."],["Saltwater crocodile","Bhitarkanika (Odisha)",""],["Great Indian bustard","Desert National Park (Rajasthan)","Critically endangered; Rajasthan's state bird."],["Lion-tailed macaque","Silent Valley (Kerala)",""],["Golden langur","Chakrashila (Assam)",""],["Hoolock gibbon","Hollongapar (Assam)","India's only ape."],["Red panda","Singalila (West Bengal)","Sikkim's state animal."],["Gharial","National Chambal Sanctuary",""],["Blackbuck","Velavadar (Gujarat)",""],["Siberian crane (winter visitor, now rare)","Keoladeo (Rajasthan)",""],["Demoiselle crane","Khichan (Rajasthan)","Called 'kurja' locally."],["Sloth bear","Daroji (Karnataka)",""],["Indian giant squirrel","Bhimashankar (Maharashtra)","Maharashtra's state animal."],["Pygmy hog","Manas (Assam)","The smallest wild pig."],["Dugong (sea cow)","Gulf of Mannar (Tamil Nadu)",""],["Sarus crane","Sarsai Nawar (Uttar Pradesh)","The tallest flying bird; UP's state bird."],["Wild water buffalo","Udanti-Sitanadi (Chhattisgarh)","Chhattisgarh's state animal."]]},{"k":"table","title":"IUCN Red List status","head":["Animal","Status","Note"],"rows":[["Great Indian bustard","Critically endangered","Fewer than 150 left; power lines are a major threat."],["Gharial","Critically endangered",""],["Pygmy hog","Endangered",""],["Bengal tiger","Endangered",""],["Asiatic lion","Endangered","Moved from 'critically endangered' in 2008."],["Asian elephant","Endangered",""],["Snow leopard","Vulnerable","Moved from 'endangered' in 2017."],["One-horned rhinoceros","Vulnerable",""],["Sloth bear","Vulnerable",""],["Blackbuck","Least concern",""],["Indian peafowl","Least concern","India's national bird."]]},{"k":"trick","h":"<b>Endangered order<\/b> on the IUCN ladder: Least concern → Near threatened → <b>Vulnerable<\/b> → <b>Endangered<\/b> → <b>Critically endangered<\/b> → Extinct in the wild → Extinct. Tiger and lion are <b>Endangered<\/b>; rhino and snow leopard are only <b>Vulnerable<\/b>; bustard and gharial are <b>Critically endangered<\/b>."},{"k":"trap","h":"The <b>golden langur<\/b> lives in Assam (and Bhutan), not the Western Ghats — the Western Ghats monkey is the <b>lion-tailed macaque<\/b>. The <b>cheetah<\/b> was declared extinct in India in <b>1952<\/b>."}],"sum":["Asiatic lion — Gir; one-horned rhino — Kaziranga; sangai — Keibul Lamjao; hangul — Dachigam.","Barasingha — Kanha; Nilgiri tahr — Eravikulam; snow leopard — Hemis.","Olive Ridley — Gahirmatha; saltwater crocodile — Bhitarkanika; gharial — Chambal.","Cheetahs were brought to Kuno in 2022 (extinct in India since 1952).","Great Indian bustard and gharial are critically endangered; tiger and lion endangered; rhino and snow leopard vulnerable."],"part":["Part 3 · Heritage and wildlife","धरोहर और वन्यजीव"],"g":"pa"}

/* ---------- home ---------- */
function renderLab(){
  labStyle(); labStop();
  const L = labS();
  const sp = (LAB_CONF.specials || []).find(x => x.id === LAB.view); if (sp) return sp.open();

      ${(LAB_CONF.specials || []).map(s => `<button type="button" class="lab-g${s.wide ? " wide" : ""}" data-lab-go="${s.id}"><span class="t"><span aria-hidden="true">${s.ico}</span><b>${esc(s.title)}</b></span><small>${s.sub}</small><span class="best">${s.best ? s.best(L) : ""}</span></button>`).join("")}
      ${LAB_CONF.decks.map(card).join("")}
      ${LAB_CONF.match ? `<button type="button" class="lab-g" data-lab-go="match"><span class="t"><span aria-hidden="true">🃏</span><b>Memory Match</b></span><small>${esc(LAB_CONF.match.sub)}</small><span class="best">${L.match ? "Best: " + L.match + " moves" : "Not played yet"}</span></button>` : ""}
    </div>
    <div class="block"><h3>How to use the Lab</h3><p class="muted" style="margin:0">Read a lesson first, then play its game until you can answer in about three seconds — that is the speed the exam needs. Each game lasts 60 seconds: right answers in a row build a combo for bonus points. Tap <b>See all pairs</b> on a game to revise its list.</p></div>

const labBack = () => `<div class="lhead"><button class="back" type="button" data-lab-home>‹ Lab</button></div>`;
function labBindHome(){ $("#app").querySelectorAll("[data-lab-home]").forEach(b => b.onclick = () => { labStop(); LAB.view = "home"; renderLab(); window.scrollTo(0,0); }); }

/* ---------- quiz games (60 seconds) ---------- */
function labDeck(id){
  const d = LAB_CONF.decks.find(x => x.id === id);
  const ask = (pre, t) => pre ? `${pre} ${t}${/[?:]$/.test(pre) ? "" : "?"}` : t;
  let items = d.make ? d.make() : d.pairs.map(p => ({ p: ask(d.q, p[0]), a: p[1], note: p[2] || "", raw: p[0], pool: "a" }));
  if (d.rq && !d.make) {   // also ask the other way round, where an answer belongs to one prompt only
    const n = {}; d.pairs.forEach(p => { n[p[1]] = (n[p[1]] || 0) + 1; });
    items = items.concat(d.pairs.filter(p => n[p[1]] === 1).map(p => ({ p: ask(d.rq, p[1]), a: p[0], note: p[2] || "", raw: p[1], pool: "p" })));
  }
  return { d, items };
}
function labIntro(id){
  const { d } = labDeck(id), L = labS();
  const list = d.list ? d.list() : d.pairs;
  $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}
    <div class="block stack lab-pop" style="text-align:center"><div style="font-size:46px" aria-hidden="true">${d.ico}</div><h1 style="margin:0">${esc(d.title)}</h1><p class="muted" style="margin:0">${esc(d.sub)} · 60 seconds · combos for answers in a row</p>
      <p style="margin:0">${L.best[d.id] ? "Your best: <b>" + L.best[d.id] + "</b>" : "First go — no pressure."}</p>
      <div class="row" style="justify-content:center"><button class="btn pri" type="button" id="labgo">▶ Start</button><button class="btn" type="button" id="labpairs">See all pairs</button>${d.lesson ? `<button class="btn ghost" type="button" id="lablesson">Read the lesson</button>` : ""}</div></div>
    <div id="labpairlist"></div></section>`;
  labBindHome();
  $("#labgo").onclick = () => labRun(id);
  $("#labpairs").onclick = () => { $("#labpairlist").innerHTML = `<div class="block"><h3>${list.length} pairs to know</h3><div class="lab-pairs">${list.map(p => `<div><span>${esc(p[0])}</span><b>${esc(p[1])}</b></div>`).join("")}</div></div>`; };
  const lb = $("#lablesson"); if (lb) lb.onclick = () => openLesson(d.lesson, "learn");
}
let LG = null;
function labRun(id){
  labStop();
  const { d, items } = labDeck(id);
  LG = { d, items: shuffle(items), i: 0, score: 0, right: 0, tried: 0, combo: 0, maxc: 0, left: 60, miss: [], lock: false };
  $("#app").innerHTML = `<section class="view stack lab-play">
    <div class="lab-hud"><button class="back" type="button" id="labquit">✕ Stop</button><span class="lab-combo" id="labcombo"></span><span class="sc" id="labscore">0</span></div>
    <div class="lab-time" id="labtime"><i style="width:100%"></i></div>
    <div class="lab-q" id="labq" aria-live="polite"></div>
    <div class="lab-opts" id="labopts"></div>
    <div class="lab-flash" id="labflash"></div></section>`;
  $("#labquit").onclick = () => { labStop(); labOver(); };
  labNext();
  LAB.timer = setInterval(() => {
    LG.left--; const t = $("#labtime"); if (!t) { labStop(); return; }
    t.firstElementChild.style.width = (LG.left / 60 * 100) + "%"; t.classList.toggle("low", LG.left <= 10);
    if (LG.left <= 0) { labStop(); labOver(); }
  }, 1000);
}
function labOptions(it){
  const d = LG.d;
  if (d.opts) return d.opts.slice();
  if (d.options) return d.options(it);
  // wrong options come from the same side of the deck as the answer (names with names, dates with dates)
  const answers = [...new Set(LG.items.filter(x => x.pool === it.pool).map(x => x.a))].filter(a => a !== it.a);
  const pool = shuffle(answers).slice(0, 3);
  return shuffle([it.a].concat(pool));
}
function labNext(){
  if (LG.i >= LG.items.length) { LG.items = shuffle(LG.items); LG.i = 0; }
  const it = LG.items[LG.i], opts = labOptions(it);
  LG.cur = it; LG.lock = false;
  const q = $("#labq"); q.innerHTML = `<span class="lab-pop">${esc(it.p)}</span>`;
  const box = $("#labopts"); box.className = "lab-opts" + (opts.length === 3 ? " three" : "");
  box.innerHTML = opts.map(o => `<button type="button" data-o="${esc(o)}">${esc(o)}</button>`).join("");
  box.querySelectorAll("button").forEach(b => b.onclick = () => labPick(b));
}
function labPick(b){
  if (LG.lock) return; LG.lock = true;
  const it = LG.cur, ok = b.dataset.o === it.a;
  LG.tried++;
  if (ok) {
    LG.right++; LG.combo++; LG.maxc = Math.max(LG.maxc, LG.combo);
    const gain = 10 + Math.min(LG.combo - 1, 5) * 2;
    LG.score += gain; b.classList.add("ok");
    $("#labflash").textContent = it.note ? it.note : "+" + gain;
  } else {
    LG.combo = 0; b.classList.add("no");
    $("#labopts").querySelectorAll("button").forEach(x => { if (x.dataset.o === it.a) x.classList.add("ok"); });
    LG.miss.push(it); $("#labflash").textContent = (it.note ? it.note + " · " : "") + "Answer: " + it.a;
  }
  $("#labscore").textContent = LG.score;
  $("#labcombo").textContent = LG.combo >= 2 ? "🔥 ×" + LG.combo : "";
  LG.i++;
  setTimeout(() => { if (LAB.timer && $("#labopts")) labNext(); }, ok ? 450 : 1200);
}
function labOver(){
  const L = labS(), id = LG.d.id, best = !L.best[id] || LG.score > L.best[id];
  if (best && LG.score > 0) L.best[id] = LG.score;
  L.xp = (L.xp || 0) + LG.right; L.plays = (L.plays || 0) + 1; save();
  const acc = LG.tried ? Math.round(LG.right * 100 / LG.tried) : 0, seen = new Set();
  const miss = LG.miss.filter(m => { if (seen.has(m.p)) return false; seen.add(m.p); return true; });
  const { r } = labRank(L.xp);
  $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}
    <div class="block lab-res lab-pop"><span class="eyebrow">${esc(LG.d.title)}</span><div class="big">${LG.score}</div>
      <p>${best && LG.score > 0 ? "🎉 New best!" : "Best: " + (L.best[id] || 0)} · ${LG.right}/${LG.tried} right (${acc}%) · longest combo ${LG.maxc} · +${LG.right} XP</p>
      <p class="muted" style="margin:0">${r[2]} ${r[1]} · ${L.xp} XP</p>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn pri" type="button" id="again">Play again</button><button class="btn" type="button" data-lab-home>More games</button></div></div>
    ${miss.length ? `<div class="block"><h3>Fix these ${miss.length}</h3><div class="lab-miss">${miss.map(m => `<div><span>${esc(m.p)}</span><b>${esc(m.a)}</b></div>`).join("")}</div></div>` : (LG.tried ? `<div class="block"><p style="margin:0">💯 No mistakes — try to beat your score.</p></div>` : "")}
  </section>`;
  labBindHome();
  $("#again").onclick = () => labRun(id);
}

/* ---------- memory match ---------- */
function labMatch(){
  labStop();
  const all = LAB_CONF.decks.find(d => d.id === LAB_CONF.match.deck).pairs, n = {};
  all.forEach(p => { n[p[1]] = (n[p[1]] || 0) + 1; });
  const pairs = shuffle(all.filter(p => n[p[1]] === 1)).slice(0, 6);
  const cards = shuffle(pairs.flatMap((p, i) => [{ k: i, t: p[0] }, { k: i, t: p[1] }]));
  const M = { cards, up: [], done: new Set(), moves: 0, t0: Date.now() };
  const draw = () => {
    $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}
      <div class="lab-hud"><div><span class="eyebrow">Memory Match</span><h2 style="margin:4px 0 0">${esc(LAB_CONF.match.title)}</h2></div><span class="sc">${M.moves} moves</span></div>
      <div class="mm">${M.cards.map((c, i) => `<button type="button" data-i="${i}" class="${M.done.has(c.k) ? "done" : M.up.includes(i) ? "up" : ""}" aria-label="${M.done.has(c.k) || M.up.includes(i) ? esc(c.t) : "Hidden card " + (i + 1)}">${M.done.has(c.k) || M.up.includes(i) ? esc(c.t) : "?"}</button>`).join("")}</div></section>`;
    labBindHome();
    $("#app").querySelectorAll(".mm button").forEach(b => b.onclick = () => flip(+b.dataset.i));
  };
  const flip = i => {
    if (M.up.length === 2 || M.up.includes(i) || M.done.has(M.cards[i].k)) return;
    M.up.push(i); draw();
    if (M.up.length === 2) {
      M.moves++;
      const [a, b] = M.up;
      if (M.cards[a].k === M.cards[b].k) { M.done.add(M.cards[a].k); M.up = []; setTimeout(() => { draw(); if (M.done.size === 6) done(); }, 250); }
      else setTimeout(() => { M.up = []; draw(); }, 900);
    }
  };
  const done = () => {
    const L = labS(), best = !L.match || M.moves < L.match; if (best) L.match = M.moves;
    L.xp = (L.xp || 0) + 12; L.plays = (L.plays || 0) + 1; save();
    $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}<div class="block lab-res lab-pop"><span class="eyebrow">Memory Match</span><div class="big">${M.moves}</div>
      <p>moves · ${Math.round((Date.now() - M.t0) / 1000)} s · ${best ? "🎉 New best!" : "Best: " + L.match + " moves"} · +12 XP</p>
      <div class="lab-pairs" style="text-align:left">${pairs.map(p => `<div><span>${esc(p[0])}</span><b>${esc(p[1])}</b></div>`).join("")}</div>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn pri" type="button" id="again">New cards</button><button class="btn" type="button" data-lab-home>More games</button></div></div></section>`;
    labBindHome(); $("#again").onclick = labMatch;
  };
  draw(); window.scrollTo(0, 0);
}


/* ---------- decks from the lessons' own tables ---------- */
/** Rows of a lesson's n-th table as [prompt, answer, note] (tags stripped), so a deck never repeats the data. */
function labRows(lessonId, n){
  const strip = s => String(s == null ? "" : s).replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&minus;/g, "−").trim();
  const l = LESSONS.find(x => x.id === lessonId), t = l ? l.blocks.filter(b => b.k === "table")[n || 0] : null;
  return t ? t.rows.map(r => [strip(r[0]), strip(r[1]), strip(r[2])]) : [];
}
/** A "grand mix" deck: a few rows from every listed deck, with each deck's own question wording. */
function labMix(decks){
  return shuffle(decks.flatMap(d => d.pairs.map(p => ({ p: d.q ? `${d.q} ${p[0]}${/[?:]$/.test(d.q) ? "" : "?"}` : p[0], a: p[1], note: p[2] || "", pool: d.id })))).slice(0, 80);
}

<script>
"use strict";
/* ============================================================
   Workbook engine — shared by the History and Computer Knowledge pages (tools/workbook/lib.js puts it in each one).
   APP.mode "era": a subject app with its own lessons and questions (Learn · Practice · Mock · Revise · Plan).
   APP.mode "hub": start here, a plan across a family of apps, and revision across all of them (no questions of its own).
   Optional data: APP.hub (a family hub to link to), HEATMAP (where the marks come from, by exam),
   a question's 8th field (the paper it was reported from), APP.tabs (the tabs, in order) — a tab the engine
   does not know (e.g. Chemistry's "lab") is drawn by the page's own script: render<Tab>() and, when you
   leave it, leave<Tab>().
   ============================================================ */
const HUB = APP.mode === "hub";
const EMBED = (() => { try { return window.parent !== window; } catch(e) { return true; } })();
const TABS = HUB ? ["start","plan","revise"] : (APP.tabs || ["learn","practice","mock","revise","plan"]);

/* ============================================================
   HELPERS & STATE
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hash = s => { let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5)+h + s.charCodeAt(i))|0; return "q"+(h>>>0).toString(36); };
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; };
const L = id => LESSONS.find(l => l.id === id);
const LNUM = id => LESSONS.findIndex(l => l.id === id) + 1;
const G = id => GROUPS.find(g => g.id === id) || GROUPS[0];
const A = id => APP.apps.find(a => a.id === id);
const appOf = id => (L(id) && L(id).app) || APP.id;       // in the hub, each lesson carries the app it lives in

const QS = QB.map(r => {
  const fixed = !!r[6];
  return { t:r[0], q:r[1], o:r[2], e:r[3], p:(r[4]||"").includes("p"), a: fixed ? (r[5]||0) : 0, fixed, id:hash(r[1]), src: r[7] || "" };
});
const byLesson = id => QS.filter(q => q.t === id);
const makePerm = q => q.fixed ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i));
const qCount = id => HUB ? null : byLesson(id).length;
const pCount = id => HUB ? ((APP.pcount||{})[id] || 0) : byLesson(id).filter(q=>q.p).length;

const KEY = APP.key;
let S = { ans:{}, bm:{}, les:{}, mocks:[], plan:null };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const record = (q, ok) => { S.ans[q.id] = ok ? 1 : 0; save(); renderTop(); };

/* Another History app's saved progress. Every page is on the same site, so the hub (and a
   plan) can see which lessons you have read and quizzed in the subject apps. */
function appState(a){ try { return JSON.parse(localStorage.getItem(a.key) || "{}") || {}; } catch(e) { return {}; } }
function lessonState(id){
  const owner = appOf(id);
  if (owner === APP.id) return S.les[id] || {};
  const a = A(owner); return a ? ((appState(a).les || {})[id] || {}) : {};
}
const lesDone = l => !!lessonState(l.id).done;
const heatDots = n => `<span class="dots" aria-label="Asked ${n===3?"almost every shift":n===2?"often":"now and then"}">${[1,2,3].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>`;

/* Open a lesson or a tab, here or in the History app it lives in. Inside पाठShala the
   app is asked to switch (so your session is tracked); on its own the page just navigates. */
function openApp(appId, lesson, tab){
  if (appId === APP.id) {
    if (lesson) openLesson(lesson, "learn"); else go(tab || TABS[0]);
    return;
  }
  const a = APP.hub && appId === APP.hub.id ? APP.hub : A(appId);
  if (!a) return;
  const here = () => { location.href = a.file + (lesson ? "?lesson=" + encodeURIComponent(lesson) : "") + (tab ? "#" + tab : ""); };
  if (!EMBED) return here();
  let ok = false;
  const onAck = e => { if (e.origin === location.origin && e.data && e.data.type === "shabd-open-ok") ok = true; };
  window.addEventListener("message", onAck);
  try { window.parent.postMessage({ type:"shabd-open", mod:a.id, lesson: lesson || null, tab: tab || null }, location.origin); } catch(e) {}
  setTimeout(() => { window.removeEventListener("message", onAck); if (!ok) here(); }, 700);
}
const hubLink = (before, label, tab, after) => APP.hub ? before + goLink(label, APP.hub.id, null, tab) + (after || "") : "";
const goLink = (label, appId, lesson, tab) => `<button type="button" class="golink" data-go="${esc(JSON.stringify([appId, lesson||null, tab||null]))}">${label}</button>`;
function bindGo(root){
  root.querySelectorAll("[data-go]").forEach(b => b.onclick = ev => { ev.stopPropagation(); const g = JSON.parse(b.dataset.go); openApp(g[0], g[1], g[2]); });
}

function renderTop(){
  if (HUB) {
    const done = LESSONS.filter(lesDone).length;
    $("#topstat").innerHTML = `<b>${done}</b>/${LESSONS.length} lessons<br>in ${APP.apps.length} apps`;
    return;
  }
  const ids = Object.keys(S.ans).filter(k => QS.some(q => q.id === k));
  const right = ids.filter(k => S.ans[k] === 1).length;
  const pct = ids.length ? Math.round(right*100/ids.length) : 0;
  $("#topstat").innerHTML = `<b>${ids.length}</b>/${QS.length} tried<br><b>${pct}%</b> right now`;
}

/* ============================================================
   ROUTING
   ============================================================ */
let TAB = TABS[0];
let timerId = null;
function go(tab){
  if (!TABS.includes(tab)) tab = TABS[0];
  const own = t => t.charAt(0).toUpperCase() + t.slice(1);
  if (TAB !== tab && typeof window["leave" + own(TAB)] === "function") window["leave" + own(TAB)]();
  TAB = tab;
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.tab===tab ? "page" : "false"));
  if (tab === "start") renderStart();
  if (tab === "learn") renderLearn();
  if (tab === "practice") renderPractice();
  if (tab === "mock") renderMock();
  if (tab === "revise") renderRevise();
  if (tab === "plan") renderPlan();
  if (!["start","learn","practice","mock","revise","plan"].includes(tab) && typeof window["render" + own(tab)] === "function") window["render" + own(tab)]();
  window.scrollTo(0,0);
  try { history.replaceState(null, "", location.pathname + location.search + "#" + tab); } catch(e) {}
}
document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => {
  if (TAB === "mock" && M && M.running && b.dataset.tab !== "mock") { go("mock"); showMockLeave(b.dataset.tab); return; }
  go(b.dataset.tab);
}));

/* ============================================================
   START HERE (hub)
   ============================================================ */
function renderStart(){
  const done = LESSONS.filter(lesDone).length;
  const cards = APP.apps.map(a => {
    const ls = LESSONS.filter(l => l.app === a.id), d = ls.filter(lesDone).length, it = INTROS[a.id] || {};
    return `<button type="button" class="appc" data-go="${esc(JSON.stringify([a.id,null,null]))}">
      <div class="hd"><span class="ic" aria-hidden="true">${a.ico}</span><span><b>${esc(a.title)}</b><small>${esc(a.hi)}</small></span><span class="go">Open ›</span></div>
      ${it.lead ? `<p>${esc(it.lead)}</p>` : ""}
      <div class="meter"><i style="width:${ls.length ? d/ls.length*100 : 0}%"></i></div>
      <span class="meta">${d}/${ls.length} lessons done · ${(APP.qcount||{})[a.id] || 0} questions</span></button>`;
  }).join("");
  const tips = APP.apps.filter(a => INTROS[a.id]).map(a => `<div><dt>${esc(a.title)}</dt><dd>${esc(INTROS[a.id].tip)} ${esc(INTROS[a.id].order)}</dd></div>`).join("");
  $("#app").innerHTML = `<section class="view stack">
    <div class="hero">
      <span class="eyebrow">New to history? Start here</span>

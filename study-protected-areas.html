{"id":"P1","heat":2,"title":"Protected areas: laws, types and projects","hi":"संरक्षित क्षेत्र: क़ानून, प्रकार और परियोजनाएँ","blocks":[{"k":"hot","h":"Asked again and again: the <b>year of each Act and Project<\/b> (Wildlife Act 1972, Project Tiger 1973, Project Elephant 1992), <b>national park vs sanctuary<\/b>, India's <b>first national park<\/b> (Hailey/Corbett, 1936) and the <b>counts<\/b> of each kind."},{"k":"story","h":"<p>Indian wildlife law begins with the <b>Wildlife (Protection) Act, 1972<\/b>. It lets states declare two main kinds of protected area. A <b>national park<\/b> is the strictest: no grazing, no private rights, and its boundary can be changed only by the state legislature. A <b>wildlife sanctuary<\/b> is looser: some human activity is allowed if it doesn't harm wildlife. In 2002 the Act added <b>conservation reserves<\/b> and <b>community reserves<\/b>.<\/p><p>Big species got their own missions: <b>Project Tiger<\/b> (1973), crocodiles (1975), <b>Project Elephant<\/b> (1992), snow leopards (2009), dolphins (2020) and <b>Project Cheetah<\/b> (2022). India's oldest park is <b>Jim Corbett<\/b>, set up as Hailey National Park in <b>1936<\/b>.<\/p>","key":"National park = strictest; sanctuary = some activity allowed; first park Hailey (Corbett) 1936; Wildlife Act 1972."},{"k":"facts","title":"India's protected areas (approximate, as of 2025–26)","rows":[["National parks","About 106 — largest Hemis (Ladakh), smallest South Button Island (Andaman)"],["Wildlife sanctuaries","About 570+ — largest the Indian Wild Ass Sanctuary (Gujarat)"],["Tiger reserves","58 — the latest Madhav (MP, March 2025)"],["Biosphere reserves","18 — 13 of them in UNESCO's world network"],["Ramsar sites","98 as of January 2026; about 100 reported by mid-2026"],["UNESCO World Heritage sites","45 as of 2026 (Sarnath the 45th, July 2026)"],["Most national parks","Madhya Pradesh and Andaman & Nicobar Islands"],["Protected area share","About 5–6% of India's land"]]},{"k":"table","title":"Laws and projects by year","head":["Law / project","Year","Note"],"rows":[["Wildlife (Protection) Act","1972","Gives legal protection to national parks, sanctuaries and listed species; Schedules rationalised to four in 2022."],["Project Tiger","1973","Launched on 1 April 1973 at Jim Corbett National Park with 9 reserves."],["Crocodile Conservation Project","1975","Started in Odisha with help from the UNDP and FAO."],["Forest (Conservation) Act","1980","Renamed the Van (Sanrakshan Evam Samvardhan) Adhiniyam in 2023."],["Environment (Protection) Act","1986","Passed after the Bhopal gas tragedy (1984)."],["Project Elephant","1992","For elephants, their habitats and corridors."],["Biological Diversity Act","2002","Set up the National Biodiversity Authority (Chennai)."],["Scheduled Tribes and Other Traditional Forest Dwellers (Forest Rights) Act","2006",""],["Project Snow Leopard","2009","Covers the Himalayan states and Ladakh."],["Project Dolphin","2020","Announced on Independence Day 2020; the Gangetic dolphin is India's national aquatic animal."],["Project Cheetah","2022","Cheetahs from Namibia released at Kuno on 17 September 2022."],["First national park — Hailey (now Jim Corbett)","1936","Set up in the United Provinces, now Uttarakhand."],["International Big Cat Alliance","2023","Launched in April 2023 for seven big cats; HQ in India."]]},{"k":"table","title":"National park vs wildlife sanctuary","head":["","National park","Wildlife sanctuary"],"rows":[["Human activity","Not allowed (no grazing, no private rights)","Some allowed if it doesn't harm wildlife"],["Who declares","State or Centre","State or Centre"],["Changing the boundary","Only by the state legislature","Needs the State Board for Wildlife's advice"],["Protects","A whole ecosystem","Mostly a particular species"]]},{"k":"trick","h":"Years in a chain: <b>72 Act → 73 Tiger → 75 Croc → 80 Forest → 86 Environment → 92 Elephant → 2002 Biodiversity<\/b>. Think <b>“Tigers Come First, Elephants Behind”<\/b>."},{"k":"trap","h":"The <b>Wildlife Act is 1972<\/b> — the <b>Environment Act is 1986<\/b> (after Bhopal). India's <b>first marine national park<\/b> is in the <b>Gulf of Kutch<\/b>, not the Gulf of Mannar."}],"sum":["The Wildlife (Protection) Act, 1972 creates national parks and sanctuaries; conservation and community reserves were added in 2002.","National parks are the strictest; sanctuaries allow some activity.","India's first national park: Hailey (now Jim Corbett), 1936, Uttarakhand.","Project Tiger 1973, Crocodile 1975, Elephant 1992, Snow Leopard 2009, Dolphin 2020, Cheetah 2022.","About 106 national parks, about 570+ sanctuaries, 58 tiger reserves, 18 biosphere reserves (as of 2025–26)."],"part":["Part 1 · Parks and sanctuaries","राष्ट्रीय उद्यान और अभयारण्य"],"g":"pa"},
{"id":"P2","heat":3,"title":"National parks and their states","hi":"राष्ट्रीय उद्यान और राज्य","blocks":[{"k":"hot","h":"The most common question in this whole app: <b>“X National Park is in which state?”<\/b> Learn the famous ones with their animal — Kaziranga (rhino, Assam), Gir (lion, Gujarat), Keibul Lamjao (floating, Manipur), Hemis (largest, Ladakh)."},{"k":"story","h":"<p>Think of a journey around India. In the north, <b>Hemis<\/b> in Ladakh is the largest park, home to the snow leopard; <b>Dachigam<\/b> near Srinagar shelters the last hangul. In Uttarakhand, <b>Jim Corbett<\/b> was the first park, and <b>Valley of Flowers<\/b> and <b>Nanda Devi<\/b> are UNESCO sites.<\/p><p>In the east, <b>Kaziranga<\/b> and <b>Manas<\/b> (Assam) guard rhinos; <b>Keibul Lamjao<\/b> floats on Loktak Lake in Manipur. The heart of India — <b>Madhya Pradesh<\/b> — has Kanha, Bandhavgarh, Panna, Satpura and <b>Kuno<\/b> (cheetahs). In the south, Kerala has <b>Silent Valley<\/b>, <b>Eravikulam<\/b> and <b>Periyar<\/b>; Gujarat has <b>Gir<\/b> for lions and India's first <b>marine park<\/b>.<\/p>","key":"Link park + animal + state: Kaziranga–rhino–Assam; Gir–lion–Gujarat; Hemis–snow leopard–Ladakh; Keibul Lamjao–sangai–Manipur."},{"k":"table","title":"National parks","head":["Park","State / UT","Remember"],"rows":[["Jim Corbett","Uttarakhand","India's first national park (1936, as Hailey National Park)."],["Kaziranga","Assam","Home of the one-horned rhinoceros; UNESCO site."],["Ranthambore","Rajasthan","Famous for tigers among old fort ruins."],["Gir","Gujarat","The only wild home of the Asiatic lion."],["Kanha","Madhya Pradesh","Saved the barasingha; inspired The Jungle Book."],["Bandhavgarh","Madhya Pradesh","Highest density of tigers in India."],["Kuno","Madhya Pradesh","Cheetahs reintroduced here in 2022."],["Panna","Madhya Pradesh","Known for diamonds and the Ken river."],["Satpura","Madhya Pradesh",""],["Sundarbans","West Bengal","Largest mangrove forest; Royal Bengal tiger."],["Keibul Lamjao","Manipur","The only floating national park — on Loktak Lake; home of the sangai."],["Silent Valley","Kerala","Lion-tailed macaque; saved from a dam in the 1980s."],["Eravikulam","Kerala","Nilgiri tahr; Neelakurinji blooms every 12 years."],["Periyar","Kerala","Elephants and tigers around Periyar lake."],["Bandipur","Karnataka",""],["Nagarhole (Rajiv Gandhi)","Karnataka",""],["Kudremukh","Karnataka",""],["Dachigam","Jammu and Kashmir","Last home of the hangul (Kashmir stag)."],["Hemis","Ladakh","India's largest national park; snow leopards."],["Great Himalayan","Himachal Pradesh","UNESCO World Heritage site (2014)."],["Pin Valley","Himachal Pradesh","Cold desert park in Lahaul and Spiti."],["Valley of Flowers","Uttarakhand","UNESCO site, with Nanda Devi."],["Rajaji","Uttarakhand",""],["Gangotri","Uttarakhand",""],["Namdapha","Arunachal Pradesh","Has all four big cats: tiger, leopard, clouded leopard, snow leopard."],["Mouling","Arunachal Pradesh",""],["Manas","Assam","UNESCO site; pygmy hog and golden langur."],["Nameri","Assam",""],["Dibru-Saikhowa","Assam","Feral horses."],["Dudhwa","Uttar Pradesh","Swamp deer; rhinos reintroduced in 1984."],["Simlipal","Odisha","Melanistic (black) tigers."],["Bhitarkanika","Odisha","Mangroves and saltwater crocodiles."],["Sanjay Gandhi (Borivali)","Maharashtra","Inside the city of Mumbai."],["Tadoba","Maharashtra","Maharashtra's oldest national park."],["Desert","Rajasthan","Great Indian bustard; near Jaisalmer."],["Keoladeo (Bharatpur)","Rajasthan","Bird paradise; UNESCO site."],["Betla","Jharkhand",""],["Valmiki","Bihar","Bihar's only national park."],["Khangchendzonga","Sikkim","India's first 'mixed' UNESCO site (2016)."],["Guindy","Tamil Nadu","Inside the city of Chennai."],["Mudumalai","Tamil Nadu",""],["Gulf of Mannar Marine","Tamil Nadu","Coral reefs and dugongs."],["Marine National Park, Gulf of Kutch","Gujarat","India's first marine national park (1982)."],["Velavadar (Blackbuck)","Gujarat",""],["Mahatma Gandhi Marine (Wandoor)","Andaman and Nicobar Islands",""],["Indravati","Chhattisgarh","Wild water buffalo."],["Kanger Valley","Chhattisgarh","Limestone caves."],["Sultanpur","Haryana","Bird park near Gurugram."],["Kasu Brahmananda Reddy","Telangana","Inside Hyderabad."],["Papikonda","Andhra Pradesh",""],["Balphakram","Meghalaya",""],["Murlen","Mizoram",""],["Clouded Leopard","Tripura",""],["Neora Valley","West Bengal","Red pandas."],["Bhagwan Mahavir (Mollem)","Goa",""]]},{"k":"trick","h":"<b>“Silent Eravi Periyar”<\/b> — three Kerala parks. <b>“KBP-SK”<\/b> — Kanha, Bandhavgarh, Panna, Satpura, Kuno — all Madhya Pradesh, the 'Tiger State'."},{"k":"trap","h":"<b>Sanjay Gandhi NP<\/b> is in Mumbai (Maharashtra), not Delhi. <b>Rajiv Gandhi NP<\/b> is Nagarhole (Karnataka). <b>Dudhwa<\/b> is in UP, not Uttarakhand. <b>Valmiki<\/b> is in Bihar."}],"sum":["Jim Corbett (Uttarakhand) — first; Hemis (Ladakh) — largest.","Kaziranga and Manas — Assam; Keibul Lamjao — Manipur (floating).","Kanha, Bandhavgarh, Panna, Satpura, Kuno — Madhya Pradesh.","Silent Valley, Eravikulam, Periyar — Kerala; Bandipur, Nagarhole — Karnataka.","Gir and Marine NP (Gulf of Kutch) — Gujarat; Ranthambore, Desert, Keoladeo — Rajasthan."],"part":["Part 1 · Parks and sanctuaries","राष्ट्रीय उद्यान और अभयारण्य"],"g":"pa"},
{"id":"P3","heat":2,"title":"Wildlife sanctuaries","hi":"वन्यजीव अभयारण्य","blocks":[{"k":"hot","h":"Sanctuary questions usually pair a <b>famous animal<\/b> with a sanctuary: wild ass (Little Rann of Kutch), Olive Ridley turtles (Gahirmatha), hoolock gibbon (Hollongapar), giant squirrel (Bhimashankar), sloth bear (Daroji)."},{"k":"story","h":"<p>Sanctuaries often exist to protect one special animal. On the salt flats of Gujarat, the <b>Indian Wild Ass Sanctuary<\/b> — India's largest — keeps the khur alive. Each winter, lakhs of <b>Olive Ridley<\/b> turtles crawl ashore at <b>Gahirmatha<\/b> in Odisha. In Assam's <b>Hollongapar<\/b> forest you hear India's only ape, the hoolock gibbon, and at <b>Pobitora<\/b> rhinos live more densely than anywhere on Earth.<\/p><p>In Maharashtra, <b>Bhimashankar<\/b> is the home of the giant squirrel (shekru), Maharashtra's state animal. <b>Gandhi Sagar<\/b> in Madhya Pradesh became the second home of India's cheetahs in 2025.<\/p>","key":"Wild ass — Little Rann (Gujarat); Olive Ridley — Gahirmatha (Odisha); gibbon — Hollongapar (Assam); giant squirrel — Bhimashankar (Maharashtra)."},{"k":"table","title":"Wildlife sanctuaries","head":["Sanctuary","State / UT","Remember"],"rows":[["Pakhui (Pakke)","Arunachal Pradesh","Hornbills; now a tiger reserve."],["Sariska","Rajasthan","Tigers were wiped out by 2005 and brought back in 2008."],["Kumbhalgarh","Rajasthan",""],["Mount Abu","Rajasthan",""],["Tal Chhapar","Rajasthan","Blackbuck."],["Indian Wild Ass Sanctuary (Little Rann of Kutch)","Gujarat","India's largest wildlife sanctuary."],["Jessore Sloth Bear","Gujarat",""],["Pobitora","Assam","Highest density of one-horned rhinos in the world."],["Chakrashila","Assam","Golden langur."],["Hollongapar Gibbon","Assam","India's only ape — the hoolock gibbon."],["Chinnar","Kerala",""],["Thattekad (Salim Ali Bird Sanctuary)","Kerala","Kerala's first bird sanctuary."],["Neyyar","Kerala",""],["Bhimashankar","Maharashtra","Indian giant squirrel (shekru)."],["Great Indian Bustard (Nannaj)","Maharashtra",""],["Koyna","Maharashtra",""],["Dalma","Jharkhand","Elephants; near Jamshedpur."],["Hazaribagh","Jharkhand",""],["Kaimur","Bihar","Bihar's largest sanctuary."],["Coringa","Andhra Pradesh","Mangroves of the Godavari delta."],["Pocharam","Telangana",""],["Eturnagaram","Telangana",""],["Chandra Prabha","Uttar Pradesh","Where Asiatic lions were tried out in the 1950s."],["Sohagi Barwa","Uttar Pradesh",""],["Okhla Bird Sanctuary","Uttar Pradesh",""],["Asola Bhatti","Delhi",""],["Binsar","Uttarakhand",""],["Askot","Uttarakhand","Musk deer."],["Gahirmatha Marine","Odisha","World's largest nesting beach of Olive Ridley turtles."],["Debrigarh","Odisha","On the Hirakud reservoir."],["Daroji Bear","Karnataka","Sloth bears near Hampi."],["Dandeli","Karnataka",""],["Mahananda","West Bengal",""],["Barnawapara","Chhattisgarh",""],["Fambong Lho","Sikkim",""],["Changthang Cold Desert","Ladakh","Highest wildlife sanctuary in India."],["Karakoram (Nubra Shyok)","Ladakh",""],["Overa-Aru","Jammu and Kashmir",""],["Gandhi Sagar","Madhya Pradesh","India's second home for cheetahs (2025)."],["National Chambal","Madhya Pradesh, Rajasthan and Uttar Pradesh","Gharials and Gangetic dolphins on the Chambal river."],["Cotigao","Goa",""],["Shikari Devi","Himachal Pradesh",""],["Nongkhyllem","Meghalaya",""],["Sepahijala","Tripura","Spectacled monkey (Phayre's leaf monkey)."],["Yangoupokpi-Lokchao","Manipur",""],["Fakim","Nagaland",""],["Kyongnosla Alpine","Sikkim",""]]},{"k":"trick","h":"<b>“Pobitora = Plenty of rhinos”<\/b> (highest density). <b>“Gahirmatha = Gathering of turtles”<\/b>."},{"k":"trap","h":"<b>Sariska<\/b> and <b>Pakke<\/b> started as sanctuaries and are now tiger reserves too. The <b>National Chambal Sanctuary<\/b> spans three states — MP, Rajasthan and UP."}],"sum":["Indian Wild Ass Sanctuary (Little Rann of Kutch, Gujarat) is India's largest sanctuary.","Gahirmatha (Odisha) — Olive Ridley turtles; Pobitora (Assam) — densest {"id":"P4","heat":3,"title":"Tiger reserves and Project Tiger","hi":"बाघ अभयारण्य और प्रोजेक्ट टाइगर","blocks":[{"k":"hot","h":"Always asked: <b>Project Tiger 1973<\/b>, the <b>number of tiger reserves (58)<\/b> and the <b>newest<\/b> ones, the <b>largest<\/b> (Nagarjunasagar-Srisailam) and <b>smallest<\/b> (Bor), and the state with the most tigers (Madhya Pradesh)."},{"k":"story","h":"<p>In 1973 India had fewer than 2,000 tigers left. <b>Project Tiger<\/b> began on 1 April 1973 at Jim Corbett with <b>nine<\/b> reserves. In 2005 the <b>National Tiger Conservation Authority (NTCA)<\/b> was set up to run it. The tiger census held every four years counted at least <b>3,167<\/b> tigers in 2022 (estimated <b>3,682<\/b>) — about three-quarters of the world's wild tigers.<\/p><p>New reserves keep coming: <b>Srivilliputhur-Megamalai<\/b> (51st, TN, 2021), <b>Ramgarh Vishdhari<\/b> (52nd, Rajasthan), <b>Ranipur<\/b> (53rd, UP), <b>Dholpur-Karauli<\/b> (54th), <b>Veerangana Durgavati<\/b> (55th, MP), <b>Guru Ghasidas–Tamor Pingla<\/b> (56th, Chhattisgarh), <b>Ratapani<\/b> (57th, MP) and <b>Madhav<\/b> (58th, MP, March 2025). Madhya Pradesh now has 9 — the most.<\/p>","key":"Project Tiger 1973; NTCA 2005; 58 reserves; largest Nagarjunasagar-Srisailam, smallest Bor; 2022 census 3,682 (estimate)."},{"k":"facts","title":"Tiger numbers (2022 census, released 2023)","rows":[["India's tigers","3,682 (estimate); 3,167 counted"],["Most tigers","Madhya Pradesh (785), then Karnataka (563) and Uttarakhand (560)"],["Reserve with most tigers","Corbett"],["Most tiger reserves","Madhya Pradesh — 9"],["Largest reserve","Nagarjunasagar-Srisailam (Andhra Pradesh)"],["Smallest reserve","Bor (Maharashtra)"],["Run by","National Tiger Conservation Authority (NTCA), set up 2005"],["International Tiger Day","29 July — agreed at the St Petersburg summit, 2010"]]},{"k":"table","title":"Tiger reserves","head":["Reserve","State","Remember"],"rows":[["Nagarjunasagar-Srisailam","Andhra Pradesh","India's largest tiger reserve."],["Bor","Maharashtra","India's smallest tiger reserve."],["Corbett","Uttarakhand","The most tigers of any reserve (2022 census)."],["Mukundra Hills","Rajasthan",""],["Ramgarh Vishdhari","Rajasthan","India's 52nd tiger reserve (2022)."],["Dholpur-Karauli","Rajasthan","India's 54th tiger reserve (2023)."],["Sunderbans","West Bengal",""],["Buxa","West Bengal",""],["Palamau","Jharkhand","One of the first nine (1973); first-ever tiger census by pugmarks (1932)."],["Satkosia","Odisha",""],["Pilibhit","Uttar Pradesh","Won the first TX2 award (2020) for doubling tigers."],["Amangarh","Uttar Pradesh",""],["Ranipur","Uttar Pradesh","India's 53rd tiger reserve (2022)."],["Orang","Assam",""],["Kamlang","Arunachal Pradesh",""],["Dampa","Mizoram",""],["Parambikulam","Kerala",""],["Bhadra","Karnataka",""],["Kali (Dandeli-Anshi)","Karnataka",""],["Anamalai","Tamil Nadu",""],["Kalakad-Mundanthurai","Tamil Nadu",""],["Sathyamangalam","Tamil Nadu",""],["Srivilliputhur-Megamalai","Tamil Nadu","India's 51st tiger reserve (2021)."],["Kawal","Telangana",""],["Amrabad","Telangana",""],["Achanakmar","Chhattisgarh",""],["Udanti-Sitanadi","Chhattisgarh",""],["Guru Ghasidas–Tamor Pingla","Chhattisgarh","India's 56th tiger reserve (November 2024)."],["Melghat","Maharashtra","One of the first nine (1973)."],["Sahyadri","Maharashtra",""],["Navegaon-Nagzira","Maharashtra",""],["Sanjay-Dubri","Madhya Pradesh",""],["Veerangana Durgavati","Madhya Pradesh","India's 55th tiger reserve (2023)."],["Ratapani","Madhya Pradesh","India's 57th tiger reserve (December 2024), near Bhopal."],["Madhav","Madhya Pradesh","India's 58th tiger reserve (March 2025), Shivpuri."]]},{"k":"trick","h":"The newest four, in order — <b>“Very Good Rats Munch”<\/b>: <b>V<\/b>eerangana Durgavati (55), <b>G<\/b>uru Ghasidas (56), <b>R<\/b>atapani (57), <b>M<\/b>adhav (58)."},{"k":"trap","h":"Most <b>tigers<\/b> = Madhya Pradesh, but the single reserve with the most tigers is <b>Corbett<\/b> (Uttarakhand). The <b>largest<\/b> reserve is in <b>Andhra Pradesh<\/b>, not MP."}],"sum":["Project Tiger began 1 April 1973 at Jim Corbett with nine reserves; NTCA set up in 2005.","India has 58 tiger reserves (as of March 2025); Madhya Pradesh has the most (9).","Latest: Ratapani (57th, Dec 2024) and Madhav (58th, Mar 2025), both in MP.","Largest: Nagarjunasagar-Srisailam (AP); smallest: Bor (Maharashtra).","2022 census: 3,682 tigers (estimate); MP has the most tigers, Corbett the most of any reserve."],"part":["Part 1 · Parks and sanctuaries","राष्ट्रीय उद्यान और अभयारण्य"],"g":"pa"},
{"id":"P5","heat":3,"title":"Biosphere reserves","hi":"जैवमंडल आरक्षित क्षेत्र","blocks":[{"k":"hot","h":"Know the <b>18 biosphere reserves<\/b> with their states, the <b>first<\/b> (Nilgiri, 1986), the <b>largest<\/b> (Great Rann of Kutch) and <b>smallest<\/b> (Dibru-Saikhowa), and the <b>13 in UNESCO's list<\/b> — the newest, <b>Cold Desert<\/b>, joined in September 2025."},{"k":"story","h":"<p>A biosphere reserve protects a whole landscape <i>and<\/i> the people living in it. It has three rings: a strictly protected <b>core<\/b>, a <b>buffer<\/b> for research and education, and a <b>transition<\/b> zone where villages and farms carry on. The idea comes from UNESCO's <b>Man and the Biosphere (MAB)<\/b> programme, started in <b>1971<\/b>.<\/p><p>India's first was <b>Nilgiri<\/b> (1986), spread over Tamil Nadu, Kerala and Karnataka. Today there are <b>18<\/b>, the last being <b>Panna<\/b> (2011). <b>13<\/b> are in UNESCO's World Network — <b>Cold Desert<\/b> in Himachal Pradesh became the 13th in September 2025. Manas, Dibru-Saikhowa, Dihang-Dibang, Great Rann of Kutch and Seshachalam are not yet in it.<\/p>","key":"18 biosphere reserves; first Nilgiri 1986; 13 in UNESCO (latest Cold Desert 2025); largest Great Rann of Kutch; smallest Dibru-Saikhowa."},{"k":"table","title":"The 18 biosphere reserves","head":["Reserve","State(s)","Year / UNESCO"],"rows":[["Nilgiri","Tamil Nadu, Kerala and Karnataka","India's first (1986); UNESCO 2000."],["Nanda Devi","Uttarakhand","1988; UNESCO 2004."],["Nokrek","Meghalaya","1988; UNESCO 2009."],["Great Nicobar","Andaman and Nicobar Islands","1989; UNESCO 2013."],["Gulf of Mannar","Tamil Nadu","1989; UNESCO 2001 — India's first marine biosphere reserve."],["Manas","Assam","1989; not in the UNESCO list."],["Sundarban","West Bengal","1989; UNESCO 2001."],["Simlipal","Odisha","1994; UNESCO 2009."],["Dibru-Saikhowa","Assam","1997; India's smallest biosphere reserve."],["Dihang-Dibang","Arunachal Pradesh","1998."],["Pachmarhi","Madhya Pradesh","1999; UNESCO 2009."],["Khangchendzonga","Sikkim","2000; UNESCO 2018."],["Agasthyamalai","Kerala and Tamil Nadu","2001; UNESCO 2016."],["Achanakmar-Amarkantak","Madhya Pradesh and Chhattisgarh","2005; UNESCO 2012."],["Great Rann of Kutch","Gujarat","2008; India's largest biosphere reserve."],["Cold Desert","Himachal Pradesh","2009 (16th); UNESCO September 2025 — the 13th Indian site in the list."],["Seshachalam","Andhra Pradesh","2010."],["Panna","Madhya Pradesh","2011 (18th); UNESCO 2020."]]},{"k":"mapfig","title":"The 18 biosphere reserves on the map","pins":[["1",76.6,11.5,"Nilgiri — Tamil Nadu, Kerala and Karnataka","n"],["2",79.8,30.4,"Nanda Devi — Uttarakhand","n"],["3",90.3,25.68,"Nokrek — Meghalaya","n"],["4",93.8,7,"Great Nicobar — Andaman and Nicobar Islands","n"],["5",79,9.15,"Gulf of Mannar — Tamil Nadu","n"],["6",91,26.7,"Manas — Assam","n"],["7",88.9,21.95,"Sundarban — West Bengal","n"],["8",86.4,21.8,"Simlipal — Odisha","n"],["9",95.4,27.6,"Dibru-Saikhowa — Assam","n"],["10",95.5,28.6,"Dihang-Dibang — Arunachal Pradesh","n"],["11",78.43,22.47,"Pachmarhi — Madhya Pradesh","n"],["12",88.3,27.65,"Khangchendzonga — Sikkim","n"],["13",77.25,8.6,"Agasthyamalai — Kerala and Tamil Nadu","n"],["14",81.8,22.6,"Achanakmar-Amarkantak — Madhya Pradesh and Chhattisgarh","n"],["15",70,23.9,"Great Rann of Kutch — Gujarat","n"],["16",77.8,32.3,"Cold Desert — Himachal Pradesh","n"],["17",79.3,13.7,"Seshachalam — Andhra Pradesh","n"],["18",80,24.7,"Panna — Madhya Pradesh","n"]],"facts":[["1 · Nilgiri","Tamil Nadu, Kerala and Karnataka — India's first (1986); UNESCO 2000"],["2 · Nanda Devi","Uttarakhand — 1988; UNESCO 2004"],["3 · Nokrek","Meghalaya — 1988; UNESCO 2009"],["4 · Great Nicobar","Andaman and Nicobar Islands — 1989; UNESCO 2013"],["5 · Gulf of Mannar","Tamil Nadu — 1989; UNESCO 2001 — India's first marine biosphere reserve"],["6 · Manas","Assam — 1989; not in the UNESCO list"],["7 · Sundarban","West Bengal — 1989; UNESCO 2001"],["8 · Simlipal","Odisha — 1994; UNESCO 2009"],["9 · Dibru-Saikhowa","Assam — 1997; India's smallest biosphere reserve"],["10 · Dihang-Dibang","Arunachal Pradesh — 1998"],["11 · Pachmarhi","Madhya Pradesh — 1999; UNESCO 2009"],["12 · Khangchendzonga","Sikkim — 2000; UNESCO 2018"],["13 · Agasthyamalai","Kerala and Tamil Nadu — 2001; UNESCO 2016"],["14 · Achanakmar-Amarkantak","Madhya Pradesh and Chhattisgarh — 2005; UNESCO 2012"],["15 · Great Rann of Kutch","Gujarat — 2008; India's largest biosphere reserve"],["16 · Cold Desert","Himachal Pradesh — 2009 (16th); UNESCO September 2025 — the 13th Indian site in the list"],["17 · Seshachalam","Andhra Pradesh — 2010"],["18 · Panna","Madhya Pradesh — 2011 (18th); UNESCO 2020"]],"cap":"Numbered in the order they were set up, from Nilgiri (1986) to Panna (2011). Places are approximate centres."},{"k":"info","title":"How a biosphere reserve is zoned","html":"<svg class=\"dg\" viewBox=\"0 0 680 260\" role=\"img\" aria-label=\"Core, buffer and transition zones\">\n    <ellipse cx=\"230\" cy=\"130\" rx=\"210\" ry=\"118\" class=\"s1\" stroke=\"var(--rule)\"/><ellipse cx=\"230\" cy=\"130\" rx=\"140\" ry=\"80\" class=\"s2\" stroke=\"var(--rule)\"/><ellipse cx=\"230\" cy=\"130\" rx=\"70\" ry=\"42\" class=\"s4\" stroke=\"var(--rule)\"/>\n    <text x=\"230\" y=\"134\" text-anchor=\"middle\" font-size=\"14\" class=\"b\">Core<\/text><text x=\"230\" y=\"70\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Buffer<\/text><text x=\"230\" y=\"30\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Transition<\/text>\n    <text x=\"470\" y=\"70\" font-size=\"13\" class=\"b\">Core<\/text><text x=\"470\" y=\"88\" font-size=\"11.5\" class=\"mut\">Strictly protected; no human activity —<\/text><text x=\"470\" y=\"103\" font-size=\"11.5\" class=\"mut\">often a national park.<\/text>\n    <text x=\"470\" y=\"135\" font-size=\"13\" class=\"b\">Buffer<\/text><text x=\"470\" y=\"153\" font-size=\"11.5\" class=\"mut\">Research, education and limited use.<\/text>\n    <text x=\"470\" y=\"190\" font-size=\"13\" class=\"b\">Transition<\/text><text x=\"470\" y=\"208\" font-size=\"11.5\" class=\"mut\">Villages, farms and sustainable use —<\/text><text x=\"470\" y=\"223\" font-size=\"11.5\" class=\"mut\">people live and work here.<\/text><\/svg>","cap":"Under UNESCO's Man and the Biosphere (MAB) programme (1971). India's reserves are notified by the Centre; 13 of the 18 are in UNESCO's World Network."},{"k":"table","title":"When they joined UNESCO's World Network","head":["Reserve","Year"],"rows":[["Nilgiri","2000"],["Gulf of Mannar","2001"],["Sundarban","2001"],["Nanda Devi","2004"],["Nokrek","2009"],["Pachmarhi","2009"],["Simlipal","2009"],["Achanakmar-Amarkantak","2012"],["Great Nicobar","2013"],["Agasthyamalai","2016"],["Khangchendzonga","2018"],["Panna","2020"],["Cold Desert","2025"]]},{"k":"tlfig","title":"Joining UNESCO's World Network, year by year","rows":[[2000,"Nilgiri",""],[2001,"Gulf of Mannar",""],[2001,"Sundarban",""],[2004,"Nanda Devi",""],[2009,"Nokrek",""],[2009,"Pachmarhi",""],[2009,"Simlipal",""],[2012,"Achanakmar-Amarkantak",""],[2013,"Great Nicobar",""],[2016,"Agasthyamalai",""],[2018,"Khangchendzonga",""],[2020,"Panna",""],[2025,"Cold Desert",""]],"cap":"Nilgiri was the first (2000); Cold Desert (2025) is the newest — the 13th Indian reserve in the network."},{"k":"trick","h":"Five <b>not<\/b> in UNESCO — <b>“My Dear Dad Got Sick”<\/b>: <b>M<\/b>anas, <b>D<\/b>ibru-Saikhowa, <b>D<\/b>ihang-Dibang, <b>G<\/b>reat Rann of Kutch, <b>S<\/b>eshachalam."},{"k":"trap","h":"<b>Manas<\/b> is a UNESCO <i>World Heritage site<\/i> but <b>not<\/b> a UNESCO <i>biosphere reserve<\/i>. The <b>Great Rann of Kutch<\/b> is the largest biosphere reserve; the <b>Indian Wild Ass Sanctuary<\/b> (Little Rann) is the largest sanctuary."}],"sum":["India has 18 biosphere reserves; the first was Nilgiri (1986), the latest Panna (2011).","13 are in UNESCO's World Network; Cold Desert (Himachal Pradesh) joined in September 2025.","Largest: Great Rann of Kutch (Gujarat); smallest: Dibru-Saikhowa (Assam).","Gulf of Mannar is India's first marine biosphere reserve.","A biosphere reserve has a core, a buffer and a transition zone (UNESCO's MAB programme, 1971)."],"part":["Part 2 · Reserves and wetlands","आरक्षित क्षेत्र और आर्द्रभूमि"],"g":"pa"},
{"id":"P6","heat":3,"title":"Ramsar sites (wetlands)","hi":"रामसर स्थल (आर्द्रभूमि)","blocks":[{"k":"hot","h":"Ramsar questions are frequent in recent papers: <b>which state<\/b> a site is in, the <b>first<\/b> sites (Chilika and Keoladeo), the <b>largest<\/b> (Sundarban) and <b>smallest<\/b> (Renuka), the <b>Montreux Record<\/b>, and the <b>newest additions<\/b>."},{"k":"story","h":"<p>On <b>2 February 1971<\/b> — now World Wetlands Day — countries met in the Iranian town of <b>Ramsar<\/b> and signed a treaty to protect wetlands. India joined on <b>1 February 1982<\/b>, and its first two sites were <b>Chilika Lake<\/b> (Odisha) and <b>Keoladeo<\/b> (Rajasthan).<\/p><p>For decades India had only a few dozen sites; then came a rush. India had <b>98<\/b> by January 2026, after <b>Patna Bird Sanctuary<\/b> (Etah, UP — not Bihar!) and <b>Chhari-Dhand<\/b> (Kutch) were added, and about 100 were reported by mid-2026. <b>Tamil Nadu<\/b> has the most. Sites in trouble go on the <b>Montreux Record<\/b> — India's are <b>Keoladeo<\/b> and <b>Loktak<\/b>.<\/p>","key":"Ramsar Convention 1971 (Iran); India joined 1982; first sites Chilika and Keoladeo; Tamil Nadu has the most; Montreux Record — Keoladeo, Loktak."},{"k":"facts","title":"Ramsar records (as of 2026)","rows":[["Convention signed","2 February 1971, Ramsar (Iran) — World Wetlands Day"],["India joined","1 February 1982"],["India's sites","98 as of January 2026 (about 100 reported by mid-2026)"],["First Indian sites","Chilika Lake and Keoladeo (1981)"],["Largest site","Sundarban Wetland (West Bengal)"],["Smallest site","Renuka Wetland (Himachal Pradesh)"],["State with most sites","Tamil Nadu"],["Montreux Record (sites in danger)","Keoladeo and Loktak"]]},{"k":"table","title":"Ramsar sites by state","head":["Site","State / UT","Remember"],"rows":[["Chilika Lake","Odisha","India's first Ramsar site (1981) with Keoladeo; largest brackish-water lagoon in Asia."],["Keoladeo","Rajasthan","1981; on the Montreux Record."],["Wular Lake","Jammu and Kashmir","India's largest freshwater lake."],["Loktak Lake","Manipur","Floating phumdis; on the Montreux Record."],["Harike","Punjab","Where the Beas meets the Sutlej."],["Sambhar Lake","Rajasthan","India's largest inland salt lake."],["Tso Morari","Ladakh",""],["Tso Kar","Ladakh","High-altitude lake complex."],["Renuka","Himachal Pradesh","India's smallest Ramsar site."],["Chandra Taal","Himachal Pradesh",""],["Pong Dam","Himachal Pradesh",""],["Deepor Beel","Assam","Assam's only Ramsar site."],["Rudrasagar","Tripura",""],["East Kolkata Wetlands","West Bengal","Uses wastewater for fish farming."],["Sundarban Wetland","West Bengal","India's largest Ramsar site."],["Kolleru Lake","Andhra Pradesh",""],["Vembanad-Kol","Kerala","Kerala's largest wetland."],["Ashtamudi","Kerala",""],["Sasthamkotta","Kerala","Kerala's largest freshwater lake."],["Bhoj Wetland","Madhya Pradesh","The lakes of Bhopal."],["Sur Sarovar","Uttar Pradesh","Near Agra."],["Sarsai Nawar Jheel","Uttar Pradesh","Sarus cranes, Etawah."],["Patna Bird Sanctuary","Uttar Pradesh","In Etah district — added January 2026."],["Nandur Madhameshwar","Maharashtra","Maharashtra's first Ramsar site."],["Lonar Lake","Maharashtra","A crater lake made by a meteorite."],["Thane Creek","Maharashtra","Flamingos."],["Nal Sarovar","Gujarat",""],["Khijadia","Gujarat",""],["Thol","Gujarat",""],["Chhari-Dhand","Gujarat","In Kutch — added January 2026."],["Sultanpur","Haryana",""],["Bhindawas","Haryana",""],["Asan Barrage","Uttarakhand","Uttarakhand's first Ramsar site."],["Pala Wetland","Mizoram",""],["Hirakud Reservoir","Odisha",""],["Bhitarkanika Mangroves","Odisha",""],["Kabartal","Bihar","Bihar's first Ramsar site."],["Nanda Lake","Goa",""],["Ranganathittu","Karnataka",""],["Vedanthangal","Tamil Nadu",""],["Pallikaranai Marsh","Tamil Nadu",""],["Point Calimere","Tamil Nadu",""],["Pichavaram Mangrove","Tamil Nadu",""],["Yashwant Sagar","Madhya Pradesh",""],["Khecheopalri Lake","Sikkim","Sikkim's first Ramsar site (January 2025)."],["Udhwa Lake","Jharkhand","Jharkhand's first Ramsar site (January 2025)."],["Khichan","Rajasthan","Demoiselle cranes — added June 2025."],["Menar","Rajasthan","The 'bird village' near Udaipur — added June 2025."],["Hokera Wetland","Jammu and Kashmir",""],["Kanjli","Punjab",""]]},{"k":"trick","h":"<b>“Chilly Keo”<\/b> — Chilika and Keoladeo were first. <b>“Montreux = Mourning”<\/b> — the sites in mourning: Keoladeo and Loktak (<b>K-L<\/b>)."},{"k":"trap","h":"<b>Patna Bird Sanctuary<\/b> is in <b>Etah, Uttar Pradesh<\/b> — not Patna, Bihar. <b>Chilika<\/b> was removed from the Montreux Record in 2002. The convention was signed in 1971 but India joined in <b>1982<\/b>."}],"sum":["Ramsar Convention: 2 February 1971, Ramsar, Iran; India joined 1 February 1982.","India's first Ramsar sites: Chilika Lake (Odisha) and Keoladeo (Rajasthan).","Largest: Sundarban Wetland; smallest: Renuka (HP); Tamil Nadu has the most.","Montreux Record: Keoladeo and Loktak.","January 2026 additions: Patna Bird Sanctuary (Etah, UP) and Chhari-Dhand (Kutch, Gujarat) — 98 sites."],"part":["Part 2 · Reserves and wetlands","आरक्षित क्षेत्र और आर्द्रभूमि"],"g":"pa"},
{"id":"P7","heat":3,"title":"UNESCO World Heritage sites in India","hi":"भारत में यूनेस्को विश्व धरोहर स्थल","blocks":[{"k":"hot","h":"Asked every year: <b>which state<\/b> a heritage site is in, the <b>newest<\/b> sites (Moidams 2024, Maratha Military Landscapes 2025), the <b>first four<\/b> (1983) and the <b>natural<\/b> and <b>mixed<\/b> sites."},{"k":"story","h":"<p>India's heritage list began in <b>1983<\/b> with <b>Ajanta, Ellora, Agra Fort and the Taj Mahal<\/b>. Over four decades it grew to <b>45<\/b> sites by 2026 — <b>37 cultural, 7 natural and 1 mixed<\/b> (Khangchendzonga); <b>Sarnath<\/b> became the 45th on 25 July 2026.<\/p><p>Recent years added <b>Dholavira<\/b> and <b>Ramappa Temple<\/b> (2021), <b>Santiniketan<\/b> and the <b>Hoysala temples<\/b> (2023), the <b>Moidams of Charaideo<\/b> in Assam (2024) and the <b>Maratha Military Landscapes<\/b> — 12 forts in Maharashtra and Tamil Nadu (2025). In July 2026 <b>Sarnath<\/b> was reported added as the 45th. Maharashtra has the most sites.<\/p>","key":"First four (1983): Ajanta, Ellora, Agra Fort, Taj; 44 sites by 2025 (36 cultural, 7 natural, 1 mixed); latest Maratha Military Landscapes (2025)."},{"k":"table","title":"World Heritage sites","head":["Site","State / UT","Year and note"],"rows":[["Ajanta Caves","Maharashtra","1983 — among India's first four sites."],["Ellora Caves","Maharashtra","1983 — Hindu, Buddhist and Jain caves."],["Agra Fort","Uttar Pradesh","1983."],["Taj Mahal","Uttar Pradesh","1983."],["Sun Temple, Konark","Odisha","1984 — the Black Pagoda."],["Group of Monuments at Mahabalipuram","Tamil Nadu","1984 — Pallava shore temples."],["Churches and Convents of Goa","Goa","1986."],["Khajuraho Group of Monuments","Madhya Pradesh","1986 — Chandela temples."],["Group of Monuments at Hampi","Karnataka","1986 — capital of Vijayanagara."],["Fatehpur Sikri","Uttar Pradesh","1986 — Akbar's capital."],["Group of Monuments at Pattadakal","Karnataka","1987 — Chalukya temples."],["Elephanta Caves","Maharashtra","1987."],["Great Living Chola Temples","Tamil Nadu","1987, extended 2004."],["Buddhist Monuments at Sanchi","Madhya Pradesh","1989."],["Humayun's Tomb","Delhi","1993."],["Qutb Minar and its Monuments","Delhi","1993."],["Mahabodhi Temple, Bodh Gaya","Bihar","2002."],["Rock Shelters of Bhimbetka","Madhya Pradesh","2003 — prehistoric paintings."],["Champaner-Pavagadh","Gujarat","2004."],["Chhatrapati Shivaji Terminus","Maharashtra","2004 — Victorian Gothic railway station."],["Red Fort Complex","Delhi","2007."],["Jantar Mantar, Jaipur","Rajasthan","2010 — Sawai Jai Singh's observatory."],["Hill Forts of Rajasthan","Rajasthan","2013 — six forts incl. Chittorgarh and Kumbhalgarh."],["Rani-ki-Vav, Patan","Gujarat","2014 — the stepwell on the ₹100 note."],["Archaeological Site of Nalanda Mahavihara","Bihar","2016."],["Capitol Complex (Le Corbusier)","Chandigarh","2016."],["Historic City of Ahmedabad","Gujarat","2017 — India's first World Heritage City."],["Victorian Gothic and Art Deco Ensembles of Mumbai","Maharashtra","2018."],["Jaipur City","Rajasthan","2019 — the Pink City."],["Dholavira","Gujarat","2021 — Harappan city in Kutch."],["Ramappa Temple (Kakatiya Rudreshwara)","Telangana","2021."],["Santiniketan","West Bengal","2023."],["Sacred Ensembles of the Hoysalas","Karnataka","2023 — Belur, Halebidu, Somanathapura."],["Moidams of Charaideo","Assam","2024 — Ahom royal burial mounds; first cultural site of the North-East."],["Maratha Military Landscapes","Maharashtra and Tamil Nadu","2025 — 12 forts incl. Raigad and Gingee; the 44th site."],["Sarnath","Uttar Pradesh","Inscribed 25 July 2026 at the 48th session (Busan) — the 45th site."],["Kaziranga National Park","Assam","1985 — natural."],["Manas Wildlife Sanctuary","Assam","1985 — natural."],["Keoladeo National Park","Rajasthan","1985 — natural."],["Sundarbans National Park","West Bengal","1987 — natural."],["Nanda Devi and Valley of Flowers","Uttarakhand","1988, extended 2005 — natural."],["Great Himalayan National Park","Himachal Pradesh","2014 — natural."],["Western Ghats","Kerala, Karnataka, Tamil Nadu and Maharashtra","2012 — natural; a biodiversity hotspot."],["Khangchendzonga National Park","Sikkim","2016 — India's only mixed site."]]},{"k":"trick","h":"The natural seven — <b>“Kaziranga Manas Keoladeo, Sundar Nanda, Himalaya Ghats”<\/b>: Kaziranga, Manas, Keoladeo, Sundarbans, Nanda Devi & Valley of Flowers, Great Himalayan NP, Western Ghats. Khangchendzonga is the one <b>mixed<\/b>."},{"k":"trap","h":"<b>Rani-ki-Vav<\/b> is in Patan, <b>Gujarat<\/b> — not Rajasthan. <b>Ramappa<\/b> is in <b>Telangana<\/b>. The <b>Hill Forts<\/b> are in Rajasthan, but the <b>Maratha forts<\/b> include <b>Gingee<\/b> in Tamil Nadu."}],"sum":["First four World Heritage sites (1983): Ajanta, Ellora, Agra Fort, Taj Mahal.","India has 45 sites (2026) — 37 cultural, 7 natural, 1 mixed (Khangchendzonga).","Recent: Dholavira and Ramappa (2021), Santiniketan and Hoysala temples (2023), Moidams (2024), Maratha Military Landscapes (2025).","Ahmedabad (2017) was India's first World Heritage City; Jaipur followed in 2019.","Sarnath (Uttar Pradesh) became the 45th site on 25 July 2026."],"part":["Part 2 · Reserves and wetlands","आरक्षित क्षेत्र और आर्द्रभूमि"],"g":"pa"},
{"id":"P8","heat":3,"title":"Animals and where to find them","hi":"वन्यजीव और उनके आवास","blocks":[{"k":"hot","h":"A favourite question type: <b>“Which park is famous for X?”<\/b> Learn one park per animal — rhino–Kaziranga, lion–Gir, sangai–Keibul Lamjao, hangul–Dachigam, barasingha–Kanha, Nilgiri tahr–Eravikulam, Olive Ridley–Gahirmatha."},{"k":"story","h":"<p>Many of India's rarest animals survive in just one place. The <b>Asiatic lion<\/b> lives wild only in <b>Gir<\/b>. The <b>sangai<\/b> deer dances on the floating meadows of <b>Keibul Lamjao<\/b>. The <b>hangul<\/b>, Kashmir's only red deer, clings on in <b>Dachigam<\/b>. In <b>Kanha<\/b>, rangers saved the <b>barasingha<\/b> from fewer than 70 animals.<\/p><p>Some come home after long journeys: <b>Olive Ridley<\/b> turtles return to <b>Gahirmatha<\/b> beach every winter, and <b>cheetahs<\/b> — extinct in India since 1952 — were brought from Namibia to <b>Kuno<\/b> in 2022. The <b>great Indian bustard<\/b> of the Thar Desert is now one of the world's rarest birds.<\/p>","key":"Lion — Gir; rhino — Kaziranga; sangai — Keibul Lamjao; hangul — Dachigam; barasingha — Kanha; tahr — Eravikulam; cheetah — Kuno."},{"k":"table","title":"Animal ↔ park","head":["Animal","Best-known home","Note"],"rows":[["One-horned rhinoceros","Kaziranga (Assam)","Also Pobitora, Manas, Orang and Jaldapara."],["Asiatic lion","Gir (Gujarat)","The only wild population in the world."],["Sangai (brow-antlered deer)","Keibul Lamjao (Manipur)","Manipur's state animal."],["Hangul (Kashmir stag)","Dachigam (Jammu and Kashmir)",""],["Barasingha (hard-ground swamp deer)","Kanha (Madhya Pradesh)","MP's state animal."],["Nilgiri tahr","Eravikulam (Kerala)","Tamil Nadu's state animal."],["Snow leopard","Hemis (Ladakh)",""],["Indian wild ass (khur)","Little Rann of Kutch (Gujarat)",""],["Cheetah (reintroduced)","Kuno (Madhya Pradesh)","Brought from Namibia in 2022."],["Olive Ridley turtle","Gahirmatha (Odisha)","Mass nesting is called 'arribada'."],["Saltwater crocodile","Bhitarkanika (Odisha)",""],["Great Indian bustard","Desert National Park (Rajasthan)","Critically endangered; Rajasthan's state bird."],["Lion-tailed macaque","Silent Valley (Kerala)",""],["Golden langur","Chakrashila (Assam)",""],["Hoolock gibbon","Hollongapar (Assam)","India's only ape."],["Red panda","Singalila (West Bengal)","Sikkim's state animal."],["Gharial","National Chambal Sanctuary",""],["Blackbuck","Velavadar (Gujarat)",""],["Siberian crane (winter visitor, now rare)","Keoladeo (Rajasthan)",""],["Demoiselle crane","Khichan (Rajasthan)","Called 'kurja' locally."],["Sloth bear","Daroji (Karnataka)",""],["Indian giant squirrel","Bhimashankar (Maharashtra)","Maharashtra's state animal."],["Pygmy hog","Manas (Assam)","The smallest wild pig."],["Dugong (sea cow)","Gulf of Mannar (Tamil Nadu)",""],["Sarus crane","Sarsai Nawar (Uttar Pradesh)","The tallest flying bird; UP's state bird."],["Wild water buffalo","Udanti-Sitanadi (Chhattisgarh)","Chhattisgarh's state animal."]]},{"k":"table","title":"IUCN Red List status","head":["Animal","Status","Note"],"rows":[["Great Indian bustard","Critically endangered","Fewer than 150 left; power lines are a major threat."],["Gharial","Critically endangered",""],["Pygmy hog","Endangered",""],["Bengal tiger","Endangered",""],["Asiatic lion","Endangered","Moved from 'critically endangered' in 2008."],["Asian elephant","Endangered",""],["Snow leopard","Vulnerable","Moved from 'endangered' in 2017."],["One-horned rhinoceros","Vulnerable",""],["Sloth bear","Vulnerable",""],["Blackbuck","Least concern",""],["Indian peafowl","Least concern","India's national bird."]]},{"k":"trick","h":"<b>Endangered order<\/b> on the IUCN ladder: Least concern → Near threatened → <b>Vulnerable<\/b> → <b>Endangered<\/b> → <b>Critically endangered<\/b> → Extinct in the wild → Extinct. Tiger and lion are <b>Endangered<\/b>; rhino and snow leopard are only <b>Vulnerable<\/b>; bustard and gharial are <b>Critically endangered<\/b>."},{"k":"trap","h":"The <b>golden langur<\/b> lives in Assam (and Bhutan), not the Western Ghats — the Western Ghats monkey is the <b>lion-tailed macaque<\/b>. The <b>cheetah<\/b> was declared extinct in India in <b>1952<\/b>."}],"sum":["Asiatic lion — Gir; one-horned rhino — Kaziranga; sangai — Keibul Lamjao; hangul — Dachigam.","Barasingha — Kanha; Nilgiri tahr — Eravikulam; snow leopard — Hemis.","Olive Ridley — Gahirmatha; saltwater crocodile — Bhitarkanika; gharial — Chambal.","Cheetahs were brought to Kuno in 2022 (extinct in India since 1952).","Great Indian bustard and gharial are critically endangered; tiger and lion endangered; rhino and snow leopard vulnerable."],"part":["Part 3 · Heritage and wildlife","धरोहर और वन्यजीव"],"g":"pa"}
];

:root[data-skin] body{background-color:var(--app-bg);background-image:var(--app-pattern);background-size:var(--app-psize);background-attachment:fixed}
:root[data-skin] h1,:root[data-skin] h2{letter-spacing:-.01em}

/* ===== Desktop layout (PC / tablet landscape) ===== */
@media (min-width: 1024px){
  :root{--side:236px}
  body{padding-left:var(--side);font-size:16.5px}
  .top{border-bottom:1px solid var(--rule)}
  .top-in{max-width:1320px;padding:16px 36px}
  .brand{font-size:21px}
  .brand small{font-size:13px}
  .stat{font-size:13px}
  .wrap{max-width:1320px;padding:0 36px 56px}
  .view{padding-top:28px}
  h1{font-size:34px} h2{font-size:22px} h3{font-size:17px}

  /* bottom tab bar becomes a left sidebar */
  .nav{top:0;bottom:0;left:0;right:auto;width:var(--side);height:auto;border-top:0;border-right:1px solid var(--rule);padding:84px 14px 20px;display:block;overflow:auto}
  .nav-in{display:flex;flex-direction:column;gap:4px;height:auto;max-width:none;margin:0}
  .nav-in::before{content:"Sections";display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:0 14px 8px}
  .nav button{flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-size:15px;min-height:0;height:auto;width:100%;text-align:left}
  .nav button svg{width:20px;height:20px;flex-shrink:0}
  .nav button:hover{background:var(--sunk)}
  .nav button[aria-current="page"]{background:var(--blue-bg)}
  .nav button[aria-current="page"] span{border-bottom:0!important}

  /* home: intro beside progress */
  .hero{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);column-gap:48px;align-items:end;padding-bottom:10px}
  .hero > .eyebrow,.hero > h1,.hero > p{grid-column:1}
  .hero > .meter{grid-column:2;grid-row:3;align-self:center}
  .hero > .row{grid-column:2;grid-row:2;align-self:end}

  /* lesson reader: facts, timelines, tricks sit side by side */
  .lhead{margin-bottom:0}
  .steps{max-width:640px}
  .steps + .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .steps + .stack > .plain,.steps + .stack > .row,.steps + .stack > p,.steps + .stack > .fig,.steps + .stack > h2,.steps + .stack > .tbl{grid-column:1/-1}
  .steps + .stack > .plain{max-width:86ch;font-size:17px}
  .steps + .stack > .hot,.steps + .stack > .story{grid-column:1/-1}
  .steps + .stack > .story{max-width:none;padding:20px 24px;font-size:17.5px}
  .steps + .stack > .story p{max-width:80ch}
  .steps + .stack:not(:has(> .block ~ .block)) > .block{grid-column:1/-1}
  .block,.qcard{padding:18px 20px;border-radius:14px}

  /* quizzes and question bank */
  #lq > .stack{display:grid;grid-template-columns:minmax(0,1fr);max-width:980px;gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qt{font-size:18px}
  #plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #plist .opts{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:wrap;overflow:visible}

  /* mock test: question with the answer grid alongside */
  .mbar{top:calc(env(safe-area-inset-top,0px) + 67px)}
  .view > .qcard{max-width:1000px}
  .view > .row.between{max-width:1000px}
  .view > #msub{max-width:1000px;width:100%}
  .view > .block.stack{max-width:760px}
  .pal{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .kpis{max-width:760px}

  /* revise: summary cards and sheets in columns */
  #rv > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #rv > .stack > .grph,#rv > .stack > p,#rv > .stack > .search,#rv > .stack > .callout{grid-column:1/-1}
  #dgl,#lml,#tll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #dgl > .grph,#dgl > p,#lml > p,#tll > .grph{grid-column:1/-1}
  #rv .search,#rv > #dgl ~ .search{max-width:520px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flash{min-height:300px;max-width:760px;margin:0 auto;padding:32px 36px}
  .flash .front{font-size:22px}

  /* learn: era cards across the top */
  .eras{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}
  .les{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}

(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();

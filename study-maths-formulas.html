<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">

<title>Maths Formula Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: Physics PYQ Workbook — follows the शब्दRegister Paper / Indigo look; one column + bottom tabs on phones, sidebar on PC. */
:root{
  --paper:#f6f3ea; --sheet:#fffdf7; --sunk:#ebe6d8;
  --ink:#1d2a22; --ink2:#56625a; --rule:#dcd5c3;
  --blue:#1f5c3d; --on-blue:#ffffff; --blue-bg:#dcebdf;
  --accent:#b4530f; --accent-bg:#fbe7d3;
  --good:#1b7547; --good-bg:#dff1e6; --bad:#b0271f; --bad-bg:#f8e1de;
  --warn-bg:#fff2d2;
  --f-display:"Fraunces", "Tiro Devanagari Hindi", Georgia, serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap{border-radius:var(--r);padding:12px 14px 12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.trick .lab,.trap .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.rk div{grid-template-columns:minmax(0,48%) minmax(0,1fr)}
.rk dd{min-width:0;overflow-wrap:anywhere}
.hot{border-radius:var(--r);padding:12px 14px;background:var(--warn-bg,var(--accent-bg));border-left:4px solid var(--warn,var(--accent))}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--warn,var(--accent))}
.heatb{display:inline-block;font-size:11px;letter-spacing:-.1em;margin-left:6px;vertical-align:1px}
.heat{display:flex;flex-direction:column;gap:2px}
.hrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(60px,1fr) 44px;gap:10px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:9px 2px;color:inherit;font:inherit;cursor:pointer}
.hrow:last-child{border-bottom:0}
.hrow .ht{display:flex;flex-direction:column;min-width:0}
.hrow .ht .muted{font-size:12px}
.hbar{height:10px;border-radius:5px;background:var(--rule);overflow:hidden}
.hbar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hp{text-align:right;font-weight:700}

.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.pyr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pyr div{text-align:center;font-size:13px}
.pyr b{display:block;font-size:14px}
.pm{fill:var(--blue)} .pf{fill:var(--accent)}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.pal button.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.pal button.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.rk{display:grid;gap:0}
.rk div{display:grid;grid-template-columns:minmax(0,48%) 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:15px}
.rk div:first-child{border-top:0}
.rk dt{font-size:13px;color:var(--ink2);margin:0}
.rk dt.up{color:var(--good)} .rk dt.dn{color:var(--bad)}
.rk dd{margin:0;font-weight:600;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:24px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.gbar{display:grid;grid-template-columns:78px 1fr 52px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.gbar .tr{height:12px;background:var(--sunk);border-radius:3px;position:relative;overflow:hidden}
.gbar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:3px}
.gbar .tr i.neg{background:var(--bad)}
.gbar .v{font-family:var(--f-num);text-align:right}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
@media (prefers-reduced-motion: no-preference){ .opt,.chip,.btn{transition:background-color .15s, border-color .15s} }
.link{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px}
.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.icheck{background:var(--sheet);border:1.5px dashed var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.icheck .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.cat{font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;white-space:nowrap}
.cat.CS{background:var(--blue-bg);color:var(--blue)} .cat.CSS{background:var(--accent-bg);color:var(--accent)} .cat.ST{background:var(--sunk);color:var(--ink)} .cat.OT{background:var(--sunk);color:var(--ink2)}

/* ---- workbook additions ---- */
table.cover td:nth-child(4){min-width:180px}
.plist .dl{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.plist .dl em{font-style:normal;font-weight:700;color:var(--blue);text-align:right}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--rule)}
.ladder li{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--rule)}
.ladder .rk-n{font-size:22px;font-weight:600;color:var(--blue);text-align:right}
.ladder .rk-t{min-width:0}
.ladder .rk-t b{display:block;line-height:1.3}
.ladder .rk-t span{font-size:13px;color:var(--ink2)}
.ladder .rk-d{font-weight:700;font-size:14px;white-space:nowrap}
.ladder li.up .rk-d{color:var(--good)} .ladder li.dn .rk-d{color:var(--bad)}
.ladder small{font-weight:600;color:var(--ink2)}
table.cover td{min-width:90px}
.peek{border:1.5px dashed var(--blue);background:var(--blue-bg);color:var(--blue);border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer;min-height:36px;width:100%}
.pubs{display:grid;gap:12px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.plist li{padding:7px 0;border-top:1px dashed var(--rule);display:grid;gap:1px}
.plist li:first-child{border-top:0}
.plist li span{font-size:13px;color:var(--ink2)}
.seg{scroll-snap-type:x proximity}
@media (max-width: 700px){
  table.cover thead{display:none}

<script>
"use strict";
/* Each chapter: f = formula rows [name, formula, note, star(1 = last-hour sheet)], c = key concepts, tb = tables, tr = tricks, tp = traps.
   t1 / t2 = usual number of questions in CGL Tier 1 (25 maths questions) and Tier 2 (Paper 1, Module I: 30 maths questions). Approximate. */
const CH = [
{ id:"C1", g:"Foundation", t:"Must-know values", hi:"याद रखने योग्य मान", heat:3, t1:"used everywhere", t2:"used everywhere",
 ask:"Not a chapter in the paper, but every chapter needs these values. Knowing them by heart saves 10–15 seconds per question.",
 tb:[
  {title:"Squares 11–30", head:["n","n²","n","n²","n","n²"], rows:[["11","121","18","324","25","625"],["12","144","19","361","26","676"],["13","169","20","400","27","729"],["14","196","21","441","28","784"],["15","225","22","484","29","841"],["16","256","23","529","30","900"],["17","289","24","576","",""]]},
  {title:"Cubes 1–20", head:["n","n³","n","n³","n","n³"], rows:[["1","1","8","512","15","3375"],["2","8","9","729","16","4096"],["3","27","10","1000","17","4913"],["4","64","11","1331","18","5832"],["5","125","12","1728","19","6859"],["6","216","13","2197","20","8000"],["7","343","14","2744","",""]]},
  {title:"Fractions ↔ percentages", head:["Fraction","%","Fraction","%"], rows:[["1/2","50","1/11","9.09"],["1/3","33.33","1/12","8.33"],["1/4","25","1/13","7.69"],["1/5","20","1/14","7.14"],["1/6","16.67","1/15","6.67"],["1/7","14.28","1/16","6.25"],["1/8","12.5","1/20","5"],["1/9","11.11","1/25","4"],["1/10","10","3/8","37.5"]]},
  {title:"Powers and roots", head:["Value","","Value",""], rows:[["√2","1.414","2¹⁰","1024"],["√3","1.732","3⁵","243"],["√5","2.236","3⁶","729"],["√6","2.449","5⁴","625"],["√7","2.646","7³","343"],["π","22/7 ≈ 3.1416","1/π","≈ 0.318"]]},
  {title:"Pythagorean triplets", head:["Triplet","Multiples to spot"], rows:[["3, 4, 5","6-8-10, 9-12-15, 12-16-20, 15-20-25"],["5, 12, 13","10-24-26"],["7, 24, 25","14-48-50"],["8, 15, 17","16-30-34"],["9, 40, 41",""],["20, 21, 29",""],["11, 60, 61",""],["12, 35, 37",""]]}],
 tr:["Squares ending in 5: (a5)² = a(a+1) followed by 25 → 65² = 6·7 | 25 = 4225.","Squares near 50: (50 ± x)² = (25 ± x) hundreds + x² → 47² = 22|09 = 2209.","Unit digit of a perfect square is never 2, 3, 7 or 8."],
 tp:["1/7 = 14.28 % (not 14.5); 1/11 = 9.09 % (not 9.9).","√5 = 2.236, √6 = 2.449 — candidates often swap them."]},

{ id:"C2", g:"Arithmetic", t:"Number system", hi:"संख्या पद्धति", heat:3, t1:"1–2", t2:"1–2",
 ask:"Divisibility (find the missing digit), remainders, unit digit, number of factors, trailing zeros, sums of series.",
 f:[["Division","Dividend = Divisor × Quotient + Remainder","",1],
  ["Divisibility by 3 / 9","sum of digits divisible by 3 / 9","",1],
  ["Divisibility by 4 / 8","last 2 / last 3 digits divisible by 4 / 8","",1],
  ["Divisibility by 11","(sum of odd-place digits) − (sum of even-place digits) = 0 or a multiple of 11","",1],
  ["Divisibility by 7, 11, 13","abcabc is always divisible by 7, 11, 13 (= abc × 1001)",""],
  ["Number of factors","N = a<sup>p</sup> × b<sup>q</sup> × c<sup>r</sup> → (p + 1)(q + 1)(r + 1)","72 = 2³·3² → 4·3 = 12",1],
  ["Sum of factors","(a<sup>p+1</sup> − 1)/(a − 1) × (b<sup>q+1</sup> − 1)/(b − 1)",""],
  ["Trailing zeros of n!","⌊n/5⌋ + ⌊n/25⌋ + ⌊n/125⌋ + …","100! → 20 + 4 = 24",1],
  ["Unit digit cycles","2, 3, 7, 8 → cycle 4; 4, 9 → cycle 2; 0, 1, 5, 6 → same","divide power by 4; remainder 0 → use 4th term",1],
  ["Remainder of product / sum","(a × b) mod n = (a mod n × b mod n) mod n","negative remainders allowed",1],
  ["aⁿ − bⁿ","divisible by (a − b) always; by (a + b) when n is even",""],
  ["aⁿ + bⁿ","divisible by (a + b) when n is odd",""],
  ["Sum 1 to n","n(n + 1)/2","",1],
  ["Sum of squares","n(n + 1)(2n + 1)/6","",1],
  ["Sum of cubes","[n(n + 1)/2]²","",1],
  ["First n odd / even numbers","sum = n² / n(n + 1)",""],
  ["AP","Tₙ = a + (n − 1)d; Sₙ = n/2 [2a + (n − 1)d] = n/2 (first + last)","",1],
  ["GP","Tₙ = arⁿ⁻¹; Sₙ = a(rⁿ − 1)/(r − 1); S∞ = a/(1 − r), |r| < 1",""],
  ["Recurring decimals","0.ababab… = ab/99; 0.abbb… = (ab − a)/90","0.454545… = 45/99 = 5/11"],
  ["Fermat","aᵖ⁻¹ mod p = 1 (p prime, a not a multiple of p)","2¹⁰⁰ mod 101 = 1"]],
 c:["Primes up to 100: 25. 1 is neither prime nor composite; 2 is the only even prime.","Co-primes have HCF 1 (they need not be prime: 8 and 9).","Every prime > 3 is of the form 6k ± 1.","Product of n consecutive integers is divisible by n!.","A number and its digit-sum leave the same remainder on division by 9."],
 tr:["Remainder of a big power: write the base as (divisor ± 1). 17²⁰⁰ ÷ 18 → (18 − 1)²⁰⁰ → remainder (−1)²⁰⁰ = 1.","Unit digit of a sum/product: work only with unit digits.","Missing digit for 11: set (odd − even) = 0 or 11 and test options."],
 tp:["Unit digit when power ÷ 4 leaves 0: use the 4th term of the cycle (e.g. 2⁴ → 6), not 1.","Trailing zeros: 25 contributes two 5s, 125 three — don’t stop at ⌊n/5⌋."]},

{ id:"C3", g:"Arithmetic", t:"HCF & LCM", hi:"म.स. और ल.स.", heat:1, t1:"0–1", t2:"0–1",
 ask:"HCF × LCM, bells tolling together, largest number leaving given remainders, smallest number with given remainders.",
 f:[["Two numbers","HCF × LCM = product of the numbers","only for two numbers",1],
  ["Numbers with HCF h","a = hx, b = hy, x and y co-prime","count co-prime pairs",1],
  ["HCF / LCM of fractions","HCF = HCF(numerators)/LCM(denominators); LCM = LCM(numerators)/HCF(denominators)","",1],
  ["Largest number dividing a, b, c leaving remainders r₁, r₂, r₃","HCF(a − r₁, b − r₂, c − r₃)","",1],
  ["Largest number leaving the same remainder","HCF(|a − b|, |b − c|, |c − a|)","",1],
  ["Smallest number leaving remainder r with each of a, b, c","LCM(a, b, c) + r","",1],
  ["Smallest number leaving remainders that are k less than each divisor","LCM(a, b, c) − k","5 when ÷6, 6 when ÷7 → LCM − 1",1],
  ["Greatest n-digit number divisible by a, b, c","largest n-digit number − (its remainder ÷ LCM)",""],
  ["Bells / lights together","after LCM of the intervals",""]],
 c:["HCF always divides LCM.","HCF of co-primes = 1; LCM = product.","HCF of numbers ≤ the smallest; LCM ≥ the largest."],
 tr:["Options test: LCM must be divisible by HCF — strike out options that fail."],
 tp:["HCF × LCM = product holds for TWO numbers only, not three."]},

{ id:"C4", g:"Arithmetic", t:"Simplification, surds & indices", hi:"सरलीकरण, करणी और घातांक", heat:2, t1:"1–2", t2:"1",
 ask:"BODMAS simplification, comparing surds, rationalising, infinite roots, laws of indices.",
 f:[["BODMAS","Brackets (), {}, [] → Of → Division → Multiplication → Addition → Subtraction","‘of’ before ÷",1],
  ["Indices","aᵐ·aⁿ = aᵐ⁺ⁿ; aᵐ/aⁿ = aᵐ⁻ⁿ; (aᵐ)ⁿ = aᵐⁿ; a⁰ = 1; a⁻ⁿ = 1/aⁿ","",1],
  ["Fractional power","a^(m/n) = ⁿ√(aᵐ)","",1],
  ["Rationalise","1/(√a + √b) = (√a − √b)/(a − b)","",1],
  ["Root of a + 2√b","√(a + 2√b) = √x + √y where x + y = a, xy = b","√(5 + 2√6) = √3 + √2",1],
  ["Infinite root (+)","√(x + √(x + …)) = (1 + √(1 + 4x))/2","= n + 1 if x = n(n + 1)",1],
  ["Infinite root (−)","√(x − √(x − …)) = (−1 + √(1 + 4x))/2","= n if x = n(n + 1)",1],
  ["Infinite product root","√(x√(x√(x…))) = x",""],
  ["Finite product root","n roots of x → x^((2ⁿ − 1)/2ⁿ)",""],
  ["Comparing surds","make the root order equal: LCM of indices","∛3 vs √2 → ⁶√9 vs ⁶√8"]],
 c:["If aˣ = aʸ (a ≠ 0, ±1) then x = y.","Add/subtract surds only when the radical is the same: 2√3 + 5√3 = 7√3.","(√a + √b)² = a + b + 2√(ab)."],
 tr:["Approximate: √2 ≈ 1.414, √3 ≈ 1.732 and eliminate options by size.","For long fractions, look for a ± b and a² − b² patterns before multiplying out."],
 tp:["‘of’ is done before division: 24 ÷ 4 of 3 = 24 ÷ 12 = 2.","−3² = −9 but (−3)² = 9."]},

{ id:"C5", g:"Arithmetic", t:"Percentage", hi:"प्रतिशत", heat:3, t1:"1–2", t2:"1–2",
 ask:"Successive change, population/depreciation, consumption–price, elections, exam pass marks, income–expenditure.",
 f:[["Percentage change","(change ÷ original) × 100","",1],
  ["Successive change a %, b %","a + b + ab/100","use − for a decrease",1],
  ["Up r % then down r %","net loss of r²/100 %","",1],
  ["A is r % more than B","B is r/(100 + r) × 100 % less than A","25 % more → 20 % less",1],
  ["A is r % less than B","B is r/(100 − r) × 100 % more than A","20 % less → 25 % more",1],
  ["Price up r %, keep spending same","cut consumption by r/(100 + r) × 100 %","",1],
  ["Population growth","P(1 + r/100)ⁿ","",1],
  ["Depreciation","P(1 − r/100)ⁿ","",1],
  ["x % of y","= y % of x",""],
  ["Product constant (A × B fixed)","A up by 1/n → B down by 1/(n + 1)","price × quantity, speed × time"]],
 c:["Express percentages as fractions: 12.5 % = 1/8, 16.67 % = 1/6, 37.5 % = 3/8.","Elections: votes for winner − loser = margin; invalid votes are removed first."],
 tr:["Successive changes: multiply fractions. +25 % then −20 % → 5/4 × 4/5 = 1 → no change.","Exam pass mark: if a student scoring x % fails by a marks and one scoring y % passes by b marks, maximum marks = (a + b)/(y − x) × 100."],
 tp:["‘Percentage of’ vs ‘percentage points’: 10 % to 12 % is a 2-point rise but a 20 % rise.","Base changes in successive steps — never just add the percentages."]},

{ id:"C6", g:"Arithmetic", t:"Profit, loss & discount", hi:"लाभ, हानि और बट्टा", heat:3, t1:"1–2", t2:"1–2",
 ask:"Profit %, MP–discount–profit chains, successive discounts, dishonest dealer, buy-x-get-y offers.",
 f:[["Profit %","(SP − CP)/CP × 100","always on CP",1],
  ["SP from profit","SP = CP × (100 + P%)/100; loss: CP × (100 − L%)/100","",1],
  ["Discount","on MP: SP = MP × (100 − d%)/100","",1],
  ["MP : CP","= (100 + P%) : (100 − d%)","",1],
  ["Successive discounts","d₁ + d₂ − d₁d₂/100","",1],
  ["Mark up m %, discount d %","net profit % = m − d − md/100","",1],
  ["Same SP, x % gain and x % loss","always a loss of x²/100 %","",1],
  ["False weight","gain % = (true − false)/false × 100","900 g for 1 kg → 11.11 %",1],
  ["CP of x articles = SP of y articles","profit % = (x − y)/y × 100","",1],
  ["Buy n get m free","discount = m/(n + m) × 100 %",""]],
 c:["Profit and loss are on CP; discount is on MP.","Overhead / transport costs are added to CP."],
 tr:["Use multiplying factors: 20 % profit = ×6/5, 25 % discount = ×3/4. Chain them in one line.","Dishonest dealer + profit: final factor = (1 + p) × true/false weight."],
 tp:["Discount % is never calculated on CP.","Two successive 10 % discounts = 19 %, not 20 %."]},

{ id:"C7", g:"Arithmetic", t:"Simple & compound interest", hi:"साधारण और चक्रवृद्धि ब्याज", heat:2, t1:"1", t2:"1–2",
 ask:"CI − SI for 2/3 years, half-yearly compounding, doubling time, instalments, amount after n years.",
 f:[["Simple interest","SI = P × R × T/100; A = P + SI","",1],
  ["Compound amount","A = P(1 + R/100)ᵀ; CI = A − P","",1],
  ["CI − SI (2 years)","P(R/100)²","",1],
  ["CI − SI (3 years)","P(R/100)²(3 + R/100)","",1],
  ["Half-yearly / quarterly","rate R/2, time 2T / rate R/4, time 4T","",1],
  ["Effective rate, 2 years","2R + R²/100","10 % → 21 %",1],
  ["Different rates","A = P(1 + R₁/100)(1 + R₂/100)(1 + R₃/100)",""],
  ["SI doubling","doubles in T years → R = 100/T","",1],
  ["CI multiplying","becomes x times in n years → x² in 2n, x³ in 3n","",1],
  ["SI from two amounts","SI per year = (A₂ − A₁)/(T₂ − T₁)",""],
  ["CI from two amounts","R = (A₂/A₁ − 1) × 100 for consecutive years",""],
  ["Equal instalments (CI)","P = x/(1 + r) + x/(1 + r)² + … (r = R/100)",""]],
 c:["SI is the same every year; CI grows every year.","For 1 year with yearly compounding, CI = SI."],
 tr:["CI for 2 years at R % on P: use 2R + R²/100 as the total % (10 % → 21 %, 20 % → 44 %).","Fractional rates: 12.5 % = 1/8 → A/P = (9/8)ⁿ."],
 tp:["Half-yearly: change BOTH rate and time.","CI − SI for 3 years is not 3 × (CI − SI for 2 years)."]},

{ id:"C8", g:"Arithmetic", t:"Ratio, proportion & partnership", hi:"अनुपात, समानुपात और साझेदारी", heat:2, t1:"1", t2:"1",
 ask:"Combining ratios, mean/third/fourth proportional, incomes and savings, coins, partnership profit share.",
 f:[["Proportion","a : b = c : d ⇔ ad = bc","",1],
  ["Mean proportional","√(ab)","",1],
  ["Third proportional","b²/a","of a and b",1],
  ["Fourth proportional","bc/a","of a, b, c",1],
  ["Combine ratios","A:B = 2:3, B:C = 4:5 → A:B:C = 8:12:15","make B common",1],
  ["Duplicate / sub-duplicate","a² : b² / √a : √b",""],
  ["Componendo–dividendo","a/b = c/d ⇒ (a + b)/(a − b) = (c + d)/(c − d)","",1],
  ["Partnership","profit share ∝ capital × time","",1],
  ["Income–expenditure","saving = income − expenditure","",1],
  ["Adding x to both terms","(a + x)/(b + x) = c/d → solve for x",""]],
 c:["If incomes are a:b and expenditures c:d with savings S each, write 'a k − c m = S' for both and solve.","Working partner’s salary is paid first; the rest is split by capital × time."],
 tr:["Answer must make the units whole — test options with the ratio’s multiples.","Coins: value ratio = number ratio × denomination."],
 tp:["Partnership with capital changed midway: multiply each amount by its own months."]},

{ id:"C9", g:"Arithmetic", t:"Mixture & alligation", hi:"मिश्रण और एलिगेशन", heat:1, t1:"0–1", t2:"0–1",
 ask:"Ratio to mix two qualities, replacement of liquid, milk–water profit.",
 f:[["Alligation","cheaper qty : dearer qty = (dearer − mean) : (mean − cheaper)","",1],
  ["Repeated replacement","pure left = V(1 − x/V)ⁿ","x litres taken out n times",1],
  ["Mixing two mixtures","convert each to fraction of one component, then use alligation",""],
  ["Water to gain p % at CP","water : milk = p : 100",""]],
 c:["Alligation works for any average: prices, speeds, percentages, marks."],
 tr:["Draw the cross: cheaper and dearer on top, mean in the middle, differences diagonally."],
 tp:["The mean must lie between the two values; check the ratio order (cheaper first)."]},

{ id:"C10", g:"Arithmetic", t:"Average & ages", hi:"औसत और आयु", heat:2, t1:"1", t2:"1",
 ask:"Average after adding/removing a member, average speed, consecutive numbers, ages in ratio.",
 f:[["Average","sum ÷ number of items","",1],
  ["Consecutive numbers","average = (first + last)/2","",1],
  ["New member joins, average rises by d","new value = old average + (n + 1)d","",1],
  ["Member replaced, average rises by d","new person = old person + n·d","",1],
  ["Average speed (equal distances)","2xy/(x + y)","",1],
  ["Three equal distances","3xyz/(xy + yz + zx)",""],
  ["First n naturals / odds / evens","(n + 1)/2 / n / n + 1",""],
  ["Ages","n years ago each age falls by n; ratio method with ‘k’",""]],
 c:["If every value rises by k, the average rises by k; if multiplied by k, the average is multiplied by k.","Average of an AP = average of first and last term."],
 tr:["Deviation method: pick an assumed average, add the deviations, divide."],
 tp:["Average speed is not (x + y)/2 unless the TIMES are equal."]},

{ id:"C11", g:"Arithmetic", t:"Time & work, pipes & cisterns", hi:"समय और कार्य, नल और टंकी", heat:2, t1:"1", t2:"1",
 ask:"Together/alone, efficiency, M-D-H rule, alternate days, leaks, wages.",
 f:[["Together (two)","ab/(a + b) days","",1],
  ["Together (three)","abc/(ab + bc + ca)","",1],
  ["LCM method","total work = LCM of days; efficiency = work ÷ days","",1],
  ["Man-days","M₁D₁H₁/W₁ = M₂D₂H₂/W₂","",1],

const APP = { key:"maths_formula_book_v1" };

const $ = (s, r=document) => r.querySelector(s);

const plain = s => String(s).replace(/<[^>]+>/g, "");

let S = { les:{} };

const isDone = id => !!(S.les[id] && S.les[id].done);

function renderTop(){
  const n = CH.filter(c => isDone(c.id)).length;
  const stars = CH.reduce((a,c) => a + (c.f||[]).filter(r => r[3]).length, 0);
  $("#topstat").innerHTML = `<b>${n}</b>/${CH.length} revised<br><b>${stars}</b> key formulas`;
}

let TAB = "book";
function go(tab){
  TAB = tab;
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.tab===tab ? "page" : "false"));
  if (tab === "book") renderBook();
  if (tab === "heat") renderHeat();
  if (tab === "tricks") renderTricks();
  if (tab === "sheet") renderSheet();
  window.scrollTo(0,0);
  try { history.replaceState(null, "", "#"+tab); } catch(e) {}
}
document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));

const flames = h => `<span class="heatb" title="Exam frequency">${"🔥".repeat(h||1)}</span>`;

  const done = CH.filter(c => isDone(c.id)).length;

function drawList(){
  const box = $("#res"), q = Q.trim().toLowerCase();
  if (q) {
    const hits = [];
    CH.forEach(c => {
      (c.f||[]).forEach(r => { if ((r[0]+" "+plain(r[1])+" "+(r[2]||"")+" "+c.t).toLowerCase().includes(q)) hits.push({c, h:`<div class="fcard"><span class="fn">${r[0]}</span><span class="fx">${r[1]}</span>${r[2]?`<span class="fnote">${r[2]}</span>`:""}</div>`}); });
      (c.c||[]).concat(c.tr||[], c.tp||[]).forEach(t => { if (plain(t).toLowerCase().includes(q)) hits.push({c, h:`<div class="plain"><p>${t}</p></div>`}); });
    });
    box.innerHTML = hits.length ? `<p class="muted">${hits.length} match${hits.length>1?"es":""}</p>` + hits.slice(0,60).map(x => `<div class="block"><button type="button" class="back" data-open="${x.c.id}">Ch ${CNUM(x.c.id)} · ${esc(x.c.t)} ›</button>${x.h}</div>`).join("")

    box.innerHTML = GROUPS.map(g => {
      const list = CH.filter(c => c.g === g);
      return `<div class="stack" style="gap:8px"><h2 class="grp">${g}</h2><div class="lessons">${list.map(c => `<button type="button" class="les ${isDone(c.id)?"done":""}" data-open="${c.id}">

  }
  box.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openLesson(b.dataset.open)));

  return `<article class="stack chap" id="ch-${c.id}">
    <div class="stack" style="gap:6px"><span class="eyebrow">Chapter ${i} of ${CH.length} · ${c.g}</span><h1>${esc(c.t)}</h1><span class="muted">${c.hi}</span></div>
    <div class="hot"><span class="lab">🔥 Exam radar ${"🔥".repeat(c.heat)}</span><b>Tier 1:</b> ${c.t1} · <b>Tier 2:</b> ${c.t2} questions. ${c.ask}</div>
    ${(c.f||[]).length ? `<div class="block"><h3>Formulas <span class="muted" style="font-weight:400;font-size:13px">★ = last-hour sheet</span></h3><div class="fgrid">${c.f.map(r=>`<div class="fcard${r[3]?" star":""}"><span class="fn">${r[3]?"★ ":""}${r[0]}</span><span class="fx">${r[1]}</span>${r[2]?`<span class="fnote">${r[2]}</span>`:""}</div>`).join("")}</div></div>` : ""}
    ${(c.tb||[]).map(t => `<div class="block"><h3>${t.title}</h3><div class="tbl"><table><thead><tr>${t.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`).join("")}
    ${(c.c||[]).length ? `<div class="block"><h3>Key concepts</h3><ul class="pts">${c.c.map(x=>`<li>${x}</li>`).join("")}</ul></div>` : ""}
    ${(c.tr||[]).map(x => `<div class="trick"><span class="lab">Trick</span>${x}</div>`).join("")}

    ${full ? "" : `<div class="row between">
      <button class="btn" type="button" data-nav="${i-2}" ${i===1?"disabled":""}>‹ Previous</button>

function openLesson(id){
  const c = C(id); if (!c) return;
  TAB = "book";
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.tab==="book" ? "page" : "false"));
  $("#app").innerHTML = `<section class="view stack"><button type="button" class="back" id="bk">‹ All chapters</button>${chapterHTML(c)}</section>`;
  $("#bk").onclick = () => go("book");
  $("#mark").onclick = () => { S.les[c.id] = isDone(c.id) ? {done:0} : {done:1, at:Date.now()}; if (!S.les[c.id].done) delete S.les[c.id]; save(); renderTop(); openLesson(c.id); };
  $("#app").querySelectorAll("[data-nav]").forEach(b => b.onclick = () => openLesson(CH[+b.dataset.nav].id));
  window.scrollTo(0,0);
}
function renderAll(){
  $("#app").innerHTML = `<section class="view stack"><div class="row between"><button type="button" class="back" id="bk">‹ All chapters</button><button class="btn sm" type="button" id="pr">Print / save PDF</button></div>
    <div class="hero"><span class="eyebrow">Full book</span><h1>SSC Maths formula book</h1><p>All ${CH.length} chapters on one page. Use your browser’s print to keep a PDF copy.</p></div>

  $("#pr").onclick = () => window.print();

}

  $("#app").innerHTML = `<section class="view stack">
    <div class="stack" style="gap:6px"><span class="eyebrow">Speed and accuracy</span><h1>Tricks & traps</h1></div>
    <div class="seg" role="tablist"><button type="button" role="tab" data-tt="trick" aria-selected="${TT==="trick"}">Tricks (${CH.reduce((a,c)=>a+(c.tr||[]).length,0)})</button><button type="button" role="tab" data-tt="trap" aria-selected="${TT==="trap"}">Traps (${CH.reduce((a,c)=>a+(c.tp||[]).length,0)})</button></div>
    ${items.map(x => `<div class="${TT}"><span class="lab">${esc(x.c.t)}</span>${x.h}</div>`).join("")}
  </section>`;
  $("#app").querySelectorAll("[data-tt]").forEach(b => b.onclick = () => { TT = b.dataset.tt; renderTricks(); });
}

/* ---------- last-hour sheet ---------- */
function renderSheet(){
  $("#app").innerHTML = `<section class="view stack">
    <div class="row between"><div class="stack" style="gap:6px"><span class="eyebrow">Night before the exam</span><h1>Last-hour sheet</h1></div><button class="btn sm" type="button" id="pr">Print</button></div>
    <p class="muted">Only the ★ formulas from every chapter, one line each. If you can say each one without looking, you are ready.</p>
    ${CH.filter(c => (c.f||[]).some(r=>r[3])).map(c => `<div class="block"><h3><button type="button" class="linkbtn" data-open="${c.id}">${esc(c.t)} ›</button></h3><dl class="sheet">${c.f.filter(r=>r[3]).map(r=>`<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join("")}</dl></div>`).join("")}
    <div class="block"><h3>Must-know values</h3><p class="muted">Squares to 30, cubes to 20, fractions as percentages, √2 = 1.414, √3 = 1.732, √5 = 2.236 and the triplets 3-4-5, 5-12-13, 7-24-25, 8-15-17 — see chapter 1.</p></div>
  </section>`;
  $("#pr").onclick = () => window.print();
  $("#app").querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openLesson(b.dataset.open)));
}

/* boot */
renderTop();
const start = (location.hash||"").replace("#","");
go(["book","heat","tricks","sheet"].includes(start) ? start : "book");
</script>

(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();
</script>

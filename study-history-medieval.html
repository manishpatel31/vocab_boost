<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>

<title>Medieval India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Shared by every History page (built by tools/history/build.js).
   Layout: a manuscript folio — parchment paper, maroon ink, gold figures; one-column app with a bottom tab bar. */
:root{
  --paper:#f3efe4; --sheet:#fffdf6; --sunk:#e8e1cf;
  --ink:#241c14; --ink2:#5d5141; --rule:#d8cdb4;
  --blue:#7a2230; --on-blue:#ffffff; --blue-bg:#f4e2e1;
  --accent:#9a6a12; --accent-bg:#f8ecc9;
  --good:#1b6b4a; --good-bg:#ddefe4; --bad:#a8291f; --bad-bg:#f8e0dc;
  --warn-bg:#fcf0cf;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* era groups on the Learn screen */
.eras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.erac{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:grid;gap:6px}
.erac b{font-family:var(--f-display);font-size:15px;font-weight:700;line-height:1.25}
.erac .hi{font-size:12px;color:var(--ink2)}
.erac .mt{font-family:var(--f-num);font-size:11px;color:var(--ink2)}
.erac .meter{height:6px}
.erac[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.grph{display:flex;align-items:baseline;gap:8px;padding:14px 2px 4px;border-top:2px solid var(--ink);margin-top:4px}
.grph h2{font-size:17px}
.grph span{font-size:12px;color:var(--ink2);margin-left:auto;font-family:var(--f-num)}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}
.dots{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--rule);display:block}
.dots i.on{background:var(--accent)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.hot{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px;font-size:15px}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.facts.prose dd{font-weight:400;line-height:1.55}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap,.link{border-radius:var(--r);padding:12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.link{background:var(--sunk);border-color:transparent}
.trick .lab,.trap .lab,.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.link .lab{color:var(--ink2)}
.mn{font-family:var(--f-num);font-weight:600;background:var(--sheet);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.tag.src{background:var(--good-bg);color:var(--good)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:22px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
/* one-line revision rows (last week / last moment) */
.lines{display:grid;gap:0}
.lines div{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px dashed var(--rule);font-size:15px}
.lines div:first-child{border-top:0}
.lines b{font-weight:700}
.lines span{color:var(--ink2)}
.callout{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;font-size:15px}

/* plan maker */
.plancfg{display:grid;gap:12px}
.pday{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.pday > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pday > summary::-webkit-details-marker{display:none}
.pday .dno{font-family:var(--f-num);font-weight:700;font-size:13px;background:var(--sunk);border-radius:99px;padding:2px 10px;white-space:nowrap}
.pday.cur .dno{background:var(--blue);color:var(--on-blue)}
.pday.allgood .dno{background:var(--good-bg);color:var(--good)}
.pday .dt{min-width:0;font-weight:600;font-size:15px}
.pday .dt small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
.pday .dp{font-family:var(--f-num);font-size:12px;color:var(--ink2);white-space:nowrap}
.pday .body{padding:0 14px 12px;display:grid;gap:8px;border-top:1px dashed var(--rule);margin-top:2px;padding-top:10px}
.ptask{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;width:100%;font-size:15px}
.ptask .box{width:22px;height:22px;border-radius:6px;border:1.6px solid var(--rule);display:grid;place-items:center;font-size:14px;color:var(--on-blue);margin-top:1px}
.ptask[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.ptask[aria-pressed="true"] .lbl{text-decoration:line-through;color:var(--ink2)}
.ptask .lbl small{display:block;font-size:12px;color:var(--ink2);text-decoration:none}
/* the story first: plain-language opener for beginners */
.story{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;font-size:16.5px;line-height:1.65}
.story .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.story p{margin:0}
.story .key{background:var(--blue-bg);border-radius:8px;padding:8px 12px;font-size:15px;line-height:1.5}
.story .key b{color:var(--blue)}
/* hub: app cards and the beginner path */
.appcs{display:grid;gap:12px}
.appc{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;text-align:left;width:100%;cursor:pointer}
.appc:hover{border-color:var(--blue)}
.appc .hd{display:flex;align-items:center;gap:10px}
.appc .ic{font-size:26px;line-height:1}
.appc .hd b{font-family:var(--f-display);font-size:17px;font-weight:700;display:block}
.appc .hd small{font-size:12px;color:var(--ink2)}

{"id":"L9","g":"med","heat":2,"title":"Arab & Turkish invasions","hi":"अरब एवं तुर्क आक्रमण","blocks":[{"k":"hot","h":"Short but certain: 712 Sindh, Mahmud of Ghazni's 17 raids and Somnath, and the <b>three battles of Tarain<\/b> with their years and winners."},{"k":"story","h":"<p>India's wealth drew attention from the west. In 712 CE an Arab general, <b>Muhammad bin Qasim<\/b>, conquered Sindh by defeating Raja Dahir. But the Arabs did not push further in. The bigger push came about 300 years later, from Turks based in Afghanistan.<\/p><p><b>Mahmud of Ghazni<\/b> raided India 17 times between 1000 and 1027. He was not trying to rule India; he wanted its riches. Temples held great treasure, so he looted them, including Somnath in 1025, and carried the wealth home. A scholar who came with him, Al-Beruni, wrote a careful book about India. The kings of the north were brave, but they were divided and rarely stood together.<\/p><p>Then came <b>Muhammad Ghori<\/b>, who wanted land, not just loot. At Tarain in 1191 he was beaten by the Rajput king <b>Prithviraj Chauhan<\/b>. He came back the next year, 1192, and won. In 1194 he defeated Jaichand of Kannauj at Chandawar. When Ghori died in 1206, his slave-general Qutb-ud-din Aibak stayed on and founded the Delhi Sultanate. So raids for treasure slowly turned into rule. The timeline shows each step with its year.<\/p>","key":"Arabs took Sindh, Mahmud raided for wealth, and Ghori's win at Tarain in 1192 turned raids into lasting Turkish rule."},{"k":"tl","title":"How the Turks came in","rows":[["<b>712 CE<\/b>","<b>Muhammad bin Qasim<\/b> conquers <b>Sindh<\/b>, defeating Raja Dahir — the first Arab conquest. Sindh is called \"the gateway of Islam in India\"; Chachnama records it"],["1000–1027","<b>Mahmud of Ghazni<\/b> raids India <b>17 times<\/b>; sacked <b>Somnath (1025)<\/b>; brought <b>Al-Beruni<\/b>, who wrote <i>Kitab-ul-Hind / Tahqiq-i-Hind<\/i>; Firdausi (<i>Shahnama<\/i>) was his court poet"],["1191","<b>First Battle of Tarain<\/b> — <b>Prithviraj Chauhan beats Muhammad Ghori<\/b>"],["1192","<b>Second Battle of Tarain<\/b> — <b>Ghori beats Prithviraj Chauhan<\/b>; the real foundation of Turkish rule"],["1194","<b>Battle of Chandawar<\/b> — Ghori beats <b>Jaichand<\/b> of Kannauj"],["1206","Ghori dies; his slave <b>Qutb-ud-din Aibak<\/b> founds the Delhi Sultanate"]]},{"k":"trick","h":"<b>Tarain<\/b> — \"<b>First to Prithviraj, Second to the Sultan<\/b>\": 1191 → <b>P<\/b>rithviraj wins; 1192 → <b>G<\/b>hori wins. One digit apart, opposite results.<br>Also: <span class=\"mn\">1191-1192-1194<\/span> = Tarain I, Tarain II, Chandawar — three straight."},{"k":"facts","title":"Also asked","rows":[["Prithviraj Raso","By <b>Chand Bardai<\/b> — on Prithviraj Chauhan"],["Taj-ul-Maasir","By <b>Hasan Nizami<\/b> — first official history of the Sultanate"],["Tabaqat-i-Nasiri","By <b>Minhaj-us-Siraj<\/b>"],["Al-Beruni","Came with Mahmud of Ghazni; \"first anthropologist of India\""],["Bakhtiyar Khalji","Conquered Bihar &amp; Bengal; destroyed <b>Nalanda<\/b> (1193)"]]}],"sum":["712 CE: Muhammad bin Qasim conquers Sindh (beat Raja Dahir).","Mahmud of Ghazni: 17 raids, sacked Somnath 1025; brought Al-Beruni (Kitab-ul-Hind).","Tarain I 1191 — Prithviraj wins. Tarain II 1192 — Ghori wins. Chandawar 1194 — Ghori beats Jaichand.","Prithviraj Raso by Chand Bardai. Nalanda destroyed by Bakhtiyar Khalji, 1193."]},
{"id":"L10","g":"med","heat":3,"title":"Delhi Sultanate I — Slave & Khalji","hi":"दिल्ली सल्तनत · गुलाम एवं ख़िलजी","blocks":[{"k":"hot","h":"Heavily asked. Fix in your head: who built Qutub Minar vs who finished it, Iltutmish's <i>Iqta<\/i> and coins, Razia as the <b>only woman<\/b> Sultan, Balban's <i>Sijda<\/i>/<i>Paibos<\/i>, and Alauddin Khalji's market control + <b>first permanent standing army<\/b>."},{"k":"story","h":"<p>In 1206 Muhammad Ghori's slave-general <b>Qutb-ud-din Aibak<\/b> became the first Sultan of Delhi. For the next 320 years five dynasties ruled from Delhi: Slave, Khalji, Tughlaq, Sayyid and Lodi. This lesson covers the first two. Aibak ruled from Lahore and began the Qutub Minar, but he died within a few years, after a fall while playing polo.<\/p><p>The real builder of the Sultanate was <b>Iltutmish<\/b>. He moved the capital to Delhi, finished the Qutub Minar, issued silver and copper coins, and paid his officers with iqtas (land whose tax they could collect instead of a salary). His daughter <b>Razia<\/b> became the only woman ever to rule Delhi. Later Balban crushed the proud group of forty nobles and taught that the king was the shadow of God, making people bow and kiss his feet.<\/p><p>The Khaljis took over in 1290. <b>Alauddin Khalji<\/b> faced repeated Mongol attacks, so he needed a big army all the time. To pay for it cheaply, he fixed market prices, paid soldiers in cash, branded horses to stop cheating, and raised land tax to half the crop. His general Malik Kafur led campaigns deep into the south. The tables go ruler by ruler, so you can match each reform to the right Sultan.<\/p>","key":"Iltutmish built the Sultanate's system, Balban made the Sultan feared, and Alauddin fixed prices to pay a big army against the Mongols."},{"k":"table","title":"Five dynasties of the Delhi Sultanate (1206–1526)","head":["Dynasty","Years","Founder","Last ruler"],"rows":[["<b>Slave / Mamluk / Ilbari<\/b>","1206–1290","Qutb-ud-din Aibak","Kayumars (Shamsuddin)"],["<b>Khalji<\/b>","1290–1320","Jalal-ud-din Khalji","Khusrau Khan"],["<b>Tughlaq<\/b>","1320–1414","Ghiyas-ud-din Tughlaq","Nasir-ud-din Mahmud"],["<b>Sayyid<\/b>","1414–1451","Khizr Khan","Alam Shah"],["<b>Lodi<\/b>","1451–1526","Bahlol Lodi","Ibrahim Lodi"]]},{"k":"trick","h":"<b>Five dynasties in order<\/b> — <span class=\"mn\">SKTSL<\/span> = \"<b>S<\/b>lave <b>K<\/b>ings <b>T<\/b>ook <b>S<\/b>ultanate's <b>L<\/b>and\": Slave, Khalji, Tughlaq, Sayyid, Lodi."},{"k":"facts","title":"Slave dynasty — ruler by ruler","rows":[["<b>Qutb-ud-din Aibak<\/b> (1206–10)","Founder; capital <b>Lahore<\/b>; began the <b>Qutub Minar<\/b> (for Khwaja Qutbuddin Bakhtiyar Kaki) and built <b>Quwwat-ul-Islam mosque<\/b> &amp; <b>Adhai Din ka Jhonpra<\/b> (Ajmer); called <b>Lakh Baksh<\/b> (giver of lakhs); died playing <i>chaugan<\/i> (polo) at Lahore"],["<b>Aram Shah<\/b> (1210–11)","Weak; removed"],["<b>Iltutmish<\/b> (1211–36)","Real consolidator; shifted capital to <b>Delhi<\/b>; <b>completed the Qutub Minar<\/b>; started the <b>Iqta<\/b> system; issued the silver <b>Tanka<\/b> and copper <b>Jital<\/b>; created the <b>Turkan-i-Chahalgani<\/b> (corps of forty); got the <i>khilat<\/i> (letter of recognition) from the Caliph in 1229; built Hauz-i-Shamsi &amp; Sultan Ghari (first Islamic mausoleum in India)"],["<b>Razia Sultan<\/b> (1236–40)","<b>Only woman<\/b> to rule Delhi; raised Jamal-ud-din Yaqut; killed near Kaithal"],["<b>Balban<\/b> (1266–87)","Crushed the Chahalgani; theory of <b>kingship as divine<\/b> — titles <b>Zil-i-Ilahi<\/b> (shadow of God) and <b>Niyabat-i-Khudai<\/b>; court customs <b>Sijda<\/b> (prostration) &amp; <b>Paibos<\/b> (kissing the feet); Persian <b>Nauroz<\/b> festival; policy of \"blood and iron\"; set up the <b>Diwan-i-Arz<\/b> (military department); poet <b>Amir Khusrau<\/b> began here"],["<b>Kaiqubad / Kayumars<\/b>","End of the dynasty, 1290"]]},{"k":"facts","title":"Khalji dynasty","rows":[["<b>Jalal-ud-din Khalji<\/b> (1290–96)","Founder; mild policy"],["<b>Alauddin Khalji<\/b> (1296–1316)","Title <b>Sikandar-i-Sani<\/b> (Second Alexander); the strongest Sultan"],["Market control","Four separate markets &amp; the <i>Diwan-i-Riyasat<\/i> under <b>Shahna-i-Mandi<\/b>; fixed prices; <b>first to pay soldiers in cash<\/b>"],["Army","<b>First permanent standing army<\/b> in India; branding of horses (<b>dagh<\/b>) and descriptive muster roll (<b>huliya/chehra<\/b>)"],["Revenue","Land measured (<b>zabti<\/b>); tax raised to <b>50% of produce<\/b>; taxes on grazing (<i>charai<\/i>) and houses (<i>ghari<\/i>)"],["Conquests","Gujarat, Ranthambore, Chittor (1303), Malwa, Devagiri, Warangal, Madurai — south campaigns led by <b>Malik Kafur<\/b>"],["Mongols","Repeatedly defeated them; built the <b>Siri fort<\/b> and <b>Alai Darwaza<\/b>; Hauz Khas"],["Court","<b>Amir Khusrau<\/b> (\"Parrot of India\", <i>Tuti-i-Hind<\/i>); <b>Barani<\/b>'s <i>Tarikh-i-Firozshahi<\/i> describes his reign"]]},{"k":"trap","h":"Qutub Minar: <b>begun<\/b> by Aibak, <b>completed<\/b> by Iltutmish, <b>repaired<\/b> by Firoz Shah Tughlaq after lightning. Aibak's capital was <b>Lahore<\/b>, Iltutmish moved it to <b>Delhi<\/b>. The <b>Iqta<\/b> system is Iltutmish's, the <b>market control<\/b> is Alauddin's, the <b>token currency<\/b> is Muhammad bin Tughlaq's — never mix these three."}],"sum":["Dynasties SKTSL: Slave (1206) → Khalji (1290) → Tughlaq (1320) → Sayyid (1414) → Lodi (1451–1526).","Aibak: founder, capital Lahore, began Qutub Minar, built Quwwat-ul-Islam & Adhai Din ka Jhonpra, called Lakh Baksh.","Iltutmish: capital Delhi, completed Qutub Minar, Iqta system, silver Tanka & copper Jital, Chahalgani.","Razia Sultan — the only woman ruler of Delhi. Balban: Zil-i-Ilahi, Sijda & Paibos, blood and iron, Diwan-i-Arz.","Alauddin Khalji: Sikandar-i-Sani, market control under Shahna-i-Mandi, first permanent standing army, dagh & huliya, tax at 50%; Malik Kafur led the southern campaigns."]},
{"id":"L11","g":"med","heat":3,"title":"Delhi Sultanate II — Tughlaq to Lodi","hi":"तुग़लक़ से लोदी","blocks":[{"k":"hot","h":"Muhammad bin Tughlaq's \"five failed experiments\" and Firoz Shah's canals/jizya are repeat favourites. Also: who shifted the capital where, who was called a mixture of opposites, and the end of the Sultanate in 1526."},{"k":"story","h":"<p>The Tughlaqs came to power in 1320. <b>Muhammad bin Tughlaq<\/b> was clever and learned, but his bold plans kept failing. He moved the capital from Delhi to Devagiri, renamed Daulatabad, and then back again. He issued cheap brass and copper coins to be used like silver, but people forged them at home and the plan collapsed. He raised taxes in the Doab during a famine, and people rebelled. A historian called him a mixture of opposites. The Moroccan traveller Ibn Battuta saw his rule.<\/p><p>The next Sultan, <b>Firoz Shah Tughlaq<\/b>, chose a calmer path. He dug canals, built towns like Hisar and Jaunpur, and set up departments for charity and slaves. But he also made iqtas hereditary, and the Sultan's grip loosened. In 1398 the Central Asian conqueror <b>Timur<\/b> sacked Delhi, and the Sultanate never fully recovered.<\/p><p>Two short dynasties followed. Khizr Khan, Timur's deputy, founded the Sayyids. The Lodis were the first Afghan rulers of Delhi; Sikandar Lodi founded Agra. The last Sultan, <b>Ibrahim Lodi<\/b>, was defeated and killed by Babur at the First Battle of Panipat in 1526. That ended the Sultanate. The tables list each Sultan's work and the Sultanate's departments.<\/p>","key":"Muhammad bin Tughlaq's failed experiments and Timur's raid of 1398 weakened Delhi until Babur ended the Sultanate at Panipat in 1526."},{"k":"facts","title":"Tughlaq dynasty (1320–1414)","rows":[["<b>Ghiyas-ud-din Tughlaq<\/b> (1320–25)","Founder; built <b>Tughlaqabad<\/b>; died when a pavilion collapsed at Afghanpur"],["<b>Muhammad bin Tughlaq<\/b> (1325–51)","The learned but unlucky Sultan — Barani called him \"a mixture of opposites\"; <b>Ibn Battuta<\/b> (Morocco) visited and was made Qazi of Delhi (<i>Rehla<\/i>)"],["Experiment 1","Shifted the capital from Delhi to <b>Devagiri → renamed Daulatabad<\/b> (1327), then back"],["Experiment 2","<b>Token currency<\/b> of brass/copper (1329–30) at the value of silver — forged everywhere, withdrawn"],["Experiment 3","Raised taxes in the <b>Doab<\/b> during a famine — rebellion"],["Experiment 4","Khurasan &amp; Qarachil (Kumaon) expeditions — both failed"],["Experiment 5","Created the <b>Diwan-i-Kohi<\/b> — a department of agriculture to extend cultivation"],["<b>Firoz Shah Tughlaq<\/b> (1351–88)","Built <b>Firozabad, Fatehabad, Hisar, Jaunpur<\/b>; dug <b>five canals<\/b> (largest from Yamuna to Hisar); set up the <b>Diwan-i-Khairat<\/b> (charity) and <b>Diwan-i-Bandagan<\/b> (slaves); <b>first to levy jizya on Brahmins<\/b>; made iqtas hereditary; wrote <i>Futuhat-i-Firozshahi<\/i>; shifted two Ashokan pillars to Delhi; repaired the Qutub Minar"],["<b>1398<\/b>","<b>Timur<\/b> invades and sacks Delhi under Nasir-ud-din Mahmud Shah"]]},{"k":"trick","h":"<b>MBT's failures<\/b> — <span class=\"mn\">CAT-DD<\/span>: <b>C<\/b>apital shift, <b>A<\/b>griculture dept (Diwan-i-Kohi), <b>T<\/b>oken currency, <b>D<\/b>oab taxes, <b>D<\/b>istant campaigns (Khurasan/Qarachil).<br><b>Firoz = Farmer<\/b> → canals, gardens, towns. <b>MBT = Money<\/b> → token currency."},{"k":"facts","title":"Sayyid & Lodi","rows":[["<b>Khizr Khan<\/b> (1414)","Founded the Sayyid dynasty; Timur's deputy, never took the title Sultan"],["<b>Bahlol Lodi<\/b> (1451)","Founded the Lodi dynasty — the <b>first Afghan<\/b> dynasty of Delhi"],["<b>Sikandar Lodi<\/b> (1489–1517)","Founded <b>Agra (1504)<\/b> and shifted the capital there; introduced the <b>Gaz-i-Sikandari<\/b> (yard) for measuring land; wrote under the pen name <i>Gulrukhi<\/i>"],["<b>Ibrahim Lodi<\/b> (1517–26)","Lost the <b>First Battle of Panipat (21 April 1526)<\/b> to <b>Babur<\/b> — the only Delhi Sultan killed on the battlefield"]]},{"k":"facts","title":"Sultanate administration — the exam words","rows":[["Diwan-i-Wizarat","Finance, under the <b>Wazir<\/b>"],["Diwan-i-Arz","Military (Balban)"],["Diwan-i-Insha","Royal correspondence"],["Diwan-i-Risalat","Religious / appeals &amp; foreign affairs"],["Diwan-i-Kohi","Agriculture (Muhammad bin Tughlaq)"],["Diwan-i-Khairat","Charity (Firoz Shah)"],["Diwan-i-Bandagan","Slaves (Firoz Shah)"],["Diwan-i-Mustakharaj","Arrears of revenue (Alauddin Khalji)"],["Iqta","Land assignment for salary; holder = <b>Iqtadar / Muqti<\/b>"],["Khalisa","Land kept directly under the crown"],["Kharaj","Land tax on Muslims (1/3 to 1/2); <b>Jizya<\/b> = tax on non-Muslims; <b>Zakat<\/b> = 2.5% on Muslims; <b>Khums<\/b> = 1/5 share of war booty"],["Barid / Munhiyan","Intelligence officers / news-writers"]]},{"k":"trap","h":"Token currency = <b>Muhammad bin Tughlaq<\/b>, not Firoz Shah. Capital at <b>Daulatabad<\/b> = Muhammad bin Tughlaq; capital at <b>Agra<\/b> = Sikandar Lodi. Firoz Shah was the <b>first to charge jizya from Brahmins<\/b> — jizya itself existed earlier. Timur invaded in <b>1398<\/b>, not 1526; Babur came in 1526."}],"sum":["Ghiyas-ud-din built Tughlaqabad. Muhammad bin Tughlaq: capital to Daulatabad, token currency, Doab tax rise, Khurasan/Qarachil, Diwan-i-Kohi; Ibn Battuta visited.","Firoz Shah Tughlaq: five canals, Firozabad/Hisar/Jaunpur, Diwan-i-Khairat & Diwan-i-Bandagan, first to take jizya from Brahmins, wrote Futuhat-i-Firozshahi.","Timur invaded Delhi in 1398. Khizr Khan founded the Sayyid dynasty (1414); Bahlol Lodi the Lodi (1451) — first Afghan dynasty.","Sikandar Lodi founded Agra (1504) and introduced Gaz-i-Sikandari. Ibrahim Lodi died at the First Battle of Panipat, 21 April 1526.","Departments: Wizarat (finance), Arz (army), Insha (letters), Risalat (religion), Kohi (agriculture), Khairat (charity), Bandagan (slaves)."]},
{"id":"L12","g":"med","heat":2,"title":"Vijayanagara, Bahmani & regional kingdoms","hi":"विजयनगर · बहमनी · क्षेत्रीय राज्य","blocks":[{"k":"hot","h":"Krishnadeva Raya + the Battle of Talikota are near-certain; add the foreign travellers who visited Vijayanagara and the \"who built which regional monument\" line."},{"k":"story","h":"<p>While Delhi was weakening in the 14th century, new kingdoms rose in the south. In 1336 the brothers <b>Harihara and Bukka<\/b> founded Vijayanagara on the Tungabhadra river, with its capital at Hampi. In 1347 Alauddin Hasan Bahman Shah founded the <b>Bahmani<\/b> kingdom just to the north. For nearly two hundred years these two neighbours fought each other.<\/p><p>Vijayanagara reached its peak under <b>Krishnadeva Raya<\/b> (1509 to 1529). He was a warrior, a poet in Telugu and a temple builder. Foreign visitors, like the Portuguese Domingo Paes, wrote about the city's wealth. The Bahmani kingdom had a great minister, <b>Mahmud Gawan<\/b>, but after he was executed on a false charge the kingdom broke into five sultanates: Bijapur, Ahmadnagar, Golconda, Berar and Bidar.<\/p><p>These five sultanates usually quarrelled among themselves. But in 1565 they joined hands against Vijayanagara and crushed it at the <b>Battle of Talikota<\/b>. Their own monuments still stand, like the Gol Gumbaz at Bijapur and the Charminar at Hyderabad. Elsewhere, regional rulers such as Rana Kumbha of Mewar and Zain-ul-Abidin of Kashmir ran their own states. The tables sort these kingdoms, their rulers and their buildings.<\/p>","key":"Vijayanagara and the Bahmanis fought for two centuries; the Bahmanis split into five sultanates, which together broke Vijayanagara at Talikota in 1565."},{"k":"facts","title":"Vijayanagara (1336–1646)","rows":[["Founded","<b>1336<\/b> by <b>Harihara I &amp; Bukka Raya<\/b> (Sangama dynasty) on the <b>Tungabhadra<\/b>; capital <b>Hampi<\/b> — UNESCO site"],["Four dynasties","<b>Sangama → Saluva → Tuluva → Aravidu<\/b>"],["<b>Krishnadeva Raya<\/b> (1509–29)","Greatest ruler, Tuluva dynasty; wrote <b><i>Amuktamalyada<\/i><\/b> in Telugu; patron of the <b>Ashtadiggajas<\/b> (eight Telugu poets, incl. Allasani Peddana); built the <b>Vittalaswamy<\/b> &amp; <b>Hazara Rama<\/b> temples; Portuguese envoy <b>Domingo Paes<\/b> at his court"],["<b>Battle of Talikota / Rakshasa-Tangadi<\/b>","<b>1565<\/b> — the Deccan sultanates crushed Vijayanagara under <b>Ramaraya<\/b> (Aravidu)"],["Travellers who came","<b>Nicolo Conti<\/b> (Italian, Devaraya I), <b>Abdur Razzaq<\/b> (Persian, Devaraya II), <b>Domingo Paes<\/b> &amp; <b>Nuniz<\/b> (Portuguese), <b>Athanasius Nikitin<\/b> (Russian, Bahmani)"],["Administration","Province = <b>Mandalam/Rajya<\/b> under a Nayaka; the <b>Amara-nayaka<\/b> (military fief) system; gold coin = <b>Varaha / Pagoda<\/b>"]]},{"k":"facts","title":"Bahmani kingdom (1347–1526)","rows":[["Founded","<b>1347<\/b> by <b>Alauddin Hasan Bahman Shah<\/b> (Hasan Gangu); capital <b>Gulbarga<\/b>, later <b>Bidar<\/b>"],["Great minister","<b>Mahmud Gawan<\/b> — built the Madrasa at Bidar; executed on a false charge, after which the kingdom broke up"],["Broke into five","<b>Bijapur (Adil Shahi), Golconda (Qutb Shahi), Ahmadnagar (Nizam Shahi), Berar (Imad Shahi), Bidar (Barid Shahi)<\/b>"],["Monuments","<b>Gol Gumbaz<\/b>, Bijapur (Muhammad Adil Shah) — one of the largest domes in the world; <b>Charminar<\/b>, Hyderabad (Quli Qutb Shah, 1591); <b>Ibrahim Rauza<\/b>, Bijapur"]]},{"k":"trick","h":"<b>Five Deccan sultanates<\/b> — <span class=\"mn\">BAGHB<\/span>: <b>B<\/b>ijapur, <b>A<\/b>hmadnagar, <b>G<\/b>olconda, <b>B<\/b>erar, <b>B<\/b>idar. Their houses: Adil, Nizam, Qutb, Imad, Barid.<br><b>Vijayanagara dynasties<\/b> — <span class=\"mn\">SA-SA-TU-AR<\/span>: Sangama, Saluva, Tuluva, Aravidu."},{"k":"table","title":"Other regional kingdoms","head":["Kingdom","Ruler to remember","For"],"rows":[["<b>Malwa<\/b> (Mandu)","Hoshang Shah","Jama Masjid, Hindola Mahal; Baz Bahadur &amp; Rupmati"],["<b>Gujarat<\/b>","Ahmad Shah I","Founded <b>Ahmedabad (1411)<\/b>; Mahmud Begarha built Champaner"],["<b>Jaunpur<\/b> (Sharqi)","Ibrahim Sharqi","Atala Masjid; a centre of learning — \"Shiraz of India\""],["<b>Bengal<\/b>","Alauddin Husain Shah","Patron of Bengali; Chaitanya's time"],["<b>Kashmir<\/b>","<b>Zain-ul-Abidin<\/b>","\"<b>Akbar of Kashmir<\/b>\"; abolished jizya, promoted shawl weaving &amp; papier-mâché"],["<b>Mewar<\/b>","<b>Rana Kumbha<\/b> (Vijaya Stambha, Chittor), <b>Rana Sanga<\/b>, <b>Maharana Pratap<\/b>","Rana Sanga lost at <b>Khanwa (1527)<\/b>; Pratap fought <b>Haldighati (1576)<\/b>"],["<b>Marwar<\/b>","Rao Jodha","Founded Jodhpur; Mehrangarh fort"],["<b>Amber<\/b>","Man Singh","Akbar's general"]]},{"k":"trap","h":"Talikota (<b>1565<\/b>) destroyed Vijayanagara — it is not a Mughal battle. Hampi and Vijayanagara are the <b>same city<\/b>. Charminar was built by <b>Quli Qutb Shah of Golconda<\/b>, not by a Mughal."}],"sum":["Vijayanagara founded 1336 by Harihara I & Bukka Raya at Hampi on the Tungabhadra; dynasties Sangama–Saluva–Tuluva–Aravidu.","Krishnadeva Raya (Tuluva) wrote Amuktamalyada and kept the Ashtadiggajas; Domingo Paes visited him. Battle of Talikota 1565 ended Vijayanagara's power.","Bahmani founded 1347 by Alauddin Hasan Bahman Shah; capital Gulbarga then Bidar; minister Mahmud Gawan; broke into BAGHB (Bijapur, Ahmadnagar, Golconda, Berar, Bidar).","Gol Gumbaz = Bijapur; Charminar = Quli Qutb Shah, 1591; Madrasa of Bidar = Mahmud Gawan.","Zain-ul-Abidin = 'Akbar of Kashmir'. Rana Kumbha built the Vijaya Stambha at Chittor."]},
{"id":"L13","g":"med","heat":2,"title":"Bhakti & Sufi movements","hi":"भक्ति एवं सूफ़ी आंदोलन","blocks":[{"k":"hot","h":"One sure question: saint ↔ place ↔ language ↔ guru. Learn the North/South split and who belongs to the <i>Nirguna<\/i> (formless) vs <i>Saguna<\/i> (with form) school."},{"k":"story","h":"<p>Imagine a time when worship meant costly rituals in Sanskrit, done by priests, and many people were kept out because of caste. The <b>Bhakti<\/b> movement said something simple: anyone can reach God through love and devotion, in their own language. It began in the Tamil south with the Alvars (devotees of Vishnu) and Nayanars (devotees of Shiva). Teachers like Shankaracharya and <b>Ramanuja<\/b> gave it a philosophy, and from the 13th century it spread north.<\/p><p>In the north, saints wrote songs that ordinary people could sing. Some, like <b>Kabir<\/b> and Guru Nanak, prayed to a God without form (Nirguna) and mocked empty ritual in every religion. Guru Nanak's teaching became Sikhism. Others, like Tulsidas, Surdas and Mirabai, loved God in a form, as Rama or Krishna (Saguna). Each wrote in a local language: Awadhi, Braj, Marathi, Kannada and more.<\/p><p>At the same time Muslim mystics called <b>Sufis<\/b> taught love of God, simple living and music. Their khanqahs (hospices) were open to all. The Chishti order, brought to Ajmer by Moinuddin Chishti, became the most popular in India. The tables link each saint to a place, a language and an idea.<\/p>","key":"Bhakti saints and Sufis both taught that love of God matters more than ritual or caste, and they taught it in the people's own languages."},{"k":"p","h":"<b>Bhakti<\/b> = devotion to a personal god, open to all castes, in the <b>people's language<\/b> rather than Sanskrit. It began in the south with the <b>Alvars<\/b> (devotees of Vishnu) and <b>Nayanars<\/b> (devotees of Shiva), and moved north from the 13th century."},{"k":"table","title":"Bhakti saints — the table that gets asked","head":["Saint","Place / language","Remember"],"rows":[["<b>Shankaracharya<\/b> (8th c.)","Kaladi, Kerala","<b>Advaita<\/b> (non-dualism); set up four mathas — Sringeri, Dwarka, Puri, Badrinath"],["<b>Ramanuja<\/b> (11th c.)","Sriperumbudur, TN","<b>Vishishtadvaita<\/b> (qualified non-dualism); teacher of the north Indian Bhakti stream"],["<b>Madhvacharya<\/b>","Karnataka","<b>Dvaita<\/b> (dualism)"],["<b>Nimbarka<\/b> / <b>Vallabhacharya<\/b>","—","Dvaitadvaita / <b>Shuddhadvaita<\/b>; Vallabha founded the <b>Pushtimarg<\/b>, Krishna devotion"],["<b>Ramananda<\/b>","Prayag/Banaras","First to bring Bhakti to the north in Hindi; guru of Kabir and Ravidas"],["<b>Kabir<\/b>","Banaras · Hindi (Sadhukkadi)","<b>Nirguna<\/b>; <i>Bijak<\/i>, dohas; verses in the Guru Granth Sahib; attacked ritual in both religions"],["<b>Guru Nanak<\/b> (1469–1539)","Talwandi/Nankana Sahib · Punjabi","Founder of <b>Sikhism<\/b>; <i>Japji<\/i>; \"<i>Ek Onkar<\/i>\""],["<b>Chaitanya Mahaprabhu<\/b>","Nadia, Bengal","Krishna bhakti, <b>kirtan<\/b> and sankirtan; Gaudiya Vaishnavism"],["<b>Mirabai<\/b>","Mewar · Rajasthani/Braj","Krishna devotion; <i>padas<\/i>"],["<b>Surdas<\/b>","Braj · Brajbhasha","<i>Sursagar<\/i>, <i>Sahitya Lahari<\/i>; blind poet of Krishna"],["<b>Tulsidas<\/b>","Awadh · Awadhi","<b><i>Ramcharitmanas<\/i><\/b>, <i>Vinaya Patrika<\/i>; Akbar's time"],["<b>Namdev<\/b> &amp; <b>Tukaram<\/b> &amp; <b>Eknath<\/b>","Maharashtra · Marathi","Varkari tradition; Tukaram was Shivaji's contemporary"],["<b>Jnaneshwar<\/b>","Maharashtra","<i>Jnaneshwari<\/i> — Marathi commentary on the Gita"],["<b>Basava<\/b>","Karnataka · Kannada","<b>Lingayat / Virashaiva<\/b> movement; <i>vachanas<\/i>"],["<b>Ravidas<\/b>","Banaras","Nirguna; against caste"],["<b>Dadu Dayal<\/b> / <b>Shankaradeva<\/b>","Rajasthan / Assam","Dadu-panth; Shankaradeva began <b>Vaishnavism in Assam<\/b>, Borgeet &amp; Sattriya"],["<b>Andal<\/b>","Tamil Nadu","Only woman among the 12 Alvars"],["<b>Akka Mahadevi<\/b>","Karnataka","Woman Lingayat saint"]]},{"k":"trick","h":"<b>Philosophies<\/b> — <span class=\"mn\">Sha-A, Ra-Vi, Ma-Dva, Va-Shu, Ni-Dvaidva<\/span>: <b>Sha<\/b>nkara–<b>A<\/b>dvaita, <b>Ra<\/b>manuja–<b>Vi<\/b>shishtadvaita, <b>Ma<\/b>dhva–<b>Dva<\/b>ita, <b>Va<\/b>llabha–<b>Shu<\/b>ddhadvaita, <b>Ni<\/b>mbarka–<b>Dvaitadva<\/b>ita.<br><b>Nirguna (formless)<\/b>: Kabir, Nanak, Ravidas, Dadu. <b>Saguna (with form)<\/b>: Tulsidas, Surdas, Mira, Chaitanya."},{"k":"facts","title":"Sufism — orders and saints","rows":[["<b>Chishti<\/b> order","Brought by <b>Khwaja Moinuddin Chishti<\/b> to <b>Ajmer<\/b>; the most popular order in India"],["Chishti line","Moinuddin Chishti → <b>Qutbuddin Bakhtiyar Kaki<\/b> (Delhi) → <b>Baba Farid<\/b> (Ajodhan, Punjab) → <b>Nizamuddin Auliya<\/b> (Delhi) → <b>Nasiruddin Chiragh-i-Dehlvi<\/b>"],["<b>Suhrawardi<\/b> order","<b>Bahauddin Zakariya<\/b>, Multan — accepted state service and wealth, unlike the Chishtis"],["<b>Qadiri<\/b> order","Shaikh Abdul Qadir Jilani's line; popular in Punjab/Sindh"],["<b>Naqshbandi<\/b> order","<b>Shaikh Ahmad Sirhindi<\/b> — orthodox, opposed Akbar's liberalism"],["<b>Amir Khusrau<\/b>","Disciple of Nizamuddin Auliya; \"Parrot of India\"; credited with developing the <b>Khayal<\/b> and the <b>sitar/tabla<\/b> tradition and <i>Qawwali<\/i>"],["Key words","<b>Khanqah<\/b> (hospice), <b>Pir/Murshid<\/b> (master), <b>Murid<\/b> (disciple), <b>Sama<\/b> (music/dance), <b>Silsila<\/b> (order), <b>Wahdat-ul-Wujud<\/b> (unity of being), <b>Urs<\/b> (death anniversary)"]]},{"k":"trap","h":"<b>Kabir and Nanak are Nirguna<\/b> (god without form) — Tulsidas and Surdas are Saguna. <b>Ajmer = Moinuddin Chishti<\/b>, <b>Delhi = Nizamuddin Auliya<\/b>; Baba Farid's dargah is at <b>Pakpattan (Ajodhan)<\/b>. Lingayats follow <b>Shiva<\/b> (Basava), not Vishnu."}],"sum":["Alvars = Vishnu, Nayanars = Shiva — Bhakti began in the Tamil south.","Shankara–Advaita, Ramanuja–Vishishtadvaita, Madhva–Dvaita, Vallabha–Shuddhadvaita, Nimbarka–Dvaitadvaita.","Nirguna: Kabir, Nanak, Ravidas, Dadu. Saguna: Tulsidas (Ramcharitmanas), Surdas (Sursagar), Mirabai, Chaitanya.","Basava began the Lingayat movement in Kannada; Shankaradeva brought Vaishnavism to Assam; Jnaneshwari is a Marathi Gita commentary.","Chishti order: Moinuddin Chishti (Ajmer) → Bakhtiyar Kaki → Baba Farid → Nizamuddin Auliya. Suhrawardi = Bahauddin Zakariya (Multan); Naqshbandi = Ahmad Sirhindi."]},
{"id":"L14","g":"med","heat":3,"title":"Mughals — Babur to Aurangzeb","hi":"मुग़ल साम्राज्य","blocks":[{"k":"hot","h":"The <b>heaviest medieval topic<\/b>. Battles with years, Akbar's reforms, Jahangir's and Shah Jahan's buildings, Aurangzeb's policies — 1–2 questions every shift. The battle table below is worth more than any paragraph."},{"k":"story","h":"<p>In 1526 <b>Babur<\/b>, a Central Asian prince descended from Timur, defeated Ibrahim Lodi at the First Battle of Panipat. His field guns and new tactics won the day, and the Mughal empire began. His son Humayun lost the throne to the Afghan <b>Sher Shah Suri<\/b>, who in just five years rebuilt the Grand Trunk Road and issued the silver rupiya. Humayun won the throne back in 1555 but died the next year.<\/p><p>His son <b>Akbar<\/b> was still young, so Bairam Khan won the Second Battle of Panipat for him in 1556. Akbar saw that force alone could not hold so varied a land. He gave Rajput chiefs like Man Singh high command, abolished the jizya (a tax on non-Muslims), and held debates between religions. He ranked his officers in the Mansabdari system and, with Todar Mal, fixed land tax on ten-year averages.<\/p><p>Jahangir loved painting and justice; <b>Shah Jahan<\/b> built the Taj Mahal and the Red Fort. Then <b>Aurangzeb<\/b> turned away from Akbar's tolerance, brought back the jizya, and fought long wars in the Deccan that drained the treasury. The empire was huge when he died, but worn out. The tables give every battle and each emperor's work.<\/p>","key":"Babur founded the empire, Akbar held it together through tolerance and good administration, and Aurangzeb's harsh policies and Deccan wars wore it out."},{"k":"table","title":"Every Mughal battle SSC asks","head":["Year","Battle","Who won / lost"],"rows":[["<b>1526<\/b>","<b>First Panipat<\/b>","<b>Babur<\/b> beat <b>Ibrahim Lodi<\/b> — Mughal rule begins; first Indian use of <i>tulughma<\/i> &amp; field guns"],["<b>1527<\/b>","<b>Khanwa<\/b>","Babur beat <b>Rana Sanga<\/b> of Mewar"],["<b>1528<\/b>","Chanderi","Babur beat Medini Rai"],["<b>1529<\/b>","Ghaghra","Babur beat the Afghans of Bihar/Bengal"],["<b>1539<\/b>","Chausa","<b>Sher Shah Suri<\/b> beat <b>Humayun<\/b>"],["<b>1540<\/b>","Kannauj / Bilgram","Sher Shah beat Humayun again — Humayun flees to Persia"],["<b>1556<\/b>","<b>Second Panipat<\/b>","<b>Bairam Khan<\/b> (for Akbar) beat <b>Hemu<\/b> — Mughal restoration"],["<b>1565<\/b>","Talikota","Deccan sultanates beat Vijayanagara (not Mughal)"],["<b>1576<\/b>","<b>Haldighati<\/b>","Akbar's army (Man Singh) vs <b>Maharana Pratap<\/b> — Pratap withdrew, never submitted"],["<b>1659<\/b>","Samugarh","<b>Aurangzeb<\/b> beat <b>Dara Shikoh<\/b>"],["<b>1739<\/b>","Karnal","<b>Nadir Shah<\/b> beat Muhammad Shah; took the <b>Peacock Throne<\/b> &amp; <b>Koh-i-Noor<\/b>"],["<b>1761<\/b>","<b>Third Panipat<\/b>","<b>Ahmad Shah Abdali<\/b> beat the <b>Marathas<\/b>"]]},{"k":"trick","h":"<b>Three Panipats<\/b> — <span class=\"mn\">1526 · 1556 · 1761<\/span>: <b>B<\/b>abur beats Lodi → <b>A<\/b>kbar(Bairam) beats Hemu → <b>A<\/b>bdali beats Marathas. \"<i>Babur began it, Akbar restored it, Abdali broke the Marathas.<\/i>\"<br><b>Babur's four wins<\/b>: <span class=\"mn\">Pa-Kha-Cha-Gha<\/span> = Panipat, Khanwa, Chanderi, Ghaghra (1526-27-28-29, one per year)."},{"k":"facts","title":"Babur (1526–30) & Humayun (1530–40, 1555–56)","rows":[["Babur","Descendant of <b>Timur (father's side)<\/b> and <b>Genghis Khan (mother's side)<\/b>; ruler of Farghana; invited by Daulat Khan Lodi"],["Babur's memoir","<b><i>Tuzuk-i-Baburi / Baburnama<\/i><\/b> in <b>Turki<\/b> — translated into Persian by Abdur Rahim Khan-i-Khanan"],["Humayun","Lost to Sher Shah, fled to Persia, returned in 1555 with Bairam Khan's help; died falling from the stairs of Din Panah library"],["<b>Humayun's tomb<\/b>","Delhi, built by his widow <b>Hamida Banu Begum (Haji Begum)<\/b>; architect Mirak Mirza Ghiyas; the <b>first garden-tomb<\/b> in India and the model for the Taj — UNESCO site"],["<b>Gulbadan Begum<\/b>","Humayun's sister; wrote <b><i>Humayun-nama<\/i><\/b>"]]},{"k":"facts","title":"Sher Shah Suri (1540–45) — the interlude that is always asked","rows":[["Real name","<b>Farid Khan<\/b>; title Sher Khan for killing a tiger"],["Roads","Rebuilt the <b>Grand Trunk Road<\/b> (Sadak-e-Azam) from Sonargaon (Bengal) to the Indus; built <i>sarais<\/i> every 2 kos"],["Currency","Issued the silver <b>Rupiya<\/b> (178 grains) and copper <b>Dam<\/b> — the ancestor of today's rupee"],["Revenue","Land survey, <b>Patta<\/b> (title deed) &amp; <b>Qabuliyat<\/b> (deed of agreement); tax 1/3 of produce in cash or kind"],["Buildings","<b>Purana Qila<\/b> (Delhi), <b>Rohtasgarh<\/b> fort, his own tomb at <b>Sasaram<\/b> (Bihar)"],["Died","1545, besieging <b>Kalinjar<\/b>"],["Court","<b>Malik Muhammad Jayasi<\/b> wrote <b><i>Padmavat<\/i><\/b> in his time"]]},{"k":"facts","title":"Akbar (1556–1605)","rows":[["Regent","<b>Bairam Khan<\/b> till 1560"],["Revenue system","<b>Zabti / Dahsala<\/b> (1580) under <b>Raja Todar Mal<\/b> — average of 10 years' prices and yields; 1/3 of produce; also Ghalla-bakshi, Nasaq, Kankut"],["<b>Mansabdari<\/b>","Rank system — <b>Zat<\/b> (personal rank) and <b>Sawar<\/b> (cavalry obligation); <b>dagh<\/b> (branding) continued"],["Religion","Abolished <b>jizya (1564)<\/b> and the pilgrimage tax; <b>Din-i-Ilahi (1582)<\/b> — its only notable follower was <b>Birbal<\/b>; built the <b>Ibadat Khana<\/b> (1575) at Fatehpur Sikri for debates; <b>Mahzar/Mazhar<\/b> of 1579 made him the final religious authority"],["<b>Nine jewels (Navaratnas)<\/b>","Abul Fazl, Faizi, Tansen, Birbal, Raja Todar Mal, Abdur Rahim Khan-i-Khanan, Raja Man Singh, Mulla Do Piaza, Fakir Aziao-Din"],["Books of his reign","<b><i>Akbarnama<\/i><\/b> &amp; <b><i>Ain-i-Akbari<\/i><\/b> by <b>Abul Fazl<\/b>; <i>Tabaqat-i-Akbari<\/i> by Nizamuddin Ahmad; <i>Muntakhab-ut-Tawarikh<\/i> by Badauni"],["Buildings","<b>Fatehpur Sikri<\/b> (incl. <b>Buland Darwaza<\/b>, built to mark the Gujarat victory 1573; Panch Mahal; Jodha Bai's palace), Agra Fort, Lahore Fort, Allahabad Fort, Humayun's tomb completed"],["Conquests","Gujarat 1572–73, Bengal 1576, Kabul 1585, Kashmir 1586, Sindh 1591, Kandahar 1595, Khandesh/Asirgarh 1601"]]},{"k":"facts","title":"Jahangir, Shah Jahan, Aurangzeb","rows":[["<b>Jahangir<\/b> (1605–27)","Real name Salim; memoir <b><i>Tuzuk-i-Jahangiri<\/i><\/b>; the <b>chain of justice<\/b> (<i>zanjir-i-adl<\/i>) at Agra fort; married <b>Nur Jahan<\/b> (1611); <b>peak of Mughal painting<\/b> (Ustad Mansur, Abul Hasan); <b>Captain Hawkins<\/b> (1608) and <b>Sir Thomas Roe<\/b> (1615) came; executed <b>Guru Arjan Dev<\/b> (1606)"],["Jahangir's buildings","<b>Itimad-ud-Daulah's tomb<\/b>, Agra (by Nur Jahan for her father) — first full <b>marble<\/b> &amp; <i>pietra dura<\/i> building; Shalimar Bagh, Kashmir; Akbar's tomb at Sikandra"],["<b>Shah Jahan<\/b> (1628–58)","The \"golden age of Mughal architecture\"; built the <b>Taj Mahal<\/b> (for Mumtaz Mahal; architect Ustad Ahmad Lahauri), <b>Red Fort<\/b> &amp; <b>Jama Masjid<\/b> (Delhi), <b>Moti Masjid<\/b> (Agra), <b>Shahjahanabad<\/b>, the <b>Peacock Throne<\/b>; shifted the capital from Agra to <b>Shahjahanabad (Delhi)<\/b> in 1648; travellers <b>Peter Mundy, Bernier, Tavernier, Manucci<\/b>"],["<b>Aurangzeb<\/b> (1658–1707)","Title <b>Alamgir<\/b>, called <b>Zinda Pir<\/b> (living saint); <b>re-imposed jizya (1679)<\/b>; banned music and court painting; longest-reigning Mughal (49 years); executed <b>Guru Tegh Bahadur (1675)<\/b> and <b>Sambhaji (1689)<\/b>; built <b>Bibi ka Maqbara<\/b> (Aurangabad) and <b>Badshahi Masjid<\/b> (Lahore), <b>Moti Masjid<\/b> in the Red Fort; his Deccan wars drained the empire — \"the Deccan ulcer\""]]},{"k":"trick","h":"<b>Memoirs<\/b> — only <b>two<\/b> Mughals wrote their own: <b>Babur<\/b> (<i>Baburnama<\/i>, in Turki) and <b>Jahangir<\/b> (<i>Tuzuk-i-Jahangiri<\/i>, in Persian). Akbar's was written <i>for<\/i> him by Abul Fazl, because Akbar was illiterate.<br><b>Tomb ↔ builder<\/b>: Humayun's tomb → his <b>wife<\/b>; Taj → Shah Jahan for his <b>wife<\/b>; Itimad-ud-Daulah → Nur Jahan for her <b>father<\/b>; Bibi ka Maqbara → Aurangzeb for his <b>wife<\/b>."},{"k":"trap","h":"Jizya was abolished by <b>Akbar (1564)<\/b> and re-imposed by <b>Aurangzeb (1679)<\/b>. <b>Hawkins came under Jahangir<\/b> (1608), not Akbar. Din-i-Ilahi was <b>not a religion with followers<\/b> — essentially only Birbal joined. Mughal <b>painting peaked under Jahangir<\/b>, while <b>architecture peaked under Shah Jahan<\/b>."}],"sum":["Battles: Panipat I 1526 (Babur–Ibrahim Lodi), Khanwa 1527 (Rana Sanga), Chausa 1539 & Kannauj 1540 (Sher Shah–Humayun), Panipat II 1556 (Bairam Khan–Hemu), Haldighati 1576, Samugarh 1659, Karnal 1739, Panipat III 1761.","Sher Shah Suri: Grand Trunk Road, silver Rupiya & copper Dam, Patta–Qabuliyat, Purana Qila, tomb at Sasaram; Padmavat by Jayasi.","Akbar: Dahsala/Zabti under Todar Mal, Mansabdari (Zat & Sawar), jizya abolished 1564, Ibadat Khana 1575, Din-i-Ilahi 1582, Fatehpur Sikri & Buland Darwaza; Akbarnama/Ain-i-Akbari by Abul Fazl.","Jahangir: Tuzuk-i-Jahangiri, chain of justice, Nur Jahan, Hawkins 1608 & Thomas Roe 1615, painting at its peak, Itimad-ud-Daulah's tomb.","Shah Jahan: Taj Mahal, Red Fort, Jama Masjid, Peacock Throne. Aurangzeb: Alamgir/Zinda Pir, jizya back in 1679, longest reign, Bibi ka Maqbara."]},
{"id":"L15","g":"med","heat":2,"title":"Mughal administration, art & Later Mughals","hi":"मुग़ल प्रशासन · कला · परवर्ती मुग़ल","blocks":[{"k":"hot","h":"Pure terminology marks: Mansabdari words, Jagir types, who held which office, and which European traveller came under which emperor. Later Mughals appear as \"who was the puppet when X happened\"."},{"k":"story","h":"<p>How did the emperors run a land this huge? Through a ladder of officers. Near the top, the <b>Wazir<\/b> handled money and the <b>Mir Bakhshi<\/b> handled the army. The empire was split into provinces called subas, then sarkars (districts), then parganas, then villages, each with its own officers. Most nobles were paid with a <b>jagir<\/b>: the right to collect tax from some land. They did not own that land, and the emperor could move them. Land tax was worked out in several ways, which is why there are so many revenue words to learn.<\/p><p>Many Europeans came to the court and wrote about it. Englishmen like <b>Thomas Roe<\/b> came under Jahangir to win trading rights; Frenchmen like Bernier and Tavernier described Shah Jahan's India.<\/p><p>After Aurangzeb died in 1707, the system cracked. Weak emperors followed one another quickly, and powerful nobles like the Sayyid brothers made and unmade kings. Bengal, Awadh and the Deccan went their own way. In 1739 the Persian ruler <b>Nadir Shah<\/b> invaded and carried off the Peacock Throne. By the time of Plassey and Buxar, the emperor was only a figurehead. The last, Bahadur Shah Zafar, was exiled after 1857. The tables give the offices, the land words and the puppet emperors.<\/p>","key":"The Mughal empire ran on a ladder of officers paid by jagirs, and after 1707 that system cracked under weak emperors and invaders."},{"k":"facts","title":"Officers of the empire","rows":[["<b>Wazir / Diwan-i-Ala<\/b>","Head of revenue and finance"],["<b>Mir Bakhshi<\/b>","Head of the military department &amp; intelligence; paid the mansabdars"],["<b>Mir Saman / Khan-i-Saman<\/b>","Royal household and karkhanas"],["<b>Sadr-us-Sudur<\/b>","Religious affairs, charity and endowments"],["<b>Qazi-ul-Quzat<\/b>","Chief judge"],["<b>Muhtasib<\/b>","Censor of public morals"],["<b>Subedar<\/b>","Provincial governor (province = <b>Suba<\/b>)"],["<b>Faujdar<\/b> / <b>Kotwal<\/b>","Head of a <i>sarkar<\/i> (district) / city police chief"],["<b>Amil / Amalguzar<\/b>","Revenue collector of a <i>pargana<\/i>"],["<b>Qanungo<\/b> &amp; <b>Patwari<\/b>","Keepers of land records"],["Administrative units","<b>Suba → Sarkar → Pargana → Mauza (village)<\/b>"]]},{"k":"facts","title":"Land and jagir words","rows":[["<b>Jagir<\/b>","Revenue assignment in place of salary; holder = <b>Jagirdar<\/b> (he had no ownership of the land)"],["<b>Khalisa<\/b>","Land whose revenue went straight to the imperial treasury"],["<b>Inam<\/b>","Revenue-free grant, usually to scholars/religious men"],["<b>Watan Jagir<\/b>","Hereditary homeland jagir of a Rajput chief"],["<b>Polaj / Parauti / Chachar / Banjar<\/b>","Akbar's four land classes — annually cultivated / left fallow a year / fallow 2–3 years / fallow 5+ years"],["<b>Zabti / Dahsala<\/b>","Measured land, cash rate per bigha from 10-year averages"],["<b>Ghalla-bakshi (Batai)<\/b>","Crop sharing"],["<b>Nasaq<\/b>","Rough estimate from past figures"],["<b>Kankut<\/b>","Estimate by eye of the standing crop"]]},{"k":"table","title":"European travellers ↔ emperor","head":["Traveller","Country","Came under"],"rows":[["<b>Captain William Hawkins<\/b>","England","Jahangir (1608)"],["<b>Sir Thomas Roe<\/b>","England","Jahangir (1615) — got the Surat trading rights"],["<b>Edward Terry<\/b>","England","Jahangir"],["<b>Peter Mundy<\/b>","England","Shah Jahan — wrote on Indian village life"],["<b>Francois Bernier<\/b>","France","Shah Jahan &amp; Aurangzeb — <i>Travels in the Mogul Empire<\/i>; called India's land \"owned by the king\""],["<b>Jean-Baptiste Tavernier<\/b>","France","Shah Jahan — jeweller; described the Peacock Throne"],["<b>Niccolao Manucci<\/b>","Italy","Shah Jahan/Aurangzeb — <i>Storia do Mogor<\/i>"],["<b>Jean de Thevenot<\/b>","France","Aurangzeb"],["<b>Ralph Fitch<\/b>","England","Akbar — first Englishman to visit"],["<b>Father Monserrate<\/b>","Portugal","Akbar"]]},{"k":"facts","title":"Later Mughals — who was on the throne when","rows":[["<b>Bahadur Shah I<\/b> (1707–12)","\"Shah-i-Bekhabar\"; released Shahu"],["<b>Jahandar Shah<\/b> (1712–13)","Put up by Zulfiqar Khan; abolished jizya"],["<b>Farrukhsiyar<\/b> (1713–19)","Gave the <b>1717 farman<\/b> (\"Magna Carta of the Company\") to the English; killed by the <b>Sayyid brothers<\/b> — the \"kingmakers\""],["<b>Muhammad Shah \"Rangila\"<\/b> (1719–48)","<b>Nadir Shah's invasion 1739<\/b>; Deccan, Awadh &amp; Bengal became independent"],["<b>Ahmad Shah<\/b> (1748–54)","Ahmad Shah Abdali's raids begin"],["<b>Alamgir II<\/b> (1754–59)","<b>Battle of Plassey 1757<\/b> in his reign"],["<b>Shah Alam II<\/b> (1759–1806)","<b>Battle of Buxar 1764<\/b>; gave the <b>Diwani of Bengal<\/b> to the Company (1765); first to accept Company protection (1803)"],["<b>Akbar II<\/b> (1806–37)","Gave <b>Ram Mohan Roy<\/b> the title \"Raja\""],["<b>Bahadur Shah II \"Zafar\"<\/b> (1837–57)","<b>Last Mughal<\/b>; made the figurehead of 1857; exiled to <b>Rangoon<\/b>, died 1862"]]},{"k":"trick","h":"<b>Battle ↔ puppet emperor<\/b>: Nadir Shah 1739 → <b>Muhammad Shah<\/b>; Plassey 1757 → <b>Alamgir II<\/b>; Buxar 1764 → <b>Shah Alam II<\/b>; 1857 → <b>Bahadur Shah Zafar<\/b>.<br><b>Units<\/b>, big to small — <span class=\"mn\">Su-Sa-Pa-Mau<\/span> = Suba, Sarkar, Pargana, Mauza."},{"k":"trap","h":"A <b>jagirdar owned no land<\/b> — only the right to collect its revenue; jagirs were transferable. <b>Mir Bakhshi<\/b> is the <i>military<\/i> head, not the finance head (that is the Wazir/Diwan). <b>Thomas Roe<\/b> came to Jahangir, <b>Ralph Fitch<\/b> to Akbar — Roe is the famous one for the Surat <i>farman<\/i>."}],"sum":["Wazir/Diwan = finance; Mir Bakhshi = military; Mir Saman = household; Sadr-us-Sudur = religion; Qazi-ul-Quzat = chief judge; Muhtasib = public morals.","Units Suba → Sarkar → Pargana → Mauza. Jagir = revenue assignment, not land ownership; Khalisa = crown land.","Akbar's land classes: Polaj, Parauti, Chachar, Banjar. Revenue methods: Zabti/Dahsala, Ghalla-bakshi, Nasaq, Kankut.","Hawkins 1608 & Thomas Roe 1615 → Jahangir; Bernier, Tavernier, Peter Mundy, Manucci → Shah Jahan; Ralph Fitch → Akbar.","Farrukhsiyar gave the 1717 farman; Nadir Shah invaded under Muhammad Shah (1739); Bahadur Shah Zafar was the last Mughal, exiled to Rangoon."]},
{"id":"L16","g":"med","heat":2,"title":"Marathas & the Sikhs","hi":"मराठा · सिख","blocks":[{"k":"hot","h":"Shivaji's coronation and his eight ministers, the Peshwas in order, the three Anglo-Maratha wars, and the ten Sikh Gurus — all repeat questions."},{"k":"story","h":"<p>As Mughal power weakened, two peoples built their own states: the Marathas in the west and the Sikhs in Punjab. <b>Shivaji<\/b>, son of Shahji Bhonsle and Jijabai, used the hills and forts of Maharashtra to fight much bigger armies. He killed the general Afzal Khan, raided Surat and escaped from Aurangzeb's detention at Agra. In 1674 he was crowned Chhatrapati at Raigad. He ran his kingdom with eight ministers and collected chauth, a quarter of the revenue.<\/p><p>After him, real power passed to the chief ministers, the <b>Peshwas<\/b>. Under Baji Rao I Maratha power spread into north India. But in 1761 Ahmad Shah Abdali crushed them at the Third Battle of Panipat. They recovered, but three wars with the British, ending in 1818, finished Maratha power.<\/p><p>The Sikh story is a line of ten Gurus, starting with Guru Nanak. Mughal pressure, including the execution of Guru Arjan Dev and <b>Guru Tegh Bahadur<\/b>, turned a peaceful community into a fighting one. In 1699 <b>Guru Gobind Singh<\/b> founded the Khalsa. Later Maharaja Ranjit Singh built a Sikh kingdom at Lahore. The tables list the ministers, Peshwas, wars and Gurus.<\/p>","key":"As the Mughals weakened, Shivaji and the Peshwas built Maratha power and the Sikh Gurus built the Khalsa, until the British ended both."},{"k":"facts","title":"Shivaji (1627/30–1680)","rows":[["Parents","Father <b>Shahji Bhonsle<\/b>, mother <b>Jijabai<\/b>; guru Ramdas (<i>Dasbodh<\/i>); teacher Dadaji Kondadev"],["Coronation","<b>1674 at Raigad<\/b>; title <b>Chhatrapati<\/b> (also Haindava Dharmoddharak)"],["Afzal Khan","Killed at <b>Pratapgarh (1659)<\/b>"],["Shaista Khan","Attacked at Pune (1663); Shivaji raided <b>Surat (1664)<\/b>"],["<b>Treaty of Purandar<\/b>","<b>1665<\/b> with <b>Jai Singh<\/b> — gave up 23 forts"],["Agra","Escaped from Aurangzeb's detention at Agra, 1666"],["<b>Ashtapradhan<\/b> — eight ministers","<b>Peshwa<\/b> (PM) · <b>Amatya/Majumdar<\/b> (finance) · <b>Sachiv/Shurunavis<\/b> (correspondence) · <b>Mantri/Waqia-navis<\/b> (personal records) · <b>Senapati/Sari-i-Naubat<\/b> (army) · <b>Sumant/Dabir<\/b> (foreign affairs) · <b>Nyayadhish<\/b> (justice) · <b>Panditrao<\/b> (religion &amp; charity)"],["Taxes","<b>Chauth<\/b> = 1/4 of revenue; <b>Sardeshmukhi<\/b> = extra 1/10 as hereditary right"],["Successors","<b>Sambhaji<\/b> (executed by Aurangzeb, 1689) → Rajaram → Tarabai (regent) → <b>Shahu<\/b> (1707)"]]},{"k":"facts","title":"The Peshwas (real power after 1713)","rows":[["<b>Balaji Vishwanath<\/b> (1713–20)","First Peshwa; got Chauth &amp; Sardeshmukhi rights from the Mughals (1719)"],["<b>Baji Rao I<\/b> (1720–40)","Greatest Peshwa; \"the fighting Peshwa\"; Maratha confederacy spreads north"],["<b>Balaji Baji Rao / Nana Saheb<\/b> (1740–61)","<b>Third Battle of Panipat, 14 Jan 1761<\/b> — crushing defeat by <b>Ahmad Shah Abdali<\/b>; Vishwas Rao &amp; Sadashiv Rao Bhau died"],["<b>Madhav Rao I<\/b>","Revived Maratha power"],["<b>Baji Rao II<\/b>","Last Peshwa; signed the <b>Treaty of Bassein (1802)<\/b>, deposed 1818"],["Great houses","<b>Gaekwad<\/b> (Baroda), <b>Holkar<\/b> (Indore), <b>Scindia<\/b> (Gwalior), <b>Bhonsle<\/b> (Nagpur)"]]},{"k":"table","title":"Anglo-Maratha wars","head":["War","Years","Ended by","Result"],"rows":[["First","1775–82","<b>Treaty of Salbai<\/b> (1782)","Status quo; 20 years of peace. (Treaty of Surat 1775 and Wadgaon 1779 came in between)"],["Second","1803–05","Treaties of Deogaon, Surji-Arjungaon","Marathas broken up after the <b>Treaty of Bassein (1802)<\/b> put Baji Rao II under subsidiary alliance"],["Third","1817–18","—","Peshwaship abolished; <b>Maratha power ends<\/b> under Lord Hastings"]]},{"k":"facts","title":"The ten Sikh Gurus","rows":[["1. <b>Guru Nanak<\/b> (1469–1539)","Founder; born Talwandi (Nankana Sahib)"],["2. Guru Angad","Created the <b>Gurmukhi<\/b> script"],["3. Guru Amar Das","Started the <b>Manji<\/b> system; Akbar visited"],["4. <b>Guru Ram Das<\/b>","Founded <b>Amritsar<\/b>; Akbar granted the land"],["5. <b>Guru Arjan Dev<\/b>","Compiled the <b>Adi Granth<\/b>; built the <b>Harmandir Sahib<\/b>; <b>executed by Jahangir (1606)<\/b> — the first martyr"],["6. Guru Hargobind","Militarised the Sikhs; <b>Akal Takht<\/b>; the two swords (<i>miri<\/i> &amp; <i>piri<\/i>)"],["7. Guru Har Rai · 8. Guru Har Krishan","Short tenures"],["9. <b>Guru Tegh Bahadur<\/b>","<b>Executed by Aurangzeb (1675)<\/b> at Chandni Chowk"],["10. <b>Guru Gobind Singh<\/b>","Founded the <b>Khalsa at Anandpur Sahib, 1699<\/b> (Baisakhi); the <b>five Ks<\/b>; made the <b>Guru Granth Sahib<\/b> the eternal Guru; <i>Dasam Granth<\/i>; died 1708 at Nanded"],["After the Gurus","<b>Banda Bahadur<\/b> (1708–16) fought the Mughals; <b>Maharaja Ranjit Singh<\/b> (1799–1839) built the Sikh kingdom at Lahore, held the Koh-i-Noor"]]},{"k":"trick","h":"<b>Ashtapradhan's first two<\/b>: <b>Peshwa<\/b> = prime, <b>Amatya<\/b> = accounts (both start with the work they do). <b>Chauth = chaar (1/4)<\/b>, <b>Sardeshmukhi = 1/10<\/b>.<br><b>Gurus to remember by number<\/b>: <span class=\"mn\">4-Amritsar, 5-Adi Granth, 10-Khalsa<\/span>."},{"k":"trap","h":"Shivaji's coronation is <b>1674<\/b> at <b>Raigad<\/b>, not Pratapgarh (that is where he killed Afzal Khan, 1659). The <b>Third Battle of Panipat (1761)<\/b> was Marathas vs <b>Ahmad Shah Abdali<\/b> — the British were not involved. <b>Guru Arjan Dev<\/b> was executed by <b>Jahangir<\/b>; <b>Guru Tegh Bahadur<\/b> by <b>Aurangzeb<\/b>."}],"sum":["Shivaji: crowned 1674 at Raigad as Chhatrapati; killed Afzal Khan at Pratapgarh 1659; Treaty of Purandar 1665; Ashtapradhan of eight ministers; taxes Chauth (1/4) and Sardeshmukhi (1/10).","Peshwas: Balaji Vishwanath → Baji Rao I → Balaji Baji Rao (Panipat III, 14 Jan 1761, lost to Ahmad Shah Abdali) → Madhav Rao I → Baji Rao II (Treaty of Bassein 1802).","Anglo-Maratha wars: I ended by the Treaty of Salbai 1782; II after Bassein 1802; III (1817–18) ended Maratha power and the Peshwaship.","Sikh Gurus: 2nd Angad made Gurmukhi, 4th Ram Das founded Amritsar, 5th Arjan Dev compiled the Adi Granth (killed by Jahangir, 1606), 9th Tegh Bahadur killed by Aurangzeb (1675), 10th Gobind Singh founded the Khalsa in 1699.","Maratha houses: Gaekwad–Baroda, Holkar–Indore, Scindia–Gwalior, Bhonsle–Nagpur."]}
];

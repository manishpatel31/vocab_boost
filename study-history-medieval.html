["L13","'Jnaneshwari', a Marathi commentary on the Bhagavad Gita, was written by:",["Jnaneshwar","Tukaram","Namdev","Eknath"],"Jnaneshwar's Jnaneshwari is a landmark of Marathi devotional literature.",""],
["L13","Who was the guru of both Kabir and Ravidas?",["Ramananda","Ramanuja","Vallabhacharya","Nimbarka"],"Ramananda first carried the Bhakti message to north India in the people's language.","p"],
["L13","In Sufi terminology, a 'khanqah' is a:",["Hospice where a Sufi master lived and taught","Death anniversary","Mystical dance","Chain of spiritual succession"],"Khanqah = hospice; Urs = death anniversary; Sama = music and dance; Silsila = order.",""],
["L13","The Naqshbandi order, which opposed liberal religious policies, is linked with:",["Shaikh Ahmad Sirhindi","Nizamuddin Auliya","Bahauddin Zakariya","Nasiruddin Chiragh"],"Ahmad Sirhindi led the orthodox Naqshbandi reaction against Akbar's liberalism.",""],
["L13","Mirabai's devotional songs were addressed to:",["Krishna","Rama","Shiva","Devi"],"Mirabai of Mewar composed padas in Rajasthani and Braj in praise of Krishna.",""],
["L14","The Battle of Khanwa (1527) was fought between Babur and:",["Rana Sanga of Mewar","Ibrahim Lodi","Medini Rai","Rana Kumbha"],"Babur's four victories ran Panipat (1526), Khanwa (1527), Chanderi (1528) and Ghaghra (1529).","p"],
["L14","Humayun was defeated by Sher Shah Suri at Chausa in:",["1539","1540","1556","1545"],"Chausa was in 1539 and Kannauj (Bilgram) in 1540, after which Humayun fled to Persia.",""],
["L14","The Second Battle of Panipat (1556) was fought between Hemu and:",["Bairam Khan","Akbar in person","Humayun","Babur"],"Bairam Khan, Akbar's regent, defeated Hemu and restored Mughal rule.","p"],
["L14","Sher Shah Suri's original name was:",["Farid Khan","Hasan Khan","Islam Khan","Sher Khan"],"He was named Farid Khan; 'Sher Khan' was a title earned for killing a tiger.","p"],
["L14","The silver Rupiya, ancestor of the modern rupee, was introduced by:",["Sher Shah Suri","Akbar","Alauddin Khalji","Iltutmish"],"Sher Shah issued the silver rupiya of 178 grains and the copper dam.","p"],
["L14","Sher Shah Suri's tomb is at:",["Sasaram, Bihar","Delhi","Kalinjar","Rohtasgarh"],"His octagonal tomb stands in a lake at Sasaram; he died besieging Kalinjar in 1545.",""],
["L14","The Grand Trunk Road, or Sadak-e-Azam, was rebuilt by:",["Sher Shah Suri","Akbar","Firoz Shah Tughlaq","Dalhousie"],"Sher Shah rebuilt it from Sonargaon in Bengal to the Indus, with sarais along the way.","p"],
["L14","Patta and Qabuliyat, documents of land revenue, were introduced by:",["Sher Shah Suri","Todar Mal","Cornwallis","Alauddin Khalji"],"Patta was the title deed and Qabuliyat the peasant's deed of agreement.",""],
["L14","Akbar's Dahsala or Zabti revenue system was worked out by:",["Raja Todar Mal","Abul Fazl","Birbal","Khan-i-Khanan"],"The Dahsala system of 1580 used ten-year averages of yields and prices.","p"],
["L14","Under the Mansabdari system, the rank indicating personal status was:",["Zat","Sawar","Dagh","Jagir"],"Zat fixed personal rank and pay; Sawar fixed the number of horsemen to be maintained.",""],
["L14","Akbar abolished jizya in:",["1564","1562","1582","1579"],"He abolished jizya in 1564 and the pilgrimage tax in 1563; Aurangzeb reimposed jizya in 1679.",""],
["L14","The Ibadat Khana, a hall for religious discussion, was built by Akbar at:",["Fatehpur Sikri","Agra","Delhi","Lahore"],"He built it in 1575 at Fatehpur Sikri and proclaimed Din-i-Ilahi in 1582.","p"],
["L14","The Buland Darwaza at Fatehpur Sikri was built to commemorate Akbar's victory over:",["Gujarat","Bengal","Mewar","Kashmir"],"It was raised in 1573–76 to mark the conquest of Gujarat.","p"],
["L14","The Akbarnama and Ain-i-Akbari were written by:",["Abul Fazl","Badauni","Nizamuddin Ahmad","Faizi"],"Abul Fazl, one of Akbar's nine jewels, wrote both.","p"],
["L14","Which two Mughal emperors wrote their own memoirs?",["Babur and Jahangir","Akbar and Jahangir","Babur and Humayun","Shah Jahan and Aurangzeb"],"Baburnama (in Turki) and Tuzuk-i-Jahangiri (in Persian). Akbar was illiterate, so Abul Fazl wrote for him.",""],
["L14","Humayun-nama was written by:",["Gulbadan Begum","Hamida Banu Begum","Nur Jahan","Jahanara"],"Gulbadan Begum was Humayun's sister.","p"],
["L14","Humayun's tomb in Delhi was built by:",["Hamida Banu Begum","Akbar","Gulbadan Begum","Shah Jahan"],"His widow Hamida Banu Begum (Haji Begum) had it built; it is India's first garden tomb.",""],
["L14","Captain William Hawkins came to the court of:",["Jahangir","Akbar","Shah Jahan","Aurangzeb"],"Hawkins arrived in 1608 and Sir Thomas Roe in 1615, both under Jahangir.","p"],
["L14","The 'chain of justice' (zanjir-i-adl) at Agra fort was set up by:",["Jahangir","Akbar","Shah Jahan","Sher Shah Suri"],"Any petitioner could pull the chain to seek the emperor's justice directly.","p"],
["L14","The tomb of Itimad-ud-Daulah at Agra was built by:",["Nur Jahan","Mumtaz Mahal","Jahanara","Hamida Banu Begum"],"Nur Jahan built it for her father; it is the first Mughal building fully in marble, with pietra dura work.",""],
["L14","Mughal painting reached its peak under:",["Jahangir","Akbar","Shah Jahan","Humayun"],"Painting peaked under Jahangir (Ustad Mansur, Abul Hasan) while architecture peaked under Shah Jahan.",""],
["L14","The architect of the Taj Mahal is believed to be:",["Ustad Ahmad Lahauri","Ustad Isa Khan alone","Mirak Mirza Ghiyas","Amanat Khan"],"Ustad Ahmad Lahauri is credited as the chief architect; the Taj was built for Mumtaz Mahal.",""],
["L14","Aurangzeb reimposed jizya in:",["1679","1659","1669","1689"],"He reimposed it in 1679, 115 years after Akbar abolished it.",""],
["L14","Which Mughal emperor was called 'Zinda Pir' (the living saint)?",["Aurangzeb","Shah Jahan","Jahangir","Akbar"],"Aurangzeb, who took the title Alamgir, was known for his austere personal life.",""],
["L14","Bibi ka Maqbara at Aurangabad was built by:",["Aurangzeb for his wife","Shah Jahan for Mumtaz","Jahangir for Nur Jahan","Akbar for Jodha Bai"],"Often called the 'mini Taj', it was built for Aurangzeb's wife Dilras Banu Begum.",""],
["L14","Guru Arjan Dev was executed during the reign of:",["Jahangir","Aurangzeb","Shah Jahan","Akbar"],"Guru Arjan Dev was executed by Jahangir in 1606; Guru Tegh Bahadur by Aurangzeb in 1675.",""],
["L14","Babur was a descendant of Genghis Khan on his:",["Mother's side","Father's side","Both sides equally","Neither side"],"He descended from Timur on his father's side and Genghis Khan on his mother's.",""],
["L15","The head of the military department in the Mughal administration was the:",["Mir Bakhshi","Wazir","Mir Saman","Sadr-us-Sudur"],"Mir Bakhshi headed the army and intelligence; the Wazir (Diwan-i-Ala) headed finance.","p"],
["L15","The Mughal officer in charge of the royal household and karkhanas was the:",["Mir Saman","Mir Bakhshi","Muhtasib","Qanungo"],"Mir Saman or Khan-i-Saman looked after the imperial household establishments.",""],
["L15","The Mughal official who acted as censor of public morals was the:",["Muhtasib","Qazi-ul-Quzat","Sadr-us-Sudur","Kotwal"],"The Muhtasib enforced moral regulations; the Qazi-ul-Quzat was the chief judge.",""],
["L15","The Mughal administrative units, from largest to smallest, were:",["Suba, Sarkar, Pargana, Mauza","Suba, Pargana, Sarkar, Mauza","Sarkar, Suba, Mauza, Pargana","Iqta, Shiq, Pargana, Gram"],"Suba (province) → Sarkar (district) → Pargana → Mauza (village).",""],
["L15","Land whose revenue went directly to the imperial treasury was called:",["Khalisa","Jagir","Inam","Watan"],"Khalisa was crown land; a jagir was assigned to an officer in place of salary.",""],
["L15","A hereditary homeland jagir held by a Rajput chief was called a:",["Watan jagir","Inam","Khalisa","Altamgha"],"Watan jagirs were not transferable, unlike ordinary jagirs.",""],
["L15","Akbar's land classification 'Polaj' referred to land that was:",["Cultivated every year","Left fallow for one year","Fallow for two to three years","Fallow for five years or more"],"Polaj, Parauti, Chachar and Banjar were the four classes in that order.",""],
["L15","The revenue method based on sharing the actual crop was called:",["Ghalla-bakshi (Batai)","Zabti","Nasaq","Kankut"],"Ghalla-bakshi was crop sharing; Kankut was an estimate by eye and Nasaq a rough calculation from past figures.",""],
["L15","Sir Thomas Roe came to Jahangir's court in 1615 as the ambassador of:",["James I of England","Louis XIV of France","Charles II","The Dutch East India Company"],"He secured trading rights for the English at Surat.","p"],
["L15","Francois Bernier, the French traveller, visited India during the reign of:",["Shah Jahan and Aurangzeb","Akbar","Jahangir","Babur"],"His Travels in the Mogul Empire is a major source on the later Mughal economy.","p"],
["L15","Which French traveller and jeweller described the Peacock Throne?",["Jean-Baptiste Tavernier","Francois Bernier","Niccolao Manucci","Jean de Thevenot"],"Tavernier, a gem merchant, left a detailed description of the throne.",""],
["L15","The first Englishman to visit India, during Akbar's reign, was:",["Ralph Fitch","William Hawkins","Thomas Roe","Peter Mundy"],"Ralph Fitch travelled in India in the 1580s under Akbar.","p"],
["L15","The farman of 1717, called the 'Magna Carta of the East India Company', was granted by:",["Farrukhsiyar","Shah Alam II","Muhammad Shah","Bahadur Shah I"],"Farrukhsiyar's farman gave the Company wide trade concessions in Bengal.","p"],
["L15","Nadir Shah invaded India in 1739 during the reign of:",["Muhammad Shah","Alamgir II","Shah Alam II","Ahmad Shah"],"He defeated Muhammad Shah at Karnal and carried away the Peacock Throne and the Koh-i-Noor.","p"],
["L15","The Sayyid brothers, who made and unmade emperors, were known as:",["Kingmakers","Jagirdars","Mansabdars","Subedars"],"Abdullah Khan and Hussain Ali Khan dominated the court after Bahadur Shah I.",""],
["L15","The last Mughal emperor, Bahadur Shah II, was exiled to:",["Rangoon","Aden","Singapore","Colombo"],"He was exiled to Rangoon after 1857 and died there in 1862.","p"],
["L15","The Battle of Buxar (1764) took place during the reign of which Mughal emperor?",["Shah Alam II","Alamgir II","Muhammad Shah","Akbar II"],"Shah Alam II himself fought on the losing side and later granted the Diwani of Bengal.",""],
["L15","Raja Ram Mohan Roy received the title 'Raja' from:",["Akbar II","Bahadur Shah II","Shah Alam II","Lord Bentinck"],"Akbar II conferred the title when sending him to England as his envoy.",""],
["L16","Shivaji was crowned Chhatrapati in 1674 at:",["Raigad","Pratapgarh","Purandar","Panhala"],"Raigad was his capital; Pratapgarh is where he killed Afzal Khan in 1659.","p"],
["L16","Shivaji killed Afzal Khan at:",["Pratapgarh","Raigad","Surat","Purandar"],"The meeting at Pratapgarh in 1659 ended with Afzal Khan's death.",""],
["L16","The Treaty of Purandar (1665) was signed between Shivaji and:",["Jai Singh","Shaista Khan","Afzal Khan","Aurangzeb in person"],"Shivaji surrendered 23 of his 35 forts under the treaty.","p"],
["L16","Shivaji's council of eight ministers was called the:",["Ashtapradhan","Ashtadiggaja","Chahalgani","Navaratna"],"Ashtapradhan included the Peshwa, Amatya, Sachiv, Mantri, Senapati, Sumant, Nyayadhish and Panditrao.","p"],
["L16","In the Maratha system, 'Chauth' was a tax equal to:",["One-fourth of the revenue","One-tenth of the revenue","One-third of the produce","Half of the produce"],"Chauth was one-fourth; Sardeshmukhi was an additional one-tenth claimed as a hereditary right.",""],
["L16","The minister in charge of foreign affairs in the Ashtapradhan was the:",["Sumant (Dabir)","Amatya","Sachiv","Panditrao"],"Sumant or Dabir handled foreign affairs; Panditrao looked after religion and charity.",""],
["L16","The first Peshwa to make the office hereditary and powerful was:",["Balaji Vishwanath","Baji Rao I","Balaji Baji Rao","Madhav Rao I"],"Balaji Vishwanath (1713–20) secured Chauth and Sardeshmukhi rights from the Mughals in 1719.",""],
["L16","The Third Battle of Panipat was fought on 14 January 1761 between the Marathas and:",["Ahmad Shah Abdali","the English","Nadir Shah","the Nizam"],"The Marathas under Sadashiv Rao Bhau were crushed; Vishwas Rao was killed.","p"],
["L16","The First Anglo-Maratha War ended with the:",["Treaty of Salbai","Treaty of Bassein","Treaty of Purandar","Treaty of Deogaon"],"The Treaty of Salbai (1782) restored the status quo and gave 20 years of peace.",""],
["L16","The Treaty of Bassein (1802) was signed between the English and:",["Baji Rao II","Madhav Rao II","Daulat Rao Scindia","Raghuji Bhonsle"],"It brought Peshwa Baji Rao II under subsidiary alliance and triggered the Second Anglo-Maratha War.","p"],
["L16","Maratha power effectively ended with the:",["Third Anglo-Maratha War (1817–18)","Third Battle of Panipat","Treaty of Salbai","Battle of Wadgaon"],"After the third war Lord Hastings abolished the Peshwaship and annexed its territory.",""],
["L16","The Gurmukhi script was created by:",["Guru Angad","Guru Nanak","Guru Ram Das","Guru Arjan Dev"],"Guru Angad, the second Guru, gave the Sikhs the Gurmukhi script.",""],
["L16","Amritsar was founded by:",["Guru Ram Das","Guru Arjan Dev","Guru Hargobind","Guru Gobind Singh"],"Guru Ram Das, the fourth Guru, founded Amritsar on land granted by Akbar.","p"],
["L16","The Adi Granth was compiled by:",["Guru Arjan Dev","Guru Angad","Guru Gobind Singh","Guru Tegh Bahadur"],"Guru Arjan Dev compiled it and built the Harmandir Sahib; he was executed by Jahangir in 1606.","p"],
["L16","The Khalsa was founded in 1699 at Anandpur Sahib by:",["Guru Gobind Singh","Guru Tegh Bahadur","Guru Hargobind","Banda Bahadur"],"Guru Gobind Singh founded the Khalsa on Baisakhi and prescribed the five Ks.","p"],
["L16","Which Sikh Guru made the Guru Granth Sahib the eternal Guru?",["Guru Gobind Singh","Guru Arjan Dev","Guru Tegh Bahadur","Guru Har Rai"],"Guru Gobind Singh ended the line of living Gurus in 1708.",""],
["L16","The Maratha house that ruled at Gwalior was the:",["Scindias","Holkars","Gaekwads","Bhonsles"],"Scindia–Gwalior, Holkar–Indore, Gaekwad–Baroda, Bhonsle–Nagpur.",""],
["L16","Shivaji's son Sambhaji was executed by:",["Aurangzeb","Shah Jahan","Jai Singh","Shaista Khan"],"Sambhaji was captured and executed in 1689.",""],
["L9","The 'Chachnama' is the main source for the history of:",["The Arab conquest of Sindh","The battles of Tarain","Mahmud of Ghazni's raids","The Slave dynasty"],"The Chachnama records Muhammad bin Qasim's conquest of Sindh in 712 CE and the defeat of Raja Dahir.",""],
["L9","'Tabaqat-i-Nasiri' was written by:",["Minhaj-us-Siraj","Hasan Nizami","Ziauddin Barani","Amir Khusrau"],"Minhaj-us-Siraj wrote it in Iltutmish's and Balban's time. Hasan Nizami wrote Taj-ul-Maasir.",""],
["L9","Bakhtiyar Khalji conquered which two regions for the Turks?",["Bihar and Bengal","Gujarat and Malwa","Sindh and Multan","Punjab and Kashmir"],"He overran Bihar and Bengal and destroyed Nalanda in 1193.",""],
["L9","Muhammad Ghori died, leaving the way open for Turkish rule in India, in:",["1206","1192","1194","1210"],"Ghori died in 1206, and his slave general Qutb-ud-din Aibak then founded the Delhi Sultanate.",""],
["L9","Mahmud of Ghazni belonged to which dynasty?",["Ghaznavid","Ghurid","Khalji","Ilbari"],"Mahmud was a Ghaznavid. Muhammad Ghori belonged to the rival Ghurid house that displaced the Ghaznavids.",""],
["L10","Qutb-ud-din Aibak died in 1210 at Lahore while playing:",["Chaugan (polo)","Chess","Chausar","Kabaddi"],"He fell from his horse during a game of chaugan, the medieval form of polo.",""],
["L10","The Qutub Minar was raised in honour of which Sufi saint?",["Khwaja Qutbuddin Bakhtiyar Kaki","Moinuddin Chishti","Nizamuddin Auliya","Baba Farid"],"Aibak dedicated it to Bakhtiyar Kaki of Delhi, the successor of Moinuddin Chishti of Ajmer.",""],
["L10","Iltutmish obtained a khilat, a letter of recognition as Sultan, in 1229 from the:",["Caliph of Baghdad","Mongol Khan","Sultan of Ghazni","Shah of Persia"],"The Caliph's recognition made Iltutmish the legal sovereign of Delhi and gave the Sultanate standing.",""],
["L10","Who founded the Khalji dynasty in 1290?",["Jalal-ud-din Khalji","Alauddin Khalji","Khusrau Khan","Malik Kafur"],"Jalal-ud-din Khalji founded it with a mild policy; his nephew and son-in-law Alauddin murdered him in 1296.",""],
["L10","The Diwan-i-Riyasat, the department supervising commerce and market control, was created by:",["Alauddin Khalji","Balban","Iltutmish","Firoz Shah Tughlaq"],"It worked under Alauddin Khalji's market-control scheme, with the Shahna-i-Mandi as market superintendent.",""],
["L10","Which Sultan built the Siri fort at Delhi?",["Alauddin Khalji","Qutb-ud-din Aibak","Ghiyas-ud-din Tughlaq","Sikandar Lodi"],"Alauddin Khalji built Siri and the Alai Darwaza as part of his defences against the Mongols.",""],
["L11","Who described Muhammad bin Tughlaq as 'a mixture of opposites'?",["Ziauddin Barani","Ibn Battuta","Amir Khusrau","Minhaj-us-Siraj"],"Barani, the historian of the Tughlaq court, used the phrase for the learned but unlucky Sultan.",""],
["L11","Ghiyas-ud-din Tughlaq died in 1325 when:",["A pavilion collapsed on him at Afghanpur","He fell while playing polo","He was poisoned at court","He was killed fighting the Mongols"],"The wooden pavilion built to welcome him at Afghanpur fell on him; Aibak, by contrast, died playing chaugan.",""],
["L11","'Futuhat-i-Firozshahi' was written by:",["Firoz Shah Tughlaq himself","Ziauddin Barani","Shams Siraj Afif","Amir Khusrau"],"The Sultan wrote this account of his own achievements; Afif wrote a separate Tarikh-i-Firozshahi.",""],
["L11","Which Sultan had two Ashokan pillars shifted to Delhi?",["Firoz Shah Tughlaq","Alauddin Khalji","Muhammad bin Tughlaq","Sikandar Lodi"],"Firoz Shah moved pillars from Topra and Meerut to Delhi and also repaired the Qutub Minar.",""],
["L11","Sikandar Lodi wrote Persian verse under which pen name?",["Gulrukhi","Gulbadan","Zafar","Rangila"],"Sikandar Lodi used the pen name Gulrukhi. Bahadur Shah II wrote as 'Zafar'.",""],
["L11","The Diwan-i-Mustakharaj, a department for arrears of revenue, was set up by:",["Alauddin Khalji","Firoz Shah Tughlaq","Muhammad bin Tughlaq","Balban"],"Alauddin Khalji created it to recover revenue arrears; the Diwan-i-Kohi for agriculture was Muhammad bin Tughlaq's.",""],
["L12","Hampi, the capital of Vijayanagara, stood on the banks of which river?",["Tungabhadra","Krishna","Kaveri","Godavari"],"Harihara I and Bukka Raya founded the city on the Tungabhadra; its ruins at Hampi are a UNESCO site.",""],
["L12","The Vittalaswamy and Hazara Rama temples at Hampi were built by:",["Krishnadeva Raya","Harihara I","Devaraya II","Ramaraya"],"Krishnadeva Raya, the greatest Vijayanagara ruler, built both.",""],
["L12","Vijayanagara was led at the Battle of Talikota by:",["Ramaraya","Krishnadeva Raya","Harihara II","Devaraya II"],"Ramaraya of the Aravidu line commanded the Vijayanagara army in 1565 and was killed; Krishnadeva Raya had died in 1529.",""],
["L12","The Italian traveller Nicolo Conti visited the court of:",["Devaraya I","Devaraya II","Krishnadeva Raya","Ramaraya"],"Nicolo Conti came under Devaraya I, while the Persian envoy Abdur Razzaq came under Devaraya II.",""],
["L12","Jaunpur, a great centre of learning under the Sharqi rulers, was known as:",["The Shiraz of India","The Manchester of India","The Venice of the East","The Rome of the East"],"Jaunpur was called the Shiraz of India for its scholarship; its Atala Masjid is the best-known Sharqi building.",""],
["L12","The Vijayanagara practice of granting territory to military commanders in return for troops was called the:",["Amara-nayaka system","Iqta system","Mansabdari system","Zamindari system"],"Under the amara-nayaka system a nayaka held land and maintained soldiers for the king, somewhat like the earlier iqta.",""],
["L13","The four mathas at Sringeri, Dwarka, Puri and Badrinath were established by:",["Shankaracharya","Ramanuja","Madhvacharya","Basava"],"Shankaracharya, born at Kaladi in Kerala, set up the four mathas and taught Advaita.",""],
["L13","Who was the only woman among the twelve Alvar saints?",["Andal","Akka Mahadevi","Mirabai","Lalleshwari"],"Andal of Tamil Nadu was the one woman Alvar. Akka Mahadevi was a woman Lingayat saint of Karnataka.",""],
["L13","The Pushtimarg sect of Krishna devotion was founded by:",["Vallabhacharya","Nimbarka","Chaitanya Mahaprabhu","Ramananda"],"Vallabhacharya, who taught Shuddhadvaita, founded the Pushtimarg.",""],
["L13","The 'Bijak', a collection of verses, is associated with:",["Kabir","Guru Nanak","Ravidas","Dadu Dayal"],"The Bijak gathers Kabir's dohas and sakhis; some of his verses are also in the Guru Granth Sahib.",""],
["L13","The dargah of Baba Farid, the Chishti saint, is at:",["Pakpattan (Ajodhan)","Ajmer","Delhi","Multan"],"Baba Farid's dargah is at Pakpattan. Ajmer has Moinuddin Chishti's and Delhi Nizamuddin Auliya's.",""],
["L14","At the Battle of Haldighati in 1576, Akbar's army was led against Maharana Pratap by:",["Raja Man Singh","Bairam Khan","Raja Todar Mal","Abdur Rahim Khan-i-Khanan"],"Man Singh of Amber commanded the Mughal force; Pratap withdrew but never submitted.",""],
["L14","The Battle of Samugarh in 1659 was fought between Aurangzeb and:",["Dara Shikoh","Shah Shuja","Murad Baksh","Shah Jahan"],"Aurangzeb defeated his eldest brother Dara Shikoh at Samugarh in the war of succession.",""],
["L14","Babur wrote his memoir, the Baburnama, in which language?",["Turki","Persian","Arabic","Urdu"],"Babur wrote in Turki; Abdur Rahim Khan-i-Khanan later translated it into Persian. Jahangir's memoir was in Persian.",""],
["L14","The only notable follower of Akbar's Din-i-Ilahi was:",["Birbal","Abul Fazl","Todar Mal","Tansen"],"Din-i-Ilahi, proclaimed in 1582, won almost no converts; Birbal is the one courtier named as joining it.","p"],
["L14","Babur was invited to invade India against Ibrahim Lodi by:",["Daulat Khan Lodi","Rana Sanga of Mewar","Hemu","Medini Rai"],"Daulat Khan Lodi, the governor of Punjab, and Alam Khan invited Babur, who then won the First Battle of Panipat.",""],
["L14","'Padmavat' was composed during the reign of Sher Shah Suri by:",["Malik Muhammad Jayasi","Abul Fazl","Tulsidas","Jayadeva"],"Jayasi wrote the Awadhi poem Padmavat at Sher Shah's time; Tulsidas wrote the Ramcharitmanas under Akbar.",""],
["L15","The Mughal official who kept land records at the village level was the:",["Patwari","Amil","Faujdar","Subedar"],"The Patwari kept village records and the Qanungo those of the pargana; the Amil collected revenue.",""],
["L15","The head of the city police in Mughal administration was the:",["Kotwal","Faujdar","Subedar","Amalguzar"],"The Kotwal policed the city, while the Faujdar had charge of a sarkar or district.",""],
["L15","Which later Mughal emperor was nicknamed 'Shah-i-Bekhabar'?",["Bahadur Shah I","Jahandar Shah","Muhammad Shah","Alamgir II"],"Bahadur Shah I was called the heedless king. Muhammad Shah was nicknamed 'Rangila'.",""],
["L15","Niccolao Manucci, who wrote 'Storia do Mogor', came from:",["Italy","France","England","Portugal"],"Manucci was Italian. Bernier and Tavernier were French, and Hawkins and Roe English.",""],
["L15","A revenue-free grant made to scholars and religious men was called:",["Inam","Jagir","Khalisa","Watan jagir"],"Inam was revenue-free. A jagir carried a revenue assignment for service, and khalisa land paid into the treasury.",""],
["L16","Shivaji's mother and his spiritual guru were:",["Jijabai and Ramdas","Tarabai and Tukaram","Jijabai and Tukaram","Soyarabai and Ramdas"],"His mother was Jijabai and his guru Samarth Ramdas, author of Dasbodh; Dadaji Kondadev was his teacher.",""],
["L16","Shivaji plundered the rich Mughal port of Surat in:",["1664","1659","1666","1674"],"He raided Surat in 1664, a year after attacking Shaista Khan at Pune.",""],
["L16","In Shivaji's Ashtapradhan, the minister in charge of justice was the:",["Nyayadhish","Panditrao","Sachiv","Mantri"],"Nyayadhish handled justice and Panditrao religion and charity; the Sachiv looked after correspondence.",""],
["L16","Who led the Sikhs against the Mughals after the death of Guru Gobind Singh in 1708?",["Banda Bahadur","Maharaja Ranjit Singh","Jassa Singh Ahluwalia","Gulab Singh"],"Banda Bahadur fought the Mughals from 1708 to 1716; Ranjit Singh built the Sikh kingdom much later.",""],
["L16","The Akal Takht at Amritsar was established by:",["Guru Hargobind","Guru Arjan Dev","Guru Ram Das","Guru Gobind Singh"],"The sixth Guru, Hargobind, built the Akal Takht and adopted the two swords of miri and piri.",""]
];

{"era":"med","rows":[["712","Muhammad bin Qasim conquers Sindh; defeats Dahir"],["1000-1027","Mahmud of Ghazni's raids; Somnath temple sacked in 1025"],["1191","First Battle of Tarain - Prithviraj Chauhan defeats Muhammad Ghori"],["1192","Second Battle of Tarain - Ghori defeats Prithviraj Chauhan"],["1206","Qutbuddin Aibak founds the Slave dynasty"],["1236-1240","Razia Sultan - the only woman ruler of Delhi"],["1266-1287","Balban - sijda, paibos and the Iqta discipline"],["1290","Jalaluddin Khalji founds the Khalji dynasty"],["1296-1316","Alauddin Khalji - market control, Dagh and Chehra system"],["1320","Ghiyasuddin Tughlaq founds the Tughlaq dynasty"],["1325-1351","Muhammad bin Tughlaq - capital shift to Daulatabad, token currency"],["1333","Ibn Battuta arrives in India"],["1336","Vijayanagara founded by Harihara and Bukka (Sangama dynasty)"],["1347","Bahmani kingdom founded by Alauddin Bahman Shah"],["1351-1388","Firoz Shah Tughlaq - Jaziya, canals, Diwan-i-Khairat"],["1398","Timur invades India and sacks Delhi"],["1414","Sayyid dynasty founded by Khizr Khan"],["1451","Bahlol Lodi founds the Lodi dynasty"],["1509-1529","Krishnadeva Raya of Vijayanagara (Tuluva dynasty)"],["1526","First Battle of Panipat - Babur defeats Ibrahim Lodi"],["1527","Battle of Khanwa - Babur defeats Rana Sanga"],["1539-1540","Chausa and Kanauj - Sher Shah Suri defeats Humayun"],["1556","Second Battle of Panipat; Akbar's accession"],["1565","Battle of Talikota - Vijayanagara defeated by the Deccan sultanates"],["1576","Battle of Haldighati - Akbar's forces against Rana Pratap"],["1582","Akbar proclaims Din-i-Ilahi"],["1605-1627","Jahangir; Captain Hawkins and Sir Thomas Roe visit his court"],["1628-1658","Shah Jahan - Taj Mahal, Red Fort, Jama Masjid"],["1658-1707","Aurangzeb Alamgir; Jaziya re-imposed in 1679"],["1674","Shivaji crowned Chhatrapati at Raigarh"],["1699","Guru Gobind Singh founds the Khalsa at Anandpur Sahib"],["1761","Third Battle of Panipat - Ahmad Shah Abdali defeats the Marathas"]]}
];
const LASTMOMENT = [
{"t":"Sultanate innovation to Sultan","era":["med"],"rows":[["Iqta system introduced","Iltutmish"],["Sijda and paibos; Diwan-i-Arz","Balban"],["Market control, Dagh and Chehra, price fixing","Alauddin Khalji"],["Permanent standing army paid in cash","Alauddin Khalji"],["Token currency; capital moved to Daulatabad","Muhammad bin Tughlaq"],["Diwan-i-Kohi (agriculture department)","Muhammad bin Tughlaq"],["Jaziya as a separate tax; Diwan-i-Khairat","Firoz Shah Tughlaq"],["Canals and the Diwan-i-Bandagan","Firoz Shah Tughlaq"],["Qutub Minar begun / completed","Begun by Aibak, completed by Iltutmish"],["Silver tanka and copper jital introduced","Iltutmish"]]},
{"t":"Mughal battles and years","era":["med"],"rows":[["First Battle of Panipat","1526 - Babur defeats Ibrahim Lodi"],["Battle of Khanwa","1527 - Babur defeats Rana Sanga"],["Battle of Chanderi","1528 - Babur defeats Medini Rai"],["Battle of Ghaghra","1529 - Babur defeats the Afghans"],["Battle of Chausa","1539 - Sher Shah defeats Humayun"],["Battle of Kanauj (Bilgram)","1540 - Humayun loses the empire"],["Second Battle of Panipat","1556 - Bairam Khan defeats Hemu"],["Battle of Talikota","1565 - fall of Vijayanagara"],["Battle of Haldighati","1576 - Akbar's army vs Rana Pratap"],["Battle of Samugarh","1658 - Aurangzeb defeats Dara Shikoh"],["Third Battle of Panipat","1761 - Abdali defeats the Marathas"]]}
];
const TILES = [
["1192","Second Battle of Tarain","med"],
["1526","First Battle of Panipat","med"],
["1761","Third Battle of Panipat","med"]
];
const ERANOTE = {"med":"Revise Delhi Sultanate innovations and Mughal battle years first, then Bhakti-Sufi saints - medieval India is good for about 1-2 marks in Tier-1."};
const INTROS = {"histmedieval":{"lead":"Medieval India covers roughly 700 to 1760 CE: the Turkish invasions, the Delhi Sultanate, Vijayanagara and the Bahmanis, the Mughals, and the rise of the Marathas and Sikhs. It is mostly a story of rulers and their reforms, plus the Bhakti and Sufi saints who changed everyday religion.","tip":"Keep one list of dynasties in order and pin every reform, building or battle to a named ruler, because most exam traps swap two rulers.","order":"Do L9 to L12 for the invasions, the Sultanate and the southern kingdoms, then L13 on the saints, then L14 to L16 on the Mughals, Marathas and Sikhs, since that is the order in which they happened."}};
const HEATMAP = null;
</script>

<script>
"use strict";
/* ============================================================
   Workbook engine — shared by the History and Computer Knowledge pages (tools/workbook/lib.js puts it in each one).
   APP.mode "era": a subject app with its own lessons and questions (Learn · Practice · Mock · Revise · Plan).
   APP.mode "hub": start here, a plan across a family of apps, and revision across all of them (no questions of its own).
   Optional data: APP.hub (a family hub to link to), HEATMAP (where the marks come from, by exam),
   a question's 8th field (the paper it was reported from).
   ============================================================ */
const HUB = APP.mode === "hub";
const EMBED = (() => { try { return window.parent !== window; } catch(e) { return true; } })();
const TABS = HUB ? ["start","plan","revise"] : ["learn","practice","mock","revise","plan"];

/* ============================================================
   HELPERS & STATE
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hash = s => { let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5)+h + s.charCodeAt(i))|0; return "q"+(h>>>0).toString(36); };
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; };
const L = id => LESSONS.find(l => l.id === id);
const LNUM = id => LESSONS.findIndex(l => l.id === id) + 1;
const G = id => GROUPS.find(g => g.id === id) || GROUPS[0];
const A = id => APP.apps.find(a => a.id === id);
const appOf = id => (L(id) && L(id).app) || APP.id;       // in the hub, each lesson carries the app it lives in

const QS = QB.map(r => {
  const fixed = !!r[6];
  return { t:r[0], q:r[1], o:r[2], e:r[3], p:(r[4]||"").includes("p"), a: fixed ? (r[5]||0) : 0, fixed, id:hash(r[1]), src: r[7] || "" };
});
const byLesson = id => QS.filter(q => q.t === id);
const makePerm = q => q.fixed ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i));
const qCount = id => HUB ? null : byLesson(id).length;
const pCount = id => HUB ? ((APP.pcount||{})[id] || 0) : byLesson(id).filter(q=>q.p).length;

const KEY = APP.key;
let S = { ans:{}, bm:{}, les:{}, mocks:[], plan:null };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const record = (q, ok) => { S.ans[q.id] = ok ? 1 : 0; save(); renderTop(); };

/* Another History app's saved progress. Every page is on the same site, so the hub (and a
   plan) can see which lessons you have read and quizzed in the subject apps. */
function appState(a){ try { return JSON.parse(localStorage.getItem(a.key) || "{}") || {}; } catch(e) { return {}; } }
function lessonState(id){
  const owner = appOf(id);
  if (owner === APP.id) return S.les[id] || {};
  const a = A(owner); return a ? ((appState(a).les || {})[id] || {}) : {};
}
const lesDone = l => !!lessonState(l.id).done;
const heatDots = n => `<span class="dots" aria-label="Asked ${n===3?"almost every shift":n===2?"often":"now and then"}">${[1,2,3].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>`;

/* Open a lesson or a tab, here or in the History app it lives in. Inside पाठShala the
   app is asked to switch (so your session is tracked); on its own the page just navigates. */
function openApp(appId, lesson, tab){
  if (appId === APP.id) {
    if (lesson) openLesson(lesson, "learn"); else go(tab || TABS[0]);
    return;
  }
  const a = APP.hub && appId === APP.hub.id ? APP.hub : A(appId);
  if (!a) return;
  const here = () => { location.href = a.file + (lesson ? "?lesson=" + encodeURIComponent(lesson) : "") + (tab ? "#" + tab : ""); };
  if (!EMBED) return here();
  let ok = false;
  const onAck = e => { if (e.origin === location.origin && e.data && e.data.type === "shabd-open-ok") ok = true; };
  window.addEventListener("message", onAck);
  try { window.parent.postMessage({ type:"shabd-open", mod:a.id, lesson: lesson || null, tab: tab || null }, location.origin); } catch(e) {}
  setTimeout(() => { window.removeEventListener("message", onAck); if (!ok) here(); }, 700);
}
const hubLink = (before, label, tab, after) => APP.hub ? before + goLink(label, APP.hub.id, null, tab) + (after || "") : "";
const goLink = (label, appId, lesson, tab) => `<button type="button" class="golink" data-go="${esc(JSON.stringify([appId, lesson||null, tab||null]))}">${label}</button>`;
function bindGo(root){
  root.querySelectorAll("[data-go]").forEach(b => b.onclick = ev => { ev.stopPropagation(); const g = JSON.parse(b.dataset.go); openApp(g[0], g[1], g[2]); });
}

function renderTop(){
  if (HUB) {
    const done = LESSONS.filter(lesDone).length;
    $("#topstat").innerHTML = `<b>${done}</b>/${LESSONS.length} lessons<br>in ${APP.apps.length} apps`;
    return;
  }
  const ids = Object.keys(S.ans).filter(k => QS.some(q => q.id === k));
  const right = ids.filter(k => S.ans[k] === 1).length;
  const pct = ids.length ? Math.round(right*100/ids.length) : 0;
  $("#topstat").innerHTML = `<b>${ids.length}</b>/${QS.length} tried<br><b>${pct}%</b> right now`;
}

/* ============================================================
   ROUTING
   ============================================================ */
let TAB = TABS[0];
let timerId = null;
function go(tab){
  if (!TABS.includes(tab)) tab = TABS[0];
  TAB = tab;
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.tab===tab ? "page" : "false"));
  if (tab === "start") renderStart();
  if (tab === "learn") renderLearn();
  if (tab === "practice") renderPractice();
  if (tab === "mock") renderMock();
  if (tab === "revise") renderRevise();
  if (tab === "plan") renderPlan();
  window.scrollTo(0,0);
  try { history.replaceState(null, "", location.pathname + location.search + "#" + tab); } catch(e) {}
}
document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => {
  if (TAB === "mock" && M && M.running && b.dataset.tab !== "mock") { go("mock"); showMockLeave(b.dataset.tab); return; }
  go(b.dataset.tab);
}));

/* ============================================================
   START HERE (hub)
   ============================================================ */
function renderStart(){
  const done = LESSONS.filter(lesDone).length;
  const cards = APP.apps.map(a => {
    const ls = LESSONS.filter(l => l.app === a.id), d = ls.filter(lesDone).length, it = INTROS[a.id] || {};
    return `<button type="button" class="appc" data-go="${esc(JSON.stringify([a.id,null,null]))}">
      <div class="hd"><span class="ic" aria-hidden="true">${a.ico}</span><span><b>${esc(a.title)}</b><small>${esc(a.hi)}</small></span><span class="go">Open ›</span></div>
      ${it.lead ? `<p>${esc(it.lead)}</p>` : ""}
      <div class="meter"><i style="width:${ls.length ? d/ls.length*100 : 0}%"></i></div>
      <span class="meta">${d}/${ls.length} lessons done · ${(APP.qcount||{})[a.id] || 0} questions</span></button>`;
  }).join("");
  const tips = APP.apps.filter(a => INTROS[a.id]).map(a => `<div><dt>${esc(a.title)}</dt><dd>${esc(INTROS[a.id].tip)} ${esc(INTROS[a.id].order)}</dd></div>`).join("");
  $("#app").innerHTML = `<section class="view stack">
    <div class="hero">
      <span class="eyebrow">New to history? Start here</span>
      <h1>History, from zero to exam-ready</h1>
      <p>SSC splits history into five subjects, so these are five apps &mdash; Ancient, Medieval, Modern, Art &amp; Culture, and World &mdash; with ${LESSONS.length} lessons between them. You do not need to know anything before you begin: every lesson opens with a two-minute story that explains what happened and why, and only then gives you the tables, tricks and traps the exam asks about.</p>
      <div class="meter" aria-label="Lessons done in every History app"><i style="width:${done/LESSONS.length*100}%"></i></div>
      <div class="row between"><span class="muted num" style="font-size:13px">${done}/${LESSONS.length} lessons done across the apps</span>
        <button class="btn pri sm" type="button" id="toplan">${S.plan ? "Open my plan" : "Make a study plan"}</button></div>
    </div>
    <div class="block"><h3>How to use these apps</h3><ol class="steps-list">
      <li><b>Pick a plan</b> in the Plan tab &mdash; 5, 7, 10, 15 or 30 days. It tells you exactly what to read each day, and ticks itself as you finish lessons in the apps.</li>
      <li><b>Read the story first</b> in every lesson, then the tables. The <b>Trick</b> boxes help you remember; the <b>Trap</b> boxes are the pairs SSC swaps to catch you.</li>
      <li><b>Take the quiz</b> at the end of each lesson. Anything you get wrong waits for you under Practice &rarr; Mistakes until you get it right.</li>
      <li><b>Revise in layers</b> in the Revise tab here: 30 days out read every summary, in the last week only the most-asked lessons, and in the final hour the Last moment sheet.</li>
    </ol></div>
    <h2>The five apps</h2>
    <div class="appcs">${cards}</div>
    ${tips ? `<div class="block"><h3>How to study each one</h3><dl class="facts prose">${tips}</dl></div>` : ""}
    <div class="block"><h3>Where the marks are</h3><dl class="facts prose">${GROUPS.filter(g=>ERANOTE[g.id]).map(g=>`<div><dt>${esc(g.name)}</dt><dd>${ERANOTE[g.id]}</dd></div>`).join("")}</dl>
      <p class="muted" style="font-size:13px;margin-top:8px">The dots next to each lesson show how often its topic comes up: three dots means almost every shift.</p></div>
  </section>`;
  bindGo($("#app"));
  $("#toplan").onclick = () => go("plan");
}

/* ============================================================
   LEARN (subject app)
   ============================================================ */
function lessonRow(l, nextL){
  const st = lessonState(l.id), n = byLesson(l.id).length;
  return `<button type="button" class="les ${lesDone(l)?"done":""} ${nextL&&l.id===nextL.id?"next":""}" data-open="${l.id}">
    <span class="no">${lesDone(l) ? "✓" : LNUM(l.id)}</span>
    <span class="t"><b>${esc(l.title)}${heatDots(l.heat)}</b><span>${l.hi} · ${n} questions</span></span>
    <span class="sc">${st.best!=null ? `best<br>${st.best}/${n}` : ""}</span></button>`;
}
function renderLearn(){
  const done = LESSONS.filter(lesDone).length;
  const nextL = LESSONS.find(l => !lesDone(l));
  const it = INTROS[APP.id] || {};
  const parts = [];
  LESSONS.forEach(l => {
    const name = l.part ? l.part[0] : "";
    if (!parts.length || parts[parts.length-1].name !== name) parts.push({ name, hi: l.part ? l.part[1] : "", ls: [] });
    parts[parts.length-1].ls.push(l);
  });
  $("#app").innerHTML = `<section class="view stack">
    <div class="hero">
      <span class="eyebrow">${esc(APP.hi)}${APP.tagline ? " \u00b7 " + esc(APP.tagline) : ""}</span>
      <h1>${esc(APP.title)}</h1>
      <p>${it.lead ? esc(it.lead) + " " : ""}${LESSONS.length} lessons and ${QS.length} exam-style questions. Each lesson starts with a short story, then the tables, tricks and traps, a quiz and a one-screen summary.</p>
      <div class="meter" aria-label="Lessons done"><i style="width:${done/LESSONS.length*100}%"></i></div>
      <div class="row between"><span class="muted num" style="font-size:13px">${done}/${LESSONS.length} lessons done</span>
      ${nextL ? `<button class="btn pri sm" type="button" data-open="${nextL.id}">${done? "Continue" : "Start"}: ${esc(nextL.title)}</button>` : `<span class="muted" style="font-size:13px">All lessons done. Try a mock test.</span>`}</div>
    </div>
    ${it.tip ? `<div class="callout"><b>How to study it.</b> ${esc(it.tip)} ${esc(it.order || "")}</div>` : ""}
    ${HEATMAP ? `<details class="block hmwrap"><summary><h3>Exam heat map</h3><span class="muted">which lessons carry the marks in each exam \u203a</span></summary>${heatHTML(false)}</details>` : ""}
    ${parts.map(p => `${p.name ? `<div class="grph"><h2>${esc(p.name)}</h2><span>${p.ls.length} lessons</span></div>${p.hi?`<p class="muted" style="font-size:13px;margin:-8px 0 2px">${p.hi}</p>`:""}` : ""}
      <div class="lessons">${p.ls.map(l => lessonRow(l, nextL)).join("")}</div>`).join("")}
    <p class="foot">The dots show how often a topic is asked &mdash; three dots means almost every paper.${hubLink(" A plan across every app in this subject, and revision across all of them, is in ", APP.hub ? APP.hub.title : "", null, ".")}</p>
  </section>`;
  $("#app").querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openLesson(b.dataset.open, "learn")));
  bindGo($("#app"));
}

function blockHTML(b){
  if (b.k==="p") return `<div class="plain"><p>${b.h}</p></div>`;
  if (b.k==="hot") return `<div class="hot"><span class="lab">Why it is asked</span>${b.h}</div>`;
  if (b.k==="story") return `<div class="story"><span class="lab">${esc(APP.storyLabel || "The story first \u00b7 two minutes")}</span>${b.h}${b.key?`<p class="key"><b>${esc(APP.keyLabel || "Carry this into the tables:")}</b> ${esc(b.key)}</p>`:""}</div>`;
  if (b.k==="trick") return `<div class="trick"><span class="lab">Trick</span>${b.h}</div>`;
  if (b.k==="trap") return `<div class="trap"><span class="lab">Trap · don't mix these up</span>${b.h}</div>`;
  if (b.k==="link") return `<div class="link"><span class="lab">Link it up</span>${b.h}</div>`;
  if (b.k==="facts") return `<div class="block"><h3>${b.title}</h3><dl class="facts">${b.rows.map(r=>`<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join("")}</dl></div>`;
  if (b.k==="tl") return `<div class="block"><h3>${b.title}</h3><ul class="tl">${b.rows.map(r=>`<li><span class="y">${r[0]}</span><span>${r[1]}</span></li>`).join("")}</ul></div>`;
  if (b.k==="table") return `<div class="block"><h3>${b.title}</h3><div class="tbl"><table><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  if (b.k==="fig") return `<div class="block"><h3>${b.title}</h3><figure class="fig">${b.svg}<figcaption>${b.cap}</figcaption></figure></div>`;
  return "";
}

let LQ = null;
function openLesson(id, step){
  if (HUB || !L(id) || appOf(id) !== APP.id) { openApp(appOf(id), id); return; }   // the hub shows lessons in their own app
  const l = L(id), i = LNUM(id);
  if (step === "quiz") { LQ = { id, list: shuffle(byLesson(id)).map(q => ({q, perm:makePerm(q)})), i:0, score:0, picked:null }; }
  const head = `<div class="lhead"><button class="back" type="button" id="lback">‹ Lessons</button></div>
    <span class="eyebrow">${esc(APP.title)} · Lesson ${i} of ${LESSONS.length} · ${l.hi}</span><h1>${esc(l.title)}</h1>
    <p class="muted" style="font-size:13px">Asked in CGL ${heatDots(l.heat)} ${l.heat===3?"— almost every shift":l.heat===2?"— often":"— now and then"}</p>
    <div class="steps" role="tablist">
      <button type="button" data-step="learn" aria-current="${step==="learn"?"step":"false"}">1 · Learn</button>
      <button type="button" data-step="quiz" aria-current="${step==="quiz"?"step":"false"}">2 · Quiz</button>
      <button type="button" data-step="sum" aria-current="${step==="sum"?"step":"false"}">3 · Summary</button>
    </div>`;
  let body = "";
  if (step === "learn") {
    body = `<div class="stack">${l.blocks.map(blockHTML).join("")}
      <div class="row end"><button class="btn pri" type="button" id="toquiz">Take the quiz · ${byLesson(id).length} questions</button></div></div>`;
  } else if (step === "quiz") {
    body = `<div id="lq"></div>`;
  } else {
    const nxt = LESSONS[i];
    body = `<div class="stack"><div class="block"><h3>Remember these</h3><ul class="sum">${l.sum.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
      <div class="row between"><button class="btn" type="button" id="relearn">Read again</button>
      ${nxt ? `<button class="btn pri" type="button" id="nextles">Next: ${esc(nxt.title)}</button>` : `<button class="btn pri" type="button" id="tomock">Take a mock test</button>`}</div></div>`;
    S.les[id] = Object.assign(S.les[id]||{}, {done:1}); save(); renderTop();
  }
  $("#app").innerHTML = `<section class="view stack">${head}${body}</section>`;
  $("#lback").onclick = () => go("learn");
  $("#app").querySelectorAll("[data-step]").forEach(b => b.onclick = () => openLesson(id, b.dataset.step));
  if (step==="learn") $("#toquiz").onclick = () => openLesson(id,"quiz");
  if (step==="quiz") renderLQ();
  if (step==="sum") {
    $("#relearn").onclick = () => openLesson(id,"learn");
    const n = $("#nextles"); if (n) n.onclick = () => openLesson(LESSONS[i].id,"learn");
    const m = $("#tomock"); if (m) m.onclick = () => go("mock");
  }
  window.scrollTo(0,0);
}

function optsHTML(q, perm, state){
  return perm.map((oi, k) => {
    let cls = "opt";
    if (state.reveal) { if (oi === q.a) cls += " ok"; else if (oi === state.picked) cls += " no"; }
    else if (state.sel === oi) cls += " sel";
    return `<button type="button" class="${cls}" data-oi="${oi}" ${state.reveal?"disabled":""}><span class="k">${"ABCD"[k]}</span><span>${esc(q.o[oi])}</span></button>`;
  }).join("");
}
function expHTML(q, picked){
  const ok = picked === q.a;
  return `<div class="exp">${ok ? `<b class="okl">Correct.</b>` : `<b class="nol">Answer: ${esc(q.o[q.a])}.</b>`} ${esc(q.e)}</div>`;
}
function metaHTML(q, no){
  return `<div class="qmeta"><span class="qno">${no}</span><span class="tag">L${LNUM(q.t)} \u00b7 ${esc(L(q.t).title)}</span>${q.src?`<span class="tag src" title="Reported by candidates after this paper (memory-based)">\ud83d\udcdc ${esc(q.src)}</span>`:""}${q.p?`<span class="tag pyq" title="This fact comes up again and again in SSC papers">Repeatedly asked</span>`:""}
  <button type="button" class="bm" data-bm="${q.id}" aria-pressed="${S.bm[q.id]?"true":"false"}" aria-label="Bookmark">${S.bm[q.id]?"★":"☆"}</button></div>`;
}

function renderLQ(){
  const box = $("#lq");

function bindBM(root){
  root.querySelectorAll("[data-bm]").forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    const id = b.dataset.bm; if (S.bm[id]) delete S.bm[id]; else S.bm[id] = 1; save();

}

let PF = "all", PSHOW = 20, PORDER = null, PPERM = {}, PPICK = {};

function practiceList(){

  else if (PF === "hot") list = QS.filter(q => L(q.t).heat === 3);
  else if (PF === "wrong") list = QS.filter(q => S.ans[q.id] === 0);

}
function renderPractice(){
  const wrongN = QS.filter(q => S.ans[q.id] === 0).length, bmN = QS.filter(q=>S.bm[q.id]).length;
  const pyqN = QS.filter(q=>q.p).length, hotN = QS.filter(q=>L(q.t).heat===3).length;

    <div class="chips" role="group" aria-label="Filter">${chips.map(c=>`<button type="button" class="chip" data-f="${c[0]}" aria-pressed="${PF===c[0]}">${esc(c[1])}</button>`).join("")}</div>
    <div class="row between"><span class="muted num" style="font-size:13px">${list.length} questions</span>

  $("#pshuf").onclick = () => { PORDER = PORDER ? null : shuffle(QS.map(q=>q.id)); PSHOW = 20; renderPractice(); };

function pCard(q, idx){
  if (!PPERM[q.id]) PPERM[q.id] = makePerm(q);
  const picked = PPICK[q.id]; const reveal = picked !== undefined;
  return `<article class="qcard" data-q="${q.id}">${metaHTML(q, "Q"+(idx+1))}<p class="qt">${esc(q.q)}</p>
    <div class="opts">${optsHTML(q, PPERM[q.id], {picked: reveal?picked:null, reveal})}</div>${reveal?expHTML(q,picked):""}</article>`;
}
function drawPList(){
  const list = practiceList(), box = $("#plist");
  if (!list.length) { box.innerHTML = `<p class="empty">${PF==="wrong"?"No mistakes saved. Answer some questions first, or you've cleared them all.":PF==="bm"?"Nothing starred yet. Tap ☆ on any question.":"Nothing here."}</p>`; return; }
  box.innerHTML = list.slice(0, PSHOW).map((q,i)=>pCard(q,i)).join("") + (list.length > PSHOW ? `<button class="btn" type="button" id="pmore">Show 20 more (${list.length-PSHOW} left)</button>` : "");
  box.querySelectorAll(".qcard").forEach(bindCard);
  const more = $("#pmore"); if (more) more.onclick = () => { PSHOW += 20; drawPList(); };
}
function bindCard(card){
  card.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const q = QS.find(x => x.id === card.dataset.q); if (PPICK[q.id] !== undefined) return;
    PPICK[q.id] = +b.dataset.oi; record(q, PPICK[q.id] === q.a);
    const idx = +card.querySelector(".qno").textContent.slice(1) - 1;
    const tmp = document.createElement("div"); tmp.innerHTML = pCard(q, idx); const nc = tmp.firstElementChild;
    card.replaceWith(nc); bindCard(nc);
  });
  bindBM(card);
}

/* ============================================================

let M = null, MCFG = {n:25, scope:"all", neg:1}, LEAVE_TO = null;
function mockPool(scope){

  if (scope === "src") return QS.filter(q=>q.src);
  if (scope === "hot") return QS.filter(q=>L(q.t).heat===3);

  return QS.filter(q=>q.t===scope);
}
function renderMock(){

function startTimer(){

const fmt = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;

  const lvn = $("#lvn"); if (lvn) lvn.onclick = () => { LEAVE_TO = null; drawMockRun(); };
}
function showMockLeave(tab){ LEAVE_TO = tab; drawMockRun(); }
function submitMock(){
  if (!M || !M.running) return;
  clearInterval(timerId);
  M.running = false; M.done = true; M.confirm = false;
  let c=0,w=0,sk=0; const per = {};
  M.list.forEach((it,k) => {
    const a = M.ans[k], t = it.q.t; per[t] = per[t] || {c:0,n:0}; per[t].n++;
    if (a===null) sk++; else if (a===it.q.a) { c++; per[t].c++; S.ans[it.q.id]=1; } else { w++; S.ans[it.q.id]=0; }
  });
  const max = M.list.length*2, score = +(c*2 - (M.neg? w*0.5 : 0)).toFixed(1);
  const used = Math.min(M.secs, Math.round((Date.now()-M.start)/1000));
  M.res = {c,w,sk,score,max,used,per, acc: (c+w) ? Math.round(c*100/(c+w)) : 0};
  const d = new Date(); const ds = d.toLocaleDateString("en-IN",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
  S.mocks = (S.mocks||[]).concat([{d:ds, n:M.list.length, score, max, acc:M.res.acc}]).slice(-20); save(); renderTop();
  M.filter = "wrong";
  if (TAB==="mock") drawMockResult();
}

    <div class="row between"><button class="btn" type="button" id="mnew">New test</button><button class="btn pri" type="button" id="mretry">Retake same questions</button></div>
    <h2>Review</h2>
    <div class="chips">${[["wrong",`Wrong ${r.w}`],["skip",`Skipped ${r.sk}`],["all",`All ${M.list.length}`]].map(c=>`<button class="chip" type="button" data-rf="${c[0]}" aria-pressed="${M.filter===c[0]}">${c[1]}</button>`).join("")}</div>
    <div class="stack">${rows.length ? rows.map(({it,k}) => `<article class="qcard">${metaHTML(it.q, "Q"+(k+1))}<p class="qt">${esc(it.q.q)}</p><div class="opts">${optsHTML(it.q, it.perm, {picked:M.ans[k], reveal:true})}</div>${M.ans[k]===null?`<div class="exp"><b class="nol">Skipped. Answer: ${esc(it.q.o[it.q.a])}.</b> ${esc(it.q.e)}</div>`:expHTML(it.q, M.ans[k])}</article>`).join("") : `<p class="empty">Nothing in this list.</p>`}</div>

  }
  if (RV === "nums") box.innerHTML = `<div class="tiles">${TILES.map(t=>`<div class="tile"><span class="num">${t[0]}</span><span>${t[1]}</span></div>`).join("")}</div>`;
  if (RV === "flash") drawFlash(box);
}
/* Where the marks come from: lessons × exams, 0–3. The note says what the levels are based on. */
function heatHTML(full){

  const rows = H.rows.filter(r => L(r.id)).map(r => `<tr><th scope="row"><button type="button" class="golink" data-open="${r.id}">${esc(L(r.id).title)}</button></th>${r.v.map((v,i) =>

  return `<div class="tbl"><table class="hmt"><thead><tr><th>Lesson</th>${H.cols.map(c => `<th>${esc(c.label)}${c.sub ? `<small>${esc(c.sub)}</small>` : ""}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hmkey"><span class="hm h3"><span>\u25cf\u25cf\u25cf</span></span> almost every paper <span class="hm h2"><span>\u25cf\u25cf</span></span> often <span class="hm h1"><span>\u25cf</span></span> now and then <span class="hm h0"><span>\u2013</span></span> not in the syllabus</p>
    ${full && H.pattern ? `<div class="block"><h3>${esc(H.pattern.title)}</h3><div class="tbl"><table><thead><tr>${H.pattern.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${H.pattern.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${H.pattern.note ? `<p class="muted" style="font-size:13px;margin-top:8px">${H.pattern.note}</p>` : ""}</div>` : ""}
    ${full && H.tips ? `<div class="block"><h3>How to score in this section</h3><ul class="sum">${H.tips.map(t => `<li>${t}</li>`).join("")}</ul></div>` : ""}

}
function digestGroups(list){
  if (HUB) return APP.apps.map(a => ({ name: a.title, note: ERANOTE[a.era] || "", ls: list.filter(l => l.app === a.id) }));
  const out = [];
  list.forEach(l => {
    const name = l.part ? l.part[0] : APP.title;
    if (!out.length || out[out.length-1].name !== name) out.push({ name, note: out.length ? "" : (ERANOTE[APP.era] || ""), ls: [] });
    out[out.length-1].ls.push(l);
  });
  return out;
}
function drawDigest(box, list, note){
  box.innerHTML = `<input class="search" id="dgs" type="search" placeholder="Search the summaries (e.g. Lothal, jizya, Dandi)" aria-label="Search summaries">
    <p class="muted" style="font-size:14px">${note}</p><div id="dgl" class="stack"></div>`;
  const draw = () => {
    const s = $("#dgs").value.trim().toLowerCase();
    const html = digestGroups(list).map(g => {
      const ls = g.ls.map(l => {
        const pts = l.sum.filter(p => !s || p.toLowerCase().includes(s) || l.title.toLowerCase().includes(s));
        if (!pts.length) return "";
        return `<div class="block"><h3>${esc(l.title)} ${heatDots(l.heat)}</h3><ul class="sum">${pts.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
          <p style="margin-top:8px;font-size:14px">${goLink("Open the lesson ›", appOf(l.id), l.id)}</p></div>`;
      }).filter(Boolean);
      if (!ls.length) return "";
      return `<div class="grph"><h2>${esc(g.name)}</h2><span>${ls.length} lessons</span></div>
        ${g.note && !s ? `<p class="muted" style="font-size:13px;margin:-8px 0 2px">${g.note}</p>` : ""}${ls.join("")}`;
    }).join("");
    $("#dgl").innerHTML = html || `<p class="empty">Nothing matches that.</p>`;
    bindGo($("#dgl"));
  };
  $("#dgs").oninput = draw; draw();
}
function drawLastMoment(box){
  box.innerHTML = `<div class="callout"><b>Read this, nothing else.</b> These are the pairings that decide marks — the ones candidates lose because two names got swapped.</div>
    <input class="search" id="lms" type="search" placeholder="Search a name or term" aria-label="Search the last-moment sheet">
    <div id="lml" class="stack"></div>`;
  const draw = () => {
    const s = $("#lms").value.trim().toLowerCase();
    const html = LASTMOMENT.map(c => {
      const rows = c.rows.filter(r => !s || (r[0]+" "+r[1]).toLowerCase().includes(s) || c.t.toLowerCase().includes(s));
      if (!rows.length) return "";
      return `<div class="block"><h3>${esc(c.t)}</h3><div class="lines">${rows.map(r=>`<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join("")}</div></div>`;
    }).filter(Boolean).join("");
    $("#lml").innerHTML = html || `<p class="empty">Nothing matches that.</p>`;
  };
  $("#lms").oninput = draw; draw();
}
function drawTimeline(box){
  box.innerHTML = `<input class="search" id="tls" type="search" placeholder="Search a year or an event (e.g. 1857, Panipat)" aria-label="Search the timeline"><div id="tll" class="stack"></div>`;
  const draw = () => {
    const s = $("#tls").value.trim().toLowerCase();
    const html = TIMELINE.map(t => {
      const rows = t.rows.filter(r => !s || (r[0]+" "+r[1]).toLowerCase().includes(s));
      if (!rows.length) return "";
      return `<div class="grph"><h2>${esc(G(t.era).name)}</h2><span>${rows.length} dates</span></div>
        <div class="block"><ul class="tl">${rows.map(r=>`<li><span class="y">${r[0]}</span><span>${r[1]}</span></li>`).join("")}</ul></div>`;
    }).filter(Boolean).join("");
    $("#tll").innerHTML = html || `<p class="empty">No date matches that.</p>`;
  };
  $("#tls").oninput = draw; draw();
}
function drawFlash(box){
  if (!FC) { const pool = FCSCOPE==="all" ? QS : FCSCOPE==="wrong" ? QS.filter(q=>S.ans[q.id]===0) : QS.filter(q=>q.t===FCSCOPE); FC = {list: shuffle(pool), i:0, flip:false, known:0}; }
  const sel = `<select id="fcs" aria-label="Flashcard set"><option value="all">All questions</option><option value="wrong">My mistakes</option>${LESSONS.map(l=>`<option value="${l.id}">L${LNUM(l.id)} · ${esc(l.title)}</option>`).join("")}</select>`;
  if (!FC.list.length || FC.i >= FC.list.length) {
    box.innerHTML = `<div class="row">${sel}</div><div class="block stack"><h3>${FC.list.length ? "Deck finished" : "No cards in this set"}</h3>${FC.list.length?`<p class="muted">You knew ${FC.known} of ${FC.list.length} on first look.</p>`:""}<div class="row"><button class="btn pri" type="button" id="fcr">Shuffle and restart</button></div></div>`;
    $("#fcs").value = FCSCOPE; $("#fcs").onchange = e => { FCSCOPE = e.target.value; FC = null; drawFlash(box); };
    $("#fcr").onclick = () => { FC = null; drawFlash(box); }; return;
  }
  const q = FC.list[FC.i];
  box.innerHTML = `<div class="row between">${sel}<span class="muted num" style="font-size:13px">${FC.i+1}/${FC.list.length}</span></div>
    <button type="button" class="flash" id="fcard" aria-label="Flip card">
      <span class="side">${FC.flip?"Answer":"Question · tap to flip"}</span>
      <span class="front">${esc(q.q)}</span>
      ${FC.flip ? `<span class="ans">${esc(q.o[q.a])}</span><span class="muted">${esc(q.e)}</span>` : ""}
    </button>
    <div class="row between"><button class="btn" type="button" id="fca" ${FC.flip?"":"disabled"}>Again later</button><button class="btn pri" type="button" id="fck" ${FC.flip?"":"disabled"}>Got it</button></div>`;
  $("#fcs").value = FCSCOPE; $("#fcs").onchange = e => { FCSCOPE = e.target.value; FC = null; drawFlash(box); };
  $("#fcard").onclick = () => { FC.flip = !FC.flip; drawFlash(box); };
  $("#fca").onclick = () => { FC.list.push(q); FC.list.splice(FC.i,1); FC.flip=false; drawFlash(box); };
  $("#fck").onclick = () => { FC.known++; FC.i++; FC.flip=false; drawFlash(box); };
}

/* ============================================================
   PLAN MAKER
   A plan is generated, never stored: only its length, the start date and your own ticks
   live in localStorage, so it survives changes to the lessons. Reading a lesson or taking
   its quiz in the app ticks that task by itself.
   ============================================================ */
const DAYMS = 86400000, MAXPD = 4;     // at most four new lessons a day, unless the must-do lessons need more
const label = d => d + " day" + (d === 1 ? "" : "s");

/* the closing revision days, built first so a plan is always exactly `days` long */
function planTailDays(days){
  const t = [];
  const rv = (rv, l, s) => ({ k:"rev", label:l, sub:s, go:[APP.id, null, "revise"], rv });
  if (HUB && days >= 30) APP.apps.filter(a => ["anc","med","mod"].includes(a.era)).forEach(a => t.push({ title:"Revision", sub:a.title, tasks:[
    { k:"rev", label:`${a.title}: Revise → 30 days`, sub:"Every summary in the app", go:[a.id, null, "revise"] },
    { k:"prac", label:`${a.title}: practise your mistakes`, sub:"Practice → Mistakes", go:[a.id, null, "practice"] },
    { k:"mock", label:`${a.title}: a 25-question mock`, sub:"Mock tab", go:[a.id, null, "mock"] }]}));
  if (days >= 15) t.push({ title:"Revision", sub:(TIMELINE.some(x => x.rows.length) ? "Timeline, tricks" : "Tricks") + " and traps", tasks:[
    ...(TIMELINE.some(x => x.rows.length) ? [rv("time", "Revise \u2192 Timeline, top to bottom", "Be able to place every date")] : []),
    rv("tricks", "Revise → Tricks, all of them", "The mnemonics"),
    rv("traps", "Revise → Traps, all of them", "The pairs SSC swaps")]});
  if (days >= 10) t.push({ title:"Revision", sub:"Full-length test", tasks: HUB
    ? APP.apps.filter(a => ["anc","med","mod"].includes(a.era)).map(a => ({ k:"mock", label:`${a.title}: a 50-question mock, timed`, sub:"Then go through every mistake", go:[a.id, null, "mock"] }))
    : [{ k:"mock", label:"A 50-question mock, timed", sub:"Mock tab · 30 min", go:[APP.id, null, "mock"] },
       { k:"prac", label:"Go through every mistake it throws up", sub:"Practice → Mistakes", go:[APP.id, null, "practice"] }]});
  t.push({ title:"The day before", sub:"and the hour before", tasks:[
    rv("week", "Revise → 7 days: the most-asked lessons only", "About an hour"),
    HUB ? rv("tricks", "Revise → Traps once more", "The swaps cost the most marks")
        : { k:"flash", label:"Flashcards from your mistakes", sub:"Revise → Flashcards → My mistakes", go:[APP.id, null, "revise"], rv:"flash" },
    rv("last", "Revise → Last moment, in the final hour", "The pairings sheet — nothing new today")]});
  return t;
}
/* which lessons fit: every three-dot lesson always; then the rest, most-asked first, while there is room */
function planPool(days){
  const studyDays = Math.max(1, days - planTailDays(days).length), room = studyDays * MAXPD;
  const must = LESSONS.filter(l => l.heat === 3);
  const rest = LESSONS.filter(l => l.heat !== 3).slice().sort((a,b) => (b.heat - a.heat) || (pCount(b.id) - pCount(a.id)));
  const pick = new Set(must.map(l => l.id));
  rest.forEach(l => { if (pick.size < room) pick.add(l.id); });
  return LESSONS.filter(l => pick.has(l.id));
}
function buildPlan(days){
  const pool = planPool(days), tail = planTailDays(days);
  const studyDays = Math.max(1, days - tail.length);
  const out = [];
  for (let d = 0; d < studyDays; d++) {   // spread evenly: one or two a day in a long plan, not a rush and then nothing
    const mine = pool.slice(Math.round(d * pool.length / studyDays), Math.round((d+1) * pool.length / studyDays));
    const prev = d > 0 ? out[d-1].lessons : null;
    const tasks = [];
    mine.forEach(l => tasks.push({ k:"read", id:l.id, label:`Read: ${l.title}`, sub:`${HUB ? A(l.app).title + " · " : ""}story first, then the tables`, go:[appOf(l.id), l.id, null] }));
    mine.forEach(l => tasks.push({ k:"quiz", id:l.id, label:`Quiz: ${l.title}`, sub:"The lesson's step 2", go:[appOf(l.id), l.id, null] }));
    if (prev && prev.length) tasks.push({ k:"recap", label:"Re-read yesterday's summaries", sub:prev.map(l=>l.title).join(" · "), go:[appOf(prev[0].id), prev[0].id, null] });
    if (mine.length) tasks.push({ k:"prac", label:`Practise ${mine.length > 1 ? 30 : 20} questions on today's lessons`, sub:"Practice → pick the lesson", go:[appOf(mine[0].id), null, "practice"] });
    else tasks.push({ k:"prac", label:"Catch up, then clear your Mistakes list", sub:"Practice → Mistakes", go:[HUB ? APP.apps[0].id : APP.id, null, "practice"] });
    out.push({ title:"Day", sub: mine.length ? [...new Set(mine.map(l => HUB ? A(l.app).title : (l.part ? l.part[0] : APP.title)))].join(" + ") : "Catch-up", lessons: mine, tasks });
  }
  tail.forEach(x => out.push(x));
  return { days, list: out, pool, dropped: LESSONS.filter(l => !pool.includes(l)) };
}
function planNote(days){
  const p = buildPlan(days), per = p.pool.length / Math.max(1, days - planTailDays(days).length);
  const pace = per <= 1.05 ? "about one lesson a day" : per <= 2.05 ? "one or two lessons a day" : "about " + Math.round(per) + " lessons a day";
  return p.dropped.length
    ? `Crash course: the ${p.pool.length} most-asked lessons, ${pace}. Leaves out ${p.dropped.length}.`
    : `All ${p.pool.length} lessons, ${pace}, then ${planTailDays(days).length} revision day${planTailDays(days).length>1?"s":""}.`;
}
const autoDone = t => (t.k === "read" && !!lessonState(t.id).done) || (t.k === "quiz" && lessonState(t.id).best != null);
function planState(){ return S.plan && APP.plans.includes(S.plan.days) ? S.plan : null; }

function renderPlan(){
  const st = planState();
  if (!st) {
    $("#app").innerHTML = `<section class="view stack">
      <div class="stack" style="gap:6px"><span class="eyebrow">Plan maker \u00b7 ${esc(APP.title)}</span><h1>How long do you have?</h1>
      <p class="muted">Pick a length and you get what to read, quiz and practise each day, with revision days at the end. Tick the boxes as you go &mdash; lessons you finish ${HUB ? "in the apps" : "here"} tick themselves.</p></div>
      <div class="plancfg">${APP.plans.map(d => {
        const pl = buildPlan(d);
        return `<button type="button" class="pday" data-days="${d}" style="text-align:left;cursor:pointer;width:100%;border-width:1px">
          <div style="padding:12px 14px;display:grid;gap:6px">
            <div class="row between"><b style="font-family:var(--f-display);font-size:17px">${label(d)}</b>
            <span class="num muted" style="font-size:12px">${pl.pool.length} lessons</span></div>
            <span class="muted" style="font-size:13px">${planNote(d)}</span>
            ${pl.dropped.length ? `<span style="font-size:12px;color:var(--bad)">Leaves out: ${pl.dropped.map(l=>esc(l.title)).join(" · ")}</span>` : `<span style="font-size:12px;color:var(--good)">Covers everything</span>`}
          </div></button>`;
      }).join("")}</div>
      <p class="foot">A shorter plan does not squeeze the syllabus &mdash; it keeps every lesson that is asked almost every paper and drops the least-asked ones, and says which.${HUB ? "" : hubLink(" For a plan across every app in this subject, open ", APP.hub ? APP.hub.title : "", "plan", ".")}</p>
    </section>`;
    $("#app").querySelectorAll("[data-days]").forEach(b => b.onclick = () => { S.plan = { days:+b.dataset.days, start: Date.now(), done:{} }; save(); renderPlan(); });
    bindGo($("#app"));
    return;
  }
  const pl = buildPlan(st.days), total = pl.list.length;
  const today = Math.min(Math.max(Math.floor((Date.now() - st.start) / DAYMS), 0), total - 1);
  const isDone = (t, key) => autoDone(t) || !!st.done[key];
  const allTasks = pl.list.reduce((a,d)=>a+d.tasks.length, 0);
  const doneTasks = pl.list.reduce((a,d,i)=>a + d.tasks.filter((t,j)=>isDone(t, `d${i}t${j}`)).length, 0);
  $("#app").innerHTML = `<section class="view stack">
    <div class="hero"><span class="eyebrow">${label(st.days)} plan · started ${new Date(st.start).toLocaleDateString("en-IN",{day:"numeric",month:"short"})}</span>
      <h1>Day ${today+1} of ${total}</h1>
      <p>${planNote(st.days)}</p>
      <div class="meter" aria-label="Plan progress"><i style="width:${allTasks?doneTasks/allTasks*100:0}%"></i></div>
      <div class="row between"><span class="muted num" style="font-size:13px">${doneTasks}/${allTasks} tasks done</span>
        <button class="btn sm ghost" type="button" id="pchg">Change plan</button></div></div>
    ${pl.dropped.length ? `<div class="trap"><span class="lab">Left out of this plan</span>${pl.dropped.map(l=>esc(l.title)).join(" · ")}. Open them if you find time.</div>` : ""}
    ${pl.list.map((d,i) => {
      const dn = d.tasks.filter((t,j)=>isDone(t, `d${i}t${j}`)).length, all = dn === d.tasks.length;
      return `<details class="pday ${i===today?"cur":""} ${all?"allgood":""}" ${i===today?"open":""}>
        <summary><span class="dno">${all?"✓ ":""}Day ${i+1}</span>
          <span class="dt">${esc(d.title==="Day" ? d.sub : d.title + " · " + d.sub)}<small>${d.tasks.length} task${d.tasks.length>1?"s":""}${i===today?" · today":""}</small></span>
          <span class="dp">${dn}/${d.tasks.length}</span></summary>
        <div class="body">${d.tasks.map((t,j) => {
          const key = `d${i}t${j}`, auto = autoDone(t), done = auto || !!st.done[key];
          return `<div class="ptask-row"><button type="button" class="ptask" data-k="${key}" aria-pressed="${done}" ${auto?"disabled":""}>
            <span class="box">${done?"✓":""}</span>
            <span class="lbl">${esc(t.label)}${auto?`<span class="autotag">done in the lesson</span>`:""}<small>${esc(t.sub||"")}</small></span></button>
            ${t.go ? `<button type="button" class="btn sm ghost" data-ptgo="${i}:${j}">Open</button>` : ""}</div>`;
        }).join("")}</div></details>`;
    }).join("")}
    <p class="foot">\u201cToday\u201d is counted from the day you started, so a missed day stays visible instead of quietly disappearing.${HUB ? "" : hubLink(" A plan across every app in this subject is in ", APP.hub ? APP.hub.title : "", "plan", ".")}</p>
  </section>`;
  $("#pchg").onclick = () => { if (confirm("Change the plan? Your ticks on this plan will be cleared.")) { S.plan = null; save(); renderPlan(); } };
  $("#app").querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
    const k = b.dataset.k; if (st.done[k]) delete st.done[k]; else st.done[k] = 1; save(); renderPlan();
  });
  $("#app").querySelectorAll("[data-ptgo]").forEach(b => b.onclick = () => {
    const [i, j] = b.dataset.ptgo.split(":").map(Number), t = pl.list[i].tasks[j];
    if (t.rv) RV = t.rv;
    if (t.k === "quiz" && t.go[0] === APP.id) { openLesson(t.id, "quiz"); return; }
    openApp(t.go[0], t.go[1], t.go[2]);
  });
  bindGo($("#app"));
  const cur = $(".pday.cur"); if (cur && cur.scrollIntoView) cur.scrollIntoView({block:"center"});
}

/* ============================================================
   BOOT
   ============================================================ */
renderTop();
const hashTab = () => (location.hash||"").replace("#","");
go(TABS.includes(hashTab()) ? hashTab() : TABS[0]);
/* the back button, or a link that only changes the fragment, should move tabs */
window.addEventListener("hashchange", () => {
  const t = hashTab();
  if (TABS.includes(t) && t !== TAB && !(M && M.running)) go(t);
});
/* progress made in another History app (another tab, or synced from your account) */
window.addEventListener("storage", e => { if (e.key && e.key !== KEY && APP.apps.some(a => a.key === e.key) && (TAB === "plan" || TAB === "start")) go(TAB); });

</script>

:root[data-skin] body{background-color:var(--app-bg);background-image:var(--app-pattern);background-size:var(--app-psize);background-attachment:fixed}
:root[data-skin] h1,:root[data-skin] h2{letter-spacing:-.01em}

/* ===== Desktop layout (PC / tablet landscape) ===== */
@media (min-width: 1024px){
  :root{--side:236px}
  body{padding-left:var(--side);font-size:16.5px}
  .top{border-bottom:1px solid var(--rule)}
  .top-in{max-width:1320px;padding:16px 36px}
  .brand{font-size:21px}
  .brand small{font-size:13px}
  .stat{font-size:13px}
  .wrap{max-width:1320px;padding:0 36px 56px}
  .view{padding-top:28px}
  h1{font-size:34px} h2{font-size:22px} h3{font-size:17px}

  /* bottom tab bar becomes a left sidebar */
  .nav{top:0;bottom:0;left:0;right:auto;width:var(--side);height:auto;border-top:0;border-right:1px solid var(--rule);padding:84px 14px 20px;display:block;overflow:auto}
  .nav-in{display:flex;flex-direction:column;gap:4px;height:auto;max-width:none;margin:0}
  .nav-in::before{content:"Sections";display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:0 14px 8px}
  .nav button{flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-size:15px;min-height:0;height:auto;width:100%;text-align:left}
  .nav button svg{width:20px;height:20px;flex-shrink:0}
  .nav button:hover{background:var(--sunk)}
  .nav button[aria-current="page"]{background:var(--blue-bg)}
  .nav button[aria-current="page"] span{border-bottom:0!important}

  /* home: intro beside progress */
  .hero{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);column-gap:48px;align-items:end;padding-bottom:10px}
  .hero > .eyebrow,.hero > h1,.hero > p{grid-column:1}
  .hero > .meter{grid-column:2;grid-row:3;align-self:center}
  .hero > .row{grid-column:2;grid-row:2;align-self:end}

  /* lesson reader: facts, timelines, tricks sit side by side */
  .lhead{margin-bottom:0}
  .steps{max-width:640px}
  .steps + .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .steps + .stack > .plain,.steps + .stack > .row,.steps + .stack > p,.steps + .stack > .fig,.steps + .stack > h2,.steps + .stack > .tbl{grid-column:1/-1}
  .steps + .stack > .plain{max-width:86ch;font-size:17px}
  .steps + .stack > .hot,.steps + .stack > .story{grid-column:1/-1}
  .steps + .stack > .story{max-width:none;padding:20px 24px;font-size:17.5px}
  .steps + .stack > .story p{max-width:80ch}
  .steps + .stack:not(:has(> .block ~ .block)) > .block{grid-column:1/-1}
  .block,.qcard{padding:18px 20px;border-radius:14px}

  /* quizzes and question bank */
  #lq > .stack{display:grid;grid-template-columns:minmax(0,1fr);max-width:980px;gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qt{font-size:18px}
  #plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #plist .opts{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:wrap;overflow:visible}

  /* mock test: question with the answer grid alongside */
  .mbar{top:calc(env(safe-area-inset-top,0px) + 67px)}
  .view > .qcard{max-width:1000px}
  .view > .row.between{max-width:1000px}
  .view > #msub{max-width:1000px;width:100%}
  .view > .block.stack{max-width:760px}
  .pal{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .kpis{max-width:760px}

  /* revise: summary cards and sheets in columns */
  #rv > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #rv > .stack > .grph,#rv > .stack > p,#rv > .stack > .search,#rv > .stack > .callout{grid-column:1/-1}
  #dgl,#lml,#tll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #dgl > .grph,#dgl > p,#lml > p,#tll > .grph{grid-column:1/-1}
  #rv .search,#rv > #dgl ~ .search{max-width:520px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flash{min-height:300px;max-width:760px;margin:0 auto;padding:32px 36px}
  .flash .front{font-size:22px}

  /* learn: era cards across the top */
  .eras{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}
  .les{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}

(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();

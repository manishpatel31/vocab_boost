const LESSONS = [
{"id":"C7","g":"cmp","heat":3,"title":"Software, programming languages & translators","hi":"सॉफ़्टवेयर, प्रोग्रामिंग भाषाएँ एवं अनुवादक","blocks":[{"k":"hot","h":"Expect 2–4 questions from here: <b>system vs application vs utility software<\/b>, <b>compiler vs interpreter vs assembler<\/b>, language generations, <b>who created which language<\/b>, and open-source vs freeware examples. <br><br>Every paper asks one or two of these: \"which is system software\", \"compiler vs interpreter\", \"assembler converts\", \"C++ was developed by\", \"which is not a programming language\". NTPC asks compiler questions often, and SSC asks open-source and freeware examples."},{"k":"story","h":"<p>Think of a computer as a <b>restaurant<\/b>. The stove, fridge and tables you can touch are the <b>hardware<\/b>. The recipes and the rules for running the place are the <b>software<\/b> — you cannot touch them, but nothing gets cooked without them. A few instructions are painted permanently on the kitchen wall so the staff know how to switch everything on in the morning; that is <b>firmware<\/b>, like the BIOS stored in a ROM chip.<\/p><p>The <b>manager<\/b> of the restaurant is the <b>operating system<\/b> (Windows, Linux, Android). It decides which order is cooked first, which cook uses which stove and where the ingredients are kept. Software that keeps the machine itself running is <b>system software<\/b>; software that does your job, such as typing a letter in MS Word, is <b>application software<\/b>.<\/p><p>The kitchen staff understand only one language: <b>0s and 1s<\/b>. Programmers write in friendlier languages, so a <b>translator<\/b> is needed. A <b>compiler<\/b> translates the whole book first and then hands it over; an <b>interpreter<\/b> stands beside you and translates one sentence at a time.<\/p>","key":"Hardware is the body, software the mind, the OS the manager, and translators turn human-friendly code into 0s and 1s."},{"k":"table","title":"Types of software","head":["Type","What it does","Examples"],"rows":[["System software","Runs and controls the computer; gives a platform for other programs","Operating system, device drivers, utilities, firmware"],["Operating system (OS)","Manages hardware, memory, processes and files; gives the user interface","Windows, Linux, macOS, Android, iOS"],["Device driver","Lets the OS talk to one particular hardware device","Printer driver, graphics card driver, sound driver"],["Utility software","Housekeeping and maintenance of the system","Antivirus, Disk Cleanup, disk defragmenter, backup, file compression (WinZip, 7-Zip)"],["Application software","Does a specific job for the user","MS Word, Excel, Tally, Chrome, VLC media player, Photoshop"],["Firmware","Software permanently stored on a ROM / flash chip inside hardware","BIOS / UEFI of a motherboard, router firmware"]]},{"k":"facts","title":"Software basics","rows":[["Computer","Hardware + software."],["Program","Set of instructions or statements (अनुदेशों/कथनों का समूह)."],["Code / coding","Instructions written in a language; writing them is coding."],["Software","Collection of programs. Software enhances the capabilities of the hardware."],["Application software","User-specific software that fulfils the user's purpose: MS-Office (Word, Excel, PowerPoint), Tally, web browser, Adobe Photoshop, Oracle."],["System software","Manages the hardware: operating system (Windows, Linux, Unix, Mac), BIOS, loader, translators (compiler, interpreter, assembler), linker."],["Utility software","Helps system software (part of it): antivirus, device driver, disk cleaner, disk defragmenter."],["Liveware","The person who uses/controls the computer."],["Data processing","Manipulating data in many ways (sorting, classifying, summarising) is called processing; arranging data in a logical sequence is sorting."]]},{"k":"table","title":"Software by licence","head":["Type","Free?","Source code available?","Examples"],"rows":[["Open-source","Freely available","Yes; users can change it","Android, Linux, OpenOffice, Ubuntu (FOSS)"],["Closed-source (proprietary)","Not free","No","MS-Windows, MS-Office, Mac OS (Macintosh)"],["Freeware","Freely available","No","VLC media player"],["Shareware","Free to try for a limited time, then pay","No","WinRAR trial"],["\"Free ka jugaad\"","Illegal","—","Cracked version, pirated version (duplicate key)"]]},{"k":"cards","title":"Who may use it, who may change it","rows":[["Open-source","Android, Linux, OpenOffice, Ubuntu (FOSS)","Free: freely available · source code: yes; users can change it","🔓"],["Closed-source (proprietary)","MS-Windows, MS-Office, Mac OS (Macintosh)","Free: not free · source code: no","🔒"],["Freeware","VLC media player","Free: freely available · source code: no","🎁"],["Shareware","WinRAR trial","Free: free to try for a limited time, then pay · source code: no","⏳"]]},{"k":"facts","title":"Languages","rows":[["Low-level languages","Machine language (machine code = object code = binary code) and assembly language (assembly code = mnemonic code)."],["Machine language","Written only in binary; the only language the computer directly understands."],["Assembly language","Uses mnemonics (short words like ADD, MOV); a low-level language for microprocessors; needs an assembler."],["High-level languages","Close to English: C, C++, Java, Python; written as program code or source code."],["Note","C uses a compiler; Java uses both a compiler and an interpreter."],["Syntax","The rules (grammar) of a programming language."]]},{"k":"table","title":"Generations of programming languages","head":["Generation","Language type","Features and examples"],"rows":[["1GL","Machine language","Only 0s and 1s; machine dependent; fastest; needs no translator; very hard to write"],["2GL","Assembly language","Uses mnemonics (ADD, SUB, MOV); needs an assembler; still machine dependent (low-level)"],["3GL","High-level language","English-like; portable; needs a compiler or interpreter — FORTRAN, COBOL, BASIC, Pascal, C, C++, Java, Python"],["4GL","Very high-level / non-procedural","Say what you want, not how — SQL, report generators"],["5GL","Logic / AI languages","Problem solved by constraints and rules — Prolog"]]},{"k":"cards","title":"Five generations of languages","rows":[["1GL · Machine language","","Only 0s and 1s","0️⃣"],["2GL · Assembly language","","Uses mnemonics (ADD, SUB, MOV)","🔧"],["3GL · High-level language","","English-like","📝"],["4GL · Very high-level / non-procedural","","Say what you want, not how","🗃️"],["5GL · Logic / AI languages","","Problem solved by constraints and rules","🧠"]]},{"k":"table","title":"Translators and linker","head":["Tool","Input → output","How it works"],"rows":[["Compiler","High-level source code → machine/object code","Reads and translates the WHOLE program at one time; finds syntax errors"],["Interpreter","High-level code → runs directly","Reads and executes the program LINE BY LINE"],["Assembler","Assembly (mnemonic) code → machine code","For low-level assembly language"],["Linker","Several object code files → one executable (.exe) file","Links object files made by the compiler; the .exe then runs on the CPU"]]},{"k":"info","title":"From code to a running program","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 150\" role=\"img\" aria-label=\"From source code to a running program\">\n  <defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"var(--ink2)\"/><\/marker><\/defs>\n  <rect x=\"8\" y=\"40\" width=\"100\" height=\"58\" rx=\"10\" fill=\"#2f6db5\"/><text x=\"58\" y=\"67\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">Source code<\/text><text x=\"58\" y=\"84\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:#fff\">C, Java…<\/text><path d=\"M110 69 H119\" stroke=\"var(--ink2)\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"121\" y=\"40\" width=\"100\" height=\"58\" rx=\"10\" fill=\"#7d4fb5\"/><text x=\"171\" y=\"67\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">Compiler<\/text><text x=\"171\" y=\"84\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:#fff\">whole program<\/text><path d=\"M223 69 H232\" stroke=\"var(--ink2)\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"234\" y=\"40\" width=\"100\" height=\"58\" rx=\"10\" fill=\"#c69214\"/><text x=\"284\" y=\"67\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">Object code<\/text><text x=\"284\" y=\"84\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:#fff\">machine code<\/text><path d=\"M336 69 H345\" stroke=\"var(--ink2)\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"347\" y=\"40\" width=\"100\" height=\"58\" rx=\"10\" fill=\"#1f8a8a\"/><text x=\"397\" y=\"67\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">Linker<\/text><text x=\"397\" y=\"84\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:#fff\">joins libraries<\/text><path d=\"M449 69 H458\" stroke=\"var(--ink2)\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"460\" y=\"40\" width=\"100\" height=\"58\" rx=\"10\" fill=\"#2f8f4e\"/><text x=\"510\" y=\"67\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">Executable<\/text><text x=\"510\" y=\"84\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:#fff\">.exe<\/text><path d=\"M562 69 H571\" stroke=\"var(--ink2)\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"573\" y=\"40\" width=\"100\" height=\"58\" rx=\"10\" fill=\"#c0503a\"/><text x=\"623\" y=\"67\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">Loader<\/text><text x=\"623\" y=\"84\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:#fff\">into RAM → runs<\/text>\n  <text x=\"10\" y=\"128\" font-size=\"11\" class=\"mut\">An interpreter skips the object file: it translates and runs one line at a time (Python, BASIC). An assembler turns assembly language into machine code.<\/text><\/svg><\/figure>","cap":"A compiler translates the whole program at once and lists all errors together; an interpreter stops at the first error."},{"k":"table","title":"Translators and helper programs","head":["Program","Job","Point to remember"],"rows":[["Compiler","Translates the whole high-level program into machine code at once","Makes an object / executable file; shows all errors after compiling; the finished program runs fast (C, C++)"],["Interpreter","Translates and runs a high-level program one line (statement) at a time","No separate executable; stops at the first error; slower to run (BASIC, Python, JavaScript are usually interpreted)"],["Assembler","Translates assembly language (mnemonics like ADD, MOV) into machine code","Used only for assembly language (2GL)"],["Linker","Joins object files and library files into one executable program","Works after the compiler"],["Loader","Places the executable program into main memory (RAM) so it can run","Part of the operating system"],["Debugger","Helps find and remove errors (bugs) in a program","A 'bug' is an error; removing it is 'debugging'"]]},{"k":"facts","title":"Errors","rows":[["Bug","An error in a program that gives unexpected output."],["Logical error","Wrong logic; found by the programmer."],["Syntax (syntactic, rules) error","Breaking the language's grammar; found by the compiler."],["Semantic error","Wrong meaning; found by the parser."],["Run-time error","Error while the program runs."],["Debugging","The process of finding and removing errors (bugs) from a program. Testing is the process of searching for bugs."]]},{"k":"table","title":"Famous languages and their creators","head":["Language","Year","Creator","Known for"],"rows":[["FORTRAN","1957","John Backus (IBM)","First high-level language; science and maths"],["COBOL","1959","Committee (CODASYL), Grace Hopper's influence","Business; high-level"],["BASIC","1964","John Kemeny and Thomas Kurtz","Beginners"],["Pascal","1970","Niklaus Wirth","Teaching"],["C","1972","Dennis Ritchie (Bell Labs)","UNIX was rewritten in C"],["C++","1983-85","Bjarne Stroustrup","C with objects (OOP)"],["Java","1995","James Gosling (Sun Microsystems)","\"Write once, run anywhere\"; Apache Hadoop is mostly written in Java"],["Python","1991","Guido van Rossum","Simple; AI and data science"],["LISP, PROLOG","1958, 1972","John McCarthy; Alain Colmerauer","Artificial intelligence"],["HTML","1991","Tim Berners-Lee","Markup language for web pages (not a programming language)"]]},{"k":"tlfig","title":"Programming languages in time","rows":[[1957,"FORTRAN","John Backus (IBM)"],[1958,"LISP","John McCarthy"],[1959,"COBOL","Committee (CODASYL), Grace Hopper's influence"],[1964,"BASIC","John Kemeny and Thomas Kurtz"],[1970,"Pascal","Niklaus Wirth"],[1972,"C","Dennis Ritchie (Bell Labs)"],[1972,"PROLOG","Alain Colmerauer"],[1983,"C++","Bjarne Stroustrup"],[1991,"Python","Guido van Rossum"],[1991,"HTML","Tim Berners-Lee"],[1995,"Java","James Gosling (Sun Microsystems)"]],"cap":"FORTRAN (1957) was the first high-level language; C (1972) rewrote UNIX; Python (1991) and Java (1995) lead today. HTML is a markup language, not a programming language."},{"k":"facts","title":"Program design","rows":[["Algorithm","A step-by-step, well-defined set of instructions for solving a problem."],["Flowchart","A diagram that shows the flow (steps) of a program or algorithm."],["Pseudocode","Program steps written in plain English-like form."],["System programmer","Person who designs programs in a software package."]]},{"k":"info","title":"Flowchart symbols","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 430\" role=\"img\" aria-label=\"Flowchart symbols and a small flowchart\">\n  <defs><marker id=\"fl\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"var(--ink2)\"/><\/marker><\/defs>\n  <ellipse cx=\"80\" cy=\"45\" rx=\"55\" ry=\"22\" fill=\"hsla(135,50%,45%,.3)\" stroke=\"var(--ink2)\"/><text data-lq=\"Terminal\" x=\"160\" y=\"50\" font-size=\"12.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Terminal — start / stop<\/text>\n  <rect x=\"25\" y=\"90\" width=\"110\" height=\"44\" fill=\"hsla(212,60%,55%,.3)\" stroke=\"var(--ink2)\"/><text data-lq=\"Process\" x=\"160\" y=\"117\" font-size=\"12.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Process — a calculation or step<\/text>\n  <path d=\"M80 150 L135 180 L80 210 L25 180 Z\" fill=\"hsla(42,90%,50%,.35)\" stroke=\"var(--ink2)\"/><text data-lq=\"Decision\" x=\"160\" y=\"185\" font-size=\"12.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Decision — yes / no question<\/text>\n  <path d=\"M40 230 H140 L120 270 H20 Z\" fill=\"hsla(280,45%,55%,.3)\" stroke=\"var(--ink2)\"/><text data-lq=\"Input / Output\" x=\"160\" y=\"255\" font-size=\"12.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Input / Output — read or print<\/text>\n  <circle cx=\"80\" cy=\"305\" r=\"18\" fill=\"hsla(0,0%,60%,.3)\" stroke=\"var(--ink2)\"/><text data-lq=\"Connector\" x=\"160\" y=\"310\" font-size=\"12.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Connector — joins parts of a chart<\/text>\n  <path d=\"M30 350 H130\" stroke=\"var(--ink2)\" stroke-width=\"2\" marker-end=\"url(#fl)\"/><text data-lq=\"Flow line\" x=\"160\" y=\"355\" font-size=\"12.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Flow line — the order of steps<\/text>\n  <g transform=\"translate(440 50)\">\n    <ellipse cx=\"110\" cy=\"30\" rx=\"50\" ry=\"18\" fill=\"hsla(135,50%,45%,.3)\" stroke=\"var(--ink2)\"/><text x=\"110\" y=\"35\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Start<\/text>\n    <path d=\"M70 70 H170 L155 102 H55 Z\" fill=\"hsla(280,45%,55%,.3)\" stroke=\"var(--ink2)\"/><text x=\"112\" y=\"91\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Read A, B<\/text>\n    <path d=\"M110 125 L160 155 L110 185 L60 155 Z\" fill=\"hsla(42,90%,50%,.35)\" stroke=\"var(--ink2)\"/><text x=\"110\" y=\"160\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">A > B ?<\/text>\n    <path d=\"M0 215 H90 L76 245 H-14 Z\" fill=\"hsla(280,45%,55%,.3)\" stroke=\"var(--ink2)\"/><text x=\"38\" y=\"235\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Print A<\/text>\n    <path d=\"M135 215 H225 L211 245 H121 Z\" fill=\"hsla(280,45%,55%,.3)\" stroke=\"var(--ink2)\"/><text x=\"173\" y=\"235\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Print B<\/text>\n    <ellipse cx=\"110\" cy=\"310\" rx=\"50\" ry=\"18\" fill=\"hsla(135,50%,45%,.3)\" stroke=\"var(--ink2)\"/><text x=\"110\" y=\"315\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Stop<\/text>\n    <path d=\"M110 48 V68 M110 102 V123\" stroke=\"var(--ink2)\" stroke-width=\"2\" marker-end=\"url(#fl)\"/>\n    <path d=\"M60 155 H40 V212\" fill=\"none\" stroke=\"var(--ink2)\" stroke-width=\"2\" marker-end=\"url(#fl)\"/><path d=\"M160 155 H175 V212\" fill=\"none\" stroke=\"var(--ink2)\" stroke-width=\"2\" marker-end=\"url(#fl)\"/>\n    <text x=\"28\" y=\"150\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--good)\">yes<\/text><text x=\"190\" y=\"150\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--bad)\">no<\/text>\n    <path d=\"M33 245 V280 H110 V290 M168 245 V280 H110\" fill=\"none\" stroke=\"var(--ink2)\" stroke-width=\"2\" marker-end=\"url(#fl)\"/>\n    <text x=\"110\" y=\"360\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink2)\">prints the larger number<\/text>\n  <\/g><\/svg><\/figure>","cap":"Oval = start/stop, rectangle = process, diamond = decision, parallelogram = input/output, small circle = connector. The example reads two numbers and prints the larger one."},{"k":"p","h":"<b>Compiler vs interpreter with an example.<\/b> suppose a program has 100 lines and an error on line 60. A compiler reads all 100 lines first; it reports the error and makes no executable until you fix it, but once compiled, the program runs fast every time. An interpreter starts running line 1, line 2 and so on, and stops at line 60 when it meets the error; it is slower because it translates every time it runs, but it is easy for finding errors."},{"k":"p","h":"<b>From source code to running program.<\/b> Program 1, 2 and 3 → compiler → object code 1, 2, 3 → linker joins them → one .exe file → CPU runs it. Assembly code goes through an assembler; interpreted code goes straight to the CPU line by line."},{"k":"trick","h":"Language generations in order: <span class='mn'>M<\/span>y <span class='mn'>A<\/span>unt <span class='mn'>H<\/span>as <span class='mn'>F<\/span>ive <span class='mn'>P<\/span>arrots — Machine, Assembly, High-level, Fourth-gen (SQL), Prolog (5GL). And <span class='mn'>C<\/span>ompiler = <span class='mn'>C<\/span>omplete program at once; <span class='mn'>I<\/span>nterpreter = <span class='mn'>I<\/span>nstant, line by line.<ul><li>\"SAU\": System runs the machine, Application serves the user, Utility helps the system.<\/li><li>Compiler = \"Complete at once\"; Interpreter = \"In-line, line by line\".<\/li><li>Assembler = Assembly; Linker = Links into .exe.<\/li><li>Open-source: Android, Linux, OpenOffice = \"ALO, free and open\". Closed: Windows, MS-Office, Mac = \"WOM\". Freeware: VLC = \"Very Loved Cost-free\".<\/li><li>Creators: \"C-Ritchie, C++ Stroustrup, Java Gosling, Python Guido\" = \"Rich Strong Gold Guide\".<\/li><li>Errors: Syntax → compiler, Logic → programmer, Semantic → parser: \"S-C, L-P, S-P\".<\/li><\/ul>"},{"k":"trap","h":"Compiler vs interpreter: whole program vs line by line — do not swap. Assembler handles only assembly language, not high-level code. Linker joins files; loader puts the program into RAM. Utility software (antivirus, Disk Cleanup) is system software, not application software. Freeware is free but closed; open source means the code is open.<ul><li>The operating system is SYSTEM software; MS-Word, Excel and Photoshop are APPLICATION software; antivirus is UTILITY software.<\/li><li>Word processors, spreadsheets and databases are APPLICATION software, not an operating system.<\/li><li>Software that helps users do specific tasks = application software.<\/li><li>The language a computer directly understands is MACHINE language.<\/li><li>Mnemonics = assembly language; a low-level language for microprocessors = assembly language.<\/li><li>COBOL is a HIGH-level language.<\/li><li>A well-defined set of instructions to solve a problem = ALGORITHM, not interpreter or hardware.<\/li><li>Freeware is free but its source code is NOT available; open-source has its code available.<\/li><li>Windows, Skype and Mozilla are not programming languages.<\/li><\/ul>"}],"sum":["Software is system software (OS, drivers, utilities) or application software (Word, Chrome); firmware such as BIOS lives in ROM.","Compiler translates the whole program at once, interpreter one line at a time, assembler converts assembly to machine code.","Linker joins object files into an executable; loader places it in RAM.","Language generations: machine, assembly, high-level (C, Java, Python), 4GL (SQL), 5GL (Prolog).","Linux is open source, Windows is proprietary; Delete goes to the Recycle Bin, Shift+Delete is permanent.","Software = programs; system software runs the hardware, application software does user tasks, utility software helps the system.","Open-source (Linux, Android) has free source code; closed-source (Windows, MS-Office) does not; freeware (VLC) is free but closed.","Machine and assembly languages are low-level; C, C++, Java, Python are high-level.","Bug = error; debugging removes it; syntax errors are caught by the compiler."],"part":["Part 2 · Software, Windows & MS Office","सॉफ़्टवेयर, विंडोज़ एवं एमएस ऑफ़िस"]},
{"id":"C19","g":"cmp","heat":3,"title":"Operating systems, Windows, DOS & Linux","hi":"ऑपरेटिंग सिस्टम, विंडोज़, डॉस एवं लिनक्स","blocks":[{"k":"hot","h":"Operating systems give 1 to 3 questions per paper: \"which is not an OS\", \"first OS written in C\", \"single-user OS\", \"kernel/shell\", \"multiprocessing vs multitasking\", \"real-time OS example\", Windows features like Recycle Bin, Control Panel and File Explorer, and Windows shortcuts. SSC CGL Tier-II 2022-2023 asked Control Panel, Alt + Enter and File Explorer's View tab; CHSL Tier-II 2023 asked Recycle Bin."},{"k":"story","h":"<p>Think of a big hotel. The guests (users) want food, rooms and laundry. They do not go into the kitchen or the boiler room themselves; they talk to the reception. The reception passes every request to the right department and makes sure no two guests get the same room. The operating system (ऑपरेटिंग सिस्टम) is that reception: it stands between you and the hardware (its primary job) and gives a platform on which applications run (its secondary job).<\/p><p>Behind the reception is the hotel manager who actually controls the staff, rooms and money but never meets guests. That manager is the kernel (कर्नेल): the core of the OS that controls hardware. The receptionist who takes your words and passes them on is the shell, which turns your commands into something the kernel understands.<\/p><p>Old hotels made you write requests on a slip in a fixed format: that is a Character User Interface (CUI), like MS-DOS where you type commands. Modern hotels let you just point at pictures on a menu: that is a Graphical User Interface (GUI), like Windows, where you click icons.<\/p><p>A hotel can also work in different styles: serve one batch of similar guests at a time (batch OS), give each guest a fixed few minutes in turn (multitasking/time-sharing), use many receptionists at once (multiprocessing), or promise a reply in a fixed time no matter what (real-time OS, like a parachute or aircraft system).<\/p>","key":"OS = middleman between user and hardware; kernel controls hardware, shell talks to the user; CUI = type, GUI = click."},{"k":"facts","title":"Operating system basics","rows":[["Operating system (OS)","System software that works as an intermediary between the user and the hardware (primary function) and provides a platform for application software (secondary function)."],["Layers","Computer user &lt;→ application software (MS-Office) &lt;→ operating system (Windows) &lt;→ hardware."],["Functions","Process (CPU) management, memory management, file management, device (I/O) management, security, booting, user interface, resource allocation."],["Not functions of OS","Translating high-level language into machine language (that is a compiler's job); data classification; input of data itself."],["Location","The OS is stored on the hard disk (HDD) and loaded into RAM at booting."],["Kernel","Core of the OS; controls all hardware and software but does not interact with users directly; does memory and file management. Kernel mode = manages hardware."],["User mode","Runs user applications."],["Shell (UNIX)","Translates the user's commands into a language the kernel understands."],["Deadlock","When processes (threads) wait endlessly for resources held by each other; related to the OS."],["Multitasking","Related to the operating system."],["User interface","Controls how the user interacts with the OS. A menu contains commands that can be selected."]]},{"k":"info","title":"Where the operating system sits","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 660 360\" role=\"img\" aria-label=\"Layers from the user down to the hardware\"><g transform=\"translate(0 40)\">\n  <rect x=\"40\" y=\"20\" width=\"580\" height=\"48\" rx=\"10\" fill=\"hsla(0,0%,55%,.35)\" stroke=\"var(--rule)\"/><text data-lq=\"User\" x=\"56\" y=\"41\" font-size=\"14\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">User<\/text><text x=\"56\" y=\"58\" font-size=\"11\" class=\"mut\">you<\/text><rect x=\"70\" y=\"76\" width=\"520\" height=\"48\" rx=\"10\" fill=\"hsla(212,60%,55%,.35)\" stroke=\"var(--rule)\"/><text data-lq=\"Application software\" x=\"86\" y=\"97\" font-size=\"14\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Application software<\/text><text x=\"86\" y=\"114\" font-size=\"11\" class=\"mut\">MS-Office, browser, games<\/text><rect x=\"100\" y=\"132\" width=\"460\" height=\"48\" rx=\"10\" fill=\"hsla(135,50%,45%,.35)\" stroke=\"var(--rule)\"/><text data-lq=\"Shell\" x=\"116\" y=\"153\" font-size=\"14\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Shell<\/text><text x=\"116\" y=\"170\" font-size=\"11\" class=\"mut\">turns your commands into kernel calls<\/text><rect x=\"130\" y=\"188\" width=\"400\" height=\"48\" rx=\"10\" fill=\"hsla(20,80%,55%,.4)\" stroke=\"var(--rule)\"/><text data-lq=\"Kernel\" x=\"146\" y=\"209\" font-size=\"14\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Kernel<\/text><text x=\"146\" y=\"226\" font-size=\"11\" class=\"mut\">core of the OS: memory, processes, devices<\/text><rect x=\"160\" y=\"244\" width=\"340\" height=\"48\" rx=\"10\" fill=\"hsla(42,90%,50%,.45)\" stroke=\"var(--rule)\"/><text data-lq=\"Hardware\" x=\"176\" y=\"265\" font-size=\"14\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Hardware<\/text><text x=\"176\" y=\"282\" font-size=\"11\" class=\"mut\">CPU, RAM, disks, devices<\/text>\n  <path d=\"M612 30 V290\" stroke=\"var(--accent)\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/><text x=\"620\" y=\"160\" font-size=\"13\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--accent)\">OS<\/text><\/g><\/svg><\/figure>","cap":"The operating system sits between your programs and the hardware. Its kernel never talks to you directly; the shell (or the GUI) carries your commands to it. It is stored on the disk and loaded into RAM at boot."},{"k":"table","title":"Examples of operating systems","head":["Computer OS","Smartphone OS"],"rows":[["MS-Windows (most important)","Android (most important)"],["Mac OS (Macintosh) (most important)","iOS (most important)"],["LINUX","MeeGo"],["UNIX","WebOS"],["MS-DOS","Symbian"],["OS/2","BADA"],["Ubuntu","BlackBerry OS"],["Solaris","Windows for smartphone"],["Not an OS","Opera, Mozilla Firefox, Google Chrome (browsers), Acrobat Reader, Intel 8085 (processor), BIOS"]]},{"k":"facts","title":"User interface","rows":[["CUI / CLI","Character User Interface / Command Line Interface: typed keyboard commands. Examples: MS-DOS (1981), UNIX, LINUX, OS/2."],["GUI","Graphical User Interface: keyboard + mouse clicks on icons. Examples: MS-Windows (1985), Mac OS, Ubuntu, UNIX GUI."],["CUI terms","Terminal (C:\\&gt;), cursor, prompt (a signal that a command is expected from the user), directory (only a name) → sub-directory → sub-sub-directory; root directory."],["GUI terms","Desktop with icons; folder (name + shape) → sub-folder → sub-sub-folder."],["Linux","Open-source; mostly used in supercomputers; developed by Linus Torvalds (Finland) in 1991."],["UNIX","First OS for multiprocessing; first OS written in C."],["MS-DOS","Single-user, single-tasking CUI OS."]]},{"k":"table","title":"Types of operating system","head":["Type","Key idea","Example"],"rows":[["Batch OS (1960s)","Similar programs are grouped and run together from a batch file; no user interaction","Payroll runs"],["Multiprogramming OS","Many programs in memory; CPU runs one until it finishes; lack of responsiveness","—"],["Multitasking (time-sharing) OS","Each program gets a fixed time slice (time quantum) in turn; more responsive; RAM is the \"waiting room\"","MS-Windows, UNIX"],["Multithreading","A program is split into threads (pieces); cores: single 1, dual 2, quad 4, octa 8","—"],["Multiprocessing OS","Computer has many processors; parallel processing","UNIX (first), server computers"],["Real-time OS (RTOS)","Fixed response time; hard RTOS and soft RTOS (manages CPU response time)","QNX, VxWorks, TRON, Windows CE, LynxOS; automatic parachute systems"],["Distributed OS","One system serves OS services to connected devices; telecommunication","AIX, Dynix, Solaris"],["Network OS","Manages a network with a file server","Windows Server 2003/2008, BSD, Novell NetWare"],["Multi-user, multitasking, time-sharing","Many users at once","UNIX"],["Batch","Similar jobs are collected and run together with no user interaction","Early mainframes; payroll and bill processing"],["Time-sharing","CPU time is cut into small slices shared by many users so each feels the computer is his own","UNIX on servers"],["Real-time (RTOS)","Must respond within a fixed time limit (deadline)","Air-traffic control, missile guidance, car ABS, industrial robots; VxWorks"],["Multi-tasking","One user runs several programs at the same time","Windows, macOS, Linux"],["Multi-user","Several users use the same system at the same time","UNIX, Linux servers"],["Multiprocessing","One computer with two or more CPUs working together","Modern servers"],["Distributed","Many networked computers work together and appear as one system","Clusters, large data centres"],["Mobile OS","Built for phones and tablets","Android (Google, Linux kernel), iOS (Apple)"]]},{"k":"tl","title":"Operating-system milestones","rows":[["1969","UNIX developed at Bell Labs (Ken Thompson, Dennis Ritchie)"],["1981","MS-DOS — Microsoft's command-line OS for the IBM PC"],["1984","Apple Macintosh popularises the GUI and mouse"],["1985","Windows 1.0 released"],["1991","Linus Torvalds releases the Linux kernel (open source)"],["1995","Windows 95 — Start button and taskbar introduced"],["2001","Windows XP; Mac OS X"],["2007","iPhone launched with iPhone OS (later iOS)"],["2008","First Android phone"],["2015","Windows 10"],["2021","Windows 11"]]},{"k":"facts","title":"Microsoft Windows","rows":[["Microsoft","Founded by Bill Gates; products MS-DOS (1981), MS-Windows (1985), MS-Office (1990)."],["Windows versions","Windows 1.0 (1985), 2.0, 3.0, 95, 98, 2000, ME, XP (eXPerience, 2001), Vista, 7 (2009), 8, 8.1, 10 (2015), 11 (2021). There is no \"Windows 9\". NT = New Technology. Windows XP is a multitasking operating system; Windows 7 supports 64-bit processors."],["WIMP","Windows, Icons, Menus, Pointer: the basic parts of a GUI."],["Desktop","First visible screen: My Computer (This PC), Recycle Bin, application, file and folder icons."],["Taskbar","Bar at the bottom of the desktop: Start menu icon (All programs / All apps), recently opened files and apps, notification area (date and time, volume, internet, Bluetooth, hardware)."],["File Explorer","Also called Windows Explorer; shows all files, folders and drives; shortcut Win + E. In Windows 11 its View tab has \"hidden items\" and \"compact view\"."],["Recycle Bin","Place where deleted files are kept; you can restore or erase them. Permanent delete: empty the Recycle Bin or press Shift + Delete."],["Data recovery","Getting back permanently deleted files using an application such as EaseUS."],["Default folders","Documents, Downloads, Pictures, Videos. Installed program files go into \"Program Files\"."],["Default apps","Notepad, WordPad (text editors), Windows Media Player, Paint, games. MS-Word is NOT built into Windows."],["This PC drives","A: and B: = floppy drives; C:, D:, E:, F: = hard disk drives. Any drive can hold an OS, but only one OS runs at a time."],["Partitions","Primary partition (Windows usually on C:), logical partition; a divided logical partition is called an extended partition. There is no \"virtual partition\"."],["Help","F1."],["Control Panel","Shows utilities to configure the system and install software and hardware."],["Power options","Log off, Sleep (monitor off, low power), Restart (reboot), Hibernate (saves work, then shuts down, resumes later), Shut down."],[".NET framework","Software that runs on Windows. Framework = collection of APIs (Application Programming Interfaces); an API lets two technologies talk to each other."],["Process terms","Program = set of instructions; process = program loaded in RAM; PCB = Process Control Block (holds all information about a process, made in RAM); job = collection of processes; thread = piece of a process; fibre = lightweight thread."],["Architecture","User mode (runs applications) and kernel mode (controls the computer). Executive services: object, configuration, process and thread, installation, I/O, memory, cache and power managers."],["Memory management","RAM → cache (mapping); RAM &lt;→ virtual memory (swapping/page replacement)."],["File system","MS-DOS uses FAT (FAT12, FAT16, FAT32, exFAT); Windows uses NTFS (New Technology File System)."],["Security","Secure login (Administrator account, User accounts with limited permission, Guest account with less permission), antivirus (e.g. Bitdefender), firewall (against unauthorised access)."],["Windows update","Needed for new features and tools."],["Windows crash causes","Removing external devices unsafely, power failure, memory/storage failure, file system errors, malware."],["Defragmentation","Utility that rearranges a file's pieces into contiguous clusters to speed up the disk."],["Notification area","Right end of the taskbar (system tray): clock, volume, network, battery"],["Start menu","Launch programs, Settings, Power (shut down, restart, sleep)"],["Shift+Delete","Deletes permanently, skipping the Recycle Bin"],["Files from pen drive / network","Deleted directly — they do not go to the Recycle Bin"],["Control Panel / Settings","Change system settings, add or remove programs, devices, users"],["Task Manager","Shows running programs and processes; ends a hung program"],["Shortcut icon","Small arrow on the icon; only a link (.lnk) to the real file"],["File vs folder","A file stores data; a folder (directory) holds files and other folders (subfolders)"],["Path","Address of a file, e.g. C:\\Users\\Ravi\\Documents\\notes.txt — Windows uses the backslash \\"],["GUI vs CLI","GUI = Graphical User Interface (icons, mouse — Windows); CLI = Command Line Interface (typed commands — MS-DOS, Command Prompt)"],["Booting","Cold boot = switching on from off; warm boot = restart"]]},{"k":"table","title":"Linux commands","head":["Command","Use"],"rows":[["ls","List files and directories (ls -a includes hidden files; ls -l long list; ls -lh by size; ls -r reverse; ls -R sub-directory contents; ls ~ home directory; ls ../ parent directory; ls -li index numbers; ls -d */ sub-directories)"],["pwd","Print working directory (shows the path)"],["cd","Change directory"],["cat","Concatenate (join/show) files"],["cp","Copy files or directories"],["mv","Move (or rename) files"],["mkdir","Make a directory"],["rm","Remove a file"],["touch","Create an empty file"],["locate / find","Find files by name / find files or directories"],["grep","Search for a pattern in files"],["sudo","Run programs as administrator"],["df / du","Disk space total / file space usage"],["head / tail","First / last 10 lines of a file"],["diff","Compare two files line by line"],["tar","Create or extract an archive"],["chmod / chown","Change access mode / change owner or group"],["jobs / kill / top","List jobs / terminate a process / show running processes"],["ping","Packet Internet Groper: checks connectivity between host and server"],["wget","Download files from a server"],["uname / hostname","System information / host name (DNS)"],["history / echo","Previous commands / print text"],["zip, unzip","Compress / uncompress"],["useradd / userdel","Add / delete a user account"],["timedatectl","Configure the system clock (with set-local-rtc to keep local time)"]]},{"k":"table","title":"DOS commands","head":["Command","Use"],"rows":[["ATTRIB","Change file attributes"],["CALL","Run a batch program"],["CD / CHDIR","Change directory"],["CHKDSK","Check and fix disk errors"],["CLS","Clear the screen"],["COPY / XCOPY","Copy files / copy files and directories"],["DATE / TIME","Show or change date / time"],["DEBUG","Test or edit programs"],["DEL","Delete files"],["DIR","List files and directories"],["DISKCOPY","Copy a whole floppy to another"],["FC","Compare files"],["FDISK","Create and manage hard disk partitions"],["FIND","Search for a text string"],["FORMAT","Format a drive (erases all data)"],["HELP","Information about commands"],["MD / MKDIR","Make a directory"],["RD / RMDIR","Remove a directory"],["REN","Rename a file or directory"],["MEM","Show used and free memory"],["MOVE","Move files"],["PATH","Set the path for executable files"],["PRINT / TYPE","Print a text file / show its contents"],["SCANDISK","Disk repair"],["SYS","Copy DOS system files to a disk"],["VER","Show the DOS version"],["VSAFE","Basic virus protection"],["EXIT","End the command session"]]},{"k":"p","h":"<b>Multiprogramming vs multitasking vs multiprocessing.<\/b> in multiprogramming, several programs sit in RAM but the single CPU runs one until it finishes, so a long job makes others wait (poor responsiveness). Multitasking fixes this by giving each program a small time slice in turn, so all seem to run together (more responsive; Windows). Multiprocessing adds more processors so programs truly run at the same time in parallel (UNIX, servers). Multithreading splits one program into threads that cores run together."},{"k":"trick","h":"<ul><li>OS = \"Operator between user and machine\"; Kernel = \"Kernel controls, never talks\"; Shell = \"Shell speaks for the user\".<\/li><li>RTOS examples \"QVTWL\": QNX, VxWorks, TRON, Windows CE, LynxOS.<\/li><li>Network OS = \"Windows Server, BSD, NetWare\". Distributed OS = \"AIX, Dynix, Solaris\".<\/li><li>Microsoft dates \"1981-1985-1990\": DOS, Windows, Office.<\/li><li>No Windows 9: versions jump from 8.1 to 10.<\/li><li>DOS short forms: MD = Make Dir, RD = Remove Dir, CD = Change Dir, CLS = CLear Screen.<\/li><li>Linux \"ls -a\" = all (including hidden).<\/li><\/ul>"},{"k":"trap","h":"<ul><li>Opera, Mozilla, Chrome and Acrobat Reader are applications, not operating systems; BIOS is firmware, not an OS.<\/li><li>Windows XP is a MULTITASKING OS, not real-time.<\/li><li>Translating high-level code is NOT an OS function; it is a compiler's job.<\/li><li>Both statements \"Linux is open source\" and \"Linux is multitasking and multiuser\" are TRUE, so neither is false.<\/li><li>The ping command is NOT used to change passwords.<\/li><li>The OS resides on the hard disk, not in ROM (the BIOS is in ROM).<\/li><li>Deleting with the Delete key moves files to the Recycle Bin; it does not delete them permanently.<\/li><li>UNIX (not Linux) was the first OS written in C and the first for multiprocessing.<\/li><li>MS-DOS is single-user; UNIX is multi-user.<\/li><li>Windows is proprietary; Linux is open source; Android uses the Linux kernel.<\/li><li>Delete sends a file to the Recycle Bin; Shift + Delete deletes it permanently; files deleted from a pen drive never reach the Recycle Bin.<\/li><\/ul>"}],"sum":["The OS links user and hardware and gives a platform to applications; kernel controls hardware, shell takes user commands.","CUI (MS-DOS) = typed commands; GUI (Windows) = icons and mouse.","OS types: batch, multiprogramming, multitasking, multithreading, multiprocessing, real-time, distributed, network.","Windows uses NTFS; DOS uses FAT; Windows versions go 8.1 → 10 → 11 (no 9).","Key Linux commands: ls, pwd, cd, mkdir, rm, grep, chmod, kill, ping; DOS: DIR, CD, MD, RD, CLS, FORMAT, CHKDSK, DEL, REN."],"part":["Part 2 · Software, Windows & MS Office","सॉफ़्टवेयर, विंडोज़ एवं एमएस ऑफ़िस"]},
{"id":"C20","g":"cmp","heat":2,"title":"File extensions & file systems","hi":"फ़ाइल एक्सटेंशन एवं फ़ाइल सिस्टम","blocks":[{"k":"hot","h":"Full forms (PDF, GIF, TIFF, BIOS, VGA, VOIP, DSL, WiMAX) and \"which is not an image/video extension\" are the easiest one-liners and appear in almost every CHSL, MTS, NTPC and Group D paper. SSC CGL Tier-II 2024 asked the .exe extension. Learning this lesson as a list gives quick marks."},{"k":"story","h":"<p>Imagine a big wardrobe full of boxes. Each box has a label on the end saying what is inside: \"shirts\", \"shoes\", \"documents\". A file extension (फ़ाइल एक्सटेंशन) is that label at the end of a file name, after the dot: report.docx, photo.jpg, song.mp3. The computer reads the label to know which program should open the file.<\/p><p>The wardrobe itself has a filing method: which shelf, which row, where the next free space is. That method is the file system (फ़ाइल सिस्टम), a part of the operating system that manages all files. Windows uses NTFS; old DOS used FAT.<\/p><p>Computer people love short forms. Instead of saying \"Basic Input Output System\" they say BIOS; instead of \"Portable Document Format\" they say PDF. Exams test these short forms because they are easy to check.<\/p>","key":"The extension tells the file type; the file system manages files; learn full forms in groups (hardware, memory, internet, files)."},{"k":"table","title":"File extensions you must know","head":["Extension","File type","Typical program"],"rows":[[".exe","Executable (program) file","Runs directly in Windows"],[".txt","Plain text","Notepad"],[".docx (.doc older)","Word document","MS Word"],[".xlsx (.xls older)","Excel workbook","MS Excel"],[".pptx (.ppt older)","PowerPoint presentation","MS PowerPoint"],[".accdb (.mdb older)","Access database","MS Access"],[".pdf","Portable Document Format","Adobe Acrobat Reader, browsers"],[".jpg / .jpeg","Compressed photo (lossy)","Photos app, image viewers"],[".png","Image with lossless compression, supports transparency","Image viewers"],[".gif / .bmp","Image (GIF can animate) / uncompressed bitmap image","Image viewers, Paint"],[".mp3 / .wav","Audio","Media players"],[".mp4 / .avi","Video","Media players (VLC)"],[".zip / .rar","Compressed archive","WinZip, WinRAR, 7-Zip"],[".html / .htm","Web page","Web browser"],[".csv","Comma-separated values (table as plain text)","Excel, Notepad"],[".dll","Dynamic Link Library (shared code)","Used by Windows programs"],[".bat","Batch file of commands","Command Prompt"]]},{"k":"info","title":"Extensions by kind","html":"<div class=\"fam\"><div><b>🖼️ Images<\/b><small><b>.JPEG / .JPG<\/b> — Joint Photographic Experts Group<\/small><small><b>.PNG<\/b> — Portable Network Graphics<\/small><small><b>.GIF<\/b> — Graphics Interchange Format<\/small><small><b>.TIFF<\/b> — Tagged Image File Format<\/small><small><b>.PSD<\/b> — Photoshop Document<\/small><small><b>.PDF<\/b> — Portable Document Format<\/small><small><b>.EPS<\/b> — Encapsulated PostScript<\/small><\/div><div><b>🎵 Audio<\/b><small><b>.MP3<\/b> — MPEG-1 Audio Layer 3<\/small><small><b>.MID / .MIDI<\/b> — Musical Instrument Digital Interface<\/small><small><b>.WAV<\/b> — Waveform Audio File<\/small><small><b>.WMA<\/b> — Windows Media Audio<\/small><small><b>.AIFF<\/b> — Audio Interchange File Format<\/small><small><b>.AAC<\/b> — Advanced Audio Coding<\/small><small><b>.OGG<\/b> — Ogg Vorbis file<\/small><\/div><div><b>🎬 Video<\/b><small><b>.MP4<\/b> — MPEG-4<\/small><small><b>.MOV<\/b> — QuickTime movie<\/small><small><b>.WMV<\/b> — Windows Media Video<\/small><small><b>.AVI<\/b> — Audio Video Interleave<\/small><small><b>.AVCHD<\/b> — Advanced Video Coding High Definition<\/small><small><b>.FLV / .F4V / .SWF<\/b> — Flash Video / Shockwave Flash<\/small><small><b>.MKV<\/b> — Matroska Multimedia Container<\/small><\/div><div><b>📄 Office & text<\/b><small><b>.DOC<\/b> — MS-Word document<\/small><small><b>.DOCX<\/b> — MS-Word Open XML document<\/small><small><b>.TXT<\/b> — Plain text file<\/small><small><b>.ODT<\/b> — OpenOffice Writer document<\/small><small><b>.RTF<\/b> — Rich Text Format<\/small><small><b>.TEX<\/b> — LaTeX document<\/small><small><b>.WPD<\/b> — WordPerfect document<\/small><\/div><div><b>⚙️ System & programs<\/b><small><b>.BAK<\/b> — Backup file<\/small><small><b>.CAB<\/b> — Windows cabinet file<\/small><small><b>.CFG<\/b> — Configuration file<\/small><small><b>.CPL<\/b> — Windows Control Panel file<\/small><small><b>.CUR<\/b> — Windows cursor file<\/small><small><b>.DLL<\/b> — Dynamic Link Library<\/small><small><b>.DMP<\/b> — Dump file<\/small><\/div><\/div>","cap":"The extension after the dot tells Windows which program opens the file: .docx → Word, .xlsx → Excel, .pptx → PowerPoint, .exe → a program that runs by itself."},{"k":"table","title":"Image file extensions","head":["Extension","Full form / meaning"],"rows":[[".JPEG / .JPG","Joint Photographic Experts Group (JPG is the short 3-letter form)"],[".PNG","Portable Network Graphics (default format of MS-Paint in new Windows)"],[".GIF","Graphics Interchange Format (supports simple animation)"],[".TIFF","Tagged Image File Format"],[".PSD","Photoshop Document"],[".PDF","Portable Document Format"],[".EPS","Encapsulated PostScript"],[".AI","Adobe Illustrator document"],[".INDD","Adobe InDesign document"],[".RAW","Raw image format"],[".SVG","Scalable Vector Graphics"],[".BMP","Bitmap image"],[".WEBP","Created by Google; same quality as JPEG/PNG/GIF in smaller size"],[".HEIF","High Efficiency Image File"]]},{"k":"table","title":"Audio file extensions","head":["Extension","Full form / meaning"],"rows":[[".MP3","MPEG-1 Audio Layer 3 (Moving Picture Experts Group)"],[".MID / .MIDI","Musical Instrument Digital Interface"],[".WAV","Waveform Audio File"],[".WMA","Windows Media Audio"],[".AIFF","Audio Interchange File Format"],[".AAC","Advanced Audio Coding"],[".OGG","Ogg Vorbis file"],[".FLAC","Free Lossless Audio Codec"],[".ALAC","Apple Lossless Audio Codec"],[".CDA","CD Audio Track"],[".WPL","Windows Media Player Playlist"]]},{"k":"table","title":"Video file extensions","head":["Extension","Full form / meaning"],"rows":[[".MP4","MPEG-4 (Moving Picture Experts Group 4)"],[".MOV","QuickTime movie (Apple)"],[".WMV","Windows Media Video"],[".AVI","Audio Video Interleave"],[".AVCHD","Advanced Video Coding High Definition"],[".FLV / .F4V / .SWF","Flash Video / Shockwave Flash"],[".MKV","Matroska Multimedia Container"],[".WEBM","Created by Google for video"],[".RM","RealMedia file"],[".M4V","Apple MP4 video"],[".3GP","Third Generation Partnership Project (mobile video)"]]},{"k":"table","title":"Office and text file extensions","head":["Extension","Meaning"],"rows":[[".DOC","MS-Word document (till Word 2003)"],[".DOCX","MS-Word Open XML document (from Word 2007)"],[".TXT","Plain text file"],[".ODT","OpenOffice Writer document"],[".RTF","Rich Text Format"],[".TEX","LaTeX document"],[".WPD","WordPerfect document"],[".XLS","MS-Excel file (till 2003)"],[".XLSX","MS-Excel Open XML file (from 2007)"],[".XLSM","Excel file with macros"],[".ODS","OpenOffice Calc spreadsheet"],[".PPT","PowerPoint presentation (till 2003)"],[".PPTX","PowerPoint Open XML presentation (from 2007)"],[".PPS","PowerPoint slide show"],[".ODP","OpenOffice Impress presentation"],[".KEY","Apple Keynote presentation"]]},{"k":"table","title":"System and executable file extensions","head":["Extension","Meaning"],"rows":[[".BAK","Backup file"],[".CAB","Windows cabinet file"],[".CFG","Configuration file"],[".CPL","Windows Control Panel file"],[".CUR","Windows cursor file"],[".DLL","Dynamic Link Library"],[".DMP","Dump file"],[".DRV","Device driver file"],[".ICNS","Mac OS X icon resource file"],[".ICO","Icon file"],[".INI","Initialization file"],[".LNK","Windows shortcut file"],[".MSI","Windows Installer package"],[".SYS","Windows system file"],[".TMP","Temporary file"],[".APK","Android Package file"],[".BAT","Batch file"],[".BIN","Binary file"],[".COM","MS-DOS command file"],[".EXE","Executable file (Windows programs and installers)"],[".GADGET","Windows gadget file"],[".JAR","Java Archive file"],[".WSF","Windows Script File"],[".ZIP","Compressed (archive) file"]]},{"k":"facts","title":"File systems","rows":[["File system","Manages all files on a computer; it is a part of the operating system."],["List of file systems","George-3; DECtape (Digital Equipment Corporation) / OS/8 / micro tape; ODS-1 (On-Disk Structure); CP/M (Control Programs for Microcomputers); FAT12 (File Allocation Table); Commodore DOS; FAT16; MFS (Macintosh File System); HFS (Hierarchical File System); FFS (Amiga Fast File System); HPFS (High Performance File System); HTFS (High Throughput File System); FAT32; ReiserFS; NTFS (New Technology File System); EXT2, EXT3, EXT4 (Extended File System); UFS (Unix File System); OverlayFS; SquashFS; JFFS (Journalling Flash File System); ZFS (Zettabyte File System); XFS; BtrFS (B-Tree File System); APFS (Apple File System)."],["Windows","NTFS. MS-DOS; FAT (FAT12, FAT16, FAT32, exFAT). Linux; EXT4. Apple; APFS."],["Codec","Device or software that compresses and decompresses (encodes/decodes) digital media files."],["Data redundancy","The same data stored at many places (copies occupying memory)."],["Database","A collection of related files/records."]]},{"k":"p","h":"<b>Why .docx replaced .doc (and .xlsx, .pptx).<\/b> from Office 2007, Microsoft switched to Open XML formats. The \"x\" at the end means XML. These files are actually compressed packages, so they are smaller and less likely to get corrupted. The old formats (.doc, .xls, .ppt) are used by Office 2003 and earlier. An \"m\" ending (.xlsm, .docm) means the file contains macros."},{"k":"p","h":"<b>How to spot the odd extension in a question.<\/b> first decide the group of each option (image, audio, video, document, executable), then pick the one from a different group. Example: .tiff, .png, .wav, .jpg: three are images, .wav is audio, so .wav is the answer."},{"k":"trick","h":"Office file names end in <b>x<\/b> since 2007 (XML-based): .docx, .xlsx, .pptx; the old ones had no x (.doc, .xls, .ppt). Templates swap the last letter: .dotx, .xltx, .potx; macro files end in <b>m<\/b>: .docm, .xlsm.<ul><li>Images \"JPG PNG GIF BMP TIFF SVG\"; Audio \"MP3 WAV WMA AAC MIDI FLAC\"; Video \"MP4 AVI MOV MKV WMV FLV 3GP\".<\/li><li>The \"x\" in .docx/.xlsx/.pptx = XML (Office 2007 onwards).<\/li><li>\"W\" files from Windows: WMA (audio), WMV (video), WPL (playlist).<\/li><li>Google made both WEBP (image) and WEBM (video).<\/li><li>File systems: Windows = NTFS (\"New Tech\"), DOS = FAT (\"Father of file systems\"), Apple = APFS, Linux = EXT4.<\/li><li>PDF = \"Portable Document Format\", not \"Portable Device Form\".<\/li><\/ul>"},{"k":"trap","h":".jpg and .jpeg are the same format. .bmp is uncompressed, .png keeps transparency, .gif can animate. .exe and .com run programs; .bat runs a batch of commands; .dll is a Dynamic Link Library, not a program you open.<ul><li>PDF = Portable Document Format.<\/li><li>GIF = Graphics Interchange Format.<\/li><li>TIFF = Tagged Image File Format.<\/li><li>.wav is AUDIO, not an image; .pdf is a DOCUMENT, not a video.<\/li><li>.TMP is a temporary file; .BAK is a backup file.<\/li><li>UPS is \"Uninterruptible\" Power Supply; DLL is \"Dynamic\" Link Library.<\/li><li>MBR and PC each have two meanings (Master Boot Record / Memory Buffer Register; Personal Computer / Program Counter).<\/li><li>VGA = Video Graphics Array, not \"Visual\".<\/li><\/ul>"}],"sum":["A file extension after the dot tells which kind of file it is and which program opens it.","Images: .jpg/.jpeg, .png, .gif, .bmp, .tiff; audio: .mp3, .wav, .aac; video: .mp4, .avi, .mkv, .mov.","Office: .docx (Word), .xlsx (Excel), .pptx (PowerPoint), .accdb (Access); .pdf is Portable Document Format, .txt plain text.","System and program files: .exe, .com, .bat, .dll, .sys, .ini; compressed: .zip, .rar, .7z.","File systems: FAT and FAT32 (old, DOS), NTFS (Windows), exFAT (flash drives), ext4 (Linux), APFS (Apple).","Office: DOC/DOCX, XLS/XLSX, PPT/PPTX (\"x\" from 2007); .EXE = executable, .TMP = temporary, .APK = Android app."],"part":["Part 2 · Software, Windows & MS Office","सॉफ़्टवेयर, विंडोज़ एवं एमएस ऑफ़िस"]},
{"id":"C8","g":"cmp","heat":3,"title":"Keyboard shortcuts — the master list","hi":"कीबोर्ड शॉर्टकट — पूरी सूची","blocks":[{"k":"hot","h":"The <b>single most-asked area<\/b> of the computer section: every SSC and RRB paper has 1–3 shortcut questions. Examiners love keys that do <b>different jobs in Word, Excel and the browser<\/b> (Ctrl+D, Ctrl+H, F5, F7, F12)."},{"k":"story","h":"<p>A keyboard shortcut is like <b>speed dial<\/b> on a phone. You could open the contacts list, scroll and tap a name — or you could press one button. In the same way you can click Edit and then Copy with the mouse, or simply press <b>Ctrl+C<\/b>.<\/p><p>Most shortcuts are built from <b>modifier keys<\/b> held down — Ctrl, Alt, Shift and the <b>Windows logo key<\/b> — plus one letter or function key. Hold the modifier, tap the second key, then let go. Many letters are easy to guess: Ctrl+<b>P<\/b> for Print, Ctrl+<b>S<\/b> for Save, Ctrl+<b>F<\/b> for Find, Ctrl+<b>N<\/b> for New.<\/p><p>Remember one important rule: a shortcut belongs to the <b>program that is active<\/b>. Ctrl+D in Word opens the Font box, in Excel it fills a cell downwards, and in Chrome it bookmarks the page. So always read the question carefully — 'in MS Word', 'in Excel', 'in a web browser' — before picking the answer. Learn the tables below group by group and the questions become free marks.<\/p>","key":"Shortcut = modifier key + one key; the same keys can mean different things in different programs."},{"k":"table","title":"Universal editing shortcuts (Windows and almost every program)","head":["Keys","Action"],"rows":[["Ctrl+C","Copy"],["Ctrl+X","Cut"],["Ctrl+V","Paste"],["Ctrl+Z","Undo"],["Ctrl+Y","Redo (or repeat last action in Office)"],["Ctrl+A","Select all"],["Ctrl+P","Print"],["Ctrl+S","Save"],["Ctrl+F","Find"],["Shift+Arrow keys","Extend selection"],["Ctrl+Home / Ctrl+End","Go to beginning / end of document"],["Home / End","Go to beginning / end of the line"]]},{"k":"info","title":"Ctrl shortcuts on the keyboard","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 340\" role=\"img\" aria-label=\"Ctrl shortcuts on a keyboard\">\n  <rect x=\"20\" y=\"60\" width=\"52\" height=\"52\" rx=\"8\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><text x=\"46\" y=\"84\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Q<\/text><rect x=\"78\" y=\"60\" width=\"52\" height=\"52\" rx=\"8\" fill=\"hsla(20,85%,55%,.35)\" stroke=\"var(--rule)\"/><text x=\"104\" y=\"84\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">W<\/text><text x=\"104\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" style=\"fill:var(--ink2)\">Close tab<\/text><rect x=\"136\" y=\"60\" width=\"52\" height=\"52\" rx=\"8\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><text x=\"162\" y=\"84\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">E<\/text><rect x=\"194\" y=\"60\" width=\"52\" height=\"52\" rx=\"8\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><text x=\"220\" y=\"84\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">R<\/text><rect x=\"252\" y=\"60\" width=\"52\" height=\"52\" rx=\"8\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><text x=\"278\" y=\"84\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">T<\/text><rect x=\"310\" y=\"60\" width=\"52\" height=\"52\" rx=\"8\" fill=\"hsla(20,85%,55%,.35)\" stroke=\"var(--rule)\"/><text x=\"336\" y=\"84\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Y<\/text><text x=\"336\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" style=\"fill:var(--ink2)\">Redo<\/text><rect x=\"368\" y=\"60\" width=\"52\" height=\"52\" rx=\"8\" fill=\"hsla(20,85%,55%,.35)\" stroke=\"var(--rule)\"/><text x=\"394\" y=\"84\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">U<\/text><text x=\"394\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" style=\"fill:var(--ink2)\">Underline<\/text><rect x=\"426\" y=\"60\" width=\"52\" height=\"52\" rx=\"8\" fill=\"hsla(20,85%,55%,.35)\" stroke=\"var(--rule)\"/><text x=\"452\" y=\"84\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">I<\/text><text x=\"452\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" style=\"fill:var(--ink2)\">Italic<\/text><rect x=\"484\" y=\"60\" width=\"52\" height=\"52\" rx=\"8\" fill=\"hsla(20,85%,55%,.35)\" stroke=\"var(--rule)\"/><text x=\"510\" y=\"84\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">O<\/text><text x=\"510\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" style=\"fill:var(--ink2)\">Open<\/text><rect x=\"542\" y=\"60\" width=\"52\" height=\"52\" rx=\"8\" fill=\"hsla(20,85%,55%,.35)\" stroke=\"var(--rule)\"/><text x=\"568\" y=\"84\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">P<\/text><text x=\"568\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" style=\"fill:var(--ink2)\">Print<\/text><rect x=\"42\" y=\"130\" width=\"52\" height=\"52\" rx=\"8\" fill=\"hsla(20,85%,55%,.35)\" stroke=\"var(--rule)\"/><text x=\"68\" y=\"154\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">A<\/text><text x=\"68\" y=\"172\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" style=\"fill:var(--ink2)\">Select all<\/text><rect x=\"100\" y=\"130\" width=\"52\" height=\"52\" rx=\"8\" fill=\"hsla(20,85%,55%,.35)\" stroke=\"var(--rule)\"/><text x=\"126\" y=\"154\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">S<\/text><text x=\"126\" y=\"172\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" style=\"fill:var(--ink2)\">Save<\/text><rect x=\"158\" y=\"130\" width=\"52\" height=\"52\" rx=\"8\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><text x=\"184\" y=\"154\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">D<\/text><rect x=\"216\" y=\"130\" width=\"52\" height=\"52\" rx=\"8\" fill=\"hsla(20,85%,55%,.35)\" stroke=\"var(--rule)\"/><text x=\"242\" y=\"154\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">F<\/text><text x=\"242\" y=\"172\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" style=\"fill:var(--ink2)\">Find<\/text><rect x=\"274\" y=\"130\" width=\"52\" height=\"52\" rx=\"8\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><text x=\"300\" y=\"154\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">G<\/text><rect x=\"332\" y=\"130\" width=\"52\" height=\"52\" rx=\"8\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><text x=\"358\" y=\"154\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">H<\/text><rect x=\"390\" y=\"130\" width=\"52\" height=\"52\" rx=\"8\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><text x=\"416\" y=\"154\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">J<\/text><rect x=\"448\" y=\"130\" width=\"52\" height=\"52\" rx=\"8\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><text x=\"474\" y=\"154\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">K<\/text><rect x=\"506\" y=\"130\" width=\"52\" height=\"52\" rx=\"8\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><text x=\"532\" y=\"154\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">L<\/text><rect x=\"64\" y=\"200\" width=\"52\" height=\"52\" rx=\"8\" fill=\"hsla(20,85%,55%,.35)\" stroke=\"var(--rule)\"/><text x=\"90\" y=\"224\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Z<\/text><text x=\"90\" y=\"242\" text-anchor=\"middle\" font-size=\"9\" font-

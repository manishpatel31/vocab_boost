=\"16\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">M<\/text>\n  <rect x=\"20\" y=\"270\" width=\"110\" height=\"52\" rx=\"8\" fill=\"hsla(212,60%,55%,.4)\" stroke=\"var(--rule)\"/><text x=\"75\" y=\"302\" font-size=\"16\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Ctrl<\/text>\n  <text x=\"150\" y=\"292\" font-size=\"13\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Hold Ctrl and press the orange key.<\/text><text x=\"150\" y=\"312\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink2)\">These work in almost every Windows program.<\/text><\/svg><\/figure>","cap":"Copy C, cut X, paste V sit side by side at the bottom left; undo Z is next to them. In Word, Ctrl+B, I and U are bold, italic and underline."},{"k":"table","title":"Windows shortcuts","head":["Keys","Action"],"rows":[["Alt+Tab","Switch between open windows/apps"],["Alt+F4","Close the active window or app (on the desktop: opens the Shut Down dialog)"],["Win","Open the Start menu (Ctrl+Esc also works)"],["Win+D","Show the desktop (press again to restore)"],["Win+M","Minimise all windows"],["Win+E","Open File Explorer"],["Win+L","Lock the computer"],["Win+R","Open the Run dialog box"],["Win+I","Open Settings"],["Win+Tab","Task View"],["Win+V","Clipboard history (Windows 10 / 11)"],["Win+Shift+S","Snip part of the screen (screenshot)"],["PrtScn","Copy the whole screen to the clipboard"],["Alt+PrtScn","Copy only the active window"],["Ctrl+Shift+Esc","Open Task Manager directly"],["Ctrl+Alt+Delete","Security screen: lock, switch user, sign out, Task Manager"],["F2","Rename the selected file or folder"],["Delete (or Ctrl+D)","Move the selected file to the Recycle Bin"],["Shift+Delete","Delete permanently without using the Recycle Bin"],["Ctrl+Shift+N","New folder (in File Explorer)"],["Alt+Enter","Properties of the selected file"],["Shift+F10","Context (right-click) menu"],["Win + Pause/Break","System Properties"],["Ctrl + C or Ctrl + Insert","Copy"],["Ctrl + X","Cut"],["Ctrl + V or Shift + Insert","Paste"],["Ctrl + Z / Ctrl + Y","Undo / Redo"],["Ctrl + click","Select several separate icons"],["F5","Refresh"]]},{"k":"table","title":"Common MS Office shortcuts (Word, Excel, PowerPoint)","head":["Keys","Action"],"rows":[["Ctrl+N","New document / workbook / presentation"],["Ctrl+O","Open"],["Ctrl+S","Save"],["F12","Save As"],["Ctrl+P (or Ctrl+F2)","Print / print preview"],["Ctrl+W (or Ctrl+F4)","Close the current document / workbook window"],["Ctrl+F","Find (Word opens the Navigation pane; Excel opens the Find dialog)"],["Ctrl+H","Replace"],["Ctrl+G or F5 (Word, Excel)","Go To"],["Ctrl+K","Insert hyperlink"],["F7","Spelling (and grammar) check"],["Ctrl+B / Ctrl+I / Ctrl+U","Bold / Italic / Underline"],["F1","Help"],["Ctrl+F1","Show / hide the Ribbon"],["Alt or F10","Show key tips for the Ribbon"]]},{"k":"table","title":"Web browser shortcuts (Chrome, Edge, Firefox)","head":["Keys","Action"],"rows":[["Ctrl+T","New tab"],["Ctrl+N","New window"],["Ctrl+Shift+N","New incognito window (Chrome) / InPrivate window (Edge)"],["Ctrl+Shift+P","New private window (Firefox)"],["Ctrl+W (or Ctrl+F4)","Close the current tab"],["Ctrl+Shift+T","Reopen the last closed tab"],["Ctrl+Tab / Ctrl+Shift+Tab","Next tab / previous tab"],["Ctrl+1 … Ctrl+8 / Ctrl+9","Jump to that tab / to the last tab"],["Ctrl+D","Bookmark the current page"],["Ctrl+Shift+B","Show / hide the bookmarks bar (Chrome)"],["Ctrl+H","History"],["Ctrl+J","Downloads (Chrome, Edge)"],["F5 or Ctrl+R","Reload the page"],["Ctrl+F5 or Ctrl+Shift+R","Hard reload — reload ignoring the cached copy"],["Ctrl+L / Alt+D / F6","Go to the address bar"],["Alt+Left / Alt+Right","Back / Forward"],["Ctrl+F","Find on the page"],["Ctrl+plus / Ctrl+minus / Ctrl+0","Zoom in / zoom out / reset zoom"],["F11","Full-screen mode"],["Ctrl+U","View page source"],["F12","Developer tools"],["Ctrl+Shift+Delete","Clear browsing data"]]},{"k":"table","title":"Function keys F1–F12 by use","head":["Key","Windows / general","Office / browser"],"rows":[["F1","Help","Help in every Office app"],["F2","Rename selected file/folder","Excel: edit the active cell"],["F3","Search in File Explorer","Word Shift+F3: change case; Excel Shift+F3: Insert Function"],["F4","Alt+F4 closes the window","Excel: toggle $ references while editing a formula, else repeat last action; Word: repeat last action"],["F5","Refresh (File Explorer, desktop)","Browser: reload; PowerPoint: start slide show; Word and Excel: Go To"],["F6","Move between panes","Browser: address bar"],["F7","—","Spelling and grammar (Word), spelling (Excel, PowerPoint); Shift+F7 = Thesaurus"],["F8","—","Excel: extend-selection mode"],["F9","—","Excel: recalculate all formulas; Word: update the selected field"],["F10","Activate the menu bar / key tips","Shift+F10 = right-click menu"],["F11","Full screen (browser, File Explorer)","Excel: create a chart on a new chart sheet; Shift+F11 = new worksheet"],["F12","—","Office: Save As; Browser: developer tools"]]},{"k":"table","title":"Same keys, different jobs (favourite trap)","head":["Keys","MS Word","MS Excel","Browser"],"rows":[["Ctrl+D","Font dialog box","Fill down","Bookmark page"],["Ctrl+R","Right align","Fill right","Reload"],["Ctrl+H","Replace","Replace","History"],["Ctrl+J","Justify","—","Downloads"],["Ctrl+E","Center align","Flash Fill","—"],["Ctrl+L","Left align","Create table","Address bar"],["Ctrl+T","Hanging indent","Create table","New tab"],["Ctrl+N","New document","New workbook","New window"],["Ctrl+W","Close document","Close workbook","Close tab"],["Ctrl+1","Single line spacing","Format Cells dialog","Go to first tab"],["Ctrl+;","—","Insert today's date","—"],["F5","Go To","Go To","Reload"],["F7","Spelling and grammar","Spelling","—"],["F12","Save As","Save As","Developer tools"]]},{"k":"table","title":"Ctrl + A to Z in Word, Excel and PowerPoint","head":["Ctrl +","MS Word","MS Excel","MS PowerPoint"],"rows":[["A","Select all","Select all","Select all"],["B","Bold","Bold","Bold"],["C","Copy","Copy","Copy"],["<b>D<\/b>","Font dialog box","Fill down","Duplicate slide or object"],["<b>E<\/b>","Centre align","Flash Fill","Centre align"],["F","Find (Navigation pane)","Find","Find"],["<b>G<\/b>","Go To","Go To","Group objects"],["H","Replace","Replace","Replace"],["I","Italic","Italic","Italic"],["<b>J<\/b>","Justify","—","Justify"],["K","Insert hyperlink","Insert hyperlink","Insert hyperlink"],["<b>L<\/b>","Left align","Create table","Left align"],["<b>M<\/b>","Indent the paragraph","—","New slide"],["N","New document","New workbook","New presentation"],["O","Open","Open","Open"],["P","Print","Print","Print"],["<b>Q<\/b>","Remove paragraph formatting","Quick Analysis","Close PowerPoint"],["<b>R<\/b>","Right align","Fill right","Right align"],["S","Save","Save","Save"],["<b>T<\/b>","Hanging indent","Create table","Font dialog box"],["U","Underline","Underline","Underline"],["V","Paste","Paste","Paste"],["W","Close the file","Close the workbook","Close the presentation"],["X","Cut","Cut","Cut"],["Y","Redo / repeat","Redo / repeat","Redo / repeat"],["Z","Undo","Undo","Undo"]]},{"k":"trick","h":"Letters in <b>bold<\/b> above do different jobs in the three apps — <span class='mn'>D E G J L M Q R T<\/span>. Every other Ctrl + letter does the same job everywhere, so learn only those nine by heart."},{"k":"p","h":"<b>What happens when you delete a file in Windows.<\/b> pressing Delete or choosing Delete from the right-click menu moves the file to the Recycle Bin; it still uses disk space and can be restored. It is removed only when the Recycle Bin is emptied, or if you press Shift + Delete, which skips the Recycle Bin. Even then, data-recovery tools can sometimes bring it back."},{"k":"trick","h":"The bottom-left row <span class='mn'>Z X C V<\/span> sits under your left hand: <span class='mn'>Z<\/span> = undo (zap the mistake), <span class='mn'>X<\/span> = cut (looks like scissors), <span class='mn'>C<\/span> = copy, <span class='mn'>V<\/span> = paste (a V-shaped arrow pushing down). For Windows-key shortcuts think of the letter: <span class='mn'>D<\/span>esktop, <span class='mn'>E<\/span>xplorer, <span class='mn'>L<\/span>ock, <span class='mn'>R<\/span>un, <span class='mn'>I<\/span> = settings (Info).<ul><li>Delete forever = \"Shift + Delete\".<\/li><li>Private browsing: Ctrl + Shift + N in both Chrome (Incognito) and Edge (InPrivate).<\/li><\/ul>"},{"k":"trap","h":"<b>Ctrl+D<\/b>: Font dialog in Word, fill down in Excel, bookmark in a browser, delete to Recycle Bin in File Explorer. <b>F5<\/b>: reload in a browser, Go To in Word/Excel, slide show in PowerPoint. <b>Ctrl+W<\/b> closes a <i>tab<\/i> in a browser but a <i>document<\/i> in Word. <b>Ctrl+N<\/b> opens a new <i>window<\/i> in a browser (new tab is Ctrl+T). <b>Ctrl+Shift+T<\/b> reopens a closed tab, not a new tab. <b>F5 vs Ctrl+F5<\/b>: normal reload vs hard reload bypassing the cache. <b>Ctrl+Shift+Esc<\/b> opens Task Manager directly; Ctrl+Alt+Delete opens the security screen first."}],"sum":["Ctrl+C copy, Ctrl+X cut, Ctrl+V paste, Ctrl+Z undo, Ctrl+Y redo, Ctrl+A select all.","Alt+Tab switches apps, Alt+F4 closes, Win+D desktop, Win+E File Explorer, Win+L lock, Win+R Run, Ctrl+Shift+Esc Task Manager.","F2 rename, Delete to Recycle Bin, Shift+Delete permanent; F12 Save As in Office, F7 spelling.","Browser: Ctrl+T new tab, Ctrl+Shift+T reopen tab, Ctrl+W close tab, Ctrl+D bookmark, Ctrl+H history, Ctrl+J downloads.","F5 reload, Ctrl+F5 hard reload bypassing cache, Ctrl+L or Alt+D or F6 address bar, Ctrl+Shift+N incognito in Chrome.","Windows: desktop, taskbar, Start menu, File Explorer (Win + E), Recycle Bin (Shift + Delete skips it), Control Panel.","Ctrl + D, E, G, J, L, M, Q, R and T do different jobs in Word, Excel and PowerPoint; the other letters do the same job in all three."],"part":["Part 2 · Software, Windows & MS Office","सॉफ़्टवेयर, विंडोज़ एवं एमएस ऑफ़िस"]},
{"id":"C9","g":"cmp","heat":3,"title":"MS Office & MS Word","hi":"एमएस ऑफ़िस एवं एमएस वर्ड","blocks":[{"k":"hot","h":"MS Word gives 1–3 questions per paper: <b>shortcuts<\/b> (Ctrl+K, Ctrl+E, Ctrl+Enter, Shift+F3), <b>which tab holds which feature<\/b> (Mail Merge in Mailings, Track Changes in Review), and the <b>.docx<\/b> extension.<br><br>MS-Word is the single biggest scoring area in SSC Tier-II computer modules: shortcuts (Ctrl + Shift + L, F12, Ctrl + K, Ctrl + E), which tab holds a command (Mailings, References, Review), font size limits, views, margins, mail merge and styles. SSC CGL Tier-II 2023 and 2025 asked Styles, bullets and Shading; CHSL Tier-II 2024 asked Save As (F12); CHSL 2024 asked mail merge twice."},{"k":"story","h":"<p>MS Word is a <b>word processor<\/b> — a smart typewriter. On a typewriter a spelling mistake means retyping the whole page; in Word you simply fix the word, and the rest of the page moves itself. You can change the look of the letters (<b>font<\/b>), the arrangement of whole paragraphs (<b>alignment, spacing<\/b>) and the page itself (<b>margins, orientation<\/b>).<\/p><p>Across the top runs the <b>Ribbon<\/b>, like the shelves of a stationery shop arranged in sections. Each <b>tab<\/b> is one section: Home for everyday formatting, Insert for things you add (tables, pictures, header, page numbers, hyperlink), Layout for the page, Mailings for mail merge, Review for spelling and tracked changes, View for how you look at the page. Above or below it sits the tiny <b>Quick Access Toolbar<\/b> with Save and Undo, and at the bottom the <b>status bar<\/b> shows page number and word count.<\/p><p>Word can also write one letter to a hundred people with each name filled in automatically — that is <b>Mail Merge<\/b>.<\/p>","key":"Know which Ribbon tab holds each feature, and the Word-only shortcuts for formatting."},{"k":"facts","title":"Microsoft and MS-Office","rows":[["Microsoft","Bill Gates; software products MS-DOS (1981), MS-Windows (1985), MS-Office (1990)."],["MS-Office announced","1988 (by Bill Gates)."],["First version","MS-Office 1.0 released on 19 November 1990."],["Versions","1.0, 1.5, 1.6, 3.0, 4.0, NT 4.2, 4.3, 95, 97, 2000, XP, 2003, 2007, 2010, 2013, 2016, 2019, 2021, 365 (now \"Microsoft 365\"). There is NO MS-Office 98."],["NT / XP","NT = New Technology; XP = eXPerience."],["What MS-Office is","Application software, an application suite (package), closed-source software, horizontal market software (made for many industries) and also offered as SaaS (Software as a Service). All of these are correct."],["Free trick (\"jugaad\")","Pirated or cracked versions (duplicate key) are illegal."],["Default file names","Word = Document1 (.doc till 2003, .docx from 2007); Excel = Book1 (.xls/.xlsx); PowerPoint = Presentation1 (.ppt/.pptx)."],["File name length","Manually up to 225 characters with or without spaces."]]},{"k":"table","title":"MS-Office applications","head":["Application","What it is"],"rows":[["MS-Word","Word processor"],["MS-Excel","Spreadsheet program / chart-making application"],["MS-PowerPoint","Presentation program"],["MS-Access","Database program (file extension .accdb from Access 2007)"],["MS-Outlook","Email client application"],["MS-OneNote","Notes-making program (notes, drawing, screen clipping, audio)"],["MS-Publisher","Desktop publishing (business cards, calendars, brochures, newsletters)"],["MS-SharePoint, MS-FrontPage, MS-Expression Web","HTML editors"],["MS-Project","Project management software"],["MS-Visio","Diagramming and vector graphics application"],["MS-Sway","Turns documents into web pages (Word's \"Transform\" uses Sway)"],["MS-Forms","Online survey creator"],["MS-Bookings","Scheduling program"],["MS-OneDrive","File hosting service / cloud storage"],["MS-Stream","Video sharing service"],["MS-Teams","Workspace chat and video conferencing"],["MS-To Do","Cloud-based task management"],["MS-Skype","VoIP video/voice calls and instant messaging"],["MS-Yammer","Private social network inside organisations"]]},{"k":"facts","title":"Discontinued Office applications","rows":[["List","MS-Binder, MS-Classroom, MS-Clip Organizer, MS-Docs, MS-Data Analyser, MS-Entourage, MS-Equation Editor, MS-Exchange Client, MS-FrontPage, MS-InfoPath, MS-Interconnect, MS-Mail, MS-MapPoint, MS-Mathematics, MS-Office Accounting, MS-Office Document Imaging, MS-Office Document Scanning, MS-Office Live, MS-Office Live Meeting, MS-PerformancePoint Server, MS-Office Picture Manager, MS-Office Portfolio Server, MS-Outlook Hotmail Connector, MS-PhotoDraw, MS-Photo Editor, MS-Schedule, MS-Search Server, MS-SharePoint Designer, MS-SharePoint Foundation, MS-SharePoint Workspace (formerly Office Groove), Microsoft Vizact, Office Assistant, Office Web Components."]]},{"k":"facts","title":"Word interface and defaults","rows":[["Type of software","Word processor (application software) by Microsoft"],["Default file extension","<b>.docx<\/b> (Word 2007 onwards); .doc in Word 97–2003"],["Templates","<b>.dotx<\/b>; macro-enabled document .docm, macro-enabled template .dotm"],["Default new document name","Document1"],["Default font","Calibri 11 pt (Word 2007–2021); newer Microsoft 365 uses Aptos 11 pt; Word 2003 used Times New Roman 12 pt"],["Font size range","1 to 1638 points"],["Ribbon","Strip of tabs with grouped commands, introduced in Office 2007"],["Quick Access Toolbar","Small toolbar above (or below) the Ribbon; default buttons Save, Undo, Redo"],["Title bar","Top bar showing document name and program name"],["Status bar","Bottom bar: page number, word count, proofing status, views, zoom slider"],["Ruler","Shows margins, indents and tab stops"],["Backstage view","Opened by the File tab: New, Open, Save As, Print, Share, Options"],["Cursor / insertion point","Blinking vertical line where the next character will appear"],["MS-Word","Word processor program; application software."],["History","MS-Word announced in 1983 as \"Multi-Tool Word\" for Xenix OS and MS-DOS; first release for Windows in 1989."],["Other word processors","WordStar, Easy Word, OpenOffice Writer (open-source), WordPerfect."],["File","Default name Document1; .doc (till 2003), .docx (2007 onwards); maximum file size 512 MB."],["Run command","Type \"winword\" in Run (Win + R) to open MS-Word."],["Mouse in Word","Single click = place the cursor; double click = select a word; triple click = select a paragraph; Ctrl + click = select a sentence."],["F8 (extend mode)","Press F8 twice = select word, three times = sentence, four times = paragraph, five times = whole document."],["Bars","Title bar, Quick Access Toolbar, Menu bar (menu/tab), Ribbon (tools/commands/sub-menus), vertical scroll bar, horizontal scroll bar, status bar."],["Toolbar","Contains buttons and menus for quick access to common commands."],["Dialog box","A small window."],["Tabs","File, Home, Insert, Draw, Design, Layout, References, Mailings, Review, View, Help. (There is no \"Data\" tab in Word; Data is in Excel.)"]]},{"k":"table","title":"Ribbon tabs — where things live","head":["Tab","Main commands"],"rows":[["File","Backstage: New, Open, Save, Save As, Print, Info, Options"],["Home","Clipboard (Cut, Copy, Paste, Format Painter), Font, Paragraph, Styles, Editing (Find, Replace, Select)"],["Insert","Pages (Cover Page, Blank Page, Page Break), Table, Pictures, Shapes, SmartArt, Chart, Link (hyperlink), Header, Footer, Page Number, Text Box, WordArt, Drop Cap, Symbol, Equation"],["Design","Themes, document formatting, Watermark, Page Colour, Page Borders"],["Layout (Page Layout in 2010/2013)","Margins, Orientation, Size, Columns, Breaks, Line Numbers, Hyphenation, Indent and Spacing"],["References","Table of Contents, Footnotes, Endnotes, Citations and Bibliography, Captions, Index"],["Mailings","Envelopes, Labels, Start Mail Merge, Select Recipients, Insert Merge Field, Finish and Merge"],["Review","Spelling and Grammar, Thesaurus, Word Count, Comments, Track Changes, Accept / Reject, Compare, Protect"],["View","Read Mode, Print Layout, Web Layout, Outline, Draft, Ruler, Gridlines, Navigation Pane, Zoom, Macros"]]},{"k":"info","title":"The MS Word window","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 300\" role=\"img\" aria-label=\"Document1 — Word window, labelled\">\n  <rect x=\"20\" y=\"10\" width=\"440\" height=\"270\" rx=\"8\" fill=\"var(--sheet)\" stroke=\"var(--rule)\" stroke-width=\"2\"/><rect x=\"20\" y=\"10\" width=\"440\" height=\"24\" rx=\"8\" fill=\"#2f6db5\"/>\n  <text x=\"240\" y=\"27\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" style=\"fill:#fff\">Document1 — Word<\/text>\n  <text x=\"34\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">File<\/text><text x=\"90\" y=\"50\" font-size=\"10.5\" font-weight=\"800\">Home<\/text><text x=\"146\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">Insert<\/text><text x=\"202\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">Design<\/text><text x=\"258\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">Layout<\/text><text x=\"314\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">Review<\/text><text x=\"370\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">View<\/text>\n  <rect x=\"24\" y=\"56\" width=\"432\" height=\"34\" fill=\"var(--sunk)\"/><rect x=\"32\" y=\"62\" width=\"60\" height=\"22\" rx=\"4\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><rect x=\"102\" y=\"62\" width=\"60\" height=\"22\" rx=\"4\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><rect x=\"172\" y=\"62\" width=\"60\" height=\"22\" rx=\"4\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><rect x=\"242\" y=\"62\" width=\"60\" height=\"22\" rx=\"4\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><rect x=\"312\" y=\"62\" width=\"60\" height=\"22\" rx=\"4\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><rect x=\"382\" y=\"62\" width=\"60\" height=\"22\" rx=\"4\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/>\n  <rect x=\"24\" y=\"94\" width=\"432\" height=\"10\" fill=\"var(--sunk)\"/><line x1=\"30\" y1=\"94\" x2=\"30\" y2=\"104\" stroke=\"var(--ink2)\"/><line x1=\"72\" y1=\"94\" x2=\"72\" y2=\"104\" stroke=\"var(--ink2)\"/><line x1=\"114\" y1=\"94\" x2=\"114\" y2=\"104\" stroke=\"var(--ink2)\"/><line x1=\"156\" y1=\"94\" x2=\"156\" y2=\"104\" stroke=\"var(--ink2)\"/><line x1=\"198\" y1=\"94\" x2=\"198\" y2=\"104\" stroke=\"var(--ink2)\"/><line x1=\"240\" y1=\"94\" x2=\"240\" y2=\"104\" stroke=\"var(--ink2)\"/><line x1=\"282\" y1=\"94\" x2=\"282\" y2=\"104\" stroke=\"var(--ink2)\"/><line x1=\"324\" y1=\"94\" x2=\"324\" y2=\"104\" stroke=\"var(--ink2)\"/><line x1=\"366\" y1=\"94\" x2=\"366\" y2=\"104\" stroke=\"var(--ink2)\"/><line x1=\"408\" y1=\"94\" x2=\"408\" y2=\"104\" stroke=\"var(--ink2)\"/>\n  <rect x=\"90\" y=\"110\" width=\"300\" height=\"148\" fill=\"#fff\" stroke=\"var(--rule)\"/><rect x=\"108\" y=\"126\" width=\"264\" height=\"6\" rx=\"3\" fill=\"#d0d4da\"/><rect x=\"108\" y=\"146\" width=\"224\" height=\"6\" rx=\"3\" fill=\"#d0d4da\"/><rect x=\"108\" y=\"166\" width=\"184\" height=\"6\" rx=\"3\" fill=\"#d0d4da\"/><rect x=\"108\" y=\"186\" width=\"264\" height=\"6\" rx=\"3\" fill=\"#d0d4da\"/><rect x=\"108\" y=\"206\" width=\"224\" height=\"6\" rx=\"3\" fill=\"#d0d4da\"/><rect x=\"108\" y=\"226\" width=\"184\" height=\"6\" rx=\"3\" fill=\"#d0d4da\"/><rect x=\"20\" y=\"262\" width=\"440\" height=\"18\" fill=\"var(--sunk)\"/><text x=\"30\" y=\"275\" font-size=\"9.5\" class=\"mut\">Page 1 of 1 · 250 words<\/text>\n  <line x1=\"240\" y1=\"22\" x2=\"480\" y2=\"52\" stroke=\"var(--ink2)\"/><circle cx=\"240\" cy=\"22\" r=\"2.5\" fill=\"var(--ink2)\"/><text data-lq=\"Title bar\" x=\"486\" y=\"56\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Title bar (file name)<\/text><line x1=\"120\" y1=\"46\" x2=\"480\" y2=\"82\" stroke=\"var(--ink2)\"/><circle cx=\"120\" cy=\"46\" r=\"2.5\" fill=\"var(--ink2)\"/><text data-lq=\"Ribbon tabs\" x=\"486\" y=\"86\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Ribbon tabs<\/text><line x1=\"200\" y1=\"73\" x2=\"480\" y2=\"110\" stroke=\"var(--ink2)\"/><circle cx=\"200\" cy=\"73\" r=\"2.5\" fill=\"var(--ink2)\"/><text data-lq=\"Ribbon\" x=\"486\" y=\"114\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Ribbon — groups of commands<\/text><line x1=\"300\" y1=\"99\" x2=\"480\" y2=\"140\" stroke=\"var(--ink2)\"/><circle cx=\"300\" cy=\"99\" r=\"2.5\" fill=\"var(--ink2)\"/><text data-lq=\"Ruler\" x=\"486\" y=\"144\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Ruler<\/text><line x1=\"300\" y1=\"180\" x2=\"480\" y2=\"174\" stroke=\"var(--ink2)\"/><circle cx=\"300\" cy=\"180\" r=\"2.5\" fill=\"var(--ink2)\"/><text data-lq=\"Page\" x=\"486\" y=\"178\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Page (Print Layout view)<\/text><line x1=\"120\" y1=\"271\" x2=\"480\" y2=\"260\" stroke=\"var(--ink2)\"/><circle cx=\"120\" cy=\"271\" r=\"2.5\" fill=\"var(--ink2)\"/><text data-lq=\"Status bar\" x=\"486\" y=\"264\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Status bar<\/text><\/svg><\/figure>","cap":"The ribbon replaced menus in Office 2007. Home holds the Clipboard, Font and Paragraph groups; the default view is Print Layout."},{"k":"table","title":"File tab","head":["Command","Use","Shortcut"],"rows":[["Info","Information about the file","—"],["New","New document","Ctrl + N"],["Open","Open an existing file","Ctrl + O or Ctrl + F12"],["Save","Save the content","Ctrl + S (Shift + F12 also saves)"],["Save As","Save with a new name, location or format","F12"],["Print","Print a document","Ctrl + P or Ctrl + Shift + F12"],["Print Preview","See how it will print","Ctrl + F2 or Ctrl + Alt + I"],["Export","Convert Word file to PDF","—"],["Share","Share the file on OneDrive (cloud)","—"],["Transform","Turn a Word file into a web page (via MS-Sway) [exam]","—"],["Close","Close the file","Ctrl + W (Ctrl + F4)"],["Close the application","Exit Word","Alt + F4"]]},{"k":"table","title":"Home tab","head":["Group","Tools and facts"],"rows":[["Clipboard","Till Word 97 holds 1 item; from Word 2000 holds 24 items; volatile; Copy = Ctrl + C / Ctrl + Insert; Cut = Ctrl + X; Paste = Ctrl + V / Shift + Insert; Paste Special = Ctrl + Alt + V (paste unformatted text); Format Painter = Ctrl + Shift + C (copy format) and Ctrl + Shift + V (paste format); double-click Format Painter to use it many times. Clipboard pane buttons: Paste All, Clear All, Options."],["Font","Default font: Times New Roman (till 2003), Calibri (2007 onwards), now Aptos in Microsoft 365. Font size range 1 to 1638; drop-down list 8 to 72; default 12 (2003), 11 (2007+). 72 points = 1 inch. Font styles: Regular (default), Bold (Ctrl + B), Italic (Ctrl + I). Underline Ctrl + U; double underline Ctrl + Shift + D. Font effects: subscript (Ctrl + =), superscript (Ctrl + Shift + +), strikethrough. Font dialog box Ctrl + D (also Ctrl + Shift + F changes font): font, size, style, subscript, superscript, strikethrough, double strikethrough, all caps, small caps, emboss, engrave. Text colour; text highlight colour. Change Case (Shift + F3): Sentence case, lowercase, UPPERCASE, Capitalize Each Word, tOGGLE cASE."],["Font size keys","Ctrl + ] = increase by 1 point; Ctrl + [ = decrease by 1 point; Ctrl + Shift + &gt; = increase to the next list size (1 point up to 12, then 2 points); Ctrl + Shift + &lt; = decrease to the previous size."],["Paragraph","Bullets (numbered and unnumbered; Ctrl + Shift + L = bullet). 4 alignments: Left (default, Ctrl + L), Right (Ctrl + R), Center (Ctrl + E), Justify (Ctrl + J). Line spacing 1.0 to 3.0, default 1.15 (vertical space between lines); Ctrl + 1 single, Ctrl + 2 double, Ctrl + 5 = 1.5 lines. Borders (all, bottom, top, left, right; on word, sentence, paragraph). Shading (colour behind the selected text). Indentation: first-line indent, left indent, right indent (markers on the ruler); Ctrl + M = indent the paragraph, Ctrl + T = hanging indent, Ctrl + Q = remove paragraph formatting/indentation."],["Styles","Normal (default), No Spacing, Heading 1, Heading 2, Heading 3: apply a consistent look to headings, titles and subtitles; Ctrl + Alt + 1/2/3 = Heading 1/2/3."],["Editing","Find (Ctrl + F, opens Navigation pane), Replace (Ctrl + H), Go To (Ctrl + G); F5 opens Find and Replace (Go To)."],["Voice","Dictate (voice typing)."],["Editor","Checks everything in the document (spelling, grammar, clarity)."],["Add-ins","Adds extra pre-defined applications to Word."]]},{"k":"table","title":"Insert tab","head":["Group","Tools and facts"],"rows":[["Pages","Cover page; blank page; page break (Ctrl + Enter: moves the cursor to the next page)"],["Table","Draw Table (with mouse); Insert Table: maximum 63 columns and 32,767 rows, minimum 1 x 1; Excel spreadsheet (import Excel data); Quick Tables (e.g. calendars) [exam]; pressing Tab in the last cell adds a new row; Ctrl + Shift + Enter splits a table"],["Illustrations","Picture, Icons (animated images), Shapes, 3D Models, SmartArt (pre-defined graphics), Screenshot (screen clipping), Chart"],["Media","Online Video (from social platforms)"],["Links","Hyperlink (Ctrl + K): to an existing document, web page, place in the document, or email ID; link text is blue and underlined; mouse becomes a hand; Ctrl + click opens it. Bookmark: names a location to jump to quickly."],["Comment","Comment tool: additional note"],["Header and Footer","Header, footer (text and images) and page numbers; options: repeat on every page, different first page, different odd and even pages"],["Text","Text box; WordArt (decorative text); Drop Cap (3 types: None, Dropped, In Margin; lines to drop: 1 to 10); Signature line; Date and Time (Alt + Shift + D date, Alt + Shift + T time)"],["Symbols","Equation (maths), Symbol; Ctrl + Alt + C = copyright ©; Ctrl + Alt + T = trademark ™"]]},{"k":"table","title":"Design, Layout and References tabs","head":["Tab","Tools and facts"],"rows":[["Draw","Handwriting tools"],["Design","Themes (colour, font, size); Document Formatting (predefined formatting) [exam]; Watermark (text or image, diagonal or horizontal; default watermarks \"Confidential\" and \"Do Not Copy\"; behind the text); Page Color (default white; visible only in Print Layout and Web Layout views); Page Borders"],["Layout","Page Setup: Margins on 4 sides (T, B, L, R). Normal margin (2007+) = 1 inch on all sides; till 2003 Normal = top/bottom 1 inch, left/right 1.25 inch. Margin types: Normal, Wide, Narrow, Moderate, Mirrored, Custom (no \"Broad\" or \"Center\" margin). Gutter margin = extra space for binding (pasting or spiral). Orientation: Portrait/Landscape. Size: A3, A4, A5, B4, B5, Tabloid, Legal (8.5 x 14 in), Statement, Executive, Letter (8.5 x 11 in); the default is Letter (8.5 x 11 in) or A4 (8.27 x 11.69 in, 21 x 29.7 cm), depending on the region. Columns (one, two, three, left, right). Hyphenation (breaking a word across two lines). Paragraph (spacing, indentation). Arrange (wrap text). 1 inch = 2.54 cm."],["References","Table of Contents (hierarchical headings; built from heading Styles); Footnote (bottom of the page; Alt + Ctrl + F); Endnote (end of the document; Alt + Ctrl + D); Research (online search); Citation and Bibliography (Manage Sources); Captions (text below a figure); Index; Table of Authorities (list of references)"]]},{"k":"table","title":"Mailings, Review and View tabs","head":["Tab","Tools and facts"],"rows":[["Mailings","Used after making a document, to mail it (Word + Outlook). Create: Envelopes, Labels. Start Mail Merge: letters, email messages, envelopes, labels, directory, normal Word document; Select Recipients (email address list); Edit Recipient List. Write and Insert Fields: Address Block, Greeting Line. Preview Results (check before sending). Mail merge needs a main document, a data source and merge fields."],["Review","Proofing: Spelling and Grammar (F7): spelling mistake = red wavy line, grammar mistake = blue double underline in new Word; Thesaurus (Shift + F7): dictionary, synonyms and antonyms; Word Count (also on the status bar); Editor (F7). Speech: Read Aloud. Accessibility (errors and warnings; status bar). Language (add language; Translate English &lt;→ Hindi). Comments (New Comment; also on Insert tab). Tracking: Track Changes (Ctrl + Shift + E). Changes: Accept, Reject. Compare: Combine (merge two files), Compare (two versions). Protect: Restrict Formatting, Restrict Editing (make file read-only)."],["View","Document views (5): Print Layout (default), Web Layout (see as a web page), Read Mode (full-screen reading), Outline (bulleted structure), Draft (quick editing). Immersive: Focus mode, Immersive Reader (more character spacing). Page Movement: vertical, side to side. Show: Ruler (top and left), Gridlines, Navigation Pane (Ctrl + F). Zoom: 10% to 500%, default 100% (also on the status bar). Window: New Window, Split, Switch Windows. Macros: recording tool; View Macros (Alt + F8); steps: 1 macro name, 2 assign to button or keyboard shortcut, 3 store in, 4 description. Properties (same as Info in the File tab)."],["Help","Help (F1), Feedback, Contact Support (robotic chat), Show Training (video tutorials), What's New."]]},{"k":"table","title":"Views in Word","head":["View","Use"],"rows":[["Print Layout","Default view; shows the page exactly as it will print"],["Read Mode","Full-screen reading; editing tools hidden"],["Web Layout","Shows how the document looks as a web page"],["Outline","Shows the heading structure; move whole sections"],["Draft","Plain text only; headers, footers and pictures hidden — fastest for typing"]]},{"k":"table","title":"Word formatting and page features","head":["Feature","What it means"],"rows":[["Alignment","Left (default), Center, Right, Justify (both edges straight)"],["Line spacing","Gap between lines: 1.0, 1.15, 1.5, 2.0 … (Home → Paragraph)"],["Indent","Distance of text from the margin; first-line and hanging indents"],["Styles","Saved formatting sets: Normal, Heading 1, Heading 2, Title …; headings feed the Table of Contents"],["Format Painter","Copies formatting from one text to another (paintbrush icon)"],["Margins","Blank space around the page; Normal = 1 inch on each side"],["Gutter","Extra margin for binding"],["Orientation","Portrait (tall) or Landscape (wide)"],["Breaks","Page break; section breaks: Next Page, Continuous, Even Page, Odd Page; column break"],["Columns","Newspaper-style columns (Layout → Columns)"],["Header / Footer","Text repeated at the top / bottom of every page; page numbers usually go here"],["Footnote / Endnote","Note at the bottom of the page / at the end of the document"],["Drop Cap","Large first letter of a paragraph (Insert tab)"],["Watermark","Faint text or picture behind page text, e.g. CONFIDENTIAL"],["Mail Merge","Main document + data source (Excel list, Outlook contacts) = personalised letters, envelopes, labels"],["Track Changes","Records every insertion and deletion so a reviewer can accept or reject it"],["Find &amp; Replace","Find a word (Ctrl+F) and replace it (Ctrl+H)"],["AutoCorrect","Fixes common typing mistakes automatically (teh → the)"],["Spell check","Red wavy underline = spelling; blue double underline = grammar (Word 2013 onwards)"],["Table","Insert → Table; cells in rows and columns; merge and split cells"]]},{"k":"table","title":"Word-specific shortcuts","head":["Keys","Action in Word"],"rows":[["Ctrl+B / Ctrl+I / Ctrl+U","Bold / Italic / Underline"],["Ctrl+Shift+D","Double underline"],["Ctrl+L / Ctrl+E / Ctrl+R / Ctrl+J","Align left / Center / Align right / Justify"],["Ctrl+] / Ctrl+[","Increase / decrease font size by 1 point"],["Ctrl+Shift+&gt; / Ctrl+Shift+&lt;","Increase / decrease font size to the next size in the list"],["Ctrl+D","Font dialog box"],["Shift+F3","Change case (lowercase, UPPERCASE, Capitalise Each Word)"],["Ctrl+= / Ctrl+Shift+plus","Subscript / Superscript"],["Ctrl+1 / Ctrl+2 / Ctrl+5","Single / double / 1.5 line spacing"],["Ctrl+M / Ctrl+Shift+M","Increase / decrease left indent"],["Ctrl+T","Hanging indent"],["Ctrl+Enter","Page break"],["Shift+Enter","Line break (new line, same paragraph)"],["Ctrl+Shift+Enter","Column break"],["Ctrl+K","Insert hyperlink"],["Ctrl+W","Close the document"],["Ctrl+Home / Ctrl+End","Beginning / end of the document"],["Ctrl+Space","Remove character formatting"],["Ctrl+Shift+C / Ctrl+Shift+V","Copy formatting / paste formatting"],["F7 / Shift+F7","Spelling and Grammar / Thesaurus"],["Ctrl+Shift+E","Turn Track Changes on or off"],["Ctrl+Alt+M","Insert a comment"],["Ctrl+Alt+F / Ctrl+Alt+D","Insert footnote / endnote"],["Alt+Shift+D / Alt+Shift+T","Insert date / time"],["Ctrl+Alt+C / R / T","© / ® / ™ symbol"],["F4","Repeat the last action"],["F12","Save As"],["Ctrl + A","Select all"],["Ctrl + Z / Ctrl + Y","Undo / Redo (Ctrl + Y also repeats)"],["Ctrl + Shift + *","Show/hide non-printing characters"],["Ctrl + Left/Right arrow","Move one word left/right"],["Ctrl + Up/Down arrow","Start / end of the paragraph"],["Ctrl + Delete / Ctrl + Backspace","Delete word to the right / left"],["Ctrl + Spacebar","Reset text to the default font"],["Ctrl + F1","Show/hide the ribbon (task pane)"],["Alt + Ctrl + F2","Open a document"],["Ctrl + Shift + F6","Switch to another open Word document"]]},{"k":"p","h":"<b>Mail merge in four steps.<\/b> (1) Start Mail Merge and pick the type (letters, labels, envelopes, emails). (2) Select Recipients: the data source, such as an Excel sheet of names and addresses. (3) Insert merge fields like &lt;&lt;Name&gt;&gt; and &lt;&lt;Address&gt;&gt; into the main document. (4) Preview Results and Finish and Merge: Word makes one letter per row of the data source. So mail merge needs a main document, a data source and merge fields, but no special \"Word fields\"."},{"k":"p","h":"<b>Footnote vs endnote.<\/b> both add notes with small numbers in the text. A footnote appears at the bottom (foot) of the same page; an endnote collects all notes at the end of the document. Footnote = Alt + Ctrl + F; endnote = Alt + Ctrl + D."},{"k":"p","h":"<b>Paragraph vs character formatting.<\/b> character formatting changes letters (font, font style, size, colour, effects). Paragraph formatting changes whole paragraphs (alignment, line spacing, indentation, bullets, borders). So \"alignment\" is NOT a character formatting option."},{"k":"trick","h":"Alignment keys spell <span class='mn'>L-E-R-J<\/span>: <span class='mn'>L<\/span>eft, c<span class='mn'>E<\/span>nter (the E in cEntre), <span class='mn'>R<\/span>ight, <span class='mn'>J<\/span>ustify — 'Let Every Row Justify'. Square brackets grow and shrink: <span class='mn'>]<\/span> points right = bigger, <span class='mn'>[<\/span> = smaller.<ul><li>Word tabs in order \"Five Happy Indians Draw Designs, Learn Real Maths, Read Very Hard\": File, Home, Insert, Draw, Design, Layout, References, Mailings, Review, View, Help.<\/li><li>Where is it? Thesaurus/Track Changes/Spelling = Review; TOC/Footnote/Citation = References; Mail Merge/Envelopes = Mailings; Watermark/Page Color = Design; Margins/Orientation/Columns = Layout; Hyperlink/Header/Drop Cap = Insert.<\/li><li>Alignments \"L-E-R-J\": Left Ctrl + L, cEntre Ctrl + E, Right Ctrl + R, Justify Ctrl + J.<\/li><li>Font size limits \"1-1638, list 8-72\"; Excel \"1-409\".<\/li><li>Five views \"P-W-R-O-D\": Print, Web, Read, Outline, Draft.<\/li><li>F7 = spelling; Shift + F7 = thesaurus; F12 = Save As; Shift + F3 = change case.<\/li><li>Footnote = Foot of the page; Endnote = End of the document.<\/li><li>Ctrl + K = linK; Ctrl + D = Dialog for font; Ctrl + Shift + L = List (bullets).<\/li><li>Superscript goes up (x²): Ctrl + Shift + +; subscript goes down (H₂O): Ctrl + =.<\/li><\/ul>"},{"k":"trap","h":"<b>Ctrl+C is copy, not center<\/b> — center is <b>Ctrl+E<\/b>. <b>Ctrl+Enter<\/b> = page break but <b>Shift+Enter<\/b> = line break. <b>Ctrl+D<\/b> in Word opens the Font dialog, not 'duplicate' or 'bookmark'. <b>Shift+F3<\/b> changes case in Word but opens Insert Function in Excel. <b>F7<\/b> is spelling; <b>Shift+F7<\/b> is the Thesaurus. <b>Header/footer<\/b> are on the Insert tab, <b>Margins/Orientation<\/b> on the Layout tab, <b>Mail Merge<\/b> on Mailings, <b>Track Changes<\/b> on Review. Default extension is <b>.docx<\/b>; <b>.dotx<\/b> is a template.<ul><li>Maximum font size in Word is 1638, not 255 or 409 (409 is Excel).<\/li><li>DATA is not a Word tab.<\/li><li>Insert Hyperlink = Ctrl + K, not Ctrl + H (Ctrl + H = Replace).<\/li><li>Word has 5 document views.<\/li><li>Change Case is in the FONT group.<\/li><li>Orientation (not wrap text) switches portrait/landscape.<\/li><li>Redo = Ctrl + Y; Undo = Ctrl + Z.<\/li><li>Accept and Reject are in the REVIEW tab.<\/li><li>\"Broad\" is not a margin option; \"Moderate\" is.<\/li><li>Superscript is a font EFFECT, not a font style; styles are regular, bold, italic.<\/li><li>Drop cap can drop at most 10 lines.<\/li><li>Ctrl + T = hanging indent in Word, not \"terminate dialog boxes\".<\/li><li>Spell check = F7.<\/li><li>Page colour shows only in Print Layout and Web Layout, not Reading view.<\/li><li>Ctrl + E = centre in Word, but in a browser Ctrl + E goes to the search bar.<\/li><\/ul>"}],"sum":["MS Word is a word processor; default file .docx (older .doc), template .dotx.","Ribbon tabs: Home formatting, Insert tables and headers, Layout margins and orientation, Mailings mail merge, Review spelling and track changes.","Alignment: Ctrl+L left, Ctrl+E center, Ctrl+R right, Ctrl+J justify.","Ctrl+K hyperlink, Ctrl+Enter page break, Shift+F3 change case, Ctrl+] and Ctrl+[ font size by 1 point.","F7 spelling and grammar, Shift+F7 thesaurus, Ctrl+W close document, F12 Save As.","MS-Office (announced 1988, first released 19 Nov 1990) = Word, Excel, PowerPoint, Access, Outlook etc.; it is application, closed-source, horizontal-market software.","Word: Document1, .doc/.docx, max font 1638, default font Calibri/Aptos size 11, line spacing 1.15, margins 1 inch.","Home: Clipboard (24 items), Font (Ctrl + D), Paragraph (alignments, spacing, bullets Ctrl + Shift + L), Styles, Editing (Ctrl + F/H/G).","Insert: page break Ctrl + Enter, table 63 x 32,767, hyperlink Ctrl + K, header/footer, drop cap (1-10 lines), WordArt, symbols.","Design: themes, watermark, page colour; Layout: margins, orientation, size, columns; References: TOC, footnote, endnote, citations.","Mailings: mail merge; Review: F7 spelling, Shift + F7 thesaurus, Track Changes Ctrl + Shift + E; View: 5 views, zoom 10-500%, macros Alt + F8."],"part":["Part 2 · Software, Windows & MS Office","सॉफ़्टवेयर, विंडोज़ एवं एमएस ऑफ़िस"]},
{"id":"C10","g":"cmp","heat":3,"title":"MS Excel","hi":"एमएस एक्सेल","blocks":[{"k":"hot","h":"Excel gives 2–3 questions: <b>cell address and references ($A$1)<\/b>, <b>functions<\/b> (COUNT vs COUNTA, VLOOKUP, IF), <b>error values<\/b> (#DIV/0!, #N/A, ####), the <b>row/column limits<\/b> and shortcuts like Alt+= and Ctrl+;.<br><br>Excel gives 2 to 4 questions in every SSC Tier-II computer module: rows/columns count, cell address, counting cells in a range, relative/absolute/mixed references after copy-paste, formula output (operator order, SUM, FLOOR, MATCH), chart types and shortcuts (Ctrl + D, Shift + F11, F11, Alt + =). CGL Tier-II asked the cell, A10, MATCH and column width; CHSL asked Ctrl + D, Shift + F11 and Alt + I + R."},{"k":"story","h":"<p>MS Excel is a <b>spreadsheet<\/b> — think of a huge <b>attendance register<\/b> drawn as a grid. The whole register is a <b>workbook<\/b> (one file); each page in it is a <b>worksheet<\/b>; each little box is a <b>cell<\/b>. Columns go across with letters (A, B, C…) and rows go down with numbers (1, 2, 3…), so every box has an address such as <b>B3<\/b> — column B, row 3, like a seat number in a cinema.<\/p><p>The magic of Excel is the <b>formula<\/b>. Type <b>=B3+C3<\/b> in a cell and Excel adds those two boxes; change either number and the answer updates by itself. Ready-made formulas are called <b>functions<\/b>: SUM adds, AVERAGE finds the mean, MAX picks the largest.<\/p><p>When you copy a formula down, Excel shifts the addresses automatically (a <b>relative reference<\/b>). If you want one address to stay fixed — say a tax rate in one cell — you pin it with dollar signs, <b>$B$1<\/b> (an <b>absolute reference<\/b>). Charts, sorting and filters then turn the numbers into answers.<\/p>","key":"Workbook holds worksheets, worksheets hold cells; formulas start with = and dollar signs fix a reference."},{"k":"facts","title":"Excel basics and limits","rows":[["Type of software","Spreadsheet (application software) by Microsoft"],["Workbook","The whole Excel file; default name Book1"],["Worksheet","One sheet (tab) in a workbook; default names Sheet1, Sheet2 …"],["Sheets in a new workbook","1 (Excel 2013 onwards); 3 in Excel 2007 and 2010"],["Cell","Intersection of a row and a column"],["Cell address / reference","Column letter + row number, e.g. C5"],["Active cell","The selected cell with a thick border; its address shows in the Name Box"],["Range","Group of cells written with a colon, e.g. A1:B5 (10 cells)"],["Name Box","Left of the formula bar; shows the active cell address or a named range"],["Formula bar","Shows and edits the content or formula of the active cell (fx)"],["Rows","Identified by numbers; 1,048,576 rows (Excel 2007 onwards)"],["Columns","Identified by letters; 16,384 columns; last column <b>XFD<\/b>"],["Excel 2003 limits","65,536 rows and 256 columns (last column IV)"],["Characters in one cell","Up to 32,767"],["File extensions","<b>.xlsx<\/b> workbook; .xls (Excel 97–2003); <b>.xlsm<\/b> macro-enabled; .xltx template; .csv plain text"],["Fill handle","Small square at the bottom-right of a selection; drag to copy or continue a series"],["Default alignment","Text aligns left, numbers align right"],["MS-Excel","Spreadsheet program and chart-making application (part of MS-Office / Microsoft 365)."],["File","Workbook = collection of worksheets (sheets/spreadsheets). Default name Book1; extension .xls (till 2003), .xlsx (2007+); macro-enabled .xlsm."],["Workbook name length","Up to 225 characters manually. Sheet name: up to 31 characters."],["Default sheets","Excel 2010 and earlier: 3 sheets; Excel 2013 onwards: 1 sheet."],["Cell address","Location of a cell: column letter + row number. Valid: A1, A2, D3, G4, A23, AB23, IV65536, XFD1048576. Invalid: 2A, 2A2, A2B3, A9B, 9AB."],["Column width","Minimum 0, default 8.43, maximum 255 characters."],["Row height","Minimum 0, default 15, maximum 409 points."],["Cell alignment","6 alignments: Left, Center, Right (horizontal) and Top, Middle, Bottom (vertical) giving 9 positions. Default: text (alphabets) left, numbers right, alphanumeric left. \"Align across\" is not an option."],["Mouse pointers","Thick plus (default pointer), thin plus at the bottom-right corner = fill handle (Auto Fill content: series like 10, 20 → 30, 40 or A1, B2 patterns), arrow plus (move content)."],["Ribbon","Appears below the title bar with all commands."],["#####","Shown when the column is not wide enough to display the result."],["Hidden column/row","Shown by a double line indicator between headings."]]},{"k":"facts","title":"Formulas and references","rows":[["Formula","Always starts with \"=\". Example: =10+20+30 → 60; =A1+A2+A3 → 60."],["Function","Pre-written formula: =SUM(10,20,30), =SUM(A1+A2+A3), =SUM(A1:A3)."],["Range","A1:B3 means A1 through B3."],["Order of operations","1 Left to right; 2 Parentheses and exponent ^; 3 Division and multiplication; 4 Addition and subtraction. Example: =20/10+2-1*2 = 2 + 2 - 2 = 2."],["Relative reference (default)","Both column and row change when copied. A4 =SUM(A1:A3) copied to D5 (3 columns right, 1 row down) → =SUM(D2:D4); D6 =SUM(C7:H11) copied to E9 → =SUM(D10:I14)."],["Absolute reference","$A$5: nothing changes. Press F4 to make A5 into $A$5. D6 =SUM($C$7:$H$11) copied to E9 stays =SUM($C$7:$H$11)."],["Mixed reference (row fixed)","A$5: column changes, row stays. D6 =SUM(A$5:C$7) copied to E9 → =SUM(B$5:D$7)."],["Mixed reference (column fixed)","$A5: row changes, column stays. D6 =SUM($A5:$C7) copied to E9 → =SUM($A8:$C10)."],["Dollar sign","Used in absolute and mixed references."]]},{"k":"table","title":"Formulas, operators and references","head":["Item","Rule / example"],"rows":[["Formula","Always begins with = (for example =A1+B1)"],["Arithmetic operators","+ add, - subtract, * multiply, / divide, ^ power, % percent"],["Text operator","&amp; joins text: =A1&amp;' '&amp;B1"],["Comparison operators","=, &gt;, &lt;, &gt;=, &lt;=, &lt;&gt; (not equal)"],["Order of operations","Brackets → negation → % → ^ → * and / → + and - → &amp; → comparison"],["Example","=10+5*2 gives 20; =(10+5)*2 gives 30; =2^3 gives 8"],["Relative reference","A1 — changes when the formula is copied"],["Absolute reference","$A$1 — column and row both fixed"],["Mixed reference","$A1 (column fixed) or A$1 (row fixed)"],["F4 key","While editing a formula, cycles A1 → $A$1 → A$1 → $A1 → A1"],["Reference to another sheet","Sheet2!A1"],["Ctrl+` (grave accent)","Show formulas instead of results"]]},{"k":"info","title":"Relative, absolute and mixed references","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 660 244\" role=\"img\" aria-label=\"What happens to cell references when a formula is copied\">\n  <defs><marker id=\"rf\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"var(--accent)\"/><\/marker><\/defs>\n  <text x=\"110\" y=\"24\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink2)\">formula in B1<\/text><text x=\"330\" y=\"24\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink2)\">copied to C2 becomes<\/text>\n  <rect x=\"40\" y=\"40\" width=\"140\" height=\"34\" rx=\"6\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><text x=\"110\" y=\"62\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">=A1<\/text><path d=\"M190 57 H250\" stroke=\"var(--accent)\" stroke-width=\"2.5\" marker-end=\"url(#rf)\"/><rect x=\"260\" y=\"40\" width=\"140\" height=\"34\" rx=\"6\" fill=\"hsla(20,85%,55%,.2)\" stroke=\"var(--rule)\"/><text x=\"330\" y=\"62\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">=B2<\/text><text x=\"420\" y=\"62\" font-size=\"12\" class=\"mut\">relative — both move<\/text><rect x=\"40\" y=\"86\" width=\"140\" height=\"34\" rx=\"6\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><text x=\ r it. F4 cycles through the four kinds.<\/text><\/svg><\/figure>","cap":"Copy =A1 one row down and one column right and it becomes =B2; =$A$1 stays put; =$A1 keeps column A; =A$1 keeps row 1."},{"k":"info","title":"The MS Excel window","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 300\" role=\"img\" aria-label=\"Book1 — Excel window, labelled\">\n  <rect x=\"20\" y=\"10\" width=\"440\" height=\"270\" rx=\"8\" fill=\"var(--sheet)\" stroke=\"var(--rule)\" stroke-width=\"2\"/><rect x=\"20\" y=\"10\" width=\"440\" height=\"24\" rx=\"8\" fill=\"#2f6db5\"/>\n  <text x=\"240\" y=\"27\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" style=\"fill:#fff\">Book1 — Excel<\/text>\n  <text x=\"34\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">File<\/text><text x=\"90\" y=\"50\" font-size=\"10.5\" font-weight=\"800\">Home<\/text><text x=\"146\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">Insert<\/text><text x=\"202\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">Design<\/text><text x=\"258\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">Layout<\/text><text x=\"314\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">Review<\/text><text x=\"370\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">View<\/text>\n  <rect x=\"24\" y=\"56\" width=\"432\" height=\"34\" fill=\"var(--sunk)\"/><rect x=\"32\" y=\"62\" width=\"60\" height=\"22\" rx=\"4\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><rect x=\"102\" y=\"62\" width=\"60\" height=\"22\" rx=\"4\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><rect x=\"172\" y=\"62\" width=\"60\" height=\"22\" rx=\"4\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><rect x=\"242\" y=\"62\" width=\"60\" height=\"22\" rx=\"4\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><rect x=\"312\" y=\"62\" width=\"60\" height=\"22\" rx=\"4\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><rect x=\"382\" y=\"62\" width=\"60\" height=\"22\" rx=\"4\" fill=\"var(--sheet)\" stroke=\"var(--rule

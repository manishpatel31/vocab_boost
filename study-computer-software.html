\"var(--ink2)\"/><text data-lq=\"Row numbers\" x=\"486\" y=\"156\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Row numbers (1, 2, 3…)<\/text><line x1=\"220\" y1=\"186\" x2=\"480\" y2=\"192\" stroke=\"var(--ink2)\"/><circle cx=\"220\" cy=\"186\" r=\"2.5\" fill=\"var(--ink2)\"/><text data-lq=\"Active cell C3\" x=\"486\" y=\"196\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Active cell C3<\/text><line x1=\"120\" y1=\"271\" x2=\"480\" y2=\"260\" stroke=\"var(--ink2)\"/><circle cx=\"120\" cy=\"271\" r=\"2.5\" fill=\"var(--ink2)\"/><text data-lq=\"Status bar\" x=\"486\" y=\"264\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Status bar<\/text><\/svg><\/figure>","cap":"A cell's address is its column letter then its row number (C3). A worksheet has 1,048,576 rows and 16,384 columns (A to XFD) since Excel 2007. Every formula starts with ="},{"k":"table","title":"Common functions","head":["Function","What it returns","Example"],"rows":[["SUM","Total","=SUM(A1:A10)"],["AVERAGE","Arithmetic mean","=AVERAGE(B2:B6)"],["COUNT","Number of cells containing numbers","=COUNT(A1:A10)"],["COUNTA","Number of non-empty cells (numbers, text, anything)","=COUNTA(A1:A10)"],["COUNTBLANK","Number of empty cells","=COUNTBLANK(A1:A10)"],["COUNTIF / SUMIF","Count / add cells meeting a condition","=COUNTIF(A1:A10,'&gt;50') — Excel itself uses double quotes"],["MAX / MIN","Largest / smallest value","=MAX(C1:C20)"],["IF","One value if a test is TRUE, another if FALSE","=IF(B2&gt;=33,'Pass','Fail')"],["AND / OR / NOT","Logical tests","=AND(A1&gt;0,B1&gt;0)"],["ROUND","Rounds to given digits","=ROUND(3.14159,2) gives 3.14"],["VLOOKUP","Looks for a value in the first column of a table, returns a value from a column to the right (vertical)","=VLOOKUP(101,A2:D50,3,FALSE)"],["HLOOKUP","Same, but searches the first row (horizontal)","=HLOOKUP(…)"],["XLOOKUP","Modern replacement for VLOOKUP/HLOOKUP (Excel 2021 / 365)","=XLOOKUP(…)"],["CONCAT / CONCATENATE","Joins text (CONCAT from Excel 2016 / 365)","=CONCATENATE(A1,B1)"],["LEN","Number of characters","=LEN('Excel') gives 5"],["UPPER / LOWER / PROPER / TRIM","Change case / remove extra spaces","=PROPER('ram kumar') gives Ram Kumar"],["TODAY","Current date only","=TODAY()"],["NOW","Current date and time","=NOW()"],["ABS / SQRT / MOD / POWER","Absolute value / square root / remainder / power","=MOD(17,5) gives 2"],["COUNTBLANK / COUNTIF","Counts empty cells / cells meeting a condition","—"],["LEFT / RIGHT / MID","Parts of text (text functions)","There is no COMBINE function"],["EXACT","Checks if two texts are identical (TRUE/FALSE)","—"],["CLEAN","Removes non-printable characters","—"],["CODE / CHAR","Character code / character from code (text functions); DB is a financial function","—"],["AND / OR / NOT / IF","Logical functions; IF returns one of 2 outputs; AND returns TRUE only if all conditions are true","—"],["FACT","Factorial","=FACT(5) = 120; FACT(0) = 1"],["FLOOR / CEILING","Round down / up to the nearest multiple","=FLOOR(134,19) = 133; =CEILING.MATH(155,10) = 160"],["EVEN / ODD","Round up to the nearest even / odd number","=EVEN(3)+ODD(8) = 4 + 9 = 13"],["SUMSQ","Sum of squares","=SUMSQ(1,2,3,4) = 30"],["ABS","Absolute value","—"],["MATCH","Position of a value in a list (match type 1 = largest value &lt;= lookup)","=MATCH(12,{10,13,30,40,60},1) = 1"],["LOOKUP / VLOOKUP","Return a value from a row/column range or table","—"],["INDIRECT","Changes a cell reference within a formula without changing the formula","—"],["NOW / TODAY","Current date-time / date","—"],["There is no SUBTRACT function","Use the minus sign instead","—"]]},{"k":"table","title":"Error values","head":["Error","Cause"],"rows":[["#DIV/0!","Dividing by zero or by an empty cell"],["#N/A","Value not available — e.g. VLOOKUP cannot find the item"],["#NAME?","Excel does not recognise text in the formula — misspelt function or range name"],["#REF!","Invalid cell reference — the referred cell was deleted"],["#VALUE!","Wrong type of argument — e.g. adding text to a number"],["#NUM!","Invalid number — e.g. =SQRT(-1)"],["#NULL!","Intersection of two ranges that do not meet"],["#SPILL!","Dynamic-array result blocked by data (Excel 365)"],["#### ","Column too narrow to show the number or date (or a negative date/time)"]]},{"k":"table","title":"Excel tabs and groups","head":["Tab","Groups and tools"],"rows":[["File","Info; New (Ctrl + N, new workbook); Open (Ctrl + O / Ctrl + F12); Save (Ctrl + S); Save As (F12; also used to save a new file the first time); Print (Ctrl + P / Ctrl + Shift + F12); Print Preview (Ctrl + F2); Share (OneDrive); Export (to PDF); Publish (interactive visual report); Close (Ctrl + W)"],["Home","1 Clipboard: Paste Special (Ctrl + Alt + V), Format Painter (no shortcut; double-click to use many times). 2 Font: default font Aptos (Microsoft 365); size 1 to 409 (list 8 to 72); Bold Ctrl + B or Ctrl + 2, Italic Ctrl + I or Ctrl + 3, Underline Ctrl + U or Ctrl + 4, Strikethrough Ctrl + 5; Fill colour, Text colour; Borders (print as lines); Excel's Font group has NO subscript, superscript or line spacing buttons. 3 Alignment: 6 alignments/9 positions, Wrap Text, Orientation (rotate text diagonally/vertically, clockwise/anticlockwise), Merge and Center (also in Format Cells &gt; Alignment tab). 4 Number: General (default, no specific format), Number (600.00), Currency (₹600.00), Accounting (₹ aligned), Percentage (60000%), Short Date (01/01/1900), Long Date, Fraction, Scientific; decimal places 0 to 30, default 2. 5 Styles: Conditional Formatting (Highlight Cells Rules: greater than, less than, between, equal to, duplicate values, date occurring, text that contains; Top/Bottom Rules; Data Bars; Color Scales; Icon Sets; New Rule), Format as Table, Cell Styles. 6 Cells: Insert (cells Ctrl + Shift + +, column, row, sheet Shift + F11), Delete (cell Ctrl + -, column, row, sheet), Format (column width, row height, hide/unhide; hide column Ctrl + 0, hide row Ctrl + 9). 7 Editing: AutoSum Σ (Alt + =) and other auto formulas, Sort and Filter, Find and Select (Find Ctrl + F, Go To Ctrl + G or F5, Replace Ctrl + H). 8 Analysis: Analyze Data (charts and tables)"],["Insert","Tables: Table, PivotTable (view complex data easily; quick summaries and contingency tables); Illustrations: Pictures, Icons (former ClipArt), 3D Models, Shapes, SmartArt, Screenshot; Charts: chart sheet (chart as its own sheet) or embedded chart (on the worksheet); F11 = instant column chart sheet; 3D Map; Sparklines (tiny chart inside one cell); Filter; Links (Hyperlink Ctrl + K); Comments (additional note; purple corner); Text: Text Box, Header and Footer (needs Page Layout view), WordArt; Symbols: Symbol, Equation"],["Page Layout","Themes (font, size, colour, effects); Page Setup: Margins (Normal default: top/bottom 0.75\", left/right 0.7\", header/footer 0.3\"; Wide; Narrow; Custom), Orientation (portrait/landscape), Size (default Letter; Tabloid, Statement, Legal, Executive, A3, A4, A5, B4, B5), Print Area (lock a block of selected cells for printing), Background; Scale to Fit (width, height); Sheet Options (Gridlines and Headings: view/print). 1 inch = 2.54 cm"],["Formulas","Function Library: Insert Function, Logical, Text, Financial, Date and Time, etc.; Shift + F3 opens the Insert Function window"],["Data","Get and Transform Data (from file: workbook, text, JSON, PDF, XML; from database: SQL Server, MS-Access, Analysis Services; from cloud: Azure); Sort and Filter; Data Validation (rules for what can be entered); Forecast: What-If Analysis (Goal Seek = reach a target value; Scenario Manager = several uncertain conditions; Data Table)"],["Review","Proofing: Spelling (F7), Thesaurus (Shift + F7), Workbook Statistics (Ctrl + Shift + G); Accessibility (errors and warnings; on status bar); Insights: Smart Lookup (online search); Language: add language, Translate (English &lt;→ Hindi); Comment (New Comment, Shift + F2; purple marker); Notes (New Note, big additional note; red marker); Protect: workbook/worksheet password protection"],["View","Workbook Views: Normal (default), Page Layout, Page Break Preview, Custom Views; Show: Ruler, Gridlines (on), Headings (on), Formula Bar (on), Navigation; Zoom 10% to 400% (default 100%); Window: New Window (same file again), Split (one file in 4 parts), Arrange All (vertical, horizontal, cascade, tiled), Freeze Panes (Freeze Panes, Freeze First Column, Freeze Top Row: keep headings visible while scrolling), Hide/Unhide workbook, Switch Windows; Macros: recording tool, View Macros (Alt + F8)"],["Help","Help (F1), Feedback, Contact Support (robotic chat), Show Training (video tutorials), What's New; Community: Excel blog, Excel community (online)"],["Power Pivot","Pivot tables for complex data with advanced tools"]]},{"k":"table","title":"Excel tools","head":["Tool","Where / what"],"rows":[["Charts","Insert tab: Column, Bar, Line, Pie, Area, Scatter (XY) …; pie shows parts of one whole"],["Sort","Data tab: A→Z, Z→A, or custom sort on several columns"],["Filter","Data tab (Ctrl+Shift+L): show only rows that meet a condition"],["Freeze Panes","View tab: keeps header rows/columns visible while scrolling"],["Conditional Formatting","Home tab: colours cells automatically by rule (e.g. marks below 33 in red)"],["Data Validation","Data tab: restricts what can be typed in a cell (e.g. a drop-down list)"],["PivotTable","Insert tab: summarises large data quickly"],["Merge &amp; Center","Home tab: joins cells and centres the text"],["Wrap Text","Home tab: shows long text on several lines in one cell"],["AutoFill / Flash Fill","Drag fill handle to continue series (Jan, Feb…); Flash Fill (Ctrl+E) fills a pattern"],["Goal Seek / What-If Analysis","Data tab: find the input needed for a desired result"],["Macro","Recorded set of steps (View or Developer tab); saved in .xlsm"]]},{"k":"table","title":"Excel shortcuts","head":["Keys","Action in Excel"],"rows":[["Ctrl+N","New workbook"],["Ctrl+W","Close workbook"],["F2","Edit the active cell"],["F4","Toggle absolute/relative reference (while editing); otherwise repeat last action"],["Ctrl+;","Insert today's date"],["Ctrl+Shift+;","Insert current time"],["Alt+=","AutoSum"],["Ctrl+Shift+L","Turn filter on/off"],["Shift+F11 (or Alt+Shift+F1)","Insert a new worksheet"],["Ctrl+Page Down / Ctrl+Page Up","Next / previous worksheet"],["Ctrl+1","Format Cells dialog box"],["F11 / Alt+F1","Chart on a new chart sheet / embedded chart on the same sheet"],["Ctrl+D / Ctrl+R","Fill down / fill right"],["Ctrl+Enter","Fill all selected cells with the same entry"],["Alt+Enter","New line inside the same cell"],["Ctrl+Space / Shift+Space","Select the whole column / the whole row"],["Ctrl+Home","Go to cell A1"],["Ctrl+Arrow key","Jump to the edge of the data"],["Ctrl+T (or Ctrl+L)","Create a table"],["Ctrl+K","Insert hyperlink"],["Shift+F3","Insert Function dialog"],["F9","Recalculate all formulas"],["Ctrl+9 / Ctrl+0","Hide rows / hide columns"],["Ctrl+Shift+$ / Ctrl+Shift+%","Currency format / percentage format"],["Ctrl+5","Strikethrough"],["F7","Spelling"],["F5 / Ctrl + G","Go to a specific cell (e.g. C6)"],["F11","Create a chart (on a new chart sheet)"],["Shift + F2","Insert / edit comment"],["Shift + F10","Shortcut (context) menu for the selected item"],["Ctrl + 0 / Ctrl + 9","Hide column / hide row"],["Ctrl + D","Fill down: copy the top cell of a range into the cells below"],["Alt + I + R","Insert a row above (old menu key sequence)"],["Alt + H + O + W","Set column width (ribbon key tip sequence)"],["Ctrl + Shift + ! / $ / # / % / ^ / @","Number format: comma / currency / date / percentage / scientific / time"],["Ctrl + Page Up / Page Down","Move between worksheets"],["Ctrl + Tab or Ctrl + F6","Switch between open workbooks"],["Ctrl + F9 / Ctrl + F10","Minimise / maximise the workbook window"],["Ctrl + Shift + U","Expand/collapse the formula bar"],["Ctrl + Shift + G","Workbook statistics"],["Esc","Cancel editing a cell"],["Ctrl + click (sheet tabs)","Select several sheets (e.g. to print them together)"]]},{"k":"table","title":"Chart types","head":["Chart","Best use"],"rows":[["Column / Bar","Compare values across categories"],["Line","Show change over time (use \"line without markers\" when there are many categories or approximate values)"],["Pie","Parts of a whole; each slice is a sector of a circle"],["Doughnut","Like pie, with a hole; can show more than one series"],["Scatter (XY)","Uses Cartesian X-Y coordinates; relation between two variables"],["Area","Volume of change over time"],["Radar","Shows values relative to a centre point"],["Stacked","Shows parts of totals in the same order on each bar"],["Stock","Share price high-low-close"],["Sparkline","Tiny chart inside one cell"],["Embedded chart","Chart placed on the worksheet (not on a separate chart sheet)"]]},{"k":"info","title":"Excel's chart types at a glance","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 255\" role=\"img\" aria-label=\"Excel chart types\">\n  <rect x=\"10\" y=\"55\" width=\"150\" height=\"88\" rx=\"10\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><rect x=\"48\" y=\"99\" width=\"12\" height=\"12\" fill=\"#2f6db5\"/><rect x=\"66\" y=\"85\" width=\"12\" height=\"26\" fill=\"#2f6db5\"/><rect x=\"84\" y=\"93\" width=\"12\" height=\"18\" fill=\"#2f6db5\"/><rect x=\"102\" y=\"77\" width=\"12\" height=\"34\" fill=\"#2f6db5\"/><text data-lq=\"Column\" x=\"85\" y=\"135\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Column<\/text><rect x=\"178\" y=\"55\" width=\"150\" height=\"88\" rx=\"10\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><rect x=\"216\" y=\"67\" width=\"54\" height=\"11\" fill=\"#2f8f4e\"/><rect x=\"216\" y=\"83\" width=\"36\" height=\"11\" fill=\"#2f8f4e\"/><rect x=\"216\" y=\"99\" width=\"46\" height=\"11\" fill=\"#2f8f4e\"/><text data-lq=\"Bar\" x=\"253\" y=\"135\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Bar<\/text><rect x=\"346\" y=\"55\" width=\"150\" height=\"88\" rx=\"10\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><polyline points=\"384,105 402,91 420,97 438,75 456,81\" fill=\"none\" stroke=\"#c0503a\" stroke-width=\"3\"/><text data-lq=\"Line\" x=\"421\" y=\"135\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Line<\/text><rect x=\"514\" y=\"55\" width=\"150\" height=\"88\" rx=\"10\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><circle cx=\"588\" cy=\"89\" r=\"24\" fill=\"#c69214\"/><path d=\"M588 89 L588 65 A24 24 0 0 1 611 96 Z\" fill=\"#2f6db5\"/><path d=\"M588 89 L611 96 A24 24 0 0 1 574 109 Z\" fill=\"#2f8f4e\"/><text data-lq=\"Pie\" x=\"589\" y=\"135\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Pie<\/text><rect x=\"10\" y=\"155\" width=\"150\" height=\"88\" rx=\"10\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><circle cx=\"84\" cy=\"189\" r=\"22\" fill=\"none\" stroke=\"#7a4fb0\" stroke-width=\"10\"/><path d=\"M84 167 A22 22 0 0 1 106 189\" fill=\"none\" stroke=\"#c69214\" stroke-width=\"10\"/><text data-lq=\"Doughnut\" x=\"85\" y=\"235\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Doughnut<\/text><rect x=\"178\" y=\"155\" width=\"150\" height=\"88\" rx=\"10\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><circle cx=\"220\" cy=\"201\" r=\"3.5\" fill=\"#2f6db5\"/><circle cx=\"230\" cy=\"195\" r=\"3.5\" fill=\"#2f6db5\"/><circle cx=\"238\" cy=\"197\" r=\"3.5\" fill=\"#2f6db5\"/><circle cx=\"250\" cy=\"185\" r=\"3.5\" fill=\"#2f6db5\"/><circle cx=\"260\" cy=\"183\" r=\"3.5\" fill=\"#2f6db5\"/><circle cx=\"272\" cy=\"175\" r=\"3.5\" fill=\"#2f6db5\"/><circle cx=\"282\" cy=\"171\" r=\"3.5\" fill=\"#2f6db5\"/><text data-lq=\"Scatter (XY)\" x=\"253\" y=\"235\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Scatter (XY)<\/text><rect x=\"346\" y=\"155\" width=\"150\" height=\"88\" rx=\"10\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><path d=\"M384 211 L384 197 L404 187 L424 193 L444 173 L458 179 L458 211 Z\" fill=\"#2f8f4e\" opacity=\".7\"/><text data-lq=\"Area\" x=\"421\" y=\"235\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Area<\/text><rect x=\"514\" y=\"155\" width=\"150\" height=\"88\" rx=\"10\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><polygon points=\"588,165 608.8,177 608.8,201 588,213 567.2,201 567.2,177\" fill=\"none\" stroke=\"var(--rule)\"/><polygon points=\"588,171 607.1,178 596.7,194 588,209 575.9,196 568.1,177.5\" fill=\"#c0503a\" opacity=\".55\"/><text data-lq=\"Radar\" x=\"589\" y=\"235\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Radar<\/text><\/svg><\/figure>","cap":"Column and bar compare categories; line and area show change over time; pie and doughnut show parts of a whole; scatter shows how two variables relate; radar compares several values around a centre."},{"k":"p","h":"<b>Counting cells in a range.<\/b> number of columns x number of rows. A1:D4 → A to D = 4 columns, rows 1 to 4 = 4 rows → 16 cells. A10:D40 → 4 columns x (40 - 10 + 1) = 4 x 31 = 124 cells. C4:H10 → C to H = 6 columns, 4 to 10 = 7 rows → 42 cells. Always add 1 after subtracting row numbers. A1 then Shift + click C9 selects A1:C9 = 3 x 9 = 27 cells."},{"k":"p","h":"<b>Copying a formula (relative reference).<\/b> count how far you moved. From A5 to E9 = 4 columns right and 4 rows down. Every relative reference moves the same way: =A3+B4 becomes =E7+F8. A $ before the letter stops the column from moving; a $ before the number stops the row from moving."},{"k":"p","h":"<b>Solving formula output (operator order).<\/b> =120*5/10<sup>2<\/sup> → first exponent 10<sup>2<\/sup> = 100; then left to right 120*5 = 600, 600/100 = 6. =8/8<sup>2<\/sup>*16 → 8<sup>2<\/sup> = 64; 8/64 = 0.125; 0.125*16 = 2. =SUM(2<sup>3<\/sup>, 1-2/2) → 8 and (1 - 1) = 0 → 8."},{"k":"p","h":"<b>FLOOR and CEILING.<\/b> FLOOR(number, significance) rounds DOWN to the nearest multiple: FLOOR(176,21): 21 x 8 = 168 &lt;= 176 &lt; 189, so 168. CEILING rounds UP: CEILING.MATH(155,10) = 160."},{"k":"trick","h":"<span class='mn'>R<\/span>ows = <span class='mn'>R<\/span>eal numbers, <span class='mn'>C<\/span>olumns = <span class='mn'>C<\/span>haracters (letters). The dollar sign is a <span class='mn'>lock<\/span>: $ before the letter locks the column, $ before the number locks the row. <span class='mn'>V<\/span>LOOKUP = <span class='mn'>V<\/span>ertical (searches down), <span class='mn'>H<\/span>LOOKUP = <span class='mn'>H<\/span>orizontal (searches across).<ul><li>Rows and columns since 2007: \"10 lakh 48 thousand 576 rows, 16 thousand 384 columns, last column XFD\". Till 2003: \"65,536 rows, 256 columns, last column IV\".<\/li><li>Column width 8.43 default, max 255; row height 15 default, max 409 points (\"Excel font size also max 409\").<\/li><li>References: \"$ = lock\". $A$1 locks both, A$1 locks the row, $A1 locks the column; F4 cycles them.<\/li><li>Operator order \"PEDMAS\": Parentheses, Exponent, Division/Multiplication, Addition/Subtraction, each left to right.<\/li><li>COUNT counts numbers; COUNTA counts \"All\" non-empty cells.<\/li><li>Charts: Pie = Part of whole; Line = Over time; Scatter = X-Y; Radar = from the centre.<\/li><li>F11 = instant chart; Shift + F11 = new sheet; Alt + = = AutoSum; Ctrl + D = fill Down.<\/li><li>Goal Seek = one target; Scenario = several \"what if\" cases.<\/li><\/ul>"},{"k":"trap","h":"<b>COUNT<\/b> counts only numbers; <b>COUNTA<\/b> counts every non-empty cell. <b>TODAY()<\/b> gives the date only; <b>NOW()<\/b> gives date and time. <b>####<\/b> is not an error in the formula — the column is just too narrow. <b>#NAME?<\/b> = misspelt function; <b>#REF!<\/b> = deleted reference; <b>#N/A<\/b> = lookup value not found. <b>Ctrl+D<\/b> in Excel fills down (Font dialog in Word, bookmark in browser). <b>Ctrl+;<\/b> = date, <b>Ctrl+Shift+;<\/b> = time. <b>F11<\/b> makes a chart sheet, <b>Shift+F11<\/b> adds a worksheet. A <b>workbook<\/b> is the file; a <b>worksheet<\/b> is one page in it.<ul><li>COMBINE is not a text function; MID, LEFT and RIGHT are.<\/li><li>COUNTA counts non-empty cells; COUNT counts only numbers.<\/li><li>A function is a pre-written formula.<\/li><li>FLOOR(134,19) = 133 and FLOOR(176,21) = 168; FLOOR(14,4) = 12.<\/li><li>A pie chart divides a circle into sectors.<\/li><li>A worksheet CAN be renamed, so \"cannot be renamed\" is the false statement.<\/li><li>=SUM adds; there is no =ADD or =SUBTRACT function.<\/li><li>Excel is a spreadsheet, not a graphic program.<\/li><li>EXACT checks identical text.<\/li><li>Information = processed data; data = raw facts.<\/li><li>Copying =A3+B4 from A5 to E9 gives =E7+F8.<\/li><li>Several uncertain \"what-if\" conditions = Scenario Manager, not Goal Seek.<\/li><li>Number format decimal places go up to 30 (default 2).<\/li><li>Freeze First Column is the option to freeze the first column; there is no \"Freeze Top Column\".<\/li><li>F4:P10 has 11 x 7 = 77 cells.<\/li><li>Default cell reference is RELATIVE.<\/li><li>Ctrl + 1 in Excel opens Format Cells; Ctrl + D is fill down (not Font dialog as in Word).<\/li><\/ul>"}],"sum":["A workbook (.xlsx) contains worksheets; each cell is addressed by column letter and row number, e.g. B3.","Modern Excel has 1,048,576 rows and 16,384 columns; the last column is XFD.","Formulas start with =; A1 is relative, $A$1 absolute, $A1 or A$1 mixed; F4 cycles them.","COUNT counts numbers, COUNTA non-empty cells; VLOOKUP vertical, HLOOKUP horizontal; TODAY date, NOW date and time.","Errors: #DIV/0! divide by zero, #N/A not found, #NAME? bad name, #REF! bad reference, #### narrow column.","1,048,576 rows and 16,384 columns (XFD) since 2007; 65,536 rows and 256 columns (IV) till 2003.","Formulas start with \"=\"; order: parentheses/exponent, then divide/multiply, then add/subtract, left to right.","References: relative (default, both change), absolute $A$1 (F4), mixed A$1 or $A1.","Functions: SUM, AVERAGE, MAX, MIN, COUNT, COUNTA, LEN, IF, AND, EXACT, CLEAN, FLOOR, CEILING, MATCH, LOOKUP.","Tabs: Home (font, alignment, number, styles, cells, editing), Insert (pivot, charts, sparklines), Page Layout, Formulas, Data (sort, filter, what-if), Review, View (freeze panes).","Shortcuts: F2 edit, F4 absolute, F11 chart, Shift + F11 new sheet, Alt + = AutoSum, Ctrl + D fill down, Ctrl + 1 format cells."],"part":["Part 2 · Software, Windows & MS Office","सॉफ़्टवेयर, विंडोज़ एवं एमएस ऑफ़िस"]},
{"id":"C11","g":"cmp","heat":2,"title":"MS PowerPoint & other Office apps","hi":"एमएस पावरपॉइंट एवं अन्य ऑफिस ऐप्स","blocks":[{"k":"hot","h":"Usually 1–2 questions: <b>F5 vs Shift+F5<\/b>, <b>Ctrl+M<\/b> new slide, <b>transition vs animation<\/b>, Slide Sorter and Slide Master, the number of layouts, or <b>.pptx<\/b>.<br><br>PowerPoint gives 1 or 2 questions in SSC Tier-II computer modules and CHSL Tier-I: \"F5 / Shift + F5\", \"Esc ends a slide show\", \"Ctrl + M new slide\", \"transition vs animation\", \"slide master\", \"which view shows only text\", \"slide sorter\", \"9 layouts\", \"placeholders\". SSC CGL Tier-II 2024 asked how to exit a slide show; CHSL 2024 asked moving between slides with the keyboard."},{"k":"story","h":"<p>PowerPoint is a set of <b>digital flash cards<\/b> for a talk. Each card is a <b>slide<\/b>; the whole pack is a <b>presentation<\/b> saved as a .pptx file. A <b>layout<\/b> decides where the title and text boxes sit on one slide; a <b>theme<\/b> gives every slide the same colours and fonts; and the <b>Slide Master<\/b> is the master card — change it once and every slide changes.<\/p><p>Movement comes in two kinds. A <b>transition<\/b> is the effect as you move from one slide to the next, like turning a page. An <b>animation<\/b> moves something <i>inside<\/i> a slide — a bullet flying in, a picture fading out. Press <b>F5<\/b> to start the show from the first slide, or <b>Shift+F5<\/b> to start from the slide you are on.<\/p><p><b>MS Access<\/b> is a different tool: a <b>database<\/b>, like a well-kept office register. Data sits in <b>tables<\/b>; a <b>query<\/b> asks a question, a <b>form<\/b> is a neat screen for typing data in, and a <b>report<\/b> prints the results. Every record is identified by a unique <b>primary key<\/b>, like a roll number.<\/p>","key":"Transition is between slides, animation is within a slide; Access stores data in tables identified by a primary key."},{"k":"facts","title":"PowerPoint basics","rows":[["Type of software","Presentation software by Microsoft"],["File extensions","<b>.pptx<\/b> (2007 onwards); .ppt older; .ppsx opens directly as a show; .potx template; .pptm macro-enabled"],["Slide","One page of a presentation"],["Layout","Arrangement of placeholders on a slide (Title Slide, Title and Content, Two Content, Blank …)"],["Placeholder","Dotted box that holds title, text, picture or chart"],["Theme / Design","Matching colours, fonts and background for all slides (Design tab)"],["Slide Master","Controls the design and layout of every slide (View → Slide Master)"],["Transition","Effect while moving from one slide to the next (Transitions tab)"],["Animation","Effect on text or objects within a slide: Entrance, Emphasis, Exit, Motion Paths (Animations tab)"],["Speaker notes","Notes for the presenter, typed under the slide; not shown to the audience"],["Presenter View","Presenter sees notes and next slide while the audience sees only the slide"],["Rehearse Timings","Records how long each slide is shown"],["Hide Slide","Slide stays in the file but is skipped during the show"],["Default slide size","Widescreen 16:9 (PowerPoint 2013 onwards); 4:3 earlier"],["MS-PowerPoint","Presentation program (part of MS-Office / Microsoft 365)."],["File","Presentation file; default name Presentation1; extension .ppt (till 2003), .pptx (2007 onwards); .pot = design template; .pps = slide show; .pptm = macro-enabled."],["File name length","Up to 225 characters manually."],["Slide layouts","9: Title Slide, Title and Content, Title Only, Two Content, Section Header, Blank, Content with Caption, Picture with Caption, Comparison."],["Default layout","Title Slide (introduces the topic and sets the tone)."],["New presentation","Ctrl + N. New slide in an existing file; Ctrl + M (its layout is Title and Content)."],["Slide show","From beginning F5; from current slide Shift + F5; end slide show Esc."],["Slide objects","Text box (= placeholder), shapes, images, audio, video."],["Placeholders","The dotted boxes on a slide that hold text or content."],["Special (motion) effects","Transition = applied to the WHOLE slide; Animation = applied to OBJECTS on a slide."],["Template","File with ready-made designs and styles (layout and formatting) for a presentation."],["Maximum slides","No fixed maximum limit."],["Default orientation","Slides: landscape; notes pages, outlines and handouts: portrait."],["Slide size","Standard 4:3 or Widescreen 16:9 (default)."]]},{"k":"table","title":"PowerPoint views","head":["View","Use"],"rows":[["Normal","Default editing view: slide pane, thumbnails on the left, notes below"],["Outline View","Edit the text of all slides as an outline"],["Slide Sorter","All slides as thumbnails — rearrange, delete, copy, set transitions"],["Notes Page","Slide with its speaker notes, as it would print"],["Reading View","Plays the show inside the PowerPoint window"],["Slide Show","Full-screen presentation for the audience"],["Master views","Slide Master, Handout Master, Notes Master"]]},{"k":"table","title":"PowerPoint tabs","head":["Tab","Groups and tools"],"rows":[["File","Info; New (Ctrl + N); Open (Ctrl + O / Ctrl + F12); Save (Ctrl + S); Save As (F12); Print (Ctrl + P / Ctrl + Shift + F12); Print Preview (Ctrl + F2); Export (to PDF); Close (Ctrl + W)"],["Home","Clipboard (Paste Special Ctrl + Alt + V; Format Painter, no shortcut); Slides (New Slide with 9 layouts; Layout option); Font (default Aptos; size 1 to 4000; list 8 to 96; bold, italic, underline; change font Ctrl + Shift + F); Paragraph (bullets; alignments left, right, centre, justify; line spacing); Drawing (shapes, shape fill, shape outline, arrange, quick styles); Editing (Find Ctrl + F, Replace Ctrl + H); Dictate (voice typing); Designer (slide design ideas)"],["Insert","Slides (new slide, duplicate slide); Table (Draw Table 10 x 8 grid; Insert Table max 75 columns and 75 rows); Images (picture, photo album, screenshot/screen clipping); Illustrations (shapes, SmartArt for hierarchy diagrams and flowcharts, chart, icons/animated images, 3D models; duplicate shape Ctrl + D); Get Add-ins; Link (hyperlink Ctrl + K: to another slide, presentation, email, web page or file); Comment (additional note); Text (text box, header and footer, WordArt, date and time, slide number); Symbols (equations, symbols); Media (audio, video, screen recording); Camera (Cameo: like a live camera)"],["Header and footer","Slide: date and time, footer, slide number; Notes and Handouts: date and time, header, footer, page number"],["Draw","Handwriting tools"],["Design","Themes (different themes: colour, font, font size, font effect); Variants (change colour, font, effects, background style of a theme); Customize (Slide Size, Format Background: picture, gradient, texture or solid fill); Designer (slide design ideas)"],["Transitions","Preview; Transition to This Slide (None, Morph, Fade, Glitter, Honeycomb etc.); Timing (Sound, Duration, Advance slide on mouse click / trigger)"],["Animations","Preview; Animation (effects on objects: e.g. Appear, Fly In, Bounce); Advanced Animation (Trigger: an item that starts an action when clicked; Animation Pane); Timing (Duration, Delay, Reorder animation)"],["Slide Show","Start Slide Show (From Beginning F5, From Current Slide Shift + F5, Custom Slide Show = present chosen slides in a new order); Rehearse with Coach (automatic tips); Set Up (Set Up Slide Show, Hide Slide, Rehearse Timings, Record); Monitors (choose display)"],["Record","Preview; Cameo; Record from beginning / current slide"],["Review","Proofing (Spelling F7, Thesaurus Shift + F7); Accessibility; Language (Translate, add language); Comments; Compare (compare two versions, combine two files); Ink (hide/unhide handwriting)"],["View","Presentation Views: Normal (default; slide thumbnails on the left), Outline View (only text: titles and bullets), Slide Sorter (all slides as thumbnails; rearrange by dragging), Notes Page (slide at the top, speaker notes below; shows how it prints with notes), Reading View (full screen); Master Views: Slide Master (same design on all slides: fonts, background, logo), Handout Master (layout of printed handouts), Notes Master; Show: Ruler, Gridlines (Shift + F9), Guides; Zoom 10% to 400%; Color/Grayscale/Black and White; Window (New Window, Switch Windows); Macros (View Macros Alt + F8)"],["Help","Help (F1), Contact Support, Feedback, Show Training, What's New"]]},{"k":"table","title":"PowerPoint shortcuts","head":["Keys","Action"],"rows":[["F5","Start slide show from the first slide"],["Shift+F5","Start slide show from the current slide"],["Ctrl+M","Insert a new slide"],["Ctrl+D","Duplicate the selected slide or object"],["Ctrl+N","New presentation"],["Ctrl+K","Insert hyperlink"],["Esc","End the slide show"],["N, Enter, Space, Right arrow","Next slide / animation during a show"],["P, Backspace, Left arrow","Previous slide during a show"],["Slide number + Enter","Jump to that slide during a show"],["B / W","Black screen / white screen during a show (press again to return)"],["Ctrl + N / Ctrl + O / Ctrl + S","New / open / save presentation"],["F12 or Alt + F2","Save As"],["Ctrl + W or Ctrl + F4","Close presentation"],["Ctrl + Q","Save and close"],["Ctrl + Z / Ctrl + Y","Undo / redo"],["Ctrl + F2","Print Preview"],["F1","Help"],["Alt + Q","\"Tell me what you want to do\" box"],["F7","Spell check"],["Alt or F10","Key tips on/off"],["Ctrl + F1","Show/hide the ribbon"],["Ctrl + F","Find (and replace); Ctrl + H = Replace"],["Alt + F / H / N / G / K / A / S / R / W / X / Y","File / Home / Insert / Design / Transitions / Animations / Slide Show / Review / View / Add-ins / Help tab"],["Ctrl + Tab","Switch between open presentations"],["Ctrl + A","Select all (text in a box, objects on a slide, or all slides; in Outline view selects all text of all slides)"],["Tab","Move to the next object on a slide"],["Home / End","First slide / last slide (inside a text box: start/end of line); Ctrl + End = end of a text box"],["Page Down / Page Up","Next / previous slide"],["Ctrl + Up/Down arrow","Move a slide up/down (in text: previous/next paragraph)"],["Ctrl + Shift + Up/Down arrow","Move a slide to the beginning/end"],["Ctrl + Enter","Move to the next title or body text placeholder"],["Ctrl + X / C / V","Cut / copy / paste text, objects or slides (paste also Shift + Insert; copy also Ctrl + Insert)"],["Ctrl + Alt + V","Paste Special"],["Ctrl + B / I / U","Bold / italic / underline"],["Ctrl + E / J / L / R","Centre / justify / left / right align a paragraph"],["Ctrl + T","Font dialog box (in PowerPoint)"],["Alt + W, Q","Zoom dialog box"],["Alt + N, P","Insert picture"],["Alt + H, S, H","Insert shape"],["Alt + H, L","Select slide layout"],["Ctrl + P (during show)","Annotate with the pen tool"],["N or Page Down / P or Page Up","Next / previous slide during a show (arrow keys also work)"],["B","Black screen during a show (press B again to return)"]]},{"k":"table","title":"Other Office apps and equivalents","head":["Microsoft app","Purpose","Google / LibreOffice equivalent"],"rows":[["Word","Word processor","Google Docs / LibreOffice Writer"],["Excel","Spreadsheet","Google Sheets / LibreOffice Calc"],["PowerPoint","Presentation","Google Slides / LibreOffice Impress"],["Access","Database","LibreOffice Base"],["Outlook","Email client plus calendar, contacts and tasks (personal information manager)","Gmail and Google Calendar (web)"],["OneNote","Digital notebook for free-form notes","Google Keep (simple notes)"],["Publisher","Desktop publishing: brochures, newsletters, cards","LibreOffice Draw"],["Teams","Chat, meetings and collaboration","Google Meet / Chat"]]},{"k":"p","h":"<b>Transition vs animation with an example.<\/b> you have 3 slides. Making slide 2 \"fade\" in after slide 1 is a TRANSITION (Transitions tab), and it affects the whole slide. Making the picture on slide 2 \"fly in\" from the left after a click is an ANIMATION (Animations tab), and it affects only that object. Transitions have Sound, Duration and \"advance on mouse click\"; animations have Duration, Delay, Reorder and Triggers."},{"k":"p","h":"<b>Why use the Slide Master.<\/b> if you want the same font, colour, logo or background image on all 40 slides, changing each slide is slow and error-prone. Editing the Slide Master (View &gt; Slide Master) changes the layout once and every slide based on it follows. Handout Master controls printed handouts; Notes Master controls notes pages."},{"k":"trick","h":"Transition = Traffic between slides; Animation = Action inside a slide. F5 = 'from the first', Shift+F5 = 'from where I Stand'.<ul><li>\"F5 = Full show from start; Shift + F5 = Show from here; Esc = Exit\".<\/li><li>\"Ctrl + M = More slides; Ctrl + D = Duplicate\".<\/li><li>Transition = Train moving between stations (slides); Animation = Actors moving on the stage (objects).<\/li><li>9 layouts, like 9 planets in old books: Title Slide, Title and Content, Section Header, Two Content, Comparison, Title Only, Blank, Content with Caption, Picture with Caption.<\/li><li>Views \"N-O-S-N-R\": Normal, Outline, Sorter, Notes Page, Reading. Masters \"S-H-N\": Slide, Handout, Notes (no Outline master).<\/li><li>Font size limits: Word 1638, Excel 409, PowerPoint 4000. Zoom limits: Word 500%, Excel and PowerPoint 400%.<\/li><li>Table limits: Word 63 columns x 32,767 rows; PowerPoint 75 x 75.<\/li><\/ul>"},{"k":"trap","h":"Transition vs animation: between slides vs within a slide. F5 starts from slide 1, Shift+F5 from the current slide. Slide Sorter shows thumbnails; Notes Page shows speaker notes. Ctrl+M is new slide in PowerPoint but indent in Word. Ctrl+D duplicates in PowerPoint. Outlook is e-mail, not a browser.<ul><li>Start slide show = F5 (not F3 or F1).<\/li><li>Insert hyperlink = Ctrl + K.<\/li><li>Change font = Ctrl + Shift + F.<\/li><li>Making layout changes for all slides = Slide MASTER, not Notes Master.<\/li><li>The view that shows how it prints with notes = Notes Page.<\/li><li>Ctrl + Enter moves to the next placeholder.<\/li><li>Handouts can be printed 1, 2, 3, 4, 6 or 9 per page, but NOT 5.<\/li><li>Default save format = .pptx; Format Painter copies formatting; slide sorter is in the View tab; F1 = Help; F5 = from first slide; Ctrl + D = duplicate; Notes Page = speaker notes; notes/handouts default to portrait.<\/li><li>\"Extreme animation\" is not a PowerPoint view; Presentation View and Outline Master are also not options.<\/li><li>Shift + F9 shows/hides the grid in PowerPoint.<\/li><\/ul>"}],"sum":["PowerPoint saves as .pptx; a slide's arrangement is its layout, and the Slide Master changes all slides at once.","Transition is the effect between slides; animation is the effect on objects within a slide.","F5 starts the show from the first slide, Shift+F5 from the current slide, Ctrl+M adds a new slide, Esc ends the show.","Views: Normal, Outline, Slide Sorter (thumbnails), Notes Page, Reading View, Slide Show.","Other Office apps: Outlook (e-mail), Access (database), OneNote (notes), Publisher (desktop publishing); Google and LibreOffice have free equivalents.","PowerPoint makes presentations: Presentation1, .ppt/.pptx, 9 slide layouts, default layout Title Slide.","Ctrl + M new slide, Ctrl + D duplicate, F5 start, Shift + F5 current slide, Esc end, B black screen.","Transition = whole slide; animation = objects; triggers start an animation on click.","Design tab = themes, variants, slide size (16:9 default), format background; Slide Show tab = rehearse, custom show, set up.","Limits: font size 1-4000, table 75 x 75, zoom 10-400%; no limit on number of slides."],"part":["Part 2 · Software, Windows & MS Office","सॉफ़्टवेयर, विंडोज़ एवं एमएस ऑफ़िस"]},
{"id":"C21","g":"cmp","heat":2,"title":"MS Access & databases (DBMS)","hi":"एमएस एक्सेस एवं डेटाबेस (डीबीएमएस)","blocks":[{"k":"hot","h":"<b>1–2 questions<\/b> in most CGL and CHSL papers: <b>primary vs foreign key<\/b>, <b>record = row, field = column<\/b>, the <b>objects of MS Access<\/b> (table, query, form, report), <b>DDL vs DML<\/b> commands in SQL, and the full forms <b>DBMS, RDBMS, SQL<\/b>."},{"k":"story","h":"<p>Think of a school office register. Each <b>page<\/b> is about one thing — students, fees or marks. That page is a <b>table<\/b>. Each <b>line<\/b> is one student: a <b>record<\/b> (row). Each <b>column heading<\/b> — Roll No, Name, Class — is a <b>field<\/b>.<\/p><p>Two students can share a name, but never a roll number. That unique column is the <b>primary key<\/b>. On the fees page, the clerk writes only the roll number to show whose fee it is; that roll number on another page is a <b>foreign key<\/b>, and it links the two pages.<\/p><p>A <b>DBMS<\/b> (Database Management System) is the clerk who keeps the register: it stores data once, lets many people use it, and stops wrong entries. <b>MS Access<\/b> is the DBMS inside MS Office. You ask it questions with a <b>query<\/b>, type data into a neat <b>form<\/b>, and print a <b>report<\/b>. The language for talking to big databases is <b>SQL<\/b>.<\/p>","key":"Table = page, record = row, field = column; the primary key is unique, a foreign key links tables; Access objects are tables, queries, forms and reports."},{"k":"facts","title":"Database basics","rows":[["Data / information","Raw facts / processed, meaningful data"],["Database","Organised collection of related data"],["DBMS","Database Management System: software to create, store, update and retrieve data (MS Access, Oracle, MySQL)"],["RDBMS","Relational DBMS: data in related tables; the relational model was given by E. F. Codd (IBM, 1970)"],["Table (relation)","Data in rows and columns"],["Record (row, tuple)","All the details of one item or person"],["Field (column, attribute)","One kind of detail, such as Name or Date of Birth"],["Domain","The set of allowed values of a field"],["Schema / instance","The design (structure) of the database / the data in it at one moment"],["Data redundancy","The same data stored again and again; a DBMS reduces it"],["Data integrity","Data stays correct and consistent"],["Metadata / data dictionary","Data about data: names, types and sizes of fields"],["DBA","Database Administrator: manages the database, its users and its security"]]},{"k":"table","title":"Keys","head":["Key","Meaning","Example"],"rows":[["Primary key","Uniquely identifies each record; cannot repeat and cannot be empty (NULL); one per table","Roll No, Aadhaar No"],["Candidate key","Any field (or set) that could serve as the primary key","Roll No, Email"],["Alternate key","A candidate key not chosen as the primary key","Email"],["Super key","Any set of fields that identifies a record uniquely","Roll No + Name"],["Composite key","A primary key made of two or more fields","Class + Roll No"],["Foreign key","A field that refers to the primary key of another table and links the two","Roll No in the Fees table"],["Unique key","Values must be different, but one NULL may be allowed","Mobile number"]]},{"k":"info","title":"How keys link tables","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 660 270\" role=\"img\" aria-label=\"A primary key in one table and a foreign key pointing to it from another\">\n  <defs><marker id=\"fk\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"var(--accent)\"/><\/marker><\/defs>\n  <text x=\"30\" y=\"30\" font-size=\"14\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Students table<\/text><rect x=\"30\" y=\"40\" width=\"84\" height=\"30\" fill=\"hsla(42,90%,50%,.5)\" stroke=\"var(--rule)\"/><text x=\"72\" y=\"60\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Roll No<\/text><rect x=\"30\" y=\"70\" width=\"84\" height=\"28\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><text x=\"72\" y=\"89\" text-anchor=\"middle\" font-size=\"11.5\">101<\/text><rect x=\"30\" y=\"98\" width=\"84\" height=\"28\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><text x=\"72\" y=\"117\" text-anchor=\"middle\" font-size=\"11.5\">102<\/text><rect x=\"116\" y=\"40\" width=\"84\" height=\"30\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><text x=\"158\" y=\"60\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Name<\/text><rect x=\"116\" y=\"70\" width=\"84\" height=\"28\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><text x=\"158\" y=\"89\" text-anchor=\"middle\" font-size=\"11.5\">Asha<\/text><rect x=\"116\" y=\"98\" width=\"84\" height=\"28\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><text x=\"158\" y=\"117\" text-anchor=\"middle\" font-size=\"11.5\">Ravi<\/text><rect x=\"202\" y=\"40\" width=\"84\" height=\"30\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><text x=\"244\" y=\"60\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Email<\/text><rect x=\"202\" y=\"70\" width=\"84\" height=\"28\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><text x=\"244\" y=\"89\" text-anchor=\"middle\" font-size=\"11.5\">asha@…<\/text><rect x=\"202\" y=\"98\" width=\"84\" height=\"28\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><text x=\"244\" y=\"117\" text-anchor=\"middle\" font-size=\"11.5\">ravi@…<\/text><text x=\"370\" y=\"30\" font-size=\"14\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Fees table<\/text><rect x=\"370\" y=\"40\" width=\"84\" height=\"30\" fill=\"hsla(42,90%,50%,.5)\" stroke=\"var(--rule)\"/><text x=\"412\" y=\"60\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Receipt No<\/text><rect x=\"370\" y=\"70\" width=\"84\" height=\"28\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><text x=\"412\" y=\"89\" text-anchor=\"middle\" font-size=\"11.5\">R-7<\/text><rect x=\"370\" y=\"98\" width=\"84\" height=\"28\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><text x=\"412\" y=\"117\" text-anchor=\"middle\" font-size=\"11.5\">R-8<\/text><rect x=\"456\" y=\"40\" width=\"84\" height=\"30\" fill=\"hsla(20,85%,55%,.4)\" stroke=\"var(--rule)\"/><text x=\"498\" y=\"60\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Roll No<\/text><rect x=\"456\" y=\"70\" width=\"84\" height=\"28\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><text x=\"498\" y=\"89\" text-anchor=\"middle\" font-size=\"11.5\">101<\/text><rect x=\"456\" y=\"98\" width=\"84\" height=\"28\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><text x=\"498\" y=\"117\" text-anchor=\"middle\" font-size=\"11.5\">102<\/text><rect x=\"542\" y=\"40\" width=\"84\" height=\"30\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><text x=\"584\" y=\"60\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Amount<\/text><rect x=\"542\" y=\"70\" width=\"84\" height=\"28\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><text x=\"584\" y=\"89\" text-anchor=\"middle\" font-size=\"11.5\">₹500<\/text><rect x=\"542\" y=\"98\" width=\"84\" height=\"28\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><text x=\"584\" y=\"117\" text-anchor=\"middle\" font-size=\"11.5\">₹500<\/text>\n  <path d=\"M498 128 C498 172, 72 176, 72 132\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2.5\" marker-end=\"url(#fk)\"/>\n  <text data-lq=\"Primary key\" x=\"72\" y=\"188\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#a87814\">Primary key<\/text><text data-lq=\"Foreign key\" x=\"498\" y=\"188\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--accent)\">Foreign key<\/text><text data-lq=\"Alternate key\" x=\"244\" y=\"145\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink2)\">Alternate key<\/text>\n  <text x=\"412\" y=\"146\" font-size=\"10.5\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#a87814\">↑ primary key of Fees<\/text>\n  <text x=\"330\" y=\"262\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink2)\">A foreign key holds a value from another table's primary key, which links the two tables.<\/text><\/svg><\/figure>","cap":"Roll No identifies each student (primary key; never empty, never repeated). In the Fees table, Roll No is a foreign key pointing back to Students. Email could also be unique — a candidate key not chosen, so an alternate key."},{"k":"table","title":"SQL commands","head":["Group","Full form","Commands"],"rows":[["DDL","Data Definition Language — builds the structure","CREATE, ALTER, DROP, TRUNCATE, RENAME"],["DML","Data Manipulation Language — changes the data","INSERT, UPDATE, DELETE"],["DQL","Data Query Language — reads the data","SELECT"],["DCL","Data Control Language — gives or takes back rights","GRANT, REVOKE"],["TCL","Transaction Control Language — saves or cancels changes","COMMIT, ROLLBACK, SAVEPOINT"]]},{"k":"facts","title":"SQL and database facts","rows":[["SQL","Structured Query Language; developed at IBM in the 1970s (first called SEQUEL)"],["SELECT … WHERE","WHERE filters rows; ORDER BY sorts; GROUP BY groups; HAVING filters groups"],["DELETE vs TRUNCATE vs DROP","Removes chosen rows / removes all rows, keeps the table / removes the whole table"],["ACID","Atomicity, Consistency, Isolation, Durability: the rules of a safe transaction"],["Normalisation","Splitting tables to remove redundancy: 1NF, 2NF, 3NF, BCNF"],["ER diagram","Entity–Relationship diagram, given by Peter Chen (1976): entities, attributes and relationships"],["OLTP / OLAP","Online Transaction Processing (day-to-day entries) / Online Analytical Processing (analysis)"],["Data warehouse / data mining","Store of large historical data / finding hidden patterns in it"],["Popular DBMS","Oracle, MySQL, Microsoft SQL Server, PostgreSQL, MS Access; MongoDB is NoSQL"]]},{"k":"table","title":"MS Access — database basics","head":["Item","Meaning"],"rows":[["MS Access","Database management system (DBMS) in MS Office; file .accdb (2007 onwards), .mdb older"],["Table","Stores the data in rows and columns — the basic object"],["Record","One row of a table (all details of one person / item)"],["Field","One column of a table (one type of detail, e.g. Name)"],["Primary key","Field whose value is unique for every record and cannot be empty, e.g. Roll No"],["Foreign key","Field that refers to the primary key of another table; links tables"],["Query","Asks a question — selects, sorts or calculates data meeting conditions"],["Form","User-friendly screen for entering and viewing data"],["Report","Formatted summary of data for printing"],["Macro / Module","Automates tasks / VBA program code"],["Datasheet view vs Design view","Data in a grid vs structure of the table (fields and data types)"],["Data types","Short Text (up to 255 characters), Long Text, Number, Date/Time, Currency, AutoNumber, Yes/No, Hyperlink, Attachment"]]},{"k":"table","title":"MS Access at a glance","head":["Item","Fact"],"rows":[["First released","November 1992; part of Microsoft Office Professional"],["File extension",".accdb (Access 2007 onwards); .mdb older; .accde compiled (locked) file"],["Six objects","Tables, Queries, Forms, Reports, Macros, Modules"],["Table views","Datasheet View (rows of data) and Design View (fields and data types)"],["Form and report views","Form View, Layout View, Design View; Report View, Print Preview"],["Data types","Short Text (up to 255 characters), Long Text (old name Memo), Number, Date/Time, Currency, AutoNumber, Yes/No, OLE Object, Hyperlink, Attachment, Calculated, Lookup Wizard"],["AutoNumber","Gives each new record the next number by itself; often used as the primary key"],["Query types","Select query; action queries (make-table, append, update, delete); crosstab; parameter query"],["Relationships","One-to-one, one-to-many (most common), many-to-many (through a junction table)"],["Referential integrity","Stops a foreign key value that has no matching primary key"],["Size limit","2 GB for one Access database file"]]},{"k":"table","title":"Database models","head":["Model","Shape","Example"],"rows":[["Hierarchical","Tree: one parent, many children","IBM IMS"],["Network","Graph: a child can have many parents","CODASYL databases"],["Relational","Related tables (rows and columns)","Oracle, MySQL, SQL Server, MS Access"],["Object-oriented","Data stored as objects","db4o"],["NoSQL","Documents, key–value pairs or graphs, for very large data","MongoDB, Cassandra"]]},{"k":"info","title":"Three shapes of database","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 660 270\" role=\"img\" aria-label=\"Hierarchical, network and relational database models\"><g transform=\"translate(0 40)\">\n  <rect x=\"10\" y=\"10\" width=\"206\" height=\"190\" rx=\"12\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><rect x=\"228\" y=\"10\" width=\"206\" height=\"190\" rx=\"12\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><rect x=\"446\" y=\"10\" width=\"206\" height=\"190\" rx=\"12\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/>\n  <text data-lq=\"Hierarchical\" x=\"113\" y=\"32\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Hierarchical<\/text><text data-lq=\"Network\" x=\"331\" y=\"32\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Network<\/text><text data-lq=\"Relational\" x=\"549\" y=\"32\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Relational<\/text>\n  <path d=\"M113 62 L63 112 M113 62 L163 112 M63 112 L38 162 M63 112 L88 162 M163 112 L188 162\" stroke=\"var(--ink2)\" stroke-width=\"2\"/>\n  <circle cx=\"113\" cy= 90\" width=\"28\" height=\"22\" fill=\"hsla(20,85%,55%,.4)\" stroke=\"var(--rule)\"/><rect x=\"586\" y=\"90\" width=\"28\" height=\"22\" fill=\"hsla(20,85%,55%,.4)\" stroke=\"var(--rule)\"/><rect x=\"614\" y=\"90\" width=\"28\" height=\"22\" fill=\"hsla(20,85%,55%,.4)\" stroke=\"var(--rule)\"/><rect x=\"558\" y=\"112\" width=\"28\" height=\"22\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><rect x=\"586\" y=\"112\" width=\"28\" height=\"22\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><rect x=\"614\" y=\"112\" width=\"28\" height=\"22\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><rect x=\"558\" y=\"134\" width=\"28\" height=\"22\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><rect x=\"586\" y=\"134\" width=\"28\" height=\"22\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><rect x=\"614\" y=\"134\" width=\"28\" height=\"22\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><rect x=\"558\" y=\"156\" width=\"28\" height=\"22\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><rect x=\"586\" y=\"156\" width=\"28\" height=\"22\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><rect x=\"614\" y=\"156\" width=\"28\" height=\"22\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/>\n  <text x=\"113\" y=\"192\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink2)\">tree: one parent<\/text><text x=\"331\" y=\"192\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink2)\">graph: many parents<\/text><text x=\"549\" y=\"192\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink2)\">tables of rows and columns<\/text>\n  <text x=\"330\" y=\"222\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink2)\">MS Access, Oracle and MySQL are relational; MongoDB is NoSQL.<\/text><\/g><\/svg><\/figure>","cap":"Hierarchical data is a tree (IBM IMS), network data a graph (CODASYL), relational data a set of linked tables — the model used by MS Access and SQL databases."},{"k":"table","title":"MS Access at a glance","head":["Item","Fact"],"rows":[["First released","November 1992; part of Microsoft Office Professional"],["File extension",".accdb (Access 2007 onwards); .mdb older; .accde compiled (locked) file"],["Six objects","Tables, Queries, Forms, Reports, Macros, Modules"],["Table views","Datasheet View (rows of data) and Design View (fields and data types)"],["Form and report views","Form View, Layout View, Design View; Report View, Print Preview"],["Data types","Short Text (up to 255 characters), Long Text (old name Memo), Number, Date/Time, Currency, AutoNumber, Yes/No, OLE Object, Hyperlink, Attachment, Calculated, Lookup Wizard"],["AutoNumber","Gives each new record the next number by itself; often used as the primary key"],["Query types","Select query; action queries (make-table, append, update, delete); crosstab; parameter query"],["Relationships","One-to-one, one-to-many (most common), many-to-many (through a junction table)"],["Referential integrity","Stops a foreign key value that has no matching primary key"],["Size limit","2 GB for one Access database file"]]},{"k":"table","title":"Database models","head":["Model","Shape","Example"],"rows":[["Hierarchical","Tree: one parent, many children","IBM IMS"],["Network","Graph: a child can have many parents","CODASYL databases"],["Relational","Related tables (rows and columns)","Oracle, MySQL, SQL Server, MS Access"],["Object-oriented","Data stored as objects","db4o"],["NoSQL","Documents, key–value pairs or graphs, for very large data","MongoDB, Cassandra"]]},{"k":"trick","h":"Access objects — <span class='mn'>T Q F R M M<\/span>: <b>T<\/b>eachers <b>Q<\/b>uickly <b>F<\/b>ill <b>R<\/b>egisters <b>M<\/b>onday <b>M<\/b>orning = Tables, Queries, Forms, Reports, Macros, Modules. SQL groups: <b>D<\/b>DL <b>D<\/b>efines (CREATE, ALTER, DROP); D<b>M<\/b>L <b>M<\/b>odifies (INSERT, UPDATE, DELETE)."},{"k":"trap","h":"A <b>record<\/b> is a row and a <b>field<\/b> is a column — not the other way. The <b>primary key<\/b> can never be empty or repeated; a <b>foreign key<\/b> can repeat. <b>DELETE<\/b> is DML (rows), <b>DROP<\/b> is DDL (the whole table). A <b>form<\/b> is for entering data, a <b>report<\/b> is for printing it. Access saves as <b>.accdb<\/b>, not .acc or .mdbx."}],"sum":["A DBMS stores related data in tables; a record is a row (tuple) and a field is a column (attribute); RDBMS uses related tables (E. F. Codd, 1970).","The primary key is unique and never empty; a foreign key refers to another table's primary key and links the tables.","SQL: DDL (CREATE, ALTER, DROP), DML (INSERT, UPDATE, DELETE), DQL (SELECT), DCL (GRANT, REVOKE), TCL (COMMIT, ROLLBACK).","MS Access (.accdb) has six objects: tables, queries, forms, reports, macros and modules; tables open in Datasheet or Design view.","Data types include Short Text (255 characters), Long Text, Number, Currency, AutoNumber and Yes/No."],"part":["Part 2 · Software, Windows & MS Office","सॉफ़्टवेयर, विंडोज़ एवं एमएस ऑफ़िस"]}

const QB = [
["C7","A compiler translates a high-level program —",["all at once, into machine code, before it runs","one line at a time while it runs","only from assembly language to machine code","from RAM to the hard disk"],"A compiler converts the whole program in one go and lists the errors afterwards; line-by-line translation is the interpreter's way.","p"],
["C7","Which translator converts and executes a high-level program one statement at a time?",["Interpreter","Compiler","Assembler","Linker"],"An interpreter translates and runs line by line and stops at the first error; a compiler translates the whole program first.","p"],
["C7","An assembler converts —",["assembly language into machine language","high-level language into assembly language","machine language into high-level language","source code into a web page"],"The assembler works only on assembly language (mnemonics such as ADD, MOV); compilers and interpreters handle high-level languages.","p"],
["C7","Which program places an executable program into main memory so that it can run?",["Loader","Linker","Assembler","Debugger"],"The loader (part of the OS) loads the program into RAM; the linker only joins object files into one executable.","p"],
["C7","Which program joins several object files and library files into a single executable file?",["Linker","Loader","Interpreter","Editor"],"The linker combines object modules into one executable; the loader later places that file in memory.",""],
["C7","Machine language, written only in 0s and 1s, belongs to which generation of programming languages?",["First generation","Second generation","Third generation","Fourth generation"],"1GL = machine language, 2GL = assembly language, 3GL = high-level languages such as C and Java.","p"],
["C7","Which of the following is NOT a high-level language?",["Assembly language","COBOL","Python","FORTRAN"],"Assembly language is a low-level (second-generation) language using mnemonics; COBOL, Python and FORTRAN are high-level.",""],
["C7","SQL is generally classed as a language of which generation?",["Fourth generation (4GL)","Second generation (2GL)","First generation (1GL)","Fifth generation (5GL)"],"SQL is a 4GL — you state what data you want, not how to get it; Prolog is the usual 5GL example.",""],
["C7","Software that can be used free for a trial period, after which the user is asked to pay, is called —",["Shareware","Freeware","Open-source software","Public-domain software"],"Shareware is try-before-you-buy; freeware is free but closed source; open source makes the code public.","p"],
["C7","BIOS, stored permanently on a chip on the motherboard, is an example of —",["Firmware","Application software","Shareware","Malware"],"Software stored permanently in ROM/flash inside hardware is firmware; BIOS starts the computer during booting.",""],
["C7","Antivirus, Disk Cleanup and disk defragmenter are examples of —",["Utility software","Application software","Programming languages","Firmware"],"Utilities are system software that maintain the computer; they are not application software.",""],
["C7","______ consists of the step-by-step instructions that tell the computer how to complete a task.",["Program","Hardware","Data","Objects"],"A program is a set of instructions. Hardware is the physical machine.","","","",""],
["C7","Software in computer?",["Replace the hardware","Increase the speed of the CPU.","Enhance the capabilities of the hardware machine.","Both above"],"Software lets the hardware do useful jobs; it does not change CPU speed.","",2,1,""],
["C7","Computers manipulate data in many ways, and this manipulation is called ____.",["Processing","Utilizing","Batching","Upgrading"],"Turning input data into useful output is called processing.","","","",""],
["C7","Arranging of data in a logical sequence is called.",["Sorting","Classifying","Reproducing","Summarizing"],"Sorting puts data in an order such as A to Z or smallest to largest.","","","",""],

["C7","What do we call a person who controls the computer?",["Liveware","Programmer","Analyst","Controller"],"Hardware, software and liveware (people) make a computer system; the user is liveware.","","","",""],
["C7","Which of the following options is an example of system software?",["Operating System","Antivirus Software","Oracle","MS-Word"],"The OS manages the hardware, so it is system software. Antivirus is utility; Oracle and MS-Word are applications.","","","",""],

["C7","Which of the following is an example of Application Software?",["Microsoft Excel","Antivirus Software","Operating System","Disk Defragmenter"],"Excel does a user task (spreadsheets). OS is system software; antivirus and defragmenter are utilities.","","","",""],
["C7","A software designed to help users to perform specific tasks is known as-",["Application Software","System Software","Utility Software","Device driver"],"Application software serves the user's own purpose.","","","",""],

<script>
"use strict";
/* Computer Knowledge Lab — decks built from the lessons' own tables (cmpRows), played by tools/workbook/games.js. */
/** Rows of the table (or facts list) whose title starts with `title` in a lesson, as [prompt, answer, note]:
    cols picks the prompt and answer columns. Tags are stripped; rows with an empty side are left out. */
function cmpRows(lessonId, title, cols, note){
  const strip = s => String(s == null ? "" : s).replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&minus;/g, "−").trim();
  const l = LESSONS.find(x => x.id === lessonId), b = l ? l.blocks.find(x => x.rows && String(x.title).startsWith(title)) : null;
  const [p, a] = cols || [0, 1];
  return b ? b.rows.map(r => [strip(r[p]), strip(r[a]), note != null ? strip(r[note]) : ""]).filter(r => r[0] && r[1] && r[1] !== "—" && r[1] !== "–") : [];
}
const short = (rows, n) => rows.filter(r => r[1].length <= (n || 46));
/* Number conversions, made fresh for every game: decimal ↔ binary, octal and hex. */
const SUBS = { 2: "₂", 8: "₈", 10: "₁₀", 16: "₁₆" };
function cmpConv(){
  const pairs = [[10, 2], [2, 10], [2, 16], [16, 10], [2, 8], [8, 10], [10, 16], [16, 2]], out = [];
  for (let i = 0; i < 60; i++) {
    const [f, t] = pairs[i % pairs.length], n = 5 + Math.floor(Math.random() * (f === 2 || t === 2 ? 120 : 250));
    const show = (v, b) => `(${v.toString(b).toUpperCase()})${SUBS[b]}`;
    const wrong = [];
    [1, -1, 2, -2, 4, 8, -4, 16].forEach(d => { const v = show(n + d, t); if (wrong.length < 3 && n + d > 0 && v !== show(n, t) && !wrong.includes(v)) wrong.push(v); });
    out.push({ p: `${show(n, f)} = ? in base ${t}`, a: show(n, t), note: `${show(n, f)} = ${n} in decimal`, opts4: wrong });
  }
  return out;
}
const CMP_ALL = [
  { id: "win", ico: "🪟", title: "Windows Shortcuts", sub: "Win + E, Alt + Tab, Shift + Delete…", lesson: "C8", q: "", rq: "Which keys:", pairs: short(cmpRows("C8", "Windows shortcuts"), 60) },
  { id: "word", ico: "📝", title: "Word Shortcuts", sub: "Ctrl + K, F7, Shift + F3…", lesson: "C9", q: "In Word:", rq: "Word shortcut to:", pairs: short(cmpRows("C9", "Word-specific shortcuts"), 60) },
  { id: "excel", ico: "📊", title: "Excel Shortcuts", sub: "F2, F4, Alt + =, Ctrl + ;…", lesson: "C10", q: "In Excel:", rq: "Excel shortcut to:", pairs: short(cmpRows("C10", "Excel shortcuts"), 60) },
  { id: "ppt", ico: "📽️", title: "PowerPoint Shortcuts", sub: "F5, Shift + F5, Ctrl + M…", lesson: "C11", q: "In PowerPoint:", rq: "PowerPoint shortcut to:", pairs: short(cmpRows("C11", "PowerPoint shortcuts"), 60) },
  { id: "web", ico: "🌐", title: "Browser Shortcuts", sub: "Ctrl + T, Ctrl + Shift + N, Ctrl + J…", lesson: "C8", q: "In a browser:", rq: "Browser shortcut to:", pairs: short(cmpRows("C8", "Web browser shortcuts"), 60) },
  { id: "ctrl", ico: "🔀", title: "Same Key, Other App", sub: "Ctrl + D, E, G, L, M, Q, R, T across Office", lesson: "C8", q: "", make: () => {
      const t = LESSONS.find(x => x.id === "C8").blocks.find(b => String(b.title).startsWith("Ctrl + A to Z"));
      const apps = ["Word", "Excel", "PowerPoint"], items = [];
      t.rows.forEach(r => { const k = String(r[0]).replace(/<[^>]+>/g, ""); if (!/<b>/.test(r[0])) return;     // only the letters that change their job
        apps.forEach((ap, j) => { if (r[j + 1] !== "—") items.push({ p: `Ctrl + ${k} in ${ap}?`, a: r[j + 1], note: apps.map((x, m) => x + ": " + r[m + 1]).join(" · "), pool: "ctrl" }); }); });
      return items; },
    list: () => { const t = LESSONS.find(x => x.id === "C8").blocks.find(b => String(b.title).startsWith("Ctrl + A to Z")); return t.rows.map(r => ["Ctrl + " + String(r[0]).replace(/<[^>]+>/g, ""), r.slice(1).join(" · ")]); } },
  { id: "full", ico: "🔤", title: "Full Forms", sub: "CPU, BIOS, URL, HTTPS, VIRUS…", lesson: "C15", q: "Full form of", pairs: short(cmpRows("C15", "Full forms – internet").concat(cmpRows("C15", "Full forms – files"), cmpRows("C15", "Full forms – security"), cmpRows("C15", "More full forms")), 58) },
  { id: "ext", ico: "📁", title: "File Extensions", sub: ".docx, .xlsx, .png, .mp4, .exe…", lesson: "C20", q: "What is a", rq: "Extension for:", pairs: short(cmpRows("C20", "File extensions you must know"), 40) },
  { id: "port", ico: "🔌", title: "Ports & Protocols", sub: "HTTP 80, HTTPS 443, SMTP 25…", lesson: "C15", q: "Port number of", rq: "Which protocol uses port", pairs: cmpRows("C15", "Main protocols", [0, 3]).filter(r => /\d/.test(r[1])) },
  { id: "units", ico: "🧮", title: "Memory Units", sub: "Bit, nibble, byte, KB … YB", lesson: "C4", q: "", rq: "Which unit is", pairs: cmpRows("C4", "Memory units").map(r => [r[0] + " =", r[1]]) },
  { id: "dev", ico: "🖱️", title: "Which Device?", sub: "MICR, OMR, OCR, plotter, scanner…", lesson: "C3", q: "", pairs: cmpRows("C3", "Input devices", [2, 0]).concat(cmpRows("C18", "Other output devices", [2, 0])).filter(r => r[0].length <= 70) },
  { id: "layer", ico: "🧱", title: "OSI Layers", sub: "Which layer does it work at?", lesson: "C14", q: "", pairs: cmpRows("C14", "Networking devices").filter(r => !/ to /.test(r[1])).map(r => [r[0] + " works at which OSI layer?", r[1]])
      .concat(cmpRows("C14", "OSI model", [0, 1]).map(r => ["OSI layer number " + r[0] + " is the…", r[1]])) },
  { id: "mal", ico: "🦠", title: "Malware & Attacks", sub: "Worm, Trojan, phishing, DDoS…", lesson: "C16", q: "", pairs: cmpRows("C16", "Types of malware", [2, 0]).concat(cmpRows("C16", "Common attacks", [1, 0]).filter(r => r[0].length <= 80)) },
  { id: "who", ico: "👤", title: "Who Made What", sub: "Babbage, Berners-Lee, Gosling…", lesson: "C17", q: "", pairs: short(cmpRows("C17", "Famous people", [1, 0]), 40).concat(cmpRows("C7", "Famous languages", [0, 2]).map(r => ["Creator of " + r[0], r[1]])) },
  { id: "itact", ico: "⚖️", title: "IT Act Sections", sub: "66, 66C, 66D, 66E, 66F, 67…", lesson: "C22", q: "", rq: "What does this section deal with: Section", pairs: cmpRows("C22", "Sections you must know", [1, 0]).filter(r => r[0].length <= 90) },
  { id: "dig", ico: "🇮🇳", title: "Digital India Dates", sub: "Aadhaar, UPI, DigiLocker, 5G…", lesson: "C22", q: "When did this come:", pairs: cmpRows("C22", "Digital India", [0, 1]).map(r => [r[0], (r[1].match(/(\d{1,2} \w+ )?\d{4}/) || [r[1]])[0], r[1]]) },
  { id: "base", ico: "🔢", title: "Base Converter", sub: "Binary, octal, hex — beat the clock", lesson: "C6", q: "", make: cmpConv, options: it => shuffle([it.a].concat(it.opts4)),
    list: () => [["(1010)₂", "10"], ["(1111)₂", "15 = (F)₁₆ = (17)₈"], ["(11111111)₂", "255 = (FF)₁₆ = (377)₈"], ["(100)₁₀", "(1100100)₂ = (64)₁₆ = (144)₈"], ["(2D)₁₆", "45 = (101101)₂ = (55)₈"], ["Binary → octal / hex", "Group 3 / 4 bits from the right"]] }
];
/* Each part of Computer Knowledge plays the decks whose lesson it holds (a deck needs at least four rows to make options). */
const CMP_DECKS = CMP_ALL.filter(d => LESSONS.some(l => l.id === d.lesson) && (d.make || d.pairs.length >= 4));
/* Up to n rows of a deck for the Grand Mix, spread over different answers so every question gets real wrong options. */
function cmpSpread(rows, n){
  const by = {}; shuffle(rows).forEach(r => { (by[r[1]] = by[r[1]] || []).push(r); });
  const groups = shuffle(Object.values(by)), out = [];
  for (let i = 0; out.length < n && groups.some(g => g.length); i++) { const g = groups[i % groups.length]; if (g.length) out.push(g.shift()); }
  return out;
}
const LAB_CONF = {
  title: "Computer Lab", blurb: "Drill the shortcuts, full forms, extensions, ports and units of this part until your fingers know them. Every right answer earns XP, shared across the three parts.",
  ranks: [[0, "Power Button", "🔌"], [60, "Keyboard Warrior", "⌨️"], [200, "Office Pro", "💼"], [450, "Network Admin", "🛰️"], [900, "Supercomputer", "🖥️"]],
  decks: CMP_DECKS.concat([{ id: "mix", ico: "🎲", title: "Grand Mix", sub: "Everything at once — the real exam feel", q: "",
    make: () => labMix(CMP_DECKS.filter(d => !d.make).map(d => Object.assign({}, d, { pairs: cmpSpread(d.pairs, 6) }))), list: () => CMP_DECKS.filter(d => !d.make).flatMap(d => d.pairs) }]),
  match: [{ deck: "port", title: "Pair each protocol with its port", sub: "Flip cards — HTTP, HTTPS, SMTP, POP3, DNS… with their port numbers" },
          { deck: "ext", title: "Pair each file type with its extension", sub: "Flip cards — .docx, .xlsx, .pptx, .pdf, .exe… with what they hold" },
          { deck: "units", title: "Pair each memory unit with its size", sub: "Flip cards — nibble, byte, KB, MB, GB, TB… with their sizes" }].find(m => CMP_DECKS.some(d => d.id === m.deck)) || null
};

  .hero > .eyebrow,.hero > h1,.hero > p{grid-column:1}
  .hero > .meter{grid-column:2;grid-row:3;align-self:center}
  .hero > .row{grid-column:2;grid-row:2;align-self:end}

  /* lesson reader: facts, timelines, tricks sit side by side */
  .lhead{margin-bottom:0}
  .steps{max-width:640px}
  .steps + .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .steps + .stack > .plain,.steps + .stack > .row,.steps + .stack > p,.steps + .stack > .fig,.steps + .stack > h2,.steps + .stack > .tbl{grid-column:1/-1}
  .steps + .stack > .plain{max-width:86ch;font-size:17px}
  .steps + .stack > .hot,.steps + .stack > .story{grid-column:1/-1}
  .steps + .stack > .story{max-width:none;padding:20px 24px;font-size:17.5px}
  .steps + .stack > .story p{max-width:80ch}
  .steps + .stack:not(:has(> .block ~ .block)) > .block{grid-column:1/-1}
  .block,.qcard{padding:18px 20px;border-radius:14px}

  /* quizzes and question bank */
  #lq > .stack{display:grid;grid-template-columns:minmax(0,1fr);max-width:980px;gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qt{font-size:18px}
  #plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #plist .opts{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:wrap;overflow:visible}

  /* mock test: question with the answer grid alongside */
  .mbar{top:calc(env(safe-area-inset-top,0px) + 67px)}
  .view > .qcard{max-width:1000px}
  .view > .row.between{max-width:1000px}
  .view > #msub{max-width:1000px;width:100%}
  .view > .block.stack{max-width:760px}
  .pal{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .kpis{max-width:760px}

  /* revise: summary cards and sheets in columns */
  #rv > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #rv > .stack > .grph,#rv > .stack > p,#rv > .stack > .search,#rv > .stack > .callout{grid-column:1/-1}
  #dgl,#lml,#tll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #dgl > .grph,#dgl > p,#lml > p,#tll > .grph{grid-column:1/-1}
  #rv .search,#rv > #dgl ~ .search{max-width:520px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flash{min-height:300px;max-width:760px;margin:0 auto;padding:32px 36px}
  .flash .front{font-size:22px}

  /* learn: era cards across the top */
  .eras{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}
  .les{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}

</style>
<script id="shabd-deeplink">
(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();
</script>

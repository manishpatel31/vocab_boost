<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">

<title>Sports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: Sports — follows the शब्दRegister Paper / Indigo look; one column + bottom tabs on phones, sidebar on PC. */
:root{
  --paper:#f6f3ea; --sheet:#fffdf7; --sunk:#ebe6d8;
  --ink:#1d2a22; --ink2:#56625a; --rule:#dcd5c3;
  --blue:#1f5c3d; --on-blue:#ffffff; --blue-bg:#dcebdf;
  --accent:#b4530f; --accent-bg:#fbe7d3;
  --good:#1b7547; --good-bg:#dff1e6; --bad:#b0271f; --bad-bg:#f8e1de;
  --warn-bg:#fff2d2;
  --f-display:"Fraunces", "Tiro Devanagari Hindi", Georgia, serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap{border-radius:var(--r);padding:12px 14px 12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.trick .lab,.trap .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.pyr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pyr div{text-align:center;font-size:13px}
.pyr b{display:block;font-size:14px}
.pm{fill:var(--blue)} .pf{fill:var(--accent)}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.pal button.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.pal button.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.rk{display:grid;gap:0}
.rk div{display:grid;grid-template-columns:minmax(0,48%) 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:15px}
.rk div:first-child{border-top:0}
.rk dt{font-size:13px;color:var(--ink2);margin:0}
.rk dt.up{color:var(--good)} .rk dt.dn{color:var(--bad)}
.rk dd{margin:0;font-weight:600;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:24px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.gbar{display:grid;grid-template-columns:78px 1fr 52px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.gbar .tr{height:12px;background:var(--sunk);border-radius:3px;position:relative;overflow:hidden}
.gbar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:3px}
.gbar .tr i.neg{background:var(--bad)}
.gbar .v{font-family:var(--f-num);text-align:right}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
@media (prefers-reduced-motion: no-preference){ .opt,.chip,.btn{transition:background-color .15s, border-color .15s} }
.link{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px}
.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.icheck{background:var(--sheet);border:1.5px dashed var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.icheck .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.cat{font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;white-space:nowrap}
.cat.CS{background:var(--blue-bg);color:var(--blue)} .cat.CSS{background:var(--accent-bg);color:var(--accent)} .cat.ST{background:var(--sunk);color:var(--ink)} .cat.OT{background:var(--sunk);color:var(--ink2)}

/* ---- Sports additions ---- */
.plist .dl{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.plist .dl em{font-style:normal;font-weight:700;color:var(--blue);text-align:right}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--rule)}
.ladder li{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--rule)}
.ladder .rk-n{font-size:22px;font-weight:600;color:var(--blue);text-align:right}
.ladder .rk-t{min-width:0}
.ladder .rk-t b{display:block;line-height:1.3}
.ladder .rk-t span{font-size:13px;color:var(--ink2)}
.ladder .rk-d{font-weight:700;font-size:14px;white-space:nowrap}
.ladder li.up .rk-d{color:var(--good)} .ladder li.dn .rk-d{color:var(--bad)}
.ladder small{font-weight:600;color:var(--ink2)}
table.cover td{min-width:90px}
.peek{border:1.5px dashed var(--blue);background:var(--blue-bg);color:var(--blue);border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer;min-height:36px;width:100%}
.pubs{display:grid;gap:12px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.plist li{padding:7px 0;border-top:1px dashed var(--rule);display:grid;gap:1px}
.plist li:first-child{border-top:0}
.plist li span{font-size:13px;color:var(--ink2)}
.seg{scroll-snap-type:x proximity}
@media (max-width: 700px){
  table.cover thead{display:none}
  table.cover tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--rule)}
  table.cover td{border:0;padding:0;min-width:0;font-size:14px}
  table.cover td:first-child{grid-column:1/-1;font-size:15px}
  table.cover td[data-l]::before{content:attr(data-l);display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
}
</style>

  <div class="top-in">
    <div class="brand">Sports<small>खेल · SSC CGL workbook</small></div>

  </div>
</header>

<main class="wrap" id="app"></main>

<nav class="nav" aria-label="Sections">
  <div class="nav-in">

{ id:"L1", title:"How sports questions are asked", hi:"खेल के प्रश्न कैसे आते हैं", blocks:[
 {k:"p", h:"Sports is now the <b>single biggest static-GK topic</b> in CGL: one teacher counted about 470 of roughly 1,100 static questions from sports in the recent papers. They come in six shapes: <b>(1) field dimensions</b> (most asked), <b>(2) number of players & match time</b>, <b>(3) rules & terms</b> (Ippon, lona, follow-on, yorker), <b>(4) history</b> (who invented it, when, where), <b>(5) Indian firsts</b> (first Olympic gold, first woman medallist), <b>(6) trophies & current events</b>."},
 {k:"trick", h:"<b>Make a one-page 'dimension sheet'.</b> Every lecture said the same: numbers are learnt by seeing them daily, not by one reading. This app's <b>Revise → Dimension sheet</b> is that sheet, with a cover mode — hide the values, say them aloud, tap to check."},
 {k:"table", title:"Players on the field (per side)", head:["No.","Sports"], rows:[["5","Basketball"],["6","Volleyball, Ice hockey"],["7","Kabaddi, Handball, Netball, Water polo"],["9","Kho-Kho, Baseball"],["11","Cricket, Football, Hockey"],["15","Rugby union"]]},
 {k:"trick", h:"<b>“5 बास्केट लाओ, उसमें 6 वॉली डालो, सातों दिन हाथ (Hand) और नेट का यूज़ करो, 9 पर बेस (Base) मिल गया”</b> → 5 basketball, 6 volleyball, 7 handball/netball, 9 baseball. Add <b>Kabaddi 7</b> and <b>Kho-kho 9</b> (“खो-खो में ज़्यादा खिलाड़ी — 9”)."},
 {k:"q", q:"How many players of one team are on court at a time in basketball?", o:["5","6","7","9"], e:"5 basketball, 6 volleyball, 7 handball/netball/kabaddi, 9 kho-kho/baseball."},
 {k:"table", title:"Where each game was born", head:["Sport","Origin","Credited to"], rows:[["Basketball","USA, 1891","James Naismith"],["Volleyball","USA, 1895","William G. Morgan"],["Judo","Japan, 1882","Jigoro Kano"],["Kabaddi","India (rules framed in Maharashtra)","—"],["Chess","India (chaturanga)","—"],["Badminton","India (Poona)/England","—"],["Hockey (modern)","England","—"],["Football (modern)","England","—"]]},
 {k:"trap", h:"<b>No official national sport.</b> Hockey is widely called India's national game, but the government has never officially declared any sport as the national sport. Examiners use this."},

{ id:"L2", title:"Cricket I — field, pitch & ball", hi:"क्रिकेट: मैदान, पिच, गेंद", blocks:[
 {k:"table", title:"The pitch", head:["Item","Value"], rows:[["Length (wicket to wicket)","<b>22 yards</b> = 66 ft = <b>20.12 m</b>"],["Width","10 ft = 3.05 m"],["Popping crease","4 ft (1.22 m) in front of the stumps"],["Stumps","28 in high; set 9 in wide; 3 stumps + 2 bails"],["Bat","Max width 4.25 in (10.8 cm); max length 38 in"],["Boundary","Not fixed; varies by ground"]]},
 {k:"trick", h:"<b>22 yards = 22 players</b> on the pitch (11 + 11). 1 yard = 3 ft → 66 ft → about 20 m. Stumps <b>28 × 9</b> → “<b>28 दिन का महीना, 9 बजे मैच</b>”."},
 {k:"trap", h:"One lecture said the bat's maximum width is 4½ in. The Laws of Cricket say <b>4.25 in (108 mm)</b>."},
 {k:"table", title:"Creases", head:["Crease","What it does"], rows:[["Bowling crease","The line the stumps stand on (both ends)"],["Popping crease","Batter safe behind it; bowler's front foot beyond it = no-ball; decides run-out & stumping"],["Return crease","Side lines; bowler's back foot must land inside"]]},
 {k:"q", q:"Which crease decides whether a batter is run out or stumped?", o:["Popping crease","Bowling crease","Return crease","Boundary line"], e:"The batter must have bat or body grounded behind the popping crease."},

 {k:"facts", title:"Formats", rows:[["Test","5 days, 2 innings each"],["ODI","50 overs a side"],["T20","20 overs a side, about 3 hours"],["Over","6 legal balls; wides and no-balls are bowled again"],["Umpires","2 on field + TV (third) umpire"]]},
 {k:"table", title:"Fielding restrictions & field", head:["Term","Meaning"], rows:[["Infield / 30-yard circle","Dotted ring around the pitch"],["Powerplay","Only 2 fielders allowed outside the circle in the first 10 overs of an ODI"],["Boundary","4 if the ball touches the ground first, 6 if it clears it on the full"]]},
 {k:"q", q:"After how many overs may the fielding captain ask for a new ball in a Test match?", o:["80","60","90","100"], e:"80 completed overs; it is optional, not compulsory."}

{ id:"L3", title:"Cricket II — rules, extras & dismissals", hi:"क्रिकेट: नियम, अतिरिक्त रन, आउट", blocks:[
 {k:"table", title:"Four kinds of extras", head:["Extra","When","Auto run?"], rows:[["Wide","Ball out of the batter's reach (measured from the outer guideline)","Yes, 1 + any runs/boundary"],["No-ball","Front-foot fault; full toss above waist; bouncer above head","Yes, 1 + runs off the bat"],["Bye","Ball misses bat and body; batters run","No"],["Leg bye","Ball hits body (not bat); batters run","No"]]},

 {k:"table", title:"Umpire signals", head:["Signal","Means"], rows:[["Index finger raised","Out"],["Both arms stretched sideways","Wide"],["One arm stretched sideways","No-ball"],["Wrists crossed and uncrossed below the waist","Dead ball"],["One open hand raised","Bye"],["Touching a raised knee","Leg bye"],["Arm waved side to side","Four"],["Both arms raised above head","Six"]]},
 {k:"trap", h:"A lecture said the no-ball signal is “one hand raised above the head”. That is the <b>OUT</b> signal (a raised finger). <b>No-ball = one arm held out horizontally.</b>"},
 {k:"table", title:"Ways to get out", head:["Dismissal","Bowler credited?","Note"], rows:[["Bowled","Yes","Any one bail off is enough; not on a no-ball"],["Caught","Yes","Fielder must have full control"],["LBW","Yes","Ball must hit pad before bat; Hawk-Eye checks path"],["Stumped","Yes","Keeper breaks wicket, batter out of crease"],["Hit wicket","Yes","Batter breaks own wicket"],["Run out","No","Team credit"],["Hit the ball twice","No","Not out if protecting the wicket"],["Obstructing the field","No","Only if deliberate"],["Timed out","No","New batter not ready in 3 minutes"],["Retired out","No","Retired hurt may come back"]]},
 {k:"trick", h:"Bowler gets credit for <b>“B-C-L-S-H”</b> (Bowled, Caught, LBW, Stumped, Hit wicket). Run out goes to the team."},

 {k:"q", q:"Which of these dismissals is NOT credited to the bowler?", o:["Run out","Stumped","LBW","Bowled"], e:"Run out is credited to the fielding side, not the bowler."},
 {k:"facts", title:"Follow-on (Test)", rows:[["Lead needed (5-day Test)","200 runs"],["3–4 day match","150"],["2-day","100"],["1-day","75"],["Compulsory?","No — the captain's choice"]]},
 {k:"table", title:"Fast bowling", head:["Ball","What it does"], rows:[["Yorker","Lands at the batter's feet / base of stumps; stops big shots"],["Full toss","Reaches the batter without bouncing"],["Good length","Batter unsure whether to go forward or back"],["Bouncer","Pitched short, rises to head height (legal)"],["In-swinger","Swings in the air into a right-hander"],["Out-swinger","Swings away from a right-hander"],["Off-cutter","Moves off the pitch from off side into the batter"],["Leg-cutter","Moves off the pitch from leg side away from the batter"]]},
 {k:"table", title:"Spin bowling", head:["Ball","Bowler","Turns"], rows:[["Off-break","Right-arm finger spinner","Into a right-hander (off → leg)"],["Leg-break","Wrist spinner","Away from a right-hander (leg → off)"],["Googly","Wrist spinner","Looks like a leg-break but turns the other way"],["Doosra","Off-spinner","Turns away — the off-spinner's 'other one'"]]},
 {k:"trap", h:"A lecture called Harbhajan Singh a leg-spinner. Harbhajan is an <b>off-spinner</b>; Anil Kumble is the famous Indian leg-spinner. The lecture also mixed up the cutters — the table above is the standard definition."},
 {k:"table", title:"Fielding positions (right-hander)", head:["Off side","Leg side"], rows:[["Slip (next to keeper), Gully, Point, Cover, Extra cover, Mid-off, Third man","Leg slip, Short leg, Square leg, Mid-wicket, Mid-on, Fine leg"]]},
 {k:"q", q:"A delivery aimed at the batter's toes near the base of the stumps is called a…", o:["Yorker","Bouncer","Googly","Doosra"], e:"Asked in a 2025 paper."}
], sum:["Wide & no-ball: 1 auto run; bye & leg bye: none.","Signals: no-ball one arm out; wide both arms; dead ball crossed wrists below waist; out = raised finger.","Bowler credited for bowled, caught, LBW, stumped, hit wicket — not run out.","Follow-on lead 200 in a 5-day Test (optional).","Yorker, bouncer, swing, cutters; off-break, leg-break, googly, doosra."]},

{ id:"L5", title:"Athletics I — track & relay", hi:"एथलेटिक्स: ट्रैक और रिले", blocks:[
 {k:"p", h:"Athletics has three families: <b>running</b> (on the track), <b>jumping</b> and <b>throwing</b> (both in the infield). The standard track is an oval of <b>400 m</b> with a <b>100 m straight</b>."},
 {k:"table", title:"The track", head:["Item","Value"], rows:[["Lap","400 m"],["Lanes","8"],["Lane width","1.22 m (up to 1.25 m)"],["Lane lines","5 cm (50 mm) wide"],["Finish","Decided when the <b>torso</b> crosses the line (not head, hand or foot)"]]},
 {k:"table", title:"Five kinds of running events", head:["Type","Events"], rows:[["Sprint","100 m, 200 m, 400 m"],["Middle distance","800 m, 1500 m"],["Long distance","5000 m, 10,000 m"],["Hurdles","Women 100 m, Men 110 m, both 400 m"],["Steeplechase","3000 m — 28 barriers + 7 water jumps = 35 obstacles"]]},
 {k:"trick", h:"<b>Staggered start</b> only where there is a bend: 200 m and 400 m (outer lanes start ahead). The 100 m is run on the straight, so no stagger. Hurdles: <b>“लड़कियाँ 100, लड़के 10 ज़्यादा (110), दोनों 400”</b>."},
 {k:"trap", h:"Knocking a hurdle over accidentally is <b>not</b> a foul. Only deliberately knocking it or running around it is."},
 {k:"table", title:"Starts", head:["Term","Meaning"], rows:[["Starting blocks","Foot plates used in sprints"],["Crouch start","The crouched sprint start"],["Bunch start","Feet placed close together on the blocks"]]},
 {k:"table", title:"Relay", head:["Item","Value"], rows:[["Runners","4; each stage is a <b>leg</b>"],["Anchor leg","The last leg, usually the fastest runner"],["Takeover zone 4×100 m","<b>30 m</b> (was 20 m)"],["Takeover zone 4×400 m","<b>20 m</b>"],["Measured by","Position of the baton, not the runner"],["Baton","28–30 cm long, at least 50 g; dropped baton may be picked up"]]},
 {k:"trick", h:"<b>Short race, big zone; long race, small zone.</b> 4×100 runners are at top speed, so they need 30 m to pass the baton; 4×400 runners are slower at the change, so 20 m is enough."},
 {k:"q", q:"Under current rules, the takeover zone in the 4×100 m relay is…", o:["30 m","20 m","10 m","40 m"], e:"30 m for 4×100; 20 m for 4×400."},
 {k:"facts", title:"Road running", rows:[["Marathon","42.195 km"],["Half marathon","21.0975 km"],["Steeplechase","3000 m — Avinash Sable is India's steeplechase star"]]},
 {k:"q", q:"In which of these races do runners NOT get a staggered start?", o:["100 m","200 m","400 m","4×400 m relay"], e:"The 100 m is on the straight."}
], sum:["Track 400 m, 8 lanes of 1.22 m, lines 5 cm; winner by torso.","Sprint 100/200/400; middle 800/1500; long 5000/10000; hurdles W100/M110/400; steeplechase 3000 m (28 + 7).","Staggered start in 200 & 400, not 100.","Relay: anchor = last leg; takeover zone 30 m (4×100), 20 m (4×400); baton 28–30 cm, ≥50 g."]},

{ id:"L6", title:"Athletics II — jumps, throws & Indian athletes", hi:"एथलेटिक्स: कूद, फेंक और भारतीय खिलाड़ी", blocks:[
 {k:"table", title:"Jumps", head:["Event","Key rule"], rows:[["Long jump","18–22 strides; take-off before the foul line; measured to the <b>nearest</b> mark in the sand"],["High jump","<b>One-foot</b> take-off (two-foot is invalid); 3 failures eliminate; bar 3 cm thick; run-up ≥15 m"],["Triple jump","<b>Hop → Step → Jump</b> (hop lands on the take-off foot)"],["Pole vault","Pole planted in the box; 3 consecutive failures eliminate"]]},

 {k:"q", q:"What is the correct sequence in the triple jump?", o:["Hop, step, jump","Step, hop, jump","Jump, step, hop","Hop, jump, step"], e:"Hop (same foot), step (other foot), jump into the pit."},
 {k:"table", title:"Throws — implement weights", head:["Event","Men","Women"], rows:[["Shot put","7.26 kg","4 kg"],["Hammer","7.26 kg","4 kg"],["Discus","2 kg","1 kg"],["Javelin","800 g","600 g"]]},
 {k:"trick", h:"<b>Shot = Hammer</b> (7.26 / 4). <b>Discus halves</b> (2 / 1). Javelin in grams: <b>8-6</b>. Shot, hammer and discus are thrown from a circle (hammer 2.135 m, discus 2.5 m, both inside a cage); the javelin is thrown overhead from a runway and its metal head must land first inside the sector."},
 {k:"table", title:"Indian athletics landmarks", head:["Athlete","Feat"], rows:[["Levy Pinto","First athletics golds at the 1st Asian Games, Delhi 1951 (100 m & 200 m)"],["Milkha Singh — 'Flying Sikh'","CWG gold 1958 (Cardiff); 4th in 400 m at Rome 1960; nickname given by Pakistan's General Ayub Khan"],["Kamaljeet Sandhu","First Indian woman to win individual Asian Games gold (400 m, 1970)"],["P.T. Usha — 'Payyoli Express'","4th in 400 m hurdles, Los Angeles 1984"],["Anju Bobby George","Bronze, long jump, 2003 World Championships (Paris) — first Indian medal at Worlds"],["Neeraj Chopra","Javelin: Olympic gold Tokyo 2020, silver Paris 2024; World champion 2023"],["Eldhose Paul","Triple jump gold, CWG 2022"],["Praveen Kumar Sobti","Discus/hammer thrower; played Bhima in TV's Mahabharat"]]},

 {k:"q", q:"Who was the first Indian to win a medal at the World Athletics Championships?", o:["Anju Bobby George","P.T. Usha","Neeraj Chopra","Milkha Singh"], e:"Bronze in long jump, Paris 2003."}
], sum:["Long jump measured to the nearest mark; high jump one-foot take-off, 3 failures out.","Triple jump = hop, step, jump; Fosbury Flop (1968).","Shot & hammer 7.26/4 kg; discus 2/1 kg; javelin 800/600 g.","Levy Pinto 1951; Milkha 4th 1960; Usha 4th 1984; Anju Bobby George 2003 bronze; Neeraj gold 2020.","AFI 1946."]},

{ id:"L7", title:"Hockey", hi:"हॉकी", blocks:[

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hash = s => { let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5)+h + s.charCodeAt(i))|0; return "q"+(h>>>0).toString(36); };
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; };

const LNUM = id => LESSONS.findIndex(l => l.id === id) + 1;

const QS = QB.map(r => {
  const fixed = !!r[6];
  return { t:r[0], q:r[1], o:r[2], e:r[3], p:(r[4]||"").includes("p"), a: fixed ? (r[5]||0) : 0, fixed, id:hash(r[1]) };
});
const byLesson = id => QS.filter(q => q.t === id);
// order of options to show: array of original indexes
const makePerm = q => q.fixed ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i));

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const record = (q, ok) => { S.ans[q.id] = ok ? 1 : 0; save(); renderTop(); };

function renderTop(){
  const ids = Object.keys(S.ans).filter(k => QS.some(q => q.id === k));
  const right = ids.filter(k => S.ans[k] === 1).length;
  const pct = ids.length ? Math.round(right*100/ids.length) : 0;
  $("#topstat").innerHTML = `<b>${ids.length}</b>/${QS.length} tried<br><b>${pct}%</b> right now`;
}

function blockHTML(b){
  if (b.k==="p") return `<div class="plain"><p>${b.h}</p></div>`;
  if (b.k==="trick") return `<div class="trick"><span class="lab">Trick</span>${b.h}</div>`;
  if (b.k==="link") return `<div class="link"><span class="lab">Link · connect the sports</span>${b.h}</div>`;
  if (b.k==="q") { const perm = shuffle(b.o.map((_,i)=>i)); return `<div class="icheck" data-ic><span class="lab">Quick check</span><p class="qt">${esc(b.q)}</p><div class="opts">${perm.map((oi,k)=>`<button type="button" class="opt" data-ioi="${oi}"><span class="k">${"ABCD"[k]}</span><span>${esc(b.o[oi])}</span></button>`).join("")}</div><div class="exp" hidden><b class="okl"></b> ${esc(b.e)}</div></div>`; }
  if (b.k==="trap") return `<div class="trap"><span class="lab">Trap · correction</span>${b.h}</div>`;
  if (b.k==="facts") return `<div class="block"><h3>${b.title}</h3><dl class="facts">${b.rows.map(r=>`<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join("")}</dl></div>`;
  if (b.k==="tl") return `<div class="block"><h3>${b.title}</h3><ul class="tl">${b.rows.map(r=>`<li><span class="y">${r[0]}</span><span>${r[1]}</span></li>`).join("")}</ul></div>`;
  if (b.k==="table") {
    const isNum = (ci) => b.numcol==="all" ? ci>0 : (b.numcol===1 && ci===1) || (typeof b.numcol==="string" && b.numcol.includes(String(ci)));
    return `<div class="block"><h3>${b.title}</h3><div class="tbl"><table><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map((c,ci)=>`<td class="${isNum(ci)?"n":""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  }
  if (b.k==="fig") return `<div class="block"><h3>${b.title}</h3><figure class="fig">${b.svg}<figcaption>${b.cap}</figcaption></figure></div>`;
  if (b.k==="pyr") return `<div class="block"><h3>${b.title}</h3><div class="pyr">${b.items.map(it=>`<div>${PYR(it.rows)}<b>${it.name}</b><span class="muted">${it.note}</span></div>`).join("")}</div><p class="muted" style="font-size:13px;margin-top:8px"><span style="color:var(--blue)">■</span> males · <span style="color:var(--accent)">■</span> females · top = old, base = young</p></div>`;
  return "";
}

    <span class="eyebrow">Lesson ${i} of ${LESSONS.length} · ${l.hi}</span><h1>${esc(l.title)}</h1>
    <div class="steps" role="tablist">
      <button type="button" data-step="learn" aria-current="${step==="learn"?"step":"false"}">1 · Learn</button>
      <button type="button" data-step="quiz" aria-current="${step==="quiz"?"step":"false"}">2 · Quiz</button>
      <button type="button" data-step="sum" aria-current="${step==="sum"?"step":"false"}">3 · Summary</button>
    </div>`;
  let body = "";
  if (step === "learn") {
    body = `<div class="stack">${l.blocks.map(blockHTML).join("")}
      <div class="row end"><button class="btn pri" type="button" id="toquiz">Take the lesson quiz · ${byLesson(id).length} questions</button></div></div>`;
  } else if (step === "quiz") {
    body = `<div id="lq"></div>`;
  } else {
    const nxt = LESSONS[i];
    body = `<div class="stack"><div class="block"><h3>Remember these</h3><ul class="sum">${l.sum.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
      <div class="row between"><button class="btn" type="button" id="relearn">Read again</button>
      ${nxt ? `<button class="btn pri" type="button" id="nextles">Next: ${esc(nxt.title)}</button>` : `<button class="btn pri" type="button" id="tomock">Take a mock test</button>`}</div></div>`;
    S.les[id] = Object.assign(S.les[id]||{}, {done:1}); save();
  }
  $("#app").innerHTML = `<section class="view stack">${head}${body}</section>`;
  $("#lback").onclick = () => renderLearn();
  $("#app").querySelectorAll("[data-step]").forEach(b => b.onclick = () => openLesson(id, b.dataset.step));
  if (step==="learn") { $("#toquiz").onclick = () => openLesson(id,"quiz");
    const ics = l.blocks.filter(b=>b.k==="q");
    $("#app").querySelectorAll("[data-ic]").forEach((box,n) => { const b = ics[n];
      box.querySelectorAll("[data-ioi]").forEach(btn => btn.onclick = () => {
        if (box.dataset.done) return; box.dataset.done = 1; const pick = +btn.dataset.ioi;
        box.querySelectorAll("[data-ioi]").forEach(x => { const oi=+x.dataset.ioi; x.disabled = true; if (oi===0) x.classList.add("ok"); else if (oi===pick) x.classList.add("no"); });
        const ex = box.querySelector(".exp"); ex.hidden = false; const lab = ex.querySelector("b");
        if (pick===0) { lab.textContent = "Correct."; } else { lab.className = "nol"; lab.textContent = "Answer: " + b.o[0] + "."; }
      }); }); }
  if (step==="quiz") renderLQ();
  if (step==="sum") {
    $("#relearn").onclick = () => openLesson(id,"learn");
    const n = $("#nextles"); if (n) n.onclick = () => openLesson(LESSONS[i].id,"learn");
    const m = $("#tomock"); if (m) m.onclick = () => go("mock");
  }
  window.scrollTo(0,0);
}

function optsHTML(q, perm, state){
  // state: {picked: originalIndex|null, reveal: bool, sel: originalIndex|null}
  return perm.map((oi, k) => {
    let cls = "opt";
    if (state.reveal) { if (oi === q.a) cls += " ok"; else if (oi === state.picked) cls += " no"; }
    else if (state.sel === oi) cls += " sel";
    return `<button type="button" class="${cls}" data-oi="${oi}" ${state.reveal?"disabled":""}><span class="k">${"ABCD"[k]}</span><span>${esc(q.o[oi])}</span></button>`;
  }).join("");
}
function expHTML(q, picked){
  const ok = picked === q.a;
  return `<div class="exp">${ok ? `<b class="okl">Correct.</b>` : `<b class="nol">Answer: ${esc(q.o[q.a])}.</b>`} ${esc(q.e)}</div>`;
}
function metaHTML(q, no){
  return `<div class="qmeta"><span class="qno">${no}</span><span class="tag">L${LNUM(q.t)} · ${esc(L(q.t).title)}</span>${q.p?`<span class="tag pyq">Exam-asked</span>`:""}
  <button type="button" class="bm" data-bm="${q.id}" aria-pressed="${S.bm[q.id]?"true":"false"}" aria-label="Bookmark">${S.bm[q.id]?"★":"☆"}</button></div>`;
}

function renderLQ(){
  const box = $("#lq");
  if (LQ.i >= LQ.list.length) {
    const n = LQ.list.length, l = L(LQ.id);
    const st = S.les[LQ.id] || {}; st.best = Math.max(st.best||0, LQ.score); S.les[LQ.id] = st; save();
    box.innerHTML = `<div class="stack"><div class="block stack"><span class="eyebrow">Quiz done</span>
      <div class="scorebig"><span class="num">${LQ.score}</span><span class="muted">/ ${n} correct</span></div>
      <p class="muted">${LQ.score===n ? "Full marks." : LQ.score >= n*0.8 ? "Strong. Review the ones you missed in Practice → Mistakes." : "Read the lesson once more, then retry. Missed questions are saved under Practice → Mistakes."}</p></div>
      <div class="row between"><button class="btn" type="button" id="retry">Retry quiz</button><button class="btn pri" type="button" id="tosum">See summary</button></div></div>`;
    $("#retry").onclick = () => openLesson(LQ.id,"quiz");
    $("#tosum").onclick = () => openLesson(LQ.id,"sum");
    return;
  }
  const it = LQ.list[LQ.i], q = it.q;
  const reveal = LQ.picked !== null;
  box.innerHTML = `<div class="stack"><div class="meter"><i style="width:${LQ.i/LQ.list.length*100}%"></i></div>
    <article class="qcard">${metaHTML(q, `Q${LQ.i+1}/${LQ.list.length}`)}
    <p class="qt">${esc(q.q)}</p><div class="opts">${optsHTML(q, it.perm, {picked:LQ.picked, reveal})}</div>
    ${reveal ? expHTML(q, LQ.picked) : ""}</article>
    ${reveal ? `<div class="row end"><button class="btn pri" type="button" id="lqnext">${LQ.i+1 < LQ.list.length ? "Next question" : "Finish"}</button></div>` : `<p class="muted" style="font-size:13px">Score so far: <span class="num">${LQ.score}</span></p>`}</div>`;
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (LQ.picked !== null) return;
    LQ.picked = +b.dataset.oi; const ok = LQ.picked === q.a; if (ok) LQ.score++; record(q, ok); renderLQ();
  });
  bindBM(box);
  const nx = $("#lqnext"); if (nx) nx.onclick = () => { LQ.i++; LQ.picked = null; renderLQ(); window.scrollTo(0,0); };
}

function bindBM(root){
  root.querySelectorAll("[data-bm]").forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    const id = b.dataset.bm; if (S.bm[id]) delete S.bm[id]; else S.bm[id] = 1; save();
    b.setAttribute("aria-pressed", S.bm[id] ? "true":"false"); b.textContent = S.bm[id] ? "★" : "☆";
  });
}

/* ============================================================
   PRACTICE
   ============================================================ */
let PF = "all", PSHOW = 20, PORDER = null, PPERM = {}, PPICK = {};
function practiceList(){
  let list = QS;
  if (PF === "pyq") list = QS.filter(q => q.p);
  else if (PF === "wrong") list = QS.filter(q => S.ans[q.id] === 0);
  else if (PF === "new") list = QS.filter(q => S.ans[q.id] === undefined);
  else if (PF === "bm") list = QS.filter(q => S.bm[q.id]);
  else if (PF !== "all") list = QS.filter(q => q.t === PF);
  if (PORDER) { const pos = new Map(PORDER.map((id,i)=>[id,i])); list = list.slice().sort((a,b)=>(pos.get(a.id)??0)-(pos.get(b.id)??0)); }
  return list;
}
function renderPractice(){
  const wrongN = QS.filter(q => S.ans[q.id] === 0).length, bmN = QS.filter(q=>S.bm[q.id]).length, pyqN = QS.filter(q=>q.p).length;
  const chips = [["all",`All ${QS.length}`],["new","Not tried"],["wrong",`Mistakes ${wrongN}`],["pyq",`Exam-asked ${pyqN}`],["bm",`Starred ${bmN}`]].concat(LESSONS.map((l,i)=>[l.id,`L${i+1} ${l.title}`]));
  const list = practiceList();
  $("#app").innerHTML = `<section class="view stack">
    <div class="stack" style="gap:6px"><span class="eyebrow">Question bank</span><h1>Practice</h1>
    <p class="muted">Tap an option to check it. Wrong answers go to <b>Mistakes</b> until you get them right.</p></div>
    <div class="chips" role="group" aria-label="Filter">${chips.map(c=>`<button type="button" class="chip" data-f="${c[0]}" aria-pressed="${PF===c[0]}">${esc(c[1])}</button>`).join("")}</div>
    <div class="row between"><span class="muted num" style="font-size:13px">${list.length} questions</span>
      <div class="row"><button class="btn sm ghost" type="button" id="pshuf">${PORDER?"In order":"Shuffle"}</button></div></div>
    <div class="stack" id="plist"></div>
  </section>`;
  $("#app").querySelectorAll("[data-f]").forEach(b => b.onclick = () => { PF = b.dataset.f; PSHOW = 20; PPICK = {}; renderPractice(); });
  $("#pshuf").onclick = () => { PORDER = PORDER ? null : shuffle(QS.map(q=>q.id)); PSHOW = 20; renderPractice(); };
  const chipOn = $(`.chip[aria-pressed="true"]`); if (chipOn) chipOn.scrollIntoView({block:"nearest", inline:"center"});
  drawPList();
}
function pCard(q, idx){
  if (!PPERM[q.id]) PPERM[q.id] = makePerm(q);
  const picked = PPICK[q.id]; const reveal = picked !== undefined;
  return `<article class="qcard" data-q="${q.id}">${metaHTML(q, "Q"+(idx+1))}<p class="qt">${esc(q.q)}</p>
    <div class="opts">${optsHTML(q, PPERM[q.id], {picked: reveal?picked:null, reveal})}</div>${reveal?expHTML(q,picked):""}</article>`;
}
function drawPList(){
  const list = practiceList(), box = $("#plist");
  if (!list.length) { box.innerHTML = `<p class="empty">${PF==="wrong"?"No mistakes saved. Answer some questions first, or you've cleared them all.":PF==="bm"?"Nothing starred yet. Tap ☆ on any question.":"Nothing here."}</p>`; return; }
  box.innerHTML = list.slice(0, PSHOW).map((q,i)=>pCard(q,i)).join("") + (list.length > PSHOW ? `<button class="btn" type="button" id="pmore">Show 20 more (${list.length-PSHOW} left)</button>` : "");
  bindP(box);
  const more = $("#pmore"); if (more) more.onclick = () => { PSHOW += 20; drawPList(); };
}
function bindP(box){ box.querySelectorAll(".qcard").forEach(bindCard); }
function bindCard(card){
  card.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const q = QS.find(x => x.id === card.dataset.q); if (PPICK[q.id] !== undefined) return;
    PPICK[q.id] = +b.dataset.oi; record(q, PPICK[q.id] === q.a);
    const idx = +card.querySelector(".qno").textContent.slice(1) - 1;
    const tmp = document.createElement("div"); tmp.innerHTML = pCard(q, idx); const nc = tmp.firstElementChild;
    card.replaceWith(nc); bindCard(nc);
  });
  bindBM(card);
}

   ============================================================ */
let M = null, MCFG = {n:25, scope:"all", neg:1}, LEAVE_TO = null;
function renderMock(){
  if (M && M.running) return drawMockRun();
  if (M && M.done) return drawMockResult();
  const hist = (S.mocks||[]).slice(-6).reverse();
  $("#app").innerHTML = `<section class="view stack">
    <div class="stack" style="gap:6px"><span class="eyebrow">Timed, SSC pattern</span><h1>Mock test</h1>
    <p class="muted">+2 for a right answer, −0.5 for a wrong one, 36 seconds per question (CGL Tier-1 pace). Answers show only after you submit.</p></div>
    <div class="block stack">
      <fieldset><legend>Questions</legend><div class="radios">${[10,25,50,100].map(n=>`<label><input type="radio" name="mn" id="mn${n}" value="${n}" ${MCFG.n===n?"checked":""}><span>${n} · ${Math.round(n*36/60)} min</span></label>`).join("")}</div></fieldset>
      <fieldset><legend>From</legend><select id="mscope" aria-label="Lessons to draw from"><option value="all">All lessons</option><option value="pyq">Exam-asked only</option><option value="wrong">My mistakes</option>${LESSONS.map((l,i)=>`<option value="${l.id}" ${MCFG.scope===l.id?"selected":""}>L${i+1} · ${esc(l.title)}</option>`).join("")}</select></fieldset>
      <label class="row" style="gap:8px;font-weight:600"><input type="checkbox" id="mneg" ${MCFG.neg?"checked":""}> Negative marking (−0.5)</label>
      <div id="merr" class="muted" style="font-size:14px"></div>
      <div class="row end"><button class="btn pri" type="button" id="mstart">Start test</button></div>
    </div>
    ${hist.length ? `<div class="block"><h3>Recent attempts</h3><div class="hist">${hist.map(h=>`<div><span>${esc(h.d)} · ${h.n} Q</span><span class="num">${h.score}/${h.max} · ${h.acc}%</span></div>`).join("")}</div></div>` : ""}
  </section>`;
  $("#mscope").value = MCFG.scope;
  $("#mstart").onclick = () => {
    MCFG.n = +(document.querySelector('input[name="mn"]:checked')||{value:25}).value;
    MCFG.scope = $("#mscope").value; MCFG.neg = $("#mneg").checked ? 1 : 0;
    let pool = MCFG.scope==="all" ? QS : MCFG.scope==="pyq" ? QS.filter(q=>q.p) : MCFG.scope==="wrong" ? QS.filter(q=>S.ans[q.id]===0) : QS.filter(q=>q.t===MCFG.scope);
    if (!pool.length) { $("#merr").textContent = "No questions in that set yet. Pick another source."; return; }
    const qs = shuffle(pool).slice(0, MCFG.n);
    M = { running:true, list: qs.map(q=>({q, perm:makePerm(q)})), ans: qs.map(()=>null), mark: qs.map(()=>false), i:0, neg:MCFG.neg, secs: qs.length*36, start: Date.now(), showPal:false, confirm:false };
    M.end = M.start + M.secs*1000;
    startTimer(); drawMockRun();
  };
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(() => {
    if (!M || !M.running) { clearInterval(timerId); return; }
    const left = Math.max(0, Math.round((M.end - Date.now())/1000));
    const el = $("#mtime"); if (el) { el.textContent = fmt(left); el.classList.toggle("low", left <= 60); }
    if (left <= 0) submitMock();
  }, 1000);
}
const fmt = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
function drawMockRun(){
  const it = M.list[M.i], q = it.q, left = Math.max(0, Math.round((M.end-Date.now())/1000));
  const answered = M.ans.filter(a=>a!==null).length;
  $("#app").innerHTML = `<section class="view stack">
    <div class="mbar"><span class="timer num ${left<=60?"low":""}" id="mtime">${fmt(left)}</span>
      <span class="muted num" style="font-size:13px;flex:1">Q ${M.i+1}/${M.list.length} · ${answered} answered</span>
      <button class="btn sm" type="button" id="mpal">${M.showPal?"Hide":"All Qs"}</button></div>
    ${LEAVE_TO ? `<div class="confirm"><b>Leave the test?</b><span>Your answers so far will be scored now.</span><div class="row"><button class="btn sm pri" type="button" id="lvy">Submit and leave</button><button class="btn sm" type="button" id="lvn">Stay</button></div></div>` : ""}
    ${M.showPal ? `<div class="block"><div class="pal">${M.list.map((_,k)=>`<button type="button" data-j="${k}" class="${M.ans[k]!==null?"a":""} ${M.mark[k]?"m":""} ${k===M.i?"cur":""}" aria-label="Question ${k+1}">${k+1}</button>`).join("")}</div>
      <p class="muted" style="font-size:12px;margin-top:8px">Filled = answered · orange line = marked for review</p></div>` : ""}
    <article class="qcard"><div class="qmeta"><span class="qno">Q${M.i+1}</span><span class="tag">L${LNUM(q.t)}</span>${M.mark[M.i]?`<span class="tag pyq">Marked</span>`:""}</div>
      <p class="qt">${esc(q.q)}</p><div class="opts">${optsHTML(q, it.perm, {sel:M.ans[M.i], reveal:false})}</div></article>
    <div class="row between"><button class="btn" type="button" id="mprev" ${M.i===0?"disabled":""}>‹ Prev</button>
      <button class="btn ghost" type="button" id="mmark">${M.mark[M.i]?"Unmark":"Mark"}</button>
      <button class="btn ghost" type="button" id="mclr" ${M.ans[M.i]===null?"disabled":""}>Clear</button>
      <button class="btn ${M.i<M.list.length-1?"pri":""}" type="button" id="mnext" ${M.i===M.list.length-1?"disabled":""}>Next ›</button></div>
    ${M.confirm ? `<div class="confirm"><b>Submit the test?</b><span>${M.list.length-answered} unanswered${M.mark.filter(Boolean).length?`, ${M.mark.filter(Boolean).length} marked for review`:""}.</span><div class="row"><button class="btn sm pri" type="button" id="msubY">Submit</button><button class="btn sm" type="button" id="msubN">Keep going</button></div></div>`
      : `<button class="btn pri" type="button" id="msub">Submit test</button>`}
  </section>`;
  $("#app").querySelectorAll(".opt").forEach(b => b.onclick = () => { M.ans[M.i] = +b.dataset.oi; drawMockRun(); });
  $("#mprev").onclick = () => { if (M.i>0){M.i--; drawMockRun();} };
  $("#mnext").onclick = () => { if (M.i<M.list.length-1){M.i++; drawMockRun(); window.scrollTo(0,0);} };
  $("#mmark").onclick = () => { M.mark[M.i] = !M.mark[M.i]; drawMockRun(); };
  $("#mclr").onclick = () => { M.ans[M.i] = null; drawMockRun(); };
  $("#mpal").onclick = () => { M.showPal = !M.showPal; drawMockRun(); };
  $("#app").querySelectorAll("[data-j]").forEach(b => b.onclick = () => { M.i = +b.dataset.j; drawMockRun(); });
  const s = $("#msub"); if (s) s.onclick = () => { M.confirm = true; drawMockRun(); };
  const y = $("#msubY"); if (y) y.onclick = submitMock;
  const n = $("#msubN"); if (n) n.onclick = () => { M.confirm = false; drawMockRun(); };
  const lvy = $("#lvy"); if (lvy) lvy.onclick = () => { const t = LEAVE_TO; LEAVE_TO = null; submitMock(); go(t); };
  const lvn = $("#lvn"); if (lvn) lvn.onclick = () => { LEAVE_TO = null; drawMockRun(); };
}
function showMockLeave(tab){ LEAVE_TO = tab; drawMockRun(); }
function submitMock(){
  if (!M || !M.running) return;
  clearInterval(timerId);
  M.running = false; M.done = true; M.confirm = false;
  let c=0,w=0,sk=0; const per = {};
  M.list.forEach((it,k) => {
    const a = M.ans[k]; const t = it.q.t; per[t] = per[t] || {c:0,n:0}; per[t].n++;
    if (a===null) sk++; else if (a===it.q.a) { c++; per[t].c++; S.ans[it.q.id]=1; } else { w++; S.ans[it.q.id]=0; }
  });
  const max = M.list.length*2, score = +(c*2 - (M.neg? w*0.5 : 0)).toFixed(1);
  const used = Math.min(M.secs, Math.round((Date.now()-M.start)/1000));
  M.res = {c,w,sk,score,max,used,per, acc: (c+w) ? Math.round(c*100/(c+w)) : 0};
  const d = new Date(); const ds = d.toLocaleDateString("en-IN",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
  S.mocks = (S.mocks||[]).concat([{d:ds, n:M.list.length, score, max, acc:M.res.acc}]).slice(-20); save(); renderTop();
  M.filter = "wrong";
  if (TAB==="mock") drawMockResult();
}
function drawMockResult(){
  const r = M.res;
  const per = Object.keys(r.per).sort((a,b)=>LNUM(a)-LNUM(b)).map(t => `<div><span>L${LNUM(t)} · ${esc(L(t).title)}</span><span class="num">${r.per[t].c}/${r.per[t].n}</span></div>`).join("");
  const rows = M.list.map((it,k)=>({it,k})).filter(({it,k}) => M.filter==="all" ? true : M.filter==="wrong" ? (M.ans[k]!==null && M.ans[k]!==it.q.a) : M.ans[k]===null);
  $("#app").innerHTML = `<section class="view stack">
    <div class="stack" style="gap:6px"><span class="eyebrow">Result</span>
    <div class="scorebig"><span class="num">${r.score}</span><span class="muted">/ ${r.max} marks</span></div></div>
    <div class="kpis"><div class="kpi g"><span class="num">${r.c}</span><span>right</span></div><div class="kpi b"><span class="num">${r.w}</span><span>wrong</span></div><div class="kpi"><span class="num">${r.sk}</span><span>skipped</span></div><div class="kpi"><span class="num">${r.acc}%</span><span>accuracy</span></div></div>
    <p class="muted num" style="font-size:13px">Time used ${fmt(r.used)} of ${fmt(M.secs)}</p>
    <div class="block"><h3>By lesson</h3><div class="hist">${per}</div></div>
    <div class="row between"><button class="btn" type="button" id="mnew">New test</button><button class="btn pri" type="button" id="mretry">Retake same questions</button></div>
    <h2>Review</h2>
    <div class="chips">${[["wrong",`Wrong ${r.w}`],["skip",`Skipped ${r.sk}`],["all",`All ${M.list.length}`]].map(c=>`<button class="chip" type="button" data-rf="${c[0]}" aria-pressed="${M.filter===c[0]}">${c[1]}</button>`).join("")}</div>
    <div class="stack">${rows.length ? rows.map(({it,k}) => `<article class="qcard">${metaHTML(it.q, "Q"+(k+1))}<p class="qt">${esc(it.q.q)}</p><div class="opts">${optsHTML(it.q, it.perm, {picked:M.ans[k], reveal:true})}</div>${M.ans[k]===null?`<div class="exp"><b class="nol">Skipped. Answer: ${esc(it.q.o[it.q.a])}.</b> ${esc(it.q.e)}</div>`:expHTML(it.q, M.ans[k])}</article>`).join("") : `<p class="empty">Nothing in this list.</p>`}</div>
  </section>`;
  bindBM($("#app"));
  $("#app").querySelectorAll("[data-rf]").forEach(b => b.onclick = () => { M.filter = b.dataset.rf; drawMockResult(); });
  $("#mnew").onclick = () => { M = null; renderMock(); };
  $("#mretry").onclick = () => {
    const list = M.list.map(it=>({q:it.q, perm:makePerm(it.q)}));
    M = { running:true, list, ans:list.map(()=>null), mark:list.map(()=>false), i:0, neg:MCFG.neg, secs:list.length*36, start:Date.now(), showPal:false, confirm:false };
    M.end = M.start + M.secs*1000; startTimer(); drawMockRun();
  };
}

   ============================================================ */
let RV = "sheet", FC = null, FCSCOPE = "all", SPF = "all", HIDEV = 1, HIDEH = 0, CREV = {}, CORDER = null;
function sportChips(){ return `<div class="chips" role="group" aria-label="Sport">${[["all","All"],...SPORTS.map(s=>[s,s])].map(c=>`<button type="button" class="chip" data-sp="${esc(c[0])}" aria-pressed="${SPF===c[0]}">${esc(c[1])}</button>`).join("")}</div>`; }
function renderRevise(){
  const tabs = [["sheet","Dimension sheet"],["cover","Cover drill"],["players","Players & bodies"],["finder","Term & trophy finder"],["firsts","Firsts"],["nums","Numbers & pairs"],["ff","Full forms"],["links","Links"],["tricks","Tricks"],["traps","Traps"],["flash","Flashcards"]];
  if (!tabs.some(t=>t[0]===RV)) RV = "sheet";
  $("#app").innerHTML = `<section class="view stack">
    <div class="stack" style="gap:6px"><span class="eyebrow">Last-day revision</span><h1>Revise</h1></div>
    <div class="seg" role="tablist">${tabs.map(t=>`<button type="button" role="tab" data-rv="${t[0]}" aria-selected="${RV===t[0]}">${t[1]}</button>`).join("")}</div>
    <div id="rv" class="stack"></div></section>`;
  $("#app").querySelectorAll("[data-rv]").forEach(b => b.onclick = () => { RV = b.dataset.rv; renderRevise(); });
  const on = $(`.seg [aria-selected="true"]`); if (on) on.scrollIntoView({block:"nearest", inline:"center"});
  const box = $("#rv");
  const bindSp = () => box.querySelectorAll("[data-sp]").forEach(b => b.onclick = () => { SPF = b.dataset.sp; CORDER = null; renderRevise(); });
  if (RV === "sheet") {
    const g = SPORTS.filter(s => SPF==="all" || s===SPF);
    box.innerHTML = `<p class="muted">Every measurement from the lectures, grouped by sport. Read it once in the morning and once at night — the hooks tie look-alike numbers together.</p>${sportChips()}
      <div class="pubs">${g.map(s=>`<div class="block"><h3>${esc(s)}</h3><ul class="plist">${DIMS.filter(d=>d[0]===s).map(d=>`<li><span class="dl"><b>${esc(d[1])}</b><em class="num">${esc(d[2])}</em></span>${d[3]?`<span>${esc(d[3])}</span>`:""}</li>`).join("")}</ul></div>`).join("")}</div>`;
    bindSp();
  }
  if (RV === "cover") {
    const base = DIMS.map((d,i)=>i).filter(i => SPF==="all" || DIMS[i][0]===SPF);
    const order = CORDER || base;
    box.innerHTML = `<p class="muted">Cover mode: say the number aloud, then tap to check. Shuffle to break the order you memorised.</p>${sportChips()}
      <div class="chips" role="group" aria-label="Options"><button type="button" class="chip" id="chv" aria-pressed="${!!HIDEV}">Hide value</button><button type="button" class="chip" id="chh" aria-pressed="${!!HIDEH}">Hide hook</button>
      <button type="button" class="chip" id="cshuf">${CORDER?"In order":"Shuffle rows"}</button><button type="button" class="chip" id="creset">Cover all again</button></div>
      <div class="block"><div class="tbl"><table class="cover"><thead><tr><th>Sport · item</th><th>Value</th><th>Hook</th></tr></thead><tbody>${order.map(k=>{ const d = DIMS[k];
        const cell = (col, v, hid, lbl) => (hid && !CREV[k+col] && v) ? `<td data-l="${lbl}"><button type="button" class="peek" data-peek="${k+col}" aria-label="Show ${lbl}">tap</button></td>` : `<td data-l="${lbl}">${esc(v||"—")}</td>`;
        return `<tr><td><b>${esc(d[1])}</b> <span class="muted" style="font-size:13px">· ${esc(d[0])}</span></td>${cell("v",d[2],HIDEV,"Value")}${cell("h",d[3],HIDEH,"Hook")}</tr>`; }).join("")}</tbody></table></div></div>`;
    bindSp();
    box.querySelectorAll("[data-peek]").forEach(b => b.onclick = () => { CREV[b.dataset.peek] = 1; renderRevise(); });
    $("#chv").onclick = () => { HIDEV = HIDEV?0:1; renderRevise(); };
    $("#chh").onclick = () => { HIDEH = HIDEH?0:1; renderRevise(); };
    $("#cshuf").onclick = () => { CORDER = CORDER ? null : shuffle(base.slice()); renderRevise(); };
    $("#creset").onclick = () => { CREV = {}; renderRevise(); };
  }
  if (RV === "players") {
    const rows = PLAYERS.slice().sort((a,b)=>(+a[1])-(+b[1]));
    box.innerHTML = `<p class="muted">Count up the ladder: 5 basketball → 6 volleyball → 7 handball / kabaddi → 9 kho-kho / baseball → 11 cricket, football, hockey → 15 rugby.</p>
      <div class="block"><div class="tbl"><table><thead><tr><th>Sport</th><th>On field</th><th>Body</th><th>Note</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td class="n num">${esc(r[1])}</td><td>${esc(r[3])}</td><td class="muted">${esc(r[2])}</td></tr>`).join("")}</tbody></table></div></div>`;
  }
  if (RV === "finder") {
    box.innerHTML = `<input class="search" id="tfs" type="search" placeholder="Search a term, trophy or sport (e.g. lona, Uber, golf)" aria-label="Search terms and trophies">
      <div class="block"><h3>Trophies</h3><dl class="rk" id="tfc"></dl></div>
      <div class="block"><h3>Terms</h3><dl class="rk" id="tft"></dl></div>`;
    const draw = () => {
      const q = $("#tfs").value.trim().toLowerCase(), f = r => !q || r.join(" ").toLowerCase().includes(q);
      const c = CUPS.filter(f), t = TERMS.filter(f);
      $("#tfc").innerHTML = c.length ? c.map(r=>`<div><dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd></div>`).join("") : `<p class="muted">No trophy matches.</p>`;
      $("#tft").innerHTML = t.length ? t.map(r=>`<div><dt>${esc(r[1])}</dt><dd>${esc(r[0])}</dd></div>`).join("") : `<p class="muted">No term matches.</p>`;
    };
    $("#tfs").oninput = draw; draw();
  }
  if (RV === "firsts") {
    box.innerHTML = `<p class="muted">“Who was the first…” is a favourite SSC pattern. Cover the name, read the feat, recall.</p>
      <div class="block"><dl class="rk">${FIRSTS.map(r=>`<div><dt>${esc(r[0])}</dt><dd><b style="color:var(--ink)">${esc(r[1])}</b> · ${esc(r[2])} <span class="muted num" style="font-size:12px">· L${LNUM(r[3])}</span></dd></div>`).join("")}</dl></div>`;
  }
  if (RV === "ff") {
    box.innerHTML = `<input class="search" id="ffs" type="search" placeholder="Search a short form" aria-label="Search full forms"><div class="block"><dl class="rk" id="ffl"></dl></div>`;
    const draw = () => { const q=$("#ffs").value.trim().toLowerCase(); const r=FULLFORMS.filter(f=>!q||f.join(" ").toLowerCase().includes(q));
      $("#ffl").innerHTML = r.length ? r.map(f=>`<div><dt><b style="color:var(--ink)">${esc(f[0])}</b></dt><dd>${esc(f[1])}</dd></div>`).join("") : `<p class="muted">No match.</p>`; };
    $("#ffs").oninput = draw; draw();
  }
  if (RV === "links") {
    const items = LESSONS.flatMap((l,i) => l.blocks.filter(b=>b.k==="link").map(b=>({l:i+1, t:l.title, h:b.h})));
    box.innerHTML = items.map(x => `<div class="link"><span class="lab">L${x.l} · ${esc(x.t)}</span>${x.h}</div>`).join("");
  }
  if (RV === "nums") {
    box.innerHTML = `<div class="tiles">${TILES.map(t=>`<div class="tile"><span class="num">${t[0]}</span><span>${t[1]}</span></div>`).join("")}</div>
    <div class="block"><h3>Confusing pairs</h3><dl class="rk">${PAIRS.map(p=>`<div><dt>${esc(p[0])}</dt><dd>${esc(p[1])}</dd></div>`).join("")}</dl></div>`;
  }
  if (RV === "tricks" || RV === "traps") {
    const kind = RV==="tricks" ? "trick" : "trap";
    const items = LESSONS.flatMap((l,i) => l.blocks.filter(b=>b.k===kind).map(b=>({l:i+1, t:l.title, h:b.h})));
    box.innerHTML = items.map(x => `<div class="${kind}"><span class="lab">L${x.l} · ${esc(x.t)}</span>${x.h}</div>`).join("");
  }
  if (RV === "flash") drawFlash(box);
}
function drawFlash(box){
  if (!FC) { const pool = FCSCOPE==="all" ? QS : FCSCOPE==="wrong" ? QS.filter(q=>S.ans[q.id]===0) : QS.filter(q=>q.t===FCSCOPE); FC = {list: shuffle(pool), i:0, flip:false, known:0}; }
  const sel = `<select id="fcs" aria-label="Flashcard set"><option value="all">All questions</option><option value="wrong">My mistakes</option>${LESSONS.map((l,i)=>`<option value="${l.id}">L${i+1} · ${esc(l.title)}</option>`).join("")}</select>`;
  if (!FC.list.length || FC.i >= FC.list.length) {
    box.innerHTML = `<div class="row">${sel}</div><div class="block stack"><h3>${FC.list.length ? "Deck finished" : "No cards in this set"}</h3>${FC.list.length?`<p class="muted">You knew ${FC.known} of ${FC.list.length} on first look.</p>`:""}<div class="row"><button class="btn pri" type="button" id="fcr">Shuffle and restart</button></div></div>`;
    $("#fcs").value = FCSCOPE; $("#fcs").onchange = e => { FCSCOPE = e.target.value; FC = null; drawFlash(box); };
    $("#fcr").onclick = () => { FC = null; drawFlash(box); }; return;
  }
  const q = FC.list[FC.i];
  box.innerHTML = `<div class="row between">${sel}<span class="muted num" style="font-size:13px">${FC.i+1}/${FC.list.length}</span></div>
    <button type="button" class="flash" id="fcard" aria-label="Flip card">
      <span class="side">${FC.flip?"Answer":"Question · tap to flip"}</span>
      <span class="front">${esc(q.q)}</span>
      ${FC.flip ? `<span class="ans">${esc(q.o[q.a])}</span><span class="muted">${esc(q.e)}</span>` : ""}
    </button>
    <div class="row between"><button class="btn" type="button" id="fca" ${FC.flip?"":"disabled"}>Again later</button><button class="btn pri" type="button" id="fck" ${FC.flip?"":"disabled"}>Got it</button></div>`;
  $("#fcs").value = FCSCOPE; $("#fcs").onchange = e => { FCSCOPE = e.target.value; FC = null; drawFlash(box); };
  $("#fcard").onclick = () => { FC.flip = !FC.flip; drawFlash(box); };
  $("#fca").onclick = () => { FC.list.push(q); FC.list.splice(FC.i,1); FC.flip=false; drawFlash(box); };
  $("#fck").onclick = () => { FC.known++; FC.i++; FC.flip=false; drawFlash(box); };
}

/* boot */
renderTop();
const start = (location.hash||"").replace("#","");
go(["learn","practice","mock","revise"].includes(start) ? start : "learn");
</script>

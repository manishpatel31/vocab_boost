<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>

<title>Mensuration 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: Physics PYQ Workbook — follows the शब्दRegister Paper / Indigo look; one column + bottom tabs on phones, sidebar on PC. */
:root{
  --paper:#f6f3ea; --sheet:#fffdf7; --sunk:#ebe6d8;
  --ink:#1d2a22; --ink2:#56625a; --rule:#dcd5c3;
  --blue:#1f5c3d; --on-blue:#ffffff; --blue-bg:#dcebdf;
  --accent:#b4530f; --accent-bg:#fbe7d3;
  --good:#1b7547; --good-bg:#dff1e6; --bad:#b0271f; --bad-bg:#f8e1de;
  --warn-bg:#fff2d2;
  --f-display:"Fraunces", "Tiro Devanagari Hindi", Georgia, serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap{border-radius:var(--r);padding:12px 14px 12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.trick .lab,.trap .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.rk div{grid-template-columns:minmax(0,48%) minmax(0,1fr)}
.rk dd{min-width:0;overflow-wrap:anywhere}
.hot{border-radius:var(--r);padding:12px 14px;background:var(--warn-bg,var(--accent-bg));border-left:4px solid var(--warn,var(--accent))}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--warn,var(--accent))}
.heatb{display:inline-block;font-size:11px;letter-spacing:-.1em;margin-left:6px;vertical-align:1px}
.heat{display:flex;flex-direction:column;gap:2px}
.hrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(60px,1fr) 44px;gap:10px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:9px 2px;color:inherit;font:inherit;cursor:pointer}
.hrow:last-child{border-bottom:0}
.hrow .ht{display:flex;flex-direction:column;min-width:0}
.hrow .ht .muted{font-size:12px}
.hbar{height:10px;border-radius:5px;background:var(--rule);overflow:hidden}
.hbar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hp{text-align:right;font-weight:700}

.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.pyr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pyr div{text-align:center;font-size:13px}
.pyr b{display:block;font-size:14px}
.pm{fill:var(--blue)} .pf{fill:var(--accent)}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.pal button.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.pal button.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.rk{display:grid;gap:0}
.rk div{display:grid;grid-template-columns:minmax(0,48%) 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:15px}
.rk div:first-child{border-top:0}
.rk dt{font-size:13px;color:var(--ink2);margin:0}
.rk dt.up{color:var(--good)} .rk dt.dn{color:var(--bad)}
.rk dd{margin:0;font-weight:600;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:24px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.gbar{display:grid;grid-template-columns:78px 1fr 52px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.gbar .tr{height:12px;background:var(--sunk);border-radius:3px;position:relative;overflow:hidden}
.gbar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:3px}
.gbar .tr i.neg{background:var(--bad)}
.gbar .v{font-family:var(--f-num);text-align:right}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
@media (prefers-reduced-motion: no-preference){ .opt,.chip,.btn{transition:background-color .15s, border-color .15s} }
.link{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px}
.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.icheck{background:var(--sheet);border:1.5px dashed var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.icheck .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.cat{font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;white-space:nowrap}
.cat.CS{background:var(--blue-bg);color:var(--blue)} .cat.CSS{background:var(--accent-bg);color:var(--accent)} .cat.ST{background:var(--sunk);color:var(--ink)} .cat.OT{background:var(--sunk);color:var(--ink2)}

/* ---- workbook additions ---- */
table.cover td:nth-child(4){min-width:180px}
.plist .dl{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.plist .dl em{font-style:normal;font-weight:700;color:var(--blue);text-align:right}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--rule)}
.ladder li{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--rule)}
.ladder .rk-n{font-size:22px;font-weight:600;color:var(--blue);text-align:right}
.ladder .rk-t{min-width:0}
.ladder .rk-t b{display:block;line-height:1.3}
.ladder .rk-t span{font-size:13px;color:var(--ink2)}
.ladder .rk-d{font-weight:700;font-size:14px;white-space:nowrap}
.ladder li.up .rk-d{color:var(--good)} .ladder li.dn .rk-d{color:var(--bad)}
.ladder small{font-weight:600;color:var(--ink2)}
table.cover td{min-width:90px}
.peek{border:1.5px dashed var(--blue);background:var(--blue-bg);color:var(--blue);border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer;min-height:36px;width:100%}
.pubs{display:grid;gap:12px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.plist li{padding:7px 0;border-top:1px dashed var(--rule);display:grid;gap:1px}
.plist li:first-child{border-top:0}
.plist li span{font-size:13px;color:var(--ink2)}
.seg{scroll-snap-type:x proximity}
@media (max-width: 700px){
  table.cover thead{display:none}
  table.cover tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--rule)}
  table.cover td{border:0;padding:0;min-width:0;font-size:14px}
  table.cover td:first-child{grid-column:1/-1;font-size:15px}
  table.cover td:nth-child(4){grid-column:1/-1;min-width:0}
  table.cover td[data-l]::before{content:attr(data-l);display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
}
/* ---- maths blocks ---- */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:10px}
.fcard{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:var(--r);padding:10px 12px;display:grid;gap:4px;min-width:0}
.fcard .fn{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.fcard .fx{font-family:var(--f-num);font-size:16px;color:var(--ink);overflow-wrap:anywhere;line-height:1.45}
.fcard .fnote{font-size:13px;color:var(--ink2)}
.ex{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.ex .exhead .lab{display:inline;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:700}
.ex .src{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:700;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:0 8px}
.ex .exq{font-weight:600}
.ex details summary{cursor:pointer;font-weight:700;color:var(--blue);list-style:none}
.ex details summary::-webkit-details-marker{display:none}
.ex details summary::before{content:'▸ '}
.ex details[open] summary::before{content:'▾ '}
.ex ol{margin:8px 0 0;padding-left:20px;display:grid;gap:4px}
.ex .exans{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--good-bg);color:var(--good);font-weight:700}
.figwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:12px}
.figwrap figure{margin:0;display:grid;gap:6px;justify-items:center;text-align:center}
.fig svg,.figwrap svg{width:100%;max-width:340px;height:auto;color:var(--ink)}
.fig figcaption,.figwrap figcaption{font-size:13px;color:var(--ink2)}
sup,sub{font-size:.72em;line-height:0}

], sum:["Sphere: 4πr², (4/3)πr³","Hemisphere: CSA 2πr², TSA 3πr², V (2/3)πr³","Shell: (4/3)π(R³ − r³)","V ÷ SA = r/3 for sphere and hemisphere (CSA)","Sphere : circumscribed cylinder volume = 2 : 3"]},
{ id:"L5", heat:2, title:"Frustum of a cone", hi:"शंकु का छिन्नक", blocks:[
 {k:"hot", h:"<b>Tier 1:</b> about one question in every few shifts — direct volume of a frustum or bucket, or “a cone is cut parallel to its base, find the ratio of volumes”. <b>Tier 2:</b> frustum CSA/TSA with slant height, buckets in litres, and cone cut into 3 parts."},
 {k:"formula", title:"Frustum (radii R and r, height h)", rows:[["Slant height","l = √(h² + (R − r)²)","Right triangle with legs h and R − r"],["Volume","V = (πh/3)(R² + r² + Rr)","Big cone − small cone"],["Curved surface area","CSA = π(R + r)l",""],["Total surface area","π(R + r)l + πR² + πr²","Closed both ends"],["Bucket (open top)","π(R + r)l + πr²","Only the bottom is closed"]]},
 {k:"formula", title:"Cone cut parallel to its base", rows:[["Small cone ∼ whole cone","r/R = h/H = l/L","Similar cones"],["Volume ratio","(h/H)³","Cut at half height ⇒ 1/8"],["CSA ratio","(h/H)²","Cut at half height ⇒ 1/4"],["Small cone : frustum","k³ : (1 − k³) where k = h/H","½ ⇒ 1 : 7; ⅓ ⇒ 1 : 26"]]},
 {k:"figs", title:"Frustum and the cone it comes from", items:[
  {svg:'<svg viewBox="0 0 220 180" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M70 40 L35 150 A75 18 0 0 0 185 150 L150 40" style="fill:var(--accent-bg)"/><path d="M35 150 A75 18 0 0 1 185 150" stroke-dasharray="4 3"/><ellipse cx="110" cy="40" rx="40" ry="10" style="fill:var(--accent-bg)"/><path d="M110 40 V150" stroke-dasharray="4 3"/><path d="M110 40 H150" style="stroke:var(--blue)"/><path d="M110 150 H185" style="stroke:var(--accent)"/><text x="126" y="25" fill="currentColor" stroke="none" style="fill:var(--blue)">r</text><text x="150" y="146" fill="currentColor" stroke="none" style="fill:var(--accent)">R</text><text x="114" y="100" fill="currentColor" stroke="none">h</text><text x="174" y="92" fill="currentColor" stroke="none">l</text></svg>', cap:"l² = h² + (R − r)²."},
  {svg:'<svg viewBox="0 0 220 185" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M110 15 L35 165 A75 16 0 0 0 185 165 Z"/><path d="M35 165 A75 16 0 0 1 185 165" stroke-dasharray="4 3"/><path d="M110 15 L80 75 H140 Z" style="fill:var(--accent-bg)"/><ellipse cx="110" cy="75" rx="30" ry="7" style="stroke:var(--accent)"/><path d="M110 15 V165" stroke-dasharray="4 3"/><path d="M196 15 V165" stroke-width="1"/><path d="M24 15 V75" stroke-width="1" style="stroke:var(--accent)"/><text x="10" y="50" fill="currentColor" stroke="none" style="fill:var(--accent)">h</text><text x="200" y="95" fill="currentColor" stroke="none">H</text><text x="120" y="70" fill="currentColor" stroke="none">r</text><text x="146" y="160" fill="currentColor" stroke="none">R</text><text x="104" y="10" fill="currentColor" stroke="none">V</text></svg>', cap:"Top cone ∼ whole cone: volumes in ratio (h/H)³."}]},
 {k:"ex", src:"SSC CGL 2022 · 12 Dec S2", q:"The radii of the ends of a frustum of a cone 7 cm high are 5 cm and 3 cm. Find its volume correct to one decimal place. (π = 22/7)", steps:["V = (πh/3)(R² + r² + Rr)","= (22/7)(7/3)(25 + 9 + 15) = (22/3)(49)"], ans:"359.3 cm³", tip:"h = 7 cancels the 7 of 22/7 — SSC chooses h = 7, 14, 21 for this."},
 {k:"ex", src:"SSC CGL 2025 · 19 Sep S1", q:"A conical bucket is cut at one-third of its height from the top. Ratio of the volumes of the two parts (top : bottom)?", steps:["Top cone is similar with scale k = 1/3","Top : whole = 1 : 27","Top : bottom = 1 : (27 − 1)"], ans:"1 : 26"},
 {k:"ex", q:"A cone of height 24 cm and base radius 10 cm is cut parallel to its base at half its height. Find the total surface area of the frustum.", steps:["Whole cone: l = 26. Frustum: R = 10, r = 5, slant = 13","CSA = π(10 + 5)(13) = 195π","TSA = 195π + 100π + 25π"], ans:"320π cm²"},
 {k:"trick", h:"<b>Cube trick for cuts:</b> cuts at heights k, 2k, 3k… from the apex give cone volumes 1 : 8 : 27 : 64…, so the slices are 1 : 7 : 19 : 37 (differences of cubes). For surface areas use squares: 1 : 3 : 5 : 7."},
 {k:"trap", h:"<b>“Cut at ⅓ of height from the top”</b> means the small cone has height H/3 — ratio 1 : 26. “Cut at ⅓ of height from the base” leaves a cone of height 2H/3 — ratio 8 : 19. Read which end."},
 {k:"trap", h:"<b>Frustum slant ≠ h.</b> Use √(h² + (R − r)²). Using h in π(R + r)l is the planted wrong option. Diameters given? Halve both."},
 {k:"q", q:"A cone is cut parallel to its base at half its height. The small cone's volume is what fraction of the whole cone?", o:["1/8","1/2","1/4","1/7"], e:"(½)³ = 1/8. (1/7 is small cone : frustum.)"}
], sum:["V = (πh/3)(R² + r² + Rr)","l = √(h² + (R − r)²); CSA = π(R + r)l","Bucket metal = π(R + r)l + πr² (bottom only)","Cut cone: volumes ∝ k³, areas ∝ k²","Half-height cut ⇒ 1 : 7; one-third from top ⇒ 1 : 26"]},
{ id:"L6", heat:1, title:"Prism, pyramid & tetrahedron", hi:"प्रिज़्म, पिरामिड और चतुष्फलक", blocks:[
 {k:"hot", h:"<b>Tier 1:</b> occasional (a few shifts per exam) — prism with equilateral or right-triangle base, square pyramid with slant height. <b>Tier 2 / CHSL Tier 2:</b> more common — LSA and volume together, hexagonal prism, regular tetrahedron."},
 {k:"formula", title:"Right prism (base perimeter P, base area B, height h)", rows:[["Volume","V = B × h","Like a cylinder"],["Lateral surface area","LSA = P × h","Rectangles round the side"],["Total surface area","TSA = P·h + 2B",""],["Equilateral base side a","B = (√3/4)a², P = 3a",""],["Regular hexagon base side a","B = 6 × (√3/4)a² = (3√3/2)a²",""]]},
 {k:"formula", title:"Pyramid (base area B, height h, slant height l of faces)", rows:[["Volume","V = ⅓ × B × h","⅓ of the prism on the same base"],["Lateral surface area","= ½ × P × l","l = height of each triangular face"],["Square base side a","l² = h² + (a/2)²","Slant from apex to mid-edge"],["Regular tetrahedron edge a","V = (√2/12)a³","4 equilateral faces"],["Tetrahedron surface / height","TSA = √3 a², height = √(2/3) a",""],["Euler","F + V − E = 2","Cube 6 + 8 − 12 = 2"]]},

 {k:"ex", src:"SSC CHSL 2023 Tier 2 · 10 Jan 2024 S1", q:"The base of a right prism is an equilateral triangle with each side 4 cm. If the lateral surface area is 120 cm², find the volume of the prism.", steps:["LSA = 3 × 4 × h = 120 ⇒ h = 10","Base = (√3/4)(16) = 4√3","V = 4√3 × 10"], ans:"40√3 cm³"},
 {k:"ex", src:"SSC CGL 2025 · 16 Sep S3", q:"A regular right pyramid has a square base of side 12 cm and slant height 10 cm. What is its volume?", steps:["h² = l² − (a/2)² = 100 − 36 ⇒ h = 8","V = ⅓ × 144 × 8"], ans:"384 cm³", tip:"6-8-10 triplet: half-side 6, slant 10 ⇒ height 8."},
 {k:"ex", src:"SSC CGL Tier 2 · 29 Jan 2022", q:"The base of a right prism is a triangle with sides 16, 30 and 34 cm; its height is 32 cm. Find its LSA and volume.", steps:["16² + 30² = 34² ⇒ right triangle, area = ½ × 16 × 30 = 240","LSA = (16 + 30 + 34) × 32 = 2560","V = 240 × 32 = 7680"], ans:"2560 cm² and 7680 cm³"},
 {k:"trick", h:"<b>Prism behaves like a cylinder, pyramid like a cone:</b> V = Bh and ⅓Bh; lateral = P·h and ½·P·l. Learn one pair, get the other free."},
 {k:"trap", h:"<b>Height vs slant height of a pyramid:</b> volume uses the vertical height h; lateral area uses the slant height l of the faces. l² = h² + (a/2)² for a square base — use <i>half</i> the side."},
 {k:"link", h:"Base areas come from 2D mensuration: equilateral (√3/4)a², hexagon (3√3/2)a², Heron's formula for scalene bases. Right-triangle bases (16-30-34, 5-12-13) are planted to make the area easy."},
 {k:"q", q:"A prism and a pyramid have the same base and the same height. Ratio of their volumes (prism : pyramid):", o:["3 : 1","1 : 3","2 : 1","1 : 1"], e:"Bh : ⅓Bh = 3 : 1."}
], sum:["Prism: V = Bh, LSA = Ph, TSA = Ph + 2B","Pyramid: V = ⅓Bh, LSA = ½Pl","Square pyramid: l² = h² + (a/2)²","Tetrahedron: V = (√2/12)a³, TSA = √3a²","Hexagon base = (3√3/2)a²"]},
{ id:"L7", heat:3, title:"Melting & recasting", hi:"पिघलाकर पुनः ढालना", blocks:[
 {k:"hot", h:"<b>Tier 1 favourite:</b> sphere → small balls, cylinder → sphere, sphere → wire. Almost every exam has one. <b>Tier 2:</b> hollow shells recast into cones, mixed units (wire radius in mm, length in m), and “maximum number” (floor the answer)."},
 {k:"p", h:"<b>One law:</b> volume never changes when metal is melted and recast (no wastage unless stated). So <b>volume of old solid = n × volume of each new solid</b>. Surface area is NOT conserved — it increases when you make many small pieces."},
 {k:"formula", title:"Set up the equation", rows:[["Number of pieces","n = V(old) ÷ V(one new piece)","Cancel π and common factors before multiplying"],["Sphere → n small spheres","n = (R/r)³","R = 6, r = 3 ⇒ 8 balls"],["Sphere → wire (cylinder)","(4/3)R³ = r²·L","Convert mm and m to cm first"],["Cylinder → sphere","r²h = (4/3)R³",""],["Cone ↔ cylinder (same r)","h(cyl) = h(cone)/3",""],["Hollow solid","use (R³ − r³) or (R² − r²)","Only the metal is recast"],["Several cubes → one cube","A³ = a³ + b³ + c³","3, 4, 5 ⇒ 6"]]},
 {k:"fig", title:"Volume is conserved", svg:'<svg viewBox="0 0 300 150" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><circle cx="60" cy="75" r="45" style="fill:var(--accent-bg)"/><path d="M15 75 A45 11 0 0 0 105 75"/><path d="M15 75 A45 11 0 0 1 105 75" stroke-dasharray="4 3"/><path d="M60 75 L105 75" style="stroke:var(--accent)"/><text x="78" y="70" fill="currentColor" stroke="none" style="fill:var(--accent)">R</text><path d="M120 75 H160 M152 69 L160 75 L152 81" style="stroke:var(--blue)"/><text x="122" y="64" fill="currentColor" stroke="none">melt</text><path d="M180 60 H280 M180 90 H280" /><ellipse cx="180" cy="75" rx="5" ry="15" style="fill:var(--accent-bg)"/><path d="M280 60 A5 15 0 0 1 280 90"/><text x="224" y="110" fill="currentColor" stroke="none">L</text><text x="168" y="58" fill="currentColor" stroke="none">r</text><text x="60" y="140" fill="currentColor" stroke="none">(4/3)πR³ = πr²L</text></svg>', cap:"Sphere drawn into a wire: equate volumes, cancel π."},
 {k:"ex", src:"SSC CHSL 2020 · 16 Apr 2021 S1", q:"A solid metallic cylinder has diameter 32 cm and height 9 cm. It is melted and recast into a solid sphere. Radius of the sphere?", steps:["π(16²)(9) = (4/3)πR³","R³ = 256 × 9 × 3/4 = 1728","R = 12"], ans:"12 cm"},
 {k:"ex", src:"SSC CGL Tier 2 · 12 Sep 2019", q:"A solid metallic sphere of radius 8 cm is melted and drawn into a wire of uniform cross-section. If the wire is 24 m long, its radius (in mm) is:", steps:["L = 2400 cm","(4/3)(512) = r² × 2400 ⇒ r² = 0.2844","r = 0.533 cm = 16/3 mm"], ans:"5⅓ mm", tip:"Keep fractions: r² = 2048/7200 = 64/225 ⇒ r = 8/15 cm."},
 {k:"ex", src:"SSC CPO 2024 · 28 Jun S2", q:"A hollow sphere of external and internal diameters 10 cm and 6 cm is melted into a cone of base diameter 10 cm. Height of the cone?", steps:["Metal = (4/3)π(5³ − 3³) = (4/3)π(98)","Cone: ⅓π(25)h","h = 4 × 98 ÷ 25 = 15.68"], ans:"15.68 cm"},
 {k:"trick", h:"<b>Cancel first:</b> π always cancels; (4/3) against ⅓ leaves 4. Sphere → cone of the same radius: h = 4R. Sphere → cylinder of the same radius: h = (4/3)R. Many cubes → one: add the cubes of the edges."},
 {k:"trap", h:"<b>Units:</b> wire radius in mm and length in m — convert everything to cm before equating. <b>Diameter vs radius</b> of coins and balls is the commonest planted mistake (gives an answer 4× or 8× off)."},
 {k:"trap", h:"<b>“Maximum number”</b> of balls: take the floor (166.4 ⇒ 166), never round up."},
 {k:"q", q:"A sphere of radius 9 cm is melted into balls of radius 3 cm. Number of balls:", o:["27","9","3","81"], e:"(9/3)³ = 27."}
], sum:["Volume is conserved; surface area is not","n = V(old)/V(new piece); spheres: n = (R/r)³","Sphere → wire: (4/3)R³ = r²L (same units!)","Cubes melted together: A³ = a³ + b³ + c³","Hollow: use R³ − r³ (sphere) or R² − r² (pipe)"]},
{ id:"L8", heat:2, title:"Water flow & displacement", hi:"जल प्रवाह और विस्थापन", blocks:[
 {k:"hot", h:"<b>Tier 1:</b> about one question per few shifts — rise in water level when a ball is dropped, or time to fill a tank through a pipe. <b>Tier 2:</b> rectangular channels/canals, rain on a roof collected in a tank, mixed units (km/h, cm, hectare, litres)."},
 {k:"formula", title:"Flow through a pipe or channel", rows:[["Water per unit time","= cross-section area × speed","A water column of length v·t"],["Circular pipe radius r","Q = πr² × v","Use radius, not diameter"],["Rectangular channel","Q = width × depth × v",""],["Time to fill","t = tank volume ÷ Q","Keep the same units everywhere"],["Canal irrigation","area = (water in time t) ÷ standing depth",""]]},
 {k:"formula", title:"Displacement & rain", rows:[["Solid fully dropped in","rise × base area of vessel = volume of solid","Archimedes"],["Cylindrical vessel","h(rise) = V(solid) ÷ πR²",""],["n balls","n × (4/3)πr³ = πR² × rise",""],["Rain","volume = area × rainfall depth","1 hectare = 10000 m²"],["Units","1 m³ = 1000 L; 1 km/h = 1000 m per hour","5 km/h = 5000 m in 1 h"]]},
 {k:"figs", title:"Flow column and displacement", items:[
  {svg:'<svg viewBox="0 0 280 150" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M20 55 H200 M20 85 H200"/><path d="M60 55 H180 V85 H60 Z" style="fill:var(--accent-bg);stroke:none"/><ellipse cx="60" cy="70" rx="6" ry="15" style="stroke:var(--accent)"/><ellipse cx="180" cy="70" rx="6" ry="15" style="stroke:var(--accent)"/><path d="M60 105 H180 M60 100 V110 M180 100 V110" stroke-width="1"/><text x="104" y="124" fill="currentColor" stroke="none">v × t</text><text x="40" y="50" fill="currentColor" stroke="none">r</text><path d="M200 55 H225 V95 M200 85 H210 V95" /><path d="M217 97 V118" stroke-dasharray="2 3" style="stroke:var(--blue)"/><path d="M190 95 V140 H270 V95" stroke-width="1.4"/><path d="M191 118 H269 V139 H191 Z" style="fill:var(--accent-bg);stroke:none"/><text x="214" y="132" fill="currentColor" stroke="none">tank</text></svg>', cap:"In time t the pipe delivers a cylinder of water πr² × (v·t)."},
  {svg:'<svg viewBox="0 0 220 180" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M45 30 V150 M175 30 V150"/><ellipse cx="110" cy="30" rx="65" ry="12"/><path d="M45 150 A65 12 0 0 0 175 150"/><path d="M45 85 A65 12 0 0 0 175 85 L175 150 A65 12 0 0 1 45 150 Z" style="fill:var(--accent-bg);stroke:none"/><ellipse cx="110" cy="85" rx="65" ry="12" stroke-dasharray="4 3"/><ellipse cx="110" cy="70" rx="65" ry="12" style="stroke:var(--accent)"/><circle cx="110" cy="120" r="24" style="fill:var(--accent-bg);stroke:var(--blue)"/><path d="M188 70 V85 M184 70 H192 M184 85 H192" stroke-width="1"/><text x="194" y="82" fill="currentColor" stroke="none" style="fill:var(--accent)">h</text><text x="104" y="124" fill="currentColor" stroke="none" style="fill:var(--blue)">r</text><path d="M110 30 H175" stroke-width="1"/><text x="140" y="26" fill="currentColor" stroke="none">R</text></svg>', cap:"πR² × h = (4/3)πr³: the rise h depends on the vessel's radius R."}]},
 {k:"ex", src:"SSC CHSL 2020 · 14 Oct S2", q:"Water flows into a tank 180 m × 140 m through a rectangular pipe of 1.2 m × 0.75 m at 15 km/h. In what time will the water rise by 4 m?", steps:["Flow per hour = 1.2 × 0.75 × 15000 = 13500 m³","Needed = 180 × 140 × 4 = 100800 m³","t = 100800 ÷ 13500 = 7.467 h = 7 h 28 min"], ans:"7 hours 28 minutes"},
 {k:"ex", src:"SSC CGL 2025 · 17 Sep S2", q:"A spherical ball of radius 4 cm is submerged in water in a cylindrical container of radius 5 cm and height 30 cm. What volume of water is displaced?", steps:["Displaced water = volume of the ball","(4/3)π(4³) = 256π/3"], ans:"256π/3 cm³", tip:"The container's size is extra data — only needed if they ask the rise in level."},
 {k:"ex", q:"Rain of 2 cm falls on a flat roof 22 m × 20 m and is collected in a cylindrical tank of diameter 2 m. How high does the water rise in the tank? (π = 22/7)", steps:["Rain = 22 × 20 × 0.02 = 8.8 m³","Tank base = π × 1² = 22/7 m²","Rise = 8.8 ÷ (22/7) = 2.8 m"], ans:"2.8 m"},
 {k:"trick", h:"<b>Rise = V(solid) ÷ base area of the vessel.</b> For a sphere in a cylinder: rise = 4r³ / (3R²). For n identical balls multiply by n. <br><b>Speed in km/h:</b> water column length in 1 hour = speed in metres × 1000."},
 {k:"trap", h:"<b>Unit soup:</b> pipe diameter in cm, speed in km/h, tank in m, answer in minutes. Convert everything to metres (or cm) before dividing. 1 hectare = 10000 m², not 1000."},
 {k:"trap", h:"A ball <b>floating</b> or only partly submerged does not displace its full volume — SSC always says “completely immersed/submerged” when it wants the full volume."},
 {k:"q", q:"A cube of edge 6 cm is dropped into a cuboidal tank with base 20 cm × 15 cm containing water. The water rises by:", o:["0.72 cm","1.2 cm","0.36 cm","7.2 cm"], e:"216 ÷ 300 = 0.72 cm."}
], sum:["Flow per unit time = cross-section × speed","Time = tank volume ÷ flow (same units)","Rise in level = volume of immersed solid ÷ base area","Rain volume = area × depth; 1 ha = 10000 m²","1 m³ = 1000 L; 1 km/h ⇒ 1000 m per hour"]}
,{ id:"L9", heat:2, title:"Combined solids", hi:"संयुक्त ठोस", blocks:[
 {k:"hot", h:"<b>Tier 1:</b> about one question in a few shifts — toy (cone on hemisphere), capsule, tent (cylinder + cone roof), hemispherical depressions in a cube. <b>Tier 2:</b> regular — the CGL Tier 2 paper of 18 Jan 2025 had a toy TSA. Marks are won or lost on <i>which surfaces count</i>."},
 {k:"p", h:"<b>Two rules.</b> Volume: just add the parts (subtract a cavity). Surface area: add only the surfaces you can <b>touch from outside</b>. Where two solids are glued, the joining circle disappears from both. Where a piece is scooped out, you lose a flat circle but gain the inner curved surface."},
 {k:"formula", title:"Common combinations (same radius r)", rows:[["Toy: cone on hemisphere","TSA = πrl + 2πr² = πr(l + 2r)","V = ⅓πr²h + ⅔πr³ = ⅓πr²(h + 2r)"],["Capsule: cylinder + 2 hemispherical ends","TSA = 2πrh + 4πr² = 2πr(h + 2r)","V = πr²h + (4/3)πr³; h = cylinder part only"],["Tent: cylinder + cone roof","Canvas = 2πrh + πrl","No floor, no joining circle"],["Ice cream: cone + hemisphere on top","V = ⅓πr²h + ⅔πr³",""],["Cylinder with cone cavity (same r, h)","V = ⅔πr²h; TSA = 2πrh + πr² + πrl","Lose one end circle, gain the cone's CSA"],["Cylinder, hemisphere scooped from each end","TSA = 2πrh + 4πr²","Each hollow adds 2πr² and removes πr²"],["Cube with a hemispherical depression on a face","SA = 6a² + πr²","−πr² (hole) + 2πr² (bowl)"],["Hemisphere placed on a cube face","SA = 6a² + πr²","Same change: −πr² + 2πr²"]]},
 {k:"figs", title:"Toy, capsule, cylinder with a conical cavity", items:[

 {k:"ex", src:"SSC CGL 2024 Tier 2 · 18 Jan 2025", q:"A toy is in the form of a cone mounted on a hemisphere. The radius of the hemisphere and that of the cone is 36 cm and the height of the cone is 105 cm. The total surface area of the toy is:", steps:["l = √(36² + 105²) = √12321 = 111","Exposed: cone CSA + hemisphere CSA (joining circle hidden)","πr(l + 2r) = π × 36 × (111 + 72) = 36 × 183π"], ans:"6588π cm²", tip:"36 = 3 × 12, 105 = 3 × 35 and 12-35-37 is a triplet ⇒ l = 3 × 37 = 111."},
 {k:"ex", src:"SSC CGL 2021 · 18 Apr 2022 S1", q:"A hemispherical depression of diameter 4 cm is cut out from each face of a cubical block of side 10 cm. Find the surface area of the remaining solid. (π = 22/7)", steps:["Cube: 6 × 10² = 600","Each face: lose πr² (hole), gain 2πr² (bowl) ⇒ net +πr² = 4π","Six faces: 600 + 24π = 600 + 528/7"], ans:"675 3/7 cm²"},
 {k:"ex", q:"A cylinder is surmounted by a cone at one end and a hemisphere at the other. Common radius 7 cm, cylinder height 6 cm, total height 32 cm. Find the volume of the solid. (π = 22/7)", steps:["Hemisphere height = r = 7 ⇒ cone height = 32 − 6 − 7 = 19","Write each part as πr² × (height-equivalent): 6 + 19/3 + 2(7)/3 = 6 + 11 = 17","V = (22/7)(49)(17) = 154 × 17"], ans:"2618 cm³", tip:"Cylinder → h, cone → h/3, hemisphere → 2r/3: add, then multiply by πr² once."},
 {k:"trick", h:"<b>Height-equivalents:</b> write every part as πr² × (something): cylinder → h, cone → h/3, hemisphere → 2r/3, sphere → 4r/3. Add the brackets, multiply once. <br><b>1 : 2 : 3:</b> a cone, a hemisphere and a cylinder with the same r and height r have volumes 1 : 2 : 3."},
 {k:"trap", h:"<b>Never add whole TSAs.</b> Toy ≠ TSA(cone) + TSA(hemisphere): the two base circles are glued inside. Use CSAs only. A tent has no floor canvas unless the question asks for it."},
 {k:"trap", h:"<b>Lengths of the parts:</b> if the <i>total</i> length of a capsule is given, subtract 2r to get the cylinder part. Toy total height = cone height + r (the hemisphere is r tall)."},
 {k:"link", h:"Every piece is a formula from <b>L2 (cylinder), L3 (cone), L4 (hemisphere)</b>. Combined solids melted into something else are <b>L7</b>; dropped into water, <b>L8</b>."},
 {k:"q", q:"A capsule is a cylinder of radius 7 cm and length 10 cm with a hemisphere at each end. Its surface area is: (π = 22/7)", o:["1056 cm²","1364 cm²","748 cm²","440 cm²"], e:"2πr(h + 2r) = 44 × 24 = 1056. (1364 adds both end circles; 748 is a closed cylinder; 440 is the cylinder CSA only.)"}
], sum:["Volume: add the parts, subtract cavities","Surface: only exposed faces — glued circles vanish","Toy: πr(l + 2r); capsule: 2πr(h + 2r); tent: 2πrh + πrl","Scooped hemisphere or hemisphere on a face: net +πr²","Cone : hemisphere : cylinder (height r) = 1 : 2 : 3"]}
,{ id:"L10", heat:2, title:"Percentage change & ratios in solids", hi:"ठोसों में प्रतिशत परिवर्तन और अनुपात", blocks:[
 {k:"hot", h:"<b>Tier 1:</b> common and quick — “radius increased by x%, find the % change in volume / surface area”, or “volume kept the same, by what % must h fall”. <b>Tier 2:</b> two changes at once (r up, h down), ratios of two solids, and equal-volume comparisons (cone vs sphere, cone vs hemisphere)."},
 {k:"p", h:"<b>Why it works:</b> every area is length × length and every volume is length × length × length. So if all lengths scale by k, every area scales by k² and every volume by k³ — whatever the shape. If only some lengths change, multiply the factors of the lengths that appear in the formula."},
 {k:"formula", title:"Scale factors", rows:[["All lengths × k","Area × k², Volume × k³","Sphere, cube, or r and h together"],["Sphere / hemisphere","SA ∝ r², V ∝ r³",""],["Cylinder","CSA ∝ rh, V ∝ r²h","Change r and h separately"],["Cone","V ∝ r²h","CSA ∝ rl (l changes with r and h)"],["Two changes x% and y%","Net % = x + y + xy/100","Use −x for a decrease"],["Square of (1 + x%)","(1 + x/100)² − 1","r +10% ⇒ area +21%, volume +33.1%"]]},
 {k:"formula", title:"Ratios and equal volumes", rows:[["Similar solids, length ratio a : b","Area a² : b², volume a³ : b³","Volume ratio → take cube root first"],["Equal volume, cylinder r changes","h ∝ 1/r²","r +25% ⇒ h × 16/25 (36% less)"],["Keep V same after r grows x%","h falls by 1 − 1/(1 + x/100)²",""],["Cone = cylinder (same r, V)","h(cone) = 3 h(cyl)",""],["Cone = sphere (same r, V)","h(cone) = 4r",""],["Cone = hemisphere (same r, V)","h(cone) = 2r",""]]},
 {k:"table", title:"Ready multipliers (memorise)", head:["Change in length","Area factor","Volume factor"], rows:[["+10%","1.21 (+21%)","1.331 (+33.1%)"],["+20%","1.44 (+44%)","1.728 (+72.8%)"],["+25%","1.5625 (+56.25%)","1.953 (+95.3%)"],["+50%","2.25 (+125%)","3.375 (+237.5%)"],["+100% (doubled)","4 (+300%)","8 (+700%)"],["−10%","0.81 (−19%)","0.729 (−27.1%)"],["−20%","0.64 (−36%)","0.512 (−48.8%)"],["−50% (halved)","0.25 (−75%)","0.125 (−87.5%)"]]},
 {k:"fig", title:"Double the edge", svg:'<svg viewBox="0 0 260 190" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M20 90 H60 V130 H20 Z" style="fill:var(--accent-bg)"/><path d="M20 90 L35 75 H75 L60 90 M75 75 V115 L60 130"/><path d="M20 130 L35 115 H75 M35 115 V75" stroke-dasharray="4 3"/><text x="36" y="146" fill="currentColor" stroke="none">a</text><path d="M120 70 H200 V150 H120 Z" style="fill:var(--accent-bg)"/><path d="M120 70 L150 40 H230 L200 70 M230 40 V120 L200 150"/><path d="M120 150 L150 120 H230 M150 120 V40" stroke-dasharray="4 3"/><text x="152" y="166" fill="currentColor" stroke="none" style="fill:var(--accent)">2a</text><path d="M84 110 H108 M101 104 L108 110 L101 116" style="stroke:var(--blue)"/><text x="40" y="184" fill="currentColor" stroke="none">k = 2 ⇒ area ×4, volume ×8</text></svg>', cap:"Scale every length by k: faces grow k², volume grows k³. Same for spheres, cones, cylinders."},
 {k:"ex", src:"SSC CHSL 2024 · 4 Jul S2", q:"The radius of a sphere is increased by 25%. What is the increase per cent in surface area?", steps:["SA ∝ r²","Net % = 25 + 25 + (25 × 25)/100","= 50 + 6.25"], ans:"56.25%", tip:"25% = ¼ ⇒ factor 5/4 ⇒ (5/4)² = 25/16 ⇒ +9/16 = 56.25%."},
 {k:"ex", src:"SSC MTS 2019 · 9 Aug S2", q:"If the height of a circular cone is decreased by 10% and its radius is increased by 10%, what will be the change in its volume?", steps:["V ∝ r²h","Factor = (1.1)² × 0.9 = 1.21 × 0.9 = 1.089"], ans:"Increases by 8.9%", tip:"Successive: r² gives +21%, then −10%: 21 − 10 − 2.1 = 8.9%."},
 {k:"ex", q:"The radius of a cylinder is increased by 25%. By what percent must its height be reduced so that the volume stays the same?", steps:["r² factor = (5/4)² = 25/16","h must be × 16/25","Decrease = 9/25 = 36%"], ans:"36%"},
 {k:"trick", h:"<b>Fraction method:</b> turn the % into a fraction and power it. 25% → 5/4 → volume 125/64 → +61/64 ≈ 95.3%. 20% → 6/5 → 216/125 → +72.8%. <br><b>Two changes:</b> x + y + xy/100, applied once per power (r² = r × r)."},
 {k:"trap", h:"<b>Volume % ≠ 3 × radius %.</b> r +10% gives +33.1%, not +30%. And “radius halved” makes the volume 1/8 — a <i>decrease</i> of 87.5%, not 50%."},
 {k:"trap", h:"<b>“Increased by” vs “increased to”:</b> doubled = increased <i>by</i> 100% = increased <i>to</i> 200%. Volume ×8 is an increase <i>by</i> 700%."},
 {k:"link", h:"This is the <b>successive percentage</b> rule from the Percentage chapter (x + y + xy/100). Similar-cone ratios (k² and k³) were used in <b>L5 frustum cuts</b>; volume ratios of two solids in <b>L2–L4</b>."},
 {k:"q", q:"The edge of a cube is increased by 10%. Its volume increases by:", o:["33.1%","30%","21%","10%"], e:"(1.1)³ = 1.331 ⇒ +33.1%. (21% is the area.)"}
], sum:["Lengths × k ⇒ areas × k², volumes × k³","Two changes: x + y + xy/100 (decrease = negative)","Same volume, r +x% ⇒ h × 1/(1 + x/100)²","Equal volume with same r: cone h = 3h(cyl) = 4r (sphere) = 2r (hemisphere)","+10% ⇒ 21%, 33.1%; +20% ⇒ 44%, 72.8%; halved ⇒ ¼, ⅛"]}
,{ id:"L11", heat:2, title:"Cubes: cutting, painting & counting", hi:"घन: काटना, रंगना और गिनना", blocks:[
 {k:"hot", h:"<b>Tier 1:</b> regular — largest sphere / cone / cylinder cut from a cube, sphere inside a cube inside a sphere, and the painted-cube count (also asked in the reasoning section). <b>Tier 2:</b> combined with % or ratio — wasted volume, surface area after cutting, largest cubes from a cuboid (HCF)."},
 {k:"formula", title:"Painted cube cut into n × n × n small cubes", rows:[["Total small cubes","n³","n = big edge ÷ small edge"],["3 faces painted","8","Always the corners (n ≥ 2)"],["2 faces painted","12(n − 2)","Along the 12 edges, corners removed"],["1 face painted","6(n − 2)²","Middle of each of the 6 faces"],["0 faces painted","(n − 2)³","The hidden inner cube"],["At least one face","n³ − (n − 2)³",""],["At least two faces","8 + 12(n − 2)","n = 5 ⇒ 44"]]},
 {k:"formula", title:"Largest solid inside a cube of edge a (and the reverse)", rows:[["Sphere in cube","r = a/2, V = πa³/6","Touches all 6 faces"],["Cylinder in cube","r = a/2, h = a, V = πa³/4",""],["Cone in cube","r = a/2, h = a, V = πa³/12","⅓ of the cylinder"],["Sphere around cube","R = a√3/2","Diameter = space diagonal"],["Cube in a sphere of radius R","a = 2R/√3",""],["Sphere in cube in sphere","radii 1 : √3, volumes 1 : 3√3",""],["Sphere from a cuboid","r = (smallest edge)/2",""],["Largest equal cubes from a cuboid","edge = HCF(l, b, h); count = lbh ÷ edge³",""],["Cut a cube into n³ cubes","total SA becomes n × original","Each cut exposes new faces"]]},

  {svg:'<svg viewBox="0 0 200 175" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M30 60 H120 V150 H30 Z" style="fill:var(--accent-bg)"/><path d="M30 60 L70 30 H160 L120 60 M160 30 V120 L120 150"/><path d="M60 60 V150 M90 60 V150 M30 90 H120 M30 120 H120" stroke-width="1"/><path d="M60 60 L100 30 M90 60 L130 30 M43.3 50 H133.3 M56.7 40 H146.7" stroke-width="1"/><path d="M133.3 50 V140 M146.7 40 V130 M120 90 L160 60 M120 120 L160 90" stroke-width="1"/><text x="101" y="80" fill="currentColor" stroke="none" style="fill:var(--accent)">3</text><text x="71" y="80" fill="currentColor" stroke="none" style="fill:var(--blue)">2</text><text x="71" y="110" fill="currentColor" stroke="none">1</text><text x="10" y="170" fill="currentColor" stroke="none">n = 3: 8 · 12 · 6 · 1 hidden</text></svg>', cap:"Corner cubes show 3 faces, edge cubes 2, face-centre cubes 1; the centre cube shows none."},

 {k:"ex", src:"SSC CGL 2021 · 12 Apr 2022 S3", q:"A cube of side 125 cm is painted red on all the faces and then cut into smaller cubes of side 25 cm each. Find the number of smaller cubes having at least two faces painted.", steps:["n = 125 ÷ 25 = 5","3 faces: 8; 2 faces: 12(5 − 2) = 36","At least two = 8 + 36"], ans:"44", tip:"Check: 125 − 27 (none) − 54 (one face) = 44."},
 {k:"ex", src:"SSC CHSL 2023 · 3 Aug S2", q:"Find the volume of the largest possible sphere that fits inside a cube of edge 7 cm. (π = 22/7)", steps:["Diameter = edge ⇒ r = 3.5","V = (4/3)(22/7)(3.5)³ = (4/3)(22/7)(42.875)"], ans:"179.67 cm³", tip:"V = πa³/6 = (22/7)(343)/6 = 1078/6 = 179.67."},
 {k:"ex", src:"SSC GD 2021 · 13 Dec S2", q:"What is the volume of the largest right circular cone that can be cut out of a cube of edge 12 cm (correct to two decimal places)?", steps:["r = 6, h = 12","V = ⅓ × (22/7) × 36 × 12 = πa³/12 = (22/7)(1728)/12"], ans:"452.57 cm³"},
 {k:"ex", q:"A sphere is inscribed in a cube, and the cube is inscribed in a bigger sphere. Find the ratio of the volumes of the bigger and smaller spheres.", steps:["Small r = a/2; big R = a√3/2 ⇒ R : r = √3 : 1","Volumes ∝ cube of radius: (√3)³ = 3√3"], ans:"3√3 : 1"},
 {k:"trick", h:"<b>Painted cube in one line:</b> 8 · 12(n−2) · 6(n−2)² · (n−2)³ — powers 0, 1, 2, 3 of (n−2) with 8, 12, 6, 1 in front (the numbers of corners, edges, faces, insides). They must add to n³ — use it as a check. <br><b>Cube-fitting fractions:</b> sphere π/6, cylinder π/4, cone π/12 of the cube."},
 {k:"trap", h:"<b>Which diagonal?</b> A sphere <i>around</i> a cube uses the space diagonal a√3 (not the face diagonal a√2). A cube <i>inside</i> a sphere: a = 2R/√3, not 2R or R√2."},
 {k:"trap", h:"<b>n is a count, not a length:</b> 125 cm cut into 25 cm cubes gives n = 5 (125 small cubes), not n = 125. If only some faces are painted (e.g. two opposite faces), count face by face — the formulas are for all 6 faces painted."},
 {k:"link", h:"Cube basics are in <b>L1</b>; sphere, cylinder and cone formulas in <b>L2–L4</b>. The painted-cube count also appears in the <b>Reasoning</b> section as “cube and dice”."},
 {k:"q", q:"A cube painted on all faces is cut into 27 equal small cubes. How many have exactly two faces painted?", o:["12","8","6","24"], e:"n = 3: 12(n − 2) = 12. (8 = three faces, 6 = one face.)"}
], sum:["n³ small cubes: 8 corners (3 faces), 12(n−2) edges (2), 6(n−2)² faces (1), (n−2)³ hidden (0)","In a cube of edge a: sphere πa³/6, cylinder πa³/4, cone πa³/12","Sphere around cube: R = a√3/2; cube in sphere: a = 2R/√3","Sphere–cube–sphere: radii 1 : √3, volumes 1 : 3√3","Largest equal cubes from a cuboid: edge = HCF of the sides"]}
];

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hash = s => { let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5)+h + s.charCodeAt(i))|0; return "q"+(h>>>0).toString(36); };
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; };
const L = id => LESSONS.find(l => l.id === id);
const LNUM = id => LESSONS.findIndex(l => l.id === id) + 1;

const QS = QB.map(r => {
  const fixed = !!r[6];
  return { t:r[0], q:r[1], o:r[2], e:r[3], p:(r[4]||"").includes("p"), a: fixed ? (r[5]||0) : 0, fixed, id:hash(r[1]) };
});
const byLesson = id => QS.filter(q => q.t === id);
// order of options to show: array of original indexes
const makePerm = q => q.fixed ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i));

const KEY = APP.key;
let S = { ans:{}, bm:{}, les:{}, mocks:[] };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const record = (q, ok) => { S.ans[q.id] = ok ? 1 : 0; save(); renderTop(); };

function renderTop(){
  const ids = Object.keys(S.ans).filter(k => QS.some(q => q.id === k));
  const right = ids.filter(k => S.ans[k] === 1).length;
  const pct = ids.length ? Math.round(right*100/ids.length) : 0;
  $("#topstat").innerHTML = `<b>${ids.length}</b>/${QS.length} tried<br><b>${pct}%</b> right now`;
}

  const done = LESSONS.filter(l => S.les[l.id] && S.les[l.id].done).length;
  const nextIdx = LESSONS.findIndex(l => !(S.les[l.id] && S.les[l.id].done));
  $("#app").innerHTML = `<section class="view stack">
    <div class="hero">
      <span class="eyebrow">${APP.eyebrow}</span>
      <h1>Learn it, test it, revise it</h1>
      <p>${APP.intro} ${QS.length} exam-style questions in all.</p>
      <div class="meter" aria-label="Lessons done"><i style="width:${done/LESSONS.length*100}%"></i></div>
      <div class="row between"><span class="muted num" style="font-size:13px">${done}/${LESSONS.length} lessons done</span>
      ${nextIdx>=0 ? `<button class="btn pri sm" type="button" data-open="${LESSONS[nextIdx].id}">${done? "Continue" : "Start"}: Lesson ${nextIdx+1}</button>` : `<span class="muted" style="font-size:13px">All lessons done. Try a mock test.</span>`}</div>
    </div>
    <div class="lessons">${LESSONS.map((l,i) => {
      const st = S.les[l.id] || {}; const n = byLesson(l.id).length;
      return `<button type="button" class="les ${st.done?"done":""} ${i===nextIdx?"next":""}" data-open="${l.id}">
        <span class="no">${st.done ? "✓" : i+1}</span>
        <span class="t"><b>${esc(l.title)}<span class="heatb" title="Exam frequency">${"🔥".repeat(l.heat||1)}</span></b><span>${l.hi} · ${n} questions</span></span>
        <span class="sc">${st.best!=null ? `best<br>${st.best}/${n}` : ""}</span></button>`;}).join("")}
    </div>
    <p class="foot">${APP.foot}</p>
  </section>`;
  $("#app").querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openLesson(b.dataset.open, "learn")));
}

function blockHTML(b){

  if (b.k==="formula") return `<div class="block"><h3>${b.title}</h3><div class="fgrid">${b.rows.map(r=>`<div class="fcard"><span class="fn">${r[0]}</span><span class="fx">${r[1]}</span>${r[2]?`<span class="fnote">${r[2]}</span>`:""}</div>`).join("")}</div></div>`;
  if (b.k==="ex") return `<div class="ex"><div class="exhead"><span class="lab">${b.src ? "PYQ" : "Solved example"}</span>${b.src?`<span class="src">${b.src}</span>`:""}</div><div class="exq">${b.q}</div>${b.fig?`<figure class="fig">${b.fig}</figure>`:""}<details><summary>Show solution</summary><ol>${b.steps.map(x=>`<li>${x}</li>`).join("")}</ol><div class="exans">Answer: ${b.ans}</div>${b.tip?`<div class="trick" style="margin-top:8px"><span class="lab">Shortcut</span>${b.tip}</div>`:""}</details></div>`;
  if (b.k==="figs") return `<div class="block"><h3>${b.title}</h3><div class="figwrap">${b.items.map(it=>`<figure>${it.svg}<figcaption>${it.cap}</figcaption></figure>`).join("")}</div></div>`;
  if (b.k==="p") return `<div class="plain"><p>${b.h}</p></div>`;
  if (b.k==="trick") return `<div class="trick"><span class="lab">Trick</span>${b.h}</div>`;
  if (b.k==="link") return `<div class="link"><span class="lab">Link · connect the dots</span>${b.h}</div>`;
  if (b.k==="q") { const perm = shuffle(b.o.map((_,i)=>i)); return `<div class="icheck" data-ic><span class="lab">Quick check</span><p class="qt">${esc(b.q)}</p><div class="opts">${perm.map((oi,k)=>`<button type="button" class="opt" data-ioi="${oi}"><span class="k">${"ABCD"[k]}</span><span>${esc(b.o[oi])}</span></button>`).join("")}</div><div class="exp" hidden><b class="okl"></b> ${esc(b.e)}</div></div>`; }
  if (b.k==="hot") return `<div class="hot"><span class="lab">🔥 Exam radar · how often it's asked</span>${b.h}</div>`;
  if (b.k==="trap") return `<div class="trap"><span class="lab">Trap · correction</span>${b.h}</div>`;
  if (b.k==="facts") return `<div class="block"><h3>${b.title}</h3><dl class="facts">${b.rows.map(r=>`<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join("")}</dl></div>`;
  if (b.k==="tl") return `<div class="block"><h3>${b.title}</h3><ul class="tl">${b.rows.map(r=>`<li><span class="y">${r[0]}</span><span>${r[1]}</span></li>`).join("")}</ul></div>`;
  if (b.k==="table") {
    const isNum = (ci) => b.numcol==="all" ? ci>0 : (b.numcol===1 && ci===1) || (typeof b.numcol==="string" && b.numcol.includes(String(ci)));
    return `<div class="block"><h3>${b.title}</h3><div class="tbl"><table><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map((c,ci)=>`<td class="${isNum(ci)?"n":""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  }
  if (b.k==="fig") return `<div class="block"><h3>${b.title}</h3><figure class="fig">${b.svg}<figcaption>${b.cap}</figcaption></figure></div>`;
  if (b.k==="pyr") return `<div class="block"><h3>${b.title}</h3><div class="pyr">${b.items.map(it=>`<div>${PYR(it.rows)}<b>${it.name}</b><span class="muted">${it.note}</span></div>`).join("")}</div><p class="muted" style="font-size:13px;margin-top:8px"><span style="color:var(--blue)">■</span> males · <span style="color:var(--accent)">■</span> females · top = old, base = young</p></div>`;
  return "";
}

let LQ = null;
function openLesson(id, step){
  const l = L(id), i = LNUM(id);
  if (step === "quiz") { LQ = { id, list: shuffle(byLesson(id)).map(q => ({q, perm:makePerm(q)})), i:0, score:0, picked:null }; }
  const head = `<div class="lhead"><button class="back" type="button" id="lback">‹ Lessons</button></div>
    <span class="eyebrow">Lesson ${i} of ${LESSONS.length} · ${l.hi}</span><h1>${esc(l.title)}</h1>
    <div class="steps" role="tablist">
      <button type="button" data-step="learn" aria-current="${step==="learn"?"step":"false"}">1 · Learn</button>
      <button type="button" data-step="quiz" aria-current="${step==="quiz"?"step":"false"}">2 · Quiz</button>
      <button type="button" data-step="sum" aria-current="${step==="sum"?"step":"false"}">3 · Summary</button>
    </div>`;
  let body = "";
  if (step === "learn") {
    body = `<div class="stack">${l.blocks.map(blockHTML).join("")}
      <div class="row end"><button class="btn pri" type="button" id="toquiz">Take the lesson quiz · ${byLesson(id).length} questions</button></div></div>`;
  } else if (step === "quiz") {
    body = `<div id="lq"></div>`;
  } else {
    const nxt = LESSONS[i];
    body = `<div class="stack"><div class="block"><h3>Remember these</h3><ul class="sum">${l.sum.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
      <div class="row between"><button class="btn" type="button" id="relearn">Read again</button>
      ${nxt ? `<button class="btn pri" type="button" id="nextles">Next: ${esc(nxt.title)}</button>` : `<button class="btn pri" type="button" id="tomock">Take a mock test</button>`}</div></div>`;
    S.les[id] = Object.assign(S.les[id]||{}, {done:1}); save();
  }
  $("#app").innerHTML = `<section class="view stack">${head}${body}</section>`;
  $("#lback").onclick = () => renderLearn();
  $("#app").querySelectorAll("[data-step]").forEach(b => b.onclick = () => openLesson(id, b.dataset.step));
  if (step==="learn") { $("#toquiz").onclick = () => openLesson(id,"quiz");
    const ics = l.blocks.filter(b=>b.k==="q");
    $("#app").querySelectorAll("[data-ic]").forEach((box,n) => { const b = ics[n];
      box.querySelectorAll("[data-ioi]").forEach(btn => btn.onclick = () => {
        if (box.dataset.done) return; box.dataset.done = 1; const pick = +btn.dataset.ioi;
        box.querySelectorAll("[data-ioi]").forEach(x => { const oi=+x.dataset.ioi; x.disabled = true; if (oi===0) x.classList.add("ok"); else if (oi===pick) x.classList.add("no"); });
        const ex = box.querySelector(".exp"); ex.hidden = false; const lab = ex.querySelector("b");
        if (pick===0) { lab.textContent = "Correct."; } else { lab.className = "nol"; lab.textContent = "Answer: " + b.o[0] + "."; }
      }); }); }
  if (step==="quiz") renderLQ();
  if (step==="sum") {
    $("#relearn").onclick = () => openLesson(id,"learn");
    const n = $("#nextles"); if (n) n.onclick = () => openLesson(LESSONS[i].id,"learn");
    const m = $("#tomock"); if (m) m.onclick = () => go("mock");
  }
  window.scrollTo(0,0);
}

function optsHTML(q, perm, state){
  // state: {picked: originalIndex|null, reveal: bool, sel: originalIndex|null}
  return perm.map((oi, k) => {
    let cls = "opt";
    if (state.reveal) { if (oi === q.a) cls += " ok"; else if (oi === state.picked) cls += " no"; }
    else if (state.sel === oi) cls += " sel";
    return `<button type="button" class="${cls}" data-oi="${oi}" ${state.reveal?"disabled":""}><span class="k">${"ABCD"[k]}</span><span>${esc(q.o[oi])}</span></button>`;
  }).join("");
}
function expHTML(q, picked){
  const ok = picked === q.a;
  return `<div class="exp">${ok ? `<b class="okl">Correct.</b>` : `<b class="nol">Answer: ${esc(q.o[q.a])}.</b>`} ${esc(q.e)}</div>`;
}
function metaHTML(q, no){
  return `<div class="qmeta"><span class="qno">${no}</span><span class="tag">L${LNUM(q.t)} · ${esc(L(q.t).title)}</span>${q.p?`<span class="tag pyq">High-yield</span>`:""}
  <button type="button" class="bm" data-bm="${q.id}" aria-pressed="${S.bm[q.id]?"true":"false"}" aria-label="Bookmark">${S.bm[q.id]?"★":"☆"}</button></div>`;
}

function renderLQ(){
  const box = $("#lq");
  if (LQ.i >= LQ.list.length) {
    const n = LQ.list.length, l = L(LQ.id);
    const st = S.les[LQ.id] || {}; st.best = Math.max(st.best||0, LQ.score); S.les[LQ.id] = st; save();
    box.innerHTML = `<div class="stack"><div class="block stack"><span class="eyebrow">Quiz done</span>
      <div class="scorebig"><span class="num">${LQ.score}</span><span class="muted">/ ${n} correct</span></div>
      <p class="muted">${LQ.score===n ? "Full marks." : LQ.score >= n*0.8 ? "Strong. Review the ones you missed in Practice → Mistakes." : "Read the lesson once more, then retry. Missed questions are saved under Practice → Mistakes."}</p></div>
      <div class="row between"><button class="btn" type="button" id="retry">Retry quiz</button><button class="btn pri" type="button" id="tosum">See summary</button></div></div>`;
    $("#retry").onclick = () => openLesson(LQ.id,"quiz");
    $("#tosum").onclick = () => openLesson(LQ.id,"sum");
    return;
  }
  const it = LQ.list[LQ.i], q = it.q;
  const reveal = LQ.picked !== null;
  box.innerHTML = `<div class="stack"><div class="meter"><i style="width:${LQ.i/LQ.list.length*100}%"></i></div>
    <article class="qcard">${metaHTML(q, `Q${LQ.i+1}/${LQ.list.length}`)}
    <p class="qt">${esc(q.q)}</p><div class="opts">${optsHTML(q, it.perm, {picked:LQ.picked, reveal})}</div>
    ${reveal ? expHTML(q, LQ.picked) : ""}</article>
    ${reveal ? `<div class="row end"><button class="btn pri" type="button" id="lqnext">${LQ.i+1 < LQ.list.length ? "Next question" : "Finish"}</button></div>` : `<p class="muted" style="font-size:13px">Score so far: <span class="num">${LQ.score}</span></p>`}</div>`;
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (LQ.picked !== null) return;
    LQ.picked = +b.dataset.oi; const ok = LQ.picked === q.a; if (ok) LQ.score++; record(q, ok); renderLQ();
  });
  bindBM(box);
  const nx = $("#lqnext"); if (nx) nx.onclick = () => { LQ.i++; LQ.picked = null; renderLQ(); window.scrollTo(0,0); };
}

function bindBM(root){
  root.querySelectorAll("[data-bm]").forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    const id = b.dataset.bm; if (S.bm[id]) delete S.bm[id]; else S.bm[id] = 1; save();
    b.setAttribute("aria-pressed", S.bm[id] ? "true":"false"); b.textContent = S.bm[id] ? "★" : "☆";
  });
}

{"id":"P1","heat":3,"title":"Freedom fighters' titles and who gave them","hi":"स्वतंत्रता सेनानियों की उपाधियाँ और उन्हें देने वाले","blocks":[{"k":"hot","h":"Most asked: <b>who gave<\/b> Gandhi 'Mahatma' (Tagore) and 'Father of the Nation' (Bose), who called Tagore 'Gurudev' (Gandhi), who made Patel 'Sardar' (the women of Bardoli), and one-word titles — <b>Lokmanya, Deshbandhu, Mahamana, Loknayak, Shaheed-e-Azam, Masterda<\/b>."},{"k":"story","h":"<p>Indians rarely called their leaders by their names. A title said what the people felt. Tilak was <b>Lokmanya<\/b> — the man the people accepted. C. R. Das was <b>Deshbandhu<\/b>, friend of the country. Patel was <b>Sardar<\/b>, the chief: the farmers' wives of Bardoli gave him the name after he won their tax fight in 1928.<\/p><p>Leaders gave titles to each other too. Tagore called Gandhi <b>Mahatma<\/b>, the great soul; Gandhi answered by calling Tagore <b>Gurudev<\/b>. In 1944, though the two had quarrelled, Subhas Chandra Bose spoke on the radio and called Gandhi the <b>Father of our Nation<\/b>. Even enemies gave names: to Valentine Chirol, Tilak was the <b>Father of Indian Unrest<\/b>; to Churchill, Gandhi was a <b>half-naked fakir<\/b>.<\/p>","key":"Mahatma — from Tagore; Father of the Nation — from Bose (1944); Gurudev — from Gandhi; Sardar — from the women of Bardoli."},{"k":"table","title":"Title → leader","head":["Title","Leader","Note"],"rows":[["Bapu","Mahatma Gandhi","'Father' in Gujarati and Hindi — the name millions used for him."],["Netaji","Subhas Chandra Bose","'Respected leader' — first used for him in Germany in 1942."],["Sardar","Vallabhbhai Patel","Given by the women of Bardoli after the Bardoli Satyagraha of 1928."],["Iron Man of India","Vallabhbhai Patel","For joining more than 560 princely states to India after 1947."],["Bismarck of India","Vallabhbhai Patel","Compared with Otto von Bismarck, who united Germany."],["Lokmanya","Bal Gangadhar Tilak","'Accepted by the people as their leader'."],["Father of Indian Unrest","Bal Gangadhar Tilak","A label from the British journalist Valentine Chirol (Indian Unrest, 1910)."],["Deshbandhu","Chittaranjan Das","'Friend of the country'; founded the Swaraj Party with Motilal Nehru (1923)."],["Grand Old Man of India","Dadabhai Naoroji","Gave the 'drain theory'; three times Congress President."],["Chacha","Jawaharlal Nehru","Children's name for him; his birthday, 14 November, is Children's Day."],["Gurudev","Rabindranath Tagore","Gandhi's name for him."],["Mahamana","Madan Mohan Malaviya","'Great-minded'; founded the Banaras Hindu University (1916)."],["Deshratna","Rajendra Prasad","'Jewel of the country'; India's first President."],["Loknayak","Jayaprakash Narayan","'People's leader'; led the 1974 movement for Total Revolution."],["Shaheed-e-Azam","Bhagat Singh","'The greatest martyr'; hanged at Lahore on 23 March 1931."],["Masterda","Surya Sen","He was a schoolteacher; led the Chittagong Armoury Raid (1930)."],["Frontier Gandhi","Khan Abdul Ghaffar Khan","Also Badshah Khan; led the Khudai Khidmatgars ('Red Shirts')."],["Rajaji","C. Rajagopalachari","The only Indian Governor-General of free India (1948–50)."],["Babasaheb","B. R. Ambedkar","'Respected father'; chaired the Drafting Committee of the Constitution."],["Swatantryaveer","V. D. Savarkar","'Hero of freedom'; jailed in the Cellular Jail, Port Blair."],["Deshpriya","Jatindra Mohan Sengupta","'Beloved of the country'; Mayor of Calcutta and a Congress leader of Bengal."],["Deshnayak","Subhas Chandra Bose","'Leader of the country' — Tagore greeted him with it in 1939."]]},{"k":"photos","title":"The faces behind the titles","items":[["Mahatma_Gandhi","Mahatma Gandhi","Bapu · Mahatma"],["Subhas_Chandra_Bose","Subhas Chandra Bose","Netaji"],["Vallabhbhai_Patel","Vallabhbhai Patel","Sardar · Iron Man"],["Bal_Gangadhar_Tilak","Bal Gangadhar Tilak","Lokmanya"],["Chittaranjan_Das","Chittaranjan Das","Deshbandhu"],["Dadabhai_Naoroji","Dadabhai Naoroji","Grand Old Man of India"],["Madan_Mohan_Malaviya","Madan Mohan Malaviya","Mahamana"],["Jayaprakash_Narayan","Jayaprakash Narayan","Loknayak"],["Bhagat_Singh","Bhagat Singh","Shaheed-e-Azam"],["Surya_Sen","Surya Sen","Masterda"],["Abdul_Ghaffar_Khan","Khan Abdul Ghaffar Khan","Frontier Gandhi"],["Rabindranath_Tagore","Rabindranath Tagore","Gurudev"]]},{"k":"table","title":"Who gave the title","head":["Title","Given by","Note"],"rows":[["'Mahatma' to Gandhi","Rabindranath Tagore","Tagore is usually credited (around 1915); 'Mahatma' means 'great soul'."],["'Father of the Nation' to Gandhi","Subhas Chandra Bose","In a radio broadcast on 6 July 1944, asking for Gandhi's blessings for the INA."],["'Gurudev' to Tagore","Mahatma Gandhi","Gandhi's respectful name for the poet of Santiniketan."],["'Sardar' to Vallabhbhai Patel","The women of Bardoli","After he led the Bardoli Satyagraha against higher land revenue (1928)."],["'Father of Indian Unrest' to Tilak","Valentine Chirol","A British journalist; he wrote Indian Unrest (1910)."],["'Half-naked fakir' to Gandhi","Winston Churchill","A sneer of 1931, when Gandhi went to meet the Viceroy in a loincloth."],["'Netaji' to Subhas Chandra Bose","Indian soldiers of the Indian Legion in Germany","The soldiers and staff around him in Germany called him Netaji in 1942."],["'Deshnayak' to Subhas Chandra Bose","Rabindranath Tagore","Tagore hailed him as the country's leader in 1939."],["'Rani' to Gaidinliu","Jawaharlal Nehru","Nehru met the jailed Naga leader in 1937 and called her a queen of her people."],["'Raja' to Ram Mohan Roy","Akbar II","The Mughal emperor sent him to England in 1830 as his envoy, with the title Raja."],["'Mahatma' to Jyotiba Phule","Vithalrao Krishnaji Vandekar","At a meeting in Bombay in 1888, for Phule's work for the poor and for women."],["'Rashtrakavi' to Maithili Sharan Gupt","Mahatma Gandhi","For patriotic poetry such as Bharat Bharati (1912)."],["the name 'Vivekananda' to Narendranath Datta","Ajit Singh of Khetri","The Maharaja of Khetri suggested the name before the Chicago trip of 1893."],["the name 'Nivedita' to Margaret Noble","Swami Vivekananda","'Nivedita' means 'the one dedicated'; she came to India in 1898."]]},{"k":"facts","title":"Trios, pairs and groups","rows":[["Lal–Bal–Pal","Lala Lajpat Rai (Punjab), Bal Gangadhar Tilak (Maharashtra), Bipin Chandra Pal (Bengal) — the Extremist trio of 1905–08"],["Bipin Chandra Pal","Often called the 'Father of Revolutionary Thoughts' in India"],["The Ali brothers","Mohammad Ali Jauhar and Shaukat Ali, leaders of the Khilafat movement"],["Azad","Chandra Shekhar Azad told a magistrate in 1921 that his name was 'Azad' (free); Abul Kalam Azad took 'Azad' as his pen name — two different men"],["Kaiser-i-Hind","A British medal Gandhi received for ambulance work in South Africa and returned in 1920"]]},{"k":"link","h":"The core list (Grand Old Man, Netaji, Iron Man, Punjab Kesari, Frontier Gandhi) is also in <a href=\"study-world-history.html?lesson=L30\">World History, L30<\/a>; the leaders' movements are in <a href=\"study-history-modern.html\">Modern India<\/a> (L22–L24)."},{"k":"trick","h":"<b>Gandhi and Tagore swapped titles<\/b>: Ta-gore gave 'Ma-hatma', Gandhi gave 'Guru-dev' — a guru for a mahatma. <b>Bose gave 'Father'<\/b> from far away — on the radio, 1944. <b>Patel has three<\/b>: Sardar, Iron Man, Bismarck of India."},{"k":"trap","h":"<b>'Father of Indian Unrest'<\/b> is Tilak — a British insult, not praise. <b>'Deshbandhu'<\/b> is C. R. Das, but <b>'Deshpriya'<\/b> is J. M. Sengupta and <b>'Deshratna'<\/b> is Rajendra Prasad. <b>'Loknayak'<\/b> is J. P. Narayan, while <b>'Lokmanya'<\/b> is Tilak."}],"sum":["Mahatma — Tagore gave it to Gandhi; Father of the Nation — Subhas Chandra Bose, radio broadcast of 6 July 1944.","Gurudev — Gandhi's name for Tagore; Sardar — the women of Bardoli, 1928; Iron Man and Bismarck of India — Patel.","Lokmanya — Tilak (Father of Indian Unrest to Valentine Chirol); Deshbandhu — C. R. Das; Mahamana — Malaviya.","Loknayak — Jayaprakash Narayan; Shaheed-e-Azam — Bhagat Singh; Masterda — Surya Sen; Swatantryaveer — Savarkar.","Netaji — Bose, first in Germany (1942); Tagore called him Deshnayak (1939). Half-naked fakir — Churchill on Gandhi."],"part":["Part 1 · Leaders, reformers and women of India","नेता, समाज सुधारक और महिलाएँ"],"g":"pp"},
{"id":"P2","heat":1,"title":"Kesaris, regional titles and titles after 1947","hi":"केसरी, क्षेत्रीय उपाधियाँ और स्वतंत्रता के बाद की उपाधियाँ","blocks":[{"k":"hot","h":"Asked now and then: the <b>Kesaris<\/b> (Punjab, Andhra, Bihar), the <b>Shers<\/b> (Kashmir, Bangla), <b>Kerala Gandhi<\/b>, <b>Utkal Gourab / Utkalmani<\/b>, and the popular names of modern achievers — <b>Waterman, Forest Man, Mountain Man, Padman, Iron Lady of Manipur<\/b>."},{"k":"story","h":"<p>Every region had its own lion. <b>Kesari<\/b> and <b>Sher<\/b> both mean lion, so Punjab's lion was Lala Lajpat Rai, Andhra's was T. Prakasam, Bihar's was Sri Krishna Sinha, Kashmir's was Sheikh Abdullah and Bengal's was Fazlul Huq. Odisha called Madhusudan Das its pride (<b>Utkal Gourab<\/b>) and Gopabandhu Das its jewel (<b>Utkalmani<\/b>).<\/p><p>After 1947 the titles changed with the times. Newspapers named people for one great deed: Rajendra Singh brought dry rivers back to life — the <b>Waterman of India<\/b>; Jadav Payeng planted a forest on a sandbar — the <b>Forest Man<\/b>; Dashrath Manjhi cut a road through a hill — the <b>Mountain Man<\/b>. Learn the deed and the title follows.<\/p>","key":"Kesari = Sher = lion: Punjab–Lajpat Rai, Andhra–Prakasam, Bihar–Sri Krishna Sinha, Kashmir–Sheikh Abdullah, Bangla–Fazlul Huq."},{"k":"table","title":"Kesaris and regional titles","head":["Title","Leader","Note"],"rows":[["Punjab Kesari","Lala Lajpat Rai","'Lion of Punjab'; died after the lathi charge at Lahore (1928)."],["Andhra Kesari","Tanguturi Prakasam","First Chief Minister of Andhra State (1953)."],["Bihar Kesari","Sri Krishna Sinha","'Shri Babu', first Chief Minister of Bihar."],["Assam Kesari","Ambikagiri Raichoudhury","Assamese poet and freedom fighter."],["Sher-e-Kashmir","Sheikh Mohammad Abdullah","Founder of the National Conference."],["Sher-e-Bangla","A. K. Fazlul Huq","Moved the Lahore Resolution (1940); Premier of Bengal."],["Bihar Vibhuti","Anugrah Narayan Sinha","First Deputy Chief Minister of Bihar."],["Kerala Gandhi","K. Kelappan","Led the Guruvayur temple-entry satyagraha (1931–32)."],["Utkal Gourab","Madhusudan Das","'Pride of Utkal'; the first Odia graduate and lawyer."],["Utkalmani","Gopabandhu Das","'Jewel of Utkal'; founded the newspaper Samaja (1919)."],["Lokapriya","Gopinath Bordoloi","First Chief Minister of Assam; kept Assam out of the Grouping Plan."],["Kingmaker","K. Kamaraj","Tamil Nadu leader who picked two Prime Ministers (1964, 1966); the Kamaraj Plan (1963)."],["Arignar Anna","C. N. Annadurai","'Anna the scholar'; founded the DMK (1949); renamed Madras State Tamil Nadu."],["Jananayak","Karpoori Thakur","Bihar's socialist Chief Minister; Bharat Ratna 2024 (posthumous)."]]},{"k":"table","title":"Popular titles after 1947","head":["Title","Person","Why"],"rows":[["Iron Lady of India","Indira Gandhi","India's first woman Prime Minister (1966)."],["Mr Clean","Rajiv Gandhi","A press name when he became Prime Minister in 1984."],["Iron Lady of Manipur","Irom Chanu Sharmila","Fasted from 2000 to 2016 against AFSPA."],["Waterman of India","Rajendra Singh","Revived rivers in Alwar with johads; Stockholm Water Prize 2015."],["Forest Man of India","Jadav Payeng","Planted the Molai forest on a Brahmaputra sandbar near Majuli."],["Mountain Man","Dashrath Manjhi","Cut a road through a hill in Gaya district by hand over 22 years."],["Padman","Arunachalam Muruganantham","Made a low-cost sanitary pad machine; Padma Shri 2016."],["Birdman of India","Salim Ali","Ornithologist; wrote The Book of Indian Birds."],["Missile Woman of India","Tessy Thomas","Led the Agni-IV project at DRDO."],["Tiger Man of India","Kailash Sankhala","First director of Project Tiger (1973)."],["Saalumarada (row of trees)","Thimmakka","Planted and tended banyans along a road in Karnataka; Padma Shri 2019."],["Encyclopedia of the Forest","Tulsi Gowda","Halakki tribal woman of Karnataka who knew every plant; Padma Shri 2020."],["Seed Mother","Rahibai Soma Popere","Saved native seeds in Maharashtra; Padma Shri 2020."]]},{"k":"link","h":"Scientists' titles — <b>Missile Man<\/b> (Kalam), <b>Metro Man<\/b> (E. Sreedharan), fathers of the Green and White Revolutions — are in <a href=\"study-inventions.html?lesson=I10\">Inventions &amp; Discoveries, I10<\/a>."},{"k":"trick","h":"<b>“Kesari runs P-A-B”<\/b>: Punjab, Andhra, Bihar — Lajpat, Prakasam, Babu (Shri Babu). <b>Odisha's two Das<\/b>: <b>M<\/b>adhusudan = <b>M<\/b>an of pride (Gourab); <b>G<\/b>opabandhu = <b>G<\/b>em (mani)."},{"k":"trap","h":"<b>Sher-e-Punjab<\/b> is used for both <b>Maharaja Ranjit Singh<\/b> and Lala Lajpat Rai; 'Punjab Kesari' is Lajpat Rai. <b>Deenbandhu<\/b> is used for both <b>C. F. Andrews<\/b> and <b>Sir Chhotu Ram<\/b> (the peasants' leader of Punjab). <b>Iron Lady of India<\/b> is Indira Gandhi, but the <b>Iron Lady of Manipur<\/b> is Irom Sharmila."}],"sum":["Punjab Kesari — Lala Lajpat Rai; Andhra Kesari — T. Prakasam; Bihar Kesari — Sri Krishna Sinha; Assam Kesari — Ambikagiri Raichoudhury.","Sher-e-Kashmir — Sheikh Abdullah; Sher-e-Bangla — A. K. Fazlul Huq; Kerala Gandhi — K. Kelappan.","Utkal Gourab — Madhusudan Das; Utkalmani — Gopabandhu Das; Lokapriya — Gopinath Bordoloi; Kingmaker — K. Kamaraj.","Jananayak — Karpoori Thakur (Bharat Ratna 2024); Arignar Anna — C. N. Annadurai.","Waterman — Rajendra Singh; Forest Man — Jadav Payeng; Mountain Man — Dashrath Manjhi; Padman — Arunachalam Muruganantham.","Iron Lady of Manipur — Irom Sharmila; Birdman — Salim Ali; Missile Woman — Tessy Thomas."],"part":["Part 1 · Leaders, reformers and women of India","नेता, समाज सुधारक और महिलाएँ"],"g":"pp"},
{"id":"P3","heat":2,"title":"Titles of reformers and women leaders","hi":"समाज सुधारकों और महिला नेताओं की उपाधियाँ","blocks":[{"k":"hot","h":"Asked: <b>Nightingale of India<\/b> (Sarojini Naidu), <b>Father of the Indian Renaissance<\/b> (Ram Mohan Roy), <b>Mother of the Indian Revolution<\/b> (Bhikaji Cama), <b>Grand Old Lady<\/b> (Aruna Asaf Ali), who gave Ram Mohan Roy his 'Raja', and who called Jyotiba Phule 'Mahatma'."},{"k":"story","h":"<p>Reformers earned their titles by breaking old walls. <b>Ram Mohan Roy<\/b> fought sati and is called the <b>Father of the Indian Renaissance<\/b>; the title 'Raja' came from the Mughal emperor Akbar II, who sent him to England. <b>Jyotiba Phule<\/b> was called <b>Mahatma<\/b> in 1888 — thirty years before Gandhi — and his wife <b>Savitribai<\/b>, India's first woman teacher, is remembered as <b>Krantijyoti<\/b>.<\/p><p>Women leaders have titles too: <b>Sarojini Naidu<\/b>, the poet, is the <b>Nightingale of India<\/b>; <b>Bhikaji Cama<\/b>, who raised an Indian flag in Germany in 1907, is the <b>Mother of the Indian Revolution<\/b>; <b>Aruna Asaf Ali<\/b>, who raised the flag at Gowalia Tank in 1942, is the <b>Grand Old Lady of the Independence Movement<\/b>.<\/p>","key":"Renaissance — Ram Mohan Roy; Krantijyoti — Savitribai Phule; Nightingale — Sarojini Naidu; Revolution's mother — Bhikaji Cama."},{"k":"table","title":"Reformers and women: title → person","head":["Title","Person","Note"],"rows":[["Father of the Indian Renaissance","Raja Ram Mohan Roy","Founded the Brahmo Samaj (1828); campaigned against sati."],["Krantijyoti","Savitribai Phule","'Flame of revolution'; India's first woman teacher (Pune, 1848)."],["Cyclonic Monk of India","Swami Vivekananda","American newspapers' name after his Chicago speech (1893)."],["Periyar","E. V. Ramasamy","'The great one'; given at a women's conference in Madras (1938)."],["Vaikom Veerar","E. V. Ramasamy","'Hero of Vaikom', for the Vaikom Satyagraha (1924–25)."],["Vidyasagar of the South","Kandukuri Veeresalingam","Widow remarriage in Andhra."],["Thakkar Bapa","Amritlal Vithaldas Thakkar","Worked for tribal people and Dalits; Gandhi's colleague."],["Nightingale of India","Sarojini Naidu","Poet (The Golden Threshold); first woman Governor (1947)."],["Mother of the Indian Revolution","Bhikaji Cama","Raised a flag of India at Stuttgart (1907)."],["Grand Old Lady of the Independence Movement","Aruna Asaf Ali","Hoisted the Congress flag at Gowalia Tank, 9 August 1942."],["Saint of the Gutters","Mother Teresa","Served the dying in Kolkata; Nobel Peace Prize 1979; made a saint in 2016."],["Punyashlok","Ahilyabai Holkar","Queen of Indore who rebuilt the Kashi Vishwanath temple (1780)."],["Ba","Kasturba Gandhi","Gandhi's wife; died at the Aga Khan Palace, Pune (1944)."],["Gandhi Buri","Matangini Hazra","'Old lady Gandhi', shot at Tamluk in 1942 at 73."],["Veeramangai","Velu Nachiyar","'Brave woman'; queen of Sivaganga who beat the Company (1780)."],["Durga Bhabhi","Durgawati Devi","Revolutionary who helped Bhagat Singh slip out of Lahore (1928)."],["Captain Lakshmi","Lakshmi Sahgal","Led the Rani of Jhansi Regiment of the INA."],["Pandita","Ramabai Dongre","Pandita Ramabai: scholars in Calcutta gave her the titles Pandita and Sarasvati (1878)."]]},{"k":"photos","title":"Reformers and women leaders","items":[["Ram_Mohan_Roy","Raja Ram Mohan Roy","Father of the Indian Renaissance"],["Savitribai_Phule","Savitribai Phule","Krantijyoti"],["Swami_Vivekananda","Swami Vivekananda","Cyclonic Monk"],["Periyar","E. V. Ramasamy","Periyar"],["Sarojini_Naidu","Sarojini Naidu","Nightingale of India"],["Bhikaiji_Cama","Bhikaji Cama","Mother of the Indian Revolution"],["Aruna_Asaf_Ali","Aruna Asaf Ali","Grand Old Lady"],["Ahilyabai_Holkar","Ahilyabai Holkar","Punyashlok"]]},{"k":"facts","title":"How some reformers got their titles","rows":[["Raja (Ram Mohan Roy)","From the Mughal emperor <b>Akbar II<\/b> (1830); Roy died at Bristol in 1833"],["Vidyasagar (Ishwar Chandra Bandyopadhyay)","'Ocean of learning' — given by the Sanskrit College, Calcutta (1839)"],["Mahatma (Jyotiba Phule)","Given at Bombay in <b>1888<\/b> by Vithalrao Krishnaji Vandekar"],["Periyar (E. V. Ramasamy)","Given at a women's conference in Madras, <b>1938<\/b>"],["Pandita Ramabai","Scholars in Calcutta named her 'Pandita' and 'Sarasvati' for her Sanskrit learning (1878)"],["Rani Lakshmibai","Hugh Rose, the British general, called her the most dangerous of the rebel leaders"]]},{"k":"link","h":"What the reformers did — Brahmo Samaj, Arya Samaj, widow remarriage — is in <a href=\"study-history-modern.html\">Modern India, L21<\/a>; more women of the struggle are in L32 of the same app; the first women in each post are in <a href=\"study-firsts-symbols.html?lesson=F4\">Firsts, F4<\/a>."},{"k":"trick","h":"<b>Two Mahatmas, two dates<\/b>: Phule 18<b>88<\/b>, Gandhi 19<b>15<\/b>. <b>Two Phules<\/b>: Jyotiba = Mahatma, Savitribai = Krantijyoti. <b>Two Periyar titles<\/b>: Periyar (1938) and Vaikom Veerar (1924)."},{"k":"trap","h":"<b>Nightingale of India<\/b> means <b>Sarojini Naidu<\/b> in a history question but <b>Lata Mangeshkar<\/b> in a music question — read the subject. The <b>Lady with the Lamp<\/b> is Florence Nightingale, not Sarojini. <b>Bhikaji Cama<\/b> raised the flag at <b>Stuttgart<\/b>; <b>Aruna Asaf Ali<\/b> at <b>Gowalia Tank<\/b>."}],"sum":["Father of the Indian Renaissance — Ram Mohan Roy; 'Raja' from Akbar II; Vidyasagar from the Sanskrit College (1839).","Mahatma (1888) — Jyotiba Phule; Krantijyoti — Savitribai Phule, India's first woman teacher.","Cyclonic Monk — Vivekananda; Periyar and Vaikom Veerar — E. V. Ramasamy; Vidyasagar of the South — Veeresalingam.","Nightingale of India — Sarojini Naidu; Mother of the Indian Revolution — Bhikaji Cama; Grand Old Lady — Aruna Asaf Ali.","Saint of the Gutters — Mother Teresa; Punyashlok — Ahilyabai Holkar; Durga Bhabhi — Durgawati Devi; Captain Lakshmi — Lakshmi Sahgal."],"part":["Part 1 · Leaders, reformers and women of India","नेता, समाज सुधारक और महिलाएँ"],"g":"pp"},
{"id":"P4","heat":2,"title":"Nicknames of sportspersons","hi":"खिलाड़ियों के उपनाम","blocks":[{"k":"hot","h":"Most asked: <b>Flying Sikh<\/b> (Milkha Singh), <b>Payyoli Express<\/b> and <b>Golden Girl<\/b> (P. T. Usha), <b>Dhing Express<\/b> (Hima Das), <b>The Wizard<\/b> (Dhyan Chand), and cricket's <b>Wall, Captain Cool, Hitman, Master Blaster<\/b> and <b>Haryana Hurricane<\/b>."},{"k":"story","h":"<p>A sports nickname is a headline in two words. Milkha Singh beat Pakistan's best sprinter in Lahore in 1960, and General Ayub Khan told him he had not run but flown — the <b>Flying Sikh<\/b> was born. P. T. Usha's speed was named after her village — the <b>Payyoli Express<\/b> — and Hima Das, from Dhing in Assam, became the <b>Dhing Express<\/b>.<\/p><p>Cricket names describe a style: Rahul Dravid stood firm like <b>The Wall<\/b>, M. S. Dhoni stayed calm as <b>Captain Cool<\/b>, Rohit Sharma hits hard as the <b>Hitman<\/b>. Many names carry a place: <b>Haryana<\/b> Hurricane, <b>Mysore<\/b> Express, Nawab of <b>Najafgarh<\/b>, Prince of <b>Kolkata<\/b>, Tiger of <b>Madras<\/b>, <b>Sikkimese<\/b> Sniper, <b>Rawalpindi<\/b> Express.<\/p>","key":"Flying Sikh — Milkha; Payyoli Express — Usha; Dhing Express — Hima; Wizard — Dhyan Chand; Wall — Dravid; Captain Cool — Dhoni."},{"k":"table","title":"Indian sportspersons","head":["Nickname","Sportsperson","Note"],"rows":[["Flying Sikh","Milkha Singh","Named by Pakistan's General Ayub Khan after a race in Lahore (1960)."],["Payyoli Express","P. T. Usha","From her village, Payyoli in Kerala; fourth in the 400 m hurdles at Los Angeles 1984."],["Golden Girl","P. T. Usha","For her many Asian golds; also the title of her autobiography."],["Dhing Express","Hima Das","From Dhing in Assam; world under-20 400 m champion (2018)."],["The Wizard","Dhyan Chand","Hockey's magician; his birthday, 29 August, is National Sports Day."],["Pocket Dynamo","K. D. Jadhav","Wrestler; India's first individual Olympic medal, bronze at Helsinki 1952."],["Golden Boy","Neeraj Chopra","Javelin gold at the Tokyo Olympics (held 2021)."],["Magnificent Mary","M. C. Mary Kom","Six-time world amateur boxing champion from Manipur."],["Tiger of Madras","Viswanathan Anand","India's first chess Grandmaster (1988); five-time world champion."],["Sikkimese Sniper","Baichung Bhutia","Striker and former India football captain."],["Captain Fantastic","Sunil Chhetri","India's highest goal-scorer in men's international football."],["The Wall","Rahul Dravid","For his solid defence as a Test batsman."],["Captain Cool","M. S. Dhoni","Calm captain of the 2007, 2011 and 2013 ICC title wins."],["Hitman","Rohit Sharma","The only batsman with three ODI double centuries (as of October 2026)."],["Chase Master","Virat Kohli","For winning run-chases in one-day cricket."],["Master Blaster","Sachin Tendulkar","100 international centuries; also called the 'God of Cricket'."],["Haryana Hurricane","Kapil Dev","Fast bowler; captain of the 1983 World Cup winners."],["Nawab of Najafgarh","Virender Sehwag","From Najafgarh, Delhi; India's first Test triple-centurion."],["Prince of Kolkata","Sourav Ganguly","Also 'Dada'; later President of the BCCI."],["Turbanator","Harbhajan Singh","Off-spinner; first Indian Test hat-trick (2001)."],["Jumbo","Anil Kumble","Leg-spinner; took all ten wickets in a Test innings (1999)."],["Mysore Express","Javagal Srinath","Fast bowler from Mysuru."],["Lady Tendulkar","Mithali Raj","The most runs in women's ODIs (7,805, as of October 2026)."],["Tiger Pataudi","Mansur Ali Khan Pataudi","Became India's Test captain at 21 (1962)."]]},{"k":"photos","title":"Nicknames in pictures","items":[["Milkha_Singh","Milkha Singh","Flying Sikh"],["P._T._Usha","P. T. Usha","Payyoli Express"],["Hima_Das","Hima Das","Dhing Express"],["Dhyan_Chand","Dhyan Chand","The Wizard"],["Neeraj_Chopra","Neeraj Chopra","Golden Boy"],["Mary_Kom","M. C. Mary Kom","Magnificent Mary"],["Viswanathan_Anand","Viswanathan Anand","Tiger of Madras"],["Rahul_Dravid","Rahul Dravid","The Wall"],["MS_Dhoni","M. S. Dhoni","Captain Cool"],["Kapil_Dev","Kapil Dev","Haryana Hurricane"]]},{"k":"table","title":"Sportspersons of the world","head":["Nickname","Sportsperson","Note"],"rows":[["Rawalpindi Express","Shoaib Akhtar","Pakistan fast bowler; first to be timed at 100 mph (2003)."],["Sultan of Swing","Wasim Akram","Pakistan left-arm fast bowler."],["The Don","Don Bradman","Australia; Test batting average 99.94."],["Universe Boss","Chris Gayle","West Indies; first T20 international century."],["Mr 360","AB de Villiers","South Africa; could hit the ball to every part of the ground."],["Black Pearl","Pelé","Brazil; won three football World Cups (1958, 1962, 1970)."],["Lightning Bolt","Usain Bolt","Jamaica; world records in the 100 m and 200 m."],["Flying Finn","Paavo Nurmi","Finland; nine Olympic gold medals in distance running."],["King of Clay","Rafael Nadal","Spain; won the French Open 14 times."],["The Greatest","Muhammad Ali","USA; three-time world heavyweight boxing champion."],["Iron Mike","Mike Tyson","USA; youngest heavyweight boxing champion (1986)."],["La Pulga (the Flea)","Lionel Messi","Argentina; World Cup winner 2022."],["Baltimore Bullet","Michael Phelps","USA swimmer; 23 Olympic gold medals."],["Czech Locomotive","Emil Zátopek","Won the 5,000 m, 10,000 m and marathon at Helsinki 1952."],["Swiss Maestro","Roger Federer","Switzerland; eight Wimbledon singles titles."]]},{"k":"link","h":"The games, trophies and records behind these names are in <a href=\"study-sports.html\">Sports<\/a>; sportspersons' autobiographies (Playing It My Way, The Race of My Life) are in <a href=\"study-books-authors.html?lesson=B7\">Books &amp; Authors, B7<\/a>; sports awards in <a href=\"study-awards.html?lesson=A5\">Awards &amp; Honours, A5<\/a>."},{"k":"trick","h":"<b>Express trains run from home towns<\/b>: Payyoli (Usha), Dhing (Hima), Mysore (Srinath), Rawalpindi (Shoaib). <b>Gold by age<\/b>: Usha the Golden <b>Girl<\/b> (1980s), Neeraj the Golden <b>Boy<\/b> (2021)."},{"k":"trap","h":"<b>Little Master<\/b> was first <b>Sunil Gavaskar<\/b>; Tendulkar is also called Little Master but is best known as the <b>Master Blaster<\/b>. <b>Tiger of Madras<\/b> is Anand (chess), but <b>Tiger Pataudi<\/b> is the cricket captain. The <b>Flying Finn<\/b> (Nurmi) is not the <b>Flying Sikh<\/b> (Milkha)."}],"sum":["Flying Sikh — Milkha Singh (named by Ayub Khan, 1960); Payyoli Express and Golden Girl — P. T. Usha; Dhing Express — Hima Das.","The Wizard — Dhyan Chand; Pocket Dynamo — K. D. Jadhav; Golden Boy — Neeraj Chopra; Magnificent Mary — Mary Kom.","Tiger of Madras — Viswanathan Anand; Sikkimese Sniper — Baichung Bhutia; Captain Fantastic — Sunil Chhetri.","The Wall — Dravid; Captain Cool — Dhoni; Hitman — Rohit Sharma; Master Blaster — Tendulkar; Little Master — Gavaskar (first).","Haryana Hurricane — Kapil Dev; Nawab of Najafgarh — Sehwag; Turbanator — Harbhajan; Jumbo — Kumble; Lady Tendulkar — Mithali Raj.","World: Rawalpindi Express — Shoaib Akhtar; Black Pearl — Pelé; Flying Finn — Nurmi; King of Clay — Nadal; The Don — Bradman."],"part":["Part 2 · Sport, screen and the world","खेल, सिनेमा और विश्व"],"g":"pp"},
{"id":"P5","heat":1,"title":"Titles in film, music and the arts","hi":"फ़िल्म, संगीत और कला की उपाधियाँ","blocks":[{"k":"hot","h":"Asked now and then: <b>Tragedy King<\/b> (Dilip Kumar), <b>Showman<\/b> (Raj Kapoor), <b>Dream Girl<\/b> (Hema Malini), <b>Father of Indian Cinema<\/b> (Dadasaheb Phalke), <b>Swar Kokila<\/b> (Lata Mangeshkar), <b>Mozart of Madras<\/b> (A. R. Rahman), and the poets' titles — <b>Upanyas Samrat, Modern Meera, Rashtrakavi<\/b>."},{"k":"story","h":"<p>Film fans name their stars after the roles they play. Dilip Kumar died on screen so often, and so movingly, that he became the <b>Tragedy King<\/b>; Meena Kumari was his <b>Tragedy Queen<\/b>. Raj Kapoor made big, colourful films full of songs — the <b>Showman<\/b>. Amitabh Bachchan's roles in Zanjeer and Deewaar made him the <b>Angry Young Man<\/b>, and Hema Malini kept the name of her film <b>Dream Girl<\/b>.<\/p><p>Writers and musicians are crowned too. Premchand, who wrote of farmers and clerks, is the <b>Upanyas Samrat<\/b> (emperor of novels); Mahadevi Varma, who wrote of longing for the divine, is the <b>Modern Meera<\/b>; Lata Mangeshkar's voice made her <b>Swar Kokila<\/b>, the cuckoo of melody.<\/p>","key":"Tragedy King — Dilip Kumar; Showman — Raj Kapoor; Dream Girl — Hema Malini; Swar Kokila — Lata Mangeshkar; Upanyas Samrat — Premchand."},{"k":"table","title":"Film stars","head":["Title","Star","Note"],"rows":[["Tragedy King","Dilip Kumar","For sad, intense roles such as Devdas (1955)."],["Tragedy Queen","Meena Kumari","For roles such as Sahib Bibi Aur Ghulam and Pakeezah."],["The Showman","Raj Kapoor","Called the greatest showman of Indian cinema (Awara, Shree 420)."],["Dream Girl","Hema Malini","From her 1977 film Dream Girl."],["Evergreen Hero","Dev Anand","Starred for six decades."],["First Superstar","Rajesh Khanna","Gave a long run of hits from 1969 to 1971."],["Angry Young Man","Amitabh Bachchan","From Zanjeer (1973) and Deewaar (1975)."],["King Khan","Shah Rukh Khan","Also 'King of Romance'."],["Mr Perfectionist","Aamir Khan","For his careful choice and preparation of roles."],["He-Man","Dharmendra","Action star of Sholay (1975)."],["Bharat Kumar","Manoj Kumar","For patriotic films such as Upkar and Purab Aur Paschim."],["Jumping Jack","Jeetendra","For his energetic dancing."],["Dadamoni","Ashok Kumar","'Elder brother' in Bengali; an early hero of Hindi films."],["Venus of Indian Cinema","Madhubala","Star of Mughal-e-Azam (1960)."],["Thalaivar","Rajinikanth","'Leader' in Tamil; Dadasaheb Phalke Award 2019 (given 2021)."],["Ulaganayagan","Kamal Haasan","'Universal hero' in Tamil."],["Puratchi Thalaivar","M. G. Ramachandran","'Revolutionary leader'; actor who became Chief Minister of Tamil Nadu."],["Khiladi","Akshay Kumar","From his run of 'Khiladi' films from 1992."],["Father of Indian Cinema","Dadasaheb Phalke","Made Raja Harishchandra (1913), India's first full-length feature film."]]},{"k":"table","title":"Music, painting and literature","head":["Title","Artist","Note"],"rows":[["Swar Kokila","Lata Mangeshkar","Also the 'Nightingale of India' in music; Bharat Ratna 2001."],["Mozart of Madras","A. R. Rahman","Composer; two Oscars for Slumdog Millionaire (2009)."],["Isaignani","Ilaiyaraaja","'Musical genius' — Tamil film composer."],["Gana Gandharvan","K. J. Yesudas","'Celestial singer' — Malayalam playback singer."],["Malika-e-Tarannum","Noor Jehan","'Queen of melody'; singer and actor who moved to Pakistan."],["Picasso of India","M. F. Husain","Painter of the Progressive Artists' Group."],["Shakespeare of India","Kalidasa","Sanskrit poet-dramatist of Abhijnanasakuntalam."],["Upanyas Samrat","Premchand","'Emperor of novels' — Godan, Gaban, Nirmala."],["Modern Meera","Mahadevi Varma","Chhayavad poet of longing and devotion."],["Poet of Nature (Hindi)","Sumitranandan Pant","Chhayavad poet of the Kumaon hills; first Jnanpith in Hindi (1968)."],["Rebel Poet","Kazi Nazrul Islam","'Bidrohi Kobi'; national poet of Bangladesh."],["Kaviguru","Rabindranath Tagore","'Poet-teacher'; the first Asian Nobel laureate (1913)."]]},{"k":"link","h":"The singers' styles and gharanas are in <a href=\"study-music-instruments.html?lesson=M7\">Music, M7<\/a>; dancers and their gurus in <a href=\"study-classical-dances.html\">Classical Dances<\/a>; the Dadasaheb Phalke Award winners in <a href=\"study-awards.html?lesson=A4\">Awards &amp; Honours, A4<\/a>; the poets' books in <a href=\"study-books-authors.html?lesson=B4\">Books &amp; Authors, B4<\/a>."},{"k":"trick","h":"<b>Tragedy pair<\/b>: King Dilip, Queen Meena. <b>Tamil titles end in 'leader'<\/b>: Thalaivar (Rajinikanth), Puratchi Thalaivar (MGR). <b>Three Bharats<\/b>: Bharat Kumar (Manoj Kumar), Bharat Ratna (the award), Bharat Kokila (Sarojini Naidu)."},{"k":"trap","h":"<b>The Showman<\/b> is <b>Raj Kapoor<\/b>; Subhash Ghai was later called the 'showman' of the 1980s and 90s — the classic answer stays Raj Kapoor. <b>Rashtrakavi<\/b> is <b>Maithili Sharan Gupt<\/b> (Gandhi's name for him), though Dinkar is also called a national poet. <b>Nightingale of India<\/b>: Sarojini Naidu in history, Lata Mangeshkar in music."}],"sum":["Tragedy King — Dilip Kumar; Tragedy Queen — Meena Kumari; Showman — Raj Kapoor; Dream Girl — Hema Malini.","Evergreen — Dev Anand; First Superstar — Rajesh Khanna; Angry Young Man — Amitabh Bachchan; Bharat Kumar — Manoj Kumar.","Thalaivar — Rajinikanth; Ulaganayagan — Kamal Haasan; Puratchi Thalaivar — MGR; Father of Indian Cinema — Dadasaheb Phalke.","Swar Kokila — Lata Mangeshkar; Mozart of Madras — A. R. Rahman; Isaignani — Ilaiyaraaja; Picasso of India — M. F. Husain.","Shakespeare of India — Kalidasa; Upanyas Samrat — Premchand; Modern Meera — Mahadevi Varma; Rebel Poet — Nazrul Islam."],"part":["Part 2 · Sport, screen and the world","खेल, सिनेमा और विश्व"],"g":"pp"},
{"id":"P6","heat":2,"title":"Nicknames of world leaders and figures","hi":"विश्व नेताओं और हस्तियों के उपनाम","blocks":[{"k":"hot","h":"Most asked: <b>Iron Lady<\/b> (Thatcher), <b>Lady with the Lamp<\/b> (Florence Nightingale), <b>Maid of Orleans<\/b> (Joan of Arc), <b>Desert Fox<\/b> (Rommel), <b>Man of Destiny<\/b> (Napoleon), <b>Iron Chancellor<\/b> (Bismarck), and the <b>Father of the Nation<\/b> of Pakistan, Bangladesh, Turkey and the USA."},{"k":"story","h":"<p>Nicknames travel faster than history books. A Soviet army newspaper mocked Margaret Thatcher as the <b>Iron Lady<\/b> in 1976, and she wore the name with pride. Florence Nightingale walked the hospital wards of the Crimean War at night with a lamp — the <b>Lady with the Lamp<\/b>. Joan of Arc, a farm girl, led France to victory at Orléans — the <b>Maid of Orleans<\/b>.<\/p><p>Generals got names from their enemies and their soldiers: the British called Rommel the <b>Desert Fox<\/b>; Napoleon's men called him the <b>Little Corporal<\/b>. And almost every free nation has a <b>father<\/b>: Jinnah for Pakistan, Mujib for Bangladesh, Atatürk for Turkey, Washington for the United States, Mandela for South Africa.<\/p>","key":"Iron Lady — Thatcher; Lady with the Lamp — Nightingale; Maid of Orleans — Joan of Arc; Desert Fox — Rommel; Man of Destiny — Napoleon."},{"k":"table","title":"World figures: nickname → person","head":["Nickname","Person","Note"],"rows":[["Iron Lady","Margaret Thatcher","Britain's first woman Prime Minister (1979–90)."],["Lady with the Lamp","Florence Nightingale","Nursed soldiers at night in the Crimean War (1850s)."],["Maid of Orleans","Joan of Arc","Led the French at Orléans (1429); burnt at Rouen (1431)."],["Desert Fox","Erwin Rommel","German general in North Africa in the Second World War."],["Man of Destiny","Napoleon Bonaparte","Emperor of the French (1804); defeated at Waterloo (1815)."],["Little Corporal","Napoleon Bonaparte","His soldiers' affectionate name for him."],["Iron Chancellor","Otto von Bismarck","United Germany in 1871 by 'blood and iron'."],["Iron Duke","Duke of Wellington","Arthur Wellesley, who defeated Napoleon at Waterloo."],["Great Emancipator","Abraham Lincoln","Freed the slaves of the rebel states (1863); also 'Honest Abe'."],["Madiba","Nelson Mandela","His clan name; first black President of South Africa (1994)."],["Uncle Ho","Ho Chi Minh","Leader of Vietnam's fight for independence."],["Il Duce","Benito Mussolini","'The Leader' — Italy's Fascist dictator."],["Great Helmsman","Mao Zedong","Founder of the People's Republic of China (1949)."],["El Libertador","Simón Bolívar","Freed much of South America from Spain; Bolivia is named after him."],["Mwalimu","Julius Nyerere","'Teacher' in Swahili; first President of Tanzania."],["African Gandhi","Kenneth Kaunda","First President of Zambia; non-violent freedom struggle."],["Hero of Two Worlds","Giuseppe Garibaldi","Fought in South America and for Italian unity."],["Bard of Avon","William Shakespeare","Born at Stratford-upon-Avon (1564)."],["Father of History","Herodotus","Greek writer of the Histories (5th century BCE)."],["Father of English Poetry","Geoffrey Chaucer","Wrote The Canterbury Tales."],["Father of Economics","Adam Smith","Wrote The Wealth of Nations (1776)."],["King of Pop","Michael Jackson","Thriller (1982) is the best-selling album ever."]]},{"k":"photos","title":"World figures and their names","items":[["Margaret_Thatcher","Margaret Thatcher","Iron Lady"],["Florence_Nightingale","Florence Nightingale","Lady with the Lamp"],["Joan_of_Arc","Joan of Arc","Maid of Orleans"],["Erwin_Rommel","Erwin Rommel","Desert Fox"],["Napoleon","Napoleon Bonaparte","Man of Destiny"],["Otto_von_Bismarck","Otto von Bismarck","Iron Chancellor"],["Nelson_Mandela","Nelson Mandela","Madiba"],["Mustafa_Kemal_Atatürk","Mustafa Kemal Atatürk","Father of the Turks"]]},{"k":"table","title":"Fathers of nations","head":["Country","Father of the Nation","Note"],"rows":[["Pakistan","Muhammad Ali Jinnah","'Quaid-e-Azam' (Great Leader)."],["Bangladesh","Sheikh Mujibur Rahman","'Bangabandhu' (friend of Bengal); in June 2025 Bangladesh's interim government dropped 'Father of the Nation' from the law."],["Turkey","Mustafa Kemal Atatürk","'Atatürk' means 'father of the Turks' — a surname given to him in 1934."],["the United States","George Washington","First President (1789–97); 'Father of His Country'."],["the Republic of China","Sun Yat-sen","Inspired the 1911 revolution that ended China's last empire."],["South Africa","Nelson Mandela","Fought apartheid; spent 27 years in prison."],["Kenya","Jomo Kenyatta","First President of Kenya (1964)."],["Ghana","Kwame Nkrumah","Led Ghana to freedom in 1957, one of the first African colonies to win it."],["Myanmar","Aung San","General who won freedom from Britain; father of Aung San Suu Kyi."],["Sri Lanka","D. S. Senanayake","First Prime Minister of Ceylon (1947)."],["Vietnam","Ho Chi Minh","Declared Vietnam independent in 1945."],["Singapore","Lee Kuan Yew","First Prime Minister (1959–90)."],["Indonesia","Sukarno","Proclaimed independence in 1945; first President."],["Tanzania","Julius Nyerere","Led Tanganyika to freedom (1961)."],["Nepal","Prithvi Narayan Shah","Unified Nepal in the 18th century."]]},{"k":"facts","title":"Italy's three makers","rows":[["Soul of Italian unity","Giuseppe <b>Mazzini<\/b> — founded Young Italy (1831)"],["Sword of Italian unity","Giuseppe <b>Garibaldi<\/b> — his Red Shirts took Sicily and Naples (1860)"],["Brain of Italian unity","Count <b>Cavour<\/b> — Prime Minister of Piedmont-Sardinia"]]},{"k":"link","h":"The revolutions and wars these leaders fought are in <a href=\"study-world-history.html\">World History<\/a> (L29); the world's 'firsts' (first woman PM, first man in space) are in <a href=\"study-firsts-symbols.html?lesson=F6\">Firsts, F6<\/a>; scientists' 'father of' titles in <a href=\"study-inventions.html?lesson=I10\">Inventions, I10<\/a>."},{"k":"trick","h":"<b>Three irons<\/b>: Iron <b>Lady<\/b> — Thatcher (Britain), Iron <b>Chancellor<\/b> — Bismarck (Germany), Iron <b>Duke<\/b> — Wellington (Britain). <b>Italy's body<\/b>: Mazzini the soul, Garibaldi the sword, Cavour the brain."},{"k":"trap","h":"<b>Lady with the Lamp<\/b> is Florence <b>Nightingale<\/b>; the <b>Nightingale of India<\/b> is Sarojini Naidu — the word 'nightingale' is the trap. The <b>Iron Duke<\/b> (Wellington) beat Napoleon, the <b>Man of Destiny<\/b>. <b>Atatürk<\/b> is a title-surname meaning 'father of the Turks', not his birth name."}],"sum":["Iron Lady — Thatcher; Lady with the Lamp — Florence Nightingale; Maid of Orleans — Joan of Arc; Desert Fox — Rommel.","Man of Destiny and Little Corporal — Napoleon; Iron Chancellor — Bismarck; Iron Duke — Wellington; Great Emancipator — Lincoln.","Madiba — Mandela; Uncle Ho — Ho Chi Minh; Il Duce — Mussolini; Great Helmsman — Mao; El Libertador — Bolívar; Mwalimu — Nyerere.","Fathers: Jinnah (Pakistan), Mujib (Bangladesh), Atatürk (Turkey), Washington (USA), Sun Yat-sen (Republic of China), Kenyatta (Kenya).","Italy: Mazzini the soul, Garibaldi the sword, Cavour the brain. Bard of Avon — Shakespeare; Father of History — Herodotus."],"part":["Part 2 · Sport, screen and the world","खेल, सिनेमा और विश्व"],"g":"pp"},
{"id":"P7","heat":3,"title":"Famous slogans, lines and quotes","hi":"प्रसिद्ध नारे, पंक्तियाँ और कथन","blocks":[{"k":"hot","h":"Most asked: who gave <b>Swaraj is my birthright<\/b>, <b>Do or Die<\/b>, <b>Give me blood…<\/b>, <b>Jai Jawan Jai Kisan<\/b> (and who added <b>Jai Vigyan<\/b> and <b>Jai Anusandhan<\/b>), <b>Garibi Hatao<\/b>, <b>Total Revolution<\/b>; who <b>coined<\/b> Inquilab Zindabad, Jai Hind and Quit India; and who wrote <b>Saare Jahan Se Achha<\/b>."},{"k":"story","h":"<p>A slogan is a whole speech in four words. Tilak said Swaraj was a <b>birthright<\/b>; Gandhi, in August 1942, told the country to <b>do or die<\/b>; Bose asked for <b>blood<\/b> in return for freedom. After independence the slogans changed: Shastri saluted the soldier and the farmer — <b>Jai Jawan, Jai Kisan<\/b> — and later Prime Ministers added the scientist (<b>Jai Vigyan<\/b>, Vajpayee, 1998) and the researcher (<b>Jai Anusandhan<\/b>, Modi, 2019).<\/p><p>Many slogans were <b>coined<\/b> by one person and <b>made famous<\/b> by another. The poet Hasrat Mohani coined <b>Inquilab Zindabad<\/b>; Bhagat Singh made the courtroom ring with it. Yusuf Meherally coined <b>Quit India<\/b>; Gandhi made it a movement. Exams love to ask which of the two.<\/p>","key":"Birthright — Tilak; Do or Die — Gandhi; blood — Bose; Jawan-Kisan — Shastri, + Vigyan — Vajpayee, + Anusandhan — Modi."},{"k":"table","title":"Slogans and words of Indian leaders","head":["Slogan or words","Who","When and where"],"rows":[["Swaraj is my birthright and I shall have it","Bal Gangadhar Tilak","Said during the Home Rule movement (1916)."],["Karo ya Maro (Do or Die)","Mahatma Gandhi","At Gowalia Tank, Bombay, on 8 August 1942, launching Quit India."],["Tum mujhe khoon do, main tumhe azadi dunga","Subhas Chandra Bose","'Give me blood and I will give you freedom' — to the INA in Burma (1944)."],["Jai Jawan, Jai Kisan","Lal Bahadur Shastri","During the 1965 war and a food shortage."],["Jai Vigyan (added to Jai Jawan, Jai Kisan)","Atal Bihari Vajpayee","After the Pokhran-II tests of 1998."],["Jai Anusandhan (added to the line)","Narendra Modi","At the Indian Science Congress, Jalandhar, in January 2019."],["Garibi Hatao","Indira Gandhi","'Remove poverty' — her slogan for the 1971 election."],["Sampoorna Kranti (Total Revolution)","Jayaprakash Narayan","At Gandhi Maidan, Patna, on 5 June 1974."],["Every blow on me is a nail in the coffin of British rule","Lala Lajpat Rai","After the lathi charge at the Simon Commission protest, Lahore (1928)."],["Educate, agitate, organise","B. R. Ambedkar","His call to the depressed classes."],["Arise, awake and stop not till the goal is reached","Swami Vivekananda","Taken from the Katha Upanishad; National Youth Day marks his birthday."],["Back to the Vedas","Dayananda Saraswati","The call of the Arya Samaj (1875)."],["One caste, one religion, one God for man","Sree Narayana Guru","The Kerala reformer who founded the SNDP Yogam (1903)."],["Long years ago we made a tryst with destiny","Jawaharlal Nehru","At midnight on 14–15 August 1947 in the Constituent Assembly."],["It takes a loud voice to make the deaf hear","Bhagat Singh","In the leaflet thrown with the bombs in the Central Assembly (8 April 1929)."],["Dushman ki goliyon ka hum samna karenge, azad hi rahe hain, azad hi rahenge","Chandra Shekhar Azad","He kept his vow and was never taken alive (Allahabad, 1931)."],["Indira is India, and India is Indira","D. K. Barooah","Congress President during the Emergency (1975–77)."]]},{"k":"facts","title":"Coined by one, made famous by another","rows":[["Inquilab Zindabad","Coined by the poet <b>Hasrat Mohani<\/b> (1921); made famous by <b>Bhagat Singh<\/b> and the HSRA"],["Jai Hind","Coined by <b>Abid Hasan Safrani<\/b>, Bose's aide; made the greeting of the INA by <b>Subhas Chandra Bose<\/b>"],["Quit India","Coined by <b>Yusuf Meherally<\/b> (who also coined 'Simon Go Back'); the movement was <b>Gandhi's<\/b> (1942)"],["Dilli Chalo","<b>Subhas Chandra Bose<\/b>'s call to the INA (1943)"],["Satyameva Jayate","From the <b>Mundaka Upanishad<\/b>; popularised as a national slogan by <b>Madan Mohan Malaviya<\/b> (1918); now under the State Emblem"],["Sarfaroshi ki tamanna","Written by <b>Bismil Azimabadi<\/b>; sung and made famous by <b>Ram Prasad Bismil<\/b>"]]},{"k":"table","title":"Songs and lines — who wrote them","head":["Lines","Written by","Note"],"rows":[["Saare Jahan Se Achha","Muhammad Iqbal","Written in 1904 as Tarana-e-Hind."],["Ae Mere Watan Ke Logon","Kavi Pradeep","Sung by Lata Mangeshkar in Delhi on 27 January 1963, after the war with China."],["Jhanda Ooncha Rahe Hamara","Shyamlal Gupta 'Parshad'","The flag song of 1924."],["Khoob ladi mardani woh to Jhansi wali rani thi","Subhadra Kumari Chauhan","From her poem Jhansi ki Rani."],["Singhasan khali karo ki janata aati hai","Ramdhari Singh Dinkar","J. P. Narayan recited it at the Ramlila Maidan rally of 25 June 1975."],["Sarfaroshi ki tamanna ab hamare dil mein hai","Bismil Azimabadi","Made famous by Ram Prasad Bismil and the Kakori revolutionaries."],["Hum Dekhenge","Faiz Ahmad Faiz","A poem of protest written in Pakistan in 1979."],["Vande Mataram","Bankim Chandra Chatterjee","In his novel Anandamath (1882)."]]},{"k":"table","title":"World quotes","head":["Quote","Who","Note"],"rows":[["I have a dream","Martin Luther King Jr.","At the March on Washington, 1963."],["Veni, vidi, vici (I came, I saw, I conquered)","Julius Caesar","After a quick victory in 47 BCE."],["Give me liberty, or give me death!","Patrick Henry","American patriot, 1775."],["Workers of the world, unite!","Karl Marx and Friedrich Engels","The Communist Manifesto (1848)."],["I have nothing to offer but blood, toil, tears and sweat","Winston Churchill","His first speech as Prime Minister, May 1940."],["Government of the people, by the people, for the people","Abraham Lincoln","The Gettysburg Address, 1863."],["Ask not what your country can do for you","John F. Kennedy","His inaugural address, 1961."],["Man is born free, and everywhere he is in chains","Jean-Jacques Rousseau","The Social Contract (1762)."],["I think, therefore I am","René Descartes","The French philosopher's first certainty."],["Peace, Land, Bread","Vladimir Lenin","The Bolshevik slogan of 1917."],["The only thing we have to fear is fear itself","Franklin D. Roosevelt","His first inaugural address, 1933, in the Great Depression."],["Political power grows out of the barrel of a gun","Mao Zedong","Said in 1927."],["History will absolve me","Fidel Castro","His defence speech at his trial in Cuba (1953)."]]},{"k":"link","h":"The core freedom-struggle slogans are also listed in <a href=\"study-world-history.html?lesson=L30\">World History, L30<\/a> and <a href=\"study-history-modern.html\">Modern India<\/a> (L23–L24); the national song and anthem in <a href=\"study-firsts-symbols.html?lesson=F1\">Firsts &amp; National Symbols, F1<\/a>."},{"k":"trick","h":"<b>The growing slogan<\/b>: Jawan + Kisan (<b>S<\/b>hastri, 19<b>65<\/b>) → + Vigyan (<b>V<\/b>ajpayee, 19<b>98<\/b>) → + Anusandhan (<b>M<\/b>odi, 20<b>19<\/b>) — <span class=\"mn\">S-V-M<\/span>, soldier, science, mission."},{"k":"trap","h":"<b>Inquilab Zindabad<\/b>: coined by Hasrat Mohani, popularised by Bhagat Singh. <b>Jai Hind<\/b>: coined by Abid Hasan, popularised by Bose. <b>Saare Jahan Se Achha<\/b> was written by <b>Iqbal<\/b>, but in 1984 it was <b>Rakesh Sharma<\/b> who quoted it from space. <b>Singhasan khali karo<\/b> is Dinkar's poem, recited by J. P."}],"sum":["Swaraj is my birthright — Tilak; Do or Die — Gandhi (8 August 1942, Gowalia Tank); Give me blood… and Dilli Chalo — Bose.","Jai Jawan Jai Kisan — Shastri (1965); Jai Vigyan — Vajpayee (1998); Jai Anusandhan — Modi (2019).","Garibi Hatao — Indira Gandhi (1971); Total Revolution — J. P. Narayan (1974); Indira is India — D. K. Barooah.","Inquilab Zindabad — coined by Hasrat Mohani; Jai Hind — Abid Hasan; Quit India and Simon Go Back — Yusuf Meherally.","Satyameva Jayate — Mundaka Upanishad, popularised by Malaviya; Saare Jahan Se Achha — Iqbal; Ae Mere Watan Ke Logon — Kavi Pradeep.","World: I have a dream — MLK; Veni vidi vici — Caesar; Workers of the world, unite — Marx and Engels; I think, therefore I am — Descartes."],"part":["Part 3 · Slogans, memorials, places and names","नारे, समाधियाँ, स्थान और उपनाम"],"g":"pp"},
{"id":"P8","heat":2,"title":"Samadhis, memorials and statues","hi":"समाधियाँ, स्मारक और प्रतिमाएँ","blocks":[{"k":"hot","h":"Most asked: <b>Raj Ghat<\/b> (Gandhi), <b>Shanti Van<\/b> (Nehru), <b>Vijay Ghat<\/b> (Shastri), <b>Shakti Sthal<\/b> (Indira), <b>Veer Bhumi<\/b> (Rajiv), <b>Kisan Ghat<\/b> (Charan Singh), <b>Samata Sthal<\/b> (Jagjivan Ram), <b>Sadaiv Atal<\/b> (Vajpayee) and <b>Chaitya Bhoomi<\/b> (Ambedkar); and the big statues — Unity, Equality, Social Justice, Prosperity."},{"k":"story","h":"<p>Along the Yamuna in Delhi runs a green belt of memorials. It begins at <b>Raj Ghat<\/b>, where Gandhi was cremated in 1948. Nehru's <b>Shanti Van<\/b> (forest of peace), Shastri's <b>Vijay Ghat<\/b> (victory), Indira's <b>Shakti Sthal<\/b> (strength) and Rajiv's <b>Veer Bhumi<\/b> (the brave) follow. Each name says something about the leader: <b>Kisan Ghat<\/b> for the farmers' leader Charan Singh, <b>Samata Sthal<\/b> (equality) for Jagjivan Ram, <b>Sangharsh Sthal<\/b> (struggle) for Devi Lal.<\/p><p>Land by the river ran short, so in 2013 the government decided that future leaders would share one complex, the <b>Rashtriya Smriti Sthal<\/b>. Vajpayee's <b>Sadaiv Atal<\/b> (2018) stands there. In January 2025 a plot there was set aside for <b>Pranab Mukherjee<\/b>, and in March 2025 the family of <b>Manmohan Singh<\/b> — cremated at Nigambodh Ghat in December 2024 — accepted a plot beside it.<\/p>","key":"Raj Ghat–Gandhi · Shanti Van–Nehru · Vijay Ghat–Shastri · Shakti Sthal–Indira · Veer Bhumi–Rajiv · Kisan Ghat–Charan Singh · Sadaiv Atal–Vajpayee."},{"k":"table","title":"Samadhis and memorial ghats","head":["Samadhi","Leader","Note"],"rows":[["Raj Ghat","Mahatma Gandhi","Cremated here on 31 January 1948; a black marble platform by the Yamuna."],["Shanti Van","Jawaharlal Nehru","'Forest of peace'; Sanjay Gandhi was also cremated nearby."],["Vijay Ghat","Lal Bahadur Shastri","'Ghat of victory', for the 1965 war; he died at Tashkent (1966)."],["Shakti Sthal","Indira Gandhi","'Place of strength'; beside Shanti Van."],["Veer Bhumi","Rajiv Gandhi","'Land of the brave'; he was killed at Sriperumbudur (1991)."],["Kisan Ghat","Charan Singh","For the farmers' leader and fifth Prime Minister."],["Samata Sthal","Jagjivan Ram","'Place of equality'; former Deputy Prime Minister."],["Sangharsh Sthal","Devi Lal","'Place of struggle'; former Deputy Prime Minister."],["Ekta Sthal","Giani Zail Singh","'Place of unity'; R. Venkataraman's memorial is in the same area."],["Karma Bhumi","Shankar Dayal Sharma","'Land of duty'; the ninth President."],["Uday Bhumi","K. R. Narayanan","'Land of dawn'; the tenth President."],["Jannayak Sthal","Chandra Shekhar","'Place of the people's leader'; Prime Minister 1990–91."],["Smriti Sthal","I. K. Gujral","Prime Minister 1997–98."],["Sadaiv Atal","Atal Bihari Vajpayee","'Forever Atal'; opened on 25 December 2018 in the Rashtriya Smriti Sthal."],["Abhay Ghat (Ahmedabad)","Morarji Desai","On the Sabarmati; Prime Minister 1977–79."],["Narayan Ghat (Ahmedabad)","Gulzarilal Nanda","Twice acting Prime Minister (1964 and 1966)."],["Mahaprayan Ghat (Patna)","Rajendra Prasad","India's first President."],["Gyan Bhumi (Hyderabad)","P. V. Narasimha Rao","Prime Minister 1991–96; cremated in Hyderabad."],["Chaitya Bhoomi (Mumbai)","B. R. Ambedkar","At Dadar, by the sea; crowds gather on 6 December, Mahaparinirvan Din."]]},{"k":"photos","title":"The memorials in pictures","items":[["Raj_Ghat_and_associated_memorials","Raj Ghat","Mahatma Gandhi"],["Shanti_Van","Shanti Van","Jawaharlal Nehru"],["Vijay_Ghat","Vijay Ghat","Lal Bahadur Shastri"],["Shakti_Sthal","Shakti Sthal","Indira Gandhi"],["Sadaiv_Atal","Sadaiv Atal","Atal Bihari Vajpayee"],["Chaitya_Bhoomi","Chaitya Bhoomi","B. R. Ambedkar"],["Deekshabhoomi","Deekshabhoomi","Ambedkar's conversion, 1956"],["Statue_of_Unity","Statue of Unity","Vallabhbhai Patel"],["Statue_of_Equality_(Ramanuja)","Statue of Equality","Ramanujacharya"]]},{"k":"facts","title":"Other memorials and places of memory (as of October 2026)","rows":[["Rashtriya Smriti Sthal, Delhi","Common memorial complex near Raj Ghat (decided 2013). A site for <b>Pranab Mukherjee<\/b> was earmarked in January 2025 and its building cleared in July 2026; <b>Manmohan Singh<\/b>'s family accepted a plot in March 2025"],["Gandhi Smriti (Birla House), Delhi","Where Gandhi was shot on 30 January 1948"],["Aga Khan Palace, Pune","Samadhis of <b>Kasturba Gandhi<\/b> and <b>Mahadev Desai<\/b>, who died there in detention (1942–44)"],["Hussainiwala, Ferozepur (Punjab)","National Martyrs Memorial where <b>Bhagat Singh, Rajguru and Sukhdev<\/b> were cremated (1931)"],["Chandrashekhar Azad Park, Prayagraj","The old Alfred Park, where <b>Azad<\/b> died fighting (27 February 1931)"],["Deekshabhoomi, Nagpur","Where <b>Ambedkar<\/b> took up Buddhism with his followers (14 October 1956)"],["26 Alipur Road, Delhi","Where Ambedkar died; now the <b>Dr Ambedkar National Memorial<\/b> (2018)"],["Pradhanmantri Sangrahalaya, Teen Murti","Museum of all of India's Prime Ministers, opened 2022 in Nehru's old home"],["Marina Beach, Chennai","Memorials of <b>C. N. Annadurai, M. G. Ramachandran, J. Jayalalithaa and M. Karunanidhi<\/b>"],["Vivekananda Rock Memorial, Kanyakumari","Where Vivekananda meditated in December 1892; built 1970"],["Rashtra Prerna Sthal, Lucknow","Opened on 25 December 2025 with 65-ft statues of <b>Syama Prasad Mookerjee, Deendayal Upadhyaya and Atal Bihari Vajpayee<\/b>"]]},{"k":"table","title":"Statues and whom they honour","head":["Statue","Honours","Note"],"rows":[["Statue of Unity","Vallabhbhai Patel","182 m, at Ekta Nagar (Kevadia), Gujarat, 2018 — the world's tallest statue."],["Statue of Equality","Ramanujacharya","216 ft, seated, at Hyderabad, 2022 — for the 11th-century saint."],["Statue of Social Justice","B. R. Ambedkar","125-ft statue on an 81-ft base at Vijayawada, January 2024."],["Statue of Prosperity","Kempegowda","108 ft, at Bengaluru airport, 2022 — the founder of Bengaluru."],["Statue under the canopy at India Gate","Subhas Chandra Bose","28-ft granite statue unveiled on 8 September 2022."],["133-ft statue at Kanyakumari","Thiruvalluvar","The Tamil poet of the Tirukkural; set up in 2000."]]},{"k":"link","h":"Monuments and their builders (India Gate, Victoria Memorial) are in <a href=\"study-heritage-monuments.html?lesson=H7\">Heritage &amp; Monuments, H7<\/a>; the days that honour these leaders (Parakram Diwas, National Unity Day) in <a href=\"study-important-days.html?lesson=D1\">Important Days, D1<\/a>."},{"k":"trick","h":"<b>Read the meaning<\/b>: Shanti (peace) — Nehru the peacemaker; Vijay (victory) — Shastri of 1965; Shakti (strength) — Indira; Veer (brave) — Rajiv; Kisan — Charan Singh; Samata (equality) — Jagjivan Ram; Sangharsh (struggle) — Devi Lal; Ekta (unity) — Zail Singh; Karma (duty) — Shankar Dayal Sharma; Uday (dawn) — K. R. Narayanan."},{"k":"trap","h":"<b>Chaitya Bhoomi<\/b> (Mumbai) is Ambedkar's samadhi; <b>Deekshabhoomi<\/b> (Nagpur) is where he became a Buddhist. <b>Abhay Ghat<\/b> and <b>Narayan Ghat<\/b> are in <b>Ahmedabad<\/b>, not Delhi. <b>Ekta Sthal<\/b> (Zail Singh) is not the <b>Statue of Unity<\/b> (Patel) or <b>Ekta Nagar<\/b>, its town."}],"sum":["Raj Ghat — Gandhi; Shanti Van — Nehru; Vijay Ghat — Shastri; Shakti Sthal — Indira; Veer Bhumi — Rajiv.","Kisan Ghat — Charan Singh; Samata Sthal — Jagjivan Ram; Sangharsh Sthal — Devi Lal; Ekta Sthal — Zail Singh.","Karma Bhumi — Shankar Dayal Sharma; Uday Bhumi — K. R. Narayanan; Jannayak Sthal — Chandra Shekhar; Smriti Sthal — Gujral.","Sadaiv Atal — Vajpayee (2018); Abhay Ghat — Morarji Desai and Narayan Ghat — Nanda (both Ahmedabad); Mahaprayan Ghat — Rajendra Prasad.","Chaitya Bhoomi — Ambedkar (Mumbai); Gyan Bhumi — Narasimha Rao (Hyderabad). Rashtriya Smriti Sthal: plots for Pranab Mukherjee and Manmohan Singh.","Statues: Unity — Patel; Equality — Ramanuja; Social Justice — Ambedkar; Prosperity — Kempegowda; Rashtra Prerna Sthal, Lucknow (2025)."],"part":["Part 3 · Slogans, memorials, places and names","नारे, समाधियाँ, स्थान और उपनाम"],"g":"pp"},
{"id":"P9","heat":2,"title":"Birthplaces, places and pen names","hi":"जन्मस्थान, जुड़े स्थान और उपनाम","blocks":[{"k":"hot","h":"Asked: where leaders were <b>born<\/b> (Gandhi — Porbandar, Bose — Cuttack, Ambedkar — Mhow, Patel — Nadiad, Shastri — Mughalsarai), the place tied to a person (<b>Sabarmati, Santiniketan, Belur Math, Anand Bhavan<\/b>), and writers' <b>pen names<\/b>."},{"k":"story","h":"<p>Every great life has a map. Gandhi was born at <b>Porbandar<\/b> on the Gujarat coast, set out on the Dandi March from his <b>Sabarmati Ashram<\/b>, and spent his last years at <b>Sevagram<\/b>. Tagore was born in the family mansion at <b>Jorasanko<\/b> in Kolkata and built his school at <b>Santiniketan<\/b>. Bose was born at <b>Cuttack<\/b> and escaped from his house on Elgin Road, now <b>Netaji Bhawan<\/b>.<\/p><p>Writers often hid behind a <b>pen name<\/b>. Tagore wrote his first songs as <b>Bhanusimha<\/b>; Harivansh Rai Srivastava kept his childhood name <b>Bachchan<\/b>; Eric Blair became <b>George Orwell<\/b> — and was born in India, at Motihari.<\/p>","key":"Born: Gandhi–Porbandar, Bose–Cuttack, Patel–Nadiad, Ambedkar–Mhow, Shastri–Mughalsarai, Kalam–Rameswaram."},{"k":"table","title":"Where they were born","head":["Person","Born at","Note"],"rows":[["Mahatma Gandhi","Porbandar (Gujarat)","2 October 1869; the house is now the Kirti Mandir."],["Rabindranath Tagore","Jorasanko, Kolkata","The Tagore family house (1861)."],["Subhas Chandra Bose","Cuttack (Odisha)","23 January 1897 — now Parakram Diwas."],["Vallabhbhai Patel","Nadiad (Gujarat)","31 October 1875 — now National Unity Day."],["B. R. Ambedkar","Mhow (Madhya Pradesh)","14 April 1891; the town is now Dr Ambedkar Nagar."],["Bhagat Singh","Banga, Lyallpur district (now in Pakistan)","1907; his family village is Khatkar Kalan in Punjab."],["Rani Lakshmibai","Varanasi","Born Manikarnika; she grew up at the Peshwa's court in Bithoor."],["Lal Bahadur Shastri","Mughalsarai (Uttar Pradesh)","2 October 1904 — the same date as Gandhi."],["A. P. J. Abdul Kalam","Rameswaram (Tamil Nadu)","15 October 1931; his memorial is at Pei Karumbu, Rameswaram."],["Rajendra Prasad","Ziradei (Bihar)","In Siwan district (1884)."],["Atal Bihari Vajpayee","Gwalior (Madhya Pradesh)","25 December 1924 — now Good Governance Day."],["Dayananda Saraswati","Tankara (Gujarat)","In Morbi district (1824)."],["Raja Ram Mohan Roy","Radhanagar (West Bengal)","In Hooghly district (1772)."],["Bal Gangadhar Tilak","Ratnagiri (Maharashtra)","On the Konkan coast (1856)."],["Mother Teresa","Skopje (now North Macedonia)","Born in 1910; she came to India in 1929."]]},{"k":"table","title":"Places and the people linked with them","head":["Place","Person","Why"],"rows":[["Sabarmati Ashram, Ahmedabad","Mahatma Gandhi","His home from 1917 to 1930; the Dandi March began here."],["Santiniketan","Rabindranath Tagore","He founded Visva-Bharati there (1921); a World Heritage site since 2023."],["Anand Bhavan, Prayagraj","Motilal Nehru","The Nehru family home; Indira Gandhi was born there."],["Belur Math","Swami Vivekananda","He founded it (1898) as the headquarters of the Ramakrishna Mission."],["Dakshineswar Kali Temple","Ramakrishna Paramahansa","He was its priest."],["Puducherry (the ashram)","Sri Aurobindo","He lived there from 1910 to 1950."],["Tiruvannamalai","Ramana Maharshi","He lived at the foot of the Arunachala hill."],["Kalady (Kerala)","Adi Shankaracharya","His birthplace, on the Periyar."],["Netaji Bhawan, Kolkata","Subhas Chandra Bose","His family home on Elgin Road, from where he escaped in 1941."]]},{"k":"facts","title":"Gandhi's map","rows":[["Phoenix Settlement and Tolstoy Farm","His two settlements in South Africa (1904, 1910)"],["Kochrab and Sabarmati, Ahmedabad","His first ashrams in India (1915, 1917)"],["Sevagram, Wardha","His ashram from 1936"],["Champaran, Bihar","His first satyagraha in India (1917)"],["Aga Khan Palace, Pune","Detained there in 1942–44"],["Birla House, Delhi","Killed there on 30 January 1948 — now Gandhi Smriti"]]},{"k":"table","title":"More pen names","head":["Pen name","Real name","Note"],"rows":[["Bachchan","Harivansh Rai Srivastava","Poet of Madhushala."],["Bhanusimha","Rabindranath Tagore","His teenage pen name for songs in the Vaishnava style."],["Amrita Pritam","Amrit Kaur","Punjabi poet of Pinjar."],["Kusumagraj","Vishnu Vaman Shirwadkar","Marathi poet; his birthday, 27 February, is Marathi Bhasha Din."],["Kalki","R. Krishnamurthy","Tamil writer of Ponniyin Selvan."],["Josh Malihabadi","Shabbir Hasan Khan","Urdu poet called 'Shayar-e-Inquilab'."],["Majrooh Sultanpuri","Asrar ul Hassan Khan","Urdu poet and film lyricist."],["Shivani","Gaura Pant","Hindi novelist of the Kumaon hills."],["Dhoomil","Sudama Pandey","Hindi poet of protest."],["Banaphool","Balai Chand Mukhopadhyay","Bengali writer and doctor."],["Mark Twain","Samuel Langhorne Clemens","Wrote The Adventures of Tom Sawyer."],["George Orwell","Eric Arthur Blair","Born at Motihari, Bihar (1903)."],["George Eliot","Mary Ann Evans","Wrote Middlemarch."],["Voltaire","François-Marie Arouet","French thinker of the Enlightenment."],["O. Henry","William Sydney Porter","American short-story writer."]]},{"k":"link","h":"The pen names asked most — <b>Premchand<\/b> (Dhanpat Rai Srivastava), <b>Nirala<\/b> (Suryakant Tripathi), <b>Dinkar<\/b> (Ramdhari Singh), <b>Gulzar<\/b> (Sampooran Singh Kalra), <b>Agyeya<\/b>, <b>Firaq Gorakhpuri<\/b>, <b>Sahir<\/b> and <b>Kaifi Azmi<\/b> — are in <a href=\"study-books-authors.html?lesson=B4\">Books &amp; Authors, B4<\/a>, with their books."},{"k":"trick","h":"<b>Gujarat gave three<\/b>: Gandhi (Porbandar), Patel (Nadiad), Dayananda (Tankara). <b>2 October twins<\/b>: Gandhi (1869) and Shastri (1904). <b>Orwell was Indian-born<\/b> — Motihari, Bihar."},{"k":"trap","h":"Gandhi was born at <b>Porbandar<\/b> but began the Dandi March from <b>Sabarmati<\/b>. Bose was born at <b>Cuttack<\/b> (Odisha), not Kolkata. Ambedkar was born at <b>Mhow<\/b> (Madhya Pradesh), not in Maharashtra. Bhagat Singh's birthplace, <b>Banga<\/b>, is now in <b>Pakistan<\/b>."}],"sum":["Born: Gandhi — Porbandar; Tagore — Jorasanko, Kolkata; Bose — Cuttack; Patel — Nadiad; Ambedkar — Mhow.","Born: Bhagat Singh — Banga (Pakistan); Lakshmibai — Varanasi; Shastri — Mughalsarai; Kalam — Rameswaram; Rajendra Prasad — Ziradei.","Born: Vajpayee — Gwalior; Dayananda — Tankara; Ram Mohan Roy — Radhanagar; Tilak — Ratnagiri; Mother Teresa — Skopje.","Places: Sabarmati — Gandhi; Santiniketan — Tagore; Belur Math — Vivekananda; Dakshineswar — Ramakrishna; Puducherry — Aurobindo.","Pen names: Bachchan — Harivansh Rai Srivastava; Bhanusimha — Tagore; Kusumagraj — V. V. Shirwadkar; Kalki — R. Krishnamurthy.","World pen names: Mark Twain — Samuel Clemens; George Orwell — Eric Blair; George Eliot — Mary Ann Evans; Voltaire — François-Marie Arouet."],"part":["Part 3 · Slogans, memorials, places and names","नारे, समाधियाँ, स्थान और उपनाम"],"g":"pp"},
{"id":"P10","heat":2,"title":"Real names and mixed revision","hi":"मूल नाम और मिश्रित पुनरावृत्ति","blocks":[{"k":"hot","h":"Exams mix this whole topic into 'which pair is correctly matched' and 'which is NOT' questions. Most wrong answers come from <b>look-alikes<\/b> — Lokmanya and Loknayak, the two Nightingales, Chaitya Bhoomi and Deekshabhoomi. This lesson sets them side by side and adds the <b>real names<\/b> behind famous names."},{"k":"story","h":"<p>Revise this app in three sweeps. First the <b>titles<\/b>: say each leader's title and who gave it — Tagore's 'Mahatma', Bose's 'Father of the Nation', Gandhi's 'Gurudev', Bardoli's 'Sardar'. Then the <b>words<\/b>: each slogan with its speaker, and each coined slogan with the person who made it famous. Last the <b>places<\/b>: walk along the Yamuna from Raj Ghat to Sadaiv Atal, then out to Porbandar, Cuttack, Mhow and Mumbai.<\/p><p>Many famous people were born with other names. Narendranath Datta became <b>Swami Vivekananda<\/b>, Mool Shankar became <b>Dayananda Saraswati<\/b>, Margaret Noble became <b>Sister Nivedita<\/b>, and Yusuf Khan became <b>Dilip Kumar<\/b>. Learn them in pairs, the way the Lab plays them.<\/p>","key":"Narendranath — Vivekananda; Mool Shankar — Dayananda; Gadadhar — Ramakrishna; Margaret Noble — Nivedita; Yusuf Khan — Dilip Kumar."},{"k":"table","title":"Born with another name","head":["Known as","Born as","Note"],"rows":[["Swami Vivekananda","Narendranath Datta","Disciple of Ramakrishna; spoke at Chicago in 1893."],["Dayananda Saraswati","Mool Shankar","Founded the Arya Samaj (1875)."],["Ramakrishna Paramahansa","Gadadhar Chattopadhyay","The saint of Dakshineswar."],["Swami Shraddhanand","Munshi Ram","Founded the Gurukul at Kangri, Haridwar (1902)."],["Sister Nivedita","Margaret Elizabeth Noble","Irish disciple of Vivekananda."],["Mother Teresa","Anjezë Gonxhe Bojaxhiu","Founded the Missionaries of Charity (1950)."],["Rani Lakshmibai","Manikarnika Tambe","Called 'Manu' as a child."],["Mahavira","Vardhamana","The 24th Jain Tirthankara."],["Dilip Kumar","Muhammad Yusuf Khan","Born in Peshawar (1922)."],["Madhubala","Mumtaz Jehan Dehlavi","Star of Mughal-e-Azam."],["Rajinikanth","Shivaji Rao Gaikwad","Was a bus conductor in Bengaluru before films."],["Kishore Kumar","Abhas Kumar Ganguly","Younger brother of Ashok Kumar."],["Lenin","Vladimir Ilyich Ulyanov","Led the Bolshevik Revolution (1917)."],["Pope Leo XIV","Robert Francis Prevost","Elected on 8 May 2025 — the first pope from the United States."]]},{"k":"table","title":"Look-alikes side by side","head":["This","is not this","Remember"],"rows":[["Lokmanya — Tilak","Loknayak — J. P. Narayan","Accepted by the people vs leader of the people."],["Deshbandhu — C. R. Das","Deenbandhu — C. F. Andrews (also Sir Chhotu Ram)","Friend of the country vs friend of the poor."],["Nightingale of India — Sarojini Naidu (poetry)","Nightingale of India — Lata Mangeshkar (music)","Read the subject of the question."],["Nightingale of India","Lady with the Lamp — Florence Nightingale","The surname is the trap."],["Little Master — Sunil Gavaskar (first)","Master Blaster — Sachin Tendulkar","Tendulkar was later also called Little Master."],["Iron Man of India — Vallabhbhai Patel","Iron Lady of India — Indira Gandhi; Iron Lady — Margaret Thatcher","Man, Lady, Lady of Manipur (Irom Sharmila)."],["Mahatma — Gandhi (from Tagore)","Mahatma — Jyotiba Phule (1888)","Phule's title came first."],["Punjab Kesari — Lala Lajpat Rai","Sher-e-Punjab — Maharaja Ranjit Singh (also Lajpat Rai)","Kesari and Sher both mean lion."],["Rashtrakavi — Maithili Sharan Gupt (Gandhi's name)","Dinkar — also called a national poet","The exam answer for Gandhi's Rashtrakavi is Gupt."],["Chandra Shekhar Azad — revolutionary","Maulana Abul Kalam Azad — pen name 'Azad'","Alfred Park, 1931 vs first Education Minister."],["Chaitya Bhoomi, Mumbai — Ambedkar's samadhi","Deekshabhoomi, Nagpur — his conversion (1956)","Samadhi vs diksha."],["Ekta Sthal — Zail Singh's samadhi (Delhi)","Statue of Unity — Patel (Ekta Nagar, Gujarat)","Both mean unity."],["Rashtriya Smriti Sthal — Delhi","Rashtra Prerna Sthal — Lucknow (2025)","Samadhi complex vs statue park."],["Tiger of Madras — Viswanathan Anand","Tiger Pataudi — cricket; Tiger of Mysore — Tipu Sultan","Chess, cricket, history."],["Flying Sikh — Milkha Singh","Flying Finn — Paavo Nurmi","India vs Finland."]]},{"k":"trick","h":"<b>Chain the facts<\/b>: born → title → memorial. Shastri: Mughalsarai → Jai Jawan Jai Kisan → Vijay Ghat. Vajpayee: Gwalior → Jai Vigyan → Sadaiv Atal. Ambedkar: Mhow → Babasaheb → Chaitya Bhoomi. Patel: Nadiad → Sardar, Iron Man → Statue of Unity."},{"k":"trap","h":"<b>Coined vs made famous<\/b> is the commonest double-answer trap: Inquilab Zindabad (Hasrat Mohani / Bhagat Singh), Jai Hind (Abid Hasan / Bose), Quit India (Yusuf Meherally / Gandhi), Sarfaroshi (Bismil Azimabadi / Ram Prasad Bismil). Read whether the question says <b>coined<\/b>, <b>wrote<\/b>, <b>gave<\/b> or <b>is associated with<\/b>."}],"sum":["Born as: Vivekananda — Narendranath Datta; Dayananda — Mool Shankar; Ramakrishna — Gadadhar Chattopadhyay; Nivedita — Margaret Noble.","Born as: Mother Teresa — Anjezë Gonxhe Bojaxhiu; Lakshmibai — Manikarnika; Mahavira — Vardhamana; Pope Leo XIV — Robert Francis Prevost.","Film: Dilip Kumar — Yusuf Khan; Madhubala — Mumtaz Jehan; Rajinikanth — Shivaji Rao Gaikwad; Kishore Kumar — Abhas Kumar Ganguly.","Look-alikes: Lokmanya–Tilak vs Loknayak–JP; Deshbandhu–C. R. Das vs Deenbandhu–Andrews; Chaitya Bhoomi vs Deekshabhoomi.","Chains: Shastri — Mughalsarai, Jai Jawan Jai Kisan, Vijay Ghat; Vajpayee — Gwalior, Jai Vigyan, Sadaiv Atal."],"part":["Part 3 · Slogans, memorials, places and names","नारे, समाधियाँ, स्थान और उपनाम"],"g":"pp"}
];

["P1","Who is popularly known as 'Netaji'?",["Subhas Chandra Bose","C. Rajagopalachari","Surya Sen","Dadabhai Naoroji"],"Subhas Chandra Bose — 'Netaji'. 'Respected leader' — first used for him in Germany in 1942.","","","",""],
["P1","Who is popularly known as 'Sardar'?",["Vallabhbhai Patel","Surya Sen","Khan Abdul Ghaffar Khan","V. D. Savarkar"],"Vallabhbhai Patel — 'Sardar'. Given by the women of Bardoli after the Bardoli Satyagraha of 1928.","","","",""],
["P1","Who is popularly known as 'Iron Man of India'?",["Vallabhbhai Patel","Madan Mohan Malaviya","Surya Sen","Jawaharlal Nehru"],"Vallabhbhai Patel — 'Iron Man of India'. For joining more than 560 princely states to India after 1947.","","","",""],

["P1","Who is popularly known as 'Father of Indian Unrest'?",["Bal Gangadhar Tilak","Chittaranjan Das","Mahatma Gandhi","Madan Mohan Malaviya"],"Bal Gangadhar Tilak — 'Father of Indian Unrest'. A label from the British journalist Valentine Chirol (Indian Unrest, 1910).","","","",""],
["P1","Who is popularly known as 'Deshbandhu'?",["Chittaranjan Das","Jatindra Mohan Sengupta","Surya Sen","Subhas Chandra Bose"],"Chittaranjan Das — 'Deshbandhu'. 'Friend of the country'; founded the Swaraj Party with Motilal Nehru (1923).","","","",""],
["P1","Who is popularly known as 'Grand Old Man of India'?",["Dadabhai Naoroji","Mahatma Gandhi","Rajendra Prasad","Vallabhbhai Patel"],"Dadabhai Naoroji — 'Grand Old Man of India'. Gave the 'drain theory'; three times Congress President.","","","",""],

["P1","Who is popularly known as 'Gurudev'?",["Rabindranath Tagore","Jawaharlal Nehru","C. Rajagopalachari","Chittaranjan Das"],"Rabindranath Tagore — 'Gurudev'. Gandhi's name for him.","","","",""],
["P1","Who is popularly known as 'Mahamana'?",["Madan Mohan Malaviya","Surya Sen","Subhas Chandra Bose","B. R. Ambedkar"],"Madan Mohan Malaviya — 'Mahamana'. 'Great-minded'; founded the Banaras Hindu University (1916).","","","",""],
["P1","Who is popularly known as 'Deshratna'?",["Rajendra Prasad","Subhas Chandra Bose","Jawaharlal Nehru","B. R. Ambedkar"],"Rajendra Prasad — 'Deshratna'. 'Jewel of the country'; India's first President.","","","",""],
["P1","Who is popularly known as 'Loknayak'?",["Jayaprakash Narayan","C. Rajagopalachari","Dadabhai Naoroji","Bhagat Singh"],"Jayaprakash Narayan — 'Loknayak'. 'People's leader'; led the 1974 movement for Total Revolution.","","","",""],
["P1","Who is popularly known as 'Shaheed-e-Azam'?",["Bhagat Singh","Mahatma Gandhi","Rajendra Prasad","Dadabhai Naoroji"],"Bhagat Singh — 'Shaheed-e-Azam'. 'The greatest martyr'; hanged at Lahore on 23 March 1931.","","","",""],
["P1","Who is popularly known as 'Masterda'?",["Surya Sen","C. Rajagopalachari","Subhas Chandra Bose","Dadabhai Naoroji"],"Surya Sen — 'Masterda'. He was a schoolteacher; led the Chittagong Armoury Raid (1930).","","","",""],
["P1","Who is popularly known as 'Frontier Gandhi'?",["Khan Abdul Ghaffar Khan","B. R. Ambedkar","Surya Sen","Bhagat Singh"],"Khan Abdul Ghaffar Khan — 'Frontier Gandhi'. Also Badshah Khan; led the Khudai Khidmatgars ('Red Shirts').","","","",""],

["P1","Who is popularly known as 'Babasaheb'?",["B. R. Ambedkar","Vallabhbhai Patel","Subhas Chandra Bose","Surya Sen"],"B. R. Ambedkar — 'Babasaheb'. 'Respected father'; chaired the Drafting Committee of the Constitution.","","","",""],
["P1","Who is popularly known as 'Swatantryaveer'?",["V. D. Savarkar","Surya Sen","Subhas Chandra Bose","C. Rajagopalachari"],"V. D. Savarkar — 'Swatantryaveer'. 'Hero of freedom'; jailed in the Cellular Jail, Port Blair.","","","",""],

["P1","Who is popularly known as 'Deshnayak'?",["Subhas Chandra Bose","Madan Mohan Malaviya","Jawaharlal Nehru","Rabindranath Tagore"],"Subhas Chandra Bose — 'Deshnayak'. 'Leader of the country' — Tagore greeted him with it in 1939.","","","",""],
["P1","Who gave the title 'Mahatma' to Gandhi?",["Rabindranath Tagore","Subhas Chandra Bose","Winston Churchill","Akbar II"],"Rabindranath Tagore gave 'Mahatma' to Gandhi. Tagore is usually credited (around 1915); 'Mahatma' means 'great soul'.",""],
["P1","Who gave the title 'Father of the Nation' to Gandhi?",["Subhas Chandra Bose","Jawaharlal Nehru","Ajit Singh of Khetri","The women of Bardoli"],"Subhas Chandra Bose gave 'Father of the Nation' to Gandhi. In a radio broadcast on 6 July 1944, asking for Gandhi's blessings for the INA.",""],
["P1","Who gave the title 'Gurudev' to Tagore?",["Mahatma Gandhi","Subhas Chandra Bose","Winston Churchill","Akbar II"],"Mahatma Gandhi gave 'Gurudev' to Tagore. Gandhi's respectful name for the poet of Santiniketan.",""],

["P1","Who gave the title 'Father of Indian Unrest' to Tilak?",["Valentine Chirol","Ajit Singh of Khetri","Subhas Chandra Bose","Winston Churchill"],"Valentine Chirol gave 'Father of Indian Unrest' to Tilak. A British journalist; he wrote Indian Unrest (1910).",""],
["P1","Who gave the title 'Half-naked fakir' to Gandhi?",["Winston Churchill","Jawaharlal Nehru","Ajit Singh of Khetri","Subhas Chandra Bose"],"Winston Churchill gave 'Half-naked fakir' to Gandhi. A sneer of 1931, when Gandhi went to meet the Viceroy in a loincloth.",""],

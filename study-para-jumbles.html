["J12","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Wearing one, therefore, can save a rider’s life.\nQ. Even a small fall can cause a serious head injury.\nR. Riding a bicycle without a helmet is risky.\nS. A helmet absorbs most of the force of such a fall.",["RQSP","QRSP","RSQP","RQPS"],"Claim R → reason Q → ‘such a fall’ in S → ‘one’ (a helmet) and ‘therefore’ in P.",""],
["J12","The first (S1) and the last (S6) sentences are given. Arrange P, Q, R and S in the right order between them.\nS1. Many people think that being successful means earning a lot of money.\nP. Some of the richest people in the world say they feel empty inside.\nQ. On the other hand, many people with simple jobs feel proud and content.\nR. But money alone does not make people happy.\nS. They enjoy their work and the respect it brings them.\nS6. True success, then, may lie in doing what we love and doing it well.",["RPQS","PRQS","RQPS","RPSQ"],"‘But’ (R) answers S1; P supports it; ‘On the other hand’ (Q) gives the contrast; ‘They’ in S is the people of Q.",""],
["J12","Which of these sentences should come LAST in a meaningful paragraph?\nP. On his eightieth birthday, his grandson secretly took it to a watchmaker.\nQ. When the old man opened his gift and heard it ticking, his eyes filled with tears.\nR. Grandfather’s watch had stopped working years ago.\nS. Nobody in the family had bothered to repair it.",["Q","P","R","S"],"The broken watch (R, S) → the secret repair (P) → the gift opened (Q), the last event.",""],
["J12","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Some birds travel thousands of kilometres every year.\nP. No other bird is known to make a longer journey.\nQ. How birds find their way over such distances is still not fully understood.\nR. Scientists think they use the Sun, the stars and the Earth’s magnetic field as guides.\nS. The Arctic tern, for example, flies from the Arctic to the Antarctic and back.",["SPQR","PSQR","SQPR","SPRQ"],"‘for example’ (S) illustrates S1; P comments on that journey; ‘such distances’ in Q; R answers the puzzle of Q.",""],
["J12","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nP. The parcel\nQ. which I had ordered\nR. has finally arrived.\nS. a week ago",["PQSR","QPSR","PSQR","RPQS"],"Subject (P) + its ‘which’ clause (QS) + verb (R).",""],
["J12","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Their stories teach us that failure is a step towards success, not the end.\nQ. Each failure, he said, taught him one more way that did not work.\nR. Many great people failed many times before they succeeded.\nS. Thomas Edison, for instance, tried hundreds of materials before he found one that worked in his light bulb.",["R","P","Q","S"],"R is the general claim. S has a name but says ‘for instance’; ‘he said’ in Q and ‘Their stories’ in P point back.",""],
["J12","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. The driver found it in the evening and went straight to the police station.\nQ. A woman left her purse in an autorickshaw.\nR. The police traced the woman, and she got all her money back.\nS. It contained her salary for the whole month.",["QSPR","SQPR","QPSR","QSRP"],"‘a purse’ (Q) → ‘It’ (S); ‘The driver’ of the autorickshaw finds it (P); ‘The police’ (R) follows the station visit.",""],
["J12","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Rainforests cover only a small part of the Earth’s land.\nP. Sadly, large areas are cut down every year for timber and farming.\nQ. Yet they are home to more than half of all the kinds of plants and animals on the planet.\nR. If this goes on, countless species may be lost for ever.\nS. Many of our medicines also come from plants found in them.",["QSPR","SQPR","QPSR","QSRP"],"‘Yet’ (Q) contrasts with ‘only a small part’ in S1; ‘also’ (S) adds a value; ‘Sadly’ (P) turns to the threat; ‘If this goes on’ (R) follows it.",""],
["J12","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nBegins: Hardly anyone\nP. believed\nQ. that the young athlete\nR. would break\nS. the national record.",["PQRS","QPRS","PRQS","PRSQ"],"‘Hardly anyone’ + verb (P) + ‘that’ clause: subject (Q) + verb (R) + object (S).",""],
["J12","Which of these sentences should come LAST in a meaningful paragraph?\nP. Yet many people say that a handwritten letter still means more than any message.\nQ. Today, a message reaches anyone in the world in seconds.\nR. People waited days, sometimes weeks, for a reply.\nS. In the past, letters were the main way to stay in touch with faraway friends.",["P","Q","R","S"],"Past (S, R) → today (Q) → ‘Yet’ a closing thought (P).",""],
["J12","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Coral reefs are often called the rainforests of the sea.\nQ. But rising sea temperatures are turning many of them white and lifeless.\nR. Like rainforests, they are home to a huge variety of life.\nS. This process, known as coral bleaching, has become more common in recent years.",["PRQS","RPQS","PRSQ","PQSR"],"Opener P; ‘Like rainforests’ in R explains the name; ‘But’ in Q turns to the threat; ‘This process’ in S names it.",""],
["J12","The first (S1) and the last (S6) sentences are given. Arrange P, Q, R and S in the right order between them.\nS1. Our grandmother tells the best stories in the family.\nP. Often she stops at the most exciting moment.\nQ. Then, smiling, she says the rest will come tomorrow.\nR. Every night after dinner, we gather around her bed.\nS. She tells us tales of kings, ghosts and clever animals.\nS6. Those evenings with her are among my happiest memories.",["RSPQ","SRPQ","RPSQ","RSQP"],"‘her’ in R is the grandmother of S1; the tales (S) → stopping (P) → ‘Then’ (Q) → S6.",""],
["J12","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Chandrayaan-3 landed near the south pole of the Moon in August 2023.\nQ. With this, India became the first country to land a craft in that region.\nR. Its rover, Pragyan, moved about on the surface and studied the soil.\nS. The success made millions of Indians proud.",["P","Q","R","S"],"P names the mission. ‘With this’, ‘Its rover’ and ‘The success’ point back.",""],
["J12","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nBegins: To everyone’s surprise,\nP. scored\nQ. the youngest player\nR. in the team\nS. the winning goal.",["QRPS","QSPR","PSQR","RPQS"],"After the fixed words: subject (QR) + verb (P) + object (S).",""]
];

  .steps + .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .steps + .stack > .plain,.steps + .stack > .row,.steps + .stack > p,.steps + .stack > .fig,.steps + .stack > h2,.steps + .stack > .tbl{grid-column:1/-1}
  .steps + .stack > .plain{max-width:86ch;font-size:17px}
  .steps + .stack > .hot,.steps + .stack > .story{grid-column:1/-1}
  .steps + .stack > .story{max-width:none;padding:20px 24px;font-size:17.5px}
  .steps + .stack > .story p{max-width:80ch}
  .steps + .stack:not(:has(> .block ~ .block)) > .block{grid-column:1/-1}
  .block,.qcard{padding:18px 20px;border-radius:14px}

  /* quizzes and question bank */
  #lq > .stack{display:grid;grid-template-columns:minmax(0,1fr);max-width:980px;gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qt{font-size:18px}
  #plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #plist .opts{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:wrap;overflow:visible}

  /* mock test: question with the answer grid alongside */
  .mbar{top:calc(env(safe-area-inset-top,0px) + 67px)}
  .view > .qcard{max-width:1000px}
  .view > .row.between{max-width:1000px}
  .view > #msub{max-width:1000px;width:100%}
  .view > .block.stack{max-width:760px}
  .pal{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .kpis{max-width:760px}

  /* revise: summary cards and sheets in columns */
  #rv > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #rv > .stack > .grph,#rv > .stack > p,#rv > .stack > .search,#rv > .stack > .callout{grid-column:1/-1}
  #dgl,#lml,#tll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #dgl > .grph,#dgl > p,#lml > p,#tll > .grph{grid-column:1/-1}
  #rv .search,#rv > #dgl ~ .search{max-width:520px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flash{min-height:300px;max-width:760px;margin:0 auto;padding:32px 36px}
  .flash .front{font-size:22px}

  /* learn: era cards across the top */
  .eras{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}
  .les{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}

</style>
<script id="shabd-deeplink">
(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();
</script>

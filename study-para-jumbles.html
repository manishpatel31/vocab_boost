["J4","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Arjun lent his bicycle to his friend Kabir.\nQ. Kabir rode it to the market but left it unlocked outside a shop.\nR. When he came out, the bicycle was gone.\nS. Ashamed, he went to Arjun and offered to pay for a new one.",["PQRS","QPRS","PRQS","PQSR"],"‘it’ in Q is the bicycle of P; ‘he’ in R is Kabir, coming out of the shop of Q; ‘Ashamed’ in S follows the loss.",""],
["J4","Which of these sentences should come FIRST in a meaningful paragraph?\nP. It lies on the border between Nepal and China.\nQ. Mount Everest is the highest mountain in the world.\nR. Its height is about 8,849 metres.\nS. Each year, hundreds of climbers try to reach its top.",["Q","P","R","S"],"Q names Mount Everest. ‘It’ in P and ‘Its’ / ‘its’ in R and S need it first.",""],
["J4","The first (S1) and the last (S6) sentences are given. Arrange P, Q, R and S in the right order between them.\nS1. The government has launched a scheme to give free bicycles to girls in rural schools.\nP. Some of them leave school because the journey is too tiring.\nQ. With a bicycle, they can reach school in a few minutes.\nR. This, the government hopes, will keep more girls in school.\nS. Many girls in villages have to walk several kilometres to school.\nS6. The scheme is thus a small step towards a big change.",["SPQR","PSQR","SQRP","QSPR"],"S describes the girls; ‘Some of them’ in P needs them; Q shows how the bicycle helps; ‘This’ in R points to that help.",""],
["J4","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. It tried to crack the shell with its teeth but failed.\nQ. Then it carried the nut to a rock and dropped it from the top.\nR. The shell broke open, and the squirrel enjoyed its meal.\nS. A little squirrel found a large nut under an oak tree.",["SPQR","PSQR","SQPR","QSPR"],"S introduces the squirrel and the nut; ‘It’ in P is the squirrel; ‘Then’ in Q is its second attempt; R is the result.",""],
["J4","Which of these sentences should come FIRST in a meaningful paragraph?\nP. The boat, they say, could replace the noisy diesel boats on the backwaters.\nQ. Its roof is covered with panels that charge a battery.\nR. The battery then drives a small, quiet motor.\nS. Some students at a college in Kerala have built a boat that runs on solar power.",["S","P","Q","R"],"S introduces the students and the boat. ‘Its’ in Q, ‘The battery then’ in R and ‘they say’ in P point back.",""],
["J4","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. The ant is a tiny insect, but it is very hard-working.\nP. We can learn from it the value of planning ahead.\nQ. When winter comes, it has plenty to eat.\nR. This food is stored in its underground nest.\nS. It spends the summer gathering food.",["SRQP","RSQP","SQRP","SQPR"],"‘It’ in S is the ant of S1; ‘This food’ in R is the food of S; winter (Q) follows summer; P draws the lesson.",""],
["J4","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Their parents are proud of them.\nQ. Maya and her brother Dev both wanted to be doctors.\nR. She studied medicine in Delhi, while he went to Chennai.\nS. Both of them now work in the same hospital in their home town.",["QRSP","RQSP","SQRP","QSPR"],"‘She … he’ in R needs the names in Q; ‘now’ in S comes after their studies; P closes the paragraph.",""],
["J4","Which of these sentences should come FIRST in a meaningful paragraph?\nP. With a few taps, we can order almost anything from home.\nQ. This convenience, however, has hurt many small shopkeepers.\nR. The goods are then delivered to our doorstep.\nS. Smartphones have changed the way we shop.",["S","P","Q","R"],"S names the topic. P explains it, ‘then’ in R follows P, and ‘This convenience, however’ in Q points back.",""],
["J4","Which of these sentences should come LAST in a meaningful paragraph?\nP. In the end, he agreed to go, though his legs trembled at every turn.\nQ. Dhruv had always been afraid of heights.\nR. Standing at the top, he looked at the valley below and felt proud of himself.\nS. So when his friends planned a trek to a hilltop temple, he almost stayed at home.",["R","P","Q","S"],"The trek must be finished before Dhruv stands at the top; R is the natural end.",""],
["J4","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. His action inspired thousands of Indians to join the freedom struggle.\nQ. There, he picked up a handful of salt and broke the British salt law.\nR. Mahatma Gandhi led the Salt March in 1930.\nS. He walked with his followers from Sabarmati to Dandi, a village on the coast.",["RSQP","SRQP","RQSP","RSPQ"],"‘He’ in S is Gandhi; ‘There’ in Q is Dandi; ‘His action’ in P is the breaking of the salt law.",""],
["J5","Which sentence most likely comes first?",["A stranger knocked on our door late at night.","The stranger said he had lost his way.","The stranger asked for a glass of water.","We gave the stranger some food."],"‘A stranger’ is the first mention; the other three say ‘the stranger’, which means he has already appeared.",""],
["J5","‘The’ before a noun is still fine in an opening sentence when the noun is:",["Something unique that everyone knows, such as the Sun","A person in a story, such as ‘the boy’","An object just found, such as ‘the box’","An event, such as ‘the accident’"],"Unique, well-known things take ‘the’ even at the first mention. ‘The boy’ or ‘the box’ in a story assume an earlier mention.",""],
["J5","Which word shows that a sentence comes after one that describes a type of thing?",["Such","A","Many","Some"],"‘Such’ means ‘of the kind just described’, so its sentence must follow the description.",""],
["J5","The word ‘another’ in a sentence shows that:",["One of the same kind has already been mentioned","The sentence must open the paragraph","The paragraph is about to end","A contrast is coming"],"You can speak of ‘another’ storm only after one storm has been mentioned.",""],
["J5","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. No one ever learned who had sent the boat or why.\nQ. Some fishermen pulled it in and found a basket of fruit inside.\nR. The boat had no one on board.\nS. A small boat was seen drifting near the shore one morning.",["SRQP","RSQP","QSRP","SQPR"],"‘A small boat’ in S is the first mention; ‘The boat’ in R the second; ‘it’ in Q needs the boat; P closes the mystery.",""],
["J5","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. My grandmother has a small kitchen garden behind her house.\nP. As a result, her garden never needs chemical fertilisers.\nQ. She also keeps a compost pit made from an old drum.\nR. The pit turns her kitchen waste into manure for the plants.\nS. In it, she grows tomatoes, chillies and a few herbs.",["SQRP","SRQP","RSQP","SPRQ"],"‘In it’ in S is the garden of S1; ‘a compost pit’ (Q) must come before ‘The pit’ (R); P is the result of the manure.",""],
["J5","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Its doctors also visit nearby villages once a week.\nQ. The hospital has 200 beds and a modern operation theatre.\nR. A new hospital has opened on the edge of our town.\nS. Such a facility was badly needed in our area.",["R","P","Q","S"],"‘A new hospital’ in R is the first mention. ‘The hospital’, ‘Its doctors’ and ‘Such a facility’ come later.",""],
["J5","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Such skills make these birds popular as pets.\nQ. Some birds can copy the sounds they hear around them.\nR. Mynahs can even copy the ring of a telephone.\nS. Parrots, for example, can learn to repeat human words.",["QSRP","SQRP","QRPS","PQSR"],"Q is the general statement; S is ‘for example’; ‘even’ in R goes one step further; ‘Such skills’ in P sums up.",""],
["J5","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Last Sunday, we visited an old fort on a hill near Jaipur.\nP. It was evening by the time we came down the hill.\nQ. From its tower, we could see the whole city spread out below.\nR. Its walls are so thick that cannon balls could not break them.\nS. The fort was built more than three hundred years ago.",["SRQP","PSRQ","SQPR","SPQR"],"‘The fort’ in S is ‘an old fort’ of S1; R describes it; the view from the tower (Q) comes at the top; coming down (P) is last.",""],
["J5","Which of these sentences should come FIRST in a meaningful paragraph?\nP. A young engineer from Bihar has designed a low-cost water filter.\nQ. The filter uses sand, charcoal and a layer of cloth.\nR. This low price means even poor families can afford clean water.\nS. It costs less than five hundred rupees to make.",["P","Q","R","S"],"‘a low-cost water filter’ in P is the first mention; ‘The filter’, ‘It’ and ‘This low price’ point back.",""],
["J5","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. It was found among wet leaves near a stream.\nQ. Scientists have discovered a new species of frog in the Western Ghats.\nR. Such discoveries show how rich, and how fragile, the forests of the region are.\nS. The frog is smaller than a fingernail.",["QSPR","SQPR","PQSR","QSRP"],"‘a new species of frog’ (Q) → ‘The frog’ (S) → ‘It’ (P); ‘Such discoveries’ in R sums up.",""],
["J5","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. My uncle bought an old car from a neighbour.\nP. He spent three months repairing its engine and painting it.\nQ. The car had not been driven for years.\nR. Our neighbour, who sold it, can hardly believe it is the same car.\nS. Now the car looks almost new.",["QPSR","SQPR","QSPR","PQRS"],"‘The car’ in Q is ‘an old car’ of S1; the repair (P) follows its condition; ‘Now’ in S gives the result; R closes with the seller’s surprise.",""],
["J5","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Under this scheme, every school must plant at least a hundred saplings.\nQ. A scheme to plant one crore trees has been launched in the state.\nR. The saplings are supplied free by the forest department.\nS. Each school must also care for its trees for three years.",["Q","P","R","S"],"‘A scheme’ in Q is the first mention; ‘this scheme’, ‘The saplings’ and ‘also’ point back.",""],
["J5","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. So the old man often gave the toys away for a smile.\nQ. The toys were small elephants, horses and birds, painted in bright colours.\nR. Children crowded around him, but few could pay.\nS. An old man sat under a tree, selling clay toys.",["SQRP","QSRP","SRQP","SQPR"],"‘clay toys’ (S) → ‘The toys’ (Q); ‘him’ in R is the old man; ‘So’ in P follows ‘few could pay’.",""],
["J5","The first (S1) and the last (S6) sentences are given. Arrange P, Q, R and S in the right order between them.\nS1. A wise king once wanted to test his three ministers.\nP. The third did not bother to go to the garden at all and handed back an empty bag.\nQ. The second, thinking the king would never check, filled his bag with rotten fruit and leaves.\nR. The first minister picked only the best fruit.\nS. He gave each of them a bag and asked them to fill it with fruit from the royal garden.\nS6. The king made the first minister, the only one who had worked honestly, his chief adviser.",["SRQP","RSQP","SQRP","SRPQ"],"‘them’ in S is the three ministers of S1; then ‘The first’, ‘The second’ and ‘The third’ follow in order.",""],
["J5","Which of these sentences should come FIRST in a meaningful paragraph?\nP. There is a small temple at the top of the hill near our village.\nQ. Pilgrims make this climb even in the heat of summer.\nR. The temple is more than five hundred years old.\nS. To reach it, one must climb nearly a thousand steps.",["P","Q","R","S"],"‘a small temple’ in P is the first mention; ‘The temple’, ‘it’ and ‘this climb’ point back.",""],
["J5","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. In this subject, students learn to give instructions to computers.\nQ. Many of them now enjoy coding more than any other subject.\nR. Our school has introduced a new subject called coding.\nS. They begin with simple games and move on to small apps.",["RPSQ","PRSQ","SRPQ","RSQP"],"‘a new subject’ (R) → ‘this subject’ (P); ‘They’ in S is the students of P; ‘Many of them now’ (Q) gives the result.",""],
["J5","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. A man found a sealed letter in the drawer of an old desk he had bought.\nP. To his surprise, he found the woman’s grandson living in the same city.\nQ. Curious, he searched online for the name written on it.\nR. The letter was dated 1952 and addressed to someone in Kolkata.\nS. He sent the letter to the grandson, who was moved to tears.",["RQPS","RPQS","RQSP","PRQS"],"‘a sealed letter’ (S1) → ‘The letter’ (R); the search (Q) comes before the find (P); ‘the grandson’ in S needs P.",""],
["J5","Which of these sentences should come FIRST in a meaningful paragraph?\nP. The survey was carried out by students of the local college.\nQ. A survey of our town found that most people walk less than a kilometre a day.\nR. They spoke to over a thousand people of all ages.\nS. Their findings have been sent to the town council.",["Q","P","R","S"],"‘A survey’ in Q is the first mention; ‘The survey’, ‘They’ and ‘Their findings’ point back.",""],
["J5","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Last year, a cyclone destroyed many houses in a coastal village.\nQ. As a result, not a single life was lost.\nR. The people had built a strong shelter on high ground.\nS. This year, the same village was ready when another storm came.",["PSRQ","SPRQ","PQSR","RPSQ"],"‘a coastal village’ (P) → ‘the same village’ and ‘another storm’ (S); R explains how it was ready; ‘As a result’ (Q) follows.",""],
["J5","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Ramesh had saved money for a year to buy a camera.\nP. Some of these pictures later won prizes at a school exhibition.\nQ. The camera was small but took sharp pictures.\nR. On his birthday, he finally bought one.\nS. He took it everywhere and photographed birds, people and old buildings.",["RQSP","RSPQ","SRQP","RPSQ"],"‘one’ in R is a camera (S1); ‘The camera’ in Q is the one he bought; ‘it’ in S; ‘these pictures’ in P need the photos of S.",""],
["J5","Which of these sentences should come LAST in a meaningful paragraph?\nP. Then the librarian started storytelling sessions for children on Sundays.\nQ. A new library opened in our colony last month.\nR. At first, very few people came.\nS. Now the library is full every weekend.",["S","P","Q","R"],"‘At first’ → ‘Then’ → ‘Now’: S gives the present result and ends the paragraph.",""],
["J6","Which connector shows contrast?",["Nevertheless","Moreover","Consequently","For instance"],"‘Nevertheless’ introduces an idea that goes against the one before. Moreover adds, consequently gives a result, for instance gives an example.",""],
["J6","Which connector introduces a result?",["Consequently","Besides","However","Similarly"],"‘Consequently’ means ‘as a result’, so the sentence before it must give the cause.",""],
["J6","Which connector adds a further point in the same direction?",["Furthermore","Hence","Nevertheless","Instead"],"‘Furthermore’ adds another point like the one before.",""],
["J6","A sentence begins “For instance, …”. The sentence just before it most likely:",["States a general idea that this sentence illustrates","Gives the result of the example","Ends the paragraph","Asks the reader to act"],"An example needs the general claim it illustrates to come just before it.",""],
["J6","‘On the other hand’ is used to:",["Introduce a contrasting point","Give an example","Show the order of steps","Sum up the paragraph"],"It brings in the other side of an argument, so the first side must come before it.",""],
["J6","Which word joins two ideas that are alike?",["Similarly","However","Therefore","Although"],"‘Similarly’ compares a new case with one already given.",""],
["J6","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Their batteries also take hours to charge.\nQ. However, they still cost more to buy.\nR. Moreover, they are much cheaper to run than petrol cars.\nS. Electric cars produce no smoke from their exhaust.",["SRQP","RSQP","SQRP","SQPR"],"S gives a benefit; ‘Moreover’ in R adds another; ‘However’ in Q turns to a drawback; ‘also’ in P adds a second drawback.",""],
["J6","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. The new shopping mall has brought many changes to our small town.\nP. It has also given families a place to spend their weekends.\nQ. On the other hand, many small shops in the old market have had to close.\nR. The town, therefore, has gained and lost at the same time.\nS. On the one hand, it has created hundreds of jobs for local young people.",["SPQR","QSPR","SQRP","PSQR"],"‘On the one hand’ (S) and ‘also’ (P) give the gains; ‘On the other hand’ (Q) gives the loss; ‘therefore’ in R sums up both.",""],
["J6","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Similarly, a game of football can reduce stress.\nQ. For example, a morning run strengthens the heart and lungs.\nR. Exercise is good for both the body and the mind.\nS. Therefore, doctors advise at least half an hour of activity a day.",["R","P","Q","S"],"R is the general claim. ‘For example’, ‘Similarly’ and ‘Therefore’ all lean on it.",""],
["J6","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Each, therefore, has its own advantages.\nQ. Reading on paper and reading on a screen are not quite the same.\nR. Screens, on the other hand, make it easy to search and to carry thousands of books.\nS. Studies suggest that readers remember more of what they read in printed books.",["QSRP","RQSP","QRPS","SQRP"],"Q names the two ways; S gives paper’s strength; ‘on the other hand’ in R gives the screen’s; ‘Each, therefore’ in P concludes.",""],
["J6","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Ravi wanted to buy a new phone.\nP. However, he did not have enough money.\nQ. After three months, he had saved enough.\nR. So he took a part-time job at a bookshop.\nS. Finally, he bought the phone he wanted.",["PRQS","RPQS","PQRS","PRSQ"],"‘However’ in P contrasts with his wish in S1; ‘So’ in R is his answer; saving (Q) comes before buying (S).",""],
["J6","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Many people believe that cats do not like water.\nQ. Yet some wild cats, such as the tiger, are excellent swimmers.\nR. In fact, tigers often cool off in rivers on hot days.\nS. This is true of most pet cats.",["P","Q","R","S"],"P gives the common belief. ‘This’, ‘Yet’ and ‘In fact’ all respond to it.",""],
["J6","The first (S1) and the last (S6) sentences are given. Arrange P, Q, R and S in the right order between them.\nS1. Cities in India are growing very fast.\nP. Unless better facilities are built, life in cities will become harder.\nQ. As a result, roads, water supply and housing are under great pressure.\nR. Every year, millions of people move to them from villages in search of work.\nS. In addition, the number of vehicles is rising sharply.\nS6. Planning for the future, therefore, cannot wait.",["RQSP","QRSP","RPQS","SRQP"],"‘them’ in R is the cities of S1; ‘As a result’ in Q follows the migration; ‘In addition’ in S adds to the pressure; P warns, leading to S6.",""],
["J6","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. This pigment helps plants make food from sunlight.\nQ. In autumn, however, many trees stop making it.\nR. Leaves are green because they contain chlorophyll.\nS. As a result, the yellow and red colours hidden in the leaves begin to show.",["RPQS","PRQS","RQPS","RPSQ"],"‘This pigment’ in P is the chlorophyll of R; ‘however’ in Q turns to autumn; ‘As a result’ in S follows the loss of chlorophyll.",""],
["J6","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Riya was nervous about her first day at a new job.\nP. By lunchtime, her nervousness had gone.\nQ. One of them even showed her around the office.\nR. Indeed, she was already looking forward to the next day.\nS. Her colleagues, however, welcomed her warmly.",["SQPR","QSPR","PSQR","SRPQ"],"‘however’ in S contrasts with her nerves in S1; ‘One of them’ in Q is a colleague; ‘By lunchtime’ (P) gives the result; ‘Indeed’ in R goes further.",""],
["J6","Which of these sentences should come FIRST in a meaningful paragraph?\nP. As a result, more young people are visiting them than before.\nQ. Libraries are changing with the times.\nR. Some even hold workshops on coding and photography.\nS. Besides books, they now lend e-readers and offer free internet.",["Q","P","R","S"],"Q states the topic. ‘Besides … they’, ‘Some even’ and ‘As a result’ point back.",""],
["J6","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Fast food is tasty and quick to prepare.\nQ. It is often high in salt, sugar and fat.\nR. Too much of it can lead to weight gain and heart disease.\nS. Nevertheless, it should not be eaten every day.",["PSQR","SPQR","PQRS","QPSR"],"P gives the good side; ‘Nevertheless’ in S turns against it; Q gives the reason; R the danger.",""],
["J6","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Mathematicians in ancient India made several important advances.\nP. These ideas later travelled to the Arab world.\nQ. For example, they developed the decimal place-value system.\nR. They also used zero as a number.\nS. From there, they reached Europe.",["QRPS","QRSP","QPRS","SQRP"],"‘For example’ (Q) and ‘also’ (R) give the advances; ‘These ideas’ in P sums them up; ‘From there’ in S is the Arab world.",""],
["J6","Which of these sentences should come FIRST in a meaningful paragraph?\nP. We should, therefore, check facts from reliable sources before sharing them.\nQ. Some websites spread rumours and false news.\nR. The Internet has made it easy to find information on any topic.\nS. But not everything we read online is true.",["R","P","Q","S"],"R states the topic. ‘But’, ‘Some websites’ (a case of ‘not everything is true’) and ‘therefore’ follow it.",""],
["J6","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. This long sleep is called hibernation.\nQ. In this way, they save energy when food is hard to find.\nR. Some animals sleep through the winter.\nS. During it, their heartbeat and breathing slow down.",["RPSQ","PRSQ","RSPQ","RQPS"],"‘This long sleep’ in P needs R; ‘During it’ in S is hibernation; ‘In this way’ in Q sums up S.",""],
["J6","Which of these sentences should come LAST in a meaningful paragraph?\nP. Many students believe that cramming the night before an exam is the best way to study.\nQ. In reality, the brain remembers better when learning is spread out over days.\nR. It is wiser, then, to study a little every day.\nS. Moreover, staying up late leaves students tired on the day of the exam.",["R","P","Q","S"],"Belief (P) → correction (Q) → added point (S) → advice with ‘then’ (R), which ends the paragraph.",""],
["J6","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. We played games and ate our lunch there, and everyone enjoyed it.\nQ. Our class had planned a picnic by the river.\nR. Instead of cancelling, our teacher moved the picnic to the school hall.\nS. On the morning of the trip, however, it began to rain heavily.",["QSRP","SQRP","QRSP","RQSP"],"Q gives the plan; ‘however’ in S spoils it; ‘Instead of cancelling’ in R answers the rain; ‘there’ in P is the hall.",""],
["J7","Which word usually marks the LAST step of a process?",["Finally","Initially","Next","Meanwhile"],"‘Finally’ introduces the last step; ‘initially’ is the beginning, ‘next’ and ‘meanwhile’ the middle.",""],
["J7","In a cause-and-effect paragraph, which usually comes first?",["The cause","The effect","The advice","The example"],"A cause comes before the effect it produces.",""],
["J7","Which word tells you that two things happened at the same time?",["Meanwhile","Eventually","Previously","Afterwards"],"‘Meanwhile’ means ‘during the same time’, so it follows the event it runs alongside.",""],
["J7","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Next, pour in some milk and add sugar to taste.\nQ. First, boil a cup of water in a pan.\nR. Then add the tea leaves and let them simmer for a minute.\nS. Finally, strain the tea into a cup and serve it hot.",["QRPS","RQPS","QPRS","QRSP"],"The order words fix it: First (Q) → Then (R) → Next (P) → Finally (S).",""],
["J7","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Dr A.P.J. Abdul Kalam is remembered as the ‘Missile Man of India’.\nP. In 2002, he became the eleventh President of India.\nQ. He was born in 1931 in Rameswaram, Tamil Nadu.\nR. He died in 2015 while giving a lecture in Shillong.\nS. After studying aeronautical engineering, he worked on India’s space and missile programmes.",["QSPR","SQPR","QPSR","QSRP"],"A life story in time order: birth (Q) → study and work (S) → 2002 (P) → 2015 (R).",""],
["J7","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Today, it is respected around the world for doing so much at a low cost.\nQ. Six years later, its first satellite, Aryabhata, was sent into space.\nR. Since then, it has sent missions to the Moon and to Mars.\nS. The Indian Space Research Organisation was set up in 1969.",["S","P","Q","R"],"S names ISRO and the starting year. ‘Six years later’, ‘Since then’ and ‘Today … it’ all count from it.",""],
["J7","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Heavy rain fell in the hills for three days without a break.\nQ. By the fourth day, it had flooded the low-lying areas.\nR. Hundreds of families had to move to relief camps.\nS. The river that flows past our town rose quickly.",["PSQR","SPQR","PQSR","PSRQ"],"Cause → effect: rain (P) → river rises (S) → ‘By the fourth day’ flood (Q) → people move (R).",""],
["J7","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. A seed needs the right conditions to grow into a plant.\nP. First, it must have water, air and warmth.\nQ. When it gets these, it swells and its outer coat splits.\nR. A tiny root then grows downwards into the soil.\nS. Soon after, a shoot pushes up towards the light.",["PQRS","RPQS","PRSQ","QPRS"],"‘First’ (P) lists the needs; ‘these’ in Q points to them; ‘then’ in R and ‘Soon after’ in S follow in turn.",""],
["J7","Which of these sentences should come FIRST in a meaningful paragraph?\nP. The new machine made them cheaper, and more people learned to read.\nQ. Before that, every book had to be copied by hand.\nR. The printing press was invented in Germany in the fifteenth century.\nS. Books were therefore rare and very expensive.",["R","P","Q","S"],"R names the invention and its time. ‘Before that’, ‘therefore’ and ‘The new machine’ depend on it.",""],
["J7","The first (S1) and the last (S6) sentences are given. Arrange P, Q, R and S in the right order between them.\nS1. Sita woke up late on the morning of her exam.\nP. Then she ran to the bus stop, but the bus had already left.\nQ. She jumped out of bed and got ready in ten minutes.\nR. Luckily, her neighbour was driving past and offered her a lift.\nS. On the way, they got stuck at a red light for what felt like ages.\nS6. She reached the hall just as the papers were being handed out.",["QPRS","PQRS","QRPS","QPSR"],"Waking late (S1) → getting ready (Q) → ‘Then’ the missed bus (P) → the lift (R) → ‘On the way’ (S) → arrival (S6).",""],
["J7","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Today, the two together teach more than three thousand students.\nQ. Our town’s first school opened in 1925 with only twelve pupils.\nR. By 1950, it had grown to over two hundred pupils.\nS. In 1975, a college was built next to it.",["QRSP","RQSP","QSRP","QRPS"],"Sort the dates: 1925 (Q) → 1950 (R) → 1975 (S) → today (P).",""],
["J7","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Paper can be made from waste paper at home.\nP. The next day, mash the wet paper into a thick pulp.\nQ. To begin with, tear old newspapers into small pieces and soak them overnight.\nR. Spread this pulp thinly on a cloth and press out the water.\nS. Leave it in the sun until it is completely dry.",["QPRS","PQRS","QRPS","QPSR"],"‘To begin with’ (Q) → ‘The next day’ (P) → ‘this pulp’ (R) → drying (S).",""],
["J7","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Sachin was the first in his family to go to college.\nQ. Sachin later said it was the proudest day of his life.\nR. When he graduated, his parents travelled for two days by train to attend the ceremony.\nS. Afterwards, his father hugged him and said nothing, but his eyes were wet.",["P","Q","R","S"],"P sets up the story. ‘When he graduated’, ‘Afterwards’ and ‘later’ follow it in time.",""],
["J7","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. The fishermen who depended on the river lost their living.\nQ. Fish started dying in large numbers.\nR. A factory started releasing its waste into the river.\nS. Soon the water turned dark and began to smell.",["RSQP","SRQP","RQSP","RSPQ"],"A chain of causes: waste (R) → dirty water (S) → dead fish (Q) → lost living (P).",""],
["J7","Which of these sentences should come LAST in a meaningful paragraph?\nP. Eventually, the first simple forms of life appeared in the seas.\nQ. As it cooled, water vapour in the air turned into rain and filled the oceans.\nR. Over millions of years, it slowly cooled.\nS. Long ago, the Earth was extremely hot.",["P","Q","R","S"],"‘Long ago’ → ‘Over millions of years’ → ‘As it cooled’ → ‘Eventually’: P is the last stage.",""],
["J7","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. The Olympic Games began in ancient Greece.\nP. In 1896, they were revived in Athens as the modern Olympics.\nQ. After more than a thousand years, they were stopped.\nR. Since then, they have been held in many cities around the world.\nS. They were held every four years in honour of the god Zeus.",["SQPR","QSPR","SPQR","SQRP"],"‘They’ in S is the Games of S1; stopping (Q) comes before reviving (P); ‘Since then’ in R counts from 1896.",""],
["J7","Which of these sentences should come FIRST in a meaningful paragraph?\nP. When he finally opened his eyes, it was already eight o’clock.\nQ. Anil switched it off and went back to sleep.\nR. He had missed the early train to Mumbai.\nS. The alarm rang at five in the morning.",["S","P","Q","R"],"S is the first event. ‘switched it off’, ‘finally’ and ‘He had missed’ follow in time.",""],
["J7","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. The acid makes the milk thick and sour.\nQ. When milk is left out on a hot day, the bacteria in it multiply quickly.\nR. These bacteria produce an acid.\nS. That is why milk should be kept in a cool place.",["QRPS","RQPS","QPRS","QRSP"],"Cause → effect: bacteria (Q) → ‘These bacteria’ make acid (R) → ‘The acid’ sours milk (P) → ‘That is why’ advice (S).",""],
["J7","The first (S1) and the last (S6) sentences are given. Arrange P, Q, R and S in the right order between them.\nS1. Gita’s grandfather started a small cloth shop in 1960.\nP. Sales grew, and the shop moved to a bigger building in 1995.\nQ. He added a section for ready-made clothes.\nR. In the 1980s, his son, Gita’s father, took over the business.\nS. When her father retired in 2020, Gita took charge.\nS6. Today, Gita runs it with the help of an online store.",["RQPS","QRPS","RPQS","RQSP"],"1960 (S1) → 1980s (R) → ‘He added’ (Q) → 1995 (P) → 2020 (S) → today (S6).",""],
["J7","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. A volcano erupts when pressure builds up deep under the ground.\nP. Hot melted rock, called magma, rises through cracks in the Earth’s crust.\nQ. Clouds of ash and gas are also thrown high into the sky.\nR. Once the lava cools, it hardens into new rock.\nS. When it reaches the surface, it bursts out as lava.",["PSQR","SPQR","PQSR","PQRS"],"Magma rises (P) → ‘When it reaches the surface’ (S) → ‘also’ ash during the eruption (Q) → ‘Once the lava cools’ (R).",""],
["J7","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. For years, it gave no fruit at all.\nQ. Kiran planted a mango tree when she was ten.\nR. Then, one summer, its branches were heavy with mangoes.\nS. By then, Kiran was in college, and she shared the fruit with her friends.",["QPRS","PQRS","QRPS","QPSR"],"Planting (Q) → years without fruit (P) → ‘Then, one summer’ (R) → ‘By then’ (S).",""],
["J7","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Today, most people carry a phone in their pocket.\nQ. The first telephone call was made by Alexander Graham Bell in 1876.\nR. Over the next century, the device spread to almost every country.\nS. Within a few years, telephone lines began to link homes and offices in many cities.",["Q","P","R","S"],"Q gives the starting event. ‘Within a few years’, ‘Over the next century’ and ‘Today’ count from it.",""],
["J8","In a general-to-specific paragraph, which sentence comes first?",["A broad statement about the topic","A detailed example","A number or statistic","The writer’s advice"],"The broad claim opens; details and examples follow it.",""],
["J8","Which kind of sentence most often ends a paragraph?",["A conclusion, a summary or a piece of advice","A sentence that introduces a new topic","A sentence beginning ‘For example’","A question that the next sentence answers"],"The last sentence rounds things off; an example or a question needs something after it.",""],
["J8","In a problem–solution paragraph, the usual order is:",["Problem → cause → solution → result","Solution → problem → cause → result","Result → solution → problem → cause","Cause → result → solution → problem"],"You must know the problem and its cause before a solution makes sense, and the result comes last.",""],
["J8","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Each region has its own celebrations.\nQ. In Kerala, for instance, Onam marks the harvest with boat races and feasts.\nR. In Punjab, similarly, Baisakhi brings farmers together to dance the bhangra.\nS. India is a land of many festivals.",["SPQR","PSQR","SPRQ","QSPR"],"General → specific: S is the broad claim, P narrows it, ‘for instance’ in Q gives the first case, and ‘similarly’ in R a second.",""],
["J8","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Many children in our district could not read properly even in Class 5.\nP. College students now spend two hours a week reading with these children.\nQ. Within a year, reading levels have improved sharply.\nR. To solve this, the district started a volunteer reading programme.\nS. The main reason was that there were too few teachers.",["SRPQ","PSRQ","SPRQ","SRQP"],"Problem (S1) → cause (S) → ‘To solve this’ (R) → how it works (P) → result (Q).",""],
["J8","Which of these sentences should come LAST in a meaningful paragraph?\nP. If more people chose it, our cities would be cleaner and quicker to move around in.\nQ. They waste time and fuel and pollute the air.\nR. Traffic jams are a daily problem in big cities.\nS. Better public transport, such as metros and buses, can reduce the number of cars on the road.",["P","Q","R","S"],"Problem (R) → harm (Q) → solution (S) → a look ahead (P), which closes.",""],
["J8","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. This speed, however, also allows false stories to spread quickly.\nQ. Social media has changed how news spreads.\nR. Readers must therefore learn to check where a story comes from.\nS. A piece of news can now reach millions of people within minutes.",["QSPR","SQPR","QPSR","QSRP"],"Q is the claim; S the detail; ‘This speed, however’ in P needs S; ‘therefore’ in R gives the advice.",""],
["J8","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Their success, however, depends on people not throwing waste into the water.\nQ. Much of it comes from sewage and factory waste.\nR. Water pollution is a serious problem in many Indian rivers.\nS. To deal with it, treatment plants are being built along several rivers.",["R","P","Q","S"],"R states the problem. ‘Much of it’, ‘To deal with it’ and ‘Their success, however’ need it first.",""],
["J8","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Our village had no proper road until a few years ago.\nP. At last, a paved road was built, and a bus now comes twice a day.\nQ. So the villagers wrote to the district office again and again.\nR. Sick people could not be taken to hospital in time.\nS. During the rains, the mud track became impossible to use.",["SRQP","QSRP","SRPQ","SQPR"],"Problem (S1) → its worst effect (S, R) → ‘So’ the action (Q) → ‘At last’ the solution (P).",""],
["J8","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. For centuries, people believed that the Sun moved around the Earth.\nQ. In the sixteenth century, Copernicus argued that the opposite was true.\nR. His idea was at first rejected by many.\nS. Today, every schoolchild knows that the Earth goes around the Sun.",["PQRS","QPRS","PRQS","PQSR"],"Old view (P) → ‘the opposite’ (Q) → ‘His idea’ (R) → ‘Today’ (S).",""],
["J8","Which of these sentences should come LAST in a meaningful paragraph?\nP. Loneliness can harm their health as much as any illness.\nQ. Simple acts, like a daily phone call or a visit from a neighbour, can make a great difference.\nR. Their children often work in other towns or abroad.\nS. Many old people in cities live alone.",["Q","P","R","S"],"Problem (S) → reason (R) → harm (P) → the remedy (Q), which closes.",""],
["J8","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Not all deserts are hot.\nP. What makes a place a desert, then, is not heat but a lack of rain.\nQ. The Gobi desert in Asia, for example, can be freezing in winter.\nR. By this measure, Antarctica is the largest desert on Earth.\nS. Antarctica, too, is counted as a desert because it gets very little rain or snow.",["QSPR","SQPR","QPRS","PQSR"],"S1 is the claim; ‘for example’ (Q) and ‘too’ (S) give cases; ‘then’ in P draws the rule; ‘By this measure’ in R applies it.",""],
["J8","Which of these sentences should come FIRST in a meaningful paragraph?\nP. They notice when a student is unhappy and try to help.\nQ. They encourage shy students to speak up.\nR. Such teachers are often remembered for a lifetime.\nS. Good teachers do more than teach their subject.",["S","P","Q","R"],"S is the general claim. ‘They’ in P and Q and ‘Such teachers’ in R point back.",""],
["J8","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Many young people today suffer from back and neck pain.\nQ. The solution is simple: keep screens at eye level and take short breaks.\nR. Doctors say that the main cause is sitting with a bent neck over phones and laptops.\nS. Those who follow this advice usually feel better within weeks.",["PRQS","RPQS","PQRS","PRSQ"],"Problem (P) → cause (R) → solution (Q) → result of ‘this advice’ (S).",""],
["J8","Which of these sentences should come LAST in a meaningful paragraph?\nP. If more people joined them, much of this hunger could be reduced.\nQ. At the same time, millions of people go to bed hungry.\nR. Every year, tonnes of food are wasted at weddings and parties.\nS. Some groups now collect leftover food from such events and give it to the needy.",["P","Q","R","S"],"Problem (R, Q) → solution (S) → a look ahead (P); ‘joined them’ needs the groups of S.",""],
["J8","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Indian cooking uses a wide range of spices.\nP. Cumin adds a warm, earthy taste and is said to help digestion.\nQ. Each spice has its own flavour and purpose.\nR. Used together, spices give Indian food its special character.\nS. Turmeric, for example, gives colour to curries and is also used as an antiseptic.",["QSPR","SQPR","QPSR","PQSR"],"S1 → Q narrows it; ‘for example’ in S gives the first spice; P a second; ‘Used together’ in R sums up.",""],
["J8","Which of these sentences should come FIRST in a meaningful paragraph?\nP. It can strain their eyes and disturb their sleep.\nQ. It also leaves less time for play, which is vital for their growth.\nR. Too much screen time is harmful for young children.\nS. Parents should, therefore, set clear limits on how long children use screens.",["R","P","Q","S"],"R is the claim. ‘It’, ‘It also’ and ‘therefore’ follow it.",""],
["J8","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Many students were putting on weight and falling ill.\nQ. So the principal asked the canteen to serve fruit, sprouts and fresh juice instead.\nR. Our school canteen used to sell mostly fried snacks.\nS. Since the change, students say they feel more active in class.",["RPQS","QRPS","RQSP","RPSQ"],"The old menu (R) and its harm (P) come before ‘So’ the change (Q); ‘Since the change’ (S) is the result.",""],
["J8","Which of these sentences should come LAST in a meaningful paragraph?\nP. Learning to cook is a useful life skill.\nQ. It is also healthier, because we control what goes into our meals.\nR. It saves money, since home-made food costs less than eating out.\nS. Everyone, young or old, should therefore learn at least a few simple dishes.",["S","P","Q","R"],"Claim (P) → reasons (R, Q) → advice with ‘therefore’ (S), which closes.",""],
["J8","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Rivers have always been important to human life.\nP. Even today, many great cities stand beside rivers.\nQ. The earliest civilisations grew up on their banks.\nR. The Indus Valley civilisation, for example, flourished along the Indus and its tributaries.\nS. Rivers gave early people water for drinking and farming, and a way to travel.",["QRSP","RQSP","QPSR","QSPR"],"‘their banks’ in Q is the rivers of S1; ‘for example’ in R illustrates Q; S explains why; ‘Even today’ in P brings it to the present.",""],
["J8","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Students must therefore be ready to keep learning new skills throughout their lives.\nQ. In the same way, many of today’s jobs may disappear in the future.\nR. Some jobs that exist today were unknown twenty years ago.\nS. App developers and drone pilots are two such examples.",["R","P","Q","S"],"R is the general claim. ‘two such examples’, ‘In the same way’ and ‘therefore’ lean on it.",""],
["J8","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Students who skip it often find it hard to concentrate in class.\nQ. So, however busy the morning, it is wise not to miss it.\nR. Breakfast is often called the most important meal of the day.\nS. After a night without food, the body needs fuel to start working.",["RSPQ","SRPQ","RSQP","PRSQ"],"Claim (R) → reason (S) → the cost of skipping (P) → ‘So’ advice (Q).",""],
["J9","Q says “Ramesh bought a new bicycle.” and S says “It had red mudguards and a loud bell.” What must be true of the order?",["S comes right after Q","Q comes right after S","S opens the paragraph","Q and S are at opposite ends"],"‘It’ in S is the bicycle in Q, so QS is a mandatory pair.",""],
["J9","Which two sentences form a mandatory pair?",["“Why do owls hunt at night?” — “The reason is that their eyes see well in the dark.”","“Owls are birds.” — “Rivers flow into the sea.”","“It was late.” — “Owls are birds.”","“Many birds fly south.” — “The Sun sets in the west.”"],"A question must be followed directly by its answer.",""],
["J9","You know that P and S must be side by side, with P first. Which option can be correct?",["QPSR","QSPR","PQSR","SRQP"],"Only QPSR has ‘PS’ side by side in that order.",""],
["J9","A sentence beginning “The former …” must come right after a sentence that:",["Names two people or things","Asks a question","Gives an example","States a result"],"‘The former’ is the first of two things just named.",""],
["J9","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. The reason is that light travels much faster than sound.\nQ. Why do we see lightning before we hear thunder?\nR. So, by counting the seconds between the two, we can tell how far away the storm is.\nS. Light reaches us almost at once, while sound takes about three seconds to cover a kilometre.",["QPSR","PQSR","QSRP","SQPR"],"Question (Q) → ‘The reason is’ (P) is a mandatory pair; S gives the detail; ‘So’ in R uses it.",""],
["J9","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Two kinds of fuel are used in most Indian kitchens: LPG and firewood.\nP. The latter, however, fills homes with smoke that harms the lungs.\nQ. The former is clean and quick.\nR. Millions of women have benefited from this move.\nS. This is why the government has helped poor families get LPG connections.",["QPSR","PQSR","QSPR","QPRS"],"S1 names two fuels, so ‘The former’ (Q) and ‘The latter’ (P) follow; ‘This is why’ in S follows the harm; ‘this move’ in R is the help of S.",""],
["J9","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Neither habit is wrong, as long as one gets enough sleep.\nQ. The first group does its best work in the morning.\nR. The second feels most alert late in the evening.\nS. Some people are early risers, while others are night owls.",["S","P","Q","R"],"S names the two groups. ‘The first group’, ‘The second’ and ‘Neither habit’ need it.",""],
["J9","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Another is the chance of better schools for their children.\nQ. For all these reasons, cities keep growing every year.\nR. A third is access to good hospitals.\nS. One reason people move to cities is the hope of better jobs.",["SPRQ","PSRQ","SRPQ","QSPR"],"‘One reason’ → ‘Another’ → ‘A third’ is a fixed chain; ‘For all these reasons’ (Q) sums up.",""],
["J9","The first (S1) and the last (S6) sentences are given. Arrange P, Q, R and S in the right order between them.\nS1. Raghav found a puppy shivering in the rain outside his gate.\nP. The next morning, he asked his parents if he could keep it.\nQ. Then he gave it some warm milk, which it drank eagerly.\nR. He took it inside and dried it with a towel.\nS. They agreed, and he named the puppy Bruno.\nS6. Today, Bruno follows Raghav everywhere he goes.",["RQPS","QRPS","RQSP","RPQS"],"‘it’ in R is the puppy of S1; ‘Then’ in Q; ‘The next morning’ in P; ‘They agreed’ in S answers the request of P — a mandatory pair.",""],
["J9","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Raj and his sister Neha both love music.\nP. Their performance was so good that they were invited to play on local radio.\nQ. The two often practise together in the evenings.\nR. Raj plays the tabla, and Neha plays the sitar.\nS. Last month, they played at a school function.",["RQSP","RQPS","PRQS","RPQS"],"R names their instruments; Q their practice; S the school function; ‘Their performance’ in P is that function — a mandatory pair SP.",""],
["J9","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Some say it is the ability to take quick decisions.\nQ. What makes a good leader?\nR. Perhaps the best leaders have a little of both.\nS. Others believe it is the ability to listen to people.",["Q","P","R","S"],"The question Q opens; ‘Some say’ → ‘Others believe’ → ‘both’ answer it.",""],
["J9","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. For the sake of those views, many tourists take the train at least once.\nQ. There are two ways to reach the hill station from the city.\nR. One is by road, which takes about six hours.\nS. The other is by a toy train, which takes twice as long but offers lovely views.",["QRSP","SQRP","RQSP","QSPR"],"‘two ways’ (Q) → ‘One’ (R) → ‘The other’ (S) is a fixed chain; ‘those views’ in P needs S.",""],
["J9","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. The teacher asked the class a simple question.\nP. The teacher smiled and asked him to explain why.\nQ. “What is the most useful thing you own?” she said.\nR. Hands went up at once.\nS. Most students named their phones, but one boy said, “My library card.”",["QRSP","RQSP","QSRP","QRPS"],"The question (Q) comes before the hands go up (R) and the answers (S); ‘him’ in P is the boy of S.",""],
["J9","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Every twelve years, the Kumbh Mela is held there.\nQ. The Ganga and the Yamuna are two of India’s holiest rivers.\nR. They meet at Prayagraj, at a spot called the Sangam.\nS. Both rise in the Himalayas in Uttarakhand.",["Q","P","R","S"],"Q names the two rivers. ‘Both’, ‘They’ and ‘there’ point back.",""],
["J9","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Then he goes home, has a quick bath and runs to school.\nQ. A boy in our street sells newspapers every morning before school.\nR. He wakes up at four and collects the papers from the depot.\nS. By seven, he has delivered them to over a hundred homes.",["QRSP","RQSP","QSRP","QRPS"],"Q introduces the boy; ‘He’ in R; ‘By seven’ (S) after four o’clock; ‘Then’ (P) the last step before school.",""],
["J9","The first (S1) and the last (S6) sentences are given. Arrange P, Q, R and S in the right order between them.\nS1. Many people confuse weather with climate.\nP. Climate, on the other hand, is the average weather of a place over many years.\nQ. Weather is the state of the air on a particular day: hot, cold, rainy or dry.\nR. For example, it may rain in Jaisalmer on a certain day.\nS. But that does not change the fact that its climate is dry.\nS6. In short, weather is a day’s mood, while climate is a place’s character.",["QPRS","PQRS","QRPS","QPSR"],"Weather (Q) → ‘Climate, on the other hand’ (P); ‘For example’ (R) → ‘But that’ (S) is a mandatory pair.",""],
["J9","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Our school has two clubs for nature lovers.\nP. Both clubs together held a nature fair last month.\nQ. The other is the gardening club, which looks after the school’s flower beds.\nR. The money raised was used to buy bird feeders and new plants.\nS. One is the bird-watching club, which goes on walks every Saturday.",["SQPR","QSPR","SPQR","SQRP"],"‘two clubs’ (S1) → ‘One’ (S) → ‘The other’ (Q) → ‘Both clubs’ (P) → ‘The money raised’ at the fair (R).",""],
["J9","Which of these sentences should come FIRST in a meaningful paragraph?\nP. The best plan may be to mix the two.\nQ. Studying alone helps you focus without distractions.\nR. Group study, on the other hand, lets you clear doubts with friends.\nS. Is it better to study alone or in a group?",["S","P","Q","R"],"The question S opens. Q and R (‘on the other hand’) answer it, and ‘the two’ in P needs both.",""],
["J9","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. “Then make time,” replied the doctor, “or illness will make it for you.”\nQ. Anil laughed, but he started walking the very next morning.\nR. Anil, however, said that he had no time.\nS. The doctor told Anil that he must walk every day.",["SRPQ","RSPQ","SPRQ","SRQP"],"Advice (S) → objection with ‘however’ (R) → the doctor’s reply (P) is a mandatory pair; Q is the outcome.",""],
["J9","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. My cousin bought a parrot and a cat in the same week.\nP. To keep them both safe, my cousin hung the cage from the ceiling.\nQ. The cat, meanwhile, spent its days watching the parrot.\nR. The cat now spends its days staring at the ceiling.\nS. The parrot spent its days learning words.",["SQPR","QSPR","SPQR","SQRP"],"‘The parrot’ (S) then ‘The cat, meanwhile’ (Q); ‘them both’ in P needs both; ‘now … the ceiling’ in R follows P.",""],
["J9","Which of these sentences should come FIRST in a meaningful paragraph?\nP. The key is to use them wisely.\nQ. On the minus side, they can become a habit that is hard to break.\nR. On the plus side, they keep us connected with family and friends.\nS. Mobile phones have both advantages and disadvantages.",["S","P","Q","R"],"S names both sides. ‘On the plus side’ → ‘On the minus side’ → ‘The key’ follow it.",""],
["J9","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. The first paid well but was in a city far from his home.\nQ. After much thought, he chose the second.\nR. Neeraj had two job offers after college.\nS. The second paid less but was close to his ageing parents.",["RPSQ","PRSQ","RSPQ","QRPS"],"‘two job offers’ (R) → ‘The first’ (P) → ‘The second’ (S); the choice (Q) comes last.",""],
["J10","The opener is R. How many of these options survive: RQPS, QRPS, RPSQ, PRSQ?",["Two","One","Three","None"],"Only RQPS and RPSQ begin with R.",""],
["J10","Q must come immediately after P. Which option breaks this?",["SQRP","SPQR","PQRS","RSPQ"],"SQRP has Q second and P last, so they are not side by side in the order PQ.",""],
["J10","After the opener test, two options are left: RPQS and RQPS. What should you check next?",["Whether P or Q follows R naturally","Which option has more vowels","Whether S could open instead","Nothing — either will do"],"Compare only where the survivors differ: the sentence that links to R comes second.",""],
["J10","S must be the last sentence, and R must come right after Q. Which option fits?",["PQRS","QRSP","SPQR","PRQS"],"PQRS ends with S and has QR side by side. QRSP and SPQR do not end with S; PRQS has R before Q.",""],
["J10","The opener is Q, P must be last, and S must come before R. Which option fits?",["QSRP","QRSP","SQRP","QSPR"],"QSRP starts with Q, ends with P and has S before R.",""],
["J10","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Within a year, she was feeding over two hundred people a day.\nQ. Word soon spread about her tasty, home-style food.\nR. A young woman named Priya started a small tiffin service from her kitchen.\nS. At first, she cooked lunch for just five office workers.",["RSQP","RQSP","RSPQ","SRQP"],"Opener test: only R names Priya. Order test: ‘At first’ (S) → word spreads (Q) → ‘Within a year’ (P).",""],
["J10","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. A city’s parks are its lungs.\nP. They give people fresh air and a place to walk.\nQ. Sadly, many parks are being shrunk to make room for roads and buildings.\nR. Their trees absorb dust and noise from the traffic.\nS. If this continues, our cities will become even more crowded and polluted.",["PRQS","PQSR","PSQR","QPRS"],"‘They’ in P is the parks of S1; R adds their trees; ‘Sadly’ in Q turns to the threat; ‘If this continues’ in S needs Q.",""],
["J10","The first (S1) and the last (S6) sentences are given. Arrange P, Q, R and S in the right order between them.\nS1. Arun was the best batsman in his school team.\nP. His team lost, and Arun sat alone in the dressing room for a long time.\nQ. In the final match, however, he was out for zero.\nR. Because of this, he stopped coming to practice.\nS. He believed he could score runs without it.\nS6. That day he learned that talent is nothing without effort.",["RSQP","SRQP","RQSP","RSPQ"],"‘this’ in R is his talent (S1); ‘it’ in S is practice; ‘however’ in Q breaks his belief; P leads to the lesson in S6.",""],
["J10","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. That is why villages behind mangrove forests often suffer less damage during cyclones.\nQ. Just as importantly, they act as a wall against storms and high waves.\nR. Their tangled roots hold the soil in place.\nS. Mangroves are trees that grow in salty water along the coast.",["SRQP","RSQP","QSRP","SPRQ"],"Opener test leaves only options starting with S. ‘Just as importantly’ in Q adds to R; ‘That is why’ in P follows the storm wall of Q.",""],
["J10","Which of these sentences should come FIRST in a meaningful paragraph?\nP. The bicycle is one of the cleanest ways to travel.\nQ. No wonder many cities are building special lanes for cyclists.\nR. Riding it is also a good form of exercise.\nS. It burns no fuel and makes no noise.",["P","Q","R","S"],"P names the bicycle. ‘It’, ‘Riding it … also’ and ‘No wonder’ point back.",""],
["J10","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. The school bell rang, and the children rushed out.\nP. Mother and daughter hugged each other for a long time.\nQ. Tara ran all the way and reached home just as the taxi stopped at the gate.\nR. Her mother was coming home from a long trip that day.\nS. Among them was Tara, who was in a great hurry.",["SRQP","RSQP","SQRP","SRPQ"],"‘them’ in S is the children of S1; ‘Her mother’ in R explains the hurry; ‘the taxi’ in Q brings the mother; P ends it.",""],
["J10","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Most of them hunt at night.\nQ. This skill is called echolocation.\nR. Bats are the only mammals that can truly fly.\nS. They find their way in the dark by making high-pitched sounds and listening for the echoes.",["RPSQ","PRSQ","RPQS","SRPQ"],"Opener: R. ‘Most of them’ in P needs bats; ‘in the dark’ in S follows the night of P; ‘This skill’ in Q names the skill of S.",""],
["J10","The first (S1) and the last (S6) sentences are given. Arrange P, Q, R and S in the right order between them.\nS1. Reena’s grandmother could not read or write.\nP. Every evening, the two sat together with a slate and chalk.\nQ. She had grown up in a village that had no school for girls.\nR. Slowly, the old woman learned the letters and then simple words.\nS. Last year, Reena decided to teach her.\nS6. Last week, she read a newspaper headline aloud for the first time, and the whole family clapped.",["QSPR","QPSR","QSRP","PQSR"],"Q explains S1; S begins the lessons; ‘the two’ in P; ‘Slowly’ in R leads to the headline in S6.",""],
["J10","Which of these sentences should come FIRST in a meaningful paragraph?\nP. All the lamps are then lit together on the night of the festival.\nQ. The best ones are chosen by the elders of the colony.\nR. Every Diwali, our colony holds a lamp-making contest for children.\nS. The children paint clay lamps in bright colours and patterns.",["R","P","Q","S"],"R sets up the contest. ‘The children’, ‘The best ones’ and ‘then’ point back.",""],
["J10","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Kavita lost her job when her company shut down.\nQ. She began selling cakes to friends and neighbours.\nR. Instead of giving up, she decided to use her baking skills.\nS. Today, her bakery employs ten people.",["PRQS","RPQS","PQRS","PRSQ"],"Opener: P. ‘Instead of giving up’ (R) answers the job loss; Q is the first step; ‘Today’ (S) is last.",""],
["J10","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Indian classical dance has several styles.\nP. A third is Kathak, from the north, known for its fast footwork.\nQ. Each style tells stories through movement, music and expression.\nR. The best known is perhaps Bharatanatyam, from Tamil Nadu.\nS. Another is Kathakali from Kerala, famous for its colourful make-up.",["RSPQ","SRPQ","RPSQ","PSRQ"],"‘The best known’ (R) → ‘Another’ (S) → ‘A third’ (P) is a fixed chain; ‘Each style’ in Q sums up.",""],
["J10","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Unless we use less plastic, the problem will only get worse.\nQ. Sea birds, too, feed bits of plastic to their chicks.\nR. Plastic waste in the oceans is a growing danger to sea life.\nS. Turtles, for example, often mistake floating bags for jellyfish and swallow them.",["RSQP","QRSP","RQSP","SRQP"],"Opener: R. ‘for example’ (S) must come before ‘too’ (Q); ‘the problem’ in P closes.",""],
["J10","Which of these sentences should come LAST in a meaningful paragraph?\nP. They removed the rubbish, dug out the mud and repaired the banks.\nQ. The village pond had dried up and was full of rubbish.\nR. The young people of the village decided to bring it back to life.\nS. When the monsoon came, the pond filled up, and the cattle had water once more.",["S","P","Q","R"],"Problem (Q) → decision (R) → work (P) → result (S), which closes.",""],
["J10","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. A good diet does not have to be expensive.\nP. Pulses, for example, are cheap and rich in protein.\nQ. What matters, then, is not the price of food but the right balance.\nR. Seasonal vegetables also cost less than those grown out of season.\nS. Even simple foods like curd and roti give us much of what we need.",["PRSQ","RPSQ","PRQS","SPRQ"],"‘for example’ (P) follows S1; ‘also’ (R) adds a case; ‘Even’ (S) goes further; ‘then’ in Q concludes.",""],
["J10","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. One reason for this long life may be their slow way of living.\nQ. Their hard shells also protect them from most enemies.\nR. Some giant tortoises are known to have lived for more than 150 years.\nS. The tortoise lives longer than almost any other animal.",["SRPQ","RSPQ","SQRP","PSRQ"],"Opener: S. R is the detail; ‘this long life’ in P needs it; ‘also’ in Q adds a second reason after ‘One reason’.",""],
["J10","The first (S1) and the last (S6) sentences are given. Arrange P, Q, R and S in the right order between them.\nS1. Every morning, a long line formed outside the only water tap in our lane.\nP. Quarrels often broke out over whose turn it was.\nQ. The long line has since disappeared.\nR. Women and children waited for hours with their buckets.\nS. Last year, the municipality laid pipes and gave each house its own tap.\nS6. Now the women of the lane have more time for work and rest.",["RPSQ","RQSP","RSQP","SRPQ"],"R describes the line of S1; P its trouble; S the solution; ‘since’ in Q follows it and leads to S6.",""],
["J10","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Some of the best ideas come when we are not trying hard to think.\nQ. This is why many people get fresh ideas while walking or bathing.\nR. At such times, the mind is relaxed and free to wander.\nS. Taking short breaks from work, then, may actually help us solve problems.",["P","Q","R","S"],"P is the claim. ‘This is why’, ‘At such times’ and ‘then’ lean on it.",""],

["J11","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nBegins: Although he was tired,\nP. set behind the hills.\nQ. kept working\nR. the old farmer\nS. until the sun",["RQSP","RSQP","QRSP","RQPS"],"After the fixed clause: subject (R), verb (Q), then the time clause ‘until the sun’ (S) + ‘set behind the hills’ (P).",""],
["J11","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nP. finish the work on time,\nQ. Not only did he\nR. but he also\nS. helped his colleagues finish theirs.",["QPRS","RSQP","QSRP","PQRS"],"‘Not only did he’ (Q) takes its verb (P); ‘but he also’ (R) takes its own (S).",""],
["J11","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nP. is so interesting that\nQ. The book\nR. that you lent me\nS. I could not put it down.",["QRPS","QPSR","PQRS","RQPS"],"Subject (Q) + its ‘that’ clause (R) + ‘so … that’ (P) + the result (S).",""],
["J11","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nBegins: If it rains tomorrow,\nP. the school picnic\nQ. will be\nR. put off\nS. until next week.",["PQRS","PRQS","QPRS","PQSR"],"Subject (P) + ‘will be put off’ (QR) + time (S).",""],
["J11","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nP. The man\nQ. to file a complaint.\nR. whose car was stolen\nS. went to the police station",["PRSQ","PSQR","SPRQ","PQSR"],"The ‘whose’ clause (R) must follow ‘The man’ (P); then the verb with place (S) and the purpose (Q).",""],
["J11","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nP. Either you\nQ. must attend\nR. the parents’ meeting.\nS. or your brother",["PSQR","SPQR","PQSR","PQRS"],"‘Either’ (P) is followed at once by ‘or’ (S); then the verb (Q) and object (R).",""],
["J11","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nP. the bus\nQ. took a longer route.\nR. was blocked by a fallen tree,\nS. Because the road",["SRPQ","SPRQ","RSPQ","SQPR"],"The ‘because’ clause (SR) comes first, ending with a comma; then the main clause: subject (P) + verb (Q).",""],
["J11","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nBegins: The teacher asked\nP. by Friday.\nQ. the students\nR. to submit\nS. their projects",["QRSP","RQSP","QSRP","SRQP"],"‘asked’ + whom (Q) + ‘to submit’ (R) + what (S) + when (P).",""],
["J11","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nP. that the river\nQ. overflowed\nR. its banks.\nS. So heavy was the rain",["SPQR","PSQR","SQPR","SPRQ"],"‘So heavy was the rain’ (S) needs ‘that’ (P); then the verb (Q) and its object (R).",""],
["J11","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nP. began to move.\nQ. Hardly had we\nR. when the train\nS. reached the station",["QSRP","RPQS","QRSP","SQRP"],"‘Hardly had we’ (Q) + past participle (S) + ‘when’ (R) + the second event (P).",""],
["J11","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nBegins: The museum,\nP. attracts\nQ. which was built\nR. in the nineteenth century,\nS. thousands of visitors every year.",["QRPS","PSQR","QPSR","RQPS"],"The ‘which’ clause (QR) follows ‘The museum,’ and closes with a comma; then the verb (P) and object (S).",""],
["J11","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nP. that she fell asleep\nQ. so tired after the long journey\nR. She was\nS. as soon as she lay down.",["RQPS","RPQS","RSPQ","QRPS"],"Subject and verb (R) + ‘so tired’ (Q) + ‘that’ result (P) + time (S).",""],
["J11","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nP. the guests arrive\nQ. the lights went out.\nR. No sooner did\nS. than",["RPSQ","RSPQ","PRSQ","RSQP"],"‘No sooner did’ (R) + subject and verb (P) + ‘than’ (S) + the second event (Q).",""],
["J11","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nP. the meeting.\nQ. he attended\nR. his illness,\nS. Despite",["SRQP","RSQP","SQRP","SQPR"],"‘Despite’ (S) takes a noun (R); then the main clause: subject and verb (Q) + object (P).",""],
["J11","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nBegins: My brother,\nP. works\nQ. who lives in Pune,\nR. in a car factory.\nS. as an engineer",["QPSR","PQSR","SRQP","RPSQ"],"The ‘who’ clause (Q) follows ‘My brother,’; then the verb (P), the role (S) and the place (R).",""],
["J11","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nP. the better\nQ. you practise,\nR. The more\nS. you will become.",["RQPS","RPQS","RSPQ","QRPS"],"‘The more’ (R) + its clause (Q), then ‘the better’ (P) + its clause (S).",""],
["J11","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nP. miss the last bus.\nQ. Unless you\nR. you will\nS. leave now,",["QSRP","QRSP","SQRP","SPQR"],"‘Unless you’ (Q) + verb (S), then the main clause (RP).",""],
["J11","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nP. within minutes.\nQ. The cake\nR. that my mother baked\nS. was eaten",["QRSP","QSPR","SQRP","RQSP"],"Subject (Q) + its ‘that’ clause (R) + verb (S) + time (P).",""],
["J12","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. It has more than one and a half lakh post offices.\nQ. Most of these are in villages.\nR. For many rural families, the local post office is also a bank.\nS. The Indian postal network is one of the largest in the world.",["SPQR","PSQR","SQRP","QSPR"],"Opener S; ‘It’ in P is the network; ‘these’ in Q are the post offices; R adds their second role.",""],
["J12","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Hari had a small shop that sold umbrellas.\nP. Business was good only during the monsoon.\nQ. So he began selling sun hats and water bottles in the summer.\nR. Now his shop is busy all year round.\nS. For the rest of the year, his shop stood almost empty.",["PSQR","SPQR","PQSR","PSRQ"],"P follows the umbrella shop of S1; ‘the rest of the year’ (S) contrasts with the monsoon; ‘So’ (Q) is his answer; ‘Now’ (R) the result.",""],
["J12","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Each member saved a small amount every month.\nQ. Many of them now earn a steady income from tailoring and pickle-making.\nR. With these savings, the group gave loans to members who wanted to start a business.\nS. A group of women in a Rajasthan village formed a self-help group.",["S","P","Q","R"],"S introduces ‘a self-help group’. ‘Each member’, ‘these savings’ and ‘Many of them now’ point back.",""],
["J12","The first (S1) and the last (S6) sentences are given. Arrange P, Q, R and S in the right order between them.\nS1. The night before her first train journey, Pinky could hardly sleep.\nP. At the station, the noise and the crowds amazed her.\nQ. Once the train started, she sat glued to the window.\nR. She was up before dawn and had packed her bag twice.\nS. Fields, rivers and villages rushed past for hours.\nS6. It was a journey she would remember for the rest of her life.",["RPQS","PRQS","RQPS","RPSQ"],"The night before (S1) → early morning (R) → the station (P) → ‘Once the train started’ (Q) → the view (S) → S6.",""],
["J12","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nP. who caught the thief\nQ. was praised\nR. The police officer\nS. by the mayor.",["RPQS","RQSP","QRPS","RSQP"],"Subject (R) + its ‘who’ clause (P) + verb (Q) + agent (S).",""],
["J12","Which of these sentences should come LAST in a meaningful paragraph?\nP. Most of us throw away old clothes without a second thought.\nQ. Old clothes can be repaired, given to those who need them, or turned into bags and mats.\nR. Yet making a single cotton shirt uses a huge amount of water.\nS. Doing so saves money and protects the planet at the same time.",["S","P","Q","R"],"Habit (P) → ‘Yet’ the cost (R) → the alternatives (Q) → ‘Doing so’ the benefit (S), which closes.",""],
["J12","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. A large part of the crop, however, is drunk within the country.\nQ. Its Assam and Darjeeling teas are famous across the world.\nR. Tea was first grown in India on a large scale by the British in Assam.\nS. Today, India is one of the largest producers of tea in the world.",["RSQP","SRQP","RQSP","QRSP"],"Opener R; ‘Today’ (S) moves to the present; ‘Its’ in Q is India; ‘however’ in P contrasts with world fame.",""],
["J12","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. The town’s old cinema hall had been closed for ten years.\nP. Its seats were broken, and its walls were covered with moss.\nQ. Last year, a group of film lovers bought the building.\nR. Last week, the hall reopened with a show of an old classic.\nS. They spent months repairing and repainting it.",["PQSR","SPQR","PSQR","PQRS"],"‘Its’ in P is the cinema hall of S1; ‘a group’ (Q) → ‘They’ (S); the reopening (R) comes last.",""],
["J12","Which of these sentences should come FIRST in a meaningful paragraph?\nP. The Sun is a star, just like the ones we see at night.\nQ. Without that light and heat, no life could exist on our planet.\nR. Its light takes about eight minutes to reach the Earth.\nS. It looks much bigger and brighter only because it is much closer to us.",["P","Q","R","S"],"P names the Sun (a unique ‘the’). ‘It’, ‘Its light’ and ‘that light’ point back.",""],

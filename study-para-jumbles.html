const LESSONS = [
{"id":"J1","heat":2,"title":"How SSC sets para jumbles","hi":"SSC में वाक्य पुनर्व्यवस्था के प्रश्न कैसे आते हैं","blocks":[{"k":"hot","h":"Sentence rearrangement is a regular part of the English section of SSC CGL and CHSL Tier 1 — usually <b>one or two questions<\/b> a shift, sometimes none. Each is worth the same marks as any other question and takes under a minute once you know the clues."},{"k":"story","h":"<p>A para jumble is a short paragraph whose sentences have been shuffled. Your job is to put them back. Most of the time SSC gives <b>four sentences marked P, Q, R and S<\/b> and four orders such as <b>QPSR<\/b> to choose from. Sometimes the <b>first sentence<\/b> is printed separately (marked S1) and you arrange the rest; sometimes both the <b>first (S1) and the last (S6)<\/b> are fixed and you arrange the four in the middle.<\/p><p>Two other forms appear: a single long sentence cut into <b>four parts<\/b>, and a question that asks only <b>which sentence should come first<\/b> (or last). The skill is the same in every case: a well-written paragraph is a chain, and every sentence after the first holds on to the one before it.<\/p>","key":"Every sentence after the first is tied to the one before it — find the ties and the order falls out."},{"k":"table","title":"The formats SSC uses","head":["Format","What you see","What you choose"],"rows":[["Four sentences","P, Q, R and S, all jumbled","An order such as QPSR"],["First sentence fixed","S1 printed first, then P, Q, R and S","The order of P, Q, R and S after S1"],["First and last fixed","S1 and S6 printed; P, Q, R and S in between","The order of the middle four"],["Parts of one sentence","One sentence cut into four parts (sometimes the opening words are given)","The order of the parts"],["Opening sentence","Four sentences","The one that should start the paragraph"],["Closing sentence (less common)","Four sentences","The one that should end the paragraph"]]},{"k":"facts","title":"What makes a paragraph hang together","rows":[["One topic","Every sentence is about the same subject."],["An opener","The first sentence introduces the subject with a full noun — it does not lean on anything earlier."],["Links","Pronouns (he, it, they), articles (a → the), pointing words (this, such) and connectors (however, therefore) tie each sentence to the one before."],["A natural flow","Time order, cause before effect, general before specific, problem before solution."],["An ending","A result, a summary, advice or a look ahead."]]},{"k":"trick","h":"You never have to build the order from nothing. There are 24 possible orders of four sentences, but SSC shows you only <b>four<\/b>. Find one or two sure clues, strike out the options that break them, and check the one that is left."},{"k":"trap","h":"An order can <b>sound<\/b> fine at a quick glance and still be wrong. Read your chosen order once from start to end: a sentence that begins with <b>He<\/b>, <b>This<\/b> or <b>However<\/b> cannot come before the sentence it refers to."}],"sum":["SSC sets four sentences P, Q, R, S; or S1 fixed; or S1 and S6 fixed; or four parts of one sentence; or ‘which sentence comes first’.","There are 24 possible orders, but only four options — test them.","A paragraph is a chain: one topic, an opener, links, a natural flow and an ending.","Links are pronouns, articles, pointing words and connectors.","Always read the chosen order once from start to end."],"part":["Part 1 · How SSC sets them, and the method","SSC का प्रारूप और हल करने की विधि"],"g":"pj"},
{"id":"J2","heat":2,"title":"The step-by-step method","hi":"हल करने की चरणबद्ध विधि","blocks":[{"k":"hot","h":"A fixed routine saves time and stops guesswork: <b>topic → opener → one sure pair → strike options → read once<\/b>. With practice it takes 40–50 seconds a question."},{"k":"story","h":"<p>Think of the four sentences as four railway coaches that have come uncoupled. Each coach has a hook at the front (the word that points back — <i>he, this, however, then<\/i>) and a ring at the back (the new thing it introduces — <i>a farmer, a plan, a problem<\/i>). The engine is the one coach with no hook at the front: the opener.<\/p><p>Find the engine first. Then find one hook that clearly fits one ring — a <b>pair<\/b>. Usually the opener and one pair are enough to strike out three options. Read the last option through once to be sure.<\/p>","key":"Opener plus one sure pair usually leaves only one option standing."},{"k":"table","title":"The five steps","head":["Step","Do this","Ask yourself"],"rows":[["1 · Read","Read all four sentences quickly","What is this paragraph about?"],["2 · Opener","Find the sentence that introduces the topic with a full noun and leans on nothing","Could I say this sentence to someone who knows nothing yet?"],["3 · Pair","Find two sentences that must sit together: a noun and its pronoun, ‘a’ and ‘the’, a cause and its ‘so’","Which sentence must come right after which?"],["4 · Strike","Cross out every option that starts wrongly or breaks the pair","Which options are still standing?"],["5 · Check","Read the surviving order from start to end","Does it read like one smooth paragraph?"]]},{"k":"fig","title":"A paragraph is a chain","svg":"<svg viewBox=\"0 0 360 330\" role=\"img\" aria-label=\"A paragraph as a chain: opener, two links, and a closing sentence\" style=\"max-width:420px;margin:0 auto\">\n  <defs><marker id=\"pjar\" viewBox=\"0 0 10 10\" refX=\"5\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"var(--accent)\"/><\/marker><\/defs>\n  <g font-family=\"inherit\">\n    <rect x=\"20\" y=\"10\" width=\"320\" height=\"58\" rx=\"12\" fill=\"var(--sheet)\" stroke=\"var(--accent)\" stroke-width=\"2\"/>\n    <text x=\"36\" y=\"34\" font-size=\"16\" font-weight=\"700\" fill=\"var(--ink)\">1 · Opener<\/text><text x=\"36\" y=\"56\" font-size=\"13\" fill=\"var(--ink2)\">names the topic: “A young farmer …”<\/text>\n    <line x1=\"180\" y1=\"70\" x2=\"180\" y2=\"88\" stroke=\"var(--accent)\" stroke-width=\"2\" marker-end=\"url(#pjar)\"/>\n    <rect x=\"20\" y=\"90\" width=\"320\" height=\"58\" rx=\"12\" fill=\"var(--sheet)\" stroke=\"var(--rule)\" stroke-width=\"2\"/>\n    <text x=\"36\" y=\"114\" font-size=\"16\" font-weight=\"700\" fill=\"var(--ink)\">2 · Link back<\/text><text x=\"36\" y=\"136\" font-size=\"13\" fill=\"var(--ink2)\">points back: “He …”, “The farmer …”<\/text>\n    <line x1=\"180\" y1=\"150\" x2=\"180\" y2=\"168\" stroke=\"var(--accent)\" stroke-width=\"2\" marker-end=\"url(#pjar)\"/>\n    <rect x=\"20\" y=\"170\" width=\"320\" height=\"58\" rx=\"12\" fill=\"var(--sheet)\" stroke=\"var(--rule)\" stroke-width=\"2\"/>\n    <text x=\"36\" y=\"194\" font-size=\"16\" font-weight=\"700\" fill=\"var(--ink)\">3 · Move on<\/text><text x=\"36\" y=\"216\" font-size=\"13\" fill=\"var(--ink2)\">a turn or a step: “However …”, “Then …”<\/text>\n    <line x1=\"180\" y1=\"230\" x2=\"180\" y2=\"248\" stroke=\"var(--accent)\" stroke-width=\"2\" marker-end=\"url(#pjar)\"/>\n    <rect x=\"20\" y=\"250\" width=\"320\" height=\"58\" rx=\"12\" fill=\"var(--sheet)\" stroke=\"var(--accent)\" stroke-width=\"2\"/>\n    <text x=\"36\" y=\"274\" font-size=\"16\" font-weight=\"700\" fill=\"var(--ink)\">4 · Close<\/text><text x=\"36\" y=\"296\" font-size=\"13\" fill=\"var(--ink2)\">result or advice: “So …”, “Therefore …”<\/text>\n  <\/g><\/svg>","cap":"The opener has nothing to point back to. Every later sentence holds on to the one before it, and the last one rounds the paragraph off."},{"k":"facts","title":"The clues to look for","rows":[["Pronouns","he, she, it, they, his, its, their — need a noun before them"],["Articles and pointers","a → the; this, these, such, the same — point back"],["Connectors","however, but (contrast); also, moreover (addition); so, therefore (result); for example (example)"],["Time and order","first, then, finally; dates in order; cause before effect"],["Shape","general → specific; problem → solution; question → answer"]]},{"k":"ex","h":"<p><b>P.<\/b> She sold them at the weekly market in the next village. <b>Q.<\/b> A widow named Lakshmi made baskets from palm leaves. <b>R.<\/b> Soon a shop in the city began to order them by the hundred. <b>S.<\/b> Because her baskets were strong and cheap, they sold out every week.<\/p><p><b>Step 1:<\/b> the topic is Lakshmi’s baskets. <b>Step 2:<\/b> P begins with <i>She<\/i>, R with <i>Soon<\/i>, S with <i>her baskets<\/i> — only <b>Q<\/b>, which names Lakshmi and her baskets, can open. <b>Step 3:<\/b> <i>She<\/i> and <i>them<\/i> in P are Lakshmi and the baskets, so <b>QP<\/b> is a pair. <b>Step 4:<\/b> strike every option that does not begin QP. <b>Step 5:<\/b> the baskets sell out at the market (S), and <i>Soon<\/i> a city shop orders them (R): <b>QPSR<\/b>.<\/p>"},{"k":"trick","h":"Write the four letters on your rough sheet and draw arrows for the pairs you are sure of (Q → P). An option that does not contain your arrow is out."},{"k":"trap","h":"Do not judge an option by its first two letters only. Two options often start the same way (QPRS and QPSR); the last two letters decide it, so check the second pair too."}],"sum":["Step 1: read all four and find the topic.","Step 2: find the opener — full noun, no pronoun or connector at the start.","Step 3: find one sure pair that must sit together.","Step 4: strike the options that start wrongly or break the pair.","Step 5: read the surviving order once from start to end."],"part":["Part 1 · How SSC sets them, and the method","SSC का प्रारूप और हल करने की विधि"],"g":"pj"},
{"id":"J3","heat":2,"title":"Finding the opening sentence","hi":"पहला वाक्य पहचानना","blocks":[{"k":"hot","h":"Finding the opener is the single most useful step: it strikes out half the options in seconds. SSC also asks it directly — <b>“Which sentence should come first?”<\/b>"},{"k":"story","h":"<p>Imagine walking up to a stranger and saying, “However, it closes early on Sundays.” They would ask: <i>what<\/i> closes? However <i>what<\/i>? That sentence leans on something you never said. Now try: “Our town opened a public library last year.” It makes sense on its own.<\/p><p>That is the <b>stranger test<\/b>. The opening sentence introduces the topic with a <b>full noun<\/b> — often with <i>a<\/i> or <i>an<\/i>, or as a general statement — and it does <b>not<\/b> begin with a pronoun (<i>he, it, they<\/i>), a pointing word (<i>this, such<\/i>) or a connector (<i>however, therefore, also<\/i>).<\/p>","key":"The opener passes the stranger test: it makes sense to someone who has heard nothing yet."},{"k":"table","title":"Can this sentence open a paragraph?","head":["The sentence begins …","Can it open?","Why"],"rows":[["A young farmer named Gopal …","Can open","Introduces a new person with ‘a’."],["Water is essential for all life.","Can open","A general statement about the topic."],["Photosynthesis is the process by which …","Can open","A definition of the topic."],["In 1947, …","Can open","Sets the time and leans on nothing."],["Once upon a time, …","Can open","The classic opening of a story."],["There are many ways to save water.","Can open","Announces the topic."],["Have you ever wondered why …?","Can open","A question that the paragraph goes on to answer."],["Many people believe that …","Can open","Sets up a common view, often corrected later."],["When Meena moved to a new school, she …","Can open","The time clause is complete inside the sentence."],["Although the road was new, it …","Can open","‘Although’ joins two halves of the same sentence."],["He / She / They …","Cannot open","A pronoun needs a noun before it."],["It was later sold …","Cannot open","‘It’ and ‘later’ both point back."],["This / These / Such …","Cannot open","Pointing words refer to something already said."],["However, …","Cannot open","Contrasts with an earlier sentence."],["But … / Yet …","Cannot open","A contrast needs something to contrast with."],["Therefore, … / As a result, …","Cannot open","A result of something already said."],["Moreover, … / Also, …","Cannot open","Adds to an earlier point."],["For example, …","Cannot open","An example of an idea already stated."],["Then … / After that, …","Cannot open","The next step after an earlier one."],["Finally, …","Cannot open","The last of several steps or points."],["Another reason is …","Cannot open","‘Another’ means one was given before."],["Similarly, …","Cannot open","Compares with something already said."],["On the other hand, …","Cannot open","The second side of an argument."],["In other words, …","Cannot open","Restates an earlier sentence."],["The former …","Cannot open","Needs two things named just before."]]},{"k":"facts","title":"What a good opener usually looks like","rows":[["New noun","A full name or ‘a / an + noun’: “A small boat was seen …”"],["General truth","“Exercise is good for both the body and the mind.”"],["Definition","“A volcano is an opening in the Earth’s crust …”"],["Scene-setter","A time or place: “Last Sunday, we visited an old fort.”"],["Question","“What makes a good leader?” — the next sentences answer it."],["Common belief","“Many people think that …” — often followed by ‘In fact’ or ‘But’."]]},{"k":"trick","h":"Scan only the <b>first two or three words<\/b> of each sentence. Strike every sentence that starts with a pronoun, a pointing word or a connector. Whatever is left is your opener — often there is only one."},{"k":"trap","h":"A sentence with a name is not always the opener: “Penicillin, <b>for example<\/b>, was found …” is an example of an idea stated earlier. And <b>‘The’<\/b> is not always a sign of a later sentence — “The Sun is a star” or “The Constitution of India came into force …” can open, because everyone already knows the thing named."}],"sum":["The opener makes sense on its own: the stranger test.","It introduces the topic with a full noun, ‘a/an + noun’, a general statement, a definition, a scene-setter or a question.","It does not begin with he/she/it/they, this/these/such, or a connector such as however, therefore, also, for example, then.","‘Although’ and ‘When’ can begin an opener because the whole idea is inside the sentence.","A name alone does not make an opener — check for ‘for example’, ‘too’, ‘later’."],"part":["Part 2 · The clues, one by one","एक-एक करके संकेत"],"g":"pj"},
{"id":"J4","heat":2,"title":"Pronoun and noun links","hi":"सर्वनाम और संज्ञा का संबंध","blocks":[{"k":"hot","h":"The commonest clue in SSC para jumbles: a sentence with <b>he, she, it, they, his, its or their<\/b> must come <b>after<\/b> the sentence that names the person or thing."},{"k":"story","h":"<p>Writers name a person or thing once, in full, and then save words: <i>Dr Rao opened a clinic. <b>She<\/b> examines fifty patients a day. <b>Her<\/b> clinic is always full.<\/i> The pronoun is a hook that must catch on a noun that came <b>before<\/b> it.<\/p><p>So when you see a pronoun, ask: <b>who or what is this?<\/b> Find the sentence that names it, and you have a pair. Check that the two agree — <i>they<\/i> needs a plural, <i>she<\/i> a woman or girl, <i>it<\/i> a single thing or idea.<\/p>","key":"Name first, pronoun after — and the pronoun must agree with the name in number and gender."},{"k":"table","title":"What each pronoun needs before it","head":["Word","Needs before it","Example"],"rows":[["he / him / his","a man or boy already named","Mr Sharma retired. He now teaches hockey."],["she / her","a woman or girl already named","Asha practised daily. She won the prize."],["it / its","one thing, animal or idea already named","The bridge is old. Its pillars are cracked."],["they / them / their","a plural noun, or two or more people","The students planted saplings. They water them daily."],["this / that","one thing or idea just mentioned","Prices rose sharply. This hurt the poor."],["these / those","several things just mentioned","Pepper and cardamom grow in Kerala. These spices …"],["such","a kind of thing just described","Some birds copy human words. Such skills …"],["the former / the latter","two things named together just before","LPG and firewood … The former is clean."],["one … the other","two things announced earlier","There are two roads. One is short; the other is safe."],["both","two people or things already named","Maya and Dev … Both became doctors."],["there (a place)","a place already named","We reached the fort. From there we saw the city."],["the same","something already mentioned","Last year a cyclone hit the village. This year the same village was ready."]]},{"k":"facts","title":"How a reference chain runs","rows":[["Full name","“Dr Meera Rao opened a free eye clinic.”"],["Pronoun","“She examines fifty patients a day.”"],["Describing noun","“The doctor also visits nearby villages.”"],["Possessive","“Her clinic is a blessing for the poor.”"]]},{"k":"trick","h":"Underline every pronoun and draw an arrow back to its noun. Each arrow is a pair: the noun’s sentence comes first, the pronoun’s sentence after — usually right after."},{"k":"trap","h":"Check <b>number and gender<\/b>: <i>they<\/i> cannot point to one boy, and <i>she<\/i> cannot point to Ravi. When two people appear, decide which one the <i>he<\/i> means. And <i>it<\/i> or <i>this<\/i> may point to a whole idea (“Prices rose. This hurt the poor.”), not just a noun."}],"sum":["A pronoun’s sentence comes after the sentence that names its noun.","he/him/his: a man or boy; she/her: a woman or girl; it/its: one thing or idea; they/them/their: a plural.","this/that, these/those and such point back to something just said.","The former / the latter need two things named together just before.","Check number and gender; ‘it’ or ‘this’ can point to a whole idea."],"part":["Part 2 · The clues, one by one","एक-एक करके संकेत"],"g":"pj"},
{"id":"J5","heat":1,"title":"Articles and pointing words: a → the","hi":"आर्टिकल और संकेतक शब्द: a → the","blocks":[{"k":"hot","h":"A quiet but reliable clue: <b>“a boat”<\/b> comes before <b>“the boat”<\/b>; <b>“a scheme”<\/b> before <b>“this scheme”<\/b> or <b>“such a scheme”<\/b>. One glance at the articles often gives you a pair."},{"k":"story","h":"<p>When something appears for the first time, English gives it <b>a<\/b> or <b>an<\/b>: <i>A small boat was seen near the shore.<\/i> From then on it is a known thing, so it takes <b>the<\/b>: <i>The boat had no one on board.<\/i> The same goes for <b>this<\/b>, <b>that<\/b>, <b>such<\/b> and <b>the same<\/b> — they all mean ‘the one you already know about’.<\/p><p><b>Another<\/b> and <b>the other<\/b> work the same way: you can only speak of <i>another<\/i> storm if one storm has already been mentioned.<\/p>","key":"‘a/an + noun’ introduces; ‘the / this / such / the same + noun’ refers back."},{"k":"table","title":"What the article or pointing word tells you","head":["Word","Signals","Example"],"rows":[["a / an + noun","first mention: something new","A stranger knocked on our door."],["the + the same noun","second mention: already known","The stranger asked for water."],["this / that + noun","the one just mentioned","Under this scheme, every school …"],["such a / such + noun","a kind just described","Such a facility was badly needed."],["the same + noun","exactly the one named before","This year, the same village was ready."],["another + noun","a second one of a kind already named","Another storm hit the coast."],["the other + noun","the remaining one of two","The other road is longer."],["the + something unique","known to everyone; can open","The Sun is a star."],["the + superlative","unique by meaning; can open","The largest mangrove forest is …"],["some / many + plural noun","new; can open","Some birds can copy sounds."]]},{"k":"trick","h":"Look for the same noun twice — once with <b>a/an<\/b>, once with <b>the<\/b> or <b>this<\/b>. The ‘a’ sentence goes first. If you also see <b>such<\/b> or <b>these<\/b>, that sentence usually sums up and comes late."},{"k":"trap","h":"<b>The<\/b> does not always mean ‘second mention’. Unique things (<i>the Sun, the Taj Mahal, the government<\/i>) and superlatives (<i>the largest, the first<\/i>) can appear in an opener. Use the article clue together with the pronoun and connector clues."}],"sum":["a/an + noun = first mention; the + the same noun = second mention.","this, that, such and the same point back to something already named.","another = one more of a kind already mentioned; the other = the remaining one of two.","The + a unique thing or a superlative can open a paragraph.","Use the article clue with the pronoun and connector clues."],"part":["Part 2 · The clues, one by one","एक-एक करके संकेत"],"g":"pj"},
{"id":"J6","heat":2,"title":"Connectors and transition words","hi":"संयोजक और संक्रमण शब्द","blocks":[{"k":"hot","h":"Connectors are the loudest clue in a para jumble. A sentence that begins <b>However, Therefore, Moreover, For example<\/b> or <b>Also<\/b> can never open, and each one tells you exactly what the sentence before it must say."},{"k":"story","h":"<p>A connector is a road sign between two sentences. <b>However<\/b> says “the road turns — the next idea goes against the last one.” <b>Therefore<\/b> says “because of what you just read, this follows.” <b>Moreover<\/b> says “one more point in the same direction.” <b>For example<\/b> says “here is a case of what I just claimed.”<\/p><p>So every connector is a pair clue. Read it, then look for the sentence it answers: the opposite idea for <i>however<\/i>, the cause for <i>therefore<\/i>, a similar point for <i>moreover<\/i>, the general claim for <i>for example<\/i>.<\/p>","key":"Every connector tells you what the sentence just before it must contain."},{"k":"table","title":"Connectors and their jobs","head":["Connector","Job","Example"],"rows":[["However","Contrast","The car is cheap to run. However, it costs a lot to buy."],["But","Contrast","He wanted to come. But he had no ticket."],["Yet","Contrast","Most cats avoid water. Yet tigers love to swim."],["Nevertheless","Contrast","Fast food is tasty. Nevertheless, it should not be eaten daily."],["On the other hand","Contrast","Paper books are easy on the eyes. Screens, on the other hand, are easy to carry."],["Instead","Contrast","We did not cancel the picnic. Instead, we held it indoors."],["Moreover","Addition","The scheme is cheap. Moreover, it is easy to run."],["Furthermore","Addition","The road is narrow. Furthermore, it floods in the rains."],["Also","Addition","Trees give shade. They also clean the air."],["Besides","Addition","Besides honey, bees give us wax."],["In addition","Addition","In addition, the number of vehicles is rising."],["Therefore","Result","It rained all night. Therefore, the match was put off."],["Thus","Result","Water expands as it freezes; ice thus floats."],["Hence","Result","The bridge was weak. Hence, it was closed."],["As a result","Result","The factory closed. As a result, many lost their jobs."],["Consequently","Result","He missed the bus. Consequently, he was late."],["That is why","Result","Light travels faster than sound. That is why we see lightning first."],["For example","Example","Some birds copy sounds. Parrots, for example, repeat words."],["For instance","Example","Many jobs are new. App developers, for instance, did not exist before."],["Such as","Example","Spices such as pepper and cardamom grow in Kerala."],["First / Firstly","Sequence","First, boil the water."],["Then / Next","Sequence","Then add the tea leaves."],["Finally","Sequence","Finally, strain the tea and serve it."],["Similarly","Comparison","Parrots copy words. Similarly, mynahs copy sounds."],["Likewise","Comparison","The first team trained hard; likewise, the second."],["In short","Conclusion","In short, weather changes daily, but climate does not."],["To sum up","Conclusion","To sum up, both have their uses."],["Because","Reason","The match was put off because it rained."],["In fact","Emphasis or correction","Many think the hump stores water. In fact, it is fat."]]},{"k":"facts","title":"What the sentence before must say","rows":[["Contrast word","The opposite idea: a good point before ‘however’ brings a bad one, and the other way round."],["Addition word","A point in the same direction: a benefit before ‘moreover’ brings another benefit."],["Result word","The cause: ‘It rained all night’ before ‘Therefore, the match was put off’."],["Example word","The general claim the example illustrates."],["Comparison word","A similar case: ‘Parrots copy words’ before ‘Similarly, mynahs …’."],["Conclusion word","Everything else — it comes last."]]},{"k":"trick","h":"Group the sentences by direction. Benefits go together, joined by <b>also / moreover<\/b>; then <b>however / but<\/b> turns to the drawbacks; <b>therefore<\/b> or <b>in short<\/b> closes. A ‘moreover’ right after a ‘however’ sentence must add to the drawback, not to the benefit."},{"k":"trap","h":"Connectors can sit in the middle of a sentence: “Their most important job, <b>however<\/b>, is …”, “It <b>also<\/b> helps …”. They still point back. But <b>Although<\/b>, <b>Because<\/b> and <b>When<\/b> at the very start join two halves of one sentence, so such a sentence can still open."}],"sum":["Contrast: however, but, yet, nevertheless, on the other hand, instead.","Addition: moreover, furthermore, also, besides, in addition.","Result: therefore, thus, hence, so, as a result, consequently, that is why.","Example: for example, for instance, such as. Comparison: similarly, likewise.","Conclusion: in short, to sum up — they come last. Connectors in mid-sentence still point back."],"part":["Part 2 · The clues, one by one","एक-एक करके संकेत"],"g":"pj"},
{"id":"J7","heat":1,"title":"Time and sequence order; cause → effect","hi":"समय और क्रम; कारण → परिणाम","blocks":[{"k":"hot","h":"Stories, life histories and how-to paragraphs are common in SSC sets. Their order is fixed by <b>time<\/b>: first → then → finally, dates in order, cause before effect."},{"k":"story","h":"<p>Some paragraphs have a built-in clock. A recipe goes <i>boil → add → pour → serve<\/i>. A life story goes <i>born → studied → worked → honoured<\/i>. A flood story goes <i>rain → river rises → floods → people move<\/i>. The sentences can only go one way, because each event needs the one before it.<\/p><p>Watch for <b>order words<\/b> (first, then, next, after that, finally), <b>dates and ages<\/b>, and <b>words of time<\/b> (by then, soon, later, today). And remember that a <b>cause<\/b> always comes before its <b>effect<\/b>.<\/p>","key":"Put the events on a timeline: earlier events, and causes, come first."},{"k":"table","title":"Order words and where they sit","head":["Word","Stage","Note"],"rows":[["First / Firstly","Beginning","The first step; may follow a scene-setting opener."],["At first","Beginning","How things were early on, before a change."],["Initially","Beginning","Same as ‘at first’."],["To begin with","Beginning","The first of several points or steps."],["Originally","Beginning","How something started."],["Then","Middle","The next step after one already given."],["Next","Middle","The following step."],["After that","Middle","Follows a step just described."],["Soon after","Middle","A short time after an earlier event."],["Second / Secondly","Middle","The second of several points."],["Later","Middle","Some time after an earlier event."],["Meanwhile","Middle","At the same time as an event just told."],["Finally","End","The last step or point."],["Lastly","End","The last of a list."],["At last","End","After a long wait or effort."],["In the end","End","How things finally turned out."],["Eventually","End","After a long time or many steps."],["Ultimately","End","The final result."]]},{"k":"table","title":"Orders that never change","head":["Pattern","Order"],"rows":[["Cause and effect","cause → effect → further effect"],["A process","first step → middle steps → last step → result"],["Dates","earlier year → later year → today"],["A life story","birth → education → work → achievement → later life"],["A day or journey","morning → noon → evening; departure → journey → arrival"],["Then and now","the past → the change → the present"]]},{"k":"trick","h":"When you see dates or years, simply sort them. When you see <b>At first … Then … Now<\/b> or <b>First … Next … Finally<\/b>, the order words do the work for you."},{"k":"trap","h":"<b>Later<\/b>, <b>by then<\/b> and <b>since then<\/b> point back to a time already mentioned, so they cannot open. <b>Before that<\/b> sends you back in time: the sentence it refers to comes just before it, even though its event happened later."}],"sum":["Order words: first/at first/initially → then/next/after that/later → finally/at last/eventually.","Sort dates and ages from earlier to later.","A cause comes before its effect; a process runs step by step.","Later, by then and since then point back, so they cannot open.","Then and now: past → change → present."],"part":["Part 2 · The clues, one by one","एक-एक करके संकेत"],"g":"pj"},
{"id":"J8","heat":1,"title":"General → specific, problem → solution","hi":"सामान्य → विशिष्ट, समस्या → समाधान","blocks":[{"k":"hot","h":"When there is no pronoun or connector to help, the <b>shape<\/b> of the paragraph decides the order: broad claim first, details and examples after; problem first, solution and result after; advice or summary at the end."},{"k":"story","h":"<p>Most short paragraphs follow one of a few shapes. A <b>general-to-specific<\/b> paragraph opens with a broad statement (“India is a land of many festivals”) and narrows down to cases (“In Kerala, Onam …”). A <b>problem-solution<\/b> paragraph describes a trouble, its cause, the fix and the result. An <b>old-view-new-view<\/b> paragraph begins with what people once believed and ends with what we now know.<\/p><p>Knowing the shape also tells you the <b>last sentence<\/b>: a result, a summary, a piece of advice (“We should therefore …”) or a look ahead (“If more people …”).<\/p>","key":"Broad before narrow, problem before solution, and the advice or summary comes last."},{"k":"table","title":"Common paragraph shapes","head":["Shape","Order","Signals"],"rows":[["General → specific","claim → detail → example","for example, in Kerala, one such"],["Problem → solution","problem → cause → solution → result","to solve this, one way, as a result"],["Question → answer","question → answer → explanation","the answer, the reason is"],["Claim → reasons","claim → reason 1 → reason 2 → conclusion","first, also, moreover, therefore"],["Old view → new view","what people believed → the change → what we know now","for centuries, in fact, today"],["Story","setting → event → reaction → outcome","one day, then, in the end"],["Two sides","side 1 → side 2 → balanced view","on the one hand, on the other hand"]]},{"k":"table","title":"What a closing sentence looks like","head":["Kind","Example"],"rows":[["Advice","We should therefore carry our own bags."],["Summary","In short, each has its own advantages."],["Result","Within a year, reading levels improved sharply."],["A look ahead","If more people joined them, hunger could be reduced."],["A lesson","Such accidents remind us to keep our eyes open."],["The final event","When she finished, the hall rang with applause."]]},{"k":"trick","h":"Ask of each sentence: is it <b>bigger<\/b> or <b>smaller<\/b> than the others? The biggest, most general idea opens; the examples go in the middle; the sentence that tells you what to <b>do<\/b> or what it all <b>means<\/b> closes."},{"k":"trap","h":"Do not end on an example or on a question. A sentence that asks something, or that begins <b>For example<\/b>, <b>First<\/b> or <b>One reason<\/b>, needs a follower, so it cannot be the last."}],"sum":["General → specific: the broad claim first, then details and examples.","Problem → solution: problem, cause, solution, result.","Old view → new view: past belief, the change, today’s knowledge.","The last sentence is advice, a summary, a result, a lesson or a look ahead.","A question, an example or ‘First …’ cannot be the last sentence."],"part":["Part 2 · The clues, one by one","एक-एक करके संकेत"],"g":"pj"},
{"id":"J9","heat":1,"title":"Mandatory pairs","hi":"अनिवार्य जोड़े","blocks":[{"k":"hot","h":"A <b>mandatory pair<\/b> is two sentences that must sit side by side, in a fixed order. Find one and you can strike every option that splits it or turns it round — often three at once."},{"k":"story","h":"<p>Some sentences cannot live apart. A question needs its answer right after it. “One reason is …” calls for “Another reason is …”. “Some people say …” calls for “Others believe …”. A sentence that names two things is followed by one that says “the former … the latter”.<\/p><p>When you spot such a pair, write it down as two letters, say <b>RP<\/b>. Now look at the options: any option without <b>RP<\/b> side by side is out.<\/p>","key":"Write the pair as two letters and strike every option that does not contain them side by side."},{"k":"table","title":"Pairs that must sit together","head":["One sentence …","… so the next one","Example"],"rows":[["introduces ‘a boat’","refers to ‘the boat’","A boat drifted in. / The boat was empty."],["names a person","uses he, she, his or her","Dr Rao opened a clinic. / She treats the poor."],["asks a question","gives the answer","Why do we see lightning first? / The reason is …"],["makes a general claim","gives a case: ‘for example’","Some inventions were accidents. / Penicillin, for example, …"],["names two things","takes them in turn: ‘the former … the latter’","LPG and firewood are used. / The former is clean."],["says ‘One reason is …’","says ‘Another reason is …’","One reason is jobs. / Another is schools."],["says ‘Some people …’","says ‘Others …’","Some say speed matters. / Others value patience."],["says ‘On the one hand …’","says ‘On the other hand …’","On the one hand, jobs came. / On the other hand, shops closed."],["gives a cause","gives the result: ‘so’, ‘therefore’","It rained for days. / So the river rose."],["states a common belief","corrects it: ‘In fact …’","Many think the hump holds water. / In fact, it is fat."],["reports what someone said","gives the reply","The doctor said, ‘Walk daily.’ / Anil said he had no time."],["gives the first step","gives the next: ‘Then …’","First, boil the water. / Then add the leaves."]]},{"k":"trick","h":"Look for a pair before you look for the opener if one jumps out — a question and its answer, or ‘the former / the latter’. A pair often settles the question even when the opener is hard to spot."},{"k":"trap","h":"A pair fixes <b>order<\/b> as well as nearness. If Q introduces ‘a scheme’ and S says ‘this scheme’, the pair is <b>QS<\/b>, not SQ. An option with <b>SQ<\/b> side by side is still wrong."}],"sum":["A mandatory pair is two sentences that must be side by side, in a fixed order.","Common pairs: a X → the X; name → he/she; question → answer; claim → for example; one reason → another.","Two things named → the former / the latter; some → others; on the one hand → on the other hand.","Write the pair as two letters and strike every option that splits it or reverses it.","Belief → ‘In fact’ correction; cause → ‘so’ or ‘therefore’."],"part":["Part 2 · The clues, one by one","एक-एक करके संकेत"],"g":"pj"},
{"id":"J10","heat":2,"title":"Option elimination","hi":"विकल्प हटाने की विधि","blocks":[{"k":"hot","h":"In the exam you do not need to build the order — you need to pick it from four. A few quick tests usually strike out three options in under thirty seconds."},{"k":"story","h":"<p>Think of the four options as four suspects. You do not have to prove who is guilty; you only have to clear the innocent. The <b>opener test<\/b> clears every option that starts with a sentence that leans on something. The <b>pair test<\/b> clears every option that splits a mandatory pair or turns it round. The <b>ending test<\/b> clears options that stop on a question, an example or a ‘First …’.<\/p><p>Often two options survive the opener test because they start the same way. Then look at where they differ — usually the last two letters — and ask which of those two sentences links to the one before it.<\/p>","key":"Opener test, pair test, ending test — then compare only where the survivors differ."},{"k":"table","title":"The quick tests","head":["Test","Strike out options that …","Example"],"rows":[["Opener","begin with a pronoun, a pointing word or a connector sentence","R begins ‘However’ → strike R…"],["Pair","split a mandatory pair","Q names Dr Rao, S says ‘She’ → keep only options with QS"],["Direction","have the pair the wrong way round","‘a scheme’ in P, ‘this scheme’ in R → PR, never RP"],["Ending","end with a question, an example or a ‘First …’ sentence","an option ending on ‘For example …’ is out"],["Fixed sentences","do not link to S1 or to S6","the sentence after S1 must follow from it"],["Difference","survive — compare only the letters where they differ","QPRS vs QPSR: does R or S follow P?"]]},{"k":"ex","h":"<p>Options: (a) RSQP (b) SQRP (c) SRQP (d) QSRP. Suppose S is the only possible opener — strike (a) and (d). Now (b) and (c) differ in the middle: SQ… or SR…? If R begins ‘He’ and Q names the man, R must follow Q, so (b) <b>SQRP<\/b> survives.<\/p>"},{"k":"trick","h":"Count how many options start with each letter. If three options start with the same letter, that letter is very likely the opener — but still check it with the stranger test."},{"k":"trap","h":"Do not stop as soon as one test leaves a single option — read it through once. A careless pair (say a ‘they’ that really points to a different noun) can mislead you."}],"sum":["Opener test: strike options that begin with a sentence that leans on something.","Pair test: strike options that split a mandatory pair or reverse it.","Ending test: an option cannot end on a question, an example or ‘First …’.","With S1/S6 fixed, the first and last of P, Q, R, S must link to them.","When two survive, compare only the letters where they differ, then read the winner once."],"part":["Part 3 · Elimination, single sentences and mixed practice","विकल्प हटाना, एक वाक्य के भाग और मिश्रित अभ्यास"],"g":"pj"},
{"id":"J11","heat":1,"title":"Rearranging the parts of one sentence","hi":"एक वाक्य के भागों को क्रम में लगाना","blocks":[{"k":"hot","h":"Some SSC sets cut one sentence into four parts (sometimes the first words are given). Here grammar, not story, decides the order: <b>subject → verb → object → extra details<\/b>, with each clause in its proper place."},{"k":"story","h":"<p>An English sentence has a backbone: <b>who<\/b> (the subject) <b>does what<\/b> (the verb) <b>to what<\/b> (the object), then <b>how, where and when<\/b>. “The old man / walks his dog / in the park every morning.” A clause beginning with <b>who, which or that<\/b> sits right after the noun it describes: “The old man <b>who lives next door<\/b> walks …”.<\/p><p>Some words come in partners that fix the order for you: <b>not only … but also<\/b>, <b>neither … nor<\/b>, <b>either … or<\/b>, <b>so … that<\/b>, <b>no sooner … than<\/b>, <b>hardly … when<\/b>, <b>the more … the more<\/b>. Find the partners and you have the skeleton of the sentence.<\/p>","key":"Subject, verb, object, then how–where–when; a ‘who/which’ clause right after its noun; partner words in their fixed order."},{"k":"table","title":"Partner words that fix the order","head":["The first word","Its partner","Example"],"rows":[["Not only","but also","Not only did he finish, but he also helped others."],["Neither","nor","Neither the manager nor his staff knew."],["Either","or","Either you or your brother must come."],["Both","and","Both Maya and Dev became doctors."],["So (+ adjective)","that","So heavy was the rain that the river rose."],["Such (+ noun)","that","It was such a hot day that we stayed in."],["No sooner","than","No sooner did we arrive than it rained."],["Hardly / Scarcely","when","Hardly had we sat down when the bell rang."],["The more …","the more / the better","The more you read, the better you write."],["Whether","or","Whether you win or lose, play fair."],["Rather","than","She would rather walk than wait."],["Although","(no ‘but’) main clause","Although he was tired, he kept working."]]},{"k":"facts","title":"Where the building blocks go","rows":[["Subject","Usually first: “The scientist …”, “Neither the manager …”."],["Relative clause","Right after its noun: “The book that you lent me …”."],["Verb","Right after the subject (and its clause): “… was given …”."],["Object","After the verb: “… an award …”."],["Place, then time","“… in the park every morning.”"],["A ‘because / although / if’ clause","Either at the very start (with a comma) or after the main clause."]]},{"k":"trick","h":"Find the <b>subject<\/b> (a noun group that can start a sentence) and the <b>main verb<\/b>; they are usually two of the four parts. Then fit the ‘who/which’ part right after the subject and send the place and time to the end."},{"k":"trap","h":"A ‘who/which/that’ part placed at the end can change the meaning: “The scientist was given an award by the government <b>who discovered the medicine<\/b>” now seems to say the government discovered it. Also, ‘Although … but’ is wrong — ‘although’ takes no ‘but’."}],"sum":["Subject → verb → object → place → time.","A who/which/that clause goes right after the noun it describes.","Partner words fix the order: not only … but also, neither … nor, either … or, so … that, no sooner … than, hardly … when.","A because/although/if clause opens the sentence with a comma or follows the main clause.","Although takes no ‘but’; a misplaced clause can change the meaning."],"part":["Part 3 · Elimination, single sentences and mixed practice","विकल्प हटाना, एक वाक्य के भाग और मिश्रित अभ्यास"],"g":"pj"},
{"id":"J12","heat":2,"title":"Mixed practice: every type together","hi":"मिश्रित अभ्यास: सभी प्रकार एक साथ","blocks":[{"k":"hot","h":"The exam mixes the formats and the clues. This set does the same: four-sentence jumbles, S1 and S1–S6 sets, single-sentence parts, and ‘which comes first / last’."},{"k":"story","h":"<p>Work each question with the same routine, against the clock: <b>topic → opener → one pair → strike → read once<\/b>. Aim for under a minute each. When you get one wrong, read the explanation and name the clue you missed — pronoun, article, connector, time, shape or pair. That clue is the one to revise.<\/p>","key":"Same routine every time; after a mistake, name the clue you missed."},{"k":"table","title":"Which clue to try first","head":["You see …","Try first"],"rows":[["Names and he/she/they","Pronoun links (J4)"],["‘a …’ and ‘the / this / such …’","Article links (J5)"],["However, therefore, also, for example","Connectors (J6)"],["Dates, first/then/finally, a story","Time order (J7)"],["A problem, a claim, advice","Paragraph shape (J8)"],["A question, ‘one … the other’, ‘former … latter’","Mandatory pairs (J9)"],["Parts of one sentence","Grammar order (J11)"]]},{"k":"trick","h":"Time yourself: 45 seconds for a four-sentence set, 30 for a ‘which comes first’. If you are stuck after a minute, mark your best guess from the opener test and move on."},{"k":"trap","h":"Under time pressure people pick the option whose first two letters are right. Always glance at the last two letters too."}],"sum":["Use the same five steps on every question.","Match the clue to what you see: names → pronouns; a/the → articles; however → connectors; dates → time; problem → shape; question → pair.","Single-sentence parts: subject, verb, object, then details.","Aim for about 45 seconds a set.","After a mistake, name the clue you missed and revise that lesson."],"part":["Part 3 · Elimination, single sentences and mixed practice","विकल्प हटाना, एक वाक्य के भाग और मिश्रित अभ्यास"],"g":"pj"}
];
const QB = [
["J1","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. It lends books free of charge to anyone who lives in the town.\nQ. However, it closes early on Sundays.\nR. Our town opened a public library last year.\nS. As a result, many students now study there after school.",["RPSQ","PRSQ","SRPQ","RPQS"],"R introduces the library; ‘It’ in P refers to it; ‘As a result’ in S follows from the free books; ‘However’ in Q adds a drawback.",""],
["J1","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Rain had not fallen in the village for nearly two months.\nP. They decided to dig a small pond to store water for the next season.\nQ. When the rains finally came, the pond filled to the brim.\nR. The wells dried up, and the crops began to wilt.\nS. Worried, the farmers met in the temple courtyard to find a way out.",["RSPQ","SRPQ","RPSQ","RSQP"],"No rain (S1) dries the wells (R); this worries the farmers (S); ‘They’ in P is the farmers, who plan the pond; ‘the pond’ in Q can fill only after it is dug.",""],
["J1","The first (S1) and the last (S6) sentences are given. Arrange P, Q, R and S in the right order between them.\nS1. Honeybees are among the most useful insects in the world.\nP. Besides honey, they give us beeswax, which is used in candles and polish.\nQ. Sadly, their numbers are falling because of pesticides and loss of habitat.\nR. Without this help, many fruits and vegetables would not grow.\nS. Their most important job, however, is carrying pollen from flower to flower.\nS6. Protecting them, therefore, protects our food supply as well.",["PSRQ","RPSQ","PRQS","SRPQ"],"‘Besides honey’ in P lists a useful product; ‘however’ in S turns to their most important job; ‘this help’ in R is pollination; Q brings in the danger that S6 answers.",""],
["J1","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nP. who lives next door\nQ. walks his dog\nR. in the park every morning.\nS. The old man",["SPQR","SQRP","QRSP","PSQR"],"Subject (S) + its ‘who’ clause (P) + verb and object (Q) + place and time (R). The ‘who’ clause must sit right after ‘The old man’.",""],
["J1","Which of these sentences should come FIRST in a meaningful paragraph?\nP. They work best on clear days with long hours of sunshine.\nQ. Solar panels turn sunlight directly into electricity.\nR. Many homes there now have panels on their roofs.\nS. For this reason, they are popular in sunny states such as Rajasthan.",["Q","P","R","S"],"Q names the subject, solar panels. P begins with ‘They’, S with ‘For this reason’, and ‘there’ in R needs a place named earlier.",""],
["J1","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. He called the number printed on the card.\nQ. Inside it were some cash and an identity card.\nR. Ravi found a wallet lying on a bus seat.\nS. The owner, a nurse, thanked him and came to collect it.",["RQPS","QRPS","RPQS","RQSP"],"‘it’ in Q is the wallet in R; ‘the card’ in P is the identity card of Q; the owner can come only after Ravi calls (S).",""],
["J1","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Many people find it hard to sleep well at night.\nP. Another reason is drinking tea or coffee late in the evening.\nQ. The bright screen tells the brain that it is still daytime.\nR. One common reason is the use of phones just before bed.\nS. Doctors therefore advise keeping both screens and caffeine away after dinner.",["RQPS","PRQS","RPQS","RQSP"],"‘One common reason’ (R) must come before ‘Another reason’ (P); ‘The bright screen’ in Q explains the phone in R; S needs both causes before it.",""],
["J1","The first (S1) and the last (S6) sentences are given. Arrange P, Q, R and S in the right order between them.\nS1. Mohan wanted to learn to swim before the summer holidays ended.\nP. On the first day, he was too afraid to let go of the edge.\nQ. He joined a beginners’ class at the town pool.\nR. The coach, however, kept encouraging him patiently.\nS. Slowly, he began to float and kick on his own.\nS6. By the end of May, he could swim across the pool without help.",["QPRS","PQRS","QRPS","QSPR"],"He joins a class (Q) before ‘the first day’ (P); ‘however’ in R contrasts with his fear; ‘Slowly’ in S leads to the success in S6.",""],
["J1","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nP. nor his assistants\nQ. Neither the manager\nR. were aware of\nS. the change in the schedule.",["QPRS","PQRS","QRPS","QRSP"],"‘Neither’ (Q) is followed at once by ‘nor’ (P); then the verb ‘were aware of’ (R) and its object (S).",""],
["J1","Which of these sentences should come FIRST in a meaningful paragraph?\nP. For over a century, its light guided ships away from the rocks.\nQ. Still, the villagers keep it clean and paint it every year.\nR. Today, modern radar has made it unnecessary.\nS. An old lighthouse stands on the rocky coast near our village.",["S","P","Q","R"],"S introduces ‘an old lighthouse’. P has ‘its’, R has ‘it’, and Q begins with ‘Still’ — all three lean on the lighthouse.",""],
["J1","Which of these sentences should come LAST in a meaningful paragraph?\nP. Cloth and jute bags, on the other hand, can be used again and again.\nQ. We should therefore carry our own bag when we go shopping.\nR. Meanwhile, they choke drains and harm animals that swallow them.\nS. Plastic bags take hundreds of years to break down.",["Q","P","R","S"],"Q is the advice that follows from the problem (S, R) and the alternative (P); ‘therefore’ marks a conclusion.",""],
["J1","In the ‘S1 … S6’ form of the question, how many sentences do you actually arrange?",["Four","Six","Two","Five"],"S1 and S6 are fixed; you arrange only the middle four, P, Q, R and S.",""],
["J1","How many different orders can four sentences P, Q, R and S form?",["24","16","12","8"],"4 × 3 × 2 × 1 = 24. The question shows only four of them, so testing the options is quicker than building the order.",""],
["J1","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. From there, it moves north and covers most of India by July.\nQ. The monsoon reaches the coast of Kerala in early June.\nR. A weak monsoon, therefore, can hurt the whole economy.\nS. These rains are vital, because many farmers depend on them to water their fields.",["QPSR","PQSR","QSRP","SQPR"],"Q sets the scene; ‘From there’ in P is Kerala; ‘These rains’ in S sums up the monsoon; ‘therefore’ in R follows from the farmers’ need.",""],
["J1","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Our school held a cleanliness drive last Saturday.\nP. The juniors picked up litter from the playground, while the seniors cleared the garden.\nQ. By noon, the whole campus was spotless.\nR. Each class was given one part of the campus to clean.\nS. Pleased with the result, the principal gave a prize to the tidiest class.",["RPQS","RQPS","RPSQ","QRPS"],"The plan (R) comes before the work (P); ‘By noon’ (Q) gives the result; ‘Pleased with the result’ in S needs that result before it.",""],
["J1","The first (S1) and the last (S6) sentences are given. Arrange P, Q, R and S in the right order between them.\nS1. The town of Rampur had only one narrow bridge over its river.\nP. To solve this problem, the council built a second, wider bridge.\nQ. People often reached their offices and schools late.\nR. Every morning, long lines of buses and trucks waited to cross it.\nS. It was opened to traffic last month.\nS6. Since the new bridge opened, the journey takes just ten minutes.",["RQPS","PRQS","RPSQ","QRPS"],"‘it’ in R is the narrow bridge of S1; the delay (Q) is ‘this problem’ in P; ‘It’ in S is the new bridge, which leads to S6.",""],
["J1","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nBegins: Although it was raining heavily,\nP. the rice seedlings.\nQ. continued\nR. to plant\nS. the farmers",["SQRP","SRQP","PQSR","SRPQ"],"After the fixed clause comes the subject (S), the verb ‘continued’ (Q), the infinitive ‘to plant’ (R) and its object (P).",""],
["J1","Which of these sentences should come FIRST in a meaningful paragraph?\nP. As a result, a trip that now takes an hour will take only twenty-five minutes.\nQ. A new metro line will link the airport with the city centre.\nR. This will also reduce traffic on the busy airport road.\nS. Trains on it will run every five minutes.",["Q","P","R","S"],"Q introduces ‘a new metro line’. ‘on it’ in S, ‘As a result’ in P and ‘This will also’ in R all point back.",""],
["J1","Which of these sentences should come LAST in a meaningful paragraph?\nP. When she finished, the hall rang with applause.\nQ. Asha had been practising the violin for months for the school concert.\nR. On the day of the concert, her hands shook as she walked on stage.\nS. Once she began to play, however, her fear melted away.",["P","Q","R","S"],"The story runs practice (Q) → nerves (R) → playing (S) → ‘When she finished’ (P), the natural last event.",""],
["J1","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. This ability to regrow makes it a good substitute for timber.\nQ. Bamboo is one of the fastest-growing plants on Earth.\nR. Some kinds can grow almost a metre in a single day.\nS. Because it grows so quickly, it can be cut again and again without destroying the forest.",["QRSP","RQSP","QPRS","SQRP"],"Q names bamboo; R gives a detail of its speed; ‘Because it grows so quickly’ in S builds on that; ‘This ability to regrow’ in P points to S.",""],
["J1","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. The human body needs water to work properly.\nP. When we do not drink enough, we may feel tired or get headaches.\nQ. Water carries nutrients to the cells and removes waste.\nR. It also helps keep the body’s temperature steady.\nS. Doctors, therefore, advise drinking water regularly through the day.",["QRPS","RQPS","QPRS","QPSR"],"Q gives the first job of water; ‘It also’ in R adds a second; P shows what happens without it; ‘therefore’ in S gives the advice.",""],
["J1","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Kabaddi is a contact sport that began in ancient India.\nQ. A raider enters the other half of the court and tries to touch as many opponents as possible.\nR. He must then return to his own half before he is caught.\nS. It is played between two teams of seven players each.",["PSQR","SPQR","PSRQ","QRPS"],"P names the sport; ‘It’ in S is kabaddi; Q introduces ‘a raider’; ‘He’ and ‘then’ in R point to the raider.",""],
["J2","In the five-step method, what do you do first?",["Read all four sentences to find the topic","Pick the shortest sentence as the opener","Look only at the first option","Start with the sentence that contains a name"],"First read all four sentences quickly to see what the paragraph is about; the opener and the pairs come next.",""],
["J2","Which sentence start is the surest sign that a sentence can NOT open a paragraph?",["“This method …”","“A new method …”","“Many methods …”","“Scientists have found a method …”"],"‘This’ points back to something already mentioned, so a sentence starting ‘This method’ cannot come first.",""],
["J2","You are sure that R must come right after Q. Which option can you strike out at once?",["PRQS","PQRS","SPQR","QRSP"],"Only PRQS does not contain ‘QR’ side by side — R comes before Q there.",""],
["J2","The opener is S, and P must come right after Q. Which option survives?",["SQPR","SPQR","QPSR","SRPQ"],"SQPR begins with S and keeps ‘QP’ together. SPQR and SRPQ have P before Q; QPSR does not begin with S.",""],
["J2","You have found the opener and one sure pair. What should you do next?",["Strike out the options that break them, then read the survivor once","Choose the first option that begins with the opener","Rewrite the paragraph in your own words","Leave the question for later"],"Use the opener and the pair to strike out options, then read the last one standing from start to end.",""],
["J2","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Every winter, thousands of birds fly to Chilika lake in Odisha from colder lands.\nQ. For the next four months, the lake is crowded with ducks, geese and waders.\nR. In March, the birds begin their long journey back.\nS. They arrive in November, when their homes in the north grow too cold.",["PSQR","SPQR","PQSR","PRQS"],"Opener: P names the birds and the lake. Pair: ‘They’ in S is the birds. ‘For the next four months’ in Q counts from November; ‘In March’ (R) is the end.",""],
["J2","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Composting is a simple way to turn kitchen waste into rich soil.\nP. Then cover the waste with a layer of soil and keep it slightly moist.\nQ. First, collect peels, leftover food and dry leaves in a bin.\nR. Turn the mixture every week so that air can reach it.\nS. In about two months, it will become dark, crumbly compost.",["QPRS","PQRS","QRPS","QPSR"],"‘First’ (Q) and ‘Then’ (P) fix the start; ‘the mixture’ in R is the waste and soil of P; ‘In about two months’ (S) is the result.",""],
["J2","The first (S1) and the last (S6) sentences are given. Arrange P, Q, R and S in the right order between them.\nS1. Raju sold tea at a small stall outside the railway station.\nP. Soon the stall became too small for all his customers.\nQ. Encouraged, he began selling snacks along with the tea.\nR. So he rented a shop nearby and opened his first cafe.\nS. His tea was so good that travellers often came back for a second cup.\nS6. Today he owns three cafes in the city.",["SQPR","QSPR","SQRP","PSQR"],"‘His tea’ in S follows S1; ‘Encouraged’ in Q needs the praise of S; more customers (P) is the reason for ‘So’ in R, which leads to S6.",""],
["J2","Which of these sentences should come FIRST in a meaningful paragraph?\nP. The Constitution of India came into force on 26 January 1950.\nQ. That is why the day is celebrated every year as Republic Day.\nR. On this day, a grand parade is held on Kartavya Path in New Delhi.\nS. It shows the country’s military strength and cultural variety.",["P","Q","R","S"],"P states the fact the rest depends on. ‘That is why’ (Q), ‘On this day’ (R) and ‘It’ (S) all point back.",""],
["J2","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. By the time he reached the bus stop, he was soaking wet.\nQ. Rohan forgot his umbrella at home one rainy morning.\nR. A kind old woman standing there offered to share her umbrella.\nS. Rohan thanked her and promised himself never to forget his umbrella again.",["QPRS","PQRS","QRPS","QSRP"],"Opener: Q. ‘he’ in P is Rohan; ‘there’ in R is the bus stop of P; ‘thanked her’ in S needs the woman of R.",""],
["J2","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Trees do much more than give us shade.\nP. Third, they offer food and shelter to birds and animals.\nQ. Second, their roots hold the soil together and prevent erosion.\nR. First, they absorb carbon dioxide and release the oxygen we breathe.\nS. Cutting them down, therefore, harms both people and nature.",["RQPS","QRPS","RPQS","SRQP"],"‘First’, ‘Second’ and ‘Third’ fix R, Q and P; ‘therefore’ in S draws the conclusion from all three.",""],
["J2","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nP. was given\nQ. an award by the government.\nR. The scientist\nS. who discovered the new medicine",["RSPQ","RPQS","PRSQ","SRPQ"],"The ‘who’ clause (S) must follow ‘The scientist’ (R); placed at the end it would seem to describe the government.",""],
["J2","Which of these sentences should come LAST in a meaningful paragraph?\nP. In this method, rain falling on roofs is collected and stored in tanks or sent underground.\nQ. Water is becoming scarce in many Indian cities.\nR. Rainwater harvesting is one way to deal with this shortage.\nS. If every building adopted it, cities could save millions of litres each year.",["S","P","Q","R"],"Problem (Q) → solution (R) → how it works (P) → the benefit (S), which rounds the paragraph off.",""],
["J2","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. A spider spins its web with silk made inside its body.\nQ. The silk is liquid at first but hardens as soon as it meets the air.\nR. The sticky threads hold the insects until the spider can reach them.\nS. Once the web is ready, the spider waits for insects to fly into it.",["PQSR","QPSR","PSQR","PQRS"],"Opener: P. ‘The silk’ in Q repeats ‘silk’ from P; ‘Once the web is ready’ (S) comes after it is made; ‘the insects’ in R are those of S.",""],
["J2","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Last week, our class visited a dairy farm.\nP. There, it is turned into butter, cheese and curd.\nQ. The milk is then cooled and sent to a factory in tankers.\nR. We returned home with a new respect for the glass of milk on our table.\nS. The farmer showed us how the cows are milked by machine.",["SQPR","QSPR","SPQR","SQRP"],"‘The farmer’ in S belongs to the farm of S1; ‘then’ in Q follows milking; ‘There’ in P is the factory; R closes the visit.",""],
["J2","The first (S1) and the last (S6) sentences are given. Arrange P, Q, R and S in the right order between them.\nS1. A good night’s sleep is as important as food and exercise.\nP. Over time, poor sleep can even lead to illness.\nQ. While we sleep, the body repairs its muscles and tissues.\nR. People who sleep badly, on the other hand, find it hard to concentrate.\nS. The brain, too, sorts and stores what we learned during the day.\nS6. So, the next time you feel like staying up late, think again.",["QSRP","SQRP","RQSP","QRPS"],"Q gives the body’s gain; ‘too’ in S adds the brain; ‘on the other hand’ in R turns to poor sleep; ‘Over time’ in P takes that further before S6’s advice.",""],
["J2","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Each item is then dropped into the right bin.\nQ. It uses a camera to tell plastic from paper and metal.\nR. A group of students in Pune built a robot that sorts waste.\nS. The students now hope to install their machine in their college canteen.",["R","P","Q","S"],"R introduces ‘a robot’. ‘It’ (Q), ‘then’ (P) and ‘their machine’ and ‘now’ (S) need it first.",""],
["J2","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. The camel survives without water for days because its body loses very little of it.\nQ. In fact, the hump is made mostly of fat.\nR. Many people think that a camel stores water in its hump.\nS. When food is scarce, the camel’s body uses this fat for energy.",["RQSP","QRSP","RSQP","SQRP"],"R gives the common belief; ‘In fact’ in Q corrects it; ‘this fat’ in S needs Q; P gives the real reason for the camel’s endurance.",""],
["J2","Arrange the parts P, Q, R and S in the right order to form a meaningful sentence.\nBegins: If you want to pass the exam,\nP. you must\nQ. and revise\nR. every chapter twice.\nS. study regularly",["PSQR","PQRS","SPQR","QRPS"],"‘you must’ (P) takes the first verb ‘study regularly’ (S); ‘and revise’ (Q) adds a second verb, whose object is ‘every chapter twice’ (R).",""],
["J2","Which of these sentences should come LAST in a meaningful paragraph?\nP. Last year, the people of the town cleaned the lake, and the birds have now returned.\nQ. The fish died, and the birds stopped coming.\nR. Over the years, factories began to dump their waste into it.\nS. Our town once had a lake full of fish and birds.",["P","Q","R","S"],"The story runs from the past (S) through the damage (R, Q) to the recovery ‘now’ (P), which must be last.",""],
["J2","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Learning a new language is easier if you follow a few simple habits.\nP. Next, learn a handful of useful words and use them in sentences.\nQ. First, listen to the language every day, even for a few minutes.\nR. Above all, do not be afraid of making mistakes.\nS. After that, try speaking with someone who knows the language well.",["QPSR","PQSR","QSPR","SQPR"],"‘First’, ‘Next’ and ‘After that’ fix Q, P and S; ‘Above all’ in R gives the final, most important habit.",""],
["J2","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Fish and other creatures can thus survive under the ice.\nQ. In winter, therefore, a layer of ice forms on top of a pond while the water below stays liquid.\nR. Unlike most substances, water expands when it freezes.\nS. This is why ice floats on water instead of sinking.",["RSQP","SRQP","RQSP","RPSQ"],"R states the fact; ‘This is why’ in S draws the first result; ‘therefore’ in Q applies it to a pond; ‘thus’ in P gives the final result.",""],
["J3","Which of these sentences can open a paragraph?",["A young doctor opened a clinic in our village.","She charged only fifty rupees for each visit.","However, the clinic was always crowded.","This made her popular with the poor."],"Only the first introduces its subject with a full noun. ‘She’, ‘However’ and ‘This’ all point back.",""],
["J3","Which of these sentences can NOT open a paragraph?",["Moreover, the scheme helps small farmers.","The government has started a new scheme for farmers.","Farming is the main occupation in many villages.","Every year, millions of farmers take crop loans."],"‘Moreover’ adds to a point already made, so its sentence cannot come first.",""],
["J3","A sentence beginning “For example, …” usually comes:",["Right after the general statement it illustrates","At the very beginning of the paragraph","Only at the very end","Before the topic has been introduced"],"An example needs the idea it illustrates to be stated first.",""],
["J3","Which opening words are safe for the first sentence of a story?",["Once upon a time, …","As a result, …","Such a plan …","After that, …"],"‘Once upon a time’ sets the scene; the other three point back to something earlier.",""],
["J3","Which of these can open a paragraph even though it begins with a joining word?",["Although the road was new, it was already full of potholes.","However, the road was already full of potholes.","Therefore, the road was repaired at once.","Besides, the road was far too narrow."],"‘Although’ joins two halves of the same sentence, so the whole idea is complete. However, Therefore and Besides link to an earlier sentence.",""],
["J3","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Chess is believed to have begun in India as a game called chaturanga.\nQ. Today, it is played by millions of people around the world.\nR. From India, it spread to Persia and then to Europe.\nS. Over the centuries, its rules changed a great deal.",["P","Q","R","S"],"P names the game. R, S and Q all use ‘it’ or ‘its’ for chess.",""],
["J3","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Luckily, the fishermen had brought their boats ashore in time.\nQ. Its strong winds blew the roofs off several huts.\nR. No one was hurt.\nS. A sudden storm hit the fishing village late last night.",["S","P","Q","R"],"S introduces ‘a sudden storm’. ‘Its’ in Q, ‘Luckily’ in P and ‘No one was hurt’ in R need the storm first.",""],
["J3","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Moreover, writing by hand helps students remember what they learn.\nQ. Teachers find neat answers easier to read and mark.\nR. Good handwriting still matters, even in the age of computers.\nS. Spending a few minutes a day on practice is therefore worthwhile.",["R","P","Q","S"],"R states the topic. Q is a reason for it, ‘Moreover’ in P adds another, and ‘therefore’ in S concludes.",""],
["J3","Which of these sentences should come FIRST in a meaningful paragraph?\nP. This display is meant to attract the female.\nQ. During the rainy season, it spreads them out in a fan and dances.\nR. The peacock is the national bird of India.\nS. The male is famous for its long, shining tail feathers.",["R","P","Q","S"],"R introduces the peacock. ‘The male’ in S means the male peacock; ‘it’ and ‘them’ in Q and ‘This display’ in P point back.",""],
["J3","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Similarly, the microwave oven came from a scientist who noticed that a chocolate bar in his pocket had melted.\nQ. Penicillin, for example, was found when mould grew on a forgotten dish.\nR. Such happy accidents remind us to keep our eyes open.\nS. Some of the world’s greatest inventions happened by accident.",["S","P","Q","R"],"S is the general statement. Q has a name but is ‘for example’; ‘Similarly’ in P and ‘Such’ in R also point back.",""],
["J3","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Together, they carry millions of passengers.\nQ. Each zone is further divided into divisions.\nR. Indian Railways runs thousands of trains every day.\nS. To manage such a huge system, the railways are divided into zones.",["R","P","Q","S"],"R names Indian Railways. ‘they’ in P, ‘such a huge system’ in S and ‘Each zone … further’ in Q point back.",""],
["J3","Which of these sentences should come FIRST in a meaningful paragraph?\nP. For the first few days, she sat alone at lunch.\nQ. When Meena moved to a new school, she did not know anyone there.\nR. Then a girl named Pooja asked her to join her group.\nS. The two soon became the best of friends.",["Q","P","R","S"],"Q begins with ‘When’, but the whole idea is inside the sentence and it names Meena. P uses ‘she’, R ‘Then’, S ‘The two’.",""],
["J3","Which of these sentences should come FIRST in a meaningful paragraph?\nP. The simplest is to switch off lights and fans when you leave a room.\nQ. There are several ways to save electricity at home.\nR. Another is to use LED bulbs, which use far less power.\nS. Finally, appliances should be unplugged when they are not in use.",["Q","P","R","S"],"Q announces the topic. ‘The simplest’ (way), ‘Another’ and ‘Finally’ all depend on ‘several ways’ in Q.",""],
["J3","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Have you ever wondered why the sky looks blue?\nQ. As it passes through the air, the blue light is scattered the most.\nR. The answer lies in sunlight, which is made up of many colours.\nS. That is why we see blue all around us.",["P","Q","R","S"],"P asks the question. ‘The answer’ in R needs it; ‘it’ in Q is sunlight; ‘That is why’ in S concludes.",""],
["J3","Which of these sentences should come FIRST in a meaningful paragraph?\nP. It is a symbol of the nation’s pride and unity.\nQ. India’s flag, the tiranga, has three bands of saffron, white and green.\nR. Every country has a national flag.\nS. In the centre of the white band is a navy-blue wheel with 24 spokes.",["R","P","Q","S"],"R makes the general statement. ‘It’ in P is the flag; Q narrows to India’s flag; ‘the white band’ in S needs Q.",""],
["J3","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Delhi’s air becomes very polluted every winter.\nQ. The cold, still air of winter traps these pollutants close to the ground.\nR. Another is the dust and fumes from millions of vehicles.\nS. One reason is the smoke from crop stubble burnt in nearby states.",["P","Q","R","S"],"P states the problem. ‘One reason’, ‘Another’ and ‘these pollutants’ all need it.",""],
["J3","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Greedy for more, he decided to cut the goose open and take all the gold at once.\nQ. But he found nothing inside.\nR. He had lost his goose and his daily egg as well.\nS. A farmer had a goose that laid a golden egg every day.",["S","P","Q","R"],"S introduces ‘a farmer’ and ‘a goose’. ‘he’, ‘the goose’ and ‘But’ in the others point back.",""],
["J3","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Its popularity led the United Nations to declare 21 June the International Day of Yoga.\nQ. It includes postures, breathing exercises and meditation.\nR. Today, millions of people practise it to stay fit and calm.\nS. Yoga began in ancient India as a way to unite body and mind.",["S","P","Q","R"],"S names yoga. ‘It’ in Q, ‘it’ in R and ‘Its’ in P need the noun first.",""],
["J3","Which of these sentences should come FIRST in a meaningful paragraph?\nP. China and India together produce a large share of it.\nQ. Rice is the main food of more than half the world’s people.\nR. It grows best in warm places with plenty of water.\nS. That is why most of it is grown in Asia.",["Q","P","R","S"],"Q names rice. ‘It’ in R, ‘That is why’ in S and ‘of it’ in P point back.",""],
["J3","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Every evening, they gather in the park with their sticks.\nQ. Our neighbour Mr Sharma retired from the army last year.\nR. He says the game keeps him young.\nS. Since then, he has been teaching the children of our lane to play hockey.",["Q","P","R","S"],"Q names Mr Sharma. ‘Since then … he’ in S, ‘they’ in P and ‘He’ in R all point back.",""],
["J3","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. It lies on the delta of the Ganga, the Brahmaputra and the Meghna.\nQ. Its swamps are home to the Royal Bengal tiger.\nR. The Sundarbans is the largest mangrove forest in the world.\nS. These tigers are good swimmers and often cross the channels in search of prey.",["RPQS","PRQS","RQPS","RPSQ"],"R is the opener (a superlative ‘the’). ‘It’ in P and ‘Its’ in Q are the Sundarbans; ‘These tigers’ in S needs the tiger of Q.",""],
["J3","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Sports teach lessons that no classroom can.\nP. Every school, therefore, should give sports the time they deserve.\nQ. They also teach us to accept defeat with grace.\nR. Most of all, they build the habit of discipline.\nS. They show us how to work as part of a team.",["SQRP","RSQP","SRPQ","PSQR"],"S gives the first lesson; ‘also’ in Q adds one; ‘Most of all’ in R gives the greatest; ‘therefore’ in P concludes.",""],
["J4","“Kalpana Chawla flew on the space shuttle. She was the first woman of Indian origin to go into space.” Which word links the second sentence to the first?",["She","the","first","space"],"‘She’ refers back to Kalpana Chawla, so the sentence with the name must come first.",""],
["J4","The pronoun ‘they’ can point back to:",["A plural noun, such as ‘the students’","A singular noun, such as ‘the student’","Only the name of one person","The word ‘it’ in the sentence before"],"‘They’ needs a plural noun or two or more people.",""],
["J4","‘The former’ and ‘the latter’ need a sentence before them that:",["Names two people or things","Names only one person","Gives a time and a place","Asks a question"],"‘The former’ is the first of two things just named and ‘the latter’ the second.",""],
["J4","Which pair of sentences is in the right order?",["A man named Gopal ran a sweet shop. He was known for his laddoos.","He was known for his laddoos. A man named Gopal ran a sweet shop.","His laddoos were famous. A man named Gopal ran a sweet shop.","He ran a sweet shop. A man named Gopal was known for laddoos."],"The name comes first; ‘He’ and ‘his’ follow it.",""],
["J4","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Dr Rao opened a free eye clinic in our town last year.\nQ. Many of them are elderly farmers who cannot afford private treatment.\nR. She examines more than fifty patients every day.\nS. For them, her clinic is a blessing.",["PRQS","RPQS","PQRS","PSRQ"],"‘She’ in R is Dr Rao of P; ‘them’ in Q is the patients of R; ‘For them’ in S points to the farmers of Q.",""],
["J4","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. Two friends, Amit and Sunil, started a business together.\nP. Amit was good with numbers, while Sunil was good at talking to people.\nQ. Because each did what he did best, the business grew quickly.\nR. The former kept the accounts, and the latter met the customers.\nS. Within five years, they had opened shops in three cities.",["PRQS","RPQS","QPRS","PQSR"],"P names the two skills; ‘The former … the latter’ in R needs that pair just before; Q gives the result; S shows how far it went.",""],
["J4","Which of these sentences should come FIRST in a meaningful paragraph?\nP. Today it is one of the most visited monuments in the world.\nQ. It took about twenty years and thousands of workers to finish.\nR. The Taj Mahal was built by the Mughal emperor Shah Jahan.\nS. He had it made in memory of his wife, Mumtaz Mahal.",["R","P","Q","S"],"R names the Taj Mahal and Shah Jahan. ‘He … it’ in S and ‘It’ in Q and P point back.",""],
["J4","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. They take turns to water them every morning.\nQ. The students of Class 8 planted fifty saplings around the school.\nR. The children hope that the trees will one day shade the whole playground.\nS. Most of the young plants are now growing well.",["QPSR","PQSR","QSPR","SQPR"],"‘They … them’ in P are the students and saplings of Q; ‘the young plants’ in S are the saplings; R looks ahead.",""],
["J4","The first (S1) and the last (S6) sentences are given. Arrange P, Q, R and S in the right order between them.\nS1. Lata, a young girl from a small village, dreamed of becoming a pilot.\nP. Her parents, who were farmers, could not pay for flying lessons.\nQ. It paid for her training at a flying school in the city.\nR. So she worked hard at school and won a scholarship.\nS. There, she was the only woman in her batch.\nS6. Last month, she flew her first passenger flight.",["PRQS","RPQS","PQSR","PRSQ"],"P gives the problem; ‘So’ in R is her answer to it; ‘It’ in Q is the scholarship; ‘There’ in S is the flying school.",""],
["J4","Which of these sentences should come FIRST in a meaningful paragraph?\nP. After a chase, it must rest before it can eat its catch.\nQ. However, it can keep up this speed for only a short distance.\nR. It can reach a speed of over 100 kilometres an hour.\nS. The cheetah is the fastest land animal.",["S","P","Q","R"],"S names the cheetah. The other three begin with or depend on ‘it’.",""],
["J4","Arrange the sentences P, Q, R and S in the right order to form a meaningful paragraph.\nP. Even today, spices earn the country a good deal of money from exports.\nQ. These spices have been traded with other countries for thousands of years.\nR. India grows many kinds of spices, such as pepper, cardamom and turmeric.\nS. In fact, this trade is what first brought European sailors to India.",["RQSP","QRSP","RSQP","SRQP"],"‘These spices’ in Q needs the list in R; ‘this trade’ in S needs the trade of Q; ‘Even today’ in P brings it to the present.",""],
["J4","The first sentence (S1) is given. Arrange P, Q, R and S in the right order to complete the paragraph.\nS1. The school library has started a new reading challenge.\nP. At the end of the month, he or she writes a short review of it.\nQ. The best reviews are put up on the notice board.\nR. Under it, every student must read one book a month.\nS. This has made many students read more than ever before.",["RPQS","QRPS","PRQS","RQSP"],"‘it’ in R is the reading challenge of S1; ‘he or she’ in P is the student; ‘The best reviews’ in Q needs reviews to be written first; ‘This’ in S sums up.",""],

<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">

<style>
/* Layout: Folk Dances of India — follows the शब्दRegister Paper / Indigo look; one column + bottom tabs on phones, sidebar on PC. */
:root{
  --paper:#f6f3ea; --sheet:#fffdf7; --sunk:#ebe6d8;
  --ink:#1d2a22; --ink2:#56625a; --rule:#dcd5c3;
  --blue:#1f5c3d; --on-blue:#ffffff; --blue-bg:#dcebdf;
  --accent:#b4530f; --accent-bg:#fbe7d3;
  --good:#1b7547; --good-bg:#dff1e6; --bad:#b0271f; --bad-bg:#f8e1de;
  --warn-bg:#fff2d2;
  --f-display:"Fraunces", "Tiro Devanagari Hindi", Georgia, serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap{border-radius:var(--r);padding:12px 14px 12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.trick .lab,.trap .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.pyr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pyr div{text-align:center;font-size:13px}
.pyr b{display:block;font-size:14px}
.pm{fill:var(--blue)} .pf{fill:var(--accent)}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.pal button.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.pal button.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.rk{display:grid;gap:0}
.rk div{display:grid;grid-template-columns:minmax(0,48%) 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:15px}
.rk div:first-child{border-top:0}
.rk dt{font-size:13px;color:var(--ink2);margin:0}
.rk dt.up{color:var(--good)} .rk dt.dn{color:var(--bad)}
.rk dd{margin:0;font-weight:600;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:24px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.gbar{display:grid;grid-template-columns:78px 1fr 52px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.gbar .tr{height:12px;background:var(--sunk);border-radius:3px;position:relative;overflow:hidden}
.gbar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:3px}
.gbar .tr i.neg{background:var(--bad)}
.gbar .v{font-family:var(--f-num);text-align:right}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
@media (prefers-reduced-motion: no-preference){ .opt,.chip,.btn{transition:background-color .15s, border-color .15s} }
.link{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px}
.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.icheck{background:var(--sheet);border:1.5px dashed var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.icheck .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.cat{font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;white-space:nowrap}
.cat.CS{background:var(--blue-bg);color:var(--blue)} .cat.CSS{background:var(--accent-bg);color:var(--accent)} .cat.ST{background:var(--sunk);color:var(--ink)} .cat.OT{background:var(--sunk);color:var(--ink2)}

/* ---- Folk dance additions ---- */
table.cover td:nth-child(4){min-width:180px}
.plist .dl{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.plist .dl em{font-style:normal;font-weight:700;color:var(--blue);text-align:right}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--rule)}
.ladder li{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--rule)}
.ladder .rk-n{font-size:22px;font-weight:600;color:var(--blue);text-align:right}
.ladder .rk-t{min-width:0}
.ladder .rk-t b{display:block;line-height:1.3}
.ladder .rk-t span{font-size:13px;color:var(--ink2)}
.ladder .rk-d{font-weight:700;font-size:14px;white-space:nowrap}
.ladder li.up .rk-d{color:var(--good)} .ladder li.dn .rk-d{color:var(--bad)}
.ladder small{font-weight:600;color:var(--ink2)}
table.cover td{min-width:90px}
.peek{border:1.5px dashed var(--blue);background:var(--blue-bg);color:var(--blue);border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer;min-height:36px;width:100%}
.pubs{display:grid;gap:12px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.plist li{padding:7px 0;border-top:1px dashed var(--rule);display:grid;gap:1px}
.plist li:first-child{border-top:0}
.plist li span{font-size:13px;color:var(--ink2)}
.seg{scroll-snap-type:x proximity}
@media (max-width: 700px){
  table.cover thead{display:none}
  table.cover tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--rule)}
  table.cover td{border:0;padding:0;min-width:0;font-size:14px}
  table.cover td:first-child{grid-column:1/-1;font-size:15px}
  table.cover td:nth-child(4){grid-column:1/-1;min-width:0}
  table.cover td[data-l]::before{content:attr(data-l);display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
}
</style>

<script>
"use strict";
const LESSONS = [
{ id:"L1", title:"How dance questions are asked", hi:"लोक नृत्य के प्रश्न कैसे आते हैं", blocks:[
 {k:"p", h:"India has roughly 250 folk dances worth knowing, about eight per state. SSC asks them in four shapes: <b>(1) which state</b> (by far the most common), <b>(2) which community or tribe</b> performs it, <b>(3) what it depicts or when it is danced</b> (war, harvest, wedding, a deity), and <b>(4) statement questions</b> (CGL 2024–25 asked these on Jhora, Dangi, Kalbelia, Ghoomar, Tamasha, Jhumair and Dumhal). The lecture's rule: <b>learn the state first; details come second.</b>"},
 {k:"trick", h:"<b>The name often gives the state away.</b> <b>Kunitha</b> → Karnataka (Dollu, Suggi Kunitha). <b>Cholom</b> → Manipur (Pung, Dhol Cholom). <b>Lam</b> → Mizoram (Khuallam, Chheih Lam, Tlanglam, Sarlamkai; lam = dance in Mizo). <b>Chham</b> → the Tibetan-Buddhist belt (Ladakh, HP, Sikkim, Arunachal). <b>-attam / -kali / -koothu</b> → Kerala or Tamil Nadu (a double 't' is the clue). <b>Nacha / Nach</b> → Odisha, Chhattisgarh, Bihar (Danda Nacha, Raut Nacha, Launda Nach). <b>Nati / Natti</b> → Himachal (Barada Nati is the Uttarakhand exception)."},
 {k:"table", title:"The eight classical dances (Sangeet Natak Akademi)", head:["Classical dance","State","Hook"], rows:[["Bharatanatyam","Tamil Nadu","Oldest; temple dance of Thanjavur"],["Kathak","Uttar Pradesh","Katha = story; Lucknow, Jaipur, Banaras gharanas"],["Kathakali","Kerala","Green faces, huge headgear"],["Mohiniattam","Kerala","Mohini = enchantress; lasya"],["Kuchipudi","Andhra Pradesh","Village Kuchipudi; Bhamakalapam"],["Odissi","Odisha","Tribhanga; Gotipua and Mahari are its roots"],["Manipuri","Manipur","Ras Leela; Jagoi"],["Sattriya","Assam","Sankardeva's sattras"]]},
 {k:"trap", h:"<b>Classical vs folk.</b> If a question asks for a <i>folk</i> dance of Punjab and the options are Kuchipudi, Yakshagana, Mohiniattam and Bhangra, eliminate the three classical/theatre forms of the south. The Ministry of Culture also counts <b>Chhau</b> as classical (nine in all), but SSC keys follow the Akademi's eight."},
 {k:"q", q:"A dance named '___ Kunitha' most likely belongs to which state?", o:["Karnataka","Kerala","Tamil Nadu","Andhra Pradesh"], e:"Kunitha is Kannada for dance — Dollu Kunitha, Suggi Kunitha, Pooja Kunitha."},
 {k:"table", title:"Indian dance forms on UNESCO's Intangible Heritage list", head:["Element","State","Year"], rows:[["Koodiyattam","Kerala","Proclaimed 2001 (inscribed 2008)"],["Ramlila","Uttar Pradesh","Proclaimed 2005 (inscribed 2008)"],["Baul songs","West Bengal","Proclaimed 2005 (inscribed 2008)"],["Ramman","Uttarakhand (Chamoli)","2009"],["<b>Chhau</b>","Odisha, Jharkhand, West Bengal","2010"],["<b>Kalbelia</b>","Rajasthan","2010"],["Mudiyettu","Kerala","2010"],["Sankirtana","Manipur","2013"],["<b>Garba</b>","Gujarat","2023"]]},
 {k:"trap", h:"<b>Ghoomar is NOT on the UNESCO list.</b> A CGL statement said 'Ghoomar and Kalbelia are both UNESCO-listed' — only Kalbelia (2010) is. From Rajasthan, only Kalbelia; from Gujarat, only Garba (2023)."},
 {k:"trick", h:"<b>Sort by theme when the name rings no bell.</b> Dances fall into a few families: war/martial, harvest/sowing, weddings, unmarried girls, festivals, a deity, and animal mimicry. Revise → Themes groups them this way. If a question says 'depicts victory in war', you only have to scan the martial list."},
 {k:"q", q:"Which of these is on UNESCO's Intangible Cultural Heritage list?", o:["Kalbelia","Ghoomar","Bhangra","Lavani"], e:"Kalbelia (Rajasthan) was inscribed in 2010 with Chhau and Mudiyettu. Ghoomar is not listed."},
 {k:"link", h:"<b>Dance ↔ festival.</b> Many dances are asked through the festival they belong to: Ponung at Solung, Popir at Mopin, Bagurumba at Bwisagu, Chu Faat at Pang Lhabsol, Wangala and Nongkrem are both festival and dance, Karma at Karma Puja, Garba at Navratri. If you finished the Festivals workbook, half of this is already known."},
 {k:"trick", h:"<b>Statement questions.</b> Extreme words — <i>only, exclusively, solo, women alone</i> — are usually false. That is how two 2024 CGL statements were built: 'Dangi is a <b>solo</b> narrative dance' (false: it is a group dance) and 'women <b>alone</b> perform the Mardani variant of Jhumair' (false)."}
], sum:["Learn the state first.","Kunitha → Karnataka; Cholom → Manipur; Lam → Mizoram; Chham → Buddhist Himalaya; -attam/-kali → Kerala/TN.","8 classical: Bharatanatyam, Kathak, Kathakali, Mohiniattam, Kuchipudi, Odissi, Manipuri, Sattriya.","UNESCO: Chhau & Kalbelia & Mudiyettu 2010, Garba 2023; Ghoomar is not listed."]},

{ id:"L2", title:"Andhra Pradesh & Telangana", hi:"आंध्र प्रदेश और तेलंगाना", blocks:[
 {k:"trick", h:"<b>Andhra:</b> “<b>वीर</b> (Veeranatyam) <b>लोगों</b> (Lambadi) के लिए <b>धीमे</b> (Dhimsa) से <b>कोयले</b> (Kolattam) की <b>भाप</b> (Bhamakalapam) से <b>बुर्रा</b> (Burrakatha) <b>बना</b> (Butta Bommalu) लो।” Add <b>Dappu</b> (drum) and <b>Vilasini Natyam</b>."},
 {k:"table", title:"Andhra Pradesh", head:["Dance","Who / what","Remember"], rows:[["<b>Veeranatyam</b>","Veeramusti community","'Dance of warriors'; for Veerabhadra (Shiva); Draksharamam"],["<b>Lambadi</b>","Banjara (Lambada) tribe","Mirror-work skirts; also Telangana"],["<b>Dhimsa</b>","Porja and other tribes","Araku valley; circle dance; also Odisha"],["<b>Kolattam / Kolannalu</b>","—","Stick dance (kol = stick); also TN & Karnataka"],["<b>Bhamakalapam</b>","—","Dance-drama by <b>Siddhendra Yogi</b>; Satyabhama; 'crown jewel of Kuchipudi'"],["<b>Burrakatha</b>","—","Story-song; the lead strums a burra (tambura)"],["<b>Butta Bommalu</b>","—","'Basket toys' — big masks; West Godavari"],["<b>Dappu</b>","Mala & Madiga","Dappu = frame drum; AP & Telangana"],["<b>Vilasini Natyam</b>","Devadasis (kalavantulu)","Temple & court dance; revived by <b>Swapnasundari</b>"]]},
 {k:"trap", h:"<b>The lecture said Kolattam is danced 'during Pongal, which is Telangana's'.</b> Pongal is Tamil Nadu's harvest festival; Telangana's floral festival is Bathukamma. Kolattam is danced across AP, TN and Karnataka."},
 {k:"q", q:"Bhamakalapam, often called the crown jewel of Kuchipudi, was composed by…", o:["Siddhendra Yogi","Sankardeva","Kunchan Nambiar","Bhikhari Thakur"], e:"Siddhendra Yogi wrote Bhamakalapam, the story of Satyabhama, Krishna's wife."},
 {k:"trick", h:"<b>Telangana:</b> “<b>धीमे</b> (Dhimsa) से <b>गाड़ी</b> (Lambadi) <b>घुसा</b> (Gussadi) लूं, <b>माधुरी</b> (Mathuri)?” Then add <b>Bonalu</b> and <b>Perini</b>."},
 {k:"table", title:"Telangana", head:["Dance","Who / what","Remember"], rows:[["<b>Gussadi</b>","<b>Raj Gond</b>, Adilabad","Men only; Diwali; part of the Dandari festival; peacock-feather headgear"],["<b>Mathuri</b>","Mathura community, Adilabad","Krishna songs in Shravan"],["<b>Perini Shivatandavam</b>","Kakatiya-era warriors","'Dance of warriors' before battle, to Shiva; revived by <b>Dr Nataraja Ramakrishna</b>"],["<b>Bonalu</b>","Women carry bonam pots","Mahakali; Ashadha; began after the 1813 plague"],["Lambadi, Dhimsa, Dappu","—","Shared with Andhra"]]},
 {k:"trap", h:"<b>Bonalu's temple is the Ujjaini Mahakali temple in Secunderabad</b>, not Ujjain in MP as the lecture put it."},
 {k:"q", q:"Gussadi, danced only by men during Diwali, belongs to which community?", o:["Raj Gond","Lambada","Koya","Chenchu"], e:"Gussadi is the Raj Gond dance of Adilabad, part of the Dandari festival."},
 {k:"link", h:"<b>Two warrior dances, two states.</b> Veeranatyam (Andhra) and Perini Shivatandavam (Telangana) are both warrior dances offered to Shiva. Veera = brave, Andhra; Perini = Kakatiya kings of Warangal, Telangana."}
], sum:["AP: Veeranatyam (Veeramusti), Lambadi, Dhimsa (Araku), Kolattam, Bhamakalapam (Siddhendra Yogi), Burrakatha, Butta Bommalu, Dappu, Vilasini Natyam.","Telangana: Gussadi (Raj Gond, Adilabad), Mathuri, Perini (Kakatiya), Bonalu (Mahakali).","Pongal is TN, not Telangana."]},

{ id:"L3", title:"Arunachal Pradesh", hi:"अरुणाचल प्रदेश", blocks:[
 {k:"trick", h:"“<b>रेखा</b> (Rikham Pada) अरुण से बोली: <b>अजी</b> (Aji Lamu), <b>वांचो</b> (Wancho) <b>बुआ</b> (Buiya) के <b>पास</b> (Pasi Kongki) <b>चलो</b> (Chalo Loku) <b>शाम</b> को (Bardo Chham) <b>मास्क</b> लगाके <b>लायन-पीकॉक</b> (Lion & Peacock) डांस देखने।”"},
 {k:"table", title:"Dance → tribe", head:["Dance","Tribe","Remember"], rows:[["<b>Rikham Pada</b>","Nyishi","Danced at Nyokum"],["<b>Aji Lamu</b>","Monpa","Masked dance-drama"],["<b>Lion & Peacock</b>","Monpa","Buddhist; Tawang"],["<b>Yak dance</b>","Monpa","Also Sikkim"],["<b>Wancho dance</b>","Wancho","War dance; Oriah festival (spring)"],["<b>Buiya</b>","Digaru Mishmi","Prosperity"],["<b>Pasi Kongki</b>","Adi","Dance-drama with Abang songs"],["<b>Ponung</b>","Adi (women)","Before harvest, at Solung; a man called 'Miri' leads the singing"],["<b>Tapu</b>","Adi","War dance"],["<b>Popir</b>","Galo","Mopin festival — Mopin Ane, goddess of prosperity"],["<b>Chalo Loku</b>","Nocte","Loku harvest festival, Oct–Nov"],["<b>Bardo Chham</b>","Sherdukpen","Masks of the 12 zodiac animals; drives out evil"]]},
 {k:"trick", h:"<b>Four more hooks from the second lecture.</b> <b>Bardo</b> → border → masks to keep evil out. <b>Wancho</b> → 'want Oreo' → Oriah festival. <b>Popir</b> → 'पापी' (evil spirits chased) + 'गला' → <b>Galo</b>. <b>Ponung</b> → 'फ़ोन पे अच्छी फ़सल' → harvest, Adi."},
 {k:"q", q:"Ponung, danced by women before the harvest at Solung, belongs to which tribe?", o:["Adi","Galo","Nyishi","Monpa"], e:"Ponung is the Adi women's dance; Solung is the Adi agricultural festival."},
 {k:"trap", h:"<b>Popir vs Ponung.</b> Both were asked as 'which state' (answer Arunachal), but the tribes differ: <b>Popir = Galo</b> (Mopin), <b>Ponung = Adi</b> (Solung). Lecture 1 mixed Ozele into the Galo list; leave it out."},
 {k:"q", q:"Bardo Chham, with masks of the twelve zodiac animals, is performed by the…", o:["Sherdukpen","Apatani","Nocte","Tangsa"], e:"Sherdukpen of West Kameng; chham is the Buddhist word for dance."},
 {k:"link", h:"<b>Monpa owns three:</b> Aji Lamu, Lion & Peacock, and the Yak dance — all Buddhist, all around Tawang. Masks + Buddhism in Arunachal → Monpa or Sherdukpen."}
], sum:["Rikham Pada Nyishi; Aji Lamu, Lion & Peacock, Yak Monpa; Wancho (Oriah); Buiya Digaru Mishmi.","Adi: Ponung (women, Solung), Pasi Kongki, Tapu. Galo: Popir (Mopin).","Chalo Loku Nocte; Bardo Chham Sherdukpen (12 zodiac masks)."]},

{ id:"L4", title:"Assam", hi:"असम", blocks:[
 {k:"trick", h:"“<b>अली</b> (Ali-Ai-Ligang) <b>भोर</b> (Bhortal) में <b>देव</b> (Deodhani) के पास गया — मैथ्स में <b>अंक</b> (Ankiya Naat) दिला देना, इस <b>पाली</b> (Ojapali) में <b>झूम</b> (Jhumur) के नाचूंगा।” The second lecture adds: “<b>बगल</b> (Bagurumba) की <b>बहू</b> (Bihu) <b>भोर</b> (Bhortal) में उठती है” — and <b>BB</b>: Bagurumba = Bodo."},
 {k:"table", title:"Assam", head:["Dance","Who / what","Remember"], rows:[["<b>Bihu</b>","Assamese","Bohag Bihu (April); women in <b>mekhela chador</b>; dhol & pepa"],["<b>Bagurumba</b>","<b>Bodo</b> women","'Butterfly dance'; Bwisagu; dress <b>dokhona</b> & <b>aronai</b>"],["<b>Sattriya</b>","—","Classical; <b>Srimanta Sankardeva</b>"],["<b>Ankiya Naat</b>","—","One-act Vaishnavite play by Sankardeva"],["<b>Bhortal</b>","Satriya community, Barpeta","Cymbal (bhortal) dance by <b>Narahari Burha Bhakat</b>"],["<b>Ojapali</b>","—","Semi-dramatic narrative chorus; the Oja leads, the Palis follow"],["<b>Deodhani</b>","—","Trance dance to snake goddess <b>Manasa</b>"],["<b>Ali-Ai-Ligang</b>","<b>Mising</b>","Sowing festival in Falgun; Gumrag dance"],["<b>Jhumur</b>","Tea tribes","Tea-garden workers; also West Bengal"]]},
 {k:"p", h:"<b>Current affairs:</b> on <b>17 January 2026</b>, more than <b>10,000 Bodo artists</b> danced Bagurumba together at the Sarusajai stadium in Guwahati (<b>Bagurumba Dwhou</b>), with Prime Minister Modi present — billed as a record-setting performance."},
 {k:"q", q:"Bagurumba, the 'butterfly dance', is performed by which community?", o:["Bodo","Mising","Karbi","Rabha"], e:"Bagurumba is the Bodo women's dance, performed at Bwisagu."},
 {k:"trap", h:"<b>Sattriya (dance) vs Satriya (community).</b> Sattriya is the classical dance founded by Sankardeva. Bhortal is danced by the <b>Satriya community of Barpeta</b> and was developed by Narahari Burha Bhakat — not by Sankardeva."},
 {k:"q", q:"Bhortal, a cymbal dance of Assam, was developed by…", o:["Narahari Burha Bhakat","Srimanta Sankardeva","Bhupen Hazarika","Madhavdev"], e:"Narahari Burha Bhakat developed Bhortal; the Satriya community of Barpeta performs it."},
 {k:"link", h:"<b>Sankardeva built three things:</b> the sattras (monasteries), <b>Ankiya Naat</b> (the plays) and <b>Sattriya</b> (the dance). Any option with Sankardeva points to Assam."}
], sum:["Bihu (mekhela chador); Bagurumba = Bodo butterfly dance, Bwisagu; 10,000+ dancers in Jan 2026.","Sattriya & Ankiya Naat = Sankardeva; Bhortal = Narahari Burha Bhakat (Barpeta).","Deodhani = Manasa; Ojapali = narrative chorus; Ali-Ai-Ligang = Mising; Jhumur = tea tribes."]},

{ id:"L5", title:"Meghalaya, Mizoram & Tripura", hi:"मेघालय, मिज़ोरम और त्रिपुरा", blocks:[
 {k:"trick", h:"<b>Meghalaya by tribe.</b> <b>मेघ गरजे</b> = 100 drums → <b>Wangala</b>; 'गला' → <b>Garo</b>. <b>No-cream</b>, no ice-cream → cough → <b>खांसी</b> → <b>Khasi</b> (Nongkrem). <b>सुख</b> → Shad Suk Mynsiem, 'dance of joyful hearts' (Khasi). '<b>लाओ</b>-लाओ बारिश' → Laho → <b>जनता</b> → Jaintia."},
 {k:"table", title:"Meghalaya", head:["Dance","Tribe","Remember"], rows:[["<b>Wangala</b>","Garo","Hundred drums; sun god <b>Misi Saljong</b>; Oct–Nov, after harvest"],["<b>Nongkrem</b>","Khasi","Thanksgiving to goddess Ka Blei Synshar; Smit, near Shillong"],["<b>Shad Suk Mynsiem</b>","Khasi","'Dance of joyful hearts'; April"],["<b>Behdienkhlam</b>","Jaintia (Pnar)","Chasing away the demon of plague/cholera; Jowai, July"],["<b>Laho</b>","Jaintia (Pnar)","Men and women dance together"]]},
 {k:"q", q:"The Nongkrem dance is associated with which tribe?", o:["Khasi","Garo","Jaintia","Hajong"], e:"Nongkrem is the Khasi thanksgiving; a PYQ asked exactly this."},
 {k:"trick", h:"<b>Mizoram:</b> “मिज़ोरम के मंच पे <b>खुल्लम</b> (Khuallam) <b>चिल्लम</b> (Chheih Lam) <b>जंग</b> (Chawnglaizawn) <b>चल</b> (Cheraw) रही है।” Second lecture: <b>Cheraw</b> → चीरना (split bamboo) + जोर → Mizoram; <b>Khuallam</b> → ख्याल रखना → guests; <b>Sarlamkai</b> → सर → warrior."},
 {k:"table", title:"Mizoram", head:["Dance","Who / what","Remember"], rows:[["<b>Cheraw</b>","Mizo","Bamboo dance: men clap bamboo poles, women step between them"],["<b>Khuallam</b>","Mizo","'Dance of guests'; puan cloth"],["<b>Chheih Lam</b>","Mizo","Joyful dance at Chapchar Kut; circle"],["<b>Chawnglaizawn</b>","Pawi (Lai)","Pawi dance"],["<b>Sarlamkai</b>","Pawi & Mara","Warrior dance"],["<b>Solakia</b>","Mara & Pawi","Celebrates <b>victory in war</b>"],["<b>Tlanglam</b>","Mizo","Group dance at Chapchar Kut"]]},
 {k:"trick", h:"<b>Tripura:</b> “<b>बीजू</b> (Bizu), <b>दादागिरी</b> (Hojagiri) नहीं, <b>माता</b> (Mamita) पे मेरा भी <b>हक</b> (Hai-Hak) है; <b>घर</b> (Garia) <b>ले</b> (Lebang) जाऊँगा।”"},
 {k:"table", title:"Tripura", head:["Dance","Community","Remember"], rows:[["<b>Hojagiri</b>","Reang (Bru)","Women balance a pitcher, bottle and lamp; goddess Mailuma (Lakshmi)"],["<b>Garia</b>","Tripuri","Baba Garia; sowing, April"],["<b>Bizu</b>","Chakma","End of Chaitra"],["<b>Mamita</b>","Tripuri","Harvest thanksgiving"],["<b>Hai-Hak</b>","Halam","Lakshmi after harvest"],["<b>Lebang Boomani</b>","Tripuri","Bamboo clappers to catch 'lebang' insects"],["<b>Sangrai</b>","Mog","Sangrai festival, Chaitra"]]},
 {k:"trap", h:"<b>Behdienkhlam's demon:</b> Lecture 1 said cholera, the festival lecture said plague. Sources use both, so treat 'plague/cholera' as the same answer and hold on to what matters: <b>Jaintia, Jowai, driving away disease</b>."},
 {k:"q", q:"Hojagiri, in which women balance lamps and bottles, is a dance of…", o:["Tripura","Mizoram","Manipur","Meghalaya"], e:"Hojagiri is the Reang (Bru) dance of Tripura, honouring Mailuma (Lakshmi)."},
 {k:"link", h:"<b>Two bamboo dances.</b> Cheraw (Mizoram) is the famous one; the Kuki bamboo dance of Nagaland is the other. In Tripura, bamboo becomes clappers (Lebang Boomani)."}
], sum:["Meghalaya: Wangala Garo (100 drums), Nongkrem & Shad Suk Mynsiem Khasi, Behdienkhlam & Laho Jaintia.","Mizoram: Cheraw bamboo, Khuallam guests, Chheih Lam, Chawnglaizawn Pawi, Solakia victory, Tlanglam.","Tripura: Hojagiri Reang, Garia, Bizu Chakma, Mamita, Hai-Hak Halam, Lebang Boomani, Sangrai Mog."]},

{ id:"L6", title:"Manipur, Nagaland & Sikkim", hi:"मणिपुर, नागालैंड और सिक्किम", blocks:[
 {k:"trick", h:"<b>Manipur:</b> “<b>मनी आई</b> → <b>लाई</b> (Lai Haraoba), <b>ढोल</b> (Dhol Cholom), <b>खंबा</b> (Khamba Thoibi); रात भर <b>जागे</b> (Jagoi), <b>आदमी</b> (Nupa Pala), <b>पुंग</b> (Pung Cholom).” And <b>Thang-Ta</b>: टाँग टूटे → martial art."},
 {k:"table", title:"Manipur", head:["Dance","What","Remember"], rows:[["<b>Thang-Ta</b>","Meitei martial art","Thang = sword, ta = spear"],["<b>Lai Haraoba</b>","'Merrymaking of the gods'","Led by Maibas & Maibis (priests); honours Umang Lai; re-enacts creation"],["<b>Pung Cholom</b>","Drummers dance","Pung = barrel drum; part of Sankirtana (UNESCO 2013)"],["<b>Dhol Cholom</b>","Men with dhol","Yaoshang (Holi)"],["<b>Khamba Thoibi</b>","Duet","Love legend of Khamba and Thoibi"],["<b>Nupa Pala</b>","Men only","White dhoti & turban; kartal and pung"],["<b>Manipuri (Jagoi, Ras Leela)</b>","Classical","Krishna's Ras"]]},
 {k:"q", q:"Thang-Ta, a martial dance with sword and spear, belongs to which state?", o:["Manipur","Mizoram","Kerala","Punjab"], e:"Thang-Ta is the Meitei martial art of Manipur — a direct PYQ."},

{ id:"L7", title:"Bihar, Jharkhand & West Bengal", hi:"बिहार, झारखंड और पश्चिम बंगाल", blocks:[
 {k:"trick", h:"<b>Bihar:</b> “<b>दो</b> (Domkach) <b>नटवे</b> (Natua) <b>जाट-जटिन</b> (Jat-Jatin) अपना <b>शौहर</b> (Sohar-Khilona) खिला रहे हैं <b>झूम</b> (Jhumari) के।” Then the '-iya' words: Bid<b>esia</b>, Jhij<b>hiya</b>, Dhob<b>iya</b>. Third lecture: Jat-Jatin → <b>जात-पात</b> (Bihar); Jhijhiya → <b>झमाझम</b> rain."},
 {k:"table", title:"Bihar", head:["Dance","What","Remember"], rows:[["<b>Jat-Jatin</b>","Mithila couple dance","Love of Jat & Jatin; moonlit monsoon nights"],["<b>Jhijhiya</b>","Mithila women","Earthen pots with lamps on the head; Durga at Navratri; also a prayer to Indra for rain"],["<b>Bidesia</b>","Folk theatre","<b>Bhikhari Thakur</b> ('Shakespeare of Bhojpuri'); wives left behind by migrant husbands"],["<b>Launda Nach</b>","Men dressed as women","Also linked to Bhikhari Thakur"],["<b>Domkach</b>","Women of the groom's house","At night while the men are away with the baraat; also Jharkhand"],["<b>Sohar-Khilona</b>","Childbirth","Songs and dance at a birth"],["<b>Jhumari</b>","Mithila","Kartik, after the monsoon"],["<b>Jharni</b>","Muslims","Muharram"],["<b>Pari Khanda</b>","Martial","Pari = shield, khanda = sword"]]},
 {k:"q", q:"Bidesia, a folk theatre of Bihar, was popularised by…", o:["Bhikhari Thakur","Karpoori Thakur","Vidyapati","Sharda Sinha"], e:"Bhikhari Thakur, the 'Shakespeare of Bhojpuri', built Bidesia around migrants' families."},
 {k:"trick", h:"<b>Jharkhand:</b> <b>Paika</b> → six-<b>pack</b> soldiers hiding in the <b>झाड़ी</b> → Jharkhand. <b>Sarhul</b> → sal leaves fall all year → झड़ते → Jharkhand. <b>Domkach</b> → Jharkhand people have <b>दम</b> (don't mix it with Dumhal of J&K). <b>Karma</b> → Karma Puja."},
 {k:"table", title:"Jharkhand", head:["Dance","Who / what","Remember"], rows:[["<b>Karma</b>","Oraon & others","Branch of the <b>Karam</b> tree; Bhado Ekadashi; madal drum; also CG, Odisha, Bihar"],["<b>Jhumair</b>","Sadan communities","Harvest; dancers in linked rows; mandar & nagara drums"],["<b>Paika</b>","Munda (Jharkhand)","Martial, sword & shield; also Odisha"],["<b>Seraikela Chhau</b>","—","Masked Chhau"],["<b>Santhali</b>","Santhal","Group dance to the madal"],["<b>Sarhul</b>","Oraon, Munda","Spring; sal tree"],["<b>Tusu</b>","Kurmi","Makar Sankranti"],["Domkach, Mundari, Hunta, Phagua","—","Wedding; Munda; hunting; Holi"]]},
 {k:"trap", h:"<b>Two lecture slips.</b> Karma is danced around a branch of the <b>Karam</b> tree, not the Kadam tree. And the CGL statement 'women alone perform the Mardani variant of Jhumair' is <b>false</b> — only the statement 'Jhumair is a harvest dance' was correct."},
 {k:"trick", h:"<b>West Bengal:</b> Bengalis eat fish by the <b>bowl</b> → <b>Baul</b>; with a <b>थाली</b> → <b>Dhali</b>; Didi never smiles, always <b>गंभीर</b> → <b>Gambhira</b>. <b>Brita</b> (Vrita) → वर्षा/vow when smallpox ('देवी') comes."},
 {k:"table", title:"West Bengal", head:["Dance","What","Remember"], rows:[["<b>Purulia Chhau</b>","Masked, martial","UNESCO 2010"],["<b>Baul</b>","Mystic minstrels","Ektara; UNESCO (proclaimed 2005, inscribed 2008)"],["<b>Gambhira</b>","Malda","Shiva; social satire"],["<b>Raibenshe</b>","Martial","Bansh = bamboo"],["<b>Brita (Vrita)</b>","Women","Vow after recovering from smallpox"],["<b>Bhadu</b>","Unmarried girls","Bhadra month"],["<b>Dhali</b>","Martial","Dhal = shield"],["Jhumur, Santhali, Maruni","—","Tea gardens; Santhal; Darjeeling"]]},
 {k:"q", q:"Chhau is performed in which three states?", o:["Odisha, Jharkhand and West Bengal","Bihar, Assam and Odisha","Jharkhand, Chhattisgarh and MP","Odisha, Andhra and Bengal"], e:"Mayurbhanj (Odisha), Seraikela (Jharkhand), Purulia (West Bengal)."},
 {k:"link", h:"<b>Chhau = छाया.</b> The third lecture: in harsh sun you seek shade — a mask. Purulia and Seraikela wear masks; <b>Mayurbhanj does not</b>. A masked Chhau answer is Purulia or Seraikela."}
], sum:["Bihar: Jat-Jatin, Jhijhiya (Durga/Navratri), Bidesia & Launda Nach (Bhikhari Thakur), Domkach, Sohar-Khilona, Jhumari, Pari Khanda.","Jharkhand: Karma (Karam tree), Jhumair (harvest), Paika, Seraikela Chhau, Santhali, Sarhul, Tusu.","WB: Purulia Chhau, Baul, Gambhira (Malda), Raibenshe, Brita, Bhadu, Dhali."]},

{ id:"L8", title:"Odisha & Chhattisgarh", hi:"ओडिशा और छत्तीसगढ़", blocks:[
 {k:"trick", h:"<b>Odisha, lecture 1:</b> “<b>दिशा</b> <b>पुआ</b> (Gotipua) खाया, <b>दाल खाई</b> (Dalkhai), <b>डंडा</b> (Danda Nacha) लेके <b>घूम</b> (Ghumura) रहा और <b>भाग</b> (Bagha Nacha) के नाच रहा — <b>रन</b> (Ranappa)!”<br><b>Lecture 3:</b> Disha <b>runs</b> on bamboo stilts → <b>Ranappa</b>; 'संभल कर!' → <b>Sambalpuri</b>; then she was <b>गुम</b> → <b>Ghumura</b>; boys play <b>goti</b> → <b>Gotipua</b>."},
 {k:"table", title:"Odisha", head:["Dance","What","Remember"], rows:[["<b>Gotipua</b>","Boys dressed as girls","Praise Jagannath & Krishna; a root of Odissi"],["<b>Dalkhai</b>","Sambalpur tribes","Goddess Dalkhai; Radha–Krishna songs; Dussehra & Nuakhai"],["<b>Ghumura</b>","Kalahandi","Earthen ghumura drum; once war music"],["<b>Ranappa</b>","Cowherds, Ganjam","Stilt dance; Krishna's childhood"],["<b>Danda Nacha</b>","Chaitra","Penance to Shiva and Shakti"],["<b>Bagha Nacha</b>","Ganjam","Tiger dance"],["<b>Chaiti Ghoda</b>","Kaibarta fishers","Dummy horse; Chaitra"],["<b>Paika</b>","Khandayat warriors","Sword & shield; 1817 Paika rebellion"],["<b>Mayurbhanj Chhau</b>","—","The Chhau without masks"],["Odissi","Classical","Tribhanga posture"]]},
 {k:"p", h:"<b>The Paika sequence (Selection Post):</b> blowing the conch → sword-and-shield sparring drills → acrobatic somersaults → a group victory shout."},
 {k:"q", q:"In which dance do young boys dress as girls to praise Jagannath?", o:["Gotipua","Ghumura","Dalkhai","Ranappa"], e:"Gotipua — goti = single, pua = boy."},
 {k:"trick", h:"<b>Chhattisgarh, lecture 1:</b> “<b>अक्सर</b> (Kaksar) <b>सुआ</b> (Suwa) <b>कर्म</b> (Karma) ना करके <b>गेंडी</b> (Gendi) <b>मारते</b> (Gaur Maria) हैं, <b>पागलपंथी</b> (Panthi) करते हैं और <b>पांडवों</b> (Pandavani) के साथ झूमर के नीचे <b>सैला</b> (Saila) करते हैं” + <b>धोनी</b> → Pardhoni.<br><b>Lecture 3:</b> Pandavani = <b>पांडव-जन की वाणी</b> → Tee<b>jan</b> Bai; Suwa = तोता; <b>Raut</b> = रात → Diwali night, Yadavs; <b>Panthi</b> = पथ → Guru Ghasidas shows the path up → human pyramid."},
 {k:"table", title:"Chhattisgarh", head:["Dance","Who / what","Remember"], rows:[["<b>Panthi</b>","<b>Satnami</b>","Guru Ghasidas; human pyramids; dancers in <b>dhoti</b>"],["<b>Pandavani</b>","Ballad of the Mahabharata","<b>Teejan Bai</b> (Padma Vibhushan 2019), Usha Barle"],["<b>Suwa</b>","Gond women","Parrot (suwa) dance, around Diwali"],["<b>Raut Nacha</b>","Yadav (Raut)","Diwali / Dev Uthani nights"],["<b>Gaur Maria</b>","Dandami (Bison Horn) Maria","Bison-horn headgear; Bastar"],["<b>Gendi</b>","Muria of Bastar","Stilt dance"],["<b>Kaksar</b>","Abujhmaria","Harvest, Bastar"],["<b>Saila</b>","Boys","Stick dance in Aghan, after harvest"],["<b>Pardhoni</b>","Baiga","Welcoming the baraat; also MP"],["Karma","—","Karam branch; shared with Jharkhand"]]},
 {k:"p", h:"<b>News:</b> <b>Teejan Bai</b>, the Pandavani singer, died in July 2026, aged 70. She received the Padma Shri (1988), Padma Bhushan (2003) and Padma Vibhushan (2019)."},
 {k:"trap", h:"<b>Gendi is the Muria stilt dance</b>, not the Baiga's as lecture 1 said. The Baiga's dance here is <b>Pardhoni</b>. Also, <b>'Gammat'</b> is a Chhattisgarhi word for folk drama — a PYQ asked it."},
 {k:"q", q:"Among Bagurumba, Pardhoni, Gaddi Natti and Bison Horn Maria, which belongs only to Chhattisgarh?", o:["Bison Horn Maria","Pardhoni","Bagurumba","Gaddi Natti"], e:"Pardhoni is shared with MP; Bagurumba is Assam; Gaddi Natti is HP."},
 {k:"link", h:"<b>Two stilt dances:</b> Ranappa (Odisha) and Gendi (Chhattisgarh). Remember them together: Disha <i>runs</i> in Odisha; in Bastar the Muria boys walk tall."}
], sum:["Odisha: Gotipua, Dalkhai, Ghumura (Kalahandi), Ranappa (stilts), Danda Nacha, Bagha Nacha, Chaiti Ghoda, Paika, Mayurbhanj Chhau.","CG: Panthi (Satnami, Ghasidas), Pandavani (Teejan Bai, d. July 2026), Suwa, Raut Nacha, Gaur Maria, Gendi (Muria), Kaksar, Saila, Pardhoni.","The only CG-exclusive option: Bison Horn Maria."]},

{ id:"L9", title:"Madhya Pradesh & Gujarat", hi:"मध्य प्रदेश और गुजरात", blocks:[
 {k:"trick", h:"<b>MP in one line (lecture 3):</b> “<b>मंच</b> पर <b>मटकी</b> में <b>ज्वार</b> भरके नाच रहे थे — मटकी <b>गिरी</b>, ज्वार फैल गया।” → <b>Maanch, Matki, Jawara, Grida</b>. How do you know it's MP? A stage is always set in the <b>middle</b> (मध्य) so everyone can see."},
 {k:"trick", h:"<b>MP, lecture 1:</b> “अक्सर <b>गोरियाँ</b> (Bhagoria) <b>अदा</b> (Aada-Khada) दिखाने के लिए <b>मटकी</b> (Matki), <b>जवारा</b> (Jawara), <b>फूल-पत्ती</b> (Phulpati) रखके <b>मंच</b> (Maanch) पे <b>खड़ा</b> (Khada) नाचती हैं और <b>ताली</b> (Tertali) बजाती हैं।”"},
 {k:"table", title:"Madhya Pradesh", head:["Dance","Who / where","Remember"], rows:[["<b>Matki</b>","Malwa women","Earthen pots (matki) on the head"],["<b>Aada-Khada</b>","Malwa","Variants of Matki"],["<b>Maanch</b>","Malwa","Folk theatre"],["<b>Jawara</b>","Bundelkhand","Baskets of jawara sprouts; harvest"],["<b>Grida</b>","—","Rabi season, when crops stand"],["<b>Bhagoria</b>","Bhil, Jhabua","Holi-time haat"],["<b>Phulpati</b>","Unmarried girls","Holi season"],["<b>Rai</b>","Bedni women, Bundelkhand","Night dance"],["<b>Badhai</b>","Bundelkhand","Thanks to Sheetala Mata (birth, marriage)"],["<b>Kathi</b>","Nimar","Navratri"],["Tertali, Saila, Pardhoni","—","Kamar; sticks; Baiga"]]},
 {k:"trap", h:"<b>Kaksar opens the MP sentence ('अक्सर'), but Kaksar is Chhattisgarh's</b> (Abujhmaria, Bastar — which was part of MP until 2000). If both states are options, mark CG. Likewise, Tertali in MP lists is the same 13-cymbal dance as Rajasthan's Terah Taali — prefer Rajasthan."},
 {k:"q", q:"The Matki dance, with earthen pots on the head, is from which region?", o:["Malwa (MP)","Bundelkhand (UP)","Marwar (Rajasthan)","Saurashtra (Gujarat)"], e:"Matki is the Malwa women's dance of MP; Aada-Khada are its variants."},
 {k:"trick", h:"<b>Gujarat:</b> “गुजरात की <b>गोपियाँ</b> <b>डांडिया</b> और <b>गरबा</b> खेलने <b>सिद्दियों</b> (Siddi Dhamal) से <b>मटक</b> (Matukadi)-मटक के <b>पधार</b> (Padhar) रही हैं” + <b>डंडी</b> → Tippani, Dangi; <b>भावेश भाई</b> → Bhavai. Lecture 3: <b>टिप-टिप</b> sweat of hard-working labourers → <b>Tippani</b>; <b>घेर</b> के रंग at Holi → <b>Rathwa ni Gher</b>."},
 {k:"table", title:"Gujarat", head:["Dance","Who / what","Remember"], rows:[["<b>Garba</b>","Navratri","Around the garbo lamp; danced before aarti; <b>UNESCO 2023</b>"],["<b>Dandiya Raas</b>","Navratri","Sticks; mock fight of Durga & Mahishasura; after aarti"],["<b>Tippani</b>","Women labourers, Chorwad (Saurashtra)","Beat the floor with sticks, as when ramming new floors"],["<b>Padhar</b>","Padhar community, Nal Sarovar","Also their <b>Manjira</b> dance"],["<b>Siddi Dhamal</b>","Siddi (East African roots)","Celebrates a hunt"],["<b>Hudo</b>","Bharwad shepherds","Clapping like fighting rams"],["<b>Dangi</b>","Dang adivasis","<b>Group</b> dance, human pyramids"],["<b>Rathwa ni Gher</b>","Rathwa tribe","Holi"],["<b>Bhavai</b>","—","Folk theatre (Rajasthan's Bhavai is a pot-balancing dance)"]]},
 {k:"q", q:"Which Gujarat dance began with women labourers beating new floors with sticks?", o:["Tippani","Hudo","Padhar","Garba"], e:"Tippani of Chorwad — the tip-tip of the sticks."},
 {k:"trap", h:"<b>CGL statement on Dangi:</b> 'performed by the Dangi adivasis of Dang district' — correct. 'A solo narrative dance mimicking farm tools' — <b>wrong</b>; it is a group dance with human chains and pyramids."},
 {k:"link", h:"<b>Garba vs Dandiya.</b> Same nights (Navratri), different props and timing: Garba — hands and claps, around the lamp, <b>before</b> aarti; Dandiya — sticks as swords, <b>after</b> aarti."}
], sum:["MP: Maanch, Matki, Jawara, Grida ('मंच पर मटकी…'); Bhagoria Bhil; Phulpati; Rai (Bedni); Badhai; Kathi (Nimar).","Gujarat: Garba (UNESCO 2023), Dandiya, Tippani (Chorwad labourers), Padhar, Siddi Dhamal, Hudo (Bharwad), Dangi (group), Rathwa ni Gher, Bhavai.","Kaksar is CG; Terah Taali is Rajasthan."]},

 {k:"trick", h:"<b>Goa:</b> “<b>माँडवी</b> (Mando) <b>घोड़े</b> (Ghode Modni) <b>गाड़ी</b> (Talgadi, Fugdi) और <b>जैगुआर</b> (Jagor) देखने, <b>पतंग</b> (Tarangmel) उड़ाने <b>गोवा</b> (Goff) जा रही है — ‘<b>चलो</b> (Dhalo) गाँव, <b>रो मत</b> (Romat), <b>सो जाओ</b> (Sao Joao)’।” + <b>देखो-देखो</b> → Dekhni."},

{ id:"L11", title:"Karnataka", hi:"कर्नाटक", blocks:[
 {k:"trick", h:"“<b>यश</b> (Yakshagana) बोला: <b>कम</b> (Kamsale) कर साले, <b>डोल</b> (Dollu Kunitha) <b>भूत</b> (Bhuta Kola) बन के आएगी, <b>नाग मंडल</b> (Nagamandala) लेके, तुम्हारी <b>वीरता</b> (Veeragase) खत्म कर देगी।” Add <b>Bolak-aat</b> (bolak = light) for the Kodavas."},
 {k:"table", title:"Karnataka", head:["Dance","Who / what","Remember"], rows:[["<b>Yakshagana</b>","Coastal night theatre","Himmela = musicians behind; Mummela = actor-dancers in front; also Kasaragod (Kerala)"],["<b>Dollu Kunitha</b>","Kuruba","Big drums (dollu) slung from the neck"],["<b>Kamsale</b>","Devotees of Male Mahadeshwara","Brass cymbals (kamsale)"],["<b>Veeragase</b>","Lingayat (Veerashaiva)","Veerabhadra; vigorous; Dasara"],["<b>Bhuta Kola</b>","Tulu Nadu","Spirit worship (Bhuta Aradhane)"],["<b>Nagamandala</b>","Two priests","One enacts the male snake, one the female"],["<b>Karaga</b>","Thigala","Draupadi; Bengaluru Karaga"],["<b>Bolak-aat</b>","Kodava","Around an oil lamp at night; Kailpodh"],["<b>Huli Vesha</b>","—","Tiger dance at Dasara, Udupi"],["<b>Suggi Kunitha</b>","Farmers","Harvest"],["Jodu Halagi, Garudi Gombe, Kolata","—","Two frame drums; giant dolls; sticks"]]},
 {k:"q", q:"Dollu Kunitha, performed with large drums, is associated with which state?", o:["Karnataka","Kerala","Andhra Pradesh","Maharashtra"], e:"A CGL PYQ. Kunitha = dance; the Kuruba community performs it."},
 {k:"trap", h:"<b>Karaga (Karnataka) is not Karakattam (TN).</b> Karaga honours <b>Draupadi</b>; Karakattam is a pot dance for the rain goddess <b>Mariamman</b>. The double 't' in Karakattam points to Tamil Nadu."},
 {k:"q", q:"Veeragase honours Veerabhadra and is performed by which community?", o:["Lingayats","Kodavas","Kurubas","Tulu Bunts"], e:"Veeragase is the Lingayat (Veerashaiva) warrior dance."},
 {k:"link", h:"<b>Two tiger dances, two festivals.</b> Huli Vesha — Karnataka, at Dasara. Pulikali — Kerala, at Onam (puli = tiger). Same animal, different state."}
], sum:["Yakshagana (Himmela/Mummela), Dollu Kunitha (Kuruba), Kamsale (Male Mahadeshwara), Veeragase (Lingayat), Bhuta Kola, Nagamandala, Karaga (Draupadi), Bolak-aat (Kodava), Huli Vesha.","Kunitha = Karnataka."]},

{ id:"L12", title:"Kerala & Lakshadweep", hi:"केरल और लक्षद्वीप", blocks:[
 {k:"trick", h:"<b>-kali and -attam → Kerala</b> (or TN). A double 'p' like <b>Oppana</b>? Remember the SelPost PYQ: Oppana — Kerala weddings. <b>Theyyam</b> = 'theyyam' means god → 'dance of gods'."},
 {k:"table", title:"Kerala", head:["Dance","Who / what","Remember"], rows:[["<b>Theyyam</b>","Malayan, Vannan","'Dance of gods'; North Malabar — Kannur & Kasaragod"],["<b>Oppana</b>","Mappila Muslims","Weddings; clapping around the bride"],["<b>Margamkali</b>","Syrian Christians","Around a lamp"],["<b>Ottamthullal</b>","—","<b>Kunchan Nambiar</b> (18th c.); satire"],["<b>Koodiyattam</b>","Chakyar","Sanskrit theatre; UNESCO 2001 (inscribed 2008)"],["<b>Chakyar Koothu</b>","Chakyar","Monologue in the temple theatre (koothambalam)"],["<b>Mudiyettu</b>","—","Kali slays Darika; UNESCO 2010"],["<b>Padayani</b>","—","Painted masks to Bhadrakali"],["<b>Pulikali</b>","—","Tiger dance; Onam, Thrissur"],["<b>Thiruvathirakali</b>","Women","White kasavu sari, around a lamp; Thiruvathira in Dhanu"],["<b>Kolkali</b>","—","Stick dance around the nilavilakku"],["<b>Kakkarissi Natakam</b>","—","Satirical dance-drama"]]},
 {k:"q", q:"Which is a traditional dance of Kerala?", o:["Theyyam","Bhangra","Giddha","Dhol Cholom"], e:"A PYQ: Theyyam of North Malabar."},
 {k:"trap", h:"<b>Two Onam slips.</b> Lecture 1 said Thiruvathirakali is danced in Dhanu month, 'i.e. Onam'. Thiruvathira falls in <b>Dhanu (Dec–Jan)</b>; Onam is in <b>Chingam (Aug–Sep)</b>. The Onam dance is Pulikali (and Thiruvathirakali is also seen at Onam, but its own festival is Thiruvathira). Also: peacock in Tamil is <b>mayil</b>, not 'mal'."},
 {k:"table", title:"Lakshadweep", head:["Dance","Who","Remember"], rows:[["<b>Parichakali</b>","Men","Shield & sword (martial)"],["<b>Lava</b>","Men, Minicoy","Minicoy island"],["<b>Bandiya</b>","Women","Pots (bandi)"],["Kolkali","—","Stick dance, as in Kerala"]]},
 {k:"q", q:"Parichakali of Lakshadweep is a…", o:["Shield-and-sword dance","Harvest song","Bamboo dance","Puppet play"], e:"Parichakali is a martial dance with shields (paricha) and swords."},
 {k:"link", h:"<b>Kerala's three theatre-dances in one breath:</b> Koodiyattam (Sanskrit, UNESCO), Chakyar Koothu (a Chakyar's solo), Ottamthullal (Kunchan Nambiar's satire, a reply to Chakyar Koothu)."}
], sum:["Theyyam (dance of gods), Oppana (Mappila weddings), Margamkali (Syrian Christians), Ottamthullal (Kunchan Nambiar), Koodiyattam, Chakyar Koothu, Mudiyettu, Padayani, Pulikali, Thiruvathirakali, Kolkali, Kakkarissi Natakam.","Lakshadweep: Parichakali, Lava (Minicoy), Bandiya."]},

{ id:"L13", title:"Tamil Nadu", hi:"तमिलनाडु", blocks:[
 {k:"trick", h:"<b>Attam = dance in Tamil.</b> Karak-attam, Kavadi-attam, Mayil-attam, Oyil-attam, Devar-attam, Paraiy-attam, Bommal-attam. If you see '-attam' and Kerala's classical Mohiniattam/Koodiyattam aren't the answer, think Tamil Nadu."},
 {k:"table", title:"Tamil Nadu", head:["Dance","What","Remember"], rows:[["<b>Karakattam</b>","Pot on the head","Rain goddess <b>Mariamman</b>"],["<b>Kavadi Attam</b>","'Burden dance'","Devotees of <b>Murugan</b> carry the kavadi; Thaipusam"],["<b>Mayilattam</b>","Peacock dance","Murugan's mount; mayil = peacock"],["<b>Kummi</b>","Women clap in a circle","Pongal; also Kerala"],["<b>Oyilattam</b>","Men","Graceful; handkerchiefs"],["<b>Devarattam</b>","Kambalathu Naicker","'Dance of gods'"],["<b>Poikkal Kuthirai</b>","Dummy horse","Poikkal = false legs"],["<b>Bommalattam</b>","Puppetry","Epics"],["<b>Therukoothu</b>","Street theatre","Mahabharata; Draupadi cult"],["<b>Silambam</b>","Martial","Bamboo staff"],["Villu Pattu, Paraiattam","—","Bow-song; parai drum"],["Bharatanatyam","Classical","—"]]},
 {k:"q", q:"Kavadi Attam, the 'burden dance', is performed in honour of…", o:["Murugan","Mariamman","Ayyappa","Vishnu"], e:"Kavadi Attam — devotees carry the kavadi to Murugan's temples, especially at Thaipusam."},
 {k:"trap", h:"<b>Bommalattam is puppetry, not a dance by people.</b> A PYQ asked what Bommalattam is: the answer is a puppet show (bommai = doll)."},
 {k:"q", q:"Kummi, danced by women clapping in a circle, belongs to…", o:["Tamil Nadu (and Kerala)","Punjab","Assam","Gujarat"], e:"Kummi is danced in TN (at Pongal) and in Kerala."},
 {k:"link", h:"<b>TN's gods on stage:</b> Mariamman → Karakattam (pot); Murugan → Kavadi and Mayilattam (peacock); Draupadi → Therukoothu. Each dance brings its god's symbol."}
], sum:["Karakattam (Mariamman), Kavadi Attam (Murugan), Mayilattam (peacock), Kummi (clapping), Oyilattam, Devarattam, Poikkal Kuthirai (dummy horse), Bommalattam (puppets), Therukoothu, Silambam.","-attam = Tamil Nadu (or Kerala)."]},

{ id:"L14", title:"Punjab, Haryana & Rajasthan", hi:"पंजाब, हरियाणा और राजस्थान", blocks:[
 {k:"trick", h:"<b>Punjab (lecture 3):</b> “<b>सम्मी</b> ने <b>भांग</b> (Bhangra) के <b>लड्डू</b> (Luddi) खा के <b>गिद्दा</b> (Giddha) किया” — then add <b>Jaago</b>, <b>Kikkli</b>, <b>Gatka</b>."},
 {k:"table", title:"Punjab", head:["Dance","Who / what","Remember"], rows:[["<b>Bhangra</b>","Men","Harvest; Baisakhi; dhol"],["<b>Giddha</b>","Women","Boliyan couplets; Teej & Lohri"],["<b>Luddi</b>","—","Victory dance of the <b>Sandal Bar</b>"],["<b>Sammi</b>","Baazigar women","Sandal Bar"],["<b>Jaago</b>","Wedding","Night before the wedding; decorated lamp-lit pot"],["<b>Kikkli</b>","Girls","Pairs cross hands and twirl"],["<b>Gatka</b>","Sikhs","Martial (sticks & swords)"]]},
 {k:"trick", h:"<b>Haryana:</b> “हरियाणा की <b>छोरियाँ</b> (Khoria) <b>ढफली</b> (Daf) और <b>मंजीरा</b> (Manjira) लेके <b>झूमर</b> (Jhumar) के नीचे <b>धमाल</b> (Dhamal) मचा रही हैं <b>फागुन</b> (Phag) में।” Lecture 3: <b>Loor</b> → husbands <b>दूर</b> at war; <b>Khoria</b> → छोरियाँ after the baraat leaves."},
 {k:"table", title:"Haryana", head:["Dance","Who / what","Remember"], rows:[["<b>Khoria</b>","Women","After the baraat leaves; a set of Jhumar styles"],["<b>Phag</b>","—","Phalgun (Holi)"],["<b>Loor</b>","Girls of Bangar","Phalgun; songs for husbands away"],["<b>Dhamal</b>","Ahir","Roots in the Mahabharata"],["<b>Daf</b>","—","Harvest & Holi"],["<b>Gugga</b>","—","Saint Gugga (snake-bite saint); chhari pole with peacock feathers"],["<b>Jhumar</b>","Young married women","Haryana's Jhumar"],["<b>Swang</b>","Disguise theatre","Also UP"],["<b>Manjira</b>","Mewat","Cymbals"]]},
 {k:"trick", h:"<b>Rajasthan (lecture 1):</b> “<b>राजा गंगा</b> (Gangaur) <b>कल</b> (Kalbelia) <b>घूम</b> (Ghoomar) रहे थे <b>चार</b> (Chari) <b>थाली</b> (Terah Taali) लेके…” Lecture 3: <b>Kalbelia</b> → काला नाग → snake charmers; <b>Terah Taali</b> → “तेरा <b>काम</b> तो <b>राम</b> जाने” → <b>Kamad</b> tribe, <b>Baba Ramdev</b>; <b>Bhavai</b> → 'वाह भाई!' balancing feats."},
 {k:"table", title:"Rajasthan", head:["Dance","Who / what","Remember"], rows:[["<b>Ghoomar</b>","Bhil women → Rajputs","'Ghoomna' = to twirl; for Saraswati; Teej & Gangaur; <b>not</b> UNESCO"],["<b>Kalbelia</b>","Kalbelia snake charmers","Black mirror-work skirts; snake movements; <b>UNESCO 2010</b>; Gulabo Sapera"],["<b>Terah Taali</b>","Kamad","13 manjiras tied to the body; Baba Ramdev"],["<b>Chari</b>","Gujjar","Brass pots with fire on the head; Kishangarh"],["<b>Bhavai</b>","—","Stacked pots on the head, dancing on swords or glass"],["<b>Kachchhi Ghodi</b>","—","Dummy horse; Shekhawati"],["<b>Gair</b>","Bhil men","Holi; sticks"],["<b>Ghudla</b>","Women","Pot with holes and a lamp; Marwar"],["<b>Chang</b>","Men","Holi; chang drum; Shekhawati"],["<b>Agni dance</b>","Jasnathi","On live coals; Bikaner"],["<b>Gavari</b>","Bhil","Udaipur; 40-day dance-drama"]]},
 {k:"trap", h:"<b>Lecture 3 said Kachchhi Ghodi is from Gujarat. It is Rajasthan's</b> (Shekhawati) — 'Kachchh' misleads. Also, a CGL statement on Ghoomar: 'it means twirling' ✓, 'it is on UNESCO's list' ✗."},
 {k:"q", q:"Terah Taali of Rajasthan is performed by which tribe?", o:["Kamad","Bhil","Gujjar","Meena"], e:"The Kamad (Kamar) — 'तेरा काम तो राम जाने' — for Baba Ramdev."},
 {k:"q", q:"Which statement about Kalbelia is correct?", o:["It imitates the movements of snakes and is on UNESCO's list","It is a war dance of Rajput men","It is performed only at weddings in Punjab","It uses 13 cymbals tied to the body"], e:"Kalbelia imitates snakes and was inscribed by UNESCO in 2010; the 13 cymbals are Terah Taali."},
 {k:"link", h:"<b>Four similar names, four states:</b> Ghoomar (Rajasthan, twirl) · Jhumar (Haryana married women; also Punjab) · Jhumur (Assam/WB tea gardens) · Jhumair (Jharkhand harvest). Dhamal (Haryana) ≠ Dumhal (J&K)."}
], sum:["Punjab: Bhangra, Giddha (boliyan), Luddi & Sammi (Sandal Bar), Jaago (weddings), Kikkli, Gatka.","Haryana: Khoria, Phag, Loor, Dhamal (Ahir), Daf, Gugga, Jhumar, Swang, Manjira.","Rajasthan: Ghoomar (not UNESCO), Kalbelia (UNESCO 2010), Terah Taali (Kamad, Ramdev), Chari (Gujjar), Bhavai, Kachchhi Ghodi, Gair, Ghudla, Chang."]},

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hash = s => { let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5)+h + s.charCodeAt(i))|0; return "q"+(h>>>0).toString(36); };
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; };

const LNUM = id => LESSONS.findIndex(l => l.id === id) + 1;

});
const byLesson = id => QS.filter(q => q.t === id);
// order of options to show: array of original indexes
const makePerm = q => q.fixed ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i));

function renderTop(){
  const ids = Object.keys(S.ans).filter(k => QS.some(q => q.id === k));

}

      ${nextIdx>=0 ? `<button class="btn pri sm" type="button" data-open="${LESSONS[nextIdx].id}">${done? "Continue" : "Start"}: Lesson ${nextIdx+1}</button>` : `<span class="muted" style="font-size:13px">All lessons done. Try a mock test.</span>`}</div>

function blockHTML(b){
  if (b.k==="p") return `<div class="plain"><p>${b.h}</p></div>`;
  if (b.k==="trick") return `<div class="trick"><span class="lab">Trick</span>${b.h}</div>`;
  if (b.k==="link") return `<div class="link"><span class="lab">Link · connect the dances</span>${b.h}</div>`;
  if (b.k==="q") { const perm = shuffle(b.o.map((_,i)=>i)); return `<div class="icheck" data-ic><span class="lab">Quick check</span><p class="qt">${esc(b.q)}</p><div class="opts">${perm.map((oi,k)=>`<button type="button" class="opt" data-ioi="${oi}"><span class="k">${"ABCD"[k]}</span><span>${esc(b.o[oi])}</span></button>`).join("")}</div><div class="exp" hidden><b class="okl"></b> ${esc(b.e)}</div></div>`; }
  if (b.k==="trap") return `<div class="trap"><span class="lab">Trap · correction</span>${b.h}</div>`;
  if (b.k==="facts") return `<div class="block"><h3>${b.title}</h3><dl class="facts">${b.rows.map(r=>`<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join("")}</dl></div>`;
  if (b.k==="tl") return `<div class="block"><h3>${b.title}</h3><ul class="tl">${b.rows.map(r=>`<li><span class="y">${r[0]}</span><span>${r[1]}</span></li>`).join("")}</ul></div>`;
  if (b.k==="table") {
    const isNum = (ci) => b.numcol==="all" ? ci>0 : (b.numcol===1 && ci===1) || (typeof b.numcol==="string" && b.numcol.includes(String(ci)));
    return `<div class="block"><h3>${b.title}</h3><div class="tbl"><table><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map((c,ci)=>`<td class="${isNum(ci)?"n":""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  }
  if (b.k==="fig") return `<div class="block"><h3>${b.title}</h3><figure class="fig">${b.svg}<figcaption>${b.cap}</figcaption></figure></div>`;
  if (b.k==="pyr") return `<div class="block"><h3>${b.title}</h3><div class="pyr">${b.items.map(it=>`<div>${PYR(it.rows)}<b>${it.name}</b><span class="muted">${it.note}</span></div>`).join("")}</div><p class="muted" style="font-size:13px;margin-top:8px"><span style="color:var(--blue)">■</span> males · <span style="color:var(--accent)">■</span> females · top = old, base = young</p></div>`;
  return "";
}

function pCard(q, idx){

function bindCard(card){

function submitMock(){

  let c=0,w=0,sk=0; const per = {};
  M.list.forEach((it,k) => {
    const a = M.ans[k]; const t = it.q.t; per[t] = per[t] || {c:0,n:0}; per[t].n++;

      <div class="chips" role="group" aria-label="Hide columns">${[["st","Hide state"],["tr","Hide community"],["key","Hide key fact"]].map(c=>`<button type="button" class="chip" data-hide="${c[0]}" aria-pressed="${!!HIDE[c[0]]}">${c[1]}</button>`).join("")}
      <button type="button" class="chip" id="cshuf">${CORDER?"In order":"Shuffle rows"}</button><button type="button" class="chip" id="creset">Cover all again</button></div>
      <div class="block"><div class="tbl"><table class="cover"><thead><tr><th>Dance</th><th>State</th><th>Community</th><th>Key fact</th></tr></thead><tbody>${order.map(k=>{ const f = FEST[k];
        const cell = (col, v) => (HIDE[col] && !CREV[k+col] && v!=="—") ? `<td data-l="${LBL[col]}"><button type="button" class="peek" data-peek="${k+col}" aria-label="Show ${LBL[col]}">tap</button></td>` : `<td data-l="${LBL[col]}">${esc(v)}</td>`;
        return `<tr><td><b>${esc(f[0])}</b></td>${cell("st",f[1])}${cell("tr",f[2])}${cell("key",f[3])}</tr>`; }).join("")}</tbody></table></div></div>`;
    bindState();
    box.querySelectorAll("[data-hide]").forEach(b => b.onclick = () => { const c=b.dataset.hide; HIDE[c] = HIDE[c]?0:1; renderRevise(); });
    box.querySelectorAll("[data-peek]").forEach(b => b.onclick = () => { CREV[b.dataset.peek] = 1; renderRevise(); });
    $("#cshuf").onclick = () => { CORDER = CORDER ? null : shuffle(base.slice()); renderRevise(); };
    $("#creset").onclick = () => { CREV = {}; renderRevise(); };
  }
  if (RV === "finder") {
    box.innerHTML = `<input class="search" id="fs" type="search" placeholder="Search a dance, state, tribe or clue (e.g. Garo, stilts, sword, UNESCO)" aria-label="Search dances">
      <div class="block"><div class="tbl"><table><thead><tr><th>Dance</th><th>State</th><th>Community</th><th>Key fact</th></tr></thead><tbody id="fb"></tbody></table></div></div>`;
    const draw = () => {
      const q = $("#fs").value.trim().toLowerCase();
      const rows = FEST.filter(f => !q || f.join(" ").toLowerCase().includes(q));
      $("#fb").innerHTML = rows.length ? rows.map(f=>`<tr><td><b>${esc(f[0])}</b><br><span class="muted" style="font-size:12px">L${LNUM(f[4])}</span></td><td>${esc(f[1])}</td><td>${esc(f[2])}</td><td>${esc(f[3])}</td></tr>`).join("") : `<tr><td colspan="4" class="muted">No match.</td></tr>`;
    };
    $("#fs").oninput = draw; draw();
  }
  if (RV === "tribes") {
    box.innerHTML = `<p class="muted">The 'which community performs…' questions. Cover the right side and recall.</p><input class="search" id="ts" type="search" placeholder="Search a community or dance" aria-label="Search communities"><div class="block"><dl class="rk" id="tl"></dl></div>`;
    const draw = () => { const q=$("#ts").value.trim().toLowerCase(); const r=TRIBES.filter(t=>!q||t.join(" ").toLowerCase().includes(q));
      $("#tl").innerHTML = r.length ? r.map(t=>`<div><dt><b style="color:var(--ink)">${esc(t[0])}</b></dt><dd>${esc(t[1])}</dd></div>`).join("") : `<p class="muted">No match.</p>`; };
    $("#ts").oninput = draw; draw();
  }
  if (RV === "months") {
    box.innerHTML = `<p class="muted">When the name rings no bell, the theme narrows the options — war, masks, stilts, weddings, animals.</p><div class="block"><div class="tbl"><table><thead><tr><th>Theme</th><th>Clue</th><th>Dances</th></tr></thead><tbody>${MONTHS.map(m=>`<tr><td><b>${esc(m[0])}</b></td><td>${esc(m[1])}</td><td>${esc(m[2])}</td></tr>`).join("")}</tbody></table></div></div>`;
  }
  if (RV === "tricks2") {
    const t = LESSONS.find(l=>l.id==="L16").blocks.find(b=>b.k==="table");
    box.innerHTML = `<p class="muted">Say the trick, then list the dances before looking.</p><div class="pubs">${t.rows.map(r=>`<div class="block"><h3>${esc(r[0])}</h3><p style="margin:0 0 6px">${esc(r[1])}</p><p class="muted" style="margin:0;font-size:14px">${esc(r[2])}</p></div>`).join("")}</div>`;
  }
  if (RV === "links") {
    const items = LESSONS.flatMap((l,i) => l.blocks.filter(b=>b.k==="link").map(b=>({l:i+1, t:l.title, h:b.h})));
    box.innerHTML = items.map(x => `<div class="link"><span class="lab">L${x.l} · ${esc(x.t)}</span>${x.h}</div>`).join("");
  }
  if (RV === "nums") {
    box.innerHTML = `<div class="tiles">${TILES.map(t=>`<div class="tile"><span class="num">${t[0]}</span><span>${t[1]}</span></div>`).join("")}</div>
    <div class="block"><h3>Confusing pairs</h3><dl class="rk">${PAIRS.map(p=>`<div><dt>${esc(p[0])}</dt><dd>${esc(p[1])}</dd></div>`).join("")}</dl></div>`;
  }
  if (RV === "tricks" || RV === "traps") {
    const kind = RV==="tricks" ? "trick" : "trap";
    const items = LESSONS.flatMap((l,i) => l.blocks.filter(b=>b.k===kind).map(b=>({l:i+1, t:l.title, h:b.h})));
    box.innerHTML = items.map(x => `<div class="${kind}"><span class="lab">L${x.l} · ${esc(x.t)}</span>${x.h}</div>`).join("");
  }
  if (RV === "flash") drawFlash(box);
}
function drawFlash(box){
  if (!FC) { const pool = FCSCOPE==="all" ? QS : FCSCOPE==="wrong" ? QS.filter(q=>S.ans[q.id]===0) : QS.filter(q=>q.t===FCSCOPE); FC = {list: shuffle(pool), i:0, flip:false, known:0}; }
  const sel = `<select id="fcs" aria-label="Flashcard set"><option value="all">All questions</option><option value="wrong">My mistakes</option>${LESSONS.map((l,i)=>`<option value="${l.id}">L${i+1} · ${esc(l.title)}</option>`).join("")}</select>`;
  if (!FC.list.length || FC.i >= FC.list.length) {
    box.innerHTML = `<div class="row">${sel}</div><div class="block stack"><h3>${FC.list.length ? "Deck finished" : "No cards in this set"}</h3>${FC.list.length?`<p class="muted">You knew ${FC.known} of ${FC.list.length} on first look.</p>`:""}<div class="row"><button class="btn pri" type="button" id="fcr">Shuffle and restart</button></div></div>`;
    $("#fcs").value = FCSCOPE; $("#fcs").onchange = e => { FCSCOPE = e.target.value; FC = null; drawFlash(box); };
    $("#fcr").onclick = () => { FC = null; drawFlash(box); }; return;
  }
  const q = FC.list[FC.i];
  box.innerHTML = `<div class="row between">${sel}<span class="muted num" style="font-size:13px">${FC.i+1}/${FC.list.length}</span></div>
    <button type="button" class="flash" id="fcard" aria-label="Flip card">
      <span class="side">${FC.flip?"Answer":"Question · tap to flip"}</span>
      <span class="front">${esc(q.q)}</span>
      ${FC.flip ? `<span class="ans">${esc(q.o[q.a])}</span><span class="muted">${esc(q.e)}</span>` : ""}
    </button>
    <div class="row between"><button class="btn" type="button" id="fca" ${FC.flip?"":"disabled"}>Again later</button><button class="btn pri" type="button" id="fck" ${FC.flip?"":"disabled"}>Got it</button></div>`;
  $("#fcs").value = FCSCOPE; $("#fcs").onchange = e => { FCSCOPE = e.target.value; FC = null; drawFlash(box); };
  $("#fcard").onclick = () => { FC.flip = !FC.flip; drawFlash(box); };
  $("#fca").onclick = () => { FC.list.push(q); FC.list.splice(FC.i,1); FC.flip=false; drawFlash(box); };
  $("#fck").onclick = () => { FC.known++; FC.i++; FC.flip=false; drawFlash(box); };
}

/* boot */
renderTop();
const start = (location.hash||"").replace("#","");
go(["learn","practice","mock","revise"].includes(start) ? start : "learn");
</script>

<script id="shabd-deeplink">
(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();
</script>

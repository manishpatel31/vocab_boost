const LESSONS = [
{"id":"F1","heat":3,"title":"Accounting basics: concepts, conventions, GAAP and standards","hi":"लेखांकन की मूल बातें: अवधारणाएँ, परिपाटियाँ, GAAP और मानक","blocks":[{"k":"hot","h":"Most asked: matching an example to its <b>concept or convention<\/b> (entity, going concern, matching, conservatism, materiality), the <b>accounting equation<\/b> with a missing figure, the <b>limitations<\/b> of financial accounting, and which body issues <b>Accounting Standards<\/b> and <b>Ind AS<\/b>."},{"k":"story","h":"<p>Ravi opens a shop with ₹1,00,000 of his own money. From that day the shop is a separate 'person' in the books: it owes Ravi ₹1,00,000. Every rupee that comes in or goes out is <b>recorded<\/b> (bookkeeping), <b>classified<\/b> into accounts, <b>summarised<\/b> in a trial balance and final accounts, and then <b>analysed and interpreted<\/b> so that Ravi, his banker and the tax office can understand how the shop is doing. That whole chain is <b>accounting<\/b>.<\/p><p>To make one shop's accounts comparable with another's, accountants follow shared rules: basic <b>concepts<\/b> (assumptions), <b>conventions<\/b> (customs), and written <b>accounting standards<\/b>. Together they are called <b>GAAP<\/b> — generally accepted accounting principles.<\/p>","key":"Assets = Liabilities + Capital — every concept protects this balance."},{"k":"table","title":"Concepts and conventions: example → name","head":["What happens","Concept / convention","Note"],"rows":[["The owner and the business are treated as two separate persons","Business entity concept","That is why capital put in by the owner is a liability of the business to the owner."],["Only events that can be measured in money are recorded","Money measurement concept","The skill of the staff or a strike threat is not recorded."],["The business is assumed to run for the foreseeable future","Going concern concept","So fixed assets are shown at cost less depreciation, not at their break-up value."],["Results are measured for a fixed span, usually 12 months","Accounting period concept","In India the financial year runs from 1 April to 31 March."],["Assets are recorded at the price paid to acquire them","Cost (historical cost) concept","Market value changes are ignored in the books."],["Every transaction has two equal effects","Dual aspect concept","The basis of double entry and of Assets = Liabilities + Capital."],["Revenue counts when it is earned, i.e. when the sale is made","Revenue recognition (realisation) concept","A credit sale is revenue on the day of sale, not on the day the cash comes."],["Expenses of a period are set against the revenue of that period","Matching concept","Why outstanding and prepaid expenses are adjusted."],["Incomes and expenses are recorded when they arise, not when cash moves","Accrual concept","Opposite of the cash basis."],["Every material fact is shown in the accounts or the notes","Full disclosure convention","Contingent liabilities appear as notes."],["The same methods are used from one year to the next","Consistency convention","Lets this year's accounts be compared with last year's."],["Anticipate no profit, but provide for all possible losses","Conservatism (prudence) convention","Stock at cost or net realisable value, whichever is lower."],["Trivial items are not shown separately","Materiality convention","A stapler is written off as an expense, not kept as an asset."],["Entries must rest on evidence such as bills and vouchers","Objectivity (verifiability) concept","Keeps personal bias out of the records."]]},{"k":"facts","title":"Words you must know","rows":[["Bookkeeping","Recording transactions in the books; accounting begins where bookkeeping ends"],["Branches","Financial accounting (outsiders, the past), cost accounting (cost per unit), management accounting (decisions)"],["Internal users","Owners, managers, employees"],["External users","Banks and lenders, investors, suppliers, tax authorities, government, the public"],["Capital","What the owner has invested; Capital = Assets − Liabilities"],["Drawings","Cash or goods taken by the owner for personal use"],["Fictitious assets","Losses or expenses not yet written off, e.g. a large debit balance of a P&amp;L account"],["Cash vs accrual basis","Cash basis records only receipts and payments; companies must use the accrual basis and double entry (Companies Act 2013, Section 128)"]]},{"k":"table","title":"Limitations of financial accounting","head":["Limitation","What it means"],"rows":[["Only money matters","Quality of management, staff morale and market reputation are left out"],["Historical cost","Assets stay at old cost; price-level changes and inflation are ignored"],["Estimates","Depreciation, provisions and stock values rest on judgement, so profit is not exact"],["Past, not future","Shows what happened; it does not plan or forecast"],["No cost detail","Does not give cost per product, job or department — that is cost accounting"],["Window dressing","Figures can be shown in a better light within the rules"]]},{"k":"table","title":"Accounting Standards and Ind AS you should recognise","head":["Standard","Subject","Note"],"rows":[["AS 1","Disclosure of accounting policies","Names three fundamental assumptions: going concern, consistency, accrual."],["AS 2","Valuation of inventories","Lower of cost and net realisable value; FIFO or weighted average."],["AS 3","Cash flow statements","Operating, investing and financing activities."],["AS 9","Revenue recognition",""],["AS 10","Property, plant and equipment","Since its 2016 revision it also covers depreciation (AS 6 was withdrawn)."],["AS 26","Intangible assets","Self-generated goodwill is not recognised."],["AS 29","Provisions, contingent liabilities and contingent assets",""],["Ind AS 1","Presentation of financial statements","Ind AS are converged with IFRS."],["Ind AS 16","Property, plant and equipment",""],["Ind AS 115","Revenue from contracts with customers",""],["Ind AS 116","Leases",""],["Ind AS 117","Insurance contracts","Notified in August 2024; replaced Ind AS 104."]]},{"k":"facts","title":"Who makes the standards","rows":[["Accounting Standards Board (ASB)","Set up by the ICAI on 21 April 1977; drafts the AS"],["Who notifies them for companies","The Central Government (Ministry of Corporate Affairs) under Section 133 of the Companies Act 2013, after examination by the NFRA"],["NFRA","National Financial Reporting Authority — Section 132 of the Companies Act 2013, set up in October 2018"],["Ind AS","Indian Accounting Standards converged with IFRS (issued by the IASB, London); Companies (Indian Accounting Standards) Rules, 2015"],["Ind AS roadmap","Phase I compulsory from 1 April 2016 for companies with net worth of ₹500 crore or more; Phase II from 1 April 2017 for all listed companies and others with net worth of ₹250 crore or more"],["AS 1's fundamental assumptions","Going concern, consistency and accrual — if followed, they need not be disclosed"]]},{"k":"ex","h":"<p><b>Worked example — the accounting equation.<\/b> (1) Ravi starts with cash ₹1,00,000. (2) Buys goods on credit from Sunil ₹30,000. (3) Buys furniture for cash ₹20,000. (4) Sells goods costing ₹10,000 for ₹15,000 cash. (5) Withdraws ₹2,000 for personal use.<\/p><p><b>Step 1 — Cash:<\/b> 1,00,000 − 20,000 + 15,000 − 2,000 = <b>₹93,000<\/b>. <b>Stock:<\/b> 30,000 − 10,000 = <b>₹20,000<\/b>. <b>Furniture:<\/b> ₹20,000. Total assets = <b>₹1,33,000<\/b>.<\/p><p><b>Step 2 — Liabilities:<\/b> creditor Sunil ₹30,000. <b>Capital:<\/b> 1,00,000 + profit 5,000 − drawings 2,000 = ₹1,03,000.<\/p><p><b>Check:<\/b> 30,000 + 1,03,000 = ₹1,33,000 = assets. The equation balances after every transaction.<\/p>"},{"k":"ex","h":"<p><b>Worked example — profit from the equation.<\/b> Capital at the start ₹80,000. At the year end assets are ₹1,50,000 and liabilities ₹40,000. No drawings, no fresh capital.<\/p><p>Closing capital = 1,50,000 − 40,000 = ₹1,10,000. Profit = closing capital − opening capital = 1,10,000 − 80,000 = <b>₹30,000<\/b>.<\/p>"},{"k":"trick","h":"The four <b>conventions<\/b> — <b>“C-C-M-D”<\/b>: <b>C<\/b>onsistency, <b>C<\/b>onservatism, <b>M<\/b>ateriality, full <b>D<\/b>isclosure. AS 1's three fundamental assumptions — <b>“GCA”<\/b>: <b>G<\/b>oing concern, <b>C<\/b>onsistency, <b>A<\/b>ccrual."},{"k":"trap","h":"<b>Conservatism<\/b> is <i>not<\/i> a fundamental accounting assumption under AS 1 — it is a convention. <b>Matching<\/b> is about expenses against revenue of the same period; <b>accrual<\/b> is about recording when earned or incurred. The <b>ICAI's ASB<\/b> drafts standards, but for companies the <b>Central Government<\/b> notifies them."}],"sum":["Accounting = recording, classifying, summarising, analysing, interpreting and communicating financial information.","Assets = Liabilities + Capital (dual aspect); Capital = Assets − Liabilities.","Business entity, money measurement, going concern, accounting period, cost, dual aspect, realisation, matching, accrual are the main concepts.","Conventions: consistency, conservatism, materiality, full disclosure.","AS 1 fundamental assumptions: going concern, consistency, accrual.","ASB of ICAI set up 1977; standards notified by the Central Government under Section 133 of the Companies Act 2013; NFRA under Section 132.","Ind AS converged with IFRS; Phase I from 1 April 2016 for net worth of ₹500 crore or more.","Financial accounting ignores non-money facts and price changes, and rests on estimates."],"part":["Part 1 · Foundations and the books of account","आधार और लेखा पुस्तकें"],"g":"fa"},
{"id":"F2","heat":3,"title":"Double entry: the golden rules, journal, ledger and trial balance","hi":"दोहरा लेखा: स्वर्णिम नियम, रोज़नामचा, खाता-बही और तलपट","blocks":[{"k":"hot","h":"Most asked: the <b>golden rules<\/b> and the <b>type of account<\/b> (personal, real, nominal), journal entries for <b>drawings, free samples, loss by fire, discount and bad debts<\/b>, which side of the <b>trial balance<\/b> an item goes on, and which errors a trial balance <b>cannot<\/b> find."},{"k":"story","h":"<p>Under the <b>double entry system<\/b>, described by the Italian monk <b>Luca Pacioli<\/b> in 1494, every transaction touches at least two accounts: one is debited and another is credited with the same amount. So the total of all debits always equals the total of all credits.<\/p><p>A transaction is first written in date order in the <b>journal<\/b> (the book of original or prime entry). Each line is then <b>posted<\/b> to its account in the <b>ledger<\/b> (the principal book). At the end of a period the balance of every ledger account is listed in a <b>trial balance<\/b>; if the two columns agree, the books are at least arithmetically correct.<\/p>","key":"Personal — receiver/giver; Real — comes in/goes out; Nominal — expenses and losses/incomes and gains."},{"k":"table","title":"The golden rules","head":["Type of account","Debit","Credit"],"rows":[["Personal (natural, artificial, representative)","The receiver","The giver"],["Real (tangible and intangible assets)","What comes in","What goes out"],["Nominal (expenses, losses, incomes, gains)","All expenses and losses","All incomes and gains"]]},{"k":"table","title":"The modern (accounting equation) rules","head":["Account","Increase","Decrease"],"rows":[["Assets","Debit","Credit"],["Expenses and losses","Debit","Credit"],["Drawings","Debit","Credit"],["Liabilities","Credit","Debit"],["Capital","Credit","Debit"],["Revenue and gains","Credit","Debit"]]},{"k":"table","title":"Which type of account?","head":["Account","Type","Why"],"rows":[["Ramesh (a customer)","Personal account","Natural person."],["State Bank of India","Personal account","Artificial person (a body of persons recognised by law)."],["Capital account","Personal account","The owner is a person; capital is owed to him."],["Drawings account","Personal account","Also linked to the owner."],["Outstanding salary account","Personal account","Representative personal — stands for the employees who are owed."],["Prepaid insurance account","Personal account","Representative personal — the insurer owes the service."],["Machinery account","Real account","Tangible asset."],["Goodwill account","Real account","Intangible asset."],["Cash account","Real account","Cash is a thing the business owns."],["Purchases account","Nominal account","Treated as an expense account for goods."],["Salaries account","Nominal account","Expense."],["Discount received account","Nominal account","Gain."],["Loss by fire account","Nominal account","Loss."],["Commission received account","Nominal account","Income."]]},{"k":"table","title":"Journal entries that are asked again and again","head":["Transaction","Entry","Note"],"rows":[["Started business with cash","Cash A/c Dr → To Capital A/c",""],["Bought goods on credit from Mohan","Purchases A/c Dr → To Mohan","Goods bought for resale go to Purchases, not to a Goods account."],["Bought furniture on credit from Mohan","Furniture A/c Dr → To Mohan","An asset, so not Purchases."],["Goods taken by the owner for personal use","Drawings A/c Dr → To Purchases A/c","Recorded at cost."],["Goods given away as free samples","Advertisement A/c Dr → To Purchases A/c",""],["Goods worth ₹5,000 lost by fire; insurer admits ₹3,000","Loss by fire A/c Dr 2,000 + Insurance claim A/c Dr 3,000 → To Purchases A/c 5,000","Compound entry."],["Paid Mohan ₹9,800 in full settlement of ₹10,000","Mohan Dr 10,000 → To Cash 9,800, To Discount received 200","Cash discount is recorded; trade discount is not."],["A debtor becomes insolvent; ₹1,500 cannot be recovered","Bad debts A/c Dr → To Debtor",""],["Bad debt written off last year now recovered","Cash A/c Dr → To Bad debts recovered A/c","The debtor's account is not revived."],["Depreciation on machinery","Depreciation A/c Dr → To Machinery A/c",""],["Interest on capital allowed","Interest on capital A/c Dr → To Capital A/c",""]]},{"k":"table","title":"Trial balance: which side?","head":["Balance","Side","Why"],"rows":[["Opening stock","Debit","An asset brought forward."],["Purchases","Debit","Expense side."],["Sales","Credit","Income."],["Sales returns (returns inward)","Debit","Reduce sales."],["Purchases returns (returns outward)","Credit","Reduce purchases."],["Capital","Credit","Owed to the owner."],["Drawings","Debit","Reduce capital."],["Sundry debtors","Debit","Assets."],["Sundry creditors","Credit","Liabilities."],["Bank overdraft","Credit","A liability to the bank."],["Bills receivable","Debit","Asset."],["Bills payable","Credit","Liability."],["Provision for doubtful debts","Credit","A provision is a credit balance."],["Discount allowed","Debit","Loss."],["Discount received","Credit","Gain."],["Carriage inwards","Debit","Direct expense."],["Outstanding wages","Credit","Liability."],["Prepaid rent","Debit","Asset."],["Loan taken from a bank","Credit","Liability."],["Interest received","Credit","Income."],["Bad debts","Debit","Loss."],["Goodwill","Debit","Asset."]]},{"k":"facts","title":"Ledger and trial balance in brief","rows":[["Posting","Transferring each journal entry to the accounts concerned in the ledger"],["Balancing","Total the bigger side; the difference is written as 'balance c/d' and brought down as 'balance b/d'"],["Debit balance","Assets, expenses, losses, drawings"],["Credit balance","Capital, liabilities, incomes, gains, provisions"],["Methods of preparing a trial balance","Total method, balance method, total-cum-balance method"],["What it proves","Only the arithmetical accuracy of posting and balancing"],["Errors it cannot reveal","Complete omission, errors of principle, compensating errors, wrong account on the correct side, wrong amount in the book of original entry"],["Closing stock","Usually not in the trial balance; it comes in through the closing entry (Closing stock A/c Dr → To Trading A/c)"]]},{"k":"ex","h":"<p><b>Worked example — trial balance that does not agree.<\/b> Debit column total ₹2,45,600; credit column total ₹2,48,000.<\/p><p><b>Step 1:<\/b> the debit side is short by 2,48,000 − 2,45,600 = <b>₹2,400<\/b>. <b>Step 2:<\/b> to make the two sides agree, a <b>Suspense account<\/b> of ₹2,400 is placed on the <b>debit<\/b> side. <b>Step 3:<\/b> when the errors are found and corrected, the suspense account closes (see F5).<\/p>"},{"k":"ex","h":"<p><b>Worked example — classify, then apply the rule.<\/b> 'Paid rent ₹6,000 by cheque.' Rent is <b>nominal<\/b> (an expense) → debit. Bank is a <b>personal<\/b> (artificial) account, and it gives → credit. Entry: <b>Rent A/c Dr ₹6,000 → To Bank A/c ₹6,000<\/b>.<\/p>"},{"k":"trick","h":"<b>“PRN = Receiver, Real, Nominal”<\/b>: ask first <i>Is it a person? a thing? an expense or income?<\/i> — then the rule writes itself. On the trial balance: <b>“DEAD CLIC”<\/b> — <b>D<\/b>ebit: <b>E<\/b>xpenses, <b>A<\/b>ssets, <b>D<\/b>rawings; <b>C<\/b>redit: <b>L<\/b>iabilities, <b>I<\/b>ncome, <b>C<\/b>apital."},{"k":"trap","h":"<b>Capital<\/b> and <b>drawings<\/b> are <b>personal<\/b> accounts, not nominal. <b>Outstanding<\/b> and <b>prepaid<\/b> expense accounts are <b>representative personal<\/b>, not nominal. Goods withdrawn by the owner are credited to <b>Purchases<\/b>, not Sales. A <b>trade discount<\/b> never enters the books."}],"sum":["Double entry: every debit has an equal credit; Luca Pacioli described it in 1494.","Personal: debit the receiver, credit the giver. Real: debit what comes in, credit what goes out. Nominal: debit expenses and losses, credit incomes and gains.","Capital, drawings, banks and outstanding or prepaid expenses are personal accounts; goodwill is a real (intangible) account.","Drawings of goods: Drawings Dr, To Purchases. Free samples: Advertisement Dr, To Purchases.","Journal = book of original entry; ledger = principal book.","A trial balance proves only arithmetical accuracy; errors of principle, compensating errors and complete omissions stay hidden.","Debit side: assets, expenses, losses, drawings, sales returns. Credit side: capital, liabilities, incomes, purchases returns, provisions."],"part":["Part 1 · Foundations and the books of account","आधार और लेखा पुस्तकें"],"g":"fa"},
{"id":"F3","heat":3,"title":"Subsidiary books and the cash book","hi":"सहायक पुस्तकें और रोकड़ बही","blocks":[{"k":"hot","h":"Most asked: which <b>subsidiary book<\/b> records a transaction (credit purchase of an asset is a favourite trap), <b>debit note vs credit note<\/b>, <b>contra entries<\/b>, the <b>discount columns<\/b> of a triple-column cash book, and the <b>imprest<\/b> system of petty cash."},{"k":"story","h":"<p>A busy firm cannot pass a journal entry for every sale. So the journal is split into <b>special journals<\/b> — subsidiary books — each for one kind of transaction: credit purchases of goods, credit sales of goods, returns each way, bills, and cash. Only what fits none of them goes to the <b>journal proper<\/b>.<\/p><p>The <b>cash book<\/b> is special: it is a book of original entry <i>and<\/i> a ledger at the same time, because the cash and bank accounts are kept in it. The periodic totals of the purchases and sales books are posted to the Purchases and Sales accounts; the individual suppliers and customers are posted line by line.<\/p>","key":"Goods on credit → purchases or sales book; assets on credit → journal proper; any cash or bank → cash book."},{"k":"table","title":"Transaction → book","head":["Transaction","Book","Note"],"rows":[["Goods bought on credit from Sohan","Purchases book","Credit purchases of goods only."],["Goods sold on credit to Meena","Sales book","Credit sales of goods only."],["Goods returned to Sohan","Purchases returns book","Also called the returns outward book; a debit note is sent."],["Goods returned by Meena","Sales returns book","Also called the returns inward book; a credit note is sent."],["Furniture bought on credit","Journal proper","Not goods for resale, so not the purchases book."],["Old machine sold on credit","Journal proper","An asset, not goods."],["A bill accepted by a debtor received","Bills receivable book",""],["A bill accepted in favour of a creditor","Bills payable book",""],["Cash sales of goods","Cash book","All cash and bank transactions go to the cash book."],["Rent paid by cheque","Cash book",""],["Opening entry at the start of the year","Journal proper",""],["Rectification of an error","Journal proper",""],["Depreciation charged on machinery","Journal proper","An adjustment entry."],["Bad debts written off","Journal proper",""],["Postage, cartage and small office expenses","Petty cash book","Kept on the imprest system."]]},{"k":"table","title":"Source documents","head":["Document","Prepared by","Recorded in"],"rows":[["Invoice (bill)","Seller, on a credit sale","Seller's sales book; buyer's purchases book"],["Debit note","Buyer, when returning goods to the supplier","Buyer's purchases returns book"],["Credit note","Seller, when goods come back from a customer","Seller's sales returns book"],["Cash memo","Seller, on a cash sale","Cash book"],["Voucher","Anyone paying or receiving","The evidence behind every entry"]]},{"k":"table","title":"Kinds of cash book","head":["Cash book","Columns","Note"],"rows":[["Single column","Cash","Works as the cash account"],["Double column","Cash and bank (or cash and discount)",""],["Triple column","Cash, bank and discount","Discount columns are memorandum only; their totals are posted"],["Petty cash book","Small expenses","Imprest system: a fixed float is restored at the end of each period"],["Analytical petty cash book","A column for each kind of small expense","Postage, stationery, cartage, conveyance…"]]},{"k":"facts","title":"Rules of the cash book","rows":[["Contra entry","An entry on both sides of the cash book — cash deposited into the bank, or cash withdrawn from the bank for office use; marked 'C'"],["Cash column","Can never have a credit balance — you cannot pay out more cash than you hold"],["Bank column credit balance","Means a bank overdraft"],["Discount on the receipts (debit) side","Discount allowed — its total is debited to Discount allowed A/c"],["Discount on the payments (credit) side","Discount received — its total is credited to Discount received A/c"],["Cash withdrawn for the owner's own use","Not a contra entry: Drawings A/c Dr, To Bank"]]},{"k":"ex","h":"<p><b>Worked example — triple-column cash book.<\/b> 1 April: cash ₹10,000, bank ₹25,000. 3 Apr received ₹4,900 cash from Arun, discount allowed ₹100. 5 Apr deposited ₹6,000 into the bank (C). 8 Apr paid Bina ₹7,800 by cheque, discount received ₹200. 12 Apr cash sales ₹3,000. 15 Apr withdrew ₹2,000 from the bank for office use (C). 20 Apr paid wages ₹1,500 in cash. 25 Apr received a cheque of ₹5,000 from Chetan and banked it the same day.<\/p><p><b>Cash:<\/b> 10,000 + 4,900 − 6,000 + 3,000 + 2,000 − 1,500 = <b>₹12,400<\/b>. <b>Bank:<\/b> 25,000 + 6,000 − 7,800 − 2,000 + 5,000 = <b>₹26,200<\/b>.<\/p><p><b>Discount:<\/b> ₹100 is debited to Discount allowed A/c; ₹200 is credited to Discount received A/c. Arun is credited with ₹5,000 and Bina debited with ₹8,000.<\/p>"},{"k":"ex","h":"<p><b>Worked example — imprest petty cash.<\/b> The petty cashier holds an imprest of ₹5,000. During the month she spends ₹3,640. At the month's end the main cashier pays her <b>₹3,640<\/b> — exactly what was spent — so she starts the next month with ₹5,000 again (1,360 left + 3,640).<\/p>"},{"k":"trick","h":"<b>Debit note goes with the goods going out<\/b> (purchase return); <b>credit note goes with the goods coming back<\/b> (sales return) — the note is named after what it does to the <i>other<\/i> party's account in your books."},{"k":"trap","h":"Furniture or machinery bought <b>on credit<\/b> goes to the <b>journal proper<\/b>, not the purchases book. A cheque received and banked the same day is a <b>bank<\/b> entry, not a contra. Cash withdrawn for <b>personal<\/b> use is <b>drawings<\/b>, not a contra entry."}],"sum":["Subsidiary books: purchases, sales, purchases returns, sales returns, bills receivable, bills payable, cash book, journal proper.","Purchases and sales books record credit transactions in goods only; credit purchase of an asset goes to the journal proper.","Debit note — goods returned to a supplier; credit note — goods returned by a customer.","The cash book is both a book of original entry and a ledger.","Contra entry: both cash and bank columns, e.g. cash deposited into the bank.","Cash column never shows a credit balance; a credit bank balance is an overdraft.","Petty cash on the imprest system: the amount spent is reimbursed."],"part":["Part 1 · Foundations and the books of account","आधार और लेखा पुस्तकें"],"g":"fa"},
{"id":"F4","heat":3,"title":"Bank reconciliation statement","hi":"बैंक समाधान विवरण","blocks":[{"k":"hot","h":"Most asked: a <b>BRS numerical<\/b> with four to six items — add or less? — starting from the cash book or from the pass book, the <b>overdraft<\/b> version, and <b>why<\/b> the two balances differ."},{"k":"story","h":"<p>A firm keeps its bank account in the bank column of its cash book; the bank keeps the same account from its own side and sends a copy, the <b>pass book<\/b> (bank statement). On any date the two balances rarely match. Some items are in one record but not yet in the other: cheques written but not yet presented, cheques banked but not yet cleared, bank charges, interest, direct deposits, payments under standing instructions. Errors on either side add more.<\/p><p>A <b>bank reconciliation statement (BRS)<\/b> starts from one balance, adds or subtracts each such item, and arrives at the other. It is a <b>statement<\/b> prepared by the firm, not an account.<\/p>","key":"Ask one question for each item: does it make the balance I am moving towards bigger or smaller?"},{"k":"table","title":"Starting from the cash book (debit) balance: add or less?","head":["Item","Add / Less","Why"],"rows":[["Cheques issued but not yet presented for payment","Add","The bank has not paid them yet, so its balance is higher."],["Cheques deposited but not yet collected (credited) by the bank","Less","Entered in the cash book, not yet in the pass book."],["Bank charges debited only in the pass book","Less",""],["Interest allowed by the bank, credited only in the pass book","Add",""],["Amount paid directly into the bank by a customer","Add","Not known to the firm yet."],["Insurance premium paid by the bank on standing instructions","Less",""],["Dividend collected by the bank on the firm's behalf","Add",""],["A deposited cheque dishonoured, shown only in the pass book","Less",""],["Interest on overdraft charged by the bank","Less",""],["Debit side of the cash book (bank column) overcast","Less","The cash book balance is too high."],["Credit side of the cash book (bank column) overcast","Add","The cash book balance is too low."],["A cheque issued for ₹1,250 entered in the cash book as ₹1,520","Add","Add ₹270 — the cash book shows ₹270 too little."],["A cheque received for ₹900 entered in the cash book as ₹600","Add","Add ₹300 — the bank credited the full ₹900."],["The bank wrongly debited the firm's account with another customer's cheque","Less","The pass book balance is too low."]]},{"k":"facts","title":"Balances and their names","rows":[["Favourable balance","Debit in the cash book = credit in the pass book (the bank owes you)"],["Overdraft","Credit in the cash book = debit in the pass book (you owe the bank)"],["Starting from the pass book","Reverse every sign in the table"],["Starting from an overdraft","Treat the overdraft as a minus figure, or reverse the signs; a minus answer means an overdraft"],["Amended cash book","First enter in the cash book what only the bank knew (charges, interest, direct deposits, dishonours); then the BRS needs only the timing items"],["Who prepares it","The account holder, usually monthly when the statement arrives"]]},{"k":"ex","h":"<p><b>Worked example — favourable balance.<\/b> On 31 March the cash book shows a debit balance of ₹42,000. (i) Cheques issued ₹12,500 not yet presented. (ii) Cheques deposited ₹8,000 not yet cleared. (iii) Bank charges ₹300. (iv) Interest credited ₹600. (v) A customer paid ₹4,200 directly into the bank. (vi) The bank paid an insurance premium of ₹1,500.<\/p><p><b>Add:<\/b> 12,500 + 600 + 4,200 = 17,300. <b>Less:<\/b> 8,000 + 300 + 1,500 = 9,800.<\/p><p>Balance as per pass book = 42,000 + 17,300 − 9,800 = <b>₹49,500<\/b>.<\/p>"},{"k":"ex","h":"<p><b>Worked example — overdraft.<\/b> The cash book shows an overdraft of ₹20,000. Cheques issued ₹5,000 not presented; cheques deposited ₹3,000 not credited; interest on overdraft ₹400 charged by the bank.<\/p><p>Write the overdraft as −20,000. Cheques not presented make the bank balance better: −20,000 + 5,000 = −15,000. Deposits not credited make it worse: −15,000 − 3,000 = −18,000. Interest charged: −18,000 − 400 = −18,400.<\/p><p>Overdraft as per pass book = <b>₹18,400<\/b>.<\/p>"},{"k":"trick","h":"<b>“Issued — Increase, Deposited — Deduct”<\/b> when you start from the cash book. Anything the bank <b>gave<\/b> you (interest, direct deposit, dividend) is added; anything it <b>took<\/b> (charges, premium, dishonour) is deducted."},{"k":"trap","h":"If the question starts from the <b>pass book<\/b> or from an <b>overdraft<\/b>, every sign flips. A debit balance in the <b>pass book<\/b> is an <b>overdraft<\/b>, not a favourable balance. A BRS is <b>not<\/b> part of the double entry books."}],"sum":["A BRS explains the difference between the cash book's bank balance and the pass book balance on a date.","From a cash book debit balance: add cheques issued not presented, interest and direct deposits; deduct cheques deposited not cleared, bank charges and payments by the bank.","Starting from the pass book, or from an overdraft, reverse the signs.","Cash book debit = pass book credit = favourable; cash book credit = pass book debit = overdraft.","An amended cash book first records items known only to the bank.","The BRS is a statement prepared by the account holder, not an account."],"part":["Part 1 · Foundations and the books of account","आधार और लेखा पुस्तकें"],"g":"fa"},
{"id":"F5","heat":3,"title":"Rectification of errors and the suspense account","hi":"अशुद्धियों का सुधार और उचंत खाता","blocks":[{"k":"hot","h":"Most asked: naming the <b>type of error<\/b> (omission, commission, principle, compensating), whether it <b>affects the trial balance<\/b>, the <b>rectifying entry<\/b>, the <b>effect on profit<\/b>, and the opening balance of a <b>suspense account<\/b>."},{"k":"story","h":"<p>Errors creep in at two stages: when a transaction is written in a book of original entry, and when it is posted to the ledger. Some errors are <b>one-sided<\/b> — only one account is wrong — and they throw the trial balance out. Others are <b>two-sided<\/b> — both accounts are wrong by the same amount — and the trial balance still agrees.<\/p><p>When the trial balance does not agree and the accounts must be prepared, the difference is parked in a <b>suspense account<\/b>. As each one-sided error is found, the correcting entry uses the suspense account as the other side, until it closes.<\/p>","key":"One-sided error → suspense account in the rectifying entry; two-sided error → correct the two accounts directly."},{"k":"table","title":"Error → type","head":["Error","Type","Note"],"rows":[["A credit sale to Ravi is not entered in any book","Error of omission","Complete omission — the trial balance still agrees."],["A credit sale is entered in the sales book but not posted to Ravi's account","Error of omission","Partial omission — the trial balance does not agree."],["₹540 received from Asha is posted to her account as ₹450","Error of commission","Wrong amount posted."],["Cash received from Ram is credited to Shyam's account","Error of commission","Wrong account of the same class."],["The sales book is undercast by ₹1,000","Error of commission","A casting (totalling) error."],["A debit is posted to the credit side of an account","Error of commission","Posting to the wrong side."],["Purchase of machinery is debited to Purchases account","Error of principle","Capital expenditure treated as revenue."],["Repairs to a building are debited to Building account","Error of principle","Revenue expenditure treated as capital."],["Wages paid for installing a new machine are debited to Wages account","Error of principle","They are part of the machine's cost."],["Sale of old furniture is credited to Sales account","Error of principle","A capital receipt treated as revenue."],["Wages account is overcast by ₹500 and Commission received account is also overcast by ₹500","Compensating errors","One cancels the other."],["Purchases account is undercast by ₹200 and Sales account is undercast by ₹200","Compensating errors","Debit short and credit short by the same amount."]]},{"k":"table","title":"Does it affect the trial balance?","head":["Error","Effect","Note"],"rows":[["Wrong totalling of the purchases book","Affects the trial balance",""],["Posting only one side of a journal entry","Affects the trial balance",""],["Posting an amount to the wrong side of an account","Affects the trial balance",""],["Wrong balancing of a ledger account","Affects the trial balance",""],["Posting a wrong amount in one ledger account only","Affects the trial balance",""],["Omitting a transaction completely","Does not affect the trial balance",""],["An error of principle","Does not affect the trial balance",""],["Two compensating errors","Does not affect the trial balance",""],["Posting to the wrong person's account on the correct side","Does not affect the trial balance",""],["Entering a wrong amount in the book of original entry","Does not affect the trial balance","Both sides carry the same wrong figure."]]},{"k":"table","title":"Rectifying entries","head":["Error","Rectifying entry","Effect before rectification"],"rows":[["Sales book undercast by ₹1,000","Suspense A/c Dr 1,000 → To Sales A/c 1,000","Profit understated ₹1,000"],["₹500 received from Ram credited to Shyam","Shyam Dr 500 → To Ram 500","No effect on profit"],["Repairs to building ₹2,000 debited to Building A/c","Repairs A/c Dr 2,000 → To Building A/c 2,000","Profit overstated ₹2,000"],["Furniture ₹8,000 passed through the purchases book","Furniture A/c Dr 8,000 → To Purchases A/c 8,000","Profit understated ₹8,000"],["Discount allowed ₹300 not posted to Discount account","Discount allowed A/c Dr 300 → To Suspense A/c 300","Profit overstated ₹300"],["Credit sale of ₹1,200 posted to Mohan's account as ₹2,100","Suspense A/c Dr 900 → To Mohan 900","No effect on profit"],["Goods sold to Arun ₹5,000 entered in the purchases book","Arun Dr 10,000 → To Purchases 5,000, To Sales 5,000","Profit understated ₹10,000"],["Old machinery sold for ₹6,000 credited to Sales A/c","Sales A/c Dr 6,000 → To Machinery A/c 6,000","Profit overstated (sales too high)"]]},{"k":"ex","h":"<p><b>Worked example — the suspense account.<\/b> A trial balance did not agree and the difference was put to suspense. Later three errors were found: (a) the sales book was undercast by ₹1,000; (b) discount allowed of ₹300 was not posted to Discount allowed account; (c) a credit sale of ₹1,200 was posted to Mohan's account as ₹2,100.<\/p><p><b>Step 1 — effect on the trial balance:<\/b> (a) credit side short ₹1,000; (b) debit side short ₹300; (c) debit side ₹900 too much. Net: the debit side was ₹600 too high and the credit side ₹1,000 too low, so debits exceeded credits by <b>₹1,600<\/b>.<\/p><p><b>Step 2:<\/b> the suspense account opened with a <b>credit<\/b> of ₹1,600. <b>Step 3 — rectifications:<\/b> (a) Suspense Dr 1,000; (b) Suspense Cr 300; (c) Suspense Dr 900. Debits 1,900 = credits 1,600 + 300. The account closes.<\/p>"},{"k":"facts","title":"When the error is found","rows":[["Before the trial balance","Correct the account itself with a note, or pass a journal entry"],["After the trial balance, before final accounts","Journal entry, using the suspense account for one-sided errors"],["After final accounts (next year)","Nominal account errors are corrected through the Profit and Loss Adjustment account, because last year's nominal accounts are closed"],["Clerical errors","Omission, commission and compensating errors; an error of principle is not clerical"]]},{"k":"trick","h":"For profit, think of the <b>nominal<\/b> account that was wrong: an expense <b>overstated<\/b> or an income <b>understated<\/b> means profit was <b>understated<\/b> — and the other way round. Errors between two <b>personal<\/b> or two <b>real<\/b> accounts do not touch profit."},{"k":"trap","h":"Wages paid to install a machine debited to Wages is an <b>error of principle<\/b>, not commission. A <b>complete<\/b> omission does not affect the trial balance; a <b>partial<\/b> omission does. An error in the <b>book of original entry<\/b> (wrong amount in the sales book for one sale) is two-sided."}],"sum":["Errors: omission (complete or partial), commission, principle, compensating.","Errors of principle mix up capital and revenue items; they never affect the trial balance.","One-sided errors affect the trial balance and are rectified through the suspense account.","Complete omission, errors of principle, compensating errors and wrong account on the correct side do not affect the trial balance.","Suspense opens on the side that is short; after all corrections it closes.","After final accounts, nominal-account errors are corrected through a P&L Adjustment account.","An expense overstated (or income understated) understates profit."],"part":["Part 1 · Foundations and the books of account","आधार और लेखा पुस्तकें"],"g":"fa"},
{"id":"F6","heat":3,"title":"Depreciation, provisions and reserves","hi":"मूल्यह्रास, प्रावधान और संचय","blocks":[{"k":"hot","h":"Most asked: <b>SLM vs WDV<\/b> (features and a three-year numerical), which method suits <b>mines, loose tools or leases<\/b>, <b>profit or loss on sale<\/b> of an asset, and the difference between a <b>provision<\/b> and a <b>reserve<\/b>."},{"k":"story","h":"<p>A delivery van bought for ₹6,00,000 will not last for ever. Each year it wears out a little, and new models make it look older still. <b>Depreciation<\/b> is the share of the van's cost that is used up in each year; charging it against that year's revenue gives a true profit (matching) and shows the van at a fair figure in the balance sheet.<\/p><p>Three things decide the charge: the <b>cost<\/b> (price plus freight and installation), the <b>useful life<\/b> and the expected <b>scrap value<\/b>. Then a <b>method<\/b> spreads the depreciable amount over the years. Land is not depreciated; mines are <b>depleted<\/b>; patents and goodwill are <b>amortised<\/b>.<\/p>","key":"SLM: same amount every year. WDV: same rate every year, on a falling balance."},{"k":"table","title":"Methods of depreciation","head":["Method","How the charge is worked out","Note"],"rows":[["Straight line method (SLM)","Equal charge every year: (cost − scrap) ÷ useful life","Also called the fixed instalment or original cost method."],["Written down value method (WDV)","A fixed rate on the falling book value; the charge falls every year","Also called the reducing or diminishing balance method; the book value never reaches zero."],["Sum of years' digits method","A falling fraction of the depreciable amount: remaining life ÷ sum of the years' digits",""],["Annuity method","Allows interest on the money locked up in the asset","Used for leases."],["Depreciation fund (sinking fund) method","The yearly charge is invested outside the business to replace the asset",""],["Insurance policy method","A policy is taken out that pays the replacement cost at the end of the asset's life",""],["Revaluation method","The asset is valued every year; the fall in value is the depreciation","Used for loose tools, livestock, patterns."],["Depletion method","Charge per unit of mineral extracted","Used for mines, quarries and oil wells."],["Machine hour rate method","Charge per hour the machine actually runs",""],["Production units method","Charge per unit produced","Suits assets whose wear follows output."]]},{"k":"table","title":"SLM and WDV side by side","head":["Point","SLM","WDV"],"rows":[["Charge each year","Same","Falls each year"],["Charged on","Original cost","Book value at the start of the year"],["Book value at the end","Can become zero (or scrap value)","Never becomes zero"],["Total cost of the asset over its life","Repairs rise later, depreciation stays flat — total charge rises","Repairs rise as depreciation falls — total charge evens out"],["Recognised by the Income-tax Act","No (except for some power undertakings)","Yes, on blocks of assets"],["Suits","Assets with little repair, leases, patents","Plant and machinery, vehicles"]]},{"k":"facts","title":"Words and rules","rows":[["Causes","Wear and tear, passage of time, obsolescence, depletion, accidents"],["Depreciable amount","Cost − residual (scrap) value"],["Cost includes","Purchase price, freight, installation, trial-run costs"],["WDV rate","R = 1 − (scrap ÷ cost)^(1/n)"],["Provision for depreciation method","The asset stays at cost; accumulated depreciation is built up in a separate account and deducted in the balance sheet"],["Change of method","Under AS 10 (Revised) it is a change in accounting estimate, applied from then on"],["Provision","A charge against profit for a known liability or loss whose amount is uncertain — doubtful debts, depreciation, taxation"],["Reserve","An appropriation of profit kept back to strengthen the business — general reserve, dividend equalisation reserve"],["Capital reserve","Built from capital profits — profit on sale or revaluation of fixed assets, profit prior to incorporation"],["Secret reserve","A hidden reserve created by excess depreciation or undervaluing assets"]]},{"k":"ex","h":"<p><b>Worked example — SLM.<\/b> A machine costs ₹1,00,000 plus ₹10,000 installation. Scrap value ₹10,000; life 10 years.<\/p><p>Depreciable amount = 1,10,000 − 10,000 = 1,00,000. Annual depreciation = 1,00,000 ÷ 10 = <b>₹10,000<\/b> every year.<\/p>"},{"k":"ex","h":"<p><b>Worked example — WDV at 10%.<\/b> Cost ₹2,00,000.<\/p><p>Year 1: 10% of 2,00,000 = 20,000 → book value 1,80,000. Year 2: 18,000 → 1,62,000. Year 3: 16,200 → <b>1,45,800<\/b>. Year 4: 14,580 → 1,31,220. The charge falls every year and the balance never reaches zero.<\/p>"},{"k":"ex","h":"<p><b>Worked example — sale of an asset.<\/b> A machine bought on 1 April 2022 for ₹50,000 is depreciated at 10% a year on SLM and sold on 31 March 2025 for ₹32,000.<\/p><p>Depreciation for 3 years = 3 × 5,000 = 15,000. Book value = 50,000 − 15,000 = 35,000. Sale price 32,000 → <b>loss of ₹3,000<\/b>, debited to P&amp;L.<\/p>"},{"k":"ex","h":"<p><b>Worked example — other methods.<\/b> <i>Sum of years' digits:<\/i> cost ₹60,000, no scrap, life 3 years; digits 3 + 2 + 1 = 6. Year 1 = 3/6 × 60,000 = 30,000; year 2 = 20,000; year 3 = 10,000.<\/p><p><i>Machine hour rate:<\/i> cost ₹1,00,000, scrap ₹10,000, life 30,000 hours → ₹3 an hour; 4,500 hours this year → <b>₹13,500<\/b>.<\/p><p><i>Depletion:<\/i> a mine bought for ₹20,00,000 holds 4,00,000 tonnes → ₹5 a tonne; 50,000 tonnes raised → ₹2,50,000.<\/p>"},{"k":"trick","h":"Match the method to the asset: <b>“Mines Deplete, Tools Revalue, Leases Annuity, Machines run by the Hour”<\/b>."},{"k":"trap","h":"<b>Freehold land<\/b> is not depreciated, but <b>leasehold<\/b> land is written off over the lease. A <b>provision<\/b> is a charge against profit (made even in a loss year); a <b>reserve<\/b> is an appropriation of profit. Depreciation is a <b>non-cash<\/b> expense — it does not take cash out of the business."}],"sum":["Depreciation is the gradual fall in the value of a fixed asset from use, time and obsolescence.","SLM: (cost − scrap) ÷ life, the same amount each year. WDV: fixed rate on book value, a falling amount; never zero.","Depletion — mines; revaluation — loose tools and livestock; annuity — leases; machine hour — machines.","Freehold land is not depreciated; intangibles are amortised.","Profit or loss on sale = sale price − book value on the date of sale.","Provision: charge against profit for a known liability; reserve: appropriation of profit.","Capital reserve comes from capital profits; secret reserve is hidden."],"part":["Part 2 · Depreciation, bills and final accounts","मूल्यह्रास, विनिमय पत्र और अंतिम खाते"],"g":"fa"},
{"id":"F7","heat":3,"title":"Bills of exchange and promissory notes","hi":"विनिमय पत्र और प्रतिज्ञा पत्र","blocks":[{"k":"hot","h":"Most asked: the <b>parties<\/b> to a bill, the <b>due date<\/b> with three days of grace, entries on <b>discounting, dishonour, renewal and retirement<\/b>, <b>noting charges<\/b>, and the difference between a <b>bill<\/b> and a <b>promissory note<\/b>."},{"k":"story","h":"<p>Gopal sells cloth worth ₹20,000 to Hari, who will pay in three months. To make the debt firm, Gopal writes an order — a <b>bill of exchange<\/b> — telling Hari to pay ₹20,000 after three months. Hari signs it as 'accepted'. Gopal (the <b>drawer<\/b>) now holds a document he can keep till the due date, <b>discount<\/b> with his bank for cash today, or <b>endorse<\/b> to his own creditor. Hari (the <b>drawee<\/b>, now the <b>acceptor<\/b>) must pay on the due date, or the bill is <b>dishonoured<\/b>.<\/p><p>The law is the <b>Negotiable Instruments Act, 1881<\/b>: Section 4 defines a promissory note, Section 5 a bill of exchange and Section 6 a cheque.<\/p>","key":"Due date = date of drawing + term + 3 days of grace; a holiday pulls it one day earlier."},{"k":"table","title":"Terms → meaning","head":["Term","Meaning","Note"],"rows":[["Drawer","The creditor who writes (draws) the bill",""],["Drawee","The debtor on whom the bill is drawn; on accepting it he becomes the acceptor",""],["Payee","The person to whom the money is to be paid",""],["Days of grace","Three extra days added to the term of a bill (Section 22, NI Act)","Not for bills payable on demand or at sight."],["Discounting","Encashing a bill with a bank before maturity, less a charge",""],["Endorsement","Transfer of a bill by signing on its back",""],["Noting","A notary public's record of the fact of dishonour","Noting charges are recovered from the drawee."],["Protest","A formal certificate of dishonour issued by a notary public",""],["Retirement","Payment of a bill before its due date, with a rebate",""],["Renewal","Cancelling a bill the drawee cannot meet and drawing a new one, usually with interest",""],["Accommodation bill","A bill drawn without any trade, only to help a party raise money",""],["Maker","The person who signs a promissory note and promises to pay",""]]},{"k":"table","title":"Bill of exchange and promissory note","head":["Point","Bill of exchange (Section 5)","Promissory note (Section 4)"],"rows":[["Contains","An unconditional order to pay","An unconditional promise to pay"],["Parties","Three — drawer, drawee, payee (drawer and payee may be the same)","Two — maker and payee"],["Acceptance","Needed (for a time bill)","Not needed — the maker himself promises"],["Drawn by","The creditor","The debtor (maker)"],["Payable to bearer","Yes, except one payable to bearer on demand","Not payable to bearer"],["Notice of dishonour","Must be given to the drawer and endorsers","Not needed to the maker"]]},{"k":"table","title":"Entries in the books of the drawer and the drawee","head":["Event","Drawer's books","Drawee's books"],"rows":[["Bill drawn and accepted","Bills receivable A/c Dr → To Drawee","Drawer Dr → To Bills payable A/c"],["Bill discounted with the bank","Bank A/c Dr, Discount on bills A/c Dr → To Bills receivable A/c","No entry"],["Bill endorsed to a creditor","Creditor Dr → To Bills receivable A/c","No entry"],["Bill sent to the bank for collection","Bills sent for collection A/c Dr → To Bills receivable A/c","No entry"],["Bill met at maturity (held by the drawer)","Bank A/c Dr → To Bills receivable A/c","Bills payable A/c Dr → To Bank A/c"],["Bill dishonoured (held by the drawer), noting charges paid","Drawee Dr → To Bills receivable A/c, To Cash (noting charges)","Bills payable A/c Dr, Noting charges A/c Dr → To Drawer"],["Bill dishonoured after discounting","Drawee Dr → To Bank A/c","Bills payable A/c Dr → To Drawer"],["Bill dishonoured after endorsement","Drawee Dr → To Endorsee (creditor)","Bills payable A/c Dr → To Drawer"],["Bill retired early with a rebate","Bank A/c Dr, Rebate on bills A/c Dr → To Bills receivable A/c","Bills payable A/c Dr → To Bank A/c, To Rebate on bills A/c"]]},{"k":"ex","h":"<p><b>Worked example — due dates.<\/b> (a) Dated 15 January, payable 2 months after date: 15 March + 3 days = <b>18 March<\/b>. If 18 March is a public holiday, the bill is due on <b>17 March<\/b> (the preceding business day).<\/p><p>(b) Dated 10 March, payable 60 days after date: count 21 days in March (11–31), 30 in April (51), 9 in May (60) → 9 May; + 3 days = <b>12 May<\/b>.<\/p><p>(c) Dated 31 January 2025, payable 1 month after date: February has no 31st, so the term ends on 28 February; + 3 days = <b>3 March 2025<\/b>.<\/p>"},{"k":"ex","h":"<p><b>Worked example — money on bills.<\/b> <i>Discounting:<\/i> a 3-month bill of ₹20,000 is discounted at once at 12% a year. Discount = 20,000 × 12% × 3/12 = ₹600; the bank pays <b>₹19,400<\/b>.<\/p><p><i>Dishonour:<\/i> a bill of ₹10,000 is dishonoured and noting charges are ₹100. The drawee now owes <b>₹10,100<\/b>.<\/p><p><i>Renewal:<\/i> the drawee of a ₹15,000 bill pays ₹5,000 in cash and accepts a new 3-month bill for the rest with interest at 12% a year. Interest = 10,000 × 12% × 3/12 = 300; new bill = <b>₹10,300<\/b>.<\/p><p><i>Retirement:<\/i> a ₹12,000 bill is paid 2 months early with a rebate at 6% a year. Rebate = 12,000 × 6% × 2/12 = ₹120; amount paid <b>₹11,880<\/b>.<\/p>"},{"k":"trick","h":"<b>“DRAW-er is the cReditor, drawEE is the dEbtor”<\/b> — the creditor draws, the debtor accepts. For the due date: <b>term + 3<\/b>, and a holiday moves it <b>back<\/b> one day."},{"k":"trap","h":"When a <b>discounted<\/b> bill is dishonoured, the drawer credits the <b>bank<\/b>, not Bills receivable (that account was already closed on discounting). <b>Noting charges<\/b> are paid by the holder but finally borne by the <b>drawee<\/b>. A bill payable <b>on demand<\/b> or <b>at sight<\/b> gets <b>no<\/b> days of grace."}],"sum":["Negotiable Instruments Act 1881: Section 4 promissory note, Section 5 bill of exchange, Section 6 cheque.","A bill is an unconditional order drawn by the creditor (drawer) on the debtor (drawee), who accepts it.","Due date = date of drawing + term + 3 days of grace; if that day is a public holiday, the preceding business day.","The holder may keep, discount, endorse or send the bill for collection.","On dishonour the drawee owes the bill amount plus noting charges.","Renewal: a new bill for the balance plus interest. Retirement: early payment less a rebate.","An accommodation bill is drawn without trade, only to raise funds."],"part":["Part 2 · Depreciation, bills and final accounts","मूल्यह्रास, विनिमय पत्र और अंतिम खाते"],"g":"fa"},
{"id":"F8","heat":3,"title":"Final accounts: trading, P&L, balance sheet and inventory","hi":"अंतिम खाते: व्यापार, लाभ-हानि, तुलन-पत्र और स्टॉक","blocks":[{"k":"hot","h":"Most asked: <b>where an item goes<\/b> (trading, P&L or balance sheet, which side), <b>capital vs revenue<\/b> expenditure, finding <b>cost of goods sold, gross profit and net profit<\/b>, the <b>manufacturing account<\/b>, and <b>AS 2<\/b> (lower of cost and NRV; FIFO or weighted average, no LIFO)."},{"k":"story","h":"<p>At the year's end the trial balance is turned into the <b>final accounts<\/b>. The <b>trading account<\/b> sets sales against the cost of the goods sold — opening stock, purchases and direct expenses less closing stock — and gives the <b>gross profit<\/b>. The <b>profit and loss account<\/b> then takes away the indirect expenses (office, selling, financial) and adds other incomes to give the <b>net profit<\/b>. A factory first prepares a <b>manufacturing account<\/b> to find the cost of the goods it made.<\/p><p>What remains — assets, liabilities and the owner's capital — goes to the <b>balance sheet<\/b>, a statement of the firm's position on the last day. The <b>trading and P&amp;L accounts<\/b> are nominal accounts for a period; the <b>balance sheet<\/b> is a statement on a date.<\/p>","key":"Direct (getting goods ready) → Trading; indirect (running and selling) → P&L; what you own or owe → balance sheet."},{"k":"table","title":"Item → its place in the final accounts","head":["Item","Where it goes","Note"],"rows":[["Opening stock","Trading A/c — debit",""],["Purchases (less returns)","Trading A/c — debit",""],["Carriage inwards","Trading A/c — debit","Cost of bringing goods in."],["Wages","Trading A/c — debit","Direct expense."],["Freight and import duty on purchases","Trading A/c — debit",""],["Power and fuel for the factory","Trading A/c — debit","In a manufacturing concern, the manufacturing account."],["Sales (less returns)","Trading A/c — credit",""],["Closing stock (given as an adjustment)","Trading A/c — credit","And on the assets side of the balance sheet."],["Salaries","P&L A/c — debit","Office expense."],["Office rent and insurance","P&L A/c — debit",""],["Carriage outwards","P&L A/c — debit","Cost of delivering goods to customers."],["Advertisement","P&L A/c — debit","Selling expense."],["Bad debts","P&L A/c — debit",""],["Discount allowed","P&L A/c — debit",""],["Interest on a loan taken","P&L A/c — debit","Financial expense."],["Depreciation","P&L A/c — debit",""],["Discount received","P&L A/c — credit",""],["Commission received","P&L A/c — credit",""],["Rent received","P&L A/c — credit",""],["Interest received on investments","P&L A/c — credit",""],["Machinery","Balance sheet — assets","Fixed asset."],["Sundry debtors","Balance sheet — assets","Current asset."],["Prepaid insurance","Balance sheet — assets",""],["Goodwill","Balance sheet — assets","Intangible asset."],["Capital (plus profit, less drawings)","Balance sheet — liabilities",""],["Sundry creditors","Balance sheet — liabilities",""],["Bank overdraft","Balance sheet — liabilities",""],["Outstanding salaries","Balance sheet — liabilities",""],["Long-term loan from a bank","Balance sheet — liabilities",""],["Bills payable","Balance sheet — liabilities",""]]},{"k":"table","title":"Capital or revenue?","head":["Item","Type","Note"],"rows":[["Purchase of machinery","Capital expenditure",""],["Wages paid for installing a new machine","Capital expenditure","Part of the machine's cost."],["Freight paid on a new machine","Capital expenditure",""],["Legal fees paid on buying a building","Capital expenditure",""],["Overhaul of a second-hand machine before it is first used","Capital expenditure","Puts the asset into working order."],["Repairs to machinery","Revenue expenditure","Keeps the asset working; adds nothing new."],["Salaries, rent and insurance","Revenue expenditure",""],["Replacing a worn-out part to keep a machine running","Revenue expenditure",""],["Depreciation","Revenue expenditure",""],["Heavy advertising to launch a new product","Deferred revenue expenditure","Benefit spread over several years (traditional treatment)."],["Sale of old machinery","Capital receipt",""],["Loan taken from a bank","Capital receipt",""],["Fresh capital brought in by the owner","Capital receipt",""],["Sale of goods","Revenue receipt",""],["Interest received on investments","Revenue receipt",""],["Commission received","Revenue receipt",""]]},{"k":"facts","title":"Formulas","rows":[["Cost of goods sold","Opening stock + net purchases + direct expenses − closing stock"],["Gross profit","Net sales − cost of goods sold"],["Net profit","Gross profit + other incomes − indirect expenses"],["Gross profit ratio","Gross profit ÷ net sales × 100"],["Raw materials consumed","Opening stock of raw materials + purchases − closing stock of raw materials"],["Cost of production","Materials consumed + direct wages + direct expenses + factory overheads + opening work-in-progress − closing work-in-progress − scrap sold"],["Net realisable value","Estimated selling price − cost to complete − cost to sell"]]},{"k":"facts","title":"Valuing inventory (AS 2 and Ind AS 2)","rows":[["Basic rule","Lower of cost and net realisable value (conservatism)"],["Cost formulas allowed","FIFO and weighted average; specific identification for items that are not interchangeable"],["Not allowed","LIFO"],["Left out of cost","Abnormal waste, storage (unless needed in production), office overheads, selling costs"],["Balance sheet order","By liquidity (cash first) or by permanence (fixed assets first); companies follow Schedule III of the Companies Act 2013"]]},{"k":"ex","h":"<p><b>Worked example — trading and P&amp;L.<\/b> Opening stock 20,000; purchases 1,20,000; purchases returns 5,000; sales 2,00,000; sales returns 10,000; carriage inwards 3,000; wages 12,000; closing stock 30,000; salaries 18,000; rent 6,000; carriage outwards 2,000; discount received 1,000; interest received 2,500.<\/p><p><b>Step 1:<\/b> net purchases 1,15,000; net sales 1,90,000. <b>Step 2:<\/b> cost of goods sold = 20,000 + 1,15,000 + 3,000 + 12,000 − 30,000 = 1,20,000. <b>Step 3:<\/b> gross profit = 1,90,000 − 1,20,000 = <b>₹70,000<\/b>.<\/p><p><b>Step 4:<\/b> net profit = 70,000 − (18,000 + 6,000 + 2,000) + (1,000 + 2,500) = <b>₹47,500<\/b>. Gross profit ratio = 70,000 ÷ 1,90,000 ≈ 36.8%.<\/p>"},{"k":"ex","h":"<p><b>Worked example — FIFO and weighted average.<\/b> 1 Jan bought 100 units at ₹10; 10 Jan bought 200 units at ₹12; 15 Jan issued 150 units.<\/p><p><b>FIFO:<\/b> the issue takes the 100 old units and 50 new ones (1,000 + 600 = 1,600); closing stock = 150 × 12 = <b>₹1,800<\/b>.<\/p><p><b>Weighted average:<\/b> 3,400 ÷ 300 units ≈ ₹11.33; closing stock = 150 × 11.33 ≈ <b>₹1,700<\/b> (exactly 3,400 × 150/300).<\/p>"},{"k":"ex","h":"<p><b>Worked example — cost of production.<\/b> Raw materials consumed 64,000 (opening 12,000 + purchases 60,000 − closing 8,000); direct wages 30,000; factory overheads 16,000; opening work-in-progress 5,000; closing work-in-progress 7,000.<\/p><p>Cost of production = 64,000 + 30,000 + 16,000 + 5,000 − 7,000 = <b>₹1,08,000<\/b>, carried to the trading account.<\/p>"},{"k":"trick","h":"<b>Carriage IN → Trading, carriage OUT → P&amp;L<\/b>. 'Wages' alone → Trading; 'salaries' → P&amp;L. Closing stock outside the trial balance shows up <b>twice<\/b>: Trading credit and balance sheet asset."},{"k":"trap","h":"<b>Wages for installing machinery<\/b> are capital expenditure, not a trading expense. If closing stock is <b>inside<\/b> the trial balance (adjusted purchases), it goes <b>only<\/b> to the balance sheet. <b>LIFO<\/b> is not permitted under AS 2. Income tax of a sole trader paid from the business is <b>drawings<\/b>."}],"sum":["Trading A/c: opening stock, purchases and direct expenses against sales and closing stock → gross profit.","P&L A/c: indirect expenses and losses against gross profit and other incomes → net profit.","Balance sheet: a statement of assets, liabilities and capital on a date.","Capital expenditure brings a lasting asset (including installation and freight); revenue expenditure keeps the business running.","Cost of goods sold = opening stock + net purchases + direct expenses − closing stock.","AS 2: lower of cost and NRV; FIFO or weighted average; LIFO not allowed.","A manufacturing account finds the cost of production for the trading account."],"part":["Part 2 · Depreciation, bills and final accounts","मूल्यह्रास, विनिमय पत्र और अंतिम खाते"],"g":"fa"},
{"id":"F9","heat":3,"title":"Final accounts: adjustments","hi":"अंतिम खाते: समायोजन","blocks":[{"k":"hot","h":"Most asked: the <b>two effects<\/b> of each adjustment, the <b>provision for doubtful debts<\/b> sum, <b>outstanding and prepaid<\/b> expenses, <b>accrued and unearned<\/b> income, <b>manager's commission<\/b> before or after charging itself, and goods lost by fire."},{"k":"story","h":"<p>The trial balance shows what was <i>recorded<\/i> during the year. Some of it belongs to another year, and some of this year's costs and incomes were never recorded. <b>Adjustments<\/b>, usually given below the trial balance, bring the accounts in line with the accrual and matching concepts.<\/p><p>Every adjustment is a hidden journal entry, so it appears <b>twice<\/b>: once in the trading or P&amp;L account and once in the balance sheet. Unpaid rent increases the rent expense <i>and<\/i> appears as a liability; insurance paid in advance reduces the expense <i>and<\/i> appears as an asset.<\/p>","key":"One adjustment, two places: the nominal account and the balance sheet."},{"k":"table","title":"Adjustments: where they go","head":["Adjustment","Balance sheet","Trading or P&L account"],"rows":[["Closing stock","Assets side","Credited to the Trading A/c."],["Outstanding expenses","Liabilities side","Added to the expense."],["Prepaid expenses","Assets side","Deducted from the expense."],["Accrued income","Assets side","Added to the income."],["Income received in advance","Liabilities side","Deducted from the income."],["Depreciation","Deducted from the asset","Debited to P&L."],["Further bad debts","Deducted from debtors","Debited to P&L with the bad debts in the trial balance."],["New provision for doubtful debts","Deducted from debtors","P&L charge = bad debts + new provision − old provision."],["Provision for discount on debtors","Deducted from debtors","Worked out on good debtors, after bad debts and the doubtful-debts provision."],["Interest on capital","Added to capital","Debited to P&L."],["Interest on drawings","Deducted from capital","Credited to P&L."],["Goods taken by the owner","Deducted from capital","Deducted from purchases; treated as drawings."],["Goods given away as free samples","Not shown","Deducted from purchases and debited to Advertisement in P&L."],["Stock lost by fire, insurer admits part","Assets side","Insurance claim is an asset; full cost credited to Trading, uninsured part debited to P&L."],["Manager's commission still unpaid","Liabilities side","Debited to P&L."],["Interest on a loan due but unpaid","Liabilities side","Debited to P&L; shown with the loan."]]},{"k":"ex","h":"<p><b>Worked example — bad debts and the provision.<\/b> Debtors in the trial balance ₹52,000; bad debts in the trial balance ₹1,500; old provision for doubtful debts ₹3,000. Adjustments: further bad debts ₹2,000; keep a provision of 5% on debtors.<\/p><p><b>Step 1:<\/b> good debtors = 52,000 − 2,000 = 50,000. <b>Step 2:<\/b> new provision = 5% of 50,000 = 2,500. <b>Step 3:<\/b> P&amp;L charge = 1,500 + 2,000 + 2,500 − 3,000 = <b>₹3,000<\/b>. <b>Step 4:<\/b> balance sheet debtors = 50,000 − 2,500 = <b>₹47,500<\/b>. A further 2% provision for discount on debtors would be 2% of 47,500 = ₹950.<\/p>"},{"k":"ex","h":"<p><b>Worked example — manager's commission.<\/b> Net profit before the manager's commission is ₹1,10,000; the manager gets 10%.<\/p><p>(a) 10% of profit <b>before<\/b> charging the commission: 1,10,000 × 10% = <b>₹11,000<\/b>. (b) 10% of profit <b>after<\/b> charging the commission: 1,10,000 × 10/110 = <b>₹10,000<\/b> (check: 1,10,000 − 10,000 = 1,00,000, and 10% of that is 10,000).<\/p>"},{"k":"ex","h":"<p><b>Worked example — time adjustments.<\/b> (a) Insurance of ₹12,000 was paid for the year 1 July 2025 to 30 June 2026; books close on 31 March 2026. Three months (April–June) are prepaid: <b>₹3,000<\/b> asset; expense ₹9,000.<\/p><p>(b) A loan of ₹1,00,000 at 12% was taken on 1 October 2025; no interest has been paid. Interest for 6 months = <b>₹6,000<\/b>, debited to P&amp;L and shown as a liability.<\/p><p>(c) Goods costing ₹10,000 were destroyed by fire; the insurer admitted ₹7,000. Trading A/c is credited ₹10,000; P&amp;L is debited with the loss of <b>₹3,000<\/b>; the claim of ₹7,000 is an asset.<\/p>"},{"k":"trick","h":"<b>“OP-AU”<\/b>: <b>O<\/b>utstanding expense and <b>P<\/b>repaid expense change the expense; <b>A<\/b>ccrued income and <b>U<\/b>nearned (advance) income change the income. The 'owed by us' items (outstanding, unearned) are <b>liabilities<\/b>; the 'owed to us' items (prepaid, accrued) are <b>assets<\/b>."},{"k":"trap","h":"Bad debts and provisions are worked in order: <b>first<\/b> further bad debts, <b>then<\/b> the doubtful-debts provision on what is left, <b>then<\/b> any discount provision on the remainder. If the old provision is larger than the new requirement, the excess is <b>credited<\/b> to P&amp;L. Commission 'after charging such commission' uses <b>rate ÷ (100 + rate)<\/b>."}],"sum":["Each adjustment appears twice: in the trading or P&L account and in the balance sheet.","Outstanding expense: add to the expense, show as a liability. Prepaid expense: deduct, show as an asset.","Accrued income: add, show as an asset. Income received in advance: deduct, show as a liability.","P&L charge for doubtful debts = bad debts + new provision − old provision.","Debtors in the balance sheet = debtors − further bad debts − provisions.","Commission on profit after charging it = profit × rate ÷ (100 + rate).","Goods lost by fire: full cost credited to Trading; uninsured loss to P&L; claim as an asset."],"part":["Part 2 · Depreciation, bills and final accounts","मूल्यह्रास, विनिमय पत्र और अंतिम खाते"],"g":"fa"}
];
const QB = [
["F1","A trader's assets are ₹5,00,000 and his outside liabilities are ₹1,80,000. What is his capital?",["₹3,20,000","₹6,80,000","₹1,80,000","₹5,00,000"],"Capital = Assets − Liabilities = 5,00,000 − 1,80,000 = ₹3,20,000.",""],
["F1","A trader began the year with capital of ₹80,000. At the year end his assets were ₹1,50,000 and liabilities ₹40,000; there were no drawings and no fresh capital. What was his profit?",["₹30,000","₹70,000","₹1,10,000","₹40,000"],"Closing capital = 1,50,000 − 40,000 = 1,10,000; profit = 1,10,000 − 80,000 = ₹30,000.",""],
["F1","The concept that treats the owner and the business as separate persons is the:",["Business entity concept","Money measurement concept","Going concern concept","Dual aspect concept"],"Under the business entity concept the business is separate from its owner, so capital is shown as owed to the owner.",""],
["F1","The accounting equation Assets = Liabilities + Capital rests on which concept?",["Dual aspect concept","Matching concept","Accrual concept","Cost concept"],"Every transaction has two equal sides; that is the dual aspect concept.",""],
["F1","'Anticipate no profit, but provide for all possible losses' describes the convention of:",["Conservatism","Consistency","Materiality","Full disclosure"],"Conservatism (prudence) makes the accountant cautious about gains and quick to provide for losses.",""],
["F1","Valuing closing stock at cost or net realisable value, whichever is lower, follows the:",["Convention of conservatism","Convention of consistency","Money measurement concept","Business entity concept"],"Choosing the lower value avoids showing an unrealised profit — conservatism.",""],
["F1","Fixed assets are shown at cost less depreciation rather than at their break-up value because of the:",["Going concern concept","Realisation concept","Accounting period concept","Materiality convention"],"If the business is assumed to continue, assets need not be valued at what they would fetch on closure.",""],
["F1","Setting the expenses of a period against the revenue of the same period is the:",["Matching concept","Dual aspect concept","Cost concept","Entity concept"],"The matching concept pairs each period's revenue with the expenses incurred to earn it.",""],
["F1","Under the realisation concept, revenue from a credit sale is recognised when:",["The sale is made and the buyer becomes liable to pay","The cash is collected from the buyer","The order is received","The goods are manufactured"],"Revenue is earned at the point of sale, not when cash is received.",""],
["F1","A stapler costing ₹150, which will last several years, is written off as an expense at once. This follows the:",["Materiality convention","Consistency convention","Cost concept","Going concern concept"],"The amount is too small to matter, so it is not kept as an asset — materiality.",""],
["F1","The skill and loyalty of a firm's employees are not shown in its books because of the:",["Money measurement concept","Dual aspect concept","Matching concept","Accrual concept"],"Only facts that can be expressed in money are recorded.",""],
["F1","Which of these is NOT a fundamental accounting assumption under AS 1?",["Conservatism","Going concern","Consistency","Accrual"],"AS 1 names going concern, consistency and accrual; conservatism is a convention.",""],
["F1","Using the same method of depreciation year after year follows the convention of:",["Consistency","Conservatism","Materiality","Disclosure"],"Consistency keeps accounts comparable from one year to the next.",""],
["F1","Showing a contingent liability as a note to the accounts follows the convention of:",["Full disclosure","Conservatism","Consistency","Money measurement"],"Every material fact must be disclosed, even if it is not in the main figures.",""],
["F1","The Accounting Standards Board of the ICAI was set up in:",["1977","1949","1956","2013"],"The ICAI set up the ASB on 21 April 1977.",""],
["F1","For companies, Accounting Standards are notified by:",["The Central Government, under Section 133 of the Companies Act 2013","The ICAI alone, under its own bye-laws","The Reserve Bank of India","SEBI, under the SEBI Act 1992"],"The Central Government (MCA) prescribes them after the NFRA examines the ICAI's recommendations.",""],
["F1","Indian Accounting Standards (Ind AS) are converged with:",["IFRS issued by the IASB","US GAAP issued by the FASB","Standards issued by the IMF","Standards issued by the GASAB"],"Ind AS are India's converged version of the International Financial Reporting Standards.",""],
["F1","Phase I of Ind AS became compulsory from 1 April 2016 for companies with a net worth of at least:",["₹500 crore","₹250 crore","₹100 crore","₹1,000 crore"],"Phase I covered companies with net worth of ₹500 crore or more; Phase II (2017) took in all listed companies and those of ₹250 crore or more.",""],
["F1","AS 2 deals with:",["Valuation of inventories","Cash flow statements","Revenue recognition","Intangible assets"],"AS 2 values inventories at the lower of cost and net realisable value.",""],
["F1","After its 2016 revision, which Accounting Standard covers depreciation of fixed assets?",["AS 10","AS 6","AS 2","AS 26"],"AS 6 was withdrawn and its subject moved into AS 10, Property, Plant and Equipment.",""],
["F1","The National Financial Reporting Authority was set up under which section of the Companies Act 2013?",["Section 132","Section 133","Section 128","Section 135"],"Section 132 creates the NFRA; Section 133 deals with accounting standards; Section 128 with books of account.",""],
["F1","Which is a limitation of financial accounting?",["It records only facts that can be measured in money","It follows the double entry system","It shows the financial position of a business","It is based on accounting standards"],"Leaving out non-money facts is a real limitation; the others are features, not limitations.",""],
["F1","Which of these is an internal user of accounting information?",["The management","A lending bank","The income-tax department","A prospective investor"],"Owners, managers and employees are internal users; the rest are outsiders.",""],
["F1","Bookkeeping is mainly concerned with:",["Recording financial transactions","Interpreting financial results","Preparing budgets","Auditing the accounts"],"Bookkeeping is the recording stage; accounting goes on to summarise and interpret.",""],
["F1","Under Section 128 of the Companies Act 2013, a company must keep its books on the:",["Accrual basis and double entry system","Cash basis","Single entry system","Cash or accrual basis, at its choice"],"Section 128 requires the accrual basis and the double entry system.",""],
["F1","The owner takes goods costing ₹2,000 for personal use. The effect on the accounting equation is:",["Assets and capital both fall by ₹2,000","Assets fall and liabilities rise by ₹2,000","Capital falls and liabilities rise by ₹2,000","Assets rise and capital falls by ₹2,000"],"Stock (an asset) goes down and drawings reduce capital by the same amount.",""],
["F1","Which branch of accounting gives the cost of each product or job?",["Cost accounting","Financial accounting","Tax accounting","Social responsibility accounting"],"Cost accounting works out costs per unit, job or process; financial accounting does not.",""],
["F2","'Debit the receiver, credit the giver' is the rule for:",["Personal accounts","Real accounts","Nominal accounts","Valuation accounts"],"Personal accounts follow the receiver–giver rule.",""],
["F2","'Debit what comes in, credit what goes out' is the rule for:",["Real accounts","Personal accounts","Nominal accounts","Representative personal accounts"],"Real (asset) accounts follow the comes in–goes out rule.",""],
["F2","'Debit all expenses and losses, credit all incomes and gains' is the rule for:",["Nominal accounts","Real accounts","Personal accounts","Capital accounts"],"Nominal accounts hold expenses, losses, incomes and gains.",""],
["F2","Outstanding salary account is a:",["Representative personal account","Nominal account","Real account","Natural personal account"],"It stands for the employees to whom salary is owed, so it is representative personal.",""],
["F2","Goodwill account is a:",["Real account (intangible)","Nominal account","Personal account","Representative personal account"],"Goodwill is an intangible asset, so its account is real.",""],
["F2","The owner's capital account is a:",["Personal account","Real account","Nominal account","Suspense account"],"Capital is owed to the owner, a person — a personal account.",""],
["F2","A bank account in the books of a business is a:",["Personal account (artificial person)","Real account","Nominal account","Representative personal account"],"A bank is an artificial person recognised by law.",""],
["F2","Goods taken by the owner for personal use are recorded by:",["Debiting Drawings and crediting Purchases","Debiting Drawings and crediting Sales","Debiting Purchases and crediting Drawings","Debiting Capital and crediting Cash"],"Goods withdrawn at cost reduce purchases: Drawings A/c Dr, To Purchases A/c.",""],
["F2","Goods given away as free samples are recorded by:",["Debiting Advertisement and crediting Purchases","Debiting Purchases and crediting Advertisement","Debiting Drawings and crediting Purchases","Debiting Sales and crediting Advertisement"],"Free samples are a selling expense: Advertisement A/c Dr, To Purchases A/c.",""],
["F2","Rahul owes Mohan ₹10,000 and pays ₹9,800 in full settlement. In Rahul's books, which account is credited with ₹200?",["Discount received","Discount allowed","Mohan","Cash"],"Rahul gains the ₹200 — Mohan Dr 10,000, To Cash 9,800, To Discount received 200.",""],
["F2","A trade discount is:",["Not recorded in the books at all","Debited to Discount allowed","Credited to Discount received","Shown in the cash book's discount column"],"Goods are recorded at the net price after trade discount; only cash discount is recorded.",""],
["F2","Goods worth ₹5,000 are destroyed by fire and the insurer admits a claim of ₹3,000. How much is debited to Loss by fire account?",["₹2,000","₹5,000","₹3,000","₹8,000"],"The loss is 5,000 − 3,000 = ₹2,000; ₹3,000 goes to Insurance claim A/c; Purchases is credited ₹5,000.",""],
["F2","Who first described the double entry system in print, in 1494?",["Luca Pacioli","Adam Smith","J. M. Keynes","Alfred Marshall"],"The Italian monk Luca Pacioli explained it in his book on arithmetic in 1494.",""],
["F2","A trial balance proves:",["The arithmetical accuracy of the ledger postings","That the accounts contain no errors","The true profit of the business","The financial position of the business"],"Agreement shows only that debits equal credits; many errors can still be hidden.",""],
["F2","Which of these errors will NOT stop a trial balance from agreeing?",["Omitting a transaction completely from the journal","Posting a debit amount to the credit side","Wrong totalling of the sales book","Posting only one side of an entry"],"A complete omission leaves both sides short by the same amount, so the totals still agree.",""],
["F2","Sales returns appear in a trial balance on the:",["Debit side","Credit side","Either side, at choice","Neither side — they go in the notes"],"Returns inward reduce sales, an income, so they have a debit balance.",""],
["F2","Provision for doubtful debts appears in a trial balance on the:",["Credit side","Debit side","Asset side","Neither side"],"A provision is a credit balance kept against debtors.",""],
["F2","Under the modern rules, an increase in a liability is:",["Credited","Debited","Debited or credited, at choice","Not recorded until it is paid"],"Liabilities increase on the credit side and decrease on the debit side.",""],
["F2","Bad debts written off in an earlier year are recovered in cash. The entry is:",["Cash A/c Dr, To Bad debts recovered A/c","Cash A/c Dr, To Debtor's A/c","Debtor's A/c Dr, To Bad debts A/c","Bad debts A/c Dr, To Cash A/c"],"The debtor's account was closed, so the recovery is credited to Bad debts recovered A/c, an income.",""],
["F2","A journal entry with more than one debit or more than one credit is called a:",["Compound entry","Contra entry","Opening entry","Closing entry"],"A compound entry combines several debits or credits on one date.",""],
["F2","A debit balance in a ledger account normally shows:",["An asset, expense or loss","A liability or income","Capital","A provision"],"Assets, expenses and losses have debit balances.",""],
["F2","Machinery bought on credit from Ajay is recorded by crediting:",["Ajay","Purchases account","Machinery account","Cash account"],"Machinery A/c Dr, To Ajay — Ajay is the giver.",""],
["F2","The debit column of a trial balance totals ₹2,45,600 and the credit column ₹2,48,000. The suspense account will show:",["₹2,400 on the debit side","₹2,400 on the credit side","₹4,800 on the debit side","₹4,800 on the credit side"],"The debit side is short by ₹2,400, so suspense is put on the debit side.",""],
["F2","Which item normally does NOT appear in a trial balance?",["Closing stock","Opening stock","Purchases","Carriage inwards"],"Closing stock is valued after the books are closed and brought in by a closing entry.",""],
["F2","The journal is also known as the:",["Book of original (prime) entry","Principal book","Book of final entry","Statement of affairs"],"Transactions enter the journal first; the ledger is the principal book.",""],
["F2","Commission received in advance account is a:",["Representative personal account","Nominal account","Real account","Natural personal account"],"It stands for the persons to whom the service is still owed.",""],
["F2","Discount allowed appears in a trial balance on the:",["Debit side","Credit side","Liabilities side","It never appears"],"Discount allowed is a loss, so it has a debit balance.",""],
["F3","The purchases book records:",["Credit purchases of goods only","All purchases of goods, cash and credit","Credit purchases of goods and assets","Cash purchases of goods only"],"Only credit purchases of goods meant for resale go to the purchases book.",""],
["F3","Machinery bought on credit from Mohan is recorded in the:",["Journal proper","Purchases book","Cash book","Bills payable book"],"It is an asset, not goods for resale, so it goes to the journal proper.",""],

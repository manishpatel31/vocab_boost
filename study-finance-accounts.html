ts."},{"k":"trap","h":"Sending goods on consignment is <b>not a sale<\/b>, so the consignee is <b>not<\/b> debited when goods are sent. Under <b>del credere<\/b>, bad debts are the consignee's loss, not the consignor's. A <b>normal<\/b> loss is not written off separately; it raises the cost of the remaining units."}],"sum":["Consignment: consignor (owner) sends goods to consignee (agent); ownership does not pass.","Proforma invoice goes with the goods; the account sales comes back from the consignee.","Del credere commission makes the consignee bear bad debts.","Stock on consignment = cost + proportionate non-recurring expenses; selling costs are left out.","Abnormal loss is valued at cost plus expenses to date and removed from the consignment account; normal loss is absorbed by the remaining units.","A joint venture is a temporary partnership for one deal; profit is shared in the agreed ratio, otherwise equally.","Joint venture records: separate books (joint bank account), each venturer's own books (memorandum JV account), or one venturer's books."],"part":["Part 3 · Partnership, special accounts and Part B","साझेदारी, विशेष खाते और भाग B"],"g":"fa"},
{"id":"F12","heat":3,"title":"Single entry, incomplete records and non-profit organisations","hi":"एकल प्रविष्टि, अपूर्ण अभिलेख और अलाभकारी संस्थाएँ","blocks":[{"k":"hot","h":"Most asked: the <b>statement of affairs<\/b> and profit from <b>capital comparison<\/b>, finding <b>credit sales or purchases<\/b> from total accounts, <b>stock lost by fire<\/b> using the gross profit ratio, <b>Receipts &amp; Payments vs Income &amp; Expenditure<\/b>, and the <b>subscription<\/b> sum."},{"k":"story","h":"<p>Many small shopkeepers keep only a cash book and a register of who owes them and whom they owe. This is called the <b>single entry system<\/b> — really an incomplete double entry, with no real or nominal accounts. A trial balance cannot be drawn up, so profit is found by comparing capital at two dates: a <b>statement of affairs<\/b> (a balance sheet built from whatever records exist) is drawn up at the start and at the end.<\/p><p><b>Non-profit organisations<\/b> — clubs, schools, hospitals, charities — do not trade for profit. Their treasurer keeps a cash book and summarises it as a <b>Receipts and Payments account<\/b>. The accountant then prepares an <b>Income and Expenditure account<\/b> on the accrual basis, which gives a <b>surplus<\/b> or <b>deficit<\/b>, and a balance sheet showing the <b>capital fund<\/b>.<\/p>","key":"Profit = closing capital − opening capital + drawings − fresh capital."},{"k":"facts","title":"Single entry: rules","rows":[["Kept","Cash book and personal accounts (debtors, creditors)"],["Not kept","Real and nominal accounts; so no trial balance"],["Statement of affairs","Capital = assets − liabilities on a date (like a balance sheet, but from incomplete data)"],["Profit (capital comparison)","Closing capital − opening capital + drawings − additional capital"],["Credit sales","Closing debtors + cash received + discount allowed + bad debts + returns − opening debtors"],["Credit purchases","Closing creditors + cash paid + discount received + returns − opening creditors"],["Conversion method","Missing figures are worked out and full final accounts drawn up"]]},{"k":"table","title":"Gross profit: on cost or on sales?","head":["On cost","On sales","Note"],"rows":[["25%","20%","25 ÷ 125"],["20%","1/6 (16.67%)","20 ÷ 120"],["33⅓%","25%","(1/3) ÷ (4/3)"],["50%","33⅓%","50 ÷ 150"],["100%","50%","100 ÷ 200"]]},{"k":"table","title":"NPO items: capital or revenue?","head":["Item","Treatment","Note"],"rows":[["Life membership fees","Capital receipt","Added to the capital fund (or a separate fund)."],["Legacy received under a will","Capital receipt",""],["Donation for a specific purpose (e.g. a building fund)","Capital receipt","Credited to that fund."],["Endowment fund receipts","Capital receipt",""],["Government grant to build a hall","Capital receipt",""],["Sale of old furniture","Capital receipt","Only the profit or loss on sale goes to the I&amp;E account."],["Annual subscriptions","Revenue receipt","The main income of most clubs."],["Entrance (admission) fees","Revenue receipt","Usually treated as revenue unless the club's policy capitalises them."],["Small general donations","Revenue receipt",""],["Sale of old newspapers","Revenue receipt",""],["Interest on investments","Revenue receipt",""],["Locker rent from members","Revenue receipt",""]]},{"k":"table","title":"Receipts and Payments vs Income and Expenditure","head":["Point","Receipts and Payments account","Income and Expenditure account"],"rows":[["Nature","Real account — a summary of the cash book","Nominal account — like a P&amp;L account"],["Basis","Cash","Accrual"],["Items","Capital and revenue, of any year","Revenue items of the current year only"],["Opening balance","Cash and bank in hand","None"],["Closing balance","Cash and bank at the end","Surplus (income over expenditure) or deficit"],["Sides","Receipts on the debit side, payments on the credit side","Expenditure on the debit side, income on the credit side"],["Non-cash items","Not shown (no depreciation)","Shown (depreciation, outstanding items)"]]},{"k":"ex","h":"<p><b>Worked example — capital comparison.<\/b> Capital on 1 April ₹1,50,000; on 31 March ₹1,90,000. Drawings ₹24,000; fresh capital brought in ₹10,000.<\/p><p>Profit = 1,90,000 − 1,50,000 + 24,000 − 10,000 = <b>₹54,000<\/b>. Drawings are added back because they took profit out; fresh capital is deducted because it is not profit.<\/p>"},{"k":"ex","h":"<p><b>Worked example — missing credit sales.<\/b> Debtors on 1 April ₹30,000; on 31 March ₹40,000. Cash received from debtors ₹1,20,000; discount allowed ₹2,000; bad debts ₹1,000; sales returns ₹3,000.<\/p><p>Credit sales = 40,000 + 1,20,000 + 2,000 + 1,000 + 3,000 − 30,000 = <b>₹1,36,000<\/b> (the balancing figure of a total debtors account).<\/p>"},{"k":"ex","h":"<p><b>Worked example — stock lost by fire.<\/b> Opening stock ₹40,000; purchases to the date of fire ₹1,60,000; sales to that date ₹2,00,000; gross profit 25% on sales; stock salvaged ₹5,000.<\/p><p>Cost of goods sold = 75% of 2,00,000 = 1,50,000. Stock on the date of the fire = 40,000 + 1,60,000 − 1,50,000 = 50,000. Loss of stock = 50,000 − 5,000 = <b>₹45,000<\/b>.<\/p>"},{"k":"ex","h":"<p><b>Worked example — subscriptions.<\/b> Received during 2025-26: ₹50,000, including ₹3,000 for 2024-25 and ₹2,000 for 2026-27. Still due for 2025-26: ₹4,000.<\/p><p>Income for 2025-26 = 50,000 − 3,000 − 2,000 + 4,000 = <b>₹49,000<\/b>. The ₹4,000 is an asset; the ₹2,000 received in advance is a liability.<\/p><p><i>Capital fund at the start:<\/i> cash 10,000 + furniture 40,000 + subscriptions due 3,000 − salaries due 2,000 = <b>₹51,000<\/b>.<\/p>"},{"k":"trick","h":"<b>R&amp;P = Real and Cash; I&amp;E = Income and Accrual.<\/b> If it is a lump sum that will never come again (legacy, life membership, specific donation), <b>capitalise<\/b> it; if it comes every year (subscriptions, interest, small donations), it is <b>revenue<\/b>."},{"k":"trap","h":"A <b>statement of affairs<\/b> is not a balance sheet — it is built from incomplete records and the capital is the balancing figure. In an NPO, the <b>sale of an old asset<\/b> is a capital receipt; only the <b>profit or loss<\/b> on it goes to the I&amp;E account. A surplus of an NPO is added to the <b>capital fund<\/b>, not distributed."}],"sum":["Single entry keeps a cash book and personal accounts only; profit is found by comparing capital.","Profit = closing capital − opening capital + drawings − additional capital.","Credit sales and purchases are the balancing figures of total debtors and total creditors accounts.","25% on cost = 20% on sales; 33⅓% on cost = 25% on sales.","Receipts and Payments: real account, cash basis, all receipts and payments; closes with cash in hand.","Income and Expenditure: nominal account, accrual basis, revenue items of the year; gives a surplus or deficit.","Life membership, legacies, specific donations and endowments are capital receipts; subscriptions and entrance fees are revenue.","Capital fund = assets − liabilities of the NPO."],"part":["Part 3 · Partnership, special accounts and Part B","साझेदारी, विशेष खाते और भाग B"],"g":"fa"},
{"id":"F13","heat":2,"title":"Self-balancing and sectional balancing ledgers","hi":"स्व-संतुलन और विभागीय संतुलन खाता-बही","blocks":[{"k":"hot","h":"Most asked: the <b>purpose<\/b> of self-balancing ledgers (locating errors), the names of the <b>adjustment accounts<\/b>, which items go to the <b>debtors' ledger adjustment account<\/b> and which do not (cash sales, provisions), and a short <b>closing balance<\/b> numerical."},{"k":"story","h":"<p>In a large firm the ledger is too big for one clerk, so it is split into three: the <b>general ledger<\/b> (real, nominal and capital accounts), the <b>debtors' (sales) ledger<\/b> and the <b>creditors' (bought) ledger<\/b>. If one big trial balance fails to agree, nobody knows which section holds the error.<\/p><p>Under the <b>self-balancing system<\/b>, each ledger gets an extra account that sums up the other side. The debtors' ledger holds a <b>General Ledger Adjustment account<\/b>; the general ledger holds a <b>Debtors' Ledger Adjustment account<\/b> (and the same for creditors). Now each ledger can produce its own trial balance, and an error is traced to one ledger only. Under <b>sectional balancing<\/b>, only total debtors and total creditors accounts are drawn up, as memorandum accounts, to check those two ledgers.<\/p>","key":"Each ledger carries a mirror of the others, so each balances by itself."},{"k":"table","title":"Which side of the Debtors' Ledger Adjustment account (in the general ledger)?","head":["Item","Side","Note"],"rows":[["Credit sales","Debit",""],["Bills receivable dishonoured","Debit",""],["A debtor's cheque dishonoured","Debit",""],["Interest charged to customers on overdue accounts","Debit",""],["Cash and cheques received from debtors","Credit",""],["Discount allowed","Credit",""],["Sales returns","Credit",""],["Bad debts written off","Credit",""],["Bills receivable received","Credit",""],["Transfer to the creditors' ledger (set-off)","Credit","When the same party is a debtor and a creditor."],["Cash sales","Not recorded","Never touches a debtor's account."],["Provision for doubtful debts","Not recorded","It is kept in the general ledger."],["Trade discount","Not recorded","Never enters the books."],["Bad debts recovered (written off earlier)","Not recorded","Credited to Bad debts recovered A/c, not to the debtor."]]},{"k":"table","title":"The adjustment accounts","head":["Ledger","Account opened in it","Mirrors"],"rows":[["General ledger","Debtors' Ledger Adjustment A/c and Creditors' Ledger Adjustment A/c","The totals of the two personal ledgers"],["Debtors' (sales) ledger","General Ledger Adjustment A/c","Shows the opposite side of everything posted to debtors"],["Creditors' (bought) ledger","General Ledger Adjustment A/c","Shows the opposite side of everything posted to creditors"]]},{"k":"table","title":"Self-balancing and sectional balancing","head":["Point","Self-balancing","Sectional balancing"],"rows":[["Adjustment accounts","In every ledger","Only total accounts for the debtors' and creditors' ledgers"],["Part of double entry?","Yes","No — the total accounts are memorandum"],["Trial balance","Each ledger has its own","Only the personal ledgers are checked"],["Suits","Large firms","Medium firms"]]},{"k":"facts","title":"Why use it","rows":[["Locating errors","An error is traced to one ledger"],["Internal check","Different clerks keep different ledgers and check each other"],["Fraud prevention","Harder to hide a false entry"],["Quick totals","Total debtors and creditors are known at once for final accounts"],["Division of work","Ledgers can be written up at the same time"]]},{"k":"ex","h":"<p><b>Worked example — debtors' ledger adjustment.<\/b> Opening debtors ₹60,000; credit sales ₹2,50,000; cash received ₹1,90,000; discount allowed ₹5,000; sales returns ₹8,000; bad debts ₹3,000; bills receivable received ₹20,000; a bill receivable dishonoured ₹4,000; transfer to creditors' ledger ₹6,000. Cash sales ₹40,000 and a provision of ₹2,500 are also given.<\/p><p><b>Debit:<\/b> 60,000 + 2,50,000 + 4,000 = 3,14,000. <b>Credit:<\/b> 1,90,000 + 5,000 + 8,000 + 3,000 + 20,000 + 6,000 = 2,32,000. Closing debtors = <b>₹82,000<\/b>. Cash sales and the provision are ignored.<\/p>"},{"k":"ex","h":"<p><b>Worked example — creditors' ledger adjustment.<\/b> Opening creditors ₹45,000; credit purchases ₹1,80,000; paid ₹1,40,000; discount received ₹3,000; purchases returns ₹5,000; bills payable accepted ₹15,000; transfer from debtors' ledger ₹6,000.<\/p><p>Closing creditors = 45,000 + 1,80,000 − (1,40,000 + 3,000 + 5,000 + 15,000 + 6,000) = <b>₹56,000<\/b>.<\/p>"},{"k":"trick","h":"In the general ledger, the <b>Debtors' Ledger Adjustment<\/b> account behaves exactly like one big debtor: what increases a debtor (credit sale, dishonour) is a <b>debit<\/b>; what reduces him (cash, discount, returns, bad debts, bills received) is a <b>credit<\/b>. The account in the debtors' ledger is its mirror."},{"k":"trap","h":"<b>Cash sales<\/b>, <b>provisions<\/b>, <b>trade discount<\/b> and <b>bad debts recovered<\/b> never enter the debtors' adjustment account. A <b>set-off<\/b> (transfer between ledgers) reduces <b>both<\/b> debtors and creditors. The account kept <i>in<\/i> the debtors' ledger is called the <b>General<\/b> Ledger Adjustment account, not the Debtors' one."}],"sum":["The ledger is split into general, debtors' (sales) and creditors' (bought) ledgers.","Self-balancing: each ledger has an adjustment account and its own trial balance.","General ledger: Debtors' and Creditors' Ledger Adjustment accounts; personal ledgers: General Ledger Adjustment account.","The Debtors' Ledger Adjustment account is debited with credit sales and dishonours, and credited with cash, discount, returns, bad debts, bills and transfers.","Cash sales, provisions, trade discount and bad debts recovered are not recorded in it.","Sectional balancing uses total accounts as memorandum, only for the personal ledgers.","Main benefit: errors are located quickly; also internal check and division of work."],"part":["Part 3 · Partnership, special accounts and Part B","साझेदारी, विशेष खाते और भाग B"],"g":"fa"},
{"id":"F14","heat":3,"title":"Economics & Governance: what Paper III asks, and where to study it","hi":"अर्थशास्त्र एवं शासन: पेपर III क्या पूछता है और कहाँ पढ़ें","blocks":[{"k":"hot","h":"Part B carries <b>120 marks<\/b>. The syllabus names the <b>CAG<\/b> (constitutional provisions, role and responsibility) and the <b>Finance Commission<\/b> (role and functions) first — then micro-economics, the Indian economy, reforms, money and banking, budgets and the role of IT in governance. Most of it is already taught in other apps; this lesson maps each topic and adds only what they leave out."},{"k":"story","h":"<p>An Assistant Audit Officer works in the <b>Indian Audit and Accounts Department<\/b>, headed by the <b>Comptroller and Auditor General of India<\/b>. That is why Paper III asks about the CAG and the Finance Commission in more depth than Tier 1 does: not only the Articles, but the <b>Duties, Powers and Conditions of Service Act, 1971<\/b>, the kinds of audit, and how a Finance Commission divides tax money.<\/p><p>For the economics half, use the table below: open each linked lesson, then come back for the gaps — laws of production, consumer equilibrium, price under each market form, and e-governance.<\/p>","key":"Read the linked lesson first; this lesson adds only what it lacks."},{"k":"table","title":"Part B syllabus → where to study it","head":["Syllabus topic","Study it in","Added here"],"rows":[["CAG: constitutional provisions, role and responsibility","<a href=\"study-const-bodies.html?lesson=C4\">Bodies · C4<\/a>, <a href=\"study-polity.html?lesson=L19\">Polity · L19<\/a>","DPC Act 1971, kinds of audit, Articles 149–151 and 279"],["Finance Commission: role and functions","<a href=\"study-const-bodies.html?lesson=C4\">Bodies · C4<\/a>, <a href=\"study-polity.html?lesson=L14\">Polity · L14<\/a>, <a href=\"study-economics.html?lesson=L20\">Economy · L20<\/a>","Article 280(3), the 1951 Act, 15th vs 16th FC formula"],["Meaning and scope of economics; central problems","<a href=\"study-economics.html?lesson=L1\">Economy · L1<\/a>","Production possibility curve"],["Demand, supply, elasticity; consumer behaviour","<a href=\"study-economics.html?lesson=L2\">Economy · L2<\/a>","Consumer equilibrium (Marshall; indifference curves)"],["Production and cost","<a href=\"study-economics.html?lesson=L3\">Economy · L3<\/a>","Law of variable proportions; returns to scale"],["Forms of market and price determination","<a href=\"study-economics.html?lesson=L3\">Economy · L3<\/a>","MR = MC; price under each market"],["Nature of the Indian economy; agriculture, industry, services","<a href=\"study-economics.html?lesson=L1\">Economy · L1<\/a>, <a href=\"study-economics.html?lesson=L14\">L14<\/a>, <a href=\"study-economics.html?lesson=L18\">L18<\/a>","—"],["National income: concepts and methods","<a href=\"study-economics.html?lesson=L4\">Economy · L4<\/a>","—"],["Population: size, growth, effect on growth","<a href=\"study-census.html?lesson=L4\">Census · L4<\/a>, <a href=\"study-census.html?lesson=L11\">L11<\/a>","—"],["Poverty and unemployment","<a href=\"study-economics.html?lesson=L5\">Economy · L5<\/a>, <a href=\"study-economics.html?lesson=L18\">L18<\/a>","—"],["Infrastructure: energy, transport, communication","<a href=\"study-industries-transport.html?lesson=T5\">Industries & Transport · T5–T10<\/a>","—"],["Reforms since 1991: LPG, disinvestment","<a href=\"study-economics.html?lesson=L15\">Economy · L15<\/a>","—"],["Monetary and fiscal policy; RBI","<a href=\"study-economics.html?lesson=L7\">Economy · L6–L7<\/a>, <a href=\"study-banking.html?lesson=N1\">Banking · N1–N2<\/a>","—"],["Commercial banks, RRBs, payments banks","<a href=\"study-banking.html?lesson=N4\">Banking · N4<\/a>, <a href=\"study-economics.html?lesson=L8\">Economy · L8<\/a>","—"],["Budget, fiscal deficit, balance of payments, FRBM Act 2003","<a href=\"study-economics.html?lesson=L9\">Economy · L9–L10<\/a>, <a href=\"study-economics.html?lesson=L16\">L16<\/a>","—"],["Role of information technology in governance","<a href=\"study-computer.html?lesson=C22\">Computer · C22<\/a>, <a href=\"study-govt-schemes.html?lesson=L12\">Schemes · L12<\/a>","NeGP, e-Kranti, G2C/G2B/G2G"]]},{"k":"link","h":"The CAG's Article (148), term (6 years or 65), removal (like a Supreme Court judge) and the 'friend, philosopher and guide' of the Public Accounts Committee, and the Finance Commission's chairmen, are in <a href=\"study-const-bodies.html?lesson=C4\">Constitutional &amp; Statutory Bodies · C4<\/a>; the PAC, Estimates Committee and COPU are in <a href=\"study-polity.html?lesson=L12\">Polity · L12<\/a>; the 16th FC's 41% share and the Budget 2026-27 numbers are in <a href=\"study-economics.html?lesson=L20\">Indian Economy · L20<\/a>."},{"k":"table","title":"The CAG in the Constitution: what the other apps leave out","head":["Article","Provision","Note"],"rows":[["148(1)","Appointed by the President by warrant under his hand and seal","Oath in the Third Schedule."],["148(4)","Not eligible for any further office under the Union or a state after leaving",""],["148(5)","Conditions of service of IA&amp;AD staff set by the President after consulting the CAG",""],["148(6)","The office's administrative expenses are charged on the Consolidated Fund of India","Not voted by Parliament."],["149","Duties and powers as laid down by Parliament","Parliament did this through the DPC Act, 1971."],["150","Accounts of the Union and states kept in the form the President prescribes on the CAG's advice",""],["151","Audit reports go to the President (Union) or the Governor (state), who lay them before the legislature",""],["279","The CAG's certificate of the 'net proceeds' of a tax is final",""]]},{"k":"table","title":"The Comptroller and Auditor General's (Duties, Powers and Conditions of Service) Act, 1971","head":["Section","Deals with","Note"],"rows":[["Section 10","Compiling the accounts of the Union and the states","Union accounts were taken away from the CAG in 1976."],["Section 11","Preparing annual accounts and submitting them to the President or Governor",""],["Section 13","Audit of all spending from the Consolidated, Contingency and Public Accounts",""],["Section 14","Audit of bodies substantially financed from government funds","Grants or loans of ₹25 lakh or more that are at least 75% of the body's spending; with approval, any body getting ₹1 crore or more."],["Section 15","Audit of grants and loans given to other bodies",""],["Section 16","Audit of receipts of the Union and the states",""],["Section 17","Audit of stores and stock accounts",""],["Section 18","Powers: inspect offices, call for records, ask questions",""],["Section 19","Audit of government companies and corporations",""],["Section 20","Audit of other bodies entrusted by the President or Governor",""]]},{"k":"table","title":"Kinds of audit","head":["Audit","What it checks","Note"],"rows":[["Financial (attest) audit","Certifies that the accounts give a true and fair view","Also called certification audit."],["Compliance audit — regularity","Checks that money was spent under the law, the rules and a proper sanction",""],["Compliance audit — propriety","Asks whether spending was wise, faithful and economical, in the public interest","Goes beyond the rules."],["Performance audit","Judges economy, efficiency and effectiveness (the 3 Es) of a scheme or body","Value-for-money audit."],["Supplementary audit","A second audit of a government company after its statutory auditor's","Section 143(6), Companies Act 2013."],["Test audit","Checking a sample of transactions instead of all of them",""]]},{"k":"facts","title":"The audit department","rows":[["Indian Audit and Accounts Department (IA&amp;AD)","Headed by the CAG; the Accountants General work in the states"],["Origin","The first Auditor General, Sir Edward Drummond, took charge in 1860"],["Separation of accounts from audit","1976: Union accounts moved to the ministries under the Controller General of Accounts (Ministry of Finance)"],["Government companies","Under the Companies Act 2013 the CAG appoints the statutory auditor (Section 139(5)) and may conduct a supplementary or test audit (Section 143(6))"],["Motto","'Lokahitartham Satyanishtha' — dedicated to truth in public interest"],["CAG as of October 2026","K. Sanjay Murthy, in office since 21 November 2024"]]},{"k":"table","title":"Finance Commission: how it works","head":["Provision","What it says","Note"],"rows":[["Article 280(1)","Set up by the President every fifth year, or earlier","A chairman and four members."],["Article 280(2) and the 1951 Act","Qualifications are laid down by the Finance Commission (Miscellaneous Provisions) Act, 1951","Chairman: experience in public affairs."],["Members under the 1951 Act","A High Court judge or one qualified to be; an expert in government finance and accounts; one with wide experience of financial administration; an economist",""],["Article 280(3)(a)","Sharing of net tax proceeds between the Union and the states (vertical) and among the states (horizontal)",""],["Article 280(3)(b)","Principles for grants-in-aid to states under Article 275",""],["Article 280(3)(bb) and (c)","Measures to help states fund panchayats and municipalities","Added by the 73rd and 74th Amendments."],["Article 281","The President lays the recommendations before Parliament with an explanatory memorandum","They are advisory."],["State Finance Commission","Article 243-I (panchayats) and 243Y (municipalities); set up by the Governor","Different body."]]},{"k":"table","title":"Sharing among the states: 15th vs 16th Finance Commission","head":["Criterion","15th FC (2021–26)","16th FC (2026–31)"],"rows":[["Income distance","45%","42.5%"],["Population (2011 Census)","15%","17.5%"],["Area","15%","10%"],["Forest and ecology","10%","10% (redefined)"],["Demographic performance","12.5%","10% (population growth 1971–2011)"],["Tax and fiscal effort","2.5%","Dropped"],["Contribution to GDP","—","10% (new)"],["States' share of the divisible pool","41%","41%"]]},{"k":"facts","title":"16th Finance Commission timeline","rows":[["Set up","31 December 2023; chairman Arvind Panagariya"],["Report to the President","17 November 2025"],["Laid in Parliament","1 February 2026, with the Union Budget 2026-27"],["Award period","2026-27 to 2030-31"]]},{"k":"table","title":"Micro-economics the Economy app does not spell out","head":["Idea","Rule","Note"],"rows":[["Law of variable proportions — Stage I","Total product rises fast; marginal product rises, then falls; ends where AP is highest","Increasing returns to the variable factor."],["Stage II","MP falls but stays positive; TP is highest where MP = 0","The rational stage — a firm produces here."],["Stage III","MP is negative and TP falls","Never chosen."],["Returns to scale","All inputs raised in the same proportion — output rises more (increasing), equally (constant) or less (diminishing)","A long-run idea."],["Production possibility curve","Concave to the origin because opportunity cost rises; a point inside means idle resources; growth shifts it outward",""],["Consumer equilibrium (Marshall)","One good: MU = price; two goods: MUx/Px = MUy/Py","Law of equi-marginal utility."],["Consumer equilibrium (indifference curves)","Budget line tangent to the highest indifference curve: MRS = Px/Py","Curves slope down, are convex and never cross."],["Price under any market","Profit is greatest where MR = MC (MC cutting MR from below)",""],["Perfect competition","P = AR = MR = MC; in the long run P = minimum AC (normal profit)",""],["Monopoly","P &gt; MR = MC; can practise price discrimination",""],["Oligopoly","Kinked demand curve (Sweezy) explains rigid prices",""]]},{"k":"facts","title":"IT in governance","rows":[["National e-Governance Plan (NeGP)","Approved in May 2006 with 27 Mission Mode Projects (later 31)"],["e-Kranti","NeGP 2.0, approved in March 2015 as a pillar of Digital India"],["Core infrastructure","State Wide Area Networks (SWAN), State Data Centres, Common Services Centres (CSCs)"],["Models","G2C (citizens), G2B (businesses), G2G (between governments), G2E (employees)"]]},{"k":"trick","h":"DPC Act sections in a line — <b>“13 spend, 14 funded bodies, 16 receipts, 17 stores, 19 companies, 20 on request”<\/b>. Audit types — <b>regularity<\/b> asks 'was it allowed?', <b>propriety<\/b> asks 'was it wise?', <b>performance<\/b> asks 'did it work?'."},{"k":"trap","h":"Article <b>149<\/b> (duties and powers) is filled in by the <b>DPC Act 1971<\/b>, not by the Constitution itself. The CAG audits but no longer <b>compiles<\/b> the Union's accounts (since 1976 — the CGA does). The 16th FC kept the share at <b>41%<\/b> but changed the weights: income distance fell to <b>42.5%<\/b> and a new <b>contribution to GDP<\/b> criterion (10%) replaced tax effort."}],"sum":["Part B (120 marks) names the CAG and the Finance Commission first; most other topics are in the Economy, Polity, Bodies, Banking, Census, Industries and Computer apps.","Article 149: CAG's duties and powers, set out in the DPC Act 1971; Article 150: form of accounts; Article 151: reports; Article 279: net proceeds certificate.","DPC Act: Section 13 spending, 14 substantially financed bodies (₹25 lakh and 75%), 16 receipts, 17 stores, 19 government companies, 20 audit on request.","Audit kinds: financial (attest), compliance (regularity and propriety), performance (economy, efficiency, effectiveness).","Union accounts were separated from audit in 1976 (Controller General of Accounts).","Finance Commission: Article 280(3) duties; qualifications in the 1951 Act; Article 281 report to Parliament.","16th FC: 41% share; income distance 42.5%, population 17.5%, area 10%, forest 10%, demographic performance 10%, contribution to GDP 10%; report 17 November 2025, laid 1 February 2026.","Profit is maximised where MR = MC; Stage II of the law of variable proportions is the rational stage."],"part":["Part 3 · Partnership, special accounts and Part B","साझेदारी, विशेष खाते और भाग B"],"g":"fa"}

["F2","Goodwill account is a:",["Real account (intangible)","Nominal account","Personal account","Representative personal account"],"Goodwill is an intangible asset, so its account is real.",""],
["F2","The owner's capital account is a:",["Personal account","Real account","Nominal account","Suspense account"],"Capital is owed to the owner, a person — a personal account.",""],
["F2","A bank account in the books of a business is a:",["Personal account (artificial person)","Real account","Nominal account","Representative personal account"],"A bank is an artificial person recognised by law.",""],
["F2","Goods taken by the owner for personal use are recorded by:",["Debiting Drawings and crediting Purchases","Debiting Drawings and crediting Sales","Debiting Purchases and crediting Drawings","Debiting Capital and crediting Cash"],"Goods withdrawn at cost reduce purchases: Drawings A/c Dr, To Purchases A/c.",""],
["F2","Goods given away as free samples are recorded by:",["Debiting Advertisement and crediting Purchases","Debiting Purchases and crediting Advertisement","Debiting Drawings and crediting Purchases","Debiting Sales and crediting Advertisement"],"Free samples are a selling expense: Advertisement A/c Dr, To Purchases A/c.",""],
["F2","Rahul owes Mohan ₹10,000 and pays ₹9,800 in full settlement. In Rahul's books, which account is credited with ₹200?",["Discount received","Discount allowed","Mohan","Cash"],"Rahul gains the ₹200 — Mohan Dr 10,000, To Cash 9,800, To Discount received 200.",""],
["F2","A trade discount is:",["Not recorded in the books at all","Debited to Discount allowed","Credited to Discount received","Shown in the cash book's discount column"],"Goods are recorded at the net price after trade discount; only cash discount is recorded.",""],
["F2","Goods worth ₹5,000 are destroyed by fire and the insurer admits a claim of ₹3,000. How much is debited to Loss by fire account?",["₹2,000","₹5,000","₹3,000","₹8,000"],"The loss is 5,000 − 3,000 = ₹2,000; ₹3,000 goes to Insurance claim A/c; Purchases is credited ₹5,000.",""],
["F2","Who first described the double entry system in print, in 1494?",["Luca Pacioli","Adam Smith","J. M. Keynes","Alfred Marshall"],"The Italian monk Luca Pacioli explained it in his book on arithmetic in 1494.",""],
["F2","A trial balance proves:",["The arithmetical accuracy of the ledger postings","That the accounts contain no errors","The true profit of the business","The financial position of the business"],"Agreement shows only that debits equal credits; many errors can still be hidden.",""],
["F2","Which of these errors will NOT stop a trial balance from agreeing?",["Omitting a transaction completely from the journal","Posting a debit amount to the credit side","Wrong totalling of the sales book","Posting only one side of an entry"],"A complete omission leaves both sides short by the same amount, so the totals still agree.",""],
["F2","Sales returns appear in a trial balance on the:",["Debit side","Credit side","Either side, at choice","Neither side — they go in the notes"],"Returns inward reduce sales, an income, so they have a debit balance.",""],
["F2","Provision for doubtful debts appears in a trial balance on the:",["Credit side","Debit side","Asset side","Neither side"],"A provision is a credit balance kept against debtors.",""],
["F2","Under the modern rules, an increase in a liability is:",["Credited","Debited","Debited or credited, at choice","Not recorded until it is paid"],"Liabilities increase on the credit side and decrease on the debit side.",""],
["F2","Bad debts written off in an earlier year are recovered in cash. The entry is:",["Cash A/c Dr, To Bad debts recovered A/c","Cash A/c Dr, To Debtor's A/c","Debtor's A/c Dr, To Bad debts A/c","Bad debts A/c Dr, To Cash A/c"],"The debtor's account was closed, so the recovery is credited to Bad debts recovered A/c, an income.",""],
["F2","A journal entry with more than one debit or more than one credit is called a:",["Compound entry","Contra entry","Opening entry","Closing entry"],"A compound entry combines several debits or credits on one date.",""],
["F2","A debit balance in a ledger account normally shows:",["An asset, expense or loss","A liability or income","Capital","A provision"],"Assets, expenses and losses have debit balances.",""],
["F2","Machinery bought on credit from Ajay is recorded by crediting:",["Ajay","Purchases account","Machinery account","Cash account"],"Machinery A/c Dr, To Ajay — Ajay is the giver.",""],
["F2","The debit column of a trial balance totals ₹2,45,600 and the credit column ₹2,48,000. The suspense account will show:",["₹2,400 on the debit side","₹2,400 on the credit side","₹4,800 on the debit side","₹4,800 on the credit side"],"The debit side is short by ₹2,400, so suspense is put on the debit side.",""],
["F2","Which item normally does NOT appear in a trial balance?",["Closing stock","Opening stock","Purchases","Carriage inwards"],"Closing stock is valued after the books are closed and brought in by a closing entry.",""],
["F2","The journal is also known as the:",["Book of original (prime) entry","Principal book","Book of final entry","Statement of affairs"],"Transactions enter the journal first; the ledger is the principal book.",""],
["F2","Commission received in advance account is a:",["Representative personal account","Nominal account","Real account","Natural personal account"],"It stands for the persons to whom the service is still owed.",""],
["F2","Discount allowed appears in a trial balance on the:",["Debit side","Credit side","Liabilities side","It never appears"],"Discount allowed is a loss, so it has a debit balance.",""],
["F3","The purchases book records:",["Credit purchases of goods only","All purchases of goods, cash and credit","Credit purchases of goods and assets","Cash purchases of goods only"],"Only credit purchases of goods meant for resale go to the purchases book.",""],
["F3","Machinery bought on credit from Mohan is recorded in the:",["Journal proper","Purchases book","Cash book","Bills payable book"],"It is an asset, not goods for resale, so it goes to the journal proper.",""],
["F3","A debit note is sent when:",["Goods are returned to the supplier","Goods are returned by a customer","Goods are sold on credit","A customer pays in cash"],"The buyer returning goods sends a debit note, debiting the supplier's account.",""],
["F3","Goods returned by a customer are recorded in the sales returns book on the basis of a:",["Credit note issued to the customer","Debit note issued to the customer","Invoice","Cash memo"],"The seller issues a credit note, crediting the customer's account.",""],
["F3","A contra entry is one that:",["Appears on both sides of the cash book","Appears only in the journal proper","Corrects an error","Opens the books at the start of the year"],"Cash deposited into or withdrawn from the bank for office use touches both the cash and bank columns.",""],
["F3","Which of these is NOT a contra entry?",["Cash withdrawn from the bank for the owner's personal use","Cash deposited into the bank","Cash withdrawn from the bank for office use","Cash taken from the office safe and deposited in the bank"],"Withdrawal for personal use is drawings: Drawings A/c Dr, To Bank.",""],
["F3","The cash column of a cash book can never show a:",["Credit balance","Debit balance","Nil balance","Balance carried down"],"More cash cannot be paid out than is held, so cash never has a credit balance.",""],
["F3","The total of the discount column on the receipts side of a cash book is posted to the:",["Debit of Discount allowed account","Credit of Discount allowed account","Credit of Discount received account","Debit of Discount received account"],"Discount on receipts is given to customers — a loss, debited to Discount allowed.",""],
["F3","The cash book is:",["Both a book of original entry and a ledger","Only a book of original entry","Only a ledger","A memorandum book outside the accounts"],"It records transactions first and also serves as the cash and bank accounts.",""],
["F3","A petty cash book is usually kept on the:",["Imprest system","Single entry system","Accrual system","Reducing balance system"],"Under the imprest system the petty cashier is reimbursed exactly what was spent.",""],
["F3","The petty cashier's imprest is ₹5,000 and she spends ₹3,640 during the month. How much will the main cashier give her at the month's end?",["₹3,640","₹5,000","₹1,360","₹8,640"],"Under the imprest system the amount spent, ₹3,640, is reimbursed.",""],
["F3","Opening cash ₹8,000; cash sales ₹5,000; salaries paid ₹3,500; cash deposited into the bank ₹6,000; cash withdrawn from the bank for office use ₹1,500. What is the closing cash balance?",["₹5,000","₹17,000","₹11,000","₹2,000"],"8,000 + 5,000 − 3,500 − 6,000 + 1,500 = ₹5,000.",""],
["F3","A credit balance in the bank column of a cash book means:",["A bank overdraft","Cash in hand","A favourable bank balance","An error in the cash book"],"The firm owes the bank — an overdraft.",""],
["F3","Opening, closing, adjustment and rectification entries are made in the:",["Journal proper","Cash book","Sales book","Purchases returns book"],"Entries that fit no special book go to the journal proper.",""],
["F3","The periodic total of the sales book is posted to the:",["Credit of Sales account","Debit of Sales account","Debit of Cash account","Credit of the customers' accounts"],"Customers are debited one by one; the total is credited to Sales account.",""],
["F3","In the purchases book, the individual suppliers' accounts are:",["Credited","Debited","Not posted","Posted to the cash book"],"Each supplier is a giver and is credited; the total is debited to Purchases.",""],
["F3","Goods with a list price of ₹10,000 are bought on credit at a 10% trade discount. The purchases book shows:",["₹9,000","₹10,000","₹1,000","₹11,000"],"Purchases are recorded at the net price after trade discount.",""],
["F3","Discount shown on the payments side of a triple-column cash book is:",["Discount received","Discount allowed","Trade discount","Bank discount"],"Discount on payments is earned from suppliers — discount received.",""],
["F3","A cheque received from a customer and deposited into the bank on the same day is entered in the:",["Bank column on the receipts side","Cash column on the receipts side","Both columns as a contra entry","Journal proper"],"It never passes through the office cash, so it goes straight to the bank column.",""],
["F3","The returns outward book is another name for the:",["Purchases returns book","Sales returns book","Bills payable book","Petty cash book"],"Goods going out to suppliers are purchases returns.",""],
["F3","An analytical petty cash book has:",["A separate column for each kind of small expense","A column for cash and one for bank","A column for discount","Only one amount column"],"Columns for postage, stationery, cartage and so on make posting easy.",""],
["F3","Old furniture sold for cash is recorded in the:",["Cash book","Sales book","Journal proper","Purchases returns book"],"Every cash transaction goes to the cash book.",""],
["F3","Ravi paid ₹1,960 and was allowed a discount of ₹40. His account is credited with:",["₹2,000","₹1,960","₹40","₹1,920"],"Cash 1,960 plus discount 40 — Ravi is cleared of ₹2,000.",""],
["F3","The bills receivable book records:",["Bills received from debtors","Bills accepted in favour of creditors","Cheques received","Invoices received"],"Bills drawn on and accepted by debtors are bills receivable.",""],
["F4","A bank reconciliation statement is prepared by:",["The account holder","The bank","The auditor only","The Reserve Bank of India"],"The firm prepares it from its own cash book and the bank statement.",""],
["F4","A favourable balance in the cash book is a:",["Debit balance","Credit balance","Nil balance","Contra balance"],"Money in the bank is an asset — a debit balance in the cash book.",""],
["F4","An overdraft as per the pass book appears as a:",["Debit balance","Credit balance","Favourable balance","Contra balance"],"In the bank's books the customer owes the bank — a debit balance.",""],
["F4","Starting from the cash book debit balance, cheques issued but not yet presented are:",["Added","Deducted","Ignored","Shown separately as a note"],"The bank has not paid them yet, so its balance is higher.",""],
["F4","Starting from the cash book debit balance, cheques deposited but not yet collected are:",["Deducted","Added","Ignored","Doubled"],"The bank has not credited them yet, so its balance is lower.",""],
["F4","Starting from the pass book balance, interest allowed by the bank (not yet in the cash book) is:",["Deducted","Added","Ignored","Added twice"],"The pass book includes it and the cash book does not, so moving to the cash book it is deducted.",""],
["F4","The cash book shows a debit balance of ₹25,000. Cheques issued ₹4,000 have not been presented and cheques deposited ₹6,500 have not been collected. What is the pass book balance?",["₹22,500","₹27,500","₹35,500","₹14,500"],"25,000 + 4,000 − 6,500 = ₹22,500.",""],
["F4","The pass book shows a credit balance of ₹18,000. Bank charges ₹200 are not in the cash book; a cheque of ₹3,000 deposited is not yet credited; a cheque of ₹5,000 issued is not yet presented. What is the cash book balance?",["₹16,200","₹15,800","₹19,800","₹26,200"],"From the pass book: + 200 + 3,000 − 5,000 → 18,000 − 1,800 = ₹16,200.",""],
["F4","The cash book shows an overdraft of ₹15,000. Cheques issued ₹2,500 are not presented and interest on overdraft ₹300 appears only in the pass book. What is the overdraft as per the pass book?",["₹12,800","₹17,800","₹12,200","₹17,200"],"−15,000 + 2,500 − 300 = −12,800, an overdraft of ₹12,800.",""],
["F4","The cash book shows a debit balance of ₹30,000. Cheques issued ₹7,000 not presented; cheques deposited ₹5,000 not cleared; interest credited ₹400; bank charges ₹150. What is the pass book balance?",["₹32,250","₹32,550","₹27,750","₹42,550"],"30,000 + 7,000 + 400 − 5,000 − 150 = ₹32,250.",""],
["F4","The cash book shows a debit balance of ₹42,000. Cheques issued ₹12,500 not presented; deposits ₹8,000 not cleared; bank charges ₹300; interest credited ₹600; direct deposit by a customer ₹4,200; insurance premium paid by the bank ₹1,500. What is the pass book balance?",["₹49,500","₹34,500","₹52,500","₹46,500"],"Add 17,300, less 9,800: 42,000 + 7,500 = ₹49,500.",""],
["F4","Starting from the cash book balance, an amount paid directly into the bank by a customer is:",["Added","Deducted","Ignored","Treated as a contra"],"The bank balance includes it but the cash book does not yet.",""],
["F4","Starting from the cash book balance, a deposited cheque that was dishonoured (entered only in the pass book) is:",["Deducted","Added","Ignored","Added to the overdraft limit"],"The bank has reversed the credit, so its balance is lower.",""],
["F4","Which of these is a timing difference between the cash book and the pass book?",["A cheque issued but not yet presented","Bank charges not known to the firm","A cheque wrongly recorded by the firm","A direct deposit by a customer"],"Cheques in transit clear by themselves later; the others need an entry or a correction.",""],
["F4","The pass book is a copy of:",["The customer's account in the bank's ledger","The firm's cash book","The firm's ledger","The bank's balance sheet"],"The bank sends the customer a copy of his account in its own books.",""],
["F4","The debit side of the bank column of the cash book was overcast by ₹500. Starting from the cash book balance, you will:",["Deduct ₹500","Add ₹500","Add ₹1,000","Ignore it"],"The cash book balance is ₹500 too high.",""],
["F4","A cheque issued for ₹1,250 was entered in the cash book as ₹1,520. Starting from the cash book balance, the adjustment is:",["Add ₹270","Less ₹270","Add ₹1,520","Less ₹1,250"],"The cash book was reduced by ₹270 too much, so ₹270 is added back.",""],
["F4","An 'amended cash book' is prepared to record:",["Items known only to the bank, such as charges, interest and direct deposits","Cheques issued but not yet presented","Cheques deposited but not yet collected","Only errors made by the bank"],"Once these are entered, the BRS needs only the timing items.",""],
["F4","Starting from the pass book balance, a dividend collected directly by the bank is:",["Deducted","Added","Ignored","Added to the cheques not presented"],"The pass book includes it; moving to the cash book, deduct it.",""],
["F4","Starting from the cash book balance, an insurance premium paid by the bank under a standing instruction is:",["Deducted","Added","Ignored","Shown as a contra"],"The bank has paid it out, so its balance is lower.",""],
["F4","A bank reconciliation statement is:",["A statement prepared to explain the difference between two balances","An account in the general ledger","A book of original entry","A part of the final accounts"],"It is a working statement, not part of the double entry.",""],
["F4","A credit balance in the pass book means:",["The bank owes the customer — a favourable balance","The customer owes the bank","The account is overdrawn","There is an error in the pass book"],"In the bank's books the customer is a creditor.",""],
["F4","The cash book shows a debit balance of ₹10,000 and the only difference is a cheque of ₹2,000 deposited but not yet credited. The pass book balance is:",["₹8,000","₹12,000","₹10,000","₹2,000"],"The bank has not yet added the ₹2,000.",""],
["F5","Purchase of machinery debited to Purchases account is an error of:",["Principle","Omission","Commission","Compensation"],"A capital item treated as revenue is an error of principle.",""],
["F5","A credit sale to Ravi not entered in any book is an error of:",["Complete omission","Partial omission","Commission","Principle"],"Nothing was recorded at all, so the trial balance still agrees.",""],
["F5","₹540 received from Asha was posted to her account as ₹450. This is an error of:",["Commission","Omission","Principle","Compensation"],"A wrong amount posted is a clerical error of commission.",""],
["F5","Wages account is overcast by ₹500 and Commission received account is also overcast by ₹500. These are:",["Compensating errors","Errors of principle","Errors of omission","Errors of original entry"],"An excess debit and an excess credit of the same amount cancel out.",""],
["F5","Which of these errors does NOT affect the agreement of the trial balance?",["An error of principle","Wrong totalling of the purchases book","Posting to the wrong side of an account","Wrong balancing of an account"],"An error of principle puts the right amount on the right side of the wrong kind of account.",""],
["F5","Which of these errors DOES affect the agreement of the trial balance?",["Wrong totalling of the sales book","Complete omission of a transaction","Posting to the wrong customer on the correct side","An error of principle"],"A casting error changes one side only.",""],
["F5","A suspense account is opened when:",["The trial balance does not agree","The firm makes a loss","A debtor becomes insolvent","Goods are sent on consignment"],"The difference is parked in suspense until the errors are found.",""],
["F5","The debit side of a trial balance exceeds the credit side by ₹2,000. The suspense account will show:",["A credit of ₹2,000","A debit of ₹2,000","A credit of ₹4,000","A debit of ₹1,000"],"Suspense goes on the short side — here the credit side.",""],
["F5","The sales book was undercast by ₹1,000. The rectifying entry is:",["Suspense A/c Dr, To Sales A/c","Sales A/c Dr, To Suspense A/c","Debtors A/c Dr, To Sales A/c","Sales A/c Dr, To Debtors A/c"],"Sales must be credited with ₹1,000 more; the other side is suspense because customers were posted correctly.",""],
["F5","Repairs to a building of ₹2,000 were debited to Building account. The rectifying entry is:",["Repairs A/c Dr, To Building A/c","Building A/c Dr, To Repairs A/c","Repairs A/c Dr, To Suspense A/c","Suspense A/c Dr, To Building A/c"],"Move the amount from the asset to the expense account.",""],
["F5","Furniture of ₹8,000 was bought on credit and passed through the purchases book. Before correction, the profit is:",["Understated by ₹8,000","Overstated by ₹8,000","Understated by ₹16,000","Not affected"],"Purchases (an expense) were overstated, so profit was understated.",""],
["F5","Wages of ₹3,000 paid for installing a new machine were debited to Wages account. The rectifying entry is:",["Machinery A/c Dr, To Wages A/c","Wages A/c Dr, To Machinery A/c","Machinery A/c Dr, To Suspense A/c","Suspense A/c Dr, To Wages A/c"],"Installation wages are part of the machine's cost.",""],
["F5","₹500 received from Ram was credited to Shyam's account. The rectifying entry is:",["Shyam Dr, To Ram","Ram Dr, To Shyam","Suspense A/c Dr, To Ram","Cash A/c Dr, To Ram"],"Cancel the wrong credit to Shyam and give it to Ram.",""],
["F5","Discount allowed of ₹300 was posted to the customer's account but not to Discount allowed account. The rectifying entry is:",["Discount allowed A/c Dr ₹300, To Suspense A/c","Suspense A/c Dr ₹300, To Discount allowed A/c","Customer's A/c Dr ₹300, To Discount allowed A/c","Discount allowed A/c Dr ₹300, To Customer's A/c"],"Only the discount account is missing its debit, so suspense takes the credit.",""],
["F5","A credit sale of ₹1,200 was posted to Mohan's account as ₹2,100. The rectifying entry is:",["Suspense A/c Dr ₹900, To Mohan ₹900","Mohan Dr ₹900, To Suspense A/c ₹900","Sales A/c Dr ₹900, To Mohan ₹900","Mohan Dr ₹900, To Sales A/c ₹900"],"Mohan was debited ₹900 too much; sales were right, so suspense takes the other side.",""],
["F5","After a trial balance failed to agree, three errors were found: the sales book was undercast by ₹1,000; discount allowed of ₹300 was not posted to the discount account; and a credit sale of ₹1,200 was posted to the customer as ₹2,100. What was the original suspense balance?",["₹1,600 credit","₹1,600 debit","₹400 credit","₹2,200 debit"],"Debits were ₹600 too high (900 − 300) and credits ₹1,000 too low, so debits exceeded credits by ₹1,600 — suspense credit.",""],
["F5","An error in a nominal account found after the final accounts are prepared is corrected through the:",["Profit and Loss Adjustment account","Suspense account","Trading account","Capital reserve"],"Last year's nominal accounts are closed, so the correction goes through P&L Adjustment.",""],
["F5","Goods of ₹5,000 sold to Arun were entered in the purchases book. In the rectifying entry, Arun is debited with:",["₹10,000","₹5,000","₹2,500","Nothing"],"Arun was wrongly credited ₹5,000 and should have been debited ₹5,000 — a swing of ₹10,000.",""],
["F5","Clerical errors include errors of:",["Omission, commission and compensation","Principle only","Principle and omission only","Principle and compensation only"],"An error of principle is not clerical — it comes from not knowing the rules.",""],
["F5","Old machinery sold for ₹6,000 was credited to Sales account. The rectifying entry is:",["Sales A/c Dr, To Machinery A/c","Machinery A/c Dr, To Sales A/c","Suspense A/c Dr, To Machinery A/c","Cash A/c Dr, To Machinery A/c"],"The sale of an asset reduces the asset, not sales.",""],
["F5","The purchases returns book was overcast by ₹200. The rectifying entry is:",["Purchases returns A/c Dr ₹200, To Suspense A/c","Suspense A/c Dr ₹200, To Purchases returns A/c","Creditors A/c Dr ₹200, To Purchases returns A/c","Purchases A/c Dr ₹200, To Suspense A/c"],"The returns account was credited ₹200 too much; suppliers were posted correctly.",""],
["F5","A credit sale is posted to the customer's account but left out of the sales book, so Sales account never receives it. This is an error of:",["Partial omission","Complete omission","Principle","Compensation"],"One side was recorded and the other missed, so the trial balance is affected.",""],
["F5","Entering a credit sale of ₹2,500 in the sales book as ₹2,050 is an error that:",["Does not affect the trial balance","Affects only the debit side of the trial balance","Affects only the credit side of the trial balance","Is corrected through the suspense account"],"The wrong figure is carried to both the customer and the sales account.",""],
["F5","After all the errors have been rectified, the suspense account:",["Shows no balance","Shows a debit balance","Shows a credit balance","Goes to the balance sheet as an asset"],"Each one-sided error removes part of it until it closes.",""],
["F5","The sale of old furniture credited to Sales account is an error of:",["Principle","Commission","Omission","Compensation"],"A capital receipt treated as revenue is an error of principle.",""],
["F6","Under the straight line method, the depreciation charged each year:",["Remains the same","Falls every year","Rises every year","Depends on the market price"],"SLM spreads the depreciable amount equally over the asset's life.",""],
["F6","Under the written down value method, the depreciation charged each year:",["Falls every year","Remains the same","Rises every year","Is nil after the third year"],"A fixed rate on a falling book value gives a falling charge.",""],
["F6","The written down value method is also called the:",["Reducing balance method","Fixed instalment method","Original cost method","Annuity method"],"It is also known as the reducing or diminishing balance method.",""],
["F6","The most suitable method of depreciation for a mine or quarry is the:",["Depletion method","Revaluation method","Annuity method","Straight line method"],"Depletion charges a fixed amount per tonne of mineral raised.",""],
["F6","Loose tools and livestock are usually depreciated by the:",["Revaluation method","Depletion method","Sum of years' digits method","Machine hour rate method"],"Their value is easier to find by valuing them each year.",""],
["F6","The annuity method of depreciation takes into account:",["Interest on the money invested in the asset","The market value of the asset","The number of hours the asset runs","The output of the asset"],"It treats the cost as an investment that should earn interest; it suits leases.",""],
["F6","Which of these assets is NOT depreciated?",["Freehold land","Leasehold land","Buildings","Patents"],"Freehold land does not wear out; leases and patents are written off over their life.",""],
["F6","Depreciation is:",["A charge against profit","An appropriation of profit","A capital receipt","A cash payment"],"It is an expense that must be charged whether there is profit or not.",""],
["F6","A machine costs ₹1,00,000 and ₹10,000 is spent on installing it. Its scrap value is ₹10,000 and its life 10 years. Annual depreciation on SLM is:",["₹10,000","₹11,000","₹9,000","₹12,000"],"(1,10,000 − 10,000) ÷ 10 = ₹10,000.",""],
["F6","A machine costing ₹2,00,000 is depreciated at 10% a year on WDV. Depreciation for the third year is:",["₹16,200","₹20,000","₹18,000","₹14,580"],"Year 1 20,000 (book value 1,80,000); year 2 18,000 (1,62,000); year 3 10% of 1,62,000 = ₹16,200.",""],
["F6","A machine costing ₹2,00,000 is depreciated at 10% a year on WDV. Its book value at the end of three years is:",["₹1,45,800","₹1,40,000","₹1,62,000","₹1,31,220"],"2,00,000 × 0.9 × 0.9 × 0.9 = ₹1,45,800.",""],
["F6","A machine bought for ₹50,000 is depreciated at 10% a year on SLM and sold after exactly three years for ₹32,000. The result of the sale is:",["A loss of ₹3,000","A profit of ₹3,000","A loss of ₹18,000","A profit of ₹7,000"],"Book value = 50,000 − 15,000 = 35,000; 32,000 − 35,000 = loss ₹3,000.",""],

["F10","A partner draws ₹6,000 at the beginning of every quarter. At 10% a year, interest on his drawings for the year is:",["₹1,500","₹900","₹1,200","₹2,400"],"24,000 × 10% × 7.5/12 = ₹1,500.",""],
["F10","Net profit ₹1,00,000; A's capital ₹2,00,000 and B's ₹1,00,000 earn 10% interest; B gets a salary of ₹12,000; ratio 3 : 2. A's share of the remaining profit is:",["₹34,800","₹46,800","₹60,000","₹23,200"],"1,00,000 − 30,000 − 12,000 = 58,000; 3/5 = ₹34,800.",""],
["F10","The goodwill of a firm is valued at ₹60,000. C joins for a 1/4 share and brings his share of goodwill in cash. He brings:",["₹15,000","₹20,000","₹60,000","₹12,000"],"1/4 × 60,000 = ₹15,000, credited to the sacrificing partners.",""],
["F10","Premium for goodwill brought in by a new partner is credited to the old partners in their:",["Sacrificing ratio","Capital ratio","Gaining ratio","New ratio"],"It compensates them for the share they give up.",""],
["F10","On admission, a revaluation profit is credited to the old partners in their:",["Old ratio","New ratio","Sacrificing ratio","Capital ratio"],"The gain arose while the old partners owned the firm.",""],
["F10","On revaluation, buildings rise by ₹20,000, stock falls by ₹5,000 and a new provision of ₹3,000 is made for doubtful debts. A and B share 3 : 2. A's share of the revaluation profit is:",["₹7,200","₹4,800","₹12,000","₹13,800"],"Gain = 20,000 − 5,000 − 3,000 = 12,000; 3/5 = ₹7,200.",""],
["F10","A partner owning 1/4 of the profits dies three months into the year. Last year's profit was ₹1,20,000 and profits are to be shared on a time basis. His share of profit to the date of death is:",["₹7,500","₹30,000","₹10,000","₹22,500"],"1,20,000 × 3/12 × 1/4 = ₹7,500.",""],
["F10","Under the fixed capital method, partners' salaries and interest are recorded in their:",["Current accounts","Capital accounts","Loan accounts","Drawings accounts only"],"Capital accounts stay fixed; adjustments go to current accounts.",""],
["F10","Under the decision in Garner v Murray, an insolvent partner's deficiency is borne by the solvent partners in the ratio of their:",["Capitals","Profit-sharing","Drawings","Loans"],"The rule uses the solvent partners' capital ratio.",""],
["F10","The maximum number of partners in a firm under the Companies Act 2013 and its rules is:",["50","20","100","10"],"Section 464 allows up to 100; the Companies (Miscellaneous) Rules 2014 fix it at 50.",""],
["F10","Under AS 26, goodwill is recorded in the books only when it is:",["Purchased for a price","Generated by the firm itself","Valued by a partner","Shown in the deed"],"Self-generated goodwill is not recognised as an asset.",""],
["F11","In a consignment, the owner who sends the goods is the:",["Consignor","Consignee","Co-venturer","Drawee"],"The consignor is the principal; the consignee is the agent.",""],
["F11","The statement sent by the consignee showing sales, expenses and commission is the:",["Account sales","Proforma invoice","Debit note","Credit note"],"The proforma invoice goes with the goods; the account sales comes back.",""],
["F11","A proforma invoice is sent by the:",["Consignor to the consignee","Consignee to the consignor","Bank to the consignor","Consignee to the buyers"],"It describes the goods sent; it is not a demand for payment.",""],
["F11","Del credere commission is paid to the consignee for:",["Bearing the risk of bad debts","Selling above the target","Storing the goods","Insuring the goods in transit"],"With del credere, the consignee makes good any bad debts.",""],
["F11","When goods are sent on consignment, the consignor debits the:",["Consignment account","Consignee's account","Sales account","Goods sent on consignment account"],"Consignment A/c Dr, To Goods sent on consignment A/c.",""],
["F11","Sending goods on consignment is NOT a sale because:",["Ownership stays with the consignor","The goods are sent by rail","The price is not fixed","The consignee is a stranger"],"The consignee is only an agent.",""],
["F11","Which expense is added to the value of unsold stock on consignment?",["Freight paid to bring the goods to the consignee","Godown rent paid by the consignee","Commission to the consignee","Advertisement by the consignee"],"Only non-recurring costs of bringing goods to the place of sale are added.",""],
["F11","100 sets costing ₹2,000 each are sent; the consignor pays freight ₹5,000 and the consignee pays unloading ₹1,000. If 20 sets are unsold, the stock on consignment is:",["₹41,200","₹40,000","₹41,000","₹46,000"],"40,000 + (6,000 × 20/100) = ₹41,200.",""],
["F11","Goods costing ₹2,00,000 are consigned; consignor's freight ₹5,000; consignee's unloading ₹1,000 and godown rent ₹1,500; sales ₹2,08,000; commission ₹10,400; closing stock ₹41,200. The profit on consignment is:",["₹31,300","₹30,100","₹41,200","₹8,000"],"2,08,000 + 41,200 − 2,17,900 = ₹31,300.",""],
["F11","1,000 kg at ₹50 a kg are consigned and the consignor pays freight of ₹5,000. 100 kg are stolen in transit. The abnormal loss is:",["₹5,500","₹5,000","₹500","₹4,500"],"100 kg × (50 + 5) = ₹5,500.",""],
["F11","1,000 kg costing ₹45,000 in all suffer a normal loss of 100 kg. The value of 200 kg of closing stock is:",["₹10,000","₹9,000","₹11,000","₹9,500"],"Cost per good kg = 45,000 ÷ 900 = ₹50; 200 kg = ₹10,000.",""],
["F11","A normal loss on consignment is:",["Absorbed by the remaining units, raising their cost","Debited to the P&L account","Claimed from the insurer","Borne by the consignee"],"It is unavoidable, so it is part of the cost of the goods that survive.",""],
["F11","Goods costing ₹80,000 are consigned at an invoice price 25% above cost. The loading is:",["₹20,000","₹16,000","₹25,000","₹1,00,000"],"Invoice price 1,00,000 − cost 80,000 = ₹20,000.",""],
["F11","Sales of ₹2,08,000 are made on consignment. Ordinary commission is 5% and del credere commission 2% on sales. Total commission is:",["₹14,560","₹10,400","₹4,160","₹12,480"],"7% of 2,08,000 = ₹14,560.",""],
["F11","A joint venture is best described as a:",["Temporary partnership for a particular venture","Permanent partnership with a firm name","Company with limited liability","Principal–agent arrangement"],"It ends when the venture is over.",""],
["F11","When separate books are kept for a joint venture, the account opened for its cash is the:",["Joint bank account","Memorandum joint venture account","Consignment account","Account sales"],"All venture money passes through the joint bank account.",""],
["F11","When each co-venturer keeps his own records, the venture's profit is found from a:",["Memorandum joint venture account","Joint bank account","Consignment account","Profit and loss appropriation account"],"It combines both venturers' figures to find the profit.",""],
["F11","If there is no agreement, joint venture profit is shared:",["Equally","In the ratio of money put in","In the ratio of sales made","By the venturer who sold the goods"],"As in a partnership, equally.",""],
["F11","A and B share 3 : 2. A buys goods for ₹60,000 and pays freight ₹4,000; B sells them for ₹90,000, pays ₹2,000 in expenses and gets 2% commission on sales. The venture's profit is:",["₹22,200","₹24,000","₹26,000","₹20,400"],"90,000 − 60,000 − 4,000 − 2,000 − 1,800 = ₹22,200.",""],
["F11","In a joint venture A spent ₹64,000 on goods and freight. B sold the goods for ₹90,000 and spent ₹3,800 on expenses and his commission. The profit of ₹22,200 is shared 3 : 2, and B holds the sale proceeds. How much must B pay A to settle?",["₹77,320","₹64,000","₹73,320","₹86,200"],"A is owed his outlay 64,000 plus his profit share 13,320 = ₹77,320; B keeps 3,800 + 8,880.",""],
["F11","Unsold stock of a joint venture taken over by a co-venturer is:",["Credited to the joint venture account","Debited to the joint venture account","Credited to the joint bank account","Ignored"],"It is like a sale to that venturer.",""],
["F11","Goods lost by theft on the way to the consignee are an example of:",["Abnormal loss","Normal loss","Selling expense","Loading"],"Theft and fire are avoidable losses.",""],
["F11","An overriding commission is given to a consignee for:",["Selling above a target or promoting a new product","Bearing bad debts","Storing goods","Collecting bills"],"It is extra commission over the ordinary rate.",""],
["F12","Under the single entry system, the records usually kept are:",["The cash book and personal accounts","Real and nominal accounts only","All three types of account","Only a journal"],"Real and nominal accounts are missing, so there is no trial balance.",""],
["F12","A statement of affairs is prepared to find the:",["Capital on a date","Gross profit","Cash balance","Credit sales"],"Capital is the balancing figure: assets − liabilities.",""],
["F12","Capital on 1 April ₹1,50,000; capital on 31 March ₹1,90,000; drawings ₹24,000; fresh capital ₹10,000. The profit for the year is:",["₹54,000","₹40,000","₹74,000","₹26,000"],"1,90,000 − 1,50,000 + 24,000 − 10,000 = ₹54,000.",""],
["F12","Opening capital ₹60,000; closing capital ₹50,000; drawings ₹8,000; no fresh capital. The result for the year is:",["A loss of ₹2,000","A profit of ₹2,000","A loss of ₹10,000","A profit of ₹18,000"],"50,000 − 60,000 + 8,000 = −2,000, a loss.",""],
["F12","Cash ₹5,000; stock ₹20,000; debtors ₹15,000; furniture ₹10,000; creditors ₹12,000. Capital as per the statement of affairs is:",["₹38,000","₹50,000","₹62,000","₹26,000"],"50,000 assets − 12,000 liabilities = ₹38,000.",""],
["F12","Opening debtors ₹30,000; closing debtors ₹40,000; cash received ₹1,20,000; discount allowed ₹2,000; bad debts ₹1,000; sales returns ₹3,000. Credit sales are:",["₹1,36,000","₹1,30,000","₹1,10,000","₹1,96,000"],"40,000 + 1,20,000 + 2,000 + 1,000 + 3,000 − 30,000 = ₹1,36,000.",""],
["F12","Opening creditors ₹25,000; closing creditors ₹35,000; cash paid ₹90,000; discount received ₹1,500; purchases returns ₹2,500. Credit purchases are:",["₹1,04,000","₹1,00,000","₹96,000","₹1,54,000"],"35,000 + 90,000 + 1,500 + 2,500 − 25,000 = ₹1,04,000.",""],
["F12","A gross profit of 25% on cost equals what percentage on sales?",["20%","25%","33⅓%","16⅔%"],"25 ÷ 125 = 20%.",""],
["F12","A gross profit of 20% on cost equals what fraction of sales?",["1/6","1/5","1/4","1/3"],"20 ÷ 120 = 1/6.",""],
["F12","Cost of goods sold is ₹1,20,000 and gross profit is 25% on cost. Sales are:",["₹1,50,000","₹1,60,000","₹1,44,000","₹1,40,000"],"1,20,000 × 125/100 = ₹1,50,000.",""],
["F12","Opening stock ₹40,000; purchases ₹1,60,000; sales ₹2,00,000; gross profit 25% on sales; stock salvaged ₹5,000. The stock lost in the fire is:",["₹45,000","₹50,000","₹55,000","₹35,000"],"Stock at the fire = 2,00,000 − 1,50,000 = 50,000; less salvage 5,000.",""],
["F12","A Receipts and Payments account is a:",["Real account","Nominal account","Personal account","Valuation account"],"It summarises the cash book.",""],
["F12","An Income and Expenditure account is prepared on the:",["Accrual basis","Cash basis","Single entry basis","Hybrid basis"],"It records the revenue items of the year whether paid or not.",""],
["F12","The excess of income over expenditure of a non-profit organisation is called a:",["Surplus","Net profit","Gross profit","Capital receipt"],"NPOs show a surplus or deficit, not a profit.",""],
["F12","Life membership fees received by a club are:",["A capital receipt","A revenue receipt","An expense","A liability for one year only"],"They are one-time and are capitalised.",""],
["F12","A legacy received by a club is generally:",["Capitalised","Credited to the I&E account","Treated as subscription","Shown as a liability"],"A legacy is a one-time gift under a will.",""],
["F12","A donation received for a building fund is:",["Credited to the building fund","Credited to the I&E account","Debited to the building account","Treated as subscription"],"Specific donations are capital and go to their fund.",""],
["F12","Annual subscriptions received by a club are:",["Revenue receipts","Capital receipts","Liabilities","Capital fund"],"They recur every year.",""],
["F12","Subscriptions received in 2025-26 were ₹50,000, including ₹3,000 for 2024-25 and ₹2,000 for 2026-27. ₹4,000 is still due for 2025-26. The subscription income for 2025-26 is:",["₹49,000","₹50,000","₹51,000","₹45,000"],"50,000 − 3,000 − 2,000 + 4,000 = ₹49,000.",""],
["F12","A club has 200 members paying ₹500 a year. It received ₹92,000 in subscriptions for the current year. Subscriptions outstanding are:",["₹8,000","₹92,000","₹1,00,000","₹10,000"],"200 × 500 = 1,00,000 due; 1,00,000 − 92,000 = ₹8,000.",""],
["F12","At the start of the year a club has cash ₹10,000, furniture ₹40,000 and subscriptions due ₹3,000, and owes salaries of ₹2,000. Its capital fund is:",["₹51,000","₹55,000","₹53,000","₹50,000"],"53,000 assets − 2,000 liabilities = ₹51,000.",""],
["F12","Opening stock of stationery ₹3,000; purchases ₹12,000; closing stock ₹4,000. Stationery consumed, shown in the I&E account, is:",["₹11,000","₹15,000","₹19,000","₹13,000"],"3,000 + 12,000 − 4,000 = ₹11,000.",""],
["F12","A club sells old furniture with a book value of ₹8,000 for ₹5,000. The I&E account shows:",["A loss of ₹3,000","An income of ₹5,000","An expense of ₹8,000","Nothing"],"The ₹5,000 is a capital receipt in R&P; only the loss goes to I&E.",""],
["F12","A prize fund stands at ₹50,000. Interest of ₹4,000 is earned on its investments and prizes of ₹6,000 are awarded. The fund now stands at:",["₹48,000","₹50,000","₹56,000","₹44,000"],"50,000 + 4,000 − 6,000 = ₹48,000.",""],
["F12","The opening balance of a Receipts and Payments account is:",["Cash and bank in hand","The capital fund","The surplus of last year","Outstanding subscriptions"],"It starts with the cash and bank balances.",""],
["F12","Depreciation on a club's furniture is shown in the:",["Income and Expenditure account","Receipts and Payments account","Both accounts","Neither account"],"R&P shows only cash; depreciation is a non-cash expense.",""],
["F13","The main purpose of self-balancing ledgers is to:",["Locate errors quickly in a particular ledger","Do away with the trial balance","Avoid preparing final accounts","Record cash sales"],"Each ledger balances by itself, so an error is traced to one ledger.",""],
["F13","Under the self-balancing system, the account opened in the debtors' ledger is the:",["General Ledger Adjustment account","Debtors' Ledger Adjustment account","Total Creditors account","Suspense account"],"The debtors' ledger holds a mirror of the general ledger.",""],
["F13","Under the self-balancing system, the account opened in the general ledger for debtors is the:",["Debtors' Ledger Adjustment account","General Ledger Adjustment account","Sales account","Bills receivable account"],"It sums up the whole debtors' ledger.",""],
["F13","Credit sales are posted to the Debtors' Ledger Adjustment account in the general ledger on the:",["Debit side","Credit side","Either side","They are not posted"],"Credit sales increase what debtors owe.",""],
["F13","Cash received from debtors is posted to the Debtors' Ledger Adjustment account (general ledger) on the:",["Credit side","Debit side","Either side","It is not posted"],"It reduces debtors.",""],
["F13","Which item is NOT recorded in the Debtors' Ledger Adjustment account?",["Cash sales","Credit sales","Discount allowed","Bills receivable dishonoured"],"Cash sales never touch a debtor's account.",""],
["F13","Provision for doubtful debts is:",["Not recorded in the Debtors' Ledger Adjustment account","Debited to it","Credited to it","Recorded in the creditors' ledger"],"The provision is kept in the general ledger, not against individual debtors.",""],
["F13","A bill receivable dishonoured is shown in the Debtors' Ledger Adjustment account (general ledger) on the:",["Debit side","Credit side","Neither side","Both sides"],"The debtor owes the amount again.",""],
["F13","Opening debtors ₹60,000; credit sales ₹2,50,000; cash received ₹1,90,000; discount allowed ₹5,000; returns ₹8,000; bad debts ₹3,000; bills received ₹20,000; a bill dishonoured ₹4,000; transfer to creditors' ledger ₹6,000. Closing debtors are:",["₹82,000","₹74,000","₹90,000","₹1,22,000"],"3,14,000 debits − 2,32,000 credits = ₹82,000.",""],
["F13","Opening creditors ₹45,000; credit purchases ₹1,80,000; paid ₹1,40,000; discount received ₹3,000; returns ₹5,000; bills payable accepted ₹15,000; transfer from debtors' ledger ₹6,000. Closing creditors are:",["₹56,000","₹62,000","₹71,000","₹50,000"],"2,25,000 − 1,69,000 = ₹56,000.",""],
["F13","A transfer of a debit balance in the debtors' ledger to the same party's account in the creditors' ledger:",["Reduces both total debtors and total creditors","Increases both","Reduces debtors and increases creditors","Has no effect on either total"],"The set-off cancels part of what each side owes.",""],
["F13","Under sectional balancing, the total debtors and total creditors accounts are:",["Memorandum accounts outside the double entry","Part of the double entry in every ledger","Kept in the debtors' ledger only","Not prepared at all"],"They only check the personal ledgers.",""],
["F13","The creditors' ledger is also called the:",["Bought ledger","Sales ledger","General ledger","Private ledger"],"Debtors' ledger = sales ledger; creditors' ledger = bought ledger.",""],
["F13","Discount allowed is posted to the Debtors' Ledger Adjustment account (general ledger) on the:",["Credit side","Debit side","Neither side","Both sides"],"It reduces the amount debtors owe.",""],
["F13","Bad debts recovered (written off in an earlier year) are:",["Not recorded in the Debtors' Ledger Adjustment account","Debited to it","Credited to it","Transferred to the creditors' ledger"],"The debtor's account is not revived; the recovery is an income.",""],
["F13","Under self-balancing, each ledger:",["Can produce its own trial balance","Needs the others to balance","Has no adjustment account","Records only cash"],"The adjustment account in each ledger makes it self-contained.",""],
["F13","Which is an advantage of self-balancing ledgers?",["Internal check and division of work","No need to keep a cash book","No need for adjustment accounts","Profit is found without final accounts"],"Different clerks can keep and check different ledgers.",""],
["F13","Sales returns are posted to the Debtors' Ledger Adjustment account (general ledger) on the:",["Credit side","Debit side","Neither side","Debit side, with cash sales"],"Returns reduce the amount debtors owe.",""],
["F13","Purchases returns are posted to the Creditors' Ledger Adjustment account (general ledger) on the:",["Debit side","Credit side","Neither side","Either side"],"Returns reduce what is owed to creditors, so the creditors' total is debited.",""],
["F13","Credit purchases are posted to the Creditors' Ledger Adjustment account (general ledger) on the:",["Credit side","Debit side","Neither side","They go to the debtors' ledger"],"They increase what the firm owes its suppliers.",""],
["F13","Trade discount given to customers is:",["Not recorded anywhere in the books","Credited to the Debtors' Ledger Adjustment account","Debited to the Debtors' Ledger Adjustment account","Recorded in the creditors' ledger"],"Trade discount never enters the books.",""],
["F13","The general ledger contains:",["Real, nominal and capital accounts, with the adjustment accounts","Only debtors' accounts","Only creditors' accounts","Only cash and bank"],"Personal accounts of customers and suppliers go to their own ledgers.",""],
["F14","Which Article of the Constitution deals with the duties and powers of the CAG?",["Article 149","Article 148","Article 150","Article 151"],"Article 149 leaves the duties and powers to Parliament, which passed the DPC Act 1971.",""],

["F14","Under the DPC Act 1971, the audit of government companies and corporations is covered by:",["Section 19","Section 13","Section 16","Section 10"],"Section 19 covers government companies and corporations.",""],
["F14","Under Section 14 of the DPC Act, a body is 'substantially financed' if its government grants or loans are at least ₹25 lakh and make up at least what share of its spending?",["75%","50%","25%","90%"],"Section 14(1) uses ₹25 lakh and 75% of total expenditure.",""],

["F14","An audit that checks whether money was spent under the law, the rules and a proper sanction is a:",["Regularity audit","Propriety audit","Performance audit","Supplementary audit"],"Regularity audit is the rule-based part of compliance audit.",""],
["F14","An audit that certifies whether accounts give a true and fair view is a:",["Financial (attest) audit","Performance audit","Propriety audit","Pre-audit"],"It is also called certification audit.",""],

["F14","The administrative expenses of the CAG's office are:",["Charged on the Consolidated Fund of India","Voted by Parliament every year","Paid from the Contingency Fund","Paid by the states in proportion"],"Article 148(6) charges them on the Consolidated Fund.",""],
["F14","The first Auditor General of India, appointed in 1860, was:",["Sir Edward Drummond","V. Narahari Rao","Sir Basil Blackett","Lord Canning"],"V. Narahari Rao was the first CAG of independent India (1948).",""],

  .steps + .stack > .plain,.steps + .stack > .row,.steps + .stack > p,.steps + .stack > .fig,.steps + .stack > h2,.steps + .stack > .tbl{grid-column:1/-1}
  .steps + .stack > .plain{max-width:86ch;font-size:17px}
  .steps + .stack > .hot,.steps + .stack > .story{grid-column:1/-1}
  .steps + .stack > .story{max-width:none;padding:20px 24px;font-size:17.5px}
  .steps + .stack > .story p{max-width:80ch}
  .steps + .stack:not(:has(> .block ~ .block)) > .block{grid-column:1/-1}
  .block,.qcard{padding:18px 20px;border-radius:14px}

  /* quizzes and question bank */
  #lq > .stack{display:grid;grid-template-columns:minmax(0,1fr);max-width:980px;gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qt{font-size:18px}
  #plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #plist .opts{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:wrap;overflow:visible}

  /* mock test: question with the answer grid alongside */
  .mbar{top:calc(env(safe-area-inset-top,0px) + 67px)}
  .view > .qcard{max-width:1000px}
  .view > .row.between{max-width:1000px}
  .view > #msub{max-width:1000px;width:100%}
  .view > .block.stack{max-width:760px}
  .pal{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .kpis{max-width:760px}

  /* revise: summary cards and sheets in columns */
  #rv > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #rv > .stack > .grph,#rv > .stack > p,#rv > .stack > .search,#rv > .stack > .callout{grid-column:1/-1}
  #dgl,#lml,#tll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #dgl > .grph,#dgl > p,#lml > p,#tll > .grph{grid-column:1/-1}
  #rv .search,#rv > #dgl ~ .search{max-width:520px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flash{min-height:300px;max-width:760px;margin:0 auto;padding:32px 36px}
  .flash .front{font-size:22px}

  /* learn: era cards across the top */
  .eras{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}
  .les{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}

</style>
<script id="shabd-deeplink">
(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();
</script>

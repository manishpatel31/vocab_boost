<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">

<title>Government Schemes Workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martel:wght@700;800&family=Mukta:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a government gazette — warm ivory paper, deep forest-green ink, saffron highlights; one-column app with a bottom tab bar. */
:root{
  --paper:#f6f3ea; --sheet:#fffdf7; --sunk:#ebe6d8;
  --ink:#1d2a22; --ink2:#56625a; --rule:#dcd5c3;
  --blue:#1f5c3d; --on-blue:#ffffff; --blue-bg:#dcebdf;
  --accent:#b4530f; --accent-bg:#fbe7d3;
  --good:#1b7547; --good-bg:#dff1e6; --bad:#b0271f; --bad-bg:#f8e1de;
  --warn-bg:#fff2d2;
  --f-display:"Martel", "Noto Serif Devanagari", Georgia, serif;
  --f-body:"Mukta", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap{border-radius:var(--r);padding:12px 14px 12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.trick .lab,.trap .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.pyr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pyr div{text-align:center;font-size:13px}
.pyr b{display:block;font-size:14px}
.pm{fill:var(--blue)} .pf{fill:var(--accent)}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.pal button.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.pal button.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.rk{display:grid;gap:0}
.rk div{display:grid;grid-template-columns:minmax(0,48%) 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:15px}
.rk div:first-child{border-top:0}
.rk dt{font-size:13px;color:var(--ink2);margin:0}
.rk dt.up{color:var(--good)} .rk dt.dn{color:var(--bad)}
.rk dd{margin:0;font-weight:600;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:24px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.gbar{display:grid;grid-template-columns:78px 1fr 52px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.gbar .tr{height:12px;background:var(--sunk);border-radius:3px;position:relative;overflow:hidden}
.gbar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:3px}
.gbar .tr i.neg{background:var(--bad)}
.gbar .v{font-family:var(--f-num);text-align:right}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
@media (prefers-reduced-motion: no-preference){ .opt,.chip,.btn{transition:background-color .15s, border-color .15s} }
.link{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px}
.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.icheck{background:var(--sheet);border:1.5px dashed var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.icheck .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.cat{font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;white-space:nowrap}
.cat.CS{background:var(--blue-bg);color:var(--blue)} .cat.CSS{background:var(--accent-bg);color:var(--accent)} .cat.ST{background:var(--sunk);color:var(--ink)} .cat.OT{background:var(--sunk);color:var(--ink2)}
</style>

<script>
"use strict";
const LESSONS = [
{ id:"L1", title:"How to study schemes", hi:"योजनाएँ कैसे पढ़ें", blocks:[
 {k:"p", h:"Every CGL shift asks 1–3 scheme questions. They come in only a few shapes: <b>ministry</b>, <b>launch year / date</b>, <b>launch place</b>, <b>objective</b>, <b>beneficiaries & eligibility</b>, <b>amount</b> (loan, pension, subsidy), <b>outlay</b>, <b>full form</b>, and <b>which one is NOT a feature</b>. Each lesson here is built around those shapes."},
 {k:"table", title:"Two kinds of central schemes", head:["Type","Money","Examples"], rows:[["Central Sector (CS)","100% from the Centre; run by central ministries","PM-KISAN, PM SVANidhi, PM-DevINE, VVP-II, PM Vishwakarma, PM-VBRY"],["Centrally Sponsored (CSS)","Centre + State share; states implement","MGNREGA/VB-G RAM G, PMAY, JJM, PM POSHAN, PM SHRI, Samagra Shiksha, Mission Vatsalya, RKVY"]]},
 {k:"table", title:"CSS sharing pattern (Centre : State)", head:["States / UTs","Share"], rows:[["General states","60 : 40"],["8 North-East + Himalayan states (HP, Uttarakhand) + UT of J&K","90 : 10"],["UTs without legislature (Ladakh, Chandigarh, A&N, Lakshadweep, DNH&DD)","100 : 0"],["UTs with legislature (Delhi, Puducherry, J&K)","J&K 90:10; Delhi & Puducherry 60:40"]]},
 {k:"trick", h:"<b>6-9-100</b>: sixty (general), ninety (NE & hills), hundred (UTs without an assembly). Only <b>three</b> UTs have a legislature: <b>D</b>elhi, <b>P</b>uducherry, <b>J</b>&K → “<b>DPJ</b>”."},
 {k:"q", q:"PM-KISAN is funded 100% by the Centre. It is therefore a …", o:["Central Sector scheme","Centrally Sponsored scheme","State scheme","Core of the core scheme"], e:"100% central funding = Central Sector. Shared funding = Centrally Sponsored."},
 {k:"link", h:"<b>Study schemes as a story, not a list.</b> The second lecture's method: every scheme answers a problem the previous one left behind. <i>No bank account → Jan Dhan → no collateral → MUDRA → SC/ST and women left out → Stand-Up India.</i> <i>Make in India → PLI → ECMS → MPMS → Semiconductor Mission.</i> You will see these chains marked <b>Link</b> in every lesson."},
 {k:"table", title:"Ministry clues hidden in the name", head:["Word in name","Usual ministry"], rows:[["Kisan, Krishi, Fasal","Agriculture & Farmers Welfare"],["Gramin, Gram, Awas-G, Sadak","Rural Development"],["Urban, Smart City, AMRUT, SVANidhi","Housing & Urban Affairs (MoHUA)"],["Jal, Ganga, Sinchai","Jal Shakti"],["Surya, KUSUM, Hydrogen","New & Renewable Energy (MNRE)"],["Janjati, Adivasi, Dharti Aaba","Tribal Affairs"],["Shakti, Vatsalya, Poshan 2.0, Anganwadi","Women & Child Development"],["Mudra, Jan Dhan, Atal Pension, Stand-Up","Finance (Dept of Financial Services)"]]},
 {k:"trap", h:"The name can mislead. <b>PM POSHAN</b> (mid-day meal) is <b>Education</b>, not Health or WCD. <b>Stand-Up India</b> is <b>Finance</b>, not Commerce. <b>SHE-Mart / Lakhpati Didi</b> are <b>Rural Development</b>, not WCD. <b>Namo Drone Didi</b> is <b>Agriculture</b>."},
 {k:"q", q:"Which ministry runs PM POSHAN (mid-day meal)?", o:["Ministry of Education","Ministry of Health & Family Welfare","Ministry of Women & Child Development","Ministry of Consumer Affairs"], e:"Asked in CGL. The food goes to schoolchildren, so Education runs it."}],
 sum:["Central Sector = 100% Centre; Centrally Sponsored = shared","CSS share: 60:40 general, 90:10 NE/Himalayan/J&K, 100% UTs without legislature","UTs with legislature: Delhi, Puducherry, J&K","Name gives the ministry, except POSHAN (Education), Stand-Up (Finance), Lakhpati Didi (Rural Dev), Drone Didi (Agriculture)","Question shapes: ministry, year, place, objective, eligibility, amount, outlay, full form, NOT-a-feature"]},

{ id:"L2", title:"Farmers I: income, price & insurance", hi:"किसान: आय, MSP, बीमा", blocks:[
 {k:"facts", title:"PM-KISAN", rows:[["Launched","24 Feb 2019, Gorakhpur (UP); effective retrospectively from 1 Dec 2018"],["Ministry","Agriculture & Farmers Welfare"],["Type","Central Sector (100% Centre), DBT"],["Benefit","₹6,000 a year in 3 equal instalments of ₹2,000"],["Who","All land-holding farmer families (not just small/marginal)"],["Excluded","Income-tax payers, constitutional post holders, doctors/engineers/lawyers, pensioners with ₹10,000+/month"]]},
 {k:"trap", h:"The lecture says “instalments of ₹20,000”. It is <b>₹2,000</b> × 3 = ₹6,000. Also: launched 2019 but <b>effective from 1 Dec 2018</b> (retrospective)."},
 {k:"facts", title:"PM Kisan Maandhan Yojana (PM-KMY)", rows:[["Launched","12 Sept 2019, Ranchi"],["Who","Small & marginal farmers with up to 2 hectares, aged 18–40"],["Benefit","Pension ₹3,000/month after 60; spouse gets 50% as family pension"],["Contribution","Farmer pays ₹55–200/month; Centre matches equally. LIC is fund manager"]]},
 {k:"trick", h:"<b>Maandhan = “maan” (honour) + “dhan” (money) in old age</b>. All three Maandhan-type pensions pay <b>₹3,000 at 60</b> with entry at <b>18–40</b>: PM-KMY (farmers), PM-SYM (unorganised workers)."},
 {k:"facts", title:"PM Fasal Bima Yojana (PMFBY)", rows:[["Launched","18 Feb 2016 (Sehore, MP); from Kharif 2016"],["Motto","One Nation, One Scheme, One Premium"],["Farmer premium","Kharif 2% · Rabi 1.5% · Commercial/horticulture 5%"],["Covers","Sowing to post-harvest (14 days in field): drought, flood, pests, disease, hailstorm"],["Report loss","Within 72 hours"],["Enrolment","Voluntary for all farmers since Kharif 2020"],["Tech","Drones, satellite imagery, smartphones for claims (YES-TECH)"]]},
 {k:"trick", h:"Premium falls with the seasons' letters: <b>K</b>harif <b>2</b>, <b>R</b>abi <b>1.5</b>, <b>C</b>ash crops <b>5</b>. Remember “2 – 1½ – 5”."},
 {k:"q", q:"Under PMFBY, what premium does a farmer pay for a rabi crop?", o:["1.5%","2%","5%","Nil"], e:"Kharif 2%, rabi 1.5%, annual commercial/horticulture 5%."},
 {k:"facts", title:"MSP basics (lecture link)", rows:[["Recommends","CACP – Commission for Agricultural Costs and Prices (1965)"],["Approves","Cabinet Committee on Economic Affairs (CCEA)"],["Crops","22 mandated crops"],["Sugarcane","No MSP; gets FRP (Fair & Remunerative Price)"]]},
 {k:"facts", title:"PM-AASHA (Annadata Aay Sanrakshan Abhiyan)", rows:[["Launched","2018"],["Aim","Make sure farmers actually get MSP"],["Components","Price Support Scheme (PSS) · Price Deficiency Payment Scheme (PDPS) · Price Stabilisation Fund (PSF) · Market Intervention Scheme (MIS). PSF & MIS merged into it in 2024"],["Nature","Umbrella scheme, Agriculture ministry"],["Update","Continued to 2025-26 (₹35,000 crore); 100% procurement of tur, urad, masoor for 4 years"]]},
 {k:"link", h:"<b>MSP → AASHA → Pulses mission.</b> MSP is only a promise; AASHA makes the government buy. India still imports tur, urad and masoor, so the 2025 <b>Mission for Aatmanirbharta in Pulses</b> promises to buy 100% of them for four years."},
 {k:"facts", title:"PM Dhan-Dhaanya Krishi Yojana", rows:[["Announced","Budget 2025-26"],["Approved","16 July 2025"],["Launched","11 Oct 2025 (IARI, New Delhi) with the Pulses Mission"],["Coverage","100 low-productivity districts (at least 1 per state)"],["How","Converges 36 existing schemes of 11 departments"],["Outlay","₹24,000 crore a year for 6 years"],["Farmers","≈1.7 crore"],["Model","Aspirational Districts Programme"]]},
 {k:"trap", h:"The lecture says ₹26,000 crore a year. The Cabinet figure is <b>₹24,000 crore/year</b>. Also note two dates: <b>approved 16 July 2025</b>, <b>launched 11 Oct 2025</b>."},
 {k:"facts", title:"Mission for Aatmanirbharta in Pulses", rows:[["Launched","11 Oct 2025"],["Outlay","₹11,440 crore, 2025-26 to 2030-31"],["Target","350 lakh tonnes by 2030-31 (from 242 LT in 2023-24)"],["Focus","Tur (arhar), urad, masoor: 100% procurement by NAFED & NCCF for 4 years"],["Farmers","≈2 crore"]]},
 {k:"table", title:"Market & credit for farmers", head:["Scheme","Key facts"], rows:[["e-NAM","14 April 2016 (Ambedkar Jayanti); online pan-India mandi, One Nation One Market; SFAC implements; 1,400+ mandis"],["Agriculture Infrastructure Fund","July 2020; ₹1 lakh crore of loans; 3% interest subvention on loans up to ₹2 crore; post-harvest infra"],["e-Kisan Upaj Nidhi","Loans against produce kept in registered warehouses; low security deposit, ~7% interest"],["Kisan Credit Card","1998 (NABARD); modified interest subvention; limit raised to ₹5 lakh (Budget 2025-26)"]]},
 {k:"q", q:"e-NAM was launched on which symbolic day?", o:["14 April 2016 – Ambedkar Jayanti","2 October 2016 – Gandhi Jayanti","23 December 2016 – Kisan Diwas","1 May 2016 – Labour Day"], e:"14 April 2016."}],
 sum:["PM-KISAN: 24 Feb 2019 Gorakhpur, effective 1 Dec 2018; ₹6,000 = 3 × ₹2,000; Central Sector","PM-KMY: 12 Sept 2019 Ranchi; ≤2 ha; 18–40; ₹3,000 pension","PMFBY: 2016; 2% kharif, 1.5% rabi, 5% commercial; report in 72 h","MSP: CACP recommends, CCEA approves; sugarcane FRP","PM-AASHA 2018: PSS, PDPS, PSF, MIS","Dhan-Dhaanya: 100 districts, 36 schemes, 11 depts, ₹24,000 cr/yr; launched 11 Oct 2025","Pulses mission: ₹11,440 cr, 350 LT by 2030-31; tur-urad-masoor","e-NAM 14 Apr 2016; AIF ₹1 lakh crore 2020"]},

{ id:"L3", title:"Farmers II: water, energy, inputs, fish", hi:"सिंचाई, सौर, खाद, मत्स्य", blocks:[
 {k:"facts", title:"PM Krishi Sinchayee Yojana (PMKSY)", rows:[["Launched","1 July 2015"],["Lead ministry","Jal Shakti (with Rural Development and Agriculture)"],["Slogans","“Har Khet Ko Pani” · “Per Drop More Crop”"],["Components","Accelerated Irrigation Benefit Programme (AIBP) · Har Khet Ko Pani · Watershed Development · Per Drop More Crop (micro-irrigation: drip, sprinkler)"]]},
 {k:"facts", title:"PM-KUSUM", rows:[["Full form","PM Kisan Urja Suraksha evam Utthaan Mahabhiyan"],["Launched","2019"],["Ministry","New & Renewable Energy (MNRE)"],["Aim","De-dieselise farming; energy + water security; extra income by selling solar power"],["Component A","Small solar plants up to 2 MW on barren land (10,000 MW)"],["Component B","Stand-alone solar pumps"],["Component C","Solarise existing grid-connected pumps"],["Funding (B & C)","30% Centre + 30% State + 30% bank loan + 10% farmer"]]},
 {k:"trick", h:"<b>KUSUM = 30-30-30-10</b>. Three 30s from Centre, State, Bank; the farmer puts only 10."},
 {k:"q", q:"The main objective of PM-KUSUM is to …", o:["Install solar pumps and grid-connected solar plants in rural areas","Give crop insurance","Build rural roads","Provide free fertiliser"], e:"Exam-asked. Solar pumps + small solar plants; de-dieselise agriculture."},
 {k:"table", title:"RKVY family", head:["Year","Stage"], rows:[["2007-08","Rashtriya Krishi Vikas Yojana launched (states plan projects as per local agro-climate)"],["2017-18","Renamed RKVY-RAFTAAR"],["2024","PM-RKVY: cafeteria of schemes; Krishonnati Yojana runs alongside"]]},
 {k:"facts", title:"National Mission on Natural Farming (NMNF)", rows:[["Approved","25 Nov 2024; standalone CSS"],["Outlay","₹2,481 crore (to 2025-26)"],["Target","1 crore farmers, 7.5 lakh ha, 15,000 clusters, 10,000 Bio-input Resource Centres"],["Idea","Zero Budget Natural Farming (Subhash Palekar): use only on-farm inputs"],["4 wheels","Jeevamrutha (microbial culture) · Beejamrutha (seed treatment) · Acchadana (mulching) · Whapasa (soil aeration/moisture)"]]},
 {k:"trap", h:"The lecture calls the pillars “Beej-mitra, Jeev-mitra”. The standard names are <b>Beejamrutha</b> and <b>Jeevamrutha</b>. Organic farming allows bought organic manure; natural farming uses nothing from outside the farm."},
 {k:"table", title:"Fertiliser schemes", head:["Scheme","Key facts"], rows:[["Nutrient Based Subsidy (NBS)","1 April 2010; Dept of Fertilizers (Chemicals & Fertilizers); fixed per-kg subsidy on N, P, K, S of P&K fertilisers; urea is NOT under NBS; extra subsidy for zinc/boron-fortified"],["PM-PRANAM","2023; PM Programme for Restoration, Awareness, Nourishment & Amelioration of Mother Earth; states that cut chemical fertiliser get 50% of the subsidy saved (70% for assets, 30% for farmers)"],["Soil Health Card","19 Feb 2015, Suratgarh (Rajasthan); card every 2 years"],["Nano urea","IFFCO, world's first (2021)"]]},
 {k:"trap", h:"A PYQ matched “PM-PRANAM – fertiliser use” as correct and “UDAN – farming” as wrong. PRANAM is about <b>cutting chemical fertiliser</b>, run by <b>Chemicals & Fertilizers</b>."},
 {k:"facts", title:"Namo Drone Didi", rows:[["Approved","29 Nov 2023"],["Nodal","Agriculture & Farmers Welfare (with DAY-NRLM)"],["Target","15,000 women SHGs get drones to rent out for spraying"],["Support","80% of drone cost, up to ₹8 lakh"],["Outlay","₹1,261 crore, 2024-25 to 2025-26"]]},
 {k:"trap", h:"The lecture reads the outlay as “₹10,261 crore”. It is <b>₹1,261 crore</b>. The nodal ministry is <b>Agriculture</b>, not Rural Development or Civil Aviation."},
 {k:"table", title:"More farm schemes", head:["Scheme","Key facts"], rows:[["SMAM","Sub-Mission on Agricultural Mechanisation (2014-15); 50–80% subsidy for small/marginal, SC/ST, women farmers"],["MIDH","Mission for Integrated Development of Horticulture (2014-15)"],["PM Matsya Sampada Yojana","10 Sept 2020; ₹20,050 crore; Dept of Fisheries (Fisheries, Animal Husbandry & Dairying); fishers, fish farmers, SHGs, FFPOs"],["Bharat VISTAAR","Budget 2026-27: AI advisory in farmers' own language through “Bharati” voice assistant"],["Agristack / Farmer ID","Unique digital ID for each farmer linked to land records"]]},
 {k:"q", q:"Which scheme gives women SHGs drones to rent out to farmers?", o:["Namo Drone Didi","Drone Shakti","Lakhpati Didi","Kisan Drone Mission"], e:"15,000 SHGs, 80% subsidy up to ₹8 lakh."}],
 sum:["PMKSY 2015: Har Khet Ko Pani, Per Drop More Crop; lead Jal Shakti","PM-KUSUM 2019 MNRE: A 2 MW plants, B standalone pumps, C solarise pumps; 30-30-30-10","RKVY 2007-08 → RAFTAAR 2017-18 → PM-RKVY 2024","NMNF 2024 ₹2,481 cr; Jeevamrutha, Beejamrutha, Acchadana, Whapasa","NBS 2010 (not urea); PM-PRANAM 2023 cut chemical fertiliser","Namo Drone Didi: 15,000 SHGs, ₹1,261 cr, Agriculture","PMMSY 2020 ₹20,050 cr, Fisheries"]},

{ id:"L4", title:"Make in India chain", hi:"मेक इन इंडिया से सेमीकंडक्टर तक", blocks:[
 {k:"link", h:"<b>The story (second lecture).</b> India was a huge market but made little → money and jobs went abroad. <b>Make in India</b> (2014) invited factories. Firms still hesitated → <b>PLI</b> (2020) paid them for extra output. Phones were assembled but parts were imported → <b>ECMS</b> (2025). Next, whole phones and Indian brands → <b>MPMS</b> (2026). Every device still needs a chip, the “brain” → <b>ISM 2.0</b> (2026). Then chemicals (<b>BHAVYA Rasayan</b>) and medicines (<b>Biopharma SHAKTI</b>)."},
 {k:"facts", title:"Make in India", rows:[["Launched","25 Sept 2014"],["Ministry","Commerce & Industry (DPIIT)"],["Logo","A lion made of gears (cogs)"],["Focus","Manufacturing: investment, innovation, skills, infrastructure"],["Nature","Umbrella initiative, not a subsidy scheme"]]},
 {k:"facts", title:"Production Linked Incentive (PLI)", rows:[["Started","2020 (first for mobile phones)"],["Sectors","14"],["Outlay","≈₹1.97 lakh crore"],["Coordinated by","DPIIT"],["How it pays","Cash incentive on incremental sales over a base year"],["Aim","Boost domestic manufacturing, attract investment, cut imports, raise exports"]]},
 {k:"trick", h:"<b>Make in India says “make here”; PLI says “make more and get paid”.</b> PLI is not a loan: nothing is repaid."},
 {k:"q", q:"PLI incentives are calculated on …", o:["Incremental sales over a base year","Total loans taken","Number of workers hired","Exports only to the USA"], e:"Extra sales above the base year earn a percentage back."},
 {k:"table", title:"The electronics ladder", head:["Scheme","Facts"], rows:[["ECMS – Electronics Component Manufacturing Scheme","Approved 28 March 2025; MeitY; ₹22,919 crore for 6 years (FY26–FY31); camera & display modules, PCBs, copper-clad laminates; raised to ₹40,000 crore in Budget 2026-27"],["MPMS – Mobile Phone Manufacturing Scheme","Approved 15 July 2026; ₹62,500 crore, FY27–FY31; 2.25–5% on eligible sales (differentiated), +1.5% for local components, +3% for design/R&D; ≈60,000 jobs"],["ISM 1.0 – India Semiconductor Mission","Dec 2021; ₹76,000 crore; Tata–PSMC fab Dholera, Micron ATMP Sanand"],["ISM 2.0","Approved July 2026; ₹1,27,500 crore (₹1.275 lakh crore); design, fabs, display fabs, ATMP/OSAT, equipment & materials, talent"]]},
 {k:"trap", h:"The lecture says ECMS rose to “₹400 crore”. It is <b>₹40,000 crore</b>. ECMS = <b>parts</b> inside the phone; MPMS = the <b>whole phone</b> and Indian brands."},
 {k:"q", q:"Which scheme correctly separates ECMS from MPMS?", o:["ECMS: components; MPMS: mobile phones","Both are farm schemes","MPMS builds airports","ECMS opens pension accounts"], e:"Asked in the lecture's PYQ set."},
 {k:"facts", title:"BHAVYA Rasayan", rows:[["Full form","Bharat Audyogik Vikas Yojana – Rasayan"],["Approved","24 July 2026"],["Outlay","₹3,030 crore, FY27–FY31"],["Plan","3 dedicated chemical parks (≥8 sq km each), chosen by challenge route"],["Money","Centre up to ₹1,000 crore per park; each state at least ₹500 crore"],["Why","Shared effluent treatment, water, steam, corrosion-proof pipelines, warehousing and waste disposal cost too much for single units"]]},
 {k:"facts", title:"Biopharma SHAKTI", rows:[["Announced","Budget 2026-27"],["Full form","Strategy for Healthcare Advancement through Knowledge, Technology and Innovation"],["Outlay","₹10,000 crore over 5 years"],["Ministry","Chemicals & Fertilizers (Dept of Pharmaceuticals)"],["Aim","Domestic R&D, clinical trials and manufacture of biologics & biosimilars"],["Institutes","3 new NIPERs + upgrade existing 7 (→ 10)"]]},
 {k:"trick", h:"<b>Generic</b> = copy of a chemical drug. <b>Biologic</b> = made from living cells. <b>Biosimilar</b> = near copy of a biologic. India is the “pharmacy of the world” for generics; SHAKTI pushes it into biologics."},
 {k:"table", title:"Textiles & MSME energy", head:["Scheme","Facts"], rows:[["PM MITRA","PM Mega Integrated Textile Region & Apparel parks; Budget 2021-22; ₹4,445 crore; 7 parks; 5F: Farm→Fibre→Factory→Fashion→Foreign; PPP via SPV; competitiveness support up to ₹300 crore/park"],["PM MITRA sites","Virudhunagar (TN), Warangal (Telangana), Navsari (Gujarat), Kalaburagi (Karnataka), Dhar (MP), Lucknow (UP), Amravati (Maharashtra)"],["SAMARTH","20 Dec 2017; Ministry of Textiles; skilling for the textile sector (entry 21–45 per lecture)"],["ADEETIE","Assistance in Deploying Energy Efficient Technologies in Industries & Establishments; July 2025; Ministry of Power; run by BEE; ₹1,000 crore; MSMEs in 14 sectors; interest subvention 5% (micro/small), 3% (medium)"]]},
 {k:"trick", h:"PM MITRA parks: “<b>Viru War Nav Kal Dhar Luck Amra</b>” → Virudhunagar, Warangal, Navsari, Kalaburagi, Dhar, Lucknow, Amravati. Seven states: TN, Telangana, Gujarat, Karnataka, MP, UP, Maharashtra."}],
 sum:["Make in India 25 Sept 2014, DPIIT, lion of cogs","PLI 2020, 14 sectors, ≈₹1.97 lakh cr, paid on incremental sales","ECMS Mar 2025 ₹22,919 cr → ₹40,000 cr (Budget 2026-27); components","MPMS 15 July 2026 ₹62,500 cr; 2.25–5%; whole phones","ISM 1.0 ₹76,000 cr (2021); ISM 2.0 ₹1.275 lakh cr (July 2026)","BHAVYA Rasayan 24 July 2026: 3 parks, ₹1,000 cr each, state ≥₹500 cr","Biopharma SHAKTI ₹10,000 cr/5 yrs; 3 new NIPERs","PM MITRA 7 parks; ADEETIE BEE ₹1,000 cr"]},

{ id:"L5", title:"Banking, credit & enterprise", hi:"जनधन से मुद्रा तक", blocks:[
 {k:"link", h:"<b>Account → loan → special groups → startups.</b> No account, so no DBT: <b>Jan Dhan</b> (2014). No collateral, so no loan: <b>MUDRA</b> (2015). SC/ST and women still left out: <b>Stand-Up India</b> (2016). Innovation: <b>Startup India</b> (2016). Street vendors after COVID: <b>SVANidhi</b> (2020). Traditional artisans: <b>Vishwakarma</b> (2023)."},
 {k:"facts", title:"PM Jan Dhan Yojana (PMJDY)", rows:[["Launched","28 Aug 2014 (announced 15 Aug 2014)"],["Ministry","Finance – Dept of Financial Services"],["Goal","Financial inclusion: a basic account for every household"],["Features","Zero balance; RuPay card with ₹2 lakh accident cover; overdraft up to ₹10,000; DBT backbone"],["Scale","≈55 crore accounts by Feb 2025 (lecture: 58 crore by 2026); over half held by women"]]},
 {k:"facts", title:"PM MUDRA Yojana", rows:[["Launched","8 April 2015"],["MUDRA","Micro Units Development & Refinance Agency (a SIDBI subsidiary; refinances lenders)"],["Motto","Fund the unfunded"],["For","Non-corporate, non-farm micro/small units (tailor, parlour, repair shop, papad unit…); allied activities like dairy/poultry allowed"],["Collateral","None"],["Lenders","Banks, NBFCs, MFIs (loans carry interest)"]]},
 {k:"table", title:"MUDRA loan categories", head:["Category","Loan"], numcol:1, rows:[["Shishu","Up to ₹50,000"],["Kishore","₹50,000 – ₹5 lakh"],["Tarun","₹5 lakh – ₹10 lakh"],["Tarun Plus (Budget 2024-25)","₹10 lakh – ₹20 lakh, only for those who repaid a Tarun loan"]]},
 {k:"trick", h:"Life stages: <b>Shishu → Kishore → Tarun → Tarun Plus</b> = child → teen → youth → youth+. There is <b>no “Yuva”</b> category (PYQ trap)."},
 {k:"trap", h:"The transcript reads Shishu as “₹500”. It is <b>₹50,000</b>. MUDRA does not lend directly; it refinances banks/MFIs."},
 {k:"q", q:"Which is NOT a category under PM MUDRA Yojana?", o:["Yuva","Shishu","Kishore","Tarun Plus"], e:"PYQ. The four are Shishu, Kishore, Tarun, Tarun Plus."},
 {k:"facts", title:"Stand-Up India", rows:[["Launched","5 April 2016"],["Ministry","Finance (DFS); SIDBI runs the portal"],["For","SC/ST and women entrepreneurs, 18+"],["Loan","₹10 lakh – ₹1 crore, composite (term loan + working capital)"],["Condition","Greenfield (first venture); at least 1 SC/ST and 1 woman borrower per bank branch"],["Repay","Within 7 years; moratorium up to 18 months"]]},
 {k:"trap", h:"Stand-Up India is under <b>Finance</b>, not Commerce. Startup India is under <b>Commerce (DPIIT)</b>. The first lecture slip “₹1 lakh to ₹1 crore” should read <b>₹10 lakh</b>."},
 {k:"facts", title:"Startup India", rows:[["Launched","16 Jan 2016 (National Startup Day since 2022)"],["Ministry","Commerce & Industry (DPIIT)"],["Startup =","Pvt Ltd / LLP / partnership, under 10 years old, turnover ≤ ₹100 crore in any year"]]},
 {k:"table", title:"More credit schemes", head:["Scheme","Key facts"], rows:[["PMEGP","2008-09; merged REGP + PM Rozgar Yojana; Ministry of MSME, run nationally by KVIC; new units only; 18+; project up to ₹50 lakh (manufacturing) / ₹20 lakh (service); margin subsidy 15–35% (higher for women, SC/ST, OBC, minorities, ex-servicemen, PwD)"],["PM SVANidhi","1 June 2020; MoHUA + DFS; Central Sector; collateral-free loans to street vendors: ₹15,000 → ₹25,000 → ₹50,000 (enhanced 2025); 7% interest subsidy; extended to 31 March 2030"],["PM Vishwakarma","17 Sept 2023 (Vishwakarma Jayanti); ₹13,000 crore; MSME (with MSDE, DFS); 18 traditional trades; loan ₹3 lakh (₹1 lakh + ₹2 lakh) at 5%; ₹500/day training stipend; ₹15,000 toolkit e-voucher; certificate & ID"],["Jan Samarth","2022; single portal for credit-linked government schemes"],["India Post Payments Bank","1 Sept 2018; Dept of Posts; doorstep banking through postmen; deposit limit ₹2 lakh; cannot give loans"]]},
 {k:"trap", h:"PMEGP's “₹50 lakh / ₹20 lakh” is the <b>maximum project cost</b>, not the subsidy. IPPB's deposit cap is now <b>₹2 lakh</b> (raised from ₹1 lakh in 2021)."},
 {k:"trick", h:"Vishwakarma = god of tools, so the scheme gives a <b>toolkit</b> (₹15,000) and is launched on <b>Vishwakarma Jayanti, 17 Sept</b>. Numbers: <b>18 trades · 3 lakh · 5% · 500/day · 15,000</b>."},
 {k:"q", q:"Under which scheme do artisans get ₹500 a day during training and a ₹15,000 toolkit voucher?", o:["PM Vishwakarma","PMEGP","PM SVANidhi","Stand-Up India"], e:"PYQ."}],
 sum:["PMJDY 28 Aug 2014: zero balance, ₹2 lakh accident cover, ₹10,000 OD","MUDRA 8 Apr 2015: Shishu ≤50k, Kishore 50k–5L, Tarun 5–10L, Tarun Plus 10–20L","Stand-Up 5 Apr 2016, Finance: SC/ST & women, ₹10 L–₹1 cr, greenfield, 1+1 per branch","Startup India 16 Jan 2016, DPIIT: <10 yrs, ≤₹100 cr","PMEGP 2008-09, KVIC nodal; SVANidhi 2020 → 2030; Vishwakarma 17 Sept 2023, 18 trades","IPPB 1 Sept 2018, ₹2 lakh cap"]},

{ id:"L6", title:"Pensions, insurance & jobs", hi:"पेंशन, बीमा, रोजगार", blocks:[
 {k:"table", title:"The Jan Suraksha trio (9 May 2015, Kolkata)", head:["Scheme","Age","Premium","Cover"], rows:[["PM Jeevan Jyoti Bima (PMJJBY)","18–50","₹436 / year","₹2 lakh life (death, any cause)"],["PM Suraksha Bima (PMSBY)","18–70","₹20 / year","₹2 lakh accidental death; ₹1 lakh partial disability"],["Atal Pension Yojana (APY)","18–40","Monthly by age & slab","₹1,000–5,000 pension at 60"]]},
 {k:"trick", h:"<b>Suraksha = ₹20</b> (cheap, accident only). <b>Jyoti = ₹436</b> (life). Age limits: Jyoti <b>50</b>, Suraksha <b>70</b>, Atal <b>40</b>."},

{ id:"L7", title:"Rural jobs, homes & livelihoods", hi:"ग्रामीण विकास", blocks:[
 {k:"facts", title:"MGNREGA (2005)", rows:[["Act","Sept 2005; in force 2 Feb 2006 (Bandlapalli, Anantapur, AP) in 200 districts"],["Renamed","Mahatma Gandhi NREGA, 2 Oct 2009"],["Guarantee","100 days of unskilled wage work per rural household per year"],["If no work","Unemployment allowance after 15 days"],["Women","At least one-third of beneficiaries"]]},
 {k:"facts", title:"VB-G RAM G Act, 2025 (replaces MGNREGA)", rows:[["Full name","Viksit Bharat – Guarantee for Rozgar and Ajeevika Mission (Gramin)"],["Passed","December 2025"],["In force","1 July 2026 (MGNREGA ends the same day)"],["Guarantee","125 days per household per year"],["Farm-season pause","States may notify up to 60 days a year of no works during peak sowing/harvest"],["Wages","Weekly, at most 15 days after muster roll closes; 0.05%/day compensation if late"],["Unemployment allowance","¼ of wage for first 30 days, ½ after that"],["2026-27","₹95,692 crore central allocation; admin spend up from 6% to 9%"],["Ministry","Rural Development"]]},
 {k:"trick", h:"<b>100 → 125</b> days, <b>2006 → 2026</b>. Twenty years apart, and 25 more days."},
 {k:"trap", h:"One lecture says the new law began on 1 July 2025. It was <b>passed in Dec 2025</b> and came into force on <b>1 July 2026</b>."},
 {k:"q", q:"How many days of wage employment does the VB-G RAM G Act guarantee?", o:["125","100","150","90"], e:"Up from 100 under MGNREGA; in force from 1 July 2026."},
 {k:"facts", title:"DAY-NRLM", rows:[["Launched","June 2011 as Aajeevika (approved 2010); renamed Deendayal Antyodaya Yojana-NRLM"],["Ministry","Rural Development"],["Idea","Organise poor rural women into SHGs; credit, skills, markets"],["Scale","≈10 crore women in ≈91 lakh SHGs (2025)"],["Urban twin","DAY-NULM (Housing & Urban Affairs)"]]},
 {k:"table", title:"Built on the SHG network", head:["Scheme","Facts"], rows:[["Lakhpati Didi","Announced 15 Aug 2023; SHG woman earning ₹1 lakh+/year; target 3 crore raised to 6 crore (2026); ≈3.5 crore reached by Sept 2026"],["SHE-Mart","Budget 2026-27; community-owned retail outlets (physical + online) for SHG products; Rural Development"],["DDU-GKY","25 Sept 2014; placement-linked skilling for poor rural youth 15–35 (up to 45 for SC/ST/women/PwD); part of NRLM"],["Namo Drone Didi","Drones to SHGs (Agriculture) – see Lesson 3"],["Bima Sakhi","9 Dec 2024, Panipat; LIC; women 18–70, class 10 pass, become insurance agents with a 3-year stipend"]]},
 {k:"trap", h:"Lakhpati Didi and SHE-Mart are <b>Rural Development</b> schemes, not WCD. PYQ-style option lists put WCD first to catch you."},
 {k:"table", title:"Roads, houses, land", head:["Scheme","Facts"], rows:[["PMGSY","25 Dec 2000 (Vajpayee's birthday); all-weather roads to unconnected habitations (500+ in plains, 250+ in hills/NE); PMGSY-IV 2024-25 to 2028-29"],["PMAY-Gramin","20 Nov 2016, Agra (replaced Indira Awaas Yojana, 1985); ₹1.20 lakh (plains) / ₹1.30 lakh (hilly/NE); beneficiaries from SECC 2011 + Awaas+ survey; extended to 2028-29"],["SVAMITVA","24 April 2020 (National Panchayati Raj Day); Panchayati Raj; drone mapping of village houses → property cards"]]},
 {k:"trick", h:"<b>SVAMITVA</b> = Survey of Villages And Mapping with Improvised Technology in Village Areas. Ownership = “swamitva”. Drones + property card."},
 {k:"table", title:"Vibrant Villages", head:["Phase","Facts"], rows:[["VVP-I (2023)","Home Affairs; CSS; ₹4,800 crore (2022-23 to 2025-26); northern border with China: Arunachal, Sikkim, Uttarakhand, HP, Ladakh; 662 priority villages in 46 blocks"],["VVP-II (April 2025)","Central Sector; ₹6,839 crore till 2028-29; villages on other international land borders in 17 states/UTs"]]},
 {k:"trap", h:"VVP-I is <b>centrally sponsored</b>; VVP-II is <b>central sector</b>. The lecture stresses this switch."},
 {k:"q", q:"SVAMITVA scheme was launched on …", o:["National Panchayati Raj Day, 24 April 2020","Gandhi Jayanti 2020","Independence Day 2020","Republic Day 2021"], e:"Ministry of Panchayati Raj; drone-based property cards."}],
 sum:["MGNREGA: Act 2005, in force 2 Feb 2006, 100 days","VB-G RAM G Act 2025: in force 1 July 2026, 125 days, 60-day farm pause, weekly wages","DAY-NRLM 2011 (renamed 2015-16): SHGs, Rural Dev","Lakhpati Didi ₹1 lakh+/yr; target 6 crore (2026)","DDU-GKY 2014, 15–35","PMGSY 25 Dec 2000 · PMAY-G 20 Nov 2016 Agra · SVAMITVA 24 Apr 2020","VVP-I CSS (China border), VVP-II Central Sector ₹6,839 cr"]},

{ id:"L8", title:"Cities, transport & logistics", hi:"शहर, परिवहन, कनेक्टिविटी", blocks:[
 {k:"p", h:"<b>25 June 2015</b> is the big urban date: AMRUT, Smart Cities Mission and PMAY-Urban were all launched together."},
 {k:"table", title:"The three urban missions of 25 June 2015", head:["Mission","Facts"], rows:[["PMAY-Urban","Houses for the urban poor. PMAY-U 2.0 approved Aug 2024: 1 crore houses, ₹2.30 lakh crore central aid, 2024–29; EWS ≤₹3 L, LIG ₹3–6 L, MIG ₹6–9 L income; verticals BLC, AHP, ARH, ISS"],["AMRUT","Atal Mission for Rejuvenation & Urban Transformation; 500 cities: tap water, sewerage, drainage, green spaces, non-motorised transport. AMRUT 2.0: 1 Oct 2021 to 2025-26, all towns, water-secure cities"],["Smart Cities Mission","100 cities; formally ended 31 March 2025"]]},
 {k:"trap", h:"AMRUT = <b>urban</b> water and sewerage (MoHUA). <b>Jal Jeevan Mission</b> = <b>rural</b> tap water (Jal Shakti). Don't swap them."},
 {k:"q", q:"Under PMAY-U 2.0, a family earning ₹7 lakh a year falls in which group?", o:["MIG","LIG","EWS","Not eligible"], e:"EWS up to ₹3 L, LIG ₹3–6 L, MIG ₹6–9 L."},
 {k:"facts", title:"Swachh Bharat Mission", rows:[["Launched","2 Oct 2014 (Gandhi Jayanti)"],["Parts","SBM-Gramin (Jal Shakti) and SBM-Urban (MoHUA)"],["Phase II","SBM-G: ODF Plus · SBM-U 2.0 (1 Oct 2021): garbage-free cities"]]},
 {k:"table", title:"Clean transport", head:["Scheme","Facts"], rows:[["PM e-Bus Sewa","Approved Aug 2023; 10,000 e-buses in 169 cities; PPP; MoHUA. Payment Security Mechanism (2024) under Heavy Industries"],["PM E-DRIVE","PM Electric Drive Revolution in Innovative Vehicle Enhancement; Heavy Industries; notified Sept 2024; ₹10,900 crore; 1 Oct 2024 – 31 Mar 2026, extended to 31 Mar 2028; e-2W, e-3W, e-ambulances, e-trucks, e-buses, chargers; replaced FAME-II"],["Vehicle Scrappage Policy","Launched 13 Aug 2021 at an investor summit in Gujarat; Road Transport & Highways; fitness test after 15 yrs (commercial) and 20 yrs (private); incentives on new vehicle"]]},
 {k:"facts", title:"UDAN (Ude Desh ka Aam Nagrik)", rows:[["Launched","Oct 2016 (21 Oct = UDAN Diwas); Civil Aviation"],["First flight","27 April 2017, Shimla (Jubbarhatti) – Delhi"],["How","Viability Gap Funding to airlines; capped fares on some seats"],["Modified UDAN","Approved 25 March 2026; ₹28,840 crore, FY2026-27 to 2035-36; 100 airports from unserved airstrips + 200 helipads (hilly, NE, island, aspirational districts)"]]},
 {k:"trick", h:"<b>UDAN first flight goes up the hills</b>: Shimla → Delhi, 27 April 2017. Modified UDAN: “<b>100 airports, 200 helipads, 10 years</b>”."},
 {k:"table", title:"Infrastructure family", head:["Programme","Facts"], rows:[["PM Gati Shakti","13 Oct 2021; National Master Plan for multimodal connectivity; ₹100 lakh crore; GIS platform (BISAG-N); nodal DPIIT (Commerce); 16 ministries; integrates Bharatmala, Sagarmala, UDAN, railways, waterways"],["Bharatmala Pariyojana","2017; Road Transport & Highways; Phase I ≈34,800 km of highways"],["Sagarmala","2015; Ports, Shipping & Waterways; port-led development"],["Parvatmala","2022; ropeways in hilly areas"],["PM-DevINE","Budget 2022-23; ₹6,600 crore (2022-23 to 2025-26); 100% central; Development of North Eastern Region ministry"]]},
 {k:"trap", h:"The lecture says Bharatmala Phase I is “₹34,800 crore”. It is <b>34,800 km</b>. <b>Bharat</b>mala = roads (<b>bhoomi</b>); <b>Sagar</b>mala = ports (<b>sea</b>); <b>Parvat</b>mala = ropeways (<b>mountains</b>)."},
 {k:"q", q:"Who is the nodal department for PM Gati Shakti planning?", o:["DPIIT (Ministry of Commerce & Industry)","NITI Aayog","Ministry of Road Transport","Ministry of Railways"], e:"PYQ (lecture set)."}],
 sum:["25 June 2015: PMAY-U, AMRUT (500 cities), Smart Cities (100, ended 31 Mar 2025)","PMAY-U 2.0: 1 crore houses; EWS ≤3 L, LIG 3–6 L, MIG 6–9 L","SBM 2 Oct 2014; SBM-U 2.0 1 Oct 2021","PM e-Bus Sewa 10,000 buses 169 cities; PM E-DRIVE ₹10,900 cr to Mar 2028","Scrappage 2021: 15 yrs commercial, 20 yrs private","UDAN 2016; first flight Shimla–Delhi 27 Apr 2017; Modified UDAN ₹28,840 cr","Gati Shakti 13 Oct 2021 ₹100 lakh cr, DPIIT; Bharatmala 34,800 km; Sagarmala ports"]},

{ id:"L9", title:"Health", hi:"स्वास्थ्य योजनाएँ", blocks:[
 {k:"facts", title:"Ayushman Bharat (2018)", rows:[["Pillar 1","Ayushman Arogya Mandir (earlier Health & Wellness Centres): first opened 14 April 2018, Bijapur (Chhattisgarh)"],["Pillar 2","PM Jan Arogya Yojana (PM-JAY): launched 23 Sept 2018, Ranchi"],["PM-JAY cover","₹5 lakh per family per year, secondary & tertiary care, cashless"],["Beneficiaries","From SECC 2011 (+ later additions); runs through National Health Authority"],["Vay Vandana (Oct 2024)","Every citizen 70+ regardless of income; extra ₹5 lakh family top-up"]]},

 {k:"table", title:"Missions", head:["Scheme","Facts"], rows:[["National Health Mission","2013 = NRHM (12 April 2005) + NUHM (2013); aims: lower MMR, IMR (target 25/1000), TFR; ASHA workers"],["Janani Suraksha Yojana","12 April 2005; cash for institutional delivery"],["Janani Shishu Suraksha Karyakram","1 June 2011; free delivery (normal and C-section), drugs, diagnostics, diet, blood and transport in public facilities; sick infants up to 1 year"],["PM-ABHIM","Announced Budget 2021-22, launched 25 Oct 2021 (Varanasi); ₹64,180 crore, 2021-22 to 2025-26; critical-care blocks, integrated public health labs"],["Mission Indradhanush","25 Dec 2014; vaccinate left-out children under 2 and pregnant women; originally 7 diseases"],["NTEP","Renamed from RNTCP in 2020; End TB target 2025 (SDG 2030); Ni-kshay Poshan ₹1,000/month to patients"],["NP-NCD","2023, renamed from NPCDCS; screens people 30+ for diabetes, hypertension, cancers"],["ABDM","27 Sept 2021; 14-digit ABHA health ID"],["PM Bhartiya Janaushadhi Pariyojana","Cheap generic medicines; Jan Aushadhi Diwas 7 March"]]},

 {k:"trap", h:"JSSK gives <b>services</b> free (incl. C-section); <b>JSY</b> gives <b>cash</b> for delivering in a hospital. Both run under NHM."},
 {k:"q", q:"What is the key benefit under Janani Shishu Suraksha Karyakram?", o:["Free delivery, including C-section, in public health facilities","₹6,000 cash for every birth","Free baby food for 5 years","Private hospital insurance"], e:"PYQ."},

 {k:"trick", h:"Ujjwala: “<b>May Day in Ballia</b>” – 1 May 2016. PMUY 2.0 – <b>M</b>ahoba, <b>A</b>ugust 2021."},
 {k:"q", q:"LPG is mostly a mixture of which two gases, with ethyl mercaptan added for smell?", o:["Propane and butane","Methane and ethane","Butane and methane","Propane and hydrogen"], e:"Both are odourless; mercaptan gives the warning smell (asked in the Ujjwala section of the lecture)."}],

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hash = s => { let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5)+h + s.charCodeAt(i))|0; return "q"+(h>>>0).toString(36); };
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; };
const L = id => LESSONS.find(l => l.id === id);
const LNUM = id => LESSONS.findIndex(l => l.id === id) + 1;

const QS = QB.map(r => {
  const fixed = !!r[6];
  return { t:r[0], q:r[1], o:r[2], e:r[3], p:(r[4]||"").includes("p"), a: fixed ? (r[5]||0) : 0, fixed, id:hash(r[1]) };
});
const byLesson = id => QS.filter(q => q.t === id);
// order of options to show: array of original indexes
const makePerm = q => q.fixed ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i));

const KEY = APP.key;
let S = { ans:{}, bm:{}, les:{}, mocks:[] };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const record = (q, ok) => { S.ans[q.id] = ok ? 1 : 0; save(); renderTop(); };

function renderTop(){
  const ids = Object.keys(S.ans).filter(k => QS.some(q => q.id === k));
  const right = ids.filter(k => S.ans[k] === 1).length;
  const pct = ids.length ? Math.round(right*100/ids.length) : 0;
  $("#topstat").innerHTML = `<b>${ids.length}</b>/${QS.length} tried<br><b>${pct}%</b> right now`;
}

function renderLearn(){
  const done = LESSONS.filter(l => S.les[l.id] && S.les[l.id].done).length;
  const nextIdx = LESSONS.findIndex(l => !(S.les[l.id] && S.les[l.id].done));
  $("#app").innerHTML = `<section class="view stack">
    <div class="hero">
      <span class="eyebrow">${APP.eyebrow}</span>
      <h1>Learn it, test it, revise it</h1>
      <p>${APP.intro} ${QS.length} exam-style questions in all.</p>
      <div class="meter" aria-label="Lessons done"><i style="width:${done/LESSONS.length*100}%"></i></div>
      <div class="row between"><span class="muted num" style="font-size:13px">${done}/${LESSONS.length} lessons done</span>
      ${nextIdx>=0 ? `<button class="btn pri sm" type="button" data-open="${LESSONS[nextIdx].id}">${done? "Continue" : "Start"}: Lesson ${nextIdx+1}</button>` : `<span class="muted" style="font-size:13px">All lessons done. Try a mock test.</span>`}</div>
    </div>
    <div class="lessons">${LESSONS.map((l,i) => {
      const st = S.les[l.id] || {}; const n = byLesson(l.id).length;
      return `<button type="button" class="les ${st.done?"done":""} ${i===nextIdx?"next":""}" data-open="${l.id}">
        <span class="no">${st.done ? "✓" : i+1}</span>
        <span class="t"><b>${esc(l.title)}</b><span>${l.hi} · ${n} questions</span></span>
        <span class="sc">${st.best!=null ? `best<br>${st.best}/${n}` : ""}</span></button>`;}).join("")}
    </div>
    <p class="foot">Current affairs are updated to September 2026. Where the lecture got a fact wrong, the lesson flags it in a red “Trap” box.</p>
  </section>`;
  $("#app").querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openLesson(b.dataset.open, "learn")));
}

function blockHTML(b){
  if (b.k==="p") return `<div class="plain"><p>${b.h}</p></div>`;
  if (b.k==="trick") return `<div class="trick"><span class="lab">Trick</span>${b.h}</div>`;
  if (b.k==="link") return `<div class="link"><span class="lab">Link · connect the schemes</span>${b.h}</div>`;
  if (b.k==="q") { const perm = shuffle(b.o.map((_,i)=>i)); return `<div class="icheck" data-ic><span class="lab">Quick check</span><p class="qt">${esc(b.q)}</p><div class="opts">${perm.map((oi,k)=>`<button type="button" class="opt" data-ioi="${oi}"><span class="k">${"ABCD"[k]}</span><span>${esc(b.o[oi])}</span></button>`).join("")}</div><div class="exp" hidden><b class="okl"></b> ${esc(b.e)}</div></div>`; }
  if (b.k==="trap") return `<div class="trap"><span class="lab">Trap · correction</span>${b.h}</div>`;
  if (b.k==="facts") return `<div class="block"><h3>${b.title}</h3><dl class="facts">${b.rows.map(r=>`<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join("")}</dl></div>`;
  if (b.k==="tl") return `<div class="block"><h3>${b.title}</h3><ul class="tl">${b.rows.map(r=>`<li><span class="y">${r[0]}</span><span>${r[1]}</span></li>`).join("")}</ul></div>`;
  if (b.k==="table") {
    const isNum = (ci) => b.numcol==="all" ? ci>0 : (b.numcol===1 && ci===1) || (typeof b.numcol==="string" && b.numcol.includes(String(ci)));
    return `<div class="block"><h3>${b.title}</h3><div class="tbl"><table><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map((c,ci)=>`<td class="${isNum(ci)?"n":""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  }
  if (b.k==="fig") return `<div class="block"><h3>${b.title}</h3><figure class="fig">${b.svg}<figcaption>${b.cap}</figcaption></figure></div>`;
  if (b.k==="pyr") return `<div class="block"><h3>${b.title}</h3><div class="pyr">${b.items.map(it=>`<div>${PYR(it.rows)}<b>${it.name}</b><span class="muted">${it.note}</span></div>`).join("")}</div><p class="muted" style="font-size:13px;margin-top:8px"><span style="color:var(--blue)">■</span> males · <span style="color:var(--accent)">■</span> females · top = old, base = young</p></div>`;
  return "";
}

let LQ = null;
function openLesson(id, step){
  const l = L(id), i = LNUM(id);
  if (step === "quiz") { LQ = { id, list: shuffle(byLesson(id)).map(q => ({q, perm:makePerm(q)})), i:0, score:0, picked:null }; }
  const head = `<div class="lhead"><button class="back" type="button" id="lback">‹ Lessons</button></div>
    <span class="eyebrow">Lesson ${i} of ${LESSONS.length} · ${l.hi}</span><h1>${esc(l.title)}</h1>
    <div class="steps" role="tablist">
      <button type="button" data-step="learn" aria-current="${step==="learn"?"step":"false"}">1 · Learn</button>
      <button type="button" data-step="quiz" aria-current="${step==="quiz"?"step":"false"}">2 · Quiz</button>
      <button type="button" data-step="sum" aria-current="${step==="sum"?"step":"false"}">3 · Summary</button>
    </div>`;
  let body = "";
  if (step === "learn") {
    body = `<div class="stack">${l.blocks.map(blockHTML).join("")}
      <div class="row end"><button class="btn pri" type="button" id="toquiz">Take the lesson quiz · ${byLesson(id).length} questions</button></div></div>`;
  } else if (step === "quiz") {
    body = `<div id="lq"></div>`;
  } else {
    const nxt = LESSONS[i];
    body = `<div class="stack"><div class="block"><h3>Remember these</h3><ul class="sum">${l.sum.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
      <div class="row between"><button class="btn" type="button" id="relearn">Read again</button>
      ${nxt ? `<button class="btn pri" type="button" id="nextles">Next: ${esc(nxt.title)}</button>` : `<button class="btn pri" type="button" id="tomock">Take a mock test</button>`}</div></div>`;
    S.les[id] = Object.assign(S.les[id]||{}, {done:1}); save();
  }
  $("#app").innerHTML = `<section class="view stack">${head}${body}</section>`;
  $("#lback").onclick = () => renderLearn();
  $("#app").querySelectorAll("[data-step]").forEach(b => b.onclick = () => openLesson(id, b.dataset.step));
  if (step==="learn") { $("#toquiz").onclick = () => openLesson(id,"quiz");
    const ics = l.blocks.filter(b=>b.k==="q");
    $("#app").querySelectorAll("[data-ic]").forEach((box,n) => { const b = ics[n];
      box.querySelectorAll("[data-ioi]").forEach(btn => btn.onclick = () => {
        if (box.dataset.done) return; box.dataset.done = 1; const pick = +btn.dataset.ioi;
        box.querySelectorAll("[data-ioi]").forEach(x => { const oi=+x.dataset.ioi; x.disabled = true; if (oi===0) x.classList.add("ok"); else if (oi===pick) x.classList.add("no"); });
        const ex = box.querySelector(".exp"); ex.hidden = false; const lab = ex.querySelector("b");
        if (pick===0) { lab.textContent = "Correct."; } else { lab.className = "nol"; lab.textContent = "Answer: " + b.o[0] + "."; }
      }); }); }
  if (step==="quiz") renderLQ();
  if (step==="sum") {
    $("#relearn").onclick = () => openLesson(id,"learn");
    const n = $("#nextles"); if (n) n.onclick = () => openLesson(LESSONS[i].id,"learn");
    const m = $("#tomock"); if (m) m.onclick = () => go("mock");
  }
  window.scrollTo(0,0);
}

function optsHTML(q, perm, state){
  // state: {picked: originalIndex|null, reveal: bool, sel: originalIndex|null}
  return perm.map((oi, k) => {
    let cls = "opt";
    if (state.reveal) { if (oi === q.a) cls += " ok"; else if (oi === state.picked) cls += " no"; }
    else if (state.sel === oi) cls += " sel";
    return `<button type="button" class="${cls}" data-oi="${oi}" ${state.reveal?"disabled":""}><span class="k">${"ABCD"[k]}</span><span>${esc(q.o[oi])}</span></button>`;
  }).join("");
}
function expHTML(q, picked){
  const ok = picked === q.a;
  return `<div class="exp">${ok ? `<b class="okl">Correct.</b>` : `<b class="nol">Answer: ${esc(q.o[q.a])}.</b>`} ${esc(q.e)}</div>`;
}
function metaHTML(q, no){
  return `<div class="qmeta"><span class="qno">${no}</span><span class="tag">L${LNUM(q.t)} · ${esc(L(q.t).title)}</span>${q.p?`<span class="tag pyq">Exam-asked</span>`:""}

let PF = "all", PSHOW = 20, PORDER = null, PPERM = {}, PPICK = {};
function practiceList(){
  let list = QS;

  else if (PF === "new") list = QS.filter(q => S.ans[q.id] === undefined);
  else if (PF === "bm") list = QS.filter(q => S.bm[q.id]);

  if (PORDER) { const pos = new Map(PORDER.map((id,i)=>[id,i])); list = list.slice().sort((a,b)=>(pos.get(a.id)??0)-(pos.get(b.id)??0)); }

}
function renderPractice(){

  const chips = [["all",`All ${QS.length}`],["new","Not tried"],["wrong",`Mistakes ${wrongN}`],["pyq",`Exam-asked ${pyqN}`],["bm",`Starred ${bmN}`]].concat(LESSONS.map((l,i)=>[l.id,`L${i+1} ${l.title}`]));

function pCard(q, idx){
  if (!PPERM[q.id]) PPERM[q.id] = makePerm(q);

}
function drawPList(){
  const list = practiceList(), box = $("#plist");
  if (!list.length) { box.innerHTML = `<p class="empty">${PF==="wrong"?"No mistakes saved. Answer some questions first, or you've cleared them all.":PF==="bm"?"Nothing starred yet. Tap ☆ on any question.":"Nothing here."}</p>`; return; }
  box.innerHTML = list.slice(0, PSHOW).map((q,i)=>pCard(q,i)).join("") + (list.length > PSHOW ? `<button class="btn" type="button" id="pmore">Show 20 more (${list.length-PSHOW} left)</button>` : "");

}
function bindP(box){ box.querySelectorAll(".qcard").forEach(bindCard); }
function bindCard(card){
  card.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const q = QS.find(x => x.id === card.dataset.q); if (PPICK[q.id] !== undefined) return;

function renderMock(){

const fmt = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
function drawMockRun(){

function showMockLeave(tab){ LEAVE_TO = tab; drawMockRun(); }
function submitMock(){
  if (!M || !M.running) return;
  clearInterval(timerId);
  M.running = false; M.done = true; M.confirm = false;
  let c=0,w=0,sk=0; const per = {};
  M.list.forEach((it,k) => {
    const a = M.ans[k]; const t = it.q.t; per[t] = per[t] || {c:0,n:0}; per[t].n++;
    if (a===null) sk++; else if (a===it.q.a) { c++; per[t].c++; S.ans[it.q.id]=1; } else { w++; S.ans[it.q.id]=0; }
  });
  const max = M.list.length*2, score = +(c*2 - (M.neg? w*0.5 : 0)).toFixed(1);
  const used = Math.min(M.secs, Math.round((Date.now()-M.start)/1000));
  M.res = {c,w,sk,score,max,used,per, acc: (c+w) ? Math.round(c*100/(c+w)) : 0};
  const d = new Date(); const ds = d.toLocaleDateString("en-IN",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
  S.mocks = (S.mocks||[]).concat([{d:ds, n:M.list.length, score, max, acc:M.res.acc}]).slice(-20); save(); renderTop();
  M.filter = "wrong";
  if (TAB==="mock") drawMockResult();
}

  </section>`;

    box.innerHTML = items.map(x => `<div class="${kind}"><span class="lab">L${x.l} · ${esc(x.t)}</span>${x.h}</div>`).join("");
  }
  if (RV === "flash") drawFlash(box);
}
let ISF = "all";
function drawFlash(box){
  if (!FC) { const pool = FCSCOPE==="all" ? QS : FCSCOPE==="wrong" ? QS.filter(q=>S.ans[q.id]===0) : QS.filter(q=>q.t===FCSCOPE); FC = {list: shuffle(pool), i:0, flip:false, known:0}; }
  const sel = `<select id="fcs" aria-label="Flashcard set"><option value="all">All questions</option><option value="wrong">My mistakes</option>${LESSONS.map((l,i)=>`<option value="${l.id}">L${i+1} · ${esc(l.title)}</option>`).join("")}</select>`;
  if (!FC.list.length || FC.i >= FC.list.length) {
    box.innerHTML = `<div class="row">${sel}</div><div class="block stack"><h3>${FC.list.length ? "Deck finished" : "No cards in this set"}</h3>${FC.list.length?`<p class="muted">You knew ${FC.known} of ${FC.list.length} on first look.</p>`:""}<div class="row"><button class="btn pri" type="button" id="fcr">Shuffle and restart</button></div></div>`;
    $("#fcs").value = FCSCOPE; $("#fcs").onchange = e => { FCSCOPE = e.target.value; FC = null; drawFlash(box); };
    $("#fcr").onclick = () => { FC = null; drawFlash(box); }; return;
  }
  const q = FC.list[FC.i];
  box.innerHTML = `<div class="row between">${sel}<span class="muted num" style="font-size:13px">${FC.i+1}/${FC.list.length}</span></div>
    <button type="button" class="flash" id="fcard" aria-label="Flip card">
      <span class="side">${FC.flip?"Answer":"Question · tap to flip"}</span>
      <span class="front">${esc(q.q)}</span>
      ${FC.flip ? `<span class="ans">${esc(q.o[q.a])}</span><span class="muted">${esc(q.e)}</span>` : ""}
    </button>
    <div class="row between"><button class="btn" type="button" id="fca" ${FC.flip?"":"disabled"}>Again later</button><button class="btn pri" type="button" id="fck" ${FC.flip?"":"disabled"}>Got it</button></div>`;
  $("#fcs").value = FCSCOPE; $("#fcs").onchange = e => { FCSCOPE = e.target.value; FC = null; drawFlash(box); };
  $("#fcard").onclick = () => { FC.flip = !FC.flip; drawFlash(box); };
  $("#fca").onclick = () => { FC.list.push(q); FC.list.splice(FC.i,1); FC.flip=false; drawFlash(box); };
  $("#fck").onclick = () => { FC.known++; FC.i++; FC.flip=false; drawFlash(box); };
}

/* boot */
renderTop();
const start = (location.hash||"").replace("#","");
go(["learn","practice","mock","revise"].includes(start) ? start : "learn");
</script>

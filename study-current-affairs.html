{"id":"CA10","title":"October 2026 (to 24 Oct)","hi":"अक्टूबर 2026 (24 अक्टूबर तक)","blocks":[{"k":"hot","h":"Most likely to be asked: the <b>RBI's repo rate hike to 5.50%<\/b> (7 Oct), India's <b>85 medals<\/b> and the <b>hockey and cricket golds<\/b> at the Asian Games, the <b>Nobel Prizes 2026<\/b> (Peace — Navi Pillay), the <b>29th Air chief Ashutosh Dixit<\/b>, the <b>new governors<\/b> of 12 October, <b>INS Samarthak<\/b>, the <b>103 Ramsar sites<\/b> and the <b>India–New Zealand FTA<\/b>."},{"k":"story","h":"<p>October 2026 opened with India's best days at the <b>Asian Games<\/b>: the women's hockey team ended a 44-year wait by beating <b>China<\/b> on 2 October, and on 3 October came golds in <b>men's hockey<\/b>, <b>men's cricket<\/b> (against Pakistan) and <b>golf<\/b> (Pranavi Urs). India finished <b>fourth with 85 medals<\/b> when the Games closed on 4 October.<\/p><p>On 7 October the <b>RBI<\/b> did something it had not done since February 2023 — it <b>raised the repo rate<\/b>, by 25 basis points to <b>5.50%<\/b>. The Nobel week followed, with the Peace Prize for <b>Navi Pillay<\/b>. The government renamed the NSAP the <b>PM Samajik Sahayata Yojana<\/b>, appointed six <b>governors<\/b> and named <b>Ashutosh Dixit<\/b> the next Air chief. The Navy commissioned <b>INS Samarthak<\/b> at Karwar, Chandigarh's <b>Sukhna<\/b> wetland took India to <b>103 Ramsar sites<\/b>, and the <b>India–New Zealand FTA<\/b> came into force on 20 October.<\/p>","key":"Repo 5.50% (7 Oct); Asian Games 4th, 85 medals; Nobel Peace — Navi Pillay; Air chief — Ashutosh Dixit (29th); India–NZ FTA from 20 Oct."},{"k":"table","title":"National — government decisions, schemes, laws","head":["Item","Fact","Note"],"rows":[["NSAP renamed","Became the Pradhan Mantri Samajik Sahayata Yojana on 14 Oct 2026","Cabinet approved ₹53,428 crore for 2026-27 to 2030-31; disability pension now from 40% disability (was 80%)."],["Old-age pension under the renamed NSAP","IGNOAPS is now the Pradhan Mantri Vridhavastha Pension Yojana (Oct 2026)","One of the four component schemes given new names on 14 Oct 2026."],["SME Growth Fund","Cabinet approved a ₹10,000 crore government commitment on 6 Oct 2026","The fund makes direct equity investments in small and medium enterprises; announced in the Budget 2026-27."],["Chennai Metro Phase II","PM Modi opened a stretch of about 15 km on 11 Oct 2026","With Tamil Nadu CM C. Joseph Vijay; projects worth over ₹13,000 crore launched in Tamil Nadu the same day."],["New Ramsar sites","Sukhna Wetland (Chandigarh) and Sauj Jheel (Uttar Pradesh) added in Oct 2026","India now has 103 Ramsar sites."]]},{"k":"table","title":"International — summits, agreements, elections abroad","head":["Item","Fact","Note"],"rows":[["India–New Zealand free trade agreement","Came into force on 20 Oct 2026","All Indian exports get duty-free entry into New Zealand; New Zealand is to help bring US$ 20 billion of investment into India over 15 years."],["Brazil's presidential election, first round","4 Oct 2026: Flávio Bolsonaro first (about 47%), President Lula second (about 45%)","No one crossed 50%, so the two meet in a run-off on 25 Oct 2026."],["Romania's new government","Independent diplomat Luca Niculescu sworn in as PM (decree of 20 Oct 2026)","Parliament backed his cabinet 280 to 58, ending a crisis that began in May."],["Choosing the next UN Secretary-General","The Security Council held its 6th straw poll on 16 Oct 2026","António Guterres's term ends on 31 Dec 2026; the new Secretary-General takes office in January 2027."]]},{"k":"table","title":"Economy and banking","head":["Item","Fact","Note"],"rows":[["RBI monetary policy (7 Oct 2026)","Repo rate raised by 25 basis points to 5.50%","The first hike since February 2023; stance changed from neutral to 'calibrated tightening'. SDF 5.25%, MSF and Bank Rate 5.75%."],["RBI projections for 2026-27 (7 Oct 2026)","GDP growth 7.1%; CPI inflation 5.2%","Governor Sanjay Malhotra; the next MPC meeting is on 2–4 Dec 2026."],["IMF World Economic Outlook (13 Oct 2026)","India's growth forecast for 2026-27 raised to 7.0%","0.6 percentage point above the July 2026 forecast; India stays among the fastest-growing major economies."],["Global Hunger Index 2026 (14 Oct 2026)","India 100th of 122, score 24.1 — 'serious'","Published by Concern Worldwide and Welthungerhilfe; India was 102nd in 2025."],["Henley Passport Index (Oct 2026)","India 84th; Singapore first (visa-free access to 193 destinations)","India was 81st in July 2026."]]},{"k":"table","title":"Science, space and defence","head":["Item","Fact","Note"],"rows":[["INS Samarthak","Commissioned at Karwar on 16 Oct 2026","Built by L&T at Kattupalli; a multi-purpose vessel to test weapons and sensors; Vice-President C. P. Radhakrishnan presided."],["Fleet Support Ship 'Surya'","Launched at Hindustan Shipyard, Visakhapatnam, on 6 Oct 2026","The Navy's first Fleet Support Ship (FSS-1); Rajnath Singh was the chief guest."],["DRDO high-altitude airship","Flight to 21 km announced on 6 Oct 2026","Built by ADRDE, Agra; stayed near 20 km for over 30 minutes and was recovered."],["INDRA 2026","India–Russia exercise in Russia; naval phase in the Sea of Japan on 16–17 Oct 2026","Land, sea and air components; the land phase ran to 23 Oct."],["AUSTRAHIND 2026","India–Australia army exercise, Thiruvananthapuram, 19 Oct – 1 Nov 2026","Held at the Foreign Training Node; jungle, island and coastal drills."],["SIMBEX 2026","India–Singapore naval exercise began on 21 Oct 2026","Sea phase planned for 24–26 Oct."]]},{"k":"table","title":"Sports","head":["Item","Fact","Note"],"rows":[["Asian Games 2026 — India's final place","4th, with 85 medals (21 gold, 27 silver, 37 bronze)","Games closed on 4 Oct 2026; China topped the table; India's best remains 107 medals (Hangzhou)."],["Asian Games — men's hockey","Gold on 3 Oct 2026, beating Malaysia in the final","India kept its title and qualified directly for the 2028 Los Angeles Olympics."],["Asian Games — women's hockey","Gold on 2 Oct 2026, beating China 1-0","Lalremsiami scored; India's first women's hockey gold since 1982; also an LA 2028 place."],["Asian Games — men's cricket","Gold on 3 Oct 2026, beating Pakistan by 19 runs","India 211/6, Pakistan 192/6; India's second straight Asian Games title."],["Pranavi Urs","Women's individual golf gold, 3 Oct 2026","The first Indian woman to win an Asian Games golf gold; also team silver."],["Asian Games closing ceremony flag-bearer","Neeru Dhanda (4 Oct 2026)","The next Asian Games are in Doha (2030)."],["India vs West Indies T20I series","Drawn 2-2; the fifth match in Bengaluru was washed out on 17 Oct 2026","India had won the ODI series 2-1."]]},{"k":"table","title":"Awards and honours","head":["Item","Fact","Note"],"rows":[["Nobel Peace Prize 2026","Navi Pillay (South Africa) — announced 9 Oct 2026","Jurist of Indian origin; former UN High Commissioner for Human Rights."],["Nobel Prize in Literature 2026","Anne Carson","Canadian poet."],["Nobel Prize in Physics 2026","Francis Halzen","For discovering high-energy neutrinos from space."],["Nobel Prize in Chemistry 2026","Henri B. Kagan and Kenso Soai","How homochirality (one-handedness of molecules) can arise by itself."],["Nobel Prize in Medicine 2026","Karl Deisseroth, Peter Hegemann and Georg Nagel","Optogenetics — controlling cells with light."],["Economics Nobel 2026","Robert E. Hall and Michael Woodford","Macroeconomic models for stabilisation policy."]]},{"k":"table","title":"Appointments","head":["Item","Fact","Note"],"rows":[["Chief of the Air Staff (29th)","Air Marshal Ashutosh Dixit — named on 6 Oct 2026, takes over on 31 Oct 2026","After ACM Amar Preet Singh (28th); tenure to 31 Dec 2028."],["Governor of Tamil Nadu","Rajendra Vishwanath Arlekar — moved from Keralam (12 Oct 2026)","One of six governors appointed by the President that day."],["Governor of Karnataka","Sudha Yadav (12 Oct 2026)","Also named: Keralam O. P. Mathur, Odisha Braj Mohan Ram, Uttarakhand Dhal Singh Bisen, Sikkim Dushyant Gautam."],["Director General, RPF","Jitendra Kumar — named on 14 Oct 2026 (to March 2030)","After Sonali Mishra, the first woman DG of the RPF."],["Chairman, men's cricket selection committee (BCCI)","Pragyan Ojha — 19 Oct 2026","After Ajit Agarkar; Ramesh Powar joined the panel."]]},{"k":"table","title":"Places and persons in news","head":["Item","Fact","Note"],"rows":[["Karwar, Karnataka","INS Samarthak commissioned here on 16 Oct 2026","At the INS Kadamba naval base."],["Sukhna Wetland, Chandigarh","Named a Ramsar site in Oct 2026","Sukhna Lake lies at the foot of the Shivalik hills."],["Sauj Jheel, Uttar Pradesh","Named a Ramsar site in Oct 2026","A shallow lake in the Ganga floodplain, Mainpuri district."],["Navi Pillay","Nobel Peace laureate 2026","South African jurist of Indian origin; once President of the Rwanda tribunal (ICTR)."],["Lalremsiami","Scored the only goal of the Asian Games women's hockey final (2 Oct 2026)","India beat China 1-0."],["Flávio Bolsonaro","Led Brazil's presidential first round on 4 Oct 2026","Faces President Lula in the run-off on 25 Oct."]]},{"k":"table","title":"Obituaries","head":["Item","Fact","Note"],"rows":[["Nana Patekar","Hindi and Marathi film actor; died in Goa on 8 Oct 2026","Cardiac arrest at his residence; given a state funeral by Maharashtra."],["Madhu Kambikar","Marathi actress and Lavani artiste; died in Pune on 12 Oct 2026","Known for Shapit and Ek Hota Vidushak; Maharashtra CM Devendra Fadnavis paid tribute."],["Vummidi Ethiraj","Jeweller linked to the Sengol; died in Chennai in Oct 2026, aged 99","The Sengol was presented to Jawaharlal Nehru in 1947; PM Modi and Vice-President Radhakrishnan condoled."]]},{"k":"trick","h":"The Air chiefs in order — <b>“28 Amar, 29 Ashu”<\/b>: Amar Preet Singh was the <b>28th<\/b> Chief of the Air Staff; <b>Ashutosh Dixit<\/b> is the <b>29th<\/b>, from <b>31 October 2026<\/b>."},{"k":"trick","h":"Three golds on one day — <b>3 October<\/b> "use strict";
/* Current Affairs Lab — decks built from the lesson tables (labRows), played by tools/workbook/games.js.
   Nothing here names a month: every table of every lesson is read, so a new month file is picked up by itself.
   - one deck per kind of news (Sports, Appointments …), gathering that table from every month, newest first;
   - one deck per month, with all of that month's tables;
   - a Grand Mix.
   The "Sources" tables are left out. A deck needs at least four different answers to give four options; smaller
   decks are dropped, and with no deck at all the Lab simply shows no games. */
const CA_KINDS = [
  ["National", "🇮🇳"], ["International", "🌍"], ["Economy and banking", "💹"], ["Science, space and defence", "🚀"],
  ["Sports", "🏅"], ["Awards and honours", "🏆"], ["Appointments", "🪪"], ["Places and persons in news", "📍"], ["Obituaries", "🕯️"]
];
const CA_MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const caNum = id => +String(id).replace(/\D/g, "");
const caLessons = LESSONS.slice().sort((a, b) => caNum(b.id) - caNum(a.id));          // newest month first
const caStrip = s => String(s == null ? "" : s).replace(/<[^>]+>/g, "").trim();
const caTables = l => l.blocks.filter(b => b.k === "table").map((t, n) => ({ title: caStrip(t.title), n }))
  .filter(t => !/^Sources/i.test(t.title));
const caKind = title => (CA_KINDS.find(k => title.toLowerCase().startsWith(k[0].toLowerCase())) || [title])[0];
const caOk = d => new Set(d.pairs.map(p => p[1])).size >= 4;
const caSlug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

const CA_KIND_DECKS = CA_KINDS.map(([kind, ico]) => {
  const from = caLessons.filter(l => caTables(l).some(t => caKind(t.title) === kind));
  const pairs = from.flatMap(l => caTables(l).filter(t => caKind(t.title) === kind).flatMap(t => labRows(l.id, t.n)));
  const months = from.map(l => CA_MONTHS[caNum(l.id) - 1]).filter(Boolean);
  return { id: "k-" + caSlug(kind), ico, title: kind, sub: months.length ? months.slice(0, 3).join(", ") + (months.length > 3 ? " and earlier" : "") : "",
    lesson: from.length ? from[0].id : undefined, q: "", pairs };
}).filter(caOk);
const CA_MONTH_DECKS = caLessons.map(l => ({
  id: "m-" + l.id, ico: "🗓️", title: (CA_MONTHS[caNum(l.id) - 1] || l.id) + " 2026", sub: "The whole month — every table", lesson: l.id, q: "",
  pairs: caTables(l).flatMap(t => labRows(l.id, t.n))
})).filter(caOk);
const CA_DECKS = CA_KIND_DECKS.concat(CA_MONTH_DECKS);
const CA_MIX = CA_KIND_DECKS.length ? CA_KIND_DECKS : CA_MONTH_DECKS;      // the kind decks already hold every row once
const caMatch = ["k-appointments", "k-awards-and-honours", "k-sports"].map(id => CA_DECKS.find(d => d.id === id))
  .find(d => d && d.pairs.filter((p, i, a) => a.filter(x => x[1] === p[1]).length === 1).length >= 6);
const LAB_CONF = {
  title: "News Lab", blurb: "Sixty seconds of the year's news at a time — who, where, what and when. Every right answer earns XP.",
  ranks: [[0,"Reader","📰"],[60,"Reporter","🗞️"],[200,"Correspondent","🎙️"],[450,"Editor","✒️"],[900,"Editor-in-Chief","🏛️"]],
  decks: CA_DECKS.length ? CA_DECKS.concat([{ id: "mix", ico: "🎲", title: "Grand Mix", sub: "Every month at once — the real exam feel", q: "", make: () => labMix(CA_MIX), list: () => CA_MIX.flatMap(d => d.pairs) }]) : [],
  match: caMatch ? { deck: caMatch.id, title: "Pair each " + caMatch.title.toLowerCase() + " item with its fact", sub: "Flip cards — " + caMatch.title.toLowerCase() + " from the latest months" } : undefined
};

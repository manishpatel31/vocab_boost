{"id":"CA2","title":"February 2026","hi":"फ़रवरी 2026","blocks":[{"k":"hot","h":"Most likely to be asked: the <b>Union Budget 2026-27<\/b> (1 Feb — fiscal deficit <b>4.3%<\/b>, capex <b>₹12.2 lakh crore<\/b>, new Income-tax Act from 1 April, 16th Finance Commission's <b>41%<\/b>), the <b>AI Impact Summit<\/b> at Bharat Mandapam, the <b>RBI holding the repo at 5.25%<\/b>, the new <b>CPI (2024)<\/b> and <b>GDP (2022-23)<\/b> base years, <b>India's sixth U-19 World Cup<\/b>, <b>Alcaraz<\/b>'s Australian Open, <b>Tarique Rahman<\/b> as Bangladesh's PM and the <b>18% US tariff<\/b> deal."},{"k":"story","h":"<p>February 2026 began with the <b>Union Budget<\/b> on <b>Sunday, 1 February<\/b>. The Finance Minister held income-tax slabs where they were but brought in the new <b>Income-tax Act, 2025<\/b> from 1 April, raised the tax on <b>futures and options<\/b>, set the fiscal deficit at <b>4.3%<\/b> and capital spending at <b>₹12.2 lakh crore<\/b>, and tabled the <b>16th Finance Commission<\/b>'s report, which kept the states' share at <b>41%<\/b>. The same day, <b>Alcaraz<\/b> won the Australian Open to complete the career Grand Slam.<\/p><p>On <b>6 February<\/b> the RBI left the repo rate at <b>5.25%<\/b>, India and the US announced a trade framework cutting the US tariff to <b>18%<\/b>, and India's boys won a record <b>sixth U-19 World Cup<\/b> in Harare. Elections abroad followed — <b>Japan<\/b> and <b>Portugal<\/b> on 8 February, <b>Bangladesh<\/b> on 12 February, where <b>Tarique Rahman<\/b> became PM. New Delhi hosted the <b>AI Impact Summit<\/b> and Visakhapatnam the <b>International Fleet Review<\/b>. The statistics changed too — a <b>CPI with base 2024<\/b> (12 Feb) and a <b>GDP series with base 2022-23<\/b> (27 Feb). The month ended with US–Israeli strikes on Iran that killed <b>Ayatollah Khamenei<\/b> (28 Feb).<\/p>","key":"Budget 1 Feb (FD 4.3%, capex ₹12.2 lakh crore, FC share 41%); repo 5.25% (6 Feb); U-19 WC sixth title; AI Summit New Delhi; Khamenei killed (28 Feb)."},{"k":"table","title":"National — government decisions, schemes, laws","head":["Item","Fact","Note"],"rows":[["Union Budget 2026-27","Presented by FM Nirmala Sitharaman on 1 Feb 2026 — a Sunday","Total spending about ₹53.47 lakh crore; income-tax slabs and rates left unchanged."],["Fiscal deficit target","4.3% of GDP for 2026-27 (BE)","Down from 4.4% in 2025-26 (revised estimate)."],["Central government debt","55.6% of GDP in 2026-27 (BE)","The aim is about 50% of GDP by March 2031."],["Capital expenditure","₹12.2 lakh crore for 2026-27","Up from ₹11.2 lakh crore in 2025-26."],["Income-tax Act, 2025","Replaces the Income-tax Act, 1961 from 1 Apr 2026","'Previous year' and 'assessment year' give way to a single 'tax year'."],["16th Finance Commission","Report for 2026–31 tabled on 1 Feb 2026; states' share of central taxes kept at 41%","Chaired by Arvind Panagariya; the same 41% as the 15th Commission."],["India AI Impact Summit","Bharat Mandapam, New Delhi, from 16 Feb 2026","The New Delhi Declaration on AI Impact was adopted on 19 Feb; over 38,000 GPUs already provided under the IndiaAI Mission."]]},{"k":"table","title":"International — summits, agreements, elections abroad","head":["Item","Fact","Note"],"rows":[["India–US interim trade framework","Announced on 6 Feb 2026: US tariff on Indian goods cut to 18%","The extra 25% duty was removed from 7 Feb 2026; dairy and cereals stayed protected on India's side."],["Bangladesh's general election","12 Feb 2026: the BNP won 209 of 297 declared seats","Jamaat-e-Islami second (68); the Awami League did not contest. A referendum backed the July National Charter reforms."],["Bangladesh's new Prime Minister","Tarique Rahman sworn in on 17 Feb 2026","Son of Khaleda Zia; replaced the interim government led by Muhammad Yunus."],["Japan's general election","8 Feb 2026: PM Sanae Takaichi's LDP won 316 of 465 seats","A two-thirds majority on its own — the LDP's best result since its founding in 1955."],["Portugal's presidential run-off","8 Feb 2026: António José Seguro beat André Ventura with about 66.7%","Seguro, a Socialist, succeeds Marcelo Rebelo de Sousa; Ventura leads the far-right Chega."],["US–Israeli strikes on Iran","28 Feb 2026: joint strikes across Iran; Supreme Leader Ali Khamenei killed","Iranian state media confirmed his death; Iran fired missiles at Israel and at Gulf states hosting US bases."]]},{"k":"table","title":"Economy and banking","head":["Item","Fact","Note"],"rows":[["RBI monetary policy (6 Feb 2026)","Repo rate kept at 5.25%; stance neutral","The last MPC meeting of 2025-26, after a 25 bp cut in December 2025. SDF 5.0%, MSF 5.5%."],["New CPI series (12 Feb 2026)","Base year 2024; January 2026 retail inflation 2.75%","Replaced the 2012 base; built on the Household Consumption Expenditure Survey 2023-24; 358 items."],["New GDP series (27 Feb 2026)","Base year 2022-23, replacing 2011-12","Under the new series, growth for 2025-26 is estimated at 7.6%."],["Securities Transaction Tax on F&O","Futures 0.02% → 0.05%; options premium 0.1% → 0.15% (from 1 Apr 2026)","Announced in the Budget to cool speculative derivatives trading."],["India Semiconductor Mission 2.0","Announced in the Budget 2026-27","Moves beyond chips to equipment, materials and Indian chip design (IP)."],["Electronics Components Manufacturing Scheme","Outlay raised to ₹40,000 crore in the Budget","The scheme had started in April 2025 with about ₹23,000 crore."],["SME Growth Fund","₹10,000 crore fund announced in the Budget 2026-27","The Cabinet approved it in October 2026 (see October)."],["Henley Passport Index, February 2026","India 75th, with 56 visa-free destinations","Up from 80th in January."]]},{"k":"table","title":"Science, space and defence","head":["Item","Fact","Note"],"rows":[["International Fleet Review 2026","Reviewed by President Droupadi Murmu off Visakhapatnam on 18 Feb 2026","Theme: 'United Through Oceans, Strengthening Bridges of Friendship'."],["Exercise MILAN 2026","Multinational naval exercise at Visakhapatnam, alongside the Fleet Review","The IONS Conclave of Chiefs was held at the same time."],["New Delhi Frontier AI Commitments","Voluntary framework announced on 19 Feb 2026 at the AI Impact Summit","Adopted by leading global and Indian AI companies."]]},{"k":"table","title":"Sports","head":["Item","Fact","Note"],"rows":[["Australian Open 2026 — men's singles","Carlos Alcaraz beat Novak Djokovic 2-6, 6-2, 6-3, 7-5 on 1 Feb 2026","His first Australian Open and seventh major; the youngest man to complete the career Grand Slam."],["ICC Under-19 World Cup 2026","India beat England by 100 runs in the final at Harare on 6 Feb 2026","India's sixth U-19 title — a record; the tournament was held in Zimbabwe and Namibia."],["Vaibhav Sooryavanshi","175 off 80 balls in the U-19 World Cup final","The highest score in a U-19 World Cup final; Player of the Match and of the Series."],["Women's Premier League 2026","Royal Challengers Bengaluru beat Delhi Capitals by 6 wickets, Vadodara, 5 Feb 2026","RCB's second title; chasing 204 — the highest successful chase in the WPL. Delhi lost a fourth straight final."],["Tata Steel Chess Masters 2026","Won by Nodirbek Abdusattorov (Uzbekistan) on 1 Feb 2026","Played at Wijk aan Zee (Netherlands); Javokhir Sindarov second."],["Winter Olympics 2026","Milan–Cortina (Italy), ended on 22 Feb 2026: Norway top with 18 golds","The USA second (12 golds, its best); Italy had its best Winter Games."]]},{"k":"table","title":"Awards and honours","head":["Item","Fact","Note"],"rows":[["68th Grammy Awards (1 Feb 2026)","Album of the Year: Bad Bunny, 'Debí Tirar Más Fotos'","The first Spanish-language album to win it; held in Los Angeles."],["Grammys 2026 — other main awards","Record of the Year 'Luther' (Kendrick Lamar & SZA); Song of the Year 'Wildflower' (Billie Eilish)","Best New Artist: Olivia Dean."]]},{"k":"table","title":"Appointments","head":["Item","Fact","Note"],"rows":[["Prime Minister of Bangladesh","Tarique Rahman — sworn in on 17 Feb 2026","Oath given by President Mohammed Shahabuddin; 25 ministers sworn in with him."],["President-elect of Portugal","António José Seguro — elected on 8 Feb 2026","For a five-year term."],["Prime Minister of Japan","Sanae Takaichi — won a two-thirds majority on 8 Feb 2026","PM since 21 Oct 2025; her party's best result since 1955."]]},{"k":"table","title":"Places and persons in news","head":["Item","Fact","Note"],"rows":[["Bharat Mandapam, New Delhi","Hosted the India AI Impact Summit (Feb 2026)","Gave its name to the New Delhi Declaration on AI Impact."],["Visakhapatnam","International Fleet Review and MILAN 2026","Home of the Navy's Eastern Naval Command."],["Harare, Zimbabwe","U-19 World Cup final, 6 Feb 2026","India beat England at Harare Sports Club."],["Vadodara, Gujarat","WPL 2026 final, 5 Feb 2026","At the Baroda Cricket Association Stadium."],["Milan and Cortina d'Ampezzo, Italy","Joint hosts of the 2026 Winter Olympics","Norway topped the medal table."],["Wijk aan Zee, Netherlands","Tata Steel Chess, which ended on 1 Feb 2026","Abdusattorov won the Masters."]]},{"k":"table","title":"Obituaries","head":["Item","Fact","Note"],"rows":[["Ayatollah Ali Khamenei","Supreme Leader of Iran; killed in the US–Israeli strikes of 28 Feb 2026","Iran declared national mourning; senior officials were killed with him."]]},{"k":"trick","h":"Budget numbers as a ladder — <b>4.3 → 12.2 → 41 → 55.6<\/b>: fiscal deficit <b>4.3%<\/b> of GDP, capex <b>₹12.2 lakh crore<\/b>, states' share <b>41%<\/b>, debt <b>55.6%<\/b> of GDP. And the Survey came three days earlier, on <b>29 January<\/b>."},{"k":"trick","h":"New bases, newest last: <b>CPI → 2024<\/b> (released 12 Feb), <b>GDP → 2022-23<\/b> (released 27 Feb). The old bases were <b>2012<\/b> for CPI and <b>2011-12<\/b> for GDP."},{"k":"trap","h":"<b>Which growth figure?<\/b> The Economic Survey (29 Jan) and the RBI (6 Feb) said <b>7.4%<\/b> for 2025-26 on the old base; the <b>new series<\/b> of 27 Feb put it at <b>7.6%<\/b>. Read which series the question means."},{"k":"trap","h":"The RBI <b>held<\/b> the repo at <b>5.25%<\/b> in February 2026 — the cut had come in December 2025, and the hike to 5.50% came only in October 2026. And the <b>16th<\/b> Finance Commission did <b>not<\/b> change the states' share: it stayed at <b>41%<\/b>, as under the 15th."},{"k":"trap","h":"<b>Two finals on 1 February<\/b>: <b>Alcaraz<\/b> beat Djokovic in Melbourne, and <b>Abdusattorov<\/b> won the Tata Steel Masters at Wijk aan Zee. The women's Australian Open final (Rybakina) was a day earlier, on <b>31 January<\/b>."},{"k":"table","title":"Sources (checked 24 Oct 2026)","head":["Source","What it confirmed"],"rows":[["<a href=\"https://prsindia.org/files/budget/budget_parliament/2026/Union_Budget_Analysis-2026-27.pdf\">prsindia.org (Union Budget Analysis 2026-27)<\/a>","Fiscal deficit 4.3% (BE) v 4.4% (RE); total spending ₹53.47 lakh crore; debt 55.6% of GDP, about 50% by March 2031; tax slabs unchanged"],["<a href=\"https://scroll.in/latest/1090413/scroll_in\">scroll.in<\/a>","Capex ₹12.2 lakh crore, up from ₹11.2 lakh crore; no tax-rate changes"],["study-economics.html, lesson L20 (this repo)","Budget presented 1 Feb 2026, a Sunday; FD 4.3%; debt 55.6%; 16th FC 41%; ISM 2.0; SME Growth Fund"],["<a href=\"https://www.outlookbusiness.com/economy-and-policy/new-i-t-law-higher-securities-transaction-tax-on-fo-trade-to-kick-in-from-april-1\">outlookbusiness.com<\/a>","New Income-tax Act and higher STT on F&O from 1 Apr 2026"],["<a href=\"https://www.outlookmoney.com/invest/stt-hike-from-april-1-2026-budget-what-it-means-for-futures-and-options-traders\">outlookmoney.com<\/a>","STT rates: futures 0.02%→0.05%, options 0.1%→0.15%"],["<a href=\"https://www.onmanorama.com/news/business/2026/03/31/new-income-tax-law-april-1.html\">onmanorama.com<\/a>","Income-tax Act, 2025 replaces the 1961 Act; 'tax year'"],["<a href=\"https://prsindia.org/policy/report-summaries/report-of-the-16th-finance-commission-for-2026-31\">prsindia.org (16th FC summary)<\/a>","41% vertical share, unchanged from the 15th FC; period 2026–31"],["<a href=\"https://assamtribune.com/buzz/union-budget-2026-27-live-492\">assamtribune.com (Budget live blog)<\/a>","Government accepted the 41% share; debt 55.6% (BE) from 56.1% (RE)"],["<a href=\"https://www.drishtiias.com/daily-updates/daily-news-analysis/16th-finance-commission-report/print_manually\">drishtiias.com<\/a>","16th FC report, chaired by Arvind Panagariya, tabled with the Budget"],["<a href=\"https://www.digitalindia.gov.in/press_release/budget-2026-27-announces-the-launch-of-india-semiconductor-mission-ism-2-0/\">digitalindia.gov.in<\/a>","Budget 2026-27 launches ISM 2.0"],["<a href=\"https://www.thenewsminute.com/amp/story/all-states/budget-2026-27-announces-india-semiconductor-mission-20-hikes-component-manufacturing-outlay-to-rs-40000-crore\">thenewsminute.com<\/a>","ECMS outlay raised to ₹40,000 crore; ISM 2.0 scope; ₹10,000 crore SME fund"],["<a href=\"https://www.digitalindia.gov.in/press_release/india-ai-impact-summit-2026-concludes-at-bharat-mandapam-with-strong-global-endorsement-of-indias-responsible-ai-vision/\">digitalindia.gov.in<\/a>","AI Impact Summit at Bharat Mandapam; 38,000+ GPUs under IndiaAI Mission"],["<a href=\"https://visionias.in/blog/current-affairs/india-ai-impact-summit-2026-and-new-delhi-declaration-indias-leap-into-the-global-ai-order\">visionias.in<\/a>","New Delhi Declaration on AI Impact adopted 19 Feb; Frontier AI Commitments"],["<a href=\"https://www.etvbharat.com/en/bharat/us-and-india-joint-statement-on-india-us-interim-trade-agreement-enn26020700547\">etvbharat.com<\/a>","India–US framework for an interim trade agreement; tariff 18%"],["<a href=\"https://kpmg.com/us/en/taxnewsflash/news/2026/02/united-states-removes-tariffs-imports-india.html\">kpmg.com<\/a>","Extra 25% duty on Indian goods removed from 7 Feb 2026"],["<a href=\"https://www.newsonair.gov.in/india-us-trade-deal-cuts-tari {"id":"CA4","title":"April 2026","hi":"अप्रैल 2026","blocks":[{"k":"hot","h":"Most likely to be asked: <b>Census 2027 Phase I<\/b> and the first <b>self-enumeration<\/b> (from 1 April), the <b>Income-tax Act, 2025<\/b> in force from 1 April, the <b>assembly poll dates<\/b> (9, 23 and 29 April), the <b>RBI's hold at 5.25%<\/b>, <b>Ashok Kumar Lahiri<\/b> at NITI Aayog, <b>Artemis II<\/b>, India's <b>16 medals<\/b> at the Asian Boxing Championships, and the death of <b>Asha Bhosle<\/b>."},{"k":"story","h":"<p>April 2026 began with two big starts on the same day. On <b>1 April<\/b> the first phase of <b>Census 2027<\/b> opened — houselisting, with citizens allowed for the first time to <b>count themselves online<\/b> — and the new <b>Income-tax Act, 2025<\/b> replaced the law of 1961. The same evening (US time) NASA launched <b>Artemis II<\/b>, which carried four astronauts round the Moon and brought them home on 10 April.<\/p><p>At home it was an election month: <b>Assam, Kerala and Puducherry<\/b> voted on <b>9 April<\/b>, <b>Tamil Nadu<\/b> on <b>23 April<\/b>, and <b>West Bengal<\/b> on 23 and 29 April, with counting fixed for 4 May. The <b>RBI<\/b> held the repo rate at <b>5.25%<\/b> on 8 April, the Cabinet raised <b>DA to 60%<\/b>, and NITI Aayog got a new Vice-Chairperson, <b>Ashok Kumar Lahiri<\/b>. Abroad, <b>Péter Magyar<\/b> ended Viktor Orbán's 16 years in Hungary, and a Pakistan-brokered <b>US–Iran ceasefire<\/b> paused the West Asia war. India's boxers won <b>16 medals<\/b> in Ulaanbaatar, and the country mourned <b>Asha Bhosle<\/b>.<\/p>","key":"1 April: Census Phase I + Income-tax Act 2025 + Artemis II launch; polls 9/23/29 April; repo 5.25%; NITI — Lahiri; Asha Bhosle (12 Apr)."},{"k":"table","title":"National — government decisions, schemes, laws","head":["Item","Fact","Note"],"rows":[["Census 2027 — Phase I","Houselisting and Housing Census began on 1 April 2026; runs to 30 Sep 2026","Each state or UT picks its own 30-day window. Phase II, the population count, follows in February 2027."],["Self-enumeration","Offered for the first time in an Indian census (from April 2026)","Residents fill the form on a web portal in the 15 days before house-to-house work starts, and get a Self-Enumeration ID."],["Income-tax Act, 2025","Came into force on 1 April 2026, replacing the Income-tax Act, 1961","Passed in August 2025 (assent 21 Aug 2025); it introduces the 'tax year' — the first is 2026-27. Meant to simplify, not to change tax rates."],["Dearness allowance","Cabinet, 18 Apr 2026: DA and DR raised by 2 points, from 58% to 60%","From 1 Jan 2026; about 50.46 lakh employees and 68.27 lakh pensioners benefit; cost about ₹6,791 crore a year."],["Two hydro projects in Arunachal Pradesh","Approved by the CCEA in April 2026: ₹40,175 crore for 2,920 MW","Kamala HEP (1,720 MW, NHPC joint venture) and Kalai-II HEP (1,200 MW, on the Lohit, THDC joint venture). The state gets 12% free power."],["Assembly polls — first round","9 Apr 2026: Assam (126 seats), Kerala (140) and Puducherry (30) voted","Each in a single phase. Schedule announced by the Election Commission on 15 Mar 2026."],["Assembly polls — Tamil Nadu and West Bengal","Tamil Nadu (234 seats) voted on 23 Apr 2026; West Bengal on 23 Apr (152 seats) and 29 Apr (142)","824 seats and about 17.4 crore voters in all; counting for every state was set for 4 May 2026."]]},{"k":"table","title":"International — summits, agreements, elections abroad","head":["Item","Fact","Note"],"rows":[["Hungary's parliamentary election","12 Apr 2026: Péter Magyar's Tisza party won about 53% and 138 of 199 seats","A two-thirds majority (preliminary count). Viktor Orbán, in power for 16 years, conceded; his Fidesz alliance got 55 seats."],["US–Iran ceasefire","A two-week ceasefire announced on 7 Apr 2026, mediated by Pakistan","Tied to Iran reopening the Strait of Hormuz to safe passage; Pakistan's PM Shehbaz Sharif and army chief Asim Munir helped broker it."]]},{"k":"table","title":"Economy and banking","head":["Item","Fact","Note"],"rows":[["RBI monetary policy (8 Apr 2026)","Repo rate kept at 5.25%; stance neutral; MPC vote unanimous","The first policy of 2026-27. SDF 5.00%, MSF and Bank Rate 5.50%. Governor Sanjay Malhotra."],["RBI projections for 2026-27 (8 Apr 2026)","GDP growth 6.9%; CPI inflation 4.6%","Growth for 2025-26 put at 7.6% (new GDP series); the West Asia war was flagged as a risk to prices."],["IMF World Economic Outlook (14 Apr 2026)","India's growth for 2026-27 raised to 6.5% (from 6.4%)","World growth 3.1% in 2026. The IMF credited the cut in extra US tariffs on Indian goods (from 50% to 10%)."],["World Press Freedom Index 2026 (RSF)","India 157th of 180 — released 30 Apr 2026","Down from 151st in 2025; 'very serious' category. Norway first for the 10th year running; Eritrea last."]]},{"k":"table","title":"Science, space and defence","head":["Item","Fact","Note"],"rows":[["Artemis II — launch","NASA's SLS lifted off from Kennedy Space Center on 1 Apr 2026","Crew: Reid Wiseman (commander), Victor Glover (pilot), Christina Koch and Canada's Jeremy Hansen. First crew to the Moon since Apollo 17 (1972)."],["Artemis II — return","Orion 'Integrity' splashed down in the Pacific off San Diego on 10 Apr 2026","A lunar flyby, not a landing; reached 406,771 km from Earth — the farthest humans have ever travelled, beating Apollo 13."],["NASM-SR salvo launch","29 Apr 2026: two Naval Anti-Ship Missiles (Short Range) fired in quick succession from a Sea King helicopter","The first salvo launch, off Odisha (ITR Chandipur); developed by DRDO's Research Centre Imarat, Hyderabad, to replace the Sea Eagle."],["DUSTLIK 2026","7th India–Uzbekistan army exercise, Gurumsaray (Namangan, Uzbekistan), ended 25 Apr 2026","60 personnel from each side; drills in semi-mountainous terrain. The 2025 edition was held in Pune."]]},{"k":"table","title":"Sports","head":["Item","Fact","Note"],"rows":[["Asian Boxing Championships 2026","Ulaanbaatar (Mongolia), ended 10 Apr 20 {"id":"CA9","title":"September 2026","hi":"सितंबर 2026","blocks":[{"k":"hot","h":"Most likely to be asked: the <b>18th BRICS Summit<\/b> in New Delhi, the <b>EPFO wage ceiling of ₹25,000<\/b>, the <b>first LNG train<\/b> at Sabarmati, the <b>Asian Games<\/b> opening and India's first gold (women's cricket), <b>Anant Nag<\/b>'s Phalke Award at the first National Film Awards held outside Delhi, and the <b>US Open<\/b> champions."},{"k":"story","h":"<p>September 2026 was India's month as host. On <b>12–13 September<\/b> New Delhi held the <b>18th BRICS Summit<\/b>, which ended with the <b>New Delhi Declaration<\/b>; a fortnight earlier PM Modi had been at the <b>SCO Summit in Bishkek<\/b>. At home, the EPFO wage ceiling went up from ₹15,000 to <b>₹25,000<\/b> on 17 September — the first change since 2014 — and a <b>0.4% charge on large UPI payments to merchants<\/b> was notified. Amit Shah flagged off India's <b>first LNG-powered train<\/b> from Sabarmati, and the Cabinet ended the month with <b>Green Energy Corridor Phase-III<\/b> and the <b>rabi MSPs<\/b>.<\/p><p>In sport, the <b>Asian Games<\/b> opened in <b>Aichi-Nagoya<\/b> on 19 September; India's women cricketers won the first gold and <b>Neeru Dhanda<\/b> made history in trap. <b>Zverev<\/b> and <b>Rybakina<\/b> won the US Open, and India took silver and bronze at the <b>Chess Olympiad<\/b> in Samarkand. The <b>72nd National Film Awards<\/b> were presented at <b>Ekta Nagar<\/b> in Gujarat — the first time outside New Delhi — with the <b>Phalke Award<\/b> for <b>Anant Nag<\/b>.<\/p>","key":"BRICS in Delhi, SCO in Bishkek; EPFO ₹25,000; LNG train Sabarmati; Asian Games Aichi-Nagoya; Phalke — Anant Nag."},{"k":"table","title":"National — government decisions, schemes, laws","head":["Item","Fact","Note"],"rows":[["EPFO wage ceiling","Raised from ₹15,000 to ₹25,000 a month, with effect from 17 Sep 2026","Cabinet decision; the first revision since September 2014. Over 51 lakh more workers come under compulsory EPFO cover."],["Supreme Court on the CEC law","Split verdict on 23 Sep 2026; the matter sent to the CJI for a Constitution Bench","Justices Dipankar Datta and Satish Chandra Sharma differed on the challenge to the 2023 law on appointing the CEC and Election Commissioners."],["India's first LNG-powered train","Flagged off from Sabarmati (Ahmedabad) by Amit Shah on 27 Sep 2026","An eight-coach DEMU for the Sabarmati–Mahesana route; dual-fuel (diesel + LNG) power cars — LNG can replace up to about 40% of the diesel."],["India Net Zero Portal and NAPCC Dashboard","Launched in Mumbai on 16 Sep 2026, World Ozone Day","Launched by MoS Kirti Vardhan Singh (Environment Ministry); companies register net-zero targets on the portal."],["Green Energy Corridor Phase-III","Approved by the Cabinet on 30 Sep 2026: ₹1,86,405 crore","Intra-state transmission lines plus 50 GWh of battery storage, by 2032-33."],["Rabi MSP for 2027-28","Approved on 30 Sep 2026: wheat ₹2,610 a quintal (+₹25)","Safflower got the biggest rise (+₹675, to ₹7,215); mustard ₹6,613, masur ₹7,390."],["E-commerce rules","Consumer Protection (E-Commerce) Amendment Rules, 2026 notified in Sep 2026","Sponsored listings must be labelled and search ranking explained; in force from 1 Jan 2027."],["SEMICON India 2026","5th edition, Yashobhoomi (New Delhi), 17–19 Sep 2026","Inaugurated by PM Modi on 17 Sep; organised by the India Semiconductor Mission, MeitY and SEMI."]]},{"k":"table","title":"International — summits, agreements, elections abroad","head":["Item","Fact","Note"],"rows":[["18th BRICS Summit","New Delhi, 12–13 Sep 2026 — India the host","Leaders adopted the New Delhi Declaration; China hosts the next summit in 2027."],["26th SCO Summit","Bishkek (Kyrgyzstan), 31 Aug – 1 Sep 2026","The Bishkek Declaration was signed on 1 Sep; Kyrgyz President Sadyr Japarov chaired; PM Modi attended."],["UN General Assembly, 81st session","Opened on 8 Sep 2026 under President Khalilur Rahman","Bangladesh's Foreign Minister; elected on 2 June 2026 (99 votes to 91 for Cyprus)."],["Sweden's general election","Held on 13 Sep 2026; the centre-left opposition won 176 of 349 seats","PM Ulf Kristersson announced his resignation on 17 Sep; Social Democrat leader Magdalena Andersson was expected to return."],["Russia's State Duma election","September 2026: United Russia won 349 of 450 seats (final count)","A record for Putin's party; the Communists came second."],["Saxony-Anhalt (Germany) state election","6 Sep 2026: the far-right AfD came first with 43.8%","39 of 83 seats — short of a majority; other parties refuse to work with it."],["India–EU free trade agreement","On 11 Sep 2026 the European Commission sent the text to the EU Council","Talks had concluded on 27 Jan 2026; signing was expected in December."]]},{"k":"table","title":"Economy and banking","head":["Item","Fact","Note"],"rows":[["UPI merchant charge (MDR)","Notified on 14 Sep 2026: 0.4% on payments to merchants above ₹2,000, from 15 Oct 2026","Capped at ₹300; no charge up to ₹2,000, on person-to-person payments or on the customer."],["Current account deficit, Q1 2026-27","US$ 4.2 billion = 0.5% of GDP (RBI, 1 Sep 2026)","0.4% of GDP a year earlier; forex reserves fell by US$ 8.1 billion (BoP basis) in the quarter."],["Moody's growth forecast for India","Raised to 7% for 2026-27 (from 6%), in Sep 2026","India's rating kept at Baa3 with a stable outlook."],["Global Innovation Index 2026 (WIPO)","India 38th of 139 — released on 29 Sep 2026","Switzerland first for the 16th year; India 1st among lower-middle-income economies."],["Global Gender Gap Report 2026 (WEF)","India 131st of 145 — released on 16 Sep 2026","Rank unchanged; India's score 64.5%. Iceland is first, then Finland and Norway."]]},{"k":"table","title":"Science, space and defence","head":["Item","Fact","Note"],"rows":[["GSLV-F17 / EOS-05 (GISAT-1A)","Launched from Sriharikota on 4 Sep 2026","An earth-observation satellite for a geosynchronous orbit; ISRO's first launch since the PSLV-C62 failure of 12 Jan 2026."],["Next Generation Missile Vessel (NGMV)","Keel of the first ship laid at Cochin Shipyard on 18 Sep 2026","Six NGMVs are being built for the Navy, armed with BrahMos; first delivery due March 2027."],["Drug haul in the Arabian Sea","About 526 kg seized from an Iranian boat on 25 Sep 2026","Coast Guard and Gujarat ATS, west of Lakshadweep; worth over ₹3,000 crore; five Pakistani nationals held."],["World Ozone Day 2026 (32nd)","Marked in Mumbai on 16 Sep 2026","Theme: 'Global Action for a Cooler Planet'; the Net Zero Portal was launched there."],["Tarang Shakti 2026","Multinational air exercise of the IAF, Jodhpur, 26 Sep – 12 Oct 2026","The second edition; foreign air forces flew in and over 30 nations sent observers."]]},{"k":"table","title":"Sports","head":["Item","Fact","Note"],"rows":[["US Open 2026 — men's singles","Alexander Zverev (Germany) beat Ben Shelton on 13 Sep 2026","His first US Open and second Grand Slam title, after the 2026 French Open."],["US Open 2026 — women's singles","Elena Rybakina beat Aryna Sabalenka on 12 Sep 2026","Her third Grand Slam title; she also won the 2026 Australian Open."],["Asian Games 2026 opening","Aichi-Nagoya (Japan), 19 Sep 2026","India's flag-bearers: Manu Bhaker and kabaddi star Pawan Sehrawat."],["India's first gold at the 2026 Asian Games","Women's cricket, 22 Sep 2026: beat Sri Lanka by 147 runs","India kept the title it won in 2023; Smriti Mandhana top-scored with 79."],["Neeru Dhanda","Women's trap gold at the Asian Games, 29 Sep 2026","The first Indian woman to win the trap gold at the Asian Games."],["46th Chess Olympiad (Samarkand, Uzbekistan)","Ended 27 Sep 2026: India silver (open) and bronze (women)","Open gold Uzbekistan, women's gold China; India kept the Nona Gaprindashvili Trophy for the best combined result."],["World Athletics Ultimate Championship","First edition, Budapest, 11–13 Sep 2026","Men's javelin won by Rumesh Tharanga Pathirage (Sri Lanka) with 91.09 m; Neeraj Chopra missed it through injury."],["Asian Games kabaddi","Both golds for India on 26 Sep 2026 — men and women beat Iran in the finals","The men's ninth Asian Games kabaddi title."],["Shubman Gill","Unbeaten 223 v West Indies at Guwahati, 30 Sep 2026 — the fastest ODI double century","Reached 200 in 117 balls; India chased 406, the second-highest chase in ODIs, and took the series."]]},{"k":"table","title":"Awards and honours","head":["Item","Fact","Note"],"rows":[["Dadasaheb Phalke Award (for 2024)","Anant Nag — announced 16 Sep, presented 22 Sep 2026","The second Kannada actor to get it, after Dr Rajkumar (1995)."],["72nd National Film Awards ceremony","Ekta Nagar (Kevadia), Gujarat, on 22 Sep 2026","Presented by President Droupadi Murmu — the first ceremony held outside New Delhi."],["72nd National Film Awards — Best Actor","Shared: Mammootty (Bramayugam) and Kartik Aaryan (Chandu Champion)","Best Actress Yami Gautam and Best Feature Film Article 370."],["78th Primetime Emmy Awards","Los Angeles, 14 Sep 2026: Best Drama The Pitt, Best Comedy Widow's Bay","The Pitt won Best Drama for the second year running."],["Right Livelihood Award 2026","Announced on 30 Sep 2026: four laureates","Jalila Haider (Pakistan), Timnit Gebru, the Rural Women's Assembly (South Africa) and the Georgian Young Lawyers' Association."],["Booker Prize 2026 shortlist","Announced on 22 Sep 2026; winner due on 9 Nov 2026","Includes Elizabeth Strout, Marlon James and Douglas Stuart."]]},{"k":"table","title":"Appointments","head":["Item","Fact","Note"],"rows":[["Chairperson, CBSE","Mandeep K. Bhandari — ACC order of 25 Sep 2026","After Lokhande Prashant Sitaram."],["Deputy Chair, ICC","Tavengwa Mukuhlani (Zimbabwe) — 17 Sep 2026, till Nov 2027","The first Zimbabwean in the post; succeeded Imran Khwaja."],["Chairperson, IBBI (additional charge)","Jayanti Prasad, from 13 Sep 2026","A whole-time member of IBBI, after Ravi Mital retired; at most till 20 Nov 2026."],["President, UN General Assembly (81st session)","Khalilur Rahman (Bangladesh) — took office on 8 Sep 2026","Only the second time Bangladesh has held the post (the first was 1986)."]]},{"k":"table","title":"Places and persons in news","head":["Item","Fact","Note"],"rows":[["Ekta Nagar (Kevadia), Gujarat","Hosted the National Film Awards on 22 Sep 2026","Home of the Statue of Unity — the first time the ceremony left New Delhi."],["Sabarmati, Ahmedabad","India's first LNG-powered train started here on 27 Sep 2026","Do not mix it up with the hydrogen train (Jind–Sonipat, Haryana, July 2026)."],["Bishkek","Capital of Kyrgyzstan — hosted the 26th SCO Summit (31 Aug – 1 Sep 2026)","Gave its name to the Bishkek Declaration."],["Samarkand","Uzbekistan — hosted the 46th Chess Olympiad (Sept 2026)","Uzbekistan won the open section at home."],["Nisshin, Japan","Venue of the Asian Games women's cricket final on 22 Sep 2026","India beat Sri Lanka there by 147 runs."],["Yashobhoomi, New Delhi","Hosted SEMICON India 2026 (17–19 Sep)","The 5th edition; PM Modi opened it on 17 Sep."]]},{"k":"table","title":"Obituaries","head":["Item","Fact","Note"],"rows":[["S. R. Janakiraman","Carnatic musicologist; died in Chennai on 4 Sep 2026, aged 98","The last disciple of Tiger Varadachariar; Padma Shri; Sangita Kala Acharya (1997)."],["Solomon Pappaiah","Tamil scholar and Pattimandram (debate) moderator; died in Madurai in Sep 2026, aged 90","Taught Tamil at The American College, Madurai; Padma Shri (2021); acted in Shankar's films."],["Major Vijay Singh Mankotia","Former Himachal Pradesh minister; died on 29 Sep 2026, aged 87","Died at his village in Kangra district."]]},{"k":"trick","h":"Two summits, two declarations — <b>“S before B”<\/b>: the <b>SCO<\/b> met first, in <b>Bishkek<\/b> (1 Sep, Bishkek Declaration), then <b>BRICS<\/b> in <b>Delhi<\/b> (12–13 Sep, New Delhi Declaration). Count the BRICS summits on your fingers: Delhi's was the <b>18th<\/b>, and <b>China<\/b> hosts the 19th in 2027."},{"k":"trick","h":"The <b>₹25,000 EPFO<\/b> ceiling came on <b>17 September<\/b> — the same day SEMICON India opened at Yashobhoomi. One date, two headlines."},{"k":"trap","h":"<b>LNG train<\/b> = <b>Sabarmati<\/b>, Gujarat, <b>27 Sep 2026<\/b> (Amit Shah). <b>Hydrogen train<\/b> = <b>Jind–Sonipat<\/b>, Haryana, <b>17 Jul 2026<\/b> (PM Modi). Do not swap the fuel and the place."},{"k":"trap","h":"At the Asian Games opening, <b>Tajinderpal Singh Toor<\/b> was first named India's male flag-bearer, but <b>Pawan Sehrawat<\/b> carried the flag with <b>Manu Bhaker<\/b>. And the Games are in <b>Aichi-Nagoya<\/b> (Japan) — not Hangzhou, which hosted the previous Games."},{"k":"trap","h":"<b>Two different numbers<\/b>: India is <b>131st<\/b> in the Gender Gap Index 2026 (WEF) but <b>38th<\/b> in the Global Innovation Index 2026 (WIPO). <b>₹2,610<\/b> is wheat's MSP; <b>₹2,000<\/b> is the UPI limit above which merchants pay 0.4%."},{"k":"table","title":"Sources (checked 24 Oct 2026)","head":["Source","What it confirmed"],"rows":[["<a href=\"https://www.pib.gov.in/PressReleasePage.aspx?PRID=2313829&reg=48&lang=2\">pib.gov.in (PRID 2313829)<\/a>","EPFO wage ceiling ₹25,000 from 17 Sep 2026; first revision since Sep 2014; 51 lakh+ workers"],["<a href=\"https://www.labour.gov.in/static/uploads/2026/09/4f607a88c5342aeb980c6b999997caab.pdf\">labour.gov.in (Cabinet release, Sep 2026)<\/a>","Cabinet approval of the higher EPFO wage ceiling"],["<a href=\"https://www.aninews.in/news/national/general-news/supreme-court-delivers-split-verdict-on-pleas-challenging-cec-appointment-law-matter-sent-to-cji-for-constitution-bench20260923160933/\">aninews.in<\/a>","Split verdict on the CEC law, 23 Sep 2026; reference to the CJI"],["<a href=\"https://www.scobserver.in/reports/sc-delivers-split-verdict-sends-eci-appointments-law-challenge-to-larger-bench/\">scobserver.in<\/a>","Judges (Datta, S.C. Sharma) and the 2023 law"],["<a href=\"https://www.business-standard.com/india-news/amit-shah-flags-off-india-s-first-lng-powered-train-from-sabarmati-126092800027_1.html\">business-standard.com<\/a>","First LNG-powered train, Sabarmati, 27 Sep 2026"],["<a href=\"https://newsonair.gov.in/union-minister-amit-shah-flags-off-countrys-first-lng-powered-train-from-sabarmati/\">newsonair.gov.in<\/a>","LNG train: Amit Shah; dual-fuel; up to 40% diesel replaced"],["<a href=\"https://theprint.in/india/pm-modi-flags-off-indias-first-hydrogen-powered-train-from-haryanas-jind/2988805/\">theprint.in<\/a>","Hydrogen train Jind–Sonipat, 17 Jul 2026 (used in a trap box)"],["<a href=\"https://www.uniindia.com/national/environment-digital-tools-climate-action/181402\">uniindia.com<\/a>","Net Zero Portal and NAPCC Dashboard, 16 Sep 2026"],["<a href=\"https://www.drishtiias.com/state-pcs-current-affairs/india-launches-net-zero-portal-and-napcc-dashboard\">drishtiias.com<\/a>","Launched in Mumbai by MoS Kirti Vardhan Singh; 32nd World Ozone Day and its theme"],["<a href=\"https://www.pib.gov.in/PressReleaseDetail.aspx?PRID=2316950&reg=3&lang=1\">pib.gov.in (PRID 2316950)<\/a>","Green Energy Corridor Phase-III approved, 30 Sep 2026 (figures as in study-govt-schemes.html, checked 23 Oct 2026)"],["<a href=\"https://ddnews.gov.in/en/cabinet-approves-msp-hike-for-all-rabi-crops-for-2027-28-marketing-season/\">ddnews.gov.in<\/a>","Rabi MSP 2027-28 approved"],["<a href=\"https://www.business-standard.com/industry/agriculture/cabinet-likely-to-raise-wheat-msp-by-25-to-2-610-per-quintal-for-2027-28-126093000611_1.html\">business-standard.com<\/a>","Wheat ₹2,610 (+₹25), 30 Sep 2026; other rabi prices"],["<a href=\"https://www.mondaq.com/overview-of-the-consumer-protection-(e-commerce)-(amendment)-rules-2026/1846008\">mondaq.com<\/a>","E-commerce Amendment Rules 2026: sponsored labels, ranking, from 1 Jan 2027"],["<a href=\"https://prsindia.org/policy/monthly-policy-review/september-2026\">prsindia.org (Monthly Policy Review, Sep 2026)<\/a>","E-commerce rules, UPI MDR, EPFO, GEC-III and BRICS listed as September 2026 items {"id":"CA10","title":"October 2026 (to 24 Oct)","hi":"अक्टूबर 2026 (24 अक्टूबर तक)","blocks":[{"k":"hot","h":"Most likely to be asked: the <b>RBI's repo rate hike to 5.50%<\/b> (7 Oct), India's <b>85 medals<\/b> and the <b>hockey and cricket golds<\/b> at the Asian Games, the <b>Nobel Prizes 2026<\/b> (Peace — Navi Pillay), the <b>29th Air chief Ashutosh Dixit<\/b>, the <b>new governors<\/b> of 12 October, <b>INS Samarthak<\/b>, the <b>103 Ramsar sites<\/b> and the <b>India–New Zealand FTA<\/b>."},{"k":"story","h":"<p>October 2026 opened with India's best days at the <b>Asian Games<\/b>: the women's hockey team ended a 44-year wait by beating <b>China<\/b> on 2 October, and on 3 October came golds in <b>men's hockey<\/b>, <b>men's cricket<\/b> (against Pakistan) and <b>golf<\/b> (Pranavi Urs). India finished <b>fourth with 85 medals<\/b> when the Games closed on 4 October.<\/p><p>On 7 October the <b>RBI<\/b> did something it had not done since February 2023 — it <b>raised the repo rate<\/b>, by 25 basis points to <b>5.50%<\/b>. The Nobel week followed, with the Peace Prize for <b>Navi Pillay<\/b>. The government renamed the NSAP the <b>PM Samajik Sahayata Yojana<\/b>, appointed six <b>governors<\/b> and named <b>Ashutosh Dixit<\/b> the next Air chief. The Navy commissioned <b>INS Samarthak<\/b> at Karwar, Chandigarh's <b>Sukhna<\/b> wetland took India to <b>103 Ramsar sites<\/b>, and the <b>India–New Zealand FTA<\/b> came into force on 20 October.<\/p>","key":"Repo 5.50% (7 Oct); Asian Games 4th, 85 medals; Nobel Peace — Navi Pillay; Air chief — Ashutosh Dixit (29th); India–NZ FTA from 20 Oct."},{"k":"table","title":"National — government decisions, schemes, laws","head":["Item","Fact","Note"],"rows":[["NSAP renamed","Became the Pradhan Mantri Samajik Sahayata Yojana on 14 Oct 2026","Cabinet approved ₹53,428 crore for 2026-27 to 2030-31; disability pension now from 40% disability (was 80%)."],["Old-age pension under the renamed NSAP","IGNOAPS is now the Pradhan Mantri Vridhavastha Pension Yojana (Oct 2026)","One of the four component schemes given new names on 14 Oct 2026."],["SME Growth Fund","Cabinet approved a ₹10,000 crore government commitment on 6 Oct 2026","The fund makes direct equity investments in small and medium enterprises; announced in the Budget 2026-27."],["Chennai Metro Phase II","PM Modi opened a stretch of about 15 km on 11 Oct 2026","With Tamil Nadu CM C. Joseph Vijay; projects worth over ₹13,000 crore launched in Tamil Nadu the same day."],["New Ramsar sites","Sukhna Wetland (Chandigarh) and Sauj Jheel (Uttar Pradesh) added in Oct 2026","India now has 103 Ramsar sites."]]},{"k":"table","title":"International — summits, agreements, elections abroad","head":["Item","Fact","Note"],"rows":[["India–New Zealand free trade agreement","Came into force on 20 Oct 2026","All Indian exports get duty-free entry into New Zealand; New Zealand is to help bring US$ 20 billion of investment into India over 15 years."],["Brazil's presidential election, first round","4 Oct 2026: Flávio Bolsonaro first (about 47%), President Lula second (about 45%)","No one crossed 50%, so the two meet in a run-off on 25 Oct 2026."],["Romania's new government","Independent diplomat Luca Niculescu sworn in as PM (decree of 20 Oct 2026)","Parliament backed his cabinet 280 to 58, ending a crisis that began in May."],["Choosing the next UN Secretary-General","The Security Council held its 6th straw poll on 16 Oct 2026","António Guterres's term ends on 31 Dec 2026; the new Secretary-General takes office in January 2027."]]},{"k":"table","title":"Economy and banking","head":["Item","Fact","Note"],"rows":[["RBI monetary policy (7 Oct 2026)","Repo rate raised by 25 basis points to 5.50%","The first hike since February 2023; stance changed from neutral to 'calibrated tightening'. SDF 5.25%, MSF and Bank Rate 5.75%."],["RBI projections for 2026-27 (7 Oct 2026)","GDP growth 7.1%; CPI inflation 5.2%","Governor Sanjay Malhotra; the next MPC meeting is on 2 <script>
"use strict";
/* Current Affairs Lab — decks built from the lesson tables (labRows), played by tools/workbook/games.js.
   Nothing here names a month: every table of every lesson is read, so a new month file is picked up by itself.
   - one deck per kind of news (Sports, Appointments …), gathering that table from every month, newest first;
   - one deck per month, with all of that month's tables;
   - a Grand Mix.
   The "Sources" tables are left out. A deck needs at least four different answers to give four options; smaller
   decks are dropped, and with no deck at all the Lab simply shows no games. */
const CA_KINDS = [
  ["National", "🇮🇳"], ["International", "🌍"], ["Economy and banking", "💹"], ["Science, space and defence", "🚀"],
  ["Sports", "🏅"], ["Awards and honours", "🏆"], ["Appointments", "🪪"], ["Places and persons in news", "📍"], ["Obituaries", "🕯️"]
];
const CA_MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const caNum = id => +String(id).replace(/\D/g, "");
const caLessons = LESSONS.slice().sort((a, b) => caNum(b.id) - caNum(a.id));          // newest month first
const caStrip = s => String(s == null ? "" : s).replace(/<[^>]+>/g, "").trim();
const caTables = l => l.blocks.filter(b => b.k === "table").map((t, n) => ({ title: caStrip(t.title), n }))
  .filter(t => !/^Sources/i.test(t.title));
const caKind = title => (CA_KINDS.find(k => title.toLowerCase().startsWith(k[0].toLowerCase())) || [title])[0];
const caOk = d => new Set(d.pairs.map(p => p[1])).size >= 4;
const caSlug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

const CA_KIND_DECKS = CA_KINDS.map(([kind, ico]) => {
  const from = caLessons.filter(l => caTables(l).some(t => caKind(t.title) === kind));
  const pairs = from.flatMap(l => caTables(l).filter(t => caKind(t.title) === kind).flatMap(t => labRows(l.id, t.n)));
  const months = from.map(l => CA_MONTHS[caNum(l.id) - 1]).filter(Boolean);
  return { id: "k-" + caSlug(kind), ico, title: kind, sub: months.length ? months.slice(0, 3).join(", ") + (months.length > 3 ? " and earlier" : "") : "",
    lesson: from.length ? from[0].id : undefined, q: "", pairs };
}).filter(caOk);
const CA_MONTH_DECKS = caLessons.map(l => ({
  id: "m-" + l.id, ico: "🗓️", title: (CA_MONTHS[caNum(l.id) - 1] || l.id) + " 2026", sub: "The whole month — every table", lesson: l.id, q: "",
  pairs: caTables(l).flatMap(t => labRows(l.id, t.n))
})).filter(caOk);
const CA_DECKS = CA_KIND_DECKS.concat(CA_MONTH_DECKS);
const CA_MIX = CA_KIND_DECKS.length ? CA_KIND_DECKS : CA_MONTH_DECKS;      // the kind decks already hold every row once
const caMatch = ["k-appointments", "k-awards-and-honours", "k-sports"].map(id => CA_DECKS.find(d => d.id === id))
  .find(d => d && d.pairs.filter((p, i, a) => a.filter(x => x[1] === p[1]).length === 1).length >= 6);
const LAB_CONF = {
  title: "News Lab", blurb: "Sixty seconds of the year's news at a time — who, where, what and when. Every right answer earns XP.",
  ranks: [[0,"Reader","📰"],[60,"Reporter","🗞️"],[200,"Correspondent","🎙️"],[450,"Editor","✒️"],[900,"Editor-in-Chief","🏛️"]],
  decks: CA_DECKS.length ? CA_DECKS.concat([{ id: "mix", ico: "🎲", title: "Grand Mix", sub: "Every month at once — the real exam feel", q: "", make: () => labMix(CA_MIX), list: () => CA_MIX.flatMap(d => d.pairs) }]) : [],
  match: caMatch ? { deck: caMatch.id, title: "Pair each " + caMatch.title.toLowerCase() + " item with its fact", sub: "Flip cards — " + caMatch.title.toLowerCase() + " from the latest months" } : undefined
};

</script>

:root[data-skin] h1,:root[data-skin] h2{letter-spacing:-.01em}

/* ===== Desktop layout (PC / tablet landscape) ===== */
@media (min-width: 1024px){
  :root{--side:236px}
  body{padding-left:var(--side);font-size:16.5px}
  .top{border-bottom:1px solid var(--rule)}
  .top-in{max-width:1320px;padding:16px 36px}
  .brand{font-size:21px}
  .brand small{font-size:13px}
  .stat{font-size:13px}
  .wrap{max-width:1320px;padding:0 36px 56px}
  .view{padding-top:28px}
  h1{font-size:34px} h2{font-size:22px} h3{font-size:17px}

  /* bottom tab bar becomes a left sidebar */
  .nav{top:0;bottom:0;left:0;right:auto;width:var(--side);height:auto;border-top:0;border-right:1px solid var(--rule);padding:84px 14px 20px;display:block;overflow:auto}
  .nav-in{display:flex;flex-direction:column;gap:4px;height:auto;max-width:none;margin:0}
  .nav-in::before{content:"Sections";display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:0 14px 8px}
  .nav button{flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-size:15px;min-height:0;height:auto;width:100%;text-align:left}
  .nav button svg{width:20px;height:20px;flex-shrink:0}
  .nav button:hover{background:var(--sunk)}
  .nav button[aria-current="page"]{background:var(--blue-bg)}
  .nav button[aria-current="page"] span{border-bottom:0!important}

  /* home: intro beside progress */
  .hero{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);column-gap:48px;align-items:end;padding-bottom:10px}
  .hero > .eyebrow,.hero > h1,.hero > p{grid-column:1}
  .hero > .meter{grid-column:2;grid-row:3;align-self:center}
  .hero > .row{grid-column:2;grid-row:2;align-self:end}

  /* lesson reader: facts, timelines, tricks sit side by side */
  .lhead{margin-bottom:0}
  .steps{max-width:640px}
  .steps + .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .steps + .stack > .plain,.steps + .stack > .row,.steps + .stack > p,.steps + .stack > .fig,.steps + .stack > h2,.steps + .stack > .tbl{grid-column:1/-1}
  .steps + .stack > .plain{max-width:86ch;font-size:17px}
  .steps + .stack > .hot,.steps + .stack > .story{grid-column:1/-1}
  .steps + .stack > .story{max-width:none;padding:20px 24px;font-size:17.5px}
  .steps + .stack > .story p{max-width:80ch}
  .steps + .stack:not(:has(> .block ~ .block)) > .block{grid-column:1/-1}
  .block,.qcard{padding:18px 20px;border-radius:14px}

  /* quizzes and question bank */
  #lq > .stack{display:grid;grid-template-columns:minmax(0,1fr);max-width:980px;gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qt{font-size:18px}
  #plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #plist .opts{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:wrap;overflow:visible}

  /* mock test: question with the answer grid alongside */
  .mbar{top:calc(env(safe-area-inset-top,0px) + 67px)}
  .view > .qcard{max-width:1000px}
  .view > .row.between{max-width:1000px}
  .view > #msub{max-width:1000px;width:100%}
  .view > .block.stack{max-width:760px}
  .pal{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .kpis{max-width:760px}

  /* revise: summary cards and sheets in columns */
  #rv > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #rv > .stack > .grph,#rv > .stack > p,#rv > .stack > .search,#rv > .stack > .callout{grid-column:1/-1}
  #dgl,#lml,#tll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #dgl > .grph,#dgl > p,#lml > p,#tll > .grph{grid-column:1/-1}
  #rv .search,#rv > #dgl ~ .search{max-width:520px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flash{min-height:300px;max-width:760px;margin:0 auto;padding:32px 36px}
  .flash .front{font-size:22px}

  /* learn: era cards across the top */
  .eras{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}
  .les{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}

</style>
<script id="shabd-deeplink">
(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();
</script>

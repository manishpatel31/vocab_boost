{"id":"CA2","title":"February 2026","hi":"फ़रवरी 2026","blocks":[{"k":"hot","h":"Most likely to be asked: the <b>Union Budget 2026-27<\/b> (1 Feb — fiscal deficit <b>4.3%<\/b>, capex <b>₹12.2 lakh crore<\/b>, new Income-tax Act from 1 April, 16th Finance Commission's <b>41%<\/b>), the <b>AI Impact Summit<\/b> at Bharat Mandapam, the <b>RBI holding the repo at 5.25%<\/b>, the new <b>CPI (2024)<\/b> and <b>GDP (2022-23)<\/b> base years, <b>India's sixth U-19 World Cup<\/b>, <b>Alcaraz<\/b>'s Australian Open, <b>Tarique Rahman<\/b> as Bangladesh's PM and the <b>18% US tariff<\/b> deal."},{"k":"story","h":"<p>February 2026 began with the <b>Union Budget<\/b> on <b>Sunday, 1 February<\/b>. The Finance Minister held income-tax slabs where they were but brought in the new <b>Income-tax Act, 2025<\/b> from 1 April, raised the tax on <b>futures and options<\/b>, set the fiscal deficit at <b>4.3%<\/b> and capital spending at <b>₹12.2 lakh crore<\/b>, and tabled the <b>16th Finance Commission<\/b>'s report, which kept the states' share at <b>41%<\/b>. The same day, <b>Alcaraz<\/b> won the Australian Open to complete the career Grand Slam.<\/p><p>On <b>6 February<\/b> the RBI left the repo rate at <b>5.25%<\/b>, India and the US announced a trade framework cutting the US tariff to <b>18%<\/b>, and India's boys won a record <b>sixth U-19 World Cup<\/b> in Harare. Elections abroad followed — <b>Japan<\/b> and <b>Portugal<\/b> on 8 February, <b>Bangladesh<\/b> on 12 February, where <b>Tarique Rahman<\/b> became PM. New Delhi hosted the <b>AI Impact Summit<\/b> and Visakhapatnam the <b>International Fleet Review<\/b>. The statistics changed too — a <b>CPI with base 2024<\/b> (12 Feb) and a <b>GDP series with base 2022-23<\/b> (27 Feb). The month ended with US–Israeli strikes on Iran that killed <b>Ayatollah Khamenei<\/b> (28 Feb).<\/p>","key":"Budget 1 Feb (FD 4.3%, capex ₹12.2 lakh crore, FC share 41%); repo 5.25% (6 Feb); U-19 WC sixth title; AI Summit New Delhi; Khamenei killed (28 Feb)."},{"k":"table","title":"National — government decisions, schemes, laws","head":["Item","Fact","Note"],"rows":[["Union Budget 2026-27","Presented by FM Nirmala Sitharaman on 1 Feb 2026 — a Sunday","Total spending about ₹53.47 lakh crore; income-tax slabs and rates left unchanged."],["Fiscal deficit target","4.3% of GDP for 2026-27 (BE)","Down from 4.4% in 2025-26 (revised estimate)."],["Central government debt","55.6% of GDP in 2026-27 (BE)","The aim is about 50% of GDP by March 2031."],["Capital expenditure","₹12.2 lakh crore for 2026-27","Up from ₹11.2 lakh crore in 2025-26."],["Income-tax Act, 2025","Replaces the Income-tax Act, 1961 from 1 Apr 2026","'Previous year' and 'assessment year' give way to a single 'tax year'."],["16th Finance Commission","Report for 2026–31 tabled on 1 Feb 2026; states' share of central taxes kept at 41%","Chaired by Arvind Panagariya; the same 41% as the 15th Commission."],["India AI Impact Summit","Bharat Mandapam, New Delhi, from 16 Feb 2026","The New Delhi Declaration on AI Impact was adopted on 19 Feb; over 38,000 GPUs already provided under the IndiaAI Mission."]]},{"k":"table","title":"International — summits, agreements, elections abroad","head":["Item","Fact","Note"],"rows":[["India–US interim trade framework","Announced on 6 Feb 2026: US tariff on Indian goods cut to 18%","The extra 25% duty was removed from 7 Feb 2026; dairy and cereals stayed protected on India's side."],["Bangladesh's general election","12 Feb 2026: the BNP won 209 of 297 declared seats","Jamaat-e-Islami second (68); the Awami League did not contest. A referendum backed the July National Charter reforms."],["Bangladesh's new Prime Minister","Tarique Rahman sworn in on 17 Feb 2026","Son of Khaleda Zia; replaced the interim government led by Muhammad Yunus."],["Japan's general election","8 Feb 2026: PM Sanae Takaichi's LDP won 316 of 465 seats","A two-thirds majority on its own — the LDP's best result since its founding in 1955."],["Portugal's presidential run-off","8 Feb 2026: António José Seguro beat André Ventura with about 66.7%","Seguro, a Socialist, succeeds Marcelo Rebelo de Sousa; Ventura leads the far-right Chega."],["US–Israeli strikes on Iran","28 Feb 2026: joint strikes across Iran; Supreme Leader Ali Khamenei killed","Iranian state media confirmed his death; Iran fired missiles at Israel and at Gulf states hosting US bases."]]},{"k":"table","title":"Economy and banking","head":["Item","Fact","Note"],"rows":[["RBI monetary policy (6 Feb 2026)","Repo rate kept at 5.25%; stance neutral","The last MPC meeting of 2025-26, after a 25 bp cut in December 2025. SDF 5.0%, MSF 5.5%."],["New CPI series (12 Feb 2026)","Base year 2024; January 2026 retail inflation 2.75%","Replaced the 2012 base; built on the Household Consumption Expenditure Survey 2023-24; 358 items."],["New GDP series (27 Feb 2026)","Base year 2022-23, replacing 2011-12","Under the new series, growth for 2025-26 is estimated at 7.6%."],["Securities Transaction Tax on F&O","Futures 0.02% → 0.05%; options premium 0.1% → 0.15% (from 1 Apr 2026)","Announced in the Budget to cool speculative derivatives trading."],["India Semiconductor Mission 2.0","Announced in the Budget 2026-27","Moves beyond chips to equipment, materials and Indian chip design (IP)."],["Electronics Components Manufacturing Scheme","Outlay raised to ₹40,000 crore in the Budget","The scheme had started in April 2025 with about ₹23,000 crore."],["SME Growth Fund","₹10,000 crore fund announced in the Budget 2026-27","The Cabinet approved it in October 2026 (see October)."],["Henley Passport Index, February 2026","India 75th, with 56 visa-free destinations","Up from 80th in January."]]},{"k":"table","title":"Science, space and defence","head":["Item","Fact","Note"],"rows":[["International Fleet Review 2026","Reviewed by President Droupadi Murmu off Visakhapatnam on 18 Feb 2026","Theme: 'United Through Oceans, Strengthening Bridges of Friendship'."],["Exercise MILAN 2026","Multinational naval exercise at Visakhapatnam, alongside the Fleet Review","The IONS Conclave of Chiefs was held at the same time."],["New Delhi Frontier AI Commitments","Voluntary framework announced on 19 Feb 2026 at the AI Impact Summit","Adopted by leading global and Indian AI companies."]]},{"k":"table","title":"Sports","head":["Item","Fact","Note"],"rows":[["Australian Open 2026 — men's singles","Carlos Alcaraz beat Novak Djokovic 2-6, 6-2, 6-3, 7-5 on 1 Feb 2026","His first Australian Open and seventh major; the youngest man to complete the career Grand Slam."],["ICC Under-19 World Cup 2026","India beat England by 100 runs in the final at Harare on 6 Feb 2026","India's sixth U-19 title — a record; the tournament was held in Zimbabwe and Namibia."],["Vaibhav Sooryavanshi","175 off 80 balls in the U-19 World Cup final","The highest score in a U-19 World Cup final; Player of the Match and of the Series."],["Women's Premier League 2026","Royal Challengers Bengaluru beat Delhi Capitals by 6 wickets, Vadodara, 5 Feb 2026","RCB's second title; chasing 204 — the highest successful chase in the WPL. Delhi lost a fourth straight final."],["Tata Steel Chess Masters 2026","Won by Nodirbek Abdusattorov (Uzbekistan) on 1 Feb 2026","Played at Wijk aan Zee (Netherlands); Javokhir Sindarov second."],["Winter Olympics 2026","Milan–Cortina (Italy), ended on 22 Feb 2026: Norway top with 18 golds","The USA second (12 golds, its best); Italy had its best Winter Games."]]},{"k":"table","title":"Awards and honours","head":["Item","Fact","Note"],"rows":[["68th Grammy Awards (1 Feb 2026)","Album of the Year: Bad Bunny, 'Debí Tirar Más Fotos'","The first Spanish-language album to win it; held in Los Angeles."],["Grammys 2026 — other main awards","Record of the Year 'Luther' (Kendrick Lamar & SZA); Song of the Year 'Wildflower' (Billie Eilish)","Best New Artist: Olivia Dean."]]},{"k":"table","title":"Appointments","head":["Item","Fact","Note"],"rows":[["Prime Minister of Bangladesh","Tarique Rahman — sworn in on 17 Feb 2026","Oath given by President Mohammed Shahabuddin; 25 ministers sworn in with him."],["President-elect of Portugal","António José Seguro — elected on 8 Feb 2026","For a five-year term."],["Prime Minister of Japan","Sanae Takaichi — won a two-thirds majority on 8 Feb 2026","PM since 21 Oct 2025; her party's best result since 1955."]]},{"k":"table","title":"Places and persons in news","head":["Item","Fact","Note"],"rows":[["Bharat Mandapam, New Delhi","Hosted the India AI Impact Summit (Feb 2026)","Gave its name to the New Delhi Declaration on AI Impact."],["Visakhapatnam","International Fleet Review and MILAN 2026","Home of the Navy's Eastern Naval Command."],["Harare, Zimbabwe","U-19 World Cup final, 6 Feb 2026","India beat England at Harare Sports Club."],["Vadodara, Gujarat","WPL 2026 final, 5 Feb 2026","At the Baroda Cricket Association Stadium."],["Milan and Cortina d'Ampezzo, Italy","Joint hosts of the 2026 Winter Olympics","Norway topped the medal table."],["Wijk aan Zee, Netherlands","Tata Steel Chess, which ended on 1 Feb 2026","Abdusattorov won the Masters."]]},{"k":"table","title":"Obituaries","head":["Item","Fact","Note"],"rows":[["Ayatollah Ali Khamenei","Supreme Leader of Iran; killed in the US–Israeli strikes of 28 Feb 2026","Iran declared national mourning; senior officials were killed with him."]]},{"k":"trick","h":"Budget numbers as a ladder — <b>4.3 → 12.2 → 41 → 55.6<\/b>: fiscal deficit <b>4.3%<\/b> of GDP, capex <b>₹12.2 lakh crore<\/b>, states' share <b>41%<\/b>, debt <b>55.6%<\/b> of GDP. And the Survey came three days earlier, on <b>29 January<\/b>."},{"k":"trick","h":"New bases, newest last: <b>CPI → 2024<\/b> (released 12 Feb), <b>GDP → 2022-23<\/b> (released 27 Feb). The old bases were <b>2012<\/b> for CPI and <b>2011-12<\/b> for GDP."},{"k":"trap","h":"<b>Which growth figure?<\/b> The Economic Survey (29 Jan) and the RBI (6 Feb) said <b>7.4%<\/b> for 2025-26 on the old base; the <b>new series<\/b> of 27 Feb put it at <b>7.6%<\/b>. Read which series the question means."},{"k":"trap","h":"The RBI <b>held<\/b> the repo at <b>5.25%<\/b> in February 2026 — the cut had come in December 2025, and the hike to 5.50% came only in October 2026. And the <b>16th<\/b> Finance Commission did <b>not<\/b> change the states' share: it stayed at <b>41%<\/b>, as under the 15th."},{"k":"trap","h":"<b>Two finals on 1 February<\/b>: <b>Alcaraz<\/b> beat Djokovic in Melbourne, and <b>Abdusattorov<\/b> won the Tata Steel Masters at Wijk aan Zee. The women's Australian Open final (Rybakina) was a day earlier, on <b>31 January<\/b>."},{"k":"table","title":"Sources (checked 24 Oct 2026)","head":["Source","What it confirmed"],"rows":[["<a href=\"https://prsindia.org/files/budget/budget_parliament/2026/Union_Budget_Analysis-2026-27.pdf\">prsindia.org (Union Budget Analysis 2026-27)<\/a>","Fiscal deficit 4.3% (BE) v 4.4% (RE); total spending ₹53.47 lakh crore; debt 55.6% of GDP, about 50% by March 2031; tax slabs unchanged"],["<a href=\"https://scroll.in/latest/1090413/scroll_in\">scroll.in<\/a>","Capex ₹12.2 lakh crore, up from ₹11.2 lakh crore; no tax-rate changes"],["study-economics.html, lesson L20 (this repo)","Budget presented 1 Feb 2026, a Sunday; FD 4.3%; debt 55.6%; 16th FC 41%; ISM 2.0; SME Growth Fund"],["<a href=\"https://www.outlookbusiness.com/economy-and-policy/new-i-t-law-higher-securities-transaction-tax-on-fo-trade-to-kick-in-from-april-1\">outlookbusiness.com<\/a>","New Income-tax Act and higher STT on F&O from 1 Apr 2026"],["<a href=\"https://www.outlookmoney.com/invest/stt-hike-from-april-1-2026-budget-what-it-means-for-futures-and-options-traders\">outlookmoney.com<\/a>","STT rates: futures 0.02%→0.05%, options 0.1%→0.15%"],["<a href=\"https://www.onmanorama.com/news/business/2026/03/31/new-income-tax-law-april-1.html\">onmanorama.com<\/a>","Income-tax Act, 2025 replaces the 1961 Act; 'tax year'"],["<a href=\"https://prsindia.org/policy/report-summaries/report-of-the-16th-finance-commission-for-2026-31\">prsindia.org (16th FC summary)<\/a>","41% vertical share, unchanged from the 15th FC; period 2026–31"],["<a href=\"https://assamtribune.com/buzz/union-budget-2026-27-live-492\">assamtribune.com (Budget live blog)<\/a>","Government accepted the 41% share; debt 55.6% (BE) from 56.1% (RE)"],["<a href=\"https://www.drishtiias.com/daily-updates/daily-news-analysis/16th-finance-commission-report/print_manually\">drishtiias.com<\/a>","16th FC report, chaired by Arvind Panagariya, tabled with the Budget"],["<a href=\"https://www.digitalindia.gov.in/press_release/budget-2026-27-announces-the-launch-of-india-semiconductor-mission-ism-2-0/\">digitalindia.gov.in<\/a>","Budget 2026-27 launches ISM 2.0"],["<a href=\"https://www.thenewsminute.com/amp/story/all-states/budget-2026-27-announces-india-semiconductor-mission-20-hikes-component-manufacturing-outlay-to-rs-40000-crore\">thenewsminute.com<\/a>","ECMS outlay raised to ₹40,000 crore; ISM 2.0 scope; ₹10,000 crore SME fund"],["<a href=\"https://www.digitalindia.gov.in/press_release/india-ai-impact-summit-2026-concludes-at-bharat-mandapam-with-strong-global-endorsement-of-indias-responsible-ai-vision/\">digitalindia.gov.in<\/a>","AI Impact Summit at Bharat Mandapam; 38,000+ GPUs under IndiaAI Mission"],["<a href=\"https://visionias.in/blog/current-affairs/india-ai-impact-summit-2026-and-new-delhi-declaration-indias-leap-into-the-global-ai-order\">visionias.in<\/a>","New Delhi Declaration on AI Impact adopted 19 Feb; Frontier AI Commitments"],["<a href=\"https://www.etvbharat.com/en/bharat/us-and-india-joint-statement-on-india-us-interim-trade-agreement-enn26020700547\">etvbharat.com<\/a>","India–US framework for an interim trade agreement; tariff 18%"],["<a href=\"https://kpmg.com/us/en/taxnewsflash/news/2026/02/united-states-removes-tariffs-imports-india.html\">kpmg.com<\/a>","Extra 25% duty on Indian goods removed from 7 Feb 2026"],["<a href=\"https://www.newsonair.gov.in/india-us-trade-deal-cuts-tari {"id":"CA4","title":"April 2026","hi":"अप्रैल 2026","blocks":[{"k":"hot","h":"Most likely to be asked: <b>Census 2027 Phase I<\/b> and the first <b>self-enumeration<\/b> (from 1 April), the <b>Income-tax Act, 2025<\/b> in force from 1 April, the <b>assembly poll dates<\/b> (9, 23 and 29 April), the <b>RBI's hold at 5.25%<\/b>, <b>Ashok Kumar Lahiri<\/b> at NITI Aayog, <b>Artemis II<\/b>, India's <b>16 medals<\/b> at the Asian Boxing Championships, and the death of <b>Asha Bhosle<\/b>."},{"k":"story","h":"<p>April 2026 began with two big starts on the same day. On <b>1 April<\/b> the first phase of <b>Census 2027<\/b> opened — houselisting, with citizens allowed for the first time to <b>count themselves online<\/b> — and the new <b>Income-tax Act, 2025<\/b> replaced the law of 1961. The same evening (US time) NASA launched <b>Artemis II<\/b>, which carried four astronauts round the Moon and brought them home on 10 April.<\/p><p>At home it was an election month: <b>Assam, Kerala and Puducherry<\/b> voted on <b>9 April<\/b>, <b>Tamil Nadu<\/b> on <b>23 April<\/b>, and <b>West Bengal<\/b> on 23 and 29 April, with counting fixed for 4 May. The <b>RBI<\/b> held the repo rate at <b>5.25%<\/b> on 8 April, the Cabinet raised <b>DA to 60%<\/b>, and NITI Aayog got a new Vice-Chairperson, <b>Ashok Kumar Lahiri<\/b>. Abroad, <b>Péter Magyar<\/b> ended Viktor Orbán's 16 years in Hungary, and a Pakistan-brokered <b>US–Iran ceasefire<\/b> paused the West Asia war. India's boxers won <b>16 medals<\/b> in Ulaanbaatar, and the country mourned <b>Asha Bhosle<\/b>.<\/p>","key":"1 April: Census Phase I + Income-tax Act 2025 + Artemis II launch; polls 9/23/29 April; repo 5.25%; NITI — Lahiri; Asha Bhosle (12 Apr)."},{"k":"table","title":"National — government decisions, schemes, laws","head":["Item","Fact","Note"],"rows":[["Census 2027 — Phase I","Houselisting and Housing Census began on 1 April 2026; runs to 30 Sep 2026","Each state or UT picks its own 30-day window. Phase II, the population count, follows in February 2027."],["Self-enumeration","Offered for the first time in an Indian census (from April 2026)","Residents fill the form on a web portal in the 15 days before house-to-house work starts, and get a Self-Enumeration ID."],["Income-tax Act, 2025","Came into force on 1 April 2026, replacing the Income-tax Act, 1961","Passed in August 2025 (assent 21 Aug 2025); it introduces the 'tax year' — the first is 2026-27. Meant to simplify, not to change tax rates."],["Dearness allowance","Cabinet, 18 Apr 2026: DA and DR raised by 2 points, from 58% to 60%","From 1 Jan 2026; about 50.46 lakh employees and 68.27 lakh pensioners benefit; cost about ₹6,791 crore a year."],["Two hydro projects in Arunachal Pradesh","Approved by the CCEA in April 2026: ₹40,175 crore for 2,920 MW","Kamala HEP (1,720 MW, NHPC joint venture) and Kalai-II HEP (1,200 MW, on the Lohit, THDC joint venture). The state gets 12% free power."],["Assembly polls — first round","9 Apr 2026: Assam (126 seats), Kerala (140) and Puducherry (30) voted","Each in a single phase. Schedule announced by the Election Commission on 15 Mar 2026."],["Assembly polls — Tamil Nadu and West Bengal","Tamil Nadu (234 seats) voted on 23 Apr 2026; West Bengal on 23 Apr (152 seats) and 29 Apr (142)","824 seats and about 17.4 crore voters in all; counting for every state was set for 4 May 2026."]]},{"k":"table","title":"International — summits, agreements, elections abroad","head":["Item","Fact","Note"],"rows":[["Hungary's parliamentary election","12 Apr 2026: Péter Magyar's Tisza party won about 53% and 138 of 199 seats","A two-thirds majority (preliminary count). Viktor Orbán, in power for 16 years, conceded; his Fidesz alliance got 55 seats."],["US–Iran ceasefire","A two-week ceasefire announced on 7 Apr 2026, mediated by Pakistan","Tied to Iran reopening the Strait of Hormuz to safe passage; Pakistan's PM Shehbaz Sharif and army chief Asim Munir helped broker it."]]},{"k":"table","title":"Economy and banking","head":["Item","Fact","Note"],"rows":[["RBI monetary policy (8 Apr 2026)","Repo rate kept at 5.25%; stance neutral; MPC vote unanimous","The first policy of 2026-27. SDF 5.00%, MSF and Bank Rate 5.50%. Governor Sanjay Malhotra."],["RBI projections for 2026-27 (8 Apr 2026)","GDP growth 6.9%; CPI inflation 4.6%","Growth for 2025-26 put at 7.6% (new GDP series); the West Asia war was flagged as a risk to prices."],["IMF World Economic Outlook (14 Apr 2026)","India's growth for 2026-27 raised to 6.5% (from 6.4%)","World growth 3.1% in 2026. The IMF credited the cut in extra US tariffs on Indian goods (from 50% to 10%)."],["World Press Freedom Index 2026 (RSF)","India 157th of 180 — released 30 Apr 2026","Down from 151st in 2025; 'very serious' category. Norway first for the 10th year running; Eritrea last."]]},{"k":"table","title":"Science, space and defence","head":["Item","Fact","Note"],"rows":[["Artemis II — launch","NASA's SLS lifted off from Kennedy Space Center on 1 Apr 2026","Crew: Reid Wiseman (commander), Victor Glover (pilot), Christina Koch and Canada's Jeremy Hansen. First crew to the Moon since Apollo 17 (1972)."],["Artemis II — return","Orion 'Integrity' splashed down in the Pacific off San Diego on 10 Apr 2026","A lunar flyby, not a landing; reached 406,771 km from Earth — the farthest humans have ever travelled, beating Apollo 13."],["NASM-SR salvo launch","29 Apr 2026: two Naval Anti-Ship Missiles (Short Range) fired in quick succession from a Sea King helicopter","The first salvo launch, off Odisha (ITR Chandipur); developed by DRDO's Research Centre Imarat, Hyderabad, to replace the Sea Eagle."],["DUSTLIK 2026","7th India–Uzbekistan army exercise, Gurumsaray (Namangan, Uzbekistan), ended 25 Apr 2026","60 personnel from each side; drills in semi-mountainous terrain. The 2025 edition was held in Pune."]]},{"k":"table","title":"Sports","head":["Item","Fact","Note"],"rows":[["Asian Boxing Championships 2026","Ulaanbaatar (Mongolia), ended 10 Apr 20 {"id":"CA5","title":"May 2026","hi":"मई 2026","blocks":[{"k":"hot","h":"Most likely to be asked: the <b>4 May results<\/b> and the <b>new Chief Ministers<\/b> (Suvendu Adhikari, Vijay, V. D. Satheesan, Himanta Biswa Sarma, N. Rangasamy), the <b>new CDS and Navy chief<\/b> (31 May), the <b>India–Nordic Summit<\/b> in Oslo, the <b>Supreme Court strength of 37<\/b>, the <b>RBI's record surplus<\/b>, the <b>Agni MIRV test<\/b>, <b>RCB's<\/b> second IPL title, and the <b>Padma investiture<\/b> of 25 May."},{"k":"story","h":"<p>May 2026 was the month of results. Counting on <b>4 May<\/b> changed three of the five governments: the <b>BJP<\/b> won <b>West Bengal<\/b> for the first time and <b>Suvendu Adhikari<\/b> took oath on <b>9 May<\/b>; actor <b>Vijay<\/b>'s new party <b>TVK<\/b> came first in <b>Tamil Nadu<\/b> and he became CM on <b>10 May<\/b>; and the <b>UDF<\/b> returned in <b>Kerala<\/b> under <b>V. D. Satheesan<\/b> (18 May). <b>Himanta Biswa Sarma<\/b> (Assam, 12 May) and <b>N. Rangasamy<\/b> (Puducherry, 13 May) stayed on.<\/p><p>The President raised the <b>Supreme Court<\/b>'s strength to <b>37 judges plus the CJI<\/b> by ordinance, and <b>Assam<\/b> became the <b>third state<\/b> to pass a UCC Bill. PM Modi toured <b>five countries<\/b> and attended the <b>3rd India–Nordic Summit<\/b> in <b>Oslo<\/b>, while Delhi hosted the <b>BRICS foreign ministers<\/b>. The RBI sent a record <b>₹2.87 lakh crore<\/b> to the government, DRDO tested an <b>Agni with MIRV<\/b>, and on <b>31 May<\/b> both a new <b>CDS<\/b> and a new <b>Navy chief<\/b> took over — the same evening <b>RCB<\/b> won the IPL again.<\/p>","key":"4 May results: BJP Bengal, TVK Tamil Nadu, UDF Kerala; SC 33→37 (16 May); Oslo summit (19 May); RBI ₹2.87 lakh cr; 31 May — CDS Raja Subramani, CNS Swaminathan, RCB."},{"k":"table","title":"National — government decisions, schemes, laws","head":["Item","Fact","Note"],"rows":[["Assembly results (4 May 2026)","Counting in Assam, Kerala, Tamil Nadu, West Bengal and Puducherry","NDA kept Assam and Puducherry and won West Bengal; the Congress-led UDF won Kerala; Vijay's TVK won most seats in Tamil Nadu."],["West Bengal","BJP won 207 seats (208 after the Falta re-poll) of 294; Trinamool 80","Suvendu Adhikari sworn in on 9 May 2026 at the Brigade Parade Ground, Kolkata — the state's first BJP Chief Minister."],["Tamil Nadu","TVK the largest party with 108 of 234 seats, short of the 118 needed","C. Joseph Vijay sworn in as CM on 10 May 2026 in Chennai, backed by the Congress, CPI, CPI(M), VCK and IUML. The DMK lost power."],["Kerala","Congress-led UDF back in power after 10 years, defeating the LDF","V. D. Satheesan sworn in as CM on 18 May 2026 at Central Stadium, Thiruvananthapuram."],["Assam","NDA won 102 of 126 seats (BJP 82, AGP 10, BPF 10)","Himanta Biswa Sarma sworn in for a second straight term on 12 May 2026 in Guwahati — the first non-Congress CM of Assam to win consecutive terms."],["Puducherry","AINRC-led NDA won 18 of the 30 elected seats","N. Rangasamy sworn in on 13 May 2026 for a record fifth term as CM; oath given by Lt Governor K. Kailashnathan."],["Falta re-poll (West Bengal)","Held on 21 May 2026; BJP's Debangshu Panda won by about 1.09 lakh votes","The 29 April poll there was cancelled over EVM tampering complaints; counting on 24 May."],["Supreme Court judges ordinance","Promulgated 16 May 2026: judges raised from 33 to 37, besides the CJI (38 in all)","Amends the Supreme Court (Number of Judges) Act, 1956 under Article 123. The last rise was in 2019 (30 to 33)."],["Assam UCC Bill","Passed by the Assam Assembly on 27 May 2026","Third state after Uttarakhand and Gujarat, and the first in the North-East. Scheduled Tribes are kept out of it."],["Kharif MSP 2026-27","Cabinet, 13 May 2026: MSP raised for 14 kharif crops; common paddy ₹2,441 a quintal (up ₹72)","Biggest rise for sunflower seed (₹622). MSP at least 50% above the cost of production for every crop."]]},{"k":"table","title":"International — summits, agreements, elections abroad","head":["Item","Fact","Note"],"rows":[["PM's five-nation tour","15–20 May 2026: UAE, Netherlands, Sweden, Norway and Italy","Ties with Sweden were raised to a Strategic Partnership."],["3rd India–Nordic Summit","Oslo, 19 May 2026 — ties raised to a Green Technology and Innovation Strategic Partnership","With Denmark, Finland, Iceland, Norway and Sweden. Earlier summits: Stockholm (2018) and Copenhagen (2022); Finland hosts the next."],["India–Norway","Green Strategic Partnership launched during the PM's Oslo visit (May 2026)","The first visit to Norway by an Indian Prime Minister since 1983; 12 agreements and initiatives."],["BRICS Foreign Ministers' Meeting","New Delhi, 14–15 May 2026, chaired by S. Jaishankar","India holds the BRICS chair for 2026 (from 1 Jan, after Brazil). Theme: Building for Resilience, Innovation, Cooperation and Sustainability."]]},{"k":"table","title":"Economy and banking","head":["Item","Fact","Note"],"rows":[["RBI surplus to the Centre","Record ₹2,86,588 crore (about ₹2.87 lakh crore) for 2025-26","Approved at the RBI board's 623rd meeting on 22 May 2026; the previous record was ₹2.69 lakh crore. Contingent Risk Buffer kept at 6.5% of the balance sheet."]]},{"k":"table","title":"Science, space and defence","head":["Item","Fact","Note"],"rows":[["Advanced Agni with MIRV","Flight-tested on 8 May 2026 from Dr APJ Abdul Kalam Island, Odisha","Carried several payloads to separate targets in the Indian Ocean Region. The first Agni-5 MIRV test, 'Mission Divyastra', was in March 2024."],["Exercise PRAGATI 2026","First edition of India's multilateral army exercise — Umroi, Meghalaya (May 2026)","India and 12 friendly nations, over 400 troops; counter-terrorism in jungle and semi-mountainous terrain. Ended with a 72-hour validation drill."]]},{"k":"table","title":"Sports","head":["Item","Fact","Note"],"rows":[["IPL 2026","Royal Challengers Bengaluru beat Gujarat Titans by 5 wickets — 31 May 2026","Final at the Narendra Modi Stadium, Ahmedabad. RCB's second title in a row; Virat Kohli Player of the Match."],["Thomas Cup 2026","China beat France 3-1 in the final at Horsens, Denmark (3 May 2026)","China's 12th Thomas Cup. India lost the semi-final 0-3 to France and took bronze."],["Uber Cup 2026","South Korea beat China 3-1 in the final at Horsens","The women's team title, held with the Thomas Cup."],["ISSF World Cup, Munich","Suruchi Inder Singh won the women's 10m air pistol gold on 29 May 2026","Esha Singh took silver in the same final."]]},{"k":"table","title":"Awards and honours","head":["Item","Fact","Note"],"rows":[["Padma Awards — first investiture","25 May 2026, Rashtrapati Bhavan: 66 awards (2 Padma Vibhushan, 6 Padma Bhushan, 58 Padma Shri)","131 Padma Awards were announced for 2026; the rest were given at a second ceremony."],["Padma Vibhushan (25 May)","Actor Dharmendra (posthumous) and violinist N. Rajam","Hema Malini received Dharmendra's award; he had died in November 2025."],["International Booker Prize 2026","Taiwan Travelogue by Yáng Shuāng-zǐ, translated by Lin King — 19 May 2026","Announced at Tate Modern, London; the first winner translated from Mandarin Chinese. The £50,000 is shared by author and translator."],["Royal Order of the Polar Star","Sweden's honour (Commander Grand Cross) for PM Modi — 17 May 2026, Gothenburg","Presented by Crown Princess Victoria; reported as his 31st international honour."]]},{"k":"table","title":"Appointments","head":["Item","Fact","Note"],"rows":[["Chief of Defence Staff","General N. S. Raja Subramani — took charge on 31 May 2026","India's third CDS, after General Anil Chauhan. He was Military Adviser in the National Security Council Secretariat and a former Vice Chief of Army Staff."],["Chief of the Naval Staff","Admiral Krishna Swaminathan — 27th chief, from 31 May 2026","After Admiral Dinesh K. Tripathi. He was Flag Officer Commanding-in-Chief, Western Naval Command."],["DRDO Chairman (additional charge)","Defence Secretary Rajesh Kumar Singh, after Samir V. Kamat","Appointments Committee of the Cabinet order of 29 May 2026; Kamat had led DRDO since August 2022."],["Vice-Chairperson, NITI Aayog","Ashok Kumar Lahiri took charge on 8 May 2026","Named in the NITI Aayog notification of 24 April 2026, after Suman Bery."]]},{"k":"table","title":"Places and persons in news","head":["Item","Fact","Note"],"rows":[["Brigade Parade Ground, Kolkata","Where Suvendu Adhikari took oath as West Bengal CM (9 May 2026)","The date was Pochishe Boishakh, Rabindranath Tagore's birth anniversary."],["Bhabanipur, Kolkata","Mamata Banerjee lost here to Suvendu Adhikari by about 15,000 votes (4 May 2026)","Adhikari also won Nandigram."],["Umroi, Meghalaya","Venue of the first Exercise PRAGATI (May 2026)","Umroi Military Station, near Shillong."],["Horsens, Denmark","Hosted the Thomas and Uber Cup Finals (April–May 2026)","China won the Thomas Cup, South Korea the Uber Cup."],["Oslo, Norway","Hosted the 3rd India–Nordic Summit (19 May 2026)","Norway's PM Jonas Gahr Støre was the host."],["Dr APJ Abdul Kalam Island, Odisha","Launch site of the Advanced Agni MIRV test (8 May 2026)","Formerly Wheeler Island, off the Odisha coast."],["C. Joseph Vijay","Actor and TVK founder — Tamil Nadu CM from 10 May 2026","His party's first election."]]},{"k":"table","title":"Obituaries","head":["Item","Fact","Note"],"rows":[["Bashir Badr","Urdu poet; died in Bhopal on 28 May 2026, aged 91","Padma Shri and Sahitya Akademi Award (for the ghazal collection 'Aas'), both in 1999."],["Suman Kalyanpur","Playback singer; died in Mumbai on 31 May 2026, aged 89","Padma Bhushan; sang many duets with Mohammed Rafi. Last rites with state honours on 1 June."]]},{"k":"trick","h":"Oath dates in order — <b>“9, 10, 12, 13, 18”<\/b>: <b>9<\/b> Bengal (Suvendu), <b>10<\/b> Tamil Nadu (Vijay), <b>12<\/b> Assam (Himanta), <b>13<\/b> Puducherry (Rangasamy), <b>18<\/b> Kerala (Satheesan). Kerala took longest because the Congress needed ten days to pick its leader."},{"k":"trick","h":"<b>31 May 2026<\/b> is a triple date: <b>Raja Subramani<\/b> becomes the <b>3rd CDS<\/b>, <b>Krishna Swaminathan<\/b> the <b>27th Navy chief<\/b>, and <b>RCB<\/b> win the IPL final in Ahmedabad."},{"k":"trap","h":"<b>Supreme Court strength<\/b>: <b>37<\/b> is the number of judges <b>besides<\/b> the Chief Justice — <b>38<\/b> in all. Before the ordinance it was 33 + CJI = 34."},{"k":"trap","h":"<b>UCC order<\/b>: <b>Uttarakhand<\/b> first, <b>Gujarat<\/b> second, <b>Assam<\/b> third (27 May 2026) — and Assam's law leaves out the Scheduled Tribes."},{"k":"trap","h":"<b>Two Nordic partnerships<\/b>: the <b>whole Nordic group<\/b> got a <b>Green Technology and Innovation Strategic Partnership<\/b> at the Oslo summit, while <b>Norway alone<\/b> got a <b>Green Strategic Partnership<\/b>. And the Polar Star was given in <b>Gothenburg<\/b>, not Stockholm."},{"k":"table","title":"Sources (checked 24 Oct 2026)","head":["Source","What it confirmed"],"rows":[["<a href=\"https://www.thestatesman.com/india/assembly-election-results-2026-counting-begins-in-westbengal-assam-tamil-nadu-kerala-puducherry-1503589335.html\">thestatesman.com<\/a>","Counting in five assemblies on 4 May 2026"],["<a href=\"https://www.aajtak.in/elections/assembly-chunav/story/assembly-election-results-2026-west-bengal-assam-tamil-nadu-kerala-puducherry-ntc-bktw-dskc-2542374-2026-05-04\">aajtak.in<\/a>","Who won each state (4 May 2026)"],["<a href=\"https://newsonair.gov.in/suvendu-adhikari-takes-oath-as-first-bjp-cm-of-west-bengal/\">newsonair.gov.in<\/a>","Suvendu Adhikari takes oath as first BJP CM of West Bengal (9 May 2026)"],["<a href=\"https://www.theweek.in/news/india/2026/05/09/suvendu-adhikari-set-to-take-oath-as-cm-heralding-new-bjp-era-in-west-bengal.amp.html\">theweek.in<\/a>","Brigade Parade Ground; Pochishe Boishakh; ministers sworn in"],["<a href=\"https://thefinancialexpress.com.bd/world/asia/suvendu-sworn-in-as-west-bengal-cm\">thefinancialexpress.com.bd<\ {"id":"CA6","title":"June 2026","hi":"जून 2026","blocks":[{"k":"hot","h":"Most likely to be asked: <b>General Dhiraj Seth<\/b>, the 31st Army chief (30 June), <b>Mahesh Dixit<\/b> at the IB, the <b>RBI's hold at 5.25%<\/b> with growth cut to <b>6.6%<\/b>, the <b>G7 at Evian<\/b> and the PM's first visit to <b>Slovakia<\/b>, <b>Khalilur Rahman<\/b> as UNGA President-elect, Yoga Day's theme <b>'Yoga for Healthy Ageing'<\/b>, <b>Praggnanandhaa<\/b>'s Norway Chess title, the <b>French Open<\/b> champions, and <b>Jaspal Rana<\/b>'s death."},{"k":"story","h":"<p>June 2026 opened with the RBI. On <b>5 June<\/b> it kept the repo rate at <b>5.25%<\/b> but cut its growth forecast to <b>6.6%<\/b> and raised its inflation forecast to <b>5.1%<\/b>, worried by the West Asia war and dear oil; the <b>World Bank<\/b> also said <b>6.6%<\/b>. Abroad, PM Modi went to <b>Slovakia<\/b> (the first Indian PM to do so) and received its highest honour, then joined the <b>52nd G7 Summit<\/b> at <b>Evian<\/b> in France. Bangladesh's <b>Khalilur Rahman<\/b> was elected to preside over the next UN General Assembly, and the US and Iran signed the <b>Islamabad MoU<\/b>.<\/p><p>On <b>21 June<\/b> Kolkata had a double day: the PM led <b>Yoga Day<\/b> on Red Road and commissioned <b>three warships<\/b> at the port. In sport, <b>Praggnanandhaa<\/b> became the first Indian to win <b>Norway Chess<\/b>, India's women won the <b>SAFF<\/b> title, and <b>Zverev<\/b> and <b>Andreeva<\/b> won their first Slams in Paris. The month closed with <b>General Dhiraj Seth<\/b> taking over the Army and <b>MGNREGA<\/b> giving way to the new VB-G RAM G law.<\/p>","key":"5 Jun RBI 5.25% (GDP 6.6, CPI 5.1); G7 Evian 15–17 Jun; Slovakia; 21 Jun Kolkata — Yoga + 3 ships; Pragg Norway Chess; 30 Jun — Gen Dhiraj Seth, MGNREGA ends."},{"k":"table","title":"National — government decisions, schemes, laws","head":["Item","Fact","Note"],"rows":[["12th International Day of Yoga","21 Jun 2026 — main event led by PM Modi on Red Road, Kolkata","Theme: 'Yoga for Healthy Ageing'. Indian missions abroad held events at about 2,500 places."],["MGNREGA ends","Ran until 30 Jun 2026; replaced by the VB-G RAM G Act from 1 Jul 2026","Viksit Bharat – Guarantee for Rozgar and Ajeevika Mission (Gramin): 125 days of wage work a year instead of 100. Works running on 30 June carry over."],["QS World University Rankings 2027","Released 18 Jun 2026: IIT Delhi 118th, India's best for the second year","IIT Bombay 134th; 52 Indian institutions ranked. MIT first for the 15th year."]]},{"k":"table","title":"International — summits, agreements, elections abroad","head":["Item","Fact","Note"],"rows":[["52nd G7 Summit","Evian-les-Bains, France, 15–17 Jun 2026","PM Modi attended as an invited leader and met US President Trump on the sidelines."],["PM Modi in Slovakia","14–16 Jun 2026, Bratislava — the first visit by an Indian PM since Slovakia's independence in 1993","Talks with PM Robert Fico; agreements signed, including on defence."],["President of the 81st UN General Assembly","Khalilur Rahman, Bangladesh's Foreign Minister — elected 2 Jun 2026","Beat Cyprus's Andreas Kakouris 99 votes to 91; term from 8 Sep 2026."],["US–Iran Islamabad MoU","Signed electronically by both sides on 17 Jun 2026","Pakistan mediated. It extended the ceasefire, aimed to reopen the Strait of Hormuz and set a 60-day window for a final deal."],["Global Peace Index 2026","India 127th of 163 (released June 2026)","By the Institute for Economics and Peace. Iceland most peaceful for the 18th year running."]]},{"k":"table","title":"Economy and banking","head":["Item","Fact","Note"],"rows":[["RBI monetary policy (5 Jun 2026)","Repo rate kept at 5.25%; stance neutral; MPC vote unanimous","SDF 5.00%, MSF and Bank Rate 5.50%. Governor Sanjay Malhotra."],["RBI projections for 2026-27 (5 Jun 2026)","GDP growth cut to 6.6% (from 6.9%); CPI inflation raised to 5.1% (from 4.6%)","The West Asia conflict, costly crude and a weak rupee were the reasons given."],["World Bank Global Economic Prospects (June 2026)","India to grow 6.6% in 2026-27; world growth 2.5% in 2026","India stays the fastest-growing major economy; 7.2% forecast for 2027-28."],["New IIP series","Index of Industrial Production with base year 2022-23 released by MoSPI on 1 Jun 2026","Covers 463 item groups, up from 407."]]},{"k":"table","title":"Science, space and defence","head":["Item","Fact","Note"],"rows":[["SIPRI Yearbook 2026","India had about 190 nuclear warheads in January 2026 — 12 of them deployed","The first time SIPRI counted Indian warheads as deployed. Pakistan about 170, China about 620."],["Three warships commissioned","21 Jun 2026, Kolkata: INS Dunagiri, INS Sanshodhak and INS Agray","Commissioned by PM Modi at Syama Prasad Mookerjee Port; all built by GRSE. Dunagiri is a stealth frigate, Sanshodhak a large survey vessel, Agray an anti-submarine shallow-water craft."]]},{"k":"table","title":"Sports","head":["Item","Fact","Note"],"rows":[["French Open 2026 — men","Alexander Zverev beat Flavio Cobolli in the final (7 Jun 2026)","Zverev's first Grand Slam title, after losing three earlier finals."],["French Open 2026 — women","Mirra Andreeva beat qualifier Maja Chwalinska 6-3, 6-2 (6 Jun 2026)","Andreeva's first Grand Slam title."],["Norway Chess 2026","R. Praggnanandhaa won — the first Indian to win Norway Chess","Held in Oslo, 25 May – 5 Jun 2026, after 13 years in Stavanger. He beat Magnus Carlsen twice; Wesley So was second. Women: Bibisara Assaubayeva."],["SAFF Women's Championship 2026","India beat Bangladesh 3-1 in the final, 6 Jun 2026, Margao (Goa)","India's sixth title and first since 2019."],["FIFA World Cup 2026 opener","Mexico beat South Africa 2-0 on 11 Jun 2026 at Estadio Azteca, Mexico City","The tournament is co-hosted by Mexico, the USA and Canada."]]},{"k":"table","title":"Awards and honours","head":["Item","Fact","Note"],"rows":[["Padma Awards — second investiture","23 Jun 2026, Rashtrapati Bhavan: 65 awards (2 Padma Vibhushan, 7 Padma Bhushan, 56 Padma Shri)","Completed the 2026 list after the first ceremony of 25 May (66 awards)."],["Padma Vibhushan (23 Jun)","K. T. Thomas (public affairs) and P. Narayanan (literature and education)","The first ceremony's two Padma Vibhushans went to Dharmendra (posthumous) and N. Rajam."],["Order of the White Double Cross, First Class","Slovakia's highest state honour, for PM Modi — 15 Jun 2026","Conferred by President Peter Pellegrini in Bratislava; reported as his 33rd international honour."]]},{"k":"table","title":"Appointments","head":["Item","Fact","Note"],"rows":[["Chief of the Army Staff","General Dhiraj Seth — 31st chief, took charge on 30 Jun 2026","After General Upendra Dwivedi. Earlier Vice Chief; Armoured Corps officer; tenure to 31 Aug 2028."],["Director, Intelligence Bureau","Mahesh Dixit — approved by the ACC on 25 Jun 2026","Succeeds Tapan Kumar Deka from 30 June. 1993-batch IPS (Andhra Pradesh cadre) and a medical doctor; two-year term."]]},{"k":"table","title":"Places and persons in news","head":["Item","Fact","Note"],"rows":[["Evian-les-Bains, France","Host of the 52nd G7 Summit (15–17 Jun 2026)","A spa town on Lake Geneva."],["Bratislava, Slovakia","PM Modi's first visit there (14–16 Jun 2026)","Slovakia became independent on 1 Jan 1993."],["Red Road, Kolkata","Main venue of International Day of Yoga 2026","PM Modi led the Common Yoga Protocol there on 21 June."],["Syama Prasad Mookerjee Port, Kolkata","Where three warships were commissioned on 21 Jun 2026","Home of the builder, Garden Reach Shipbuilders & Engineers (GRSE)."],["Margao, Goa","Venue of the SAFF Women's Championship final (6 Jun 2026)","Played at the Pandit Jawaharlal Nehru Stadium."],["Oslo, Norway","New home of Norway Chess (2026)","The event had been held in Stavanger for 13 years."],["Khalilur Rahman","Bangladesh's Foreign Minister — President-elect of the 81st UN General Assembly","Elected 2 Jun 2026 for the Asia-Pacific Group's turn."]]},{"k":"table","titl {"id":"CA7","title":"July 2026","hi":"जुलाई 2026","blocks":[{"k":"hot","h":"Most likely to be asked: <b>Spain<\/b>'s World Cup win (19 Jul), the <b>Wimbledon<\/b> champions <b>Sinner<\/b> and <b>Noskova<\/b>, India's <b>first hydrogen train<\/b> at Jind, <b>Vikram-1<\/b> — the first private Indian rocket in orbit, <b>Sarnath<\/b> as India's 45th World Heritage Site, the <b>Kusha<\/b> missile test, and the Cabinet's <b>Semicon 2.0<\/b> and <b>PM-KISAN<\/b> decisions."},{"k":"story","h":"<p>July 2026 began with PM Modi on a three-nation tour: a state visit to <b>Indonesia<\/b>, where President Prabowo gave him the country's highest honour, the <b>3rd India–Australia Annual Summit<\/b> in <b>Melbourne<\/b>, and <b>Auckland<\/b>, where India and New Zealand became Strategic Partners. NATO met in <b>Ankara<\/b>. At home, the Cabinet approved <b>Semicon 2.0<\/b> and a ₹62,500 crore <b>mobile phone scheme<\/b> on 15 July, PM Modi flagged off the <b>first hydrogen train<\/b> at <b>Jind<\/b> on 17 July, and Skyroot's <b>Vikram-1<\/b> reached orbit on 18 July. The <b>Monsoon Session<\/b> opened on 20 July, the day <b>Andy Burnham<\/b> became Britain's Prime Minister. After the NEET-UG paper leak, <b>Dharmendra Pradhan<\/b> resigned as Education Minister on 25 July, and Parliament tightened the anti-paper-leak law. The month ended with a big Cabinet day on 31 July: <b>PM-KISAN<\/b>, <b>Samudra Manthan<\/b>, <b>Khelo India<\/b> and <b>PM Surya Sarovar<\/b>.<\/p><p>In sport, <b>Australia<\/b> won the Women's T20 World Cup at Lord's, <b>Sinner<\/b> and <b>Noskova<\/b> won Wimbledon, and <b>Spain<\/b> beat Argentina in the World Cup final in New Jersey. The <b>Commonwealth Games<\/b> opened in <b>Glasgow<\/b> on 23 July: <b>Mirabai Chanu<\/b> carried India's flag and won India's first gold, and <b>Neeraj Chopra<\/b> took silver behind Sri Lanka's Pathirage. UNESCO added <b>Sarnath<\/b> to the World Heritage List on 25 July, and DRDO first flew the <b>Kusha<\/b> air-defence missile on 23 July.<\/p>","key":"Spain world champions; Sinner and Noskova; hydrogen train Jind; Vikram-1; Sarnath 45th; Kusha; Burnham UK PM; Pradhan quits."},{"k":"table","title":"National — government decisions, schemes, laws","head":["Item","Fact","Note"],"rows":[["Semicon India Mission 2.0","Approved by the Cabinet on 15 Jul 2026: about ₹1.27 lakh crore","The second phase of the India Semiconductor Mission (the first had ₹76,000 crore); it covers chip design, fabs, packaging, equipment and materials."],["National Investment Policy for Urea-2026 (NIPU-2026)","Approved by the Cabinet Committee on Economic Affairs on 15 Jul 2026","For 8–9 new gas-based urea plants; it takes the place of the 2012 investment policy (NIP-2012)."],["India's first hydrogen train","Flagged off by PM Modi at Jind (Haryana) on 17 Jul 2026","Runs Jind–Sonipat, about 89 km; fuel cells turn hydrogen into electricity and leave only water vapour."],["Monsoon Session of Parliament","Began on 20 Jul 2026","It ran until 13 Aug 2026."],["Dharmendra Pradhan resigns","Quit as Union Education Minister on 25 Jul 2026 over the NEET-UG paper leak","The President accepted it under Article 75(2); Pralhad Joshi was given additional charge of Education."],["Anti-paper-leak law tightened","Public Examinations (Prevention of Unfair Means) Amendment Bill, 2026: Lok Sabha 29 Jul, Rajya Sabha 30 Jul","Amends the 2024 Act: higher penalties for cheating in public exams, a special task force and fast-track courts."],["BHAVYA Rasayan","Cabinet, 24 Jul 2026: ₹3,030 crore for three chemical parks","Bharat Audyogik Vikas Yojana – Rasayan; states compete for the parks (challenge route); 2026-27 to 2030-31."],["PM-KISAN extended","Cabinet, 31 Jul 2026: continued to 2030-31 with about ₹3.15 lakh crore","Farmer families still get ₹6,000 a year in three instalments of ₹2,000."],["Khelo India revamped","Cabinet, 31 Jul 2026: ₹36,441 crore for 2026-27 to 2030-31","Includes more help to the National Sports Federations."],["PM Surya Sarovar Yojana (PM-SSY)","Cabinet, 31 Jul 2026: ₹5,070 crore for floating solar","Target: 5,000 MW of solar panels floating on reservoirs and ponds, with 10,000 MWh of storage."]]},{"k":"table","title":"International — summits, agreements, elections abroad","head":["Item","Fact","Note"],"rows":[["NATO Summit 2026","Ankara (Türkiye), 7–8 Jul 2026","The 32 allies adopted the Ankara Summit Declaration; Türkiye's second NATO summit after Istanbul (2004)."],["PM Modi in Indonesia","State visit, 6–8 Jul 2026; talks with President Prabowo Subianto in Jakarta on 7 Jul","14 agreements were signed; the leaders welcomed cooperation on the BrahMos missile."],["3rd India–Australia Annual Summit","Melbourne, during PM Modi's visit of 8–10 Jul 2026","With PM Anthony Albanese; a uranium-export arrangement was finalised and a Sports Collaboration Roadmap launched at the MCG."],["PM Modi in New Zealand","Auckland, 10–11 Jul 2026 — the first official visit by an Indian PM in about 40 years","Ties with Christopher Luxon's New Zealand were raised to a Strategic Partnership."],["48th World Heritage Committee","Busan (South Korea), July 2026","Sarnath was added to the World Heritage List here on 25 Jul 2026."]]},{"k":"table","title":"Economy and banking","head":["Item","Fact","Note"],"rows":[["Mobile Phone Manufacturing Scheme (MPMS)","Cabinet, 15 Jul 2026: ₹62,500 crore for 2026-27 to 2030-31","Incentives of 2.25–5% on eligible sales, plus 3% for design and R&D by Indian brands."],["Cabinet package of 15 Jul 2026","Seven decisions worth about ₹2.19 lakh crore","Semicon 2.0, the mobile phone scheme, the urea policy, two elevated roads in Varanasi and two rail projects."],["Samudra Manthan","Cabinet, 31 Jul 2026: ₹84,084 crore National Offshore Exploration Scheme","Petroleum Ministry; seismic surveys and deep- and ultra-deepwater drilling, up to 2030-31."],["IMF World Economic Outlook Update (July 2026)","India's growth for 2026 (FY 2026-27) cut to 6.4%, from 6.5%","Blamed on higher energy prices; the forecast for 2027 was raised to 6.7%."]]},{"k":"table","title":"Science, space and defence","head":["Item","Fact","Note"],"rows":[["Vikram-1 (Skyroot Aerospace)","Reached orbit from Sriharikota on 18 Jul 2026 — India's first private orbital rocket","On its first attempt it reached an orbit of about 450 km and released payloads, including Skyroot's own SCOPE satellite."],["INS Mahendragiri","Commissioned at Visakhapatnam on 11 Jul 2026 by Rajnath Singh","The sixth Project 17A (Nilgiri-class) stealth frigate; built by Mazagon Dock; joins the Eastern Fleet."],["INS Malvan","Commissioned at Karwar on 22 Jul 2026","The second Mahe-class anti-submarine warfare shallow water craft; built by Cochin Shipyard."],["Kusha long-range surface-to-air missile","First flight test by DRDO on 23 Jul 2026","Fired from Dr APJ Abdul Kalam Island off Odisha; it intercepted an electronic target that copied a fast, high-flying threat."]]},{"k":"table","title":"Sports","head":["Item","Fact","Note"],"rows":[["FIFA World Cup 2026 final","Spain beat Argentina 1-0 after extra time on 19 Jul 2026","Ferran Torres scored in the 106th minute at MetLife Stadium (New Jersey); Spain's second title, after 2010."],["Wimbledon 2026 — men's singles","Jannik Sinner beat Alexander Zverev on 12 Jul 2026","Sinner's second Wimbledon title in a row."],["Wimbledon 2026 — women's singles","Linda Noskova beat Karolina Muchova on 11 Jul 2026","An all-Czech final; Noskova's first Grand Slam title."],["ICC Women's T20 World Cup 2026","Australia beat England by 7 wickets at Lord's on 5 Jul 2026","Australia's record seventh title; Beth Mooney top-scored with 64."],["Tour de France 2026","Tadej Pogačar won; the race ended in Paris on 26 Jul 2026","His fifth Tour title — level with Merckx, Hinault, Indurain and Anquetil."],["Commonwealth Games 2026 opening","Glasgow, 23 Jul 2026 — Mirabai Chanu carried India's flag","Lovlina Borgohain carried the King's Baton; the Games ran to 2 Aug."],["Mirabai Chanu","Women's 48 kg weightlifting gold at Glasgow, 26 Jul 2026","India's first gold of the Games and her third Commonwealth gold in a row (2018, 2022, 2026)."],["Commonwealth Games javelin","31 Jul 2026: gold Rumesh Tharanga Pathirage (Sri Lanka), silver Neeraj Chopra, bronze Yashvir Singh","Pathirage threw 89.75 m; Neeraj 85.83 m."]]},{"k":"table","title":"Awards and honours","head":["Item","Fact","Note"],"rows":[["Bintang Republik Indonesia Adipurna","Indonesia's highest state honour, given to PM Modi in Jakarta on 7 Jul 2026","Pinned on by President Prabowo Subianto at the Merdeka Palace."],["FIFA World Cup 2026 Golden Ball (best player)","Rodri (Spain)","Lionel Messi was second and Kylian Mbappé third."],["FIFA World Cup 2026 Golden Boot (top scorer)","Kylian Mbappé (France), 10 goals","The first player to win the Golden Boot twice (also 2022)."],["FIFA World Cup 2026 Golden Glove (best goalkeeper)","Unai Simón (Spain)","Spain's Pau Cubarsí was named Best Young Player."]]},{"k":"table","title":"Appointments","head":["Item","Fact","Note"],"rows":[["Prime Minister of the United Kingdom","Andy Burnham — took office on 20 Jul 2026","Keir Starmer resigned the same day; Burnham, a former Mayor of Greater Manchester, became Labour leader unopposed."],["CEO, NITI Aayog","Anurag Jain — ACC notification of 22 Jul 2026","A 1989-batch IAS officer (Madhya Pradesh cadre), earlier Chief Secretary of Madhya Pradesh; for two years."],["Union Education Minister (additional charge)","Pralhad Joshi, from 25 Jul 2026","After Dharmendra Pradhan's resignation; Joshi kept his Food and Consumer Affairs portfolio."],["Foreign Secretary","Vikram Misri's term extended by one year, to 14 Jul 2027 (ACC, 1 Jul 2026)","He had been due to retire on 14 Jul 2026; Foreign Secretary since 15 Jul 2024."]]},{"k":"table","title":"Places and persons in news","head":["Item","Fact","Note"],"rows":[["Sarnath (Uttar Pradesh)","Became India's 45th UNESCO World Heritage Site on 25 Jul 2026","Where the Buddha gave his first sermon; the listing covers the Chaukhandi Stupa and the remains around the Dhamek Stupa."],["Jind (Haryana)","India's first hydrogen train started here on 17 Jul 2026","Do not mix it up with the LNG train (Sabarmati, Gujarat, September 2026)."],["Ankara","Capital of Türkiye — hosted the NATO Summit, 7–8 Jul 2026","Gave its name to the Ankara Summit Declaration."],["MetLife Stadium, New Jersey (USA)","Hosted the FIFA World Cup final on 19 Jul 2026","The 2026 World Cup was shared by the USA, Canada and Mexico."],["Glasgow (Scotland)","Hosted the Commonwealth Games, 23 Jul – 2 Aug 2026","The opening ceremony at the OVO Hydro was the first to be held fully indoors."],["Karwar (Karnataka)","INS Malvan was commissioned here on 22 Jul 2026","Malvan itself is a coastal town in Maharashtra."],["Dr APJ Abdul Kalam Island (Odisha)","The Kusha missile was first flight-tested here on 23 Jul 2026","Formerly Wheeler Island."]]},{"k":"table","title":"Obituaries","head":["Item","Fact","Note"],"rows":[["Sam Neill","Actor, best known as Dr Alan Grant in Jurassic Park; died in Sydney on 13 Jul 2026, aged 78","A New Zealand actor; his family called the death sudden and unexpected."],["K. Jamuna Rani","Veteran playback singer; died in Bengaluru on 30 Jul 2026, aged 88","Sang over 6,000 songs in Tamil, Telugu and other languages; began as a child in the Telugu film Tyagayya (1946)."]]},{"k":"trick","h":"Three Cabinet days — <b>15, 24, 31<\/b>. On <b>15 July<\/b> think of a computer's <b>C-P-U<\/b>: <b>C<\/b>hips (Semicon 2.0), <b>P<\/b>hones (₹62,500 crore) and <b>U<\/b>rea (NIPU-2026). On <b>24 July<\/b>, chemicals (BHAVYA Rasayan). On <b>31 July<\/b>, <b>“Farm, Sea, Sport, Sun”<\/b>: PM-KISAN, Samudra Manthan, Khelo India and PM Surya Sarovar."},{"k":"trick","h":"Modi's July tour ran <b>west to east, I-A-N<\/b>: <b>I<\/b>ndonesia (Jakarta — highest honour), <b>A<\/b>ustralia (Melbourne — annual summit), <b>N<\/b>ew Zealand (Auckland — Strategic Partnership)."},{"k":"trap","h":"<b>Hydrogen train<\/b> = <b>Jind–Sonipat<\/b>, Haryana, <b>17 Jul 2026<\/b>. The <b>LNG train<\/b> came later, from <b>Sabarmati<\/b>, Gujarat (27 Sep 2026). And <b>Vikram-1<\/b> is a <b>private<\/b> rocket built by <b>Skyroot Aerospace<\/b> — not ISRO's, and not Chandrayaan's Vikram lander."},{"k":"trap","h":"<b>Two navy ships, two jobs<\/b>: <b>INS Mahendragiri<\/b> is a <b>stealth frigate<\/b> (Project 17A) commissioned at <b>Visakhapatnam<\/b>; <b>INS Malvan<\/b> is an <b>anti-submarine shallow water craft<\/b> commissioned at <b>Karwar<\/b>. And <b>Kusha<\/b> is a <b>surface-to-air<\/b> missile, tested from Dr APJ Abdul Kalam Island."},{"k":"trap","h":"<b>Javelin at Glasgow<\/b>: gold went to <b>Rumesh Tharanga Pathirage<\/b> (Sri Lanka); <b>Neeraj Chopra<\/b> took <b>silver<\/b> and Yashvir Singh bronze. At <b>Wimbledon<\/b>, Sinner beat <b>Zverev<\/b> — Zverev went on to win the US Open in September."},{"k":"table","title":"Sources (checked 24 Oct 2026)","head":["Source","What it confirmed"],"rows":[["<a href=\"https://theprint.in/economy/cabinet-approves-rs-1-27-lakh-crore-for-semicon-mission-2-0/2987130/\">theprint.in<\/a>","Semicon 2.0 approved, ₹1.27 lakh crore (15 Jul 2026)"],["<a href=\"https://deccanherald.com/india/union-cabinet-approves-semicon-20-with-rs-127-lakh-crore-outlay-4075070\">deccanherald.com<\/a>","Semicon 2.0 outlay; ISM 1.0 had ₹76,000 crore"],["<a href=\"https://www.pmindia.gov.in/?p=16883001\">pmindia.gov.in<\/a>","Mobile Phone Manufacturing Scheme, ₹62,500 crore, FY27–FY31; incentive rates"],["<a href=\"https://www.governancenow.com/news/regular-story/cabinet-approves-mobile-phone-manufacturing-scheme\">governancenow.com<\/a>","MPMS approval"],["<a href=\"https://www.freepressjournal.in/business/cabinet-approves-219-lakh-crore-projects-including-semicon-20-and-mobile-scheme\">freepressjournal.in<\/a>","15 Jul 2026 package: seven decisions, about ₹2.19 lakh crore"],["<a href=\"https://www.businesstoday.in/latest/economy/story/cabinet-approves-national-investment-policy-for-urea-2026-to-boost-domestic-production-543124-2026-07-15\">businesstoday.in<\/a>","NIPU-2026 approved on 15 Jul 2026; 8–9 gas-based plants"],["<a href=\"https://www.tribuneindia.com/news/business/cabinet-committee-on-economic-affairs-approves-new-urea-investment-policy-to-boost-domestic-production-cut-import-dependence/\">tribuneindia.com<\/a>","CCEA approval of the urea policy; replaces NIP-2012"],["<a href=\"https://theprint.in/india/pm-modi-flags-off-indias-first-hydrogen-powered-train-from-haryanas-jind/2988805/\">theprint.in<\/a>","First hydrogen train flagged off at Jind, 17 Jul 2026"],["<a href=\"https://www.dtnext.in/news/national/pm-modi-flags-off-indias-first-hydrogen-powered-train-from-haryanas-jind\">dtnext.in<\/a>","Jind–Sonipat, about 89 km; fuel cells"],["<a href=\"https://prsindia.org/policy/monthly-policy-review/july-2026\">prsindia.org (Monthly Policy Review, July 2026)<\/a>","Monsoon Session from 20 Jul 2026; Public Examinations amendment; urea policy; PM-KISAN"],["<a href=\"https://theprint.in/politics/union-education-minister-dharmendra-pradhan-resigns/2996534/\">theprint.in<\/a>","Dharmendra Pradhan resigned (25 Jul 2026)"],["<a href=\"https://www.scconline.com/blog/post/2026/07/25/dharmendra-pradhan-resignation-education-ministry-pralhad-joshi-2026/\">scconline.com<\/a>","Resignation accepted under Article 75(2); Pralhad Joshi additional charge"],["<a href=\"https://www.wionews.com/india-news/pralhad-joshi-assigned-education-ministry-charge-president-accepts-pradhan-s-resignation-1784991466273/amp\">wionews.com<\/a>","Joshi keeps Food and Consumer Affairs"],["<a href=\"https://www.outlookindia.com/national/lok-sabha-passes-public-examinations-prevention-of-unfair-means-amendment-bill-2026\">outlookindia.com<\/a>","Lok Sabha passed the Public Examinations Amendment Bill (29 Jul 2026)"],["<a href=\"https://deccanherald.com/india/bill-to-amend-anti-paper-law-gets-presidents-assent-4095562\">deccanherald.com<\/a> -sam-neill-has-died-family-says-in-statement\">thestar.com.my (Reuters)<\/a>","New Zealand actor Sam Neill died (13 Jul 2026)"],["<a href=\"https://www.outlookindia.com/art-entertainment/south-cinema/jamuna-rani-dies-at-88-legendary-playback-singers-timeless-songs-live-on-forever\">outlookindia.com<\/a>","Jamuna Rani died at 88"],["<a href=\"https://www.deccanchronicle.com/entertainment/veteran-playback-singer-k-jamuna-ranis-funeral-held-in-bengaluru-1975516\">deccanchronicle.com<\/a>","Died 30 Jul 2026; funeral in Bengaluru; 6,000+ songs; debut in Tyagayya (1946)"]]}],"sum":["15 Jul 2026 Cabinet: Semicon 2.0 (about ₹1.27 lakh crore), Mobile Phone Manufacturing Scheme (₹62,500 crore), urea policy NIPU-2026.","First hydrogen train: Jind–Sonipat, Haryana, flagged off by PM Modi on 17 Jul 2026.","Vikram-1 (Skyroot Aerospace) reached orbit from Sriharikota on 18 Jul 2026 — India's first private orbital rocket.","Monsoon Session opened on 20 Jul 2026; anti-paper-leak amendment passed (LS 29 Jul, RS 30 Jul).","Dharmendra Pradhan resigned as Education Minister on 25 Jul 2026 (NEET-UG leak); Pralhad Joshi got additional charge.","24 Jul: BHAVYA Rasayan (₹3,030 crore, three chemical parks). 31 Jul: PM-KISAN to 2030-31, Samudra Manthan (₹84,084 crore), Khelo India (₹36,441 crore), PM Surya Sarovar (₹5,070 crore).","PM in Indonesia (Bintang Adipurna, 7 Jul), Australia (3rd Annual Summit, Melbourne) and New Zealand (Strategic Partnership, Auckland).","NATO Summit: Ankara, 7–8 Jul 2026. Andy Burnham became UK Prime Minister on 20 Jul 2026.","Sarnath became India's 45th World Heritage Site on 25 Jul 2026 (48th session, Busan).","INS Mahendragiri (11 Jul, Visakhapatnam), INS Malvan (22 Jul, Karwar); Kusha missile's first flight test (23 Jul).","FIFA World Cup: Spain beat Argentina 1-0 (19 Jul, MetLife Stadium); Golden Ball Rodri, Golden Boot Mbappé.","Wimbledon: Sinner and Noskova. Women's T20 World Cup: Australia (5 Jul, Lord's). Tour de France: Pogačar.","Glasgow Games opened 23 Jul: Mirabai Chanu flag-bearer and first gold (48 kg); Neeraj silver behind Pathirage (31 Jul).","IMF July update: India's 2026 growth cut to 6.4%. Anurag Jain named NITI Aayog CEO (22 Jul)."],"heat":2,"part":["Part 3 · July–September 2026","जुलाई–सितंबर 2026"],"g":"ca"},
{"id":"CA8","title":"August 2026","hi":"अगस्त 2026","blocks":[{"k":"hot","h":"Most likely to be asked: India's <b>4th place with 39 medals<\/b> at the Glasgow Commonwealth Games, <b>Ahmedabad<\/b> as the 2030 host, the <b>RBI holding the repo rate at 5.25%<\/b>, <b>Q1 GDP growth of 7.8%<\/b>, the <b>Agni-4<\/b> test, <b>INS Nipun<\/b>, Modi's <b>13th Red Fort address<\/b>, <b>Praggnanandhaa<\/b>'s Grand Chess Tour title and Uzbekistan's highest honour for PM Modi."},{"k":"story","h":"<p>August 2026 opened with the end of the <b>Glasgow Commonwealth Games<\/b> on 2 August: India finished <b>fourth with 39 medals<\/b>, seven of its 13 golds from boxing, and received the Commonwealth flag for <b>Ahmedabad 2030<\/b>. A day earlier, on 1 August, NSA <b>Ajit Doval<\/b> received the <b>Lokmanya Tilak National Award<\/b> in Pune. On 5 August the RBI kept the <b>repo rate at 5.25%<\/b>; on 6 August India test-fired <b>Agni-4<\/b> from Chandipur and the Cabinet approved the ₹23,731 crore <b>GOBARdhan<\/b> scheme for compressed biogas. Parliament raised the number of <b>Supreme Court judges to 37 besides the CJI<\/b>, and the <b>Monsoon Session<\/b> ended on 13 August.<\/p><p>On <b>15 August<\/b>, India's <b>80th Independence Day<\/b>, PM Modi spoke from the Red Fort for the <b>13th year in a row<\/b>. In Saint Louis, <b>R. Praggnanandhaa<\/b> fought back to win the <b>Grand Chess Tour<\/b>. The month ended busily: PM Modi received Uzbekistan's highest honour in <b>Tashkent<\/b> on 30 August, and on 31 August the Navy commissioned <b>INS Nipun<\/b>, the government reported <b>7.8% GDP growth<\/b> for April–June, and the <b>Ramon Magsaysay Award<\/b> winners were named.<\/p>","key":"CWG: India 4th, 39 medals; Ahmedabad 2030; repo 5.25%; Agni-4; GDP 7.8%; INS Nipun; 13th Red Fort speech; Pragg; Uzbek honour."},{"k":"table","title":"National — government decisions, schemes, laws","head":["Item","Fact","Note"],"rows":[["80th Independence Day","15 Aug 2026: PM Modi's 13th address in a row from the Red Fort","Only Jawaharlal Nehru (17) has given more in a row; the year also marked 150 years of Vande Mataram."],["GOBARdhan scheme","Cabinet, 6 Aug 2026: ₹23,731 crore for compressed biogas (CBG)","A national unified scheme for 2026-27 to 2035-36, run by the Petroleum Ministry; it aims at about ten times more CBG."],["Supreme Court judges' strength","Bill passed by the Lok Sabha on 3 Aug and the Rajya Sabha on 5 Aug 2026","Raises the number of judges from 33 to 37 besides the CJI (38 in all); replaces an ordinance of May 2026."],["Monsoon Session ends","Parliament adjourned sine die on 13 Aug 2026","The session had begun on 20 Jul; the FCRA amendment bill was sent to a joint committee."]]},{"k":"table","title":"International — summits, agreements, elections abroad","head":["Item","Fact","Note"],"rows":[["PM Modi's state visit to Uzbekistan","29–30 Aug 2026, Tashkent — talks with President Shavkat Mirziyoyev","Ties raised to a Comprehensive Strategic Partnership, with a trade target of US$ 5 billion by 2030."],["Commonwealth Games handover","At the Glasgow closing ceremony on 2 Aug 2026, the Commonwealth flag passed to India","Ahmedabad hosts the 2030 Games; Neeraj Chopra and IOA president P. T. Usha received the flag."]]},{"k":"table","title":"Economy and banking","head":["Item","Fact","Note"],"rows":[["RBI monetary policy (5 Aug 2026)","Repo rate kept at 5.25%; stance neutral","A unanimous MPC decision; SDF 5.00%, MSF and Bank Rate 5.50%. The next meeting was set for 5–7 Oct 2026."],["GDP growth, Q1 2026-27 (April–June)","7.8% — released by MoSPI (NSO) on 31 Aug 2026","Above the RBI's projection of 7%; gross value added grew 8.2% and manufacturing 9.2%."],["GST collections for July 2026","₹2.11 lakh crore gross, up 15.4% — data of 1 Aug 2026","GST on imports rose about 29%; net collections after refunds were ₹1.81 lakh crore."]]},{"k":"table","title":"Science, space and defence","head":["Item","Fact","Note"],"rows":[["Agni-4","Test-fired from the Integrated Test Range, Chandipur (Odisha), on 6 Aug 2026","Carried out under the Strategic Forces Command; all operational and technical parameters were validated."],["INS Nipun","Commissioned at the Naval Dockyard, Mumbai, on 31 Aug 2026","The second Nistar-class diving support vessel, built by Hindustan Shipyard, Visakhapatnam; supports diving to 300 m and submarine rescue."]]},{"k":"table","title":"Sports","head":["Item","Fact","Note"],"rows":[["Commonwealth Games 2026 — India","4th with 39 medals: 13 gold, 17 silver, 9 bronze (Games ended 2 Aug 2026)","Boxing gave India 7 of its 13 golds."],["Commonwealth Games 2026 — medal table","Australia first: 70 gold, 171 medals","England second (29 gold), Canada third (19 gold)."],["India's flag-bearer at the closing ceremony","Jaismine Lamboria (boxing), 2 Aug 2026","She won the women's 57 kg gold at Glasgow."],["Grand Chess Tour Finals 2026","R. Praggnanandhaa won in Saint Louis, 22–27 Aug 2026","He came back from 3–9 down to beat Fabiano Caruana 15–13 — his first overall Grand Chess Tour title."]]},{"k":"table","title":"Awards and honours","head":["Item","Fact","Note"],"rows":[["Lokmanya Tilak National Award 2026","NSA Ajit Doval — presented in Pune on 1 Aug 2026 by Amit Shah","Given by the Lokmanya Tilak Smarak Trust on Tilak's death anniversary; a memento, citation and ₹1 lakh."],["Oliy Darajali Do'stlik Order","Uzbekistan's highest state honour, given to PM Modi in Tashkent on 30 Aug 2026","Presented by President Shavkat Mirziyoyev."],["Ramon Magsaysay Award 2026","Announced on 31 Aug 2026: Tommy Koh (Singapore), Runa Khan (Bangladesh), Bo Kyi (Myanmar)","Koh is a diplomat and law professor, Runa Khan founded the development group Friendship, and Bo Kyi is a human-rights advocate."]]},{"k":"table","title":"Places and persons in news","head":["Item","Fact","Note"],"rows":[["Red Fort, Delhi","PM Modi's 13th straight Independence Day address, 15 Aug 2026","India's 80th Independence Day."],["Chandipur (Odisha)","Integrated Test Range — Agni-4 test on 6 Aug 2026","Do not mix it up with Dr APJ Abdul Kalam Island, where Kusha was tested in July."],["Naval Dockyard, Mumbai","INS Nipun commissioned here on 31 Aug 2026","Her sister ship INS Nistar is based at Visakhapatnam."],["Tashkent","Capital of Uzbekistan — PM Modi received the Oliy Darajali Do'stlik Order here on 30 Aug 2026","From Tashkent he went on to Bishkek for the SCO Summit (31 Aug – 1 Sep)."],["Pune","Ajit Doval received the Lokmanya Tilak National Award here on 1 Aug 2026","Tilak died on 1 Aug 1920."],["Saint Louis (USA)","Hosted the Grand Chess Tour Finals, 22–27 Aug 2026","Praggnanandhaa beat the defending champion Caruana in the final."],["Ahmedabad","Next host of the Commonwealth Games, in 2030","It received the Commonwealth flag at Glasgow on 2 Aug 2026."]]},{"k":"trick","h":"<b>39 = 13 + 17 + 9<\/b>: India's Glasgow medals. Remember <b>“13 golds, 7 from the ring”<\/b> — boxing. And <b>13<\/b> again on <b>15 August<\/b>: Modi's 13th Red Fort speech, on the <b>80th<\/b> Independence Day."},{"k":"trick","h":"Four Navy ships of 2026, four jobs — <b>“Frigate, Sub-hunter, Diver, Supplier”<\/b>: <b>Mahendragiri<\/b> (frigate, Jul), <b>Malvan<\/b> (anti-submarine craft, Jul), <b>Nipun<\/b> (diving support, 31 Aug) and <b>Surya<\/b> (fleet support ship, launched Oct)."},{"k":"trap","h":"<b>Rate direction<\/b>: on <b>5 August<\/b> the RBI <b>held<\/b> the repo rate at <b>5.25%<\/b>; it <b>raised<\/b> it to 5.50% only on 7 October. And <b>7.8%<\/b> is actual Q1 GDP growth — <b>7%<\/b> was the RBI's projection and <b>8.2%<\/b> is GVA growth."},{"k":"trap","h":"<b>Two Central Asian capitals in two days<\/b>: <b>Tashkent<\/b> (Uzbekistan) gave Modi the <b>Oliy Darajali Do'stlik Order<\/b> on 30 Aug; <b>Bishkek<\/b> (Kyrgyzstan) hosted the <b>SCO Summit<\/b> from 31 Aug. And <b>Agni-4<\/b> flew from <b>Chandipur<\/b>, not from Dr APJ Abdul Kalam Island."},{"k":"trap","h":"<b>Supreme Court numbers<\/b>: the law now says <b>37 judges besides the Chief Justice<\/b> — so the full strength is <b>38<\/b>. The old figure was 33 + CJI = 34."},{"k":"table","title":"Sources (checked 24 Oct 2026)","head":["Source","What it confirmed"],"rows":[["<a href=\"https://swarajyamag.com/news-brief/pm-modi-becomes-second-pm-after-nehru-to-deliver-13-straight-i-day-addresses\">swarajyamag.com<\/a>","Modi's 13th straight Independence Day address; second PM after Nehru (17)"],["<a href=\"https://madhyamamonline.com/india/indias-80th-independence-day-record-13th-address-by-pm-modi-at-red-fort-1546023\">madhyamamonline.com<\/a>","80th Independence Day, 15 Aug 2026"],["<a href=\"https://www.etvbharat.com/amp/en/videos/pm-modi-addresses-nation-from-red-fort-on-independence-day-enn26081500543\">etvbharat.com<\/a>","Address from the Red Fort; 150 years of Vande Mataram"],["<a href=\"https://www.business-standard.com/industry/news/cabinet-clears-rs-23-731-crore-gobardhan-scheme-for-compressed-biogas-126080601393_1.html\">business-standard.com<\/a>","GOBARdhan, ₹23,731 crore, compressed biogas (6 Aug 2026)"],["<a href=\"https://www.etvbharat.com/en/bharat/union-cabinet-decisions-ashwini-vaishnaw-biogas-assam-highway-enn26080604558\">etvbharat.com<\/a>","GOBARdhan: national unified CBG scheme; FY27 to FY36; Petroleum Ministry"],["<a href=\"https://www.barandbench.com/news/lok-sabha-passes-bill-to-increase-supreme-court-judge-strength-to-38\">barandbench.com<\/a>","Lok Sabha passed the bill raising the Supreme Court's strength to 38"],["<a href=\"https://www.scconline.com/blog/post/2026/08/03/lok-sabha-passes-supreme-court-number-of-judges-amendment-bill-2026/\">scconline.com<\/a>","Passed by the Lok Sabha on 3 Aug 2026; 33 to 37 besides the CJI"],["<a href=\"https://www.dailyexcelsior.com/parliament-clears-bill-to-raise-supreme-court-judge-strength-to-38/\">dailyexcelsior.com<\/a>","Parliament cleared the bill (Rajya Sabha, 5 Aug 2026); replaces the May ordinance"],["<a href=\"https://www.livelaw.in/news-updates/monsoon-se k National Award on Ajit Doval"],["<a href=\"https://www.freepressjournal.in/pune/pune-ajit-doval-conferred-lokmanya-tilak-award-amit-shah-hails-nsas-role-in-shaping-indias-security-doctrine\">freepressjournal.in<\/a>","Ceremony in Pune, 1 Aug 2026; Tilak's death anniversary; memento, citation, ₹1 lakh"],["<a href=\"https://newsonair.gov.in/nsa-ajit-doval-selected-for-lokmanya-tilak-national-award/\">newsonair.gov.in<\/a>","Doval selected by the Tilak Smarak Trust"],["<a href=\"https://mb.com.ph/2026/08/31/3-transformative-leaders-named-2026-ramon-magsaysay-awardees\">mb.com.ph<\/a>","2026 Ramon Magsaysay awardees named on 31 Aug 2026"],["<a href=\"https://www.gmanetwork.com/news/lifestyle/content/1000519/the-2026-ramon-magsaysay-award-reveals-recipients-from-singapore-bangladesh-myanmar/story/\">gmanetwork.com<\/a>","Awardees from Singapore, Bangladesh and Myanmar: Koh, Khan, Bo Kyi"]]}],"sum":["Glasgow Commonwealth Games ended 2 Aug 2026: India 4th, 39 medals (13 gold, 17 silver, 9 bronze); 7 golds in boxing.","Australia topped the table (70 gold, 171 medals); Jaismine Lamboria India's closing flag-bearer; Ahmedabad hosts 2030.","Lokmanya Tilak National Award 2026: Ajit Doval, Pune, 1 Aug (presented by Amit Shah).","RBI, 5 Aug 2026: repo rate unchanged at 5.25%, neutral stance (SDF 5.00%, MSF 5.50%).","6 Aug 2026: Agni-4 test from ITR Chandipur; Cabinet approved GOBARdhan (₹23,731 crore, compressed biogas).","Supreme Court strength raised to 37 + CJI (bill passed 3 and 5 Aug); Monsoon Session ended 13 Aug.","15 Aug 2026: 80th Independence Day — Modi's 13th straight Red Fort address.","Praggnanandhaa won the Grand Chess Tour Finals in Saint Louis (22–27 Aug), beating Fabiano Caruana.","PM Modi in Tashkent, 29–30 Aug: Comprehensive Strategic Partnership; Oliy Darajali Do'stlik Order (30 Aug).","31 Aug 2026: INS Nipun commissioned (Mumbai); Q1 GDP growth 7.8%; Ramon Magsaysay 2026 winners named.","GST for July 2026: ₹2.11 lakh crore, up 15.4% (released 1 Aug)."],"hea {"id":"CA9","title":"September 2026","hi":"सितंबर 2026","blocks":[{"k":"hot","h":"Most likely to be asked: the <b>18th BRICS Summit<\/b> in New Delhi, the <b>EPFO wage ceiling of ₹25,000<\/b>, the <b>first LNG train<\/b> at Sabarmati, the <b>Asian Games<\/b> opening and India's first gold (women's cricket), <b>Anant Nag<\/b>'s Phalke Award at the first National Film Awards held outside Delhi, and the <b>US Open<\/b> champions."},{"k":"story","h":"<p>September 2026 was India's month as host. On <b>12–13 September<\/b> New Delhi held the <b>18th BRICS Summit<\/b>, which ended with the <b>New Delhi Declaration<\/b>; a fortnight earlier PM Modi had been at the <b>SCO Summit in Bishkek<\/b>. At home, the EPFO wage ceiling went up from ₹15,000 to <b>₹25,000<\/b> on 17 September — the first change since 2014 — and a <b>0.4% charge on large UPI payments to merchants<\/b> was notified. Amit Shah flagged off India's <b>first LNG-powered train<\/b> from Sabarmati, and the Cabinet ended the month with <b>Green Energy Corridor Phase-III<\/b> and the <b>rabi MSPs<\/b>.<\/p><p>In sport, the <b>Asian Games<\/b> opened in <b>Aichi-Nagoya<\/b> on 19 September; India's women cricketers won the first gold and <b>Neeru Dhanda<\/b> made history in trap. <b>Zverev<\/b> and <b>Rybakina<\/b> won the US Open, and India took silver and bronze at the <b>Chess Olympiad<\/b> in Samarkand. The <b>72nd National Film Awards<\/b> were presented at <b>Ekta Nagar<\/b> in Gujarat — the first time outside New Delhi — with the <b>Phalke Award<\/b> for <b>Anant Nag<\/b>.<\/p>","key":"BRICS in Delhi, SCO in Bishkek; EPFO ₹25,000; LNG train Sabarmati; Asian Games Aichi-Nagoya; Phalke — Anant Nag."},{"k":"table","title":"National — government decisions, schemes, laws","head":["Item","Fact","Note"],"rows":[["EPFO wage ceiling","Raised from ₹15,000 to ₹25,000 a month, with effect from 17 Sep 2026","Cabinet decision; the first revision since September 2014. Over 51 lakh more workers come under compulsory EPFO cover."],["Supreme Court on the CEC law","Split verdict on 23 Sep 2026; the matter sent to the CJI for a Constitution Bench","Justices Dipankar Datta and Satish Chandra Sharma differed on the challenge to the 2023 law on appointing the CEC and Election Commissioners."],["India's first LNG-powered train","Flagged off from Sabarmati (Ahmedabad) by Amit Shah on 27 Sep 2026","An eight-coach DEMU for the Sabarmati–Mahesana route; dual-fuel (diesel + LNG) power cars — LNG can replace up to about 40% of the diesel."],["India Net Zero Portal and NAPCC Dashboard","Launched in Mumbai on 16 Sep 2026, World Ozone Day","Launched by MoS Kirti Vardhan Singh (Environment Ministry); companies register net-zero targets on the portal."],["Green Energy Corridor Phase-III","Approved by the Cabinet on 30 Sep 2026: ₹1,86,405 crore","Intra-state transmission lines plus 50 GWh of battery storage, by 2032-33."],["Rabi MSP for 2027-28","Approved on 30 Sep 2026: wheat ₹2,610 a quintal (+₹25)","Safflower got the biggest rise (+₹675, to ₹7,215); mustard ₹6,613, masur ₹7,390."],["E-commerce rules","Consumer Protection (E-Commerce) Amendment Rules, 2026 notified in Sep 2026","Sponsored listings must be labelled and search ranking explained; in force from 1 Jan 2027."],["SEMICON India 2026","5th edition, Yashobhoomi (New Delhi), 17–19 Sep 2026","Inaugurated by PM Modi on 17 Sep; organised by the India Semiconductor Mission, MeitY and SEMI."]]},{"k":"table","title":"International — summits, agreements, elections abroad","head":["Item","Fact","Note"],"rows":[["18th BRICS Summit","New Delhi, 12–13 Sep 2026 — India the host","Leaders adopted the New Delhi Declaration; China hosts the next summit in 2027."],["26th SCO Summit","Bishkek (Kyrgyzstan), 31 Aug – 1 Sep 2026","The Bishkek Declaration was signed on 1 Sep; Kyrgyz President Sadyr Japarov chaired; PM Modi attended."],["UN General Assembly, 81st session","Opened on 8 Sep 2026 under President Khalilur Rahman","Bangladesh's Foreign Minister; elected o

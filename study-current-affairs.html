tion count, follows in February 2027."],["Self-enumeration","Offered for the first time in an Indian census (from April 2026)","Residents fill the form on a web portal in the 15 days before house-to-house work starts, and get a Self-Enumeration ID."],["Income-tax Act, 2025","Came into force on 1 April 2026, replacing the Income-tax Act, 1961","Passed in August 2025 (assent 21 Aug 2025); it introduces the 'tax year' — the first is 2026-27. Meant to simplify, not to change tax rates."],["Dearness allowance","Cabinet, 18 Apr 2026: DA and DR raised by 2 points, from 58% to 60%","From 1 Jan 2026; about 50.46 lakh employees and 68.27 lakh pensioners benefit; cost about ₹6,791 crore a year."],["Two hydro projects in Arunachal Pradesh","Approved by the CCEA in April 2026: ₹40,175 crore for 2,920 MW","Kamala HEP (1,720 MW, NHPC joint venture) and Kalai-II HEP (1,200 MW, on the Lohit, THDC joint venture). The state gets 12% free power."],["Assembly polls — first round","9 Apr 2026: Assam (126 seats), Kerala (140) and Puducherry (30) voted","Each in a single phase. Schedule announced by the Election Commission on 15 Mar 2026."],["Assembly polls — Tamil Nadu and West Bengal","Tamil Nadu (234 seats) voted on 23 Apr 2026; West Bengal on 23 Apr (152 seats) and 29 Apr (142)","824 seats and about 17.4 crore voters in all; counting for every state was set for 4 May 2026."]]},{"k":"table","title":"International — summits, agreements, elections abroad","head":["Item","Fact","Note"],"rows":[["Hungary's parliamentary election","12 Apr 2026: Péter Magyar's Tisza party won about 53% and 138 of 199 seats","A two-thirds majority (preliminary count). Viktor Orbán, in power for 16 years, conceded; his Fidesz alliance got 55 seats."],["US–Iran ceasefire","A two-week ceasefire announced on 7 Apr 2026, mediated by Pakistan","Tied to Iran reopening the Strait of Hormuz to safe passage; Pakistan's PM Shehbaz Sharif and army chief Asim Munir helped broker it."]]},{"k":"table","title":"Economy and ba {"id":"CA9","title":"September 2026","hi":"सितंबर 2026","blocks":[{"k":"hot","h":"Most likely to be asked: the <b>18th BRICS Summit<\/b> in New Delhi, the <b>EPFO wage ceiling of ₹25,000<\/b>, the <b>first LNG train<\/b> at Sabarmati, the <b>Asian Games<\/b> opening and India's first gold (women's cricket), <b>Anant Nag<\/b>'s Phalke Award at the first National Film Awards held outside Delhi, and the <b>US Open<\/b> champions."},{"k":"story","h":"<p>September 2026 was India's month as host. On <b>12–13 September<\/b> New Delhi held the <b>18th BRICS Summit<\/b>, which ended with the <b>New Delhi Declaration<\/b>; a fortnight earlier PM Modi had been at the <b>SCO Summit in Bishkek<\/b>. At home, the EPFO wage ceiling went up from ₹15,000 to <b>₹25,000<\/b> on 17 September — the first change since 2014 — and a <b>0.4% charge on large UPI payments to merchants<\/b> was notified. Amit Shah flagged off India's <b>first LNG-powered train<\/b> from Sabarmati, and the Cabinet ended the month with <b>Green Energy Corridor Phase-III<\/b> and the <b>rabi MSPs<\/b>.<\/p><p>In sport, the <b>Asian Games<\/b> opened in <b>Aichi-Nagoya<\/b> on 19 September; India's women cricketers won the first gold and <b>Neeru Dhanda<\/b> made history in trap. <b>Zverev<\/b> and <b>Rybakina<\/b> won the US Open, and India took silver and bronze at the <b>Chess Olympiad<\/b> in Samarkand. The <b>72nd National Film Awards<\/b> were presented at <b>Ekta Nagar<\/b> in Gujarat — the first time outside New Delhi — with the <b>Phalke Award<\/b> for <b>Anant Nag<\/b>.<\/p>","key":"BRICS in Delhi, SCO in Bishkek; EPFO ₹25,000; LNG train Sabarmati; Asian Games Aichi-Nagoya; Phalke — Anant Nag."},{"k":"table","title":"National — government decisions, schemes, laws","head":["Item","Fact","Note"],"rows":[["EPFO wage ceiling","Raised from ₹15,000 to ₹25,000 a month, with effect from 17 Sep 2026","Cabinet decision; the first revision since September 2014. Over 51 lakh more workers come under compulsory EPFO cover."],["Supreme Court on the CEC law","Split verdict on 23 Sep 2026; the matter sent to the CJI for a Constitution Bench","Justices Dipankar Datta and Satish Chandra Sharma differed on the challenge to the 2023 law on appointing the CEC and Election Commissioners."],["India's first LNG-powered train","Flagged off from Sabarmati (Ahmedabad) by Amit Shah on 27 Sep 2026","An eight-coach DEMU for the Sabarmati–Mahesana route; dual-fuel (diesel + LNG) power cars — LNG can replace up to about 40% of the diesel."],["India Net Zero Portal and NAPCC Dashboard","Launched in Mumbai on 16 Sep 2026, World Ozone Day","Launched by MoS Kirti Vardhan Singh (Environment Ministry); companies register net-zero targets on the portal."],["Green Energy Corridor Phase-III","Approved by the Cabinet on 30 Sep 2026: ₹1,86,405 crore","Intra-state transmission lines plus 50 GWh of battery storage, by 2032-33."],["Rabi MSP for 2027-28","Approved on 30 Sep 2026: wheat ₹2,610 a quintal (+₹25)","Safflower got the biggest rise (+₹675, to ₹7,215); mustard ₹6,613, masur ₹7,390."],["E-commerce rules","Consumer Protection (E-Commerce) Amendment Rules, 2026 notified in Sep 2026","Sponsored listings must be labelled and search ranking explained; in force from 1 Jan 2027."],["SEMICON India 2026","5th edition, Yashobhoomi (New Delhi), 17–19 Sep 2026","Inaugurated by PM Modi on 17 Sep; organised by the India Semiconductor Mission, MeitY and SEMI."]]},{"k":"table","title":"International — summits, agreements, elections abroad","head":["Item","Fact","Note"],"rows":[["18th BRICS Summit","New Delhi, 12–13 Sep 2026 — India the host","Leaders adopted the New Delhi Declaration; China hosts the next summit in 2027."],["26th SCO Summit","Bishkek (Kyrgyzstan), 31 Aug – 1 Sep 2026","The Bishkek Declaration was signed on 1 Sep; Kyrgyz President Sadyr Japarov chaired; PM Modi attended."],["UN General Assembly, 81st session","Opened on 8 Sep 2026 under President Khalilur Rahman","Bangladesh's Foreign Minister; elected on 2 June 2026 (99 votes to 91 for Cyprus)."],["Sweden's general election","Held on 13 Sep 2026; the centre-left opposition won 176 of 349 seats","PM Ulf Kristersson announced his resignation on 17 Sep; Social Democrat leader Magdalena Andersson was expected to return."],["Russia's State Duma election","September 2026: United Russia won 349 of 450 seats (final count)","A record for Putin's party; the Communists came second."],["Saxony-Anhalt (Germany) state election","6 Sep 2026: the far-right AfD came first with 43.8%","39 of 83 seats — short of a majority; other parties refuse to work with it."],["India–EU free trade agreement","On 11 Sep 2026 the European Commission sent the text to the EU Council","Talks had concluded on 27 Jan 2026; signing was expected in December."]]},{"k":"table","title":"Economy and banking","head":["Item","Fact","Note"],"rows":[["UPI merchant charge (MDR)","Notified on 14 Sep 2026: 0.4% on payments to merchants above ₹2,000, from 15 Oct 2026","Capped at ₹300; no charge up to ₹2,000, on person-to-person payments or on the customer."],["Current account deficit, Q1 2026-27","US$ 4.2 billion = 0.5% of GDP (RBI, 1 Sep 2026)","0.4% of GDP a year earlier; forex reserves fell by US$ 8.1 billion (BoP basis) in the quarter."],["Moody's growth forecast for India","Raised to 7% for 2026-27 (from 6%), in Sep 2026","India's rating kept at Baa3 with a stable outlook."],["Global Innovation Index 2026 (WIPO)","India 38th of 139 — released on 29 Sep 2026","Switzerland first for the 16th year; India 1st among lower-middle-income economies."],["Global Gender Gap Report 2026 (WEF)","India 131st of 145 — released on 16 Sep 2026","Rank unchanged; India's score 64.5%. Iceland is first, then Finland and Norway."]]},{"k":"table","title":"Science, space and defence","head":["Item","Fact","Note"],"rows":[["GSLV-F17 / EOS-05 (GISAT-1A)","Launched from Sriharikota on 4 Sep 2026","An earth-observation satellite for a geosynchronous orbit; ISRO's first launch since the PSLV-C62 failure of 12 Jan 2026."],["Next Generation Missile Vessel (NGMV)","Keel of the first ship laid at Cochin Shipyard on 18 Sep 2026","Six NGMVs are being built for the Navy, armed with BrahMos; first delivery due March 2027."],["Drug haul in the Arabian Sea","About 526 kg seized from an Iranian boat on 25 Sep 2026","Coast Guard and Gujarat ATS, west of Lakshadweep; worth over ₹3,000 crore; five Pakistani nationals held."],["World Ozone Day 2026 (32nd)","Marked in Mumbai on 16 Sep 2026","Theme: 'Global Action for a Cooler Planet'; the Net Zero Portal was launched there."],["Tarang Shakti 2026","Multinational air exercise of the IAF, Jodhpur, 26 Sep – 12 Oct 2026","The second edition; foreign air forces flew in and over 30 nations sent observers."]]},{"k":"table","title":"Sports","head":["Item","Fact","Note"],"rows":[["US Open 2026 — men's singles","Alexander Zverev (Germany) beat Ben Shelton on 13 Sep 2026","His first US Open and second Grand Slam title, after the 2026 French Open."],["US Open 2026 — women's singles","Elena Rybakina beat Aryna Sabalenka on 12 Sep 2026","Her third Grand Slam title; she also won the 2026 Australian Open."],["Asian Games 2026 opening","Aichi-Nagoya (Japan), 19 Sep 2026","India's flag-bearers: Manu Bhaker and kabaddi star Pawan Sehrawat."],["India's first gold at the 2026 Asian Games","Women's cricket, 22 Sep 2026: beat Sri Lanka by 147 runs","India kept the title it won in 2023; Smriti Mandhana top-scored with 79."],["Neeru Dhanda","Women's trap gold at the Asian Games, 29 Sep 2026","The first Indian woman to win the trap gold at the Asian Games."],["46th Chess Olympiad (Samarkand, Uzbekistan)","Ended 27 Sep 2026: India silver (open) and bronze (women)","Open gold Uzbekistan, women's gold China; India kept the Nona Gaprindashvili Trophy for the best combined result."],["World Athletics Ultimate Championship","First edition, Budapest, 11–13 Sep 2026","Men's javelin won by Rumesh Tharanga Pathirage (Sri Lanka) with 91.09 m; Neeraj Chopra missed it through injury."],["Asian Games kabaddi","Both golds for India on 26 Sep 2026 — men and women beat Iran in the finals","The men's ninth Asian Games kabaddi title."],["Shubman Gill","Unbeaten 223 v West Indies at Guwahati, 30 Sep 2026 — the fastest ODI double century","Reached 200 in 117 balls; India chased 406, the second-highest chase in ODIs, and took the series."]]},{"k":"table","title":"Awards and honours","head":["Item","Fact","Note"],"rows":[["Dadasaheb Phalke Award (for 2024)","Anant Nag — announced 16 Sep, presented 22 Sep 2026","The second Kannada actor to get it, after Dr Rajkumar (1995)."],["72nd National Film Awards ceremony","Ekta Nagar (Kevadia), Gujarat, on 22 Sep 2026","Presented by President Droupadi Murmu — the first ceremony held outside New Delhi."],["72nd National Film Awards — Best Actor","Shared: Mammootty (Bramayugam) and Kartik Aaryan (Chandu Champion)","Best Actress Yami Gautam and Best Feature Film Article 370."],["78th Primetime Emmy Awards","Los Angeles, 14 Sep 2026: Best Drama The Pitt, Best Comedy Widow's Bay","The Pitt won Best Drama for the second year running."],["Right Livelihood Award 2026","Announced on 30 Sep 2026: four laureates","Jalila Haider (Pakistan), Timnit Gebru, the Rural Women's Assembly (South Africa) and the Georgian Young Lawyers' Association."],["Booker Prize 2026 shortlist","Announced on 22 Sep 2026; winner due on 9 Nov 2026","Includes Elizabeth Strout, Marlon James and Douglas Stuart."]]},{"k":"table","title":"Appointments","head":["Item","Fact","Note"],"rows":[["Chairperson, CBSE","Mandeep K. Bhandari — ACC order of 25 Sep 2026","After Lokhande Prashant Sitaram."],["Deputy Chair, ICC","Tavengwa Mukuhlani (Zimbabwe) — 17 Sep 2026, till Nov 2027","The first Zimbabwean in the post; succeeded Imran Khwaja."],["Chairperson, IBBI (additional charge)","Jayanti Prasad, from 13 Sep 2026","A whole-time member of IBBI, after Ravi Mital retired; at most till 20 Nov 2026."],["President, UN General Assembly (81st session)","Khalilur Rahman (Bangladesh) — took office on 8 Sep 2026","Only the second time Bangladesh has held the post (the first was 1986)."]]},{"k":"table","title":"Places and persons in news","head":["Item","Fact","Note"],"rows":[["Ekta Nagar (Kevadia), Gujarat","Hosted the National Film Awards on 22 Sep 2026","Home of the Statue of Unity — the first time the ceremony left New Delhi."],["Sabarmati, Ahmedabad","India's first LNG-powered train started here on 27 Sep 2026","Do not mix it up with the hydrogen train (Jind–Sonipat, Haryana, July 2026)."],["Bishkek","Capital of Kyrgyzstan — hosted the 26th SCO Summit (31 Aug – 1 Sep 2026)","Gave its name to the Bishkek Declaration."],["Samarkand","Uzbekistan — hosted the 46th Chess Olympiad (Sept 2026)","Uzbekistan won the open section at home."],["Nisshin, Japan","Venue of the Asian Games women's cricket final on 22 Sep 2026","India beat Sri Lanka there by 147 runs."],["Yashobhoomi, New Delhi","Hosted SEMICON India 2026 (17–19 Sep)","The 5th edition; PM Modi opened it on 17 Sep."]]},{"k":"table","title":"Obituaries","head":["Item","Fact","Note"],"rows":[["S. R. Janakiraman","Carnatic musicologist; died in Chennai on 4 Sep 2026, aged 98","The last disciple of Tiger Varadachariar; Padma Shri; Sangita Kala Acharya (1997)."],["Solomon Pappaiah","Tamil scholar and Pattimandram (debate) moderator; died in Madurai in Sep 2026, aged 90","Taught Tamil at The American College, Madurai; Padma Shri (2021); acted in Shankar's films."],["Major Vijay Singh Mankotia","Former Himachal Pradesh minister; died on 29 Sep 2026, aged 87","Died at his village in Kangra district."]]},{"k":"trick","h":"Two summits, two declarations — <b>“S before B”<\/b>: the <b>SCO<\/b> met first, in <b>Bishkek<\/b> (1 Sep, Bishkek Declaration), then <b>BRICS<\/b> in <b>Delhi<\/b> (12–13 Sep, New Delhi Declaration). Count the BRICS summits on your fingers: Delhi's was the <b>18th<\/b>, and <b>China<\/b> hosts the 19th in 2027."},{"k":"trick","h":"The <b>₹2 {"id":"CA10","title":"October 2026 (to 24 Oct)","hi":"अक्टूबर 2026 (24 अक्टूबर तक)","blocks":[{"k":"hot","h":"Most likely to be asked: the <b>RBI's repo rate hike to 5.50%<\/b> (7 Oct), India's <b>85 medals<\/b> and the <b>hockey and cricket golds<\/b> at the Asian Games, the <b>Nobel Prizes 2026<\/b> (Peace — Navi Pillay), the <b>29th Air chief Ashutosh Dixit<\/b>, the <b>new governors<\/b> of 12 October, <b>INS Samarthak<\/b>, the <b>103 Ramsar sites<\/b> and the <b>India–New Zealand FTA<\/b>."},{"k":"story","h":"<p>October 2026 opened with India's best days at the <b>Asian Games<\/b>: the women's hockey team ended a 44-year wait by beating <b>China<\/b> on 2 October, and on 3 October came golds in <b>men's hockey<\/b>, <b>men's cricket<\/b> (against Pakistan) and <b>golf<\/b> (Pranavi Urs). India finished <b>fourth with 85 medals<\/b> when the Games closed on 4 October.<\/p><p>On 7 October the <b>RBI<\/b> did something it had not done since February 2023 — it <b>raised the repo rate<\/b>, by 25 basis points to <b>5.50%<\/b>. The Nobel week followed, with the Peace Prize for <b>Navi Pillay<\/b>. The government renamed the NSAP the <b>PM Samajik Sahayata Yojana<\/b>, appointed six <b>governors<\/b> and named <b>Ashutosh Dixit<\/b> the next Air chief. The Navy commissioned <b>INS Samarthak<\/b> at Karwar, Chandigarh's <b>Sukhna<\/b> wetland took India to <b>103 Ramsar sites<\/b>, and the <b>India–New Zealand FTA<\/b> came into force on 20 October.<\/p>","key":"Repo 5.50% (7 Oct); Asian Games 4th, 85 medals; Nobel Peace — Navi Pillay; Air chief — Ashutosh Dixit (29th); India–NZ FTA from 20 Oct."},{"k":"table","title":"National — government decisions, schemes, laws","head":["Item","Fact","Note"],"rows":[["NSAP renamed","Became the Pradhan Mantri Samajik Sahayata Yojana on 14 Oct 2026","Cabinet approved ₹53,428 crore for 2026-27 to 2030-31; disability pension now from 40% disability (was 80%)."],["Old-age pension under the renamed NSAP","IGNOAPS is now the Pradhan Mantri Vridhavastha Pension Yojana (Oct 2026)","One of the four component schemes given new names on 14 Oct 2026."],["SME Growth Fund","Cabinet approved a ₹10,000 crore government commitment on 6 Oct 2026","The fund makes direct equity investments in small and medium enterprises; announced in the Budget 2026-27."],["Chennai Metro Phase II","PM Modi opened a stretch of about 15 km on 11 Oct 2026","With Tamil Nadu CM C. Joseph Vijay; projects worth over ₹13,000 crore launched in Tamil Nadu the same day."],["New Ramsar sites","Sukhna Wetland (Chandigarh) and Sauj Jheel (Uttar Pradesh) added in Oct 2026","India now has 103 Ramsar sites."]]},{"k":"table","title":"International — summits, agreements, elections abroad","head":["Item","Fact","Note"],"rows":[["India–New Zealand free trade agreement","Came into force on 20 Oct 2026","All Indian exports get duty-free entry into New Zealand; New Zealand is to help bring US$ 20 billion of investment into India over 15 years."],["Brazil's presidential election, first round","4 Oct 2026: Flávio Bolsonaro first (about 47%), President Lula second (about 45%)","No one crossed 50%, so the two meet in a run-off on 25 Oct 2026."],["Romania's new government","Independent diplomat Luca Niculescu sworn in as PM (decree of 20 Oct 2026)","Parliament backed his cabinet 280 to 58, ending a crisis that began in May."],["Choosing the next UN Secretary-General","The Security Council held its 6th straw poll on 16 Oct 2026","António Guterres's term ends on 31 Dec 2026; the new Secretary-General takes office in January 2027."]]},{"k":"table","title":"Economy and banking","head":["Item","Fact","Note"],"rows":[["RBI monetary policy (7 Oct 2026)","Repo rate raised by 25 basis points to 5.50%","The first hike since February 2023; stance changed from neutral to 'calibrated tightening'. SDF 5.25%, MSF and Bank Rate 5.75%."],["RBI projections for 2026-27 (7 Oct 2026)","GDP growth 7.1%; CPI inflation 5.2%","Governor Sanjay Malhotra; the next MPC meeting is on 2–4 Dec 2026."],["IMF World Economic Outlook (13 Oct 2026)","India's growth forecast for 2026-27 raised to 7.0%","0.6 percentage point above the July 2026 forecast; India stays among the fastest-growing major economies."],["Global Hunger Index 2026 (14 Oct 2026)","India 100th of 122, score 24.1 — 'serious'","Published by Concern Worldwide and Welthungerhilfe; India was 102nd in 2025."],["Henley Passport Index (Oct 2026)","India 84th; Singapore first (visa-free access to 193 destinations)","India was 81st in July 2026."]]},{"k":"table","title":"Science, space and defence","head":["Item","Fact","Note"],"rows":[["INS Samarthak","Commissioned at Karwar on 16 Oct 2026","Built by L&T at Kattupalli; a multi-purpose vessel to test weapons and sensors; Vice-President C. P. Radhakrishnan presided."],["Fleet Support Ship 'Surya'","Launched at Hindustan Shipyard, Visakhapatnam, on 6 Oct 2026","The Navy's first Fleet Support Ship (FSS-1); Rajnath Singh was the chief guest."],["DRDO high-altitude airship","Flight to 21 km announced on 6 Oct 2026","Built by ADRDE, Agra; stayed near 20 km for over 30 minutes and was recovered."],["INDRA 2026","India–Russia exercise in Russia; naval phase in the Sea of Japan on 16–17 Oct 2026","Land, sea and air components; the land phase ran to 23 Oct."],["AUSTRAHIND 2026","India–Australia army exercise, Thiruvananthapuram, 19 Oct – 1 Nov 2026","Held at the Foreign Training Node; jungle, island and coastal drills."],["SIMBEX 2026","India–Singapore naval exercise began on 21 Oct 2026","Sea phase planned for 24–26 Oct."]]},{"k":"table","title":"Sports","head":["Item","Fact","Note"],"rows":[["Asian Games 2026 — India's final place","4th, with 85 medals (21 gold, 27 silver, 37 bronze)","Games closed on 4 Oct 2026; China topped the table; India's best remains 107 medals (Hangzhou)."],["Asian Games — men's hockey","Gold on 3 Oct 2026, beating Malaysia in the final","India kept its title and qualified directly for the 2028 Los Angeles Olympics."],["Asian Games — women's hockey","Gold on 2 Oct 2026, beating China 1-0","Lalremsiami scored; India's first women's hockey gold since 1982; also an LA 2028 place."],["Asian Games — men's cricket","Gold on 3 Oct 2026, beating Pakistan by 19 runs","India 211/6, Pakistan 192/6; India's second straight Asian Games title."],["Pranavi Urs","Women's individual golf gold, 3 Oct 2026","The first Indian woman to win an Asian Games golf gold; also team silver."],["Asian Games closing ceremony flag-bearer","Neeru Dhanda (4 Oct 2026)","The next Asian Games are in Doha (2030)."],["India vs West Indies T20I series","Drawn 2-2; the fifth match in Bengaluru was washed out on 17 Oct 2026","India had won the ODI series 2-1."]]},{"k":"table","title":"Awards and honours","head":["Item","Fact","Note"],"rows":[["Nobel Peace Prize 2026","Navi Pillay (South Africa) — announced 9 Oct 2026","Jurist of Indian origin; former UN High Commissioner for Human Rights."],["Nobel Prize in Literature 2026","Anne Carson","Canadian poet."],["Nobel Prize in Physics 2026","Francis Halzen","For discovering high-energy neutrinos from space."],["Nobel Prize in Chemistry 2026","Henri B. Kagan and Kenso Soai","How homochirality (one-handedness of molecules) can arise by itself."],["Nobel Prize in Medicine 2026","Karl Deisseroth, Peter Hegemann and Georg Nagel","Optogenetics — controlling cells with light."],["Economics Nobel 2026","Robert E. Hall and Michael Woodford","Macroeconomic models for stabilisation policy."]]},{"k":"table","title":"Appointments","head":["Item","Fact","Note"],"rows":[["Chief of the Air Staff (29th)","Air Marshal Ashutosh Dixit — named on 6 Oct 2026, takes over on 31 Oct 2026","After ACM Amar Preet Singh (28th); tenure to 31 Dec 2028."],["Governor of Tamil Nadu","Rajendra Vishwanath Arlekar — moved from Keralam (12 Oct 2026)","One of six governors appointed by the President that day."],["Governor of Karnataka","Sudha Yadav (12 Oct 2026)","Also named: Keralam O. P. Mathur, Odisha Braj Mohan Ram, Ut <script>
"use strict";
/* Current Affairs Lab — decks built from the lesson tables (labRows), played by tools/workbook/games.js.
   Nothing here names a month: every table of every lesson is read, so a new month file is picked up by itself.
   - one deck per kind of news (Sports, Appointments …), gathering that table from every month, newest first;
   - one deck per month, with all of that month's tables;
   - a Grand Mix.
   The "Sources" tables are left out. A deck needs at least four different answers to give four options; smaller
   decks are dropped, and with no deck at all the Lab simply shows no games. */
const CA_KINDS = [
  ["National", "🇮🇳"], ["International", "🌍"], ["Economy and banking", "💹"], ["Science, space and defence", "🚀"],
  ["Sports", "🏅"], ["Awards and honours", "🏆"], ["Appointments", "🪪"], ["Places and persons in news", "📍"], ["Obituaries", "🕯️"]
];
const CA_MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const caNum = id => +String(id).replace(/\D/g, "");
const caLessons = LESSONS.slice().sort((a, b) => caNum(b.id) - caNum(a.id));          // newest month first
const caStrip = s => String(s == null ? "" : s).replace(/<[^>]+>/g, "").trim();
const caTables = l => l.blocks.filter(b => b.k === "table").map((t, n) => ({ title: caStrip(t.title), n }))
  .filter(t => !/^Sources/i.test(t.title));
const caKind = title => (CA_KINDS.find(k => title.toLowerCase().startsWith(k[0].toLowerCase())) || [title])[0];
const caOk = d => new Set(d.pairs.map(p => p[1])).size >= 4;
const caSlug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

const CA_KIND_DECKS = CA_KINDS.map(([kind, ico]) => {
  const from = caLessons.filter(l => caTables(l).some(t => caKind(t.title) === kind));
  const pairs = from.flatMap(l => caTables(l).filter(t => caKind(t.title) === kind).flatMap(t => labRows(l.id, t.n)));
  const months = from.map(l => CA_MONTHS[caNum(l.id) - 1]).filter(Boolean);
  return { id: "k-" + caSlug(kind), ico, title: kind, sub: months.length ? months.slice(0, 3).join(", ") + (months.length > 3 ? " and earlier" : "") : "",
    lesson: from.length ? from[0].id : undefined, q: "", pairs };
}).filter(caOk);
const CA_MONTH_DECKS = caLessons.map(l => ({
  id: "m-" + l.id, ico: "🗓️", title: (CA_MONTHS[caNum(l.id) - 1] || l.id) + " 2026", sub: "The whole month — every table", lesson: l.id, q: "",
  pairs: caTables(l).flatMap(t => labRows(l.id, t.n))
})).filter(caOk);
const CA_DECKS = CA_KIND_DECKS.concat(CA_MONTH_DECKS);
const CA_MIX = CA_KIND_DECKS.length ? CA_KIND_DECKS : CA_MONTH_DECKS;      // the kind decks already hold every row once
const caMatch = ["k-appointments", "k-awards-and-honours", "k-sports"].map(id => CA_DECKS.find(d => d.id === id))
  .find(d => d && d.pairs.filter((p, i, a) => a.filter(x => x[1] === p[1]).length === 1).length >= 6);
const LAB_CONF = {
  title: "News Lab", blurb: "Sixty seconds of the year's news at a time — who, where, what and when. Every right answer earns XP.",
  ranks: [[0,"Reader","📰"],[60,"Reporter","🗞️"],[200,"Correspondent","🎙️"],[450,"Editor","✒️"],[900,"Editor-in-Chief","🏛️"]],
  decks: CA_DECKS.length ? CA_DECKS.concat([{ id: "mix", ico: "🎲", title: "Grand Mix", sub: "Every month at once — the real exam feel", q: "", make: () => labMix(CA_MIX), list: () => CA_MIX.flatMap(d => d.pairs) }]) : [],
  match: caMatch ? { deck: caMatch.id, title: "Pair each " + caMatch.title.toLowerCase() + " item with its fact", sub: "Flip cards — " + caMatch.title.toLowerCase() + " from the latest months" } : undefined
};

</script>

:root[data-skin] body{background-color:var(--app-bg);background-image:var(--app-pattern);background-size:var(--app-psize);background-attachment:fixed}
:root[data-skin] h1,:root[data-skin] h2{letter-spacing:-.01em}

/* ===== Desktop layout (PC / tablet landscape) ===== */
@media (min-width: 1024px){
  :root{--side:236px}
  body{padding-left:var(--side);font-size:16.5px}
  .top{border-bottom:1px solid var(--rule)}
  .top-in{max-width:1320px;padding:16px 36px}
  .brand{font-size:21px}
  .brand small{font-size:13px}
  .stat{font-size:13px}
  .wrap{max-width:1320px;padding:0 36px 56px}
  .view{padding-top:28px}
  h1{font-size:34px} h2{font-size:22px} h3{font-size:17px}

  /* bottom tab bar becomes a left sidebar */
  .nav{top:0;bottom:0;left:0;right:auto;width:var(--side);height:auto;border-top:0;border-right:1px solid var(--rule);padding:84px 14px 20px;display:block;overflow:auto}
  .nav-in{display:flex;flex-direction:column;gap:4px;height:auto;max-width:none;margin:0}
  .nav-in::before{content:"Sections";display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:0 14px 8px}
  .nav button{flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-size:15px;min-height:0;height:auto;width:100%;text-align:left}
  .nav button svg{width:20px;height:20px;flex-shrink:0}
  .nav button:hover{background:var(--sunk)}
  .nav button[aria-current="page"]{background:var(--blue-bg)}
  .nav button[aria-current="page"] span{border-bottom:0!important}

  /* home: intro beside progress */
  .hero{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);column-gap:48px;align-items:end;padding-bottom:10px}
  .hero > .eyebrow,.hero > h1,.hero > p{grid-column:1}
  .hero > .meter{grid-column:2;grid-row:3;align-self:center}
  .hero > .row{grid-column:2;grid-row:2;align-self:end}

  /* lesson reader: facts, timelines, tricks sit side by side */
  .lhead{margin-bottom:0}
  .steps{max-width:640px}
  .steps + .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .steps + .stack > .plain,.steps + .stack > .row,.steps + .stack > p,.steps + .stack > .fig,.steps + .stack > h2,.steps + .stack > .tbl{grid-column:1/-1}
  .steps + .stack > .plain{max-width:86ch;font-size:17px}
  .steps + .stack > .hot,.steps + .stack > .story{grid-column:1/-1}
  .steps + .stack > .story{max-width:none;padding:20px 24px;font-size:17.5px}
  .steps + .stack > .story p{max-width:80ch}
  .steps + .stack:not(:has(> .block ~ .block)) > .block{grid-column:1/-1}
  .block,.qcard{padding:18px 20px;border-radius:14px}

  /* quizzes and question bank */
  #lq > .stack{display:grid;grid-template-columns:minmax(0,1fr);max-width:980px;gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qt{font-size:18px}
  #plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #plist .opts{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:wrap;overflow:visible}

  /* mock test: question with the answer grid alongside */
  .mbar{top:calc(env(safe-area-inset-top,0px) + 67px)}
  .view > .qcard{max-width:1000px}
  .view > .row.between{max-width:1000px}
  .view > #msub{max-width:1000px;width:100%}
  .view > .block.stack{max-width:760px}
  .pal{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .kpis{max-width:760px}

  /* revise: summary cards and sheets in columns */
  #rv > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #rv > .stack > .grph,#rv > .stack > p,#rv > .stack > .search,#rv > .stack > .callout{grid-column:1/-1}
  #dgl,#lml,#tll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #dgl > .grph,#dgl > p,#lml > p,#tll > .grph{grid-column:1/-1}
  #rv .search,#rv > #dgl ~ .search{max-width:520px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flash{min-height:300px;max-width:760px;margin:0 auto;padding:32px 36px}
  .flash .front{font-size:22px}

  /* learn: era cards across the top */
  .eras{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}
  .les{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}

</style>
<script id="shabd-deeplink">
(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();
</script>
</body>
</html>

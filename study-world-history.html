{"id":"L36","g":"wld","heat":1,"title":"The ancient world to the Age of Discovery","hi":"प्राचीन विश्व से खोज-यात्राओं के युग तक","blocks":[{"k":"hot","h":"An occasional one-mark question: <b>which river ↔ which civilisation<\/b>, <b>Alexander and Porus<\/b>, <b>Magna Carta 1215<\/b>, <b>Martin Luther 1517<\/b> or <b>who discovered what<\/b>. Learn the dates in the timeline and you are covered."},{"k":"story","h":"<p>The first cities grew up beside big rivers, because rivers gave water, fertile mud and an easy road for trade. In <b>Mesopotamia<\/b> ('land between the rivers' — the Tigris and Euphrates, today's Iraq) people pressed wedge-shaped <b>cuneiform<\/b> marks into clay, and King <b>Hammurabi<\/b> of Babylon carved one of the first written law codes. <b>Egypt<\/b> grew along the <b>Nile<\/b>, wrote in picture-signs called <b>hieroglyphics<\/b> and built the <b>pyramids<\/b>. China began on the <b>Huang He<\/b>, and India on the <b>Indus<\/b>.<\/p><p>Next came <b>Greece<\/b>, a land of small city-states. Athens tried <b>democracy<\/b>, and three teachers followed one another: <b>Socrates → Plato → Aristotle<\/b>. Aristotle taught <b>Alexander<\/b>, who reached India in <b>326 BCE<\/b> and fought <b>Porus<\/b> on the Jhelum. Then <b>Rome<\/b> rose: <b>Julius Caesar<\/b> was a general, and <b>Augustus<\/b> became the first emperor.<\/p><p>Jump to Europe after 1200: <b>Magna Carta (1215)<\/b> limited the king; Constantinople fell to the Turks (<b>1453<\/b>); the <b>Renaissance<\/b> and the printing press spread new ideas; <b>Luther<\/b> challenged the Church (<b>1517<\/b>); and sailors went looking for a sea route to India — <b>Columbus<\/b> found America instead (1492), <b>Vasco da Gama<\/b> reached Calicut (1498).<\/p>"},{"k":"table","title":"River-valley civilisations","head":["Civilisation","River","Writing","Famous for"],"rows":[["<b>Mesopotamia<\/b> (Sumer, Babylon) — Iraq","<b>Tigris and Euphrates<\/b>","<b>Cuneiform<\/b> (wedge marks on clay)","<b>Code of Hammurabi<\/b> (c. 1750 BCE); ziggurats; Epic of Gilgamesh; counting in 60s (hence 60 minutes); traded with the Indus people, whom they called Meluhha"],["<b>Egypt<\/b>","<b>Nile<\/b> — 'the gift of the Nile' (Herodotus)","<b>Hieroglyphics<\/b> on papyrus","<b>Pyramids<\/b> (Great Pyramid of Giza for Khufu), the Sphinx, mummies, pharaohs; the <b>Rosetta Stone<\/b> let Champollion read hieroglyphs (1822)"],["<b>China<\/b>","<b>Huang He<\/b> (Yellow River) — 'China's Sorrow'","Characters on oracle bones (Shang dynasty)","Silk; later the Great Wall (Qin Shi Huang) and paper (Han period)"],["<b>Indus / Harappan<\/b>","<b>Indus<\/b>","Indus script — undeciphered","Planned cities, drains, Great Bath (see the Harappan lesson)"]]},{"k":"worldfig","title":"The four river-valley civilisations","vb":"440 60 420 230","maxw":680,"minw":360,"pins":[["Mesopotamia",44.4,33,"Tigris–Euphrates · cuneiform",""],["Egypt",31.2,27,"Nile · hieroglyphs","l"],["Indus",68.1,27.3,"Harappa, Mohenjodaro",""],["China",112.5,35,"Huang He · oracle bones",""]],"cap":"All four grew on great rivers between about 3500 and 1500 BCE — the fertile soil and water made farming surplus, and cities, possible."},{"k":"photos","title":"The ancient world in pictures","items":[["Great_Pyramid_of_Giza","Great Pyramid of Giza","Egypt"],["Ziggurat_of_Ur","Ziggurat of Ur","Mesopotamia"],["Code_of_Hammurabi","Code of Hammurabi","Babylon"],["Great_Wall_of_China","Great Wall of China","China"],["Parthenon","Parthenon","Athens"],["Colosseum","Colosseum","Rome"]]},{"k":"facts","title":"Greece and Rome","rows":[["City-state (<i>polis<\/i>)","Athens (democracy) and Sparta (military state) were the two leaders"],["Athenian democracy","<b>Cleisthenes<\/b> (508 BCE) is its father; it peaked under <b>Pericles<\/b>"],["<b>Socrates<\/b>","Taught by questioning; sentenced to drink hemlock (399 BCE)"],["<b>Plato<\/b>","Pupil of Socrates; wrote <i>The Republic<\/i>; founded the Academy"],["<b>Aristotle<\/b>","Pupil of Plato; tutor of Alexander; wrote <i>Politics<\/i>; founded the Lyceum"],["Other 'fathers'","<b>Herodotus<\/b> — history; <b>Hippocrates<\/b> — medicine"],["<b>Alexander<\/b>","Son of Philip II of Macedon; Ambhi of Taxila submitted; beat <b>Porus<\/b> at the <b>Battle of the Hydaspes (Jhelum), 326 BCE<\/b>; his army refused to cross the <b>Beas<\/b>; died at Babylon, 323 BCE"],["<b>Julius Caesar<\/b>","Crossed the Rubicon (49 BCE); 'Veni, vidi, vici'; Julian calendar; killed on the Ides of March, 44 BCE; July is named after him"],["<b>Augustus<\/b> (Octavian)","<b>First Roman emperor<\/b>, 27 BCE; began the Pax Romana; August is named after him"],["Later Rome","<b>Constantine<\/b> — first Christian emperor, founded Constantinople (330 CE); the Western Empire fell in <b>476 CE<\/b>"]]},{"k":"table","title":"Founders of religions","head":["Founder","Faith","Place","Book · fact"],"rows":[["<b>Zoroaster<\/b> (Zarathustra)","Zoroastrianism","Persia (Iran)","<i>Avesta<\/i>; god Ahura Mazda; fire temples; followers in India are the Parsis"],["<b>Confucius<\/b> (551–479 BCE)","Confucianism","China","<i>Analects<\/i>; a contemporary of the Buddha and Mahavira"],["<b>Lao Tzu<\/b>","Taoism","China","<i>Tao Te Ching<\/i>"],["<b>Moses<\/b>","Judaism","Israel","<i>Torah<\/i>"],["<b>Jesus Christ<\/b>","Christianity","Born at Bethlehem; crucified at Jerusalem","<i>Bible<\/i>; born in the reign of Augustus"],["<b>Prophet Muhammad<\/b>","Islam","Born at Mecca (c. 570 CE); died at Medina (632 CE)","<i>Quran<\/i>; the <b>Hijra<\/b>, his migration from Mecca to Medina in <b>622 CE<\/b>, begins the Islamic calendar"]]},{"k":"worldfig","title":"Where the great religions began","vb":"440 60 420 230","maxw":680,"minw":360,"pins":[["Zoroastrianism",53,32,"Persia",""],["Confucianism",117,35.6,"Qufu, China",""],["Judaism, Christianity",35.2,31.8,"Jerusalem, Bethlehem","l"],["Islam",39.8,21.4,"Mecca, Medina",""],["Buddhism",83.3,27.5,"Lumbini",""],["Jainism",85.2,25.9,"Vaishali","l"],["Taoism",112,30,"China" <b>Bartolomeu Dias<\/b> rounds the Cape of Good Hope"],["1492","<b>Columbus<\/b>, sailing for <b>Spain<\/b>, reaches the Bahamas — the 'West Indies'; America is later named after Amerigo Vespucci"],["1494","Treaty of Tordesillas divides new lands between Spain and Portugal"],["1498","<b>Vasco da Gama<\/b> reaches <b>Calicut<\/b> (see the European companies lesson)"],["1500","<b>Pedro Alvares Cabral<\/b> reaches <b>Brazil<\/b> for Portugal, then sails on to Calicut"],["1517","<b>Martin Luther<\/b>'s Ninety-five Theses"],["1519–22","<b>Magellan's<\/b> expedition makes the first voyage round the world; he names the <b>Pacific<\/b>, is killed in the Philippines (1521), and <b>Elcano<\/b> brings the ship <i>Victoria<\/i> home"]]},{"k":"worldfig","title":"The voyages of discovery","minw":640,"under":"<defs><marker id=\"wayw0e4h\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"#c0392b\"/><\/marker><\/defs><path d=\"M450.6,130.6L412.5,155.6L343.1,172.2L258.3,166.7\" fill=\"none\" stroke=\"#c0392b\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\".85\" marker-end=\"url(#wayw0e4h)\" style=\"vector-effect:non-scaling-stroke\"/><path d=\"M450.6,130.6L412.5,155.6L343.1,172.2L258.3,166.7\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1\" stroke-dasharray=\"2 7\" style=\"animation:rvflow 1.2s linear infinite;vector-effect:non-scaling-stroke\"/><text x=\"306.9\" y=\"141.7\" font-size=\"8.5\" font-weight=\"700\" style=\"fill:#c0392b;paint-order:stroke;stroke:var(--sheet);stroke-width:2.5px\">Columbus 1492<\/text><defs><marker id=\"wad1tp5y\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"#2f6db5\"/><\/marker><\/defs><path d=\"M442.8,125.8L412.5,205.6L454.2,288.9L519.4,333.3L565.3,302.8L579.2,241.7L629.2,211.1L678.6,201.9\" fill=\"none\" stroke=\"#2f6db5\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\".85\" marker-end=\"url(#wad1tp5y)\" style=\"vector-effect:non-scaling-stroke\"/><path d=\"M442.8,125.8L412.5,205.6L454.2,288.9L519.4,333.3L565.3,302.8L579.2,241.7L629.2,211.1L678.6,201.9\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1\" stroke-dasharray=\"2 7\" style=\"animation:rvflow 1.2s linear infinite;vector-effect:non-scaling-stroke\"/><text x=\"459.7\" y=\"311.1\" font-size=\"8.5\" font-weight=\"700\" style=\"fill:#2f6db5;paint-order:stroke;stroke:var(--sheet);stroke-width:2.5px\">Vasco da Gama 1498<\/text><defs><marker id=\"wa9x1j5u\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"#2f8f4e\"/><\/marker><\/defs><path d=\"M450.6,131.1L384.7,233.3L329.2,316.7L277.8,380L190.3,316.7L4.2,255.6\" fill=\"none\" stroke=\"#2f8f4e\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\".85\" marker-end=\"url(#wa9x1j5u)\" style=\"vector-effect:non-scaling-stroke\"/><path d=\"M450.6,131.1L384.7,233.3L329.2,316.7L277.8,380L190.3,316.7L4.2,255.6\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1\" stroke-dasharray=\"2 7\" style=\"animation:rvflow 1.2s linear infinite;vector-effect:non-scaling-stroke\"/><text x=\"51.4\" y=\"288.9\" font-size=\"8.5\" font-weight=\"700\" style=\"fill:#2f8f4e;paint-order:stroke;stroke:var(--sheet);stroke-width:2.5px\">Magellan 1519–22<\/text><defs><marker id=\"wapm0dt6\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"#2f8f4e\"/><\/marker><\/defs><path d=\"M995.8,250L912.5,211.1L812.5,204.2\" fill=\"none\" stroke=\"#2f8f4e\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\".85\" marker-end=\"url(#wapm0dt6)\" style=\"vector-effect:non-scaling-stroke\"/><path d=\"M995.8,250L912.5,211.1L812.5,204.2\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1\" stroke-dasharray=\"2 7\" style=\"animation:rvflow 1.2s linear infinite;vector-effect:non-scaling-stroke\"/>","pins":[["Calicut",75.78,11.25,"1498",""],["Lisbon",-9.14,38.72,"","l"],["Bahamas",-75.5,24,"1492","l"],["Philippines",124,10.5,"Magellan killed, 1521",""]],"cap":"Red: Columbus reached the Bahamas (1492). Blue: Vasco da Gama rounded the Cape of Good Hope to Calicut (1498). Green: Magellan's fleet crossed the Pacific; after his death in the Philippines, Elcano completed the first voyage round the world (1522). Routes simplified."},{"k":"trick","h":"<b>River ↔ civilisation<\/b>: <span class=\"mn\">TE-M, N-E, H-C<\/span> — Tigris–Euphrates = Mesopotamia, Nile = Egypt, Huang He = China.<br><b>Greek chain<\/b>: <span class=\"mn\">S → P → A → A<\/span> — Socrates taught Plato, Plato taught Aristotle, Aristotle taught Alexander.<br><b>Explorers in order<\/b>: <span class=\"mn\">D-C-V-C-M<\/span> — 'Dear Children, Visit Calicut by Map' = Dias 1488, Columbus 1492, Vasco 1498, Cabral 1500, Magellan 1519."},{"k":"trap","h":"<b>Columbus sailed for Spain<\/b>, not Portugal, and never reached India. <b>Magellan died on the way<\/b> — the voyage was finished by <b>Elcano<\/b>. <b>Julius Caesar was never emperor<\/b>; <b>Augustus<\/b> was the first. The <b>Hydaspes is the Jhelum<\/b>, but the river where Alexander's army <b>stopped<\/b> is the <b>Beas<\/b>. <b>Cuneiform = Mesopotamia<\/b>, <b>hieroglyphics = Egypt<\/b>. <b>Magna Carta<\/b> is 1215 (King John), not the 1689 Bill of Rights."}],"sum":["Mesopotamia grew on the Tigris and Euphrates with cuneiform writing and Hammurabi's code; Egypt on the Nile with hieroglyphics and pyramids; China on the Huang He.","Socrates taught Plato, Plato taught Aristotle, and Aristotle taught Alexander, who defeated Porus on the Hydaspes (Jhelum) in 326 BCE and turned back at the Beas.","Julius Caesar was killed in 44 BCE and Augustus became the first Roman emperor in 27 BCE; the Prophet's Hijra to Medina in 622 CE begins the Islamic calendar.","Magna Carta came in 1215, Constantinople fell in 1453, Gutenberg built his press around 1440, and Martin Luther posted his Ninety-five Theses in 1517.","Dias rounded the Cape in 1488, Columbus reached America in 1492, Vasco da Gama reached Calicut in 1498, Cabral reached Brazil in 1500, and Magellan's voyage of 1519 to 1522 was the first round the world."]},
{"id":"L29","g":"wld","heat":2,"title":"World revolutions & the World Wars","hi":"विश्व क्रांतियाँ एवं विश्व युद्ध","blocks":[{"k":"hot","h":"Usually one question — most often the French Revolution's slogan/date, the Russian Revolution's year and leader, or a World War treaty. Dates and \"who said what\" are enough."},{"k":"story","h":"<p>Indian history did not happen alone, and the exam asks about a few big world events. Start with the revolutions, which share one idea: people, not kings alone, should decide how they are ruled. In England (1688) Parliament became supreme. In America (1776) colonists refused taxes without a say and declared independence. In <b>France (1789)<\/b> people stormed the Bastille under the slogan Liberty, Equality, Fraternity. In <b>Russia (1917)<\/b> the Tsar fell and Lenin's Bolsheviks took power. Meanwhile the Industrial Revolution in England brought machines and factories.<\/p><p>In 1914 an assassination at Sarajevo set off the <b>First World War<\/b>. It ended in 1918, and the Treaty of Versailles punished Germany hard. The League of Nations was set up to keep the peace, but it failed. Germany's anger at Versailles helped <b>Hitler<\/b> rise. In 1939 Germany invaded Poland, and the <b>Second World War<\/b> began. The USA joined after Japan attacked Pearl Harbor in 1941. The war ended in 1945, after atom bombs fell on Hiroshima and Nagasaki.<\/p><p>To stop another such war, the United Nations was set up in 1945, with India among its founding members. The tables list the dates, slogans and treaties to remember.<\/p>","key":"Revolutions spread the idea of rule by the people, and two World Wars, linked by the harsh Treaty of Versailles, ended with the founding of the UN."},{"k":"facts","title":"Revolutions","rows":[["<b>Glorious Revolution<\/b>","<b>1688<\/b>, England — bloodless; the Bill of Rights (1689) made Parliament supreme"],["<b>American Revolution<\/b>","<b>1775–83<\/b>; Boston Tea Party <b>1773<\/b>; <b>Declaration of Independence 4 July 1776<\/b> (drafted by <b>Thomas Jefferson<\/b>); slogan \"<b>No taxation without representation<\/b>\"; Treaty of Paris 1783; first President <b>George Washington<\/b>"],["<b>French Revolution<\/b>","<b>1789<\/b> — fall of the <b>Bastille, 14 July 1789<\/b>; slogan \"<b>Liberty, Equality, Fraternity<\/b>\"; thinkers <b>Rousseau<\/b> (<i>Social Contract<\/i>), <b>Voltaire<\/b>, <b>Montesquieu<\/b> (separation of powers); the Reign of Terror (Robespierre); Napoleon took over in 1799"],["<b>Industrial Revolution<\/b>","Began in <b>England<\/b>, ~1760; <b>James Watt<\/b> — steam engine; Hargreaves — spinning jenny; Arkwright — water frame; Crompton — mule; Cartwright — power loom; Stephenson — railway engine (Rocket)"],["<b>Russian Revolution<\/b>","<b>1917<\/b> — the <b>February (March) Revolution<\/b> ended Tsar <b>Nicholas II<\/b>; the <b>October (November) Revolution<\/b> brought the <b>Bolsheviks<\/b> under <b>Lenin<\/b> to power; slogan \"<b>Peace, Land and Bread<\/b>\"; Treaty of Brest-Litovsk 1918; USSR formed 1922"],["<b>Chinese Revolution<\/b>","1911 — Sun Yat-sen ends the Manchu dynasty; <b>1949<\/b> — <b>Mao Zedong<\/b> founds the People's Republic; Long March 1934–35"],["<b>Meiji Restoration<\/b>","1868, Japan — modernisation under the Emperor"],["Unifications","<b>Italy<\/b> — Mazzini, <b>Garibaldi<\/b>, Cavour, 1870; <b>Germany<\/b> — <b>Bismarck<\/b> (\"blood and iron\"), 1871"]]},{"k":"worldfig","title":"Revolutions that changed the world","minw":640,"pins":[["1",-0.13,51.5,"Glorious Revolution","n"],["2",-75.16,39.95,"American Revolution","n"],["3",2.35,48.86,"French Revolution","n"],["4",-2.24,53.48,"Industrial Revolution","n"],["5",30.3,59.93,"Russian Revolution","n"],["6",116.4,39.9,"Chinese Revolution","n"],["7",139.7,35.7,"Meiji Restoration","n"],["8",12.5,41.9,"Unifications","n"]],"legend":[["1 Glorious Revolution","London, 1688"],["2 American Revolution","Philadelphia, 1776"],["3 French Revolution","Paris, 1789"],["4 Industrial Revolution","England, c. 1760"],["5 Russian Revolution","Petrograd, 1917"],["6 Chinese Revolution","1911 and 1949"],["7 Meiji Restoration","Japan, 1868"],["8 Unifications","Italy 1870, Germany 1871"]],"cap":"Four of the eight began in Europe. The French Revolution's slogan: Liberty, Equality, Fraternity."},{"k":"photos","title":"Revolutions in pictures","items":[["Storming_of_the_Bastille","Storming of the Bastille","14 July 1789"],["Boston_Tea_Party","Boston Tea Party","1773"],["United_States_Declaration_of_Independence","Declaration of Independence","4 July 1776"],["Vladimir_Lenin","Vladimir Lenin","October 1917"],["Sun_Yat-sen","Sun Yat-sen","1911"],["Giuseppe_Garibaldi","Giuseppe Garibaldi","Italy"]]},{"k":"facts","title":"First World War (1914–18)","rows":[["Immediate cause","Assassination of <b>Archduke Franz Ferdinand<\/b> at <b>Sarajevo, 28 June 1914<\/b>, by Gavrilo Princip"],["Sides","<b>Allies<\/b> — Britain, France, Russia, later Italy, Japan, USA (1917) · <b>Central Powers<\/b> — Germany, Austria-Hungary, Ottoman Turkey, Bulgaria"],["Ended","<b>11 November 1918<\/b>; <b>Treaty of Versailles, 28 June 1919<\/b> — punished Germany (war guilt clause, reparations, loss of colonies)"],["<b>League of Nations<\/b>","Set up <b>1920<\/b>, HQ <b>Geneva<\/b>, proposed by US President <b>Woodrow Wilson<\/b> (his <b>Fourteen Points<\/b>); the USA never joined; it failed and was dissolved in 1946"]]},{"k":"cards","title":"The two World Wars at a glance","rows":[["First World War","1914–18","Spark: Archduke Franz Ferdinand shot at Sarajevo (28 June 1914). Ended by the Treaty of Versailles (1919); League of Nations formed.","⚔️"],["Allies (WW I)","Britain, France, Russia","Later Italy, Japan and the USA (1917).","🤝"],["Central Powers","Germany, Austria-Hungary","With the Ottoman Empire and Bulgaria.","🛡️"],["Second World War","1939–45","Began with Germany's invasion of Poland (1 Sept 1939). Atom bombs on Hiroshima (6 Aug) and Nagasaki (9 Aug 1945); the UN was born.","💣"],["Allies (WW II)","Britain, France, USSR, USA, China","The USA joined after Pearl Harbor (7 Dec 1941).","🤝"],["Axis","Germany, Italy, Japan","Hitler, Mussolini, Tojo.","🛡️"]]},{"k":"photos","title":"The wars in pictures","items":[["Assassination_of_Archduke_Franz_Ferdinand","Sarajevo, 1914","Sarajevo, 1914"],["Treaty_of_Versailles","Treaty of Versailles","1919"],["Normandy_landings","Normandy landings","D-Day, 1944"],["Attack_on_Pearl_Harbor","Attack on Pearl Harbor","1941"],["Atomic_bombings_of_Hiroshima_and_Nagasaki","Hiroshima","August 1945"]]},{"k":"facts","title":"Second World War (1939–45)","rows":[["Cause","Germany's invasion of <b>Poland, 1 September 1939<\/b>; the harshness of Versailles and the rise of <b>Hitler<\/b> (Nazi), <b>Mussolini<\/b> (Fascist) and Japan"],["Sides","<b>Allies<\/b> — Britain, France, USSR, USA, China · <b>Axis<\/b> — Germany, Italy, Japan"],["Turning points","Pearl Harbor (<b>7 Dec 1941<\/b>) brought in the USA; Stalingrad (1942–43); <b>D-Day, 6 June 1944<\/b>"],["End","Germany surrendered <b>8 May 1945<\/b> (VE Day); atom bombs on <b>Hiroshima (6 Aug 1945, \"Little Boy\")<\/b> and <b>Nagasaki (9 Aug 1945, \"Fat Man\")<\/b>; Japan surrendered <b>2 September 1945<\/b>"],["<b>United Nations<\/b>","Charter signed <b>26 June 1945<\/b> at San Francisco; came into force <b>24 October 1945<\/b> — <b>UN Day<\/b>; HQ <b>New York<\/b>; 51 founding members, India among them"],["After","<b>Cold War<\/b>; NATO 1949, Warsaw Pact 1955; Berlin Wall 1961–1989; USSR dissolved 1991"]]},{"k":"trick","h":"<b>War dates<\/b> — \"<b>14 to 18, 39 to 45<\/b>\"; each war ends with a treaty town: WWI → <b>Versailles<\/b>, WWII → <b>no single treaty<\/b> (Potsdam/Yalta conferences instead).<br><b>League vs UN<\/b>: <b>League = Geneva, 1920, after WWI<\/b>; <b>UN = New York, 1945, after WWII<\/b>."},{"k":"trap","h":"The <b>October Revolution<\/b> of 1917 is the one that brought the Bolsheviks to power (it falls in November by the modern calendar). <b>Woodrow Wilson proposed the League of Nations but the USA never joined it.<\/b> <b>Hiroshima<\/b> came first (6 Aug), Nagasaki second (9 Aug)."}],"sum":["American Revolution: Boston Tea Party 1773, Declaration of Independence 4 July 1776 (Jefferson), 'no taxation without representation'.","French Revolution 1789: Bastille fell 14 July 1789; 'Liberty, Equality, Fraternity'; Rousseau, Voltaire, Montesquieu.","Russian Revolution 1917: February ended Tsar Nicholas II; October brought Lenin's Bolsheviks; slogan 'Peace, Land and Bread'.","WWI 1914–18: triggered at Sarajevo 28 June 1914; Treaty of Versailles 28 June 1919; League of Nations 1920 at Geneva (Woodrow Wilson's idea; USA never joined).","WWII 1939–45: began with Poland 1 Sept 1939; Pearl Harbor 7 Dec 1941; D-Day 6 June 1944; Hiroshima 6 Aug & Nagasaki 9 Aug 1945; UN came into force 24 Oct 1945."]},
{"id":"L30","g":"wld","heat":3,"title":"Travellers, titles, books & slogans","hi":"यात्री · उपाधियाँ · पुस्तकें · नारे","blocks":[{"k":"hot","h":"This is a pure-marks lesson: SSC loves \"who was called X\", \"who wrote Y\", \"who gave the slogan Z\". Nothing to understand — only to recall. Read it last before the exam."},{"k":"story","h":"<p>This lesson has no story of its own. It collects who-is-who facts from every other lesson: travellers, titles, slogans and books. The best way to learn it is to hang each item on a story you already know.<\/p><p><b>Travellers<\/b>: put them on the line of kings. Megasthenes comes to Chandragupta Maurya, Fa-Hien to Chandragupta II, Hiuen Tsang to Harsha, Al-Beruni with Mahmud of Ghazni, Ibn Battuta to Muhammad bin Tughlaq, Domingo Paes to Krishnadeva Raya, and Englishmen like Thomas Roe to Jahangir. If you can say the kings in order, the travellers follow.<\/p><p><b>Titles<\/b>: group them by era. Older ones: Indian Napoleon (Samudragupta), Parrot of India (Amir Khusrau), Tiger of Mysore (Tipu). Freedom-era ones: Grand Old Man (Naoroji), Lokmanya (Tilak), Netaji (Bose), Sardar (Patel). <b>Slogans<\/b>: link each to its movement. Swaraj is my birthright goes with Tilak and the Extremists, Do or Die with Gandhi and Quit India, Give me blood with Bose and the INA. <b>Books<\/b>: pair each writer with his age, from Kautilya's Arthashastra and Abul Fazl's Ain-i-Akbari to Gandhi's Hind Swaraj. Read this lesson last, as revision before the exam.<\/p>","key":"Hang every traveller, title, slogan and book on a king or a movement you already know, and revise this lesson last."},{"k":"table","title":"Foreign travellers — who, when, under whom","head":["Traveller","From","Came under","Book"],"rows":[["<b>Megasthenes<\/b>","Greece","Chandragupta Maurya","<i>Indica<\/i>"],["Deimachus","Greece","Bindusara","—"],["Dionysius","Greece (Ptolemy's envoy)","Ashoka","—"],["<b>Fa-Hien<\/b>","China","Chandragupta II","<i>Fo-Kuo-Ki<\/i>"],["<b>Hiuen Tsang<\/b>","China","Harshavardhana","<i>Si-Yu-Ki<\/i>"],["<b>I-tsing<\/b>","China","late 7th c.","—"],["<b>Al-Beruni<\/b>","Persia","came with Mahmud of Ghazni","<i>Kitab-ul-Hind / Tahqiq-i-Hind<\/i>"],["<b>Marco Polo<\/b>","Venice","Pandya kingdom, 13th c.","<i>The Book of Ser Marco Polo<\/i>"],["<b>Ibn Battuta<\/b>","Morocco","Muhammad bin Tughlaq","<i>Rehla / Kitab-ul-Rehla<\/i>"],["<b>Nicolo Conti<\/b>","Italy","Devaraya I (Vijayanagara)","—"],["<b>Abdur Razzaq<\/b>","Persia","Devaraya II","—"],["<b>Athanasius Nikitin<\/b>","Russia","Bahmani kingdom","—"],["<b>Domingo Paes<\/b> &amp; Nuniz","Portugal","Krishnadeva Raya","—"],["<b>Ralph Fitch<\/b>","England","Akbar","—"],["<b>William Hawkins<\/b> / <b>Thomas Roe<\/b>","England","Jahangir","—"],["<b>Bernier<\/b> / <b>Tavernier<\/b> / <b>Manucci<\/b>","France / France / Italy","Shah Jahan (&amp; Aurangzeb)","<i>Travels in the Mogul Empire<\/i> / <i>Travels in India<\/i> / <i>Storia do Mogor<\/i>"]]},{"k":"worldfig","title":"Where the travellers came from","vb":"380 40 520 260","maxw":700,"minw":360,"under":"<defs><marker id=\"wa6rn5hd\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"#c0392b\"/><\/marker><\/defs><path d=\"M533.9,127.8L609.3,133.3L684.7,172.2\" fill=\"none\" stroke=\"#c0392b\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\".85\" marker-end=\"url(#wa6rn5hd)\" style=\"vector-effect:non-scaling-stroke\"/><path d=\"M533.9,127.8L609.3,133.3L684.7,172.2\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1\" stroke-dasharray=\"2 7\" style=\"animation:rvflow 1.2s linear infinite;vector-effect:non-scaling-stroke\"/><defs><marker id=\"wabp632z\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"#2f6db5\"/><\/marker><\/defs><path d=\"M770.6,138.1L727.6,138.5L684.7,172.2\" fill=\"none\" stroke=\"#2f6db5\" stroke-width=\"3\" stroke-linecap=\"ro

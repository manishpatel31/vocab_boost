<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>

<title>World History &amp; Who’s Who</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Shared by every History page (built by tools/history/build.js).
   Layout: a manuscript folio — parchment paper, maroon ink, gold figures; one-column app with a bottom tab bar. */
:root{
  --paper:#f3efe4; --sheet:#fffdf6; --sunk:#e8e1cf;
  --ink:#241c14; --ink2:#5d5141; --rule:#d8cdb4;
  --blue:#7a2230; --on-blue:#ffffff; --blue-bg:#f4e2e1;
  --accent:#9a6a12; --accent-bg:#f8ecc9;
  --good:#1b6b4a; --good-bg:#ddefe4; --bad:#a8291f; --bad-bg:#f8e0dc;
  --warn-bg:#fcf0cf;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* era groups on the Learn screen */
.eras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.erac{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:grid;gap:6px}
.erac b{font-family:var(--f-display);font-size:15px;font-weight:700;line-height:1.25}
.erac .hi{font-size:12px;color:var(--ink2)}
.erac .mt{font-family:var(--f-num);font-size:11px;color:var(--ink2)}
.erac .meter{height:6px}
.erac[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.grph{display:flex;align-items:baseline;gap:8px;padding:14px 2px 4px;border-top:2px solid var(--ink);margin-top:4px}
.grph h2{font-size:17px}
.grph span{font-size:12px;color:var(--ink2);margin-left:auto;font-family:var(--f-num)}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}
.dots{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--rule);display:block}
.dots i.on{background:var(--accent)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.hot{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px;font-size:15px}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.facts.prose dd{font-weight:400;line-height:1.55}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap,.link{border-radius:var(--r);padding:12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.link{background:var(--sunk);border-color:transparent}
.trick .lab,.trap .lab,.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.link .lab{color:var(--ink2)}
.mn{font-family:var(--f-num);font-weight:600;background:var(--sheet);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.tag.src{background:var(--good-bg);color:var(--good)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:22px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
/* one-line revision rows (last week / last moment) */
.lines{display:grid;gap:0}
.lines div{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px dashed var(--rule);font-size:15px}
.lines div:first-child{border-top:0}
.lines b{font-weight:700}
.lines span{color:var(--ink2)}
.callout{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;font-size:15px}

/* plan maker */
.plancfg{display:grid;gap:12px}
.pday{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.pday > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pday > summary::-webkit-details-marker{display:none}
.pday .dno{font-family:var(--f-num);font-weight:700;font-size:13px;background:var(--sunk);border-radius:99px;padding:2px 10px;white-space:nowrap}
.pday.cur .dno{background:var(--blue);color:var(--on-blue)}
.pday.allgood .dno{background:var(--good-bg);color:var(--good)}
.pday .dt{min-width:0;font-weight:600;font-size:15px}
.pday .dt small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
.pday .dp{font-family:var(--f-num);font-size:12px;color:var(--ink2);white-space:nowrap}
.pday .body{padding:0 14px 12px;display:grid;gap:8px;border-top:1px dashed var(--rule);margin-top:2px;padding-top:10px}
.ptask{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;width:100%;font-size:15px}
.ptask .box{width:22px;height:22px;border-radius:6px;border:1.6px solid var(--rule);display:grid;place-items:center;font-size:14px;color:var(--on-blue);margin-top:1px}
.ptask[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.ptask[aria-pressed="true"] .lbl{text-decoration:line-through;color:var(--ink2)}
.ptask .lbl small{display:block;font-size:12px;color:var(--ink2);text-decoration:none}
/* the story first: plain-language opener for beginners */
.story{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;font-size:16.5px;line-height:1.65}
.story .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.story p{margin:0}
.story .key{background:var(--blue-bg);border-radius:8px;padding:8px 12px;font-size:15px;line-height:1.5}
.story .key b{color:var(--blue)}
/* hub: app cards and the beginner path */
.appcs{display:grid;gap:12px}
.appc{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;text-align:left;width:100%;cursor:pointer}
.appc:hover{border-color:var(--blue)}
.appc .hd{display:flex;align-items:center;gap:10px}
.appc .ic{font-size:26px;line-height:1}
.appc .hd b{font-family:var(--f-display);font-size:17px;font-weight:700;display:block}
.appc .hd small{font-size:12px;color:var(--ink2)}

{"id":"L36","g":"wld","heat":1,"title":"The ancient world to the Age of Discovery","hi":"प्राचीन विश्व से खोज-यात्राओं के युग तक","blocks":[{"k":"hot","h":"An occasional one-mark question: <b>which river ↔ which civilisation<\/b>, <b>Alexander and Porus<\/b>, <b>Magna Carta 1215<\/b>, <b>Martin Luther 1517<\/b> or <b>who discovered what<\/b>. Learn the dates in the timeline and you are covered."},{"k":"story","h":"<p>The first cities grew up beside big rivers, because rivers gave water, fertile mud and an easy road for trade. In <b>Mesopotamia<\/b> ('land between the rivers' — the Tigris and Euphrates, today's Iraq) people pressed wedge-shaped <b>cuneiform<\/b> marks into clay, and King <b>Hammurabi<\/b> of Babylon carved one of the first written law codes. <b>Egypt<\/b> grew along the <b>Nile<\/b>, wrote in picture-signs called <b>hieroglyphics<\/b> and built the <b>pyramids<\/b>. China began on the <b>Huang He<\/b>, and India on the <b>Indus<\/b>.<\/p><p>Next came <b>Greece<\/b>, a land of small city-states. Athens tried <b>democracy<\/b>, and three teachers followed one another: <b>Socrates → Plato → Aristotle<\/b>. Aristotle taught <b>Alexander<\/b>, who reached India in <b>326 BCE<\/b> and fought <b>Porus<\/b> on the Jhelum. Then <b>Rome<\/b> rose: <b>Julius Caesar<\/b> was a general, and <b>Augustus<\/b> became the first emperor.<\/p><p>Jump to Europe after 1200: <b>Magna Carta (1215)<\/b> limited the king; Constantinople fell to the Turks (<b>1453<\/b>); the <b>Renaissance<\/b> and the printing press spread new ideas; <b>Luther<\/b> challenged the Church (<b>1517<\/b>); and sailors went looking for a sea route to India — <b>Columbus<\/b> found America instead (1492), <b>Vasco da Gama<\/b> reached Calicut (1498).<\/p>"},{"k":"table","title":"River-valley civilisations","head":["Civilisation","River","Writing","Famous for"],"rows":[["<b>Mesopotamia<\/b> (Sumer, Babylon) — Iraq","<b>Tigris and Euphrates<\/b>","<b>Cuneiform<\/b> (wedge marks on clay)","<b>Code of Hammurabi<\/b> (c. 1750 BCE); ziggurats; Epic of Gilgamesh; counting in 60s (hence 60 minutes); traded with the Indus people, whom they called Meluhha"],["<b>Egypt<\/b>","<b>Nile<\/b> — 'the gift of the Nile' (Herodotus)","<b>Hieroglyphics<\/b> on papyrus","<b>Pyramids<\/b> (Great Pyramid of Giza for Khufu), the Sphinx, mummies, pharaohs; the <b>Rosetta Stone<\/b> let Champollion read hieroglyphs (1822)"],["<b>China<\/b>","<b>Huang He<\/b> (Yellow River) — 'China's Sorrow'","Characters on oracle bones (Shang dynasty)","Silk; later the Great Wall (Qin Shi Huang) and paper (Han period)"],["<b>Indus / Harappan<\/b>","<b>Indus<\/b>","Indus script — undeciphered","Planned cities, drains, Great Bath (see the Harappan lesson)"]]},{"k":"worldfig","title":"The four river-valley civilisations","vb":"440 60 420 230","maxw":680,"minw":360,"pins":[["Mesopotamia",44.4,33,"Tigris–Euphrates · cuneiform",""],["Egypt",31.2,27,"Nile · hieroglyphs","l"],["Indus",68.1,27.3,"Harappa, Mohenjodaro",""],["China",112.5,35,"Huang He · oracle bones",""]],"cap":"All four grew on great rivers between about 3500 and 1500 BCE — the fertile soil and water made farming surplus, and cities, possible."},{"k":"photos","title":"The ancient world in pictures","items":[["Great_Pyramid_of_Giza","Great Pyramid of Giza","Egypt"],["Ziggurat_of_Ur","Ziggurat of Ur","Mesopotamia"],["Code_of_Hammurabi","Code of Hammurabi","Babylon"],["Great_Wall_of_China","Great Wall of China","China"],["Parthenon","Parthenon","Athens"],["Colosseum","Colosseum","Rome"]]},{"k":"facts","title":"Greece and Rome","rows":[["City-state (<i>polis<\/i>)","Athens (democracy) and Sparta (military state) were the two leaders"],["Athenian democracy","<b>Cleisthenes<\/b> (508 BCE) is its father; it peaked under <b>Pericles<\/b>"],["<b>Socrates<\/b>","Taught by questioning; sentenced to drink hemlock (399 BCE)"],["<b>Plato<\/b>","Pupil of Socrates; wrote <i>The Republic<\/i>; founded the Academy"],["<b>Aristotle<\/b>","Pupil of Plato; tutor <b>Bartolomeu Dias<\/b> rounds the Cape of Good Hope"],["1492","<b>Columbus<\/b>, sailing for <b>Spain<\/b>, reaches the Bahamas — the 'West Indies'; America is later named after Amerigo Vespucci"],["1494","Treaty of Tordesillas divides new lands between Spain and Portugal"],["1498","<b>Vasco da Gama<\/b> reaches <b>Calicut<\/b> (see the European companies lesson)"],["1500","<b>Pedro Alvares Cabral<\/b> reaches <b>Brazil<\/b> for Portugal, then sails on to Calicut"],["1517","<b>Martin Luther<\/b>'s Ninety-five Theses"],["1519–22","<b>Magellan's<\/b> expedition makes the first voyage round the world; he names the <b>Pacific<\/b>, is killed in the Philippines (1521), and <b>Elcano<\/b> brings the ship <i>Victoria<\/i> home"]]},{"k":"worldfig","title":"The voyages of discovery","minw":640,"under":"<defs><marker id=\"wayw0e4h\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"#c0392b\"/><\/marker><\/defs><path d=\"M450.6,130.6L412.5,155.6L343.1,172.2L258.3,166.7\" fill=\"none\" stroke=\"#c0392b\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\".85\" marker-end=\"url(#wayw0e4h)\" style=\"vector-effect:non-scaling-stroke\"/><path d=\"M450.6,130.6L412.5,155.6L343.1,172.2L258.3,166.7\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1\" stroke-dasharray=\"2 7\" style=\"animation:rvflow 1.2s linear infinite;vector-effect:non-scaling-stroke\"/><text x=\"306.9\" y=\"141.7\" font-size=\"8.5\" font-weight=\"700\" style=\"fill:#c0392b;paint-order:stroke;stroke:var(--sheet);stroke-width:2.5px\">Columbus 1492<\/text><defs><marker id=\"wad1tp5y\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"#2f6db5\"/><\/marker><\/defs><path d=\"M442.8,125.8L412.5,205.6L454.2,288.9L519.4,333.3L565.3,302.8L579.2,241.7L629.2,211.1L678.6,201.9\" fill=\"none\" stroke=\"#2f6db5\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\".85\" marker-end=\"url(#wad1tp5y)\" style=\"vector-effect:non-scaling-stroke\"/><path d=\"M442.8,125.8L412.5,205.6L454.2,288.9L519.4,333.3L565.3,302.8L579.2,241.7L629.2,211.1L678.6,201.9\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1\" stroke-dasharray=\"2 7\" style=\"animation:rvflow 1.2s linear infinite;vector-effect:non-scaling-stroke\"/><text x=\"459.7\" y=\"311.1\" font-size=\"8.5\" font-weight=\"700\" style=\"fill:#2f6db5;paint-order:stroke;stroke:var(--sheet);stroke-width:2.5px\">Vasco da Gama 1498<\/text><defs><marker id=\"wa9x1j5u\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"#2f8f4e\"/><\/marker><\/defs><path d=\"M450.6,131.1L384.7,233.3L329.2,316.7L277.8,380L190.3,316.7L4.2,255.6\" fill=\"none\" stroke=\"#2f8f4e\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\".85\" marker-end=\"url(#wa9x1j5u)\" style=\"vector-effect:non-scaling-stroke\"/><path d=\"M450.6,131.1L384.7,233.3L329.2,316.7L277.8,380L190.3,316.7L4.2,255.6\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1\" stroke-dasharray=\"2 7\" style=\"animation:rvflow 1.2s linear infinite;vector-effect:non-scaling-stroke\"/><text x=\"51.4\" y=\"288.9\" font-size=\"8.5\" font-weight=\"700\" style=\"fill:#2f8f4e;paint-order:stroke;stroke:var(--sheet);stroke-width:2.5px\">Magellan 1519–22<\/text><defs><marker id=\"wapm0dt6\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"#2f8f4e\"/><\/marker><\/defs><path d=\"M995.8,250L912.5,211.1L812.5,204.2\" fill=\"none\" stroke=\"#2f8f4e\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\".85\" marker-end=\"url(#wapm0dt6)\" style=\"vector-effect:non-scaling-stroke\"/><path d=\"M995.8,250L912.5,211.1L812.5,204.2\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1\" stroke-dasharray=\"2 7\" style=\"animation:rvflow 1.2s linear infinite;vector-effect:non-scaling-stroke\"/>","pins":[["Calicut",75.78,11.25,"1498",""],["Lisbon",-9.14,38.72,"","l"],["Bahamas",-75.5,24,"1492","l"],["Philippines",124,10.5,"Magellan killed, 1521",""]],"cap":"Red: Columbus reached the Bahamas (1492). Blue: Vasco da Gama rounded the Cape of Good Hope to Calicut (1498). Green: Magellan's fleet crossed the Pacific; after his death in the Philippines, Elcano completed the first voyage round the world (1522). Routes simplified."},{"k":"trick","h":"<b>River ↔ civilisation<\/b>: <span class=\"mn\">TE-M, N-E, H-C<\/span> — Tigris–Euphrates = Mesopotamia, Nile = Egypt, Huang He = China.<br><b>Greek chain<\/b>: <span class=\"mn\">S → P → A → A<\/span> — Socrates taught Plato, Plato taught Aristotle, Aristotle taught Alexander.<br><b>Explorers in order<\/b>: <span class=\"mn\">D-C-V-C-M<\/span> — 'Dear Children, Visit Calicut by Map' = Dias 1488, Columbus 1492, Vasco 1498, Cabral 1500, Magellan 1519."},{"k":"trap","h":"<b>Columbus sailed for Spain<\/b>, not Portugal, and never reached India. <b>Magellan died on the way<\/b> — the voyage was finished by <b>Elcano<\/b>. <b>Julius Caesar was never emperor<\/b>; <b>Augustus<\/b> was the first. The <b>Hydaspes is the Jhelum<\/b>, but the river where Alexander's army <b>stopped<\/b> is the <b>Beas<\/b>. <b>Cuneiform = Mesopotamia<\/b>, <b>hieroglyphics = Egypt<\/b>. <b>Magna Carta<\/b> is 1215 (King John), not the 1689 Bill of Rights."}],"sum":["Mesopotamia grew on the Tigris and Euphrates with cuneiform writing and Hammurabi's code; Egypt on the Nile with hieroglyphics and pyramids; China on the Huang He.","Socrates taught Plato, Plato taught Aristotle, and Aristotle taught Alexander, who defeated Porus on the Hydaspes (Jhelum) in 326 BCE and turned back at the Beas.","Julius Caesar was killed in 44 BCE and Augustus became the first Roman emperor in 27 BCE; the Prophet's Hijra to Medina in 622 CE begins the Islamic calendar.","Magna Carta came in 1215, Constantinople fell in 1453, Gutenberg built his press around 1440, and Martin Luther posted his Ninety-five Theses in 1517.","Dias rounded the Cape in 1488, Columbus reached America in 1492, Vasco da Gama reached Calicut in 1498, Cabral reached Brazil in 1500, and Magellan's voyage of 1519 to 1522 was the first round the world."]},
{"id":"L29","g":"wld","heat":2,"title":"World revolutions & the World Wars","hi":"विश्व क्रांतियाँ एवं विश्व युद्ध","blocks":[{"k":"hot","h":"Usually one question — most often the French Revolution's slogan/date, the Russian Revolution's year and leader, or a World War treaty. Dates and \"who said what\" are enough."},{"k":"story","h":"<p>Indian history did not happen alone, and the exam asks about a few big world events. Start with the revolutions, which share one idea: people, not kings alone, should decide how they are ruled. In England (1688) Parliament became supreme. In America (1776) colonists refused taxes without a say and declared independence. In <b>France (1789)<\/b> people stormed the Bastille under the slogan Liberty, Equality, Fraternity. In <b>Russia (1917)<\/b> the Tsar fell and Lenin's Bolsheviks took power. Meanwhile the Industrial Revolution in England brought machines and factories.<\/p><p>In 1914 an assassination at Sarajevo set off the <b>First World War<\/b>. It ended in 1918, and the Treaty of Versailles punished Germany hard. The League of Nations was set up to keep the peace, but it failed. Germany's anger at Versailles helped <b>Hitler<\/b> rise. In 1939 Germany invaded Poland, and the <b>Second World War<\/b> began. The USA joined after Japan attacked Pearl Harbor in 1941. The war ended in 1945, after atom bombs fell on Hiroshima and Nagasaki.<\/p><p>To stop another such war, the United Nations was set up in 1945, with India among its founding members. The tables list the dates, slogans and treaties to remember.<\/p>","key":"Revolutions spread the idea of rule by the people, and two World Wars, linked by the harsh Treaty of Versailles, ended with the founding of the UN."},{"k":"facts","title":"Revolutions","rows":[["<b>Glorious Revolution<\/b>","<b>1688<\/b>, England — bloodless; the Bill of Rights (1689) made Parliament supreme"],["<b>American Revolution<\/b>","<b>1775–83<\/b>; Boston Tea Party <b>1773<\/b>; <b>Declaration of Independence 4 July 1776<\/b> (drafted by <b>Thomas Jefferson<\/b>); slogan \"<b>No taxation without representation<\/b>\"; Treaty of Paris 1783; first President <b>George Washington<\/b>"],["<b>French Revolution<\/b>","<b>1789<\/b> — fall of the <b>Bastille, 14 July 1789<\/b>; slogan \"<b>Liberty, Equality, Fraternity<\/b>\"; thinkers <b>Rousseau<\/b> (<i>Social Contract<\/i>), <b>Voltaire<\/b>, <b>Montesquieu<\/b> (separation of powers); the Reign of Terror (Robespierre); Napoleon took over in 1799"],["<b>Industrial Revolution<\/b>","Began in <b>England<\/b>, ~1760; <b>James Watt<\/b> — steam engine; Hargreaves — spinning jenny; Arkwright — water frame; Crompton — mule; Cartwright — power loom; Stephenson — railway engine (Rocket)"],["<b>Russian Revolution<\/b>","<b>1917<\/b> — the <b>February (March) Revolution<\/b> ended Tsar <b>Nicholas II<\/b>; the <b>October (November) Revolution<\/b> brought the <b>Bolsheviks<\/b> under <b>Lenin<\/b> to power; slogan \"<b>Peace, Land and Bread<\/b>\"; Treaty of Brest-Litovsk 1918; USSR formed 1922"],["<b>Chinese Revolution<\/b>","1911 — Sun Yat-sen ends the Manchu dynasty; <b>1949<\/b> — <b>Mao Zedong<\/b> founds the People's Republic; Long March 1934–35"],["<b>Meiji Restoration<\/b>","1868, Japan — modernisation under the Emperor"],["Unifications","<b>Italy<\/b> — Mazzini, <b>Garibaldi<\/b>, Cavour, 1870; <b>Germany<\/b> — <b>Bismarck<\/b> (\"blood and iron\"), 1871"]]},{"k":"worldfig","title":"Revolutions that changed the world","minw":640,"pins":[["1",-0.13,51.5,"Glorious Revolution","n"],["2",-75.16,39.95,"American Revolution","n"],["3",2.35,48.86,"French Revolution","n"],["4",-2.24,53.48,"Industrial Revolution","n"],["5",30.3,59.93,"Russian Revolution","n"],["6",116.4,39.9,"Chinese Revolution","n"],["7",139.7,35.7,"Meiji Restoration","n"],["8",12.5,41.9,"Unifications","n"]],"legend":[["1 Glorious Revolution","London, 1688"],["2 American Revolution","Philadelphia, 1776"],["3 French Revolution","Paris, 1789"],["4 Industrial Revolution","England, c. 1760"],["5 Russian Revolution","Petrograd, 1917"],["6 Chinese Revolution","1911 and 1949"],["7 Meiji Restoration","Japan, 1868"],["8 Unifications","Italy 1870, Germany 1871"]],"cap":"Four of the eight began in Europe. The French Revolution's slogan: Liberty, Equality, Fraternity."},{"k":"photos","title":"Revolutions in pictures","items":[["Storming_of_the_Bastille","Storming of the Bastille","14 July 1789"],["Boston_Tea_Party","Boston Tea Party","1773"],["United_States_Declaration_of_Independence","Declaration of Independence","4 July 1776"],["Vladimir_Lenin","Vladimir Lenin","October 1917"],["Sun_Yat-sen","Sun Yat-sen","1911"],["Giuseppe_Garibaldi","Giuseppe Garibaldi","Italy"]]},{"k":"facts","title":"First World War (1914–18)","rows":[["Immediate cause","Assassination of <b>Archduke Franz Ferdinand<\/b> at <b>Sarajevo, 28 June 1914<\/b>, by Gavrilo Princip"],["Sides","<b>Allies<\/b> — Britain, France, Russia, later Italy, Japan, USA (1917) · <b>Central Powers<\/b> — Germany, Austria-Hungary, Ottoman Turkey, Bulgaria"],["Ended","<b>11 November 1918<\/b>; <b>Treaty of Versailles, 28 June 1919<\/b> — punished Germany (war guilt clause, reparations, loss of colonies)"],["<b>League of Nations<\/b>","Set up <b>1920<\/b>, HQ <b>Geneva<\/b>, proposed by US President <b>Woodrow Wilson<\/b> (his <b>Fourteen Points<\/b>); the USA never joined; it failed and was dissolved in 1946"]]},{"k":"cards","title":"The two World Wars at a glance","rows":[["First World War","1914–18","Spark: Archduke Franz Ferdinand shot at Sarajevo (28 June 1914). Ended by the Treaty of Versailles (1919); League of Nations formed.","⚔️"],["Allies (WW I)","Britain, France, Russia","Later Italy, Japan and the USA (1917).","🤝"],["Central Powers","Germany, Austria-Hungary","With the Ottoman Empire and Bulgaria.","🛡️"],["Second World War","1939–45","Began with Germany's invasion of Poland (1 Sept 1939). Atom bombs on Hiroshima (6 Aug) and Nagasaki (9 Aug 1945); the UN was born.","💣"],["Allies (WW II)","Britain, France, USSR, USA, China","The USA joined after Pearl Harbor (7 Dec 1941).","🤝"],["Axis","Germany, Italy, Japan","Hitler, Mussolini, Tojo.","🛡️"]]},{"k":"photos","title":"The wars in pictures","items":[["Assassination_of_Archduke_Franz_Ferdinand","Sarajevo, 1914","Sarajevo, 1914"],["Treaty_of_Versailles","Treaty of Versailles","1919"],["Normandy_landings","Normandy landings","D-Day, 1944"],["Attack_on_Pearl_Harbor","Attack on Pearl Harbor","1941"],["Atomic_bombings_of_Hiroshima_and_Nagasaki","Hiroshima","August 1945"]]},{"k":"facts","title":"Second World War (1939–45)","rows":[["Cause","Germany's invasion of <b>Poland, 1 September 1939<\/b>; the harshness of Versailles and the rise of <b>Hitler<\/b> (Nazi), <b>Mussolini<\/b> (Fascist) and Japan"],["Sides","<b>Allies<\/b> — Britain, France, USSR, USA, China · <b>Axis<\/b> — Germany, Italy, Japan"],["Turning points","Pearl Harbor (<b>7 Dec 1941<\/b>) brought in the USA; Stalingrad (1942–43); <b>D-Day, 6 June 1944<\/b>"],["End","Germany surrendered <b>8 May 1945<\/b> (VE Day); atom bombs on <b>Hiroshima (6 Aug 1945, \"Little Boy\")<\/b> and <b>Nagasaki (9 Aug 1945, \"Fat Man\")<\/b>; Japan surrendered <b>2 September 1945<\/b>"],["<b>United Nations<\/b>","Charter signed <b>26 June 1945<\/b> at San Francisco; came into force <b>24 October 1945<\/b> — <b>UN Day<\/b>; HQ <b>New York<\/b>; 51 founding members, India among them"],["After","<b>Cold War<\/b>; NATO 1949, Warsaw Pact 1955; Berlin Wall 1961–1989; USSR dissolved 1991"]]},{"k":"trick","h":"<b>War dates<\/b> — \"<b>14 to 18, 39 to 45<\/b>\"; each war ends with a treaty town: WWI → <b>Versailles<\/b>, WWII → <b>no single treaty<\/b> (Potsdam/Yalta conferences instead).<br><b>League vs UN<\/b>: <b>League = Geneva, 1920, after WWI<\/b>; <b>UN = New York, 1945, after WWII<\/b>."},{"k":"trap","h":"The <b>October Revolution<\/b> of 1917 is the one that brought the Bolsheviks to power (it falls in November by the modern calendar). <b>Woodrow Wilson proposed the League of Nations but the USA never joined it.<\/b> <b>Hiroshima<\/b> came first (6 Aug), Nagasaki second (9 Aug)."}],"sum":["American Revolution: Boston Tea Party 1773, Declaration of Independence 4 July 1776 (Jefferson), 'no taxation without representation'.","French Revolution 1789: Bastille fell 14 July 1789; 'Liberty, Equality, Fraternity'; Rousseau, Voltaire, Montesquieu.","Russian Revolution 1917: February ended Tsar Nicholas II; October brought Lenin's Bolsheviks; slogan 'Peace, Land and Bread'.","WWI 1914–18: triggered at Sarajevo 28 June 1914; Treaty of Versailles 28 June 1919; League of Nations 1920 at Geneva (Woodrow Wilson's idea; USA never joined).","WWII 1939–45: began with Poland 1 Sept 1939; Pearl Harbor 7 Dec 1941; D-Day 6 June 1944; Hiroshima 6 Aug & Nagasaki 9 Aug 1945; UN came into force 24 Oct 1945."]},
{"id":"L30","g":"wld","heat":3,"title":"Travellers, titles, books & slogans","hi":"यात्री · उपाधियाँ · पुस्तकें · नारे","blocks":[{"k":"hot","h":"This is a pure-marks lesson: SSC loves \"who was called X\", \"who wrote Y\", \"who gave the slogan Z\". Nothing to understand — only to recall. Read it last before the exam."},{"k":"story","h":"<p>This lesson has no story of its own. It collects who-is-who facts from every other lesson: travellers, titles, slogans and books. The best way to learn it is to hang each item on a story you already know.<\/p><p><b>Travellers<\/b>: put them on the line of kings. Megasthenes comes to Chandragupta Maurya, Fa-Hien to Chandragupta II, Hiuen Tsang to Harsha, Al-Beruni with Mahmud of Ghazni, Ibn Battuta to Muhammad bin Tughlaq, Domingo Paes to Krishnadeva Raya, and Englishmen like Thomas Roe to Jahangir. If you can say the kings in order, the travellers follow.<\/p><p><b>Titles<\/b>: group them by era. Older ones: Indian Napoleon (Samudragupta), Parrot of India (Amir Khusrau), Tiger of Mysore (Tipu). Freedom-era ones: Grand Old Man (Naoroji), Lokmanya (Tilak), Netaji (Bose), Sardar (Patel). <b>Slogans<\/b>: link each to its movement. Swaraj is my birthright goes with Tilak and the Extremists, Do or Die with Gandhi and Quit India, Give me blood with Bose and the INA. <b>Books<\/b>: pair each writer with his age, from Kautilya's Arthashastra and Abul Fazl's Ain-i-Akbari to Gandhi's Hind Swaraj. Read this lesson last, as revision before the exam.<\/p>","key":"Hang every traveller, title, slogan and book on a king or a movement you already know, and revise this lesson last."},{"k":"table","title":"Foreign travellers — who, when, under whom","head":["Traveller","From","Came under","Book"],"rows":[["<b>Megasthenes<\/b>","Greece","Chandragupta Maurya","<i>Indica<\/i>"],["Deimachus","Greece","Bindusara","—"],["Dionysius","Greece (Ptolemy's envoy)","Ashoka","—"],["<b>Fa-Hien<\/b>","China","Chandragupta II","<i>Fo-Kuo-Ki<\/i>"],["<b>Hiuen Tsang<\/b>","China","Harshavardhana","<i>Si-Yu-Ki<\/i>"],["<b>I-tsing<\/b>","China","late 7th c.","—"],["<b>Al-Beruni<\/b>","Persia","came with Mahmud of Ghazni","<i>Kitab-ul-Hind / Tahqiq-i-Hind<\/i>"],["<b>Marco Polo<\/b>","Venice","Pandya kingdom, 13th c.","<i>The Book of Ser Marco Polo<\/i>"],["<b>Ibn Battuta<\/b>","Morocco","Muhammad bin Tughlaq","<i>Rehla / Kitab-ul-Rehla<\/i>"],["<b>Nicolo Conti<\/b>","Italy","Devaraya I (Vijayanagara)","—"],["<b>Abdur Razzaq<\/b>","Persia","Devaraya II","—"],["<b>Athanasius Nikitin<\/b>","Russia","Bahmani kingdom","—"],["<b>Domingo Paes<\/b> &amp; Nuniz","Portugal","Krishnadeva Raya","—"],["<b>Ralph Fitch<\/b>","England","Akbar","—"],["<b>William Hawkins<\/b> / <b>Thomas Roe<\/b>","England","Jahangir","—"],["<b>Bernier<\/b> / <b>Tavernier<\/b> / <b>Manucci<\/b>","France / France / Italy","Shah Jahan (&amp; Aurangzeb)","<i>Travels in the Mogul Empire<\/i> / <i>Travels in India<\/i> / <i>Storia do Mogor<\/i>"]]},{"k":"worldfig","title":"Where the travellers came from","vb":"380 40 520 260","maxw":700,"minw":360,"under":"<defs><marker id=\"wa6rn5hd\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"#c0392b\"/><\/marker><\/defs><path d=\"M533.9,127.8L609.3,133.3L684.7,172.2\" fill=\"none\" stroke=\"#c0392b\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\".85\" marker-end=\"url(#wa6rn5hd)\" style=\"vector-effect:non-scaling-stroke\"/><path d=\"M533.9,127.8L609.3,133.3L684.7,172.2\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1\" stroke-dasharray=\"2 7\" style=\"animation:rvflow 1.2s linear infinite;vector-effect:non-scaling-stroke\"/><defs><marker id=\"wabp632z\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"#2f6db5\"/><\/marker><\/defs><path d=\"M770.6,138.1L727.6,138.5L684.7,172.2\" fill=\"none\" stroke=\"#2f6db5\" stroke-width=\"3\" stroke-linecap=\"ro <script>
"use strict";
/* ============================================================
   Workbook engine — shared by the History and Computer Knowledge pages (tools/workbook/lib.js puts it in each one).
   APP.mode "era": a subject app with its own lessons and questions (Learn · Practice · Mock · Revise · Plan).
   APP.mode "hub": start here, a plan across a family of apps, and revision across all of them (no questions of its own).
   Optional data: APP.hub (a family hub to link to), HEATMAP (where the marks come from, by exam),
   a question's 8th field (the paper it was reported from), APP.tabs (the tabs, in order) — a tab the engine
   does not know (e.g. Chemistry's "lab") is drawn by the page's own script: render<Tab>() and, when you
   leave it, leave<Tab>().
   ============================================================ */
const HUB = APP.mode === "hub";
const EMBED = (() => { try { return window.parent !== window; } catch(e) { return true; } })();
const TABS = HUB ? ["start","plan","revise"] : (APP.tabs || ["learn","practice","mock","revise","plan"]);

/* ============================================================
   HELPERS & STATE
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hash = s => { let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5)+h + s.charCodeAt(i))|0; return "q"+(h>>>0).toString(36); };
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; };
const L = id => LESSONS.find(l => l.id === id);
const LNUM = id => LESSONS.findIndex(l => l.id === id) + 1;
const G = id => GROUPS.find(g => g.id === id) || GROUPS[0];
const A = id => APP.apps.find(a => a.id === id);
const appOf = id => (L(id) && L(id).app) || APP.id;       // in the hub, each lesson carries the app it lives in

const QS = QB.map(r => {
  const fixed = !!r[6];
  return { t:r[0], q:r[1], o:r[2], e:r[3], p:(r[4]||"").includes("p"), a: fixed ? (r[5]||0) : 0, fixed, id:hash(r[1]), src: r[7] || "" };
});
const byLesson = id => QS.filter(q => q.t === id);
const makePerm = q => q.fixed ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i));
const qCount = id => HUB ? null : byLesson(id).length;
const pCount = id => HUB ? ((APP.pcount||{})[id] || 0) : byLesson(id).filter(q=>q.p).length;

const KEY = APP.key;
let S = { ans:{}, bm:{}, les:{}, mocks:[], plan:null };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const record = (q, ok) => { S.ans[q.id] = ok ? 1 : 0; save(); renderTop(); };

/* Another History app's saved progress. Every page is on the same site, so the hub (and a
   plan) can see which lessons you have read and quizzed in the subject apps. */
function appState(a){ try { return JSON.parse(localStorage.getItem(a.key) || "{}") || {}; } catch(e) { return {}; } }
function lessonState(id){
  const owner = appOf(id);
  if (owner === APP.id) return S.les[id] || {};
  const a = A(owner); return a ? ((appState(a).les || {})[id] || {}) : {};
}
const lesDone = l => !!lessonState(l.id).done;
const heatDots = n => `<span class="dots" aria-label="Asked ${n===3?"almost every shift":n===2?"often":"now and then"}">${[1,2,3].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>`;

/* Open a lesson or a tab, here or in the History app it lives in. Inside पाठShala the
   app is asked to switch (so your session is tracked); on its own the page just navigates. */
function openApp(appId, lesson, tab){
  if (appId === APP.id) {
    if (lesson) openLesson(lesson, "learn"); else go(tab || TABS[0]);
    return;
  }
  const a = APP.hub && appId === APP.hub.id ? APP.hub : A(appId);
  if (!a) return;
  const here = () => { location.href = a.file + (lesson ? "?lesson=" + encodeURIComponent(lesson) : "") + (tab ? "#" + tab : ""); };
  if (!EMBED) return here();
  let ok = false;
  const onAck = e => { if (e.origin === location.origin && e.data && e.data.type === "shabd-open-ok") ok = true; };
  window.addEventListener("message", onAck);
  try { window.parent.postMessage({ type:"shabd-open", mod:a.id, lesson: lesson || null, tab: tab || null }, location.origin); } catch(e) {}
  setTimeout(() => { window.removeEventListener("message", onAck); if (!ok) here(); }, 700);
}
const hubLink = (before, label, tab, after) => APP.hub ? before + goLink(label, APP.hub.id, null, tab) + (after || "") : "";
const goLink = (label, appId, lesson, tab) => `<button type="button" class="golink" data-go="${esc(JSON.stringify([appId, lesson||null, tab||null]))}">${label}</button>`;
function bindGo(root){
  root.querySelectorAll("[data-go]").forEach(b => b.onclick = ev => { ev.stopPropagation(); const g = JSON.parse(b.dataset.go); openApp(g[0], g[1], g[2]); });
}

function renderTop(){
  if (HUB) {
    const done = LESSONS.filter(lesDone).length;
    $("#topstat").innerHTML = `<b>${done}</b>/${LESSONS.length} lessons<br>in ${APP.apps.length} apps`;
    return;
  }
  const ids = Object.keys(S.ans).filter(k => QS.some(q => q.id === k));
  const right = ids.filter(k => S.ans[k] === 1).length;
  const pct = ids.length ? Math.round(right*100/ids.length) : 0;
  $("#topstat").innerHTML = `<b>${ids.length}</b>/${QS.length} tried<br><b>${pct}%</b> right now`;
}

/* ============================================================
   ROUTING
   ============================================================ */
let TAB = TABS[0];
let timerId = null;
function go(tab){
  if (!TABS.includes(tab)) tab = TABS[0];
  const own = t => t.charAt(0).toUpperCase() + t.slice(1);
  if (TAB !== tab && typeof window["leave" + own(TAB)] === "function") window["leave" + own(TAB)]();
  TAB = tab;
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.tab===tab ? "page" : "false"));
  if (tab === "start") renderStart();
  if (tab === "learn") renderLearn();
  if (tab === "practice") renderPractice();
  if (tab === "mock") renderMock();
  if (tab === "revise") renderRevise();
  if (tab === "plan") renderPlan();
  if (!["start","learn","practice","mock","revise","plan"].includes(tab) && typeof window["render" + own(tab)] === "function") window["render" + own(tab)]();
  window.scrollTo(0,0);
  try { history.replaceState(null, "", location.pathname + location.search + "#" + tab); } catch(e) {}
}
document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => {
  if (TAB === "mock" && M && M.running && b.dataset.tab !== "mock") { go("mock"); showMockLeave(b.dataset.tab); return; }
  go(b.dataset.tab);
}));

/* ============================================================
   START HERE (hub)
   ============================================================ */
function renderStart(){
  const done = LESSONS.filter(lesDone).length;
  const cards = APP.apps.map(a => {
    const ls = LESSONS.filter(l => l.app === a.id), d = ls.filter(lesDone).length, it = INTROS[a.id] || {};
    return `<button type="button" class="appc" data-go="${esc(JSON.stringify([a.id,null,null]))}">
      <div class="hd"><span class="ic" aria-hidden="true">${a.ico}</span><span><b>${esc(a.title)}</b><small>${esc(a.hi)}</small></span><span class="go">Open ›</span></div>
      ${it.lead ? `<p>${esc(it.lead)}</p>` : ""}
      <div class="meter"><i style="width:${ls.length ? d/ls.length*100 : 0}%"></i></div>
      <span class="meta">${d}/${ls.length} lessons done · ${(APP.qcount||{})[a.id] || 0} questions</span></button>`;
  }).join("");
  const tips = APP.apps.filter(a => INTROS[a.id]).map(a => `<div><dt>${esc(a.title)}</dt><dd>${esc(INTROS[a.id].tip)} ${esc(INTROS[a.id].order)}</dd></div>`).join("");
  $("#app").innerHTML = `<section class="view stack">
    <div class="hero">
      <span class="eyebrow">New to history? Start here</span>
      <h1>History, from zero to exam-ready</h1>
      <p>SSC splits history into five subjects, so these are five apps &mdash; Ancient, Medieval, Modern, Art &amp; Culture, and World &mdash; with ${LESSONS.length} lessons between them. You do not need to know anything before you begin: every lesson opens with a two-minute story that explains what happened and why, and only then gives you the tables, tricks and traps the exam asks about.</p>
      <div class="meter" aria-label="Lessons done in every History app"><i style="width:${done/LESSONS.length*100}%"></i></div>
      <div class="row between"><span class="muted num" style="font-size:13px">${done}/${LESSONS.length} lessons done across the apps</span>
        <button class="btn pri sm" type="button" id="toplan">${S.plan ? "Open my plan" : "Make a study plan"}</button></div>
    </div>
    <div class="block"><h3>How to use these apps</h3><ol class="steps-list">
      <li><b>Pick a plan</b> in the Plan tab &mdash; 5, 7, 10, 15 or 30 days. It tells you exactly what to read each day, and ticks itself as you finish lessons in the apps.</li>
      <li><b>Read the story first</b> in every lesson, then the tables. The <b>Trick</b> boxes help you remember; the <b>Trap</b> boxes are the pairs SSC swaps to catch you.</li>
      <li><b>Take the quiz</b> at the end of each lesson. Anything you get wrong waits for you under Practice &rarr; Mistakes until you get it right.</li>
      <li><b>Revise in layers</b> in the Revise tab here: 30 days out read every summary, in the last week only the most-asked lessons, and in the final hour the Last moment sheet.</li>
    </ol></div>
    <h2>The five apps</h2>
    <div class="appcs">${cards}</div>
    ${tips ? `<div class="block"><h3>How to study each one</h3><dl class="facts prose">${tips}</dl></div>` : ""}
    <div class="block"><h3>Where the marks are</h3><dl class="facts prose">${GROUPS.filter(g=>ERANOTE[g.id]).map(g=>`<div><dt>${esc(g.name)}</dt><dd>${ERANOTE[g.id]}</dd></div>`).join("")}</dl>
      <p class="muted" style="font-size:13px;margin-top:8px">The dots next to each lesson show how often its topic comes up: three dots means almost every shift.</p></div>
  </section>`;
  bindGo($("#app"));
  $("#toplan").onclick = () => go("plan");
}

/* ============================================================
   LEARN (subject app)
   ============================================================ */
function lessonRow(l, nextL){
  const st = lessonState(l.id), n = byLesson(l.id).length;
  return `<button type="button" class="les ${lesDone(l)?"done":""} ${nextL&&l.id===nextL.id?"next":""}" data-open="${l.id}">
    <span class="no">${lesDone(l) ? "✓" : LNUM(l.id)}</span>
    <span class="t"><b>${esc(l.title)}${heatDots(l.heat)}</b><span>${l.hi} · ${n} questions</span></span>
    <span class="sc">${st.best!=null ? `best<br>${st.best}/${n}` : ""}</span></button>`;
}
function renderLearn(){
  const done = LESSONS.filter(lesDone).length;
  const nextL = LESSONS.find(l => !lesDone(l));
  const it = INTROS[APP.id] || {};
  const parts = [];
  LESSONS.forEach(l => {
    const name = l.part ? l.part[0] : "";
    if (!parts.length || parts[parts.length-1].name !== name) parts.push({ name, hi: l.part ? l.part[1] : "", ls: [] });
    parts[parts.length-1].ls.push(l);
  });
  $("#app").innerHTML = `<section class="view stack">
    <div class="hero">
      <span class="eyebrow">${esc(APP.hi)}${APP.tagline ? " \u00b7 " + esc(APP.tagline) : ""}</span>
      <h1>${esc(APP.title)}</h1>
      <p>${it.lead ? esc(it.lead) + " " : ""}${LESSONS.length} lessons and ${QS.length} exam-style questions. Each lesson starts with a short story, then the tables, tricks and traps, a quiz and a one-screen summary.</p>
      <div class="meter" aria-label="Lessons done"><i style="width:${done/LESSONS.length*100}%"></i></div>
      <div class="row between"><span class="muted num" style="font-size:13px">${done}/${LESSONS.length} lessons done</span>
      ${nextL ? `<button class="btn pri sm" type="button" data-open="${nextL.id}">${done? "Continue" : "Start"}: ${esc(nextL.title)}</button>` : `<span class="muted" style="font-size:13px">All lessons done. Try a mock test.</span>`}</div>
    </div>
    ${it.tip ? `<div class="callout"><b>How to study it.</b> ${esc(it.tip)} ${esc(it.order || "")}</div>` : ""}
    ${HEATMAP ? `<details class="block hmwrap"><summary><h3>Exam heat map</h3><span class="muted">which lessons carry the marks in each exam \u203a</span></summary>${heatHTML(false)}</details>` : ""}
    ${parts.map(p => `${p.name ? `<div class="grph"><h2>${esc(p.name)}</h2><span>${p.ls.length} lessons</span></div>${p.hi?`<p class="muted" style="font-size:13px;margin:-8px 0 2px">${p.hi}</p>`:""}` : ""}
      <div class="lessons">${p.ls.map(l => lessonRow(l, nextL)).join("")}</div>`).join("")}
    <p class="foot">The dots show how often a topic is asked &mdash; three dots means almost every paper.${hubLink(" A plan across every app in this subject, and revision across all of them, is in ", APP.hub ? APP.hub.title : "", null, ".")}</p>
  </section>`;
  $("#app").querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openLesson(b.dataset.open, "learn")));
  bindGo($("#app"));
}

function blockHTML(b){
  if (b.k==="p") return `<div class="plain"><p>${b.h}</p></div>`;
  if (b.k==="hot") return `<div class="hot"><span class="lab">Why it is asked</span>${b.h}</div>`;
  if (b.k==="story") return `<div class="story"><span class="lab">${esc(APP.storyLabel || "The story first \u00b7 two minutes")}</span>${b.h}${b.key?`<p class="key"><b>${esc(APP.keyLabel || "Carry this into the tables:")}</b> ${esc(b.key)}</p>`:""}</div>`;
  if (b.k==="trick") return `<div class="trick"><span class="lab">Trick</span>${b.h}</div>`;
  if (b.k==="trap") return `<div class="trap"><span class="lab">Trap · don't mix these up</span>${b.h}</div>`;
  if (b.k==="link") return `<div class="link"><span class="lab">Link it up</span>${b.h}</div>`;
  if (b.k==="ex") return `<div class="link"><span class="lab">Worked example</span>${b.h}</div>`;
  if (b.k==="facts") return `<div class="block"><h3>${b.title}</h3><dl class="facts">${b.rows.map(r=>`<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join("")}</dl></div>`;
  if (b.k==="tl") return `<div class="block"><h3>${b.title}</h3><ul class="tl">${b.rows.map(r=>`<li><span class="y">${r[0]}</span><span>${r[1]}</span></li>`).join("")}</ul></div>`;
  if (b.k==="table") return `<div class="block"><h3>${b.title}</h3><div class="tbl"><table><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  if (b.k==="fig") return `<div class="block${b.wide?" phblock":""}"><h3>${b.title}</h3><figure class="fig${b.wide?" wide":""}"${b.wide?` style="--minw:${b.wide}px"`:""}>${b.svg}<figcaption>${b.cap}</figcaption></figure></div>`;
  return typeof visBlock === "function" ? visBlock(b) : "";      // photos, maps, charts, timelines… from study-visual.js
}

let LQ = null;
function openLesson(id, step){
  if (HUB || !L(id) || appOf(id) !== APP.id) { openApp(appOf(id), id); return; }   // the hub shows lessons in their own app
  const l = L(id), i = LNUM(id);
  if (step === "quiz") { LQ = { id, list: shuffle(byLesson(id)).map(q => ({q, perm:makePerm(q)})), i:0, score:0, picked:null }; }
  const head = `<div class="lhead"><button class="back" type="button" id="lback">‹ Lessons</button></div>
    <span class="eyebrow">${esc(APP.title)} · Lesson ${i} of ${LESSONS.length} · ${l.hi}</span><h1>${esc(l.title)}</h1>
    <p class="muted" style="font-size:13px">Asked in CGL ${heatDots(l.heat)} ${l.heat===3?"— almost every shift":l.heat===2?"— often":"— now and then"}</p>
    <div class="steps" role="tablist">
      <button type="button" data-step="learn" aria-current="${step==="learn"?"step":"false"}">1 · Learn</button>
      <button type="button" data-step="quiz" aria-current="${step==="quiz"?"step":"false"}">2 · Quiz</button>
      <button type="button" data-step="sum" aria-current="${step==="sum"?"step":"false"}">3 · Summary</button>
    </div>`;
  let body = "";
  if (step === "learn") {
    body = `<div class="stack">${l.blocks.map(blockHTML).join("")}
      <div class="row end"><button class="btn pri" type="button" id="toquiz">Take the quiz · ${byLesson(id).length} questions</button></div></div>`;
  } else if (step === "quiz") {
    body = `<div id="lq"></div>`;
  } else {
    const nxt = LESSONS[i];
    body = `<div class="stack"><div class="block"><h3>Remember these</h3><ul class="sum">${l.sum.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
      <div class="row between"><button class="btn" type="button" id="relearn">Read again</button>
      ${nxt ? `<button class="btn pri" type="button" id="nextles">Next: ${esc(nxt.title)}</button>` : `<button class="btn pri" type="button" id="tomock">Take a mock test</button>`}</div></div>`;
    S.les[id] = Object.assign(S.les[id]||{}, {done:1}); save(); renderTop();
  }
  $("#app").innerHTML = `<section class="view stack">${head}${body}</section>`;
  $("#lback").onclick = () => go("learn");
  $("#app").querySelectorAll("[data-step]").forEach(b => b.onclick = () => openLesson(id, b.dataset.step));
  if (step==="learn") $("#toquiz").onclick = () => openLesson(id,"quiz");
  if (step==="quiz") renderLQ();
  if (step==="sum") {
    $("#relearn").onclick = () => openLesson(id,"learn");
    const n = $("#nextles"); if (n) n.onclick = () => openLesson(LESSONS[i].id,"learn");
    const m = $("#tomock"); if (m) m.onclick = () => go("mock");
  }
  window.scrollTo(0,0);
}

function optsHTML(q, perm, state){
  return perm.map((oi, k) => {
    let cls = "opt";
    if (state.reveal) { if (oi === q.a) cls += " ok"; else if (oi === state.picked) cls += " no"; }
    else if (state.sel === oi) cls += " sel";
    return `<button type="button" class="${cls}" data-oi="${oi}" ${state.reveal?"disabled":""}><span class="k">${"ABCD"[k]}</span><span>${esc(q.o[oi])}</span></button>`;
  }).join("");
}
function expHTML(q, picked){
  const ok = picked === q.a;
  return `<div class="exp">${ok ? `<b class="okl">Correct.</b>` : `<b class="nol">Answer: ${esc(q.o[q.a])}.</b>`} ${esc(q.e)}</div>`;
}
function metaHTML(q, no){
  return `<div class="qmeta"><span class="qno">${no}</span><span class="tag">L${LNUM(q.t)} \u00b7 ${esc(L(q.t).title)}</span>${q.src?`<span class="tag src" title="Reported by candidates after this paper (memory-based)">\ud83d\udcdc ${esc(q.src)}</span>`:""}${q.p?`<span class="tag pyq" title="This fact comes up again and again in SSC papers">Repeatedly asked</span>`:""}
  <button type="button" class="bm" data-bm="${q.id}" aria-pressed="${S.bm[q.id]?"true":"false"}" aria-label="Bookmark">${S.bm[q.id]?"★":"☆"}</button></div>`;
}

function renderLQ(){
  const box = $("#lq");
  if (LQ.i >= LQ.list.length) {
    const n = LQ.list.length;
    const st = S.les[LQ.id] || {}; st.best = Math.max(st.best||0, LQ.score); S.les[LQ.id] = st; save();
    box.innerHTML = `<div class="stack"><div class="block stack"><span class="eyebrow">Quiz done</span>
      <div class="scorebig"><span class="num">${LQ.score}</span><span class="muted">/ ${n} correct</span></div>
      <p class="muted">${LQ.score===n ? "Full marks." : LQ.score >= n*0.8 ? "Strong. Review the ones you missed under Practice → Mistakes." : "Read the story and the Trap boxes once more, then retry. Missed questions are saved under Practice → Mistakes."}</p></div>
      <div class="row between"><button class="btn" type="button" id="retry">Retry quiz</button><button class="btn pri" type="button" id="tosum">See summary</button></div></div>`;
    $("#retry").onclick = () => openLesson(LQ.id,"quiz");
    $("#tosum").onclick = () => openLesson(LQ.id,"sum");
    return;
  }
  const it = LQ.list[LQ.i], q = it.q;
  const reveal = LQ.picked !== null;
  box.innerHTML = `<div class="stack"><div class="meter"><i style="width:${LQ.i/LQ.list.length*100}%"></i></div>
    <article class="qcard">${metaHTML(q, `Q${LQ.i+1}/${LQ.list.length}`)}
    <p class="qt">${esc(q.q)}</p><div class="opts">${optsHTML(q, it.perm, {picked:LQ.picked, reveal})}</div>
    ${reveal ? expHTML(q, LQ.picked) : ""}</article>
    ${reveal ? `<div class="row end"><button class="btn pri" type="button" id="lqnext">${LQ.i+1 < LQ.list.length ? "Next question" : "Finish"}</button></div>` : `<p class="muted" style="font-size:13px">Score so far: <span class="num">${LQ.score}</span></p>`}</div>`;
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (LQ.picked !== null) return;
    LQ.picked = +b.dataset.oi; const ok = LQ.picked === q.a; if (ok) LQ.score++; record(q, ok); renderLQ();
  });
  bindBM(box);
  const nx = $("#lqnext"); if (nx) nx.onclick = () => { LQ.i++; LQ.picked = null; renderLQ(); window.scrollTo(0,0); };

function bindBM(root){
  root.querySelectorAll("[data-bm]").forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    const id = b.dataset.bm; if (S.bm[id]) delete S.bm[id]; else S.bm[id] = 1; save();
    b.setAttribute("aria-pressed", S.bm[id] ? "true":"false"); b.textContent = S.bm[id] ? "★" : "☆";
  });
}

let PF = "all", PSHOW = 20, PORDER = null, PPERM = {}, PPICK = {};
const hasHot = () => LESSONS.some(l => l.heat === 3) && LESSONS.some(l => l.heat !== 3);
function practiceList(){

}
function renderPractice(){
  const wrongN = QS.filter(q => S.ans[q.id] === 0).length, bmN = QS.filter(q=>S.bm[q.id]).length;
  const pyqN = QS.filter(q=>q.p).length, hotN = QS.filter(q=>L(q.t).heat===3).length;
  const chips = [["all",`All ${QS.length}`],["new","Not tried"],["wrong",`Mistakes ${wrongN}`]]
    .concat(hasHot() ? [["hot",`Most-asked topics ${hotN}`]] : [])

  $("#app").innerHTML = `<section class="view stack">
    <div class="stack" style="gap:6px"><span class="eyebrow">Question bank · ${QS.length} questions</span><h1>Practice</h1>
    <p class="muted">Tap an option to check it. Wrong answers go to <b>Mistakes</b> until you get them right. <b>Repeatedly asked</b> marks the facts that come up again and again in SSC papers${hasHot() ? "; <b>Most-asked topics</b> is every question from the three-dot lessons" : ""}.</p></div>
    <div class="chips" role="group" aria-label="Filter">${chips.map(c=>`<button type="button" class="chip" data-f="${c[0]}" aria-pressed="${PF===c[0]}">${esc(c[1])}</button>`).join("")}</div>
    <div class="row between"><span class="muted num" style="font-size:13px">${list.length} questions</span>
      <div class="row"><button class="btn sm ghost" type="button" id="pshuf">${PORDER?"In order":"Shuffle"}</button></div></div>

  $("#pshuf").onclick = () => { PORDER = PORDER ? null : shuffle(QS.map(q=>q.id)); PSHOW = 20; renderPractice(); };

function pCard(q, idx){
  if (!PPERM[q.id]) PPERM[q.id] = makePerm(q);
  const picked = PPICK[q.id]; const reveal = picked !== undefined;
  return `<article class="qcard" data-q="${q.id}">${metaHTML(q, "Q"+(idx+1))}<p class="qt">${esc(q.q)}</p>
    <div class="opts">${optsHTML(q, PPERM[q.id], {picked: reveal?picked:null, reveal})}</div>${reveal?expHTML(q,picked):""}</article>`;
}
function drawPList(){
  const list = practiceList(), box = $("#plist");
  if (!list.length) { box.innerHTML = `<p class="empty">${PF==="wrong"?"No mistakes saved. Answer some questions first, or you've cleared them all.":PF==="bm"?"Nothing starred yet. Tap ☆ on any question.":"Nothing here."}</p>`; return; }
  box.innerHTML = list.slice(0, PSHOW).map((q,i)=>pCard(q,i)).join("") + (list.length > PSHOW ? `<button class="btn" type="button" id="pmore">Show 20 more (${list.length-PSHOW} left)</button>` : "");
  box.querySelectorAll(".qcard").forEach(bindCard);
  const more = $("#pmore"); if (more) more.onclick = () => { PSHOW += 20; drawPList(); };
}
function bindCard(card){
  card.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const q = QS.find(x => x.id === card.dataset.q); if (PPICK[q.id] !== undefined) return;
    PPICK[q.id] = +b.dataset.oi; record(q, PPICK[q.id] === q.a);
    const idx = +card.querySelector(".qno").textContent.slice(1) - 1;
    const tmp = document.createElement("div"); tmp.innerHTML = pCard(q, idx); const nc = tmp.firstElementChild;
    card.replaceWith(nc); bindCard(nc);
  });
  bindBM(card);
}

/* ============================================================
   MOCK TEST

let M = null, MCFG = {n:25, scope:"all", neg:1}, LEAVE_TO = null;
function mockPool(scope){
  if (scope === "all") return QS;
  if (scope === "pyq") return QS.filter(q=>q.p);
  if (scope === "src") return QS.filter(q=>q.src);
  if (scope === "hot") return QS.filter(q=>L(q.t).heat===3);
  if (scope === "wrong") return QS.filter(q=>S.ans[q.id]===0);
  return QS.filter(q=>q.t===scope);
}
function renderMock(){
  if (M && M.running) return drawMockRun();
  if (M && M.done) return drawMockResult();
  const hist = (S.mocks||[]).slice(-6).reverse();
  $("#app").innerHTML = `<section class="view stack">
    <div class="stack" style="gap:6px"><span class="eyebrow">Timed, SSC pattern</span><h1>Mock test</h1>
    <p class="muted">+2 for a right answer, &minus;0.5 for a wrong one, 36 seconds a question (CGL Tier-1 pace). Answers show only after you submit.</p></div>
    <div class="block stack">
      <fieldset><legend>Questions</legend><div class="radios">${[10,25,50,100].map(n=>`<label><input type="radio" name="mn" id="mn${n}" value="${n}" ${MCFG.n===n?"checked":""}><span>${n} · ${Math.round(n*36/60)} min</span></label>`).join("")}</div></fieldset>

        <option value="pyq">Repeatedly asked only</option>

      </select></fieldset>
      <label class="row" style="gap:8px;font-weight:600"><input type="checkbox" id="mneg" ${MCFG.neg?"checked":""}> Negative marking (&minus;0.5)</label>
      <div id="merr" class="muted" style="font-size:14px"></div>

    </div>
    ${hist.length ? `<div class="block"><h3>Recent attempts</h3><div class="hist">${hist.map(h=>`<div><span>${esc(h.d)} · ${h.n} Q</span><span class="num">${h.score}/${h.max} · ${h.acc}%</span></div>`).join("")}</div></div>` : ""}
  </section>`;
  if ([...$("#mscope").options].some(o => o.value === MCFG.scope)) $("#mscope").value = MCFG.scope;
  $("#mstart").onclick = () => {

    const qs = shuffle(pool).slice(0, MCFG.n);
    M = { running:true, list: qs.map(q=>({q, perm:makePerm(q)})), ans: qs.map(()=>null), mark: qs.map(()=>false), i:0, neg:MCFG.neg, secs: qs.length*36, start: Date.now(), showPal:false, confirm:false };

}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(() => {

    if (left <= 0) submitMock();
  }, 1000);
}
const fmt = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
function drawMockRun(){
  const it = M.list[M.i], q = it.q, left = Math.max(0, Math.round((M.end-Date.now())/1000));
  const answered = M.ans.filter(a=>a!==null).length;
  $("#app").innerHTML = `<section class="view stack">
    <div class="mbar"><span class="timer num ${left<=60?"low":""}" id="mtime">${fmt(left)}</span>

    ${LEAVE_TO ? `<div class="confirm"><b>Leave the test?</b><span>Your answers so far will be scored now.</span><div class="row"><button class="btn sm pri" type="button" id="lvy">Submit and leave</button><button class="btn sm" type="button" id="lvn">Stay</button></div></div>` : ""}
    ${M.showPal ? `<div class="block"><div class="pal">${M.list.map((_,k)=>`<button type="button" data-j="${k}" class="${M.ans[k]!==null?"a":""} ${M.mark[k]?"m":""} ${k===M.i?"cur":""}" aria-label="Question ${k+1}">${k+1}</button>`).join("")}</div>
      <p class="muted" style="font-size:12px;margin-top:8px">Filled = answered · gold line = marked for review</p></div>` : ""}
    <article class="qcard"><div class="qmeta"><span class="qno">Q${M.i+1}</span><span class="tag">L${LNUM(q.t)}</span>${M.mark[M.i]?`<span class="tag pyq">Marked</span>`:""}</div>
      <p class="qt">${esc(q.q)}</p><div class="opts">${optsHTML(q, it.perm, {sel:M.ans[M.i], reveal:false})}</div></article>
    <div class="row between"><button class="btn" type="button" id="mprev" ${M.i===0?"disabled":""}>‹ Prev</button>

      <button class="btn ghost" type="button" id="mclr" ${M.ans[M.i]===null?"disabled":""}>Clear</button>
      <button class="btn ${M.i<M.list.length-1?"pri":""}" type="button" id="mnext" ${M.i===M.list.length-1?"disabled":""}>Next ›</button></div>
    ${M.confirm ? `<div class="confirm"><b>Submit the test?</b><span>${M.list.length-answered} unanswered${M.mark.filter(Boolean).length?`, ${M.mark.filter(Boolean).length} marked for review`:""}.</span><div class="row"><button class="btn sm pri" type="button" id="msubY">Submit</button><button class="btn sm" type="button" id="msubN">Keep going</button></div></div>`
      : `<button class="btn pri" type="button" id="msub">Submit test</button>`}
  </section>`;
  $("#app").querySelectorAll(".opt").forEach(b => b.onclick = () => { M.ans[M.i] = +b.dataset.oi; drawMockRun(); });
  $("#mprev").onclick = () => { if (M.i>0){M.i--; drawMockRun();} };
  $("#mnext").onclick = () => { if (M.i<M.list.length-1){M.i++; drawMockRun(); window.scrollTo(0,0);} };
  $("#mmark").onclick = () => { M.mark[M.i] = !M.mark[M.i]; drawMockRun(); };
  $("#mclr").onclick = () => { M.ans[M.i] = null; drawMockRun(); };
  $("#mpal").onclick = () => { M.showPal = !M.showPal; drawMockRun(); };

  const s = $("#msub"); if (s) s.onclick = () => { M.confirm = true; drawMockRun(); };
  const y = $("#msubY"); if (y) y.onclick = submitMock;
  const n = $("#msubN"); if (n) n.onclick = () => { M.confirm = false; drawMockRun(); };
  const lvy = $("#lvy"); if (lvy) lvy.onclick = () => { const t = LEAVE_TO; LEAVE_TO = null; submitMock(); go(t); };
  const lvn = $("#lvn"); if (lvn) lvn.onclick = () => { LEAVE_TO = null; drawMockRun(); };
}
function showMockLeave(tab){ LEAVE_TO = tab; drawMockRun(); }
function submitMock(){
  if (!M || !M.running) return;
  clearInterval(timerId);
  M.running = false; M.done = true; M.confirm = false;
  let c=0,w=0,sk=0; const per = {};
  M.list.forEach((it,k) => {
    const a = M.ans[k], t = it.q.t; per[t] = per[t] || {c:0,n:0}; per[t].n++;
    if (a===null) sk++; else if (a===it.q.a) { c++; per[t].c++; S.ans[it.q.id]=1; } else { w++; S.ans[it.q.id]=0; }
  });
  const max = M.list.length*2, score = +(c*2 - (M.neg? w*0.5 : 0)).toFixed(1);
  const used = Math.min(M.secs, Math.round((Date.now()-M.start)/1000));
  M.res = {c,w,sk,score,max,used,per, acc: (c+w) ? Math.round(c*100/(c+w)) : 0};
  const d = new Date(); const ds = d.toLocaleDateString("en-IN",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
  S.mocks = (S.mocks||[]).concat([{d:ds, n:M.list.length, score, max, acc:M.res.acc}]).slice(-20); save(); renderTop();
  M.filter = "wrong";
  if (TAB==="mock") drawMockResult();
}

    <div class="kpis"><div class="kpi g"><span class="num">${r.c}</span><span>right</span></div><div class="kpi b"><span class="num">${r.w}</span><span>wrong</span></div><div class="kpi"><span class="num">${r.sk}</span><span>skipped</span></div><div class="kpi"><span class="num">${r.acc}%</span><span>accuracy</span></div></div>

    <div class="block"><h3>By lesson</h3><div class="hist">${per}</div></div>
    <div class="row between"><button class="btn" type="button" id="mnew">New test</button><button class="btn pri" type="button" id="mretry">Retake same questions</button></div>
    <h2>Review</h2>
    <div class="chips">${[["wrong",`Wrong ${r.w}`],["skip",`Skipped ${r.sk}`],["all",`All ${M.list.length}`]].map(c=>`<button class="chip" type="button" data-rf="${c[0]}" aria-pressed="${M.filter===c[0]}">${c[1]}</button>`).join("")}</div>
    <div class="stack">${rows.length ? rows.map(({it,k}) => `<article class="qcard">${metaHTML(it.q, "Q"+(k+1))}<p class="qt">${esc(it.q.q)}</p><div class="opts">${optsHTML(it.q, it.perm, {picked:M.ans[k], reveal:true})}</div>${M.ans[k]===null?`<div class="exp"><b class="nol">Skipped. Answer: ${esc(it.q.o[it.q.a])}.</b> ${esc(it.q.e)}</div>`:expHTML(it.q, M.ans[k])}</article>`).join("") : `<p class="empty">Nothing in this list.</p>`}</div>
  </section>`;
  bindBM($("#app"));

    M = { running:true, list, ans:list.map(()=>null), mark:list.map(()=>false), i:0, neg:MCFG.neg, secs:list.length*36, start:Date.now(), showPal:false, confirm:false };

}

let RV = HEATMAP ? "heat" : "month", FC = null, FCSCOPE = "all";
function reviseTabs(){

}

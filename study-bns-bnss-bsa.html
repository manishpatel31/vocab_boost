const LESSONS = [
{ id:"L1", heat:3, title:"SSC exam radar: how these laws are asked", hi:"परीक्षा रडार · SSC में कैसे पूछा जाता है", sum:["BNS replaced IPC 1860 (offences), BNSS replaced CrPC 1973 (procedure), BSA replaced the Indian Evidence Act 1872 (evidence).", "About 180 SSC questions a year: roughly 53 BNS, 42 BNSS, 43 BSA; 0–2 per CGL shift, more in CPO and Delhi Police.", "Crime → Process → Proof: Nyaya = offences, Nagarik Suraksha = procedure, Sakshya = evidence.", "The same fact is asked in many wordings — learn it once, firmly."], blocks:[
 {k:"hot", h:"<b>The three new criminal laws are now a regular part of SSC General Awareness.</b> Across recent CGL, CHSL, CPO, MTS, GD and Delhi Police shifts, roughly <b>180 questions in a year</b> came from this area: about <b>53 on BNS</b>, <b>42 on BNSS</b>, <b>43 on BSA</b>, plus a couple each on the Uniform Civil Code and the Telecommunications Act 2023. In a single CGL shift expect <b>0–2 questions</b>; Delhi Police and CPO ask more."},
 {k:"table", title:"What SSC actually asks (2024–2025 shifts)", head:["Question type","How often","Typical stem"], rows:[
  ["Which old law did it replace / when in force","Very often","“Bharatiya Sakshya Adhiniyam 2023 replaced which Act?”"],
  ["Numbers: sections, chapters","Very often","“How many sections does the BNSS have?” (531)"],
  ["New concept (e-FIR, Zero FIR, community service, electronic evidence)","Very often","“What new form of punishment did BNS introduce?”"],
  ["Section number of a famous change","Often (Delhi Police, CPO)","“Which BNSS section mandates video recording of search and seizure?” (105)"],
  ["Timelines (24 hours, 7 days, 60/90 days, 30/45 days)","Often","“Within how many days must the medical report of a rape victim be sent?” (7)"],
  ["Assertion–Reason / statement pairs","Regular in CGL","“A: Confession to police is inadmissible. R: Section 23 BSA keeps the voluntariness principle.”"],
  ["Related laws (UCC, Telecom Act, DPDP, POCSO)","Occasional","“Which state first implemented a UCC?” (Uttarakhand)"]]},
 {k:"p", h:"<b>The same fact is asked again and again in different words.</b> One shift asks “BSA treats electronic records as —”, the next asks “Which type of evidence is now at par with primary evidence?”. Learn each fact once, firmly, and you can answer every version of it. That is why this workbook repeats key facts in different wording in the question bank."},
 {k:"facts", title:"The 12 facts that cover most questions", rows:[
  ["BNS","Bharatiya Nyaya Sanhita 2023 → replaced IPC 1860 · 358 sections · 20 chapters · substantive law (offences & punishments)"],
  ["BNSS","Bharatiya Nagarik Suraksha Sanhita 2023 → replaced CrPC 1973 · 531 sections · 39 chapters · procedure"],
  ["BSA","Bharatiya Sakshya Adhiniyam 2023 → replaced Indian Evidence Act 1872 · 170 sections · 12 chapters · evidence"],
  ["Assent","President Droupadi Murmu, 25 December 2023"],
  ["In force","1 July 2024 (cases registered before that continue under the old laws)"],
  ["Introduced by","Union Home Minister Amit Shah (Lok Sabha, Aug 2023; revised Bills Dec 2023)"],
  ["Aim","Decolonise and modernise; ‘nyaya’ (justice) instead of ‘dand’ (punishment); victim-centric; speedy, technology-driven"],
  ["New punishment","Community service (BNS 4(f)) for petty offences"],
  ["Big new offences","Organised crime 111 · petty organised crime 112 · terrorist act 113 · mob lynching 103(2) · snatching 304"],
  ["Sedition","IPC 124A removed → BNS 152 (acts endangering sovereignty, unity and integrity of India)"],
  ["FIR","Zero FIR + e-FIR (BNSS 173); video recording of search & seizure (BNSS 105)"],
  ["Evidence","Electronic and digital records can be primary evidence; certificate under BSA 63 (old IEA 65B)"]]},
 {k:"trick", h:"<b>Remember the trio by the order of a case:</b> first you need to know the <b>crime</b> (BNS = Nyaya, what is an offence), then the <b>process</b> (BNSS = Nagarik Suraksha, police and court procedure), then the <b>proof</b> (BSA = Sakshya, evidence). Crime → Process → Proof."},
 {k:"trap", h:"SSC options often swap the pairs: “BNSS replaced the Indian Evidence Act” or “BSA replaced CrPC”. Match by meaning: <b>Sakshya = evidence</b>, <b>Nyaya = justice/offences</b>, <b>Nagarik Suraksha = citizen’s protection/procedure</b>."},
 {k:"link", h:"In SSC this topic sits inside Polity / Static GK. The Constitution side (Art 20, 21, 22 rights of arrested persons, Art 44 UCC, Art 42 maternity relief) is often asked alongside — see L8 and L14."},
 {k:"q", q:"Bharatiya Nagarik Suraksha Sanhita 2023 replaced which law?", o:["Code of Criminal Procedure 1973","Indian Penal Code 1860","Indian Evidence Act 1872","Information Technology Act 2000"], e:"BNSS is the procedure code; it replaced CrPC 1973."}
]},
{ id:"L2", heat:3, title:"History, dates & numbers", hi:"इतिहास, तिथियाँ और संख्याएँ", sum:["Sections 358 / 531 / 170; chapters 20 / 39 / 12 (BNS / BNSS / BSA).", "Old laws: IPC 511 sections, CrPC 484, Evidence Act 167.", "Introduced 11 Aug 2023 by Amit Shah; assent 25 Dec 2023; in force 1 July 2024.", "IPC drafted by Macaulay’s Law Commission (1834); Evidence Act by J. F. Stephen; 2020 reform committee under Prof. Ranbir Singh.", "BNS: 20 new offences, more imprisonment in 33, community service in 6, 19 provisions removed.", "Cases registered before 1 July 2024 continue under the old laws."], blocks:[

 {k:"tl", title:"Timeline", rows:[
  ["1834","First Law Commission (under the Charter Act 1833) chaired by <b>Lord Macaulay</b> drafts the Indian Penal Code"],
  ["1860","Indian Penal Code enacted (in force 1862) — 511 sections, 23 chapters"],
  ["1861","First Code of Criminal Procedure (revised 1882, 1898) — ended the different systems of the Bengal, Bombay and Madras Presidencies"],
  ["1872","Indian Evidence Act, drafted by <b>Sir James Fitzjames Stephen</b> — 167 sections, 11 chapters"],
  ["1973","CrPC 1973 (in force 1 April 1974) — 484 sections, 37 chapters"],
  ["2020","MHA sets up the Committee for Reforms in Criminal Laws under <b>Prof. Ranbir Singh</b> (VC, National Law University Delhi)"],
  ["11 Aug 2023","Three Bills introduced in the Lok Sabha by Home Minister <b>Amit Shah</b>; sent to the Parliamentary Standing Committee on Home Affairs"],
  ["Dec 2023","Revised Bills passed by both Houses (20–21 Dec)"],
  ["25 Dec 2023","President’s assent (Christmas Day)"],
  ["1 July 2024","All three laws come into force"]]},
 {k:"table", title:"The number table (memorise it)", head:["Law","Replaced","Sections","Chapters","Old law had"], rows:[
  ["<b>BNS</b> 2023","IPC 1860","<b>358</b>","<b>20</b>","511 sections, 23 chapters"],
  ["<b>BNSS</b> 2023","CrPC 1973","<b>531</b>","<b>39</b>","484 sections, 37 chapters"],
  ["<b>BSA</b> 2023","Indian Evidence Act 1872","<b>170</b>","<b>12</b>","167 sections, 11 chapters"]]},
 {k:"table", title:"What changed, in numbers (Government of India / PIB)", head:["Law","Change"], rows:[
  ["BNS","20 new offences · imprisonment increased for 33 offences · fines increased in 83 · mandatory minimum in 23 · community service for 6 · 19 provisions removed"],
  ["BNSS","177 provisions changed · 9 new sections · 39 new sub-sections · 44 new provisions/clarifications · timelines in 35 sections · audio-video in 35 places · 14 sections repealed"],
  ["BSA","24 provisions changed · 2 new provisions · 6 provisions repealed"]]},
 {k:"trick", h:"<b>Sections: 358 – 531 – 170.</b> Say it as “<b>3-5-8, 5-3-1, 1-7-0</b>”. BNS (358) has fewer sections than IPC (511) because it merged and removed many; BNSS (531) has <b>more</b> than CrPC (484); BSA (170) has <b>3 more</b> than the IEA (167). Chapters: <b>20 – 39 – 12</b>."},
 {k:"trick", h:"<b>Dates:</b> assent on <b>Christmas (25 Dec 2023)</b>, in force on <b>1 July 2024</b> — the same date GST began (1 July 2017). The Telecommunications Act 2023 got assent one day earlier, on Christmas Eve (24 Dec 2023)."},
 {k:"trap", h:"“In force from 1 January 2024” or “25 December 2024” are common wrong options. Assent = <b>25 Dec 2023</b>; in force = <b>1 July 2024</b>. Also, offences committed before 1 July 2024 are still tried under IPC/CrPC — the new laws are <b>not retrospective</b>."},
 {k:"ex", src:"PYQ-type · CHSL / CPO 2025", q:"How many sections are there in the Bharatiya Nagarik Suraksha Sanhita, 2023?", steps:["BNSS = procedure (replaced CrPC)","CrPC had 484; BNSS has more"], ans:"531 sections"},
 {k:"q", q:"The committee set up in 2020 to recommend reforms in criminal laws was headed by:", o:["Prof. Ranbir Singh","Justice J. S. Verma","Justice Malimath","Justice Rohini"], e:"MHA’s Committee for Reforms in Criminal Laws, chaired by Prof. Ranbir Singh (NLU Delhi)."}
]},

{ id:"L4", heat:1, title:"General exceptions, abetment & attempt", hi:"सामान्य अपवाद, दुष्प्रेरण और प्रयास", sum:["Mistake of fact excuses (BNS 14, 17); mistake of law never does.", "Soldier firing on a mob on a lawful order, hatchet head flying off with proper care, surgeon acting in good faith for a child → no offence.", "Abetment (BNS 45) = instigation, conspiracy or intentional aid; abettor need not be present.", "BNS 48: abetment from outside India is punishable; attempt is BNS 62."], blocks:[
 {k:"hot", h:"Asked as <b>case-based</b> questions in recent shifts: a soldier firing on a mob on orders, a man whose axe-head flies off, a surgeon operating in good faith. The answer is usually “no offence”."},
 {k:"table", title:"General exceptions (Chapter III) — the illustrations SSC uses", head:["Exception","BNS (IPC)","Case","Result"], rows:[
  ["Mistake of fact (bound by law)","14 (76)","A soldier fires on a mob on the order of his superior, in conformity with the law","No offence"],
  ["Mistake of fact (justified by law)","17 (79)","A seizes Z believing in good faith Z is a murderer, to hand him to police","No offence"],
  ["Accident in a lawful act","18 (80)","A is working with a hatchet with proper care; the head flies off and kills a man","No offence"],
  ["Child under 7","20 (82)","—","No offence"],
  ["Good faith for a child’s benefit, by guardian","27 (89)","A, in good faith, lets a surgeon perform a risky operation on his child; the child dies","No offence (neither A nor the surgeon)"],
  ["Private defence","34–44 (96–106)","Right to defend body and property","No offence within limits"]]},
 {k:"trick", h:"<b>Mistake of fact excuses; mistake of law never does.</b> “Ignorance of law is no excuse.” If the superior’s order itself is plainly illegal (e.g. firing on a peaceful protest), obeying it is no defence."},
 {k:"facts", title:"Abetment, conspiracy, attempt", rows:[
  ["Abetment (BNS 45)","Instigating, engaging in a conspiracy, or intentionally aiding — the abettor need not be present at the scene"],
  ["BNS 48 (new)","Abetment from <b>outside India</b> of an offence in India is punishable"],
  ["Act different from the one abetted","The abettor is still liable if it was a probable consequence"],
  ["Criminal conspiracy","BNS 61"],
  ["Attempt (BNS 62)","General clause: up to half the longest term for the offence"]]},
 {k:"ex", src:"PYQ-type · CGL 2025", q:"A is at work with a hatchet; the head flies off and kills a man standing nearby. A had taken proper care. Under BNS, A has —", steps:["Lawful act, done in a lawful manner, with proper care and caution","No criminal intention or negligence → BNS 18 (accident)"], ans:"committed no offence"},
 {k:"trap", h:"If the question says the hatchet head was <b>known to be loose</b> and A still swung it near people, that is negligence — the accident exception will not apply."},
 {k:"q", q:"Under BNS, who can be held liable for abetment of an offence?", o:["Anyone who instigates, conspires or intentionally aids it","Only the person who commits it","Only a public servant","Only a person present at the scene"], e:"BNS 45: instigation, conspiracy, intentional aid."}
]},
{ id:"L5", heat:3, title:"BNS: the new offences", hi:"BNS · नए अपराध", sum:["Mob lynching BNS 103(2): 5 or more people, grounds like race, caste, sex, language — not religion — death or life.", "111 organised crime (syndicate), 112 petty organised crime (gang theft, selling exam papers), 113 terrorist act.", "BNS 152 (SUI: sovereignty, unity, integrity) replaced sedition.", "Snatching BNS 304: up to 3 years; hit-and-run 106(2): up to 10 years.", "New: deceitful promise of marriage (69), hiring a child for crime (95, 3–10 years)."], blocks:[
 {k:"hot", h:"<b>“Which of the following is newly defined under BNS?”</b> is asked in almost every month of exams. Answers: mob lynching, organised crime, petty organised crime, terrorist act, snatching, hit-and-run, sexual intercourse by deceitful means, hiring a child for an offence."},
 {k:"table", title:"New offences at a glance", head:["BNS","Offence","Punishment (key point)"], rows:[
  ["103(2)","<b>Mob lynching</b> — murder by a group of <b>5 or more</b> on the ground of race, caste or community, sex, place of birth, language, personal belief or any similar ground","Death or life imprisonment + fine"],
  ["117(4)","Grievous hurt by a group of 5 or more on those grounds","Up to 7 years + fine"],
  ["106(2)","<b>Hit-and-run</b>: rash or negligent driving causing death and escaping without reporting to police or a magistrate","Up to 10 years + fine (kept on hold after the truckers’ protest, Jan 2024)"],
  ["106(1)","Death by rash or negligent act","Up to 5 years + fine (registered doctor: up to 2 years)"],
  ["111","<b>Organised crime</b> — by a <b>crime syndicate</b>: kidnapping, robbery, vehicle theft, extortion, land grabbing, contract killing, economic offences, cyber crime, trafficking…","If death: death or life + fine ≥ ₹10 lakh; else 5 years to life + fine ≥ ₹5 lakh"],
  ["112","<b>Petty organised crime</b> — theft, snatching, cheating, unauthorised selling of tickets, betting, <b>selling public exam question papers</b>, pick-pocketing (by a group/gang)","1 to 7 years + fine"],
  ["113","<b>Terrorist act</b> — first time in the general criminal law; threatens unity, integrity, sovereignty, security or <b>economic security</b> of India","If death: death or life; else 5 years to life"],
  ["152","Acts endangering <b>sovereignty, unity and integrity</b> of India (replaces sedition, IPC 124A) — by words, signs, electronic communication or financial means","Life or up to 7 years + fine"],
  ["304","<b>Snatching</b> — suddenly, quickly or forcibly seizing movable property (chain, phone, bag)","Up to 3 years + fine"],
  ["69","Sexual intercourse by <b>deceitful means</b> (false promise of marriage, job or promotion; hiding identity)","Up to 10 years + fine"],
  ["95","<b>Hiring or employing a child</b> to commit an offence","3 to 10 years + fine"],
  ["48","Abetment from outside India of an offence in India","As for abetment"]]},
 {k:"trick", h:"<b>111 – 112 – 113 = Organised – Petty – Terror.</b> One digit up each time, and the crimes get “bigger” in the middle and then the biggest: big gang (111), small gang (112), terror (113)."},
 {k:"trick", h:"<b>BNS 152 = “SUI”</b> — Sovereignty, Unity, Integrity. The word “sedition” (rajdroh) is gone; the new section is about the <b>nation</b> (deshdroh), not the government."},
 {k:"trap", h:"<b>Religion is NOT listed</b> as a ground for mob lynching in BNS 103(2) — the grounds are race, caste or community, sex, place of birth, language, personal belief or any other similar ground. And the group is <b>five or more</b>, not ten."},
 {k:"trap", h:"Snatching (304) is <b>new and separate</b> — it is not robbery and not dacoity. Dacoity = robbery by <b>five or more</b> persons (BNS 310)."},
 {k:"ex", src:"PYQ-type · CGL 2025", q:"Which of the following offences has been newly and clearly defined under the BNS 2023?", steps:["Defamation, theft and cheating existed in the IPC","Mob lynching is a new, separately defined offence (BNS 103(2))"], ans:"Mob lynching"},
 {k:"ex", src:"PYQ-type · CHSL 2025", q:"Which of the following is an example of petty organised crime under BNS?", steps:["BNS 112 lists theft, snatching, cheating, ticket selling, betting, selling exam papers, pick-pocketing","Done by a group or gang"], ans:"Theft committed by a gang"},
 {k:"link", h:"The Public Examinations (Prevention of Unfair Means) Act 2024 also targets paper leaks; under BNS, selling question papers is listed in petty organised crime (112)."},
 {k:"q", q:"Under BNS, the punishment for murder by mob lynching on grounds of caste or language is:", o:["Death or imprisonment for life, and fine","Up to 3 years","Up to 7 years only","Community service"], e:"BNS 103(2): death or life imprisonment, and fine."}
]},

 {k:"table", title:"Key sections", head:["BNS (IPC)","Offence","Punishment"], rows:[
  ["63 (375)","Rape — definition (still gender-specific: man → woman). Marital-rape exception kept: no rape if the wife is 18 or above","—"],
  ["64 (376)","Rape","Rigorous imprisonment <b>at least 10 years</b> up to life + fine"],

{ id:"L8", heat:3, title:"BNSS: FIR, police & arrest", hi:"BNSS · FIR, पुलिस और गिरफ्तारी", sum:["Zero FIR at any police station; e-FIR signed within 3 days (BNSS 173).", "Preliminary inquiry for 3–7 year offences within 14 days; FIRs tracked on CCTNS.", "Arrested person told the grounds of arrest and the right to bail (BNSS 47); a relative is informed (48).", "Produce before a magistrate within 24 hours (BNSS 58).", "Women, males under 15, persons over 60, the disabled and acutely ill need not go to the police station (BNSS 179)."], blocks:[

  ["35 (41)","Arrest without warrant; 35(3) notice of appearance instead of arrest"],

{ id:"L9", heat:3, title:"BNSS: custody, bail & undertrials", hi:"BNSS · हिरासत, ज़मानत और विचाराधीन क़ैदी", sum:["Police custody: 15 days in total, now allowed in parts (BNSS 187).", "Default bail if no charge-sheet in 60 days (below 10 years) or 90 days (10 years, life, death) — granted by the magistrate.", "Undertrials (BNSS 479): first-time offenders released after one-third of the maximum, others after half.", "Plea bargaining within 30 days of framing of charge (BNSS 290).", "Bail bond = with surety; bond = without surety; anticipatory bail is now BNSS 482."], blocks:[

{ id:"L10", heat:3, title:"BNSS: technology, investigation & courts", hi:"BNSS · तकनीक, जाँच और न्यायालय", sum:["BNSS 105: audio-video recording of search and seizure.", "Forensic team mandatory for offences of 7 years or more (176(3)); voice samples allowed (349).", "e-FIR, e-summons, e-warrants and trials in electronic mode (530).", "Metropolitan Magistrate abolished; CJM up to 7 years, JMFC up to 3 years and ₹50,000.", "Deemed sanction after 120 days (218); trial in absentia for proclaimed offenders (356); summary trial sentence max 3 months."], blocks:[

{ id:"L12", heat:3, title:"BSA: documents & electronic evidence", hi:"BSA · दस्तावेज़ और इलेक्ट्रॉनिक साक्ष्य", sum:["BSA: 170 sections, 12 chapters; applies to courts-martial, not to affidavits or arbitration.", "Document (2(1)(d)) includes emails, server logs, messages and other electronic records.", "Electronic records are primary evidence (57) with the same legal value as paper (61).", "Certificate for electronic records: BSA 63 (old 65B), signed by the person in charge and an expert.", "Secondary evidence (58) only when the original is unavailable (60); presumptions: may, shall, conclusive — not ‘probable inference’."], blocks:[
 {k:"hot", h:"<b>“Electronic records are now primary evidence”</b> is the single most asked BSA fact, in a dozen different wordings. Close behind: what counts as a document, the certificate (old 65B, now 63), and the IT Act link."},
 {k:"facts", title:"BSA in one box", rows:[
  ["Replaced","Indian Evidence Act 1872"],
  ["Size","170 sections, 12 chapters"],
  ["Applies to","All judicial proceedings in any court, including <b>courts-martial</b>"],
  ["Does NOT apply to","<b>Affidavits</b> and <b>arbitration</b> proceedings"],
  ["Aligned with","IT Act 2000 (for electronic records, digital signatures)"],
  ["Aim","Recognise modern digital evidence; consolidate and modernise the law of evidence"]]},
 {k:"table", title:"Key sections", head:["BSA (IEA)","Rule"], rows:[
  ["2(1)(d)","<b>Document</b> includes electronic and digital records: emails, server logs, documents on computers, laptops or smartphones, messages, websites, locational evidence, voice mail"],
  ["2(1)(e)","<b>Evidence</b> includes oral evidence and documents incl. electronic records; also information given electronically"],
  ["4 (6)","Facts forming part of the same transaction (<i>res gestae</i>)"],
  ["6 (8)","Motive, preparation and conduct"],
  ["55 (60)","Oral evidence must be <b>direct</b> (what the witness saw, heard, perceived) — hearsay is not admissible"],
  ["57 (62)","<b>Primary evidence</b> — now includes electronic records; each copy stored simultaneously (cloud, mirror backup) is primary"],
  ["58 (63)","<b>Secondary evidence</b> — copies, counterparts; expanded to oral and written admissions and expert evidence"],
  ["60 (65)","When secondary evidence may be given — original lost, destroyed, in the opponent’s possession, etc."],
  ["61","Electronic or digital record cannot be refused as evidence just because it is electronic — same legal effect as paper"],
  ["63 (65B)","<b>Certificate</b> for admissibility of electronic records — signed by the person in charge of the device <b>and</b> an expert; includes the hash value"],
  ["39 (45)","Expert opinion — includes the <b>Examiner of Electronic Evidence</b>; advisory, not binding"]]},
 {k:"formula", title:"Presumptions in BSA", rows:[
  ["May presume","court may treat as proved unless disproved"],
  ["Shall presume","court must treat as proved unless disproved"],
  ["Conclusive proof","no evidence allowed to disprove"],
  ["NOT a category","“Probable inference” (SSC distractor)"]]},
 {k:"trick", h:"<b>“E = P”</b>: Electronic = Primary. Whatever the wording — “at par with”, “equal legal status”, “treated the same as paper” — the answer is that electronic evidence has the same value as paper/primary evidence."},
 {k:"trap", h:"Verbal agreements, gestures and thoughts are <b>not documents</b>. A <b>server log file</b> is. And “electronic records are secondary unless certified” is a false statement."},
 {k:"ex", src:"PYQ-type · CGL 2025", q:"Assertion (A): BSA recognises electronic records as primary evidence. Reason (R): BSA states that electronic records are secondary evidence unless certified.", steps:["A is the headline change of BSA — true","R contradicts A and is false"], ans:"A is true, but R is false"},
 {k:"q", q:"Which of these is explicitly a document under BSA 2023?", o:["A server log file","A verbal agreement","A gesture","A spontaneous thought"], e:"BSA 2(1)(d): document includes electronic and digital records such as server logs."}
]},
{ id:"L13", heat:2, title:"BSA: confessions, admissions & witnesses", hi:"BSA · स्वीकारोक्ति, स्वीकृति और गवाह", sum:["Confession to police or in police custody is inadmissible unless made before a magistrate (BSA 23).", "Discovery-of-fact proviso: only the part leading to a discovered fact is admissible.", "Confession by threat or inducement: BSA 22; co-accused: 24; dying declaration: 26.", "Oral evidence must be direct (55); hearsay is inadmissible; expert opinion is advisory (39).", "Burden of proof on the prosecution beyond reasonable doubt (104)."], blocks:[

 {k:"table", title:"Confessions", head:["BSA (IEA)","Rule"], rows:[
  ["22 (24)","Confession caused by threat, inducement or promise is irrelevant"],
  ["23 (25, 26)","Confession to a <b>police officer</b>, or while in <b>police custody</b>, cannot be proved — unless made before a <b>magistrate</b>"],

  ["26 (32)","Dying declaration and other statements of persons who cannot be called"]]},

 {k:"facts", title:"Witnesses & proof", rows:[
  ["Oral evidence","Must be direct (BSA 55); <b>hearsay</b> (what someone else told the witness) is inadmissible"],

<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>

<title>Physical Geography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Shared by every History page (built by tools/history/build.js).
   Layout: a manuscript folio — parchment paper, maroon ink, gold figures; one-column app with a bottom tab bar. */
:root{
  --paper:#f3efe4; --sheet:#fffdf6; --sunk:#e8e1cf;
  --ink:#241c14; --ink2:#5d5141; --rule:#d8cdb4;
  --blue:#7a2230; --on-blue:#ffffff; --blue-bg:#f4e2e1;
  --accent:#9a6a12; --accent-bg:#f8ecc9;
  --good:#1b6b4a; --good-bg:#ddefe4; --bad:#a8291f; --bad-bg:#f8e0dc;
  --warn-bg:#fcf0cf;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* era groups on the Learn screen */
.eras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.erac{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:grid;gap:6px}
.erac b{font-family:var(--f-display);font-size:15px;font-weight:700;line-height:1.25}
.erac .hi{font-size:12px;color:var(--ink2)}
.erac .mt{font-family:var(--f-num);font-size:11px;color:var(--ink2)}
.erac .meter{height:6px}
.erac[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.grph{display:flex;align-items:baseline;gap:8px;padding:14px 2px 4px;border-top:2px solid var(--ink);margin-top:4px}
.grph h2{font-size:17px}
.grph span{font-size:12px;color:var(--ink2);margin-left:auto;font-family:var(--f-num)}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}
.dots{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--rule);display:block}
.dots i.on{background:var(--accent)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.hot{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px;font-size:15px}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.facts.prose dd{font-weight:400;line-height:1.55}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap,.link{border-radius:var(--r);padding:12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.link{background:var(--sunk);border-color:transparent}
.trick .lab,.trap .lab,.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.link .lab{color:var(--ink2)}
.mn{font-family:var(--f-num);font-weight:600;background:var(--sheet);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.tag.src{background:var(--good-bg);color:var(--good)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:22px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
/* one-line revision rows (last week / last moment) */
.lines{display:grid;gap:0}
.lines div{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px dashed var(--rule);font-size:15px}
.lines div:first-child{border-top:0}
.lines b{font-weight:700}
.lines span{color:var(--ink2)}
.callout{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;font-size:15px}

/* plan maker */
.plancfg{display:grid;gap:12px}
.pday{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.pday > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pday > summary::-webkit-details-marker{display:none}
.pday .dno{font-family:var(--f-num);font-weight:700;font-size:13px;background:var(--sunk);border-radius:99px;padding:2px 10px;white-space:nowrap}
.pday.cur .dno{background:var(--blue);color:var(--on-blue)}
.pday.allgood .dno{background:var(--good-bg);color:var(--good)}
.pday .dt{min-width:0;font-weight:600;font-size:15px}
.pday .dt small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
.pday .dp{font-family:var(--f-num);font-size:12px;color:var(--ink2);white-space:nowrap}
.pday .body{padding:0 14px 12px;display:grid;gap:8px;border-top:1px dashed var(--rule);margin-top:2px;padding-top:10px}
.ptask{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;width:100%;font-size:15px}
.ptask .box{width:22px;height:22px;border-radius:6px;border:1.6px solid var(--rule);display:grid;place-items:center;font-size:14px;color:var(--on-blue);margin-top:1px}
.ptask[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.ptask[aria-pressed="true"] .lbl{text-decoration:line-through;color:var(--ink2)}
.ptask .lbl small{display:block;font-size:12px;color:var(--ink2);text-decoration:none}
/* the story first: plain-language opener for beginners */
.story{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;font-size:16.5px;line-height:1.65}
.story .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.story p{margin:0}
.story .key{background:var(--blue-bg);border-radius:8px;padding:8px 12px;font-size:15px;line-height:1.5}
.story .key b{color:var(--blue)}
/* hub: app cards and the beginner path */
.appcs{display:grid;gap:12px}
.appc{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;text-align:left;width:100%;cursor:pointer}
.appc:hover{border-color:var(--blue)}
.appc .hd{display:flex;align-items:center;gap:10px}
.appc .ic{font-size:26px;line-height:1}
.appc .hd b{font-family:var(--f-display);font-size:17px;font-weight:700;display:block}
.appc .hd small{font-size:12px;color:var(--ink2)}

{"id":"Y1","heat":2,"title":"The universe and the Solar System","hi":"ब्रह्मांड और सौरमंडल","blocks":[{"k":"hot","h":"Asked again and again: the <b>planet records<\/b> (largest Jupiter, smallest Mercury, hottest Venus, Red Planet Mars, farthest Neptune), <b>which moon belongs to which planet<\/b> (Ganymede, Titan, Phobos), and <b>Pluto's demotion<\/b> in 2006."},{"k":"story","h":"<p>The universe began with the <b>Big Bang<\/b> about <b>13.8 billion years<\/b> ago. Our Sun is one of billions of stars in the <b>Milky Way<\/b>, a spiral galaxy. Around the Sun go <b>eight planets<\/b>: four small rocky ones — <b>Mercury, Venus, Earth, Mars<\/b> — then, beyond the asteroid belt, four giants — <b>Jupiter, Saturn, Uranus, Neptune<\/b>.<\/p><p>In <b>2006<\/b> the International Astronomical Union (meeting in Prague) made <b>Pluto<\/b> a <b>dwarf planet<\/b>. Earth formed about <b>4.6 billion years<\/b> ago. Sunlight takes about <b>8 minutes 20 seconds<\/b> to reach us; moonlight about 1.3 seconds.<\/p>","key":"My Very Educated Mother Just Served Us Nachos — Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune."},{"k":"facts","title":"Quick numbers","rows":[["Age of the universe","About 13.8 billion years"],["Age of the Earth","About 4.6 billion years"],["Sunlight to Earth","About 8 minutes 20 seconds"],["Earth–Moon distance","About 3,84,400 km"],["Nearest star after the Sun","Proxima Centauri, about 4.2 light-years away"],["Asteroid belt","Between Mars and Jupiter; Ceres is the largest object in it"],["Halley's Comet","Returns about every 76 years — last seen 1986, next in 2061"],["Light-year","A unit of distance (not time): how far light travels in a year"]]},{"k":"info","title":"The planets in order","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 170\" role=\"img\" aria-label=\"The planets in order from the Sun\">\n  <circle cx=\"-60\" cy=\"85\" r=\"110\" fill=\"#f6b73c\"/><circle cx=\"-60\" cy=\"85\" r=\"118\" fill=\"none\" stroke=\"#f6b73c\" opacity=\".35\" stroke-width=\"6\"/>\n  <g class=\"anim-in\" style=\"animation-delay:0ms\"><circle cx=\"75.97670477771824\" cy=\"85\" r=\"5.976704777718237\" fill=\"#9a8f87\"/><text x=\"75.97670477771824\" y=\"71.02329522228176\" text-anchor=\"middle\" font-size=\"11.5\" class=\"b\">Mercury<\/text><\/g><g class=\"anim-in\" style=\"animation-delay:90ms\"><circle cx=\"111.34537420613657\" cy=\"85\" r=\"9.391964650700087\" fill=\"#d9a441\"/><text x=\"111.34537420613657\" y=\"112.39196465070009\" text-anchor=\"middle\" font-size=\"11.5\" class=\"b\">Venus<\/text><\/g><g class=\"anim-in\" style=\"animation-delay:180ms\"><circle cx=\"150.3593448846876\" cy=\"85\" r=\"9.62200602785095\" fill=\"#2f7fbf\"/><text x=\"150.3593448846876\" y=\"67.37799397214906\" text-anchor=\"middle\" font-size=\"11.5\" class=\"b\">Earth<\/text><\/g><g class=\"anim-in\" style=\"animation-delay:270ms\"><circle cx=\"187.0220895101574\" cy=\"85\" r=\"7.040738597618861\" fill=\"#c0503a\"/><text x=\"187.0220895101574\" y=\"110.04073859761886\" text-anchor=\"middle\" font-size=\"11.5\" class=\"b\">Mars<\/text><\/g><g class=\"anim-in\" style=\"animation-delay:360ms\"><circle cx=\"246.35013211415003\" cy=\"85\" r=\"32.28730400637378\" fill=\"#c99a6b\"/><text x=\"246.35013211415003\" y=\"44.71269599362622\" text-anchor=\"middle\" font-size=\"11.5\" class=\"b\">Jupiter<\/text><\/g><g class=\"anim-in\" style=\"animation-delay:450ms\"><ellipse cx=\"353.35491961528993\" cy=\"85\" rx=\"53.23863258950215\" ry=\"13.309658147375538\" fill=\"none\" stroke=\"#bfa66b\" stroke-width=\"3\"/><circle cx=\"353.35491961528993\" cy=\"85\" r=\"29.577018105278974\" fill=\"#d8c08a\"/><text x=\"353.35491961528993\" y=\"132.57701810527897\" text-anchor=\"middle\" font-size=\"11.5\" class=\"b\">Saturn<\/text><\/g><g class=\"anim-in\" style=\"animation-delay:540ms\"><circle cx=\"447.35425986712175\" cy=\"85\" r=\"19.281856757065697\" fill=\"#7fc6cf\"/><text x=\"447.35425986712175\" y=\"57.7181432429343\" text-anchor=\"middle\" font-size=\"11.5\" class=\"b\">Uranus<\/text><\/g><g class=\"anim-in\" style=\"animation-delay:630ms\"><circle cx=\"505.53611662418746\" cy=\"85\" r=\"18.900000000000002\" fill=\"#3e64c4\"/><text x=\"505.53611662418746\" y=\"121.9\" text-anchor=\"middle\" font-size=\"11.5\" class=\"b\">Neptune<\/text><\/g>\n  <text x=\"40\" y=\"160\" text-anchor=\"start\" font-size=\"12\" class=\"b\">Sun<\/text><text x=\"675\" y=\"160\" text-anchor=\"end\" font-size=\"10.5\" class=\"mut\">Rocky four · Gas giants · Ice giants  (sizes to scale, distances not)<\/text><\/svg><\/figure>","cap":"My Very Educated Mother Just Served Us Noodles — Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune. Jupiter is the largest; Mercury the smallest."},{"k":"table","title":"Planet records","head":["Which planet…","Planet","Note"],"rows":[["is the largest","Jupiter","More than 1,300 Earths could fit inside it."],["is the smallest","Mercury","Only a little bigger than our Moon."],["is closest to the Sun","Mercury","About 58 million km from the Sun."],["is the hottest","Venus","Thick carbon dioxide air traps heat — hotter than Mercury."],["is called the Red Planet","Mars","Iron oxide (rust) in its soil makes it red."],["is called Earth's twin","Venus","Almost the same size and mass as Earth."],["is the brightest seen from Earth","Venus","Called the Morning Star and the Evening Star."],["has the most famous rings","Saturn","Rings of ice and rock."],["is less dense than water","Saturn","It would float in a big enough bath."],["spins on its side","Uranus","Its axis is tilted about 98°."],["is farthest from the Sun","Neptune","Since Pluto became a dwarf planet in 2006."],["spins fastest (shortest day)","Jupiter","A day of under 10 hours."],["has the longest day","Venus","Its day (243 Earth days) is longer than its year (225 days)."],["has the shortest year","Mercury","Goes round the Sun in 88 days."],["is the densest","Earth","Earth is the densest planet of the Solar System."],["has Olympus Mons, the highest volcano","Mars","About 22 km high — two and a half times Everest."],["has the Great Red Spot","Jupiter","A giant storm bigger than Earth."],["has the most known moons (as of 2025)","Saturn","274 after 128 new moons were announced in March 2025."]]},{"k":"photos","title":"The planets in pictures","items":[["Mercury","Mercury","Smallest · nearest"],["Venus","Venus","Hottest · Earth's twin"],["Earth","Earth","Densest"],["Mars","Mars","Red Planet"],["Jupiter","Jupiter","Largest"],["Saturn","Saturn","Rings · most moons"],["Uranus","Uranus","Spins on its side"],["Neptune","Neptune","Farthest"]]},{"k":"table","title":"Famous moons","head":["Moon","Planet","Note"],"rows":[["Ganymede","Jupiter","The largest moon in the Solar System — bigger than Mercury."],["Io","Jupiter","The most volcanic body in the Solar System."],["Europa","Jupiter","Ice crust with an ocean under it."],["Titan","Saturn","Second-largest moon; the only moon with thick air."],["Enceladus","Saturn","Shoots water jets from its south pole."],["Phobos","Mars","The larger of Mars's two moons."],["Deimos","Mars","The smaller of Mars's two moons."],["Triton","Neptune","Goes round its planet backwards (retrograde)."],["Titania","Uranus","Uranus's moons are named after characters from Shakespeare and Pope."],["Charon","Pluto","Pluto is a dwarf planet; Charon is half its size."]]},{"k":"trick","h":"Order of the planets: <b>“My Very Educated Mother Just Served Us Nachos.”<\/b> Inner rocky four = <b>MVEM<\/b>; outer giants = <b>JSUN<\/b> (sounds like 'Sun' — they are the big ones)."},{"k":"trap","h":"The <b>hottest<\/b> planet is <b>Venus<\/b>, not Mercury, even though Mercury is closer. <b>Mercury and Venus have no moons<\/b>. A <b>light-year measures distance<\/b>, not time. The <b>largest moon<\/b> is Ganymede (Jupiter), not Titan."}],"sum":["Eight planets: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.","Largest Jupiter, smallest Mercury, hottest Venus, densest Earth, farthest Neptune.","Venus spins backwards and has a day longer than its year; Uranus spins on its side.","Largest moon Ganymede (Jupiter); Titan (Saturn) has thick air; Phobos and Deimos orbit Mars.","Pluto became a dwarf planet in 2006; sunlight reaches Earth in about 8 minutes 20 seconds."],"part":["Part 1 · The Earth in space","पृथ्वी और अंतरिक्ष"],"g":"pg"},
{"id":"Y2","heat":3,"title":"Earth's motions, latitude, longitude, time and eclipses","hi":"पृथ्वी की गतियाँ, अक्षांश-देशांतर, समय और ग्रहण","blocks":[{"k":"hot","h":"Favourites: <b>rotation vs revolution<\/b>, the <b>solstice and equinox dates<\/b>, <b>1° longitude = 4 minutes<\/b>, <b>IST meridian 82½° E<\/b> (near Mirzapur), the <b>International Date Line<\/b> (180°), and <b>when eclipses happen<\/b>."},{"k":"story","h":"<p>The Earth does two things at once. It <b>rotates<\/b> on its axis from <b>west to east<\/b> once in about 24 hours — that gives <b>day and night<\/b> and makes the Sun seem to rise in the east. It also <b>revolves<\/b> round the Sun in about <b>365¼ days<\/b> — the extra quarter day adds up to a <b>leap year<\/b> every fourth year. Because the axis is <b>tilted 23½°<\/b>, the Sun's direct rays move between the two tropics, which gives us <b>seasons<\/b>.<\/p><p>Lines of <b>latitude<\/b> run east–west and measure distance from the Equator; lines of <b>longitude<\/b> (meridians) run pole to pole and measure time. The Earth turns 360° in 24 hours, so <b>15° = 1 hour<\/b> and <b>1° = 4 minutes<\/b>. India keeps one time, set by <b>82½° E<\/b>: <b>IST = GMT + 5 h 30 min<\/b>. On the far side of the world the <b>International Date Line<\/b> (about 180°) is where the date changes.<\/p>","key":"Rotation → day and night; revolution + tilt → seasons; 15° = 1 hour; IST = GMT + 5:30."},{"k":"facts","title":"Earth's motions and time","rows":[["Rotation","About 24 hours (23 h 56 min against the stars), west to east"],["Revolution","About 365¼ days — hence a leap year every 4 years"],["Tilt of the axis","23½° from the vertical (66½° to the plane of its orbit)"],["Circle of illumination","The line that divides day from night"],["Time and longitude","15° = 1 hour; 1° = 4 minutes"],["Indian Standard Time","82½° E (near Mirzapur, UP) — GMT + 5 h 30 min"],["Arunachal vs Gujarat","About 30° of longitude apart — about 2 hours of Sun time"],["Crossing the Date Line","Going west (America → Asia): add a day. Going east (Asia → America): repeat a day"]]},{"k":"table","title":"Solstices, equinoxes and the Earth's orbit","head":["Event","Date","Note"],"rows":[["Summer solstice (longest day in the northern half)","21 June","The Sun is overhead on the Tropic of Cancer."],["Winter solstice (shortest day in the northern half)","22 December","The Sun is overhead on the Tropic of Capricorn."],["Spring (vernal) equinox","21 March","Sun overhead on the Equator; day = night everywhere."],["Autumn equinox","23 September","Sun overhead on the Equator again."],["Perihelion (Earth nearest the Sun)","About 3 January","Earth is nearest the Sun in the northern winter!"],["Aphelion (Earth farthest from the Sun)","About 4 July",""]]},{"k":"info","title":"Earth's orbit and the seasons","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 300\" role=\"img\" aria-label=\"Earth's orbit and the seasons\">\n  <ellipse cx=\"340\" cy=\"150\" rx=\"215\" ry=\"105\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"2\" stroke-dasharray=\"5 5\"/>\n  <circle cx=\"320\" cy=\"150\" r=\"26\" fill=\"#f6b73c\"/><text x=\"320\" y=\"154\" text-anchor=\"middle\" font-size=\"11\" class=\"b\">Sun<\/text>\n  <g><circle cx=\"125\" cy=\"150\" r=\"13\" fill=\"#2f7fbf\"/><line x1=\"131\" y1=\"132\" x2=\"119\" y2=\"168\" stroke=\"var(--ink)\" stroke-width=\"1.5\"/><text x=\"125\" y=\"184\" text-anchor=\"middle\" font-size=\"12\" class=\"b\">21 June<\/text><text x=\"125\" y=\"198\" text-anchor=\"middle\" font-size=\"10\" class=\"mut\">Summer solstice<\/text><\/g><g><circle cx=\"340\" cy=\"255\" r=\"13\" fill=\"#2f7fbf\"/><line x1=\"346\" y1=\"237\" x2=\"334\" y2=\"273\" stroke=\"var(--ink)\" stroke-width=\"1.5\"/><text x=\"340\" y=\"289\" text-anchor=\"middle\" font-size=\"12\" class=\"b\">23 September<\/text><text x=\"340\" y=\"303\" text-anchor=\"middle\" font-size=\"10\" class=\"mut\">Equinox<\/text><\/g><g><circle cx=\"555\" cy=\"150\" r=\"13\" fill=\"#2f7fbf\"/><line x1=\"561\" y1=\"132\" x2=\"549\" y2=\"168\" stroke=\"var(--ink)\" stroke-width=\"1.5\"/><text x=\"555\" y=\"184\" text-anchor=\"middle\" font-size=\"12\" class=\"b\">22 December<\/text><text x=\"555\" y=\"198\" text-anchor=\"middle\" font-size=\"10\" class=\"mut\">Winter solstice<\/text><\/g><g><circle cx=\"340\" cy=\"45\" r=\"13\" fill=\"#2f7fbf\"/><line x1=\"346\" y1=\"27\" x2=\"334\" y2=\"63\" stroke=\"var(--ink)\" stroke-width=\"1.5\"/><text x=\"340\" y=\"23\" text-anchor=\"middle\" font-size=\"12\" class=\"b\">21 March<\/text><text x=\"340\" y=\"37\" text-anchor=\"middle\" font-size=\"10\" class=\"mut\">Equinox<\/text><\/g>\n  <circle r=\"7\" fill=\"#2f7fbf\" stroke=\"#fff\" stroke-width=\"1.5\"><animateMotion dur=\"14s\" repeatCount=\"indefinite\" path=\"M125,150 A215,105 0 1,0 555,150 A215,105 0 1,0 125,150\"/><\/circle>\n  <text x=\"130\" y=\"290\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">Aphelion ~4 July (farthest)<\/text><text x=\"560\" y=\"290\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">Perihelion ~3 January (nearest)<\/text><\/svg><\/figure>","cap":"The axis stays tilted the same way (23½°): in June the north leans towards the Sun (summer, Sun over the Tropic of Cancer); in December away from it (Sun over the Tropic of Capricorn). The tilt, not the distance, makes the seasons — Earth is nearest the Sun in January. The small Earth moves round the orbit anticlockwise."},{"k":"table","title":"Important lines","head":["Line","Where","Note"],"rows":[["Equator","0° latitude","The longest parallel; divides the north and south halves."],["Tropic of Cancer","23½° N","Passes through eight Indian states."],["Tropic of Capricorn","23½° S","Does not pass through India."],["Arctic Circle","66½° N","North of it: at least one 24-hour day and night each year."],["Antarctic Circle","66½° S",""],["Prime Meridian (Greenwich)","0° longitude","Passes through Greenwich, London; base of GMT."],["International Date Line","180° longitude","Bends to avoid splitting island groups and countries."],["Indian Standard Meridian","82½° E","Passes near Mirzapur (UP); IST = GMT + 5:30."]]},{"k":"info","title":"The lines on the globe","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 260\" role=\"img\" aria-label=\"Lines of latitude and longitude\">\n  <circle cx=\"200\" cy=\"130\" r=\"115\" class=\"s3\" stroke=\"var(--rule)\"/>\n  <line x1=\"154.1\" y1=\"24.5\" x2=\"245.9\" y2=\"24.5\" stroke=\"#5a7fa8\" stroke-width=\"1.5\"/><line x1=\"245.9\" y1=\"24.5\" x2=\"340\" y2=\"24.5\" class=\"grid\" stroke-dasharray=\"3 3\"/><text x=\"346\" y=\"28.538091445710734\" text-anchor=\"start\" font-size=\"12\" class=\"b\">Arctic Circle 66½°N<\/text><line x1=\"94.5\" y1=\"84.1\" x2=\"305.5\" y2=\"84.1\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><line x1=\"305.5\" y1=\"84.1\" x2=\"340\" y2=\"84.1\" class=\"grid\" stroke-dasharray=\"3 3\"/><text x=\"346\" y=\"88.14385707359668\" text-anchor=\"start\" font-size=\"12\" class=\"b\">Tropic of Cancer 23½°N<\/text><line x1=\"85.0\" y1=\"130.0\" x2=\"315.0\" y2=\"130.0\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/><line x1=\"315.0\" y1=\"130.0\" x2=\"340\" y2=\"130.0\" class=\"grid\" stroke-dasharray=\"3 3\"/><text x=\"346\" y=\"134\" text-anchor=\"start\" font-size=\"12\" class=\"b\">Equator 0°<\/text><line x1=\"94.5\" y1=\"175.9\" x2=\"305.5\" y2=\"175.9\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><line x1=\"305.5\" y1=\"175.9\" x2=\"340\" y2=\"175.9\" class=\"grid\" stroke-dasharray=\"3 3\"/><text x=\"346\" y=\"179.85614292640332\" text-anchor=\"start\" font-size=\"12\" class=\"b\">Tropic of Capricorn 23½°S<\/text><line x1=\"154.1\" y1=\"235.5\" x2=\"245.9\" y2=\"235.5\" stroke=\"#5a7fa8\" stroke-width=\"1.5\"/><line x1=\"245.9\" y1=\"235.5\" x2=\"340\" y2=\"235.5\" class=\"grid\" stroke-dasharray=\"3 3\"/><text x=\"346\" y=\"239.46190855428927\" text-anchor=\"start\" font-size=\"12\" class=\"b\">Antarctic Circle 66½°S<\/text>\n  <ellipse cx=\"200\" cy=\"130\" rx=\"40\" ry=\"115\" fill=\"none\" stroke=\"#2f6db5\" stroke-width=\"1.5\"/><text x=\"560\" y=\"230\" text-anchor=\"middle\" font-size=\"11.5\" class=\"acc-t\">Prime Meridian 0° · Greenwich<\/text><text x=\"560\" y=\"248\" text-anchor=\"middle\" font-size=\"11.5\" class=\"acc-t\">International Date Line 180°<\/text><\/svg><\/figure>","cap":"Parallels run east–west and measure latitude; meridians run pole to pole and measure longitude. 15° of longitude = 1 hour of time."},{"k":"table","title":"Eclipse words","head":["Term","Meaning","Note"],"rows":[["Solar eclipse","The Moon comes between the Sun and the Earth","Happens only on a new moon (amavasya)."],["Lunar eclipse","The Earth comes between the Sun and the Moon","Happens only on a full moon (purnima)."],["Umbra","The dark central shadow","Inside it the eclipse is total."],["Penumbra","The lighter outer shadow","Inside it the eclipse is partial."],["Annular eclipse","The Moon is too far to cover the Sun — a ring of light is left","Often called a 'ring of fire' eclipse."],["Syzygy","The Sun, Earth and Moon in a straight line","Needed for eclipses and spring tides."]]},{"k":"info","title":"Solar and lunar eclipses","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 230\" role=\"img\" aria-label=\"Solar and lunar eclipses\">\n  <circle cx=\"60\" cy=\"60\" r=\"34\" fill=\"#f6b73c\"/><path d=\"M60 26 L330 54 L330 66 L60 94 Z\" fill=\"#f6b73c\" opacity=\".12\"/><circle cx=\"330\" cy=\"60\" r=\"9\" fill=\"#9a9a9a\"/><path d=\"M339 52 L520 60 L339 68 Z\" fill=\"#333\" opacity=\".45\"/><circle cx=\"540\" cy=\"60\" r=\"22\" fill=\"#2f7fbf\"/><text x=\"60\" y=\"112\" text-anchor=\"middle\" font-size=\"11\" class=\"b\">Sun<\/text><text x=\"330\" y=\"100\" text-anchor=\"middle\" font-size=\"11\" class=\"b\">Moon<\/text><text x=\"540\" y=\"100\" text-anchor=\"middle\" font-size=\"11\" class=\"b\">Earth<\/text><text x=\"340\" y=\"20\" text-anchor=\"middle\" font-size=\"11.5\" class=\"b\">Solar eclipse — the Moon comes between the Sun and Earth (new moon)<\/text><circle cx=\"60\" cy=\"170\" r=\"34\" fill=\"#f6b73c\"/><path d=\"M60 136 L520 154 L520 186 L60 204 Z\" fill=\"#f6b73c\" opacity=\".12\"/><circle cx=\"420\" cy=\"170\" r=\"22\" fill=\"#2f7fbf\"/><path d=\"M442 150 L600 170 L442 190 Z\" fill=\"#333\" opacity=\".45\"/><circle cx=\"600\" cy=\"170\" r=\"9\" fill=\"#8a5a44\"/><text x=\"60\" y=\"222\" text-anchor=\"middle\" font-size=\"11\" class=\"b\">Sun<\/text><text x=\"420\" y=\"210\" text-anchor=\"middle\" font-size=\"11\" class=\"b\">Earth<\/text><text x=\"600\" y=\"210\" text-anchor=\"middle\" font-size=\"11\" class=\"b\">Moon<\/text><text x=\"340\" y=\"130\" text-anchor=\"middle\" font-size=\"11.5\" class=\"b\">Lunar eclipse — Earth comes between the Sun and the Moon (full moon)<\/text><\/svg><\/figure>","cap":"A solar eclipse can only happen at new moon; a lunar eclipse only at full moon. The Moon's dark shadow is the umbra, the lighter one the penumbra."},{"k":"trick","h":"<b>“SoLar = Lunar sandwich”<\/b>: in a <b>So<\/b>lar eclipse the <b>M<\/b>oon is in the middle (S-M-E); in a <b>Lu<\/b>nar eclipse the <b>E<\/b>arth is in the middle (S-E-M). Solar → <b>new<\/b> moon; lunar → <b>full<\/b> moon."},{"k":"trap","h":"Earth is <b>nearest the Sun in January<\/b> (perihelion) — seasons come from the <b>tilt<\/b>, not the distance. Latitude lines are <b>parallels<\/b>; longitude lines are <b>meridians<\/b>. IST is <b>ahead<\/b> of GMT (+5:30), not behind."}],"sum":["Rotation (west to east, about 24 h) gives day and night; revolution (365¼ days) plus the 23½° tilt gives seasons.","Solstices 21 June and 22 December; equinoxes 21 March and 23 September.","15° of longitude = 1 hour; 1° = 4 minutes; IST is set at 82½° E, GMT + 5:30.","Tropic of Cancer 23½° N, Arctic Circle 66½° N; Prime Meridian 0°, International Date Line about 180°.","A solar eclipse comes on a new moon (Moon in the middle); a lunar eclipse on a full moon (Earth in the middle)."],"part":["Part 1 · The Earth in space","पृथ्वी और अंतरिक्ष"],"g":"pg"},
{"id":"Y3","heat":3,"title":"Inside the Earth, and its rocks","hi":"पृथ्वी की आंतरिक संरचना और चट्टानें","blocks":[{"k":"hot","h":"Asked every year: <b>which discontinuity lies between which layers<\/b> (Moho, Gutenberg, Lehmann), <b>SIAL–SIMA–NIFE<\/b>, the <b>most abundant elements<\/b> of the crust, and <b>rock types with examples<\/b> (marble from limestone, slate from shale)."},{"k":"story","h":"<p>No one has dug deeper than about 12 km, so we know the Earth's inside from <b>earthquake waves<\/b>. They speed up, slow down and bend at certain depths — these boundaries are called <b>discontinuities<\/b>. The <b>crust<\/b> is the thin outer skin; below the <b>Moho<\/b> is the <b>mantle<\/b>, the biggest layer; below the <b>Gutenberg<\/b> line (2,900 km) is the <b>liquid outer core<\/b>; below the <b>Lehmann<\/b> line (5,150 km) is the <b>solid inner core<\/b>, reaching the centre at about <b>6,371 km<\/b>.<\/p><p>Rocks come in three families. <b>Igneous<\/b> rocks (granite, basalt) form when magma cools — they are the 'primary' rocks. <b>Sedimentary<\/b> rocks (sandstone, limestone, coal) form in layers and are the only ones with fossils. <b>Metamorphic<\/b> rocks (marble, slate) are older rocks changed by heat and pressure.<\/p>","key":"Moho = crust/mantle · Gutenberg = mantle/core · Lehmann = outer/inner core. Igneous = fire, sedimentary = layers, metamorphic = changed."},{"k":"facts","title":"Layers in numbers","rows":[["Radius of the Earth","About 6,371 km"],["Crust","SIAL (silica + aluminium) on continents; SIMA (silica + magnesium) under oceans"],["Core","NIFE (nickel + ferrum/iron)"],["Temperature with depth","Rises about 1 °C for every 32 m near the surface"],["S-wave shadow zone","Beyond about 105° from the epicentre — proof that the outer core is liquid"],["Crust elements","O 46.6% · Si 27.7% · Al 8.1% · Fe 5.0% · Ca 3.6%"]]},{"k":"table","title":"Discontinuities","head":["Discontinuity","Lies between","Note"],"rows":[["Mohorovičić (Moho)","Crust and mantle","About 30–35 km under continents; found by Andrija Mohorovičić (1909)."],["Conrad","Upper and lower crust","Between the granite-like upper crust (SIAL) and basalt-like lower crust (SIMA)."],["Repetti","Upper and lower mantle","About 700 km deep."],["Gutenberg","Mantle and outer core","About 2,900 km deep."],["Lehmann","Outer core and inner core","About 5,150 km deep; found by Inge Lehmann (1936)."]]},{"k":"table","title":"Layers of the Earth","head":["Layer","What it is","Note"],"rows":[["Crust","The thinnest layer — about 5 km under oceans, 30–70 km under continents","Under 1% of the Earth's volume."],["Mantle","The thickest layer, about 84% of the Earth's volume","From the Moho down to 2,900 km."],["Asthenosphere","A soft, partly molten zone of the upper mantle — the source of magma","Plates slide on it."],["Lithosphere","The rigid crust plus the topmost mantle, broken into plates","Up to about 100 km thick."],["Outer core","The liquid layer whose moving iron makes the Earth's magnetic field","S-waves cannot pass through it."],["Inner core","The solid centre of iron and nickel (NIFE), the hottest part","Solid because of the huge pressure."]]},{"k":"info","title":"Inside the Earth","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 280\" role=\"img\" aria-label=\"The layers inside the Earth\">\n  <path d=\"M25 270 A255 255 0 0 1 535 270 Z\" fill=\"#c99a6b\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M44 270 A236 236 0 0 1 516 270 Z\" fill=\"#d9733f\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M160 270 A120 120 0 0 1 400 270 Z\" fill=\"#f0a43a\" stroke=\"#fff\" stroke-width=\"1.5\"/><path d=\"M214 270 A66 66 0 0 1 346 270 Z\" fill=\"#f6d365\" stroke=\"#fff\" stroke-width=\"1.5\"/>\n  <text x=\"280\" y=\"26\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Crust<\/text><text x=\"280\" y=\"41\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">5–70 km<\/text><text x=\"280\" y=\"60\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Mantle<\/text><text x=\"280\" y=\"75\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">to 2,900 km<\/text><text x=\"280\" y=\"165\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Outer core (liquid)<\/text><text x=\"280\" y=\"180\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">to 5,150 km<\/text><text x=\"280\" y=\"228\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Inner core (solid)<\/text><text x=\"280\" y=\"243\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">to 6,371 km<\/text>\n  <line x1=\"28071\" y1=\"45\" x2=\"560\" y2=\"45\" class=\"grid\"/><text x=\"566\" y=\"49\" text-anchor=\"start\" font-size=\"12\" class=\"b\">Moho<\/text><line x1=\"2800\" y1=\"140\" x2=\"560\" y2=\"140\" class=\"grid\"/><text x=\"566\" y=\"144\" text-anchor=\"start\" font-size=\"12\" class=\"b\">Gutenberg<\/text><line x1=\"28048\" y1=\"225\" x2=\"560\" y2=\"225\" class=\"grid\"/><text x=\"566\" y=\"229\" text-anchor=\"start\" font-size=\"12\" class=\"b\">Lehmann<\/text><\/svg><\/figure>","cap":"Crust → (Moho) → mantle → (Gutenberg) → liquid outer core → (Lehmann) → solid inner core of nickel and iron (NIFE). S-waves cannot pass through the liquid outer core."},{"k":"table","title":"Element records","head":["Record","Element","Note"],"rows":[["Most abundant element in the Earth's crust","Oxygen","About 46.6% by weight."],["Second most abundant element in the crust","Silicon","About 27.7%."],["Most abundant metal in the crust","Aluminium","About 8.1%."],["Most abundant element of the whole Earth (by mass)","Iron","Most of it is in the core."],["Main elements of the core","Nickel and iron","Hence the name NIFE."]]},{"k":"table","title":"Rocks and their type","head":["Rock","Type","Note"],"rows":[["Granite","Igneous (intrusive)","Cools slowly deep underground — big crystals."],["Gabbro","Igneous (intrusive)",""],["Basalt","Igneous (extrusive)","Cools fast from lava — the Deccan Traps are basalt."],["Pumice","Igneous (extrusive)","So full of gas holes that it floats on water."],["Sandstone","Sedimentary","Made of cemented sand grains."],["Limestone","Sedimentary","Made from shells and calcium carbonate."],["Shale","Sedimentary","Made of hardened clay and mud."],["Coal","Sedimentary","Formed from buried plants."],["Conglomerate","Sedimentary","Rounded pebbles cemented together."],["Marble","Metamorphic","Changed from limestone."],["Slate","Metamorphic","Changed from shale."],["Quartzite","Metamorphic","Changed from sandstone."],["Gneiss","Metamorphic","Changed from granite."],["Schist","Metamorphic","Flaky, shiny layers."]]},{"k":"table","title":"What heat and pressure make","head":["Parent rock","Metamorphic rock","Note"],"rows":[["Limestone","Marble","The Taj Mahal is made of Makrana marble."],["Sandstone","Quartzite",""],["Shale","Slate",""],["Granite","Gneiss",""]]},{"k":"trick","h":"Going down: <b>“My Great Lunch”<\/b> — <b>M<\/b>oho (≈35 km) → <b>G<\/b>utenberg (2,900 km) → <b>L<\/b>ehmann (5,150 km). Crust elements: <b>“Only Silly Asses In College”<\/b> — O, Si, Al, Fe, Ca."},{"k":"trap","h":"<b>Gutenberg<\/b> is mantle/core, not crust/mantle (that is <b>Moho<\/b>). The <b>outer core is liquid<\/b> but the <b>inner core is solid<\/b>. Most abundant <b>element<\/b> in the crust is oxygen; most abundant <b>metal<\/b> is aluminium; most abundant in the <b>whole Earth<\/b> is iron."}],"sum":["Crust → mantle → outer core (liquid) → inner core (solid); radius about 6,371 km.","Moho: crust/mantle; Gutenberg (2,900 km): mantle/core; Lehmann (5,150 km): outer/inner core; Conrad: inside the crust.","SIAL continents, SIMA ocean floor, NIFE core; crust is mostly oxygen and silicon, the most common metal aluminium.","Igneous: granite, basalt; sedimentary: sandstone, limestone, coal (fossils); metamorphic: marble, slate, quartzite.","Limestone → marble, sandstone → quartzite, shale → slate, granite → gneiss."],"part":["Part 2 · The solid Earth","ठोस पृथ्वी"],"g":"pg"},
{"id":"Y4","heat":3,"title":"Plate tectonics, earthquakes and volcanoes","hi":"प्लेट विवर्तनिकी, भूकंप और ज्वालामुखी","blocks":[{"k":"hot","h":"Common questions: <b>Wegener and continental drift<\/b>, <b>Pangaea<\/b>, the <b>Pacific Ring of Fire<\/b>, <b>P, S and L waves<\/b>, <b>Richter vs Mercalli<\/b>, <b>epicentre<\/b>, and famous <b>volcanoes and their countries<\/b> (Barren Island is India's only active one)."},{"k":"story","h":"<p>In <b>1912 Alfred Wegener<\/b> said the continents were once joined in one super-continent, <b>Pangaea<\/b>, which split into <b>Laurasia<\/b> (north) and <b>Gondwanaland<\/b> (south). In the 1960s <b>sea-floor spreading<\/b> and then <b>plate tectonics<\/b> explained how: the lithosphere is broken into about seven big <b>plates<\/b> (the largest is the <b>Pacific plate<\/b>) that float on the soft asthenosphere. Where plates <b>pull apart<\/b> new crust forms; where they <b>collide<\/b> we get trenches, volcanoes and fold mountains like the <b>Himalayas<\/b>; where they <b>slide past<\/b> we get faults like <b>San Andreas<\/b>.<\/p><p>Most <b>earthquakes and volcanoes<\/b> lie along plate edges, above all round the Pacific — the <b>Ring of Fire<\/b>, with about three-quarters of the world's active volcanoes. A quake starts at the <b>focus<\/b> underground; the spot above it is the <b>epicentre<\/b>. Its strength is given on the <b>Richter scale<\/b>, where each step means about <b>10 times<\/b> more shaking and about 32 times more energy.<\/p>","key":"Wegener 1912 → Pangaea; plates meet at the Ring of Fire; P fastest, S solids only, L most damaging; Richter = magnitude, Mercalli = intensity."},{"k":"facts","title":"Plates and volcano types","rows":[["Major plates","Pacific (largest), North American, South American, Eurasian, African, Indo-Australian, Antarctic"],["Indian plate","Moves north about 5 cm a year, still raising the Himalayas"],["Active / dormant / extinct","Erupting now or recently / quiet but may erupt / not expected to erupt again"],["Shield volcano","Gentle slopes of runny basalt lava — Mauna Loa (Hawaii)"],["Composite (strato) volcano","Steep cone of lava and ash layers — Fuji, Vesuvius"],["Caldera","A huge crater left when a volcano collapses"],["Fissure eruption","Lava pours out of long cracks — the Deccan Traps of India"],["India's volcanoes","Barren Island (active) and Narcondam (dormant), both in the Andaman Sea"]]},{"k":"table","title":"Theories, scales and who gave them","head":["Idea","Given by","Note"],"rows":[["Continental drift (1912)","Alfred Wegener","All continents were once one land, Pangaea, ringed by the ocean Panthalassa."],["Sea-floor spreading (1960s)","Harry Hess","New ocean floor forms at mid-ocean ridges."],["Convection currents in the mantle (1930s)","Arthur Holmes","Heat in the mantle moves the plates."],["The Richter scale (1935)","Charles F. Richter","Measures the magnitude (energy) of an earthquake."],["The Mercalli scale","Giuseppe Mercalli","Measures intensity — the damage seen — from I to XII."],["Elastic rebound theory of earthquakes","H. F. Reid","After the 1906 San Francisco earthquake."]]},{"k":"table","title":"Plate boundaries and examples","head":["Boundary","Example","Note"],"rows":[["Divergent (plates move apart, under the sea)","The Mid-Atlantic Ridge","New crust forms; Iceland sits on it."],["Divergent (plates move apart, on land)","The East African Rift Valley","Africa is slowly splitting."],["Convergent (ocean plate under a continent)","The Andes","Fold mountains with volcanoes."],["Convergent (continent meets continent)","The Himalayas","The Indian plate pushing into the Eurasian plate."],["Convergent (ocean plate under ocean plate)","The Mariana Trench","The deepest place on Earth, in the Pacific."],["Transform (plates slide past each other)","The San Andreas Fault","In California, USA; crust is neither made nor destroyed."]]},{"k":"info","title":"Three kinds of plate boundary","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 205\" role=\"img\" aria-label=\"Three kinds of plate boundary\"><g transform=\"translate(0 0)\"><rect x=\"4\" y=\"4\" width=\"216\" height=\"150\" rx=\"10\" class=\"card\"/><rect x=\"20\" y=\"90\" width=\"85\" height=\"40\" class=\"s3\"/><rect x=\"119\" y=\"90\" width=\"85\" height=\"40\" class=\"s3\"/><path d=\"M100 110 L60 110 M124 110 L164 110\" stroke=\"var(--accent)\" stroke-width=\"3\" marker-end=\"url(#pb)\"/><path d=\"M112 90 L112 50\" stroke=\"#c0392b\" stroke-width=\"4\"/><text x=\"112\" y=\"42\" text-anchor=\"middle\" font-size=\"10\" class=\"b\">new crust<\/text><text x=\"112\" y=\"178\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Divergent<\/text><text x=\"112\" y=\"196\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">Mid-Atlantic Ridge<\/text><\/g><g transform=\"translate(228 0)\"><rect x=\"4\" y=\"4\" width=\"216\" height=\"150\" rx=\"10\" class=\"card\"/><rect x=\"20\" y=\"80\" width=\"95\" height=\"40\" class=\"s3\"/><path d=\"M115 80 L205 80 L205 120 L130 120 L115 150 Z\" class=\"s2\"/><path d=\"M40 100 L95 100 M185 100 L140 100\" stroke=\"var(--accent)\" stroke-width=\"3\" marker-end=\"url(#pb)\"/><path d=\"M118 80 L140 40 L160 80\" class=\"s5\"/><text x=\"140\" y=\"34\" text-anchor=\"middle\" font-size=\"10\" class=\"b\">mountains<\/text><text x=\"112\" y=\"178\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Convergent<\/text><text x=\"112\" y=\"196\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">Himalaya · Andes<\/text><\/g><g transform=\"translate(456 0)\"><rect x=\"4\" y=\"4\" width=\"216\" height=\"150\" rx=\"10\" class=\"card\"/><rect x=\"20\" y=\"40\" width=\"184\" height=\"50\" class=\"s3\"/><rect x=\"20\" y=\"92\" width=\"184\" height=\"50\" class=\"s2\"/><path d=\"M50 65 L120 65 M170 117 L100 117\" stroke=\"var(--accent)\" stroke-width=\"3\" marker-end=\"url(#pb)\"/><text x=\"112\" y=\"178\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Transform<\/text><text x=\"112\" y=\"196\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">San Andreas Fault<\/text><\/g><defs><marker id=\"pb\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"var(--accent)\"/><\/marker><\/defs><\/svg><\/figure>","cap":"Plates pull apart (divergent — new crust), push together (convergent — mountains, trenches, volcanoes) or slide past (transform — earthquakes)."},{"k":"table","title":"Earthquake words","head":["Term","Meaning","Note"],"rows":[["P-waves (primary)","Fastest waves; pass through solids, liquids and gases","Arrive first; push-pull (longitudinal)."],["S-waves (secondary)","Pass only through solids; arrive second","Their shadow zone shows the outer core is liquid."],["L-waves (surface waves)","Slowest waves but cause the most damage","Travel along the surface."],["The focus (hypocentre)","The point inside the Earth where the quake starts",""],["The epicentre","The point on the surface right above the focus","Damage is greatest here."],["A seismograph","An instrument that records earthquake waves","The record is a seismogram."],["A tsunami","Giant sea waves set off by an undersea earthquake","Japanese for 'harbour wave'."]]},{"k":"table","title":"Famous volcanoes","head":["Volcano","Country","Note"],"rows":[["Mauna Loa","USA (Hawaii)","The largest active volcano on Earth — a shield volcano."],["Mount St Helens","USA (Washington)","Erupted in 1980."],["Vesuvius","Italy","Buried Pompeii in 79 CE."],["Etna","Italy","On Sicily; one of the most active in the world."],["Stromboli","Italy","'Lighthouse of the Mediterranean'."],["Fuji","Japan","Japan's highest mountain — a cone (composite) volcano."],["Krakatoa","Indonesia","Huge eruption in 1883."],["Tambora","Indonesia","The 1815 eruption caused the 'year without a summer'."],["Pinatubo","Philippines","Big eruption in 1991."],["Kilimanjaro","Tanzania","Africa's highest peak; a dormant volcano."],["Cotopaxi","Ecuador",""],["Popocatépetl","Mexico",""],["Eyjafjallajökull","Iceland","Its ash cloud stopped flights over Europe in 2010."],["Barren Island","India (Andaman Sea)","India's only active volcano."]]},{"k":"worldfig","title":"Famous volcanoes on the world map","minw":640,"pins":[["1",-155.6,19.5,"Mauna Loa","n"],["2",-122.2,46.2,"Mount St Helens","n"],["3",14.4,40.8,"Vesuvius","n"],["4",15,37.75,"Etna","n"],["5",15.2,38.8,"Stromboli","n"],["6",138.7,35.36,"Fuji","n"],["7",105.42,-6.1,"Krakatoa","n"],["8",118,-8.25,"Tambora","n"],["9",120.35,15.13,"Pinatubo","n"],["10",37.36,-3.07,"Kilimanjaro","n"],["11",-78.44,-0.68,"Cotopaxi","n"],["12",-98.62,19.02,"Popocatépetl","n"],["13",-19.6,63.6,"Eyjafjallajökull","n"],["14",93.86,12.28,"Barren Island","n"]],"legend":[["1 Mauna Loa","USA (Hawaii) — The largest active volcano on Earth — a shield volcano"],["2 Mount St Helens","USA (Washington) — Erupted in 1980"],["3 Vesuvius","Italy — Buried Pompeii in 79 CE"],["4 Etna","Italy — On Sicily; one of the most active in the world"],["5 Stromboli","Italy — 'Lighthouse of the Mediterranean'"],["6 Fuji","Japan — Japan's highest mountain — a cone (composite) volcano"],["7 Krakatoa","Indonesia — Huge eruption in 1883"],["8 Tambora","Indonesia — The 1815 eruption caused the 'year without a summer'"],["9 Pinatubo","Philippines — Big eruption in 1991"],["10 Kilimanjaro","Tanzania — Africa's highest peak; a dormant volcano"],["11 Cotopaxi","Ecuador"],["12 Popocatépetl","Mexico"],["13 Eyjafjallajökull","Iceland — Its ash cloud stopped flights over Europe in 2010"],["14 Barren Island","India (Andaman Sea) — India's only active volcano"]],"cap":"Most sit on the Pacific 'Ring of Fire' or the Mediterranean belt. India's only active volcano is Barren Island in the Andaman Sea."},{"k":"photos","title":"Volcanoes in pictures","items":[["Mauna_Loa","Mauna Loa","USA (Hawaii)"],["Mount_Vesuvius","Vesuvius","Italy"],["Mount_Etna","Etna","Italy"],["Mount_Fuji","Fuji","Japan"],["Krakatoa","Krakatoa","Indonesia"],["Mount_Kilimanjaro","Kilimanjaro","Tanzania"],["Barren_Island","Barren Island (Andaman Islands)","India (Andaman Sea)"]]},{"k":"trick","h":"Waves in order of arrival: <b>P<\/b> = <b>P<\/b>rimary = <b>P<\/b>ush, first; <b>S<\/b> = <b>S<\/b>econdary = <b>S<\/b>olids only; <b>L<\/b> = <b>L<\/b>ast and <b>L<\/b>argest damage. Three Italian volcanoes: <b>“VES”<\/b> — Vesuvius, Etna, Stromboli."},{"k":"trap","h":"The <b>Ring of Fire<\/b> of volcanoes is the rim of the <b>Pacific<\/b> — do not mix it up with the 'ring of fire' of an <b>annular eclipse<\/b>. <b>Richter<\/b> = magnitude (energy); <b>Mercalli<\/b> = intensity (damage). <b>Kilimanjaro<\/b> is a volcano in Tanzania, not Kenya."}],"sum":["Wegener (1912): continental drift — Pangaea split into Laurasia and Gondwanaland.","Plates move apart (Mid-Atlantic Ridge), collide (Himalayas, Andes, Mariana Trench) or slide past (San Andreas).","The Pacific Ring of Fire has most of the world's volcanoes and earthquakes.","P-waves fastest and pass through liquids; S-waves only through solids; L-waves do most damage; Richter measures magnitude.","Vesuvius, Etna, Stromboli — Italy; Fuji — Japan; Krakatoa — Indonesia; Mauna Loa — Hawaii; Barren Island — India's only active volcano."],"part":["Part 2 · The solid Earth","ठोस पृथ्वी"],"g":"pg"},
{"id":"Y5","heat":2,"title":"Landforms made by rivers, glaciers, wind and sea","hi":"स्थलरूप: नदी, हिमनद, पवन और समुद्र","blocks":[{"k":"hot","h":"The usual question: <b>“Which agent makes this landform?”<\/b> — ox-bow lake and delta (river), U-shaped valley, cirque, moraine and fjord (glacier), barchan and mushroom rock (wind), sea stack and arch (waves), stalactite (underground water)."},{"k":"story","h":"<p>Inside forces raise the land; outside forces wear it down. <b>Weathering<\/b> breaks rock in place; <b>erosion<\/b> carries it away; <b>deposition<\/b> drops it somewhere new. A <b>river<\/b> cuts a <b>V-shaped valley<\/b> and gorges in the mountains, swings in <b>meanders<\/b> across the plains — leaving <b>ox-bow lakes<\/b> — and builds a <b>delta<\/b> at its mouth. A <b>glacier<\/b> grinds a <b>U-shaped valley<\/b>, scoops out <b>cirques<\/b>, and dumps <b>moraines<\/b>; when the sea floods a glacial valley it becomes a <b>fjord<\/b>.<\/p><p>In deserts the <b>wind<\/b> builds crescent <b>barchans<\/b>, carves <b>mushroom rocks<\/b>, and carries fine dust far away as <b>loess<\/b>. On coasts, <b>waves<\/b> cut cliffs, caves, arches and <b>stacks<\/b>, and pile sand into beaches and <b>spits<\/b>. In limestone country (called <b>karst<\/b>, after a region in Slovenia) water dissolves rock to make caves with <b>stalactites<\/b> and <b>stalagmites<\/b>.<\/p>","key":"River: V-valley, meander, ox-bow, delta. Glacier: U-valley, cirque, moraine, fjord. Wind: barchan, mushroom rock, loess. Sea: cliff, arch, stack, spit."},{"k":"table","title":"Landform → agent","head":["Landform","Made mainly by","Note"],"rows":[["A V-shaped valley","River","Cut by a young river in the mountains."],["A gorge or canyon","River","A deep, narrow valley."],["A waterfall and plunge pool","River",""],["Potholes","River","Holes drilled in the river bed by swirling pebbles."],["A meander","River","A loop in a river crossing a plain."],["An ox-bow lake","River","A cut-off meander."],["A delta","River","Made where a river drops silt at its mouth."],["A flood plain and levees","River",""],["A U-shaped valley","Glacier",""],["A cirque (corrie)","Glacier","An armchair-shaped hollow at a glacier's head."],["A moraine","Glacier","Rock debris dropped by ice."],["A drumlin","Glacier","An egg-shaped hill of glacial clay."],["An esker","Glacier","A long winding ridge of sand and gravel."],["A fjord","Glacier","A glacial valley drowned by the sea — Norway."],["A hanging valley","Glacier",""],["A barchan","Wind","A crescent-shaped sand dune."],["A mushroom rock","Wind","Sand blasts the base more than the top."],["A yardang","Wind",""],["Loess","Wind","Fine wind-blown dust deposits — the Loess Plateau of China."],["An inselberg","Wind","An isolated rock hill in a desert — like Uluru."],["A sea cliff","Sea waves",""],["A sea arch","Sea waves",""],["A sea stack","Sea waves","A pillar left when an arch collapses."],["A spit","Sea waves","A sand ridge joined to the land at one end."],["A stalactite","Underground water","Hangs from the roof of a limestone cave."],["A sinkhole","Underground water",""]]},{"k":"table","title":"Famous examples","head":["Example","What it is","Note"],"rows":[["The Grand Canyon (USA)","A canyon","Cut by the Colorado river."],["The Sundarbans (Ganga–Brahmaputra)","A delta","The world's largest delta."],["Angel Falls (Venezuela)","A waterfall","The highest waterfall in the world."],["Sognefjord (Norway)","A fjord",""],["The Twelve Apostles (Australia)","Sea stacks",""],["Majuli (Assam)","A river island","On the Brahmaputra; India's largest river island."],["Siachen","A glacier","In the Karakoram; India's longest glacier."],["Uluru (Ayers Rock, Australia)","An inselberg",""]]},{"k":"photos","title":"Landforms in pictures","items":[["Grand_Canyon","Grand Canyon","Gorge — river"],["Victoria_Falls","Victoria Falls","Waterfall — river"],["Oxbow_lake","Oxbow lake","River"],["River_delta","River delta","River"],["Fjord","Fjord","Glacier"],["Moraine","Moraine","Glacier"],["Cirque","Cirque","Glacier"],["Barchan","Barchan","Wind — sand dune"],["Mushroom_rock","Mushroom rock","Wind"],["Sea_arch","Sea arch","Sea waves"],["Stack","Stack","Sea waves"],["Spit","Spit","Sea waves"]]},{"k":"trick","h":"Stalac<b>T<\/b>ite hangs from the <b>T<\/b>op (it holds on '<b>tight<\/b>'); stalag<b>M<\/b>ite grows up from the ground — it <b>M<\/b>ight reach the top one day."},{"k":"trap","h":"A <b>fjord<\/b> is made by a <b>glacier<\/b>, even though the sea now fills it. <b>Loess<\/b> is made by <b>wind<\/b>, not rivers. An <b>ox-bow lake<\/b> forms in a river's <b>old (plain) stage<\/b>, not in the mountains."}],"sum":["Weathering breaks rocks in place; erosion carries the pieces; deposition lays them down.","Rivers: V-shaped valleys, gorges, meanders, ox-bow lakes, flood plains, deltas.","Glaciers: U-shaped valleys, cirques, moraines, drumlins, eskers, fjords.","Wind: barchans, mushroom rocks, yardangs, loess; sea waves: cliffs, arches, stacks, spits.","Karst (limestone) country: caves, sinkholes, stalactites (from the top) and stalagmites (from the ground)."],"part":["Part 2 · The solid Earth","ठोस पृथ्वी"],"g":"pg"},
{"id":"Y6","heat":3,"title":"The atmosphere and insolation","hi":"वायुमंडल और सूर्यातप","blocks":[{"k":"hot","h":"Always asked: <b>the layers in order<\/b> and what happens in each — weather in the troposphere, <b>ozone in the stratosphere<\/b>, meteors in the mesosphere, <b>radio waves and the ionosphere<\/b> in the thermosphere — plus <b>the gases of the air<\/b> and <b>isolines<\/b> (isobar, isohyet…)."},{"k":"story","h":"<p>The air around us is about <b>78% nitrogen<\/b> and <b>21% oxygen<\/b>, with argon, a little carbon dioxide and water vapour. Going up from the ground: the <b>troposphere<\/b> (weather, gets colder as you climb), the <b>stratosphere<\/b> (calm, with the <b>ozone layer<\/b> that blocks ultraviolet rays), the <b>mesosphere<\/b> (coldest, meteors burn), the <b>thermosphere<\/b> (with the <b>ionosphere<\/b> that bounces radio waves back), and the thin <b>exosphere<\/b>.<\/p><p>The Sun's energy reaching the Earth is called <b>insolation<\/b> (incoming solar radiation). It is strongest at the Equator, where the rays are nearly vertical. The Earth sends heat back as long-wave <b>terrestrial radiation<\/b>, and greenhouse gases trap some of it — the <b>greenhouse effect<\/b>. Heat moves by <b>conduction<\/b>, <b>convection<\/b> (up and down) and <b>advection<\/b> (sideways).<\/p>","key":"T-S-M-T-E: Troposphere (weather) · Stratosphere (ozone) · Mesosphere (meteors) · Thermosphere (ionosphere) · Exosphere."},{"k":"facts","title":"Heat and the atmosphere","rows":[["Insolation","Incoming solar radiation — the Sun's energy that reaches the Earth"],["Albedo","The share of sunlight reflected back — about 30% for the Earth"],["Tropopause","Top of the troposphere — about 18 km over the Equator, about 8 km over the poles"],["Advection","Heat carried sideways by wind (convection is upward)"],["Temperature inversion","Air gets warmer with height instead of colder — traps fog and smog"],["Ozone unit","Dobson unit; 16 September is World Ozone Day (Montreal Protocol, 1987)"]]},{"k":"table","title":"Which layer?","head":["Which layer…","Layer","Note"],"rows":[["has all the weather and clouds","Troposphere","The lowest layer — up to about 8 km at the poles and 18 km at the Equator."],["gets about 6.5 °C colder for every km you climb","Troposphere","The normal lapse rate."],["holds most of the air's mass and water vapour","Troposphere",""],["contains the ozone layer","Stratosphere","Ozone (about 15–35 km up) absorbs the Sun's ultraviolet rays."],["is best for jet planes because the air is calm","Stratosphere",""],["gets warmer with height because ozone absorbs UV","Stratosphere",""],["is where meteors burn up","Mesosphere","About 50–80 km up."],["is the coldest layer (about −90 °C at its top)","Mesosphere",""],["has the ionosphere, which reflects radio waves back to Earth","Thermosphere","This is why radio signals can travel round the world."],["is where auroras glow","Thermosphere","Northern and southern lights."],["is where the International Space Station orbits","Thermosphere","About 400 km up."],["is the outermost layer, fading into space","Exosphere",""]]},{"k":"info","title":"The atmosphere, layer by layer","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 300\" role=\"img\" aria-label=\"Layers of the atmosphere\">\n  <rect x=\"20\" y=\"250\" width=\"640\" height=\"52\" class=\"s3\" opacity=\".9\"/><text x=\"36\" y=\"272\" text-anchor=\"start\" font-size=\"14\" class=\"b\">Troposphere<\/text><text x=\"36\" y=\"290\" text-anchor=\"start\" font-size=\"11\" class=\"mut\">0–12 km (8 at poles, 18 at equator)<\/text><text x=\"640\" y=\"281\" text-anchor=\"end\" font-size=\"12.5\" class=\"b\">Weather, clouds<\/text><rect x=\"20\" y=\"195\" width=\"640\" height=\"52\" class=\"s1\" opacity=\".9\"/><text x=\"36\" y=\"217\" text-anchor=\"start\" font-size=\"14\" class=\"b\">Stratosphere<\/text><text x=\"36\" y=\"235\" text-anchor=\"start\" font-size=\"11\" class=\"mut\">to 50 km<\/text><text x=\"640\" y=\"226\" text-anchor=\"end\" font-size=\"12.5\" class=\"b\">Ozone layer · jets fly here<\/text><rect x=\"20\" y=\"140\" width=\"640\" height=\"52\" class=\"s2\" opacity=\".9\"/><text x=\"36\" y=\"162\" text-anchor=\"start\" font-size=\"14\" class=\"b\">Mesosphere<\/text><text x=\"36\" y=\"180\" text-anchor=\"start\" font-size=\"11\" class=\"mut\">to 80 km<\/text><text x=\"640\" y=\"171\" text-anchor=\"end\" font-size=\"12.5\" class=\"b\">Meteors burn · coldest<\/text><rect x=\"20\" y=\"85\" width=\"640\" height=\"52\" class=\"s4\" opacity=\".9\"/><text x=\"36\" y=\"107\" text-anchor=\"start\" font-size=\"14\" class=\"b\">Thermosphere<\/text><text x=\"36\" y=\"125\" text-anchor=\"start\" font-size=\"11\" class=\"mut\">to ~600 km<\/text><text x=\"640\" y=\"116\" text-anchor=\"end\" font-size=\"12.5\" class=\"b\">Ionosphere · auroras · ISS<\/text><rect x=\"20\" y=\"30\" width=\"640\" height=\"52\" class=\"s5\" opacity=\".9\"/><text x=\"36\" y=\"52\" text-anchor=\"start\" font-size=\"14\" class=\"b\">Exosphere<\/text><text x=\"36\" y=\"70\" text-anchor=\"start\" font-size=\"11\" class=\"mut\">beyond<\/text><text x=\"640\" y=\"61\" text-anchor=\"end\" font-size=\"12.5\" class=\"b\">Fades into space<\/text>\n  <text x=\"340\" y=\"296\" text-anchor=\"middle\" font-size=\"11\" class=\"mut\">Ground<\/text><\/svg><\/figure>","cap":"Weather happens in the troposphere; the ozone layer is in the stratosphere; meteors burn in the mesosphere; radio waves bounce off the ionosphere in the thermosphere."},{"k":"table","title":"Gases in dry air","head":["Gas","Share by volume","Note"],"rows":[["Nitrogen","About 78%","The most plentiful gas in the air."],["Oxygen","About 21%",""],["Argon","About 0.93%","The most plentiful noble gas in the air."],["Carbon dioxide","About 0.04%","Small, but a key greenhouse gas."]]},{"k":"bars","title":"What dry air is made of","unit":"%","left":140,"hi":2,"sort":false,"rows":[["Nitrogen",78,""],["Oxygen",21,""],["Argon",0.93,""],["Carbon dioxide",0.04,""]],"cap":"Nitrogen 78%, oxygen 21%, argon about 0.93%, carbon dioxide about 0.04%."},{"k":"table","title":"Lines on weather maps","head":["Line","Joins places of equal","Note"],"rows":[["Isobar","Pressure",""],["Isotherm","Temperature",""],["Isohyet","Rainfall",""],["Isohaline","Salinity",""],["Isobath","Water depth",""],["Isoneph","Cloudiness",""],["Isohel","Sunshine",""],["Isoseismal","Earthquake intensity",""]]},{"k":"trick","h":"Layers from the ground up: <b>“The Strong Man’s Tea Ends”<\/b> — Troposphere, Stratosphere, Mesosphere, Thermosphere, Exosphere. Iso-lines: <b>hyet<\/b> = rain (think 'wet'), <b>haline<\/b> = salt (think 'halite'), <b>bath<\/b> = depth (think 'bathroom water')."},{"k":"trap","h":"<b>Ozone<\/b> is in the <b>stratosphere<\/b>, not the ionosphere. The <b>ionosphere<\/b> is part of the <b>thermosphere<\/b>. The <b>coldest<\/b> layer is the <b>mesosphere<\/b>. Most plentiful gas = <b>nitrogen<\/b>, not oxygen."}],"sum":["Air: nitrogen 78%, oxygen 21%, argon 0.93%, carbon dioxide about 0.04%.","Troposphere: all weather, colder with height; stratosphere: ozone layer, jet planes.","Mesosphere: coldest, meteors burn; thermosphere: ionosphere reflects radio waves, auroras.","Insolation is strongest at the Equator; the Earth's albedo is about 30%.","Isobar = pressure, isotherm = temperature, isohyet = rainfall, isohaline = salinity."],"part":["Part 3 · Air, water and climate","वायु, जल और जलवायु"],"g":"pg"},
{"id":"Y7","heat":3,"title":"Pressure belts, planetary winds and local winds","hi":"दाब पेटियाँ, ग्रहीय पवनें और स्थानीय पवनें","blocks":[{"k":"hot","h":"The most asked bit of climatology: <b>local winds and where they blow<\/b> (Chinook, Foehn, Sirocco, Mistral, Harmattan, Loo), then the <b>pressure belts<\/b>, <b>trade winds and westerlies<\/b>, the <b>Roaring Forties<\/b>, the <b>Coriolis force<\/b> and <b>jet streams<\/b>."},{"k":"story","h":"<p>Wind always blows from <b>high pressure to low pressure<\/b>. The Earth has seven pressure belts: the <b>equatorial low<\/b> (the calm <b>doldrums<\/b>), two <b>subtropical highs<\/b> near 30° (the <b>horse latitudes<\/b>), two <b>subpolar lows<\/b> near 60°, and two <b>polar highs<\/b>. Between them blow the <b>planetary winds<\/b>: <b>trade winds<\/b> towards the Equator, <b>westerlies<\/b> towards the poles, and <b>polar easterlies<\/b>. Because the Earth spins, the <b>Coriolis force<\/b> bends winds to the <b>right in the northern half<\/b> and to the <b>left in the southern half<\/b> (Ferrel's law). Over the open southern oceans the westerlies roar: the <b>Roaring Forties<\/b>, <b>Furious Fifties<\/b> and <b>Shrieking Sixties<\/b>.<\/p><p>High up, near the top of the troposphere, race narrow rivers of fast westerly air — the <b>jet streams<\/b>. Down on the ground, every region has its own <b>local winds<\/b>: the warm <b>Chinook<\/b> of the Rockies (the 'snow eater'), the <b>Foehn<\/b> of the Alps, the dusty <b>Sirocco<\/b> from the Sahara, the cold <b>Mistral<\/b> of France, the <b>Harmattan<\/b> of West Africa (the 'Doctor'), and India's own hot <b>Loo<\/b>.<\/p>","key":"High → low pressure; Coriolis: right in the north, left in the south; Chinook = snow eater (Rockies), Foehn = Alps, Mistral = cold France, Sirocco = Sahara to Italy, Loo = north India."},{"k":"facts","title":"More about winds","rows":[["Coriolis force","Zero at the Equator, greatest at the poles"],["Buys Ballot's law","Stand with your back to the wind in the northern half — low pressure is on your left"],["Jet streams","Fast westerly winds 9–12 km up, near the tropopause"],["Tropical easterly jet","Blows over India in summer and helps the monsoon"],["Monsoon","Seasonal reversal of winds — from the Arabic 'mausim' (season)"],["Sea breeze / land breeze","Sea to land by day; land to sea by night"],["Valley / mountain breeze","Up the slope by day (anabatic); down the slope at night (katabatic)"],["Norwesters (Kalbaisakhi)","Evening thunderstorms of West Bengal in summer"]]},{"k":"table","title":"Pressure belts and planetary winds","head":["Belt or wind","Found","Note"],"rows":[["Doldrums (equatorial low)","around the Equator, roughly 0°–5° N and S","Calm, hot, rising air; sailing ships got stuck here."],["Horse latitudes (subtropical highs)","at about 30° N and S","Calm, dry, sinking air; most hot deserts lie here."],["Subpolar lows","at about 60° N and S",""],["Polar highs","at the poles","Very cold, sinking air."],["Trade winds","between 30° and the Equator, blowing towards it","North-east trades in the north, south-east trades in the south."],["Westerlies","between 30° and 60°, blowing towards the poles","Stronger in the southern half — few lands to slow them."],["Polar easterlies","between the poles and 60°",""],["Roaring Forties","at about 40° S","Strong westerlies over open sea."],["Furious Fifties","at about 50° S",""],["Shrieking Sixties","at about 60° S",""]]},{"k":"info","title":"Pressure belts and planetary winds","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 300\" role=\"img\" aria-label=\"Pressure belts and planetary winds\"><defs><marker id=\"pw\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"var(--accent)\"/><\/marker><\/defs><line x1=\"20\" y1=\"15\" x2=\"420\" y2=\"15\" stroke=\"var(--rule)\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/><text x=\"430\

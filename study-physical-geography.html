rl(#pw)\" class=\"anim-in\"/><path d=\"M90 273 L60 249\" stroke=\"var(--accent)\" stroke-width=\"3\" marker-end=\"url(#pw)\" class=\"anim-in\"/><path d=\"M190 112.5 L160 138\" stroke=\"var(--accent)\" stroke-width=\"3\" marker-end=\"url(#pw)\" class=\"anim-in\"/><path d=\"M190 187.5 L160 162\" stroke=\"var(--accent)\" stroke-width=\"3\" marker-end=\"url(#pw)\" class=\"anim-in\"/><path d=\"M160 97.5 L190 72\" stroke=\"var(--accent)\" stroke-width=\"3\" marker-end=\"url(#pw)\" class=\"anim-in\"/><path d=\"M160 202.5 L190 228\" stroke=\"var(--accent)\" stroke-width=\"3\" marker-end=\"url(#pw)\" class=\"anim-in\"/><path d=\"M190 27 L160 51\" stroke=\"var(--accent)\" stroke-width=\"3\" marker-end=\"url(#pw)\" class=\"anim-in\"/><path d=\"M190 273 L160 249\" stroke=\"var(--accent)\" stroke-width=\"3\" marker-end=\"url(#pw)\" class=\"anim-in\"/><path d=\"M290 112.5 L260 138\" stroke=\"var(--accent)\" stroke-width=\"3\" marker-end=\"url(#pw)\" class=\"anim-in\"/><path d=\"M290 187.5 L260 162\" stroke=\"var(--accent)\" stroke-width=\"3\" marker-end=\"url(#pw)\" class=\"anim-in\"/><path d=\"M260 97.5 L290 72\" stroke=\"var(--accent)\" stroke-width=\"3\" marker-end=\"url(#pw)\" class=\"anim-in\"/><path d=\"M260 202.5 L290 228\" stroke=\"var(--accent)\" stroke-width=\"3\" marker-end=\"url(#pw)\" class=\"anim-in\"/><path d=\"M290 27 L260 51\" stroke=\"var(--accent)\" stroke-width=\"3\" marker-end=\"url(#pw)\" class=\"anim-in\"/><path d=\"M290 273 L260 249\" stroke=\"var(--accent)\" stroke-width=\"3\" marker-end=\"url(#pw)\" class=\"anim-in\"/><path d=\"M390 112.5 L360 138\" stroke=\"var(--accent)\" stroke-width=\"3\" marker-end=\"url(#pw)\" class=\"anim-in\"/><path d=\"M390 187.5 L360 162\" stroke=\"var(--accent)\" stroke-width=\"3\" marker-end=\"url(#pw)\" class=\"anim-in\"/><path d=\"M360 97.5 L390 72\" stroke=\"var(--accent)\" stroke-width=\"3\" marker-end=\"url(#pw)\" class=\"anim-in\"/><path d=\"M360 202.5 L390 228\" stroke=\"var(--accent)\" stroke-width=\"3\" marker-end=\"url(#pw)\" class=\"anim-in\"/><path d=\"M390 27 L360 51\" stroke=\"var(--accent)\" stroke-width=\"3\" marker-end=\"url(#pw)\" class=\"anim-in\"/><path d=\"M390 273 L360 249\" stroke=\"var(--accent)\" stroke-width=\"3\" marker-end=\"url(#pw)\" class=\"anim-in\"/><text x=\"220\" y=\"124.5\" text-anchor=\"middle\" font-size=\"11\" class=\"b\">North-east trades<\/text><text x=\"220\" y=\"175.5\" text-anchor=\"middle\" font-size=\"11\" class=\"b\">South-east trades<\/text><text x=\"220\" y=\"82.5\" text-anchor=\"middle\" font-size=\"11\" class=\"b\">Westerlies<\/text><text x=\"220\" y=\"217.5\" text-anchor=\"middle\" font-size=\"11\" class=\"b\">Westerlies (Roaring Forties…)<\/text><text x=\"220\" y=\"36\" text-anchor=\"middle\" font-size=\"11\" class=\"b\">Polar easterlies<\/text><\/svg><\/figure>","cap":"Winds blow from high to low pressure and are bent by the Earth's spin (Coriolis): to the right in the north, to the left in the south."},{"k":"table","title":"Local winds of the world","head":["Wind","Where it blows","Note"],"rows":[["Chinook","Rocky Mountains (USA and Canada)","Warm and dry; melts snow fast — the 'snow eater'."],["Foehn","Alps (Switzerland)","Warm and dry down the slopes; ripens grapes."],["Santa Ana","Southern California (USA)","Warm and dry; spreads wildfires."],["Zonda","Andes of Argentina","Warm and dry, down the Andes."],["Berg wind","South Africa","Hot and dry, blowing from the inland plateau to the coast."],["Sirocco","Sahara to Italy (Mediterranean)","Hot and dusty; its red dust brings 'blood rain' in Italy."],["Harmattan","West Africa (Sahara to the Guinea coast)","Hot, dry and dusty; called 'the Doctor' as it brings relief from humid air."],["Khamsin","Egypt","Hot, dry and dusty."],["Simoom","Arabian and Saharan deserts","Hot, dry, suffocating sand wind."],["Brickfielder","South-east Australia","Hot and dry from the interior desert."],["Loo","Northern plains of India","Hot, dry summer wind of May–June."],["Mistral","Rhône valley (France)","Cold, dry north wind."],["Bora","Adriatic coast (Croatia)","Cold, dry north-east wind."],["Purga","Siberia (Russia)","Cold blizzard wind."],["Pampero","Pampas of Argentina","Cold wind behind a cold front."]]},{"k":"worldfig","title":"Local winds of the world","minw":640,"pins":[["1",-108,47,"Chinook","n"],["2",8.5,46.8,"Foehn","n"],["3",-117.5,34,"Santa Ana","n"],["4",-68.5,-32.5,"Zonda","n"],["5",25,-31,"Berg wind","n"],["6",13,35,"Sirocco","n"],["7",0,12,"Harmattan","n"],["8",30,27,"Khamsin","n"],["9",45,23,"Simoom","n"],["10",145,-33,"Brickfielder","n"],["11",80,26,"Loo","n"],["12",4.8,44,"Mistral","n"],["13",15.5,44.5,"Bora","n"],["14",90,65,"Purga","n"],["15",-62,-36,"Pampero","n"]],"legend":[["1 Chinook","Rocky Mountains (USA and Canada)"],["2 Foehn","Alps (Switzerland)"],["3 Santa Ana","Southern California (USA)"],["4 Zonda","Andes of Argentina"],["5 Berg wind","South Africa"],["6 Sirocco","Sahara to Italy (Mediterranean)"],["7 Harmattan","West Africa (Sahara to the Guinea coast)"],["8 Khamsin","Egypt"],["9 Simoom","Arabian and Saharan deserts"],["10 Brickfielder","South-east Australia"],["11 Loo","Northern plains of India"],["12 Mistral","Rhône valley (France)"],["13 Bora","Adriatic coast (Croatia)"],["14 Purga","Siberia (Russia)"],["15 Pampero","Pampas of Argentina"]],"cap":"Warm, dry winds that come down mountains: Chinook (Rockies), Foehn (Alps), Zonda (Andes). Hot desert winds: Sirocco, Harmattan, Khamsin, Simoom, Loo. Cold winds: Mistral, Bora, Purga."},{"k":"table","title":"Hot or cold?","head":["Wind","Kind","Note"],"rows":[["Chinook","Warm, dry wind coming down a mountain",""],["Foehn","Warm, dry wind coming down a mountain",""],["Santa Ana","Warm, dry wind coming down a mountain",""],["Zonda","Warm, dry wind coming down a mountain",""],["Sirocco","Hot, dry desert wind",""],["Harmattan","Hot, dry desert wind",""],["Khamsin","Hot, dry desert wind",""],["Simoom","Hot, dry desert wind",""],["Loo","Hot, dry desert wind",""],["Brickfielder","Hot, dry desert wind",""],["Mistral","Cold wind",""],["Bora","Cold wind",""],["Purga","Cold wind",""],["Pampero","Cold wind",""]]},{"k":"trick","h":"<b>Ch<\/b>inook = <b>Ch<\/b>ews snow (snow eater) in the Rockies. <b>M<\/b>istral = <b>M<\/b>arseille side of France, cold. <b>S<\/b>irocco = <b>S<\/b>ahara → <b>S<\/b>icily/Italy. <b>F<\/b>oehn = <b>F<\/b>rom the Alps. <b>H<\/b>armattan = <b>H<\/b>ealer (the Doctor)."},{"k":"trap","h":"The <b>doldrums<\/b> are at the <b>Equator<\/b>; the <b>horse latitudes<\/b> are at <b>30°<\/b> — both are calm belts. The Roaring Forties are in the <b>southern<\/b> half. Chinook and Foehn are <b>warm<\/b> winds, though they blow from snowy mountains."}],"sum":["Winds blow from high to low pressure and are bent by the Coriolis force — right in the north, left in the south.","Doldrums at the Equator; horse latitudes at 30°; subpolar lows at 60°; polar highs at the poles.","Trade winds blow towards the Equator; westerlies towards the poles — Roaring Forties, Furious Fifties, Shrieking Sixties.","Chinook (Rockies, snow eater), Foehn (Alps), Santa Ana (California) — warm and dry down mountains.","Sirocco (Sahara–Italy), Harmattan (West Africa), Khamsin (Egypt), Loo (India) — hot; Mistral (France), Bora (Adriatic) — cold."],"part":["Part 3 · Air, water and climate","वायु, जल और जलवायु"],"g":"pg"},
{"id":"Y8","heat":2,"title":"Clouds, rainfall and cyclones","hi":"बादल, वर्षा और चक्रवात","blocks":[{"k":"hot","h":"Two favourites: <b>what tropical cyclones are called in different regions<\/b> (hurricane, typhoon, willy-willy) and <b>cloud types<\/b> (cumulonimbus = thunderstorm). Also: the calm <b>eye<\/b>, the <b>direction of spin<\/b>, and <b>types of rainfall<\/b>."},{"k":"story","h":"<p>When moist air rises it cools; at its <b>dew point<\/b> the water vapour condenses on dust into tiny drops — a <b>cloud<\/b>. High, wispy <b>cirrus<\/b> are made of ice; puffy <b>cumulus<\/b> mean fair weather; flat grey <b>stratus<\/b> cover the sky; and the giant <b>cumulonimbus<\/b> brings thunder, lightning and hail. Rain is <b>convectional<\/b> (hot afternoons at the Equator), <b>orographic<\/b> (moist wind forced up a mountain — the far side is a dry <b>rain-shadow<\/b>), or <b>cyclonic/frontal<\/b>.<\/p><p>A <b>tropical cyclone<\/b> is a huge low-pressure storm born over warm seas (above about 27 °C). Air spirals in <b>anticlockwise in the northern half<\/b> and clockwise in the southern half round a calm, cloudless <b>eye<\/b>. It has different names: <b>hurricane<\/b> in the Atlantic and Caribbean, <b>typhoon<\/b> in the China Sea, <b>cyclone<\/b> in the Indian Ocean, <b>willy-willy<\/b> in north-west Australia. Cyclones do not form right at the Equator, where the Coriolis force is zero.<\/p>","key":"Cumulonimbus = thunder cloud; cyclones spin anticlockwise in the north; hurricane (Atlantic), typhoon (China Sea), cyclone (Indian Ocean), willy-willy (Australia)."},{"k":"facts","title":"Rain and storms","rows":[["Humidity","Water vapour in the air — measured with a hygrometer"],["Dew point","The temperature at which air becomes saturated and condenses"],["Orographic rain","Windward side of mountains — e.g. the Western Ghats; the leeward side is a rain-shadow"],["Wettest places","Mawsynram and Cherrapunji (Sohra), Meghalaya"],["Anticyclone","A high-pressure system with calm, clear weather; clockwise in the north"],["Cyclone names (North Indian Ocean)","Chosen in turn from lists given by 13 countries, through the WMO/ESCAP panel and IMD"],["Temperate cyclones","Form along fronts in the mid-latitudes (about 35°–65°)"]]},{"k":"table","title":"Cloud types","head":["Cloud","Looks like","Note"],"rows":[["Cirrus","High, thin and feathery, made of ice crystals","The highest common clouds."],["Cumulus","Puffy, like cotton wool, seen in fair weather","Flat bottoms, heaped tops."],["Stratus","A low, grey layer covering the sky like a sheet","Can give drizzle and fog."],["Nimbostratus","A thick, dark layer giving steady, long rain",""],["Cumulonimbus","Tall thunderstorm clouds with an anvil top","Bring thunder, lightning, hail and heavy showers."],["Cirrostratus","A thin milky veil that makes a halo round the Sun or Moon",""]]},{"k":"info","title":"Clouds by height","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 280\" role=\"img\" aria-label=\"Clouds by height\"><rect x=\"0\" y=\"0\" width=\"680\" height=\"280\" class=\"s3\" opacity=\".6\"/>\n  <path d=\"M60 50 q30 -14 60 0 q30 14 60 0\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\"/><path d=\"M80 60 q30 -12 60 0\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"120\" y=\"85\" text-anchor=\"middle\" font-size=\"11.5\" class=\"b\">Cirrus — high, feathery, ice<\/text>\n  <rect x=\"240\" y=\"40\" width=\"200\" height=\"18\" rx=\"9\" fill=\"#fff\" opacity=\".8\"/><text x=\"340\" y=\"75\" text-anchor=\"middle\" font-size=\"11.5\" class=\"b\">Cirrostratus — halo round the Sun<\/text>\n  <path d=\"M500 250 L500 90 Q490 60 470 50 L650 50 Q630 60 620 90 L620 250 Z\" fill=\"#9aa5b1\"/><text x=\"560\" y=\"270\" text-anchor=\"middle\" font-size=\"11.5\" class=\"b\">Cumulonimbus — thunderstorms<\/text>\n  <g transform=\"translate(120 200) scale(1)\"><ellipse cx=\"0\" cy=\"0\" rx=\"34\" ry=\"14\" fill=\"#fff\" stroke=\"var(--rule)\"/><ellipse cx=\"-18\" cy=\"-8\" rx=\"18\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"14\" cy=\"-12\" rx=\"22\" ry=\"16\" fill=\"#fff\"/><\/g><g transform=\"translate(170 190) scale(0.8)\"><ellipse cx=\"0\" cy=\"0\" rx=\"34\" ry=\"14\" fill=\"#fff\" stroke=\"var(--rule)\"/><ellipse cx=\"-18\" cy=\"-8\" rx=\"18\" ry=\"14\" fill=\"#fff\"/><ellipse cx=\"14\" cy=\"-12\" rx=\"22\" ry=\"16\" fill=\"#fff\"/><\/g><text x=\"140\" y=\"240\" text-anchor=\"middle\" font-size=\"11.5\" class=\"b\">Cumulus — fair weather<\/text>\n  <rect x=\"250\" y=\"205\" width=\"200\" height=\"22\" rx=\"11\" fill=\"#c9cfd6\"/><text x=\"350\" y=\"245\" text-anchor=\"middle\" font-size=\"11.5\" class=\"b\">Stratus — grey sheet, drizzle<\/text>\n  <rect x=\"250\" y=\"150\" width=\"200\" height=\"30\" rx=\"12\" fill=\"#7d8792\"/><text x=\"350\" y=\"140\" text-anchor=\"middle\" font-size=\"11.5\" class=\"b\">Nimbostratus — steady rain<\/text>\n  <text x=\"670\" y=\"20\" text-anchor=\"end\" font-size=\"10.5\" class=\"mut\">high ↑<\/text><text x=\"670\" y=\"275\" text-anchor=\"end\" font-size=\"10.5\" class=\"mut\">low ↓<\/text><\/svg><\/figure>","cap":"Cirrus are the highest; cumulonimbus tower from low to high and bring thunder, lightning and hail; nimbus means rain."},{"k":"table","title":"Storm names around the world","head":["Name","Region","Note"],"rows":[["Hurricanes","The Atlantic, Caribbean Sea and east Pacific (USA)",""],["Typhoons","The north-west Pacific (China Sea, Japan)",""],["Cyclones","The Indian Ocean (Bay of Bengal, Arabian Sea)",""],["Willy-willies","North-west Australia",""],["Baguios","The Philippines",""],["Tornadoes (twisters)","Over land in the central USA","Small, very violent funnels — not tropical cyclones."]]},{"k":"trick","h":"<b>“Hurry to America, Tie a Typhoon to China, Cycle round India, Willy in Australia.”<\/b> Cloud words: <b>cirro<\/b> = curl (high), <b>cumulo<\/b> = heap, <b>strato<\/b> = layer, <b>nimbo<\/b> = rain."},{"k":"trap","h":"In the <b>northern<\/b> half cyclones spin <b>anticlockwise<\/b>; anticyclones spin clockwise. The <b>eye<\/b> of a cyclone is <b>calm<\/b> — the worst winds are in the wall round it. A <b>tornado<\/b> forms over <b>land<\/b> and is much smaller than a cyclone."}],"sum":["Clouds form when rising air cools to its dew point; cumulonimbus brings thunderstorms, cirrus is high and icy.","Rainfall can be convectional, orographic (relief) or cyclonic (frontal).","Tropical cyclones form over warm seas, spin anticlockwise in the north, and have a calm eye.","Hurricane — Atlantic/Caribbean; typhoon — China Sea; cyclone — Indian Ocean; willy-willy — Australia; baguio — Philippines.","Mawsynram (Meghalaya) is among the wettest places on Earth; leeward slopes lie in the rain-shadow."],"part":["Part 3 · Air, water and climate","वायु, जल और जलवायु"],"g":"pg"},
{"id":"Y9","heat":3,"title":"Oceans: relief, salinity, tides, currents and corals","hi":"महासागर: उच्चावच, लवणता, ज्वार, धाराएँ और प्रवाल","blocks":[{"k":"hot","h":"Most asked: <b>warm vs cold currents<\/b> and their ocean (Gulf Stream, Kuroshio, Labrador, Humboldt), <b>spring and neap tides<\/b>, the <b>Mariana Trench<\/b>, <b>average salinity (35‰)<\/b>, and <b>coral reefs and atolls<\/b>."},{"k":"story","h":"<p>About <b>71%<\/b> of the Earth is water, most of it in five oceans: the <b>Pacific<\/b> (largest, deepest), <b>Atlantic<\/b>, <b>Indian<\/b>, <b>Southern<\/b> and <b>Arctic<\/b> (smallest). From the coast the floor goes down the gentle <b>continental shelf<\/b>, the steep <b>slope<\/b>, then the flat <b>abyssal plain<\/b>, cut by deep <b>trenches<\/b> — the deepest is the <b>Mariana Trench<\/b> (Challenger Deep, about 11 km). Sea water has about <b>35 grams of salt per kilogram<\/b> (35‰).<\/p><p><b>Tides<\/b> are caused mainly by the <b>Moon's pull<\/b>. At new and full moon the Sun and Moon pull together — <b>spring tides<\/b>; at the quarter moons they pull at right angles — <b>neap tides<\/b>. <b>Currents<\/b> are rivers in the sea: <b>warm<\/b> ones flow from the Equator towards the poles (Gulf Stream, Kuroshio), <b>cold<\/b> ones flow towards the Equator (Labrador, Canary, Humboldt). Where warm meets cold, fog and rich fishing grounds form — like the <b>Grand Banks<\/b> off Newfoundland. In warm, clear, shallow seas, tiny animals build <b>coral reefs<\/b>.<\/p>","key":"Warm currents flow poleward, cold currents equatorward; spring tide at new/full moon; average salinity 35‰; Mariana Trench is the deepest."},{"k":"facts","title":"Salinity, tides and corals","rows":[["Average salinity","About 35‰ (parts per thousand)"],["Saltiest sea","Red Sea (about 40‰ or more) — hot and dry with few rivers"],["Low salinity","Baltic Sea — cold, many rivers and melting ice"],["Highest tides","Bay of Fundy, Canada"],["Tides each day","Two high and two low tides — about 12 h 25 min apart"],["Grand Banks","Off Newfoundland, where the Gulf Stream meets the Labrador — fog and great fishing"],["Coral needs","Warm (above about 20 °C), clear, shallow, salty water; warming causes bleaching"],["Largest coral reef","Great Barrier Reef, off Queensland, Australia"],["El Niño","Warm water off Peru every few years; it often weakens India's monsoon"]]},{"k":"table","title":"Ocean currents","head":["Current","Warm/cold · Ocean","Note"],"rows":[["Gulf Stream","Warm · Atlantic","Keeps western Europe mild; meets the Labrador off Newfoundland."],["North Atlantic Drift","Warm · Atlantic","Keeps Norway's ports ice-free."],["Brazil","Warm · Atlantic",""],["Labrador","Cold · Atlantic",""],["Canary","Cold · Atlantic","Off north-west Africa."],["Benguela","Cold · Atlantic","Off south-west Africa; helps make the Namib desert."],["Falkland","Cold · Atlantic","Off Argentina."],["Kuroshio (Japan)","Warm · Pacific",""],["Alaska","Warm · Pacific",""],["East Australian","Warm · Pacific",""],["Oyashio (Kurile)","Cold · Pacific",""],["California","Cold · Pacific",""],["Humboldt (Peru)","Cold · Pacific","Rich fishing; helps make the Atacama desert."],["Agulhas","Warm · Indian","Off south-east Africa."],["Mozambique","Warm · Indian",""],["West Australian","Cold · Indian",""]]},{"k":"worldfig","title":"Warm and cold ocean currents","minw":680,"under":"<defs><marker id=\"wa7tufh\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"#d9534f\"/><\/marker><\/defs><path d=\"M245.8,163.9L251.4,144.4L273.6,127.8L315.3,119.4L356.9,108.3\" fill=\"none\" stroke=\"#d9534f\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\".85\" marker-end=\"url(#wa7tufh)\" style=\"vector-effect:non-scaling-stroke\"/><path d=\"M245.8,163.9L251.4,144.4L273.6,127.8L315.3,119.4L356.9,108.3\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1\" stroke-dasharray=\"2 7\" style=\"animation:rvflow 1.2s linear infinite;ve 6L123.6,127.8L140.3,155.6\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1\" stroke-dasharray=\"2 7\" style=\"animation:rvflow 1.2s linear infinite;vector-effect:non-scaling-stroke\"/><text x=\"79.2\" y=\"133.3\" font-size=\"8.5\" font-weight=\"700\" style=\"fill:#2f6db5;paint-order:stroke;stroke:var(--sheet);stroke-width:2.5px\">California<\/text><defs><marker id=\"wapw9t9w\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"#2f6db5\"/><\/marker><\/defs><path d=\"M259.7,358.3L259.7,316.7L245.8,266.7L240.3,247.2\" fill=\"none\" stroke=\"#2f6db5\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\".85\" marker-end=\"url(#wapw9t9w)\" style=\"vector-effect:non-scaling-stroke\"/><path d=\"M259.7,358.3L259.7,316.7L245.8,266.7L240.3,247.2\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1\" stroke-dasharray=\"2 7\" style=\"animation:rvflow 1.2s linear infinite;vector-effect:non-scaling-stroke\"/><text x=\"201.4\" y=\"300\" font-size=\"8.5\" font-weight=\"700\" style=\"fill:#2f6db5;paint-order:stroke;stroke:var(--sheet);stroke-width:2.5px\">Humboldt<\/text><defs><marker id=\"wand9kmh\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"4\" markerHeight=\"4\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"#2f6db5\"/><\/marker><\/defs><path d=\"M781.9,327.8L779.2,302.8L776.4,283.3\" fill=\"none\" stroke=\"#2f6db5\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\".85\" marker-end=\"url(#wand9kmh)\" style=\"vector-effect:non-scaling-stroke\"/><path d=\"M781.9,327.8L779.2,302.8L776.4,283.3\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1\" stroke-dasharray=\"2 7\" style=\"animation:rvflow 1.2s linear infinite;vector-effect:non-scaling-stroke\"/><text x=\"734.7\" y=\"311.1\" font-size=\"8.5\" font-weight=\"700\" style=\"fill:#2f6db5;paint-order:stroke;stroke:var(--sheet);stroke-width:2.5px\">W. Australian<\/text>","cap":"Red: warm currents (from the tropics); blue: cold currents (from the poles). Cold currents off west coasts help make deserts — Benguela (Namib), Humboldt (Atacama), Canary (Sahara)."},{"k":"table","title":"Which ocean?","head":["Which ocean…","Ocean","Note"],"rows":[["is the largest and deepest","Pacific","About a third of the Earth's surface."],["has the Mariana Trench","Pacific","Challenger Deep, about 11 km deep."],["has the Great Barrier Reef (in its Coral Sea)","Pacific",""],["is S-shaped","Atlantic",""],["is the busiest for trade and shipping","Atlantic",""],["has the Sargasso Sea","Atlantic","A 'sea' with no coast, full of floating seaweed."],["is the only one named after a country","Indian",""],["has the Java (Sunda) Trench","Indian",""],["is the smallest and shallowest","Arctic",""],["surrounds Antarctica","Southern",""]]},{"k":"table","title":"Tides, sea floor and corals","head":["Term","Meaning","Note"],"rows":[["Spring tide","Very high tides at new moon and full moon, when the Sun, Moon and Earth are in a line","Nothing to do with the season spring."],["Neap tide","Weak tides at the quarter moons, when the Sun and Moon pull at right angles",""],["Tidal bore","A wall of water rushing up a river mouth with the tide","Seen on the Hooghly."],["Continental shelf","The shallow, gently sloping sea floor at a continent's edge","The richest fishing grounds."],["Abyssal plain","The flat, deep floor of the ocean",""],["Fringing reef","A coral reef growing close to the shore",""],["Barrier reef","A coral reef parted from the coast by a wide lagoon",""],["Atoll","A ring-shaped coral reef round a lagoon","Lakshadweep's islands are atolls."],["Guyot","A flat-topped undersea mountain",""]]},{"k":"photos","title":"The ocean in pictures","items":[["Coral_reef","Coral reef","Corals need warm, shallow, clear water"],["Great_Barrier_Reef","Great Barrier Reef","Australia — the largest reef"],["Mariana_Trench","Mariana Trench","The deepest point"],["Tide","Tide","Spring and neap tides"]]},{"k":"trick","h":"Currents off a continent's <b>west<\/b> coast in the tropics are <b>cold<\/b> (Canary, Benguela, California, Humboldt, West Australian) and they make <b>deserts<\/b> (Sahara, Namib, Atacama). Currents off <b>east<\/b> coasts are <b>warm<\/b> (Gulf Stream, Brazil, Kuroshio, East Australian, Agulhas)."},{"k":"trap","h":"A <b>spring tide<\/b> has nothing to do with the season — it comes twice a month. <b>Kuroshio<\/b> is warm; <b>Oyashio<\/b> is cold. The deepest point of the <b>Atlantic<\/b> is the Puerto Rico Trench, but the deepest of all is the Mariana Trench in the <b>Pacific<\/b>."}],"sum":["Pacific is the largest and deepest ocean; Mariana Trench (Challenger Deep) is the deepest point; Arctic is the smallest.","Average salinity is about 35‰; the Red Sea is very salty, the Baltic Sea is not.","Spring tides at new and full moon; neap tides at the quarter moons; the Bay of Fundy has the highest tides.","Warm currents: Gulf Stream, North Atlantic Drift, Kuroshio, Agulhas; cold: Labrador, Canary, Benguela, Humboldt, California.","Coral reefs are fringing, barrier or atolls; the Great Barrier Reef is the largest; Lakshadweep is made of atolls."],"part":["Part 3 · Air, water and climate","वायु, जल और जलवायु"],"g":"pg"},
{"id":"Y10","heat":2,"title":"Climate types and biomes","hi":"जलवायु के प्रकार और बायोम","blocks":[{"k":"hot","h":"Questions ask for the <b>name of each grassland<\/b> (Prairies, Pampas, Steppes, Veld, Downs), the <b>Köppen letters<\/b> (A to E), and the <b>features of each climate<\/b> — Mediterranean, equatorial, savanna, taiga, tundra."},{"k":"story","h":"<p>In 1918 the German scientist <b>Wladimir Köppen<\/b> sorted the world's climates by temperature and rain into groups with capital letters: <b>A<\/b> tropical, <b>B<\/b> dry, <b>C<\/b> warm temperate, <b>D<\/b> cold snow-forest, <b>E<\/b> polar, and later <b>H<\/b> for highlands. Small letters add detail: <b>f<\/b> = no dry season, <b>m<\/b> = monsoon, <b>w<\/b> = dry winter, <b>s<\/b> = dry summer.<\/p><p>A <b>biome<\/b> is a large area with its own climate, plants and animals. Near the Equator stand the <b>tropical rainforests<\/b> (the Amazon's are called <b>selvas<\/b>); then the <b>savannas<\/b>; then hot <b>deserts<\/b> near 30°. In the middle latitudes lie temperate grasslands with local names — <b>Prairies, Pampas, Steppes, Veld, Downs<\/b>. Further north come the vast conifer forests of the <b>taiga<\/b> — the largest land biome — and finally the frozen <b>tundra<\/b>.<\/p>","key":"Köppen A–E (+H); grasslands: Prairies (N. America), Pampas (Argentina), Steppes (Eurasia), Veld (S. Africa), Downs (Australia)."},{"k":"table","title":"Köppen's main groups","head":["Letter","Climate","Note"],"rows":[["A","Tropical humid — every month above 18 °C",""],["B","Dry — more water lost by evaporation than gained by rain",""],["C","Warm temperate — mild winters",""],["D","Cold snow-forest — harsh winters",""],["E","Polar — warmest month below 10 °C",""],["H","Highland",""]]},{"k":"table","title":"Grasslands and forests by local name","head":["Name","Where","Note"],"rows":[["Prairies","North America (USA and Canada)","Temperate grassland; the 'wheat basket' of the world."],["Pampas","Argentina",""],["Steppes","Eurasia (Ukraine to Central Asia)",""],["Veld","South Africa",""],["Downs","Australia","Sheep farming."],["Canterbury","New Zealand",""],["Puszta","Hungary",""],["Llanos","Venezuela and Colombia (Orinoco basin)","Tropical grassland."],["Campos","Brazilian Highlands","Tropical grassland."],["Selvas","Amazon basin","Tropical rainforest."],["Taiga","Siberia and northern Canada","Coniferous forest."]]},{"k":"photos","title":"Biomes in pictures","items":[["Tropical_rainforest","Tropical rainforest","Equatorial"],["Savanna","Savanna","Tropical grassland"],["Prairie","Prairie","North America"],["Pampas","Pampas","South America"],["Steppe","Steppe","Eurasia"],["Veld","Veld","South Africa"],["Taiga","Taiga","Coniferous forest"],["Tundra","Tundra","Arctic"],["Mediterranean_climate","Mediterranean climate","Dry summers, wet winters"],["Monsoon","Monsoon","Tropical monsoon"]]},{"k":"table","title":"Climate types","head":["Climate","Features","Note"],"rows":[["Equatorial","Rain almost every afternoon, no real winter, dense evergreen forest","Amazon, Congo, Indonesia."],["Tropical savanna","Tall grass with scattered trees, wet summer and dry winter","Big game of Africa."],["Hot desert","Very little rain, cacti and date palms, hot days and cold nights","Sahara, Thar, Kalahari."],["Mediterranean","Hot dry summers and rainy winters; citrus, grapes and olives","The 'orchards of the world'."],["Taiga (sub-arctic)","Long cold winters, coniferous forests and softwood timber",""],["Tundra","Frozen ground (permafrost), mosses and lichens, reindeer",""]]},{"k":"trick","h":"Temperate grasslands round the world: <b>“Pretty Puppies Sleep Very Deeply”<\/b> — <b>P<\/b>rairies (N. America), <b>P<\/b>ampas (S. America), <b>S<\/b>teppes (Eurasia), <b>V<\/b>eld (Africa), <b>D<\/b>owns (Australia)."},{"k":"trap","h":"<b>Llanos<\/b> and <b>Campos<\/b> are <b>tropical<\/b> grasslands (South America), not temperate ones. <b>Selvas<\/b> are forests, not grasslands. The <b>Mediterranean<\/b> climate has <b>rain in winter<\/b>, not summer."}],"sum":["Köppen (1918): A tropical, B dry, C warm temperate, D cold snow-forest, E polar, H highland.","Equatorial: rain daily, evergreen forest (selvas of the Amazon); savanna: tall grass, wet summer, dry winter.","Mediterranean: dry summers, rainy winters — citrus, grapes and olives.","Prairies (N. America), Pampas (Argentina), Steppes (Eurasia), Veld (S. Africa), Downs (Australia), Canterbury (New Zealand).","Taiga (coniferous) is the largest land biome; tundra has permafrost, mosses and lichens."],"part":["Part 3 · Air, water and climate","वायु, जल और जलवायु"],"g":"pg"}

  match: { deck: "winds", title: "Pair each wind with its home", sub: "Flip cards — pair each local wind with where it blows" }

/* ============================================================
   Lab games — shared by the workbook pages that have a "lab" tab (Chemistry and the Static GK apps).
   A page sets LAB_CONF before this file:
     { title, blurb, ranks?: [[xp, name, icon]…],
       decks: [{ id, ico, title, sub, lesson?, q? (prompt prefix), rq? (prefix for the reverse question),
                 pairs: [[prompt, answer, note?]…] | make(): items, list?(): pairs to show, opts?: fixed options, options?(item) }],
       match?: { deck, title, sub },                               — Memory Match from a deck's pairs
       specials?: [{ id, ico, title, sub, wide?, best?(L), start?(), open() }] }   — the page's own games (e.g. the periodic table)
   Games: 60-second quizzes with combos, Memory Match, XP and ranks. Scores live in the app's saved state (S.lab).
   Runs after the engine has booted, so it uses the engine's helpers ($, esc, shuffle, S, save, openLesson).
   ============================================================ */
/* ---------- state ---------- */
function labS(){ S.lab = S.lab || { best:{}, xp:0, plays:0, find:null, match:null }; S.lab.best = S.lab.best || {}; return S.lab; }
const LAB_RANKS_DEF = [[0,"Beginner","🌱"],[60,"Learner","📘"],[200,"Scholar","🎓"],[450,"Expert","🏆"],[900,"Topper","👑"]];
const labRanks = () => LAB_CONF.ranks || LAB_RANKS_DEF;
function labRank(xp){ const R = labRanks(); let r = R[0]; R.forEach(x => { if (xp >= x[0]) r = x; }); const nx = R.find(x => x[0] > xp); return { r, nx }; }
let LAB = { view: "home", sel: null, cat: null, timer: null };
function leaveLab(){ labStop(); LAB.view = "home"; }
function labStop(){ if (LAB.timer) { clearInterval(LAB.timer); LAB.timer = null; } }

/* ---------- home ---------- */
function renderLab(){
  labStyle(); labStop();
  const L = labS();
  const sp = (LAB_CONF.specials || []).find(x => x.id === LAB.view); if (sp) return sp.open();
  const { r, nx } = labRank(L.xp || 0);
  const pct = nx ? Math.round(((L.xp || 0) - r[0]) * 100 / (nx[0] - r[0])) : 100;
  const card = d => `<button type="button" class="lab-g" data-lab-play="${d.id}"><span class="t"><span aria-hidden="true">${d.ico}</span><b>${esc(d.title)}</b></span><small>${esc(d.sub)}</small><span class="best">${L.best[d.id] ? "Best: " + L.best[d.id] : "Not played yet"}</span></button>`;
  $("#app").innerHTML = `<section class="view stack">
    <div class="lab-hero"><div><span class="eyebrow">Learn by playing</span><h1>${esc(LAB_CONF.title || "Lab")}</h1><p class="muted" style="margin:0">${LAB_CONF.blurb || "Quick games for the facts that win marks. Every right answer earns XP."}</p></div>
      <div class="lab-rank"><span class="ic" aria-hidden="true">${r[2]}</span><div><b>${r[1]}</b><small>${L.xp || 0} XP${nx ? ` · ${nx[0] - (L.xp || 0)} to ${nx[1]}` : " · top rank!"}</small><div class="lab-xpbar"><i style="width:${pct}%"></i></div></div></div></div>
    <div class="lab-games">
      ${(LAB_CONF.specials || []).map(s => `<button type="button" class="lab-g${s.wide ? " wide" : ""}" data-lab-go="${s.id}"><span class="t"><span aria-hidden="true">${s.ico}</span><b>${esc(s.title)}</b></span><small>${s.sub}</small><span class="best">${s.best ? s.best(L) : ""}</span></button>`).join("")}
      ${LAB_CONF.decks.map(card).join("")}
      ${LAB_CONF.match ? `<button type="button" class="lab-g" data-lab-go="match"><span class="t"><span aria-hidden="true">🃏</span><b>Memory Match</b></span><small>${esc(LAB_CONF.match.sub)}</small><span class="best">${L.match ? "Best: " + L.match + " moves" : "Not played yet"}</span></button>` : ""}
    </div>
    <div class="block"><h3>How to use the Lab</h3><p class="muted" style="margin:0">Read a lesson first, then play its game until you can answer in about three seconds — that is the speed the exam needs. Each game lasts 60 seconds: right answers in a row build a combo for bonus points. Tap <b>See all pairs</b> on a game to revise its list.</p></div>
  </section>`;
  $("#app").querySelectorAll("[data-lab-play]").forEach(b => b.onclick = () => labIntro(b.dataset.labPlay));
  $("#app").querySelectorAll("[data-lab-go]").forEach(b => b.onclick = () => {
    if (b.dataset.labGo === "match") return labMatch();
    const s = LAB_CONF.specials.find(x => x.id === b.dataset.labGo); LAB.view = s.id; if (s.start) s.start(); s.open(); window.scrollTo(0, 0);
  });
}
const labBack = () => `<div class="lhead"><button class="back" type="button" data-lab-home>‹ Lab</button></div>`;
function labBindHome(){ $("#app").querySelectorAll("[data-lab-home]").forEach(b => b.onclick = () => { labStop(); LAB.view = "home"; renderLab(); window.scrollTo(0,0); }); }

/* ---------- quiz games (60 seconds) ---------- */
function labDeck(id){
  const d = LAB_CONF.decks.find(x => x.id === id);
  const ask = (pre, t) => pre ? `${pre} ${t}${/[?:]$/.test(pre) ? "" : "?"}` : t;
  let items = d.make ? d.make() : d.pairs.map(p => ({ p: ask(d.q, p[0]), a: p[1], note: p[2] || "", raw: p[0], pool: "a" }));
  if (d.rq && !d.make) {   // also ask the other way round, where an answer belongs to one prompt only
    const n = {}; d.pairs.forEach(p => { n[p[1]] = (n[p[1]] || 0) + 1; });
    items = items.concat(d.pairs.filter(p => n[p[1]] === 1).map(p => ({ p: ask(d.rq, p[1]), a: p[0], note: p[2] || "", raw: p[1], pool: "p" })));
  }
  return { d, items };
}
function labIntro(id){
  const { d } = labDeck(id), L = labS();
  const list = d.list ? d.list() : d.pairs;
  $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}
    <div class="block stack lab-pop" style="text-align:center"><div style="font-size:46px" aria-hidden="true">${d.ico}</div><h1 style="margin:0">${esc(d.title)}</h1><p class="muted" style="margin:0">${esc(d.sub)} · 60 seconds · combos for answers in a row</p>
      <p style="margin:0">${L.best[d.id] ? "Your best: <b>" + L.best[d.id] + "</b>" : "First go — no pressure."}</p>
      <div class="row" style="justify-content:center"><button class="btn pri" type="button" id="labgo">▶ Start</button><button class="btn" type="button" id="labpairs">See all pairs</button>${d.lesson ? `<button class="btn ghost" type="button" id="lablesson">Read the lesson</button>` : ""}</div></div>
    <div id="labpairlist"></div></section>`;
  labBindHome();
  $("#labgo").onclick = () => labRun(id);
  $("#labpairs").onclick = () => { $("#labpairlist").innerHTML = `<div class="block"><h3>${list.length} pairs to know</h3><div class="lab-pairs">${list.map(p => `<div><span>${esc(p[0])}</span><b>${esc(p[1])}</b></div>`).join("")}</div></div>`; };
  const lb = $("#lablesson"); if (lb) lb.onclick = () => openLesson(d.lesson, "learn");
}
let LG = null;
function labRun(id){
  labStop();
  const { d, items } = labDeck(id);
  LG = { d, items: shuffle(items), i: 0, score: 0, right: 0, tried: 0, combo: 0, maxc: 0, left: 60, miss: [], lock: false };
  $("#app").innerHTML = `<section class="view stack lab-play">
    <div class="lab-hud"><button class="back" type="button" id="labquit">✕ Stop</button><span class="lab-combo" id="labcombo"></span><span class="sc" id="labscore">0</span></div>
    <div class="lab-time" id="labtime"><i style="width:100%"></i></div>
    <div class="lab-q" id="labq" aria-live="polite"></div>
    <div class="lab-opts" id="labopts"></div>
    <div class="lab-flash" id="labflash"></div></section>`;
  $("#labquit").onclick = () => { labStop(); labOver(); };
  labNext();
  LAB.timer = setInterval(() => {
    LG.left--; const t = $("#labtime"); if (!t) { labStop(); return; }
    t.firstElementChild.style.width = (LG.left / 60 * 100) + "%"; t.classList.toggle("low", LG.left <= 10);
    if (LG.left <= 0) { labStop(); labOver(); }
  }, 1000);
}
function labOptions(it){
  const d = LG.d;
  if (d.opts) return d.opts.slice();
  if (d.options) return d.options(it);
  // wrong options come from the same side of the deck as the answer (names with names, dates with dates)
  const answers = [...new Set(it.all || LG.items.filter(x => x.pool === it.pool).map(x => x.a))].filter(a => a !== it.a);
  const pool = shuffle(answers).slice(0, 3);
  return shuffle([it.a].concat(pool));
}
function labNext(){
  if (LG.i >= LG.items.length) { LG.items = shuffle(LG.items); LG.i = 0; }
  const it = LG.items[LG.i], opts = labOptions(it);
  LG.cur = it; LG.lock = false;
  const q = $("#labq"); q.innerHTML = `<span class="lab-pop">${esc(it.p)}</span>`;
  const box = $("#labopts"); box.className = "lab-opts" + (opts.length === 3 ? " three" : "");
  box.innerHTML = opts.map(o => `<button type="button" data-o="${esc(o)}">${esc(o)}</button>`).join("");
  box.querySelectorAll("button").forEach(b => b.onclick = () => labPick(b));
}
function labPick(b){
  if (LG.lock) return; LG.lock = true;
  const it = LG.cur, ok = b.dataset.o === it.a;
  LG.tried++;
  if (ok) {
    LG.right++; LG.combo++; LG.maxc = Math.max(LG.maxc, LG.combo);
    const gain = 10 + Math.min(LG.combo - 1, 5) * 2;
    LG.score += gain; b.classList.add("ok");
    $("#labflash").textContent = it.note ? it.note : "+" + gain;
  } else {
    LG.combo = 0; b.classList.add("no");
    $("#labopts").querySelectorAll("button").forEach(x => { if (x.dataset.o === it.a) x.classList.add("ok"); });
    LG.miss.push(it); $("#labflash").textContent = (it.note ? it.note + " · " : "") + "Answer: " + it.a;
  }
  $("#labscore").textContent = LG.score;
  $("#labcombo").textContent = LG.combo >= 2 ? "🔥 ×" + LG.combo : "";
  LG.i++;
  setTimeout(() => { if (LAB.timer && $("#labopts")) labNext(); }, ok ? 450 : 1200);
}
function labOver(){
  const L = labS(), id = LG.d.id, best = !L.best[id] || LG.score > L.best[id];
  if (best && LG.score > 0) L.best[id] = LG.score;
  L.xp = (L.xp || 0) + LG.right; L.plays = (L.plays || 0) + 1; save();
  const acc = LG.tried ? Math.round(LG.right * 100 / LG.tried) : 0, seen = new Set();
  const miss = LG.miss.filter(m => { if (seen.has(m.p)) return false; seen.add(m.p); return true; });
  const { r } = labRank(L.xp);
  $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}
    <div class="block lab-res lab-pop"><span class="eyebrow">${esc(LG.d.title)}</span><div class="big">${LG.score}</div>
      <p>${best && LG.score > 0 ? "🎉 New best!" : "Best: " + (L.best[id] || 0)} · ${LG.right}/${LG.tried} right (${acc}%) · longest combo ${LG.maxc} · +${LG.right} XP</p>
      <p class="muted" style="margin:0">${r[2]} ${r[1]} · ${L.xp} XP</p>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn pri" type="button" id="again">Play again</button><button class="btn" type="button" data-lab-home>More games</button></div></div>
    ${miss.length ? `<div class="block"><h3>Fix these ${miss.length}</h3><div class="lab-miss">${miss.map(m => `<div><span>${esc(m.p)}</span><b>${esc(m.a)}</b></div>`).join("")}</div></div>` : (LG.tried ? `<div class="block"><p style="margin:0">💯 No mistakes — try to beat your score.</p></div>` : "")}
  </section>`;
  labBindHome();
  $("#again").onclick = () => labRun(id);
}

/* ---------- memory match ---------- */
function labMatch(){
  labStop();
  const all = LAB_CONF.decks.find(d => d.id === LAB_CONF.match.deck).pairs, n = {};
  all.forEach(p => { n[p[1]] = (n[p[1]] || 0) + 1; });
  const pairs = shuffle(all.filter(p => n[p[1]] === 1)).slice(0, 6);
  const cards = shuffle(pairs.flatMap((p, i) => [{ k: i, t: p[0] }, { k: i, t: p[1] }]));
  const M = { cards, up: [], done: new Set(), moves: 0, t0: Date.now() };
  const draw = () => {
    $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}
      <div class="lab-hud"><div><span class="eyebrow">Memory Match</span><h2 style="margin:4px 0 0">${esc(LAB_CONF.match.title)}</h2></div><span class="sc">${M.moves} moves</span></div>
      <div class="mm">${M.cards.map((c, i) => `<button type="button" data-i="${i}" class="${M.done.has(c.k) ? "done" : M.up.includes(i) ? "up" : ""}" aria-label="${M.done.has(c.k) || M.up.includes(i) ? esc(c.t) : "Hidden card " + (i + 1)}">${M.done.has(c.k) || M.up.includes(i) ? esc(c.t) : "?"}</button>`).join("")}</div></section>`;
    labBindHome();
    $("#app").querySelectorAll(".mm button").forEach(b => b.onclick = () => flip(+b.dataset.i));
  };
  const flip = i => {
    if (M.up.length === 2 || M.up.includes(i) || M.done.has(M.cards[i].k)) return;
    M.up.push(i); draw();
    if (M.up.length === 2) {
      M.moves++;
      const [a, b] = M.up;
      if (M.cards[a].k === M.cards[b].k) { M.done.add(M.cards[a].k); M.up = []; setTimeout(() => { draw(); if (M.done.size === 6) done(); }, 250); }
      else setTimeout(() => { M.up = []; draw(); }, 900);
    }
  };
  const done = () => {
    const L = labS(), best = !L.match || M.moves < L.match; if (best) L.match = M.moves;
    L.xp = (L.xp || 0) + 12; L.plays = (L.plays || 0) + 1; save();
    $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}<div class="block lab-res lab-pop"><span class="eyebrow">Memory Match</span><div class="big">${M.moves}</div>
      <p>moves · ${Math.round((Date.now() - M.t0) / 1000)} s · ${best ? "🎉 New best!" : "Best: " + L.match + " moves"} · +12 XP</p>
      <div class="lab-pairs" style="text-align:left">${pairs.map(p => `<div><span>${esc(p[0])}</span><b>${esc(p[1])}</b></div>`).join("")}</div>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn pri" type="button" id="again">New cards</button><button class="btn" type="button" data-lab-home>More games</button></div></div></section>`;
    labBindHome(); $("#again").onclick = labMatch;
  };
  draw(); window.scrollTo(0, 0);
}


/* ---------- decks from the lessons' own tables ---------- */
/** Rows of a lesson's n-th table as [prompt, answer, note] (tags stripped), so a deck never repeats the data. */
function labRows(lessonId, n){
  const strip = s => String(s == null ? "" : s).replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&minus;/g, "−").trim();
  const l = LESSONS.find(x => x.id === lessonId), t = l ? l.blocks.filter(b => b.k === "table")[n || 0] : null;
  return t ? t.rows.map(r => [strip(r[0]), strip(r[1]), strip(r[2])]) : [];
}
/** A "grand mix" deck: a few rows from every listed deck, with each deck's own question wording. */
function labMix(decks){
  // wrong options come from the whole deck (all), so a deck drawn only once or twice in the 80 still has enough
  return shuffle(decks.flatMap(d => { const all = [...new Set(d.pairs.map(p => p[1]))];
    return d.pairs.map(p => ({ p: d.q ? `${d.q} ${p[0]}${/[?:]$/.test(d.q) ? "" : "?"}` : p[0], a: p[1], note: p[2] || "", pool: d.id, all })); })).slice(0, 80);
}

<script>
"use strict";
/* ============================================================
   Workbook engine — shared by the History and Computer Knowledge pages (tools/workbook/lib.js puts it in each one).
   APP.mode "era": a subject app with its own lessons and questions (Learn · Practice · Mock · Revise · Plan).
   APP.mode "hub": start here, a plan across a family of apps, and revision across all of them (no questions of its own).
   Optional data: APP.hub (a family hub to link to), HEATMAP (where the marks come from, by exam),
   a question's 8th field (the paper it was reported from), APP.tabs (the tabs, in order) — a tab the engine
   does not know (e.g. Chemistry's "lab") is drawn by the page's own script: render<Tab>() and, when you
   leave it, leave<Tab>().
   ============================================================ */
const HUB = APP.mode === "hub";
const EMBED = (() => { try { return window.parent !== window; } catch(e) { return true; } })();
const TABS = HUB ? ["start","plan","revise"] : (APP.tabs || ["learn","practice","mock","revise","plan"]);

/* ============================================================
   HELPERS & STATE
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hash = s => { let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5)+h + s.charCodeAt(i))|0; return "q"+(h>>>0).toString(36); };
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; };
const L = id => LESSONS.find(l => l.id === id);
const LNUM = id => LESSONS.findIndex(l => l.id === id) + 1;
const G = id => GROUPS.find(g => g.id === id) || GROUPS[0];
const A = id => APP.apps.find(a => a.id === id);
const appOf = id => (L(id) && L(id).app) || APP.id;       // in the hub, each lesson carries the app it lives in

const QS = QB.map(r => {
  const fixed = !!r[6];
  return { t:r[0], q:r[1], o:r[2], e:r[3], p:(r[4]||"").includes("p"), a: fixed ? (r[5]||0) : 0, fixed, id:hash(r[1]), src: r[7] || "" };
});
const byLesson = id => QS.filter(q => q.t === id);
const makePerm = q => q.fixed ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i));
const qCount = id => HUB ? null : byLesson(id).length;
const pCount = id => HUB ? ((APP.pcount||{})[id] || 0) : byLesson(id).filter(q=>q.p).length;

const KEY = APP.key;
let S = { ans:{}, bm:{}, les:{}, mocks:[], plan:null };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const record = (q, ok) => { S.ans[q.id] = ok ? 1 : 0; save(); renderTop(); };

/* Another History app's saved progress. Every page is on the same site, so the hub (and a
   plan) can see which lessons you have read and quizzed in the subject apps. */
function appState(a){ try { return JSON.parse(localStorage.getItem(a.key) || "{}") || {}; } catch(e) { return {}; } }
function lessonState(id){
  const owner = appOf(id);
  if (owner === APP.id) return S.les[id] || {};
  const a = A(owner); return a ? ((appState(a).les || {})[id] || {}) : {};
}
const lesDone = l => !!lessonState(l.id).done;
const heatDots = n => `<span class="dots" aria-label="Asked ${n===3?"almost every shift":n===2?"often":"now and then"}">${[1,2,3].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>`;

/* Open a lesson or a tab, here or in the History app it lives in. Inside पाठShala the
   app is asked to switch (so your session is tracked); on its own the page just navigates. */
function openApp(appId, lesson, tab){
  if (appId === APP.id) {
    if (lesson) openLesson(lesson, "learn"); else go(tab || TABS[0]);
    return;
  }
  const a = APP.hub && appId === APP.hub.id ? APP.hub : A(appId);
  if (!a) return;
  const here = () => { location.href = a.file + (lesson ? "?lesson=" + encodeURIComponent(lesson) : "") + (tab ? "#" + tab : ""); };
  if (!EMBED) return here();
  let ok = false;
  const onAck = e => { if (e.origin === location.origin && e.data && e.data.type === "shabd-open-ok") ok = true; };
  window.addEventListener("message", onAck);
  try { window.parent.postMessage({ type:"shabd-open", mod:a.id, lesson: lesson || null, tab: tab || null }, location.origin); } catch(e) {}
  setTimeout(() => { window.removeEventListener("message", onAck); if (!ok) here(); }, 700);
}
const hubLink = (before, label, tab, after) => APP.hub ? before + goLink(label, APP.hub.id, null, tab) + (after || "") : "";
const goLink = (label, appId, lesson, tab) => `<button type="button" class="golink" data-go="${esc(JSON.stringify([appId, lesson||null, tab||null]))}">${label}</button>`;
function bindGo(root){
  root.querySelectorAll("[data-go]").forEach(b => b.onclick = ev => { ev.stopPropagation(); const g = JSON.parse(b.dataset.go); openApp(g[0], g[1], g[2]); });
}

function renderTop(){
  if (HUB) {
    const done = LESSONS.filter(lesDone).length;
    $("#topstat").innerHTML = `<b>${done}</b>/${LESSONS.length} lessons<br>in ${APP.apps.length} apps`;
    return;
  }
  const ids = Object.keys(S.ans).filter(k => QS.some(q => q.id === k));
  const right = ids.filter(k => S.ans[k] === 1).length;
  const pct = ids.length ? Math.round(right*100/ids.length) : 0;
  $("#topstat").innerHTML = `<b>${ids.length}</b>/${QS.length} tried<br><b>${pct}%</b> right now`;
}

/* ============================================================
   ROUTING
   ============================================================ */
let TAB = TABS[0];
let timerId = null;
function go(tab){
  if (!TABS.includes(tab)) tab = TABS[0];
  const own = t => t.charAt(0).toUpperCase() + t.slice(1);
  if (TAB !== tab && typeof window["leave" + own(TAB)] === "function") window["leave" + own(TAB)]();
  TAB = tab;
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.tab===tab ? "page" : "false"));
  if (tab === "start") renderStart();
  if (tab === "learn") renderLearn();
  if (tab === "practice") renderPractice();
  if (tab === "mock") renderMock();
  if (tab === "revise") renderRevise();
  if (tab === "plan") renderPlan();
  if (!["start","learn","practice","mock","revise","plan"].includes(tab) && typeof window["render" + own(tab)] === "function") window["render" + own(tab)]();
  window.scrollTo(0,0);
  try { history.replaceState(null, "", location.pathname + location.search + "#" + tab); } catch(e) {}
}
document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => {
  if (TAB === "mock" && M && M.running && b.dataset.tab !== "mock") { go("mock"); showMockLeave(b.dataset.tab); return; }
  go(b.dataset.tab);
}));

/* ============================================================
   START HERE (hub)
   ============================================================ */
function renderStart(){
  const done = LESSONS.filter(lesDone).length;
  const cards = APP.apps.map(a => {
    const ls = LESSONS.filter(l => l.app === a.id), d = ls.filter(lesDone).length, it = INTROS[a.id] || {};
    return `<button type="button" class="appc" data-go="${esc(JSON.stringify([a.id,null,null]))}">
      <div class="hd"><span class="ic" aria-hidden="true">${a.ico}</span><span><b>${esc(a.title)}</b><small>${esc(a.hi)}</small></span><span class="go">Open ›</span></div>
      ${it.lead ? `<p>${esc(it.lead)}</p>` : ""}
      <div class="meter"><i style="width:${ls.length ? d/ls.length*100 : 0}%"></i></div>
      <span class="meta">${d}/${ls.length} lessons done · ${(APP.qcount||{})[a.id] || 0} questions</span></button>`;
  }).join("");
  const tips = APP.apps.filter(a => INTROS[a.id]).map(a => `<div><dt>${esc(a.title)}</dt><dd>${esc(INTROS[a.id].tip)} ${esc(INTROS[a.id].order)}</dd></div>`).join("");
  $("#app").innerHTML = `<section class="view stack">
    <div class="hero">
      <span class="eyebrow">New to history? Start here</span>
      <h1>History, from zero to exam-ready</h1>
      <p>SSC splits history into five subjects, so these are five apps &mdash; Ancient, Medieval, Modern, Art &amp; Culture, and World &mdash; with ${LESSONS.length} lessons between them. You do not need to know anything before you begin: every lesson opens with a two-minute story that explains what happened and why, and only then gives you the tables, tricks and traps the exam asks about.</p>
      <div class="meter" aria-label="Lessons done in every History app"><i style="width:${done/LESSONS.length*100}%"></i></div>
      <div class="row between"><span class="muted num" style="font-size:13px">${done}/${LESSONS.length} lessons done across the apps</span>
        <button class="btn pri sm" type="button" id="toplan">${S.plan ? "Open my plan" : "Make a study plan"}</button></div>
    </div>
    <div class="block"><h3>How to use these apps</h3><ol class="steps-list">
      <li><b>Pick a plan</b> in the Plan tab &mdash; 5, 7, 10, 15 or 30 days. It tells you exactly what to read each day, and ticks itself as you finish lessons in the apps.</li>
      <li><b>Read the story first</b> in every lesson, then the tables. The <b>Trick</b> boxes help you remember; the <b>Trap</b> boxes are the pairs SSC swaps to catch you.</li>
      <li><b>Take the quiz</b> at the end of each lesson. Anything you get wrong waits for you under Practice &rarr; Mistakes until you get it right.</li>
      <li><b>Revise in layers</b> in the Revise tab here: 30 days out read every summary, in the last week only the most-asked lessons, and in the final hour the Last moment sheet.</li>
    </ol></div>
    <h2>The five apps</h2>
    <div class="appcs">${cards}</div>
    ${tips ? `<div class="block"><h3>How to study each one</h3><dl class="facts prose">${tips}</dl></div>` : ""}
    <div class="block"><h3>Where the marks are</h3><dl class="facts prose">${GROUPS.filter(g=>ERANOTE[g.id]).map(g=>`<div><dt>${esc(g.name)}</dt><dd>${ERANOTE[g.id]}</dd></div>`).join("")}</dl>
      <p class="muted" style="font-size:13px;margin-top:8px">The dots next to each lesson show how often its topic comes up: three dots means almost every shift.</p></div>
  </section>`;
  bindGo($("#app"));
  $("#toplan").onclick = () => go("plan");
}

/* ============================================================
   LEARN (subject app)
   ============================================================ */
function lessonRow(l, nextL){
  const st = lessonState(l.id), n = byLesson(l.id).length;
  return `<button type="button" class="les ${lesDone(l)?"done":""} ${nextL&&l.id===nextL.id?"next":""}" data-open="${l.id}">
    <span class="no">${lesDone(l) ? "✓" : LNUM(l.id)}</span>
    <span class="t"><b>${esc(l.title)}${heatDots(l.heat)}</b><span>${l.hi} · ${n} questions</span></span>
    <span class="sc">${st.best!=null ? `best<br>${st.best}/${n}` : ""}</span></button>`;
}
function renderLearn(){
  const done = LESSONS.filter(lesDone).length;
  const nextL = LESSONS.find(l => !lesDone(l));
  const it = INTROS[APP.id] || {};
  const parts = [];
  LESSONS.forEach(l => {
    const name = l.part ? l.part[0] : "";
    if (!parts.length || parts[parts.length-1].name !== name) parts.push({ name, hi: l.part ? l.part[1] : "", ls: [] });
    parts[parts.length-1].ls.push(l);
  });
  $("#app").innerHTML = `<section class="view stack">
    <div class="hero">
      <span class="eyebrow">${esc(APP.hi)}${APP.tagline ? " \u00b7 " + esc(APP.tagline) : ""}</span>
      <h1>${esc(APP.title)}</h1>
      <p>${it.lead ? esc(it.lead) + " " : ""}${LESSONS.length} lessons and ${QS.length} exam-style questions. Each lesson starts with a short story, then the tables, tricks and traps, a quiz and a one-screen summary.</p>
      <div class="meter" aria-label="Lessons done"><i style="width:${done/LESSONS.length*100}%"></i></div>
      <div class="row between"><span class="muted num" style="font-size:13px">${done}/${LESSONS.length} lessons done</span>
      ${nextL ? `<button class="btn pri sm" type="button" data-open="${nextL.id}">${done? "Continue" : "Start"}: ${esc(nextL.title)}</button>` : `<span class="muted" style="font-size:13px">All lessons done. Try a mock test.</span>`}</div>
    </div>
    ${it.tip ? `<div class="callout"><b>How to study it.</b> ${esc(it.tip)} ${esc(it.order || "")}</div>` : ""}
    ${HEATMAP ? `<details class="block hmwrap"><summary><h3>Exam heat map</h3><span class="muted">which lessons carry the marks in each exam \u203a</span></summary>${heatHTML(false)}</details>` : ""}
    ${parts.map(p => `${p.name ? `<div class="grph"><h2>${esc(p.name)}</h2><span>${p.ls.length} lessons</span></div>${p.hi?`<p class="muted" style="font-size:13px;margin:-8px 0 2px">${p.hi}</p>`:""}` : ""}
      <div class="lessons">${p.ls.map(l => lessonRow(l, nextL)).join("")}</div>`).join("")}
    <p class="foot">The dots show how often a topic is asked &mdash; three dots means almost every paper.${hubLink(" A plan across every app in this subject, and revision across all of them, is in ", APP.hub ? APP.hub.title : "", null, ".")}</p>
  </section>`;
  $("#app").querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openLesson(b.dataset.open, "learn")));
  bindGo($("#app"));
}

function blockHTML(b){
  if (b.k==="p") return `<div class="plain"><p>${b.h}</p></div>`;
  if (b.k==="hot") return `<div class="hot"><span class="lab">Why it is asked</span>${b.h}</div>`;
  if (b.k==="story") return `<div class="story"><span class="lab">${esc(APP.storyLabel || "The story first \u00b7 two minutes")}</span>${b.h}${b.key?`<p class="key"><b>${esc(APP.keyLabel || "Carry this into the tables:")}</b> ${esc(b.key)}</p>`:""}</div>`;
  if (b.k==="trick") return `<div class="trick"><span class="lab">Trick</span>${b.h}</div>`;
  if (b.k==="trap") return `<div class="trap"><span class="lab">Trap · don't mix these up</span>${b.h}</div>`;
  if (b.k==="link") return `<div class="link"><span class="lab">Link it up</span>${b.h}</div>`;
  if (b.k==="ex") return `<div class="link"><span class="lab">Worked example</span>${b.h}</div>`;
  if (b.k==="facts") return `<div class="block"><h3>${b.title}</h3><dl class="facts">${b.rows.map(r=>`<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join("")}</dl></div>`;
  if (b.k==="tl") return `<div class="block"><h3>${b.title}</h3><ul class="tl">${b.rows.map(r=>`<li><span class="y">${r[0]}</span><span>${r[1]}</span></li>`).join("")}</ul></div>`;
  if (b.k==="table") return `<div class="block"><h3>${b.title}</h3><div class="tbl"><table><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  if (b.k==="fig") return `<div class="block${b.wide?" phblock":""}"><h3>${b.title}</h3><figure class="fig${b.wide?" wide":""}"${b.wide?` style="--minw:${b.wide}px"`:""}>${b.svg}<figcaption>${b.cap}</figcaption></figure></div>`;
  return typeof visBlock === "function" ? visBlock(b) : "";      // photos, maps, charts, timelines… from study-visual.js
}

let LQ = null;
function openLesson(id, step){
  if (HUB || !L(id) || appOf(id) !== APP.id) { openApp(appOf(id), id); return; }   // the hub shows lessons in their own app
  const l = L(id), i = LNUM(id);
  if (step === "quiz") { LQ = { id, list: shuffle(byLesson(id)).map(q => ({q, perm:makePerm(q)})), i:0, score:0, picked:null }; }
  const head = `<div class="lhead"><button class="back" type="button" id="lback">‹ Lessons</button></div>
    <span class="eyebrow">${esc(APP.title)} · Lesson ${i} of ${LESSONS.length} · ${l.hi}</span><h1>${esc(l.title)}</h1>
    <p class="muted" style="font-size:13px">Asked in CGL ${heatDots(l.heat)} ${l.heat===3?"— almost every shift":l.heat===2?"— often":"— now and then"}</p>
    <div class="steps" role="tablist">
      <button type="button" data-step="learn" aria-current="${step==="learn"?"step":"false"}">1 · Learn</button>
      <button type="button" data-step="quiz" aria-current="${step==="quiz"?"step":"false"}">2 · Quiz</button>
      <button type="button" data-step="sum" aria-current="${step==="sum"?"step":"false"}">3 · Summary</button>
    </div>`;
  let body = "";
  if (step === "learn") {
    body = `<div class="stack">${l.blocks.map(blockHTML).join("")}
      <div class="row end"><button class="btn pri" type="button" id="toquiz">Take the quiz · ${byLesson(id).length} questions</button></div></div>`;
  } else if (step === "quiz") {
    body = `<div id="lq"></div>`;
  } else {
    const nxt = LESSONS[i];
    body = `<div class="stack"><div class="block"><h3>Remember these</h3><ul class="sum">${l.sum.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
      <div class="row between"><button class="btn" type="button" id="relearn">Read again</button>
      ${nxt ? `<button class="btn pri" type="button" id="nextles">Next: ${esc(nxt.title)}</button>` : `<button class="btn pri" type="button" id="tomock">Take a mock test</button>`}</div></div>`;
    S.les[id] = Object.assign(S.les[id]||{}, {done:1}); save(); renderTop();
  }
  $("#app").innerHTML = `<section class="view stack">${head}${body}</section>`;
  $("#lback").onclick = () => go("learn");
  $("#app").querySelectorAll("[data-step]").forEach(b => b.onclick = () => openLesson(id, b.dataset.step));
  if (step==="learn") $("#toquiz").onclick = () => openLesson(id,"quiz");
  if (step==="quiz") renderLQ();
  if (step==="sum") {
    $("#relearn").onclick = () => openLesson(id,"learn");
    const n = $("#nextles"); if (n) n.onclick = () => openLesson(LESSONS[i].id,"learn");
    const m = $("#tomock"); if (m) m.onclick = () => go("mock");
  }
  window.scrollTo(0,0);
}

function optsHTML(q, perm, state){
  return perm.map((oi, k) => {
    let cls = "opt";
    if (state.reveal) { if (oi === q.a) cls += " ok"; else if (oi === state.picked) cls += " no"; }
    else if (state.sel === oi) cls += " sel";
    return `<button type="button" class="${cls}" data-oi="${oi}" ${state.reveal?"disabled":""}><span class="k">${"ABCD"[k]}</span><span>${esc(q.o[oi])}</span></button>`;
  }).join("");
}
function expHTML(q, picked){
  const ok = picked === q.a;
  return `<div class="exp">${ok ? `<b class="okl">Correct.</b>` : `<b class="nol">Answer: ${esc(q.o[q.a])}.</b>`} ${esc(q.e)}</div>`;
}
function metaHTML(q, no){
  return `<div class="qmeta"><span class="qno">${no}</span><span class="tag">L${LNUM(q.t)} \u00b7 ${esc(L(q.t).title)}</span>${q.src?`<span class="tag src" title="Reported by candidates after this paper (memory-based)">\ud83d\udcdc ${esc(q.src)}</span>`:""}${q.p?`<span class="tag pyq" title="This fact comes up again and again in SSC papers">Repeatedly asked</span>`:""}
  <button type="button" class="bm" data-bm="${q.id}" aria-pressed="${S.bm[q.id]?"true":"false"}" aria-label="Bookmark">${S.bm[q.id]?"★":"☆"}</button></div>`;
}

function renderLQ(){
  const box = $("#lq");
  if (LQ.i >= LQ.list.length) {
    const n = LQ.list.length;
    const st = S.les[LQ.id] || {}; st.best = Math.max(st.best||0, LQ.score); S.les[LQ.id] = st; save();
    box.innerHTML = `<div class="stack"><div class="block stack"><span class="eyebrow">Quiz done</span>
      <div class="scorebig"><span class="num">${LQ.score}</span><span class="muted">/ ${n} correct</span></div>
      <p class="muted">${LQ.score===n ? "Full marks." : LQ.score >= n*0.8 ? "Strong. Review the ones you missed under Practice → Mistakes." : "Read the story and the Trap boxes once more, then retry. Missed questions are saved under Practice → Mistakes."}</p></div>
      <div class="row between"><button class="btn" type="button" id="retry">Retry quiz</button><button class="btn pri" type="button" id="tosum">See summary</button></div></div>`;
    $("#retry").onclick = () => openLesson(LQ.id,"quiz");
    $("#tosum").onclick = () => openLesson(LQ.id,"sum");
    return;
  }
  const it = LQ.list[LQ.i], q = it.q;
  const reveal = LQ.picked !== null;
  box.innerHTML = `<div class="stack"><div class="meter"><i style="width:${LQ.i/LQ.list.length*100}%"></i></div>
    <article class="qcard">${metaHTML(q, `Q${LQ.i+1}/${LQ.list.length}`)}
    <p class="qt">${esc(q.q)}</p><div class="opts">${optsHTML(q, it.perm, {picked:LQ.picked, reveal})}</div>
    ${reveal ? expHTML(q, LQ.picked) : ""}</article>
    ${reveal ? `<div class="row end"><button class="btn pri" type="button" id="lqnext">${LQ.i+1 < LQ.list.length ? "Next question" : "Finish"}</button></div>` : `<p class="muted" style="font-size:13px">Score so far: <span class="num">${LQ.score}</span></p>`}</div>`;
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (LQ.picked !== null) return;
    LQ.picked = +b.dataset.oi; const ok = LQ.picked === q.a; if (ok) LQ.score++; record(q, ok); renderLQ();
  });
  bindBM(box);
  const nx = $("#lqnext"); if (nx) nx.onclick = () => { LQ.i++; LQ.picked = null; renderLQ(); window.scrollTo(0,0); };
}

function bindBM(root){
  root.querySelectorAll("[data-bm]").forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    const id = b.dataset.bm; if (S.bm[id]) delete S.bm[id]; else S.bm[id] = 1; save();
    b.setAttribute("aria-pressed", S.bm[id] ? "true":"false"); b.textContent = S.bm[id] ? "★" : "☆";
  });
}

/* ============================================================
   PRACTICE
   ============================================================ */
let PF = "all", PSHOW = 20, PORDER = null, PPERM = {}, PPICK = {};
const hasHot = () => LESSONS.some(l => l.heat === 3) && LESSONS.some(l => l.heat !== 3);
function practiceList(){

function pCard(q, idx){
  if (!PPERM[q.id]) PPERM[q.id] = makePerm(q);
  const picked = PPICK[q.id]; const reveal = picked !== undefined;

    <div class="opts">${optsHTML(q, PPERM[q.id], {picked: reveal?picked:null, reveal})}</div>${reveal?expHTML(q,picked):""}</article>`;
}
function drawPList(){

  box.innerHTML = list.slice(0, PSHOW).map((q,i)=>pCard(q,i)).join("") + (list.length > PSHOW ? `<button class="btn" type="button" id="pmore">Show 20 more (${list.length-PSHOW} left)</button>` : "");
  box.querySelectorAll(".qcard").forEach(bindCard);

}
function bindCard(card){
  card.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const q = QS.find(x => x.id === card.dataset.q); if (PPICK[q.id] !== undefined) return;
    PPICK[q.id] = +b.dataset.oi; record(q, PPICK[q.id] === q.a);
    const idx = +card.querySelector(".qno").textContent.slice(1) - 1;
    const tmp = document.createElement("div"); tmp.innerHTML = pCard(q, idx); const nc = tmp.firstElementChild;
    card.replaceWith(nc); bindCard(nc);

}

function submitMock(){

    const a = M.ans[k], t = it.q.t; per[t] = per[t] || {c:0,n:0}; per[t].n++;
    if (a===null) sk++; else if (a===it.q.a) { c++; per[t].c++; S.ans[it.q.id]=1; } else { w++; S.ans[it.q.id]=0; }

function digestGroups(list){

  const out = [];
  list.forEach(l => {
    const name = l.part ? l.part[0] : APP.title;
    if (!out.length || out[out.length-1].name !== name) out.push({ name, note: out.length ? "" : (ERANOTE[APP.era] || ""), ls: [] });
    out[out.length-1].ls.push(l);
  });
  return out;
}
function drawDigest(box, list, note){

        if (!pts.length) return "";
        return `<div class="block"><h3>${esc(l.title)} ${heatDots(l.heat)}</h3><ul class="sum">${pts.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
          <p style="margin-top:8px;font-size:14px">${goLink("Open the lesson ›", appOf(l.id), l.id)}</p></div>`;

}
function drawLastMoment(box){
  box.innerHTML = `<div class="callout"><b>Read this, nothing else.</b> These are the pairings that decide marks — the ones candidates lose because two names got swapped.</div>
    <input class="search" id="lms" type="search" placeholder="Search a name or term" aria-label="Search the last-moment sheet">
    <div id="lml" class="stack"></div>`;
  const draw = () => {

      const rows = c.rows.filter(r => !s || (r[0]+" "+r[1]).toLowerCase().includes(s) || c.t.toLowerCase().includes(s));
      if (!rows.length) return "";

function drawTimeline(box){

      const rows = t.rows.filter(r => !s || (r[0]+" "+r[1]).toLowerCase().includes(s));
      if (!rows.length) return "";

        <div class="block"><ul class="tl">${rows.map(r=>`<li><span class="y">${r[0]}</span><span>${r[1]}</span></li>`).join("")}</ul></div>`;

t=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Tree<\/text><\/g><\/svg><\/figure>","cap":"Bus: one cable. Star: all to a central hub or switch (the commonest today). Ring: a closed loop with token passing. Mesh: everyone to everyone — n(n−1)/2 links. Tree: stars joined in a hierarchy."},{"k":"table","title":"OSI model: 7 layers","head":["No.","Layer","Data unit / job","Devices / protocols"],"rows":[["7","Application","User service layer; protocols (rules)","HTTP, HTTPS, FTP, Gopher, SMTP, POP3, IMAP, MIME, SNMP, DNS, DHCP, Telnet; gateway"],["6","Presentation","Security (encryption/decryption: plain text &lt;→ cipher text) and compression/decompression (Huffman technique)","Gateway"],["5","Session","Dialogue control: simplex, half duplex, full duplex","Gateway"],["4","Transport","Segmentation, port-to-port delivery","TCP, UDP, SCTP; gateway"],["3","Network","Packetization; addressing (IP, MAC); routing","Router, gateway"],["2","Data Link","Framing; error detection and correction (CRC = Cyclic Redundancy Check)","Switch, bridge"],["1","Physical","Bits transmission; topology (network design); signal","Hub, modem, repeater"]]},{"k":"info","title":"The OSI model's seven layers","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 290\" role=\"img\" aria-label=\"The seven OSI layers\">\n  <rect x=\"20\" y=\"10\" width=\"300\" height=\"34\" rx=\"6\" fill=\"hsl(0,55%,46%)\"/><text x=\"36\" y=\"32\" font-size=\"13\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:#fff\">7 · Application<\/text><text x=\"334\" y=\"31\" font-size=\"10.5\" class=\"mut\">HTTP, HTTPS, FTP<\/text><rect x=\"20\" y=\"49\" width=\"300\" height=\"34\" rx=\"6\" fill=\"hsl(40,55%,46%)\"/><text x=\"36\" y=\"71\" font-size=\"13\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:#fff\">6 · Presentation<\/text><text x=\"334\" y=\"70\" font-size=\"10.5\" class=\"mut\">Gateway<\/text><rect x=\"20\" y=\"88\" width=\"300\" height=\"34\" rx=\"6\" fill=\"hsl(80,55%,46%)\"/><text x=\"36\" y=\"110\" font-size=\"13\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:#fff\">5 · Session<\/text><text x=\"334\" y=\"109\" font-size=\"10.5\" class=\"mut\">Gateway<\/text><rect x=\"20\" y=\"127\" width=\"300\" height=\"34\" rx=\"6\" fill=\"hsl(120,55%,46%)\"/><text x=\"36\" y=\"149\" font-size=\"13\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:#fff\">4 · Transport<\/text><text x=\"334\" y=\"148\" font-size=\"10.5\" class=\"mut\">TCP, UDP, SCTP<\/text><rect x=\"20\" y=\"166\" width=\"300\" height=\"34\" rx=\"6\" fill=\"hsl(160,55%,46%)\"/><text x=\"36\" y=\"188\" font-size=\"13\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:#fff\">3 · Network<\/text><text x=\"334\" y=\"187\" font-size=\"10.5\" class=\"mut\">Router, gateway<\/text><rect x=\"20\" y=\"205\" width=\"300\" height=\"34\" rx=\"6\" fill=\"hsl(200,55%,46%)\"/><text x=\"36\" y=\"227\" font-size=\"13\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:#fff\">2 · Data Link<\/text><text x=\"334\" y=\"226\" font-size=\"10.5\" class=\"mut\">Switch, bridge<\/text><rect x=\"20\" y=\"244\" width=\"300\" height=\"34\" rx=\"6\" fill=\"hsl(240,55%,46%)\"/><text x=\"36\" y=\"266\" font-size=\"13\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:#fff\">1 · Physical<\/text><text x=\"334\" y=\"265\" font-size=\"10.5\" class=\"mut\">Hub, modem, repeater<\/text>\n  <text x=\"20\" y=\"286\" font-size=\"10.5\" class=\"mut\">Mnemonic, top down: All People Seem To Need Data Processing.<\/text><\/svg><\/figure>","cap":"Data moves down the layers on the sender's side and up on the receiver's. Routers work at layer 3, switches at layer 2, hubs and repeaters at layer 1."},{"k":"table","title":"OSI vs TCP/IP model","head":["OSI layer(s) (reference model)","TCP/IP layer (implementing model)"],"rows":[["Application + Presentation + Session (user-specific layers)","Application"],["Transport","Transport"],["Network","Internetworking (Network)"],["Data Link + Physical (network-specific layers)","Network Interface and Hardware"]]},{"k":"facts","title":"Data flow and protocols","rows":[["Flow","Digital computer: bits (physical layer) → frame (data link layer) → packet (network layer) → network."],["TCP/IP","Standard protocol of the internet. TCP = Transmission Control Protocol (makes packets, connection-oriented, reliable). IP = Internet Protocol (puts the IP address on every packet)."],["UDP","User Datagram Protocol: connectionless and unreliable but fast; used for streaming media."],["SCTP","Stream Control Transmission Protocol."],["Port number","Unique address of a process. HTTP = 80, SNMP = 161; FTP = 21, Telnet = 23, HTTPS = 443."],["DNS","Domain Name System: converts domain names into IP addresses and back."],["DHCP","Dynamic Host Configuration Protocol: generates (assigns) IP addresses automatically."],["Telnet","Teletype Network / Telecommunication Network: remote login."],["FTP","File Transfer Protocol: transfers files. Gopher: sends document files."],["SNMP","Simple Network Management Protocol."],["HTTPS","Secure protocol for the WWW."]]},{"k":"table","title":"Networking devices","head":["Device","OSI layer","Job"],"rows":[["Hub","Physical","Dumb device (no intelligence); broadcasts data to all ports"],["Repeater","Physical","Signal booster; extends network length without signal degradation"],["Modem","Physical","Modulator-Demodulator; converter; digital to analog = modulation, analog to digital = demodulation; for internet over telephone lines"],["Switch","Data link","Intelligent; checks the (MAC) address before sending; network extension; filters traffic; connects computers in a LAN through twisted-pair cables"],["Bridge","Data link","Connects two networks (LANs) that use the SAME protocol"],["Router","Network","More intelligent; keeps a routing table in its memory; checks and stores addresses; shortest-path routing between networks"],["Gateway","Network to Application","Connects two networks that use DIFFERENT protocols"],["NIC / Ethernet card","—","Network Interface Card: connects a computer to an Ethernet LAN; an input/output device"],["Access point","Data link","Lets wireless (Wi-Fi) devices join a wired network"]]},{"k":"facts","title":"Transmission modes","rows":[["Simplex","One-way only: computer and keyboard/mouse, radio/FM, television."],["Half duplex","Both ways but one at a time: SMS, email, Bluetooth, walkie-talkie, railway track."],["Full duplex","Both ways at the same time: telephone, instant messaging (WhatsApp)."]]},{"k":"facts","title":"IP addressing","rows":[["IANA","Gives IP addresses."],["IPv4","32 bits (4 bytes); four numbers 0-255 separated by dots; no letters allowed."],["IPv6","128 bits (16 bytes); alphanumeric hexadecimal (0-9, A-F); 8 groups of 16 bits."],["MAC address","48 bits; hexadecimal (0-9, A-F); fixed on the NIC."],["Valid IPv4","200.100.200.100 valid; 192.168.257.1 invalid (257 &gt; 255); 1.1.1 invalid (only 3 parts); A.B.C.D invalid (letters)."],["Loopback","127.0.0.0 is the loopback range; 127.0.0.1 = loopback address, the default IP of every computer (localhost)."],["First part of IP","Network address (Network ID); the rest is the Host ID."]]},{"k":"table","title":"IPv4 classes","head":["Class","First number range","Use","Default subnet mask","Network ID / Host ID bits"],"rows":[["A","1 - 126","Common people (large networks)","255.0.0.0","8 / 24"],["B","128 - 191","Common people (medium networks)","255.255.0.0","16 / 16"],["C","192 - 223","Common people (small networks); India example 192.168.254.10","255.255.255.0","24 / 8"],["D","224 - 239","Reserved (research/multicast)","—","—"],["E","240 - 255","Reserved for future use","—","—"]]},{"k":"facts","title":"Addresses, speed and modes","rows":[["OSI developed by","ISO (International Organization for Standardization)"],["TCP/IP model layers","4: Network access (link), Internet, Transport, Application"],["IPv4","32 bits, 4 numbers (octets) of 0–255, dotted decimal, e.g. 192.168.1.1; about 4.3 billion (2^32) addresses"],["IPv6","128 bits, 8 groups of 4 hex digits separated by colons; about 3.4 x 10^38 addresses"],["MAC address","48 bits = 6 bytes = 12 hex digits; burnt into the NIC; physical address"],["IP vs MAC","IP = logical, can change; MAC = physical, fixed"],["Bandwidth","Data-carrying capacity; measured in bps (bits per second): Kbps, Mbps, Gbps"],["Simplex","One direction only – radio/TV broadcast, keyboard to computer"],["Half duplex","Both directions, one at a time – walkie-talkie"],["Full duplex","Both directions at the same time – telephone call"],["Client-server","Central server provides services to clients – a bank's network"],["Peer-to-peer (P2P)","All computers equal; each can share and request"],["Connect two computers","Ethernet cable (a crossover Ethernet cable in older direct PC-to-PC links)"]]},{"k":"p","h":"<b>Hub vs switch vs router, step by step.<\/b> a packet for computer B arrives. A hub copies it to every port, so all computers receive it (wasteful and insecure). A switch looks at the MAC address and sends it only to B's port (efficient inside one LAN). A router looks at the IP address, checks its routing table and sends the packet towards another network by the shortest path (used between networks, e.g. your home network and the internet). So: hub = layer 1, switch = layer 2, router = layer 3."},{"k":"p","h":"<b>Finding the class of an IPv4 address.<\/b> look only at the first number. 132.156.132.156: first number 132 lies in 128-191, so Class B. 10.0.0.1: 10 lies in 1-126, so Class A. 192.168.1.5: 192 lies in 192-223, so Class C."},{"k":"p","h":"<b>Checking if an IPv4 address is valid.<\/b> it must have exactly 4 parts, separated by dots, each a number from 0 to 255, with no letters. 192.168.257.1 fails because 257 &gt; 255."},{"k":"trick","h":"OSI bottom-up: <span class='mn'>P<\/span>lease <span class='mn'>D<\/span>o <span class='mn'>N<\/span>ot <span class='mn'>T<\/span>hrow <span class='mn'>S<\/span>ausage <span class='mn'>P<\/span>izza <span class='mn'>A<\/span>way. Top-down: <span class='mn'>A<\/span>ll <span class='mn'>P<\/span>eople <span class='mn'>S<\/span>eem <span class='mn'>T<\/span>o <span class='mn'>N<\/span>eed <span class='mn'>D<\/span>ata <span class='mn'>P<\/span>rocessing. Size: <span class='mn'>P<\/span>-<span class='mn'>L<\/span>-<span class='mn'>M<\/span>-<span class='mn'>W<\/span> = 'Please Let Me Win'.<ul><li>Network size order \"Please Let Children Make Wonders\" = PAN, LAN, CAN, MAN, WAN.<\/li><li>OSI layers top to bottom: \"All People Seem To Need Data Processing\" = Application, Presentation, Session, Transport, Network, Data link, Physical. Bottom to top: \"Please Do Not Throw Sausage Pizza Away\".<\/li><li>Devices by layer: \"Hub-Repeater-Modem = 1, Switch-Bridge = 2, Router = 3, Gateway = all upper\".<\/li><li>Bridge = Same protocol; Gateway = different protocol (\"Gate = foreign gate\").<\/li><li>TCP = \"Trustworthy\" (connection-oriented); UDP = \"Unreliable but Dashing\" (fast, streaming).<\/li><li>IP bits \"4-6-MAC\": IPv4 = 32, IPv6 = 128, MAC = 48.<\/li><li>Class ranges start points \"1, 128, 192, 224, 240\" = A, B, C, D, E.<\/li><li>Simplex = TV (one way), half duplex = walkie-talkie (say \"over\"), full duplex = phone call.<\/li><li>Topology: Mesh = Most reliable, More wires; Star = Most used, centre hub.<\/li><\/ul>"},{"k":"trap","h":"<b>Hub vs switch<\/b>: hub sends to all, switch sends to the right port. <b>Switch vs router<\/b>: switch works inside one network (MAC), router joins networks (IP). <b>Modem vs router<\/b>: modem converts signals, router directs traffic. <b>Star vs bus<\/b>: star dies when the hub dies; bus dies when the backbone breaks. <b>IPv4 32 bits, IPv6 128 bits, MAC 48 bits<\/b> – don't mix them. Bandwidth is in <b>bps<\/b>, not bytes.<ul><li>The OSI model has 7 layers.<\/li><li>CAN = Campus Area Network.<\/li><li>A modem lets a computer send data over telephone or cable lines.<\/li><li>A switch (not a router or hub) is the usual device to connect computers inside a LAN and works at layer 2.<\/li><li>Hub broadcasts; switch filters. Hub works at layer 1.<\/li><li>A bridge joins networks with the SAME protocol; a gateway joins networks with DIFFERENT protocols.<\/li><li>Ring topology: failure of one node can disturb the whole network; bus topology uses terminators.<\/li><li>IPv4 = 32 bits (not bytes); IPv6 = 128 bits.<\/li><li>127.0.0.1 is the loopback address, not a Class A public address.<\/li><li>Bluetooth is a PAN (WPAN), not a MAN or WAN.<\/li><\/ul>"}],"sum":["A network joins computers to share resources; by size: PAN, LAN, CAN, MAN, WAN (the internet is the largest WAN).","Topologies: bus (one backbone), star (central hub), ring (loop), mesh (all-to-all, n(n-1)/2 links), tree and hybrid.","Hub broadcasts, switch delivers by MAC, router joins networks by IP, modem converts digital and analog, repeater boosts signals.","OSI has 7 layers: Physical, Data link, Network, Transport, Session, Presentation, Application; TCP/IP has 4.","IPv4 is 32-bit, IPv6 is 128-bit, MAC is 48-bit; optical fibre carries light; an Ethernet cable connects two computers.","Media: optical fibre (fastest, light), twisted pair (RJ45, Ethernet), coaxial; wireless: radio (longest), microwave, infrared (shortest).","PAN < LAN < CAN < MAN < WAN; the internet is the biggest WAN; intranet = private, extranet = joined intranets; VPN = secure tunnel.","Topologies: star (most used), bus (terminators), ring, mesh (most reliable), hybrid, tree.","Devices: hub, repeater, modem (layer 1); switch, bridge (layer 2); router (layer 3); gateway (different protocols).","TCP reliable, UDP fast/streaming; IPv4 32 bits, IPv6 128 bits, MAC 48 bits; classes A 1-126, B 128-191, C 192-223."],"part":["Part 3 · Internet, networks & security","इंटरनेट, नेटवर्क एवं सुरक्षा"]},
{"id":"C15","g":"cmp","heat":3,"title":"Protocols, full forms & abbreviations","hi":"प्रोटोकॉल, पूर्ण रूप एवं संक्षिप्ताक्षर","blocks":[{"k":"hot","h":"Full forms are the single most common computer question type in SSC and RRB papers: <b>HTTP, HTML, URL, VIRUS, CAPTCHA, DNS, SMTP, UPI<\/b>. Protocol-to-job and well-known <b>port numbers<\/b> appear in Tier 2."},{"k":"story","h":"<p>A <b>protocol<\/b> is a set of agreed rules for talking. When two people meet they follow a protocol: greet, speak in turn, say goodbye. Computers from different companies can talk only because they follow the same written rules.<\/p><p>Each job has its own protocol. <b>HTTP<\/b> fetches web pages, <b>HTTPS<\/b> does the same with encryption, <b>FTP<\/b> moves files, <b>SMTP<\/b> sends mail while <b>POP3<\/b> and <b>IMAP<\/b> receive it, <b>DNS<\/b> looks up addresses and <b>DHCP<\/b> hands out IP addresses automatically, like a receptionist giving room numbers to guests.<\/p><p>A single computer runs many services at once, so each service listens at a numbered door called a <b>port<\/b>: web at 80, secure web at 443, mail sending at 25. Finally, computing is full of short forms. Learn them in groups – internet, networking, files, banking, security, new technology – and they stop looking like alphabet soup.<\/p>","key":"Protocol = agreed rules; each service has its protocol and port number; learn full forms in groups."},{"k":"table","title":"Main protocols and their ports","head":["Protocol","Full form","Job","Port"],"rows":[["HTTP","Hyper Text Transfer Protocol","Transfers web pages","80"],["HTTPS","Hyper Text Transfer Protocol Secure","Encrypted web pages (padlock), uses SSL/TLS","443"],["FTP","File Transfer Protocol","Uploads/downloads files between computers","20 (data), 21 (control)"],["SMTP","Simple Mail Transfer Protocol","SENDS e-mail","25"],["POP3","Post Office Protocol version 3","Receives e-mail by downloading it to the device","110"],["IMAP","Internet Message Access Protocol","Receives e-mail, keeping it on the server in sync across devices","143"],["DNS","Domain Name System","Converts domain names into IP addresses","53"],["Telnet","–","Remote login, unencrypted","23"],["SSH","Secure Shell","Encrypted remote login","22"],["DHCP","Dynamic Host Configuration Protocol","Automatically assigns IP addresses to devices","–"],["ARP","Address Resolution Protocol","Finds the MAC address for a known IP address","–"],["TCP","Transmission Control Protocol","Reliable, connection-oriented delivery","–"],["UDP","User Datagram Protocol","Fast, connectionless, no delivery guarantee","–"],["IP","Internet Protocol","Addresses and routes packets","–"]]},{"k":"table","title":"TCP vs UDP","head":["Point","TCP","UDP"],"rows":[["Connection","Connection-oriented (handshake first)","Connectionless"],["Reliability","Guaranteed, in-order delivery; resends lost data","No guarantee, no resending"],["Speed","Slower","Faster"],["Used for","Web (HTTP), e-mail, file transfer","Live video, online games, voice calls, DNS queries"]]},{"k":"table","title":"Full forms – internet and networking","head":["Short","Full form"],"rows":[["WWW","World Wide Web"],["URL","Uniform Resource Locator"],["HTML","Hyper Text Markup Language"],["XML","eXtensible Markup Language"],["CSS","Cascading Style Sheets"],["ISP","Internet Service Provider"],["IP","Internet Protocol"],["LAN","Local Area Network"],["MAN","Metropolitan Area Network"],["WAN","Wide Area Network"],["PAN","Personal Area Network"],["WLAN","Wireless Local Area Network"],["NIC","Network Interface Card"],["MAC","Media Access Control"],["OSI","Open Systems Interconnection"],["Modem","Modulator-Demodulator"],["VPN","Virtual Private Network"],["VoIP","Voice over Internet Protocol"],["Wi-Fi","Wireless Fidelity (popular expansion)"],["ARPANET","Advanced Research Projects Agency Network"],["ICANN","Internet Corporation for Assigned Names and Numbers"],["DSL","Digital Subscriber Line"],["ISDN","Integrated Services Digital Network"],["NAT","Network Address Translation"]]},{"k":"table","title":"Full forms – files, interface and devices","head":["Short","Full form"],"rows":[["GUI","Graphical User Interface"],["CLI","Command Line Interface"],["OS","Operating System"],["PDF","Portable Document Format"],["JPEG","Joint Photographic Experts Group"],["GIF","Graphics Interchange Format"],["PNG","Portable Network Graphics"],["MPEG","Moving Picture Experts Group"],["MP3","MPEG Audio Layer 3"],["GPS","Global Positioning System"],["SIM","Subscriber Identity Module"],["GSM","Global System for Mobile Communications"],["CDMA","Code Division Multiple Access"],["LTE","Long Term Evolution"],["QR code","Quick Response code"],["NFC","Near Field Communication"],["RFID","Radio Frequency Identification"],["BCC / CC","Blind Carbon Copy / Carbon Copy"]]},{"k":"table","title":"Full forms – security, banking and new tech","head":["Short","Full form"],"rows":[["VIRUS","Vital Information Resources Under Siege"],["CAPTCHA","Completely Automated Public Turing test to tell Computers and Humans Apart"],["OTP","One Time Password"],["PIN","Personal Identification Number"],["SSL","Secure Sockets Layer"],["TLS","Transport Layer Security"],["DoS / DDoS","Denial of Service / Distributed Denial of Service"],["2FA / MFA","Two-Factor / Multi-Factor Authentication"],["CERT-In","Indian Computer Emergency Response Team"],["UPI","Unified Payments Interface"],["NPCI","National Payments Corporation of India"],["BHIM","Bharat Interface for Money"],["NEFT","National Electronic Funds Transfer"],["RTGS","Real Time Gross Settlement"],["IMPS","Immediate Payment Service"],["KYC","Know Your Customer"],["IFSC","Indian Financial System Code"],["ATM","Automated Teller Machine"],["POS","Point of Sale"],["CVV","Card Verification Value"],["IoT","Internet of Things"],["AI / ML","Artificial Intelligence / Machine Learning"],["AR / VR","Augmented Reality / Virtual Reality"],["SaaS","Software as a Service"],["PaaS","Platform as a Service"],["IaaS","Infrastructure as a Service"],["UIDAI","Unique Identification Authority of India"],["C-DAC","Centre for Development of Advanced Computing"]]},{"k":"table","title":"More full forms, A to Z","head":["Short form","Full form"],"rows":[["ACID","Atomicity, Consistency, Isolation, Durability"],["ADC / DAC","Analog-to-Digital Converter / Digital-to-Analog Converter"],["ALGOL","Algorithmic Language"],["ALU","Arithmetic Logic Unit"],["API","Application Programming Interface"],["ASCII","American Standard Code for Information Interchange"],["ATA / SATA / PATA","Advanced Technology Attachment / Serial ATA / Parallel ATA"],["BASIC","Beginner's All-purpose Symbolic Instruction Code"],["BCD","Binary Coded Decimal"],["BIOS","Basic Input/Output System"],["Bit","Binary Digit"],["Blog","Web Log"],["Bps","Bits Per Second"],["CAD / CAM","Computer Aided Design / Computer Aided Manufacturing"],["CD / CD-R / CD-ROM / CD-RW","Compact Disc / CD-Recordable / CD Read Only Memory / CD Rewritable"],["CG","Computer Graphics"],["CGA / EGA / VGA","Colour Graphics Array (Adapter) / Enhanced Graphics Array / Video Graphics Array"],["CGI","Common Gateway Interface"],["CLI / GUI / UI","Command Line Interface / Graphical User Interface / User Interface"],["CNC","Computer Numerical Control"],["COBOL","Common Business Oriented Language"],["CPU / GPU","Central Processing Unit / Graphics Processing Unit"],["CRT","Cathode Ray Tube"],["DB / DBA / DBMS / RDBMS","Database / Database Administrator / Database Management System / Relational DBMS"],["DDR / SDRAM","Double Data Rate / Synchronous Dynamic RAM"],["DES","Data Encryption Standard"],["DFD","Data Flow Diagram"],["DHTML / HTML / XML","Dynamic HTML / Hypertext Markup Language / Extensible Markup Language"],["DLL","Dynamic Link Library"],["DLP","Digital Light Processing"],["DMA","Direct Memory Access"],["DOS / MS-DOS","Disk Operating System / Microsoft DOS"],["DPI","Dots Per Inch"],["DVD / DVD-R / DVD-ROM / DVD-RW","Digital Versatile (Video) Disc / Recordable / Read Only Memory / Rewritable"],["DVI","Digital Visual Interface"],["DVR","Digital Video Recorder"],["EBCDIC","Extended Binary Coded Decimal Interchange Code"],["EDO","Extended Data Out"],["EEPROM / EPROM","Electrically Erasable Programmable ROM / Erasable Programmable ROM"],["E-mail","Electronic Mail"],["ENIAC","Electronic Numerical Integrator and Computer"],["FAQ","Frequently Asked Questions"],["FDD / HDD","Floppy Disk Drive / Hard Disk Drive"],["FIFO","First In First Out"],["FS","File System"],["GB / KB / MB","Gigabyte / Kilobyte / Megabyte"],["GIGO","Garbage In Garbage Out"],["IBM","International Business Machines"],["IC","Integrated Circuit"],["IE","Internet Explorer"],["IM","Instant Messaging"],["I/O","Input/Output"],["IPC","Inter-Process Communication"],["IRQ","Interrupt Request"],["ISO","International Organisation for Standardisation"],["ISOC","Internet Society"],["IT","Information Technology"],["ITU","International Telecommunication Union"],["JSP","Java Server Pages"],["KHz","Kilohertz"],["LAN / MAN / PAN / WAN / VLAN","Local / Metropolitan / Personal / Wide / Virtual Local Area Network"],["LSB / MSB","Least / Most Significant Bit"],["MANET","Mobile Ad-hoc Network"],["MBR","Master Boot Record (also Memory Buffer Register)"],["MICR / OCR / OMR","Magnetic Ink Character Recognition / Optical Character Reader / Optical Mark Reader"],["MIPS","Millions of Instructions Per Second"],["NT","New Technology (Windows NT)"],["OOP","Object-Oriented Programming"],["OS / OSS","Operating System / Open-Source Software"],["P2P","Peer-to-Peer"],["PC","Personal Computer (also Program Counter)"],["PCI","Peripheral Component Interconnect"],["PCL","Printer Command Language"],["PINE","Program for Internet News and Email"],["PnP","Plug and Play"],["RAID","Redundant Array of Independent (Inexpensive) Disks"],["RAM / ROM","Random Access Memory / Read Only Memory"],["RTOS","Real Time Operating System"],["SaaS / IaaS / PaaS","Software / Infrastructure / Platform as a Service (IaaS and PaaS)"],["SAN","Storage Area Network"],["SCSI","Small Computer System Interface"],["SMPS","Switched Mode Power Supply"],["SQL","Structured Query Language"],["UPS","Uninterruptible Power Supply"],["URI / URL","Uniform Resource Identifier / Uniform Resource Locator"],["USB","Universal Serial Bus"],["VDU","Visual Display Unit"],["VM","Virtual Memory"],["WiMAX","Worldwide Interoperability for Microwave Access"],["WWW / WWWW / W3C","World Wide Web / World Wide Web Worm / World Wide Web Consortium"]]},{"k":"trick","h":"Mail: <span class='mn'>S<\/span>MTP = <span class='mn'>S<\/span>end; <span class='mn'>P<\/span>OP = <span class='mn'>P<\/span>ull down (download); <span class='mn'>I<\/span>MAP = keep <span class='mn'>I<\/span>n place on server. Ports: FTP <b>21<\/b> &lt; SSH <b>22<\/b> &lt; Telnet <b>23<\/b> &lt; SMTP <b>25<\/b> – the '20s ladder'; DNS <b>53<\/b>, HTTP <b>80<\/b>, POP3 <b>110<\/b>, IMAP <b>143<\/b>, HTTPS <b>443<\/b>."},{"k":"trap","h":"<b>HTTP<\/b> is Hyper Text <i>Transfer<\/i> Protocol; <b>HTML<\/b> is Hyper Text <i>Markup<\/i> Language – exams swap Transfer/Transport/Markup. <b>URL<\/b> is <i>Uniform<\/i> (not Universal) Resource Locator. <b>SMTP sends, POP3/IMAP receive<\/b>. <b>TCP<\/b> is connection-oriented, <b>UDP<\/b> connectionless. <b>DNS<\/b> = name to IP; <b>ARP<\/b> = IP to MAC; <b>DHCP<\/b> = gives out IPs."}],"sum":["A protocol is a set of rules for communication; HTTP (port 80) carries web pages, HTTPS (port 443) does it securely.","FTP (20/21) moves files; SMTP (25) sends mail; POP3 (110) and IMAP (143) receive mail; DNS (53) turns names into IP addresses.","TCP is reliable and connection-oriented; UDP is fast and connectionless; DHCP assigns IP addresses, ARP finds MAC from IP.","HTTP = Hyper Text Transfer Protocol, HTML = Hyper Text Markup Language, URL = Uniform Resource Locator.","VIRUS = Vital Information Resources Under Siege; CAPTCHA tells computers and humans apart; UPI = Unified Payments Interface.","Learn full forms in groups: hardware, memory, files, internet, networks."],"part":["Part 3 · Internet, networks & security","इंटरनेट, नेटवर्क एवं सुरक्षा"]},
{"id":"C16","g":"cmp","heat":3,"title":"Cyber security","hi":"साइबर सुरक्षा","blocks":[{"k":"hot","h":"The SSC syllabus names <b>network and information security threats and preventive measures<\/b>. Expect the difference between <b>virus, worm and Trojan<\/b>, attacks like <b>phishing<\/b> and <b>DDoS<\/b>, and what a <b>firewall<\/b> or <b>encryption<\/b> does.<br><br>Security questions now come in every SSC Tier-II computer module: \"malware disguised as legitimate software\", \"phishing\", \"worm vs virus\", \"ransomware\", \"firewall type\", \"what is a cookie\", \"first virus\". SSC CGL Tier-II 2022 asked Trojan, CHSL Tier-II 2023 asked packet-filtering firewall, and CHSL 2021 asked phishing and virus. Expect 2 to 4 marks from here."},{"k":"story","h":"<p>Think of your computer as a house. <b>Malware<\/b> means any harmful software that gets inside. A <b>virus<\/b> hides inside a genuine file and spreads only when that file is opened, like a germ on a shared towel. A <b>worm<\/b> crawls from house to house by itself through the network. A <b>Trojan horse<\/b> arrives as a gift – a free game – with thieves hidden inside. <b>Ransomware<\/b> locks your cupboards and asks for money for the key. <b>Spyware<\/b> and <b>keyloggers<\/b> are hidden cameras recording what you do and type.<\/p><p>Criminals also simply trick people. <b>Phishing<\/b> is a fake e-mail from 'your bank' asking for your password; the same trick by phone call is <b>vishing<\/b> and by SMS is <b>smishing<\/b>.<\/p><p>Protection works in layers like locks, guards and alarms: a <b>firewall<\/b> is the gatekeeper checking traffic, <b>antivirus<\/b> is the guard who catches known intruders, <b>encryption<\/b> turns data into secret code, and <b>two-factor authentication<\/b> asks for a second key such as an OTP. Regular updates and backups complete the safety plan.<\/p>","key":"Virus needs a host, worm spreads alone, Trojan disguises itself; phishing tricks people; firewall, antivirus, encryption, 2FA, updates and backups protect."},{"k":"table","title":"Types of malware","head":["Malware","How it behaves","One-line difference"],"rows":[["Virus","Attaches to a program or file and runs when that file is opened","Needs a host file and human action to spread"],["Worm","Copies itself across networks automatically","Self-replicating, needs NO host file"],["Trojan horse","Pretends to be useful software but opens a back door","Disguised; does NOT replicate itself"],["Ransomware","Encrypts or locks your files and demands payment (WannaCry, 2017)","Holds data hostage"],["Spyware","Secretly collects your information and activity","Spies silently"],["Adware","Floods the screen with unwanted advertisements","Shows ads"],["Keylogger","Records every key you press to steal passwords","Captures keystrokes"],["Rootkit","Hides deep in the system and gives the attacker admin-level control","Hard to detect"],["Bot / Botnet","Infected 'zombie' computer controlled remotely; many together form a botnet","Used for spam and DDoS attacks"]]},{"k":"facts","title":"Malware","rows":[["Malware","Malicious software: software designed to harm a computer system or steal data."],["Computer virus","A computer program; VIRUS = Vital Information Resource Under Seize; self-replicating; cannot spread without human action (e.g. opening a file)."],["Worm","Self-replicating; especially affects networks; spreads WITHOUT human action; eats memory and network bandwidth."],["Trojan horse","Misrepresents itself as useful (disguised as legitimate software); does NOT replicate."],["Logic bomb","Code inserted intentionally into a system that sets off when certain conditions are met."],["Blended threat","Works like a virus but is not single; may be a website or a server computer."],["Spyware","Spies on the user to steal confidential data (bank details, passwords); keylogger is an example. Spyware is a kind of malware."],["Ransomware","Encrypts files and demands money (ransom) to unlock them; example WannaCry, CryptoLocker."],["Adware","Shows unwanted advertisements."],["Rootkit","Gives hidden remote control of a computer."],["Botnet","\"Robot network\": a group of internet devices running bots; used for DDoS attacks, data theft and spam."],["First worm","CREEPER, 1971, by Bob Thomas."],["First virus","BRAIN, 1986, by Basit Farooq Alvi and Amjad Farooq Alvi (Pakistan)."],["Famous viruses","Nimda, ILOVEYOU, SQL Slammer, Stuxnet, CryptoLocker, Conficker, Tinba, Welchia, Shlayer, Mydoom, Storm Worm, Anna Kournikova, Slammer, Melissa (infects MS-Word documents)."],["Symptoms of a virus","Slower performance, frequent crashes, missing files, storage space shortage, strange pop-ups."]]},{"k":"table","title":"Types of virus","head":["Virus type","What it does"],"rows":[["Boot sector / system / MBR virus","Corrupts the loader program in the Master Boot Record"],["Direct action virus","Attacks executable (.exe) files"],["Resident virus","Stays in RAM permanently, activates at start-up and corrupts running files"],["Multipartite virus","Infects in many ways: boot sector + direct action"],["Polymorphic virus","Changes its own code to avoid detection"],["Overwrite virus","Overwrites the content of files"],["Space filler virus","Fills memory with useless data"],["File infector virus","Damages particular files"],["Macro virus","Infects macros in documents such as Word and Excel files"],["Rootkit virus","Gives remote login to damage the system"]]},{"k":"table","title":"Common attacks","head":["Attack","What happens"],"rows":[["Phishing","Fake e-mails or websites that look genuine to steal passwords or card details"],["Vishing","Phishing by voice / phone call (Voice + phishing)"],["Smishing","Phishing by SMS text message"],["Spoofing","Faking the identity of a trusted sender – e-mail address, caller ID, IP address or website"],["Pharming","Redirecting users from a real website to a fake one, e.g. by poisoning DNS – even a correctly typed address leads to the fake site"],["DoS","Denial of Service – flooding a server with traffic so real users cannot reach it"],["DDoS","Distributed DoS – the flood comes from many computers (a botnet) at once"],["Man-in-the-middle","Attacker secretly sits between two parties and reads or changes their messages"],["SQL injection","Malicious database commands typed into a website's input box"],["Brute force","Trying every possible password until one works"],["Social engineering","Manipulating people (not machines) into revealing secrets"],["Identity theft","Using someone's personal details to commit fraud"],["Spam","Unwanted bulk messages, often carrying phishing links"],["Phishing (phishing trap)","Getting PIN, password, OTP, account details with false data: fake emails, fake websites"],["Whaling","Highly targeted phishing on a high-profile or rich person"],["Clickjacking","Hiding a harmful link/button near the real one so you click it"],["Sniffing (packet sniffer)","Monitoring and capturing data packets on a network"],["Eavesdropping","Secretly listening to private conversations without consent"],["Spamming","Sending unwanted (unsolicited) emails"],["Phreaking","Fraudulent use of telephone signalling to make free calls"],["Cracking","Breaking into a computer to steal, corrupt or view data illegally"],["Brute-force attack","Guessing passwords by trying again and again; prevented by limiting login attempts"],["Skimming","Stealing credit/debit card data at ATMs or card machines"],["Piracy","Copying copyrighted material illegally"]]},{"k":"table","title":"Preventive measures","head":["Measure","What it does"],"rows":[["Antivirus","Detects and removes known malware (e.g. Quick Heal, Norton, Microsoft Defender)"],["Firewall","Hardware or software that filters incoming and outgoing network traffic by rules – a security guard at the gate"],["Encryption","Converts plaintext into unreadable ciphertext; only the right key decrypts it"],["Strong password","Long; mix of capital and small letters, numbers and symbols; not your name or birth date"],["2FA / MFA","Second proof besides the password, such as an OTP, fingerprint or authenticator app"],["Updates and patches","Fix security holes found in software"],["Backups","Copies of data to recover after ransomware or crash"],["CAPTCHA","Test that blocks automated bots from filling forms"],["HTTPS padlock","Shows the connection to the site is encrypted"],["Digital signature","Proves who sent a document and that it was not altered"],["Digital certificate","Electronic ID of a website or person issued by a Certifying Authority"]]},{"k":"facts","title":"Protection","rows":[["Antivirus","Norton, Bitdefender, Avira, F-Secure, Avast, Kaspersky, Trend Micro, Webroot Secure, ESET NOD32, G-Data, Comodo, Quick Heal (Indian), McAfee. Tally is accounting software, not antivirus."],["Anti-phishing","Antivirus feature that blocks malicious websites."],["Firewall","Security system that checks every data packet entering and leaving a network and blocks unauthorised access."],["Packet-filtering firewall","Works at the Network layer and examines incoming and outgoing packets."],["Application firewall","Also called application gateway (application-level gateway)."],["Authentication","Verifying a login name and password (or fingerprint)."],["Biometrics","Identify a person by physical and behavioural traits (fingerprint, face, iris, voice)."],["Strong password","Mix of capital and small letters, numbers and symbols (e.g. Aprfd@2021); avoid \"Password\" or \"123456789\"."],["CAPTCHA","Test to check that the user is a human, not a bot."],["Encryption","Converting plain text into cipher text (secret code). Decryption converts cipher text back to plain text."],["Digital certificate","Many websites use a certificate to prove identity and security (HTTPS padlock)."],["VPN","Virtual Private Network: secures data and limits tracking of browsing habits."],["CIA triad","Confidentiality, Integrity, Availability."],["Cookie","Small file created by a web server and stored by the browser; holds information about the user's web activity. Third-party cookies track you and expose privacy."],["Backup","If malware cannot be removed, back up the data and format the system."],["IT Act 2000","India's cyber law; Section 66F = punishment for cyber terrorism; Section 66A was struck down by the Supreme Court in 2015."],["CERT-In","Computer Emergency Response Team - India: national agency for cyber incidents."]]},{"k":"facts","title":"Terms and Indian law","rows":[["White hat hacker","Ethical hacker who tests systems with permission"],["Black hat hacker","Criminal hacker who breaks in for harm or profit"],["Grey hat hacker","Breaks in without permission but without bad intent"],["Symmetric encryption","One same key to lock and unlock"],["Asymmetric encryption","Public key to encrypt, private key to decrypt"],["Digital signature","Signed with the sender's private key, verified with the public key"],["First PC virus (MS-DOS)","Brain, 1986, written in Pakistan"],["IT Act","Information Technology Act, 2000 – India's cyber law; gave legal status to e-records and digital signatures"],["IT (Amendment) Act","2008 – added cyber terrorism (Section 66F) and more cyber offences"],["CERT-In","Indian Computer Emergency Response Team – national agency for cyber incidents, under MeitY, set up 2004"],["Cyber-crime helpline","1930"],["Cyber-crime reporting portal","cybercrime.gov.in"]]},{"k":"p","h":"<b>Virus vs worm vs Trojan.<\/b> a virus attaches to a file and spreads only when a person runs or shares that file. A worm is a standalone program that copies itself across networks by itself, so it spreads very fast and eats bandwidth. A Trojan does not copy itself at all; it pretends to be a useful program (a free game, a crack) and, once installed, opens a back door. So the key tests are: needs human action? = virus; spreads alone? = worm; disguised and does not replicate? = Trojan."},{"k":"p","h":"<b>How phishing works and how to stay safe.<\/b> you get an email or SMS that looks like it is from your bank, with a link to a fake website. When you type your password or OTP there, the attacker gets it. Stay safe by checking the website address (HTTPS and correct spelling), never sharing OTPs, and never clicking unknown links."},{"k":"trick","h":"Malware by legs: <span class='mn'>V<\/span>irus = <span class='mn'>V<\/span>ehicle needed (host file); <span class='mn'>W<\/span>orm = <span class='mn'>W<\/span>alks alone; <span class='mn'>T<\/span>rojan = <span class='mn'>T<\/span>ricks you with a gift. Phishing family by channel: <span class='mn'>E<\/span>-mail = Phishing, <span class='mn'>V<\/span>oice = Vishing, <span class='mn'>S<\/span>MS = Smishing.<ul><li>\"Virus Visits with you (needs human); Worm Walks alone; Trojan Tricks (disguise, no copying).\"<\/li><li>Phishing family by medium: Ph = email/website, V = Voice, S = SMS, W = Whale (big person).<\/li><li>First worm = CREEPER 1971 (Bob Thomas) \"C comes before B\"; first virus = BRAIN 1986 (Alvi brothers).<\/li><li>VIRUS = \"Vital Information Resource Under Seize\".<\/li><li>Encryption = Plain → Cipher (lock); Decryption = Cipher → Plain (unlock).<\/li><li>CIA = Confidentiality, Integrity, Availability (not Central Intelligence!).<\/li><li>Ransomware = \"Ransom for files\" (WannaCry, CryptoLocker).<\/li><\/ul>"},{"k":"trap","h":"<b>Virus vs worm<\/b>: only the worm spreads without a host. <b>Trojan<\/b> does not replicate. <b>Phishing vs pharming<\/b>: phishing needs you to click a fake link; pharming redirects you even when you type the right address. <b>DoS vs DDoS<\/b>: DDoS uses many machines. <b>Firewall vs antivirus<\/b>: firewall filters traffic, antivirus removes malware. <b>Cookies vs cache<\/b>: cookies store your details, cache stores page files. <b>Encryption ≠ compression<\/b>.<ul><li>A Trojan does NOT replicate; viruses and worms do.<\/li><li>A worm spreads WITHOUT human action; a virus needs human action.<\/li><li>Spyware is a type of malware, not an antivirus.<\/li><li>Biometrics identify physical and behavioural attributes, not login and password.<\/li><li>A virus that stays in RAM is a RESIDENT virus.<\/li><li>Malware = Malicious Software.<\/li><li>Cookies are created by the web SERVER and stored by the browser; they are not viruses.<\/li><li>Pinging is a network test, not a cyber attack.<\/li><li>Theft of a physical hard disk from a shop is ordinary theft, not cyber crime.<\/li><li>Tally is accounting software, not an antivirus.<\/li><\/ul>"}],"sum":["Malware: virus needs a host file, worm self-replicates over networks, Trojan disguises itself, ransomware demands money, spyware and keyloggers steal data.","Phishing (e-mail), vishing (voice), smishing (SMS) trick people; pharming redirects to fake sites; DDoS floods a server from many computers.","A firewall filters network traffic; antivirus removes malware; encryption turns plaintext into ciphertext.","Strong passwords, 2FA/MFA, updates, backups and HTTPS help prevent attacks; white hat hackers are ethical.","India: IT Act 2000 (amended 2008), CERT-In for cyber incidents, helpline 1930 and cybercrime.gov.in.","Malware = virus (needs human), worm (spreads alone), Trojan (disguised, no copying), logic bomb, spyware, ransomware, botnet.","First worm CREEPER (1971, Bob Thomas); first virus BRAIN (1986, Alvi brothers).","Virus types: boot sector, direct action, resident, multipartite, polymorphic, overwrite, macro, file infector.","Attacks: phishing, vishing, smishing, whaling, pharming, spoofing, sniffing, DoS/DDoS, brute force, eavesdropping.","Protection: antivirus, firewall (packet filtering at network layer), authentication, strong passwords, CAPTCHA, encryption, VPN."],"part":["Part 3 · Internet, networks & security","इंटरनेट, नेटवर्क एवं सुरक्षा"]},
{"id":"C22","g":"cmp","heat":2,"title":"Cyber law & Digital India","hi":"साइबर कानून एवं डिजिटल इंडिया","blocks":[{"k":"hot","h":"Asked more and more in CGL, CHSL and NTPC: <b>which section of the IT Act<\/b> deals with what (66 hacking, 66C identity theft, 66D cheating by personation, 66E privacy, 66F cyber terrorism, 67 obscene material), <b>when the Act came<\/b>, <b>CERT-In<\/b>, the helpline <b>1930<\/b>, and the dates of <b>Digital India, Aadhaar, UPI and DigiLocker<\/b>."},{"k":"story","h":"<p>Laws for the street were written long before computers. When people began signing contracts by e-mail and stealing money with a click, India needed new rules. So Parliament passed the <b>Information Technology Act, 2000<\/b>. It did two big things: it made <b>electronic records and digital signatures legal<\/b>, like paper and ink, and it made <b>cyber crimes punishable<\/b>.<\/p><p>In 2008 the Act was <b>amended<\/b> to catch newer crimes: identity theft, cheating by pretending to be someone online, taking private pictures, and <b>cyber terrorism<\/b> (Section 66F, punishable with life imprisonment). One section, <b>66A<\/b>, which punished \"offensive\" messages, was struck down by the Supreme Court in 2015 for hurting free speech.<\/p><p>Laws need guards. <b>CERT-In<\/b> is the national fire brigade for cyber attacks. A citizen who is cheated online calls <b>1930<\/b> or reports on <b>cybercrime.gov.in<\/b>. Meanwhile <b>Digital India<\/b> (2015) brought services online: <b>Aadhaar<\/b> for identity, <b>DigiLocker<\/b> for documents, <b>UPI<\/b> for payments and <b>UMANG<\/b> for government services in one app.<\/p>","key":"IT Act 2000 (in force 17 Oct 2000, amended 2008): 66 hacking, 66C identity theft, 66D personation, 66E privacy, 66F terrorism, 67 obscenity; CERT-In guards, 1930 helps; Digital India began 1 July 2015."},{"k":"facts","title":"The Information Technology Act, 2000","rows":[["Passed","By Parliament in May 2000; President's assent on 9 June 2000"],["In force","17 October 2000"],["Based on","The UNCITRAL Model Law on Electronic Commerce (1996) of the United Nations"],["What it does","Gives legal recognition to electronic records, e-contracts and digital signatures; defines cyber crimes and their punishment"],["Size (original)","94 sections in 13 chapters, with 4 schedules"],["Amendment","IT (Amendment) Act, 2008, in force from 27 October 2009: added Sections 66A–66F, 43A, 67A, 67B and more"],["Section 66A struck down","By the Supreme Court in Shreya Singhal v. Union of India, 24 March 2015"],["Digital signature","Issued by a Certifying Authority licensed by the Controller of Certifying Authorities (CCA)"],["Ministry","Ministry of Electronics and Information Technology (MeitY)"]]},{"k":"table","title":"Sections you must know","head":["Section","Deals with","Punishment (in short)"],"rows":[["43","Damage to a computer, unauthorised access, downloading or spreading a virus","Compensation to the victim"],["43A","A company failing to protect sensitive personal data","Compensation"],["65","Tampering with computer source documents","Up to 3 years and/or fine up to ₹2 lakh"],["66","Computer-related offences (hacking with dishonest intent)","Up to 3 years and/or fine up to ₹5 lakh"],["66A","Offensive messages through a computer","Struck down in 2015"],["66B","Receiving a stolen computer or device dishonestly","Up to 3 years and/or fine"],["66C","Identity theft: misusing someone's password, digital signature or other unique ID","Up to 3 years and fine up to ₹1 lakh"],["66D","Cheating by personation using a computer (e.g. fake profiles, phishing calls)","Up to 3 years and fine up to ₹1 lakh"],["66E","Violation of privacy: capturing or sharing private images without consent","Up to 3 years and/or fine up to ₹2 lakh"],["66F","Cyber terrorism","Up to life imprisonment"],["67","Publishing or sending obscene material electronically","Up to 3 years (first offence)"],["67A / 67B","Sexually explicit material / child sexual abuse material","Up to 5 years (first offence)"],["69 / 69A","Government power to intercept or decrypt / to block websites and apps","—"],["70 / 70A / 70B","Protected systems / NCIIPC for critical information infrastructure / CERT-In","—"],["72","Breach of confidentiality and privacy by a person given access","Up to 2 years and/or fine up to ₹1 lakh"],["79","Safe harbour: an intermediary (platform) is not liable if it follows due diligence","—"]]},{"k":"table","title":"Cyber security bodies of India","head":["Body","Full form","Job"],"rows":[["CERT-In","Indian Computer Emergency Response Team","National agency for cyber incidents (Section 70B); under MeitY; set up 2004"],["NCIIPC","National Critical Information Infrastructure Protection Centre","Protects critical systems such as power, banking and telecom; under NTRO (2014)"],["I4C","Indian Cyber Crime Coordination Centre","Coordinates action against cyber crime; under the Ministry of Home Affairs (2020)"],["cybercrime.gov.in","National Cyber Crime Reporting Portal","Report any cyber crime online"],["1930","Cyber fraud helpline","Call at once after losing money online, so the money can be stopped"],["CCA","Controller of Certifying Authorities","Licenses the bodies that issue digital signature certificates"],["Data Protection Board","Under the DPDP Act, 2023","Hears complaints about misuse of personal data"]]},{"k":"facts","title":"Other laws and policies","rows":[["DPDP Act, 2023","Digital Personal Data Protection Act; President's assent on 11 August 2023; protects personal data and sets up the Data Protection Board of India"],["National Cyber Security Policy","2013"],["Cyber Appellate Tribunal","Set up under the IT Act; merged into TDSAT in 2017"],["Bharatiya Nyaya Sanhita, 2023","The new criminal code (in force 1 July 2024) also covers cheating, forgery and organised cyber crime"]]},{"k":"table","title":"Digital India at a glance","head":["Initiative","Year","What it is"],"rows":[["NIC","1976","National Informatics Centre: builds government IT services and websites"],["Aadhaar","2009 (UIDAI); first number 29 Sept 2010","12-digit unique identity number with biometrics; first issued at Tembhli, Maharashtra"],["MeghRaj","2014","GI Cloud: the government's cloud computing platform"],["Digital India","1 July 2015","Programme to make India a digitally empowered society and knowledge economy"],["DigiLocker","2015","Cloud locker for digital copies of documents such as marksheets and driving licence"],["BharatNet","2011 (as NOFN), renamed 2015","Optical fibre broadband to every gram panchayat"],["UPI","11 April 2016","Unified Payments Interface by NPCI: instant bank-to-bank payments from a phone"],["BHIM","30 December 2016","Bharat Interface for Money: the government's UPI app"],["UMANG","2017","Unified Mobile Application for New-age Governance: many government services in one app"],["PM-WANI","2020","Public Wi-Fi Access Network Interface: public Wi-Fi through local shops"],["Aarogya Setu","2 April 2020","Covid-19 contact-tracing app"],["e-RUPI","2 August 2021","Voucher-based digital payment for a set purpose (by NPCI)"],["ONDC","2022","Open Network for Digital Commerce: an open network for online shopping"],["e₹ (digital rupee)","RBI pilot: wholesale 1 Nov 2022, retail 1 Dec 2022","Central Bank Digital Currency of India"],["5G","1 October 2022","5G mobile services launched in India"]]},{"k":"tlfig","title":"India's digital milestones","rows":[[1976,"NIC — National Informatics Centre",""],[2009,"Aadhaar — 12-digit unique identity number with biometrics",""],[2011,"BharatNet — Optical fibre broadband to every gram panchayat",""],[2014,"MeghRaj — GI Cloud",""],[2015,"Digital India — Programme to make India a digitally empowered society and knowledge economy",""],[2015,"DigiLocker — Cloud locker for digital copies of documents such as marksheets and driving licence",""],[2016,"UPI — Unified Payments Interface by NPCI",""],[2016,"BHIM — Bharat Interface for Money",""],[2017,"UMANG — Unified Mobile Application for New-age Governance",""],[2020,"PM-WANI — Public Wi-Fi Access Network Interface",""],[2020,"Aarogya Setu — Covid-19 contact-tracing app",""],[2021,"e-RUPI — Voucher-based digital payment for a set purpose (by NPCI)",""],[2022,"ONDC — Open Network for Digital Commerce",""],[2022,"e₹ (digital rupee) — Central Bank Digital Currency of India",""],[2022,"5G — 5G mobile services launched in India",""]],"cap":"From the National Informatics Centre (1976) to UPI (2016) and 5G (2022)."},{"k":"trick","h":"The 66 family — <span class='mn'>B C D E F<\/span>: <b>B<\/b> = Bought stolen device, <b>C<\/b> = Copied your identity, <b>D<\/b> = Disguised as someone (personation), <b>E<\/b> = Eye on your privacy, <b>F<\/b> = Fear (terrorism). Plain 66 = hacking. IT Act dates — <span class='mn'>9-6 then 17-10<\/span>: assent 9 June, in force 17 October 2000."},{"k":"trap","h":"<b>66F<\/b> (cyber terrorism) carries life imprisonment; <b>66<\/b> is plain hacking. <b>66A<\/b> no longer exists — the Supreme Court struck it down in 2015. <b>CERT-In<\/b> is under MeitY, but <b>I4C<\/b> is under the Home Ministry. The IT Act came into force on <b>17 October 2000<\/b>, not 2008 (2008 is the amendment). The cyber fraud helpline is <b>1930<\/b>, not 100 or 112."}],"sum":["The IT Act, 2000 (assent 9 June, in force 17 October 2000) made e-records and digital signatures legal and defined cyber crimes; it was amended in 2008.","Sections: 43 damage, 65 source code tampering, 66 hacking, 66C identity theft, 66D cheating by personation, 66E privacy, 66F cyber terrorism (life), 67 obscene material; 66A was struck down in 2015.","CERT-In (MeitY, 2004) handles cyber incidents; I4C (Home Ministry) coordinates action; report at cybercrime.gov.in or call 1930.","The DPDP Act, 2023 protects personal data and sets up the Data Protection Board.","Digital India began on 1 July 2015; Aadhaar (UIDAI), DigiLocker (2015), UPI (2016), BHIM (2016), UMANG (2017), 5G (2022).","Cookies store web activity; IT Act 2000 Section 66F = cyber terrorism."],"part":["Part 3 · Internet, networks & security","इंटरनेट, नेटवर्क एवं सुरक्षा"]},
{"id":"C17","g":"cmp","heat":2,"title":"New technologies & computer terms","hi":"नई तकनीकें एवं कंप्यूटर शब्दावली","blocks":[{"k":"hot","h":"Papers now ask one-liners on <b>AI, cloud computing (SaaS/PaaS/IaaS), IoT, blockchain<\/b>, plus 'who founded / who created' questions such as <b>father of AI<\/b> (John McCarthy coined the term) and India's <b>Digital India, DigiLocker, PARAM<\/b>."},{"k":"story","h":"<p>New technology words sound frightening but each has a simple idea. <b>Artificial Intelligence<\/b> means making machines do things that need human-like thinking, such as recognising faces or answering questions. <b>Machine learning<\/b> is AI that learns from examples instead of fixed rules – the way a child learns what a dog looks like after seeing many dogs. <b>Generative AI<\/b> creates new text, pictures or music; chatbots are one example.<\/p><p><b>Cloud computing<\/b> is renting computing power over the internet like taking a taxi instead of buying a car: you can rent ready software (SaaS), a platform to build on (PaaS) or bare infrastructure (IaaS). The <b>Internet of Things<\/b> connects everyday objects – fans, meters, watches – to the internet.<\/p><p>A <b>blockchain<\/b> is a record book copied on thousands of computers so no single person can secretly change it; Bitcoin was built on it. <b>AR<\/b> adds digital things to the real view, while <b>VR<\/b> replaces the real view completely with a digital world.<\/p>","key":"AI thinks, ML learns from data, cloud = renting computing, IoT = connected objects, blockchain = shared unchangeable ledger, AR adds and VR replaces."},{"k":"table","title":"New technologies in one line","head":["Technology","Meaning","Example"],"rows":[["Artificial Intelligence (AI)","Machines performing tasks that need human-like intelligence","Face unlock, voice assistants"],["Machine Learning (ML)","Subset of AI: systems learn patterns from data","Spam filter, recommendations"],["Deep Learning","Subset of ML using many-layered neural networks","Image and speech recognition"],["Generative AI","AI that creates new text, images, audio or code","Chatbots such as ChatGPT (OpenAI, November 2022)"],["Internet of Things (IoT)","Everyday devices with sensors connected to the internet","Smart meter, smartwatch"],["Big Data","Data too large or fast for ordinary tools; described by Volume, Velocity, Variety","Social-media analytics"],["Blockchain","Distributed, tamper-resistant ledger shared across many computers","Cryptocurrency records"],["Cryptocurrency","Digital currency secured by cryptography, usually on a blockchain","Bitcoin (2009, by 'Satoshi Nakamoto')"],["Augmented Reality (AR)","Adds digital objects to the real-world view","Pokemon Go, Snapchat filters"],["Virtual Reality (VR)","Fully computer-made world seen through a headset","VR gaming, flight simulators"],["5G","Fifth-generation mobile network: high speed, very low delay; launched in India in October 2022","Many IoT devices at once"],["Quantum computing","Uses qubits, which can be 0 and 1 at once (superposition)","Research machines"],["Edge computing","Processing data near where it is produced instead of a far data centre","Self-driving car sensors"]]},{"k":"table","title":"Cloud computing","head":["Model","You get","Example"],"rows":[["SaaS – Software as a Service","Ready-to-use software through a browser","Gmail, Google Docs, Microsoft 365"],["PaaS – Platform as a Service","Platform and tools to build and run your own apps","Google App Engine"],["IaaS – Infrastructure as a Service","Virtual servers, storage, networking","Amazon EC2 (AWS)"],["Public cloud","Shared by many customers, run by a provider","AWS, Microsoft Azure, Google Cloud"],["Private cloud","Used by one organisation only","Bank's own data centre cloud"],["Hybrid cloud","Mix of public and private","Sensitive data private, rest public"]]},{"k":"info","title":"Cloud service models","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 760 220\" role=\"img\" aria-label=\"IaaS, PaaS and SaaS\">\n  <path d=\"M200 20 H440 L460 76 H180 Z\" fill=\"#c0503a\"/><text x=\"320\" y=\"54\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">SaaS<\/text><text x=\"470\" y=\"54\" font-size=\"10.5\" class=\"mut\">ready software — Gmail, Google Docs<\/text><path d=\"M150 80 H490 L510 136 H130 Z\" fill=\"#c69214\"/><text x=\"320\" y=\"114\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">PaaS<\/text><text x=\"520\" y=\"114\" font-size=\"10.5\" class=\"mut\">a platform to build apps — Google App Engine<\/text><path d=\"M100 140 H540 L560 196 H80 Z\" fill=\"#2f6db5\"/><text x=\"320\" y=\"174\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">IaaS<\/text><text x=\"570\" y=\"174\" font-size=\"10.5\" class=\"mut\">raw servers and storage — AWS EC2<\/text>\n  <text x=\"20\" y=\"214\" font-size=\"10.5\" class=\"mut\">Higher up the pyramid, the provider manages more and you manage less.<\/text><\/svg><\/figure>","cap":"SaaS: just use it. PaaS: build on it. IaaS: rent the hardware and run your own systems on it."},{"k":"table","title":"AI words you will meet","head":["Term","Meaning","Example"],"rows":[["NLP","Natural Language Processing: computers reading, understanding and writing human language","Translation apps, voice assistants"],["LLM","Large Language Model: AI trained on huge amounts of text to write and answer in plain language","GPT (ChatGPT), Gemini, Claude, Llama"],["Chatbot","Program that talks with people in text or voice","ChatGPT, customer-care bots"],["Computer vision","AI that understands images and video","Face unlock, number-plate reading"],["Neural network","Layers of connected \"neurons\" that learn from examples; the base of deep learning","Image and speech recognition"],["Prompt","The instruction or question given to a generative AI","\"Write a letter to the bank manager\""],["Deepfake","Fake but realistic video, picture or voice made with AI","A made-up video of a famous person"],["Turing Test","Alan Turing's 1950 test: can a machine's replies pass as a human's?","Chatbot judged by people"]]},{"k":"table","title":"More technology terms","head":["Term","Meaning","Example"],"rows":[["Metaverse","Shared 3D virtual world where people meet as avatars","Virtual offices, games"],["Digital twin","Live virtual copy of a real machine, building or city","Simulating a factory before changing it"],["3D printing","Additive manufacturing: builds an object layer by layer from a design file","Printed spare parts, models"],["RPA","Robotic Process Automation: software \"robots\" doing repetitive office tasks","Copying data between forms"],["Wearables","Small computers worn on the body","Smartwatch, fitness band"],["Smart contract","Program on a blockchain that runs by itself when conditions are met","Automatic payment on delivery"],["NFT","Non-Fungible Token: a unique blockchain token that records ownership of a digital item","Digital art"],["Web 3.0","The idea of a decentralised web built on blockchain","Crypto wallets, dApps"],["Fog computing","Processing in local nodes between the devices and the cloud","Smart traffic lights"],["Virtualisation","Running many virtual machines on one physical computer (a hypervisor manages them)","VMware, Hyper-V, VirtualBox"]]},{"k":"facts","title":"Newer tools and their dates","rows":[["ChatGPT","Chatbot by OpenAI, released 30 November 2022"],["Gemini","Google's AI model and assistant (Bard was renamed Gemini in February 2024)"],["Microsoft Copilot","AI assistant built into Windows, Edge and the Microsoft 365 apps (Word, Excel, PowerPoint, Outlook) from 2023"],["Microsoft 365","Subscription version of Office; Office 365 was renamed Microsoft 365 in 2020"],["Google Workspace","Google's office suite: Docs, Sheets, Slides, Forms, Gmail, Meet, Drive (G Suite was renamed in October 2020)"],["Windows 11","Released 5 October 2021; Windows 10 support ended on 14 October 2025"],["IndiaAI Mission","Approved March 2024 with ₹10,371.92 crore for AI computing, datasets and start-ups"],["Bhashini","National Language Translation Mission (2022): AI translation between Indian languages"],["AIRAWAT","AI supercomputer at C-DAC, Pune; entered the world Top 500 list in 2023"],["PARAM Rudra","Three supercomputers under the National Supercomputing Mission, dedicated in September 2024 (Pune, Delhi, Kolkata)"],["India Semiconductor Mission","Set up in December 2021 to build chip factories in India; ISRO's Vikram 3201, a 32-bit processor, was shown at Semicon India 2025"]]},{"k":"table","title":"Famous people of computing","head":["Person","Known for"],"rows":[["Charles Babbage","Father of the computer (Analytical Engine)"],["Ada Lovelace","First computer programmer"],["Alan Turing","Father of theoretical computer science and AI; Turing Test (1950)"],["John McCarthy","Coined the term 'Artificial Intelligence' (1955–56, Dartmouth); called the father of AI; created LISP"],["Tim Berners-Lee","Inventor of the World Wide Web"],["Vint Cerf and Bob Kahn","Fathers of the internet (TCP/IP)"],["Ray Tomlinson","Inventor of network e-mail"],["Dennis Ritchie","Created the C language (Bell Labs); co-created UNIX with Ken Thompson"],["James Gosling","Father of Java (Sun Microsystems, 1995)"],["Guido van Rossum","Creator of Python (1991)"],["Linus Torvalds","Created the Linux kernel (1991)"],["Bill Gates and Paul Allen","Founded Microsoft (1975)"],["Steve Jobs and Steve Wozniak","Founded Apple (1976)"],["Larry Page and Sergey Brin","Founded Google (1998)"],["Mark Zuckerberg","Founded Facebook (2004)"],["Vijay Bhatkar","Father of Indian supercomputing (PARAM)"]]},{"k":"photos","title":"People of computing","items":[["Charles_Babbage","Charles Babbage","Father of the computer"],["Ada_Lovelace","Ada Lovelace","First computer programmer"],["Alan_Turing","Alan Turing","Father of theoretical computer science and AI"],["John_McCarthy","John McCarthy","Coined the term 'Artificial Intelligence' (1955–56, Dartmouth)"],["Tim_Berners-Lee","Tim Berners-Lee","Inventor of the World Wide Web"],["Ray_Tomlinson","Ray Tomlinson","Inventor of network e-mail"],["Dennis_Ritchie","Dennis Ritchie","Created the C language (Bell Labs)"],["James_Gosling","James Gosling","Father of Java"],["Guido_van_Rossum","Guido van Rossum","Creator of Python"],["Linus_Torvalds","Linus Torvalds","Created the Linux kernel"],["Mark_Zuckerberg","Mark Zuckerberg","Founded Facebook"],["Vijay_Bhatkar","Vijay Bhatkar","Father of Indian supercomputing"]]},{"k":"tl","title":"India's digital journey","rows":[["1988","C-DAC (Centre for Development of Advanced Computing) set up, Pune"],["1991","PARAM 8000 – India's first supercomputer, by C-DAC"],["2004","CERT-In set up"],["2009","UIDAI set up; Aadhaar (12-digit unique ID) follows from 2010"],["2015","Digital India launched (1 July 2015); DigiLocker launched; National Supercomputing Mission approved"],["2016","UPI launched by NPCI; BHIM app launched in December"],["2022","5G services launched in India (1 October 2022)"]]},{"k":"trick","h":"Cloud stack from top: <span class='mn'>S<\/span>aaS = <span class='mn'>S<\/span>oftware you just use; <span class='mn'>P<\/span>aaS = <span class='mn'>P<\/span>latform to build; <span class='mn'>I<\/span>aaS = <span class='mn'>I<\/span>ron (bare hardware). AI family: <span class='mn'>A<\/span> ⊃ <span class='mn'>M<\/span> ⊃ <span class='mn'>D<\/span> – 'A Mango Drop' (AI contains ML contains Deep learning)."},{"k":"trap","h":"<b>Father of AI<\/b>: John McCarthy coined the term; Alan Turing laid the theory – read the question wording. <b>AR vs VR<\/b>: AR adds to reality, VR replaces it. <b>ML vs DL<\/b>: deep learning is a part of ML, not the other way. <b>Gmail is SaaS<\/b>, AWS EC2 is IaaS. <b>Python<\/b> is Guido van Rossum, <b>Java<\/b> is James Gosling, <b>Linux<\/b> is Linus Torvalds – not the founders of Microsoft or Apple."}],"sum":["AI makes machines think; ML learns from data; deep learning uses neural networks; generative AI creates new content.","Cloud computing: SaaS (Gmail), PaaS (App Engine), IaaS (AWS EC2); deployed as public, private or hybrid cloud.","IoT connects everyday objects; blockchain is a shared tamper-resistant ledger; Bitcoin (2009) is the first cryptocurrency; AR adds, VR replaces reality.","John McCarthy coined Artificial Intelligence; Alan Turing gave the Turing Test; Ritchie made C, Gosling Java, van Rossum Python, Torvalds Linux.","India: C-DAC (1988), PARAM 8000 (1991), Digital India and DigiLocker (2015), UPI and BHIM (2016), 5G (2022).","LLMs such as ChatGPT (OpenAI, 2022) and Gemini (Google) are generative AI; NLP lets computers handle human language; a deepfake is fake AI-made media.","India: IndiaAI Mission (2024), Bhashini (2022), AIRAWAT and PARAM Rudra supercomputers, India Semiconductor Mission (2021)."],"part":["Part 3 · Internet, networks & security","इंटरनेट, नेटवर्क एवं सुरक्षा"]}
];
const QB = [
["C1","Who is known as the 'Father of the Computer'?",["Charles Babbage","Alan Turing","John von Neumann","Blaise Pascal"],"Charles Babbage designed the Difference Engine and the Analytical Engine, the plan of the modern computer. Turing is linked to theoretical computer science and AI.","p"],
["C1","Who is regarded as the world's first computer programmer?",["Ada Lovelace","Grace Hopper","Charles Babbage","Herman Hollerith"],"Ada Lovelace wrote an algorithm for Babbage's Analytical Engine in 1843.","p"],
["C1","What is the full form of ENIAC?",["Electronic Numerical Integrator and Computer","Electronic Numeric Integrated and Calculator","Electrical Numerical Integrator and Calculator","Electronic Number Input and Computer"],"ENIAC (1946), built by Eckert and Mauchly, was the first general-purpose electronic computer and used vacuum tubes.","p"],
["C1","What is the full form of UNIVAC?",["Universal Automatic Computer","Universal Array Computer","Unique Automatic Calculator","Universal Analog Computer"],"UNIVAC I (1951) was the first commercially produced computer in the USA — not the first electronic computer, which was ENIAC.","p"],
["C1","Which technology was used in first-generation computers?",["Vacuum tubes","Transistors","Integrated circuits","Microprocessors"],"First generation (about 1940–56) used vacuum tubes: huge, hot and power-hungry. Transistors came in the second generation.","p"],
["C1","Microprocessors (VLSI) are the main technology of which generation of computers?",["Fourth","Third","Second","Fifth"],"IC = third generation; VLSI microprocessor = fourth; AI = fifth. Exams often swap third and fourth.","p"],
["C1","Which pair of generation and technology is correctly matched?",["Second generation — Transistors","Third generation — Vacuum tubes","First generation — Integrated circuits","Fifth generation — Transistors"],"Order: vacuum tube, transistor, IC, microprocessor, artificial intelligence.",""],
["C1","Fifth-generation computers are mainly based on:",["Artificial intelligence","Vacuum tubes","Magnetic core memory","Transistors"],"Fifth generation aims at AI — natural language, expert systems, parallel processing.",""],
["C1","Who built the Pascaline, an early mechanical adding machine (1642)?",["Blaise Pascal","Charles Babbage","John Napier","Herman Hollerith"],"Blaise Pascal built the Pascaline. Napier gave Napier's Bones; Hollerith the punched-card tabulator.",""],
["C1","Herman Hollerith's punched-card tabulating machine was first used for:",["The US census of 1890","Weaving cloth patterns","Breaking wartime codes","Railway reservation"],"Hollerith's machine processed the 1890 US census; his company later became IBM. Punched cards for weaving were Jacquard's.",""],
["C1","The 'stored-program' concept, in which instructions and data share the same memory, is credited to:",["John von Neumann","Charles Babbage","Blaise Pascal","Ada Lovelace"],"Von Neumann's 1945 EDVAC report described the stored-program architecture used by almost all computers today.",""],
["C1","Which was the first commercially produced computer in the USA?",["UNIVAC I","ENIAC","EDSAC","Harvard Mark I"],"UNIVAC I (1951) was sold commercially; ENIAC (1946) was a government/university machine.",""],
["C1","India's first supercomputer, PARAM 8000 (1991), was developed by:",["C-DAC","ISRO","DRDO","BARC"],"C-DAC (Centre for Development of Advanced Computing), Pune, led by Vijay Bhatkar, built PARAM 8000 in 1991.","p"],
["C1","A speedometer of a car is an example of which type of computer/device?",["Analog","Digital","Hybrid","Micro"],"Analog devices measure continuous quantities such as speed, temperature or voltage.","p"],
["C1","A computer used in a hospital ICU that measures heartbeat (analog) and displays it as numbers (digital) is a:",["Hybrid computer","Analog computer","Digital computer","Mainframe computer"],"Hybrid computers combine analog and digital features — ECG/ICU machines, petrol pumps.",""],
["C1","Which type of computer is used for weather forecasting and nuclear research?",["Supercomputer","Minicomputer","Microcomputer","Laptop"],"Supercomputers are the fastest; their speed is measured in FLOPS. Mainframes serve banks and railways.",""],
["C1","Arrange computers in increasing order of size and power.",["Micro, Mini, Mainframe, Super","Mini, Micro, Mainframe, Super","Micro, Mainframe, Mini, Super","Super, Mainframe, Mini, Micro"],"Smallest to largest: microcomputer, minicomputer, mainframe, supercomputer.",""],
["C1","Which of these is NOT a characteristic of a computer?",["Own intelligence (IQ)","Speed","Accuracy","Diligence"],"A computer is fast, accurate and tireless, but it has no intelligence or feelings of its own.",""],
["C1","The term GIGO in computing stands for:",["Garbage In, Garbage Out","Go In, Go Out","Gigabyte In, Gigabyte Out","General Input, General Output"],"GIGO means wrong input data produces wrong output — the computer itself does not make errors.",""],
["C1","Raw, unprocessed facts given to a computer are called:",["Data","Information","Knowledge","Output"],"Data is raw facts; information is data after processing.",""],
["C1","Large organisations such as banks and railway reservation systems, with thousands of users at once, typically use:",["Mainframe computers","Microcomputers","Analog computers","Tablet computers"],"Mainframes handle huge numbers of simultaneous users and transactions.",""],
["C1","Which device invented in 1947 at Bell Labs replaced vacuum tubes in computers?",["Transistor","Integrated circuit","Microprocessor","Diode valve"],"The transistor (Bardeen, Brattain, Shockley) made second-generation computers smaller, faster and cooler.",""],
["C1","Which was the first commercial microprocessor (1971)?",["Intel 4004","Intel 8086","Pentium","Motorola 68000"],"The 4-bit Intel 4004 was released in 1971 and began the fourth generation.",""],
["C1","Which of the following is an example of an input-process-output machine that understands only 0 and 1?",["Digital computer","Analog computer","Abacus","Slide rule"],"A digital computer works on binary values (high voltage = 1, low = 0). An analog computer works on continuous values, and the abacus and slide rule are manual aids.","","","",""],
["C1","The language of 0s and 1s that a computer understands directly is called:",["Machine language","Assembly language","High-level language","Natural language"],"Machine language (machine code, object code, binary code) is the only language the CPU runs directly. Assembly needs an assembler.","","","",""],
["C1","Which of the following types of computers have features of both digital and analog process?",["Hybrid Computers","Digital Computers","Analog Computers","Digital Calculators"],"A hybrid computer combines analog and digital working, e.g. an ICU monitor.","","","",""],
["C1","Which of the following is the earliest machine used for computation?",["Abacus","Torquetum","Equatorium","Turing Machine"],"The abacus, a bead frame, is the oldest known calculating aid. The Turing machine is a 1936 theoretical model.","","","",""],
["C1","Abacus was the first?",["Mechanical Calculator","Electronic Computer","Mechanical Computer","Electronic Calculator"],"The abacus is a manual calculating device, so it is called the first mechanical calculator (calculating aid). It is not a computer and not electronic.","","","",""],
["C1","The first mechanical calculator was called_____.",["Pascaline","Calculator","Galileo","Orpat"],"Blaise Pascal built the Pascaline in 1642 using gears to add and subtract.","","","",""],
["C1","Which of the following is considered the first mechanical computer designed by Charles Babbage?",["Analytical Engine","Abacus","ENIAC","UNIVAC"],"Babbage designed the Analytical Engine (1837), the first design of a general-purpose computer. ENIAC and UNIVAC are later electronic machines.","p","","","SSC CHSL Tier 2 · 18 Nov 2024"],
["C1","Who is the father of Modern Computer?",["Alan Turing","Gorden E Moore","Charles Babbage","James Gosling"],"Turing's 1936 Turing Machine is the base of modern computing theory. Babbage is \"father of computer\", Gosling created Java, Moore gave Moore's law.","","","",""],
["C1","Punched cards were first used to control patterns in a loom by:",["Joseph Marie Jacquard","Charles Babbage","Herman Hollerith","Blaise Pascal"],"Jacquard's loom (1801) used punched cards; Babbage and later Hollerith borrowed the idea.","","","",""],
["C1","In the field of computing, what does ENIAC stand for?",["Electronic Numerical Integrator and Computer","Electronic Numerals Integration and Computing","Electronic Numbers Integration and Computer","Electronic Numerical Integrated Advanced Computer"],"ENIAC was built in the USA in 1945-46. Only option A has every word right: Electronic, Numerical, Integrator, Computer.","p","","","SSC CHSL Tier 1 · 12 Oct 2020, shift 2"],
["C1","Which was the first programmable general purpose computer in the world?",["ENIAC","Napier's bones","Pascaline","Mark I"],"ENIAC was the first general-purpose programmable electronic computer. Napier's bones and Pascaline were calculating aids; Mark I was electro-mechanical.","p","","","SSC CHSL Tier 1 · 4 Jul 2024, shift 2"],
["C1","Who designed the first electronics computer-ENIAC?",["J. Presper Eckert and John W Mauchly","Van-Neumann","Joseph M. Jacquard","Presper Mauchly"],"Eckert and Mauchly built ENIAC at the University of Pennsylvania. Von Neumann gave the stored-program idea; Jacquard made the punched-card loom.","","","",""],
["C1","Which was the first commercial computer?",["UNIVAC I","ENIAC","EDVAC","Mark I"],"UNIVAC I (1951) was the first computer sold commercially. ENIAC was the first general-purpose electronic computer, built for the US Army.","","","",""],
["C1","First generation computers used:",["Vacuum tubes","Transistors","Integrated circuits","Microprocessors"],"1st generation (1940-56) = vacuum tubes; 2nd = transistors; 3rd = ICs; 4th = microprocessors.","","","",""],
["C1","Third generation computers used _______________.",["Integrated circuits","VLSI technique","Transistors","Vacuum tubes"],"The 3rd generation (1964-71) used ICs. VLSI microprocessors belong to the 4th generation; transistors to the 2nd.","p","","","SSC CHSL Tier 1 · 16 Oct 2020, shift 3"],
["C1","In which generation, development and introduction of minicomputers took place:",["3rd","1st","2nd","4th"],"ICs made computers smaller and cheaper, so minicomputers appeared in the 3rd generation.","","","",""],
["C1","From which generation Operating System were developed.",["Third","First","Second","Fourth"],"Operating systems with multiprogramming came with 3rd generation IC computers such as the IBM 360.","","","",""],
["C1","The microprocessor is the main component of which generation of computers?",["Fourth","Second","Third","First"],"The 4th generation (from 1971, Intel 4004) put the whole CPU on one VLSI chip.","","","",""],
["C1","With respect to computer, what is the full form of IC:",["Integrated Circuit","Internet Current","Internet Circuit","Integrated Current"],"An IC (chip) puts many transistors on one small piece of silicon. It was made by Jack Kilby (1958) and Robert Noyce (1959).","","","",""],

["C18","A smaller version of an image is known as:",["Thumbnail","Clipart","Portable network graphic","Bitmap"],"Thumbnails are small preview images.","","","",""],

["C18","LCD stands for:",["Liquid Crystal Display","Light Coloured Display","Linear Circuit Display","Liquid Colour Diode"],"LCD = Liquid Crystal Display. An 'LED monitor' is usually an LCD panel lit from behind by LEDs.","p","","","SSC CGL Tier 2 · March 2023"],

/** Rows of the table (or facts list) whose title starts with `title` in a lesson, as [prompt, answer, note]:
    cols picks the prompt and answer columns. Tags are stripped; rows with an empty side are left out. */
function cmpRows(lessonId, title, cols, note){
  const strip = s => String(s == null ? "" : s).replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&minus;/g, "−").trim();
  const l = LESSONS.find(x => x.id === lessonId), b = l ? l.blocks.find(x => x.rows && String(x.title).startsWith(title)) : null;
  const [p, a] = cols || [0, 1];
  return b ? b.rows.map(r => [strip(r[p]), strip(r[a]), note != null ? strip(r[note]) : ""]).filter(r => r[0] && r[1] && r[1] !== "—" && r[1] !== "–") : [];
}
const short = (rows, n) => rows.filter(r => r[1].length <= (n || 46));
/* Number conversions, made fresh for every game: decimal ↔ binary, octal and hex. */
const SUBS = { 2: "₂", 8: "₈", 10: "₁₀", 16: "₁₆" };
function cmpConv(){
  const pairs = [[10, 2], [2, 10], [2, 16], [16, 10], [2, 8], [8, 10], [10, 16], [16, 2]], out = [];
  for (let i = 0; i < 60; i++) {
    const [f, t] = pairs[i % pairs.length], n = 5 + Math.floor(Math.random() * (f === 2 || t === 2 ? 120 : 250));
    const show = (v, b) => `(${v.toString(b).toUpperCase()})${SUBS[b]}`;
    const wrong = [];
    [1, -1, 2, -2, 4, 8, -4, 16].forEach(d => { const v = show(n + d, t); if (wrong.length < 3 && n + d > 0 && v !== show(n, t) && !wrong.includes(v)) wrong.push(v); });
    out.push({ p: `${show(n, f)} = ? in base ${t}`, a: show(n, t), note: `${show(n, f)} = ${n} in decimal`, opts4: wrong });
  }
  return out;
}

/* Up to n rows of a deck for the Grand Mix, spread over different answers so every question gets real wrong options. */
function cmpSpread(rows, n){
  const by = {}; shuffle(rows).forEach(r => { (by[r[1]] = by[r[1]] || []).push(r); });
  const groups = shuffle(Object.values(by)), out = [];
  for (let i = 0; out.length < n && groups.some(g => g.length); i++) { const g = groups[i % groups.length]; if (g.length) out.push(g.shift()); }
  return out;
}

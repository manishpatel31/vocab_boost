const LESSONS = [
{"id":"C1","g":"cmp","heat":2,"title":"Computer fundamentals, types & history","hi":"कंप्यूटर के मूल सिद्धांत, प्रकार एवं इतिहास","blocks":[{"k":"hot","h":"Every paper opens the computer section with one or two easy marks from here: <b>generation ↔ technology<\/b>, <b>father of the computer<\/b>, <b>ENIAC/UNIVAC full forms<\/b>, and <b>analog vs digital vs hybrid<\/b> examples.<br><br>Every paper opens computer awareness with 1 to 3 easy questions from here: the full form of ENIAC, who designed a machine, which generation used integrated circuits, which computer type suits weather forecasting, or which part sits on the motherboard. RRB NTPC asks history and \"brain of the computer\" questions very often. These are free marks if you remember names, dates and the motherboard parts."},{"k":"story","h":"<p>A computer is an electronic machine that takes in data, works on it by following a list of instructions, and gives back a result. Think of a <b>kitchen<\/b>: raw vegetables go in (<b>input<\/b>), the cook chops and fries them following a recipe (<b>processing<\/b>), and a finished dish comes out (<b>output<\/b>). The fridge where food waits is <b>storage<\/b>. This Input–Process–Output cycle is the heart of every computer, from a phone to a supercomputer.<\/p><p>The machine has no brain of its own. It is fast, accurate and never gets tired, but it only does what the recipe (the <b>program<\/b>) says. Feed it wrong data and you get wrong answers: <i>Garbage In, Garbage Out<\/i>.<\/p><p>Computers grew over centuries, from the bead-counting <b>abacus<\/b> to Charles Babbage's mechanical engines, then to room-sized machines full of glowing <b>vacuum tubes<\/b>, and finally to tiny <b>microprocessors<\/b> that fit on a fingernail. Each big jump in the electronic parts is called a <b>generation<\/b>.<\/p>","key":"Input, Process, Output, Storage; each generation is named after the electronic part it used."},{"k":"facts","title":"What a computer is and what it can do","rows":[["Word origin","From 'compute' = to calculate"],["Basic cycle","IPO: Input → Process → Output (plus Storage)"],["Data vs information","Data = raw facts; Information = processed, meaningful data"],["Speed","Measured in microseconds, nanoseconds, picoseconds"],["Accuracy","Errors come from wrong data or program, not the machine — GIGO (Garbage In, Garbage Out)"],["Diligence","Does not get tired or bored; same quality on the millionth task"],["Versatility","Can do many kinds of work — billing, games, design, science"],["Storage","Can store huge data and recall it at once"],["Limitation","No IQ (no intelligence of its own), no feelings, no common sense"],["Hardware vs software","Hardware = parts you can touch; Software = programs; Firmware = software stored in ROM"],["Father of the computer","Charles Babbage"],["First programmer","Ada Lovelace (notes on the Analytical Engine)"],["Machine language","Also called machine code = object code = binary code. It is the only language the computer understands directly."],["Deterministic system","A system in which the input, process and output are known with certainty."],["\"COMPUTER\" full form","No official full form. A popular made-up expansion is \"Commonly Operated Machine Particularly Used for Technical, Education and Research\"."]]},{"k":"tl","title":"History of computing — key milestones","rows":[["Ancient times","Abacus — earliest known counting/calculating tool (beads on rods)"],["1617","Napier's Bones — John Napier, aid for multiplication"],["1642","Pascaline — Blaise Pascal, first mechanical adding machine"],["1804","Jacquard loom — Joseph Marie Jacquard used punched cards to control patterns"],["1822","Difference Engine — Charles Babbage"],["1837","Analytical Engine — Babbage; had a 'mill' (like ALU) and 'store' (like memory): the plan of the modern computer"],["1843","Ada Lovelace writes the first algorithm for the Analytical Engine"],["1890","Herman Hollerith's punched-card Tabulating Machine processes the US census; his company later became IBM"],["1944","Harvard Mark I — Howard Aiken with IBM, electromechanical"],["1945","John von Neumann's EDVAC report: the stored-program idea (program and data kept in the same memory)"],["1946","ENIAC unveiled — J. Presper Eckert and John Mauchly, University of Pennsylvania; first general-purpose electronic computer"],["1947","Transistor invented at Bell Labs (Bardeen, Brattain, Shockley)"],["1949","EDSAC (Cambridge) — early practical stored-program computer"],["1951","UNIVAC I — first commercially produced computer in the USA"],["1958","Integrated Circuit — Jack Kilby (Texas Instruments); Robert Noyce independently soon after"],["1971","Intel 4004 — first commercial microprocessor (4-bit)"],["1981","IBM PC launched"],["1991","PARAM 8000 — India's first supercomputer, by C-DAC"],["1673","Stepped Reckoner by Gottfried Leibniz: could multiply and divide"],["1936","Alan Turing described the Turing Machine: Turing = \"Father of Modern Computer Science/Modern Computer\""],["1959","Robert Noyce made the first monolithic silicon IC"]]},{"k":"table","title":"Five generations of computers","head":["Generation","Period (approx.)","Main technology","Examples / features"],"rows":[["First","1940–1956","Vacuum tubes","ENIAC, EDVAC, UNIVAC I, IBM 701; machine language; huge, hot, costly; punched cards"],["Second","1956–1963","Transistors","IBM 1401, IBM 7094, CDC 1604; assembly language, early FORTRAN and COBOL; magnetic core memory"],["Third","1964–1971","Integrated Circuits (IC)","IBM System/360, PDP-8; keyboards and monitors; operating systems"],["Fourth","1971–present","VLSI — Microprocessor","IBM PC, Apple Macintosh; personal computers, GUI, networks"],["Fifth","Present and beyond","Artificial Intelligence (ULSI, parallel processing)","Expert systems, natural language, robotics, voice assistants"]]},{"k":"info","title":"Five generations of computers","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 205\" role=\"img\" aria-label=\"Generations of computers\"><line x1=\"160\" y1=\"20\" x2=\"160\" y2=\"183\" class=\"grid\"/><text x=\"160\" y=\"199\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">1940<\/text><line x1=\"217.4712643678161\" y1=\"20\" x2=\"217.4712643678161\" y2=\"183\" class=\"grid\"/><text x=\"217.4712643678161\" y=\"199\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">1950<\/text><line x1=\"274.9425287356322\" y1=\"20\" x2=\"274.9425287356322\" y2=\"183\" class=\"grid\"/><text x=\"274.9425287356322\" y=\"199\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">1960<\/text><line x1=\"332.41379310344826\" y1=\"20\" x2=\"332.41379310344826\" y2=\"183\" class=\"grid\"/><text x=\"332.41379310344826\" y=\"199\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">1970<\/text><line x1=\"389.88505747126436\" y1=\"20\" x2=\"389.88505747126436\" y2=\"183\" class=\"grid\"/><text x=\"389.88505747126436\" y=\"199\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">1980<\/text><line x1=\"447.35632183908046\" y1=\"20\" x2=\"447.35632183908046\" y2=\"183\" class=\"grid\"/><text x=\"447.35632183908046\" y=\"199\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">1990<\/text><line x1=\"504.82758620689657\" y1=\"20\" x2=\"504.82758620689657\" y2=\"183\" class=\"grid\"/><text x=\"504.82758620689657\" y=\"199\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">2000<\/text><line x1=\"562.2988505747127\" y1=\"20\" x2=\"562.2988505747127\" y2=\"183\" class=\"grid\"/><text x=\"562.2988505747127\" y=\"199\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">2010<\/text><line x1=\"619.7701149425287\" y1=\"20\" x2=\"619.7701149425287\" y2=\"183\" class=\"grid\"/><text x=\"619.7701149425287\" y=\"199\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">2020<\/text><text x=\"152\" y=\"40\" text-anchor=\"end\" font-size=\"12\" class=\"b\">First · Vacuum tubes<\/text><rect x=\"160\" y=\"24\" width=\"91.95402298850576\" height=\"24\" rx=\"6\" fill=\"#a9805a\" class=\"anim-in\" style=\"animation-delay:0ms\"/><text x=\"166\" y=\"40\" font-size=\"10.5\" style=\"fill:#fff;font-weight:700\">1940–1956<\/text><text x=\"152\" y=\"71\" text-anchor=\"end\" font-size=\"12\" class=\"b\">Second · Transistors<\/text><rect x=\"251.95402298850576\" y=\"55\" width=\"40.22988505747122\" height=\"24\" rx=\"6\" fill=\"#c69214\" class=\"anim-in\" style=\"animation-delay:70ms\"/><text x=\"297.183908045977\" y=\"71\" font-size=\"10.5\" class=\"mut\">1956–1963<\/text><text x=\"152\" y=\"102\" text-anchor=\"end\" font-size=\"12\" class=\"b\">Third · Integrated Circuits<\/text><rect x=\"297.9310344827586\" y=\"86\" width=\"40.22988505747128\" height=\"24\" rx=\"6\" fill=\"#2f8f4e\" class=\"anim-in\" style=\"animation-delay:140ms\"/><text x=\"343.1609195402299\" y=\"102\" font-size=\"10.5\" class=\"mut\">1964–1971<\/text><text x=\"152\" y=\"133\" text-anchor=\"end\" font-size=\"12\" class=\"b\">Fourth · VLSI<\/text><rect x=\"338.1609195402299\" y=\"117\" width=\"310.34482758620686\" height=\"24\" rx=\"6\" fill=\"#2f6db5\" class=\"anim-in\" style=\"animation-delay:210ms\"/><text x=\"344.1609195402299\" y=\"133\" font-size=\"10.5\" style=\"fill:#fff;font-weight:700\">1971–2025<\/text><text x=\"152\" y=\"164\" text-anchor=\"end\" font-size=\"12\" class=\"b\">Fifth · Artificial Intelligence<\/text><rect x=\"447.35632183908046\" y=\"148\" width=\"206.8965517241379\" height=\"24\" rx=\"6\" fill=\"#7d4fb5\" class=\"anim-in\" style=\"animation-delay:280ms\"/><text x=\"453.35632183908046\" y=\"164\" font-size=\"10.5\" style=\"fill:#fff;font-weight:700\">1990–2026<\/text><\/svg><\/figure>","cap":"Each generation is named after its core technology: vacuum tubes → transistors → integrated circuits → microprocessors (VLSI) → artificial intelligence. The fifth has no clean start date."},{"k":"photos","title":"Machines in pictures","items":[["Abacus","Abacus","Earliest counting tool"],["Pascal's_calculator","Pascal's calculator","Pascaline, 1642"],["Analytical_engine","Analytical Engine","Babbage's design"],["ENIAC","ENIAC","First generation · vacuum tubes"],["UNIVAC_I","UNIVAC I","First commercial computer"],["IBM_Personal_Computer","IBM PC","1981"],["PARAM_8000","PARAM 8000","India's first supercomputer, 1991"]]},{"k":"table","title":"IC integration levels","head":["Level","Full form","Approx. transistors per chip"],"rows":[["SSI","Small Scale Integration","up to 100"],["MSI","Medium Scale Integration","100 to 1,000"],["LSI","Large Scale Integration","1,000 to 1 lakh"],["VLSI","Very Large Scale Integration","1 lakh to 10 lakh and more; used in CPUs"],["ULSI","Ultra Large Scale Integration","over 10 lakh to billions"]]},{"k":"facts","title":"Speed units","rows":[["FLOPS","Floating-point Operations Per Second: measures supercomputer speed. Increasing order: MFLOPS &lt; GFLOPS &lt; TFLOPS &lt; PFLOPS."],["MIPS","Millions of Instructions Per Second: measures processor speed."],["Transistor","Tiny electronic switch; a CPU has millions to billions of them."],["IC","Integrated Circuit (chip): many transistors on one small silicon piece."]]},{"k":"table","title":"Types of computers by size and power","head":["Type","Size / users","Typical use","Example"],"rows":[["Supercomputer","Largest, fastest; speed in FLOPS","Weather forecasting, nuclear research, space","CDC 6600 (first), PARAM series (India)"],["Mainframe","Large; hundreds/thousands of users at once","Banks, railways reservation, insurance, big firms","IBM zSeries"],["Minicomputer","Mid-size; tens of users","Small firms, departments","PDP-8, PDP-11"],["Microcomputer","Smallest; one user","Home, office — desktop, laptop, tablet, smartphone","IBM PC, Apple Mac"]]},{"k":"facts","title":"More types: workstation, PDA and portables","rows":[["Microcomputer","Personal computer built around a microprocessor: desktop, laptop (also called notebook), tablet, smartphone, scientific calculator."],["Workstation","A powerful single-user microcomputer for design and engineering work."],["PDA","Personal Digital Assistant: smallest hand-held computer (system unit smallest)."],["Portable computers","Laptop/notebook, tablet, PDA. A desktop computer is NOT portable."]]},{"k":"table","title":"Types of computers by working (data handled)","head":["Type","Works on","Example"],"rows":[["Analog","Continuous physical quantities (voltage, temperature, speed)","Speedometer, thermometer, voltmeter, seismograph"],["Digital","Discrete values — 0 and 1 (binary)","PC, laptop, calculator, digital watch"],["Hybrid","Both analog and digital","ICU/ECG machines in hospitals, petrol pump dispenser"]]},{"k":"facts","title":"India milestones","rows":[["First computer installed in India","HEC-2M at Indian Statistical Institute, Kolkata (1956)"],["First computer built in India","TIFRAC — Tata Institute of Fundamental Research"],["C-DAC","Centre for Development of Advanced Computing, Pune (set up 1988)"],["India's first supercomputer","PARAM 8000 (1991), by C-DAC"],["Father of Indian supercomputing","Vijay Bhatkar (PARAM)"],["Pratyush and Mihir","High-performance computers for weather forecasting at IITM Pune and NCMRWF Noida (2018)."],["National Supercomputing Mission","Launched 2015 to build PARAM-series supercomputers across India."]]},{"k":"p","h":"<b>Why generations changed.<\/b> each new main component was smaller, faster, cheaper and used less power. Vacuum tubes were big and got very hot. Transistors replaced them. Then many transistors were put on one chip (IC). Then a whole CPU was put on one chip (microprocessor). So size went down and speed went up in every generation."},{"k":"trick","h":"Generations in order — <span class='mn'>V T I M A<\/span>: <b>V<\/b>ery <b>T<\/b>ired <b>I<\/b>ndians <b>M<\/b>ake <b>A<\/b>pps = Vacuum tube, Transistor, IC, Microprocessor, AI. Computer types big to small — <span class='mn'>S M M M<\/span>: Super, Mainframe, Mini, Micro.<ul><li>ENIAC = \"Every Number Is Added by Computer\" → Electronic Numerical Integrator And Computer.<\/li><li>Babbage = \"Bap\" (father) of computer; Turing = father of \"modern\" computer.<\/li><li>North = Near the CPU (fast: RAM, graphics); South = Slow devices (USB, SATA, audio).<\/li><li>IC levels go up like a ladder: S-M-L-VL-UL (Small, Medium, Large, Very Large, Ultra Large).<\/li><\/ul>"},{"k":"trap","h":"<b>ENIAC<\/b> is the first general-purpose electronic computer; <b>UNIVAC I<\/b> is the first <i>commercial<\/i> one — don't swap. The stored-program idea is <b>von Neumann<\/b>'s (EDVAC), not Babbage's. <b>Microprocessor = 4th<\/b> generation, <b>IC = 3rd<\/b>. A <b>speedometer<\/b> is analog, a <b>digital watch<\/b> is digital, an <b>ECG/ICU<\/b> machine is hybrid. Babbage = father of the computer; Ada Lovelace = first programmer.<ul><li>Abacus is the first/earliest calculating aid, but Pascaline is the first MECHANICAL CALCULATOR built with gears.<\/li><li>Babbage designed the Analytical Engine but never completed it; it was a design on paper.<\/li><li>Operating systems and minicomputers came in the 3rd generation, not the 4th.<\/li><li>Hybrid = both analog and digital. Do not pick \"analog\" for \"features of both\".<\/li><li>Desktop computer is NOT portable; laptop, tablet and PDA are.<\/li><\/ul>"}],"sum":["A computer follows the Input, Process, Output cycle and stores results; GIGO means wrong input gives wrong output.","Babbage (Difference Engine 1822, Analytical Engine 1837) is the father of the computer; Ada Lovelace was the first programmer.","ENIAC (1946) was the first general-purpose electronic computer; UNIVAC I (1951) was the first commercial one.","Generations: vacuum tube, transistor, IC, microprocessor (VLSI), artificial intelligence.","PARAM 8000 (1991, C-DAC) was India's first supercomputer; analog, digital and hybrid differ by the data they handle.","A computer takes input, processes it, gives output and stores data; it understands only 0 and 1.","By size: supercomputer > mainframe > mini > micro; by working: analog, digital, hybrid.","History: Abacus, Pascaline 1642, Babbage's Analytical Engine 1837, ENIAC 1945-46, UNIVAC 1951, Intel 4004 1971."],"part":["Part 1 · Hardware","हार्डवेयर"]},
{"id":"C2","g":"cmp","heat":3,"title":"CPU, motherboard, buses & ports","hi":"सीपीयू, मदरबोर्ड, बस एवं पोर्ट","blocks":[{"k":"hot","h":"Almost every paper asks a <b>full form<\/b> (CPU, ALU, CU, BIOS, POST, SMPS, USB, HDMI, VGA), <b>what the ALU or CU does<\/b>, <b>cold vs warm booting<\/b>, or <b>which port connects what<\/b>.<br><br>The CPU is the most asked single topic in computer awareness. Expect questions like \"which is NOT part of the CPU\", \"MAR stands for\", \"which register holds the address of the next instruction\", \"which bus decides maximum memory\", \"which port sends one bit at a time\" and \"which port carries HD audio and video\". SSC CGL Tier-II asked MAR twice (2023) and RRB NTPC asks \"brain of the computer\" again and again."},{"k":"story","h":"<p>Open a desktop cabinet and you find a big green board, the <b>motherboard<\/b>. Think of it as a <b>city<\/b>. The <b>CPU<\/b> (Central Processing Unit) is the town hall where every decision is made. Inside it, the <b>Control Unit<\/b> is the manager giving orders, the <b>ALU<\/b> (Arithmetic Logic Unit) is the clerk who adds, subtracts and compares, and the <b>registers<\/b> are the tiny trays on the clerk's desk holding what is being worked on right now.<\/p><p>Roads called <b>buses<\/b> carry traffic: the data bus carries the goods, the address bus carries the house numbers, and the control bus carries the traffic signals. The <b>SMPS<\/b> is the power station turning wall AC into the DC the parts need.<\/p><p>When you press the power button, a small program in ROM called the <b>BIOS<\/b> wakes up, checks that everything is present (the <b>POST<\/b>), and then loads the operating system. This is <b>booting<\/b>. The holes at the back, called <b>ports<\/b>, are the city gates where keyboards, screens and cables enter.<\/p>","key":"CPU = CU (manager) + ALU (clerk) + registers (desk trays), connected by buses on the motherboard."},{"k":"facts","title":"The CPU","rows":[["CPU","Central Processing Unit. Also called processor, microprocessor, microchip, logic chip, or the brain of the computer."],["Main parts","ALU (Arithmetic Logic Unit), CU (Control Unit), MU (Memory Unit = set of registers). Cache memory is also built into the CPU."],["ALU","Does arithmetic (+, -, x, /) and logical operations (TRUE/FALSE, compare, AND/OR)."],["CU","Directs all operations; reads, interprets (decodes) and executes instructions; coordinates input, output and memory."],["MU","Set of registers inside the CPU."],["Not part of CPU","Keyboard, printer, OMR, hard disk drive, monitor."],["CPU makers","Intel, AMD, Qualcomm (mobile). NVIDIA mainly makes GPUs, not CPUs."],["Pentium, Core i3/i5/i7/i9","Names of Intel microprocessors. Core 2 Duo = a dual-core processor."],["GPU","Graphics Processing Unit: processor for images, video and games."],["System unit","Its important components are the microprocessor and memory."],["Microprocessor","Whole CPU on one chip; Intel 4004 (1971) was the first"],["Heat sink and fan","Keep the CPU from overheating"]]},{"k":"facts","title":"Instruction cycle and speed","rows":[["Instruction cycle","Fetch → Decode → Execute → Store (write back). The CPU follows fetch, decode and execute steps."],["Machine cycle","Time to complete one such cycle."],["Clock speed","Speed at which the processor executes instructions; measured in Hertz: MHz and GHz."],["MIPS","Millions of Instructions Per Second."],["Core","Basic computation unit of the CPU. Single core (oldest), dual core (2), quad core (4), octa core (8)."],["Multithreading","One core runs several threads (pieces of a program) at once."],["Word length","Number of bits the CPU handles at one time (8, 16, 32, 64-bit); measured in bits."],["Addressing mode","Way a microprocessor finds the operand (data) of an instruction; related to the microprocessor."]]},{"k":"table","title":"CPU registers","head":["Register","Full form","What it holds"],"rows":[["MDR / MBR / IBR","Memory Data Register / Memory Buffer Register / Instruction Buffer Register","Data coming from or going to memory is first stored here; IBR holds an instruction that is not to be executed immediately"],["MAR (AR)","Memory Address Register","Address of the memory location being read or written (address of active memory location)"],["PC","Program Counter","Address of the NEXT instruction to be executed"],["IR / CIR","Instruction Register / Current Instruction Register","The instruction being executed right now"],["ID","Instruction Decoder","Turns the binary instruction into actions"],["I/O register","Input/Output register","Temporary data between CPU and I/O devices"],["Accumulator (AC)","Accumulator","Data and intermediate results of the ALU"]]},{"k":"info","title":"How a computer works","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 270\" role=\"img\" aria-label=\"Block diagram of a computer\">\n  <defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"var(--ink2)\"/><\/marker><\/defs>\n  <rect x=\"20\" y=\"100\" width=\"120\" height=\"60\" rx=\"10\" fill=\"#2f8f4e\"/><text x=\"80\" y=\"128\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">INPUT<\/text><text x=\"80\" y=\"145\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:#fff\">keyboard, mouse<\/text><rect x=\"540\" y=\"100\" width=\"120\" height=\"60\" rx=\"10\" fill=\"#c0503a\"/><text x=\"600\" y=\"128\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">OUTPUT<\/text><text x=\"600\" y=\"145\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:#fff\">monitor, printer<\/text>\n  <rect x=\"200\" y=\"30\" width=\"280\" height=\"160\" rx=\"14\" fill=\"none\" stroke=\"#2f6db5\" stroke-width=\"2.5\"/><text x=\"340\" y=\"22\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#2f6db5\">CPU<\/text>\n  <rect x=\"220\" y=\"50\" width=\"115\" height=\"56\" rx=\"10\" fill=\"#2f6db5\"/><text x=\"277.5\" y=\"76\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">CU<\/text><text x=\"277.5\" y=\"93\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:#fff\">control unit<\/text><rect x=\"345\" y=\"50\" width=\"115\" height=\"56\" rx=\"10\" fill=\"#7d4fb5\"/><text x=\"402.5\" y=\"76\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">ALU<\/text><text x=\"402.5\" y=\"93\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:#fff\">arithmetic, logic<\/text><rect x=\"220\" y=\"120\" width=\"240\" height=\"50\" rx=\"10\" fill=\"#1f8a8a\"/><text x=\"340\" y=\"143\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">Registers<\/text><text x=\"340\" y=\"160\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:#fff\">the fastest memory<\/text>\n  <rect x=\"220\" y=\"210\" width=\"240\" height=\"50\" rx=\"10\" fill=\"#c69214\"/><text x=\"340\" y=\"233\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">Memory (RAM)<\/text><text x=\"340\" y=\"250\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:#fff\">primary storage<\/text>\n  <path d=\"M140 130 H196\" fill=\"none\" stroke=\"#2f8f4e\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/><circle r=\"5\" fill=\"#2f8f4e\"><animateMotion dur=\"1.6s\" repeatCount=\"indefinite\" path=\"M140 130 H196\"/><\/circle><path d=\"M480 130 H536\" fill=\"none\" stroke=\"#c0503a\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/><circle r=\"5\" fill=\"#c0503a\"><animateMotion dur=\"1.4s\" repeatCount=\"indefinite\" path=\"M480 130 H536\"/><\/circle><path d=\"M300 192 V206\" fill=\"none\" stroke=\"#c69214\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/><circle r=\"5\" fill=\"#c69214\"><animateMotion dur=\"1s\" repeatCount=\"indefinite\" path=\"M300 192 V206\"/><\/circle><path d=\"M380 208 V194\" fill=\"none\" stroke=\"#c69214\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/><circle r=\"5\" fill=\"#c69214\"><animateMotion dur=\"1s\" repeatCount=\"indefinite\" path=\"M380 208 V194\"/><\/circle><\/svg><\/figure>","cap":"Input → processing in the CPU (the control unit directs, the ALU calculates, registers hold what is in use) → output, with main memory feeding the CPU. This is the von Neumann design."},{"k":"photos","title":"Ports in pictures","items":[["USB","USB","Universal Serial Bus"],["HDMI","HDMI","High-Definition Multimedia Interface"],["VGA_connector","VGA","Video Graphics Array"],["PS/2_port","PS/2","Purple keyboard, green mouse"],["Registered_jack","RJ-45","RJ-45 — Ethernet"]]},{"k":"facts","title":"Registers and flip-flops","rows":[["Register","A small, very fast storage place inside the CPU; holds data temporarily during processing. It is NOT part of main memory."],["Fastest memory","Registers have the lowest access time of all memories."],["Register is made of","Flip-flops. One flip-flop stores a single bit."],["Types of flip-flop","SR (Set-Reset), JK (named after Jack Kilby), D (Delay or Data), T (Toggle)."]]},{"k":"facts","title":"Buses","rows":[["Bus","A set of parallel copper lines on the motherboard that carries signals between parts; the \"data traveller\"."],["Data bus","Carries the actual data; two-way."],["Address bus","Carries the address (location) of data; directly linked with main memory (RAM); one-way from CPU. Its width decides the maximum memory a system can use."],["Control bus","Carries control and timing signals (read, write, interrupt) that tell what type of operation to do."],["System bus","Data bus + address bus + control bus together."],["Formula","n address lines can address 2<sup>n<\/sup> locations. 16 lines, byte-addressable → 2<sup>16<\/sup> = 64 KB."],["Powers of 2","K = 2<sup>10<\/sup>, M = 2<sup>20<\/sup>, G = 2<sup>30<\/sup>."]]},{"k":"facts","title":"Parts of a personal computer","rows":[["Monitor","Also called Display, VDU (Visual Display Unit) or VDT (Visual Display Terminal)."],["System unit","Also called the Cabinet. Holds the motherboard, hard disk and SMPS."],["Keyboard and mouse","Main input devices of a PC."],["Desktop","The first screen you see after the computer starts."],["Motherboard","Main circuit board. It is a PCB (Printed Circuit Board). Every motherboard is a PCB, but every PCB is not a motherboard."],["SMPS","Switched Mode Power Supply. Converts high-voltage AC from the wall into low-voltage DC for the computer."],["UPS","Uninterruptible Power Supply. Primary job: surge protection (stops voltage fluctuation). Secondary job: power backup when electricity goes."],["DMA","Direct Memory Access. Lets devices send data to and from RAM without passing through the CPU; a DMA controller does this work."]]},{"k":"table","title":"Motherboard components","head":["Component","Full form / Hindi","What it does"],"rows":[["Northbridge","Host Bridge","Manages communication between CPU, RAM and graphics card; has a heatsink on it"],["Southbridge","I/O Controller Hub","Connects the CPU to USB, SATA, audio and expansion slots"],["IDE connector (2)","Integrated Drive Electronics","Connects the hard disk to the motherboard"],["DRAM memory slots","RAM slots","Hold RAM sticks; DRAM in normal computers, SRAM in special systems; minimum 2 slots, maximum 32 slots"],["ATX power connector","Advanced Technology Extended","Brings power from SMPS; old boards 20 pins, new boards 24 pins"],["CPU socket","Processor socket","Holds the CPU chip"],["CPU fan and heatsink mount","Cooling","Keeps the processor cool"],["CMOS backup battery","Complementary Metal Oxide Semiconductor","Small cell that keeps BIOS settings and runs the system clock when the PC is off"],["PCI slots (5)","Peripheral Component Interconnect","Hold expansion cards such as graphics card and TV tuner card"],["AGP slot","Accelerated Graphics Port","Old dedicated slot for video cards and 3D accelerators"],["Back-panel connectors","Integrated peripherals","USB, Ethernet/LAN, HDMI, 3.5 mm audio jack, power"],["VGA","Video Graphics Array/Adapter","Old analog port for monitors"],["Socket vs slot","Socket holds a chip (CPU); slot holds a card (RAM, PCI)","A physical connector that connects chips is a socket"]]},{"k":"facts","title":"BIOS, POST and booting","rows":[["BIOS","Basic Input Output System — firmware stored in ROM/flash on the motherboard"],["UEFI","Unified Extensible Firmware Interface — modern replacement for BIOS"],["POST","Power On Self Test — BIOS checks RAM, keyboard, drives at start-up; error beeps if a part fails"],["Bootstrap loader","Small program that loads the operating system into RAM"],["Booting","Starting the computer and loading the operating system"],["Cold booting","Starting from power OFF — pressing the power button"],["Warm booting","Restarting a computer that is already ON — Restart or Ctrl+Alt+Del"],["Boot order","Sequence of drives BIOS checks for an OS (HDD, USB, DVD)"],["Firmware","A program permanently written into hardware."],["BIOS functions","Run the boot-up process, keep the system clock, set the boot order."],["Loader","The 2nd program; also called bootstrap loader; its working is called bootstrapping; part of the OS; loads OS files from the magnetic disk (MBR at sector S1) into main memory."]]},{"k":"table","title":"Ports and slots","head":["Port / slot","Full form","Use"],"rows":[["PS/2","Personal System/2","Round 6-pin port: purple for keyboard, green for mouse"],["Serial port (COM)","Serial","Sends one bit at a time; slow, long distance (old modem, mouse)"],["Parallel port (LPT)","Parallel","Sends 8 bits at a time; 25-pin; old printers"],["USB","Universal Serial Bus","Multipurpose plug-and-play port; Type A has 4 pins, Type C has 24 pins"],["VGA","Video Graphics Array/Adapter","Analog video to monitor (15-pin)"],["DVI","Digital Visual Interface","Digital video to monitor"],["DisplayPort","Display Port","Digital audio-video to monitors"],["HDMI","High-Definition Multimedia Interface","High-quality digital audio AND video in one cable"],["Ethernet / LAN port","RJ45 connector","Wired network/internet"],["3.5 mm audio jack","Audio","Headphones, speakers, microphone"],["PCI / PCIe slot","Peripheral Component Interconnect (Express)","Expansion cards; PCIe slot is used for the graphics card"],["AGP","Accelerated Graphics Port","Old slot only for graphics cards"],["FireWire","IEEE 1394","Fast serial port for cameras (old Apple)"],["USB Type-C","Reversible USB connector","Charging, data and video on new devices"],["RJ-11","Registered Jack 11","Telephone line / dial-up modem"]]},{"k":"p","h":"<b>How the parts of a PC work together.<\/b> when you press a key, the keyboard sends a signal through a port on the motherboard. The motherboard's chipset (Southbridge for slow devices, Northbridge for CPU-RAM-graphics in older boards) carries it to the CPU. The CPU processes it using data in RAM and sends the result to the graphics card, which shows it on the monitor. The SMPS gives every part steady DC power, and the small CMOS battery keeps the clock running even when the computer is switched off."},{"k":"p","h":"<b>How the CPU runs one instruction (fetch-decode-execute).<\/b> the Program Counter holds the address of the next instruction. That address is copied to the MAR and sent on the address bus to RAM. RAM sends the instruction back on the data bus into the MDR/MBR, and then into the Instruction Register. The Program Counter moves to the next address. The Control Unit decodes the instruction, the ALU executes it, and the result goes to the accumulator or back to memory. Then the cycle repeats."},{"k":"ex","h":"<b>Worked example, address bus and memory size.<\/b> a system has a 20-line address bus and each address holds 1 byte. Step 1: number of locations = 2<sup>20<\/sup>. Step 2: 2<sup>20<\/sup> bytes = 1,048,576 bytes. Step 3: divide by 2<sup>20<\/sup> to get MB = 1 MB. So the maximum memory is 1 MB. With 16 lines: 2<sup>16<\/sup> = 65,536 bytes = 64 KB. With 32 lines: 2<sup>32<\/sup> bytes = 4 GB."},{"k":"trick","h":"Machine cycle — <span class='mn'>F D E S<\/span>: <b>F<\/b>riends <b>D<\/b>on't <b>E<\/b>at <b>S<\/b>amosa alone = Fetch, Decode, Execute, Store. PS/2 colours: <span class='mn'>P-K, G-M<\/span> — <b>P<\/b>urple <b>K<\/b>eyboard, <b>G<\/b>reen <b>M<\/b>ouse.<ul><li>Socket = Sits a chip (CPU); Slot = Slides a card (RAM, PCI).<\/li><li>SMPS = \"Sab Ko Mile Power Supply\": AC to DC. UPS = Umbrella for power: surge first, backup second.<\/li><li>CPU parts = \"ACM\": ALU calculates, CU commands, MU (registers) memorises.<\/li><li>PC = \"Pehle Counter\" points to the NEXT instruction; IR = \"Is Running\" holds the CURRENT one; MAR = Address; MDR/MBR = Data.<\/li><li>Flip-flops \"SR JK D T\" = \"Sir Jack Did Tea\".<\/li><li>Bus types \"DAC\": Data, Address, Control; Address bus Alone decides max memory.<\/li><li>Serial = Single bit; Parallel = Plenty of bits (8) at once.<\/li><li>HDMI = \"Har Drishya, Music In-one cable\": audio + video.<\/li><li>POST = Power On Self Test, done by BIOS before the OS loads.<\/li><\/ul>"},{"k":"trap","h":"<b>ALU calculates, CU controls<\/b> — the CU never adds numbers. <b>Program Counter<\/b> holds the address of the <i>next<\/i> instruction, the <b>Instruction Register<\/b> holds the <i>current<\/i> one. <b>Cold<\/b> boot = from power-off; <b>warm<\/b> boot = restart. <b>HDMI<\/b> carries audio + video; <b>VGA<\/b> is video only and analog. <b>Serial<\/b> = one bit at a time (USB is serial, despite being fast); <b>parallel<\/b> = many bits together. BIOS lives in <b>ROM<\/b>, not RAM. SMPS changes AC to DC; UPS gives back-up.<ul><li>Every motherboard is a PCB, but every PCB is not a motherboard.<\/li><li>UPS: some books give surge protection as its first job and backup as its second; many simply say \"provides backup power\". Both answers can appear, so read the options.<\/li><li>A physical connector that connects chips is a SOCKET, not a slot.<\/li><li>Hard disk, keyboard, printer and OMR are NOT parts of the CPU; cache memory IS inside the CPU.<\/li><li>The brain of the computer is the CPU, not the ALU or CU alone.<\/li><li>Program Counter holds the address of the NEXT instruction; MAR holds the address of the CURRENT memory location being accessed.<\/li><li>Registers are inside the CPU, not part of main memory (so \"Only II\" in the statement question).<\/li><li>Address bus decides maximum memory, not the data bus.<\/li><li>Clock speed is measured in MHz/GHz, not in bytes or bits per second.<\/li><li>NVIDIA is a GPU maker; Intel, AMD and Qualcomm make CPUs.<\/li><li>Word length is measured in bits.<\/li><li>\"Addressing mode\" relates to the microprocessor.<\/li><li>The basic computation unit of a CPU is the core.<\/li><li>USB full form is Universal Serial Bus.<\/li><li>A controlling unit of a microcomputer on one chip is a microprocessor.<\/li><\/ul>"}],"sum":["The CPU has a Control Unit (directs), an Arithmetic Logic Unit (calculates and compares) and registers (fastest storage).","The machine cycle is Fetch, Decode, Execute, Store; clock speed is measured in hertz (GHz today).","Buses: data bus carries data (two-way), address bus carries locations (one-way), control bus carries signals.","BIOS in ROM runs POST and loads the OS; cold boot starts from power off, warm boot is a restart.","Ports: USB (Universal Serial Bus), HDMI (audio and video), VGA (analog video), RJ-45 (Ethernet), PS/2 (keyboard and mouse).","The motherboard (a PCB) holds the CPU socket, RAM slots, PCI/AGP slots, chipset, CMOS battery and power connector.","SMPS turns AC into DC; UPS protects from surges and gives backup; DMA lets devices use RAM without the CPU.","The CPU (brain) = ALU + CU + registers (memory unit); it follows fetch-decode-execute.","PC = next instruction address, MAR = memory address, MDR/MBR = data, IR = current instruction, accumulator = ALU results.","Registers are the fastest memory and are made of flip-flops (1 bit each).","Data bus carries data, address bus carries location (decides max memory), control bus carries signals.","Serial port = 1 bit at a time; USB = multipurpose; HDMI = HD audio + video; PCIe = graphics card.","Clock speed is in MHz/GHz; cores: single (oldest), dual, quad, octa.","Booting: BIOS (in ROM) → POST → loader (bootstrap) → OS loaded from disk to RAM; cold boot = start, warm boot = restart."],"part":["Part 1 · Hardware","हार्डवेयर"]},
{"id":"C3","g":"cmp","heat":3,"title":"Input devices, keyboard & mouse","hi":"इनपुट उपकरण, कीबोर्ड एवं माउस","blocks":[{"k":"hot","h":"A sure 1–2 marks: <b>MICR<\/b> for bank cheques, <b>OMR<\/b> for answer sheets, <b>OCR<\/b> for printed text, <b>which device is input<\/b>, the <b>keys<\/b> of the keyboard and devices that are <b>both input and output<\/b>.<br><br>\"Which of these is an input device\", \"which device reads answer sheets\", \"which reads cheques\", \"which key is a toggle key\", \"who invented the mouse\" and \"which device is both input and output\" are asked in almost every CHSL, MTS, NTPC and Group D paper. SSC CGL Tier-II 2023 asked OCR directly. These are among the easiest marks in the whole subject."},{"k":"story","h":"<p>A computer cannot see, hear or speak by itself. It needs <b>input devices<\/b> to receive information from us and <b>output devices<\/b> to show results back. Think of a <b>post office<\/b>: the letter box where you drop letters is input, the sorting room inside is the CPU, and the postman who delivers to your door is output.<\/p><p>The <b>keyboard<\/b> and <b>mouse<\/b> are the everyday letter boxes. Special readers do special jobs: a bank's machine reads the magnetic numbers printed at the bottom of every cheque (<b>MICR<\/b>), an exam centre's machine reads the darkened circles on answer sheets (<b>OMR<\/b>), and a shop counter reads barcodes.<\/p><p>On the output side, a <b>monitor<\/b> gives a temporary picture called <b>soft copy<\/b>, while a <b>printer<\/b> gives paper called <b>hard copy<\/b>. Some printers hit the paper like a typewriter (<b>impact<\/b>); others spray ink or use a laser without touching it (<b>non-impact<\/b>). A <b>touch screen<\/b> does both jobs at once: you give input by touching the same glass that shows output.<\/p>","key":"Input = data in, output = results out; soft copy on screen, hard copy on paper; touch screen does both."},{"k":"facts","title":"Hardware and software","rows":[["Hardware","Physical, tangible parts you can see and touch: keyboard, mouse, monitor, CPU."],["Software","Programs; intangible, you can see them on screen but cannot touch them: MS-Office, Windows."],["Computer","A combination of hardware and software; both need each other."],["Statement check","\"All components are either hardware or software\" = correct. \"All components are hardware AND software\" = wrong."],["Exception","Keyboard is hardware (physical device) and also software (on-screen/virtual keyboard)."],["Hardware groups","Input devices, output devices, storage devices."],["Peripheral devices","Devices attached to the computer from outside: input, output and external storage devices (keyboard, mouse, monitor, printer). Input devices ARE peripheral devices."]]},{"k":"table","title":"Input devices","head":["Device","Full form","Main use"],"rows":[["Keyboard","—","Typing text and commands; most common input device"],["Mouse","—","Pointing device: point, click, drag and drop"],["BCR","Bar Code Reader","Reads bar codes on products at shop counters"],["OCR","Optical Character Reader/Recognition","Reads printed text character by character by recognising the SHAPE of characters; converts it to editable text"],["OMR","Optical Mark Reader/Recognition","Reads pen/pencil marks on answer sheets (exam OMR sheets)"],["MICR","Magnetic Ink Character Recognition","Reads magnetic-ink numbers on bank cheques"],["Kimball tag reader","—","Reads punched price tags in clothing shops"],["Scanner","—","Copies a printed page or photo into the computer as an image"],["Joystick","—","Controls games and simulators"],["Stylus","—","Pen-like device used with tablets and PDAs"],["Light pen","—","Pen-like device used to point or draw directly on a CRT monitor"],["Trackball","—","Upside-down mouse; you roll the ball with your thumb"],["Touchpad","—","Flat pad on laptops that works like a mouse"],["Microphone","—","Voice input"],["Biometric sensor","—","Identifies a person by fingerprint, face, iris or voice (physical traits)"],["Webcam / camera","—","Video and photo input"],["Digitizer / graphics tablet","—","Converts hand drawings into digital form"],["Trick for the \"R\" devices","R = Reader or Recognition","OCR, OMR, MICR, BCR all end in Reader/Recognition"],["QR code scanner","Quick Response code — 2-D square code (Denso Wave, Japan)","UPI payments, tickets, links"]]},{"k":"facts","title":"Keyboard","rows":[["Inventor","Christopher Latham Sholes, 1873-74; the first keyboard was for the typewriter."],["Layout","QWERTY (named from the first six letters of the top letter row)."],["Top letter row","Q W E R T Y U I O P."],["Home row","A S D F G H J K L; (fingers rest here)."],["Number of keys","Standard US QWERTY 101; IBM PC 83; Windows laptop 86; Microsoft standard US 104; Apple standard with numeric pad 109; multimedia keyboards have no fixed number."],["Other layouts","QWERTY, AZERTY, QWERTZ, DVORAK, COLEMAK, MELTRON, JCUKEN."],["Keys present twice","5 keys: Ctrl, Alt, Shift, Enter, Windows."],["Toggle keys","Caps Lock, Num Lock (and Scroll Lock): press once ON, again OFF."],["Modifier keys","Ctrl, Alt, Shift: used with other keys (Ctrl + A = select all; Shift + 2 = @)."],["Navigation keys","Arrow keys, Home, End, Page Up, Page Down."],["Cursor control keys","Arrow keys."],["Command execute key","Enter."],["Longest key","Spacebar."],["Numpad","Num Lock ON = numbers; Num Lock OFF = arrows (8 up, 4 left, 6 right, 2 down)."],["Function keys","F1 to F12 (Fn key extra on laptops)."],["Special characters","! @ # $ % ^ &amp; * sit on number keys 1 to 0, typed with Shift."],["QWERTY","Named after the first six letters of the top letter row"],["Home row keys","A S D F and J K L ; — F and J have small bumps"],["Backspace vs Delete","Backspace erases to the LEFT of the cursor; Delete erases to the RIGHT"]]},{"k":"table","title":"What each key does","head":["Key","Action","Extra"],"rows":[["Esc","Exit / cancel a program or menu","Ends a slide show"],["Tab","Moves forward / font-size=\"10.5\" class=\"b\">Modifier and control<\/text><rect x=\"505\" y=\"214\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#2f8f4e\"/><text x=\"521\" y=\"224\" font-size=\"10.5\" class=\"b\">Navigation (arrows)<\/text><\/svg><\/figure>","cap":"QWERTY layout (Christopher Sholes, 1870s). A full keyboard has about 104 keys, including the numeric keypad on the right."},{"k":"facts","title":"Mouse","rows":[["Inventor","Douglas Engelbart; first mouse was wooden; publicly shown in 1968 (prototype 1964)."],["Buttons","Minimum 2, maximum 5."],["Technology","Surface motion detection."],["Wired / wireless","Wired uses USB; wireless (cordless) uses short-range radio waves."],["Type of device","Pointing device."],["Left click","Select / point."],["Right click","Opens the context (shortcut) menu."],["Double click","Opens a file or program."],["Wheel","Between the two buttons; used for vertical scrolling."],["Drag and drop","Like cut and paste using the mouse."],["Types of mouse","Normal, gaming, inertial/gyroscopic (air mouse), ergonomic, puck."]]},{"k":"facts","title":"Touch screen","rows":[["Layers","Touch panel (input) → Indium Tin Oxide layer → (x, y) grid → display (output). The (x, y) point goes to the CPU and the result is shown on the display."],["Capacitive touch","Most phones use it. Projected capacitive = multi-touch; surface capacitive = single touch."],["Types of touch screen","Capacitive, resistive, surface acoustic wave, optical imaging, infrared grid, acrylic projection, acoustic pulse recognition, dispersive signal technology."],["Uses","ATMs, public information kiosks, smartphones, tablets."]]},{"k":"facts","title":"Devices that are both input and output","rows":[["Touch screen","Takes touch input and shows output."],["Handycam / digital camera","Records (input) and plays back on its screen (output)."],["Sound card","Takes mic input and gives speaker output."],["NIC","Network Interface Controller Card: sends and receives network data."],["MODEM","Modulator-Demodulator: sends and receives over telephone lines."],["Headset with microphone","Speaker = output, mic = input"],["Multifunction printer (MFP)","Scanner = input, printer = output"],["Storage drives (pen drive, HDD)","Read (input) and write (output) — often called I/O devices"]]},{"k":"p","h":"<b>How OCR, OMR and MICR differ.<\/b> all three read paper, but they read different things. OMR does not read letters at all; it only checks whether a bubble is darkened, so it is used for exam answer sheets and survey forms. OCR reads the shape of printed letters and turns a scanned page into editable text. MICR reads numbers printed with special magnetic ink at the bottom of bank cheques; because the ink is magnetic, it can be read even if someone writes or stamps over it. So: bubbles = OMR, printed text = OCR, cheques = MICR, product stripes = BCR."},{"k":"trick","h":"Bank, Exam, Text — <span class='mn'>M-O-O<\/span>: <b>M<\/b>ICR = Money (cheques), <b>O<\/b>MR = Objective answer sheets (Marks), <b>O<\/b>CR = Ordinary text (Characters).<ul><li>\"OMR for Marks, OCR for Characters, MICR for Money (cheques), BCR for Bills (shop bar codes)\".<\/li><li>Keys present twice: \"CASE-W\" = Ctrl, Alt, Shift, Enter, Windows.<\/li><li>Toggle keys = \"Lock\" keys: Caps Lock, Num Lock, Scroll Lock.<\/li><li>Backspace goes Back (left); Delete goes ahead (right).<\/li><li>QWERTY was made by Sholes: \"Sholes Shaped QWERTY\".<\/li><li>Mouse = \"Engel-mouse\": Engelbart, 1968.<\/li><li>Light pen = CRT; stylus = tablet.<\/li><\/ul>"},{"k":"trap","h":"MICR (cheques) vs OCR (printed text) vs OMR (bubbles) — the most swapped trio. Light pen and scanner are input. A touch screen is both input and output.<ul><li>Home, End, Page Up and Page Down are NAVIGATION keys, not numeric or function keys.<\/li><li>Num Lock is a toggle key; Ctrl and Alt are modifier keys, not toggle keys.<\/li><li>Touch screen is BOTH input and output.<\/li><li>Printer, monitor and speaker are NOT input devices.<\/li><li>Input devices ARE peripheral devices; a statement saying they are not is incorrect.<\/li><li>OCR identifies the SHAPE of characters, not their colour or ink.<\/li><li>Delete removes the character to the RIGHT; Backspace removes the character to the LEFT.<\/li><li>A light pen is used with a CRT monitor; a stylus is used with tablets and PDAs.<\/li><li>MICR reads cheques; OMR reads answer sheets. Examiners swap them.<\/li><\/ul>"}],"sum":["Input devices send data in: keyboard, mouse, scanner, MICR, OCR, OMR, barcode/QR reader, light pen, joystick, microphone.","MICR reads bank cheques, OMR reads answer-sheet bubbles, OCR turns printed text into editable text.","Monitors: CRT (Cathode Ray Tube), LCD (Liquid Crystal Display), LED (Light Emitting Diode), OLED (Organic LED); pixel is the smallest dot.","Impact printers: dot matrix, daisy wheel, line; non-impact: inkjet, laser, thermal; plotters draw large designs.","Touch screen, modem, headset and multifunction printer are both input and output; screen gives soft copy, printer hard copy.","Hardware is touchable; software is not; a computer needs both.","Both input and output: touch screen, modem, NIC, sound card, digital camera.","Keyboard: Sholes 1873-74, QWERTY; 101 keys standard; Ctrl, Alt, Shift, Enter, Windows appear twice.","Toggle keys: Caps Lock, Num Lock; navigation keys: arrows, Home, End, PgUp, PgDn.","Mouse: Douglas Engelbart, 1968; left click selects, right click opens context menu, wheel scrolls."],"part":["Part 1 · Hardware","हार्डवेयर"]},
{"id":"C18","g":"cmp","heat":3,"title":"Output devices: monitors & printers","hi":"आउटपुट उपकरण: मॉनिटर एवं प्रिंटर","blocks":[{"k":"hot","h":"Expect one question on output devices in most papers: \"which is an output device\", \"which printer is non-impact\", \"which printer works like a typewriter\", \"plotter is used for\", \"laser printer speed is measured in\" or \"what is a pixel\". SSC CGL Tier-II 2022 (2 March 2023) asked a statement question on laser printers, and CHSL asked plotter as an output device."},{"k":"story","h":"<p>After the kitchen (CPU) cooks the food, someone has to serve it. Output devices (आउटपुट डिवाइस) are the waiters that bring results to you: the monitor shows them, the speaker says them, the printer writes them on paper and the projector throws them onto a wall.<\/p><p>What you see on a screen disappears when you switch it off; that is a soft copy. What comes out on paper stays; that is a hard copy (हार्ड कॉपी). A printer gives hard copy.<\/p><p>Printers are of two families. Some hit the paper like an old typewriter: a hammer, pins or a wheel strike an ink ribbon. These impact printers are noisy and cheap. Others never touch the paper hard; they spray ink, burn special paper or use a laser and powder. These non-impact printers are quiet and give better quality.<\/p><p>A picture on the screen is made of tiny dots called pixels (पिक्सेल). The more pixels across and down, the sharper the picture: that number is the resolution. How many times per second the screen redraws itself is its refresh rate.<\/p>","key":"Monitor = soft copy, printer = hard copy; impact printers hit, non-impact printers spray, burn or use laser."},{"k":"facts","title":"Output basics","rows":[["Output devices","Monitor (display/VDU), printer, speaker, projector, plotter, headphones."],["Data and information","Data → input → CPU processing → output → information."],["Soft copy","Output shown on screen; not permanent."],["Hard copy","Output printed on paper (printout)."],["Peripheral devices","Monitors, printers, keyboards etc. connected to the computer are collectively called peripheral devices."],["Device driver","A small program that lets the computer use a printer, scanner or any new device; it must be installed before the device works. It is a utility/system program."]]},{"k":"facts","title":"Monitor and display","rows":[["Pixel","Picture element: the smallest dot of an image. An image is composed of pixels."],["Colour pixel","Made of 3 colour dots: Red, Green, Blue (RGB)."],["Resolution","Number of pixels across x down, e.g. 1280 x 720 (columns x rows)."],["Refresh rate","Also called vertical refresh rate or vertical scan rate: how many times per second the screen is redrawn; measured in Hertz (Hz)."],["FPS","Frames Per Second; a frame is one image."],["SD quality","144p, 240p, 360p, 480p."],["HD quality","720p (HD), 1080p (Full HD, FHD); QHD = Quad HD (1440p); 4K = UHD = 3840 x 2160 (about 4,000 columns); 8K."],["\"p\"","Progressive scan."],["Monitor types","CRT (Cathode Ray Tube), TFT (Thin Film Transistor), LCD (Liquid Crystal Display), LED (Light Emitting Diode), OLED (Organic LED), AMOLED (Active Matrix Organic LED)."],["VGA cable","Video Graphics Array/Adapter cable; if a monitor shows nothing, the VGA cable may be faulty."]]},{"k":"table","title":"Output devices — monitors","head":["Display","Full form","Key point"],"rows":[["CRT","Cathode Ray Tube","Old, bulky, electron gun; heavy and uses more power"],["LCD","Liquid Crystal Display","Flat; liquid crystals need a backlight"],["LED","Light Emitting Diode","LCD panel lit by LEDs — thinner, brighter, less power"],["OLED","Organic Light Emitting Diode","Each pixel makes its own light — no backlight, true black, can bend"],["Plasma","Plasma display panel","Older large flat TVs"],["Pixel","Picture Element","Smallest dot of an image on screen"],["Resolution","Pixels across × down (e.g. 1920 × 1080 = Full HD)","More pixels = sharper picture"],["Refresh rate","Measured in hertz (Hz)","Times per second the screen is redrawn"],["Screen size","Measured diagonally, in inches","—"],["VDU","Visual Display Unit","Another name for the monitor"]]},{"k":"facts","title":"Printer basics","rows":[["Printer","Gives hard copy (printout)."],["Print spooling","SPOOL = Simultaneous Peripheral Operation On-Line. The print command and data wait in the printer's internal memory (a few MB) until printed, so you can keep working."],["Connection","Wired: parallel cable (25 pins) or USB (4 pins); wireless: short-range radio."],["Print shortcut","Ctrl + P or Ctrl + Shift + F12; Print Preview = Ctrl + F2."],["Printer languages","PCL (Printer Command Language) or PDL (Page Description Language) for normal printing; PostScript for high-quality graphics."],["Collated","Default; prints complete sets in order: 1-2-3, 1-2-3, 1-2-3 (sorts multiple copies)."],["Uncollated","Prints all copies of page 1, then page 2: 1-1-1, 2-2-2, 3-3-3 (printing press style)."],["Speed units","CPS = Characters Per Second; LPM = Lines Per Minute; PPM = Pages Per Minute."],["Print quality","DPI = Dots Per Inch."],["Common printer errors","Paper jam, toner/ink empty, loose cables. \"No permission to use the printer\" is an access issue, not a printer error."]]},{"k":"table","title":"Types of printers","head":["Printer","Impact / Non-impact","How it works","Speed unit","Prints"],"rows":[["Daisy wheel","Impact","First commercial printer (1980s); 96-character wheel strikes ribbon; like a computerised typewriter","CPS","Text only"],["Dot matrix (pin printer)","Impact","9 to 24 pins hit the ribbon; cheapest and noisiest; a character printer","CPS","Text only"],["Line printer","Impact","Prints a complete line at a time; chain, drum or band types; one font only","LPM","Text only"],["Pen plotter","Impact","Pens draw on large paper; best for engineering drawings, CAD and CAM","—","Text + images"],["Thermal","Non-impact","Heat on special paper; POS billing machines; Zink (zero ink) printer","CPS","Text only"],["Inkjet","Non-impact","Sprays tiny drops of liquid ink through nozzles; wet printing; best for photo printing; CMYK cartridges","PPM","Text + images"],["Laser","Non-impact","Laser + powder ink (toner cartridge); corona wire; fastest; prints multiple copies","PPM","Text + images"],["UV printer","Non-impact","Ink dried by UV light; images and banners","—","Images"],["Dye-sublimation","Non-impact","Dye turns from solid to gas; printing on clothes; CMYK dye","—","Images"],["3D printer","—","Builds solid objects layer by layer; sculptures","—","Objects"]]},{"k":"table","title":"Other output devices and print terms","head":["Device","Type","Key point"],"rows":[["Plotter","Output (flatbed / drum)","Large drawings, maps, engineering/CAD designs"],["Speaker / headphones","Output","Sound"],["Projector","Output","Shows screen on a large wall/screen"],["DPI","Dots Per Inch","Print (and scanner) resolution"],["PPI","Pixels Per Inch","Screen sharpness"]]},{"k":"facts","title":"Colour and printer terms","rows":[["CMYK","Cyan (sea-blue), Magenta (pink-red), Yellow, Key (Black)."],["LASER","Light Amplification by Stimulated Emission of Radiation."],["Plotter","Converts digital information into pictorial form (drawings) on large paper."],["Impact printer","Works like a typewriter: something strikes the paper through a ribbon."],["Laser printer process","About 7 steps: processing, charging, exposing (writing), developing, transferring, fusing, cleaning."]]},{"k":"p","h":"<b>How a laser printer works (simple steps).<\/b> a drum gets an electric charge. A laser beam \"draws\" the page on the drum by removing charge where the text and pictures go. The toner powder sticks only to those spots. The paper rolls over the drum and the toner moves onto the paper. Hot rollers (the fuser) melt the toner so it sticks. Because the whole page is drawn at once, laser printers are fast and are rated in pages per minute."},{"k":"p","h":"<b>Choosing the right printer.<\/b> shop bills need cheap, quick, small prints, so thermal. Photos need smooth colour, so inkjet. Offices need many fast pages, so laser. Railway and bank multi-copy forms with carbon need striking force, so dot matrix. Engineering drawings on big sheets need a plotter."},{"k":"trick","h":"Impact printers — <span class='mn'>D D L<\/span>: <b>D<\/b>ot matrix, <b>D<\/b>aisy wheel, <b>L<\/b>ine. Speed units follow the printer: dot matrix in <b>C<\/b>PS (characters), line printer in <b>L<\/b>PM (lines), laser in <b>P<\/b>PM (pages).<ul><li>Impact printers \"DDL\": Daisy wheel, Dot matrix, Line (they hit like Dandas). Non-impact \"TIL\": Thermal, Inkjet, Laser.<\/li><li>Speed units: Character printers = CPS, Line printer = LPM, Page printers (laser, inkjet) = PPM.<\/li><li>Inkjet = \"Ink jets out\" (sprays); Laser = \"Light and powder\".<\/li><li>CMYK: \"Cyan Mangoes Yellow Kala (black)\".<\/li><li>Collated = Complete sets (1-2-3, 1-2-3).<\/li><li>Resolution goes \"SD → HD 720 → Full HD 1080 → QHD → 4K → 8K\".<\/li><\/ul>"},{"k":"trap","h":"Laser and inkjet are non-impact; dot matrix is impact. Plotter is output, not input. Monitor is output only. DPI is for print, PPI for screens.<ul><li>Laser and inkjet are NON-impact; dot matrix, daisy wheel and line printers are impact.<\/li><li>Laser printer speed is in pages per minute (PPM), not CPS.<\/li><li>For large CAD drawings, use a plotter, not an inkjet.<\/li><li>A laser printer CAN print multiple copies at a time; the statement \"cannot print multiple copies\" is the incorrect one.<\/li><li>The daisy wheel was the first COMMERCIAL printer; it prints text only.<\/li><li>Dot matrix printer is also called a pin printer and a character printer, not a page printer.<\/li><li>Print preview is Ctrl + F2, not Ctrl + P.<\/li><li>A pixel is the smallest element of an image; a colour pixel has 3 dots (RGB), not 16 or 28.<\/li><\/ul>"}],"sum":["Output devices show results: monitor (soft copy), printer (hard copy), speaker, projector, plotter.","Monitors: CRT (Cathode Ray Tube), LCD (Liquid Crystal Display), LED, OLED; the pixel is the smallest dot; resolution is pixels across × down.","Impact printers (dot matrix, daisy wheel, line) strike a ribbon; non-impact printers (inkjet, laser, thermal) do not.","Speed: dot matrix in CPS, line printer in LPM, laser in PPM; print quality in DPI.","Pixel = smallest picture element; resolution = pixels across x down; refresh rate in Hz.","Monitor types: CRT, TFT, LCD, LED, OLED, AMOLED.","Impact: daisy wheel (first commercial), dot matrix (pins, noisiest), line (LPM).","Non-impact: thermal (bills), inkjet (sprays ink, photos), laser (toner, fastest, PPM).","Plotter = large engineering/CAD drawings; spooling holds print jobs in printer memory; collated = 1-2-3, 1-2-3."],"part":["Part 1 · Hardware","हार्डवेयर"]},
{"id":"C4","g":"cmp","heat":3,"title":"Memory: RAM, ROM, cache & units","hi":"मेमोरी: रैम, रोम, कैश एवं इकाइयाँ","blocks":[{"k":"hot","h":"Asked in nearly every paper: <b>which memory is volatile<\/b> (RAM), <b>1 nibble = ? bits<\/b>, <b>largest/smallest unit<\/b>, <b>ROM types (PROM, EPROM, EEPROM)<\/b>, <b>SRAM vs DRAM<\/b>, and <b>fastest memory<\/b> (registers, then cache).<br><br>Memory is asked in almost every computer section: \"which memory is volatile\", \"which RAM needs refreshing\", \"which memory communicates directly with the CPU\", \"where is firmware stored\", \"fastest memory\" and \"EPROM is erased by\". SSC CGL Tier-II asked cache in 2022 and 2023 and DRAM refresh in 2024; RRB NTPC 2025 asked ROM and RAM. Learn the speed order and the ROM family well."},{"k":"story","h":"<p>Imagine a <b>library<\/b> with a student studying at a desk. The student is the CPU. The few papers held in hand are the <b>registers<\/b>: tiny but instant. The open books on the desk are the <b>cache<\/b>: small, very quick to reach. The bookshelf beside the desk is <b>RAM<\/b>: bigger, a little slower. The library's store room is <b>secondary storage<\/b> such as the hard disk: huge, but you must fetch a book to the desk before reading it.<\/p><p>When the library closes (power goes off), the desk and shelf are cleared. That is why RAM is <b>volatile<\/b>: it forgets everything without power. The rule book printed into the wall never changes; that is <b>ROM<\/b>, which keeps its contents and holds the start-up instructions.<\/p><p>All memory is counted in <b>bits<\/b> (a single 0 or 1). Four bits make a <b>nibble<\/b>, eight bits make a <b>byte<\/b>, and from there sizes grow by 1024 each step: KB, MB, GB, TB and beyond.<\/p>","key":"Faster memory is smaller and costlier; RAM forgets without power, ROM does not."},{"k":"facts","title":"Memory as hardware","rows":[["RAM","Hardware chip (yes)."],["ROM","Hardware chip (yes)."],["Cache","Hardware: L2 and L3 chips (older boards) and L1 inside the CPU with no separate hardware."],["Virtual memory (VM)","NOT separate hardware; it is space reserved on the hard disk."],["Registers","NOT separate hardware chips; they are inside the CPU."],["Primary memory","RAM and ROM; also called main memory or internal memory."],["Secondary memory","Also called auxiliary memory: tape, disks, optical discs, pen drive, memory card, SSD."],["Volatile memory","Loses data when power goes: RAM and cache."],["Non-volatile memory","Keeps data without power: ROM, flash, tape, disks, CD, DVD, BD, pen drive, memory card, SSD."]]},{"k":"table","title":"Memory units","head":["Unit","Equals","Note"],"rows":[["Bit","Binary digit — 0 or 1","Smallest unit of data"],["Nibble","4 bits","Half a byte"],["Byte","8 bits","Stores one character (ASCII)"],["Kilobyte (KB)","1024 bytes","2^10 bytes"],["Megabyte (MB)","1024 KB","2^20 = 1,048,576 bytes"],["Gigabyte (GB)","1024 MB","2^30 bytes"],["Terabyte (TB)","1024 GB","2^40 bytes"],["Petabyte (PB)","1024 TB","2^50 bytes"],["Exabyte (EB)","1024 PB","2^60 bytes"],["Zettabyte (ZB)","1024 EB","2^70 bytes"],["Yottabyte (YB)","1024 ZB","2^80 bytes — largest unit in the usual exam list"]]},{"k":"facts","title":"Binary vs decimal counting","rows":[["Binary (computer memory)","1 KB = 1024 bytes (2^10)"],["Decimal (disk makers, SI)","1 kB = 1000 bytes"],["IEC names for binary","KiB, MiB, GiB (kibibyte, mebibyte, gibibyte)"],["1 byte","8 bits"],["1 KB in bits","8 × 1024 = 8192 bits"],["1 MB in bytes","1,048,576 bytes"],["Word","Number of bits a CPU handles at once — 32-bit, 64-bit"],["Newer SI prefixes (2022)","ronna (R) and quetta (Q) beyond yotta — exams still treat YB as the largest"]]},{"k":"facts","title":"RAM","rows":[["RAM","Random Access Memory: main memory, internal, volatile, primary."],["Also called","RWM (Read Write Memory) [exam favourite]."],["Structure","A grid of memory cells; each cell has a unique address, like a house number; each cell stores one bit."],["Access","Random read and random write."],["Job","Holds running programs and data temporarily; the CPU reads and writes it directly. More RAM = better speed and capability."],["DRAM","Dynamic RAM: must be refreshed again and again (refreshing memory); made of capacitors and transistors; cheaper and slower; used in normal computers. Refreshing recharges the capacitors that store the bits."],["SRAM","Static RAM: no refreshing; made of flip-flops and transistors; costly and faster; used in special systems like Air Traffic Control and the stock exchange (BSE), and as cache."],["SDRAM","Synchronous DRAM. Today's computers use DDR5-SDRAM."],["DDR generations","SDR (Single Data Rate) moves data once per clock; DDR (Double Data Rate) moves data twice per clock; DDR2, DDR3, DDR4, DDR5 each move more data per clock. \"signals per clock pulse\" as 2, 4, 8, 16, 32 for DDR to DDR5."]]},{"k":"facts","title":"ROM family","rows":[["ROM","Read Only Memory: primary, non-volatile. Used to store software that does not need updates (firmware)."],["Masked ROM (M-ROM)","Written once at the factory; property WORM = Write Once Read Many."],["BIOS","Basic Input Output System: the boot-up program stored in ROM; the first program that runs."],["Booting","Starting the computer; cold booting = start, warm/hot booting = restart."],["Shadowing","Copying BIOS from ROM to RAM so it runs faster (BIOS shadow = ROM to RAM)."],["PROM","Programmable ROM: blank chip, programmed once by the user, cannot be erased."],["EPROM","Erasable Programmable ROM: blank, erased by Ultra-Violet (UV) rays."],["EEPROM","Electrically Erasable Programmable ROM: erased electrically, byte by byte (slow: 8 times for 8 bits)."],["Flash EEPROM (flash memory)","Electrically erasable block by block (sector), so faster than EEPROM; non-volatile. Used in pen drives (USBFD), memory cards and SSDs."],["Firmware","A program permanently written on a hardware chip; stored in ROM."]]},{"k":"facts","title":"Cache memory","rows":[["Caching","Like hoarding: keeping a copy of what you will need soon."],["Cache","Small, very fast memory between the CPU and RAM; holds copies (duplicate values) of frequently used RAM data and instructions."],["Cache hit","The CPU finds the needed data in the cache."],["Position","Closest memory to the CPU after registers; \"middle memory\" between CPU and RAM."],["Levels","L1 (inside CPU, fastest, smallest) → L2 → L3 → DRAM → hard disk."],["Access time","Time a memory takes to give data to the CPU. Cache has a very short access time."],["Size","Usually small; data is NOT kept permanently."],["Phone cache","Residual/temporary files; can be deleted safely."],["Web cache","Browser cache keeps repeated data from a server to save time."]]},{"k":"facts","title":"Virtual memory and registers","rows":[["Virtual memory","Extended RAM: space reserved on the hard disk used as RAM when RAM is full. By default its size is about equal to RAM and can go up to 3 times RAM."],["Swapping / paging","Moving pages between RAM and virtual memory (page replacement)."],["Registers","Store data inside the CPU; minimum access time of all memories."]]},{"k":"table","title":"Memory speed order","head":["Rank","Memory","Note"],"rows":[["1 (fastest)","Registers","Inside CPU"],["2","L1 cache","Inside CPU"],["3","L2 cache","—"],["4","L3 cache","—"],["5","SRAM","—"],["6","DRAM (main memory)","—"],["7","ROM / EEPROM / flash (pen drive, memory card, SSD)","—"],["8","Hard disk","Magnetic"],["9","Optical disc (CD/DVD/BD)","—"],["10 (slowest)","Magnetic tape","Sequential access"]]},{"k":"info","title":"The memory hierarchy","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 690 330\" role=\"img\" aria-label=\"Memory hierarchy from registers to magnetic tape\">\n  <rect x=\"285\" y=\"12\" width=\"90\" height=\"28\" rx=\"5\" fill=\"hsl(210,55%,40%)\" class=\"anim-in\" style=\"animation-delay:0ms\"/><text x=\"330\" y=\"30\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" style=\"fill:#fff\">Registers<\/text><rect x=\"259\" y=\"43\" width=\"142\" height=\"28\" rx=\"5\" fill=\"hsl(192,55%,42%)\" class=\"anim-in\" style=\"animation-delay:60ms\"/><text x=\"330\" y=\"61\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" style=\"fill:#fff\">L1 cache<\/text><rect x=\"233\" y=\"74\" width=\"194\" height=\"28\" rx=\"5\" fill=\"hsl(174,55%,44%)\" class=\"anim-in\" style=\"animation-delay:120ms\"/><text x=\"330\" y=\"92\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" style=\"fill:#fff\">L2 cache<\/text><rect x=\"207\" y=\"105\" width=\"246\" height=\"28\" rx=\"5\" fill=\"hsl(156,55%,46%)\" class=\"anim-in\" style=\"animation-delay:180ms\"/><text x=\"330\" y=\"123\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" style=\"fill:#fff\">L3 cache<\/text><rect x=\"181\" y=\"136\" width=\"298\" height=\"28\" rx=\"5\" fill=\"hsl(138,55%,48%)\" class=\"anim-in\" style=\"animation-delay:240ms\"/><text x=\"330\" y=\"154\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" style=\"fill:#fff\">SRAM<\/text><rect x=\"155\" y=\"167\" width=\"350\" height=\"28\" rx=\"5\" fill=\"hsl(120,55%,50%)\" class=\"anim-in\" style=\"animation-delay:300ms\"/><text x=\"330\" y=\"185\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" style=\"fill:#fff\">DRAM<\/text><rect x=\"129\" y=\"198\" width=\"402\" height=\"28\" rx=\"5\" fill=\"hsl(102,55%,52%)\" class=\"anim-in\" style=\"animation-delay:360ms\"/><text x=\"330\" y=\"216\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" style=\"fill:#fff\">ROM / EEPROM / flash<\/text><rect x=\"103\" y=\"229\" width=\"454\" height=\"28\" rx=\"5\" fill=\"hsl(84,55%,54%)\" class=\"anim-in\" style=\"animation-delay:420ms\"/><text x=\"330\" y=\"247\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" style=\"fill:#fff\">Hard disk<\/text><rect x=\"77\" y=\"260\" width=\"506\" height=\"28\" rx=\"5\" fill=\"hsl(66,55%,56%)\" class=\"anim-in\" style=\"animation-delay:480ms\"/><text x=\"330\" y=\"278\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" style=\"fill:#fff\">Optical disc<\/text><rect x=\"51\" y=\"291\" width=\"558\" height=\"28\" rx=\"5\" fill=\"hsl(48,55%,58%)\" class=\"anim-in\" style=\"animation-delay:540ms\"/><text x=\"330\" y=\"309\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"700\" style=\"fill:#fff\">Magnetic tape<\/text>\n  <text x=\"622\" y=\"64\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:#c0392b\">faster<\/text><text x=\"622\" y=\"80\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:#c0392b\">costlier<\/text><text x=\"622\" y=\"96\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:#c0392b\">smaller<\/text><path d=\"M648 108 V258\" stroke=\"var(--ink2)\" stroke-width=\"2\" marker-end=\"url(#mp)\"/>\n  <text x=\"622\" y=\"280\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:#2f6db5\">slower<\/text><text x=\"622\" y=\"296\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:#2f6db5\">cheaper<\/text><text x=\"622\" y=\"312\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:#2f6db5\">bigger<\/text><defs><marker id=\"mp\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"var(--ink2)\"/><\/marker><\/defs><\/svg><\/figure>","cap":"Registers and cache sit inside the CPU; RAM is the main (primary) memory; disks, discs and tape are secondary storage that keeps data when the power goes off."},{"k":"facts","title":"Primary vs secondary and virtual memory","rows":[["Primary memory","RAM, ROM, cache — directly accessed by the CPU; also called main or internal memory"],["Secondary memory","HDD, SSD, CD, pen drive — NOT directly accessed; data is first loaded into RAM; also called auxiliary memory"],["Registers","Inside the CPU itself — fastest of all"],["Cache","High-speed buffer between CPU and RAM; stores frequently used data"],["Virtual memory","Part of the hard disk/SSD used as if it were extra RAM (page file / swap)"],["Buffer","Temporary area that holds data while it moves between devices"],["Volatile","RAM, cache, registers — lose data without power"],["Non-volatile","ROM, flash, HDD, SSD, CD/DVD — keep data without power"]]},{"k":"p","h":"Which answer for \"fastest memory\"? Read the options. If registers are in the options, registers are the fastest. If registers are not there and cache is, cache is the fastest. If neither is there, RAM beats ROM, hard disk and DVD. Two such questions with different answers for exactly this reason."},{"k":"p","h":"<b>How the CPU reads a file on the hard disk.<\/b> the CPU never reads secondary memory directly. The file is first copied from the hard disk into RAM; the CPU then reads it from RAM (often through the cache). This is why RAM size affects speed: if RAM is too small, the computer keeps swapping data with virtual memory on the slow hard disk."},{"k":"p","h":"<b>Why DRAM needs refreshing.<\/b> each DRAM bit is a tiny capacitor that slowly leaks its charge. The memory controller re-reads and re-writes (recharges) every cell thousands of times a second. SRAM uses flip-flops that hold their state while power is on, so it needs no refresh."},{"k":"p","h":"<b>Two's complement.<\/b> flip every bit (1's complement) and add 1. For 4-bit 1000: flip → 0111, add 1 → 1000. In 8 bits, -1 = 11111111."},{"k":"p","h":"<b>Comparing sizes.<\/b> convert to one unit. 3500 KB is about 3.4 MB, which is smaller than 2 GB. 2350 bytes is bigger than 2 KB (2048 bytes). 25 KB is much smaller than 100 MB."},{"k":"trick","h":"ROM family by eraser — <span class='mn'>P-E-EE<\/span>: <b>P<\/b>ROM = Pen (ink, once only), <b>E<\/b>PROM = Eraser of light (UV), <b>EE<\/b>PROM = Electric Eraser. Units — <span class='mn'>K M G T P E Z Y<\/span>: <b>K<\/b>ing <b>M<\/b>ohan <b>G<\/b>ot <b>T<\/b>en <b>P<\/b>apayas, <b>E<\/b>ach <b>Z<\/b>esty and <b>Y<\/b>ellow.<ul><li>DRAM = \"Dynamic = Daily refresh\"; SRAM = \"Static = Stays, no refresh, Super fast, Super costly\".<\/li><li>ROM family in order of erasing: \"P-E-EE-Flash\" = Programmable (no erase), Erasable by UV, Electrically byte by byte, Flash block by block.<\/li><li>EPROM = \"E for UV Erase\"; EEPROM = \"Extra E = Electric\".<\/li><li>Volatile = \"Vanishes\" when power goes: RAM and cache.<\/li><li>Speed ladder \"Ram Can't Run Rapidly Here, Only Tortoise\": Registers, Cache, RAM, ROM, Hard disk, Optical, Tape.<\/li><li>BIOS shadow = \"ROM's shadow falls on RAM\": ROM to RAM.<\/li><li>Units after byte: \"King Mohan Gives Tea, Pepsi, Excellent Zeera Yogurt\" = KB, MB, GB, TB, PB, EB, ZB, YB.<\/li><li>Nibble = \"nibble a little\" = half a byte = 4 bits.<\/li><li>Capacities: \"7-4-25\" = CD 700 MB, DVD 4.7 GB, Blu-ray 25 GB.<\/li><\/ul>"},{"k":"trap","h":"<b>RAM is volatile, ROM is not<\/b>. <b>SRAM → cache<\/b> (fast, no refresh), <b>DRAM → main memory<\/b> (needs refresh) — exams swap these. <b>EPROM uses UV light<\/b>, <b>EEPROM uses electricity<\/b>. Fastest memory = <b>registers<\/b>; fastest memory <i>outside<\/i> the CPU core, between CPU and RAM = <b>cache<\/b>. The memory the CPU reads directly is <b>primary<\/b> memory; a hard disk is never read directly. Virtual memory is on the <b>disk<\/b>, not extra RAM chips. 1 nibble = <b>4<\/b> bits, not 8.<ul><li>RAM is volatile; flash, ROM and EEPROM are not.<\/li><li>Primary memory is also called internal or main memory.<\/li><li>DRAM needs refreshing; SRAM does not.<\/li><li>Cache is faster than RAM but is NOT permanent storage.<\/li><li>\"Memory that communicates directly with the CPU\": SSC's 2023 key (CGL Tier-II 2022 paper) gives CACHE. Some older textbooks say \"main memory\". In SSC exams choose cache when it is an option.<\/li><li>Virtual memory is on the hard disk; it is not a chip.<\/li><li>Firmware and BIOS are stored in ROM; the operating system itself is stored on the hard disk.<\/li><li>EPROM is erased by UV light; EEPROM is erased electrically.<\/li><li>ASCII is a character code, not a memory chip.<\/li><li>The smallest unit of data is the bit; the smallest physical unit on a disk is the sector.<\/li><\/ul>"}],"sum":["Bit is the smallest unit; 4 bits = 1 nibble; 8 bits = 1 byte; each larger unit is 1024 of the previous, up to YB.","RAM is volatile read/write main memory; SRAM is used for cache and DRAM (needs refreshing) for main memory.","ROM is non-volatile and holds firmware like BIOS; PROM is written once, EPROM is erased by UV light, EEPROM electrically.","Hierarchy, fastest to slowest: registers, cache, RAM, secondary storage; speed and cost per bit fall as size rises.","Primary memory is accessed directly by the CPU; secondary is not; virtual memory uses disk space as extra RAM.","Primary memory = RAM (volatile, read-write) + ROM (non-volatile, read only).","DRAM needs refreshing (capacitors, cheap); SRAM does not (flip-flops, fast, costly, used as cache).","ROM family: M-ROM, PROM, EPROM (UV), EEPROM (electric, byte), flash (electric, block).","BIOS is in ROM; shadowing copies it to RAM; booting can be cold or warm.","Cache sits between CPU and RAM and holds frequently used data; levels L1, L2, L3.","Virtual memory is hard-disk space used as extra RAM (swapping).","Speed: registers > cache > RAM > ROM/flash > hard disk > optical > tape.","Magnetic: tape (sequential), hard disk, floppy (1.44 MB, 3.5 inch); optical: CD 700 MB, DVD 4.7 GB, BD 25/50 GB; electrical: pen drive, memory card, SSD.","Disk: tracks (track 0 outermost), sectors (smallest unit), clusters; seek time = head moving to the track."],"part":["Part 1 · Hardware","हार्डवेयर"]},
{"id":"C5","g":"cmp","heat":2,"title":"Storage & back-up devices","hi":"भंडारण एवं बैकअप उपकरण","blocks":[{"k":"hot","h":"Common asks: <b>CD/DVD/Blu-ray capacities<\/b>, <b>tracks and sectors<\/b>, <b>sequential access = magnetic tape<\/b>, <b>SSD has no moving parts<\/b>, full forms (HDD, SSD, CD, DVD) and <b>types of back-up<\/b>.<br><br>Every paper has at least one question here: \"1 TB = ?\", \"nibble = ?\", \"biggest unit\", \"hard disk is which storage\", \"which is not an optical disc\", \"ASCII full form/bits\", \"binary of a number\" or \"smallest storage unit on a disk\". SSC CGL Tier-II 2022 asked magnetic tape statements word-for-word from these notes, CHSL asked hard disk and optical discs, and NTPC asks bits and cells."},{"k":"story","h":"<p>RAM forgets everything when the power goes off, so a computer needs a place to keep files for years. That place is <b>secondary storage<\/b>. Think of it as the <b>cupboards and lockers<\/b> of a house, as opposed to the kitchen table (RAM) where you work.<\/p><p>Some cupboards are <b>magnetic<\/b>: a hard disk stores data as tiny magnetised spots on spinning metal plates, and a tape stores it along a long ribbon that must be wound to the right place, like an old cassette. Some are <b>optical<\/b>: CDs, DVDs and Blu-ray discs are read by a laser beam. The newest are <b>flash<\/b>: pen drives, memory cards and SSDs keep data in chips with no moving parts, so they are fast and shock-proof.<\/p><p>Finally, <b>cloud storage<\/b> is like renting a locker in a bank far away: your files live on someone else's servers and you reach them over the internet. Because any cupboard can break, wise people keep copies called <b>back-ups<\/b>.<\/p>","key":"Storage keeps data without power: magnetic, optical, flash and cloud; back-ups protect against loss."},{"k":"facts","title":"Ways of storing data","rows":[["Magnetism","Magnetic memory: magnetic tape, hard disk, floppy disk."],["Optical (laser light)","CD, DVD, Blu-ray Disc (BD/B

erson"],["Field (column, attribute)","One kind of detail, such as Name or Date of Birth"],["Domain","The set of allowed values of a field"],["Schema / instance","The design (structure) of the database / the data in it at one moment"],["Data redundancy","The same data stored again and again; a DBMS reduces it"],["Data integrity","Data stays correct and consistent"],["Metadata / data dictionary","Data about data: names, types and sizes of fields"],["DBA","Database Administrator: manages the database, its users and its security"]]},{"k":"table","title":"Keys","head":["Key","Meaning","Example"],"rows":[["Primary key","Uniquely identifies each record; cannot repeat and cannot be empty (NULL); one per table","Roll No, Aadhaar No"],["Candidate key","Any field (or set) that could serve as the primary key","Roll No, Email"],["Alternate key","A candidate key not chosen as the primary key","Email"],["Super key","Any set of fields that identifies a record uniquely","Roll No + Name"],["Composite key","A primary key made of two or more fields","Class + Roll No"],["Foreign key","A field that refers to the primary key of another table and links the two","Roll No in the Fees table"],["Unique key","Values must be different, but one NULL may be allowed","Mobile number"]]},{"k":"table","title":"SQL commands","head":["Group","Full form","Commands"],"rows":[["DDL","Data Definition Language — builds the structure","CREATE, ALTER, DROP, TRUNCATE, RENAME"],["DML","Data Manipulation Language — changes the data","INSERT, UPDATE, DELETE"],["DQL","Data Query Language — reads the data","SELECT"],["DCL","Data Control Language — gives or takes back rights","GRANT, REVOKE"],["TCL","Transaction Control Language — saves or cancels changes","COMMIT, ROLLBACK, SAVEPOINT"]]},{"k":"facts","title":"SQL and database facts","rows":[["SQL","Structured Query Language; developed at IBM in the 1970s (first called SEQUEL)"],["SELECT … WHERE","WHERE filters rows; ORDER BY sorts; GROUP BY groups; HAVING filters groups"],["DELETE vs TRUNCATE vs DROP","Removes chosen rows / removes all rows, keeps the table / removes the whole table"],["ACID","Atomicity, Consistency, Isolation, Durability: the rules of a safe transaction"],["Normalisation","Splitting tables to remove redundancy: 1NF, 2NF, 3NF, BCNF"],["ER diagram","Entity–Relationship diagram, given by Peter Chen (1976): entities, attributes and relationships"],["OLTP / OLAP","Online Transaction Processing (day-to-day entries) / Online Analytical Processing (analysis)"],["Data warehouse / data mining","Store of large historical data / finding hidden patterns in it"],["Popular DBMS","Oracle, MySQL, Microsoft SQL Server, PostgreSQL, MS Access; MongoDB is NoSQL"]]},{"k":"table","title":"MS Access — database basics","head":["Item","Meaning"],"rows":[["MS Access","Database management system (DBMS) in MS Office; file .accdb (2007 onwards), .mdb older"],["Table","Stores the data in rows and columns — the basic object"],["Record","One row of a table (all details of one person / item)"],["Field","One column of a table (one type of detail, e.g. Name)"],["Primary key","Field whose value is unique for every record and cannot be empty, e.g. Roll No"],["Foreign key","Field that refers to the primary key of another table; links tables"],["Query","Asks a question — selects, sorts or calculates data meeting conditions"],["Form","User-friendly screen for entering and viewing data"],["Report","Formatted summary of data for printing"],["Macro / Module","Automates tasks / VBA program code"],["Datasheet view vs Design view","Data in a grid vs structure of the table (fields and data types)"],["Data types","Short Text (up to 255 characters), Long Text, Number, Date/Time, Currency, AutoNumber, Yes/No, Hyperlink, Attachment"]]},{"k":"table","title":"MS Access at a glance","head":["Item","Fact"],"rows":[["First released","November 1992; part of Microsoft Office Professional"],["File extension",".accdb (Access 2007 onwards); .mdb older; .accde compiled (locked) file"],["Six objects","Tables, Queries, Forms, Reports, Macros, Modules"],["Table views","Datasheet View (rows of data) and Design View (fields and data types)"],["Form and report views","Form View, Layout View, Design View; Report View, Print Preview"],["Data types","Short Text (up to 255 characters), Long Text (old name Memo), Number, Date/Time, Currency, AutoNumber, Yes/No, OLE Object, Hyperlink, Attachment, Calculated, Lookup Wizard"],["AutoNumber","Gives each new record the next number by itself; often used as the primary key"],["Query types","Select query; action queries (make-table, append, update, delete); crosstab; parameter query"],["Relationships","One-to-one, one-to-many (most common), many-to-many (through a junction table)"],["Referential integrity","Stops a foreign key value that has no matching primary key"],["Size limit","2 GB for one Access database file"]]},{"k":"table","title":"Database models","head":["Model","Shape","Example"],"rows":[["Hierarchical","Tree: one parent, many children","IBM IMS"],["Network","Graph: a child can have many parents","CODASYL databases"],["Relational","Related tables (rows and columns)","Oracle, MySQL, SQL Server, MS Access"],["Object-oriented","Data stored as objects","db4o"],["NoSQL","Documents, key–value pairs or graphs, for very large data","MongoDB, Cassandra"]]},{"k":"table","title":"MS Access at a glance","head":["Item","Fact"],"rows":[["First released","November 1992; part of Microsoft Office Professional"],["File extension",".accdb (Access 2007 onwards); .mdb older; .accde compiled (locked) file"],["Six objects","Tables, Queries, Forms, Reports, Macros, Modules"],["Table views","Datasheet View (rows of data) and Design View (fields and data types)"],["Form and report views","Form View, Layout View, Design View; Report View, Print Preview"],["Data types","Short Text (up to 255 characters), Long Text (old name Memo), Number, Date/Time, Currency, AutoNumber, Yes/No, OLE Object, Hyperlink, Attachment, Calculated, Lookup Wizard"],["AutoNumber","Gives each new record the next number by itself; often used as the primary key"],["Query types","Select query; action queries (make-table, append, update, delete); crosstab; parameter query"],["Relationships","One-to-one, one-to-many (most common), many-to-many (through a junction table)"],["Referential integrity","Stops a foreign key value that has no matching primary key"],["Size limit","2 GB for one Access database file"]]},{"k":"table","title":"Database models","head":["Model","Shape","Example"],"rows":[["Hierarchical","Tree: one parent, many children","IBM IMS"],["Network","Graph: a child can have many parents","CODASYL databases"],["Relational","Related tables (rows and columns)","Oracle, MySQL, SQL Server, MS Access"],["Object-oriented","Data stored as objects","db4o"],["NoSQL","Documents, key–value pairs or graphs, for very large data","MongoDB, Cassandra"]]},{"k":"trick","h":"Access objects — <span class='mn'>T Q F R M M<\/span>: <b>T<\/b>eachers <b>Q<\/b>uickly <b>F<\/b>ill <b>R<\/b>egisters <b>M<\/b>onday <b>M<\/b>orning = Tables, Queries, Forms, Reports, Macros, Modules. SQL groups: <b>D<\/b>DL <b>D<\/b>efines (CREATE, ALTER, DROP); D<b>M<\/b>L <b>M<\/b>odifies (INSERT, UPDATE, DELETE)."},{"k":"trap","h":"A <b>record<\/b> is a row and a <b>field<\/b> is a column — not the other way. The <b>primary key<\/b> can never be empty or repeated; a <b>foreign key<\/b> can repeat. <b>DELETE<\/b> is DML (rows), <b>DROP<\/b> is DDL (the whole table). A <b>form<\/b> is for entering data, a <b>report<\/b> is for printing it. Access saves as <b>.accdb<\/b>, not .acc or .mdbx."}],"sum":["A DBMS stores related data in tables; a record is a row (tuple) and a field is a column (attribute); RDBMS uses related tables (E. F. Codd, 1970).","The primary key is unique and never empty; a foreign key refers to another table's primary key and links the tables.","SQL: DDL (CREATE, ALTER, DROP), DML (INSERT, UPDATE, DELETE), DQL (SELECT), DCL (GRANT, REVOKE), TCL (COMMIT, ROLLBACK).","MS Access (.accdb) has six objects: tables, queries, forms, reports, macros and modules; tables open in Datasheet or Design view.","Data types include Short Text (255 characters), Long Text, Number, Currency, AutoNumber and Yes/No."],"part":["Part 2 · Software, Windows & MS Office","सॉफ़्टवेयर, विंडोज़ एवं एमएस ऑफ़िस"]},
{"id":"C12","g":"cmp","heat":3,"title":"Internet, browsers & the World Wide Web","hi":"इंटरनेट, ब्राउज़र एवं वर्ल्ड वाइड वेब","blocks":[{"k":"hot","h":"Almost every paper has one internet question: <b>who invented the WWW<\/b>, the <b>parts of a URL<\/b>, what <b>DNS<\/b> does, a <b>browser vs search engine<\/b> swap, or a TLD like <b>.gov / .edu<\/b>.<br><br>Internet questions appear in every exam: \"WWW invented by and in which year\", \"HTTP full form\", \"the 's' in https\", \"which is not a browser/search engine\", \"parts of a URL\", \"valid email address\", \"CC and BCC\", \"SMTP sends email\". SSC CGL Tier-II asked the browser, Gmail Compose, email meaning and the Trash folder; NTPC asked URL and Tim Berners-Lee twice."},{"k":"story","h":"<p>Think of the <b>internet<\/b> as the road network of the whole world: millions of computers joined by cables, towers and satellites. The <b>World Wide Web<\/b> is only one kind of traffic on those roads, just as buses are only one kind of vehicle. Email, video calls and file transfer also travel on the same internet but are not the web.<\/p><p>The web is a giant library of <b>pages<\/b> joined by <b>hyperlinks<\/b>. Every page has an address called a <b>URL<\/b>, like a postal address. Computers, however, only understand number addresses (IP addresses), so a helper called <b>DNS<\/b> works like a phone directory: you give it a name such as google.com and it returns the number.<\/p><p>To read pages you need a <b>browser<\/b> (Chrome, Firefox, Edge, Safari) – the reading glasses. To find pages whose address you do not know you use a <b>search engine<\/b> (Google, Bing) – the library catalogue. The company that gives you the connection, like a water-pipe supplier, is your <b>ISP<\/b>.<\/p>","key":"Internet = the roads; WWW = one service on them; URL = address; DNS = phone directory; browser = reader; search engine = catalogue."},{"k":"facts","title":"What the internet is","rows":[["Internet","Network of networks; also called the information highway and the \"web\" (trap/jaal). All of these answers are correct."],["Network","Connection → communication (data transmission) → channel (data transmission medium): wired or wireless."],["Nodes","Every device in a network is a node: 3 PCs + 1 router + 1 printer = 5 nodes."],["Basic requirements","Computer; ISP connection (gives IP address); NIC chip (Network Interface Controller Card, gives MAC address); MODEM (Modulator-Demodulator); communication software (web browser)."],["IP and MAC","IP = Internet Protocol address (like a SIM number); MAC = Media Access Control address (like a phone's IMEI number)."],["Unique IP","Every computer connected to the internet must have a unique IP address."],["Features","Accessibility, ease of use, flexible communication, low cost. \"High cost\" is NOT a feature."]]},{"k":"table","title":"Internet organisations","head":["Body","Full form","Job"],"rows":[["IAB","Internet Architecture Board","Regulating/oversight body"],["IANA","Internet Assigned Numbers Authority","Distributes IP addresses worldwide"],["ICANN","Internet Corporation for Assigned Names and Numbers","Domain name registration; manages names and numbers"],["IETF","Internet Engineering Task Force","Develops internet standards"],["W3C (WWWC)","World Wide Web Consortium","Web standards"],["CERT-In","Computer Emergency Response Team - India","India's cyber security response agency"],["ISOC","Internet Society","Promotes the open internet"]]},{"k":"tl","title":"Milestones of the internet and web","rows":[["1969","ARPANET, funded by the US Department of Defense, links its first computers – the ancestor of the internet"],["1971","Ray Tomlinson sends the first network e-mail using the @ sign"],["1974","Vint Cerf and Bob Kahn publish the TCP/IP design – 'fathers of the internet'"],["1983","ARPANET switches to TCP/IP (1 January 1983); DNS is introduced the same year"],["1989","Tim Berners-Lee proposes the World Wide Web at CERN (Geneva, Switzerland)"],["1990","Berners-Lee writes the first browser (WorldWideWeb) and the first web server"],["1991","The web is opened to the public; first website: info.cern.ch"],["1993","Mosaic – the first popular graphical browser (NCSA, USA)"],["1994","Netscape Navigator browser released"],["1995","Internet Explorer released; VSNL starts public internet in India (15 August 1995)"],["1998","Google founded by Larry Page and Sergey Brin"],["2008","Google Chrome browser released"],["1960s","Internet started from US Defense research"],["1980s","AOL (America Online) and CompuServe gave service to common people"],["1982","DECnet: 1st commercial network (Digital Equipment Corporation)"],["15 Aug 1995","VSNL (Videsh Sanchar Nigam Limited, now part of Tata group) launched internet in India"]]},{"k":"table","title":"Internet connections","head":["Type","Technology","Key point"],"rows":[["Dial-up","Circuit switching; PSTN (Public Switched Telephone Network)","Slowest; uses traditional telephone network"],["Broadband","Packet switching; broad bandwidth","Bandwidth = rate of data transfer, e.g. 100 Mbps (megabits per second)"],["Cable broadband","Packet switching","Fastest internet connection"],["DSL broadband","Digital Subscriber Line","PC - DSL modem - splitter - telephone cable carries both phone and internet"],["Mobile broadband","Packet switching","Through mobile networks"],["Satellite broadband","Packet switching","Through satellites"]]},{"k":"table","title":"Parts of a URL: https://www.example.gov.in/exams/result.html","head":["Part","In the example","What it is"],"rows":[["Protocol (scheme)","https://","Rules used to fetch the page (http, https, ftp)"],["Sub-domain","www","Server name inside the domain"],["Domain name","example.gov.in","Name of the website, turned into an IP address by DNS"],["Top-level domain (TLD)","in","Last part of the domain – country or category"],["Path","/exams/","Folder on the server"],["File name","result.html","The exact page requested"]]},{"k":"info","title":"A URL, piece by piece","html":"<div style=\"font:700 clamp(14px,2.6vw,20px)/1.6 var(--f-num);word-break:break-all;margin:4px 0 12px\"><span style=\"color:#c0392b;border-bottom:3px solid #c0392b;padding:0 1px\">https://<\/span><span style=\"color:#c69214;border-bottom:3px solid #c69214;padding:0 1px\">www<\/span><span style=\"color:var(--ink2)\">.<\/span><span style=\"color:#2f8f4e;border-bottom:3px solid #2f8f4e;padding:0 1px\">example.gov.<\/span><span style=\"color:#1f8a8a;border-bottom:3px solid #1f8a8a;padding:0 1px\">in<\/span><span style=\"color:#2f6db5;border-bottom:3px solid #2f6db5;padding:0 1px\">/exams/<\/span><span style=\"color:#7d4fb5;border-bottom:3px solid #7d4fb5;padding:0 1px\">result.html<\/span><\/div>\n  <div class=\"fam\"><div style=\"border-top:4px solid #c0392b\"><b>Protocol (scheme)<\/b><small>Rules used to fetch the page (http, https, ftp)<\/small><\/div><div style=\"border-top:4px solid #c69214\"><b>Sub-domain<\/b><small>Server name inside the domain<\/small><\/div><div style=\"border-top:4px solid #2f8f4e\"><b>Domain name<\/b><small>Name of the website, turned into an IP address by DNS<\/small><\/div><div style=\"border-top:4px solid #1f8a8a\"><b>Top-level domain (TLD)<\/b><small>Last part of the domain – country or category<\/small><\/div><div style=\"border-top:4px solid #2f6db5\"><b>Path<\/b><small>Folder on the server<\/small><\/div><div style=\"border-top:4px solid #7d4fb5\"><b>File name<\/b><small>The exact page requested<\/small><\/div><\/div>","cap":"DNS turns the domain name into an IP address. https means the page travels encrypted (SSL/TLS, port 443); plain http uses port 80."},{"k":"table","title":"Parts of a URL: https://www.facebook.com/login.php/48","head":["Part (from https://www.facebook.com/login.php/48)","Name","Meaning"],"rows":[["https","Protocol","HyperText Transfer Protocol Secure: communication protocol"],["://","Path specifier","Separates protocol from address"],["www","Global network name","World Wide Web"],["facebook","Domain name","Name of the site (facebook.com is the domain)"],[".com","Top-level domain (TLD)","Type or country of site"],["login.php","Web page name","The page"],["48","Port number","Port on the server (HTTP default port 80)"],["URL / URI","Uniform Resource Locator / Identifier","Website address; URI = unique address of each resource on the web"]]},{"k":"table","title":"Common top-level domains","head":["TLD","Meant for","Type"],"rows":[[".com","Commercial organisations","Generic"],[".org","Organisations, often non-profit","Generic"],[".net","Network providers (now open to all)","Generic"],[".edu","Educational institutions (mainly US)","Sponsored"],[".gov","Government (US); India uses .gov.in","Sponsored"],[".mil","US military","Sponsored"],[".int","International treaty organisations","Sponsored"],[".in","India","Country code (ccTLD)"],[".uk / .us / .jp","United Kingdom / USA / Japan","Country code (ccTLD)"]]},{"k":"table","title":"More domain names","head":["Domain","Meaning"],"rows":[[".com","Commercial"],[".ac","Academic"],[".co","Corporate (company)"],[".edu","Education"],[".gov / .gov.in","Government"],[".org","Organisation"],[".net","Network"],[".mil","Military"],[".res","Research"],[".nic","National Informatics Centre"],[".in","India"],[".pk","Pakistan"],[".uk","United Kingdom"],[".us","United States"],[".au","Australia"],[".jp","Japan"]]},{"k":"table","title":"Look-alike web terms","head":["Term","Meaning","Example / note"],"rows":[["Web page","One single document on the web","result.html"],["Website","A collection of related web pages under one domain","ssc.gov.in"],["Home page","The first / main page of a website (also the page a browser opens at start)","index.html"],["Hyperlink","Clickable text or image that takes you to another page or place","Usually blue and underlined"],["Web browser","Software to view web pages","Chrome, Firefox, Edge, Safari, Opera"],["Search engine","Website that searches the web for you","Google, Bing, Yahoo, DuckDuckGo"],["Web server","Computer that stores websites and sends pages on request","Apache, IIS"],["Cookie","Small text file a website stores in your browser to remember you","Login, cart, preferences"],["Cache","Stored copies of pages and images so they load faster next time","Clear it if a page looks old"],["History","List of pages you visited","Ctrl+H in Chrome, Edge, Firefox"],["Bookmark / Favourite","Saved link to a page","Ctrl+D in Chrome, Edge, Firefox"],["Download / Upload","Internet to your device / your device to the internet","Saving a PDF vs attaching a photo"],["Streaming","Playing audio or video while it is still arriving, without saving the full file first","YouTube, online radio"],["Intranet","Private network of one organisation using internet technology","Staff-only portal"],["Extranet","Intranet opened to selected outsiders (partners, suppliers)","Dealer portal"]]},{"k":"facts","title":"Web terms","rows":[["Web browser","Software to open web pages: Google Chrome, Microsoft Edge (default on Windows 10/11), Mozilla Firefox, Safari (Apple), Opera, Internet Explorer, Netscape Navigator."],["Browser parts","Tab bar and address bar."],["Browser shortcuts","New tab Ctrl + T; Tab key moves forward and Shift + Tab backward among open tabs; Ctrl + 1 to Ctrl + 8 = tabs 1 to 8; Ctrl + 9 = last tab; close tab Ctrl + W; History Ctrl + H; Downloads Ctrl + J; Bookmark current page Ctrl + D."],["Bookmark","List of links of marked web pages."],["History","List of opened web pages/websites."],["Incognito mode","Private window in Google Chrome: Ctrl + Shift + N. InPrivate window; Private window in Microsoft Edge: Ctrl + Shift + N."],["Cookies","Hold the track/path information to reach a server; identify a returning user."],["Web cache","Holds repeated data from a server so it loads faster next time."],["Rendering engine","Also called browser engine or layout engine; displays (renders) web pages in the browser."],["Search engine","Program that searches stored information on servers: Google, Bing, Yahoo, Ask, Baidu, DuckDuckGo. Safari is a browser, not a search engine."],["Spider / web crawler","Special program that works for a search engine and collects website links into its database."],["Webpage","A page written in a markup language (SGML, HTML, CSS, XML, PHP)."],["Website","Collection of inter-related web pages; the Home Page is its first page and gives navigation to other pages."],["Web portal","Specially designed website that brings information from many sources (emails, forums)."],["Web server","Computer that hosts a website's data and sends web pages to browsers."],["Web services","Services that move data digitally between devices, e.g. AWS (Amazon Web Services)."],["Web directory","Catalogue of websites, e.g. Google My Business."],["Cloud computing","On-demand computer resources, especially data storage, through the internet, e.g. Microsoft Azure; cloud storage OneDrive (Microsoft), Google Drive, iCloud (Apple)."],["Digital signature","Mathematical scheme to check the authenticity of a message or document (A signs, B verifies)."],["Blog / vlog","Web log: a personal website where articles (thoughts) are posted regularly; vlog = video log; micro-blogging = short posts (Twitter/X)."],["Wiki","Website whose content users can create, edit and delete (e.g. Wikipedia)."],["Download / upload","Download = server to your PC; upload = your PC to server."],["Uplink / downlink","Data centre to satellite / satellite to data centre."],["Hypertext / hyperlink","Linked text; the mouse turns into a hand (palm) shape over it."],["Social networking","Online service to build social relations (Facebook, LinkedIn); hashtags (#) mark topics for easy search."],["WYSIWYG","What You See Is What You Get: web page editors (like Dreamweaver) work on this principle."],["Internet telephony / VoIP","Voice conversations over the internet (Skype is Microsoft's video-calling software)."],["Telnet","Older utility to log in to remote computers."],["Languages","HTML creates web pages; JavaScript makes dynamic web pages."]]},{"k":"facts","title":"HTML and IP basics","rows":[["HTML","Hyper Text Markup Language – the language web pages are written in (Tim Berners-Lee)"],["Markup, not programming","HTML describes structure with tags; it does not do calculations"],["Tags","Written in angle brackets: &lt;html&gt;, &lt;head&gt;, &lt;title&gt;, &lt;body&gt;, &lt;p&gt;, &lt;a&gt; (link), &lt;img&gt;, &lt;br&gt;"],["Container vs empty tag","&lt;p&gt;…&lt;/p&gt; has a closing tag; &lt;br&gt; and &lt;img&gt; have none"],["File extension",".html or .htm"],["Styling / behaviour","CSS gives the look; JavaScript adds interactivity"],["IP address","Unique number for each device on a network, e.g. 192.168.1.1 (IPv4)"],["ISP","Internet Service Provider – BSNL, Jio, Airtel"],["Domain names managed by","ICANN (worldwide); .in registry run by NIXI"]]},{"k":"facts","title":"Markup and web languages","rows":[["SGML","Standard Generalized Markup Language"],["HTML","HyperText Markup Language: creates web pages (a markup language, not a programming language); attribute \"vlink\" = visited link colour"],["CSS","Cascading Style Sheets"],["XML","Extensible Markup Language"],["PHP","Personal Home Page / Hypertext Preprocessor"]]},{"k":"p","h":"<b>How a web page reaches you.<\/b> you type a URL in the browser; DNS turns the domain name into an IP address; the browser sends an HTTP/HTTPS request to the web server at that IP and port (80 or 443); the server sends back HTML; the browser's rendering engine draws the page."},{"k":"trick","h":"URL order: <span class='mn'>P<\/span>lease <span class='mn'>D<\/span>on't <span class='mn'>P<\/span>ush <span class='mn'>F<\/span>riends = <b>P<\/b>rotocol, <b>D<\/b>omain, <b>P<\/b>ath, <b>F<\/b>ile. Web father: <span class='mn'>T<\/span>im = <span class='mn'>T<\/span>hree W's; internet fathers: <span class='mn'>C<\/span>erf &amp; <span class='mn'>K<\/span>ahn = <b>TCP<\/b>.<ul><li>Internet \"fathers\": Vint Cerf (internet, TCP/IP, with Bob Kahn); Tim Berners-Lee (WWW, 1989, CERN). \"Cerf surfs the Internet, Tim makes the Web\".<\/li><li>India got internet on Independence Day: 15 August 1995, VSNL.<\/li><li>https: S = Secure.<\/li><li>Browsers \"CEFSO\": Chrome, Edge, Firefox, Safari, Opera. Search engines \"GBYAB\": Google, Bing, Yahoo, Ask, Baidu.<\/li><\/ul>"},{"k":"trap","h":"<b>Internet ≠ WWW<\/b>: the internet is the network (1969, ARPANET); the web is a service on it (1989–91, Berners-Lee). <b>Browser ≠ search engine<\/b>: Chrome is a browser, Google is a search engine. <b>Web page ≠ website ≠ home page<\/b>. <b>Cookie ≠ cache<\/b>: cookie remembers <i>you<\/i>, cache stores <i>page files<\/i>. <b>Intranet<\/b> is private, <b>extranet<\/b> lets chosen outsiders in.<ul><li>WWW = World Wide Web.<\/li><li>Safari is a browser, not a search engine; Facebook is a social networking site, not a browser.<\/li><li>Web page editors work on WYSIWYG.<\/li><li>JavaScript (not FORTRAN or LISP) creates dynamic web pages.<\/li><li>A web page is located using a URL (Uniform Resource Locator).<\/li><li>A collection of linked web pages = website, not web server.<\/li><li>Sites where users edit content = wikis.<\/li><li>WhatsApp is not used to \"upload short video clips on the web\"; it can send files.<\/li><li>The first web browser was WorldWideWeb (1990, text only). Mosaic (1993) was the first GRAPHICAL browser; if WorldWideWeb is not in the options, choose Mosaic.<\/li><li>In https://www.facebook.com, the domain name is facebook.com, not www.facebook.com.<\/li><li>The IP address is NOT a part of a URL.<\/li><li>Broadband uses packet switching; dial-up uses circuit switching. The internet itself works mainly on packet switching.<\/li><li>.au = Australia, not UAE.<\/li><\/ul>"}],"sum":["Internet is the global network (ARPANET 1969); the WWW is a service on it, invented by Tim Berners-Lee at CERN in 1989-91.","A URL has protocol, domain name (ending in a TLD such as .com, .gov, .in) and path; DNS converts the name into an IP address.","Browsers (Chrome, Firefox, Edge, Safari; historic Mosaic, Netscape) display pages; search engines (Google, Bing) find them.","HTML (Hyper Text Markup Language) builds web pages with tags; files end in .html or .htm.","Cookies remember the user, cache stores page copies; intranet is private, extranet admits chosen outsiders; an ISP gives the connection.","Internet = network of networks; ARPANET 1969 first; Vint Cerf = father of internet; India 15 Aug 1995 (VSNL).","WWW by Tim Berners-Lee (1989, CERN); first browser WorldWideWeb (1990); Mosaic first graphical (1993).","Needs: computer, ISP (IP address), NIC (MAC address), modem, browser; cable broadband fastest, dial-up slowest.","URL parts: protocol (https), www, domain (facebook), TLD (.com), page, port."],"part":["Part 3 · Internet, networks & security","इंटरनेट, नेटवर्क एवं सुरक्षा"]},
{"id":"C13","g":"cmp","heat":2,"title":"E-mail & e-banking","hi":"ई-मेल एवं ई-बैंकिंग","blocks":[{"k":"hot","h":"Email questions focus on <b>CC vs BCC<\/b>, the folders (Drafts, Outbox, Spam) and the inventor <b>Ray Tomlinson<\/b>. Banking questions ask the full forms and differences of <b>NEFT, RTGS, IMPS, UPI<\/b> and safe-payment habits (OTP, PIN)."},{"k":"story","h":"<p><b>E-mail<\/b> is a post office that works in seconds. Your e-mail address is your letter box: the part before <b>@<\/b> is your name on the box, the part after it is the post office (the mail server) that keeps the box, as in ravi@gmail.com.<\/p><p>When you write a letter you can put people in the <b>To<\/b> line (the main readers), in <b>CC<\/b> (a copy for information, everyone can see it) or in <b>BCC<\/b> (a hidden copy – other readers never learn this person got it). Unfinished letters wait in <b>Drafts<\/b>; letters still leaving sit in the <b>Outbox<\/b>; letters already gone appear in <b>Sent<\/b>; junk lands in <b>Spam<\/b>.<\/p><p><b>E-banking<\/b> is the same idea for money. Instead of standing in a bank queue, you move money with net banking, a mobile app or <b>UPI<\/b>. Each system is a different road: <b>RTGS<\/b> for big amounts instantly, <b>NEFT<\/b> in half-hourly batches, <b>IMPS<\/b> and <b>UPI<\/b> instantly at any hour. The keys to your money are your PIN and OTP – never share them with anyone.<\/p>","key":"@ splits user and mail server; BCC hides recipients; RTGS big and instant, NEFT batches, IMPS and UPI instant 24x7; never share PIN or OTP."},{"k":"table","title":"E-mail fields and folders","head":["Item","What it does","Remember"],"rows":[["To","Main recipient(s)","Must have at least one recipient in To, CC or BCC"],["CC (Carbon Copy)","Sends a copy; all recipients can see CC addresses","For information only"],["BCC (Blind Carbon Copy)","Sends a copy; BCC addresses are hidden from every other recipient","Use for mass mails to protect privacy"],["Subject","One-line topic of the mail","Shown in the inbox list"],["Attachment","File sent with the mail (paper-clip icon)","Gmail limit 25 MB; bigger files go as a Google Drive link"],["Signature","Text added automatically at the end of every mail","Name, designation, phone"],["Inbox","Received mail","Unread mail usually in bold"],["Outbox","Mail waiting to be sent (e.g. when offline)","Not yet gone"],["Sent","Copies of mail already sent","Proof you sent it"],["Drafts","Saved, unfinished mail – not sent","Auto-saved while typing"],["Spam / Junk","Unwanted or suspicious bulk mail","Filtered automatically"],["Trash / Bin","Deleted mail","Gmail empties it after 30 days"]]},{"k":"table","title":"Reply, Reply All, Forward","head":["Action","Goes to","Attachments"],"rows":[["Reply","Only the original sender","Original attachment is not sent back"],["Reply All","Sender plus everyone in To and CC (never the BCC people)","Not sent back"],["Forward","Anyone new you type in","Original attachments are included"]]},{"k":"facts","title":"E-mail facts","rows":[["Inventor of network e-mail","Ray Tomlinson, 1971, on ARPANET"],["Why @","Tomlinson chose @ to separate the user name from the host (computer) name"],["Address format","username@domain, e.g. ravi@gmail.com"],["Sending protocol","SMTP (port 25)"],["Receiving protocols","POP3 (downloads, port 110) and IMAP (keeps mail synced on server, port 143)"],["Hotmail","Free web mail founded in 1996 by Sabeer Bhatia and Jack Smith"],["Gmail","Launched by Google on 1 April 2004"],["Gmail free storage","15 GB, shared with Google Drive and Google Photos"],["Gmail features","Labels, Undo Send, Schedule send, Confidential mode, Spam filter"],["Spam","Unsolicited bulk e-mail"],["Email","Electronic mail: sending messages electronically over a network."],["Email ID","username@domain name, e.g. yatendra@gmail.com; parts separated by @."],["Gmail username rules","6 to 30 characters, no spaces; single dots allowed but not two dots together (..); letters a-z and numbers 0-9 allowed; NOT case sensitive; special characters (, ' \"? ! &lt; &gt; @ # $ &amp; etc.) not allowed; exactly one @ in the address."],["Valid examples","yaten@xyz.com, yaten@gmail.com, 123456@gmail.com, yaten.nigam@gmail.com, yaten.nigam.123@gmail.com, yatendra@ymail.com, yatendra@rediffmail.com."],["Invalid examples","yaten..nigam@gmail.com (double dot), \"yaten nigam\"@gmail.com (space), yaten@nigam@gmail.com (two @), yatendra@xyz (no domain end), yatendra.xyz.com (no @)."],["Compose","Button to write a new email."],["Subject","Short description of the email."],["Folders","Inbox (received), Sent/Outbox, Draft (unsent saved mail), Trash/Bin (deleted mail), Spam (junk)."],["Attachment","Image, audio or video file sent with an email; Gmail limit 25 MB."],["Header","The top part of an email (sender, receiver, subject); a user can check the header before downloading and can partially download an email."],["From / To / CC / BCC","From = your own email ID; To = main receiver; CC = Carbon Copy (others see it); BCC = Blind Carbon Copy (hidden from other receivers)."],["Email providers","Gmail (Google), Outlook/Hotmail (Microsoft), Yahoo Mail, Rediffmail, iCloud Mail (Apple). \"Coolmail\" is not a real provider."]]},{"k":"table","title":"E-mail protocols","head":["Protocol","Full form","Job"],"rows":[["SMTP","Simple Mail Transfer Protocol","Sends email"],["POP3","Post Office Protocol 3","Receives email (downloads to local computer)"],["IMAP","Internet Message Access Protocol","Reads/manages email kept on the server; works for send and receive"],["MIME","Multipurpose Internet Mail Extension","Sends attachments"]]},{"k":"info","title":"How an e-mail travels","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 170\" role=\"img\" aria-label=\"How an e-mail travels\">\n  <defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"var(--ink2)\"/><\/marker><\/defs>\n  <rect x=\"10\" y=\"50\" width=\"110\" height=\"60\" rx=\"10\" fill=\"#2f8f4e\"/><text x=\"65\" y=\"78\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">Sender<\/text><text x=\"65\" y=\"95\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:#fff\">writes mail<\/text><rect x=\"200\" y=\"50\" width=\"120\" height=\"60\" rx=\"10\" fill=\"#2f6db5\"/><text x=\"260\" y=\"78\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">Mail server<\/text><text x=\"260\" y=\"95\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:#fff\">sender's<\/text><rect x=\"380\" y=\"50\" width=\"120\" height=\"60\" rx=\"10\" fill=\"#2f6db5\"/><text x=\"440\" y=\"78\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">Mail server<\/text><text x=\"440\" y=\"95\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:#fff\">receiver's<\/text><rect x=\"560\" y=\"50\" width=\"110\" height=\"60\" rx=\"10\" fill=\"#c0503a\"/><text x=\"615\" y=\"78\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">Receiver<\/text><text x=\"615\" y=\"95\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:#fff\">reads mail<\/text>\n  <path d=\"M120 80 H196\" fill=\"none\" stroke=\"#2f8f4e\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/><circle r=\"5\" fill=\"#2f8f4e\"><animateMotion dur=\"1.6s\" repeatCount=\"indefinite\" path=\"M120 80 H196\"/><\/circle><path d=\"M320 80 H376\" fill=\"none\" stroke=\"#2f6db5\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/><circle r=\"5\" fill=\"#2f6db5\"><animateMotion dur=\"1.2s\" repeatCount=\"indefinite\" path=\"M320 80 H376\"/><\/circle><path d=\"M500 80 H556\" fill=\"none\" stroke=\"#c0503a\" stroke-width=\"2.5\" marker-end=\"url(#ar)\"/><circle r=\"5\" fill=\"#c0503a\"><animateMotion dur=\"1.6s\" repeatCount=\"indefinite\" path=\"M500 80 H556\"/><\/circle>\n  <text x=\"158\" y=\"40\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#2f8f4e\">SMTP<\/text><text x=\"348\" y=\"40\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#2f6db5\">SMTP<\/text><text x=\"528\" y=\"40\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#c0503a\">POP3 / IMAP<\/text>\n  <text x=\"10\" y=\"150\" font-size=\"11\" class=\"mut\">SMTP sends (port 25); POP3 downloads and usually deletes from the server (110); IMAP keeps mail on the server and syncs (143).<\/text><\/svg><\/figure>","cap":"Ray Tomlinson sent the first network e-mail in 1971 and chose @ to join the user name and the computer's name."},{"k":"table","title":"Electronic fund transfer systems","head":["System","Full form","Run by","Key point"],"rows":[["NEFT","National Electronic Funds Transfer","RBI","Settled in half-hourly batches; no minimum amount; available 24x7 since December 2019"],["RTGS","Real Time Gross Settlement","RBI","Each transfer settled individually in real time; minimum Rs 2 lakh, no upper limit; 24x7 since December 2020"],["IMPS","Immediate Payment Service","NPCI","Instant, 24x7 including holidays; launched 2010"],["UPI","Unified Payments Interface","NPCI","Instant mobile payments using a virtual address (name@bank) or QR code; launched 2016"],["BHIM","Bharat Interface for Money","NPCI","Government-backed UPI app, launched December 2016"],["RuPay","India's own card network","NPCI","Domestic alternative to Visa / Mastercard"]]},{"k":"facts","title":"Safe digital banking","rows":[["OTP","One Time Password – valid once, for a short time"],["2FA","Two-factor authentication: something you know (password) + something you have (phone/OTP)"],["PIN","Personal Identification Number – never write it on the card, never share it"],["UPI PIN","Needed only to SEND money; you never enter a PIN to RECEIVE money"],["Banks never ask for","Password, PIN, OTP or CVV by call, SMS or e-mail"],["Safe website","Starts with https:// and shows a padlock"],["Public Wi-Fi","Avoid doing banking on open public Wi-Fi"],["IFSC","Indian Financial System Code – 11-character bank branch code needed for NEFT/RTGS"],["KYC","Know Your Customer – identity check by banks"],["Fraud reporting","Cyber-crime helpline 1930 and portal cybercrime.gov.in"]]},{"k":"p","h":"<b>Internet vs WWW.<\/b> the internet is the physical network of networks (cables, routers, computers). The World Wide Web is a service that runs on the internet: billions of linked web pages opened with a browser using HTTP. Email, FTP and VoIP are other services on the same internet. So \"WWW is part of the internet\", not the same thing."},{"k":"trick","h":"<span class='mn'>B<\/span>CC = <span class='mn'>B<\/span>lind = nobody sees. Money speed: <span class='mn'>R<\/span>TGS = <span class='mn'>R<\/span>ich (Rs 2 lakh minimum) and <span class='mn'>R<\/span>eal time; <span class='mn'>N<\/span>EFT = <span class='mn'>N<\/span>ot instant (batches); <span class='mn'>I<\/span>MPS = <span class='mn'>I<\/span>mmediate.<ul><li>Email protocols: \"SMTP Sends Mail To People; POP3 Pulls Out to PC; IMAP keeps It Managed At Provider\".<\/li><li>BCC = \"Blind\": nobody else sees who got it.<\/li><\/ul>"},{"k":"trap","h":"<b>CC vs BCC<\/b>: both get the mail; only BCC is hidden. <b>Outbox vs Sent<\/b>: Outbox = not yet gone. <b>Drafts<\/b> are never sent. <b>Reply All<\/b> does not reach BCC recipients. <b>RTGS vs NEFT<\/b>: RTGS is real-time and individual with a Rs 2 lakh minimum; NEFT is in batches. <b>UPI and IMPS<\/b> are run by NPCI, NEFT and RTGS by RBI. You never need a PIN to <i>receive<\/i> money."}],"sum":["An e-mail address is username@domain; Ray Tomlinson sent the first network e-mail in 1971 and chose the @ sign.","CC recipients are visible to all; BCC (Blind Carbon Copy) recipients are hidden from others.","Drafts are unsent saved mails, Outbox holds mails waiting to go, Sent keeps copies of sent mails, Spam holds junk.","NEFT settles in half-hourly batches, RTGS settles each transfer in real time (minimum Rs 2 lakh); both run by RBI.","IMPS and UPI (NPCI) are instant 24x7; never share PIN, OTP or CVV - banks never ask for them.","Email = username@domain; CC visible, BCC hidden; SMTP sends, POP3/IMAP receive, MIME attachments; spam = junk mail."],"part":["Part 3 · Internet, networks & security","इंटरनेट, नेटवर्क एवं सुरक्षा"]},
{"id":"C14","g":"cmp","heat":3,"title":"Networking: types, topology, devices & OSI","hi":"नेटवर्किंग: प्रकार, टोपोलॉजी, उपकरण एवं ओएसआई","blocks":[{"k":"hot","h":"Expect 1–3 questions: <b>LAN/MAN/WAN<\/b>, which <b>topology<\/b> needs a central hub, what a <b>router / switch / modem<\/b> does, the <b>OSI layers<\/b> in order, <b>IPv4 vs IPv6<\/b> bits, and which cable connects two computers (<b>Ethernet<\/b>).<br><br>SSC Tier-II computer modules ask networking in almost every shift: \"which device connects computers in a LAN\", \"which device works at layer 2\", \"layout of devices = topology\", \"IPv4/IPv6 bits\", \"OSI layers\", \"which topology uses a central hub\", \"UDP vs TCP\", \"simplex/duplex\". CGL 2023 and 2024 asked the switch twice; CHSL asked topology and IP bits."},{"k":"story","h":"<p>A <b>network<\/b> is simply two or more computers joined so they can share files, printers and the internet – like houses in a colony joined by lanes so neighbours can share things.<\/p><p>Size gives the name: a <b>PAN<\/b> is around one person (phone to earphones by Bluetooth), a <b>LAN<\/b> covers a room or building, a <b>MAN<\/b> covers a city, and a <b>WAN<\/b> spans countries – the internet is the biggest WAN.<\/p><p>The <b>topology<\/b> is the shape of the lanes: one long road (bus), everyone connected to a central chowk (star), a circle (ring) or every house joined to every other (mesh). Devices act like traffic staff: a <b>hub<\/b> shouts every message to everyone, a <b>switch<\/b> delivers it only to the right house, a <b>router<\/b> chooses the route between colonies (networks), and a <b>modem<\/b> converts the computer's digital signal for the telephone or cable line.<\/p><p>Every computer has a fixed hardware name, the <b>MAC address<\/b>, and a network address, the <b>IP address<\/b>.<\/p>","key":"Network = joined computers; PAN-LAN-MAN-WAN by size; topology = shape; hub broadcasts, switch delivers, router routes, modem converts."},{"k":"facts","title":"Transmission media","rows":[["Network","Connection → communication (data transmission) → channel (data transmission medium): wired or wireless."],["Optical fibre cable","Fastest medium; data travels as light; high speed."],["Twisted pair cable","Also called LAN cable or Ethernet cable; connectors RJ45 (Registered Jack 45, most important) and RJ11 (telephone); 8 pins and 8 wires: brown, blue, orange, green and their white-striped pairs."],["Coaxial cable","e.g. TV set-top box cable."],["Radio waves","Longest distance; long-range (radio/FM) and short-range (wireless mouse, keyboard, printer)."],["Microwaves","Mobile phone towers."],["Infrared waves","Shortest distance; TV and AC remote controls."]]},{"k":"table","title":"Transmission media","head":["Medium","Type","Key fact"],"rows":[["Twisted pair","Wired (guided)","Copper pairs twisted to reduce interference; used in Ethernet LAN and telephone lines; RJ-45 connector for LAN, RJ-11 for phone"],["Coaxial cable","Wired (guided)","Central copper core with shield; cable TV"],["Optical fibre","Wired (guided)","Carries LIGHT by total internal reflection; fastest, highest bandwidth, immune to electrical interference"],["Radio waves","Wireless (unguided)","Radio, Wi-Fi, mobile networks"],["Microwave","Wireless (unguided)","Line-of-sight towers and satellite links"],["Infrared","Wireless (unguided)","Very short range, line-of-sight: TV remote"],["Bluetooth","Wireless (unguided)","Short-range PAN, IEEE 802.15.1"],["Wi-Fi","Wireless (unguided)","Wireless LAN, IEEE 802.11 (Ethernet LAN is IEEE 802.3)"]]},{"k":"table","title":"Types of network by size","head":["Network","Full form","Range / use","Examples"],"rows":[["PAN","Personal Area Network","Smallest; ad-hoc (temporary); about 10 m to 100 m","Mobile hotspot, Bluetooth (WPAN)"],["LAN","Local Area Network","Most used; within a building or about 1 km; wired LAN = Ethernet, wireless LAN = Wi-Fi (Wireless Fidelity); public or private","Home internet, computer lab, cyber cafe, library, office"],["CAN","Campus Area Network","College/university campus, business organisation","University network"],["MAN","Metropolitan Area Network","Town/city network","Radio/FM network, landline connection, branches of a school in one city joined by optical fibre"],["WAN","Wide Area Network","Geographical collection of LANs; biggest network; country or world","The Internet"]]},{"k":"facts","title":"Other network terms","rows":[["VPN","Virtual Private Network: a secure network over an insecure network (internet); lets users connect to a private network from a remote location."],["Proxy","A service/server that connects you to a server banned by the ISP; it controls access to web content."],["Internet","Global network."],["Intranet","Private network of an organisation, to share data internally (intra = within, net = network)."],["Extranet","Collection of intranets (connects intranets of partner organisations)."],["Server","Computer that provides resources to other computers in a network (file server lets users share files)."],["Node","Any device on a network."],["Protocol","Set of rules that governs data communication."],["Multipoint connection","More than two devices share a single link."],["IoT","Internet of Things: devices talk wirelessly, often using Bluetooth."]]},{"k":"table","title":"Network topologies","head":["Topology","Layout","Plus","Minus"],"rows":[["Bus","All nodes on one backbone cable with terminators at the ends","Cheap, least cable","Backbone break stops the whole network; collisions"],["Star","Every node connected to a central hub or switch","Easy to add nodes and find faults; one cable failure affects only one node","Central device fails = whole network fails"],["Ring","Each node connected to two neighbours in a closed loop; data passes round (token passing)","Orderly, no collisions","One broken node or link can stop the ring"],["Mesh","Every node connected to every other node: n(n-1)/2 links","Most reliable, many alternate paths","Most cable and cost"],["Tree","Hierarchy of star networks joined to a backbone","Easy to expand","Root/backbone failure hits branches"],["Hybrid","Mix of two or more topologies","Flexible","Complex to design"]]},{"k":"info","title":"Network topologies","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 690 195\" role=\"img\" aria-label=\"Network topologies\">\n  <g transform=\"translate(0,12)\"><line x1=\"15\" y1=\"70\" x2=\"125\" y2=\"70\" stroke=\"var(--ink)\" stroke-width=\"3\"/><line x1=\"25\" y1=\"70\" x2=\"25\" y2=\"40\" stroke=\"var(--ink2)\"/><circle cx=\"25\" cy=\"36\" r=\"9\" fill=\"#2f6db5\"/><line x1=\"55\" y1=\"70\" x2=\"55\" y2=\"100\" stroke=\"var(--ink2)\"/><circle cx=\"55\" cy=\"104\" r=\"9\" fill=\"#2f6db5\"/><line x1=\"85\" y1=\"70\" x2=\"85\" y2=\"40\" stroke=\"var(--ink2)\"/><circle cx=\"85\" cy=\"36\" r=\"9\" fill=\"#2f6db5\"/><line x1=\"115\" y1=\"70\" x2=\"115\" y2=\"100\" stroke=\"var(--ink2)\"/><circle cx=\"115\" cy=\"104\" r=\"9\" fill=\"#2f6db5\"/><text x=\"70\" y=\"162\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Bus<\/text><\/g><g transform=\"translate(138,12)\"><line x1=\"70\" y1=\"70\" x2=\"115\" y2=\"70\" stroke=\"var(--ink2)\"/><circle cx=\"115\" cy=\"70\" r=\"9\" fill=\"#2f6db5\"/><line x1=\"70\" y1=\"70\" x2=\"92.5\" y2=\"108.97114317029974\" stroke=\"var(--ink2)\"/><circle cx=\"92.5\" cy=\"108.97114317029974\" r=\"9\" fill=\"#2f6db5\"/><line x1=\"70\" y1=\"70\" x2=\"47.500000000000014\" y2=\"108.97114317029974\" stroke=\"var(--ink2)\"/><circle cx=\"47.500000000000014\" cy=\"108.97114317029974\" r=\"9\" fill=\"#2f6db5\"/><line x1=\"70\" y1=\"70\" x2=\"25\" y2=\"70\" stroke=\"var(--ink2)\"/><circle cx=\"25\" cy=\"70\" r=\"9\" fill=\"#2f6db5\"/><line x1=\"70\" y1=\"70\" x2=\"47.49999999999998\" y2=\"31.028856829700267\" stroke=\"var(--ink2)\"/><circle cx=\"47.49999999999998\" cy=\"31.028856829700267\" r=\"9\" fill=\"#2f6db5\"/><line x1=\"70\" y1=\"70\" x2=\"

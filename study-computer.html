 grouped commands, introduced in Office 2007"],["Quick Access Toolbar","Small toolbar above (or below) the Ribbon; default buttons Save, Undo, Redo"],["Title bar","Top bar showing document name and program name"],["Status bar","Bottom bar: page number, word count, proofing status, views, zoom slider"],["Ruler","Shows margins, indents and tab stops"],["Backstage view","Opened by the File tab: New, Open, Save As, Print, Share, Options"],["Cursor / insertion point","Blinking vertical line where the next character will appear"]]},{"k":"table","title":"Ribbon tabs — where things live","head":["Tab","Main commands"],"rows":[["File","Backstage: New, Open, Save, Save As, Print, Info, Options"],["Home","Clipboard (Cut, Copy, Paste, Format Painter), Font, Paragraph, Styles, Editing (Find, Replace, Select)"],["Insert","Pages (Cover Page, Blank Page, Page Break), Table, Pictures, Shapes, SmartArt, Chart, Link (hyperlink), Header, Footer, Page Number, Text Box, WordArt, Drop Cap, Symbol, Equation"],["Design","Themes, document formatting, Watermark, Page Colour, Page Borders"],["Layout (Page Layout in 2010/2013)","Margins, Orientation, Size, Columns, Breaks, Line Numbers, Hyphenation, Indent and Spacing"],["References","Table of Contents, Footnotes, Endnotes, Citations and Bibliography, Captions, Index"],["Mailings","Envelopes, Labels, Start Mail Merge, Select Recipients, Insert Merge Field, Finish and Merge"],["Review","Spelling and Grammar, Thesaurus, Word Count, Comments, Track Changes, Accept / Reject, Compare, Protect"],["View","Read Mode, Print Layout, Web Layout, Outline, Draft, Ruler, Gridlines, Navigation Pane, Zoom, Macros"]]},{"k":"table","title":"Views in Word","head":["View","Use"],"rows":[["Print Layout","Default view; shows the page exactly as it will print"],["Read Mode","Full-screen reading; editing tools hidden"],["Web Layout","Shows how the document looks as a web page"],["Outline","Shows the heading structure; move whole sections"],["Draft","Plain text only; headers, footers and pictures hidden — fastest for typing"]]},{"k":"table","title":"Word formatting and page features","head":["Feature","What it means"],"rows":[["Alignment","Left (default), Center, Right, Justify (both edges straight)"],["Line spacing","Gap between lines: 1.0, 1.15, 1.5, 2.0 … (Home → Paragraph)"],["Indent","Distance of text from the margin; first-line and hanging indents"],["Styles","Saved formatting sets: Normal, Heading 1, Heading 2, Title …; headings feed the Table of Contents"],["Format Painter","Copies formatting from one text to another (paintbrush icon)"],["Margins","Blank space around the page; Normal = 1 inch on each side"],["Gutter","Extra margin for binding"],["Orientation","Portrait (tall) or Landscape (wide)"],["Breaks","Page break; section breaks: Next Page, Continuous, Even Page, Odd Page; column break"],["Columns","Newspaper-style columns (Layout → Columns)"],["Header / Footer","Text repeated at the top / bottom of every page; page numbers usually go here"],["Footnote / Endnote","Note at the bottom of the page / at the end of the document"],["Drop Cap","Large first letter of a paragraph (Insert tab)"],["Watermark","Faint text or picture behind page text, e.g. CONFIDENTIAL"],["Mail Merge","Main document + data source (Excel list, Outlook contacts) = personalised letters, envelopes, labels"],["Track Changes","Records every insertion and deletion so a reviewer can accept or reject it"],["Find &amp; Replace","Find a word (Ctrl+F) and replace it (Ctrl+H)"],["AutoCorrect","Fixes common typing mistakes automatically (teh → the)"],["Spell check","Red wavy underline = spelling; blue double underline = grammar (Word 2013 onwards)"],["Table","Insert → Table; cells in rows and columns; merge and split cells"]]},{"k":"table","title":"Word-specific shortcuts","head":["Keys","Action in Word"],"rows":[["Ctrl+B / Ctrl+I / Ctrl+U","Bold / Italic / Underline"],["Ctrl+Shift+D","Double underline"],["Ctrl+L / Ctrl+E / Ctrl+R / Ctrl+J","Align left / Center / Align right / Justify"],["Ctrl+] / Ctrl+[","Increase / decrease font size by 1 point"],["Ctrl+Shift+&gt; / Ctrl+Shift+&lt;","Increase / decrease font size to the next size in the list"],["Ctrl+D","Font dialog box"],["Shift+F3","Change case (lowercase, UPPERCASE, Capitalise Each Word)"],["Ctrl+= / Ctrl+Shift+plus","Subscript / Superscript"],["Ctrl+1 / Ctrl+2 / Ctrl+5","Single / double / 1.5 line spacing"],["Ctrl+M / Ctrl+Shift+M","Increase / decrease left indent"],["Ctrl+T","Hanging indent"],["Ctrl+Enter","Page break"],["Shift+Enter","Line break (new line, same paragraph)"],["Ctrl+Shift+Enter","Column break"],["Ctrl+K","Insert hyperlink"],["Ctrl+W","Close the document"],["Ctrl+Home / Ctrl+End","Beginning / end of the document"],["Ctrl+Space","Remove character formatting"],["Ctrl+Shift+C / Ctrl+Shift+V","Copy formatting / paste formatting"],["F7 / Shift+F7","Spelling and Grammar / Thesaurus"],["Ctrl+Shift+E","Turn Track Changes on or off"],["Ctrl+Alt+M","Insert a comment"],["Ctrl+Alt+F / Ctrl+Alt+D","Insert footnote / endnote"],["Alt+Shift+D / Alt+Shift+T","Insert date / time"],["Ctrl+Alt+C / R / T","© / ® / ™ symbol"],["F4","Repeat the last action"],["F12","Save As"]]},{"k":"trick","h":"Alignment keys spell <span class='mn'>L-E-R-J<\/span>: <span class='mn'>L<\/span>eft, c<span class='mn'>E<\/span>nter (the E in cEntre), <span class='mn'>R<\/span>ight, <span class='mn'>J<\/span>ustify — 'Let Every Row Justify'. Square brackets grow and shrink: <span class='mn'>]<\/span> points right = bigger, <span class='mn'>[<\/span> = smaller."},{"k":"trap","h":"<b>Ctrl+C is copy, not center<\/b> — center is <b>Ctrl+E<\/b>. <b>Ctrl+Enter<\/b> = page break but <b>Shift+Enter<\/b> = line break. <b>Ctrl+D<\/b> in Word opens the Font dialog, not 'duplicate' or 'bookmark'. <b>Shift+F3<\/b> changes case in Word but opens Insert Function in Excel. <b>F7<\/b> is spelling; <b>Shift+F7<\/b> is the Thesaurus. <b>Header/footer<\/b> are on the Insert tab, <b>Margins/Orientation<\/b> on the Layout tab, <b>Mail Merge<\/b> on Mailings, <b>Track Changes<\/b> on Review. Default extension is <b>.docx<\/b>; <b>.dotx<\/b> is a template."}],"sum":["MS Word is a word processor; default file .docx (older .doc), template .dotx.","Ribbon tabs: Home formatting, Insert tables and headers, Layout margins and orientation, Mailings mail merge, Review spelling and track changes.","Alignment: Ctrl+L left, Ctrl+E center, Ctrl+R right, Ctrl+J justify.","Ctrl+K hyperlink, Ctrl+Enter page break, Shift+F3 change case, Ctrl+] and Ctrl+[ font size by 1 point.","F7 spelling and grammar, Shift+F7 thesaurus, Ctrl+W close document, F12 Save As."],"part":["Part 2 · Software & MS Office","सॉफ़्टवेयर एवं एमएस ऑफ़िस"]},
{"id":"C10","g":"cmp","heat":3,"title":"MS Excel","hi":"एमएस एक्सेल","blocks":[{"k":"hot","h":"Excel gives 2–3 questions: <b>cell address and references ($A$1)<\/b>, <b>functions<\/b> (COUNT vs COUNTA, VLOOKUP, IF), <b>error values<\/b> (#DIV/0!, #N/A, ####), the <b>row/column limits<\/b> and shortcuts like Alt+= and Ctrl+;."},{"k":"story","h":"<p>MS Excel is a <b>spreadsheet<\/b> — think of a huge <b>attendance register<\/b> drawn as a grid. The whole register is a <b>workbook<\/b> (one file); each page in it is a <b>worksheet<\/b>; each little box is a <b>cell<\/b>. Columns go across with letters (A, B, C…) and rows go down with numbers (1, 2, 3…), so every box has an address such as <b>B3<\/b> — column B, row 3, like a seat number in a cinema.<\/p><p>The magic of Excel is the <b>formula<\/b>. Type <b>=B3+C3<\/b> in a cell and Excel adds those two boxes; change either number and the answer updates by itself. Ready-made formulas are called <b>functions<\/b>: SUM adds, AVERAGE finds the mean, MAX picks the largest.<\/p><p>When you copy a formula down, Excel shifts the addresses automatically (a <b>relative reference<\/b>). If you want one address to stay fixed — say a tax rate in one cell — you pin it with dollar signs, <b>$B$1<\/b> (an <b>absolute reference<\/b>). Charts, sorting and filters then turn the numbers into answers.<\/p>","key":"Workbook holds worksheets, worksheets hold cells; formulas start with = and dollar signs fix a reference."},{"k":"facts","title":"Excel basics and limits","rows":[["Type of software","Spreadsheet (application software) by Microsoft"],["Workbook","The whole Excel file; default name Book1"],["Worksheet","One sheet (tab) in a workbook; default names Sheet1, Sheet2 …"],["Sheets in a new workbook","1 (Excel 2013 onwards); 3 in Excel 2007 and 2010"],["Cell","Intersection of a row and a column"],["Cell address / reference","Column letter + row number, e.g. C5"],["Active cell","The selected cell with a thick border; its address shows in the Name Box"],["Range","Group of cells written with a colon, e.g. A1:B5 (10 cells)"],["Name Box","Left of the formula bar; shows the active cell address or a named range"],["Formula bar","Shows and edits the content or formula of the active cell (fx)"],["Rows","Identified by numbers; 1,048,576 rows (Excel 2007 onwards)"],["Columns","Identified by letters; 16,384 columns; last column <b>XFD<\/b>"],["Excel 2003 limits","65,536 rows and 256 columns (last column IV)"],["Characters in one cell","Up to 32,767"],["File extensions","<b>.xlsx<\/b> workbook; .xls (Excel 97–2003); <b>.xlsm<\/b> macro-enabled; .xltx template; .csv plain text"],["Fill handle","Small square at the bottom-right of a selection; drag to copy or continue a series"],["Default alignment","Text aligns left, numbers align right"]]},{"k":"table","title":"Formulas, operators and references","head":["Item","Rule / example"],"rows":[["Formula","Always begins with = (for example =A1+B1)"],["Arithmetic operators","+ add, - subtract, * multiply, / divide, ^ power, % percent"],["Text operator","&amp; joins text: =A1&amp;' '&amp;B1"],["Comparison operators","=, &gt;, &lt;, &gt;=, &lt;=, &lt;&gt; (not equal)"],["Order of operations","Brackets → negation → % → ^ → * and / → + and - → &amp; → comparison"],["Example","=10+5*2 gives 20; =(10+5)*2 gives 30; =2^3 gives 8"],["Relative reference","A1 — changes when the formula is copied"],["Absolute reference","$A$1 — column and row both fixed"],["Mixed reference","$A1 (column fixed) or A$1 (row fixed)"],["F4 key","While editing a formula, cycles A1 → $A$1 → A$1 → $A1 → A1"],["Reference to another sheet","Sheet2!A1"],["Ctrl+` (grave accent)","Show formulas instead of results"]]},{"k":"table","title":"Common functions","head":["Function","What it returns","Example"],"rows":[["SUM","Total","=SUM(A1:A10)"],["AVERAGE","Arithmetic mean","=AVERAGE(B2:B6)"],["COUNT","Number of cells containing numbers","=COUNT(A1:A10)"],["COUNTA","Number of non-empty cells (numbers, text, anything)","=COUNTA(A1:A10)"],["COUNTBLANK","Number of empty cells","=COUNTBLANK(A1:A10)"],["COUNTIF / SUMIF","Count / add cells meeting a condition","=COUNTIF(A1:A10,'&gt;50') — Excel itself uses double quotes"],["MAX / MIN","Largest / smallest value","=MAX(C1:C20)"],["IF","One value if a test is TRUE, another if FALSE","=IF(B2&gt;=33,'Pass','Fail')"],["AND / OR / NOT","Logical tests","=AND(A1&gt;0,B1&gt;0)"],["ROUND","Rounds to given digits","=ROUND(3.14159,2) gives 3.14"],["VLOOKUP","Looks for a value in the first column of a table, returns a value from a column to the right (vertical)","=VLOOKUP(101,A2:D50,3,FALSE)"],["HLOOKUP","Same, but searches the first row (horizontal)","=HLOOKUP(…)"],["XLOOKUP","Modern replacement for VLOOKUP/HLOOKUP (Excel 2021 / 365)","=XLOOKUP(…)"],["CONCAT / CONCATENATE","Joins text (CONCAT from Excel 2016 / 365)","=CONCATENATE(A1,B1)"],["LEN","Number of characters","=LEN('Excel') gives 5"],["UPPER / LOWER / PROPER / TRIM","Change case / remove extra spaces","=PROPER('ram kumar') gives Ram Kumar"],["TODAY","Current date only","=TODAY()"],["NOW","Current date and time","=NOW()"],["ABS / SQRT / MOD / POWER","Absolute value / square root / remainder / power","=MOD(17,5) gives 2"]]},{"k":"table","title":"Error values","head":["Error","Cause"],"rows":[["#DIV/0!","Dividing by zero or by an empty cell"],["#N/A","Value not available — e.g. VLOOKUP cannot find the item"],["#NAME?","Excel does not recognise text in the formula — misspelt function or range name"],["#REF!","Invalid cell reference — the referred cell was deleted"],["#VALUE!","Wrong type of argument — e.g. adding text to a number"],["#NUM!","Invalid number — e.g. =SQRT(-1)"],["#NULL!","Intersection of two ranges that do not meet"],["#SPILL!","Dynamic-array result blocked by data (Excel 365)"],["#### ","Column too narrow to show the number or date (or a negative date/time)"]]},{"k":"table","title":"Excel tools","head":["Tool","Where / what"],"rows":[["Charts","Insert tab: Column, Bar, Line, Pie, Area, Scatter (XY) …; pie shows parts of one whole"],["Sort","Data tab: A→Z, Z→A, or custom sort on several columns"],["Filter","Data tab (Ctrl+Shift+L): show only rows that meet a condition"],["Freeze Panes","View tab: keeps header rows/columns visible while scrolling"],["Conditional Formatting","Home tab: colours cells automatically by rule (e.g. marks below 33 in red)"],["Data Validation","Data tab: restricts what can be typed in a cell (e.g. a drop-down list)"],["PivotTable","Insert tab: summarises large data quickly"],["Merge &amp; Center","Home tab: joins cells and centres the text"],["Wrap Text","Home tab: shows long text on several lines in one cell"],["AutoFill / Flash Fill","Drag fill handle to continue series (Jan, Feb…); Flash Fill (Ctrl+E) fills a pattern"],["Goal Seek / What-If Analysis","Data tab: find the input needed for a desired result"],["Macro","Recorded set of steps (View or Developer tab); saved in .xlsm"]]},{"k":"table","title":"Excel shortcuts","head":["Keys","Action in Excel"],"rows":[["Ctrl+N","New workbook"],["Ctrl+W","Close workbook"],["F2","Edit the active cell"],["F4","Toggle absolute/relative reference (while editing); otherwise repeat last action"],["Ctrl+;","Insert today's date"],["Ctrl+Shift+;","Insert current time"],["Alt+=","AutoSum"],["Ctrl+Shift+L","Turn filter on/off"],["Shift+F11 (or Alt+Shift+F1)","Insert a new worksheet"],["Ctrl+Page Down / Ctrl+Page Up","Next / previous worksheet"],["Ctrl+1","Format Cells dialog box"],["F11 / Alt+F1","Chart on a new chart sheet / embedded chart on the same sheet"],["Ctrl+D / Ctrl+R","Fill down / fill right"],["Ctrl+Enter","Fill all selected cells with the same entry"],["Alt+Enter","New line inside the same cell"],["Ctrl+Space / Shift+Space","Select the whole column / the whole row"],["Ctrl+Home","Go to cell A1"],["Ctrl+Arrow key","Jump to the edge of the data"],["Ctrl+T (or Ctrl+L)","Create a table"],["Ctrl+K","Insert hyperlink"],["Shift+F3","Insert Function dialog"],["F9","Recalculate all formulas"],["Ctrl+9 / Ctrl+0","Hide rows / hide columns"],["Ctrl+Shift+$ / Ctrl+Shift+%","Currency format / percentage format"],["Ctrl+5","Strikethrough"],["F7","Spelling"]]},{"k":"trick","h":"<span class='mn'>R<\/span>ows = <span class='mn'>R<\/span>eal numbers, <span class='mn'>C<\/span>olumns = <span class='mn'>C<\/span>haracters (letters). The dollar sign is a <span class='mn'>lock<\/span>: $ before the letter locks the column, $ before the number locks the row. <span class='mn'>V<\/span>LOOKUP = <span class='mn'>V<\/span>ertical (searches down), <span class='mn'>H<\/span>LOOKUP = <span class='mn'>H<\/span>orizontal (searches across)."},{"k":"trap","h":"<b>COUNT<\/b> counts only numbers; <b>COUNTA<\/b> counts every non-empty cell. <b>TODAY()<\/b> gives the date only; <b>NOW()<\/b> gives date and time. <b>####<\/b> is not an error in the formula — the column is just too narrow. <b>#NAME?<\/b> = misspelt function; <b>#REF!<\/b> = deleted reference; <b>#N/A<\/b> = lookup value not found. <b>Ctrl+D<\/b> in Excel fills down (Font dialog in Word, bookmark in browser). <b>Ctrl+;<\/b> = date, <b>Ctrl+Shift+;<\/b> = time. <b>F11<\/b> makes a chart sheet, <b>Shift+F11<\/b> adds a worksheet. A <b>workbook<\/b> is the file; a <b>worksheet<\/b> is one page in it."}],"sum":["A workbook (.xlsx) contains worksheets; each cell is addressed by column letter and row number, e.g. B3.","Modern Excel has 1,048,576 rows and 16,384 columns; the last column is XFD.","Formulas start with =; A1 is relative, $A$1 absolute, $A1 or A$1 mixed; F4 cycles them.","COUNT counts numbers, COUNTA non-empty cells; VLOOKUP vertical, HLOOKUP horizontal; TODAY date, NOW date and time.","Errors: #DIV/0! divide by zero, #N/A not found, #NAME? bad name, #REF! bad reference, #### narrow column."],"part":["Part 2 · Software & MS Office","सॉफ़्टवेयर एवं एमएस ऑफ़िस"]},
{"id":"C11","g":"cmp","heat":2,"title":"MS PowerPoint & other Office apps","hi":"एमएस पावरपॉइंट एवं अन्य ऑफिस ऐप्स","blocks":[{"k":"hot","h":"Usually 1 question: <b>F5 vs Shift+F5<\/b>, <b>Ctrl+M<\/b> new slide, <b>transition vs animation<\/b>, <b>Slide Sorter<\/b> view, or <b>.pptx<\/b>. Access (primary key, tables / queries / forms / reports) appears now and then."},{"k":"story","h":"<p>PowerPoint is a set of <b>digital flash cards<\/b> for a talk. Each card is a <b>slide<\/b>; the whole pack is a <b>presentation<\/b> saved as a .pptx file. A <b>layout<\/b> decides where the title and text boxes sit on one slide; a <b>theme<\/b> gives every slide the same colours and fonts; and the <b>Slide Master<\/b> is the master card — change it once and every slide changes.<\/p><p>Movement comes in two kinds. A <b>transition<\/b> is the effect as you move from one slide to the next, like turning a page. An <b>animation<\/b> moves something <i>inside<\/i> a slide — a bullet flying in, a picture fading out. Press <b>F5<\/b> to start the show from the first slide, or <b>Shift+F5<\/b> to start from the slide you are on.<\/p><p><b>MS Access<\/b> is a different tool: a <b>database<\/b>, like a well-kept office register. Data sits in <b>tables<\/b>; a <b>query<\/b> asks a question, a <b>form<\/b> is a neat screen for typing data in, and a <b>report<\/b> prints the results. Every record is identified by a unique <b>primary key<\/b>, like a roll number.<\/p>","key":"Transition is between slides, animation is within a slide; Access stores data in tables identified by a primary key."},{"k":"facts","title":"PowerPoint basics","rows":[["Type of software","Presentation software by Microsoft"],["File extensions","<b>.pptx<\/b> (2007 onwards); .ppt older; .ppsx opens directly as a show; .potx template; .pptm macro-enabled"],["Slide","One page of a presentation"],["Layout","Arrangement of placeholders on a slide (Title Slide, Title and Content, Two Content, Blank …)"],["Placeholder","Dotted box that holds title, text, picture or chart"],["Theme / Design","Matching colours, fonts and background for all slides (Design tab)"],["Slide Master","Controls the design and layout of every slide (View → Slide Master)"],["Transition","Effect while moving from one slide to the next (Transitions tab)"],["Animation","Effect on text or objects within a slide: Entrance, Emphasis, Exit, Motion Paths (Animations tab)"],["Speaker notes","Notes for the presenter, typed under the slide; not shown to the audience"],["Presenter View","Presenter sees notes and next slide while the audience sees only the slide"],["Rehearse Timings","Records how long each slide is shown"],["Hide Slide","Slide stays in the file but is skipped during the show"],["Default slide size","Widescreen 16:9 (PowerPoint 2013 onwards); 4:3 earlier"]]},{"k":"table","title":"PowerPoint views","head":["View","Use"],"rows":[["Normal","Default editing view: slide pane, thumbnails on the left, notes below"],["Outline View","Edit the text of all slides as an outline"],["Slide Sorter","All slides as thumbnails — rearrange, delete, copy, set transitions"],["Notes Page","Slide with its speaker notes, as it would print"],["Reading View","Plays the show inside the PowerPoint window"],["Slide Show","Full-screen presentation for the audience"],["Master views","Slide Master, Handout Master, Notes Master"]]},{"k":"table","title":"PowerPoint shortcuts","head":["Keys","Action"],"rows":[["F5","Start slide show from the first slide"],["Shift+F5","Start slide show from the current slide"],["Ctrl+M","Insert a new slide"],["Ctrl+D","Duplicate the selected slide or object"],["Ctrl+N","New presentation"],["Ctrl+K","Insert hyperlink"],["Esc","End the slide show"],["N, Enter, Space, Right arrow","Next slide / animation during a show"],["P, Backspace, Left arrow","Previous slide during a show"],["Slide number + Enter","Jump to that slide during a show"],["B / W","Black screen / white screen during a show (press again to return)"]]},{"k":"table","title":"MS Access — database basics","head":["Item","Meaning"],"rows":[["MS Access","Database management system (DBMS) in MS Office; file .accdb (2007 onwards), .mdb older"],["Table","Stores the data in rows and columns — the basic object"],["Record","One row of a table (all details of one person / item)"],["Field","One column of a table (one type of detail, e.g. Name)"],["Primary key","Field whose value is unique for every record and cannot be empty, e.g. Roll No"],["Foreign key","Field that refers to the primary key of another table; links tables"],["Query","Asks a question — selects, sorts or calculates data meeting conditions"],["Form","User-friendly screen for entering and viewing data"],["Report","Formatted summary of data for printing"],["Macro / Module","Automates tasks / VBA program code"],["Datasheet view vs Design view","Data in a grid vs structure of the table (fields and data types)"],["Data types","Short Text (up to 255 characters), Long Text, Number, Date/Time, Currency, AutoNumber, Yes/No, Hyperlink, Attachment"]]},{"k":"table","title":"Other Office apps and equivalents","head":["Microsoft app","Purpose","Google / LibreOffice equivalent"],"rows":[["Word","Word processor","Google Docs / LibreOffice Writer"],["Excel","Spreadsheet","Google Sheets / LibreOffice Calc"],["PowerPoint","Presentation","Google Slides / LibreOffice Impress"],["Access","Database","LibreOffice Base"],["Outlook","Email client plus calendar, contacts and tasks (personal information manager)","Gmail and Google Calendar (web)"],["OneNote","Digital notebook for free-form notes","Google Keep (simple notes)"],["Publisher","Desktop publishing: brochures, newsletters, cards","LibreOffice Draw"],["Teams","Chat, meetings and collaboration","Google Meet / Chat"]]},{"k":"trick","h":"<span class='mn'>T<\/span>ransition = <span class='mn'>T<\/span>raffic between slides; <span class='mn'>A<\/span>nimation = <span class='mn'>A<\/span>ction inside a slide. <span class='mn'>F5<\/span> = 'from the first', <span class='mn'>Shift+F5<\/span> = 'from where I Stand'. Access objects: <span class='mn'>T Q F R<\/span> — 'Teachers Quickly Fill Registers': Tables, Queries, Forms, Reports."},{"k":"trap","h":"<b>Transition vs animation<\/b>: between slides vs within a slide. <b>F5<\/b> starts from slide 1, <b>Shift+F5<\/b> from the current slide. <b>Slide Sorter<\/b> shows thumbnails; <b>Notes Page<\/b> shows speaker notes. <b>Ctrl+M<\/b> is new slide in PowerPoint but indent in Word. <b>Ctrl+D<\/b> duplicates in PowerPoint. In Access a <b>form<\/b> is for entering data, a <b>report<\/b> is for printing it; a <b>record<\/b> is a row, a <b>field<\/b> is a column; a primary key cannot repeat or be empty. Outlook is email, not a browser."}],"sum":["PowerPoint saves as .pptx; a slide's arrangement is its layout, and the Slide Master changes all slides at once.","Transition is the effect between slides; animation is the effect on objects within a slide.","F5 starts the show from the first slide, Shift+F5 from the current slide, Ctrl+M adds a new slide, Esc ends the show.","Views: Normal, Outline, Slide Sorter (thumbnails), Notes Page, Reading View, Slide Show.","MS Access (.accdb) is a DBMS: tables, queries, forms, reports; a primary key uniquely identifies each record."],"part":["Part 2 · Software & MS Office","सॉफ़्टवेयर एवं एमएस ऑफ़िस"]},
{"id":"C12","g":"cmp","heat":3,"title":"Internet & the World Wide Web","hi":"इंटरनेट एवं वर्ल्ड वाइड वेब","blocks":[{"k":"hot","h":"Almost every paper has one internet question: <b>who invented the WWW<\/b>, the <b>parts of a URL<\/b>, what <b>DNS<\/b> does, a <b>browser vs search engine<\/b> swap, or a TLD like <b>.gov / .edu<\/b>."},{"k":"story","h":"<p>Think of the <b>internet<\/b> as the road network of the whole world: millions of computers joined by cables, towers and satellites. The <b>World Wide Web<\/b> is only one kind of traffic on those roads, just as buses are only one kind of vehicle. Email, video calls and file transfer also travel on the same internet but are not the web.<\/p><p>The web is a giant library of <b>pages<\/b> joined by <b>hyperlinks<\/b>. Every page has an address called a <b>URL<\/b>, like a postal address. Computers, however, only understand number addresses (IP addresses), so a helper called <b>DNS<\/b> works like a phone directory: you give it a name such as google.com and it returns the number.<\/p><p>To read pages you need a <b>browser<\/b> (Chrome, Firefox, Edge, Safari) – the reading glasses. To find pages whose address you do not know you use a <b>search engine<\/b> (Google, Bing) – the library catalogue. The company that gives you the connection, like a water-pipe supplier, is your <b>ISP<\/b>.<\/p>","key":"Internet = the roads; WWW = one service on them; URL = address; DNS = phone directory; browser = reader; search engine = catalogue."},{"k":"tl","title":"Milestones of the internet and web","rows":[["1969","ARPANET, funded by the US Department of Defense, links its first computers – the ancestor of the internet"],["1971","Ray Tomlinson sends the first network e-mail using the @ sign"],["1974","Vint Cerf and Bob Kahn publish the TCP/IP design – 'fathers of the internet'"],["1983","ARPANET switches to TCP/IP (1 January 1983); DNS is introduced the same year"],["1989","Tim Berners-Lee proposes the World Wide Web at CERN (Geneva, Switzerland)"],["1990","Berners-Lee writes the first browser (WorldWideWeb) and the first web server"],["1991","The web is opened to the public; first website: info.cern.ch"],["1993","Mosaic – the first popular graphical browser (NCSA, USA)"],["1994","Netscape Navigator browser released"],["1995","Internet Explorer released; VSNL starts public internet in India (15 August 1995)"],["1998","Google founded by Larry Page and Sergey Brin"],["2008","Google Chrome browser released"]]},{"k":"table","title":"Parts of a URL: https://www.example.gov.in/exams/result.html","head":["Part","In the example","What it is"],"rows":[["Protocol (scheme)","https://","Rules used to fetch the page (http, https, ftp)"],["Sub-domain","www","Server name inside the domain"],["Domain name","example.gov.in","Name of the website, turned into an IP address by DNS"],["Top-level domain (TLD)","in","Last part of the domain – country or category"],["Path","/exams/","Folder on the server"],["File name","result.html","The exact page requested"]]},{"k":"table","title":"Common top-level domains","head":["TLD","Meant for","Type"],"rows":[[".com","Commercial organisations","Generic"],[".org","Organisations, often non-profit","Generic"],[".net","Network providers (now open to all)","Generic"],[".edu","Educational institutions (mainly US)","Sponsored"],[".gov","Government (US); India uses .gov.in","Sponsored"],[".mil","US military","Sponsored"],[".int","International treaty organisations","Sponsored"],[".in","India","Country code (ccTLD)"],[".uk / .us / .jp","United Kingdom / USA / Japan","Country code (ccTLD)"]]},{"k":"table","title":"Look-alike web terms","head":["Term","Meaning","Example / note"],"rows":[["Web page","One single document on the web","result.html"],["Website","A collection of related web pages under one domain","ssc.gov.in"],["Home page","The first / main page of a website (also the page a browser opens at start)","index.html"],["Hyperlink","Clickable text or image that takes you to another page or place","Usually blue and underlined"],["Web browser","Software to view web pages","Chrome, Firefox, Edge, Safari, Opera"],["Search engine","Website that searches the web for you","Google, Bing, Yahoo, DuckDuckGo"],["Web server","Computer that stores websites and sends pages on request","Apache, IIS"],["Cookie","Small text file a website stores in your browser to remember you","Login, cart, preferences"],["Cache","Stored copies of pages and images so they load faster next time","Clear it if a page looks old"],["History","List of pages you visited","Ctrl+H in Chrome, Edge, Firefox"],["Bookmark / Favourite","Saved link to a page","Ctrl+D in Chrome, Edge, Firefox"],["Download / Upload","Internet to your device / your device to the internet","Saving a PDF vs attaching a photo"],["Streaming","Playing audio or video while it is still arriving, without saving the full file first","YouTube, online radio"],["Intranet","Private network of one organisation using internet technology","Staff-only portal"],["Extranet","Intranet opened to selected outsiders (partners, suppliers)","Dealer portal"]]},{"k":"facts","title":"HTML and IP basics","rows":[["HTML","Hyper Text Markup Language – the language web pages are written in (Tim Berners-Lee)"],["Markup, not programming","HTML describes structure with tags; it does not do calculations"],["Tags","Written in angle brackets: &lt;html&gt;, &lt;head&gt;, &lt;title&gt;, &lt;body&gt;, &lt;p&gt;, &lt;a&gt; (link), &lt;img&gt;, &lt;br&gt;"],["Container vs empty tag","&lt;p&gt;…&lt;/p&gt; has a closing tag; &lt;br&gt; and &lt;img&gt; have none"],["File extension",".html or .htm"],["Styling / behaviour","CSS gives the look; JavaScript adds interactivity"],["IP address","Unique number for each device on a network, e.g. 192.168.1.1 (IPv4)"],["ISP","Internet Service Provider – BSNL, Jio, Airtel"],["Domain names managed by","ICANN (worldwide); .in registry run by NIXI"]]},{"k":"trick","h":"URL order: <span class='mn'>P<\/span>lease <span class='mn'>D<\/span>on't <span class='mn'>P<\/span>ush <span class='mn'>F<\/span>riends = <b>P<\/b>rotocol, <b>D<\/b>omain, <b>P<\/b>ath, <b>F<\/b>ile. Web father: <span class='mn'>T<\/span>im = <span class='mn'>T<\/span>hree W's; internet fathers: <span class='mn'>C<\/span>erf &amp; <span class='mn'>K<\/span>ahn = <b>TCP<\/b>."},{"k":"trap","h":"<b>Internet ≠ WWW<\/b>: the internet is the network (1969, ARPANET); the web is a service on it (1989–91, Berners-Lee). <b>Browser ≠ search engine<\/b>: Chrome is a browser, Google is a search engine. <b>Web page ≠ website ≠ home page<\/b>. <b>Cookie ≠ cache<\/b>: cookie remembers <i>you<\/i>, cache stores <i>page files<\/i>. <b>Intranet<\/b> is private, <b>extranet<\/b> lets chosen outsiders in."}],"sum":["Internet is the global network (ARPANET 1969); the WWW is a service on it, invented by Tim Berners-Lee at CERN in 1989-91.","A URL has protocol, domain name (ending in a TLD such as .com, .gov, .in) and path; DNS converts the name into an IP address.","Browsers (Chrome, Firefox, Edge, Safari; historic Mosaic, Netscape) display pages; search engines (Google, Bing) find them.","HTML (Hyper Text Markup Language) builds web pages with tags; files end in .html or .htm.","Cookies remember the user, cache stores page copies; intranet is private, extranet admits chosen outsiders; an ISP gives the connection."],"part":["Part 3 · Internet, networks & security","इंटरनेट, नेटवर्क एवं सुरक्षा"]},
{"id":"C13","g":"cmp","heat":2,"title":"E-mail & e-banking","hi":"ई-मेल एवं ई-बैंकिंग","blocks":[{"k":"hot","h":"Email questions focus on <b>CC vs BCC<\/b>, the folders (Drafts, Outbox, Spam) and the inventor <b>Ray Tomlinson<\/b>. Banking questions ask the full forms and differences of <b>NEFT, RTGS, IMPS, UPI<\/b> and safe-payment habits (OTP, PIN)."},{"k":"story","h":"<p><b>E-mail<\/b> is a post office that works in seconds. Your e-mail address is your letter box: the part before <b>@<\/b> is your name on the box, the part after it is the post office (the mail server) that keeps the box, as in ravi@gmail.com.<\/p><p>When you write a letter you can put people in the <b>To<\/b> line (the main readers), in <b>CC<\/b> (a copy for information, everyone can see it) or in <b>BCC<\/b> (a hidden copy – other readers never learn this person got it). Unfinished letters wait in <b>Drafts<\/b>; letters still leaving sit in the <b>Outbox<\/b>; letters already gone appear in <b>Sent<\/b>; junk lands in <b>Spam<\/b>.<\/p><p><b>E-banking<\/b> is the same idea for money. Instead of standing in a bank queue, you move money with net banking, a mobile app or <b>UPI<\/b>. Each system is a different road: <b>RTGS<\/b> for big amounts instantly, <b>NEFT<\/b> in half-hourly batches, <b>IMPS<\/b> and <b>UPI<\/b> instantly at any hour. The keys to your money are your PIN and OTP – never share them with anyone.<\/p>","key":"@ splits user and mail server; BCC hides recipients; RTGS big and instant, NEFT batches, IMPS and UPI instant 24x7; never share PIN or OTP."},{"k":"table","title":"E-mail fields and folders","head":["Item","What it does","Remember"],"rows":[["To","Main recipient(s)","Must have at least one recipient in To, CC or BCC"],["CC (Carbon Copy)","Sends a copy; all recipients can see CC addresses","For information only"],["BCC (Blind Carbon Copy)","Sends a copy; BCC addresses are hidden from every other recipient","Use for mass mails to protect privacy"],["Subject","One-line topic of the mail","Shown in the inbox list"],["Attachment","File sent with the mail (paper-clip icon)","Gmail limit 25 MB; bigger files go as a Google Drive link"],["Signature","Text added automatically at the end of every mail","Name, designation, phone"],["Inbox","Received mail","Unread mail usually in bold"],["Outbox","Mail waiting to be sent (e.g. when offline)","Not yet gone"],["Sent","Copies of mail already sent","Proof you sent it"],["Drafts","Saved, unfinished mail – not sent","Auto-saved while typing"],["Spam / Junk","Unwanted or suspicious bulk mail","Filtered automatically"],["Trash / Bin","Deleted mail","Gmail empties it after 30 days"]]},{"k":"table","title":"Reply, Reply All, Forward","head":["Action","Goes to","Attachments"],"rows":[["Reply","Only the original sender","Original attachment is not sent back"],["Reply All","Sender plus everyone in To and CC (never the BCC people)","Not sent back"],["Forward","Anyone new you type in","Original attachments are included"]]},{"k":"facts","title":"E-mail facts","rows":[["Inventor of network e-mail","Ray Tomlinson, 1971, on ARPANET"],["Why @","Tomlinson chose @ to separate the user name from the host (computer) name"],["Address format","username@domain, e.g. ravi@gmail.com"],["Sending protocol","SMTP (port 25)"],["Receiving protocols","POP3 (downloads, port 110) and IMAP (keeps mail synced on server, port 143)"],["Hotmail","Free web mail founded in 1996 by Sabeer Bhatia and Jack Smith"],["Gmail","Launched by Google on 1 April 2004"],["Gmail free storage","15 GB, shared with Google Drive and Google Photos"],["Gmail features","Labels, Undo Send, Schedule send, Confidential mode, Spam filter"],["Spam","Unsolicited bulk e-mail"]]},{"k":"table","title":"Electronic fund transfer systems","head":["System","Full form","Run by","Key point"],"rows":[["NEFT","National Electronic Funds Transfer","RBI","Settled in half-hourly batches; no minimum amount; available 24x7 since December 2019"],["RTGS","Real Time Gross Settlement","RBI","Each transfer settled individually in real time; minimum Rs 2 lakh, no upper limit; 24x7 since December 2020"],["IMPS","Immediate Payment Service","NPCI","Instant, 24x7 including holidays; launched 2010"],["UPI","Unified Payments Interface","NPCI","Instant mobile payments using a virtual address (name@bank) or QR code; launched 2016"],["BHIM","Bharat Interface for Money","NPCI","Government-backed UPI app, launched December 2016"],["RuPay","India's own card network","NPCI","Domestic alternative to Visa / Mastercard"]]},{"k":"facts","title":"Safe digital banking","rows":[["OTP","One Time Password – valid once, for a short time"],["2FA","Two-factor authentication: something you know (password) + something you have (phone/OTP)"],["PIN","Personal Identification Number – never write it on the card, never share it"],["UPI PIN","Needed only to SEND money; you never enter a PIN to RECEIVE money"],["Banks never ask for","Password, PIN, OTP or CVV by call, SMS or e-mail"],["Safe website","Starts with https:// and shows a padlock"],["Public Wi-Fi","Avoid doing banking on open public Wi-Fi"],["IFSC","Indian Financial System Code – 11-character bank branch code needed for NEFT/RTGS"],["KYC","Know Your Customer – identity check by banks"],["Fraud reporting","Cyber-crime helpline 1930 and portal cybercrime.gov.in"]]},{"k":"trick","h":"<span class='mn'>B<\/span>CC = <span class='mn'>B<\/span>lind = nobody sees. Money speed: <span class='mn'>R<\/span>TGS = <span class='mn'>R<\/span>ich (Rs 2 lakh minimum) and <span class='mn'>R<\/span>eal time; <span class='mn'>N<\/span>EFT = <span class='mn'>N<\/span>ot instant (batches); <span class='mn'>I<\/span>MPS = <span class='mn'>I<\/span>mmediate."},{"k":"trap","h":"<b>CC vs BCC<\/b>: both get the mail; only BCC is hidden. <b>Outbox vs Sent<\/b>: Outbox = not yet gone. <b>Drafts<\/b> are never sent. <b>Reply All<\/b> does not reach BCC recipients. <b>RTGS vs NEFT<\/b>: RTGS is real-time and individual with a Rs 2 lakh minimum; NEFT is in batches. <b>UPI and IMPS<\/b> are run by NPCI, NEFT and RTGS by RBI. You never need a PIN to <i>receive<\/i> money."}],"sum":["An e-mail address is username@domain; Ray Tomlinson sent the first network e-mail in 1971 and chose the @ sign.","CC recipients are visible to all; BCC (Blind Carbon Copy) recipients are hidden from others.","Drafts are unsent saved mails, Outbox holds mails waiting to go, Sent keeps copies of sent mails, Spam holds junk.","NEFT settles in half-hourly batches, RTGS settles each transfer in real time (minimum Rs 2 lakh); both run by RBI.","IMPS and UPI (NPCI) are instant 24x7; never share PIN, OTP or CVV - banks never ask for them."],"part":["Part 3 · Internet, networks & security","इंटरनेट, नेटवर्क एवं सुरक्षा"]},
{"id":"C14","g":"cmp","heat":3,"title":"Networking basics","hi":"नेटवर्किंग की मूल बातें","blocks":[{"k":"hot","h":"Expect 1–3 questions: <b>LAN/MAN/WAN<\/b>, which <b>topology<\/b> needs a central hub, what a <b>router / switch / modem<\/b> does, the <b>OSI layers<\/b> in order, <b>IPv4 vs IPv6<\/b> bits, and which cable connects two computers (<b>Ethernet<\/b>)."},{"k":"story","h":"<p>A <b>network<\/b> is simply two or more computers joined so they can share files, printers and the internet – like houses in a colony joined by lanes so neighbours can share things.<\/p><p>Size gives the name: a <b>PAN<\/b> is around one person (phone to earphones by Bluetooth), a <b>LAN<\/b> covers a room or building, a <b>MAN<\/b> covers a city, and a <b>WAN<\/b> spans countries – the internet is the biggest WAN.<\/p><p>The <b>topology<\/b> is the shape of the lanes: one long road (bus), everyone connected to a central chowk (star), a circle (ring) or every house joined to every other (mesh). Devices act like traffic staff: a <b>hub<\/b> shouts every message to everyone, a <b>switch<\/b> delivers it only to the right house, a <b>router<\/b> chooses the route between colonies (networks), and a <b>modem<\/b> converts the computer's digital signal for the telephone or cable line.<\/p><p>Every computer has a fixed hardware name, the <b>MAC address<\/b>, and a network address, the <b>IP address<\/b>.<\/p>","key":"Network = joined computers; PAN-LAN-MAN-WAN by size; topology = shape; hub broadcasts, switch delivers, router routes, modem converts."},{"k":"table","title":"Types of network by size","head":["Type","Full form","Range","Example"],"rows":[["PAN","Personal Area Network","A few metres around one person","Phone with Bluetooth earphones"],["LAN","Local Area Network","Room, building or campus","Office or school computer lab"],["CAN","Campus Area Network","Several buildings of one campus","University campus"],["MAN","Metropolitan Area Network","A city","City-wide cable TV network"],["WAN","Wide Area Network","Country or world","The internet (the largest WAN)"]]},{"k":"table","title":"Network topologies","head":["Topology","Layout","Plus","Minus"],"rows":[["Bus","All nodes on one backbone cable with terminators at the ends","Cheap, least cable","Backbone break stops the whole network; collisions"],["Star","Every node connected to a central hub or switch","Easy to add nodes and find faults; one cable failure affects only one node","Central device fails = whole network fails"],["Ring","Each node connected to two neighbours in a closed loop; data passes round (token passing)","Orderly, no collisions","One broken node or link can stop the ring"],["Mesh","Every node connected to every other node: n(n-1)/2 links","Most reliable, many alternate paths","Most cable and cost"],["Tree","Hierarchy of star networks joined to a backbone","Easy to expand","Root/backbone failure hits branches"],["Hybrid","Mix of two or more topologies","Flexible","Complex to design"]]},{"k":"table","title":"Network devices","head":["Device","What it does","OSI layer"],"rows":[["NIC (Network Interface Card)","Connects a computer to a network; carries the MAC address","Data link (and physical)"],["Repeater","Regenerates (amplifies) a weak signal to extend distance","Physical"],["Hub","Sends incoming data to ALL ports – not intelligent","Physical"],["Bridge","Joins two LAN segments and filters by MAC address","Data link"],["Switch","Sends data only to the port of the destination MAC address – intelligent","Data link"],["Router","Connects different networks and chooses the best path using IP addresses","Network"],["Gateway","Connects networks that use different protocols (protocol converter)","Can work at all layers"],["Modem","MOdulator-DEModulator: digital to analog and back over phone/cable lines","Physical"],["Access point","Lets wireless (Wi-Fi) devices join a wired network","Data link"]]},{"k":"table","title":"Transmission media","head":["Medium","Type","Key fact"],"rows":[["Twisted pair","Wired (guided)","Copper pairs twisted to reduce interference; used in Ethernet LAN and telephone lines; RJ-45 connector for LAN, RJ-11 for phone"],["Coaxial cable","Wired (guided)","Central copper core with shield; cable TV"],["Optical fibre","Wired (guided)","Carries LIGHT by total internal reflection; fastest, highest bandwidth, immune to electrical interference"],["Radio waves","Wireless (unguided)","Radio, Wi-Fi, mobile networks"],["Microwave","Wireless (unguided)","Line-of-sight towers and satellite links"],["Infrared","Wireless (unguided)","Very short range, line-of-sight: TV remote"],["Bluetooth","Wireless (unguided)","Short-range PAN, IEEE 802.15.1"],["Wi-Fi","Wireless (unguided)","Wireless LAN, IEEE 802.11 (Ethernet LAN is IEEE 802.3)"]]},{"k":"table","title":"OSI model – 7 layers (bottom to top)","head":["No.","Layer","Main job"],"rows":[["1","Physical","Sends raw bits over cable or air"],["2","Data link","Frames, MAC addresses, error detection on one link"],["3","Network","IP addressing and routing between networks (packets)"],["4","Transport","End-to-end delivery, segments; TCP and UDP"],["5","Session","Opens, manages and closes sessions"],["6","Presentation","Translation, encryption, compression"],["7","Application","Services for the user: HTTP, FTP, SMTP, DNS"]]},{"k":"facts","title":"Addresses, speed and modes","rows":[["OSI developed by","ISO (International Organization for Standardization)"],["TCP/IP model layers","4: Network access (link), Internet, Transport, Application"],["IPv4","32 bits, 4 numbers (octets) of 0–255, dotted decimal, e.g. 192.168.1.1; about 4.3 billion (2^32) addresses"],["IPv6","128 bits, 8 groups of 4 hex digits separated by colons; about 3.4 x 10^38 addresses"],["MAC address","48 bits = 6 bytes = 12 hex digits; burnt into the NIC; physical address"],["IP vs MAC","IP = logical, can change; MAC = physical, fixed"],["Bandwidth","Data-carrying capacity; measured in bps (bits per second): Kbps, Mbps, Gbps"],["Simplex","One direction only – radio/TV broadcast, keyboard to computer"],["Half duplex","Both directions, one at a time – walkie-talkie"],["Full duplex","Both directions at the same time – telephone call"],["Client-server","Central server provides services to clients – a bank's network"],["Peer-to-peer (P2P)","All computers equal; each can share and request"],["Connect two computers","Ethernet cable (a crossover Ethernet cable in older direct PC-to-PC links)"]]},{"k":"trick","h":"OSI bottom-up: <span class='mn'>P<\/span>lease <span class='mn'>D<\/span>o <span class='mn'>N<\/span>ot <span class='mn'>T<\/span>hrow <span class='mn'>S<\/span>ausage <span class='mn'>P<\/span>izza <span class='mn'>A<\/span>way. Top-down: <span class='mn'>A<\/span>ll <span class='mn'>P<\/span>eople <span class='mn'>S<\/span>eem <span class='mn'>T<\/span>o <span class='mn'>N<\/span>eed <span class='mn'>D<\/span>ata <span class='mn'>P<\/span>rocessing. Size: <span class='mn'>P<\/span>-<span class='mn'>L<\/span>-<span class='mn'>M<\/span>-<span class='mn'>W<\/span> = 'Please Let Me Win'."},{"k":"trap","h":"<b>Hub vs switch<\/b>: hub sends to all, switch sends to the right port. <b>Switch vs router<\/b>: switch works inside one network (MAC), router joins networks (IP). <b>Modem vs router<\/b>: modem converts signals, router directs traffic. <b>Star vs bus<\/b>: star dies when the hub dies; bus dies when the backbone breaks. <b>IPv4 32 bits, IPv6 128 bits, MAC 48 bits<\/b> – don't mix them. Bandwidth is in <b>bps<\/b>, not bytes."}],"sum":["A network joins computers to share resources; by size: PAN, LAN, CAN, MAN, WAN (the internet is the largest WAN).","Topologies: bus (one backbone), star (central hub), ring (loop), mesh (all-to-all, n(n-1)/2 links), tree and hybrid.","Hub broadcasts, switch delivers by MAC, router joins networks by IP, modem converts digital and analog, repeater boosts signals.","OSI has 7 layers: Physical, Data link, Network, Transport, Session, Presentation, Application; TCP/IP has 4.","IPv4 is 32-bit, IPv6 is 128-bit, MAC is 48-bit; optical fibre carries light; an Ethernet cable connects two computers."],"part":["Part 3 · Internet, networks & security","इंटरनेट, नेटवर्क एवं सुरक्षा"]},
{"id":"C15","g":"cmp","heat":3,"title":"Protocols, full forms & abbreviations","hi":"प्रोटोकॉल, पूर्ण रूप एवं संक्षिप्ताक्षर","blocks":[{"k":"hot","h":"Full forms are the single most common computer question type in SSC and RRB papers: <b>HTTP, HTML, URL, VIRUS, CAPTCHA, DNS, SMTP, UPI<\/b>. Protocol-to-job and well-known <b>port numbers<\/b> appear in Tier 2."},{"k":"story","h":"<p>A <b>protocol<\/b> is a set of agreed rules for talking. When two people meet they follow a protocol: greet, speak in turn, say goodbye. Computers from different companies can talk only because they follow the same written rules.<\/p><p>Each job has its own protocol. <b>HTTP<\/b> fetches web pages, <b>HTTPS<\/b> does the same with encryption, <b>FTP<\/b> moves files, <b>SMTP<\/b> sends mail while <b>POP3<\/b> and <b>IMAP<\/b> receive it, <b>DNS<\/b> looks up addresses and <b>DHCP<\/b> hands out IP addresses automatically, like a receptionist giving room numbers to guests.<\/p><p>A single computer runs many services at once, so each service listens at a numbered door called a <b>port<\/b>: web at 80, secure web at 443, mail sending at 25. Finally, computing is full of short forms. Learn them in groups – internet, networking, files, banking, security, new technology – and they stop looking like alphabet soup.<\/p>","key":"Protocol = agreed rules; each service has its protocol and port number; learn full forms in groups."},{"k":"table","title":"Main protocols and their ports","head":["Protocol","Full form","Job","Port"],"rows":[["HTTP","Hyper Text Transfer Protocol","Transfers web pages","80"],["HTTPS","Hyper Text Transfer Protocol Secure","Encrypted web pages (padlock), uses SSL/TLS","443"],["FTP","File Transfer Protocol","Uploads/downloads files between computers","20 (data), 21 (control)"],["SMTP","Simple Mail Transfer Protocol","SENDS e-mail","25"],["POP3","Post Office Protocol version 3","Receives e-mail by downloading it to the device","110"],["IMAP","Internet Message Access Protocol","Receives e-mail, keeping it on the server in sync across devices","143"],["DNS","Domain Name System","Converts domain names into IP addresses","53"],["Telnet","–","Remote login, unencrypted","23"],["SSH","Secure Shell","Encrypted remote login","22"],["DHCP","Dynamic Host Configuration Protocol","Automatically assigns IP addresses to devices","–"],["ARP","Address Resolution Protocol","Finds the MAC address for a known IP address","–"],["TCP","Transmission Control Protocol","Reliable, connection-oriented delivery","–"],["UDP","User Datagram Protocol","Fast, connectionless, no delivery guarantee","–"],["IP","Internet Protocol","Addresses and routes packets","–"]]},{"k":"table","title":"TCP vs UDP","head":["Point","TCP","UDP"],"rows":[["Connection","Connection-oriented (handshake first)","Connectionless"],["Reliability","Guaranteed, in-order delivery; resends lost data","No guarantee, no resending"],["Speed","Slower","Faster"],["Used for","Web (HTTP), e-mail, file transfer","Live video, online games, voice calls, DNS queries"]]},{"k":"table","title":"Full forms – internet and networking","head":["Short","Full form"],"rows":[["WWW","World Wide Web"],["URL","Uniform Resource Locator"],["HTML","Hyper Text Markup Language"],["XML","eXtensible Markup Language"],["CSS","Cascading Style Sheets"],["ISP","Internet Service Provider"],["IP","Internet Protocol"],["LAN","Local Area Network"],["MAN","Metropolitan Area Network"],["WAN","Wide Area Network"],["PAN","Personal Area Network"],["WLAN","Wireless Local Area Network"],["NIC","Network Interface Card"],["MAC","Media Access Control"],["OSI","Open Systems Interconnection"],["Modem","Modulator-Demodulator"],["VPN","Virtual Private Network"],["VoIP","Voice over Internet Protocol"],["Wi-Fi","Wireless Fidelity (popular expansion)"],["ARPANET","Advanced Research Projects Agency Network"],["ICANN","Internet Corporation for Assigned Names and Numbers"],["DSL","Digital Subscriber Line"],["ISDN","Integrated Services Digital Network"],["NAT","Network Address Translation"]]},{"k":"table","title":"Full forms – files, interface and devices","head":["Short","Full form"],"rows":[["GUI","Graphical User Interface"],["CLI","Command Line Interface"],["OS","Operating System"],["PDF","Portable Document Format"],["JPEG","Joint Photographic Experts Group"],["GIF","Graphics Interchange Format"],["PNG","Portable Network Graphics"],["MPEG","Moving Picture Experts Group"],["MP3","MPEG Audio Layer 3"],["GPS","Global Positioning System"],["SIM","Subscriber Identity Module"],["GSM","Global System for Mobile Communications"],["CDMA","Code Division Multiple Access"],["LTE","Long Term Evolution"],["QR code","Quick Response code"],["NFC","Near Field Communication"],["RFID","Radio Frequency Identification"],["BCC / CC","Blind Carbon Copy / Carbon Copy"]]},{"k":"table","title":"Full forms – security, banking and new tech","head":["Short","Full form"],"rows":[["VIRUS","Vital Information Resources Under Siege"],["CAPTCHA","Completely Automated Public Turing test to tell Computers and Humans Apart"],["OTP","One Time Password"],["PIN","Personal Identification Number"],["SSL","Secure Sockets Layer"],["TLS","Transport Layer Security"],["DoS / DDoS","Denial of Service / Distributed Denial of Service"],["2FA / MFA","Two-Factor / Multi-Factor Authentication"],["CERT-In","Indian Computer Emergency Response Team"],["UPI","Unified Payments Interface"],["NPCI","National Payments Corporation of India"],["BHIM","Bharat Interface for Money"],["NEFT","National Electronic Funds Transfer"],["RTGS","Real Time Gross Settlement"],["IMPS","Immediate Payment Service"],["KYC","Know Your Customer"],["IFSC","Indian Financial System Code"],["ATM","Automated Teller Machine"],["POS","Point of Sale"],["CVV","Card Verification Value"],["IoT","Internet of Things"],["AI / ML","Artificial Intelligence / Machine Learning"],["AR / VR","Augmented Reality / Virtual Reality"],["SaaS","Software as a Service"],["PaaS","Platform as a Service"],["IaaS","Infrastructure as a Service"],["UIDAI","Unique Identification Authority of India"],["C-DAC","Centre for Development of Advanced Computing"]]},{"k":"trick","h":"Mail: <span class='mn'>S<\/span>MTP = <span class='mn'>S<\/span>end; <span class='mn'>P<\/span>OP = <span class='mn'>P<\/span>ull down (download); <span class='mn'>I<\/span>MAP = keep <span class='mn'>I<\/span>n place on server. Ports: FTP <b>21<\/b> &lt; SSH <b>22<\/b> &lt; Telnet <b>23<\/b> &lt; SMTP <b>25<\/b> – the '20s ladder'; DNS <b>53<\/b>, HTTP <b>80<\/b>, POP3 <b>110<\/b>, IMAP <b>143<\/b>, HTTPS <b>443<\/b>."},{"k":"trap","h":"<b>HTTP<\/b> is Hyper Text <i>Transfer<\/i> Protocol; <b>HTML<\/b> is Hyper Text <i>Markup<\/i> Language – exams swap Transfer/Transport/Markup. <b>URL<\/b> is <i>Uniform<\/i> (not Universal) Resource Locator. <b>SMTP sends, POP3/IMAP receive<\/b>. <b>TCP<\/b> is connection-oriented, <b>UDP<\/b> connectionless. <b>DNS<\/b> = name to IP; <b>ARP<\/b> = IP to MAC; <b>DHCP<\/b> = gives out IPs."}],"sum":["A protocol is a set of rules for communication; HTTP (port 80) carries web pages, HTTPS (port 443) does it securely.","FTP (20/21) moves files; SMTP (25) sends mail; POP3 (110) and IMAP (143) receive mail; DNS (53) turns names into IP addresses.","TCP is reliable and connection-oriented; UDP is fast and connectionless; DHCP assigns IP addresses, ARP finds MAC from IP.","HTTP = Hyper Text Transfer Protocol, HTML = Hyper Text Markup Language, URL = Uniform Resource Locator.","VIRUS = Vital Information Resources Under Siege; CAPTCHA tells computers and humans apart; UPI = Unified Payments Interface."],"part":["Part 3 · Internet, networks & security","इंटरनेट, नेटवर्क एवं सुरक्षा"]},
{"id":"C16","g":"cmp","heat":3,"title":"Cyber security","hi":"साइबर सुरक्षा","blocks":[{"k":"hot","h":"The SSC syllabus names <b>network and information security threats and preventive measures<\/b>. Expect the difference between <b>virus, worm and Trojan<\/b>, attacks like <b>phishing<\/b> and <b>DDoS<\/b>, and what a <b>firewall<\/b> or <b>encryption<\/b> does."},{"k":"story","h":"<p>Think of your computer as a house. <b>Malware<\/b> means any harmful software that gets inside. A <b>virus<\/b> hides inside a genuine file and spreads only when that file is opened, like a germ on a shared towel. A <b>worm<\/b> crawls from house to house by itself through the network. A <b>Trojan horse<\/b> arrives as a gift – a free game – with thieves hidden inside. <b>Ransomware<\/b> locks your cupboards and asks for money for the key. <b>Spyware<\/b> and <b>keyloggers<\/b> are hidden cameras recording what you do and type.<\/p><p>Criminals also simply trick people. <b>Phishing<\/b> is a fake e-mail from 'your bank' asking for your password; the same trick by phone call is <b>vishing<\/b> and by SMS is <b>smishing<\/b>.<\/p><p>Protection works in layers like locks, guards and alarms: a <b>firewall<\/b> is the gatekeeper checking traffic, <b>antivirus<\/b> is the guard who catches known intruders, <b>encryption<\/b> turns data into secret code, and <b>two-factor authentication<\/b> asks for a second key such as an OTP. Regular updates and backups complete the safety plan.<\/p>","key":"Virus needs a host, worm spreads alone, Trojan disguises itself; phishing tricks people; firewall, antivirus, encryption, 2FA, updates and backups protect."},{"k":"table","title":"Types of malware","head":["Malware","How it behaves","One-line difference"],"rows":[["Virus","Attaches to a program or file and runs when that file is opened","Needs a host file and human action to spread"],["Worm","Copies itself across networks automatically","Self-replicating, needs NO host file"],["Trojan horse","Pretends to be useful software but opens a back door","Disguised; does NOT replicate itself"],["Ransomware","Encrypts or locks your files and demands payment (WannaCry, 2017)","Holds data hostage"],["Spyware","Secretly collects your information and activity","Spies silently"],["Adware","Floods the screen with unwanted advertisements","Shows ads"],["Keylogger","Records every key you press to steal passwords","Captures keystrokes"],["Rootkit","Hides deep in the system and gives the attacker admin-level control","Hard to detect"],["Bot / Botnet","Infected 'zombie' computer controlled remotely; many together form a botnet","Used for spam and DDoS attacks"]]},{"k":"table","title":"Common attacks","head":["Attack","What happens"],"rows":[["Phishing","Fake e-mails or websites that look genuine to steal passwords or card details"],["Vishing","Phishing by voice / phone call (Voice + phishing)"],["Smishing","Phishing by SMS text message"],["Spoofing","Faking the identity of a trusted sender – e-mail address, caller ID, IP address or website"],["Pharming","Redirecting users from a real website to a fake one, e.g. by poisoning DNS – even a correctly typed address leads to the fake site"],["DoS","Denial of Service – flooding a server with traffic so real users cannot reach it"],["DDoS","Distributed DoS – the flood comes from many computers (a botnet) at once"],["Man-in-the-middle","Attacker secretly sits between two parties and reads or changes their messages"],["SQL injection","Malicious database commands typed into a website's input box"],["Brute force","Trying every possible password until one works"],["Social engineering","Manipulating people (not machines) into revealing secrets"],["Identity theft","Using someone's personal details to commit fraud"],["Spam","Unwanted bulk messages, often carrying phishing links"]]},{"k":"table","title":"Preventive measures","head":["Measure","What it does"],"rows":[["Antivirus","Detects and removes known malware (e.g. Quick Heal, Norton, Microsoft Defender)"],["Firewall","Hardware or software that filters incoming and outgoing network traffic by rules – a security guard at the gate"],["Encryption","Converts plaintext into unreadable ciphertext; only the right key decrypts it"],["Strong password","Long; mix of capital and small letters, numbers and symbols; not your name or birth date"],["2FA / MFA","Second proof besides the password, such as an OTP, fingerprint or authenticator app"],["Updates and patches","Fix security holes found in software"],["Backups","Copies of data to recover after ransomware or crash"],["CAPTCHA","Test that blocks automated bots from filling forms"],["HTTPS padlock","Shows the connection to the site is encrypted"],["Digital signature","Proves who sent a document and that it was not altered"],["Digital certificate","Electronic ID of a website or person issued by a Certifying Authority"]]},{"k":"facts","title":"Terms and Indian law","rows":[["White hat hacker","Ethical hacker who tests systems with permission"],["Black hat hacker","Criminal hacker who breaks in for harm or profit"],["Grey hat hacker","Breaks in without permission but without bad intent"],["Symmetric encryption","One same key to lock and unlock"],["Asymmetric encryption","Public key to encrypt, private key to decrypt"],["Digital signature","Signed with the sender's private key, verified with the public key"],["First PC virus (MS-DOS)","Brain, 1986, written in Pakistan"],["IT Act","Information Technology Act, 2000 – India's cyber law; gave legal status to e-records and digital signatures"],["IT (Amendment) Act","2008 – added cyber terrorism (Section 66F) and more cyber offences"],["CERT-In","Indian Computer Emergency Response Team – national agency for cyber incidents, under MeitY, set up 2004"],["Cyber-crime helpline","1930"],["Cyber-crime reporting portal","cybercrime.gov.in"]]},{"k":"trick","h":"Malware by legs: <span class='mn'>V<\/span>irus = <span class='mn'>V<\/span>ehicle needed (host file); <span class='mn'>W<\/span>orm = <span class='mn'>W<\/span>alks alone; <span class='mn'>T<\/span>rojan = <span class='mn'>T<\/span>ricks you with a gift. Phishing family by channel: <span class='mn'>E<\/span>-mail = Phishing, <span class='mn'>V<\/span>oice = Vishing, <span class='mn'>S<\/span>MS = Smishing."},{"k":"trap","h":"<b>Virus vs worm<\/b>: only the worm spreads without a host. <b>Trojan<\/b> does not replicate. <b>Phishing vs pharming<\/b>: phishing needs you to click a fake link; pharming redirects you even when you type the right address. <b>DoS vs DDoS<\/b>: DDoS uses many machines. <b>Firewall vs antivirus<\/b>: firewall filters traffic, antivirus removes malware. <b>Cookies vs cache<\/b>: cookies store your details, cache stores page files. <b>Encryption ≠ compression<\/b>."}],"sum":["Malware: virus needs a host file, worm self-replicates over networks, Trojan disguises itself, ransomware demands money, spyware and keyloggers steal data.","Phishing (e-mail), vishing (voice), smishing (SMS) trick people; pharming redirects to fake sites; DDoS floods a server from many computers.","A firewall filters network traffic; antivirus removes malware; encryption turns plaintext into ciphertext.","Strong passwords, 2FA/MFA, updates, backups and HTTPS help prevent attacks; white hat hackers are ethical.","India: IT Act 2000 (amended 2008), CERT-In for cyber incidents, helpline 1930 and cybercrime.gov.in."],"part":["Part 3 · Internet, networks & security","इंटरनेट, नेटवर्क एवं सुरक्षा"]},
{"id":"C17","g":"cmp","heat":2,"title":"New technologies & computer terms","hi":"नई तकनीकें एवं कंप्यूटर शब्दावली","blocks":[{"k":"hot","h":"Papers now ask one-liners on <b>AI, cloud computing (SaaS/PaaS/IaaS), IoT, blockchain<\/b>, plus 'who founded / who created' questions such as <b>father of AI<\/b> (John McCarthy coined the term) and India's <b>Digital India, DigiLocker, PARAM<\/b>."},{"k":"story","h":"<p>New technology words sound frightening but each has a simple idea. <b>Artificial Intelligence<\/b> means making machines do things that need human-like thinking, such as recognising faces or answering questions. <b>Machine learning<\/b> is AI that learns from examples instead of fixed rules – the way a child learns what a dog looks like after seeing many dogs. <b>Generative AI<\/b> creates new text, pictures or music; chatbots are one example.<\/p><p><b>Cloud computing<\/b> is renting computing power over the internet like taking a taxi instead of buying a car: you can rent ready software (SaaS), a platform to build on (PaaS) or bare infrastructure (IaaS). The <b>Internet of Things<\/b> connects everyday objects – fans, meters, watches – to the internet.<\/p><p>A <b>blockchain<\/b> is a record book copied on thousands of computers so no single person can secretly change it; Bitcoin was built on it. <b>AR<\/b> adds digital things to the real view, while <b>VR<\/b> replaces the real view completely with a digital world.<\/p>","key":"AI thinks, ML learns from data, cloud = renting computing, IoT = connected objects, blockchain = shared unchangeable ledger, AR adds and VR replaces."},{"k":"table","title":"New technologies in one line","head":["Technology","Meaning","Example"],"rows":[["Artificial Intelligence (AI)","Machines performing tasks that need human-like intelligence","Face unlock, voice assistants"],["Machine Learning (ML)","Subset of AI: systems learn patterns from data","Spam filter, recommendations"],["Deep Learning","Subset of ML using many-layered neural networks","Image and speech recognition"],["Generative AI","AI that creates new text, images, audio or code","Chatbots such as ChatGPT (OpenAI, November 2022)"],["Internet of Things (IoT)","Everyday devices with sensors connected to the internet","Smart meter, smartwatch"],["Big Data","Data too large or fast for ordinary tools; described by Volume, Velocity, Variety","Social-media analytics"],["Blockchain","Distributed, tamper-resistant ledger shared across many computers","Cryptocurrency records"],["Cryptocurrency","Digital currency secured by cryptography, usually on a blockchain","Bitcoin (2009, by 'Satoshi Nakamoto')"],["Augmented Reality (AR)","Adds digital objects to the real-world view","Pokemon Go, Snapchat filters"],["Virtual Reality (VR)","Fully computer-made world seen through a headset","VR gaming, flight simulators"],["5G","Fifth-generation mobile network: high speed, very low delay; launched in India in October 2022","Many IoT devices at once"],["Quantum computing","Uses qubits, which can be 0 and 1 at once (superposition)","Research machines"],["Edge computing","Processing data near where it is produced instead of a far data centre","Self-driving car sensors"]]},{"k":"table","title":"Cloud computing","head":["Model","You get","Example"],"rows":[["SaaS – Software as a Service","Ready-to-use software through a browser","Gmail, Google Docs, Microsoft 365"],["PaaS – Platform as a Service","Platform and tools to build and run your own apps","Google App Engine"],["IaaS – Infrastructure as a Service","Virtual servers, storage, networking","Amazon EC2 (AWS)"],["Public cloud","Shared by many customers, run by a provider","AWS, Microsoft Azure, Google Cloud"],["Private cloud","Used by one organisation only","Bank's own data centre cloud"],["Hybrid cloud","Mix of public and private","Sensitive data private, rest public"]]},{"k":"table","title":"Famous people of computing","head":["Person","Known for"],"rows":[["Charles Babbage","Father of the computer (Analytical Engine)"],["Ada Lovelace","First computer programmer"],["Alan Turing","Father of theoretical computer science and AI; Turing Test (1950)"],["John McCarthy","Coined the term 'Artificial Intelligence' (1955–56, Dartmouth); called the father of AI; created LISP"],["Tim Berners-Lee","Inventor of the World Wide Web"],["Vint Cerf and Bob Kahn","Fathers of the internet (TCP/IP)"],["Ray Tomlinson","Inventor of network e-mail"],["Dennis Ritchie","Created the C language (Bell Labs); co-created UNIX with Ken Thompson"],["James Gosling","Father of Java (Sun Microsystems, 1995)"],["Guido van Rossum","Creator of Python (1991)"],["Linus Torvalds","Created the Linux kernel (1991)"],["Bill Gates and Paul Allen","Founded Microsoft (1975)"],["Steve Jobs and Steve Wozniak","Founded Apple (1976)"],["Larry Page and Sergey Brin","Founded Google (1998)"],["Mark Zuckerberg","Founded Facebook (2004)"],["Vijay Bhatkar","Father of Indian supercomputing (PARAM)"]]},{"k":"tl","title":"India's digital journey","rows":[["1988","C-DAC (Centre for Development of Advanced Computing) set up, Pune"],["1991","PARAM 8000 – India's first supercomputer, by C-DAC"],["2004","CERT-In set up"],["2009","UIDAI set up; Aadhaar (12-digit unique ID) follows from 2010"],["2015","Digital India launched (1 July 2015); DigiLocker launched; National Supercomputing Mission approved"],["2016","UPI launched by NPCI; BHIM app launched in December"],["2022","5G services launched in India (1 October 2022)"]]},{"k":"trick","h":"Cloud stack from top: <span class='mn'>S<\/span>aaS = <span class='mn'>S<\/span>oftware you just use; <span class='mn'>P<\/span>aaS = <span class='mn'>P<\/span>latform to build; <span class='mn'>I<\/span>aaS = <span class='mn'>I<\/span>ron (bare hardware). AI family: <span class='mn'>A<\/span> ⊃ <span class='mn'>M<\/span> ⊃ <span class='mn'>D<\/span> – 'A Mango Drop' (AI contains ML contains Deep learning)."},{"k":"trap","h":"<b>Father of AI<\/b>: John McCarthy coined the term; Alan Turing laid the theory – read the question wording. <b>AR vs VR<\/b>: AR adds to reality, VR replaces it. <b>ML vs DL<\/b>: deep learning is a part of ML, not the other way. <b>Gmail is SaaS<\/b>, AWS EC2 is IaaS. <b>Python<\/b> is Guido van Rossum, <b>Java<\/b> is James Gosling, <b>Linux<\/b> is Linus Torvalds – not the founders of Microsoft or Apple."}],"sum":["AI makes machines think; ML learns from data; deep learning uses neural networks; generative AI creates new content.","Cloud computing: SaaS (Gmail), PaaS (App Engine), IaaS (AWS EC2); deployed as public, private or hybrid cloud.","IoT connects everyday objects; blockchain is a shared tamper-resistant ledger; Bitcoin (2009) is the first cryptocurrency; AR adds, VR replaces reality.","John McCarthy coined Artificial Intelligence; Alan Turing gave the Turing Test; Ritchie made C, Gosling Java, van Rossum Python, Torvalds Linux.","India: C-DAC (1988), PARAM 8000 (1991), Digital India and DigiLocker (2015), UPI and BHIM (2016), 5G (2022)."],"part":["Part 3 · Internet, networks & security","इंटरनेट, नेटवर्क एवं सुरक्षा"]}
];
const QB = [
["C1","Who is known as the 'Father of the Computer'?",["Charles Babbage","Alan Turing","John von Neumann","Blaise Pascal"],"Charles Babbage designed the Difference Engine and the Analytical Engine, the plan of the modern computer. Turing is linked to theoretical computer science and AI.","p"],
["C1","Who is regarded as the world's first computer programmer?",["Ada Lovelace","Grace Hopper","Charles Babbage","Herman Hollerith"],"Ada Lovelace wrote an algorithm for Babbage's Analytical Engine in 1843.","p"],
["C1","What is the full form of ENIAC?",["Electronic Numerical Integrator and Computer","Electronic Numeric Integrated and Calculator","Electrical Numerical Integrator and Calculator","Electronic Number Input and Computer"],"ENIAC (1946), built by Eckert and Mauchly, was the first general-purpose electronic computer and used vacuum tubes.","p"],
["C1","What is the full form of UNIVAC?",["Universal Automatic Computer","Universal Array Computer","Unique Automatic Calculator","Universal Analog Computer"],"UNIVAC I (1951) was the first commercially produced computer in the USA — not the first electronic computer, which was ENIAC.","p"],
["C1","Which technology was used in first-generation computers?",["Vacuum tubes","Transistors","Integrated circuits","Microprocessors"],"First generation (about 1940–56) used vacuum tubes: huge, hot and power-hungry. Transistors came in the second generation.","p"],
["C1","Microprocessors (VLSI) are the main technology of which generation of computers?",["Fourth","Third","Second","Fifth"],"IC = third generation; VLSI microprocessor = fourth; AI = fifth. Exams often swap third and fourth.","p"],
["C1","Which pair of generation and technology is correctly matched?",["Second generation — Transistors","Third generation — Vacuum tubes","First generation — Integrated circuits","Fifth generation — Transistors"],"Order: vacuum tube, transistor, IC, microprocessor, artificial intelligence.",""],
["C1","Fifth-generation computers are mainly based on:",["Artificial intelligence","Vacuum tubes","Magnetic core memory","Transistors"],"Fifth generation aims at AI — natural language, expert systems, parallel processing.",""],
["C1","Who built the Pascaline, an early mechanical adding machine (1642)?",["Blaise Pascal","Charles Babbage","John Napier","Herman Hollerith"],"Blaise Pascal built the Pascaline. Napier gave Napier's Bones; Hollerith the punched-card tabulator.",""],
["C1","Herman Hollerith's punched-card tabulating machine was first used for:",["The US census of 1890","Weaving cloth patterns","Breaking wartime codes","Railway reservation"],"Hollerith's machine processed the 1890 US census; his company later became IBM. Punched cards for weaving were Jacquard's.",""],
["C1","The 'stored-program' concept, in which instructions and data share the same memory, is credited to:",["John von Neumann","Charles Babbage","Blaise Pascal","Ada Lovelace"],"Von Neumann's 1945 EDVAC report described the stored-program architecture used by almost all computers today.",""],
["C1","Which was the first commercially produced computer in the USA?",["UNIVAC I","ENIAC","EDSAC","Harvard Mark I"],"UNIVAC I (1951) was sold commercially; ENIAC (1946) was a government/university machine.",""],
["C1","India's first supercomputer, PARAM 8000 (1991), was developed by:",["C-DAC","ISRO","DRDO","BARC"],"C-DAC (Centre for Development of Advanced Computing), Pune, led by Vijay Bhatkar, built PARAM 8000 in 1991.","p"],
["C1","A speedometer of a car is an example of which type of computer/device?",["Analog","Digital","Hybrid","Micro"],"Analog devices measure continuous quantities such as speed, temperature or voltage.","p"],
["C1","A computer used in a hospital ICU that measures heartbeat (analog) and displays it as numbers (digital) is a:",["Hybrid computer","Analog computer","Digital computer","Mainframe computer"],"Hybrid computers combine analog and digital features — ECG/ICU machines, petrol pumps.",""],
["C1","Which type of computer is used for weather forecasting and nuclear research?",["Supercomputer","Minicomputer","Microcomputer","Laptop"],"Supercomputers are the fastest; their speed is measured in FLOPS. Mainframes serve banks and railways.",""],
["C1","Arrange computers in increasing order of size and power.",["Micro, Mini, Mainframe, Super","Mini, Micro, Mainframe, Super","Micro, Mainframe, Mini, Super","Super, Mainframe, Mini, Micro"],"Smallest to largest: microcomputer, minicomputer, mainframe, supercomputer.",""],
["C1","Which of these is NOT a characteristic of a computer?",["Own intelligence (IQ)","Speed","Accuracy","Diligence"],"A computer is fast, accurate and tireless, but it has no intelligence or feelings of its own.",""],
["C1","The term GIGO in computing stands for:",["Garbage In, Garbage Out","Go In, Go Out","Gigabyte In, Gigabyte Out","General Input, General Output"],"GIGO means wrong input data produces wrong output — the computer itself does not make errors.",""],
["C1","Raw, unprocessed facts given to a computer are called:",["Data","Information","Knowledge","Output"],"Data is raw facts; information is data after processing.",""],
["C1","Large organisations such as banks and railway reservation systems, with thousands of users at once, typically use:",["Mainframe computers","Microcomputers","Analog computers","Tablet computers"],"Mainframes handle huge numbers of simultaneous users and transactions.",""],
["C1","Which device invented in 1947 at Bell Labs replaced vacuum tubes in computers?",["Transistor","Integrated circuit","Microprocessor","Diode valve"],"The transistor (Bardeen, Brattain, Shockley) made second-generation computers smaller, faster and cooler.",""],
["C1","Which was the first commercial microprocessor (1971)?",["Intel 4004","Intel 8086","Pentium","Motorola 68000"],"The 4-bit Intel 4004 was released in 1971 and began the fourth generation.",""],
["C2","What is the full form of CPU?",["Central Processing Unit","Central Program Unit","Computer Processing Unit","Control Processing Unit"],"The CPU is the brain of the computer, made of the CU, ALU and registers.","p"],
["C2","Which part of the CPU performs arithmetic and logical (comparison) operations?",["ALU","Control Unit","Program Counter","Cache"],"The Arithmetic Logic Unit calculates and compares; the Control Unit only directs and coordinates.","p"],
["C2","Which unit of the CPU directs and coordinates all operations of the computer but does not process data itself?",["Control Unit","Arithmetic Logic Unit","Memory Unit","Input Unit"],"The CU fetches and decodes instructions and sends control signals; the ALU does the actual calculating.",""],
["C2","What is the full form of BIOS?",["Basic Input Output System","Binary Input Output System","Basic Integrated Operating System","Basic Internal Output Software"],"BIOS is firmware stored in ROM/flash that runs POST and starts booting.","p"],
["C2","What is the full form of POST?",["Power On Self Test","Power Output System Test","Program On Start Test","Primary Operating System Test"],"POST is run by the BIOS at start-up to check RAM, keyboard and drives.","p"],
["C2","Restarting a computer that is already switched on is called:",["Warm booting","Cold booting","Hard booting","Shutting down"],"Warm boot = restart (or Ctrl+Alt+Del); cold boot = starting from power off.","p"],
["C2","What is the full form of SMPS?",["Switched Mode Power Supply","Switch Mode Primary Source","Simple Mode Power System","Static Memory Power Supply"],"SMPS converts mains AC into the low-voltage DC used inside the computer. A UPS gives battery back-up.","p"],
["C2","What is the full form of USB?",["Universal Serial Bus","Universal System Bus","Unified Serial Bus","Universal Signal Board"],"USB is a serial, plug-and-play, hot-swappable port; one controller can support up to 127 devices.","p"],
["C2","Which port carries both high-definition video and audio in a single digital cable?",["HDMI","VGA","PS/2","RJ-11"],"HDMI = High-Definition Multimedia Interface. VGA carries analog video only.","p"],
["C2","What is the full form of VGA?",["Video Graphics Array","Visual Graphics Adapter","Video Gaming Array","Virtual Graphics Access"],"VGA is the older analog 15-pin video port for monitors and projectors.",""],
["C2","Which register holds the address of the next instruction to be executed?",["Program Counter","Instruction Register","Accumulator","Memory Data Register"],"The Program Counter points to the next instruction; the Instruction Register holds the current one.",""],

["C2","The clock speed of a processor is measured in:",["Hertz (GHz)","Bytes (GB)","Bits per second","Dots per inch"],"Clock speed is cycles per second, in hertz; modern CPUs run at several GHz.",""],
["C2","Which bus is unidirectional, carrying memory locations from the CPU to memory?",["Address bus","Data bus","Control bus","Universal Serial Bus"],"The address bus is one-way; the data bus is two-way; the control bus carries signals.",""],
["C2","The main circuit board of a computer that holds the CPU, RAM and expansion slots is the:",["Motherboard","Chipset","Expansion card","SMPS"],"The motherboard (system board/main board) connects all parts.",""],

["C14","Which cable is commonly used to connect two computers in a network?",["Ethernet cable","HDMI cable","VGA cable","USB printer cable"],"An Ethernet (twisted-pair, RJ-45) cable links computers; older direct PC-to-PC links used a crossover Ethernet cable. HDMI and VGA carry video.","p"],

["C14","The internet is the largest example of a:",["WAN","MAN","LAN","PAN"],"A Wide Area Network spans countries; the internet is the biggest WAN.",""],
["C14","Connecting your mobile phone to wireless earphones through Bluetooth forms a:",["PAN","LAN","MAN","WAN"],"A Personal Area Network covers a few metres around one person.",""],
["C14","Arrange the networks in increasing order of area covered.",["PAN, LAN, MAN, WAN","LAN, PAN, MAN, WAN","PAN, MAN, LAN, WAN","LAN, MAN, PAN, WAN"],"Personal, Local, Metropolitan, Wide – 'Please Let Me Win'.",""],

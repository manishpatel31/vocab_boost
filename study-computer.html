{"id":"C9","g":"cmp","heat":3,"title":"MS Office & MS Word","hi":"एमएस ऑफ़िस एवं एमएस वर्ड","blocks":[{"k":"hot","h":"MS Word gives 1–3 questions per paper: <b>shortcuts<\/b> (Ctrl+K, Ctrl+E, Ctrl+Enter, Shift+F3), <b>which tab holds which feature<\/b> (Mail Merge in Mailings, Track Changes in Review), and the <b>.docx<\/b> extension.<br><br>MS-Word is the single biggest scoring area in SSC Tier-II computer modules: shortcuts (Ctrl + Shift + L, F12, Ctrl + K, Ctrl + E), which tab holds a command (Mailings, References, Review), font size limits, views, margins, mail merge and styles. SSC CGL Tier-II 2023 and 2025 asked Styles, bullets and Shading; CHSL Tier-II 2024 asked Save As (F12); CHSL 2024 asked mail merge twice."},{"k":"story","h":"<p>MS Word is a <b>word processor<\/b> — a smart typewriter. On a typewriter a spelling mistake means retyping the whole page; in Word you simply fix the word, and the rest of the page moves itself. You can change the look of the letters (<b>font<\/b>), the arrangement of whole paragraphs (<b>alignment, spacing<\/b>) and the page itself (<b>margins, orientation<\/b>).<\/p><p>Across the top runs the <b>Ribbon<\/b>, like the shelves of a stationery shop arranged in sections. Each <b>tab<\/b> is one section: Home for everyday formatting, Insert for things you add (tables, pictures, header, page numbers, hyperlink), Layout for the page, Mailings for mail merge, Review for spelling and tracked changes, View for how you look at the page. Above or below it sits the tiny <b>Quick Access Toolbar<\/b> with Save and Undo, and at the bottom the <b>status bar<\/b> shows page number and word count.<\/p><p>Word can also write one letter to a hundred people with each name filled in automatically — that is <b>Mail Merge<\/b>.<\/p>","key":"Know which Ribbon tab holds each feature, and the Word-only shortcuts for formatting."},{"k":"facts","title":"Microsoft and MS-Office","rows":[["Microsoft","Bill Gates; software products MS-DOS (1981), MS-Windows (1985), MS-Office (1990)."],["MS-Office announced","1988 (by Bill Gates)."],["First version","MS-Office 1.0 released on 19 November 1990."],["Versions","1.0, 1.5, 1.6, 3.0, 4.0, NT 4.2, 4.3, 95, 97, 2000, XP, 2003, 2007, 2010, 2013, 2016, 2019, 2021, 365 (now \"Microsoft 365\"). There is NO MS-Office 98."],["NT / XP","NT = New Technology; XP = eXPerience."],["What MS-Office is","Application software, an application suite (package), closed-source software, horizontal market software (made for many industries) and also offered as SaaS (Software as a Service). All of these are correct."],["Free trick (\"jugaad\")","Pirated or cracked versions (duplicate key) are illegal."],["Default file names","Word = Document1 (.doc till 2003, .docx from 2007); Excel = Book1 (.xls/.xlsx); PowerPoint = Presentation1 (.ppt/.pptx)."],["File name length","Manually up to 225 characters with or without spaces."]]},{"k":"table","title":"MS-Office applications","head":["Application","What it is"],"rows":[["MS-Word","Word processor"],["MS-Excel","Spreadsheet program / chart-making application"],["MS-PowerPoint","Presentation program"],["MS-Access","Database program (file extension .accdb from Access 2007)"],["MS-Outlook","Email client application"],["MS-OneNote","Notes-making program (notes, drawing, screen clipping, audio)"],["MS-Publisher","Desktop publishing (business cards, calendars, brochures, newsletters)"],["MS-SharePoint, MS-FrontPage, MS-Expression Web","HTML editors"],["MS-Project","Project management software"],["MS-Visio","Diagramming and vector graphics application"],["MS-Sway","Turns documents into web pages (Word's \"Transform\" uses Sway)"],["MS-Forms","Online survey creator"],["MS-Bookings","Scheduling program"],["MS-OneDrive","File hosting service / cloud storage"],["MS-Stream","Video sharing service"],["MS-Teams","Workspace chat and video conferencing"],["MS-To Do","Cloud-based task management"],["MS-Skype","VoIP video/voice calls and instant messaging"],["MS-Yammer","Private social network inside organisations"]]},{"k":"facts","title":"Discontinued Office applications","rows":[["List","MS-Binder, MS-Classroom, MS-Clip Organizer, MS-Docs, MS-Data Analyser, MS-Entourage, MS-Equation Editor, MS-Exchange Client, MS-FrontPage, MS-InfoPath, MS-Interconnect, MS-Mail, MS-MapPoint, MS-Mathematics, MS-Office Accounting, MS-Office Document Imaging, MS-Office Document Scanning, MS-Office Live, MS-Office Live Meeting, MS-PerformancePoint Server, MS-Office Picture Manager, MS-Office Portfolio Server, MS-Outlook Hotmail Connector, MS-PhotoDraw, MS-Photo Editor, MS-Schedule, MS-Search Server, MS-SharePoint Designer, MS-SharePoint Foundation, MS-SharePoint Workspace (formerly Office Groove), Microsoft Vizact, Office Assistant, Office Web Components."]]},{"k":"facts","title":"Word interface and defaults","rows":[["Type of software","Word processor (application software) by Microsoft"],["Default file extension","<b>.docx<\/b> (Word 2007 onwards); .doc in Word 97–2003"],["Templates","<b>.dotx<\/b>; macro-enabled document .docm, macro-enabled template .dotm"],["Default new document name","Document1"],["Default font","Calibri 11 pt (Word 2007–2021); newer Microsoft 365 uses Aptos 11 pt; Word 2003 used Times New Roman 12 pt"],["Font size range","1 to 1638 points"],["Ribbon","Strip of tabs with grouped commands, introduced in Office 2007"],["Quick Access Toolbar","Small toolbar above (or below) the Ribbon; default buttons Save, Undo, Redo"],["Title bar","Top bar showing document name and program name"],["Status bar","Bottom bar: page number, word count, proofing status, views, zoom slider"],["Ruler","Shows margins, indents and tab stops"],["Backstage view","Opened by the File tab: New, Open, Save As, Print, Share, Options"],["Cursor / insertion point","Blinking vertical line where the next character will appear"],["MS-Word","Word processor program; application software."],["History","MS-Word announced in 1983 as \"Multi-Tool Word\" for Xenix OS and MS-DOS; first release for Windows in 1989."],["Other word processors","WordStar, Easy Word, OpenOffice Writer (open-source), WordPerfect."],["File","Default name Document1; .doc (till 2003), .docx (2007 onwards); maximum file size 512 MB."],["Run command","Type \"winword\" in Run (Win + R) to open MS-Word."],["Mouse in Word","Single click = place the cursor; double click = select a word; triple click = select a paragraph; Ctrl + click = select a sentence."],["F8 (extend mode)","Press F8 twice = select word, three times = sentence, four times = paragraph, five times = whole document."],["Bars","Title bar, Quick Access Toolbar, Menu bar (menu/tab), Ribbon (tools/commands/sub-menus), vertical scroll bar, horizontal scroll bar, status bar."],["Toolbar","Contains buttons and menus for quick access to common commands."],["Dialog box","A small window."],["Tabs","File, Home, Insert, Draw, Design, Layout, References, Mailings, Review, View, Help. (There is no \"Data\" tab in Word; Data is in Excel.)"]]},{"k":"table","title":"Ribbon tabs — where things live","head":["Tab","Main commands"],"rows":[["File","Backstage: New, Open, Save, Save As, Print, Info, Options"],["Home","Clipboard (Cut, Copy, Paste, Format Painter), Font, Paragraph, Styles, Editing (Find, Replace, Select)"],["Insert","Pages (Cover Page, Blank Page, Page Break), Table, Pictures, Shapes, SmartArt, Chart, Link (hyperlink), Header, Footer, Page Number, Text Box, WordArt, Drop Cap, Symbol, Equation"],["Design","Themes, document formatting, Watermark, Page Colour, Page Borders"],["Layout (Page Layout in 2010/2013)","Margins, Orientation, Size, Columns, Breaks, Line Numbers, Hyphenation, Indent and Spacing"],["References","Table of Contents, Footnotes, Endnotes, Citations and Bibliography, Captions, Index"],["Mailings","Envelopes, Labels, Start Mail Merge, Select Recipients, Insert Merge Field, Finish and Merge"],["Review","Spelling and Grammar, Thesaurus, Word Count, Comments, Track Changes, Accept / Reject, Compare, Protect"],["View","Read Mode, Print Layout, Web Layout, Outline, Draft, Ruler, Gridlines, Navigation Pane, Zoom, Macros"]]},{"k":"info","title":"The MS Word window","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 300\" role=\"img\" aria-label=\"Document1 — Word window, labelled\">\n  <rect x=\"20\" y=\"10\" width=\"440\" height=\"270\" rx=\"8\" fill=\"var(--sheet)\" stroke=\"var(--rule)\" stroke-width=\"2\"/><rect x=\"20\" y=\"10\" width=\"440\" height=\"24\" rx=\"8\" fill=\"#2f6db5\"/>\n  <text x=\"240\" y=\"27\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" style=\"fill:#fff\">Document1 — Word<\/text>\n  <text x=\"34\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">File<\/text><text x=\"90\" y=\"50\" font-size=\"10.5\" font-weight=\"800\">Home<\/text><text x=\"146\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">Insert<\/text><text x=\"202\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">Design<\/text><text x=\"258\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">Layout<\/text><text x=\"314\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">Review<\/text><text x=\"370\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">View<\/text>\n  <rect x=\"24\" y=\"56\" width=\"432\" height=\"34\" fill=\"var(--sunk)\"/><rect x=\"32\" y=\"62\" width=\"60\" height=\"22\" rx=\"4\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><rect x=\"102\" y=\"62\" width=\"60\" height=\"22\" rx=\"4\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><rect x=\"172\" y=\"62\" width=\"60\" height=\"22\" rx=\"4\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><rect x=\"242\" y=\"62\" width=\"60\" height=\"22\" rx=\"4\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><rect x=\"312\" y=\"62\" width=\"60\" height=\"22\" rx=\"4\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><rect x=\"382\" y=\"62\" width=\"60\" height=\"22\" rx=\"4\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/>\n  <rect x=\"24\" y=\"94\" width=\"432\" height=\"10\" fill=\"var(--sunk)\"/><line x1=\"30\" y1=\"94\" x2=\"30\" y2=\"104\" stroke=\"var(--ink2)\"/><line x1=\"72\" y1=\"94\" x2=\"72\" y2=\"104\" stroke=\"var(--ink2)\"/><line x1=\"114\" y1=\"94\" x2=\"114\" y2=\"104\" stroke=\"var(--ink2)\"/><line x1=\"156\" y1=\"94\" x2=\"156\" y2=\"104\" stroke=\"var(--ink2)\"/><line x1=\"198\" y1=\"94\" x2=\"198\" y2=\"104\" stroke=\"var(--ink2)\"/><line x1=\"240\" y1=\"94\" x2=\"240\" y2=\"104\" stroke=\"var(--ink2)\"/><line x1=\"282\" y1=\"94\" x2=\"282\" y2=\"104\" stroke=\"var(--ink2)\"/><line x1=\"324\" y1=\"94\" x2=\"324\" y2=\"104\" stroke=\"var(--ink2)\"/><line x1=\"366\" y1=\"94\" x2=\"366\" y2=\"104\" stroke=\"var(--ink2)\"/><line x1=\"408\" y1=\"94\" x2=\"408\" y2=\"104\" stroke=\"var(--ink2)\"/>\n  <rect x=\"90\" y=\"110\" width=\"300\" height=\"148\" fill=\"#fff\" stroke=\"var(--rule)\"/><rect x=\"108\" y=\"126\" width=\"264\" height=\"6\" rx=\"3\" fill=\"#d0d4da\"/><rect x=\"108\" y=\"146\" width=\"224\" height=\"6\" rx=\"3\" fill=\"#d0d4da\"/><rect x=\"108\" y=\"166\" width=\"184\" height=\"6\" rx=\"3\" fill=\"#d0d4da\"/><rect x=\"108\" y=\"186\" width=\"264\" height=\"6\" rx=\"3\" fill=\"#d0d4da\"/><rect x=\"108\" y=\"206\" width=\"224\" height=\"6\" rx=\"3\" fill=\"#d0d4da\"/><rect x=\"108\" y=\"226\" width=\"184\" height=\"6\" rx=\"3\" fill=\"#d0d4da\"/><rect x=\"20\" y=\"262\" width=\"440\" height=\"18\" fill=\"var(--sunk)\"/><text x=\"30\" y=\"275\" font-size=\"9.5\" class=\"mut\">Page 1 of 1 · 250 words<\/text>\n  <line x1=\"240\" y1=\"22\" x2=\"480\" y2=\"52\" stroke=\"var(--ink2)\"/><circle cx=\"240\" cy=\"22\" r=\"2.5\" fill=\"var(--ink2)\"/><text data-lq=\"Title bar\" x=\"486\" y=\"56\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Title bar (file name)<\/text><line x1=\"120\" y1=\"46\" x2=\"480\" y2=\"82\" stroke=\"var(--ink2)\"/><circle cx=\"120\" cy=\"46\" r=\"2.5\" fill=\"var(--ink2)\"/><text data-lq=\"Ribbon tabs\" x=\"486\" y=\"86\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Ribbon tabs<\/text><line x1=\"200\" y1=\"73\" x2=\"480\" y2=\"110\" stroke=\"var(--ink2)\"/><circle cx=\"200\" cy=\"73\" r=\"2.5\" fill=\"var(--ink2)\"/><text data-lq=\"Ribbon\" x=\"486\" y=\"114\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Ribbon — groups of commands<\/text><line x1=\"300\" y1=\"99\" x2=\"480\" y2=\"140\" stroke=\"var(--ink2)\"/><circle cx=\"300\" cy=\"99\" r=\"2.5\" fill=\"var(--ink2)\"/><text data-lq=\"Ruler\" x=\"486\" y=\"144\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Ruler<\/text><line x1=\"300\" y1=\"180\" x2=\"480\" y2=\"174\" stroke=\"var(--ink2)\"/><circle cx=\"300\" cy=\"180\" r=\"2.5\" fill=\"var(--ink2)\"/><text data-lq=\"Page\" x=\"486\" y=\"178\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Page (Print Layout view)<\/text><line x1=\"120\" y1=\"271\" x2=\"480\" y2=\"260\" stroke=\"var(--ink2)\"/><circle cx=\"120\" cy=\"271\" r=\"2.5\" fill=\"var(--ink2)\"/><text data-lq=\"Status bar\" x=\"486\" y=\"264\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Status bar<\/text><\/svg><\/figure>","cap":"The ribbon replaced menus in Office 2007. Home holds the Clipboard, Font and Paragraph groups; the default view is Print Layout."},{"k":"table","title":"File tab","head":["Command","Use","Shortcut"],"rows":[["Info","Information about the file","—"],["New","New document","Ctrl + N"],["Open","Open an existing file","Ctrl + O or Ctrl + F12"],["Save","Save the content","Ctrl + S (Shift + F12 also saves)"],["Save As","Save with a new name, location or format","F12"],["Print","Print a document","Ctrl + P or Ctrl + Shift + F12"],["Print Preview","See how it will print","Ctrl + F2 or Ctrl + Alt + I"],["Export","Convert Word file to PDF","—"],["Share","Share the file on OneDrive (cloud)","—"],["Transform","Turn a Word file into a web page (via MS-Sway) [exam]","—"],["Close","Close the file","Ctrl + W (Ctrl + F4)"],["Close the application","Exit Word","Alt + F4"]]},{"k":"table","title":"Home tab","head":["Group","Tools and facts"],"rows":[["Clipboard","Till Word 97 holds 1 item; from Word 2000 holds 24 items; volatile; Copy = Ctrl + C / Ctrl + Insert; Cut = Ctrl + X; Paste = Ctrl + V / Shift + Insert; Paste Special = Ctrl + Alt + V (paste unformatted text); Format Painter = Ctrl + Shift + C (copy format) and Ctrl + Shift + V (paste format); double-click Format Painter to use it many times. Clipboard pane buttons: Paste All, Clear All, Options."],["Font","Default font: Times New Roman (till 2003), Calibri (2007 onwards), now Aptos in Microsoft 365. Font size range 1 to 1638; drop-down list 8 to 72; default 12 (2003), 11 (2007+). 72 points = 1 inch. Font styles: Regular (default), Bold (Ctrl + B), Italic (Ctrl + I). Underline Ctrl + U; double underline Ctrl + Shift + D. Font effects: subscript (Ctrl + =), superscript (Ctrl + Shift + +), strikethrough. Font dialog box Ctrl + D (also Ctrl + Shift + F changes font): font, size, style, subscript, superscript, strikethrough, double strikethrough, all caps, small caps, emboss, engrave. Text colour; text highlight colour. Change Case (Shift + F3): Sentence case, lowercase, UPPERCASE, Capitalize Each Word, tOGGLE cASE."],["Font size keys","Ctrl + ] = increase by 1 point; Ctrl + [ = decrease by 1 point; Ctrl + Shift + &gt; = increase to the next list size (1 point up to 12, then 2 points); Ctrl + Shift + &lt; = decrease to the previous size."],["Paragraph","Bullets (numbered and unnumbered; Ctrl + Shift + L = bullet). 4 alignments: Left (default, Ctrl + L), Right (Ctrl + R), Center (Ctrl + E), Justify (Ctrl + J). Line spacing 1.0 to 3.0, default 1.15 (vertical space between lines); Ctrl + 1 single, Ctrl + 2 double, Ctrl + 5 = 1.5 lines. Borders (all, bottom, top, left, right; on word, sentence, paragraph). Shading (colour behind the selected text). Indentation: first-line indent, left indent, right indent (markers on the ruler); Ctrl + M = indent the paragraph, Ctrl + T = hanging indent, Ctrl + Q = remove paragraph formatting/indentation."],["Styles","Normal (default), No Spacing, Heading 1, Heading 2, Heading 3: apply a consistent look to headings, titles and subtitles; Ctrl + Alt + 1/2/3 = Heading 1/2/3."],["Editing","Find (Ctrl + F, opens Navigation pane), Replace (Ctrl + H), Go To (Ctrl + G); F5 opens Find and Replace (Go To)."],["Voice","Dictate (voice typing)."],["Editor","Checks everything in the document (spelling, grammar, clarity)."],["Add-ins","Adds extra pre-defined applications to Word."]]},{"k":"table","title":"Insert tab","head":["Group","Tools and facts"],"rows":[["Pages","Cover page; blank page; page break (Ctrl + Enter: moves the cursor to the next page)"],["Table","Draw Table (with mouse); Insert Table: maximum 63 columns and 32,767 rows, minimum 1 x 1; Excel spreadsheet (import Excel data); Quick Tables (e.g. calendars) [exam]; pressing Tab in the last cell adds a new row; Ctrl + Shift + Enter splits a table"],["Illustrations","Picture, Icons (animated images), Shapes, 3D Models, SmartArt (pre-defined graphics), Screenshot (screen clipping), Chart"],["Media","Online Video (from social platforms)"],["Links","Hyperlink (Ctrl + K): to an existing document, web page, place in the document, or email ID; link text is blue and underlined; mouse becomes a hand; Ctrl + click opens it. Bookmark: names a location to jump to quickly."],["Comment","Comment tool: additional note"],["Header and Footer","Header, footer (text and images) and page numbers; options: repeat on every page, different first page, different odd and even pages"],["Text","Text box; WordArt (decorative text); Drop Cap (3 types: None, Dropped, In Margin; lines to drop: 1 to 10); Signature line; Date and Time (Alt + Shift + D date, Alt + Shift + T time)"],["Symbols","Equation (maths), Symbol; Ctrl + Alt + C = copyright ©; Ctrl + Alt + T = trademark ™"]]},{"k":"table","title":"Design, Layout and References tabs","head":["Tab","Tools and facts"],"rows":[["Draw","Handwriting tools"],["Design","Themes (colour, font, size); Document Formatting (predefined formatting) [exam]; Watermark (text or image, diagonal or horizontal; default watermarks \"Confidential\" and \"Do Not Copy\"; behind the text); Page Color (default white; visible only in Print Layout and Web Layout views); Page Borders"],["Layout","Page Setup: Margins on 4 sides (T, B, L, R). Normal margin (2007+) = 1 inch on all sides; till 2003 Normal = top/bottom 1 inch, left/right 1.25 inch. Margin types: Normal, Wide, Narrow, Moderate, Mirrored, Custom (no \"Broad\" or \"Center\" margin). Gutter margin = extra space for binding (pasting or spiral). Orientation: Portrait/Landscape. Size: A3, A4, A5, B4, B5, Tabloid, Legal (8.5 x 14 in), Statement, Executive, Letter (8.5 x 11 in); the default is Letter (8.5 x 11 in) or A4 (8.27 x 11.69 in, 21 x 29.7 cm), depending on the region. Columns (one, two, three, left, right). Hyphenation (breaking a word across two lines). Paragraph (spacing, indentation). Arrange (wrap text). 1 inch = 2.54 cm."],["References","Table of Contents (hierarchical headings; built from heading Styles); Footnote (bottom of the page; Alt + Ctrl + F); Endnote (end of the document; Alt + Ctrl + D); Research (online search); Citation and Bibliography (Manage Sources); Captions (text below a figure); Index; Table of Authorities (list of references)"]]},{"k":"table","title":"Mailings, Review and View tabs","head":["Tab","Tools and facts"],"rows":[["Mailings","Used after making a document, to mail it (Word + Outlook). Create: Envelopes, Labels. Start Mail Merge: letters, email messages, envelopes, labels, directory, normal Word document; Select Recipients (email address list); Edit Recipient List. Write and Insert Fields: Address Block, Greeting Line. Preview Results (check before sending). Mail merge needs a main document, a data source and merge fields."],["Review","Proofing: Spelling and Grammar (F7): spelling mistake = red wavy line, grammar mistake = blue double underline in new Word; Thesaurus (Shift + F7): dictionary, synonyms and antonyms; Word Count (also on the status bar); Editor (F7). Speech: Read Aloud. Accessibility (errors and warnings; status bar). Language (add language; Translate English &lt;→ Hindi). Comments (New Comment; also on Insert tab). Tracking: Track Changes (Ctrl + Shift + E). Changes: Accept, Reject. Compare: Combine (merge two files), Compare (two versions). Protect: Restrict Formatting, Restrict Editing (make file read-only)."],["View","Document views (5): Print Layout (default), Web Layout (see as a web page), Read Mode (full-screen reading), Outline (bulleted structure), Draft (quick editing). Immersive: Focus mode, Immersive Reader (more character spacing). Page Movement: vertical, side to side. Show: Ruler (top and left), Gridlines, Navigation Pane (Ctrl + F). Zoom: 10% to 500%, default 100% (also on the status bar). Window: New Window, Split, Switch Windows. Macros: recording tool; View Macros (Alt + F8); steps: 1 macro name, 2 assign to button or keyboard shortcut, 3 store in, 4 description. Properties (same as Info in the File tab)."],["Help","Help (F1), Feedback, Contact Support (robotic chat), Show Training (video tutorials), What's New."]]},{"k":"table","title":"Views in Word","head":["View","Use"],"rows":[["Print Layout","Default view; shows the page exactly as it will print"],["Read Mode","Full-screen reading; editing tools hidden"],["Web Layout","Shows how the document looks as a web page"],["Outline","Shows the heading structure; move whole sections"],["Draft","Plain text only; headers, footers and pictures hidden — fastest for typing"]]},{"k":"table","title":"Word formatting and page features","head":["Feature","What it means"],"rows":[["Alignment","Left (default), Center, Right, Justify (both edges straight)"],["Line spacing","Gap between lines: 1.0, 1.15, 1.5, 2.0 … (Home → Paragraph)"],["Indent","Distance of text from the margin; first-line and hanging indents"],["Styles","Saved formatting sets: Normal, Heading 1, Heading 2, Title …; headings feed the Table of Contents"],["Format Painter","Copies formatting from one text to another (paintbrush icon)"],["Margins","Blank space around the page; Normal = 1 inch on each side"],["Gutter","Extra margin for binding"],["Orientation","Portrait (tall) or Landscape (wide)"],["Breaks","Page break; section breaks: Next Page, Continuous, Even Page, Odd Page; column break"],["Columns","Newspaper-style columns (Layout → Columns)"],["Header / Footer","Text repeated at the top / bottom of every page; page numbers usually go here"],["Footnote / Endnote","Note at the bottom of the page / at the end of the document"],["Drop Cap","Large first letter of a paragraph (Insert tab)"],["Watermark","Faint text or picture behind page text, e.g. CONFIDENTIAL"],["Mail Merge","Main document + data source (Excel list, Outlook contacts) = personalised letters, envelopes, labels"],["Track Changes","Records every insertion and deletion so a reviewer can accept or reject it"],["Find &amp; Replace","Find a word (Ctrl+F) and replace it (Ctrl+H)"],["AutoCorrect","Fixes common typing mistakes automatically (teh → the)"],["Spell check","Red wavy underline = spelling; blue double underline = grammar (Word 2013 onwards)"],["Table","Insert → Table; cells in rows and columns; merge and split cells"]]},{"k":"table","title":"Word-specific shortcuts","head":["Keys","Action in Word"],"rows":[["Ctrl+B / Ctrl+I / Ctrl+U","Bold / Italic / Underline"],["Ctrl+Shift+D","Double underline"],["Ctrl+L / Ctrl+E / Ctrl+R / Ctrl+J","Align left / Center / Align right / Justify"],["Ctrl+] / Ctrl+[","Increase / decrease font size by 1 point"],["Ctrl+Shift+&gt; / Ctrl+Shift+&lt;","Increase / decrease font size to the next size in the list"],["Ctrl+D","Font dialog box"],["Shift+F3","Change case (lowercase, UPPERCASE, Capitalise Each Word)"],["Ctrl+= / Ctrl+Shift+plus","Subscript / Superscript"],["Ctrl+1 / Ctrl+2 / Ctrl+5","Single / double / 1.5 line spacing"],["Ctrl+M / Ctrl+Shift+M","Increase / decrease left indent"],["Ctrl+T","Hanging indent"],["Ctrl+Enter","Page break"],["Shift+Enter","Line break (new line, same paragraph)"],["Ctrl+Shift+Enter","Column break"],["Ctrl+K","Insert hyperlink"],["Ctrl+W","Close the document"],["Ctrl+Home / Ctrl+End","Beginning / end of the document"],["Ctrl+Space","Remove character formatting"],["Ctrl+Shift+C / Ctrl+Shift+V","Copy formatting / paste formatting"],["F7 / Shift+F7","Spelling and Grammar / Thesaurus"],["Ctrl+Shift+E","Turn Track Changes on or off"],["Ctrl+Alt+M","Insert a comment"],["Ctrl+Alt+F / Ctrl+Alt+D","Insert footnote / endnote"],["Alt+Shift+D / Alt+Shift+T","Insert date / time"],["Ctrl+Alt+C / R / T","© / ® / ™ symbol"],["F4","Repeat the last action"],["F12","Save As"],["Ctrl + A","Select all"],["Ctrl + Z / Ctrl + Y","Undo / Redo (Ctrl + Y also repeats)"],["Ctrl + Shift + *","Show/hide non-printing characters"],["Ctrl + Left/Right arrow","Move one word left/right"],["Ctrl + Up/Down arrow","Start / end of the paragraph"],["Ctrl + Delete / Ctrl + Backspace","Delete word to the right / left"],["Ctrl + Spacebar","Reset text to the default font"],["Ctrl + F1","Show/hide the ribbon (task pane)"],["Alt + Ctrl + F2","Open a document"],["Ctrl + Shift + F6","Switch to another open Word document"]]},{"k":"p","h":"<b>Mail merge in four steps.<\/b> (1) Start Mail Merge and pick the type (letters, labels, envelopes, emails). (2) Select Recipients: the data source, such as an Excel sheet of names and addresses. (3) Insert merge fields like &lt;&lt;Name&gt;&gt; and &lt;&lt;Address&gt;&gt; into the main document. (4) Preview Results and Finish and Merge: Word makes one letter per row of the data source. So mail merge needs a main document, a data source and merge fields, but no special \"Word fields\"."},{"k":"p","h":"<b>Footnote vs endnote.<\/b> both add notes with small numbers in the text. A footnote appears at the bottom (foot) of the same page; an endnote collects all notes at the end of the document. Footnote = Alt + Ctrl + F; endnote = Alt + Ctrl + D."},{"k":"p","h":"<b>Paragraph vs character formatting.<\/b> character formatting changes letters (font, font style, size, colour, effects). Paragraph formatting changes whole paragraphs (alignment, line spacing, indentation, bullets, borders). So \"alignment\" is NOT a character formatting option."},{"k":"trick","h":"Alignment keys spell <span class='mn'>L-E-R-J<\/span>: <span class='mn'>L<\/span>eft, c<span class='mn'>E<\/span>nter (the E in cEntre), <span class='mn'>R<\/span>ight, <span class='mn'>J<\/span>ustify — 'Let Every Row Justify'. Square brackets grow and shrink: <span class='mn'>]<\/span> points right = bigger, <span class='mn'>[<\/span> = smaller.<ul><li>Word tabs in order \"Five Happy Indians Draw Designs, Learn Real Maths, Read Very Hard\": File, Home, Insert, Draw, Design, Layout, References, Mailings, Review, View, Help.<\/li><li>Where is it? Thesaurus/Track Changes/Spelling = Review; TOC/Footnote/Citation = References; Mail Merge/Envelopes = Mailings; Watermark/Page Color = Design; Margins/Orientation/Columns = Layout; Hyperlink/Header/Drop Cap = Insert.<\/li><li>Alignments \"L-E-R-J\": Left Ctrl + L, cEntre Ctrl + E, Right Ctrl + R, Justify Ctrl + J.<\/li><li>Font size limits \"1-1638, list 8-72\"; Excel \"1-409\".<\/li><li>Five views \"P-W-R-O-D\": Print, Web, Read, Outline, Draft.<\/li><li>F7 = spelling; Shift + F7 = thesaurus; F12 = Save As; Shift + F3 = change case.<\/li><li>Footnote = Foot of the page; Endnote = End of the document.<\/li><li>Ctrl + K = linK; Ctrl + D = Dialog for font; Ctrl + Shift + L = List (bullets).<\/li><li>Superscript goes up (x²): Ctrl + Shift + +; subscript goes down (H₂O): Ctrl + =.<\/li><\/ul>"},{"k":"trap","h":"<b>Ctrl+C is copy, not center<\/b> — center is <b>Ctrl+E<\/b>. <b>Ctrl+Enter<\/b> = page break but <b>Shift+Enter<\/b> = line break. <b>Ctrl+D<\/b> in Word opens the Font dialog, not 'duplicate' or 'bookmark'. <b>Shift+F3<\/b> changes case in Word but opens Insert Function in Excel. <b>F7<\/b> is spelling; <b>Shift+F7<\/b> is the Thesaurus. <b>Header/footer<\/b> are on the Insert tab, <b>Margins/Orientation<\/b> on the Layout tab, <b>Mail Merge<\/b> on Mailings, <b>Track Changes<\/b> on Review. Default extension is <b>.docx<\/b>; <b>.dotx<\/b> is a template.<ul><li>Maximum font size in Word is 1638, not 255 or 409 (409 is Excel).<\/li><li>DATA is not a Word tab.<\/li><li>Insert Hyperlink = Ctrl + K, not Ctrl + H (Ctrl + H = Replace).<\/li><li>Word has 5 document views.<\/li><li>Change Case is in the FONT group.<\/li><li>Orientation (not wrap text) switches portrait/landscape.<\/li><li>Redo = Ctrl + Y; Undo = Ctrl + Z.<\/li><li>Accept and Reject are in the REVIEW tab.<\/li><li>\"Broad\" is not a margin option; \"Moderate\" is.<\/li><li>Superscript is a font EFFECT, not a font style; styles are regular, bold, italic.<\/li><li>Drop cap can drop at most 10 lines.<\/li><li>Ctrl + T = hanging indent in Word, not \"terminate dialog boxes\".<\/li><li>Spell check = F7.<\/li><li>Page colour shows only in Print Layout and Web Layout, not Reading view.<\/li><li>Ctrl + E = centre in Word, but in a browser Ctrl + E goes to the search bar.<\/li><\/ul>"}],"sum":["MS Word is a word processor; default file .docx (older .doc), template .dotx.","Ribbon tabs: Home formatting, Insert tables and headers, Layout margins and orientation, Mailings mail merge, Review spelling and track changes.","Alignment: Ctrl+L left, Ctrl+E center, Ctrl+R right, Ctrl+J justify.","Ctrl+K hyperlink, Ctrl+Enter page break, Shift+F3 change case, Ctrl+] and Ctrl+[ font size by 1 point.","F7 spelling and grammar, Shift+F7 thesaurus, Ctrl+W close document, F12 Save As.","MS-Office (announced 1988, first released 19 Nov 1990) = Word, Excel, PowerPoint, Access, Outlook etc.; it is application, closed-source, horizontal-market software.","Word: Document1, .doc/.docx, max font 1638, default font Calibri/Aptos size 11, line spacing 1.15, margins 1 inch.","Home: Clipboard (24 items), Font (Ctrl + D), Paragraph (alignments, spacing, bullets Ctrl + Shift + L), Styles, Editing (Ctrl + F/H/G).","Insert: page break Ctrl + Enter, table 63 x 32,767, hyperlink Ctrl + K, header/footer, drop cap (1-10 lines), WordArt, symbols.","Design: themes, watermark, page colour; Layout: margins, orientation, size, columns; References: TOC, footnote, endnote, citations.","Mailings: mail merge; Review: F7 spelling, Shift + F7 thesaurus, Track Changes Ctrl + Shift + E; View: 5 views, zoom 10-500%, macros Alt + F8."],"part":["Part 2 · Software, Windows & MS Office","सॉफ़्टवेयर, विंडोज़ एवं एमएस ऑफ़िस"]},
{"id":"C10","g":"cmp","heat":3,"title":"MS Excel","hi":"एमएस एक्सेल","blocks":[{"k":"hot","h":"Excel gives 2–3 questions: <b>cell address and references ($A$1)<\/b>, <b>functions<\/b> (COUNT vs COUNTA, VLOOKUP, IF), <b>error values<\/b> (#DIV/0!, #N/A, ####), the <b>row/column limits<\/b> and shortcuts like Alt+= and Ctrl+;.<br><br>Excel gives 2 to 4 questions in every SSC Tier-II computer module: rows/columns count, cell address, counting cells in a range, relative/absolute/mixed references after copy-paste, formula output (operator order, SUM, FLOOR, MATCH), chart types and shortcuts (Ctrl + D, Shift + F11, F11, Alt + =). CGL Tier-II asked the cell, A10, MATCH and column width; CHSL asked Ctrl + D, Shift + F11 and Alt + I + R."},{"k":"story","h":"<p>MS Excel is a <b>spreadsheet<\/b> — think of a huge <b>attendance register<\/b> drawn as a grid. The whole register is a <b>workbook<\/b> (one file); each page in it is a <b>worksheet<\/b>; each little box is a <b>cell<\/b>. Columns go across with letters (A, B, C…) and rows go down with numbers (1, 2, 3…), so every box has an address such as <b>B3<\/b> — column B, row 3, like a seat number in a cinema.<\/p><p>The magic of Excel is the <b>formula<\/b>. Type <b>=B3+C3<\/b> in a cell and Excel adds those two boxes; change either number and the answer updates by itself. Ready-made formulas are called <b>functions<\/b>: SUM adds, AVERAGE finds the mean, MAX picks the largest.<\/p><p>When you copy a formula down, Excel shifts the addresses automatically (a <b>relative reference<\/b>). If you want one address to stay fixed — say a tax rate in one cell — you pin it with dollar signs, <b>$B$1<\/b> (an <b>absolute reference<\/b>). Charts, sorting and filters then turn the numbers into answers.<\/p>","key":"Workbook holds worksheets, worksheets hold cells; formulas start with = and dollar signs fix a reference."},{"k":"facts","title":"Excel basics and limits","rows":[["Type of software","Spreadsheet (application software) by Microsoft"],["Workbook","The whole Excel file; default name Book1"],["Worksheet","One sheet (tab) in a workbook; default names Sheet1, Sheet2 …"],["Sheets in a new workbook","1 (Excel 2013 onwards); 3 in Excel 2007 and 2010"],["Cell","Intersection of a row and a column"],["Cell address / reference","Column letter + row number, e.g. C5"],["Active cell","The selected cell with a thick border; its address shows in the Name Box"],["Range","Group of cells written with a colon, e.g. A1:B5 (10 cells)"],["Name Box","Left of the formula bar; shows the active cell address or a named range"],["Formula bar","Shows and edits the content or formula of the active cell (fx)"],["Rows","Identified by numbers; 1,048,576 rows (Excel 2007 onwards)"],["Columns","Identified by letters; 16,384 columns; last column <b>XFD<\/b>"],["Excel 2003 limits","65,536 rows and 256 columns (last column IV)"],["Characters in one cell","Up to 32,767"],["File extensions","<b>.xlsx<\/b> workbook; .xls (Excel 97–2003); <b>.xlsm<\/b> macro-enabled; .xltx template; .csv plain text"],["Fill handle","Small square at the bottom-right of a selection; drag to copy or continue a series"],["Default alignment","Text aligns left, numbers align right"],["MS-Excel","Spreadsheet program and chart-making application (part of MS-Office / Microsoft 365)."],["File","Workbook = collection of worksheets (sheets/spreadsheets). Default name Book1; extension .xls (till 2003), .xlsx (2007+); macro-enabled .xlsm."],["Workbook name length","Up to 225 characters manually. Sheet name: up to 31 characters."],["Default sheets","Excel 2010 and earlier: 3 sheets; Excel 2013 onwards: 1 sheet."],["Cell address","Location of a cell: column letter + row number. Valid: A1, A2, D3, G4, A23, AB23, IV65536, XFD1048576. Invalid: 2A, 2A2, A2B3, A9B, 9AB."],["Column width","Minimum 0, default 8.43, maximum 255 characters."],["Row height","Minimum 0, default 15, maximum 409 points."],["Cell alignment","6 alignments: Left, Center, Right (horizontal) and Top, Middle, Bottom (vertical) giving 9 positions. Default: text (alphabets) left, numbers right, alphanumeric left. \"Align across\" is not an option."],["Mouse pointers","Thick plus (default pointer), thin plus at the bottom-right corner = fill handle (Auto Fill content: series like 10, 20 → 30, 40 or A1, B2 patterns), arrow plus (move content)."],["Ribbon","Appears below the title bar with all commands."],["#####","Shown when the column is not wide enough to display the result."],["Hidden column/row","Shown by a double line indicator between headings."]]},{"k":"facts","title":"Formulas and references","rows":[["Formula","Always starts with \"=\". Example: =10+20+30 → 60; =A1+A2+A3 → 60."],["Function","Pre-written formula: =SUM(10,20,30), =SUM(A1+A2+A3), =SUM(A1:A3)."],["Range","A1:B3 means A1 through B3."],["Order of operations","1 Left to right; 2 Parentheses and exponent ^; 3 Division and multiplication; 4 Addition and subtraction. Example: =20/10+2-1*2 = 2 + 2 - 2 = 2."],["Relative reference (default)","Both column and row change when copied. A4 =SUM(A1:A3) copied to D5 (3 columns right, 1 row down) → =SUM(D2:D4); D6 =SUM(C7:H11) copied to E9 → =SUM(D10:I14)."],["Absolute reference","$A$5: nothing changes. Press F4 to make A5 into $A$5. D6 =SUM($C$7:$H$11) copied to E9 stays =SUM($C$7:$H$11)."],["Mixed reference (row fixed)","A$5: column changes, row stays. D6 =SUM(A$5:C$7) copied to E9 → =SUM(B$5:D$7)."],["Mixed reference (column fixed)","$A5: row changes, column stays. D6 =SUM($A5:$C7) copied to E9 → =SUM($A8:$C10)."],["Dollar sign","Used in absolute and mixed references."]]},{"k":"table","title":"Formulas, operators and references","head":["Item","Rule / example"],"rows":[["Formula","Always begins with = (for example =A1+B1)"],["Arithmetic operators","+ add, - subtract, * multiply, / divide, ^ power, % percent"],["Text operator","&amp; joins text: =A1&amp;' '&amp;B1"],["Comparison operators","=, &gt;, &lt;, &gt;=, &lt;=, &lt;&gt; (not equal)"],["Order of operations","Brackets → negation → % → ^ → * and / → + and - → &amp; → comparison"],["Example","=10+5*2 gives 20; =(10+5)*2 gives 30; =2^3 gives 8"],["Relative reference","A1 — changes when the formula is copied"],["Absolute reference","$A$1 — column and row both fixed"],["Mixed reference","$A1 (column fixed) or A$1 (row fixed)"],["F4 key","While editing a formula, cycles A1 → $A$1 → A$1 → $A1 → A1"],["Reference to another sheet","Sheet2!A1"],["Ctrl+` (grave accent)","Show formulas instead of results"]]},{"k":"info","title":"The MS Excel window","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 300\" role=\"img\" aria-label=\"Book1 — Excel window, labelled\">\n  <rect x=\"20\" y=\"10\" width=\"440\" height=\"270\" rx=\"8\" fill=\"var(--sheet)\" stroke=\"var(--rule)\" stroke-width=\"2\"/><rect x=\"20\" y=\"10\" width=\"440\" height=\"24\" rx=\"8\" fill=\"#2f6db5\"/>\n  <text x=\"240\" y=\"27\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" style=\"fill:#fff\">Book1 — Excel<\/text>\n  <text x=\"34\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">File<\/text><text x=\"90\" y=\"50\" font-size=\"10.5\" font-weight=\"800\">Home<\/text><text x=\"146\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">Insert<\/text><text x=\"202\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">Design<\/text><text x=\"258\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">Layout<\/text><text x=\"314\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">Review<\/text><text x=\"370\" y=\"50\" font-size=\"10.5\" font-weight=\"500\">View<\/text>\n  <rect x=\"24\" y=\"56\" width=\"432\" height=\"34\" fill=\"var(--sunk)\"/><rect x=\"32\" y=\"62\" width=\"60\" height=\"22\" rx=\"4\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><rect x=\"102\" y=\"62\" width=\"60\" height=\"22\" rx=\"4\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><rect x=\"172\" y=\"62\" width=\"60\" height=\"22\" rx=\"4\" fill=\"var(--sheet)\" stroke=\"var(--rule)\"/><r  font-weight=\"700\">F<\/text>\n  <rect x=\"24\" y=\"136\" width=\"30\" height=\"20\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><text x=\"39\" y=\"150\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\">1<\/text><rect x=\"54\" y=\"136\" width=\"66\" height=\"20\" fill=\"#fff\" stroke=\"var(--rule)\" stroke-width=\"1\"/><rect x=\"120\" y=\"136\" width=\"66\" height=\"20\" fill=\"#fff\" stroke=\"var(--rule)\" stroke-width=\"1\"/><rect x=\"186\" y=\"136\" width=\"66\" height=\"20\" fill=\"#fff\" stroke=\"var(--rule)\" stroke-width=\"1\"/><rect x=\"252\" y=\"136\" width=\"66\" height=\"20\" fill=\"#fff\" stroke=\"var(--rule)\" stroke-width=\"1\"/><rect x=\"318\" y=\"136\" width=\"66\" height=\"20\" fill=\"#fff\" stroke=\"var(--rule)\" stroke-width=\"1\"/><rect x=\"384\" y=\"136\" width=\"66\" height=\"20\" fill=\"#fff\" stroke=\"var(--rule)\" stroke-width=\"1\"/><rect x=\"24\" y=\"156\" width=\"30\" height=\"20\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><text x=\"39\" y=\"170\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\">2<\/text><rect x=\"54\" y=\"156\" width=\"66\" height=\"20\" fill=\"#fff\" stroke=\"var(--rule)\" stroke-width=\"1\"/><rect x=\"120\" y=\"156\" width=\"66\" height=\"20\" fill=\"#fff\" stroke=\"var(--rule)\" stroke-width=\"1\"/><rect x=\"186\" y=\"156\" width=\"66\" height=\"20\" fill=\"#fff\" stroke=\"var(--rule)\" stroke-width=\"1\"/><rect x=\"252\" y=\"156\" width=\"66\" height=\"20\" fill=\"#fff\" stroke=\"var(--rule)\" stroke-width=\"1\"/><rect x=\"318\" y=\"156\" width=\"66\" height=\"20\" fill=\"#fff\" stroke=\"var(--rule)\" stroke-width=\"1\"/><rect x=\"384\" y=\"156\" width=\"66\" height=\"20\" fill=\"#fff\" stroke=\"var(--rule)\" stroke-width=\"1\"/><rect x=\"24\" y=\"176\" width=\"30\" height=\"20\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><text x=\"39\" y=\"190\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\">3<\/text><rect x=\"54\" y=\"176\" width=\"66\" height=\"20\" fill=\"#fff\" stroke=\" "20\" fill=\"#fff\" stroke=\"var(--rule)\" stroke-width=\"1\"/><rect x=\"318\" y=\"216\" width=\"66\" height=\"20\" fill=\"#fff\" stroke=\"var(--rule)\" stroke-width=\"1\"/><rect x=\"384\" y=\"216\" width=\"66\" height=\"20\" fill=\"#fff\" stroke=\"var(--rule)\" stroke-width=\"1\"/><rect x=\"24\" y=\"236\" width=\"30\" height=\"20\" fill=\"var(--sunk)\" stroke=\"var(--rule)\"/><text x=\"39\" y=\"250\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\">6<\/text><rect x=\"54\" y=\"236\" width=\"66\" height=\"20\" fill=\"#fff\" stroke=\"var(--rule)\" stroke-width=\"1\"/><rect x=\"120\" y=\"236\" width=\"66\" height=\"20\" fill=\"#fff\" stroke=\"var(--rule)\" stroke-width=\"1\"/><rect x=\"186\" y=\"236\" width=\"66\" height=\"20\" fill=\"#fff\" stroke=\"var(--rule)\" stroke-width=\"1\"/><rect x=\"252\" y=\"236\" width=\"66\" height=\"20\" fill=\"#fff\" stroke=\"var(--rule)\" stroke-width=\"1\"/><rect x=\"318\" y=\"236\" width=\"66\" height=\"20\" fill=\"#fff\" stroke=\"var(--rule)\" stroke-width=\"1\"/><rect x=\"384\" y=\"236\" width=\"66\" height=\"20\" fill=\"#fff\" stroke=\"var(--rule)\" stroke-width=\"1\"/><rect x=\"20\" y=\"262\" width=\"440\" height=\"18\" fill=\"var(--sunk)\"/><text x=\"30\" y=\"275\" font-size=\"9.5\" class=\"mut\">Page 1 of 1 · 250 words<\/text>\n  <line x1=\"49\" y1=\"103\" x2=\"480\" y2=\"56\" stroke=\"var(--ink2)\"/><circle cx=\"49\" cy=\"103\" r=\"2.5\" fill=\"var(--ink2)\"/><text data-lq=\"Name box\" x=\"486\" y=\"60\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Name box (active cell)<\/text><line x1=\"150\" y1=\"103\" x2=\"480\" y2=\"86\" stroke=\"var(--ink2)\"/><circle cx=\"150\" cy=\"103\" r=\"2.5\" fill=\"var(--ink2)\"/><text data-lq=\"Formula bar\" x=\"486\" y=\"90\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Formula bar<\/text><line x1=\"220\" y1=\"125\" x2=\"480\" y2=\"118\" stroke=\"var(--ink2)\"/><circle cx=\"220\" cy=\"125\" r=\"2.5\" fill=\"var(--ink2)\"/><text data-lq=\"Column headings\" x=\"486\" y=\"122\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Column headings (A, B, C…)<\/text><line x1=\"39\" y1=\"170\" x2=\"480\" y2=\"152\" stroke=\"var(--ink2)\"/><circle cx=\"39\" cy=\"170\" r=\"2.5\" fill=\"var(--ink2)\"/><text data-lq=\"Row numbers\" x=\"486\" y=\"156\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Row numbers (1, 2, 3…)<\/text><line x1=\"220\" y1=\"186\" x2=\"480\" y2=\"192\" stroke=\"var(--ink2)\"/><circle cx=\"220\" cy=\"186\" r=\"2.5\" fill=\"var(--ink2)\"/><text data-lq=\"Active cell C3\" x=\"486\" y=\"196\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Active cell C3<\/text><line x1=\"120\" y1=\"271\" x2=\"480\" y2=\"260\" stroke=\"var(--ink2)\"/><circle cx=\"120\" cy=\"271\" r=\"2.5\" fill=\"var(--ink2)\"/><text data-lq=\"Status bar\" x=\"486\" y=\"264\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Status bar<\/text><\/svg><\/figure>","cap":"A cell's address is its column letter then its row number (C3). A worksheet has 1,048,576 rows and 16,384 columns (A to XFD) since Excel 2007. Every formula starts with ="},{"k":"table","title":"Common functions","head":["Function","What it returns","Example"],"rows":[["SUM","Total","=SUM(A1:A10)"],["AVERAGE","Arithmetic mean","=AVERAGE(B2:B6)"],["COUNT","Number of cells containing numbers","=COUNT(A1:A10)"],["COUNTA","Number of non-empty cells (numbers, text, anything)","=COUNTA(A1:A10)"],["COUNTBLANK","Number of empty cells","=COUNTBLANK(A1:A10)"],["COUNTIF / SUMIF","Count / add cells meeting a condition","=COUNTIF(A1:A10,'&gt;50') — Excel itself uses double quotes"],["MAX / MIN","Largest / smallest value","=MAX(C1:C20)"],["IF","One value if a test is TRUE, another if FALSE","=IF(B2&gt;=33,'Pass','Fail')"],["AND / OR / NOT","Logical tests","=AND(A1&gt;0,B1&gt;0)"],["ROUND","Rounds to given digits","=ROUND(3.14159,2) gives 3.14"],["VLOOKUP","Looks for a value in the first column of a table, returns a value from a column to the right (vertical)","=VLOOKUP(101,A2:D50,3,FALSE)"],["HLOOKUP","Same, but searches the first row (horizontal)","=HLOOKUP(…)"],["XLOOKUP","Modern replacement for VLOOKUP/HLOOKUP (Excel 2021 / 365)","=XLOOKUP(…)"],["CONCAT / CONCATENATE","Joins text (CONCAT from Excel 2016 / 365)","=CONCATENATE(A1,B1)"],["LEN","Number of characters","=LEN('Excel') gives 5"],["UPPER / LOWER / PROPER / TRIM","Change case / remove extra spaces","=PROPER('ram kumar') gives Ram Kumar"],["TODAY","Current date only","=TODAY()"],["NOW","Current date and time","=NOW()"],["ABS / SQRT / MOD / POWER","Absolute value / square root / remainder / power","=MOD(17,5) gives 2"],["COUNTBLANK / COUNTIF","Counts empty cells / cells meeting a condition","—"],["LEFT / RIGHT / MID","Parts of text (text functions)","There is no COMBINE function"],["EXACT","Checks if two texts are identical (TRUE/FALSE)","—"],["CLEAN","Removes non-printable characters","—"],["CODE / CHAR","Character code / character from code (text functions); DB is a financial function","—"],["AND / OR / NOT / IF","Logical functions; IF returns one of 2 outputs; AND returns TRUE only if all conditions are true","—"],["FACT","Factorial","=FACT(5) = 120; FACT(0) = 1"],["FLOOR / CEILING","Round down / up to the nearest multiple","=FLOOR(134,19) = 133; =CEILING.MATH(155,10) = 160"],["EVEN / ODD","Round up to the nearest even / odd number","=EVEN(3)+ODD(8) = 4 + 9 = 13"],["SUMSQ","Sum of squares","=SUMSQ(1,2,3,4) = 30"],["ABS","Absolute value","—"],["MATCH","Position of a value in a list (match type 1 = largest value &lt;= lookup)","=MATCH(12,{10,13,30,40,60},1) = 1"],["LOOKUP / VLOOKUP","Return a value from a row/column range or table","—"],["INDIRECT","Changes a cell reference within a formula without changing the formula","—"],["NOW / TODAY","Current date-time / date","—"],["There is no SUBTRACT function","Use the minus sign instead","—"]]},{"k":"table","title":"Error values","head":["Error","Cause"],"rows":[["#DIV/0!","Dividing by zero or by an empty cell"],["#N/A","Value not available — e.g. VLOOKUP cannot find the item"],["#NAME?","Excel does not recognise text in the formula — misspelt function or range name"],["#REF!","Invalid cell reference — the referred cell was deleted"],["#VALUE!","Wrong type of argument — e.g. adding text to a number"],["#NUM!","Invalid number — e.g. =SQRT(-1)"],["#NULL!","Intersection of two ranges that do not meet"],["#SPILL!","Dynamic-array result blocked by data (Excel 365)"],["#### ","Column too narrow to show the number or date (or a negative date/time)"]]},{"k":"table","title":"Excel tabs and groups","head":["Tab","Groups and tools"],"rows":[["File","Info; New (Ctrl + N, new workbook); Open (Ctrl + O / Ctrl + F12); Save (Ctrl + S); Save As (F12; also used to save a new file the first time); Print (Ctrl + P / Ctrl + Shift + F12); Print Preview (Ctrl + F2); Share (OneDrive); Export (to PDF); Publish (interactive visual report); Close (Ctrl + W)"],["Home","1 Clipboard: Paste Special (Ctrl + Alt + V), Format Painter (no shortcut; double-click to use many times). 2 Font: default font Aptos (Microsoft 365); size 1 to 409 (list 8 to 72); Bold Ctrl + B or Ctrl + 2, Italic Ctrl + I or Ctrl + 3, Underline Ctrl + U or Ctrl + 4, Strikethrough Ctrl + 5; Fill colour, Text colour; Borders (print as lines); Excel's Font group has NO subscript, superscript or line spacing buttons. 3 Alignment: 6 alignments/9 positions, Wrap Text, Orientation (rotate text diagonally/vertically, clockwise/anticlockwise), Merge and Center (also in Format Cells &gt; Alignment tab). 4 Number: General (default, no specific format), Number (600.00), Currency (₹600.00), Accounting (₹ aligned), Percentage (60000%), Short Date (01/01/1900), Long Date, Fraction, Scientific; decimal places 0 to 30, default 2. 5 Styles: Conditional Formatting (Highlight Cells Rules: greater than, less than, between, equal to, duplicate values, date occurring, text that contains; Top/Bottom Rules; Data Bars; Color Scales; Icon Sets; New Rule), Format as Table, Cell Styles. 6 Cells: Insert (cells Ctrl + Shift + +, column, row, sheet Shift + F11), Delete (cell Ctrl + -, column, row, sheet), Format (column width, row height, hide/unhide; hide column Ctrl + 0, hide row Ctrl + 9). 7 Editing: AutoSum Σ (Alt + =) and other auto formulas, Sort and Filter, Find and Select (Find Ctrl + F, Go To Ctrl + G or F5, Replace Ctrl + H). 8 Analysis: Analyze Data (charts and tables)"],["Insert","Tables: Table, PivotTable (view complex data easily; quick summaries and contingency tables); Illustrations: Pictures, Icons (former ClipArt), 3D Models, Shapes, SmartArt, Screenshot; Charts: chart sheet (chart as its own sheet) or embedded chart (on the worksheet); F11 = instant column chart sheet; 3D Map; Sparklines (tiny chart inside one cell); Filter; Links (Hyperlink Ctrl + K); Comments (additional note; purple corner); Text: Text Box, Header and Footer (needs Page Layout view), WordArt; Symbols: Symbol, Equation"],["Page Layout","Themes (font, size, colour, effects); Page Setup: Margins (Normal default: top/bottom 0.75\", left/right 0.7\", header/footer 0.3\"; Wide; Narrow; Custom), Orientation (portrait/landscape), Size (default Letter; Tabloid, Statement, Legal, Executive, A3, A4, A5, B4, B5), Print Area (lock a block of selected cells for printing), Background; Scale to Fit (width, height); Sheet Options (Gridlines and Headings: view/print). 1 inch = 2.54 cm"],["Formulas","Function Library: Insert Function, Logical, Text, Financial, Date and Time, etc.; Shift + F3 opens the Insert Function window"],["Data","Get and Transform Data (from file: workbook, text, JSON, PDF, XML; from database: SQL Server, MS-Access, Analysis Services; from cloud: Azure); Sort and Filter; Data Validation (rules for what can be entered); Forecast: What-If Analysis (Goal Seek = reach a target value; Scenario Manager = several uncertain conditions; Data Table)"],["Review","Proofing: Spelling (F7), Thesaurus (Shift + F7), Workbook Statistics (Ctrl + Shift + G); Accessibility (errors and warnings; on status bar); Insights: Smart Lookup (online search); Language: add language, Translate (English &lt;→ Hindi); Comment (New Comment, Shift + F2; purple marker); Notes (New Note, big additional note; red marker); Protect: workbook/worksheet password protection"],["View","Workbook Views: Normal (default), Page Layout, Page Break Preview, Custom Views; Show: Ruler, Gridlines (on), Headings (on), Formula Bar (on), Navigation; Zoom 10% to 400% (default 100%); Window: New Window (same file again), Split (one file in 4 parts), Arrange All (vertical, horizontal, cascade, tiled), Freeze Panes (Freeze Panes, Freeze First Column, Freeze Top Row: keep headings visible while scrolling), Hide/Unhide workbook, Switch Windows; Macros: recording tool, View Macros (Alt + F8)"],["Help","Help (F1), Feedback, Contact Support (robotic chat), Show Training (video tutorials), What's New; Community: Excel blog, Excel community (online)"],["Power Pivot","Pivot tables for complex data with advanced tools"]]},{"k":"table","title":"Excel tools","head":["Tool","Where / what"],"rows":[["Charts","Insert tab: Column, Bar, Line, Pie, Area, Scatter (XY) …; pie shows parts of one whole"],["Sort","Data tab: A→Z, Z→A, or custom sort on several columns"],["Filter","Data tab (Ctrl+Shift+L): show only rows that meet a condition"],["Freeze Panes","View tab: keeps header rows/columns visible while scrolling"],["Conditional Formatting","Home tab: colours cells automatically by rule (e.g. marks below 33 in red)"],["Data Validation","Data tab: restricts what can be typed in a cell (e.g. a drop-down list)"],["PivotTable","Insert tab: summarises large data quickly"],["Merge &amp; Center","Home tab: joins cells and centres the text"],["Wrap Text","Home tab: shows long text on several lines in one cell"],["AutoFill / Flash Fill","Drag fill handle to continue series (Jan, Feb…); Flash Fill (Ctrl+E) fills a pattern"],["Goal Seek / What-If Analysis","Data tab: find the input needed for a desired result"],["Macro","Recorded set of steps (View or Developer tab); saved in .xlsm"]]},{"k":"table","title":"Excel shortcuts","head":["Keys","Action in Excel"],"rows":[["Ctrl+N","New workbook"],["Ctrl+W","Close workbook"],["F2","Edit the active cell"],["F4","Toggle absolute/relative reference (while editing); otherwise repeat last action"],["Ctrl+;","Insert today's date"],["Ctrl+Shift+;","Insert current time"],["Alt+=","AutoSum"],["Ctrl+Shift+L","Turn filter on/off"],["Shift+F11 (or Alt+Shift+F1)","Insert a new worksheet"],["Ctrl+Page Down / Ctrl+Page Up","Next / previous worksheet"],["Ctrl+1","Format Cells dialog box"],["F11 / Alt+F1","Chart on a new chart sheet / embedded chart on the same sheet"],["Ctrl+D / Ctrl+R","Fill down / fill right"],["Ctrl+Enter","Fill all selected cells with the same entry"],["Alt+Enter","New line inside the same cell"],["Ctrl+Space / Shift+Space","Select the whole column / the whole row"],["Ctrl+Home","Go to cell A1"],["Ctrl+Arrow key","Jump to the edge of the data"],["Ctrl+T (or Ctrl+L)","Create a table"],["Ctrl+K","Insert hyperlink"],["Shift+F3","Insert Function dialog"],["F9","Recalculate all formulas"],["Ctrl+9 / Ctrl+0","Hide rows / hide columns"],["Ctrl+Shift+$ / Ctrl+Shift+%","Currency format / percentage format"],["Ctrl+5","Strikethrough"],["F7","Spelling"],["F5 / Ctrl + G","Go to a specific cell (e.g. C6)"],["F11","Create a chart (on a new chart sheet)"],["Shift + F2","Insert / edit comment"],["Shift + F10","Shortcut (context) menu for the selected item"],["Ctrl + 0 / Ctrl + 9","Hide column / hide row"],["Ctrl + D","Fill down: copy the top cell of a range into the cells below"],["Alt + I + R","Insert a row above (old menu key sequence)"],["Alt + H + O + W","Set column width (ribbon key tip sequence)"],["Ctrl + Shift + ! / $ / # / % / ^ / @","Number format: comma / currency / date / percentage / scientific / time"],["Ctrl + Page Up / Page Down","Move between worksheets"],["Ctrl + Tab or Ctrl + F6","Switch between open workbooks"],["Ctrl + F9 / Ctrl + F10","Minimise / maximise the workbook window"],["Ctrl + Shift + U","Expand/collapse the formula bar"],["Ctrl + Shift + G","Workbook statistics"],["Esc","Cancel editing a cell"],["Ctrl + click (sheet tabs)","Select several sheets (e.g. to print them together)"]]},{"k":"table","title":"Chart types","head":["Chart","Best use"],"rows":[["Column / Bar","Compare values across categories"],["Line","Show change over time (use \"line without markers\" when there are many categories or approximate values)"],["Pie","Parts of a whole; each slice is a sector of a circle"],["Doughnut","Like pie, with a hole; can show more than one series"],["Scatter (XY)","Uses Cartesian X-Y coordinates; relation between two variables"],["Area","Volume of change over time"],["Radar","Shows values relative to a centre point"],["Stacked","Shows parts of totals in the same order on each bar"],["Stock","Share price high-low-close"],["Sparkline","Tiny chart inside one cell"],["Embedded chart","Chart placed on the worksheet (not on a separate chart sheet)"]]},{"k":"p","h":"<b>Counting cells in a range.<\/b> number of columns x number of rows. A1:D4 → A to D = 4 columns, rows 1 to 4 = 4 rows → 16 cells. A10:D40 → 4 columns x (40 - 10 + 1) = 4 x 31 = 124 cells. C4:H10 → C to H = 6 columns, 4 to 10 = 7 rows → 42 cells. Always add 1 after subtracting row numbers. A1 then Shift + click C9 selects A1:C9 = 3 x 9 = 27 cells."},{"k":"p","h":"<b>Copying a formula (relative reference).<\/b> count how far you moved. From A5 to E9 = 4 columns right and 4 rows down. Every relative reference moves the same way: =A3+B4 becomes =E7+F8. A $ before the letter stops the column from moving; a $ before the number stops the row from moving."},{"k":"p","h":"<b>Solving formula output (operator order).<\/b> =120*5/10<sup>2<\/sup> → first exponent 10<sup>2<\/sup> = 100; then left to right 120*5 = 600, 600/100 = 6. =8/8<sup>2<\/sup>*16 → 8<sup>2<\/sup> = 64; 8/64 = 0.125; 0.125*16 = 2. =SUM(2<sup>3<\/sup>, 1-2/2) → 8 and (1 - 1) = 0 → 8."},{"k":"p","h":"<b>FLOOR and CEILING.<\/b> FLOOR(number, significance) rounds DOWN to the nearest multiple: FLOOR(176,21): 21 x 8 = 168 &lt;= 176 &lt; 189, so 168. CEILING rounds UP: CEILING.MATH(155,10) = 160."},{"k":"trick","h":"<span class='mn'>R<\/span>ows = <span class='mn'>R<\/span>eal numbers, <span class='mn'>C<\/span>olumns = <span class='mn'>C<\/span>haracters (letters). The dollar sign is a <span class='mn'>lock<\/span>: $ before the letter locks the column, $ before the number locks the row. <span class='mn'>V<\/span>LOOKUP = <span class='mn'>V<\/span>ertical (searches down), <span class='mn'>H<\/span>LOOKUP = <span class='mn'>H<\/span>orizontal (searches across).<ul><li>Rows and columns since 2007: \"10 lakh 48 thousand 576 rows, 16 thousand 384 columns, last column XFD\". Till 2003: \"65,536 rows, 256 columns, last column IV\".<\/li><li>Column width 8.43 default, max 255; row height 15 default, max 409 points (\"Excel font size also max 409\").<\/li><li>References: \"$ = lock\". $A$1 locks both, A$1 locks the row, $A1 locks the column; F4 cycles them.<\/li><li>Operator order \"PEDMAS\": Parentheses, Exponent, Division/Multiplication, Addition/Subtraction, each left to right.<\/li><li>COUNT counts numbers; COUNTA counts \"All\" non-empty cells.<\/li><li>Charts: Pie = Part of whole; Line = Over time; Scatter = X-Y; Radar = from the centre.<\/li><li>F11 = instant chart; Shift + F11 = new sheet; Alt + = = AutoSum; Ctrl + D = fill Down.<\/li><li>Goal Seek = one target; Scenario = several \"what if\" cases.<\/li><\/ul>"},{"k":"trap","h":"<b>COUNT<\/b> counts only numbers; <b>COUNTA<\/b> counts every non-empty cell. <b>TODAY()<\/b> gives the date only; <b>NOW()<\/b> gives date and time. <b>####<\/b> is not an error in the formula — the column is just too narrow. <b>#NAME?<\/b> = misspelt function; <b>#REF!<\/b> = deleted reference; <b>#N/A<\/b> = lookup value not found. <b>Ctrl+D<\/b> in Excel fills down (Font dialog in Word, bookmark in browser). <b>Ctrl+;<\/b> = date, <b>Ctrl+Shift+;<\/b> = time. <b>F11<\/b> makes a chart sheet, <b>Shift+F11<\/b> adds a worksheet. A <b>workbook<\/b> is the file; a <b>worksheet<\/b> is one page in it.<ul><li>COMBINE is not a text function; MID, LEFT and RIGHT are.<\/li><li>COUNTA counts non-empty cells; COUNT counts only numbers.<\/li><li>A function is a pre-written formula.<\/li><li>FLOOR(134,19) = 133 and FLOOR(176,21) = 168; FLOOR(14,4) = 12.<\/li><li>A pie chart divides a circle into sectors.<\/li><li>A worksheet CAN be renamed, so \"cannot be renamed\" is the false statement.<\/li><li>=SUM adds; there is no =ADD or =SUBTRACT function.<\/li><li>Excel is a spreadsheet, not a graphic program.<\/li><li>EXACT checks identical text.<\/li><li>Information = processed data; data = raw facts.<\/li><li>Copying =A3+B4 from A5 to E9 gives =E7+F8.<\/li><li>Several uncertain \"what-if\" conditions = Scenario Manager, not Goal Seek.<\/li><li>Number format decimal places go up to 30 (default 2).<\/li><li>Freeze First Column is the option to freeze the first column; there is no \"Freeze Top Column\".<\/li><li>F4:P10 has 11 x 7 = 77 cells.<\/li><li>Default cell reference is RELATIVE.<\/li><li>Ctrl + 1 in Excel opens Format Cells; Ctrl + D is fill down (not Font dialog as in Word).<\/li><\/ul>"}],"sum":["A workbook (.xlsx) contains worksheets; each cell is addressed by column letter and row number, e.g. B3.","Modern Excel has 1,048,576 rows and 16,384 columns; the last column is XFD.","Formulas start with =; A1 is relative, $A$1 absolute, $A1 or A$1 mixed; F4 cycles them.","COUNT counts numbers, COUNTA non-empty cells; VLOOKUP vertical, HLOOKUP horizontal; TODAY date, NOW date and time.","Errors: #DIV/0! divide by zero, #N/A not found, #NAME? bad name, #REF! bad reference, #### narrow column.","1,048,576 rows and 16,384 columns (XFD) since 2007; 65,536 rows and 256 columns (IV) till 2003.","Formulas start with \"=\"; order: parentheses/exponent, then divide/multiply, then add/subtract, left to right.","References: relative (default, both change), absolute $A$1 (F4), mixed A$1 or $A1.","Functions: SUM, AVERAGE, MAX, MIN, COUNT, COUNTA, LEN, IF, AND, EXACT, CLEAN, FLOOR, CEILING, MATCH, LOOKUP.","Tabs: Home (font, alignment, number, styles, cells, editing), Insert (pivot, charts, sparklines), Page Layout, Formulas, Data (sort, filter, what-if), Review, View (freeze panes).","Shortcuts: F2 edit, F4 absolute, F11 chart, Shift + F11 new sheet, Alt + = AutoSum, Ctrl + D fill down, Ctrl + 1 format cells."],"part":["Part 2 · Software, Windows & MS Office","सॉफ़्टवेयर, विंडोज़ एवं एमएस ऑफ़िस"]},
{"id":"C11","g":"cmp","heat":2,"title":"MS PowerPoint & other Office apps","hi":"एमएस पावरपॉइंट एवं अन्य ऑफिस ऐप्स","blocks":[{"k":"hot","h":"Usually 1–2 questions: <b>F5 vs Shift+F5<\/b>, <b>Ctrl+M<\/b> new slide, <b>transition vs animation<\/b>, Slide Sorter and Slide Master, the number of layouts, or <b>.pptx<\/b>.<br><br>PowerPoint gives 1 or 2 questions in SSC Tier-II computer modules and CHSL Tier-I: \"F5 / Shift + F5\", \"Esc ends a slide show\", \"Ctrl + M new slide\", \"transition vs animation\", \"slide master\", \"which view shows only text\", \"slide sorter\", \"9 layouts\", \"placeholders\". SSC CGL Tier-II 2024 asked how to exit a slide show; CHSL 2024 asked moving between slides with the keyboard."},{"k":"story","h":"<p>PowerPoint is a set of <b>digital flash cards<\/b> for a talk. Each card is a <b>slide<\/b>; the whole pack is a <b>presentation<\/b> saved as a .pptx file. A <b>layout<\/b> decides where the title and text boxes sit on one slide; a <b>theme<\/b> gives every slide the same colours and fonts; and the <b>Slide Master<\/b> is the master card — change it once and every slide changes.<\/p><p>Movement comes in two kinds. A <b>transition<\/b> is the effect as you move from one slide to the next, like turning a page. An <b>animation<\/b> moves something <i>inside<\/i> a slide — a bullet flying in, a picture fading out. Press <b>F5<\/b> to start the show from the first slide, or <b>Shift+F5<\/b> to start from the slide you are on.<\/p><p><b>MS Access<\/b> is a different tool: a <b>database<\/b>, like a well-kept office register. Data sits in <b>tables<\/b>; a <b>query<\/b> asks a question, a <b>form<\/b> is a neat screen for typing data in, and a <b>report<\/b> prints the results. Every record is identified by a unique <b>primary key<\/b>, like a roll number.<\/p>","key":"Transition is between slides, animation is within a slide; Access stores data in tables identified by a primary key."},{"k":"facts","title":"PowerPoint basics","rows":[["Type of software","Presentation software by Microsoft"],["File extensions","<b>.pptx<\/b> (2007 onwards); .ppt older; .ppsx opens directly as a show; .potx template; .pptm macro-enabled"],["Slide","One page of a presentation"],["Layout","Arrangement of placeholders on a slide (Title Slide, Title and Content, Two Content, Blank …)"],["Placeholder","Dotted box that holds title, text, picture or chart"],["Theme / Design","Matching colours, fonts and background for all slides (Design tab)"],["Slide Master","Controls the design and layout of every slide (View → Slide Master)"],["Transition","Effect while moving from one slide to the next (Transitions tab)"],["Animation","Effect on text or objects within a slide: Entrance, Emphasis, Exit, Motion Paths (Animations tab)"],["Speaker notes","Notes for the presenter, typed under the slide; not shown to the audience"],["Presenter View","Presenter sees notes and next slide while the audience sees only the slide"],["Rehearse Timings","Records how long each slide is shown"],["Hide Slide","Slide stays in the file but is skipped during the show"],["Default slide size","Widescreen 16:9 (PowerPoint 2013 onwards); 4:3 earlier"],["MS-PowerPoint","Presentation program (part of MS-Office / Microsoft 365)."],["File","Presentation file; default name Presentation1; extension .ppt (till 2003), .pptx (2007 onwards); .pot = design template; .pps = slide show; .pptm = macro-enabled."],["File name length","Up to 225 characters manually."],["Slide layouts","9: Title Slide, Title and Content, Title Only, Two Content, Section Header, Blank, Content with Caption, Picture with Caption, Comparison."],["Default layout","Title Slide (introduces the topic and sets the tone)."],["New presentation","Ctrl + N. New slide in an existing file; Ctrl + M (its layout is Title and Content)."],["Slide show","From beginning F5; from current slide Shift + F5; end slide show Esc."],["Slide objects","Text box (= placeholder), shapes, images, audio, video."],["Placeholders","The dotted boxes on a slide that hold text or content."],["Special (motion) effects","Transition = applied to the WHOLE slide; Animation = applied to OBJECTS on a slide."],["Template","File with ready-made designs and styles (layout and formatting) for a presentation."],["Maximum slides","No fixed maximum limit."],["Default orientation","Slides: landscape; notes pages, outlines and handouts: portrait."],["Slide size","Standard 4:3 or Widescreen 16:9 (default)."]]},{"k":"table","title":"PowerPoint views","head":["View","Use"],"rows":[["Normal","Default editing view: slide pane, thumbnails on the left, notes below"],["Outline View","Edit the text of all slides as an outline"],["Slide Sorter","All slides as thumbnails — rearrange, delete, copy, set transitions"],["Notes Page","Slide with its speaker notes, as it would print"],["Reading View","Plays the show inside the PowerPoint window"],["Slide Show","Full-screen presentation for the audience"],["Master views","Slide Master, Handout Master, Notes Master"]]},{"k":"table","title":"PowerPoint tabs","head":["Tab","Groups and tools"],"rows":[["File","Info; New (Ctrl + N); Open (Ctrl + O / Ctrl + F12); Save (Ctrl + S); Save As (F12); Print (Ctrl + P / Ctrl + Shift + F12); Print Preview (Ctrl + F2); Export (to PDF); Close (Ctrl + W)"],["Home","Clipboard (Paste Special Ctrl + Alt + V; Format Painter, no shortcut); Slides (New Slide with 9 layouts; Layout option); Font (default Aptos; size 1 to 4000; list 8 to 96; bold, italic, underline; change font Ctrl + Shift + F); Paragraph (bullets; alignments left, right, centre, justify; line spacing); Drawing (shapes, shape fill, shape outline, arrange, quick styles); Editing (Find Ctrl + F, Replace Ctrl + H); Dictate (voice typing); Designer (slide design ideas)"],["Insert","Slides (new slide, duplicate slide); Table (Draw Table 10 x 8 grid; Insert Table max 75 columns and 75 rows); Images (picture, photo album, screenshot/screen clipping); Illustrations (shapes, SmartArt for hierarchy diagrams and flowcharts, chart, icons/animated images, 3D models; duplicate shape Ctrl + D); Get Add-ins; Link (hyperlink Ctrl + K: to another slide, presentation, email, web page or file); Comment (additional note); Text (text box, header and footer, WordArt, date and time, slide number); Symbols (equations, symbols); Media (audio, video, screen recording); Camera (Cameo: like a live camera)"],["Header and footer","Slide: date and time, footer, slide number; Notes and Handouts: date and time, header, footer, page number"],["Draw","Handwriting tools"],["Design","Themes (different themes: colour, font, font size, font effect); Variants (change colour, font, effects, background style of a theme); Customize (Slide Size, Format Background: picture, gradient, texture or solid fill); Designer (slide design ideas)"],["Transitions","Preview; Transition to This Slide (None, Morph, Fade, Glitter, Honeycomb etc.); Timing (Sound, Duration, Advance slide on mouse click / trigger)"],["Animations","Preview; Animation (effects on objects: e.g. Appear, Fly In, Bounce); Advanced Animation (Trigger: an item that starts an action when clicked; Animation Pane); Timing (Duration, Delay, Reorder animation)"],["Slide Show","Start Slide Show (From Beginning F5, From Current Slide Shift + F5, Custom Slide Show = present chosen slides in a new order); Rehearse with Coach (automatic tips); Set Up (Set Up Slide Show, Hide Slide, Rehearse Timings, Record); Monitors (choose display)"],["Record","Preview; Cameo; Record from beginning / current slide"],["Review","Proofing (Spelling F7, Thesaurus Shift + F7); Accessibility; Language (Translate, add language); Comments; Compare (compare two versions, combine two files); Ink (hide/unhide handwriting)"],["View","Presentation Views: Normal (default; slide thumbnails on the left), Outline View (only text: titles and bullets), Slide Sorter (all slides as thumbnails; rearrange by dragging), Notes Page (slide at the top, speaker notes below; shows how it prints with notes), Reading View (full screen); Master Views: Slide Master (same design on all slides: fonts, background, logo), Handout Master (layout of printed handouts), Notes Master; Show: Ruler, Gridlines (Shift + F9), Guides; Zoom 10% to 400%; Color/Grayscale/Black and White; Window (New Window, Switch Windows); Macros (View Macros Alt + F8)"],["Help","Help (F1), Contact Support, Feedback, Show Training, What's New"]]},{"k":"table","title":"PowerPoint shortcuts","head":["Keys","Action"],"rows":[["F5","Start slide show from the first slide"],["Shift+F5","Start slide show from the current slide"],["Ctrl+M","Insert a new slide"],["Ctrl+D","Duplicate the selected slide or object"],["Ctrl+N","New presentation"],["Ctrl+K","Insert hyperlink"],["Esc","End the slide show"],["N, Enter, Space, Right arrow","Next slide / animation during a show"],["P, Backspace, Left arrow","Previous slide during a show"],["Slide number + Enter","Jump to that slide during a show"],["B / W","Black screen / white screen during a show (press again to return)"],["Ctrl + N / Ctrl + O / Ctrl + S","New / open / save presentation"],["F12 or Alt + F2","Save As"],["Ctrl + W or Ctrl + F4","Close presentation"],["Ctrl + Q","Save and close"],["Ctrl + Z / Ctrl + Y","Undo / redo"],["Ctrl + F2","Print Preview"],["F1","Help"],["Alt + Q","\"Tell me what you want to do\" box"],["F7","Spell check"],["Alt or F10","Key tips on/off"],["Ctrl + F1","Show/hide the ribbon"],["Ctrl + F","Find (and replace); Ctrl + H = Replace"],["Alt + F / H / N / G / K / A / S / R / W / X / Y","File / Home / Insert / Design / Transitions / Animations / Slide Show / Review / View / Add-ins / Help tab"],["Ctrl + Tab","Switch between open presentations"],["Ctrl + A","Select all (text in a box, objects on a slide, or all slides; in Outline view selects all text of all slides)"],["Tab","Move to the next object on a slide"],["Home / End","First slide / last slide (inside a text box: start/end of line); Ctrl + End = end of a text box"],["Page Down / Page Up","Next / previous slide"],["Ctrl + Up/Down arrow","Move a slide up/down (in text: previous/next paragraph)"],["Ctrl + Shift + Up/Down arrow","Move a slide to the beginning/end"],["Ctrl + Enter","Move to the next title or body text placeholder"],["Ctrl + X / C / V","Cut / copy / paste text, objects or slides (paste also Shift + Insert; copy also Ctrl + Insert)"],["Ctrl + Alt + V","Paste Special"],["Ctrl + B / I / U","Bold / italic / underline"],["Ctrl + E / J / L / R","Centre / justify / left / right align a paragraph"],["Ctrl + T","Font dialog box (in PowerPoint)"],["Alt + W, Q","Zoom dialog box"],["Alt + N, P","Insert picture"],["Alt + H, S, H","Insert shape"],["Alt + H, L","Select slide layout"],["Ctrl + P (during show)","Annotate with the pen tool"],["N or Page Down / P or Page Up","Next / previous slide during a show (arrow keys also work)"],["B","Black screen during a show (press B again to return)"]]},{"k":"table","title":"Other Office apps and equivalents","head":["Microsoft app","Purpose","Google / LibreOffice equivalent"],"rows":[["Word","Word processor","Google Docs / LibreOffice Writer"],["Excel","Spreadsheet","Google Sheets / LibreOffice Calc"],["PowerPoint","Presentation","Google Slides / LibreOffice Impress"],["Access","Database","LibreOffice Base"],["Outlook","Email client plus calendar, contacts and tasks (personal information manager)","Gmail and Google Calendar (web)"],["OneNote","Digital notebook for free-form notes","Google Keep (simple notes)"],["Publisher","Desktop publishing: brochures, newsletters, cards","LibreOffice Draw"],["Teams","Chat, meetings and collaboration","Google Meet / Chat"]]},{"k":"p","h":"<b>Transition vs animation with an example.<\/b> you have 3 slides. Making slide 2 \"fade\" in after slide 1 is a TRANSITION (Transitions tab), and it affects the whole slide. Making the picture on slide 2 \"fly in\" from the left after a click is an ANIMATION (Animations tab), and it affects only that object. Transitions have Sound, Duration and \"advance on mouse click\"; animations have Duration, Delay, Reorder and Triggers."},{"k":"p","h":"<b>Why use the Slide Master.<\/b> if you want the same font, colour, logo or background image on all 40 slides, changing each slide is slow and error-prone. Editing the Slide Master (View &gt; Slide Master) changes the layout once and every slide based on it follows. Handout Master controls printed handouts; Notes Master controls notes pages."},{"k":"trick","h":"Transition = Traffic between slides; Animation = Action inside a slide. F5 = 'from the first', Shift+F5 = 'from where I Stand'.<ul><li>\"F5 = Full show from start; Shift + F5 = Show from here; Esc = Exit\".<\/li><li>\"Ctrl + M = More slides; Ctrl + D = Duplicate\".<\/li><li>Transition = Train moving between stations (slides); Animation = Actors moving on the stage (objects).<\/li><li>9 layouts, like 9 planets in old books: Title Slide, Title and Content, Section Header, Two Content, Comparison, Title Only, Blank, Content with Caption, Picture with Caption.<\/li><li>Views \"N-O-S-N-R\": Normal, Outline, Sorter, Notes Page, Reading. Masters \"S-H-N\": Slide, Handout, Notes (no Outline master).<\/li><li>Font size limits: Word 1638, Excel 409, PowerPoint 4000. Zoom limits: Word 500%, Excel and PowerPoint 400%.<\/li><li>Table limits: Word 63 columns x 32,767 rows; PowerPoint 75 x 75.<\/li><\/ul>"},{"k":"trap","h":"Transition vs animation: between slides vs within a slide. F5 starts from slide 1, Shift+F5 from the current slide. Slide Sorter shows thumbnails; Notes Page shows speaker notes. Ctrl+M is new slide in PowerPoint but indent in Word. Ctrl+D duplicates in PowerPoint. Outlook is e-mail, not a browser.<ul><li>Start slide show = F5 (not F3 or F1).<\/li><li>Insert hyperlink = Ctrl + K.<\/li><li>Change font = Ctrl + Shift + F.<\/li><li>Making layout changes for all slides = Slide MASTER, not Notes Master.<\/li><li>The view that shows how it prints with notes = Notes Page.<\/li><li>Ctrl + Enter moves to the next placeholder.<\/li><li>Handouts can be printed 1, 2, 3, 4, 6 or 9 per page, but NOT 5.<\/li><li>Default save format = .pptx; Format Painter copies formatting; slide sorter is in the View tab; F1 = Help; F5 = from first slide; Ctrl + D = duplicate; Notes Page = speaker notes; notes/handouts default to portrait.<\/li><li>\"Extreme animation\" is not a PowerPoint view; Presentation View and Outline Master are also not options.<\/li><li>Shift + F9 shows/hides the grid in PowerPoint.<\/li><\/ul>"}],"sum":["PowerPoint saves as .pptx; a slide's arrangement is its layout, and the Slide Master changes all slides at once.","Transition is the effect between slides; animation is the effect on objects within a slide.","F5 starts the show from the first slide, Shift+F5 from the current slide, Ctrl+M adds a new slide, Esc ends the show.","Views: Normal, Outline, Slide Sorter (thumbnails), Notes Page, Reading View, Slide Show.","Other Office apps: Outlook (e-mail), Access (database), OneNote (notes), Publisher (desktop publishing); Google and LibreOffice have free equivalents.","PowerPoint makes presentations: Presentation1, .ppt/.pptx, 9 slide layouts, default layout Title Slide.","Ctrl + M new slide, Ctrl + D duplicate, F5 start, Shift + F5 current slide, Esc end, B black screen.","Transition = whole slide; animation = objects; triggers start an animation on click.","Design tab = themes, variants, slide size (16:9 default), format background; Slide Show tab = rehearse, custom show, set up.","Limits: font size 1-4000, table 75 x 75, zoom 10-400%; no limit on number of slides."],"part":["Part 2 · Software, Windows & MS Office","सॉफ़्टवेयर, विंडोज़ एवं एमएस ऑफ़िस"]},
{"id":"C21","g":"cmp","heat":2,"title":"MS Access & databases (DBMS)","hi":"एमएस एक्सेस एवं डेटाबेस (डीबीएमएस)","blocks":[{"k":"hot","h":"<b>1–2 questions<\/b> in most CGL and CHSL papers: <b>primary vs foreign key<\/b>, <b>record = row, field = column<\/b>, the <b>objects of MS Access<\/b> (table, query, form, report), <b>DDL vs DML<\/b> commands in SQL, and the full forms <b>DBMS, RDBMS, SQL<\/b>."},{"k":"story","h":"<p>Think of a school office register. Each <b>page<\/b> is about one thing — students, fees or marks. That page is a <b>table<\/b>. Each <b>line<\/b> is one student: a <b>record<\/b> (row). Each <b>column heading<\/b> — Roll No, Name, Class — is a <b>field<\/b>.<\/p><p>Two students can share a name, but never a roll number. That unique column is the <b>primary key<\/b>. On the fees page, the clerk writes only the roll number to show whose fee it is; that roll number on another page is a <b>foreign key<\/b>, and it links the two pages.<\/p><p>A <b>DBMS<\/b> (Database Management System) is the clerk who keeps the register: it stores data once, lets many people use it, and stops wrong entries. <b>MS Access<\/b> is the DBMS inside MS Office. You ask it questions with a <b>query<\/b>, type data into a neat <b>form<\/b>, and print a <b>report<\/b>. The language for talking to big databases is <b>SQL<\/b>.<\/p>","key":"Table = page, record = row, field = column; the primary key is unique, a foreign key links tables; Access objects are tables, queries, forms and reports."},{"k":"facts","title":"Database basics","rows":[["Data / information","Raw facts / processed, meaningful data"],["Database","Organised collection of related data"],["DBMS","Database Management System: software to create, store, update and retrieve data (MS Access, Oracle, MySQL)"],["RDBMS","Relational DBMS: data in related tables; the relational model was given by E. F. Codd (IBM, 1970)"],["Table (relation)","Data in rows and columns"],["Record (row, tuple)","All the details of one item or p

const LESSONS = [
{"id":"C1","g":"cmp","heat":2,"title":"Computer fundamentals, types & history","hi":"कंप्यूटर के मूल सिद्धांत, प्रकार एवं इतिहास","blocks":[{"k":"trick","h":"Generations in order — <span class='mn'>V T I M A<\/span>: <b>V<\/b>ery <b>T<\/b>ired <b>I<\/b>ndians <b>M<\/b>ake <b>A<\/b>pps = Vacuum tube, Transistor, IC, Microprocessor, AI. Computer types big to small — <span class='mn'>S M M M<\/span>: Super, Mainframe, Mini, Micro.<ul><li>ENIAC = \"Every Number Is Added by Computer\" → Electronic Numerical Integrator And Computer.<\/li><li>Babbage = \"Bap\" (father) of computer; Turing = father of \"modern\" computer.<\/li><li>North = Near the CPU (fast: RAM, graphics); South = Slow devices (USB, SATA, audio).<\/li><li>IC levels go up like a ladder: S-M-L-VL-UL (Small, Medium, Large, Very Large, Ultra Large).<\/li><\/ul>"},{"k":"trap","h":"<b>ENIAC<\/b> is the first general-purpose electronic computer; <b>UNIVAC I<\/b> is the first <i>commercial<\/i> one — don't swap. The stored-program idea is <b>von Neumann<\/b>'s (EDVAC), not Babbage's. <b>Microprocessor = 4th<\/b> generation, <b>IC = 3rd<\/b>. A <b>speedometer<\/b> is analog, a <b>digital watch<\/b> is digital, an <b>ECG/ICU<\/b> machine is hybrid. Babbage = father of the computer; Ada Lovelace = first programmer.<ul><li>Abacus is the first/earliest calculating aid, but Pascaline is the first MECHANICAL CALCULATOR built with gears.<\/li><li>Babbage designed the Analytical Engine but never completed it; it was a design on paper.<\/li><li>Operating systems and minicomputers came in the 3rd generation, not the 4th.<\/li><li>Hybrid = both analog and digital. Do not pick \"analog\" for \"features of both\".<\/li><li>Desktop computer is NOT portable; laptop, tablet and PDA are.<\/li><\/ul>"}],"sum":["A computer follows the Input, Process, Output cycle and stores results; GIGO means wrong input gives wrong output.","Babbage (Difference Engine 1822, Analytical Engine 1837) is the father of the computer; Ada Lovelace was the first programmer.","ENIAC (1946) was the first general-purpose electronic computer; UNIVAC I (1951) was the first commercial one.","Generations: vacuum tube, transistor, IC, microprocessor (VLSI), artificial intelligence.","PARAM 8000 (1991, C-DAC) was India's first supercomputer; analog, digital and hybrid differ by the data they handle.","A computer takes input, processes it, gives output and stores data; it understands only 0 and 1.","By size: supercomputer > mainframe > mini > micro; by working: analog, digital, hybrid.","History: Abacus, Pascaline 1642, Babbage's Analytical Engine 1837, ENIAC 1945-46, UNIVAC 1951, Intel 4004 1971."],"part":["Part 1 · Hardware","हार्डवेयर"],"app":"comphw"},
{"id":"C2","g":"cmp","heat":3,"title":"CPU, motherboard, buses & ports","hi":"सीपीयू, मदरबोर्ड, बस एवं पोर्ट","blocks":[{"k":"trick","h":"Machine cycle — <span class='mn'>F D E S<\/span>: <b>F<\/b>riends <b>D<\/b>on't <b>E<\/b>at <b>S<\/b>amosa alone = Fetch, Decode, Execute, Store. PS/2 colours: <span class='mn'>P-K, G-M<\/span> — <b>P<\/b>urple <b>K<\/b>eyboard, <b>G<\/b>reen <b>M<\/b>ouse.<ul><li>Socket = Sits a chip (CPU); Slot = Slides a card (RAM, PCI).<\/li><li>SMPS = \"Sab Ko Mile Power Supply\": AC to DC. UPS = Umbrella for power: surge first, backup second.<\/li><li>CPU parts = \"ACM\": ALU calculates, CU commands, MU (registers) memorises.<\/li><li>PC = \"Pehle Counter\" points to the NEXT instruction; IR = \"Is Running\" holds the CURRENT one; MAR = Address; MDR/MBR = Data.<\/li><li>Flip-flops \"SR JK D T\" = \"Sir Jack Did Tea\".<\/li><li>Bus types \"DAC\": Data, Address, Control; Address bus Alone decides max memory.<\/li><li>Serial = Single bit; Parallel = Plenty of bits (8) at once.<\/li><li>HDMI = \"Har Drishya, Music In-one cable\": audio + video.<\/li><li>POST = Power On Self Test, done by BIOS before the OS loads.<\/li><\/ul>"},{"k":"trap","h":"<b>ALU calculates, CU controls<\/b> — the CU never adds numbers. <b>Program Counter<\/b> holds the address of the <i>next<\/i> instruction, the <b>Instruction Register<\/b> holds the <i>current<\/i> one. <b>Cold<\/b> boot = from power-off; <b>warm<\/b> boot = restart. <b>HDMI<\/b> carries audio + video; <b>VGA<\/b> is video only and analog. <b>Serial<\/b> = one bit at a time (USB is serial, despite being fast); <b>parallel<\/b> = many bits together. BIOS lives in <b>ROM<\/b>, not RAM. SMPS changes AC to DC; UPS gives back-up.<ul><li>Every motherboard is a PCB, but every PCB is not a motherboard.<\/li><li>UPS: some books give surge protection as its first job and backup as its second; many simply say \"provides backup power\". Both answers can appear, so read the options.<\/li><li>A physical connector that connects chips is a SOCKET, not a slot.<\/li><li>Hard disk, keyboard, printer and OMR are NOT parts of the CPU; cache memory IS inside the CPU.<\/li><li>The brain of the computer is the CPU, not the ALU or CU alone.<\/li><li>Program Counter holds the address of the NEXT instruction; MAR holds the address of the CURRENT memory location being accessed.<\/li><li>Registers are inside the CPU, not part of main memory (so \"Only II\" in the statement question).<\/li><li>Address bus decides maximum memory, not the data bus.<\/li><li>Clock speed is measured in MHz/GHz, not in bytes or bits per second.<\/li><li>NVIDIA is a GPU maker; Intel, AMD and Qualcomm make CPUs.<\/li><li>Word length is measured in bits.<\/li><li>\"Addressing mode\" relates to the microprocessor.<\/li><li>The basic computation unit of a CPU is the core.<\/li><li>USB full form is Universal Serial Bus.<\/li><li>A controlling unit of a microcomputer on one chip is a microprocessor.<\/li><\/ul>"}],"sum":["The CPU has a Control Unit (directs), an Arithmetic Logic Unit (calculates and compares) and registers (fastest storage).","The machine cycle is Fetch, Decode, Execute, Store; clock speed is measured in hertz (GHz today).","Buses: data bus carries data (two-way), address bus carries locations (one-way), control bus carries signals.","BIOS in ROM runs POST and loads the OS; cold boot starts from power off, warm boot is a restart.","Ports: USB (Universal Serial Bus), HDMI (audio and video), VGA (analog video), RJ-45 (Ethernet), PS/2 (keyboard and mouse).","The motherboard (a PCB) holds the CPU socket, RAM slots, PCI/AGP slots, chipset, CMOS battery and power connector.","SMPS turns AC into DC; UPS protects from surges and gives backup; DMA lets devices use RAM without the CPU.","The CPU (brain) = ALU + CU + registers (memory unit); it follows fetch-decode-execute.","PC = next instruction address, MAR = memory address, MDR/MBR = data, IR = current instruction, accumulator = ALU results.","Registers are the fastest memory and are made of flip-flops (1 bit each).","Data bus carries data, address bus carries location (decides max memory), control bus carries signals.","Serial port = 1 bit at a time; USB = multipurpose; HDMI = HD audio + video; PCIe = graphics card.","Clock speed is in MHz/GHz; cores: single (oldest), dual, quad, octa.","Booting: BIOS (in ROM) → POST → loader (bootstrap) → OS loaded from disk to RAM; cold boot = start, warm boot = restart."],"part":["Part 1 · Hardware","हार्डवेयर"],"app":"comphw"},
{"id":"C3","g":"cmp","heat":3,"title":"Input devices, keyboard & mouse","hi":"इनपुट उपकरण, कीबोर्ड एवं माउस","blocks":[{"k":"trick","h":"Bank, Exam, Text — <span class='mn'>M-O-O<\/span>: <b>M<\/b>ICR = Money (cheques), <b>O<\/b>MR = Objective answer sheets (Marks), <b>O<\/b>CR = Ordinary text (Characters).<ul><li>\"OMR for Marks, OCR for Characters, MICR for Money (cheques), BCR for Bills (shop bar codes)\".<\/li><li>Keys present twice: \"CASE-W\" = Ctrl, Alt, Shift, Enter, Windows.<\/li><li>Toggle keys = \"Lock\" keys: Caps Lock, Num Lock, Scroll Lock.<\/li><li>Backspace goes Back (left); Delete goes ahead (right).<\/li><li>QWERTY was made by Sholes: \"Sholes Shaped QWERTY\".<\/li><li>Mouse = \"Engel-mouse\": Engelbart, 1968.<\/li><li>Light pen = CRT; stylus = tablet.<\/li><\/ul>"},{"k":"trap","h":"MICR (cheques) vs OCR (printed text) vs OMR (bubbles) — the most swapped trio. Light pen and scanner are input. A touch screen is both input and output.<ul><li>Home, End, Page Up and Page Down are NAVIGATION keys, not numeric or function keys.<\/li><li>Num Lock is a toggle key; Ctrl and Alt are modifier keys, not toggle keys.<\/li><li>Touch screen is BOTH input and output.<\/li><li>Printer, monitor and speaker are NOT input devices.<\/li><li>Input devices ARE peripheral devices; a statement saying they are not is incorrect.<\/li><li>OCR identifies the SHAPE of characters, not their colour or ink.<\/li><li>Delete removes the character to the RIGHT; Backspace removes the character to the LEFT.<\/li><li>A light pen is used with a CRT monitor; a stylus is used with tablets and PDAs.<\/li><li>MICR reads cheques; OMR reads answer sheets. Examiners swap them.<\/li><\/ul>"}],"sum":["Input devices send data in: keyboard, mouse, scanner, MICR, OCR, OMR, barcode/QR reader, light pen, joystick, microphone.","MICR reads bank cheques, OMR reads answer-sheet bubbles, OCR turns printed text into editable text.","Monitors: CRT (Cathode Ray Tube), LCD (Liquid Crystal Display), LED (Light Emitting Diode), OLED (Organic LED); pixel is the smallest dot.","Impact printers: dot matrix, daisy wheel, line; non-impact: inkjet, laser, thermal; plotters draw large designs.","Touch screen, modem, headset and multifunction printer are both input and output; screen gives soft copy, printer hard copy.","Hardware is touchable; software is not; a computer needs both.","Both input and output: touch screen, modem, NIC, sound card, digital camera.","Keyboard: Sholes 1873-74, QWERTY; 101 keys standard; Ctrl, Alt, Shift, Enter, Windows appear twice.","Toggle keys: Caps Lock, Num Lock; navigation keys: arrows, Home, End, PgUp, PgDn.","Mouse: Douglas Engelbart, 1968; left click selects, right click opens context menu, wheel scrolls."],"part":["Part 1 · Hardware","हार्डवेयर"],"app":"comphw"},
{"id":"C18","g":"cmp","heat":3,"title":"Output devices: monitors & printers","hi":"आउटपुट उपकरण: मॉनिटर एवं प्रिंटर","blocks":[{"k":"trick","h":"Impact printers — <span class='mn'>D D L<\/span>: <b>D<\/b>ot matrix, <b>D<\/b>aisy wheel, <b>L<\/b>ine. Speed units follow the printer: dot matrix in <b>C<\/b>PS (characters), line printer in <b>L<\/b>PM (lines), laser in <b>P<\/b>PM (pages).<ul><li>Impact printers \"DDL\": Daisy wheel, Dot matrix, Line (they hit like Dandas). Non-impact \"TIL\": Thermal, Inkjet, Laser.<\/li><li>Speed units: Character printers = CPS, Line printer = LPM, Page printers (laser, inkjet) = PPM.<\/li><li>Inkjet = \"Ink jets out\" (sprays); Laser = \"Light and powder\".<\/li><li>CMYK: \"Cyan Mangoes Yellow Kala (black)\".<\/li><li>Collated = Complete sets (1-2-3, 1-2-3).<\/li><li>Resolution goes \"SD → HD 720 → Full HD 1080 → QHD → 4K → 8K\".<\/li><\/ul>"},{"k":"trap","h":"Laser and inkjet are non-impact; dot matrix is impact. Plotter is output, not input. Monitor is output only. DPI is for print, PPI for screens.<ul><li>Laser and inkjet are NON-impact; dot matrix, daisy wheel and line printers are impact.<\/li><li>Laser printer speed is in pages per minute (PPM), not CPS.<\/li><li>For large CAD drawings, use a plotter, not an inkjet.<\/li><li>A laser printer CAN print multiple copies at a time; the statement \"cannot print multiple copies\" is the incorrect one.<\/li><li>The daisy wheel was the first COMMERCIAL printer; it prints text only.<\/li><li>Dot matrix printer is also called a pin printer and a character printer, not a page printer.<\/li><li>Print preview is Ctrl + F2, not Ctrl + P.<\/li><li>A pixel is the smallest element of an image; a colour pixel has 3 dots (RGB), not 16 or 28.<\/li><\/ul>"}],"sum":["Output devices show results: monitor (soft copy), printer (hard copy), speaker, projector, plotter.","Monitors: CRT (Cathode Ray Tube), LCD (Liquid Crystal Display), LED, OLED; the pixel is the smallest dot; resolution is pixels across × down.","Impact printers (dot matrix, daisy wheel, line) strike a ribbon; non-impact printers (inkjet, laser, thermal) do not.","Speed: dot matrix in CPS, line printer in LPM, laser in PPM; print quality in DPI.","Pixel = smallest picture element; resolution = pixels across x down; refresh rate in Hz.","Monitor types: CRT, TFT, LCD, LED, OLED, AMOLED.","Impact: daisy wheel (first commercial), dot matrix (pins, noisiest), line (LPM).","Non-impact: thermal (bills), inkjet (sprays ink, photos), laser (toner, fastest, PPM).","Plotter = large engineering/CAD drawings; spooling holds print jobs in printer memory; collated = 1-2-3, 1-2-3."],"part":["Part 1 · Hardware","हार्डवेयर"],"app":"comphw"},
{"id":"C4","g":"cmp","heat":3,"title":"Memory: RAM, ROM, cache & units","hi":"मेमोरी: रैम, रोम, कैश एवं इकाइयाँ","blocks":[{"k":"trick","h":"ROM family by eraser — <span class='mn'>P-E-EE<\/span>: <b>P<\/b>ROM = Pen (ink, once only), <b>E<\/b>PROM = Eraser of light (UV), <b>EE<\/b>PROM = Electric Eraser. Units — <span class='mn'>K M G T P E Z Y<\/span>: <b>K<\/b>ing <b>M<\/b>ohan <b>G<\/b>ot <b>T<\/b>en <b>P<\/b>apayas, <b>E<\/b>ach <b>Z<\/b>esty and <b>Y<\/b>ellow.<ul><li>DRAM = \"Dynamic = Daily refresh\"; SRAM = \"Static = Stays, no refresh, Super fast, Super costly\".<\/li><li>ROM family in order of erasing: \"P-E-EE-Flash\" = Programmable (no erase), Erasable by UV, Electrically byte by byte, Flash block by block.<\/li><li>EPROM = \"E for UV Erase\"; EEPROM = \"Extra E = Electric\".<\/li><li>Volatile = \"Vanishes\" when power goes: RAM and cache.<\/li><li>Speed ladder \"Ram Can't Run Rapidly Here, Only Tortoise\": Registers, Cache, RAM, ROM, Hard disk, Optical, Tape.<\/li><li>BIOS shadow = \"ROM's shadow falls on RAM\": ROM to RAM.<\/li><li>Units after byte: \"King Mohan Gives Tea, Pepsi, Excellent Zeera Yogurt\" = KB, MB, GB, TB, PB, EB, ZB, YB.<\/li><li>Nibble = \"nibble a little\" = half a byte = 4 bits.<\/li><li>Capacities: \"7-4-25\" = CD 700 MB, DVD 4.7 GB, Blu-ray 25 GB.<\/li><\/ul>"},{"k":"trap","h":"<b>RAM is volatile, ROM is not<\/b>. <b>SRAM → cache<\/b> (fast, no refresh), <b>DRAM → main memory<\/b> (needs refresh) — exams swap these. <b>EPROM uses UV light<\/b>, <b>EEPROM uses electricity<\/b>. Fastest memory = <b>registers<\/b>; fastest memory <i>outside<\/i> the CPU core, between CPU and RAM = <b>cache<\/b>. The memory the CPU reads directly is <b>primary<\/b> memory; a hard disk is never read directly. Virtual memory is on the <b>disk<\/b>, not extra RAM chips. 1 nibble = <b>4<\/b> bits, not 8.<ul><li>RAM is volatile; flash, ROM and EEPROM are not.<\/li><li>Primary memory is also called internal or main memory.<\/li><li>DRAM needs refreshing; SRAM does not.<\/li><li>Cache is faster than RAM but is NOT permanent storage.<\/li><li>\"Memory that communicates directly with the CPU\": SSC's 2023 key (CGL Tier-II 2022 paper) gives CACHE. Some older textbooks say \"main memory\". In SSC exams choose cache when it is an option.<\/li><li>Virtual memory is on the hard disk; it is not a chip.<\/li><li>Firmware and BIOS are stored in ROM; the operating system itself is stored on the hard disk.<\/li><li>EPROM is erased by UV light; EEPROM is erased electrically.<\/li><li>ASCII is a character code, not a memory chip.<\/li><li>The smallest unit of data is the bit; the smallest physical unit on a disk is the sector.<\/li><\/ul>"}],"sum":["Bit is the smallest unit; 4 bits = 1 nibble; 8 bits = 1 byte; each larger unit is 1024 of the previous, up to YB.","RAM is volatile read/write main memory; SRAM is used for cache and DRAM (needs refreshing) for main memory.","ROM is non-volatile and holds firmware like BIOS; PROM is written once, EPROM is erased by UV light, EEPROM electrically.","Hierarchy, fastest to slowest: registers, cache, RAM, secondary storage; speed and cost per bit fall as size rises.","Primary memory is accessed directly by the CPU; secondary is not; virtual memory uses disk space as extra RAM.","Primary memory = RAM (volatile, read-write) + ROM (non-volatile, read only).","DRAM needs refreshing (capacitors, cheap); SRAM does not (flip-flops, fast, costly, used as cache).","ROM family: M-ROM, PROM, EPROM (UV), EEPROM (electric, byte), flash (electric, block).","BIOS is in ROM; shadowing copies it to RAM; booting can be cold or warm.","Cache sits between CPU and RAM and holds frequently used data; levels L1, L2, L3.","Virtual memory is hard-disk space used as extra RAM (swapping).","Speed: registers > cache > RAM > ROM/flash > hard disk > optical > tape.","Magnetic: tape (sequential), hard disk, floppy (1.44 MB, 3.5 inch); optical: CD 700 MB, DVD 4.7 GB, BD 25/50 GB; electrical: pen drive, memory card, SSD.","Disk: tracks (track 0 outermost), sectors (smallest unit), clusters; seek time = head moving to the track."],"part":["Part 1 · Hardware","हार्डवेयर"],"app":"comphw"},
{"id":"C5","g":"cmp","heat":2,"title":"Storage & back-up devices","hi":"भंडारण एवं बैकअप उपकरण","blocks":[{"k":"trick","h":"Disc capacities climb — <span class='mn'>7-4.7-25<\/span>: CD ~<b>700<\/b> MB, DVD <b>4.7<\/b> GB, Blu-ray <b>25<\/b> GB. Back-ups — <span class='mn'>I = since Last, D = since Full<\/span>: <b>I<\/b>ncremental counts from the <b>last<\/b> back-up, <b>D<\/b>ifferential from the last <b>full<\/b>.<ul><li>Powers: K = 2<sup>10<\/sup>, M = 2<sup>20<\/sup>, G = 2<sup>30<\/sup>, T = 2<sup>40<\/sup>: add 10 each step.<\/li><li>Tape = \"Train track\": one after another (sequential); Disk = \"Direct\".<\/li><li>Laser colours: CD = Red, Blu-ray = Blue.<\/li><li>Track 0 = outermost: \"Zero starts at the Outer gate\".<\/li><\/ul>"},{"k":"trap","h":"<b>Magnetic tape<\/b> is <i>sequential<\/i> access; HDD, CD and SSD are <i>direct<\/i>. <b>SSD has no moving parts<\/b>; HDD does. <b>Tracks<\/b> are circles, <b>sectors<\/b> are slices of a track. A CD is read by <b>laser<\/b> (optical), not magnetism. <b>CD-R<\/b> writes once, <b>CD-RW<\/b> rewrites. Incremental vs differential — see the trick. Secondary storage is <b>non-volatile<\/b>.<ul><li>The hard disk is SECONDARY storage, even though it is fixed inside the cabinet.<\/li><li>PROM is a memory chip, not an optical disc.<\/li><li>Magnetic tape has NO addressing and is NOT suitable for random access.<\/li><li>A floppy disk stores data; a monitor does not.<\/li><li>Track 0 is the outermost track, not the innermost.<\/li><li>SSD is called an electronic disk.<\/li><\/ul>"}],"sum":["Magnetic storage: HDD (platters, tracks, sectors), floppy (1.44 MB) and magnetic tape (sequential access, used for back-up).","Optical discs read by laser: CD about 700 MB, DVD 4.7 GB single-layer, Blu-ray 25 GB single-layer.","Flash storage: pen drive, memory card, SSD; SSD has no moving parts and is faster than an HDD.","Cloud storage keeps files on remote servers (Google Drive, OneDrive, DigiLocker).","Full back-up copies everything; incremental copies changes since the last back-up; differential since the last full back-up."],"part":["Part 1 · Hardware","हार्डवेयर"],"app":"comphw"},
{"id":"C6","g":"cmp","heat":2,"title":"Number systems, codes & logic gates","hi":"संख्या पद्धति, कोड एवं लॉजिक गेट","blocks":[{"k":"trick","h":"Bits per digit — <span class='mn'>Octal 3, Hex 4<\/span>: <b>O<\/b>ctal has 8 = 2³ (3 bits), he<b>X<\/b> has 16 = 2⁴ (4 bits). Universal gates — <span class='mn'>NOT-glued twins<\/span>: <b>NAND<\/b> = NOT + AND, <b>NOR<\/b> = NOT + OR; either one alone can build every other gate.<ul><li>Universal gates = the two \"N\" gates with no X: NAND and NOR.<\/li><li>XOR = \"eXclusive = different gives 1\"; XNOR = \"same gives 1\".<\/li><li>ASCII \"A = 65, a = 97\": small letters are 32 more than capitals.<\/li><\/ul>"},{"k":"trap","h":"<b>ASCII is 7-bit (128)<\/b>; <b>extended ASCII and EBCDIC are 8-bit (256)<\/b>. Universal gates are <b>NAND and NOR<\/b> — not XOR, not AND. <b>XOR<\/b> gives 1 for <i>different<\/i> inputs; XNOR for <i>same<\/i>. In hex, <b>F = 15<\/b>, not 16. Group bits <b>from the right<\/b> when converting binary to octal/hex. Binary <b>1 + 1 = 10<\/b>, not 2.<ul><li>ASCII: 7 bits originally (128 codes); exams also accept 8 bits for each character (extended). Read the options.<\/li><li>EBCDIC uses 8 bits.<\/li><li>(10111)2 = 23, not 21; (150)16 = 336, not 256.<\/li><li>A bit has a binary value (0 or 1).<\/li><\/ul>"}],"sum":["Bases: binary 2, octal 8, decimal 10, hexadecimal 16 (A to F stand for 10 to 15).","One octal digit equals 3 bits and one hex digit equals 4 bits; group binary from the right to convert.","ASCII is 7-bit with 128 characters; extended ASCII and EBCDIC are 8-bit; Unicode covers all scripts including Hindi.","AND gives 1 only when all inputs are 1; OR when any is 1; XOR when inputs differ; NOT inverts.","NAND and NOR are universal gates; n bits give 2 to the power n values, so 8 bits hold 0 to 255.","Basic gates AND, OR, NOT; NAND and NOR are universal gates.","ASCII 7/8 bits (A = 65), EBCDIC 8 bits, Unicode for all languages, BCD = 8-4-2-1.","To convert from decimal, divide by the new base and read the remainders upwards; to convert to decimal, add digit × place value.","2's complement (flip the bits, add 1) stores negative numbers; n bits hold 0 to 2ⁿ − 1."],"part":["Part 1 · Hardware","हार्डवेयर"],"app":"comphw"},
{"id":"C7","g":"cmp","heat":3,"title":"Software, programming languages & translators","hi":"सॉफ़्टवेयर, प्रोग्रामिंग भाषाएँ एवं अनुवादक","blocks":[{"k":"trick","h":"Language generations in order: <span class='mn'>M<\/span>y <span class='mn'>A<\/span>unt <span class='mn'>H<\/span>as <span class='mn'>F<\/span>ive <span class='mn'>P<\/span>arrots — Machine, Assembly, High-level, Fourth-gen (SQL), Prolog (5GL). And <span class='mn'>C<\/span>ompiler = <span class='mn'>C<\/span>omplete program at once; <span class='mn'>I<\/span>nterpreter = <span class='mn'>I<\/span>nstant, line by line.<ul><li>\"SAU\": System runs the machine, Application serves the user, Utility helps the system.<\/li><li>Compiler = \"Complete at once\"; Interpreter = \"In-line, line by line\".<\/li><li>Assembler = Assembly; Linker = Links into .exe.<\/li><li>Open-source: Android, Linux, OpenOffice = \"ALO, free and open\". Closed: Windows, MS-Office, Mac = \"WOM\". Freeware: VLC = \"Very Loved Cost-free\".<\/li><li>Creators: \"C-Ritchie, C++ Stroustrup, Java Gosling, Python Guido\" = \"Rich Strong Gold Guide\".<\/li><li>Errors: Syntax → compiler, Logic → programmer, Semantic → parser: \"S-C, L-P, S-P\".<\/li><\/ul>"},{"k":"trap","h":"Compiler vs interpreter: whole program vs line by line — do not swap. Assembler handles only assembly language, not high-level code. Linker joins files; loader puts the program into RAM. Utility software (antivirus, Disk Cleanup) is system software, not application software. Freeware is free but closed; open source means the code is open.<ul><li>The operating system is SYSTEM software; MS-Word, Excel and Photoshop are APPLICATION software; antivirus is UTILITY software.<\/li><li>Word processors, spreadsheets and databases are APPLICATION software, not an operating system.<\/li><li>Software that helps users do specific tasks = application software.<\/li><li>The language a computer directly understands is MACHINE language.<\/li><li>Mnemonics = assembly language; a low-level language for microprocessors = assembly language.<\/li><li>COBOL is a HIGH-level language.<\/li><li>A well-defined set of instructions to solve a problem = ALGORITHM, not interpreter or hardware.<\/li><li>Freeware is free but its source code is NOT available; open-source has its code available.<\/li><li>Windows, Skype and Mozilla are not programming languages.<\/li><\/ul>"}],"sum":["Software is system software (OS, drivers, utilities) or application software (Word, Chrome); firmware such as BIOS lives in ROM.","Compiler translates the whole program at once, interpreter one line at a time, assembler converts assembly to machine code.","Linker joins object files into an executable; loader places it in RAM.","Language generations: machine, assembly, high-level (C, Java, Python), 4GL (SQL), 5GL (Prolog).","Linux is open source, Windows is proprietary; Delete goes to the Recycle Bin, Shift+Delete is permanent.","Software = programs; system software runs the hardware, application software does user tasks, utility software helps the system.","Open-source (Linux, Android) has free source code; closed-source (Windows, MS-Office) does not; freeware (VLC) is free but closed.","Machine and assembly languages are low-level; C, C++, Java, Python are high-level.","Bug = error; debugging removes it; syntax errors are caught by the compiler."],"part":["Part 2 · Software, Windows & MS Office","सॉफ़्टवेयर, विंडोज़ एवं एमएस ऑफ़िस"],"app":"compsw"},
{"id":"C19","g":"cmp","heat":3,"title":"Operating systems, Windows, DOS & Linux","hi":"ऑपरेटिंग सिस्टम, विंडोज़, डॉस एवं लिनक्स","blocks":[{"k":"trick","h":"<ul><li>OS = \"Operator between user and machine\"; Kernel = \"Kernel controls, never talks\"; Shell = \"Shell speaks for the user\".<\/li><li>RTOS examples \"QVTWL\": QNX, VxWorks, TRON, Windows CE, LynxOS.<\/li><li>Network OS = \"Windows Server, BSD, NetWare\". Distributed OS = \"AIX, Dynix, Solaris\".<\/li><li>Microsoft dates \"1981-1985-1990\": DOS, Windows, Office.<\/li><li>No Windows 9: versions jump from 8.1 to 10.<\/li><li>DOS short forms: MD = Make Dir, RD = Remove Dir, CD = Change Dir, CLS = CLear Screen.<\/li><li>Linux \"ls -a\" = all (including hidden).<\/li><\/ul>"},{"k":"trap","h":"<ul><li>Opera, Mozilla, Chrome and Acrobat Reader are applications, not operating systems; BIOS is firmware, not an OS.<\/li><li>Windows XP is a MULTITASKING OS, not real-time.<\/li><li>Translating high-level code is NOT an OS function; it is a compiler's job.<\/li><li>Both statements \"Linux is open source\" and \"Linux is multitasking and multiuser\" are TRUE, so neither is false.<\/li><li>The ping command is NOT used to change passwords.<\/li><li>The OS resides on the hard disk, not in ROM (the BIOS is in ROM).<\/li><li>Deleting with the Delete key moves files to the Recycle Bin; it does not delete them permanently.<\/li><li>UNIX (not Linux) was the first OS written in C and the first for multiprocessing.<\/li><li>MS-DOS is single-user; UNIX is multi-user.<\/li><li>Windows is proprietary; Linux is open source; Android uses the Linux kernel.<\/li><li>Delete sends a file to the Recycle Bin; Shift + Delete deletes it permanently; files deleted from a pen drive never reach the Recycle Bin.<\/li><\/ul>"}],"sum":["The OS links user and hardware and gives a platform to applications; kernel controls hardware, shell takes user commands.","CUI (MS-DOS) = typed commands; GUI (Windows) = icons and mouse.","OS types: batch, multiprogramming, multitasking, multithreading, multiprocessing, real-time, distributed, network.","Windows uses NTFS; DOS uses FAT; Windows versions go 8.1 → 10 → 11 (no 9).","Key Linux commands: ls, pwd, cd, mkdir, rm, grep, chmod, kill, ping; DOS: DIR, CD, MD, RD, CLS, FORMAT, CHKDSK, DEL, REN."],"part":["Part 2 · Software, Windows & MS Office","सॉफ़्टवेयर, विंडोज़ एवं एमएस ऑफ़िस"],"app":"compsw"},
{"id":"C20","g":"cmp","heat":2,"title":"File extensions & file systems","hi":"फ़ाइल एक्सटेंशन एवं फ़ाइल सिस्टम","blocks":[{"k":"trick","h":"Office file names end in <b>x<\/b> since 2007 (XML-based): .docx, .xlsx, .pptx; the old ones had no x (.doc, .xls, .ppt). Templates swap the last letter: .dotx, .xltx, .potx; macro files end in <b>m<\/b>: .docm, .xlsm.<ul><li>Images \"JPG PNG GIF BMP TIFF SVG\"; Audio \"MP3 WAV WMA AAC MIDI FLAC\"; Video \"MP4 AVI MOV MKV WMV FLV 3GP\".<\/li><li>The \"x\" in .docx/.xlsx/.pptx = XML (Office 2007 onwards).<\/li><li>\"W\" files from Windows: WMA (audio), WMV (video), WPL (playlist).<\/li><li>Google made both WEBP (image) and WEBM (video).<\/li><li>File systems: Windows = NTFS (\"New Tech\"), DOS = FAT (\"Father of file systems\"), Apple = APFS, Linux = EXT4.<\/li><li>PDF = \"Portable Document Format\", not \"Portable Device Form\".<\/li><\/ul>"},{"k":"trap","h":".jpg and .jpeg are the same format. .bmp is uncompressed, .png keeps transparency, .gif can animate. .exe and .com run programs; .bat runs a batch of commands; .dll is a Dynamic Link Library, not a program you open.<ul><li>PDF = Portable Document Format.<\/li><li>GIF = Graphics Interchange Format.<\/li><li>TIFF = Tagged Image File Format.<\/li><li>.wav is AUDIO, not an image; .pdf is a DOCUMENT, not a video.<\/li><li>.TMP is a temporary file; .BAK is a backup file.<\/li><li>UPS is \"Uninterruptible\" Power Supply; DLL is \"Dynamic\" Link Library.<\/li><li>MBR and PC each have two meanings (Master Boot Record / Memory Buffer Register; Personal Computer / Program Counter).<\/li><li>VGA = Video Graphics Array, not \"Visual\".<\/li><\/ul>"}],"sum":["A file extension after the dot tells which kind of file it is and which program opens it.","Images: .jpg/.jpeg, .png, .gif, .bmp, .tiff; audio: .mp3, .wav, .aac; video: .mp4, .avi, .mkv, .mov.","Office: .docx (Word), .xlsx (Excel), .pptx (PowerPoint), .accdb (Access); .pdf is Portable Document Format, .txt plain text.","System and program files: .exe, .com, .bat, .dll, .sys, .ini; compressed: .zip, .rar, .7z.","File systems: FAT and FAT32 (old, DOS), NTFS (Windows), exFAT (flash drives), ext4 (Linux), APFS (Apple).","Office: DOC/DOCX, XLS/XLSX, PPT/PPTX (\"x\" from 2007); .EXE = executable, .TMP = temporary, .APK = Android app."],"part":["Part 2 · Software, Windows & MS Office","सॉफ़्टवेयर, विंडोज़ एवं एमएस ऑफ़िस"],"app":"compsw"},
{"id":"C8","g":"cmp","heat":3,"title":"Keyboard shortcuts — the master list","hi":"कीबोर्ड शॉर्टकट — पूरी सूची","blocks":[{"k":"trick","h":"Letters in <b>bold<\/b> above do different jobs in the three apps — <span class='mn'>D E G J L M Q R T<\/span>. Every other Ctrl + letter does the same job everywhere, so learn only those nine by heart."},{"k":"trick","h":"The bottom-left row <span class='mn'>Z X C V<\/span> sits under your left hand: <span class='mn'>Z<\/span> = undo (zap the mistake), <span class='mn'>X<\/span> = cut (looks like scissors), <span class='mn'>C<\/span> = copy, <span class='mn'>V<\/span> = paste (a V-shaped arrow pushing down). For Windows-key shortcuts think of the letter: <span class='mn'>D<\/span>esktop, <span class='mn'>E<\/span>xplorer, <span class='mn'>L<\/span>ock, <span class='mn'>R<\/span>un, <span class='mn'>I<\/span> = settings (Info).<ul><li>Delete forever = \"Shift + Delete\".<\/li><li>Private browsing: Ctrl + Shift + N in both Chrome (Incognito) and Edge (InPrivate).<\/li><\/ul>"},{"k":"trap","h":"<b>Ctrl+D<\/b>: Font dialog in Word, fill down in Excel, bookmark in a browser, delete to Recycle Bin in File Explorer. <b>F5<\/b>: reload in a browser, Go To in Word/Excel, slide show in PowerPoint. <b>Ctrl+W<\/b> closes a <i>tab<\/i> in a browser but a <i>document<\/i> in Word. <b>Ctrl+N<\/b> opens a new <i>window<\/i> in a browser (new tab is Ctrl+T). <b>Ctrl+Shift+T<\/b> reopens a closed tab, not a new tab. <b>F5 vs Ctrl+F5<\/b>: normal reload vs hard reload bypassing the cache. <b>Ctrl+Shift+Esc<\/b> opens Task Manager directly; Ctrl+Alt+Delete opens the security screen first."}],"sum":["Ctrl+C copy, Ctrl+X cut, Ctrl+V paste, Ctrl+Z undo, Ctrl+Y redo, Ctrl+A select all.","Alt+Tab switches apps, Alt+F4 closes, Win+D desktop, Win+E File Explorer, Win+L lock, Win+R Run, Ctrl+Shift+Esc Task Manager.","F2 rename, Delete to Recycle Bin, Shift+Delete permanent; F12 Save As in Office, F7 spelling.","Browser: Ctrl+T new tab, Ctrl+Shift+T reopen tab, Ctrl+W close tab, Ctrl+D bookmark, Ctrl+H history, Ctrl+J downloads.","F5 reload, Ctrl+F5 hard reload bypassing cache, Ctrl+L or Alt+D or F6 address bar, Ctrl+Shift+N incognito in Chrome.","Windows: desktop, taskbar, Start menu, File Explorer (Win + E), Recycle Bin (Shift + Delete skips it), Control Panel.","Ctrl + D, E, G, J, L, M, Q, R and T do different jobs in Word, Excel and PowerPoint; the other letters do the same job in all three."],"part":["Part 2 · Software, Windows & MS Office","सॉफ़्टवेयर, विंडोज़ एवं एमएस ऑफ़िस"],"app":"compsw"},
{"id":"C9","g":"cmp","heat":3,"title":"MS Office & MS Word","hi":"एमएस ऑफ़िस एवं एमएस वर्ड","blocks":[{"k":"trick","h":"Alignment keys spell <span class='mn'>L-E-R-J<\/span>: <span class='mn'>L<\/span>eft, c<span class='mn'>E<\/span>nter (the E in cEntre), <span class='mn'>R<\/span>ight, <span class='mn'>J<\/span>ustify — 'Let Every Row Justify'. Square brackets grow and shrink: <span class='mn'>]<\/span> points right = bigger, <span class='mn'>[<\/span> = smaller.<ul><li>Word tabs in order \"Five Happy Indians Draw Designs, Learn Real Maths, Read Very Hard\": File, Home, Insert, Draw, Design, Layout, References, Mailings, Review, View, Help.<\/li><li>Where is it? Thesaurus/Track Changes/Spelling = Review; TOC/Footnote/Citation = References; Mail Merge/Envelopes = Mailings; Watermark/Page Color = Design; Margins/Orientation/Columns = Layout; Hyperlink/Header/Drop Cap = Insert.<\/li><li>Alignments \"L-E-R-J\": Left Ctrl + L, cEntre Ctrl + E, Right Ctrl + R, Justify Ctrl + J.<\/li><li>Font size limits \"1-1638, list 8-72\"; Excel \"1-409\".<\/li><li>Five views \"P-W-R-O-D\": Print, Web, Read, Outline, Draft.<\/li><li>F7 = spelling; Shift + F7 = thesaurus; F12 = Save As; Shift + F3 = change case.<\/li><li>Footnote = Foot of the page; Endnote = End of the document.<\/li><li>Ctrl + K = linK; Ctrl + D = Dialog for font; Ctrl + Shift + L = List (bullets).<\/li><li>Superscript goes up (x²): Ctrl + Shift + +; subscript goes down (H₂O): Ctrl + =.<\/li><\/ul>"},{"k":"trap","h":"<b>Ctrl+C is copy, not center<\/b> — center is <b>Ctrl+E<\/b>. <b>Ctrl+Enter<\/b> = page break but <b>Shift+Enter<\/b> = line break. <b>Ctrl+D<\/b> in Word opens the Font dialog, not 'duplicate' or 'bookmark'. <b>Shift+F3<\/b> changes case in Word but opens Insert Function in Excel. <b>F7<\/b> is spelling; <b>Shift+F7<\/b> is the Thesaurus. <b>Header/footer<\/b> are on the Insert tab, <b>Margins/Orientation<\/b> on the Layout tab, <b>Mail Merge<\/b> on Mailings, <b>Track Changes<\/b> on Review. Default extension is <b>.docx<\/b>; <b>.dotx<\/b> is a template.<ul><li>Maximum font size in Word is 1638, not 255 or 409 (409 is Excel).<\/li><li>DATA is not a Word tab.<\/li><li>Insert Hyperlink = Ctrl + K, not Ctrl + H (Ctrl + H = Replace).<\/li><li>Word has 5 document views.<\/li><li>Change Case is in the FONT group.<\/li><li>Orientation (not wrap text) switches portrait/landscape.<\/li><li>Redo = Ctrl + Y; Undo = Ctrl + Z.<\/li><li>Accept and Reject are in the REVIEW tab.<\/li><li>\"Broad\" is not a margin option; \"Moderate\" is.<\/li><li>Superscript is a font EFFECT, not a font style; styles are regular, bold, italic.<\/li><li>Drop cap can drop at most 10 lines.<\/li><li>Ctrl + T = hanging indent in Word, not \"terminate dialog boxes\".<\/li><li>Spell check = F7.<\/li><li>Page colour shows only in Print Layout and Web Layout, not Reading view.<\/li><li>Ctrl + E = centre in Word, but in a browser Ctrl + E goes to the search bar.<\/li><\/ul>"}],"sum":["MS Word is a word processor; default file .docx (older .doc), template .dotx.","Ribbon tabs: Home formatting, Insert tables and headers, Layout margins and orientation, Mailings mail merge, Review spelling and track changes.","Alignment: Ctrl+L left, Ctrl+E center, Ctrl+R right, Ctrl+J justify.","Ctrl+K hyperlink, Ctrl+Enter page break, Shift+F3 change case, Ctrl+] and Ctrl+[ font size by 1 point.","F7 spelling and grammar, Shift+F7 thesaurus, Ctrl+W close document, F12 Save As.","MS-Office (announced 1988, first released 19 Nov 1990) = Word, Excel, PowerPoint, Access, Outlook etc.; it is application, closed-source, horizontal-market software.","Word: Document1, .doc/.docx, max font 1638, default font Calibri/Aptos size 11, line spacing 1.15, margins 1 inch.","Home: Clipboard (24 items), Font (Ctrl + D), Paragraph (alignments, spacing, bullets Ctrl + Shift + L), Styles, Editing (Ctrl + F/H/G).","Insert: page break Ctrl + Enter, table 63 x 32,767, hyperlink Ctrl + K, header/footer, drop cap (1-10 lines), WordArt, symbols.","Design: themes, watermark, page colour; Layout: margins, orientation, size, columns; References: TOC, footnote, endnote, citations.","Mailings: mail merge; Review: F7 spelling, Shift + F7 thesaurus, Track Changes Ctrl + Shift + E; View: 5 views, zoom 10-500%, macros Alt + F8."],"part":["Part 2 · Software, Windows & MS Office","सॉफ़्टवेयर, विंडोज़ एवं एमएस ऑफ़िस"],"app":"compsw"},
{"id":"C10","g":"cmp","heat":3,"title":"MS Excel","hi":"एमएस एक्सेल","blocks":[{"k":"trick","h":"<span class='mn'>R<\/span>ows = <span class='mn'>R<\/span>eal numbers, <span class='mn'>C<\/span>olumns = <span class='mn'>C<\/span>haracters (letters). The dollar sign is a <span class='mn'>lock<\/span>: $ before the letter locks the column, $ before the number locks the row. <span class='mn'>V<\/span>LOOKUP = <span class='mn'>V<\/span>ertical (searches down), <span class='mn'>H<\/span>LOOKUP = <span class='mn'>H<\/span>orizontal (searches across).<ul><li>Rows and columns since 2007: \"10 lakh 48 thousand 576 rows, 16 thousand 384 columns, last column XFD\". Till 2003: \"65,536 rows, 256 columns, last column IV\".<\/li><li>Column width 8.43 default, max 255; row height 15 default, max 409 points (\"Excel font size also max 409\").<\/li><li>References: \"$ = lock\". $A$1 locks both, A$1 locks the row, $A1 locks the column; F4 cycles them.<\/li><li>Operator order \"PEDMAS\": Parentheses, Exponent, Division/Multiplication, Addition/Subtraction, each left to right.<\/li><li>COUNT counts numbers; COUNTA counts \"All\" non-empty cells.<\/li><li>Charts: Pie = Part of whole; Line = Over time; Scatter = X-Y; Radar = from the centre.<\/li><li>F11 = instant chart; Shift + F11 = new sheet; Alt + = = AutoSum; Ctrl + D = fill Down.<\/li><li>Goal Seek = one target; Scenario = several \"what if\" cases.<\/li><\/ul>"},{"k":"trap","h":"<b>COUNT<\/b> counts only numbers; <b>COUNTA<\/b> counts every non-empty cell. <b>TODAY()<\/b> gives the date only; <b>NOW()<\/b> gives date and time. <b>####<\/b> is not an error in the formula — the column is just too narrow. <b>#NAME?<\/b> = misspelt function; <b>#REF!<\/b> = deleted reference; <b>#N/A<\/b> = lookup value not found. <b>Ctrl+D<\/b> in Excel fills down (Font dialog in Word, bookmark in browser). <b>Ctrl+;<\/b> = date, <b>Ctrl+Shift+;<\/b> = time. <b>F11<\/b> makes a chart sheet, <b>Shift+F11<\/b> adds a worksheet. A <b>workbook<\/b> is the file; a <b>worksheet<\/b> is one page in it.<ul><li>COMBINE is not a text function; MID, LEFT and RIGHT are.<\/li><li>COUNTA counts non-empty cells; COUNT counts only numbers.<\/li><li>A function is a pre-written formula.<\/li><li>FLOOR(134,19) = 133 and FLOOR(176,21) = 168; FLOOR(14,4) = 12.<\/li><li>A pie chart divides a circle into sectors.<\/li><li>A worksheet CAN be renamed, so \"cannot be renamed\" is the false statement.<\/li><li>=SUM adds; there is no =ADD or =SUBTRACT function.<\/li><li>Excel is a spreadsheet, not a graphic program.<\/li><li>EXACT checks identical text.<\/li><li>Information = processed data; data = raw facts.<\/li><li>Copying =A3+B4 from A5 to E9 gives =E7+F8.<\/li><li>Several uncertain \"what-if\" conditions = Scenario Manager, not Goal Seek.<\/li><li>Number format decimal places go up to 30 (default 2).<\/li><li>Freeze First Column is the option to freeze the first column; there is no \"Freeze Top Column\".<\/li><li>F4:P10 has 11 x 7 = 77 cells.<\/li><li>Default cell reference is RELATIVE.<\/li><li>Ctrl + 1 in Excel opens Format Cells; Ctrl + D is fill down (not Font dialog as in Word).<\/li><\/ul>"}],"sum":["A workbook (.xlsx) contains worksheets; each cell is addressed by column letter and row number, e.g. B3.","Modern Excel has 1,048,576 rows and 16,384 columns; the last column is XFD.","Formulas start with =; A1 is relative, $A$1 absolute, $A1 or A$1 mixed; F4 cycles them.","COUNT counts numbers, COUNTA non-empty cells; VLOOKUP vertical, HLOOKUP horizontal; TODAY date, NOW date and time.","Errors: #DIV/0! divide by zero, #N/A not found, #NAME? bad name, #REF! bad reference, #### narrow column.","1,048,576 rows and 16,384 columns (XFD) since 2007; 65,536 rows and 256 columns (IV) till 2003.","Formulas start with \"=\"; order: parentheses/exponent, then divide/multiply, then add/subtract, left to right.","References: relative (default, both change), absolute $A$1 (F4), mixed A$1 or $A1.","Functions: SUM, AVERAGE, MAX, MIN, COUNT, COUNTA, LEN, IF, AND, EXACT, CLEAN, FLOOR, CEILING, MATCH, LOOKUP.","Tabs: Home (font, alignment, number, styles, cells, editing), Insert (pivot, charts, sparklines), Page Layout, Formulas, Data (sort, filter, what-if), Review, View (freeze panes).","Shortcuts: F2 edit, F4 absolute, F11 chart, Shift + F11 new sheet, Alt + = AutoSum, Ctrl + D fill down, Ctrl + 1 format cells."],"part":["Part 2 · Software, Windows & MS Office","सॉफ़्टवेयर, विंडोज़ एवं एमएस ऑफ़िस"],"app":"compsw"},
{"id":"C11","g":"cmp","heat":2,"title":"MS PowerPoint & other Office apps","hi":"एमएस पावरपॉइंट एवं अन्य ऑफिस ऐप्स","blocks":[{"k":"trick","h":"Transition = Traffic between slides; Animation = Action inside a slide. F5 = 'from the first', Shift+F5 = 'from where I Stand'.<ul><li>\"F5 = Full show from start; Shift + F5 = Show from here; Esc = Exit\".<\/li><li>\"Ctrl + M = More slides; Ctrl + D = Duplicate\".<\/li><li>Transition = Train moving between stations (slides); Animation = Actors moving on the stage (objects).<\/li><li>9 layouts, like 9 planets in old books: Title Slide, Title and Content, Section Header, Two Content, Comparison, Title Only, Blank, Content with Caption, Picture with Caption.<\/li><li>Views \"N-O-S-N-R\": Normal, Outline, Sorter, Notes Page, Reading. Masters \"S-H-N\": Slide, Handout, Notes (no Outline master).<\/li><li>Font size limits: Word 1638, Excel 409, PowerPoint 4000. Zoom limits: Word 500%, Excel and PowerPoint 400%.<\/li><li>Table limits: Word 63 columns x 32,767 rows; PowerPoint 75 x 75.<\/li><\/ul>"},{"k":"trap","h":"Transition vs animation: between slides vs within a slide. F5 starts from slide 1, Shift+F5 from the current slide. Slide Sorter shows thumbnails; Notes Page shows speaker notes. Ctrl+M is new slide in PowerPoint but indent in Word. Ctrl+D duplicates in PowerPoint. Outlook is e-mail, not a browser.<ul><li>Start slide show = F5 (not F3 or F1).<\/li><li>Insert hyperlink = Ctrl + K.<\/li><li>Change font = Ctrl + Shift + F.<\/li><li>Making layout changes for all slides = Slide MASTER, not Notes Master.<\/li><li>The view that shows how it prints with notes = Notes Page.<\/li><li>Ctrl + Enter moves to the next placeholder.<\/li><li>Handouts can be printed 1, 2, 3, 4, 6 or 9 per page, but NOT 5.<\/li><li>Default save format = .pptx; Format Painter copies formatting; slide sorter is in the View tab; F1 = Help; F5 = from first slide; Ctrl + D = duplicate; Notes Page = speaker notes; notes/handouts default to portrait.<\/li><li>\"Extreme animation\" is not a PowerPoint view; Presentation View and Outline Master are also not options.<\/li><li>Shift + F9 shows/hides the grid in PowerPoint.<\/li><\/ul>"}],"sum":["PowerPoint saves as .pptx; a slide's arrangement is its layout, and the Slide Master changes all slides at once.","Transition is the effect between slides; animation is the effect on objects within a slide.","F5 starts the show from the first slide, Shift+F5 from the current slide, Ctrl+M adds a new slide, Esc ends the show.","Views: Normal, Outline, Slide Sorter (thumbnails), Notes Page, Reading View, Slide Show.","Other Office apps: Outlook (e-mail), Access (database), OneNote (notes), Publisher (desktop publishing); Google and LibreOffice have free equivalents.","PowerPoint makes presentations: Presentation1, .ppt/.pptx, 9 slide layouts, default layout Title Slide.","Ctrl + M new slide, Ctrl + D duplicate, F5 start, Shift + F5 current slide, Esc end, B black screen.","Transition = whole slide; animation = objects; triggers start an animation on click.","Design tab = themes, variants, slide size (16:9 default), format background; Slide Show tab = rehearse, custom show, set up.","Limits: font size 1-4000, table 75 x 75, zoom 10-400%; no limit on number of slides."],"part":["Part 2 · Software, Windows & MS Office","सॉफ़्टवेयर, विंडोज़ एवं एमएस ऑफ़िस"],"app":"compsw"},
{"id":"C21","g":"cmp","heat":2,"title":"MS Access & databases (DBMS)","hi":"एमएस एक्सेस एवं डेटाबेस (डीबीएमएस)","blocks":[{"k":"trick","h":"Access objects — <span class='mn'>T Q F R M M<\/span>: <b>T<\/b>eachers <b>Q<\/b>uickly <b>F<\/b>ill <b>R<\/b>egisters <b>M<\/b>onday <b>M<\/b>orning = Tables, Queries, Forms, Reports, Macros, Modules. SQL groups: <b>D<\/b>DL <b>D<\/b>efines (CREATE, ALTER, DROP); D<b>M<\/b>L <b>M<\/b>odifies (INSERT, UPDATE, DELETE)."},{"k":"trap","h":"A <b>record<\/b> is a row and a <b>field<\/b> is a column — not the other way. The <b>primary key<\/b> can never be empty or repeated; a <b>foreign key<\/b> can repeat. <b>DELETE<\/b> is DML (rows), <b>DROP<\/b> is DDL (the whole table). A <b>form<\/b> is for entering data, a <b>report<\/b> is for printing it. Access saves as <b>.accdb<\/b>, not .acc or .mdbx."}],"sum":["A DBMS stores related data in tables; a record is a row (tuple) and a field is a column (attribute); RDBMS uses related tables (E. F. Codd, 1970).","The primary key is unique and never empty; a foreign key refers to another table's primary key and links the tables.","SQL: DDL (CREATE, ALTER, DROP), DML (INSERT, UPDATE, DELETE), DQL (SELECT), DCL (GRANT, REVOKE), TCL (COMMIT, ROLLBACK).","MS Access (.accdb) has six objects: tables, queries, forms, reports, macros and modules; tables open in Datasheet or Design view.","Data types include Short Text (255 characters), Long Text, Number, Currency, AutoNumber and Yes/No."],"part":["Part 2 · Software, Windows & MS Office","सॉफ़्टवेयर, विंडोज़ एवं एमएस ऑफ़िस"],"app":"compsw"},
{"id":"C12","g":"cmp","heat":3,"title":"Internet, browsers & the World Wide Web","hi":"इंटरनेट, ब्राउज़र एवं वर्ल्ड वाइड वेब","blocks":[{"k":"trick","h":"URL order: <span class='mn'>P<\/span>lease <span class='mn'>D<\/span>on't <span class='mn'>P<\/span>ush <span class='mn'>F<\/span>riends = <b>P<\/b>rotocol, <b>D<\/b>omain, <b>P<\/b>ath, <b>F<\/b>ile. Web father: <span class='mn'>T<\/span>im = <span class='mn'>T<\/span>hree W's; internet fathers: <span class='mn'>C<\/span>erf &amp; <span class='mn'>K<\/span>ahn = <b>TCP<\/b>.<ul><li>Internet \"fathers\": Vint Cerf (internet, TCP/IP, with Bob Kahn); Tim Berners-Lee (WWW, 1989, CERN). \"Cerf surfs the Internet, Tim makes the Web\".<\/li><li>India got internet on Independence Day: 15 August 1995, VSNL.<\/li><li>https: S = Secure.<\/li><li>Browsers \"CEFSO\": Chrome, Edge, Firefox, Safari, Opera. Search engines \"GBYAB\": Google, Bing, Yahoo, Ask, Baidu.<\/li><\/ul>"},{"k":"trap","h":"<b>Internet ≠ WWW<\/b>: the internet is the network (1969, ARPANET); the web is a service on it (1989–91, Berners-Lee). <b>Browser ≠ search engine<\/b>: Chrome is a browser, Google is a search engine. <b>Web page ≠ website ≠ home page<\/b>. <b>Cookie ≠ cache<\/b>: cookie remembers <i>you<\/i>, cache stores <i>page files<\/i>. <b>Intranet<\/b> is private, <b>extranet<\/b> lets chosen outsiders in.<ul><li>WWW = World Wide Web.<\/li><li>Safari is a browser, not a search engine; Facebook is a social networking site, not a browser.<\/li><li>Web page editors work on WYSIWYG.<\/li><li>JavaScript (not FORTRAN or LISP) creates dynamic web pages.<\/li><li>A web page is located using a URL (Uniform Resource Locator).<\/li><li>A collection of linked web pages = website, not web server.<\/li><li>Sites where users edit content = wikis.<\/li><li>WhatsApp is not used to \"upload short video clips on the web\"; it can send files.<\/li><li>The first web browser was WorldWideWeb (1990, text only). Mosaic (1993) was the first GRAPHICAL browser; if WorldWideWeb is not in the options, choose Mosaic.<\/li><li>In https://www.facebook.com, the domain name is facebook.com, not www.facebook.com.<\/li><li>The IP address is NOT a part of a URL.<\/li><li>Broadband uses packet switching; dial-up uses circuit switching. The internet itself works mainly on packet switching.<\/li><li>.au = Australia, not UAE.<\/li><\/ul>"}],"sum":["Internet is the global network (ARPANET 1969); the WWW is a service on it, invented by Tim Berners-Lee at CERN in 1989-91.","A URL has protocol, domain name (ending in a TLD such as .com, .gov, .in) and path; DNS converts the name into an IP address.","Browsers (Chrome, Firefox, Edge, Safari; historic Mosaic, Netscape) display pages; search engines (Google, Bing) find them.","HTML (Hyper Text Markup Language) builds web pages with tags; files end in .html or .htm.","Cookies remember the user, cache stores page copies; intranet is private, extranet admits chosen outsiders; an ISP gives the connection.","Internet = network of networks; ARPANET 1969 first; Vint Cerf = father of internet; India 15 Aug 1995 (VSNL).","WWW by Tim Berners-Lee (1989, CERN); first browser WorldWideWeb (1990); Mosaic first graphical (1993).","Needs: computer, ISP (IP address), NIC (MAC address), modem, browser; cable broadband fastest, dial-up slowest.","URL parts: protocol (https), www, domain (facebook), TLD (.com), page, port."],"part":["Part 3 · Internet, networks & security","इंटरनेट, नेटवर्क एवं सुरक्षा"],"app":"compnet"},
{"id":"C13","g":"cmp","heat":2,"title":"E-mail & e-banking","hi":"ई-मेल एवं ई-बैंकिंग","blocks":[{"k":"trick","h":"<span class='mn'>B<\/span>CC = <span class='mn'>B<\/span>lind = nobody sees. Money speed: <span class='mn'>R<\/span>TGS = <span class='mn'>R<\/span>ich (Rs 2 lakh minimum) and <span class='mn'>R<\/span>eal time; <span class='mn'>N<\/span>EFT = <span class='mn'>N<\/span>ot instant (batches); <span class='mn'>I<\/span>MPS = <span class='mn'>I<\/span>mmediate.<ul><li>Email protocols: \"SMTP Sends Mail To People; POP3 Pulls Out to PC; IMAP keeps It Managed At Provider\".<\/li><li>BCC = \"Blind\": nobody else sees who got it.<\/li><\/ul>"},{"k":"trap","h":"<b>CC vs BCC<\/b>: both get the mail; only BCC is hidden. <b>Outbox vs Sent<\/b>: Outbox = not yet gone. <b>Drafts<\/b> are never sent. <b>Reply All<\/b> does not reach BCC recipients. <b>RTGS vs NEFT<\/b>: RTGS is real-time and individual with a Rs 2 lakh minimum; NEFT is in batches. <b>UPI and IMPS<\/b> are run by NPCI, NEFT and RTGS by RBI. You never need a PIN to <i>receive<\/i> money."}],"sum":["An e-mail address is username@domain; Ray Tomlinson sent the first network e-mail in 1971 and chose the @ sign.","CC recipients are visible to all; BCC (Blind Carbon Copy) recipients are hidden from others.","Drafts are unsent saved mails, Outbox holds mails waiting to go, Sent keeps copies of sent mails, Spam holds junk.","NEFT settles in half-hourly batches, RTGS settles each transfer in real time (minimum Rs 2 lakh); both run by RBI.","IMPS and UPI (NPCI) are instant 24x7; never share PIN, OTP or CVV - banks never ask for them.","Email = username@domain; CC visible, BCC hidden; SMTP sends, POP3/IMAP receive, MIME attachments; spam = junk mail."],"part":["Part 3 · Internet, networks & security","इंटरनेट, नेटवर्क एवं सुरक्षा"],"app":"compnet"},
{"id":"C14","g":"cmp","heat":3,"title":"Networking: types, topology, devices & OSI","hi":"नेटवर्किंग: प्रकार, टोपोलॉजी, उपकरण एवं ओएसआई","blocks":[{"k":"trick","h":"OSI bottom-up: <span class='mn'>P<\/span>lease <span class='mn'>D<\/span>o <span class='mn'>N<\/span>ot <span class='mn'>T<\/span>hrow <span class='mn'>S<\/span>ausage <span class='mn'>P<\/span>izza <span class='mn'>A<\/span>way. Top-down: <span class='mn'>A<\/span>ll <span class='mn'>P<\/span>eople <span class='mn'>S<\/span>eem <span class='mn'>T<\/span>o <span class='mn'>N<\/span>eed <span class='mn'>D<\/span>ata <span class='mn'>P<\/span>rocessing. Size: <span class='mn'>P<\/span>-<span class='mn'>L<\/span>-<span class='mn'>M<\/span>-<span class='mn'>W<\/span> = 'Please Let Me Win'.<ul><li>Network size order \"Please Let Children Make Wonders\" = PAN, LAN, CAN, MAN, WAN.<\/li><li>OSI layers top to bottom: \"All People Seem To Need Data Processing\" = Application, Presentation, Session, Transport, Network, Data link, Physical. Bottom to top: \"Please Do Not Throw Sausage Pizza Away\".<\/li><li>Devices by layer: \"Hub-Repeater-Modem = 1, Switch-Bridge = 2, Router = 3, Gateway = all upper\".<\/li><li>Bridge = Same protocol; Gateway = different protocol (\"Gate = foreign gate\").<\/li><li>TCP = \"Trustworthy\" (connection-oriented); UDP = \"Unreliable but Dashing\" (fast, streaming).<\/li><li>IP bits \"4-6-MAC\": IPv4 = 32, IPv6 = 128, MAC = 48.<\/li><li>Class ranges start points \"1, 128, 192, 224, 240\" = A, B, C, D, E.<\/li><li>Simplex = TV (one way), half duplex = walkie-talkie (say \"over\"), full duplex = phone call.<\/li><li>Topology: Mesh = Most reliable, More wires; Star = Most used, centre hub.<\/li><\/ul>"},{"k":"trap","h":"<b>Hub vs switch<\/b>: hub sends to all, switch sends to the right port. <b>Switch vs router<\/b>: switch works inside one network (MAC), router joins networks (IP). <b>Modem vs router<\/b>: modem converts signals, router directs traffic. <b>Star vs bus<\/b>: star dies when the hub dies; bus dies when the backbone breaks. <b>IPv4 32 bits, IPv6 128 bits, MAC 48 bits<\/b> – don't mix them. Bandwidth is in <b>bps<\/b>, not bytes.<ul><li>The OSI model has 7 layers.<\/li><li>CAN = Campus Area Network.<\/li><li>A modem lets a computer send data over telephone or cable lines.<\/li><li>A switch (not a router or hub) is the usual device to connect computers inside a LAN and works at layer 2.<\/li><li>Hub broadcasts; switch filters. Hub works at layer 1.<\/li><li>A bridge joins networks with the SAME protocol; a gateway joins networks with DIFFERENT protocols.<\/li><li>Ring topology: failure of one node can disturb the whole network; bus topology uses terminators.<\/li><li>IPv4 = 32 bits (not bytes); IPv6 = 128 bits.<\/li><li>127.0.0.1 is the loopback address, not a Class A public address.<\/li><li>Bluetooth is a PAN (WPAN), not a MAN or WAN.<\/li><\/ul>"}],"sum":["A network joins computers to share resources; by size: PAN, LAN, CAN, MAN, WAN (the internet is the largest WAN).","Topologies: bus (one backbone), star (central hub), ring (loop), mesh (all-to-all, n(n-1)/2 links), tree and hybrid.","Hub broadcasts, switch delivers by MAC, router joins networks by IP, modem converts digital and analog, repeater boosts signals.","OSI has 7 layers: Physical, Data link, Network, Transport, Session, Presentation, Application; TCP/IP has 4.","IPv4 is 32-bit, IPv6 is 128-bit, MAC is 48-bit; optical fibre carries light; an Ethernet cable connects two computers.","Media: optical fibre (fastest, light), twisted pair (RJ45, Ethernet), coaxial; wireless: radio (longest), microwave, infrared (shortest).","PAN < LAN < CAN < MAN < WAN; the internet is the biggest WAN; intranet = private, extranet = joined intranets; VPN = secure tunnel.","Topologies: star (most used), bus (terminators), ring, mesh (most reliable), hybrid, tree.","Devices: hub, repeater, modem (layer 1); switch, bridge (layer 2); router (layer 3); gateway (different protocols).","TCP reliable, UDP fast/streaming; IPv4 32 bits, IPv6 128 bits, MAC 48 bits; classes A 1-126, B 128-191, C 192-223."],"part":["Part 3 · Internet, networks & security","इंटरनेट, नेटवर्क एवं सुरक्षा"],"app":"compnet"},
{"id":"C15","g":"cmp","heat":3,"title":"Protocols, full forms & abbreviations","hi":"प्रोटोकॉल, पूर्ण रूप एवं संक्षिप्ताक्षर","blocks":[{"k":"trick","h":"Mail: <span class='mn'>S<\/span>MTP = <span class='mn'>S<\/span>end; <span class='mn'>P<\/span>OP = <span class='mn'>P<\/span>ull down (download); <span class='mn'>I<\/span>MAP = keep <span class='mn'>I<\/span>n place on server. Ports: FTP <b>21<\/b> &lt; SSH <b>22<\/b> &lt; Telnet <b>23<\/b> &lt; SMTP <b>25<\/b> – the '20s ladder'; DNS <b>53<\/b>, HTTP <b>80<\/b>, POP3 <b>110<\/b>, IMAP <b>143<\/b>, HTTPS <b>443<\/b>."},{"k":"trap","h":"<b>HTTP<\/b> is Hyper Text <i>Transfer<\/i> Protocol; <b>HTML<\/b> is Hyper Text <i>Markup<\/i> Language – exams swap Transfer/Transport/Markup. <b>URL<\/b> is <i>Uniform<\/i> (not Universal) Resource Locator. <b>SMTP sends, POP3/IMAP receive<\/b>. <b>TCP<\/b> is connection-oriented, <b>UDP<\/b> connectionless. <b>DNS<\/b> = name to IP; <b>ARP<\/b> = IP to MAC; <b>DHCP<\/b> = gives out IPs."}],"sum":["A protocol is a set of rules for communication; HTTP (port 80) carries web pages, HTTPS (port 443) does it securely.","FTP (20/21) moves files; SMTP (25) sends mail; POP3 (110) and IMAP (143) receive mail; DNS (53) turns names into IP addresses.","TCP is reliable and connection-oriented; UDP is fast and connectionless; DHCP assigns IP addresses, ARP finds MAC from IP.","HTTP = Hyper Text Transfer Protocol, HTML = Hyper Text Markup Language, URL = Uniform Resource Locator.","VIRUS = Vital Information Resources Under Siege; CAPTCHA tells computers and humans apart; UPI = Unified Payments Interface.","Learn full forms in groups: hardware, memory, files, internet, networks."],"part":["Part 3 · Internet, networks & security","इंटरनेट, नेटवर्क एवं सुरक्षा"],"app":"compnet"},
{"id":"C16","g":"cmp","heat":3,"title":"Cyber security","hi":"साइबर सुरक्षा","blocks":[{"k":"trick","h":"Malware by legs: <span class='mn'>V<\/span>irus = <span class='mn'>V<\/span>ehicle needed (host file); <span class='mn'>W<\/span>orm = <span class='mn'>W<\/span>alks alone; <span class='mn'>T<\/span>rojan = <span class='mn'>T<\/span>ricks you with a gift. Phishing family by channel: <span class='mn'>E<\/span>-mail = Phishing, <span class='mn'>V<\/span>oice = Vishing, <span class='mn'>S<\/span>MS = Smishing.<ul><li>\"Virus Visits with you (needs human); Worm Walks alone; Trojan Tricks (disguise, no copying).\"<\/li><li>Phishing family by medium: Ph = email/website, V = Voice, S = SMS, W = Whale (big person).<\/li><li>First worm = CREEPER 1971 (Bob Thomas) \"C comes before B\"; first virus = BRAIN 1986 (Alvi brothers).<\/li><li>VIRUS = \"Vital Information Resource Under Seize\".<\/li><li>Encryption = Plain → Cipher (lock); Decryption = Cipher → Plain (unlock).<\/li><li>CIA = Confidentiality, Integrity, Availability (not Central Intelligence!).<\/li><li>Ransomware = \"Ransom for files\" (WannaCry, CryptoLocker).<\/li><\/ul>"},{"k":"trap","h":"<b>Virus vs worm<\/b>: only the worm spreads without a host. <b>Trojan<\/b> does not replicate. <b>Phishing vs pharming<\/b>: phishing needs you to click a fake link; pharming redirects you even when you type the right address. <b>DoS vs DDoS<\/b>: DDoS uses many machines. <b>Firewall vs antivirus<\/b>: firewall filters traffic, antivirus removes malware. <b>Cookies vs cache<\/b>: cookies store your details, cache stores page files. <b>Encryption ≠ compression<\/b>.<ul><li>A Trojan does NOT replicate; viruses and worms do.<\/li><li>A worm spreads WITHOUT human action; a virus needs human action.<\/li><li>Spyware is a type of malware, not an antivirus.<\/li><li>Biometrics identify physical and behavioural attributes, not login and password.<\/li><li>A virus that stays in RAM is a RESIDENT virus.<\/li><li>Malware = Malicious Software.<\/li><li>Cookies are created by the web SERVER and stored by the browser; they are not viruses.<\/li><li>Pinging is a network test, not a cyber attack.<\/li><li>Theft of a physical hard disk from a shop is ordinary theft, not cyber crime.<\/li><li>Tally is accounting software, not an antivirus.<\/li><\/ul>"}],"sum":["Malware: virus needs a host file, worm self-replicates over networks, Trojan disguises itself, ransomware demands money, spyware and keyloggers steal data.","Phishing (e-mail), vishing (voice), smishing (SMS) trick people; pharming redirects to fake sites; DDoS floods a server from many computers.","A firewall filters network traffic; antivirus removes malware; encryption turns plaintext into ciphertext.","Strong passwords, 2FA/MFA, updates, backups and HTTPS help prevent attacks; white hat hackers are ethical.","India: IT Act 2000 (amended 2008), CERT-In for cyber incidents, helpline 1930 and cybercrime.gov.in.","Malware = virus (needs human), worm (spreads alone), Trojan (disguised, no copying), logic bomb, spyware, ransomware, botnet.","First worm CREEPER (1971, Bob Thomas); first virus BRAIN (1986, Alvi brothers).","Virus types: boot sector, direct action, resident, multipartite, polymorphic, overwrite, macro, file infector.","Attacks: phishing, vishing, smishing, whaling, pharming, spoofing, sniffing, DoS/DDoS, brute force, eavesdropping.","Protection: antivirus, firewall (packet filtering at network layer), authentication, strong passwords, CAPTCHA, encryption, VPN."],"part":["Part 3 · Internet, networks & security","इंटरनेट, नेटवर्क एवं सुरक्षा"],"app":"compnet"},
{"id":"C22","g":"cmp","heat":2,"title":"Cyber law & Digital India","hi":"साइबर कानून एवं डिजिटल इंडिया","blocks":[{"k":"trick","h":"The 66 family — <span class='mn'>B C D E F<\/span>: <b>B<\/b> = Bought stolen device, <b>C<\/b> = Copied your identity, <b>D<\/b> = Disguised as someone (personation), <b>E<\/b> = Eye on your privacy, <b>F<\/b> = Fear (terrorism). Plain 66 = hacking. IT Act dates — <span class='mn'>9-6 then 17-10<\/span>: assent 9 June, in force 17 October 2000."},{"k":"trap","h":"<b>66F<\/b> (cyber terrorism) carries life imprisonment; <b>66<\/b> is plain hacking. <b>66A<\/b> no longer exists — the Supreme Court struck it down in 2015. <b>CERT-In<\/b> is under MeitY, but <b>I4C<\/b> is under the Home Ministry. The IT Act came into force on <b>17 October 2000<\/b>, not 2008 (2008 is the amendment). The cyber fraud helpline is <b>1930<\/b>, not 100 or 112."}],"sum":["The IT Act, 2000 (assent 9 June, in force 17 October 2000) made e-records and digital signatures legal and defined cyber crimes; it was amended in 2008.","Sections: 43 damage, 65 source code tampering, 66 hacking, 66C identity theft, 66D cheating by personation, 66E privacy, 66F cyber terrorism (life), 67 obscene material; 66A was struck down in 2015.","CERT-In (MeitY, 2004) handles cyber incidents; I4C (Home Ministry) coordinates action; report at cybercrime.gov.in or call 1930.","The DPDP Act, 2023 protects personal data and sets up the Data Protection Board.","Digital India began on 1 July 2015; Aadhaar (UIDAI), DigiLocker (2015), UPI (2016), BHIM (2016), UMANG (2017), 5G (2022).","Cookies store web activity; IT Act 2000 Section 66F = cyber terrorism."],"part":["Part 3 · Internet, networks & security","इंटरनेट, नेटवर्क एवं सुरक्षा"],"app":"compnet"},
{"id":"C17","g":"cmp","heat":2,"title":"New technologies & computer terms","hi":"नई तकनीकें एवं कंप्यूटर शब्दावली","blocks":[{"k":"trick","h":"Cloud stack from top: <span class='mn'>S<\/span>aaS = <span class='mn'>S<\/span>oftware you just use; <span class='mn'>P<\/span>aaS = <span class='mn'>P<\/span>latform to build; <span class='mn'>I<\/span>aaS = <span class='mn'>I<\/span>ron (bare hardware). AI family: <span class='mn'>A<\/span> ⊃ <span class='mn'>M<\/span> ⊃ <span class='mn'>D<\/span> – 'A Mango Drop' (AI contains ML contains Deep learning)."},{"k":"trap","h":"<b>Father of AI<\/b>: John McCarthy coined the term; Alan Turing laid the theory – read the question wording. <b>AR vs VR<\/b>: AR adds to reality, VR replaces it. <b>ML vs DL<\/b>: deep learning is a part of ML, not the other way. <b>Gmail is SaaS<\/b>, AWS EC2 is IaaS. <b>Python<\/b> is Guido van Rossum, <b>Java<\/b> is James Gosling, <b>Linux<\/b> is Linus Torvalds – not the founders of Microsoft or Apple."}],"sum":["AI makes machines think; ML learns from data; deep learning uses neural networks; generative AI creates new content.","Cloud computing: SaaS (Gmail), PaaS (App Engine), IaaS (AWS EC2); deployed as public, private or hybrid cloud.","IoT connects everyday objects; blockchain is a shared tamper-resistant ledger; Bitcoin (2009) is the first cryptocurrency; AR adds, VR replaces reality.","John McCarthy coined Artificial Intelligence; Alan Turing gave the Turing Test; Ritchie made C, Gosling Java, van Rossum Python, Torvalds Linux.","India: C-DAC (1988), PARAM 8000 (1991), Digital India and DigiLocker (2015), UPI and BHIM (2016), 5G (2022).","LLMs such as ChatGPT (OpenAI, 2022) and Gemini (Google) are generative AI; NLP lets computers handle human language; a deepfake is fake AI-made media.","India: IndiaAI Mission (2024), Bhashini (2022), AIRAWAT and PARAM Rudra supercomputers, India Semiconductor Mission (2021)."],"part":["Part 3 · Internet, networks & security","इंटरनेट, नेटवर्क एवं सुरक्षा"],"app":"compnet"}

const HEATMAP = {"cols":[{"label":"SSC CGL","sub":"Tier 2 · 20 Q"},{"label":"SSC CHSL","sub":"Tier 2 · 15 Q"},{"label":"RRB NTPC","sub":"CBT · in GA"}],"rows":[{"id":"C1","v":[1,1,3]},{"id":"C2","v":[3,3,2]},{"id":"C3","v":[3,3,3]},{"id":"C4","v":[3,3,3]},{"id":"C5","v":[2,2,2]},{"id":"C6","v":[1,1,1]},{"id":"C7","v":[3,3,2]},{"id":"C8","v":[3,3,2]},{"id":"C9","v":[3,3,2]},{"id":"C10","v":[3,3,2]},{"id":"C11","v":[2,2,1]},{"id":"C12","v":[3,3,2]},{"id":"C13","v":[2,2,1]},{"id":"C14","v":[3,3,2]},{"id":"C15","v":[3,3,3]},{"id":"C16","v":[3,3,2]},{"id":"C17","v":[1,1,2]},{"id":"C18","v":[3,3,3]},{"id":"C19","v":[3,3,2]},{"id":"C20","v":[2,2,1]},{"id":"C21","v":[2,2,1]},{"id":"C22","v":[1,1,2]}],"pattern":{"title":"Exam pattern at a glance","head":["Exam","Where it sits","Questions","Marks","Time","Counts as"],"rows":[["SSC CGL","Tier 2, Paper 1 · Section III, Module I","20","60 (3 each, &minus;1 per wrong)","15 min","Qualifying"],["SSC CHSL","Tier 2 · Section III, Module I","15","45 (3 each, &minus;1 per wrong)","15 min","Qualifying"],["RRB NTPC","Inside General Awareness (CBT 1 and CBT 2)","about 2&ndash;4","1 each, &minus;1/3 per wrong","shared","Counts in the merit"]],"note":"As in recent notifications. Patterns change — confirm against the official notice for your exam. The NTPC count is an estimate from published paper analyses."},"tips":["<b>Qualifying does not mean safe.<\/b> In CGL and CHSL a wrong answer costs a mark, and you must clear the qualifying score. Attempt what you know cold and leave pure guesses.","<b>Shortcuts and full forms are the cheapest marks.<\/b> Learn the Shortcuts and the Protocols &amp; abbreviations lessons until the answers are automatic — they need no reasoning on the day.","<b>Watch keys that change meaning between programs.<\/b> Ctrl+D, F7 and Ctrl+K do different things in Word, Excel and the browser, and the papers use that to set traps.","<b>Memory questions are about order and volatility.<\/b> Know the hierarchy (registers → cache → RAM → disk) and which memories lose their data when the power goes.","<b>For RRB NTPC<\/b> the computer questions sit inside General Awareness, so put full forms, memory units, input/output devices, generations and the “father of” questions first.","<b>Practise Excel by hand.<\/b> Count the cells in a range, copy a formula with relative and absolute references, and work out operator order (brackets, then ^, then × ÷, then + −) — these are sure calculation marks.","<b>Read every option.<\/b> “NOT”, “incorrect” and “all of the above” questions are frequent, and the commonest mix-ups are PC vs MAR, compiler vs interpreter, transition vs animation, hub vs switch, IPv4 bits vs bytes, and Word limits vs Excel limits."],"note":"How the heat map is made: the levels are our estimate, from the official SSC syllabus for the computer module and from published shift-wise analyses of SSC CGL Tier 2 (March 2023) and RRB NTPC CBT-1 (June 2025). They are not a count of questions. Questions tagged 📜 carry the paper they come from: a few were reported by candidates after the paper (memory-based), and the rest were matched to official SSC and RRB papers through published question pages (testbook.com). Check against the official answer key when it matters."};

/* ===== Desktop layout (PC / tablet landscape) ===== */
@media (min-width: 1024px){
  :root{--side:236px}
  body{padding-left:var(--side);font-size:16.5px}
  .top{border-bottom:1px solid var(--rule)}
  .top-in{max-width:1320px;padding:16px 36px}
  .brand{font-size:21px}
  .brand small{font-size:13px}
  .stat{font-size:13px}
  .wrap{max-width:1320px;padding:0 36px 56px}
  .view{padding-top:28px}
  h1{font-size:34px} h2{font-size:22px} h3{font-size:17px}

  /* bottom tab bar becomes a left sidebar */
  .nav{top:0;bottom:0;left:0;right:auto;width:var(--side);height:auto;border-top:0;border-right:1px solid var(--rule);padding:84px 14px 20px;display:block;overflow:auto}
  .nav-in{display:flex;flex-direction:column;gap:4px;height:auto;max-width:none;margin:0}
  .nav-in::before{content:"Sections";display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:0 14px 8px}
  .nav button{flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-size:15px;min-height:0;height:auto;width:100%;text-align:left}
  .nav button svg{width:20px;height:20px;flex-shrink:0}
  .nav button:hover{background:var(--sunk)}
  .nav button[aria-current="page"]{background:var(--blue-bg)}
  .nav button[aria-current="page"] span{border-bottom:0!important}

  /* home: intro beside progress */
  .hero{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);column-gap:48px;align-items:end;padding-bottom:10px}
  .hero > .eyebrow,.hero > h1,.hero > p{grid-column:1}
  .hero > .meter{grid-column:2;grid-row:3;align-self:center}
  .hero > .row{grid-column:2;grid-row:2;align-self:end}

  /* lesson reader: facts, timelines, tricks sit side by side */
  .lhead{margin-bottom:0}
  .steps{max-width:640px}
  .steps + .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .steps + .stack > .plain,.steps + .stack > .row,.steps + .stack > p,.steps + .stack > .fig,.steps + .stack > h2,.steps + .stack > .tbl{grid-column:1/-1}
  .steps + .stack > .plain{max-width:86ch;font-size:17px}
  .steps + .stack > .hot,.steps + .stack > .story{grid-column:1/-1}
  .steps + .stack > .story{max-width:none;padding:20px 24px;font-size:17.5px}
  .steps + .stack > .story p{max-width:80ch}
  .steps + .stack:not(:has(> .block ~ .block)) > .block{grid-column:1/-1}
  .block,.qcard{padding:18px 20px;border-radius:14px}

  /* quizzes and question bank */
  #lq > .stack{display:grid;grid-template-columns:minmax(0,1fr);max-width:980px;gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qt{font-size:18px}
  #plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #plist .opts{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:wrap;overflow:visible}

  /* mock test: question with the answer grid alongside */
  .mbar{top:calc(env(safe-area-inset-top,0px) + 67px)}
  .view > .qcard{max-width:1000px}
  .view > .row.between{max-width:1000px}
  .view > #msub{max-width:1000px;width:100%}
  .view > .block.stack{max-width:760px}
  .pal{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .kpis{max-width:760px}

  /* revise: summary cards and sheets in columns */
  #rv > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #rv > .stack > .grph,#rv > .stack > p,#rv > .stack > .search,#rv > .stack > .callout{grid-column:1/-1}
  #dgl,#lml,#tll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #dgl > .grph,#dgl > p,#lml > p,#tll > .grph{grid-column:1/-1}
  #rv .search,#rv > #dgl ~ .search{max-width:520px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flash{min-height:300px;max-width:760px;margin:0 auto;padding:32px 36px}
  .flash .front{font-size:22px}

  /* learn: era cards across the top */
  .eras{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}
  .les{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}

<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">

<title>Festivals of India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: Festivals of India — follows the शब्दRegister Paper / Indigo look; one column + bottom tabs on phones, sidebar on PC. */
:root{
  --paper:#f6f3ea; --sheet:#fffdf7; --sunk:#ebe6d8;
  --ink:#1d2a22; --ink2:#56625a; --rule:#dcd5c3;
  --blue:#1f5c3d; --on-blue:#ffffff; --blue-bg:#dcebdf;
  --accent:#b4530f; --accent-bg:#fbe7d3;
  --good:#1b7547; --good-bg:#dff1e6; --bad:#b0271f; --bad-bg:#f8e1de;
  --warn-bg:#fff2d2;
  --f-display:"Fraunces", "Tiro Devanagari Hindi", Georgia, serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap{border-radius:var(--r);padding:12px 14px 12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.trick .lab,.trap .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.pyr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pyr div{text-align:center;font-size:13px}
.pyr b{display:block;font-size:14px}
.pm{fill:var(--blue)} .pf{fill:var(--accent)}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.pal button.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.pal button.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.rk{display:grid;gap:0}
.rk div{display:grid;grid-template-columns:minmax(0,48%) 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:15px}
.rk div:first-child{border-top:0}
.rk dt{font-size:13px;color:var(--ink2);margin:0}
.rk dt.up{color:var(--good)} .rk dt.dn{color:var(--bad)}
.rk dd{margin:0;font-weight:600;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:24px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.gbar{display:grid;grid-template-columns:78px 1fr 52px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.gbar .tr{height:12px;background:var(--sunk);border-radius:3px;position:relative;overflow:hidden}
.gbar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:3px}
.gbar .tr i.neg{background:var(--bad)}
.gbar .v{font-family:var(--f-num);text-align:right}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
@media (prefers-reduced-motion: no-preference){ .opt,.chip,.btn{transition:background-color .15s, border-color .15s} }
.link{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px}
.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.icheck{background:var(--sheet);border:1.5px dashed var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.icheck .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.cat{font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;white-space:nowrap}
.cat.CS{background:var(--blue-bg);color:var(--blue)} .cat.CSS{background:var(--accent-bg);color:var(--accent)} .cat.ST{background:var(--sunk);color:var(--ink)} .cat.OT{background:var(--sunk);color:var(--ink2)}

/* ---- Festivals additions ---- */
table.cover td:nth-child(4){min-width:180px}
.plist .dl{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.plist .dl em{font-style:normal;font-weight:700;color:var(--blue);text-align:right}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--rule)}
.ladder li{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--rule)}
.ladder .rk-n{font-size:22px;font-weight:600;color:var(--blue);text-align:right}
.ladder .rk-t{min-width:0}
.ladder .rk-t b{display:block;line-height:1.3}
.ladder .rk-t span{font-size:13px;color:var(--ink2)}
.ladder .rk-d{font-weight:700;font-size:14px;white-space:nowrap}
.ladder li.up .rk-d{color:var(--good)} .ladder li.dn .rk-d{color:var(--bad)}
.ladder small{font-weight:600;color:var(--ink2)}
table.cover td{min-width:90px}
.peek{border:1.5px dashed var(--blue);background:var(--blue-bg);color:var(--blue);border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer;min-height:36px;width:100%}
.pubs{display:grid;gap:12px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.plist li{padding:7px 0;border-top:1px dashed var(--rule);display:grid;gap:1px}
.plist li:first-child{border-top:0}
.plist li span{font-size:13px;color:var(--ink2)}
.seg{scroll-snap-type:x proximity}
@media (max-width: 700px){
  table.cover thead{display:none}
  table.cover tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--rule)}
  table.cover td{border:0;padding:0;min-width:0;font-size:14px}
  table.cover td:first-child{grid-column:1/-1;font-size:15px}
  table.cover td:nth-child(4){grid-column:1/-1;min-width:0}
  table.cover td[data-l]::before{content:attr(data-l);display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
}
</style>

    <div class="brand">Festivals of India<small>भारत के त्योहार · SSC CGL workbook</small></div>

  </div>
</header>

<script>
"use strict";
const LESSONS = [
{ id:"L1", title:"How festival questions are asked", hi:"त्योहार के प्रश्न कैसे आते हैं", blocks:[
 {k:"p", h:"India has roughly 140 festivals worth knowing — about five per state. The 2025 papers (CGL, CHSL, MTS, CPO, Steno, Delhi Police, Selection Post) asked them in four shapes: <b>(1) which state</b> (most common), <b>(2) which tribe or community</b>, <b>(3) what is worshipped or marked</b> (a deity, a harvest, a new year), and <b>(4) statement / 'best describes' questions</b> on rituals. The lecture's rule: <b>fix the state first; details come second.</b>"},
 {k:"trick", h:"<b>Name endings give the state away.</b> <b>-Kut</b> → Mizoram (Chapchar Kut, Mim Kut, Pawl Kut). <b>-Ngai</b> → Manipur (Gaan-Ngai, Lui-Ngai-Ni). <b>Habba</b> → Karnataka (Gowri Habba, Gombe Habba — habba means festival in Kannada). <b>Pooram / Vallam / Aarattu</b> → Kerala. <b>Pongal / Deepam / Attam</b> → Tamil Nadu. <b>Losar / Lochar / Losoong</b> → Tibetan-Buddhist belt (Ladakh, HP, Sikkim, Arunachal). <b>-Sim</b> → Santhal (Erok Sim, Magh Sim)."},
 {k:"trap", h:"<b>When the state in your head is missing from the options.</b> Naga people live in Manipur and Mizoram too. So if a <b>-Ngai</b> festival's options lack Manipur, mark <b>Nagaland</b>; if a <b>-Kut</b> festival's options lack Mizoram, mark <b>Nagaland</b>. Bushu (Dimasa) is Assam <i>and</i> Nagaland — if Assam is absent, Nagaland."},
 {k:"trick", h:"<b>Solve statements with logic.</b> Extreme words — <i>only, exclusively, without any, universally</i> — are usually false. A loose, descriptive statement with no hard fact is usually true. The Rajasthan International Folk Festival 'exclusively showcases Manganiyars and Langas <b>without</b> international artists' — false; the name itself says <i>International</i>."},
 {k:"table", title:"Hindu months — the calendar every question uses", head:["Month","Roughly","What falls here"], rows:[["Chaitra","Mar–Apr","Most New Years (Ugadi, Gudi Padwa, Cheti Chand, Navreh)"],["Vaishakh","Apr–May","Baisakhi, Vishu, Bohag Bihu, Buddha Purnima"],["Jyeshtha","May–Jun","Ganga Dussehra"],["Ashadha","Jun–Jul","Rath Yatra, Goncha"],["Shravan (Sawan)","Jul–Aug","Hareli, Teej, Jivati, Pola"],["Bhadrapada (Bhado)","Aug–Sep","Onam, Karma, Paryushana, Ganesh Chaturthi"],["Ashwin","Sep–Oct","Navratri, Durga Puja, Bathukamma, Kojagiri"],["Kartik","Oct–Nov","Diwali, Chhath, Karva Chauth, Pushkar, Kati Bihu"],["Pausha–Magha","Dec–Feb","Lohri, Makar Sankranti, Pongal, Magh Bihu"],["Phalguna","Feb–Mar","Holi, Mahashivratri, Yaoshang"]]},
 {k:"trick", h:"<b>Use the season as a clue.</b> A <b>bonfire</b> means winter (Lohri, Bhogi, Magh Bihu's Uruka) — not March or October. <b>Chaitra</b> + 'new year' is almost always right. Rice is a kharif crop: harvested around <b>Oct–Nov</b>, so 'new rice' festivals (Nuakhai, Puthari, Nongkrem, Loku) sit in autumn."},
 {k:"q", q:"A festival whose name ends in '-Kut' is most likely from which state?", o:["Mizoram","Manipur","Karnataka","Kerala"], e:"Kut means festival in Mizo — Chapchar Kut, Mim Kut, Pawl Kut."},
 {k:"link", h:"<b>Pre-harvest vs post-harvest.</b> Pre-harvest (or sowing) festivals <i>ask</i> the gods for a good crop; post-harvest festivals <i>thank</i> them. Many PYQs hinge on this one word — Sungremong is pre-harvest, Tokhu Emong post-harvest; Chapchar Kut before sowing, Mim Kut after the maize harvest; Erok Sim at sowing, Magh Sim after harvest."},
 {k:"q", q:"A statement says a festival 'exclusively showcases local artists without any international involvement'. The safest approach is to…", o:["Treat it as likely false because of the extreme wording","Treat it as true because it is specific","Ignore the statement","Mark both statements correct"], e:"Extreme keywords like 'exclusively' and 'without any' usually signal a false statement."}
], sum:["Fix the state first: -Kut Mizoram, -Ngai Manipur, Habba Karnataka, Pooram Kerala, Losar Tibetan belt.","If Manipur/Mizoram is missing from options for a Ngai/Kut festival → Nagaland.","Extreme words (only, exclusively, without) → usually false.","Chaitra = New Year; bonfire = winter; new rice = Oct–Nov."]},

{ id:"L2", title:"New Year & harvest festivals across India", hi:"नववर्ष और फसल उत्सव", blocks:[
 {k:"p", h:"Most regional New Years fall in <b>Chaitra–Vaishakh (Mar–Apr)</b>, when the Sun enters Aries and the rabi harvest is in. Most harvest festivals cluster in <b>mid-January</b> — the Sun's northward turn, Makar Sankranti."},
 {k:"table", title:"New Year festivals", head:["State / community","New Year"], rows:[["Andhra, Telangana, Karnataka","<b>Ugadi</b> (yuga-adi, 'start of an age')"],["Maharashtra","<b>Gudi Padwa</b>"],["Tamil Nadu","<b>Puthandu</b>"],["Kerala","<b>Vishu</b> (month of Medam, mid-April)"],["West Bengal","<b>Pohela (Poila) Boishakh</b>"],["Assam","<b>Bohag (Rongali) Bihu</b>"],["Odisha","<b>Pana (Maha Vishuba) Sankranti</b>"],["Punjab (Sikhs)","<b>Baisakhi</b>"],["Manipur (Meitei)","<b>Cheiraoba</b> (Sajibu Cheiraoba)"],["Bodo (Assam)","<b>Bwisagu</b>"],["Kashmiri Pandits","<b>Navreh</b>"],["Sindhis","<b>Cheti Chand</b>"],["Parsis","<b>Navroz</b> (Pateti the eve)"],["Gujarat","<b>Bestu Varas / Nutan Varsh</b> (day after Diwali)"],["Tibetan Buddhists","<b>Losar</b> (Ladakh, HP, Sikkim, Arunachal)"],["Sikkim Bhutia / Lepcha","<b>Losoong / Namsoong</b>"],["Sikkim Tamang / Gurung","<b>Sonam Lochar / Tamu Lochar</b>"],["Lahaul (HP)","<b>Halda</b>"]]},
 {k:"trap", h:"<b>Vishu is Kerala's New Year, not a harvest festival.</b> A 2025 statement question said 'Vishu is celebrated in Kerala as a harvest festival with fireworks' — marked <b>wrong</b>. Kerala's harvest festival is <b>Onam</b>."},
 {k:"q", q:"Ugadi falls in the first month of the Hindu calendar, which is called…", o:["Chaitra","Vaishakh","Kartik","Magha"], e:"Ugadi, Gudi Padwa and most New Years fall in Chaitra (Mar–Apr)."},
 {k:"table", title:"One Sankranti, many names (mid-January)", head:["Region","Name"], rows:[["Tamil Nadu","Pongal (4 days)"],["Assam","Magh (Bhogali) Bihu"],["Punjab","Lohri (the night before) and Maghi"],["Gujarat","Uttarayan (kite festival)"],["Andhra & Telangana","Sankranti / Pedda Panduga (4 days, Bhogi bonfire)"],["Uttar Pradesh","Khichdi"],["Uttarakhand (Kumaon)","Ghughutia — crows are fed"]]},
 {k:"trick", h:"<b>Makar Sankranti is geography.</b> The Sun reaches the Tropic of Capricorn at the winter solstice (22 Dec), then begins its <b>northward journey (Uttarayan)</b>; around 14 January it enters the zodiac <b>Makara (Capricorn)</b>. It is not the longest day (21 June), not monsoon, and not the start of north India's harvest (rabi is cut in March–April)."},
 {k:"q", q:"What is the geographical significance of Makar Sankranti?", o:["The Sun's northward journey, entering Capricorn (Makara) after the winter solstice","The longest day of the year in India","The arrival of the monsoon","The start of the rabi harvest in north India"], e:"Uttarayan: the Sun begins moving north after 22 December and enters Makara around 14 January."},
 {k:"trap", h:"<b>Lohri is 13 January, the night before Makar Sankranti</b> — not the winter solstice (22 Dec). The PYQ linked Lohri with <b>sugarcane harvesting</b> (rice is cut in Oct–Nov; mangoes are summer)."},
 {k:"link", h:"<b>New Year ↔ harvest pairs.</b> Assam's three Bihus split the year: Bohag (Apr, New Year) → Kati (Oct, lamps for the growing crop) → Magh (Jan, harvest feast). Kerala: Vishu (New Year) vs Onam (harvest). Tamil Nadu: Puthandu (New Year) vs Pongal (harvest)."},
 {k:"q", q:"Which festival is the New Year of the Marathi community?", o:["Gudi Padwa","Ugadi","Puthandu","Navreh"], e:"Gudi Padwa — the gudi is a victory flag."}
], sum:["Chaitra–Vaishakh New Years: Ugadi, Gudi Padwa, Puthandu, Vishu, Poila Boishakh, Bohag Bihu, Baisakhi, Cheiraoba, Navreh, Cheti Chand.","Vishu = Kerala New Year (not harvest); Onam = harvest.","Makar Sankranti = Uttarayan, Sun enters Capricorn; Pongal, Magh Bihu, Lohri/Maghi, Khichdi.","Lohri 13 Jan, a night before Sankranti."]},

{ id:"L3", title:"Assam & Arunachal Pradesh", hi:"असम और अरुणाचल प्रदेश", blocks:[
 {k:"trick", h:"<b>Assam:</b> “<b>असम की बहू</b> (Bihu) ने <b>बाई को</b> (Baikho, Bwisagu) <b>पटक-पटक</b> (Dehing Patkai) के मारा क्योंकि उसको <b>अली</b> (Ali-Ai-Ligang) के <b>अब्बू</b> (Ambubachi) के साथ <b>माजुली</b> (Majuli festival) देखने जाना था।”"},
 {k:"table", title:"Bihu — three times a year", head:["Bihu","Also called","When","Marks"], rows:[["Bohag","Rongali","April (Chaitra–Vaishakh)","New Year; 7 days (Goru, Manuh…)"],["Kati","Kongali","Oct–Nov (Kartik)","Lamps in fields; lean season"],["Magh","Bhogali","January","Harvest feast; <b>Uruka</b> night with bonfires"]]},
 {k:"trap", h:"<b>Goru Bihu belongs to Bohag (Rongali) Bihu, not Kati Bihu.</b> A 2025 statement question tested exactly this. <b>Manuh Bihu</b> — gifting the gamosa and traditional dishes — is correct. Women's Bihu attire: the <b>mekhela chador</b>."},
 {k:"table", title:"Assam — the rest", head:["Festival","Community","Key fact"], rows:[["<b>Ambubachi Mela</b>","—","Kamakhya temple, Guwahati; mid/late June; Mother Earth's fertility (menstruation); temple shut 3 days, no digging/ploughing/sowing; 4th day cloth given as prasad"],["<b>Baikho</b>","Rabha","Pre-harvest, June; fire called Baranthi; prays for timely rain"],["<b>Bwisagu</b>","Bodo (Bodo-Kachari)","Mid-April New Year; prayers to Bathou (form of Shiva); <b>Bagurumba</b> (butterfly) dance with siphung flute & kham drum"],["<b>Ali-Ai-Ligang</b>","Mising","Start of sowing; Feb–Mar; <b>Gumrag</b> dance"],["<b>Dehing Patkai</b>","—","3 days, January, Lekhapani (Tinsukia)"],["<b>Majuli festival</b>","—","November; Majuli, world's largest river island"],["<b>Rongker</b>","Karbi","Only elderly men & priest (Kurusar); women kept out of the main arena"],["<b>Jonbeel Mela</b>","Tiwa","Barter fair — goods exchanged, not sold"],["<b>Bushu</b>","Dimasa Kachari","Post-harvest, January; deity Sibrai (Assam & Nagaland)"]]},
 {k:"q", q:"The Ambubachi Mela in Assam symbolically represents which natural phenomenon?", o:["Mother Earth's fertility","River flooding","Monsoon onset only","Earth's renewal cycle"], e:"Goddess Kamakhya's annual menstruation — the earth becoming fertile; no ploughing for 3 days."},
 {k:"link", h:"<b>Ambubachi (Assam) = Raja Parba (Odisha).</b> Both treat the earth as menstruating in June; both forbid digging, ploughing and sowing for three days. Raja is also called <b>Mithuna Sankranti</b>."},
 {k:"trick", h:"<b>Arunachal:</b> “<b>अरुण</b> (Arunachal), क्या <b>तेरे संग</b> (Sangken) <b>सो लूं</b> (Solung) इस <b>ट्री</b> (Dree) के नीचे? <b>लो सर</b> (Losar), मेरी <b>पिन</b> (Mopin) पकड़ो और <b>पास आओ</b> (Pangsau Pass)।” Add <b>Chalo Loku</b>, Myoko, Nyokum, Boori Boot, Pongtu."},
 {k:"table", title:"Arunachal Pradesh", head:["Festival","Tribe","Key fact"], rows:[["<b>Sangken</b>","Khampti & Singpho (Theravada Buddhists)","April water festival; Buddha idols bathed"],["<b>Solung</b>","Adi","Harvest; drink <b>Apong</b> (rice beer) shared; <b>Ponung</b> dance; Kine Nane (crops), Doying Bote (domestic animals)"],["<b>Dree</b>","Apatani","July, Ziro valley, agricultural"],["<b>Myoko</b>","Apatani","Rotating village responsibility for rituals"],["<b>Mopin</b>","Galo","April; goddess Mopin Ane; <b>Popir</b> dance; rice paste on cheeks, white clothes"],["<b>Losar</b>","Monpa","Tibetan New Year"],["<b>Nyokum</b>","Nyishi","February; <b>Nyok = land, Kum = collectiveness</b>; Donyi-Polo invoked"],["<b>Boori Boot</b>","Nyishi","February, spring, for a good harvest"],["<b>Chalo Loku</b>","Nocte","Tirap; 3 days, Oct–Nov, end of paddy harvest"],["<b>Pongtu</b>","Tutsa","Before millet harvest; deity <b>Rangkhothak</b>; means 'retreating wind'"],["<b>Pangsau Pass Winter Festival</b>","—","Nampong, Myanmar border; honours WWII history"],["<b>Ziro Festival of Music</b>","—","Since 2012, Ziro valley, outdoor"]]},
 {k:"trick", h:"Hooks: <b>Solung → Ponung</b> and <b>Mopin → Popir</b> (rhyming pairs). <b>Apatani ~ पानी</b> → water the tree → <b>Dree</b>. <b>Mopin</b> → गाल में पिन (Galo). <b>Nyokum ~ Nyishi</b>. Solung: “<b>आदि</b> हमेशा पूछता है सो लूं? और Apong (राइस बियर) पीता है।”"},
 {k:"table", title:"Chalo Loku — the three days", head:["Day","Name","What happens"], rows:[["1","<b>Phamlamja</b>","Animal sacrifice (pigs, buffalo)"],["2","<b>Chamkatja</b>","Prayers at the <b>Chaatam</b> / shrine"],["3","<b>Thanglangja</b>","Farewell: community dancing, fasting, omen reading"]]},
 {k:"trap", h:"<b>Loku comes from 'Lofe' = to drive out</b> (the old season) — not from 'Rangku'. Cha = paddy, Lo = season, Ku = festival. The PYQ's correct statement: <b>Chamkatja involves prayers at the Chaatam.</b>"},
 {k:"trap", h:"<b>Donyi-Polo is Sun (Donyi) and Moon (Polo)</b> together. The lecture once called Donyi-Polo 'the moon god' — Polo alone is the moon."},
 {k:"q", q:"The word 'Kum' in the Nyokum festival symbolises…", o:["Collectiveness","Silence","Purity","Sacrifice"], e:"Nyok = land/earth; Kum = collectiveness or togetherness."},
 {k:"q", q:"The Myoko festival, based on rotating village responsibility for rituals, is celebrated in…", o:["Arunachal Pradesh","Assam","Nagaland","Sikkim"], e:"Myoko is celebrated by the Apatani tribe of the Ziro valley."}
], sum:["Assam: Bihu ×3 (Bohag Apr, Kati Oct, Magh Jan), Ambubachi (Kamakhya, June), Baikho (Rabha), Bwisagu (Bodo), Ali-Ai-Ligang (Mising), Majuli, Rongker (Karbi), Jonbeel (barter).","Arunachal: Sangken (water, Khampti/Singpho), Solung (Adi, Apong, Ponung), Dree & Myoko (Apatani), Mopin (Galo, Popir), Nyokum & Boori Boot (Nyishi), Loku (Nocte), Pongtu (Tutsa, Rangkhothak)."]},

{ id:"L4", title:"Nagaland & Manipur", hi:"नागालैंड और मणिपुर", blocks:[
 {k:"trick", h:"<b>Nagaland:</b> “<b>नाग</b> (Naga), <b>बिल</b> (Hornbill) में <b>आओ</b> (Aoleang, Ao) और <b>मुँह</b> (Moatsu) से <b>शक्कर</b> (Sekrenyi) खाओ। यह नाग <b>नाज़ुक</b> (Naazu) है।”"},
 {k:"table", title:"Nagaland", head:["Festival","Tribe","Key fact"], rows:[["<b>Hornbill</b>","All Naga tribes","1–10 December, Kisama; 'Festival of Festivals'; bird = strength, cultural unity, grandeur"],["<b>Sekrenyi</b> (Phousanyi)","Angami","February; purify body and soul, ward off evil before sowing"],["<b>Moatsu (Mong)</b>","Ao","First week of May, 3 days; joy after clearing fields and sowing; Sangpangtu ritual"],["<b>Aoleang</b>","Konyak","First week of April; spring & new year"],["<b>Tuluni</b>","Sumi","Mid-July harvest"],["<b>Sungremong</b>","Ao","Early August, pre-harvest"],["<b>Tokhu Emong</b>","Lotha","9 days, post-harvest (November)"],["<b>Naazu</b>","Pochury","10 days, February; start of the farming season; Khupielilie dance"],["<b>Bushu</b>","Dimasa Kachari","January, post-harvest (also Assam)"]]},
 {k:"trap", h:"<b>The hornbill is not a migrant from Siberia</b> — the lecture said so. The Great Hornbill is a resident forest bird of the North-East; the festival is simply named after it. Also: Hornbill is the 'Festival of Festivals'; Thrissur Pooram is the 'mother of all Poorams'."},
 {k:"q", q:"Which festival of the Ao Naga tribe is a time of recreation and joy after clearing fields and sowing seeds?", o:["Moatsu","Sungremong","Hornbill","Tokhu Emong"], e:"Moatsu (first week of May). Sungremong is also Ao but is a pre-harvest festival in August."},
 {k:"trick", h:"<b>Manipur:</b> “<b>मनी</b> (Manipur) आते ही अपने <b>संग</b> (Kang) <b>डोल</b> (Dol Jatra/Yaoshang) और <b>चेरी</b> (Cherry Blossom) <b>लाई</b> (Lai Haraoba), फिर <b>हिंडन</b> (Heikru Hidongba) में <b>नहाई</b> (Ngai festivals)।” Plus Ningol Chakouba, Cheiraoba, Kwak Jatra."},
 {k:"table", title:"Manipur", head:["Festival","Key fact"], rows:[["<b>Lai Haraoba</b>","'Merrymaking of the gods'; Meitei; worship of <b>Umang Lai</b> (ancestral forest deities); priests <b>Maibas</b> (male) & <b>Maibis</b> (female); Lai Haraoba & Khamba Thoibi dances"],["<b>Yaoshang</b> (Dol Jatra)","'Holi of Manipur'; 5 days from full moon of Lamta (Feb–Mar); <b>Thabal Chongba</b> moonlight dance; sports events"],["<b>Ningol Chakouba</b>","Married sisters/daughters invited home for a feast and gifts; role of women; Oct–Nov"],["<b>Cheiraoba</b> (Sajibu Cheiraoba)","Meitei New Year; Sajibu is the first month (Mar–Apr)"],["<b>Kang</b>","Manipur's Rath Yatra (Jagannath, Balabhadra, Subhadra), ~10 days; Shree Govindajee temple"],["<b>Kwak Jatra</b> (Kwak Tanba)","'Crow festival' — king released a crow; end of monsoon, October"],["<b>Heikru Hidongba</b>","Boat-racing festival"],["<b>Gaan-Ngai</b>","Zeliangrong Naga; 5 days, post-harvest thanksgiving (Dec–Jan)"],["<b>Lui-Ngai-Ni</b>","Naga tribes of Manipur; seed-sowing (February)"]]},
 {k:"link", h:"<b>Ngai pair:</b> Lui-Ngai-Ni = <b>sowing</b> (beginning); Gaan-Ngai = <b>harvest</b> (end). Same idea as Mizoram's Chapchar Kut (sowing) vs Mim Kut (harvest)."},
 {k:"q", q:"Which festival of Manipur focuses on the role of women and involves inviting married sisters for feasting and gifts?", o:["Ningol Chakouba","Yaoshang","Lai Haraoba","Cheiraoba"], e:"Ningol = married woman/daughter; Chakouba = invitation to a feast."},
 {k:"q", q:"Which is true about Yaoshang in Manipur?", o:["Thabal Chongba is a moonlight circle dance performed during it","It includes academic quiz competitions","It marks the start of the harvest season","It is the Meitei New Year"], e:"Yaoshang is Manipur's Holi with Thabal Chongba and sports events; Cheiraoba is the New Year."}
], sum:["Nagaland: Hornbill (1–10 Dec), Sekrenyi (Angami), Moatsu & Sungremong (Ao), Aoleang (Konyak), Tuluni (Sumi), Tokhu Emong (Lotha), Naazu (Pochury), Bushu (Dimasa).","Manipur: Lai Haraoba (Umang Lai, Maiba/Maibi), Yaoshang (Holi, Thabal Chongba), Ningol Chakouba (sisters), Cheiraoba (New Year), Kang (Rath Yatra), Kwak Jatra (crow), Gaan-Ngai (harvest), Lui-Ngai-Ni (sowing)."]},

{ id:"L5", title:"Meghalaya, Mizoram, Tripura & Sikkim", hi:"मेघालय, मिज़ोरम, त्रिपुरा, सिक्किम", blocks:[
 {k:"p", h:"Meghalaya has three main tribes — <b>Garo, Khasi, Jaintia (Pnar)</b> — and each owns its festivals. Learn the tribe first; the festival follows."},
 {k:"table", title:"Meghalaya", head:["Tribe","Festival","Key fact"], rows:[["Garo","<b>Wangala</b>","'Festival of 100 Drums'; post-harvest; worship of the Sun god Saljong, the earth and farm tools"],["Garo","<b>Agalmaka</b>","Spring agricultural festival (March)"],["Khasi","<b>Shad Suk Mynsiem</b>","'Dance of peaceful hearts'; 3 days, April"],["Khasi","<b>Nongkrem</b>","5-day harvest, autumn (Oct–Nov)"],["Jaintia (Pnar)","<b>Behdienkhlam</b>","July, peak monsoon, 3 days; <b>Behdien = drive away, khlam = plague</b>"]]},
 {k:"trick", h:"Lecture hook: “<b>खांसी</b> (Khasi) में गला <b>सूख</b> (Shad Suk) जाता है।” <b>Garo → Wangala → 100 drums</b> (गाजे-बाजे). Behdienkhlam ↔ Telangana's <b>Bonalu</b>: both began as prayers against plague."},
 {k:"q", q:"Which festival of Meghalaya involves worship of the Sun, earth and agricultural tools to ensure a bountiful harvest?", o:["Wangala","Behdienkhlam","Nongkrem","Shad Suk Mynsiem"], e:"Wangala of the Garos — the 'Festival of 100 Drums'."},
 {k:"table", title:"Mizoram — 'Kut' means festival", head:["Festival","When","Marks"], rows:[["<b>Chapchar Kut</b>","March (spring)","After jhum clearing, before sowing; <b>Cheraw</b> bamboo dance"],["<b>Mim Kut</b>","Aug–Sep","Maize harvest — 'the last harvest, representing survival and love'"],["<b>Pawl Kut</b>","December","Straw (pawl) harvest festival"],["<b>Lyuva Khutla</b>","March","Mara tribe, after jhum; traditional games"],["<b>Anthurium Festival</b>","—","Flower festival (Reiek)"]]},
 {k:"trap", h:"The lecture described Chapchar Kut as coming after sowing. It is celebrated <b>after the jhum forest is cleared and before the burning and sowing</b> — the idle spring break. Keep the pair simple: Chapchar = before sowing, Mim = after harvest."},
 {k:"table", title:"Shifting cultivation — one practice, many names", head:["Region","Name"], rows:[["North-East","Jhum"],["Kerala / Western Ghats","Kumari"],["Andhra Pradesh","Podu / Penda"],["Odisha","Pama Dabi"],["Rajasthan","Walre"],["Jharkhand","Kuruwa"],["Madhya Pradesh","Bewar / Dahiya"],["Andaman & Bastar","Deepa"]]},

 {k:"trick", h:"<b>Jharkhand:</b> “<b>रोहिणी</b> (Rohini) का <b>भगता</b> (Bhagta Parab) <b>शौहर</b> (Sohrai) — उसको <b>सुसु</b> (Tusu) लगी और उसने ये <b>कर्म</b> (Karma) <b>सरहद</b> (Sarhul) पे कर दिया।”"},

 {k:"link", h:"<b>Murugan = Kartikeya.</b> Thaipusam (TN) celebrates his vel defeating Surapadman; Kavadi Attam is the dance of carrying the kavadi — the south's cousin of north India's kanwar yatra."},

 {k:"trick", h:"<b>Karnataka:</b> “<b>हमारा</b> (Hampi) <b>कामवाला</b> (Kambala) <b>अभिषेक</b> (Mahamastakabhisheka) <b>कल</b> (Kailpodh) अपने <b>अब्बा</b> (Habba) को <b>गाड़ी</b> (Ugadi) <b>करके</b> (Karaga) लाया था।”"},
 {k:"table", title:"Karnataka", head:["Festival","Key fact"], rows:[["<b>Mahamastakabhisheka</b>","Jain; every <b>12 years</b> at <b>Shravanabelagola</b>; 57-ft monolith of <b>Bahubali (Gommateshwara)</b>, son of Rishabhanatha; last 2018, next 2030"],["<b>Kambala</b>","Coastal Karnataka; <b>buffalo race</b> in slushy paddy fields"],["<b>Hampi Utsav</b>","Vijaya Utsav, at the Vijayanagara capital"],["<b>Karaga</b>","Bengaluru's oldest festival; 11 days, Mar–Apr; Dharmaraya Swamy temple; honours <b>Draupadi</b>; Thigala community; priest carries a flower pyramid dressed as a woman"],["<b>Gowri Habba</b>","Worship of Goddess Gauri, <b>one day before Ganesh Chaturthi</b>"],["<b>Gombe Habba</b>","'Festival of dolls' at Dasara; dolls in odd numbers"],["<b>Pattadakal Dance Festival</b>","January, at the Chalukya temples"],["<b>Banashankari fair</b>","Badami"]]},
 {k:"table", title:"Kodava (Coorg) festivals", head:["Festival","What is worshipped","When"], rows:[["<b>Puthari</b>","New rice (put = new, ari = rice); chant '<b>Poli Poli Deva</b>' (increase, O God); Lord <b>Igguthappa</b>; Ummathat dance","December"],["<b>Kailpodh</b>","Arms and weapons","September"],["<b>Kaveri Sankramana</b>","River Kaveri","October"]]},
 {k:"trap", h:"<b>Karaga — festival vs dance.</b> The Karaga festival is Bengaluru's (Karnataka); <b>Karagattam</b>, the pot-balancing dance, is Tamil Nadu's. In 'which is NOT celebrated in Rajasthan', Karaga is the odd one out."},
 {k:"q", q:"The Kodava harvest festival with chants of 'Poli Poli Deva' invoking Lord Igguthappa is…", o:["Puthari","Kailpodh","Kambala","Onam"], e:"Puthari — the new-rice festival. Kailpodh is weapon worship."},
 {k:"table", title:"Andhra Pradesh & Telangana", head:["Festival","Key fact"], rows:[["<b>Ugadi</b>","Telugu–Kannada New Year, Chaitra"],["<b>Sankranti</b> (Pedda Panduga)","4 days with the <b>Bhogi bonfire</b>; <b>Kanuma</b> day honours cattle"],["<b>Bathukamma</b>","Telangana; 9-day <b>floral festival</b> by women; starts on <b>Mahalaya Amavasya</b>; Goddess Gauri; Sep–Oct; 'Mother goddess, come alive'"],["<b>Bonalu</b>","Telangana; Goddess <b>Mahakali</b>; began <b>1813</b> after a <b>plague</b> in Hyderabad–Secunderabad; bonam offering; brother Pothuraju; state festival since 2014"],["<b>Tirupati Brahmotsavam</b>","9 days, Lord Venkateswara, Tirumala (Seshachalam hills)"],["<b>Sammakka–Saralamma Jatara</b>","Medaram, Telangana — among Asia's largest tribal fairs"],["<b>Yellamma Jatara</b>","Goddess Yellamma (Renuka), form of Shakti"],["<b>Perupalem Beach Festival</b>","Mogalthur, West Godavari; since 2020; 2 days; beach volleyball, <b>Burra Katha</b>"],["<b>Visakha Utsav</b>","Visakhapatnam, December"]]},
 {k:"trick", h:"<b>Jatara / Yatra</b> in a southern name → Telangana/Andhra; <b>Kunitha</b> → Karnataka. Bonalu ↔ Behdienkhlam: both began against plague."},
 {k:"q", q:"The first recorded origin of the Bonalu festival is traced to which disease outbreak in Hyderabad?", o:["Plague","Cholera","Smallpox","Malaria"], e:"A plague outbreak in 1813; Mahakali was prayed to and bonam offered."},
 {k:"q", q:"Which harvest festival in Andhra Pradesh and Telangana is celebrated for four days with the Bhogi bonfire?", o:["Sankranti","Bathukamma","Ugadi","Bonalu"], e:"A bonfire points to January — Sankranti. Bathukamma is Sep–Oct; Ugadi is Mar–Apr."}
], sum:["Karnataka: Mahamastakabhisheka (12 yrs, Shravanabelagola), Kambala (buffalo race), Karaga (Bengaluru, Draupadi), Gowri & Gombe Habba, Pattadakal; Kodava: Puthari, Kailpodh, Kaveri Sankramana.","AP/Telangana: Ugadi, Sankranti (Bhogi, Kanuma), Bathukamma (floral, Mahalaya), Bonalu (Mahakali, plague 1813), Tirupati Brahmotsavam, Perupalem beach festival."]},

{ id:"L11", title:"Maharashtra, Goa & Gujarat", hi:"महाराष्ट्र, गोवा, गुजरात", blocks:[
 {k:"table", title:"Maharashtra", head:["Festival","Key fact"], rows:[["<b>Gudi Padwa</b>","Marathi New Year (lunisolar); the <b>gudi</b> is a victory flag; neem-and-jaggery mix — life is bitter and sweet"],["<b>Ganesh Chaturthi</b>","Bhadrapada; birth of Ganesha; idols immersed"],["<b>Teej / Hartalika</b>","Goddess Parvati; festival of marital bliss; women fast"],["<b>Jivati Puja</b>","Married women worship Jivati (form of Parvati) every Friday of Shravan, for children's protection"],["<b>Kojagiri Purnima</b>","Sharad Purnima (Ashwin); <b>Goddess Lakshmi</b>; 'who is awake?'"],["<b>Narali Purnima</b>","Koli fishermen offer coconuts to the sea"],["<b>Vat Purnima</b>","Devotion of <b>Savitri</b>"],["<b>Banganga festival</b>","Mumbai; legend of Lord Ram and a freshwater tank"],["<b>Kala Ghoda Arts Festival</b>","Mumbai, 9 days"],["<b>Pola</b>","Bullock worship"],["<b>Elephanta festival</b>","Elephanta caves"]]},
 {k:"trap", h:"<b>Steno 2025 on Gudi Padwa:</b> (1) marks the Hindu New Year on the lunisolar calendar — <b>true</b>. (2) 'gudi' is a sacred scripture — <b>false</b> (it is a flag). (3) begins with eating sweets — <b>false</b> (neem and jaggery). Answer: <b>only 1</b>."},
 {k:"q", q:"Kojagiri Purnima, celebrated mainly in Maharashtra, is observed in honour of…", o:["Goddess Lakshmi","Lord Shiva","Lord Ganesha","Goddess Durga"], e:"Lakshmi visits at night to see who is awake (ko jagarti)."},
 {k:"trick", h:"<b>Goa:</b> “<b>तीन राजा</b> (Three Kings Feast) <b>St Francis Xavier</b> चर्च <b>अंगूर</b> (Grape Escapade) लेकर गए, Ola-Uber नहीं मिली, <b>सनबर्न</b> (Sunburn) हो गया और <b>बोर</b> (Bonderam) हो गए।”"},
 {k:"table", title:"Goa", head:["Festival","Key fact"], rows:[["<b>Shigmo</b>","Spring (Phalguna), 14 days; welcomes home warriors; <b>Ghode Modni</b> & <b>Fugdi</b> dances"],["<b>Sao Joao</b>","Feast of St John the Baptist; monsoon (June)"],["<b>Chikhal Kalo</b>","Mud festival; Lord Krishna's childhood; Devaki Krishna temple, Marcel"],["<b>Feast of St Francis Xavier</b>","3 December, Old Goa"],["<b>Three Kings Feast</b>","Epiphany, 6 January"],["<b>Bonderam</b>","Divar island, August"],["<b>Grape Escapade</b>","Wine festival"],["<b>Sunburn</b>","Asia's biggest electronic dance music festival"],["<b>Goa Carnival</b>","Before Lent"]]},
 {k:"q", q:"In which state is the mud festival Chikhal Kalo celebrated?", o:["Goa","Kerala","Maharashtra","Karnataka"], e:"Chikhal Kalo recalls Krishna playing in the mud."},
 {k:"trick", h:"<b>Gujarat:</b> “<b>शर्मा जी</b> (Shamlaji) <b>माधव</b> (Madhavpur) <b>से</b> (Modhera) <b>करवा चौथ</b> (Vautha) पर <b>रन</b> (Rann Utsav) कर रहे थे।”"},
 {k:"table", title:"Gujarat", head:["Festival","Key fact"], rows:[["<b>Rann Utsav</b>","White salt desert of Kutch; ~3 months in winter; tent city"],["<b>Madhavpur Mela</b>","Porbandar; marriage of Krishna and Rukmini"],["<b>Shamlaji Melo</b>","Lord Vishnu, November"],["<b>Modhera Dance Festival</b>","Modhera Sun Temple (Mehsana; Solanki, Maru-Gurjara style)"],["<b>Vautha Mela</b>","Animal (donkey & camel) trading fair"],["<b>Dang Darbar</b>","Tribal festival just before Holi"],["<b>Chitra-Vichitra</b>","Garasia & Bhil tribes"],["<b>Bhavnath Mela</b>","Junagadh; Lord Shiva"],["<b>Uttarayan</b>","Kite festival, 14 January"],["<b>Saptak Music Festival</b>","Ahmedabad; 13 days of classical music"],["<b>Navratri / Garba</b>","Garba on UNESCO's list (2023)"]]},
 {k:"q", q:"The Saptak music festival of Gujarat is held in which city?", o:["Ahmedabad","Vadodara","Surat","Rajkot"], e:"13 days of Indian classical music in Ahmedabad."}
], sum:["Maharashtra: Gudi Padwa (flag; neem + jaggery), Ganesh Chaturthi, Teej, Jivati, Kojagiri (Lakshmi), Narali Purnima (Kolis), Vat Purnima (Savitri).","Goa: Shigmo (warriors), Sao Joao, Chikhal Kalo (mud), St Francis Xavier (3 Dec), Three Kings, Bonderam (Divar), Sunburn.","Gujarat: Rann Utsav, Madhavpur (Krishna–Rukmini), Shamlaji, Modhera, Vautha, Dang Darbar, Saptak (Ahmedabad)."]},

{ id:"L12", title:"Rajasthan & Haryana — fairs and melas", hi:"राजस्थान और हरियाणा के मेले", blocks:[
 {k:"table", title:"Rajasthan", head:["Fair / festival","Key fact"], rows:[["<b>Pushkar Fair</b>","Ajmer; camel & livestock fair with religious rites; Kartik (Oct–Nov), ends Kartik Purnima"],["<b>Nagaur Fair</b>","Shri Ramdev cattle fair — <b>2nd-largest livestock fair</b>"],["<b>Kolayat Fair</b>","Bikaner; named after sage <b>Kapil Muni</b>; ritual bath at a lake ringed by banyan trees; Kartik Purnima"],["<b>Baneshwar Fair</b>","Dungarpur; Baneshwar Mahadev; 'Kumbh of the tribals' (Bhils)"],["<b>Baran Dol Mela</b>","Baran; processions of <b>Lord Shriji and Raghunathji</b> on Jal Jhulni Gyaras; traders from several states"],["<b>Gangaur</b>","Goddess Gauri; Mar–Apr; unmarried girls pray for a good husband, married women for family"],["<b>Teej</b>","Monsoon; Parvati; women fast"],["<b>Jaisalmer Desert Festival</b>","February, 3 days"],["<b>RIFF</b> (Rajasthan International Folk Festival)","Since 2007, <b>Mehrangarh Fort</b>, Jodhpur; 5 days from Sharad Purnima; UNESCO calls it a 'people's platform'"],["<b>Bundi Utsav</b>","Bundi"]]},
 {k:"trap", h:"<b>Pushkar is held in Kartik (Oct–Nov)</b>, around Kartik Purnima — the lecture said December. And the <b>largest</b> cattle fair is Sonepur (Bihar); Nagaur is second."},
 {k:"table", title:"Which fair trades what", head:["Fair","State","Known for"], rows:[["Sonepur","Bihar","Elephants; Asia's largest cattle fair"],["Pushkar","Rajasthan","Camels"],["Nagaur","Rajasthan","Cattle (2nd largest)"],["Nalwari","Himachal (Bilaspur)","Cattle, Luhnu ground"],["Vautha","Gujarat","Donkeys & camels"],["Surajkund","Haryana (Faridabad)","Handicrafts"],["Jonbeel","Assam","Barter"],["Jauljibi","Uttarakhand (Pithoragarh)","Trade, Gori–Kali confluence"]]},
 {k:"trap", h:"<b>PYQ statement:</b> 'Surajkund Mela focuses on elephant trading and circus' — <b>false</b>. That is Sonepur. Surajkund is a <b>crafts</b> fair."},
 {k:"q", q:"Which Rajasthan festival, named after a great sage, includes a ritual at a lake surrounded by banyan trees?", o:["Kolayat Fair","Pushkar Fair","Surajkund Mela","Jaisalmer Desert Festival"], e:"Kolayat (Kapil Muni) fair, Bikaner."},
 {k:"trick", h:"<b>Haryana:</b> “<b>सूरज</b> (Surajkund) की <b>पिन</b> (Pinjore) <b>गंगा</b> (Gangaur) में <b>गुम</b> (Gugga) हो गई।”"},
 {k:"table", title:"Haryana", head:["Festival","Key fact"], rows:[["<b>Surajkund Crafts Mela</b>","Faridabad, February"],["<b>Pinjore Heritage Festival</b>","Panchkula"],["<b>Gugga Naumi</b>","Gugga Pir — protector against snakes"],["<b>Gangaur</b>","Also Rajasthan & MP"]]},
 {k:"q", q:"Nagaur Fair, the second-largest livestock fair, is held in which state?", o:["Rajasthan","Gujarat","Haryana","Madhya Pradesh"], e:"Shri Ramdev cattle fair, Nagaur — where Panchayati Raj was inaugurated on 2 October 1959."}
], sum:["Rajasthan: Pushkar (camels, Kartik), Nagaur (2nd-largest livestock), Kolayat (Kapil Muni, Bikaner), Baneshwar (Kumbh of tribals), Baran Dol (Shriji & Raghunathji), RIFF (Mehrangarh, 2007), Gangaur, Teej.","Fairs: Sonepur elephants, Pushkar camels, Surajkund crafts, Jonbeel barter.","Haryana: Surajkund, Pinjore, Gugga, Gangaur."]},

{ id:"L13", title:"Punjab, Himachal & Uttarakhand", hi:"पंजाब, हिमाचल, उत्तराखंड", blocks:[
 {k:"table", title:"Punjab", head:["Festival","Key fact"], rows:[["<b>Baisakhi</b>","Guru Gobind Singh founded the <b>Khalsa</b> on Baisakhi, 1699; Sikh New Year; Jallianwala Bagh, 13 April 1919"],["<b>Hola Mohalla</b>","Day after Holi, 3 days, <b>Anandpur Sahib</b>; begun by Guru Gobind Singh (1701); martial arts (<b>Gatka</b>), langar, <b>Nihang</b> mock battles"],["<b>Gurpurab</b>","Birth anniversaries of the Gurus (Guru Nanak's on Kartik Purnima)"],["<b>Shaheedi Divas</b>","Martyrdom of <b>Guru Arjan Dev</b> (5th Guru), executed under Jahangir"],["<b>Bandi Chhor Divas</b>","Release of <b>Guru Hargobind</b> (6th Guru) with <b>52 kings</b> from Gwalior Fort; at Diwali"],["<b>Lohri</b>","13 January; bonfire"],["<b>Maghi</b>","Harvest, month of Magh (day after Lohri)"],["<b>Chhapar Mela</b>","Chhapar village, Ludhiana, September; <b>Gugga Pir</b>"]]},
 {k:"trap", h:"<b>Hola Mohalla starts the day after Holi</b> and is a martial festival — not a harvest festival 'before Diwali', and not 'mainly by women'. The PYQ answer: martial arts, langars and Nihang mock battles at Anandpur Sahib."},
 {k:"q", q:"Which Sikh festival commemorates the martyrdom of Guru Arjan Dev?", o:["Shaheedi Divas","Baisakhi","Hola Mohalla","Gurpurab"], e:"Guru Arjan Dev was executed in 1606 under Jahangir."},
 {k:"trick", h:"<b>Himachal:</b> “<b>हिम परी</b> (Pauri) को <b>हल्दी</b> (Halda) <b>फूल</b> (Phulaich) से <b>सजा दो</b> (Sazo), क्योंकि <b>कलिंजर</b> (Minjar) के <b>राजा</b> (Raulane) <b>महेश</b> (Mani Mahesh) आ रहे हैं।” Plus Dhungri, Kullu Dussehra, Nalwari, Phagli, Chaitrol, Losar."},
 {k:"table", title:"Himachal Pradesh", head:["Festival","Key fact"], rows:[["<b>Kullu Dussehra</b>","Lord <b>Raghunath</b>; week-long; no Ravana burning till the last day"],["<b>Minjar</b>","<b>Chamba</b>; week-long; Jul–Aug; onset of monsoon"],["<b>Halda</b>","Lahaul valley; Magh Purnima (Jan–Feb); Lahauli New Year; 'festival of lights'"],["<b>Phulaich</b> (Ukhyang)","<b>Kinnaur</b>; Bhadrapada; festival of flowers"],["<b>Losar</b>","Lahaul–Spiti Tibetan New Year with <b>Chham</b> mask dances"],["<b>Dhungri Mela</b>","<b>Hadimba Devi</b> temple, Manali (Hidimba, wife of Bhima); spring, 3 days"],["<b>Nalwari</b>","<b>Bilaspur</b>; cattle fair at Luhnu ground"],["<b>Phagli</b> (Kus/Kun)","Pattan valley (Lahaul); Phalguna; <b>symbolic indoor ploughing with willow sticks</b> — farming hopes in snow"],["<b>Raulane</b>","Kalpa (Kinnaur); ~5,000-year-old; thanks the <b>Saunis</b> (mountain fairies) for winter protection; symbolic divine marriage of Raula & Raulane, faces fully covered"],["<b>Chaitrol</b>","Sirmaur; Mar–Apr; 'festival of pictures'; dish Potlu"],["<b>Mani Mahesh Yatra</b>","Manimahesh lake, Chamba; Lord Shiva"],["<b>Sazo</b>","Kinnaur"]]},
 {k:"trap", h:"<b>Phagli PYQ (CGL 2025):</b> Baraza = bamboo stick with white cloth for <b>angels</b> (not Shikar Apa); Totu is made of <b>barley flour and buttermilk</b> (not wheat and honey). Correct: <b>Puh — indoor ploughing with willow sticks</b>."},
 {k:"q", q:"The Dhungri festival of Himachal Pradesh honours…", o:["Hadimba Devi","Goddess Chamunda","Lord Raghunath","Goddess Jwalamukhi"], e:"Hadimba (Hidimba), wife of Bhima, at her temple in Manali."},
 {k:"table", title:"Uttarakhand", head:["Festival","Key fact"], rows:[["<b>Phool Dei</b>","Kumaon; welcomes spring (Chaitra); young girls place the first flowers at doorsteps"],["<b>Syalde Bikhauti Mela</b>","Dwarahat (Almora); Vibhandeshwar temple; Vaishakh; <b>Oda Bhetna</b> stone-striking rite"],["<b>Kandali</b>","Chaudans valley, Pithoragarh; <b>Rung tribe</b>; every <b>12 years</b>; blooming of the Kandali plant"],["<b>Bissu Mela</b>","Week-long <b>Jaunsari</b> tribal fair, Chakrata (Dehradun); thanks for harvest; Santoora Devi"],["<b>Baithaki Holi</b>","Kumaon; sung sitting down, from Basant Panchami"],["<b>Jauljibi Mela</b>","Pithoragarh; trade fair at the Gori–Kali confluence, November"],["<b>Ghughutia</b>","Makar Sankranti; crows are fed"],["<b>Shakunakhar</b>","Kumaoni auspicious songs sung only by women at births, weddings"],["<b>Harela, Bhitauli</b>","Kumaoni folk festivals"],["<b>Ganga Dussehra</b>","May–June; Ganga's descent to earth"]]},
 {k:"q", q:"Which of these fairs is NOT associated with Uttarakhand?", o:["Pushkar","Jauljibi","Thal","Syalde Bikhauti"], e:"Pushkar is Rajasthan's. Jauljibi and Thal are Pithoragarh; Syalde Bikhauti is Dwarahat."}
], sum:["Punjab: Baisakhi (Khalsa 1699), Hola Mohalla (day after Holi, Anandpur Sahib), Shaheedi Divas (Arjan Dev), Bandi Chhor (Hargobind + 52 kings), Lohri, Maghi, Chhapar Mela (Gugga Pir).","HP: Kullu Dussehra (Raghunath), Minjar (Chamba), Halda (Lahaul), Phulaich (Kinnaur), Dhungri (Hadimba), Nalwari (Bilaspur cattle), Phagli (willow ploughing), Raulane, Chaitrol.","Uttarakhand: Phool Dei, Syalde Bikhauti (Oda Bhetna), Kandali (12 yrs), Bissu (Jaunsari), Baithaki Holi, Jauljibi."]},

{ id:"L14", title:"Ladakh, J&K, Delhi & Uttar Pradesh", hi:"लद्दाख, जम्मू-कश्मीर, दिल्ली, उत्तर प्रदेश", blocks:[
 {k:"table", title:"Ladakh", head:["Festival","Key fact"], rows:[["<b>Hemis</b>","Hemis monastery; Jun–Jul; birth anniversary of <b>Guru Padmasambhava</b>; Chham mask dance"],["<b>Losar</b>","New Year — earliest here (Dec); <b>dough models of the Sun, Moon and ibex</b> placed in homes"],["<b>Saka Dawa</b>","Ladakh's name for Saga Dawa — thrice-blessed"],["<b>Yuru Kabgyat</b>","Lamayuru monastery; 2 days; masked dances"],["<b>Dosmoche</b>","2 days; 'festival of the scapegoat'; Chham"],["<b>Spituk Gustor</b>","2-day winter festival"],["<b>Sindhu Darshan</b>","Banks of the Indus near Leh"]]},
 {k:"q", q:"Ladakh's New Year Losar is welcomed with symbolic dough models of the Sun, the Moon and…", o:["Ibex","Yak","Snow leopard","Buddha"], e:"The ibex, a wild mountain goat."},
 {k:"table", title:"J&K and Delhi", head:["Festival","Key fact"], rows:[["<b>Navreh</b>","Kashmiri Pandit New Year, first day of Chaitra"],["<b>Tulip Festival</b>","<b>Srinagar</b>, spring; Asia's largest tulip garden"],["<b>International Mango Festival</b>","<b>Delhi</b> (Dilli Haat, Janakpuri); since 1987; July; 1,000+ varieties"],["<b>Qutub Festival</b>","Delhi, at the Qutub Minar"]]},
 {k:"table", title:"Uttar Pradesh", head:["Festival","Key fact"], rows:[["<b>Kumbh Mela</b>","Rotates between <b>Prayagraj, Haridwar, Nashik, Ujjain</b> — where drops of amrit fell in the fight between gods and demons; UNESCO 2017"],["<b>Holi</b>","Festival of colours; <b>Raslila</b> and Lathmar Holi in Mathura–Vrindavan (Braj)"],["<b>Diwali</b>","Kartik Amavasya; Ram's return to Ayodhya"],["<b>Taj Mahotsav</b>","Agra, February"],["<b>Khichdi</b>","UP's name for Makar Sankranti"],["<b>Ganga Dussehra</b>","May–June, 10 days"],["<b>Chhath</b>","Eastern UP too"]]},

 {k:"q", q:"Why is the Kumbh Mela held only at four places?", o:["Drops of amrit fell there during the fight between gods and demons","Lord Vishnu performed miracles there","The first temples in India were built there","The Mahabharata was written there"], e:"From the samudra manthan legend."}
], sum:["Ladakh: Hemis (Padmasambhava), Losar (dough Sun, Moon, ibex), Saka Dawa, Yuru Kabgyat (Lamayuru), Dosmoche (scapegoat).","J&K/Delhi: Navreh, Tulip (Srinagar), Mango Festival (Delhi, 1987).","UP: Kumbh (Prayagraj, Haridwar, Nashik, Ujjain — not Varanasi), Raslila (Mathura Holi), Diwali, Taj Mahotsav, Khichdi."]},

 {k:"trick", h:"<b>Fourteen, twelve, nine, seven:</b> Kharchi = 14 deities; Mahamastakabhisheka & Kandali = 12 years; Bathukamma = 9 days; Kharchi & Garia = 7 days; Hornbill 1–10 Dec; Karaga & Chandanakkudam = 11 days."},

 {k:"q", q:"Which two festivals began as prayers against plague?", o:["Bonalu and Behdienkhlam","Ambubachi and Raja","Kang and Goncha","Wangala and Nongkrem"], e:"Bonalu (Hyderabad, 1813) and Behdienkhlam (behdien = drive away, khlam = plague)."}

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hash = s => { let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5)+h + s.charCodeAt(i))|0; return "q"+(h>>>0).toString(36); };
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; };
const L = id => LESSONS.find(l => l.id === id);
const LNUM = id => LESSONS.findIndex(l => l.id === id) + 1;

const QS = QB.map(r => {
  const fixed = !!r[6];
  return { t:r[0], q:r[1], o:r[2], e:r[3], p:(r[4]||"").includes("p"), a: fixed ? (r[5]||0) : 0, fixed, id:hash(r[1]) };
});
const byLesson = id => QS.filter(q => q.t === id);
// order of options to show: array of original indexes
const makePerm = q => q.fixed ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i));

const KEY = APP.key;

try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const record = (q, ok) => { S.ans[q.id] = ok ? 1 : 0; save(); renderTop(); };

function renderTop(){
  const ids = Object.keys(S.ans).filter(k => QS.some(q => q.id === k));
  const right = ids.filter(k => S.ans[k] === 1).length;
  const pct = ids.length ? Math.round(right*100/ids.length) : 0;
  $("#topstat").innerHTML = `<b>${ids.length}</b>/${QS.length} tried<br><b>${pct}%</b> right now`;
}

}));

  const nextIdx = LESSONS.findIndex(l => !(S.les[l.id] && S.les[l.id].done));

    <div class="hero">

    </div>

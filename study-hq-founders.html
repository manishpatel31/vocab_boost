{"id":"H2","heat":3,"title":"Money, trade and regional bodies","hi":"वित्तीय, व्यापार और क्षेत्रीय संगठन","blocks":[{"k":"hot","h":"Asked every year: <b>IMF and World Bank — Washington, D.C.<\/b>; <b>ADB — Manila<\/b>; <b>AIIB — Beijing<\/b>; <b>NDB — Shanghai<\/b>; <b>ASEAN — Jakarta<\/b>; <b>SAARC — Kathmandu<\/b>; <b>BIMSTEC — Dhaka<\/b>; <b>Interpol — Lyon<\/b>; <b>International Solar Alliance — Gurugram<\/b>."},{"k":"story","h":"<p>At <b>Bretton Woods<\/b> in 1944 the world planned two twin bodies — the <b>IMF<\/b> and the <b>World Bank<\/b> — and both sit in <b>Washington, D.C.<\/b> Asia built its own banks later: the <b>ADB<\/b> in <b>Manila<\/b> (1966), the <b>AIIB<\/b> in <b>Beijing<\/b> and the BRICS <b>New Development Bank<\/b> in <b>Shanghai<\/b>. Trade rules are kept by the <b>WTO<\/b> in <b>Geneva<\/b>.<\/p><p>Each region has a home city: <b>ASEAN<\/b> in Jakarta, <b>SAARC<\/b> in Kathmandu, <b>BIMSTEC<\/b> in Dhaka, the <b>EU<\/b> and <b>NATO<\/b> in Brussels, the <b>African Union<\/b> in Addis Ababa. India hosts one world body of its own — the <b>International Solar Alliance<\/b>, at <b>Gurugram<\/b>.<\/p>","key":"Washington twins = IMF + World Bank; Asian banks = Manila, Beijing, Shanghai; Jakarta = ASEAN; Kathmandu = SAARC; Dhaka = BIMSTEC; Gurugram = ISA."},{"k":"table","title":"World bodies and their headquarters","head":["Body","Headquarters","Note"],"rows":[["IMF (International Monetary Fund)","Washington, D.C.","Born at Bretton Woods, 1944, with the World Bank."],["World Bank","Washington, D.C.","Its first arm, the IBRD, was set up at Bretton Woods, 1944."],["WTO (World Trade Organization)","Geneva","1 January 1995; replaced GATT."],["Asian Development Bank","Manila","1966; HQ in Mandaluyong, Metro Manila, Philippines."],["Asian Infrastructure Investment Bank (AIIB)","Beijing","Began work in 2016; India is the second-largest shareholder."],["New Development Bank (BRICS bank)","Shanghai","Agreed at the 2014 BRICS summit (Fortaleza); first presi {"id":"H3","heat":3,"title":"Sports bodies and their headquarters","hi":"खेल संगठन और मुख्यालय","blocks":[{"k":"hot","h":"Most asked: <b>FIFA — Zurich<\/b>, <b>IOC — Lausanne<\/b>, <b>ICC — Dubai<\/b>, <b>FIDE — Lausanne<\/b>, <b>BWF — Kuala Lumpur<\/b>, <b>World Athletics — Monaco<\/b>. In India: <b>BCCI — Mumbai<\/b>, <b>SAI — New Delhi<\/b>, <b>NIS — Patiala<\/b>."},{"k":"story","h":"<p>Most of world sport is run from one small Swiss city — <b>Lausanne<\/b>, the 'Olympic Capital'. The <b>IOC<\/b> moved there in 1915, and the chess (<b>FIDE<\/b>), hockey (<b>FIH<\/b>), table tennis (<b>ITTF<\/b>) and volleyball bodies followed, along with the <b>Court of Arbitration for Sport<\/b>. Football's <b>FIFA<\/b> sits in <b>Zurich<\/b>, Europe's <b>UEFA<\/b> in <b>Nyon<\/b>.<\/p><p>Cricket's <b>ICC<\/b> left Lord's for <b>Dubai<\/b> in 2005. Badminton's <b>BWF<\/b> is in <b>Kuala Lumpur<\/b>, and athletics is run from <b>Monaco<\/b>. In India, the <b>BCCI<\/b> is in <b>Mumbai<\/b>, the <b>Sports Authority of India<\/b> in <b>New Delhi<\/b>, and coaches train at <b>NIS Patiala<\/b>.<\/p>","key":"Lausanne = IOC, FIDE, FIH, ITTF, CAS; Zurich = FIFA; Dubai = ICC; Kuala Lumpur = BWF; Monaco = athletics; Mumbai = BCCI."},{"k":"table","title":"World sports bodies","head":["Body","Headquarters","Note"],"rows":[["FIFA (football)","Zurich","Founded in Paris, 1904."],["International Olympic Committee","Lausanne","1894, Pierre de Coubertin; Lausanne is the 'Olympic Capital'."],["International Cricket Council (ICC)","Dubai","1909 as the Imperial Cricket Conference; moved from Lord's (London) in 2005."],["FIDE (chess)","Lausanne","Founded in Paris, 1924."],["Badminton World Federation (BWF)","Kuala Lumpur","1934 (moved from Cheltenham, England, in 2005)."],["ITTF (table tennis)","Lausanne","1926."],["World Athletics","Monaco","1912 (formerly IAAF)."],["FIH (hockey)","Lausanne","1924."],["UEFA (European football)","Nyon","1954."],["FIBA (basketball)","Mies","1932."],["UCI (cycling)","Ai uropean football (Nyon) · FIBA – basketball (Mies)"],["7 London","International Tennis Federation · Commonwealth Games Federation"],["8 Zurich","FIFA – football"],["9 Monaco","World Athletics"],["10 Munich","ISSF – shooting"],["11 Dublin","World Rugby"]]},{"k":"table","title":"Indian sports bodies","head":["Body","Headquarters","Note"],"rows":[["BCCI (Board of Control for Cricket in India)","Mumbai","1928; at the Cricket Centre, Wankhede Stadium."],["Sports Authority of India","New Delhi","1984; at the Jawaharlal Nehru Stadium."],["Netaji Subhas National Institute of Sports","Patiala","1961 — India's main sports coaching institute."],["Lakshmibai National Institute of Physical Education","Gwalior","1957."],["National Sports University","Imphal","India's first national sports university (2018)."],["Lakshmibai National College of Physical Education","Thiruvananthapuram","1985."],["All India Football Federation","New Delhi","1937; HQ at Dwarka."],["National Anti-Doping Agency (NADA)","New Delhi","2005."]]},{"k":"mapfig","title":"Indian sports bodies on the map","cap":"NIS Patiala trains coaches; LNIPE is at Gwalior; the National Sports University is at Imphal.","pins":[["1",77.21,28.61,"Delhi NCR: Sports Authority of India, All India Football Federation, National Anti-Doping Agency","n"],["2",72.88,19.08,"Mumbai: BCCI","n"],["3",76.39,30.34,"Patiala: Netaji Subhas National Institute of Sports","n"],["4",78.18,26.22,"Gwalior: Lakshmibai National Institute of Physical Education","n"],["5",93.94,24.81,"Imphal: National Sports University","n"],["6",76.95,8.52,"Thiruvananthapuram: Lakshmibai National College of Physical Education","n"]],"facts":[["1 · Delhi NCR","Sports Authority of India · All India Football Federation · National Anti-Doping Agency"],["2 · Mumbai","BCCI"],["3 · Patiala","Netaji Subhas National Institute of Sports"],["4 · Gwalior","Lakshmibai National Institute of Physical Education"],["5 · Imphal","National Sports University"],["6 · Thiruvananthapuram","Lakshmibai National College of Physical Education"]]},{"k":"trick","h":"<b>“FIFA eats Zurich chocolate, the IOC lives by Lake Geneva in Lausanne”<\/b>. <b>“Cricket went to the desert”<\/b> — ICC to Dubai, 2005."},{"k":"trap","h":"<b>FIFA<\/b> was founded in Paris but is in <b>Zurich<\/b>; the <b>IOC<\/b> was founded in Paris but is in <b>Lausanne<\/b>. <b>UEFA<\/b> is in Nyon, not Zurich. <b>WADA<\/b> is in Montreal (like ICAO). The <b>BCCI<\/b> is in Mumbai, not New Delhi."}],"sum":["FIFA — Zurich; UEFA — Nyon; IOC, FIDE, FIH, ITTF and CAS — Lausanne.","ICC — Dubai (since 2005); BWF — Kuala Lumpur; World Athletics — Monaco.","ITF and Commonwealth Games Federation — London; WADA — Montreal.","Olympic Council of Asia — Kuwait City; ISSF — Munich.","BCCI — Mumbai; SAI and AIFF — New Delhi; NIS — Patiala; National Sports University — Imphal."],"part":["Part 1 · World organisations","विश्व संगठन"],"g":"hq"},
{"id":"H4","heat":3,"title":"Space, atomic and science institutes","hi":"अंतरिक्ष, परमाणु और विज्ञान संस्थान","blocks":[{"k":"hot","h":"Most asked: <b>ISRO — Bengaluru<\/b>, <b>BARC — Mumbai (Trombay)<\/b>, <b>Survey of India — Dehradun<\/b>, <b>ZSI, BSI and GSI — Kolkata<\/b>, <b>NIO — Goa<\/b>, <b>IMD — New Delhi<\/b>, <b>CFTRI — Mysuru<\/b>, <b>Sriharikota<\/b> for launches."},{"k":"story","h":"<p>India's space story begins in a church at <b>Thumba<\/b> near Thiruvananthapuram, where the first rocket rose in 1963. <b>Vikram Sarabhai<\/b> had founded the <b>Physical Research Laboratory<\/b> in Ahmedabad in 1947, and <b>ISRO<\/b> followed in 1969 with its home in <b>Bengaluru<\/b>. Rockets are built at the <b>Vikram Sarabhai Space Centre<\/b> and launched from <b>Sriharikota<\/b>. Homi Bhabha's atomic research centre (<b>BARC<\/b>) stands at <b>Trombay<\/b>, Mumbai.<\/p><p>Older still are the great surveys. The <b>Survey of India<\/b> (1767, Dehradun) mapped the land; the <b>Geological<\/b> (1851), <b>Botanical<\/b> (1890) and <b>Zoological<\/b> (1916) surveys all sit in <b>Kolkata<\/b>. Weather comes from the <b>IMD<\/b> in New Delhi, and the sea is studied at the <b>National Institute of Oceanography<\/b> in Goa.<\/p>","key":"ISRO — Bengaluru; VSSC — Thiruvananthapuram; launches — Sriharikota; BARC — Mumbai; Survey of India — Dehradun; GSI, ZSI, BSI — Kolkata."},{"k":"table","title":"Space, atomic and science centres","head":["Institute","Located in","Note"],"rows":[["ISRO (Indian Space Research Organisation)","Bengaluru","Founded 15 August 1969; HQ Antariksh Bhavan."],["Vikram Sarabhai Space Centre","Thiruvananthapuram","ISRO's lead centre for launch vehicles; grew from the Thumba rocket station (1963)."],["Satish Dhawan Space Centre (launch site)","Sriharikota","India's spaceport, in Andhra Pradesh."],["Space Applications Centre","Ahmedabad","Builds satellite payloads."],["Physical Research Laboratory","Ahmedabad","Founded 1947 by Vikram Sarabhai — 'cradle of space science in India'."],["National Remote Sensing Centre","Hyderabad",""],["ISRO Propulsion Complex","Mahendragiri","Tamil Nadu; tests rocket engines."],["Bhabha Atomic Research Centre (BARC)","Mumbai","At Trombay; set up 1954, renamed after Homi Bhabha in 1967."],["Indira Gandhi Centre for Atomic Research","Kalpakkam","Tamil Nadu; fast breeder reactors."],["DRDO","New Delhi","1958."],["Indian Institute of Science","Bengaluru","1909, founded with help from Jamsetji Tata."]]},{"k":"mapfig","title":"Space and atomic centres on the map","cap":"ISRO and IISc are in Bengaluru; rockets go up from Sriharikota; BARC is in Mumbai and IGCAR at Kalpakkam.","pins":[["1",77.59,12.97,"Bengaluru: ISRO, Indian Institute of Science","n"],["2",72.57,23.02,"Ahmedabad: Space Applications Centre, Physical Research Laboratory","n"],["3",76.95,8.52,"Thiruvananthapuram: Vikram Sarabhai Space Centre","n"],["4",80.23,13.72,"Sriharikota: Satish Dhawan Space Centre","n"],["5",78.49,17.39,"Hyderabad: National Remote Sensing Centre","n"],["6",77.5,8.39,"Mahendragiri: ISRO Propulsion Complex","n"],["7",72.88,19.08,"Mumbai: Bhabha Atomic Research Centre","n"],["8",80.16,12.53,"Kalpakkam: Indira Gandhi Centre for Atomic Research","n"],["9",77.21,28.61,"Delhi NCR: DRDO","n"]],"facts":[["1 · Bengaluru","ISRO · Indian Institute of Science"],["2 · Ahmedabad","Space Applications Centre · Physical Research Laboratory"],["3 · Thiruvananthapuram","Vikram Sarabhai Space Centre"],["4 · Sriharikota","Satish Dhawan Space Centre"],["5 · Hyderabad","National Remote Sensing Centre"],["6 · Mahendragiri","ISRO Propulsion Complex"],["7 · Mumbai","Bhabha Atomic Research Centre"],["8 · Kalpakkam","Indira Gandhi Centre for Atomic Research"],["9 · Delhi NCR","DRDO"]]},{"k":"table","title":"CSIR labs, surveys and earth-science bodies","head":["Institute","Headquarters","Note"],"rows":[["CSIR (Council of Scientific and Industrial Research)","New Delhi","1942; runs about 37 national labs."],["National Physical Laboratory","New Delhi","Keeps Indian Standard Time."],["National Chemical Laboratory","Pune",""],["Indian Institute of Tropical Meteorology","Pune","Monsoon research."],["Centre for Cellular and Molecular Biology","Hyderabad",""],["National Geophysical Research Institute","Hyderabad",""],["Central Drug Research Institute","Lucknow",""],["National Botanical Research Institute","Lucknow",""],["Central Food Technological Research Institute","Mysuru",""],["Central Leather Research Institute","Chennai",""],["National Environmental Engineering Research Institute","Nagpur",""],["Central Electronics Engineering Research Institute","Pilani",""],["National Institute of Oceanography","Dona Paula (Goa)","1966."],["National Centre for Polar and Ocean Research","Vasco da Gama (Goa)","Runs India's Antarctic and Arctic stations."],["India Meteorological Department","New Delhi","1875; HQ Mausam Bhawan."],["Survey of India","Dehradun","1767 — India's oldest scientific department."],["Geological Survey of India","Kolkata","1851."],["Zoological Survey of India","Kolkata","1916."],["Botanical Survey of India","Kolkata","1890."],["Forest Research Institute","Dehradun","1906."],["Wildlife Institute of India","Dehradun",""]]},{"k":"mapfig","title":"CSIR labs and surveys on the map","cap":"Dehradun: Survey of India, Forest Research Institute, Wildlife Institute. Kolkata: the Geological, Zoological and Botanical Surveys.","pins":[["1",77.21,28.61,"Delhi NCR: CSIR, National Physical Laboratory, India Meteorological Department","n"],["2",78.03,30.32,"Dehradun: Survey of India, Forest Research Institute, Wildlife Institute of India","n"],["3",88.36,22.57,"Kolkata: Geological Survey of India, Zoological Survey of India, Botanical Survey of India","n"],["4",73.86,18.52,"Pune: National Chemical Laboratory, Indian Institute of Tropical Meteorology","n"],["5",78.49,17.39,"Hyderabad: Centre for Cellular and Molecular Biology, National Geophysical Research Institute","n"],["6",80.95,26.85,"Lucknow: Central Drug Research Institute, National Botanical Research Institute","n"],["7",73.8,15.4,"Goa: National Institute of Oceanography (Dona Paula), National Centre for Polar and Ocean Research (Vasco da Gama)","n"],["8",76.64,12.3,"Mysuru: Central Food Technological Research Institute","n"],["9",80.27,13.08,"Chennai: Central Leather Research Institute","n"],["10",79.09,21.15,"Nagpur: National Environmental Engineering Research Institute","n"],["11",75.6,28.37,"Pilani: Central Electronics Engineering Research Institute","n"]],"facts":[["1 · Delhi NCR","CSIR · National Physical Laboratory · India Meteorological Department"],["2 · Dehradun","Survey of India · Forest Research Institute · Wildlife Institute of India"],["3 · Kolkata","Geological Survey of India · Zoological Survey of India · Botanical Survey of India"],["4 · Pune","National Chemical Laboratory · Indian Institute of Tropical Meteorology"],["5 · Hyderabad","Centre for Cellular and Molecular Biology · National Geophysical Research Institute"],["6 · Lucknow","Central Drug Research Institute · National Botanical Research Institute"],["7 · Goa","National Institute of Oceanography (Dona Paula) · National Centre for Polar and Ocean Research (Vasco da Gama)"],["8 · Mysuru","Central Food Technological Research Institute"],["9 · Chennai","Central Leather Research Institute"],["10 · Nagpur","National Environmental Engineering Research Institute"],["11 · Pilani","Central Electronics Engineering Research Institute"]]},{"k":"trick","h":"<b>“Kolkata keeps the three G-Z-B surveys”<\/b> — Geological, Zoological, Botanical. <b>“Dehradun draws maps and trees”<\/b> — Survey of India, Forest Research Institute, Wildlife Institute. <b>“Lucknow cures with plants”<\/b> — CDRI (drugs), NBRI (botany)."},{"k":"trap","h":"<b>ISRO<\/b> is in Bengaluru, but rockets fly from <b>Sriharikota<\/b> (Andhra Pradesh) and are designed in <b>Thiruvananthapuram<\/b>. <b>BARC<\/b> is in Mumbai; the fast-breeder centre is at <b>Kalpakkam<\/b>. <b>CFTRI<\/b> (food) is in Mysuru, not Bengaluru. The <b>Survey of India<\/b> is in Dehradun, not Kolkata."}],"sum":["ISRO — Bengaluru (1969); VSSC — Thiruvananthapuram; SDSC — Sriharikota; SAC and PRL — Ahmedabad.","BARC — Trombay, Mumbai; IGCAR — Kalpakkam; IISc — Bengaluru.","CSIR, NPL and IMD — New Delhi; NCL and IITM — Pune; CFTRI — Mysuru; CDRI — Lucknow.","Survey of India, FRI and WII — Dehradun; GSI, ZSI and BSI — Kolkata.","NIO — Dona Paula, Goa; NCPOR — Vasco da Gama, Goa."],"part":["Part 2 · Indian institutions","भारतीय संस्थान"],"g":"hq"},
{"id":"H5","heat":2,"title":"Farm and health research, commodity boards","hi":"कृषि व स्वास्थ्य अनुसंधान, वस्तु बोर्ड","blocks":[{"k":"hot","h":"Pair the crop with its city: <b>potato — Shimla<\/b>, <b>rice — Cuttack<\/b>, <b>dairy — Karnal<\/b>, <b>camel — Bikaner<\/b>, <b>spices — Kozhikode<\/b>, <b>sugarcane — Lucknow / Coimbatore<\/b>. Boards: <b>Tea — Kolkata<\/b>, <b>Coffee — Bengaluru<\/b>, <b>Rubber — Kottayam<\/b>, <b>Spices and Coir — Kochi<\/b>."},{"k":"story","h":"<p>Farm science in India is run by the <b>ICAR<\/b> from New Delhi. Its institutes sit where the crop grows: <b>potatoes<\/b> in the hills at <b>Shimla<\/b>, <b>rice<\/b> on the Mahanadi delta at <b>Cuttack<\/b>, <b>dairy<\/b> at <b>Karnal<\/b>, <b>camels<\/b> in the desert at <b>Bikaner<\/b>, <b>spices<\/b> on the Malabar coast at <b>Kozhikode<\/b> and <b>coconut<\/b> at <b>Kasaragod<\/b>. Medical research is led by the <b>ICMR<\/b> (1911), whose <b>National Institute of Virology<\/b> is in Pune.<\/p><p>The commodity boards follow the same logic. <b>Tea<\/b> is run from <b>Kolkata<\/b> (Assam and Darjeeling), <b>coffee<\/b> and <b>silk<\/b> from <b>Bengaluru<\/b>, <b>rubber<\/b> from <b>Kottayam<\/b>, and <b>spices<\/b> and <b>coir<\/b> from <b>Kochi<\/b>. Milk's <b>NDDB<\/b> is at <b>Anand<\/b>, the home of Amul.<\/p>","key":"Potato — Shimla; rice — Cuttack; dairy — Karnal; camel — Bikaner; tea — Kolkata; coffee — Bengaluru; rubber — Kottayam; spices — Kochi; NDDB — Anand."},{"k":"table","title":"Farm and health research institutes","head":["Institute","Headquarters","Note"],"rows":[["ICAR (Indian Council of Agricultural Research)","New Delhi","1929."],["Indian Agricultural Research Institute (Pusa Institute)","New Delhi","Started at Pusa, Bihar (1905); moved to Delhi after the 1934 earthquake."],["ICMR (Indian Council of Medical Research)","New Delhi","1911 — one of the oldest medical research bodies in the world."],["National Dairy Research Institute","Karnal","Haryana."],["Central Soil Salinity Research Institute","Karnal",""],["Central Arid Zone Research Institute","Jodhpur",""],["Central Potato Research Institute","Shimla",""],["Indian Institute of Sugarcane Research","Lucknow",""],["Sugarcane Breeding Institute","Coimbatore",""],["National Rice Research Institute","Cuttack","1946 (Central Rice Research Institute)."],["Central Institute for Cotton Research","Nagpur",""],["Indian Institute of Pulses Research","Kanpur",""],["Indian Institute of Vegetable Research","Varanasi",""],["Indian Institute of Spices Research","Kozhikode",""],["Central Plantation Crops Research Institute","Kasaragod","Coconut, arecanut, cocoa."],["Central Marine Fisheries Research Institute","Kochi",""],["National Research Centre on Camel","Bikaner",""],["Central Institute for Research on Buffaloes","Hisar",""],["Indian Veterinary Research Institute","Izatnagar (Bareilly)","1889."],["National Institute of Virology","Pune","ICMR lab; isolated India's first COVID-19 virus sample."]]},{"k":"mapfig","title":"Farm and health research on the map","cap":"Match the crop to the place: rice — Cuttack, potato — Shimla, sugarcane — Lucknow and Coimbatore, spices — Kozhikode, camel — Bikaner.","pins":[["1",77.21,28.61,"Delhi NCR: ICAR, Indian Agricultural Research Institute, ICMR","n"],["2",76.99,29.69,"Karnal: National Dairy Research Institute, Central Soil Salinity Research Institute","n"],["3",73.02,26.24,"Jodhpur: Central Arid Zone Research Institute","n"],["4",77.17,31.1,"Shimla: Central Potato Research Institute","n"],["5",80.95,26.85,"Lucknow: Indian Institute of Sugarcane Research","n"],["6",76.96,11.02,"Coimbatore: Sugarcane Breeding Institute","n"],["7",85.88,20.46,"Cuttack: National Rice Research Institute","n"],["8",79.09,21.15,"Nagpur: Central Institute for Cotton Research","n"],["9",80.33,26.45,"Kanpur: Indian Institute of Pulses Research","n"],["10",82.97,25.32,"Varanasi: Indian Institute of Vegetable Research","n"],["11",75.78,11.26,"Kozhikode: Indian Institute of Spices Research","n"],["12",75,12.5,"Kasaragod: Central Plantation Crops Research Institute","n"],["13",76.27,9.93,"Kochi: Central Marine Fisheries Research Institute","n"],["14",73.31,28.02,"Bikaner: National Research Centre on Camel","n"],["15",75.72,29.15,"Hisar: Central Institute for Research on Buffaloes","n"],["16",79.43,28.37,"Bareilly: Indian Veterinary Research Institute (Izatnagar)","n"],["17",73.86,18.52,"Pune: National Institute of Virology","n"]],"facts":[["1 · Delhi NCR","ICAR · Indian Agricultural Research Institute · ICMR"],["2 · Karnal","National Dairy Research Institute · Central Soil Salinity Research Institute"],["3 · Jodhpur","Central Arid Zone Research Institute"],["4 · Shimla","Central Potato Research Institute"],["5 · Lucknow","Indian Institute of Sugarcane Research"],["6 · Coimbatore","Sugarcane Breeding Institute"],["7 · Cuttack","National Rice Research Institute"],["8 · Nagpur","Central Institute for Cotton Research"],["9 · Kanpur","Indian Institute of Pulses Research"],["10 · Varanasi","Indian Institute of Vegetable Research"],["11 · Kozhikode","Indian Institute of Spices Research"],["12 · Kasaragod","Central Plantation Crops Research Institute"],["13 · Kochi","Central Marine Fisheries Research Institute"],["14 · Bikaner","National Research Centre on Camel"],["15 · Hisar","Central Institute for Research on Buffaloes"],["16 · Bareilly","Indian Veterinary Research Institute (Izatnagar)"],["17 · Pune","National Institute of Virology"]]},{"k":"table","title":"Commodity boards","head":["Board","Headquarters","Note"],"rows":[["Tea Board","Kolkata","1954."],["Coffee Board","Bengaluru","1942."],["Rubber Board","Kottayam","1947."],["Spices Board","Kochi","1987."],["Coir Board","Kochi","1953."],["Central Silk Board","Bengaluru","1948."],["National Jute Board","Kolkata",""],["Tobacco Board","Guntur",""],["National Dairy Development Board","Anand","1965; Verghese Kurien was its first chairman."],["MPEDA (Marine Products Export Development Authority)","Kochi", {"id":"H6","heat":3,"title":"Banks and financial bodies","hi":"बैंक और वित्तीय संस्थान","blocks":[{"k":"hot","h":"Banking-awareness classics: <b>RBI, SEBI, NABARD, EXIM, NPCI, LIC — Mumbai<\/b>; <b>SIDBI — Lucknow<\/b>; <b>IRDAI — Hyderabad<\/b>; <b>Bank of Baroda — Vadodara<\/b>; <b>Canara Bank — Bengaluru<\/b>; <b>PNB — New Delhi<\/b>; <b>UCO — Kolkata<\/b>."},{"k":"story","h":"<p>Most of India's money lives in <b>Mumbai<\/b>. The <b>Reserve Bank<\/b> opened in Calcutta in 1935 but moved to Bombay in 1937, and the market regulator <b>SEBI<\/b>, the farm bank <b>NABARD<\/b>, the <b>EXIM Bank<\/b>, <b>LIC<\/b> and the UPI-maker <b>NPCI<\/b> are all there too. Two regulators break the rule: small industry's <b>SIDBI<\/b> is in <b>Lucknow<\/b>, and the insurance regulator <b>IRDAI<\/b> is in <b>Hyderabad<\/b>.<\/p><p>Each public sector bank carries its birthplace: <b>Bank of Baroda<\/b> in Vadodara (the old Baroda state), <b>Canara Bank<\/b> in Bengaluru, <b>Indian Bank<\/b> and <b>Indian Overseas Bank<\/b> in Chennai, <b>UCO Bank<\/b> in Kolkata, <b>Bank of Maharashtra<\/b> in Pune, and <b>Punjab National Bank<\/b> — founded in Lahore — now in New Delhi.<\/p>","key":"Mumbai = RBI, SEBI, NABARD, EXIM, NPCI, LIC, SBI; Lucknow = SIDBI; Hyderabad = IRDAI; Vadodara = BoB; Chennai = Indian Bank, IOB."},{"k":"table","title":"Regulators and financial institutions","head":["Body","Headquarters","Note"],"rows":[["Reserve Bank of India","Mumbai","Set up 1 April 1935 in Calcutta; moved to Bombay in 1937."],["SEBI","Mumbai","1988; statutory powers in 1992."],["NABARD","Mumbai","1982."],["EXIM Bank","Mumbai","1982."],["SIDBI","Lucknow","1990 — the only one of these based in Lucknow."],["National Housing Bank","New Delhi","1988."],["IRDAI (insurance regulator)","Hyderabad","1999."],["PFRDA (pension regulator)","New Delhi","2003."],["National Payments Corporation of India (UPI, RuPay)","Mumbai","2008."],["Life Insurance Corporation of India","Mumbai","1956."],["Bureau of Indian Standards","New Delhi","1986 (as ISI in 1947)."]]},{"k":"table","title":"Public sector banks","head":["Bank","Headquarters","Note"],"rows":[["State Bank of India","Mumbai","1955 (from the Imperial Bank of India)."],["Punjab National Bank","New Delhi","Founded 1894 in Lahore — first Indian bank run with Indian capital alone."],["Bank of Baroda","Vadodara","1908, Maharaja Sayajirao Gaekwad III."],["Canara Bank","Bengaluru","1906, Mangaluru."],["Indian Bank","Chennai","1907."],["Indian Overseas Bank","Chennai","1937."],["UCO Bank","Kolkata","1943."],["Bank of Maharashtra","Pune","1935."],["Union Bank of India","Mumbai","1919, inaugurated by Mahatma Gandhi."],["Punjab & Sind Bank","New Delhi","1908."],["Bank of India","Mumbai","1906."],["Central Bank of India","Mumbai","1911 — the first fully Indian-owned commercial bank."]]},{"k":"bars","title":"Where the banks and regulators sit","left":120,"hi":1,"rows":[["Mumbai",10,"Reserve Bank, SEBI, NABARD…"],["Lucknow",1,"SIDBI"],["New Delhi",5,"National Housing Bank, PFRDA, Bureau of Indian Standards…"],["Hyderabad",1,"IRDAI"],["Vadodara",1,"Bank of Baroda"],["Bengaluru",1,"Canara Bank"],["Chennai",2,"Indian Bank, Indian Overseas Bank"],["Kolkata",1,"UCO Bank"],["Pune",1,"Bank of Maharashtra"]],"cap":"Mumbai is India's financial capital: RBI, SEBI, NABARD, EXIM Bank, NPCI, LIC and five public sector banks. The odd ones out: SIDBI (Lucknow), IRDAI (Hyderabad), Bank of Baroda (Vadodara)."},{"k":"trick","h":"<b>“Small lions live in Lucknow”<\/b> — SIDBI (small industries). <b>“Insure in Hyderabad”<\/b> — IRDAI. The two Chennai banks both start with <b>“Indian”<\/b> — Indian Bank and Indian Overseas Bank."},{"k":"trap","h":"<b>SIDBI<\/b> is in <b>Lucknow<\/b>, not Mumbai. <b>IRDAI<\/b> moved to <b>Hyderabad<\/b>; the pension regulator <b>PFRDA<\/b> is in New Delhi. The RBI's <b>first<\/b> office was in <b>Calcutta<\/b> (1935). <b>PNB<\/b> was founded in <b>Lahore<\/b>."}],"sum":["RBI (1935), SEBI, NABARD, EXIM Bank, NPCI and LIC — Mumbai.","SIDBI — Lucknow; IRDAI — Hyderabad; PFRDA and National Housing Bank — New Delhi.","SBI, Bank of India, Central Bank, Union Bank — Mumbai; PNB, Punjab & Sind — New Delhi.","Bank of Baroda — Vadodara; Canara Bank — Bengaluru; Bank of Maharashtra — Pune.","Indian Bank and Indian Overseas Bank — Chennai; UCO Bank — Kolkata."],"part":["Part 2 · Indian institutions","भारतीय संस्थान"],"g":"hq"},
{"id":"H7","heat":3,"title":"Founders of Indian companies","hi":"भारतीय कंपनियों के संस्थापक","blocks":[{"k":"hot","h":"Asked often: <b>Infosys — N. R. Narayana Murthy<\/b>, <b>Flipkart — Sachin and Binny Bansal<\/b>, <b>Paytm — Vijay Shekhar Sharma<\/b>, <b>Zomato — Deepinder Goyal<\/b>, <b>OYO — Ritesh Agarwal<\/b>, <b>Nykaa — Falguni Nayar<\/b>, <b>Tata — Jamsetji Tata<\/b>, <b>Reliance — Dhirubhai Ambani<\/b>."},{"k":"story","h":"<p>Modern Indian industry starts with <b>Jamsetji Tata<\/b>, who founded his trading firm in Bombay in <b>1868<\/b> and dreamt of a steel plant, a science institute (IISc) and a hydro-power company. <b>Dhirubhai Ambani<\/b> began trading yarn in Bombay and built <b>Reliance<\/b>. In <b>1981<\/b>, <b>N. R. Narayana Murthy<\/b> and six friends started <b>Infosys<\/b> in Pune with ₹10,000; <b>Shiv Nadar<\/b> had started <b>HCL<\/b> in 1976.<\/p><p>The internet age brought a new wave. Two IIT Delhi graduates, <b>Sachin and Binny Bansal<\/b>, began <b>Flipkart<\/b> in 2007 selling books; <b>Vijay Shekhar Sharma<\/b> launched <b>Paytm<\/b> in 2010; <b>Deepinder Goyal<\/b> started <b>Zomato<\/b> as Foodiebay in 2008; teenage <b>Ritesh Agarwal<\/b> founded <b>OYO<\/b> in 2013, and <b>Falguni Nayar<\/b> left banking to build <b>Nykaa<\/b> in 2012.<\/p>","key":"Tata — Jamsetji (1868); Reliance — Dhirubhai; Infosys — Narayana Murthy (1981); HCL — Shiv Nadar; Flipkart — Bansals (2007); Paytm — Vijay Shekhar Sharma."},{"k":"photos","title":"Founders in pictures","items":[["Jamsetji_Tata","Jamsetji Tata","Tata Group · 1868"],["Dhirubhai_Ambani","Dhirubhai Ambani","Reliance"],["N._R._Narayana_Murthy","N. R. Narayana Murthy","Infosys · 1981"],["Azim_Premji","Azim Premji","Wipro"],["Shiv_Nadar","Shiv Nadar","HCL · 1976"],["Falguni_Nayar","Falguni Nayar","Nykaa · 2012"],["Ritesh_Agarwal","Ritesh Agarwal","OYO · 2013"],["Vijay_Shekhar_Sharma","Vijay Shekhar Sharma","Paytm"],["Deepinder_Goyal","Deepinder Goyal","Zomato · 2008"],["Ardeshir_Godrej","Ardeshir Godrej","Godrej · 1897"],["Jamnalal_Bajaj","Jamnalal Bajaj","Bajaj · 1926"],["Nithin_Kamath","Nithin Kamath","Zerodha · 2010"]]},{"k":"table","title":"Company and founder","head":["Company","Founder(s)","Year and base"],"rows":[["The Tata Group","Jamsetji Tata","1868, Bombay — 'Father of Indian industry'; HQ Bombay House, Mumbai."],["Reliance Industries","Dhirubhai Ambani","Began as a yarn-trading firm in Bombay (late 1950s); HQ Mumbai."],["Infosys","N. R. Narayana Murthy","1981, Pune, with six co-founders; HQ Bengaluru."],["Wipro","M. H. Hasham Premji","1945 at Amalner as Western India Vegetable Products; his son Azim Premji turned it into an IT giant. HQ Bengaluru."],["HCL","Shiv Nadar","1976; HQ Noida."],["Flipkart","Sachin Bansal and Binny Bansal","2007, Bengaluru; Walmart bought a majority stake in 2018."],["Paytm (One97 Communications)","Vijay Shekhar Sharma","One97 in 2000, Paytm in 2010; HQ Noida."],["Zomato","Deepinder Goyal and Pankaj Chaddah","2008 as Foodiebay; HQ Gurugram. The parent company was renamed Eternal Ltd in 2025."],["Swiggy","Sriharsha Majety, Nandan Reddy and Rahul Jaimini","2014, Bengaluru."],["Ola Cabs","Bhavish Aggarwal and Ankit Bhati","2010, Mumbai; HQ Bengaluru."],["OYO Rooms","Ritesh Agarwal","2013; HQ Gurugram."],["Byju's","Byju Raveendran","2011, Bengaluru (with Divya Gokulnath)."],["Nykaa","Falguni Nayar","2012, Mumbai."],["Zerodha","Nithin Kamath and Nikhil Kamath","2010, Bengaluru."],["PhonePe","Sameer Nigam, Rahul Chari and Burzin Engineer","2015, Bengaluru."],["Snapdeal","Kunal Bahl and Rohit Bansal","2010, New Delhi."],["Lenskart","Peyush Bansal","2010."],["Mahindra & Mahindra","J. C. Mahindra and K. C. Mahindra","With Malik Ghulam Muhammad; 1945 at Ludhiana as Mahindra & Mohammed; renamed in 1948. HQ Mumbai."],["Godrej","Ardeshir Godrej","With his brother Pirojsha; 1897, Bombay — began with locks."],["The Bajaj Group","Jamnalal Bajaj","1926; Gandhi's close associate."],["Larsen & Toubro","Henning Holck-Larsen and Søren Kristian Toubro","1938, Bombay — two Danish engineers."],["Dabur","S. K. Burman","1884, Calcutta — an Ayurvedic medicine maker."],["Patanjali Ayurved","Baba Ramdev and Acharya Balkrishna","2006, Haridwar."]]},{"k":"table","title":"Where is the company based?","head":["Company","Headquarters","Note"],"rows":[["Infosys","Bengaluru",""],["Tata Sons","Mumbai","At Bombay House."],["HCLTech","Noida",""],["Zomato (Eternal Ltd)","Gurugram",""],["Bajaj Auto","Pune",""],["Patanjali Ayurved","Haridwar",""],["Amul (GCMMF)","Anand","The Gujarat Co-operative Milk Marketing Federation."],["TVS Motor Company","Chennai",""],["ITC Limited","Kolkata",""],["Dabur India","Ghaziabad",""]]},{"k":"mapfig","title":"Company headquarters in India","cap":"Bengaluru is the start-up capital (Infosys, Flipkart, Swiggy, Zerodha, PhonePe); Delhi NCR has HCLTech, Paytm, Zomato and OYO.","pins":[["1",77.21,28.61,"Delhi NCR: HCLTech (Noida), Zomato (Gurugram), Dabur India (Ghaziabad)","n"],["2",77.59,12.97,"Bengaluru: Infosys","n"],["3",72.88,19.08,"Mumbai: Tata Sons","n"],["4",73.86,18.52,"Pune: Bajaj Auto","n"],["5",78.16,29.95,"Haridwar: Patanjali Ayurved","n"],["6",72.95,22.56,"Anand: Amul","n"],["7",80.27,13.08,"Chennai: TVS Motor Company","n"],["8",88.36,22.57,"Kolkata: ITC Limited","n"]],"facts":[["1 · Delhi NCR","HCLTech (Noida) · Zomato (Gurugram) · Dabur India (Ghaziabad)"],["2 · Bengaluru","Infosys"],["3 · Mumbai","Tata Sons"],["4 · Pune","Bajaj Auto"],["5 · Haridwar","Patanjali Ayurved"],["6 · Anand","Amul"],["7 · Chennai","TVS Motor Company"],["8 · Kolkata","ITC Limited"]]},{"k":"trick","h":"<b>Three Bansals, three companies<\/b>: Sachin and Binny — <b>Flipkart<\/b>; Rohit (with Kunal Bahl) — <b>Snapdeal<\/b>; Peyush — <b>Lenskart<\/b>. <b>“Murthy started with Seven”<\/b> — Infosys had seven founders."},{"k":"trap","h":"<b>Wipro<\/b> was founded by <b>M. H. Hasham Premji<\/b> (1945) — <b>Azim Premji<\/b> is his son who built the IT business. <b>Zomato<\/b>'s parent is now called <b>Eternal Ltd<\/b> (2025). <b>Mahindra & Mahindra<\/b> began as <b>Mahindra & Mohammed<\/b>."}],"sum":["Tata — Jamsetji Tata (1868); Reliance — Dhirubhai Ambani; Godrej — Ardeshir Godrej (1897).","Infosys — N. R. Narayana Murthy and six others (1981); HCL — Shiv Nadar (1976); Wipro — M. H. Hasham Premji (1945).","Flipkart — Sachin and Binny Bansal (2007); Paytm — Vijay Shekhar Sharma; Zomato — Deepinder Goyal and Pankaj Chaddah.","OYO — Ritesh Agarwal; Nykaa — Falguni Nayar; Ola — Bhavish Aggarwal; Zerodha — Nithin and Nikhil Kamath.","Larsen & Toubro — two Danish engineers (1938); Patanjali — Baba Ramdev and Acharya Balkrishna (2006)."],"part":["Part 3 · Founders, papers and mottos","संस्थापक, समाचार-पत्र और आदर्श-वाक्य"],"g":"hq"},
{"id":"H8","heat":3,"title":"Founders of global companies","hi":"विश्व की कंपनियों के संस्थापक","blocks":[{"k":"hot","h":"Classic pairs: <b>Microsoft — Bill Gates and Paul Allen<\/b>, <b>Apple — Steve Jobs and Steve Wozniak<\/b>, <b>Google — Larry Page and Sergey Brin<\/b>, <b>Amazon — Jeff Bezos<\/b>, <b>Facebook — Mark Zuckerberg<\/b>, <b>Hotmail — Sabeer Bhatia<\/b>. HQs: <b>Redmond, Cupertino, Mountain View, Seattle<\/b>."},{"k":"story","h":"<p>Many of the world's biggest companies began in garages and dorm rooms. <b>Bill Gates<\/b> and <b>Paul Allen<\/b> started <b>Microsoft<\/b> in 1975; <b>Steve Jobs<\/b> and <b>Steve Wozniak<\/b> built the first <b>Apple<\/b> computer in 1976. Two Stanford students, <b>Larry Page<\/b> and <b>Sergey Brin<\/b>, launched <b>Google<\/b> in 1998, while <b>Jeff Bezos<\/b> sold books online as <b>Amazon<\/b> from 1994. <b>Mark Zuckerberg<\/b> started <b>Facebook<\/b> in his Harvard room in 2004.<\/p><p>Indians are in this story too: <b>Sabeer Bhatia<\/b> co-founded <b>Hotmail<\/b> (1996) and <b>Vinod Khosla<\/b> co-founded <b>Sun Microsystems<\/b> (1982). <b>Elon Musk<\/b> founded <b>SpaceX<\/b> (2002) and co-founded <b>OpenAI<\/b> (2015) — but <b>Tesla<\/b> was started in 2003 by <b>Martin Eberhard<\/b> and <b>Marc Tarpenning<\/b>.<\/p>","key":"Microsoft — Gates and Allen; Apple — Jobs and Wozniak; Google — Page and Brin; Amazon — Bezos; Facebook — Zuckerberg; Hotmail — Sabeer Bhatia."},{"k":"photos","title":"Founders in pictures","items":[["Bill_Gates","Bill Gates","Microsoft · 1975"],["Steve_Jobs","Steve Jobs","Apple"],["Larry_Page","Larry Page","Google"],["Jeff_Bezos","Jeff Bezos","Amazon"],["Mark_Zuckerberg","Mark Zuckerberg","Facebook"],["Elon_Musk","Elon Musk","SpaceX"],["Jensen_Huang","Jensen Huang","Nvidia"],["Jack_Ma","Jack Ma","Alibaba"],["Jimmy_Wales","Jimmy Wales","Wikipedia"],["Sabeer_Bhatia","Sabeer Bhatia","Hotmail"],["Akio_Morita","Akio Morita","Sony"],["Phil_Knight","Phil Knight","Nike"]]},{"k":"table","title":"Company and founder","head":["Company","Founder(s)","Year and note"],"rows":[["Microsoft","Bill Gates and Paul Allen","1975, Albuquerque; HQ Redmond, Washington."],["Apple","Steve Jobs, Steve Wozniak and Ronald Wayne","1976; HQ Cupertino, California."],["Google","Larry Page and Sergey Brin","1998, as Stanford PhD students; HQ Mountain View. Alphabet became its parent in 2015."],["Amazon","Jeff Bezos","1994, as an online bookshop; HQ Seattle."],["Facebook (Meta)","Mark Zuckerberg","With Eduardo Saverin and others; 2004 at Harvard; renamed Meta Platforms in 2021. HQ Menlo Park."],["Tesla","Martin Eberhard and Marc Tarpenning","2003; Elon Musk led its 2004 funding and later became CEO."],["SpaceX","Elon Musk","2002."],["OpenAI","Sam Altman, Elon Musk, Greg Brockman, Ilya Sutskever and others","2015, San Francisco — maker of ChatGPT (2022)."],["Twitter (now X)","Jack Dorsey, Noah Glass, Biz Stone and Evan Williams","2006; bought by Elon Musk in 2022 and renamed X in 2023."],["YouTube","Chad Hurley, Steve Chen and Jawed Karim","2005; bought by Google in 2006."],["WhatsApp","Jan Koum and Brian Acton","2009; bought by Facebook in 2014."],["Instagram","Kevin Systrom and Mike Krieger","2010; bought by Facebook in 2012."],["Wikipedia","Jimmy Wales and Larry Sanger","2001."],["Netflix","Reed Hastings and Marc Randolph","1997."],["Nvidia","Jensen Huang, Chris Malachowsky and Curtis Priem","1993."],["Intel","Robert Noyce and Gordon Moore","1968."],["Alibaba","Jack Ma","1999, Hangzhou."],["Huawei","Ren Zhengfei","1987, Shenzhen."],["Samsung","Lee Byung-chul","1938, Daegu (Korea)."],["Sony","Masaru Ibuka and Akio Morita","1946, Tokyo."],["Hotmail","Sabeer Bhatia and Jack Smith","1996; Bhatia was born in Chandigarh."],["Sun Microsystems","Vinod Khosla, Andy Bechtolsheim, Scott McNealy and Bill Joy","1982; created the Java language."],["Nike","Phil Knight and Bill Bowerman","1964 as Blue Ribbon Sports."]]},{"k":"table","title":"Where is the company based?","head":["Company","Headquarters","Where"],"rows":[["Microsoft","Redmond","Washington state, USA."],["Apple","Cupertino","California — 'Apple Park'."],["Google (Alphabet)","Mountain View","California — the 'Googleplex'."],["Amazon","Seattle","Washington state."],["Meta (Facebook)","Menlo Park","California."],["Tesla","Austin","Texas — moved from California in 2021."],["Nvidia","Santa Clara","California."],["Walmart","Bentonville","Arkansas."],["Nike","Beaverton","Oregon."],["Adidas","Herzogenaurach","Germany — Puma is in the same town."],["Alibaba","Hangzhou","China."],["Huawei","Shenzhen","China."],["Coca-Cola","Atlanta","Georgia, USA."],["Nokia","Espoo","Finland."]]},{"k":"worldfig","title":"Company headquarters around the world","vb":null,"minw":700,"cap":"Europe is drawn larger on the next map.","pins":[["1",-122.05,37.4,"Bay Area: Apple (Cupertino), Google (Mountain View), Meta (Menlo Park), Nvidia (Santa Clara)","n"],["2",-122.33,47.61,"Seattle: Microsoft (Redmond), Amazon, Nike (Beaverton)","n"],["3",-97.74,30.27,"Austin: Tesla","n"],["4",-94.21,36.37,"Bentonville: Walmart","n"],["5",120.16,30.27,"Hangzhou: Alibaba","n"],["6",114.06,22.54,"Shenzhen: Huawei","n"],["7",-84.39,33.75,"Atlanta: Coca-Cola","n"],["8",24.65,60.21,"Espoo: Nokia","n"]],"legend":[["1 Bay Area","Apple (Cupertino) · Google (Mountain View) · Meta (Menlo Park) · Nvidia (Santa Clara)"],["2 Seattle","Microsoft (Redmond) · Amazon · Nike (Beaverton)"],["3 Austin","Tesla"],["4 Bentonville","Walmart"],["5 Hangzhou","Alibaba"],["6 Shenzhen","Huawei"],["7 Atlanta","Coca-Cola"],["8 Espoo","Nokia"]]},{"k":"worldfig","title":"Company headquarters  — Europe","vb":"432 68 122 68","minw":520,"cap":"Silicon Valley (the Bay Area) holds Apple, Google, Meta and Nvidia; the Seattle area has Microsoft and Amazon.","pins":[["9",10.88,49.57,"Herzogenaurach: Adidas","n"]],"legend":[["9 Herzogenaurach","Adidas"]]},{"k":"trick","h":"<b>“Bought by Facebook: W-I”<\/b> — WhatsApp (2014) and Instagram (2012). <b>“Google bought the Tube”<\/b> — YouTube (2006). Microsoft's HQ <b>Redmond<\/b> and Amazon's <b>Seattle<\/b> are both in <b>Washington state<\/b>."},{"k":"trap","h":"<b>Elon Musk<\/b> did not found <b>Tesla<\/b> — he was an early investor (2004) and later CEO. <b>Ronald Wayne<\/b> was Apple's little-known third founder. <b>Jawed Karim<\/b> (YouTube) and <b>Sabeer Bhatia<\/b> (Hotmail) are names that trap students who expect only Americans."}],"sum":["Microsoft — Bill Gates and Paul Allen (1975), Redmond; Apple — Jobs, Wozniak and Wayne (1976), Cupertino.","Google — Larry Page and Sergey Brin (1998), Mountain View; Amazon — Jeff Bezos (1994), Seattle.","Facebook/Meta — Mark Zuckerberg (2004), Menlo Park; WhatsApp — Koum and Acton; Instagram — Systrom and Krieger.","Tesla — Eberhard and Tarpenning (2003); SpaceX — Elon Musk (2002); OpenAI — Altman, Musk and others (2015).","Hotmail — Sabeer Bhatia; Sun Microsystems — Vinod Khosla and others; Alibaba — Jack Ma; Huawei — Ren Zhengfei."],"part":["Part 3 · Founders, papers and mottos","संस्थापक, समाचार-पत्र और आदर्श-वाक्य"],"g":"hq"},
{"id":"H9","heat":3,"title":"Reform bodies, parties and newspapers","hi":"सुधार संगठन, दल और समाचार-पत्र","blocks":[{"k":"hot","h":"Asked in almost every SSC shift: <b>Brahmo Samaj — Raja Ram Mohan Roy<\/b>, <b>Arya Samaj — Dayananda Saraswati<\/b>, <b>Ramakrishna Mission — Vivekananda<\/b>, <b>Servants of India Society — Gokhale<\/b>, <b>Satyashodhak Samaj — Phule<\/b>; papers <b>Kesari — Tilak<\/b>, <b>Young India and Harijan — Gandhi<\/b>, <b>Al-Hilal — Azad<\/b>, <b>Mooknayak — Ambedkar<\/b>."},{"k":"story","h":"<p>The 19th-century awakening began in Bengal. <b>Raja Ram Mohan Roy<\/b> founded the <b>Brahmo Sabha<\/b> in <b>1828<\/b> (later the Brahmo Samaj) and also ran newspapers — <b>Sambad Kaumudi<\/b> in Bengali and <b>Mirat-ul-Akhbar<\/b> in Persian. In western India came the <b>Prarthana Samaj<\/b> (1867), <b>Jyotirao Phule<\/b>'s <b>Satyashodhak Samaj<\/b> (1873) and <b>Dayananda Saraswati<\/b>'s <b>Arya Samaj<\/b> (1875, Bombay). <b>Vivekananda<\/b> founded the <b>Ramakrishna Mission<\/b> in 1897 and <b>Gokhale<\/b> the <b>Servants of India Society<\/b> in 1905.<\/p><p>Politics grew out of these: <b>A. O. Hume<\/b> helped found the <b>Congress<\/b> in 1885, the <b>Muslim League<\/b> came in 1906 at Dhaka, and <b>Tilak<\/b> and <b>Annie Besant<\/b> began Home Rule Leagues in 1916. Every leader had a paper: <b>Tilak<\/b> — Kesari and Mahratta; <b>Gandhi<\/b> — Indian Opinion, Young India, Harijan; <b>Azad<\/b> — Al-Hilal; <b>Ambedkar<\/b> — Mooknayak; <b>Nehru<\/b> — National Herald.<\/p>","key":"Brahmo 1828 — Roy; Arya 1875 — Dayananda; RK Mission 1897 — Vivekananda; Servants of India 1905 — Gokhale; Kesari — Tilak; Young India — Gandhi; Al-Hilal — Azad."},{"k":"photos","title":"Founders in pictures","items":[["Ram_Mohan_Roy","Raja Ram Mohan Roy","Brahmo Samaj"],["Dayananda_Saraswati","Dayananda Saraswati","Arya Samaj"],["Jyotirao_Phule","Jyotirao Phule","Satyashodhak Samaj"],["Swami_Vivekananda","Swami Vivekananda","Ramakrishna Mission"],["Gopal_Krishna_ ue (April 1916, Belgaum)","Bal Gangadhar Tilak",""],["Home Rule League (September 1916, Madras)","Annie Besant",""],["Swaraj Party","C. R. Das and Motilal Nehru","1923."],["Self-Respect Movement","E. V. Ramasamy (Periyar)","1925, Tamil Nadu."],["Hindustan Socialist Republican Association","Chandra Shekhar Azad, Bhagat Singh and comrades","1928, Delhi (from the HRA of 1924)."],["Khudai Khidmatgar ('Red Shirts')","Khan Abdul Ghaffar Khan","1929."],["Forward Bloc","Subhas Chandra Bose","1939."],["Bahishkrit Hitakarini Sabha","B. R. Ambedkar","1924."],["Sri Narayana Dharma Paripalana Yogam","Sree Narayana Guru","1903, Kerala."],["Harijan Sevak Sangh","Mahatma Gandhi","1932."],["Visva-Bharati","Rabindranath Tagore","1921, Santiniketan."],["Banaras Hindu University","Madan Mohan Malaviya","1916."]]},{"k":"mapfig","title":"Where the reform bodies began","pins":[["Brahmo Samaj · Indian Association",88.36,22.57,"Calcutta",""],["INC · Prarthana · Arya Samaj",72.88,19.08,"Bombay","l"],["Satyashodhak · Servants of India",73.86,18.52,"Pune","l"],["Theosophical Society (Adyar)",80.27,13.08,"Madras"],["Home Rule League (Tilak)",74.5,15.85,"Belgaum","l"],["MAO College",78.08,27.88,"Aligarh"],["BHU",82.97,25.32,"Banaras"],["Visva-Bharati",87.68,23.68,"Santiniketan","l"],["HSRA",77.21,28.61,"Delhi","l"],["Muslim League",90.41,23.81,"Dhaka (1906)"]],"cap":"Calcutta and Bombay were the cradles of reform. Abroad: the East India Association (London, 1866), the Theosophical Society (New York, 1875) and the Ghadar Party (San Francisco, 1913)."},{"k":"table","title":"Founding years","head":["Organisation","Year"],"rows":[["Brahmo Samaj","1828"],["Prarthana Samaj","1867"],["Satyashodhak Samaj","1873"],["Arya Samaj","1875"],["Indian National Congress","1885"],["Ramakrishna Mission","1897"],["Servants of India Society","1905"],["All-India Muslim League","1906"],["Ghadar Party","1913"],["Swaraj Party","1923"],["Forward Bloc","1939"]]},{"k":"table","title":"Newspapers and journals","head":["Paper","Started by","Year and place"],"rows":[["Bengal Gazette (Hicky's Gazette)","James Augustus Hicky","India's first newspaper — Calcutta, 29 January 1780."],["Sambad Kaumudi (Bengali)","Raja Ram Mohan Roy","1821."],["Mirat-ul-Akhbar (Persian)","Raja Ram Mohan Roy","1822."],["Rast Goftar (Gujarati)","Dadabhai Naoroji","1851."],["Kesari (Marathi)","Bal Gangadhar Tilak","1881, Pune."],["Mahratta (English)","Bal Gangadhar Tilak","1881, Pune."],["Amrita Bazar Patrika","Sisir Kumar Ghosh and Motilal Ghosh","1868."],["The Tribune","Dyal Singh Majithia","1881, Lahore."],["Indian Opinion","Mahatma Gandhi","1903, South Africa."],["Young India","Mahatma Gandhi","Gandhi edited it from 1919."],["Harijan","Mahatma Gandhi","1933."],["Al-Hilal (Urdu)","Maulana Abul Kalam Azad","1912."],["Comrade (English)","Maulana Mohammad Ali Jauhar","1911."],["New India","Annie Besant","1914–15, Madras."],["Mooknayak (Marathi)","B. R. Ambedkar","1920."],["Bahishkrit Bharat","B. R. Ambedkar","1927."],["National Herald","Jawaharlal Nehru","1938, Lucknow."],["The People (weekly)","Lala Lajpat Rai","1925, Lahore."],["Indian Sociologist","Shyamji Krishna Varma","1905, London."],["Udbodhan (Bengali)","Swami Vivekananda","1899."],["Tahzeeb-ul-Akhlaq","Sir Syed Ahmad Khan","1870."]]},{"k":"tl","title":"Timeline","rows":[["1780","Hicky's Bengal Gazette — India's first newspaper"],["1828","Brahmo Sabha (Raja Ram Mohan Roy)"],["1875","Arya Samaj; Theosophical Society (New York)"],["1885","Indian National Congress"],["1897","Ramakrishna Mission"],["1905","Servants of India Society"],["1906","All-India Muslim League"]]},{"k":"trick","h":"Year chain <b>28 – 67 – 73 – 75 – 97 – 1905<\/b>: <b>B<\/b>rahmo, <b>P<\/b>rarthana, <b>S<\/b>atyashodhak, <b>A<\/b>rya, <b>R<\/b>amakrishna, <b>S<\/b>ervants — <b>“Big Pandits Speak About Real Service.”<\/b> Gandhi's papers <b>“I-Y-H”<\/b>: Indian Opinion, Young India, Harijan."},{"k":"trap","h":"The <b>Theosophical Society<\/b> was founded in <b>New York<\/b> by <b>Blavatsky and Olcott<\/b>; Annie Besant led it later. <b>Kesari<\/b> was Marathi and <b>Mahratta<\/b> English — both Tilak's. The <b>Ramakrishna Mission<\/b> was founded by Vivekananda, not by Ramakrishna. The <b>Brahmo Samaj of India<\/b> (1866) is Keshab Chandra Sen's, not Roy's."}],"sum":["Brahmo Samaj (1828) — Raja Ram Mohan Roy; Prarthana Samaj (1867) — Atmaram Pandurang; Satyashodhak Samaj (1873) — Jyotirao Phule.","Arya Samaj (1875) — Dayananda Saraswati; Ramakrishna Mission (1897) — Vivekananda; Servants of India Society (1905) — Gokhale.","Congress (1885) — A. O. Hume; Muslim League (1906, Dhaka); Home Rule Leagues (1916) — Tilak and Annie Besant.","Kesari and Mahratta — Tilak; Indian Opinion, Young India, Harijan — Gandhi; Al-Hilal — Azad.","Bengal Gazette (1780) — Hicky; Mooknayak — Ambedkar; National Herald — Nehru; The Tribune — Dyal Singh Majithia."],"part":["Part 3 · Founders, papers and mottos","संस्थापक, समाचार-पत्र और आदर्श-वाक्य"],"g":"hq"},
{"id":"H10","heat":2,"title":"Mottos and taglines","hi":"आदर्श-वाक्य और टैगलाइन","blocks":[{"k":"hot","h":"Most asked: <b>Satyameva Jayate<\/b> (national emblem, Mundaka Upanishad), <b>Yato Dharmastato Jayah<\/b> (Supreme Court), <b>Yogakshemam Vahamyaham<\/b> (LIC), <b>Satyam Shivam Sundaram<\/b> (Doordarshan), <b>Bahujan Hitaya Bahujan Sukhaya<\/b> (AIR), and the Olympic motto."},{"k":"story","h":"<p>India's institutions borrowed their mottos from Sanskrit texts. The national emblem carries <b>Satyameva Jayate<\/b> from the <b>Mundaka Upanishad<\/b>. The <b>Supreme Court<\/b> says <b>Yato Dharmastato Jayah<\/b>; <b>LIC<\/b> promises <b>Yogakshemam Vahamyaham<\/b> from the Gita; <b>Doordarshan<\/b> chose <b>Satyam Shivam Sundaram<\/b> and <b>All India Radio<\/b> <b>Bahujan Hitaya Bahujan Sukhaya<\/b>.<\/p><p>World bodies and brands have their own lines. The <b>Olympic<\/b> motto <b>Citius, Altius, Fortius<\/b> gained a fourth word, <b>Communiter<\/b> ('together'), in 2021. Chess's <b>FIDE<\/b> says <b>Gens una sumus<\/b> — we are one family. And brands are known by a few words: <b>Just Do It<\/b> (Nike), <b>Incredible India<\/b> (tourism), <b>God's Own Country<\/b> (Kerala).<\/p>","key":"Satyameva Jayate — emblem; Yato Dharmastato Jayah — Supreme Court; Yogakshemam Vahamyaham — LIC; Citius, Altius, Fortius – Communiter — Olympics."},{"k":"table","title":"Mottos of Indian institutions","head":["Institution","Motto","Note"],"rows":[["National Emblem of India","Satyameva Jayate","'Truth alone triumphs' — from the Mundaka Upanishad."],["Supreme Court of India","Yato Dharmastato Jayah","'Where there is dharma, there is victory'."],["Lok Sabha","Dharmachakra Pravartanaya","Written above the Speaker's chair."],["Life Insurance Corporation (LIC)","Yogakshemam Vahamyaham","From the Bhagavad Gita."],["Doordarshan","Satyam Shivam Sundaram",""],["All India Radio (Akashvani)","Bahujan Hitaya Bahujan Sukhaya",""],["University Grants Commission","Gyan-Vigyan Vimuktaye",""],["NCERT","Vidyayamritamashnute",""],["Kendriya Vidyalaya Sangathan","Tat Tvam Pushan Apavrinu",""],["CBI","Industry, Impartiality, Integrity",""],["Delhi Police","Shanti, Sewa, Nyaya","Peace, service, justice."],["Mumbai Police","Sadrakshanaya Khalanigrahanaya","'To protect the good and destroy the evil'."]]},{"k":"cards","title":"Mottos of Indian institutions","rows":[["Satyameva Jayate","National Emblem of India","'Truth alone triumphs'","🦁"],["Yato Dharmastato Jayah","Supreme Court of India","'Where there is dharma, there is victory'","⚖️"],["Dharmachakra Pravartanaya","Lok Sabha","Written above the Speaker's chair","🏛️"],["Yogakshemam Vahamyaham","Life Insurance Corporation (LIC)","From the Bhagavad Gita","☂️"],["Satyam Shivam Sundaram","Doordarshan","","📻"],["Bahujan Hitaya Bahujan Sukhaya","All India Radio (Akashvani)","","📻"],["Gyan-Vigyan Vimuktaye","University Grants Commission","","🎓"],["Vidyayamritamashnute","NCERT","","🎓"],["Tat Tvam Pushan Apavrinu","Kendriya Vidyalaya Sangathan","","🎓"],["Industry, Impartiality, Integrity","CBI","","🚓"],["Shanti, Sewa, Nyaya","Delhi Police","Peace, service, justice","🚓"],["Sadrakshanaya Khalanigrahanaya","Mumbai Police","'To protect the good and destroy the evil'","🚓"]]},{"k":"table","title":"Mottos and taglines of organisations and brands","head":["Organisation / brand","Motto or tagline","Note"],"rows":[["Olympic Games","Citius, Altius, Fortius – Communiter","Faster, higher, stronger – together; 'together' was added in 2021."],["FIDE (world chess body)","Gens una sumus","'We are one family'."],["FIFA","For the Game. For the World.",""],["Rotary International","Service Above Self",""],["Lions Clubs International","We Serve",""],["The Scout movement","Be Prepared",""],["Indian tourism (Ministry of Tourism)","Incredible India","Campaign launched in 2002."],["Kerala Tourism","God's Own Country",""],["Madhya Pradesh Tourism","The Heart of Incredible India",""],["Amul","The Taste of India",""],["State Bank of India","The Banker to Every Indian",""],["Punjab National Bank","The Name You Can Bank Upon",""],["Bank of Baroda","India's International Bank",""],["Tata Steel","We Also Make Tomorrow",""],["Nike","Just Do It",""],["Apple (1997 campaign)","Think Different",""],["Adidas","Impossible Is Nothing",""],["McDonald's","I'm Lovin' It",""],["Nokia","Connecting People",""]]},{"k":"trick","h":"<b>“Truth on the emblem, Dharma in the court, Yoga in insurance”<\/b> — Satyameva Jayate, Yato Dharmastato Jayah, Yogakshemam Vahamyaham. <b>“Satyam on screen, Bahujan on radio”<\/b> — Doordarshan and AIR."},{"k":"trap","h":"<b>Satyameva Jayate<\/b> comes from the <b>Mundaka Upanishad<\/b>, not the Gita (LIC's motto is from the Gita). The Olympic motto now has <b>four<\/b> words — <b>Communiter<\/b> was added in 2021. <b>Dharmachakra Pravartanaya<\/b> is the <b>Lok Sabha<\/b>'s, not the Supreme Court's."}],"sum":["Satyameva Jayate — national emblem (Mundaka Upanishad); Yato Dharmastato Jayah — Supreme Court.","Dharmachakra Pravartanaya — Lok Sabha; Yogakshemam Vahamyaham — LIC.","Satyam Shivam Sundaram — Doordarshan; Bahujan Hitaya Bahujan Sukhaya — All India Radio.","Olympics — Citius, Altius, Fortius – Communiter; FIDE — Gens una sumus.","Incredible India — tourism (2002); God's Own Country — Kerala; Just Do It — Nike."],"part":["Part 3 · Founders, papers and mottos","संस्थापक, समाचार-पत्र और आदर्श-वाक्य"],"g":"hq"}

/* ===== Desktop layout (PC / tablet landscape) ===== */
@media (min-width: 1024px){
  :root{--side:236px}
  body{padding-left:var(--side);font-size:16.5px}
  .top{border-bottom:1px solid var(--rule)}
  .top-in{max-width:1320px;padding:16px 36px}
  .brand{font-size:21px}
  .brand small{font-size:13px}
  .stat{font-size:13px}
  .wrap{max-width:1320px;padding:0 36px 56px}
  .view{padding-top:28px}
  h1{font-size:34px} h2{font-size:22px} h3{font-size:17px}

  /* bottom tab bar becomes a left sidebar */
  .nav{top:0;bottom:0;left:0;right:auto;width:var(--side);height:auto;border-top:0;border-right:1px solid var(--rule);padding:84px 14px 20px;display:block;overflow:auto}
  .nav-in{display:flex;flex-direction:column;gap:4px;height:auto;max-width:none;margin:0}
  .nav-in::before{content:"Sections";display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:0 14px 8px}
  .nav button{flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-size:15px;min-height:0;height:auto;width:100%;text-align:left}
  .nav button svg{width:20px;height:20px;flex-shrink:0}
  .nav button:hover{background:var(--sunk)}
  .nav button[aria-current="page"]{background:var(--blue-bg)}
  .nav button[aria-current="page"] span{border-bottom:0!important}

  /* home: intro beside progress */
  .hero{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);column-gap:48px;align-items:end;padding-bottom:10px}
  .hero > .eyebrow,.hero > h1,.hero > p{grid-column:1}
  .hero > .meter{grid-column:2;grid-row:3;align-self:center}
  .hero > .row{grid-column:2;grid-row:2;align-self:end}

  /* lesson reader: facts, timelines, tricks sit side by side */
  .lhead{margin-bottom:0}
  .steps{max-width:640px}
  .steps + .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .steps + .stack > .plain,.steps + .stack > .row,.steps + .stack > p,.steps + .stack > .fig,.steps + .stack > h2,.steps + .stack > .tbl{grid-column:1/-1}
  .steps + .stack > .plain{max-width:86ch;font-size:17px}
  .steps + .stack > .hot,.steps + .stack > .story{grid-column:1/-1}
  .steps + .stack > .story{max-width:none;padding:20px 24px;font-size:17.5px}
  .steps + .stack > .story p{max-width:80ch}
  .steps + .stack:not(:has(> .block ~ .block)) > .block{grid-column:1/-1}
  .block,.qcard{padding:18px 20px;border-radius:14px}

  /* quizzes and question bank */
  #lq > .stack{display:grid;grid-template-columns:minmax(0,1fr);max-width:980px;gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qt{font-size:18px}
  #plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #plist .opts{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:wrap;overflow:visible}

  /* mock test: question with the answer grid alongside */
  .mbar{top:calc(env(safe-area-inset-top,0px) + 67px)}
  .view > .qcard{max-width:1000px}
  .view > .row.between{max-width:1000px}
  .view > #msub{max-width:1000px;width:100%}
  .view > .block.stack{max-width:760px}
  .pal{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .kpis{max-width:760px}

  /* revise: summary cards and sheets in columns */
  #rv > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #rv > .stack > .grph,#rv > .stack > p,#rv > .stack > .search,#rv > .stack > .callout{grid-column:1/-1}
  #dgl,#lml,#tll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #dgl > .grph,#dgl > p,#lml > p,#tll > .grph{grid-column:1/-1}
  #rv .search,#rv > #dgl ~ .search{max-width:520px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flash{min-height:300px;max-width:760px;margin:0 auto;padding:32px 36px}
  .flash .front{font-size:22px}

  /* learn: era cards across the top */
  .eras{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}
  .les{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}

</style>
<script id="shabd-deeplink">
(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();
</script>
</body>
</html>

["L20","The revolt of 1857 at Allahabad was led by:",["Liaquat Ali","Shah Mal","Devi Singh","Kandarpeshwar Singh"],"Maulvi Liaquat Ali led Allahabad and was put down by Colonel Neill; Kandarpeshwar Singh led in Assam.",""],
["L21","The Atmiya Sabha was founded in 1815 by:",["Raja Ram Mohan Roy","Debendranath Tagore","Keshab Chandra Sen","David Hare"],"Ram Mohan Roy founded the Atmiya Sabha first and then the Brahmo Samaj in 1828.",""],
["L21","The Tattvabodhini Sabha was founded in 1839 by:",["Debendranath Tagore","Keshab Chandra Sen","Shivnath Shastri","Atmaram Pandurang"],"Debendranath Tagore founded it and later led the Brahmo Samaj; Keshab Chandra Sen formed the Brahmo Samaj of India in 1866.",""],
["L21","The Deoband movement was started in 1866 by:",["Muhammad Qasim Nanautavi and Rashid Ahmad Gangohi","Sir Syed Ahmad Khan","Mirza Ghulam Ahmad","Nawab Salimullah"],"Deoband was an orthodox movement of religious education, unlike Sir Syed's Aligarh movement of English education.",""],
["L21","The journal 'Tahzib-ul-Akhlaq' was published by:",["Sir Syed Ahmad Khan","Maulana Abul Kalam Azad","Mirza Ghulam Ahmad","Badruddin Tyabji"],"Sir Syed used it to spread his ideas of social reform and modern education among Muslims.",""],
["L21","The Central Hindu College at Banaras, which later became the nucleus of Banaras Hindu University, was founded by:",["Annie Besant","Madan Mohan Malaviya","Dayanand Saraswati","Swami Vivekananda"],"Annie Besant founded the college in 1898; Malaviya built BHU on its base in 1916.",""],
["L22","How many delegates attended the first session of the Indian National Congress?",["72","64","100","50"],"Seventy-two delegates met at Gokuldas Tejpal Sanskrit College, Bombay, in December 1885.",""],
["L22","The Surat session of 1907, at which the Congress split, was presided over by:",["Rash Behari Ghosh","Dadabhai Naoroji","Gopal Krishna Gokhale","Bal Gangadhar Tilak"],"Rash Behari Ghosh was the Moderates' choice as president, and the Extremists' opposition broke up the session.",""],
["L22","The Lucknow session of 1916, which saw the Congress reunite, was presided over by:",["Ambica Charan Majumdar","Annie Besant","Bal Gangadhar Tilak","M. A. Jinnah"],"Ambica Charan Majumdar presided when the Moderates and Extremists reunited and the Lucknow Pact was signed.",""],
["L22","Who started the Ganapati and Shivaji festivals to spread nationalist feeling?",["Bal Gangadhar Tilak","Bipin Chandra Pal","Aurobindo Ghosh","Lala Lajpat Rai"],"Tilak began the Ganapati festival in 1893 and the Shivaji festival in 1895.",""],
["L22","Who was the youngest ever President of the Indian National Congress?",["Maulana Abul Kalam Azad","Jawaharlal Nehru","Subhas Chandra Bose","Gopal Krishna Gokhale"],"Azad presided at 35 in 1923 and was also president for the longest stretch, from 1940 to 1946.",""],
["L22","Who was the President of the Indian National Congress at the time of Independence in 1947?",["J. B. Kripalani","Maulana Abul Kalam Azad","Rajendra Prasad","Jawaharlal Nehru"],"J. B. Kripalani held the office in 1947; Azad's long term had ended in 1946.",""],
["L23","The Rowlatt Act of 1919 was popularly summed up in the phrase:",["'No vakil, no dalil, no appeal'","'Do or Die'","'Go back Simon'","'A post-dated cheque'"],"The Act allowed detention without trial, hence the phrase. 'A post-dated cheque' was Gandhi's verdict on the Cripps Mission.",""],
["L23","The first all-India hartal against the Rowlatt Act was observed on:",["6 April 1919","13 April 1919","10 March 1919","1 August 1920"],"Gandhi called the hartal for 6 April 1919; the Jallianwala Bagh firing followed on 13 April.",""],
["L23","Which commission was appointed to enquire into the Jallianwala Bagh massacre?",["Hunter Commission","Peel Commission","Simon Commission","Sadler Commission"],"The Hunter Commission of 1919 enquired into the Punjab disturbances; the Peel Commission had reorganised the army in 1859.",""],
["L23","The Non-Cooperation Movement was formally approved at the Congress session held at:",["Nagpur","Calcutta","Lahore","Belgaum"],"The Calcutta special session of September 1920 adopted it and the Nagpur session of December 1920 confirmed it.",""],
["L23","Gandhi offered his first satyagraha anywhere in the world in 1906 in:",["South Africa","Champaran","Kheda","London"],"His first satyagraha was at Johannesburg against the Asiatic Registration Act; Champaran in 1917 was the first in India.",""],
["L23","The Nehru Report of 1928, which demanded dominion status, was prepared under the chairmanship of:",["Motilal Nehru","Jawaharlal Nehru","C. R. Das","Tej Bahadur Sapru"],"Motilal Nehru headed the committee that drafted it as an Indian answer to the Simon Commission.",""],
["L24","The Hindustan Republican Association was founded in 1924 at:",["Kanpur","Lahore","Allahabad","Calcutta"],"Sachindra Nath Sanyal, Ramprasad Bismil and Jogesh Chatterjee founded it at Kanpur; it became the HSRA in 1928.",""],
["L24","Jatin Das died in jail in 1929 after a hunger strike lasting:",["63 days","21 days","40 days","90 days"],"Jatindra Nath Das fasted for 63 days in Lahore jail demanding better treatment for political prisoners.",""],
["L24","J. P. Saunders was shot dead in December 1928 in revenge for the death of:",["Lala Lajpat Rai","Bal Gangadhar Tilak","Jatin Das","Khudiram Bose"],"Bhagat Singh, Rajguru and Azad killed Saunders after Lajpat Rai died of injuries from a lathi charge.",""],
["L24","Subhas Chandra Bose escaped from India in 1941 travelling under the assumed name:",["Ziauddin","Abid Hasan","Mohan Singh","Rash Behari"],"He left Calcutta as the Pathan 'Ziauddin' and reached Germany through Kabul.",""],
["L24","Who hoisted the Congress flag at Gowalia Tank after the Quit India arrests?",["Aruna Asaf Ali","Usha Mehta","Sucheta Kripalani","Sarojini Naidu"],"Aruna Asaf Ali hoisted the flag, while Usha Mehta ran the underground Congress Radio.",""],
["L24","The Interim Government headed by Jawaharlal Nehru was formed on:",["2 September 1946","16 August 1946","9 December 1946","3 June 1947"],"It took office on 2 September 1946, and the Muslim League joined it in October.",""],
["L25","The Charter Act of 1833 added a Law Member to the Governor-General's Council; the first to hold the post was:",["Lord Macaulay","Lord Cornwallis","Sir William Jones","Sir Charles Wood"],"Macaulay became Law Member and headed the first Law Commission; his 1835 Minute brought in English education.",""],
["L25","The first Indian to be appointed to the Viceroy's Executive Council was:",["Satyendra Prasad Sinha","Dadabhai Naoroji","Gopal Krishna Gokhale","Pherozeshah Mehta"],"S. P. Sinha was appointed after the Morley-Minto reforms of 1909.",""],
["L25","Which Act separated Burma from India?",["Government of India Act, 1935","Government of India Act, 1919","Indian Councils Act, 1909","Indian Independence Act, 1947"],"The 1935 Act separated Burma, created provincial autonomy and set up the RBI and a Federal Court.",""],
["L25","Which Act introduced indirect elections to the legislative councils for the first time?",["Indian Councils Act, 1892","Indian Councils Act, 1861","Indian Councils Act, 1909","Charter Act, 1853"],"The 1892 Act allowed members to be recommended by local bodies and permitted budget discussion.",""],
["L25","The Kol rebellion of 1831 was led by:",["Buddho Bhagat","Birsa Munda","Sidhu Murmu","Tantia Bhil"],"Buddho Bhagat led the Kol rising in Chhotanagpur; Birsa Munda's Ulgulan came in 1899–1900.",""],
["L25","The Indigo revolt of 1859–60 in Bengal was led by:",["Digambar and Bishnu Biswas","Sidhu and Kanhu","Baba Ramchandra","Nana Patil"],"The Biswas brothers led the ryots of Nadia; Dinabandhu Mitra's play Nil Darpan exposed the planters.",""],
["L31","India's first newspaper, Hicky's Bengal Gazette, was published in 1780 from:",["Calcutta","Bombay","Madras","Serampore"],"James Augustus Hicky printed it in Calcutta; it is also called the Calcutta General Advertiser.","p"],
["L31","Who is known as the 'liberator of the Indian press'?",["Charles Metcalfe","Lord Ripon","Lord William Bentinck","Lord Lytton"],"Metcalfe repealed the 1823 licensing rules in 1835. Ripon only repealed the Vernacular Press Act; Lytton passed it.","p"],
["L31","Which newspaper changed overnight from Bengali to English to escape the Vernacular Press Act of 1878?",["Amrita Bazar Patrika","Sambad Kaumudi","Som Prakash","The Bengalee"],"Founded in 1868 by Sisir Kumar Ghosh and Motilal Ghosh, it slipped out of the Act, which covered only Indian-language papers.","p"],
["L31","The Urdu weekly Al-Hilal was started in 1912 by:",["Maulana Abul Kalam Azad","Maulana Mohammad Ali","Sir Syed Ahmad Khan","Hasrat Mohani"],"Azad published it from Calcutta; after it was banned in 1914 he started Al-Balagh. Mohammad Ali's paper was Comrade.","p"],
["L31","The English weekly 'Comrade' was started by:",["Maulana Mohammad Ali","Maulana Abul Kalam Azad","Shaukat Ali","M. A. Ansari"],"Mohammad Ali started Comrade in 1911 and the Urdu Hamdard later; Azad's paper was Al-Hilal.","p"],
["L31","Which of these papers was NOT published by Mahatma Gandhi?",["Kesari","Young India","Harijan","Navajivan"],"Kesari was Tilak's Marathi paper. Gandhi ran Young India (English), Navajivan (Gujarati) and Harijan.",""],
["L31","The Vernacular Press Act of 1878 was repealed in 1882 by:",["Lord Ripon","Lord Lytton","Lord Dufferin","Lord Curzon"],"Lytton passed the 'gagging act' and Ripon repealed it, in keeping with his liberal reputation.",""],
["L31","The English daily 'Bande Mataram' (1906), voice of the Extremists, was started by Bipin Chandra Pal and edited by:",["Aurobindo Ghosh","Bal Gangadhar Tilak","Lala Lajpat Rai","Surendranath Banerjee"],"Aurobindo Ghosh edited it from Calcutta. Do not confuse the paper with Bankim Chandra's song of the same name.",""],
["L31","The newspaper 'The Bengalee' is associated with:",["Surendranath Banerjee","W. C. Bonnerjee","Bipin Chandra Pal","Keshab Chandra Sen"],"Surendranath Banerjee edited it from 1879 and was jailed for contempt of court in 1883.",""],
["L31","The Hindu was started in 1878 at:",["Madras","Calcutta","Bombay","Pune"],"G. Subramania Iyer and M. Veeraraghavachariar started it in Madras, the same year as the Vernacular Press Act.",""],
["L31","Bombay Samachar, one of the oldest newspapers in Asia, is published in:",["Gujarati","Marathi","English","Urdu"],"Fardunjee Marzban started it in 1822 in Gujarati, and it is still published.",""],
["L31","Mirat-ul-Akhbar, a paper of Raja Ram Mohan Roy, was published in:",["Persian","Bengali","Urdu","English"],"Mirat-ul-Akhbar (1822) was in Persian; his Sambad Kaumudi was in Bengali.",""],
["L31","The Calcutta Madrasa was founded in 1781 by:",["Warren Hastings","Jonathan Duncan","Lord Wellesley","Lord Cornwallis"],"Hastings set it up for Persian and Arabic learning; Jonathan Duncan founded the Sanskrit College at Benares in 1791.","p"],
["L31","The Sanskrit College at Benares was founded in 1791 by:",["Jonathan Duncan","Warren Hastings","William Jones","Lord Wellesley"],"Duncan, the British Resident at Benares, founded it. William Jones founded the Asiatic Society (1784).",""],
["L31","Macaulay's Minute on education, which made English the medium of higher education, was presented in:",["1835","1813","1854","1833"],"The Minute is dated 2 February 1835 and Bentinck accepted it. 1813 was the Charter Act grant; 1854 was Wood's Despatch.","p"],
["L31","The Hunter Commission on education (1882) was appointed during the viceroyalty of:",["Lord Ripon","Lord Lytton","Lord Curzon","Lord Dufferin"],"W. W. Hunter's commission studied primary and secondary education. The Hunter Committee of 1919 on Jallianwala Bagh is a different body.","p"],
["L31","The Indian Universities Act of 1904 followed the recommendations of the:",["Raleigh Commission","Hunter Commission","Sadler Commission","Hartog Committee"],"Curzon appointed Thomas Raleigh's commission in 1902; the Act tightened government control over universities.","p"],
["L31","The Sadler Commission (1917–19) was appointed to study the problems of:",["Calcutta University","Bombay University","Primary education in India","Aligarh's MAO College"],"It is also called the Calcutta University Commission and proposed a 12-year school course.",""],
["L31","The Hartog Committee of 1929 was set up as an auxiliary committee of the:",["Simon Commission","Cabinet Mission","Cripps Mission","Hunter Commission"],"It reported on education and warned of 'wastage and stagnation' in primary schooling.",""],
["L31","The central idea of the Wardha scheme of Basic Education (1937) was:",["Learning through a productive craft","English as the medium of instruction","University education on the London model","Religious instruction in all schools"],"Gandhi's Nai Talim, worked out by the Zakir Hussain committee, built seven years of free schooling around a craft.",""],
["L31","The Sargent Plan of 1944 aimed at:",["Free and compulsory education for children aged 6 to 14","Setting up universities in the three presidency towns","Replacing English with Persian in courts","Giving primary education to municipal boards"],"John Sargent's plan set a 40-year target for universal schooling of children aged 6 to 14.",""],
["L31","Arrange in chronological order: Wood's Despatch, Macaulay's Minute, Sadler Commission, Hunter Commission.",["Macaulay's Minute, Wood's Despatch, Hunter Commission, Sadler Commission","Wood's Despatch, Macaulay's Minute, Hunter Commission, Sadler Commission","Macaulay's Minute, Hunter Commission, Wood's Despatch, Sadler Commission","Macaulay's Minute, Wood's Despatch, Sadler Commission, Hunter Commission"],"1835, 1854, 1882 and 1917. The mnemonic: My Wise Hunter Rides Swiftly.",""],
["L31","Arrange these press laws in chronological order: Indian Press Act, Vernacular Press Act, Metcalfe's Act, Newspapers (Incitement to Offences) Act.",["Metcalfe's Act, Vernacular Press Act, Newspapers Act, Indian Press Act","Vernacular Press Act, Metcalfe's Act, Newspapers Act, Indian Press Act","Metcalfe's Act, Newspapers Act, Vernacular Press Act, Indian Press Act","Metcalfe's Act, Vernacular Press Act, Indian Press Act, Newspapers Act"],"1835, 1878, 1908 and 1910. The last two came under Minto II to curb the Swadeshi press.",""],
["L31","The Indian Press Act of 1910, which demanded security deposits from papers, was passed under:",["Lord Minto II","Lord Hardinge II","Lord Curzon","Lord Lytton"],"Minto II passed both the Newspapers Act (1908) and the Indian Press Act (1910); both were repealed in 1922.",""],
["L32","Rani Velu Nachiyar, who regained her kingdom from the Company in 1780, was the queen of:",["Sivaganga","Kittur","Jhansi","Ramgarh"],"She won with Hyder Ali's help, long before 1857. Kittur was Chennamma's state and Ramgarh Avantibai's.","p"],
["L32","Kittur Rani Chennamma rose against the British in:",["1824","1857","1806","1842"],"She resisted in 1824 when the British refused to recognise her adopted son — 33 years before 1857.",""],
["L32","Kittur, the kingdom of Rani Chennamma, is in present-day:",["Karnataka","Tamil Nadu","Maharashtra","Andhra Pradesh"],"Kittur is in Belagavi district, Karnataka; her ally was Sangolli Rayanna.",""],
["L32","Bhikaji Cama unfurled an Indian flag in 1907 at the International Socialist Congress held at:",["Stuttgart","Paris","London","Geneva"],"She raised the flag at Stuttgart, Germany, on 22 August 1907; she lived in Paris.","p"],
["L32","Who ran the secret Congress Radio during the Quit India Movement?",["Usha Mehta","Aruna Asaf Ali","Sucheta Kripalani","Kamaladevi Chattopadhyay"],"Usha Mehta broadcast from hiding in Bombay in 1942. Aruna Asaf Ali is the one who hoisted the flag at Gowalia Tank.","p"],
["L32","Matangini Hazra, 'Gandhi Buri', was shot in 1942 while leading a march on the police station at:",["Tamluk","Ballia","Satara","Chittagong"],"She was 73 and fell holding the tricolour at Tamluk, Midnapore, in September 1942.","p"],
["L32","Kanaklata Barua, shot at the age of 17 during the Quit India Movement, belonged to:",["Assam","Bengal","Manipur","Odisha"],"She was killed while trying to hoist the flag at the Gohpur police station, Assam. Matangini Hazra was from Bengal.","p"],
["L32","Who was India's first woman Chief Minister?",["Sucheta Kripalani","Sarojini Naidu","Nandini Satpathy","Vijaya Lakshmi Pandit"],"Sucheta Kripalani became Chief Minister of Uttar Pradesh in 1963. Sarojini Naidu was the first woman Governor.","p"],
["L32","Who became the first woman Governor of an Indian state?",["Sarojini Naidu","Sucheta Kripalani","Vijaya Lakshmi Pandit","Padmaja Naidu"],"Sarojini Naidu became Governor of the United Provinces in 1947; her daughter Padmaja later governed West Bengal.",""],
["L32","Kasturba Gandhi died in detention in 1944 at:",["Aga Khan Palace, Pune","Yerwada Jail, Pune","Sabarmati Ashram","Sevagram, Wardha"],"She and Gandhi were held at the Aga Khan Palace after the Quit India arrests; she died there on 22 February 1944.",""],
["L32","Pritilata Waddedar led the 1932 attack on the:",["Pahartali European Club","Writers' Building","Chittagong armoury","Alipore court"],"She led Surya Sen's group against the Pahartali club in Chittagong and took poison rather than be caught.",""],
["L32","Which Indian woman was the first to contest an election to a legislature, in Madras in 1926?",["Kamaladevi Chattopadhyay","Muthulakshmi Reddy","Sarojini Naidu","Annie Besant"],"Kamaladevi contested and narrowly lost; Muthulakshmi Reddy was nominated, not elected, to the Madras Council the same year.",""],
["L32","Rani Gaidinliu led a movement among the:",["Zeliangrong Nagas","Khasis","Mizos","Santhals"],"She was jailed at 16 in 1932 and freed in 1947; Nehru gave her the title 'Rani'.",""],
["L32","Tirot Sing, who fought the Anglo-Khasi war of 1829–33, was a chief of the:",["Khasis","Jaintias","Garos","Mizos"],"He was chief of Nongkhlaw in the Khasi hills; U Kiang Nongbah led the Jaintias in 1860–62.",""],
["L32","U Kiang Nongbah, hanged at Jowai in 1862, led a rising in the:",["Jaintia hills","Khasi hills","Garo hills","Naga hills"],"He led the Jaintia revolt of 1860–62. Tirot Sing was the Khasi chief, three decades earlier.",""],
["L32","The Rampa rebellion of 1922–24 was led by:",["Alluri Sitarama Raju","Komaram Bheem","Birsa Munda","Tantia Bhil"],"Alluri Sitarama Raju fought in the Godavari agency of Andhra against forest laws. Birsa Munda led the Ulgulan of 1899–1900.","p"],
["L32","Veer Narayan Singh is honoured as the first martyr of 1857 from:",["Chhattisgarh","Jharkhand","Odisha","Madhya Pradesh"],"The zamindar of Sonakhan shared hoarded grain with the starving in 1856, joined the revolt and was hanged at Raipur.",""],
["L32","Tilka Manjhi, an early Adivasi rebel against the Company, is associated with the region of:",["Bhagalpur","Chota Nagpur's Ranchi","Midnapore","Bastar"],"He led the hill people around Bhagalpur in the 1780s and is remembered for attacking Collector Augustus Cleveland.",""],
["L32","The Swadeshi Steam Navigation Company (1906) was founded by:",["V. O. Chidambaram Pillai","Subramania Bharati","C. Rajagopalachari","Jamsetji Tata"],"V.O.C., the 'Kappalottiya Tamizhan', ran ships from Tuticorin to challenge British shipping.","p"],
["L32","In 1911 Vanchinathan shot which British official at Maniyachi railway station?",["Robert Ashe","Douglas Kingsford","J. P. Saunders","Curzon Wyllie"],"Ashe was Collector of Tirunelveli. Kingsford was the Muzaffarpur target and Saunders was shot by Bhagat Singh's group.",""],
["L32","Tirupur Kumaran is remembered as 'Kodi Kaatha Kumaran' because he:",["Died holding the national flag during a march in 1932","Hoisted the flag at Gowalia Tank","Sailed India's first Swadeshi ship","Designed the Congress tricolour"],"He was beaten to death by police at Tirupur in 1932 but did not let the flag fall.",""],
["L32","To escape arrest in 1908, the poet Subramania Bharati moved to the French territory of:",["Pondicherry","Karaikal","Chandernagore","Mahe"],"He lived in Pondicherry for about ten years and kept writing patriotic poems.",""],
["L32","The 'Ali brothers', leaders of the Khilafat movement, were:",["Mohammad Ali and Shaukat Ali","Asaf Ali and Mohammad Ali","Shaukat Ali and Liaquat Ali","Mohammad Ali and Hasrat Mohani"],"Mohammad Ali (Jauhar) and Shaukat Ali led the Khilafat movement with Gandhi; Mohammad Ali presided at Kakinada in 1923.","p"],
["L32","Hakim Ajmal Khan was one of the founders of:",["Jamia Millia Islamia","Aligarh Muslim University","Darul Uloom Deoband","Osmania University"],"He helped found Jamia in 1920 during Non-Cooperation, and presided over the Ahmedabad Congress of 1921.",""],
["L33","Who was the secretary of the States Ministry who helped Sardar Patel integrate the princely states?",["V. P. Menon","K. M. Panikkar","B. N. Rau","H. N. Kunzru"],"V. P. Menon later wrote 'The Story of the Integration of the Indian States'. Panikkar and Kunzru sat on the Fazl Ali Commission.","p"],
["L33","Operation Polo (1948) was launched to integrate:",["Hyderabad","Junagadh","Goa","Kashmir"],"The 'police action' of 13–17 September 1948 ended the Nizam's resistance. Goa was freed by Operation Vijay.","p"],
["L33","Junagadh became part of India after:",["A plebiscite in February 1948","Operation Polo","Its Nawab signed the Instrument of Accession","A United Nations resolution"],"The Nawab had acceded to Pakistan and fled; the 1948 plebiscite went overwhelmingly for India.","p"],
["L33","Maharaja Hari Singh signed the Instrument of Accession to India on:",["26 October 1947","15 August 1947","13 September 1948","26 January 1950"],"He signed as tribal raiders from Pakistan advanced; Indian troops landed at Srinagar on 27 October.",""],
["L33","Goa was freed from Portuguese rule in December 1961 through:",["Operation Vijay","Operation Polo","Operation Blue Star","Operation Meghdoot"],"Goa, Daman and Diu became a Union Territory; Goa became a state only in 1987.","p"],
["L33","Sikkim became the 22nd state of India in 1975 through the:",["36th Amendment","35th Amendment","42nd Amendment","7th Amendment"],"The 35th Amendment had made it an 'associate state'; the 36th made it a full state.",""],
["L33","Potti Sriramulu died in 1952 while fasting for:",["A separate Telugu-speaking state","The abolition of untouchability","The release of political prisoners","A separate Tamil state"],"His death forced the creation of Andhra State on 1 October 1953.","p"],
["L33","Which was the first state formed on a linguistic basis after Independence?",["Andhra State","Gujarat","Maharashtra","Orissa"],"Andhra State came in 1953. Orissa (1936) was the first province formed on language, before Independence.","p"],
["L33","Who among these was NOT a member of the States Reorganisation (Fazl Ali) Commission?",["Pattabhi Sitaramayya","Fazl Ali","K. M. Panikkar","H. N. Kunzru"],"Remember FPK. Pattabhi Sitaramayya was in the JVP Committee with Nehru and Patel.","p"],
["L33","The JVP Committee on linguistic states (1948) consisted of:",["Nehru, Vallabhbhai Patel and Pattabhi Sitaramayya","Nehru, V. P. Menon and Panikkar","Jinnah, Vallabhbhai Patel and Prasad","Nehru, Vinoba Bhave and Patel"],"JVP stands for Jawaharlal, Vallabhbhai and Pattabhi; it too set language aside for the time being.",""],
["L33","The Dhar Commission of 1948 favoured reorganising provinces on the basis of:",["Administrative convenience","Language","Religion","Population"],"S. K. Dhar's commission rejected language as the main basis; the Fazl Ali Commission later accepted it broadly.",""],
["L33","The States Reorganisation Act, 1956 created:",["14 states and 6 Union Territories","16 states and 3 Union Territories","15 states and 7 Union Territories","14 states and 9 Union Territories"],"It came into force on 1 November 1956. The Fazl Ali Commission had suggested 16 states and 3 territories.",""],
["L33","Maharashtra and Gujarat were formed out of Bombay State in:",["1960","1956","1966","1953"],"Both were created on 1 May 1960, which is celebrated as Maharashtra Day and Gujarat Day.","p"],
["L33","Haryana was carved out of Punjab in:",["1966","1960","1971","1956"],"Haryana was formed on 1 November 1966, and Chandigarh became a Union Territory.",""],
["L33","Nagaland became a state of India in:",["1963","1972","1987","1956"],"Nagaland became the 16th state in 1963; Manipur, Meghalaya and Tripura followed in 1972.",""],
["L33","Arrange these in the order in which they became states: Mizoram, Himachal Pradesh, Telangana, Sikkim.",["Himachal Pradesh, Sikkim, Mizoram, Telangana","Sikkim, Himachal Pradesh, Mizoram, Telangana","Himachal Pradesh, Mizoram, Sikkim, Telangana","Mizoram, Himachal Pradesh, Sikkim, Telangana"],"Himachal 1971, Sikkim 1975, Mizoram 1987, Telangana 2014.",""],
["L33","Which of these became a state in 1987?",["Mizoram","Meghalaya","Tripura","Nagaland"],"Mizoram, Arunachal Pradesh and Goa became states in 1987; Meghalaya and Tripura in 1972 and Nagaland in 1963.",""],
["L33","Which state formed in November 2000 was carved out of Bihar?",["Jharkhand","Chhattisgarh","Uttarakhand","Telangana"],"Chhattisgarh came from Madhya Pradesh and Uttarakhand from Uttar Pradesh; Telangana came in 2014.",""],
["L33","Telangana became India's 29th state in:",["2014","2000","2019","2011"],"It was carved out of Andhra Pradesh on 2 June 2014.",""],
["L33","The Constitution of India was adopted by the Constituent Assembly on:",["26 November 1949","26 January 1950","15 August 1947","9 December 1946"],"It was adopted on 26 November 1949 (Constitution Day) and came into force on 26 January 1950.","p"],
["L33","The Chief Election Commissioner who conducted India's first general election (1951–52) was:",["Sukumar Sen","T. N. Seshan","K. V. K. Sundaram","B. N. Rau"],"Sukumar Sen was the first CEC; the election ran from October 1951 to February 1952.",""],
["L33","The French settlements of Pondicherry were transferred to India de facto in:",["1954","1947","1961","1962"],"The de facto transfer was in 1954; the de jure transfer came in 1962.",""],
["L33","Which two Union Territories were merged into one in January 2020?",["Dadra and Nagar Haveli, and Daman and Diu","Andaman and Nicobar, and Lakshadweep","Chandigarh, and Delhi","Ladakh, and Jammu and Kashmir"],"They became one Union Territory on 26 January 2020. Ladakh and J and K were separated, not merged, in 2019.",""],
["L33","The state of Jammu and Kashmir was reorganised into two Union Territories with effect from:",["31 October 2019","5 August 2019","26 January 2020","15 August 2019"],"The Act was passed in August 2019; the Union Territories of J and K and Ladakh came into being on 31 October 2019, Patel's birthday.",""]

<script>
"use strict";
/* ============================================================
   Workbook engine — shared by the History and Computer Knowledge pages (tools/workbook/lib.js puts it in each one).
   APP.mode "era": a subject app with its own lessons and questions (Learn · Practice · Mock · Revise · Plan).
   APP.mode "hub": start here, a plan across a family of apps, and revision across all of them (no questions of its own).
   Optional data: APP.hub (a family hub to link to), HEATMAP (where the marks come from, by exam),
   a question's 8th field (the paper it was reported from), APP.tabs (the tabs, in order) — a tab the engine
   does not know (e.g. Chemistry's "lab") is drawn by the page's own script: render<Tab>() and, when you
   leave it, leave<Tab>().
   ============================================================ */
const HUB = APP.mode === "hub";
const EMBED = (() => { try { return window.parent !== window; } catch(e) { return true; } })();
const TABS = HUB ? ["start","plan","revise"] : (APP.tabs || ["learn","practice","mock","revise","plan"]);

/* ============================================================
   HELPERS & STATE
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hash = s => { let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5)+h + s.charCodeAt(i))|0; return "q"+(h>>>0).toString(36); };
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; };
const L = id => LESSONS.find(l => l.id === id);
const LNUM = id => LESSONS.findIndex(l => l.id === id) + 1;
const G = id => GROUPS.find(g => g.id === id) || GROUPS[0];
const A = id => APP.apps.find(a => a.id === id);
const appOf = id => (L(id) && L(id).app) || APP.id;       // in the hub, each lesson carries the app it lives in

const QS = QB.map(r => {
  const fixed = !!r[6];
  return { t:r[0], q:r[1], o:r[2], e:r[3], p:(r[4]||"").includes("p"), a: fixed ? (r[5]||0) : 0, fixed, id:hash(r[1]), src: r[7] || "" };
});
const byLesson = id => QS.filter(q => q.t === id);
const makePerm = q => q.fixed ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i));
const qCount = id => HUB ? null : byLesson(id).length;
const pCount = id => HUB ? ((APP.pcount||{})[id] || 0) : byLesson(id).filter(q=>q.p).length;

const KEY = APP.key;
let S = { ans:{}, bm:{}, les:{}, mocks:[], plan:null };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const record = (q, ok) => { S.ans[q.id] = ok ? 1 : 0; save(); renderTop(); };

/* Another History app's saved progress. Every page is on the same site, so the hub (and a
   plan) can see which lessons you have read and quizzed in the subject apps. */
function appState(a){ try { return JSON.parse(localStorage.getItem(a.key) || "{}") || {}; } catch(e) { return {}; } }
function lessonState(id){
  const owner = appOf(id);
  if (owner === APP.id) return S.les[id] || {};
  const a = A(owner); return a ? ((appState(a).les || {})[id] || {}) : {};
}
const lesDone = l => !!lessonState(l.id).done;
const heatDots = n => `<span class="dots" aria-label="Asked ${n===3?"almost every shift":n===2?"often":"now and then"}">${[1,2,3].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>`;

/* Open a lesson or a tab, here or in the History app it lives in. Inside पाठShala the
   app is asked to switch (so your session is tracked); on its own the page just navigates. */
function openApp(appId, lesson, tab){
  if (appId === APP.id) {
    if (lesson) openLesson(lesson, "learn"); else go(tab || TABS[0]);
    return;
  }
  const a = APP.hub && appId === APP.hub.id ? APP.hub : A(appId);
  if (!a) return;
  const here = () => { location.href = a.file + (lesson ? "?lesson=" + encodeURIComponent(lesson) : "") + (tab ? "#" + tab : ""); };
  if (!EMBED) return here();
  let ok = false;
  const onAck = e => { if (e.origin === location.origin && e.data && e.data.type === "shabd-open-ok") ok = true; };
  window.addEventListener("message", onAck);
  try { window.parent.postMessage({ type:"shabd-open", mod:a.id, lesson: lesson || null, tab: tab || null }, location.origin); } catch(e) {}
  setTimeout(() => { window.removeEventListener("message", onAck); if (!ok) here(); }, 700);
}
const hubLink = (before, label, tab, after) => APP.hub ? before + goLink(label, APP.hub.id, null, tab) + (after || "") : "";
const goLink = (label, appId, lesson, tab) => `<button type="button" class="golink" data-go="${esc(JSON.stringify([appId, lesson||null, tab||null]))}">${label}</button>`;
function bindGo(root){
  root.querySelectorAll("[data-go]").forEach(b => b.onclick = ev => { ev.stopPropagation(); const g = JSON.parse(b.dataset.go); openApp(g[0], g[1], g[2]); });
}

function renderTop(){
  if (HUB) {
    const done = LESSONS.filter(lesDone).length;
    $("#topstat").innerHTML = `<b>${done}</b>/${LESSONS.length} lessons<br>in ${APP.apps.length} apps`;
    return;
  }
  const ids = Object.keys(S.ans).filter(k => QS.some(q => q.id === k));
  const right = ids.filter(k => S.ans[k] === 1).length;
  const pct = ids.length ? Math.round(right*100/ids.length) : 0;
  $("#topstat").innerHTML = `<b>${ids.length}</b>/${QS.length} tried<br><b>${pct}%</b> right now`;
}

/* ============================================================
   ROUTING
   ============================================================ */
let TAB = TABS[0];
let timerId = null;
function go(tab){
  if (!TABS.includes(tab)) tab = TABS[0];
  const own = t => t.charAt(0).toUpperCase() + t.slice(1);
  if (TAB !== tab && typeof window["leave" + own(TAB)] === "function") window["leave" + own(TAB)]();
  TAB = tab;
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.tab===tab ? "page" : "false"));
  if (tab === "start") renderStart();
  if (tab === "learn") renderLearn();
  if (tab === "practice") renderPractice();
  if (tab === "mock") renderMock();
  if (tab === "revise") renderRevise();
  if (tab === "plan") renderPlan();
  if (!["start","learn","practice","mock","revise","plan"].includes(tab) && typeof window["render" + own(tab)] === "function") window["render" + own(tab)]();
  window.scrollTo(0,0);
  try { history.replaceState(null, "", location.pathname + location.search + "#" + tab); } catch(e) {}
}
document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => {
  if (TAB === "mock" && M && M.running && b.dataset.tab !== "mock") { go("mock"); showMockLeave(b.dataset.tab); return; }
  go(b.dataset.tab);
}));

/* ============================================================
   START HERE (hub)
   ============================================================ */
function renderStart(){
  const done = LESSONS.filter(lesDone).length;
  const cards = APP.apps.map(a => {
    const ls = LESSONS.filter(l => l.app === a.id), d = ls.filter(lesDone).length, it = INTROS[a.id] || {};
    return `<button type="button" class="appc" data-go="${esc(JSON.stringify([a.id,null,null]))}">
      <div class="hd"><span class="ic" aria-hidden="true">${a.ico}</span><span><b>${esc(a.title)}</b><small>${esc(a.hi)}</small></span><span class="go">Open ›</span></div>
      ${it.lead ? `<p>${esc(it.lead)}</p>` : ""}
      <div class="meter"><i style="width:${ls.length ? d/ls.length*100 : 0}%"></i></div>
      <span class="meta">${d}/${ls.length} lessons done · ${(APP.qcount||{})[a.id] || 0} questions</span></button>`;
  }).join("");
  const tips = APP.apps.filter(a => INTROS[a.id]).map(a => `<div><dt>${esc(a.title)}</dt><dd>${esc(INTROS[a.id].tip)} ${esc(INTROS[a.id].order)}</dd></div>`).join("");
  $("#app").innerHTML = `<section class="view stack">
    <div class="hero">
      <span class="eyebrow">New to history? Start here</span>
      <h1>History, from zero to exam-ready</h1>
      <p>SSC splits history into five subjects, so these are five apps &mdash; Ancient, Medieval, Modern, Art &amp; Culture, and World &mdash; with ${LESSONS.length} lessons between them. You do not need to know anything before you begin: every lesson opens with a two-minute story that explains what happened and why, and only then gives you the tables, tricks and traps the exam asks about.</p>
      <div class="meter" aria-label="Lessons done in every History app"><i style="width:${done/LESSONS.length*100}%"></i></div>
      <div class="row between"><span class="muted num" style="font-size:13px">${done}/${LESSONS.length} lessons done across the apps</span>
        <button class="btn pri sm" type="button" id="toplan">${S.plan ? "Open my plan" : "Make a study plan"}</button></div>
    </div>
    <div class="block"><h3>How to use these apps</h3><ol class="steps-list">
      <li><b>Pick a plan</b> in the Plan tab &mdash; 5, 7, 10, 15 or 30 days. It tells you exactly what to read each day, and ticks itself as you finish lessons in the apps.</li>
      <li><b>Read the story first</b> in every lesson, then the tables. The <b>Trick</b> boxes help you remember; the <b>Trap</b> boxes are the pairs SSC swaps to catch you.</li>
      <li><b>Take the quiz</b> at the end of each lesson. Anything you get wrong waits for you under Practice &rarr; Mistakes until you get it right.</li>
      <li><b>Revise in layers</b> in the Revise tab here: 30 days out read every summary, in the last week only the most-asked lessons, and in the final hour the Last moment sheet.</li>
    </ol></div>
    <h2>The five apps</h2>
    <div class="appcs">${cards}</div>
    ${tips ? `<div class="block"><h3>How to study each one</h3><dl class="facts prose">${tips}</dl></div>` : ""}
    <div class="block"><h3>Where the marks are</h3><dl class="facts prose">${GROUPS.filter(g=>ERANOTE[g.id]).map(g=>`<div><dt>${esc(g.name)}</dt><dd>${ERANOTE[g.id]}</dd></div>`).join("")}</dl>
      <p class="muted" style="font-size:13px;margin-top:8px">The dots next to each lesson show how often its topic comes up: three dots means almost every shift.</p></div>
  </section>`;
  bindGo($("#app"));
  $("#toplan").onclick = () => go("plan");
}

/* ============================================================
   LEARN (subject app)
   ============================================================ */
function lessonRow(l, nextL){
  const st = lessonState(l.id), n = byLesson(l.id).length;
  return `<button type="button" class="les ${lesDone(l)?"done":""} ${nextL&&l.id===nextL.id?"next":""}" data-open="${l.id}">
    <span class="no">${lesDone(l) ? "✓" : LNUM(l.id)}</span>
    <span class="t"><b>${esc(l.title)}${heatDots(l.heat)}</b><span>${l.hi} · ${n} questions</span></span>
    <span class="sc">${st.best!=null ? `best<br>${st.best}/${n}` : ""}</span></button>`;
}
function renderLearn(){
  const done = LESSONS.filter(lesDone).length;
  const nextL = LESSONS.find(l => !lesDone(l));
  const it = INTROS[APP.id] || {};
  const parts = [];
  LESSONS.forEach(l => {
    const name = l.part ? l.part[0] : "";
    if (!parts.length || parts[parts.length-1].name !== name) parts.push({ name, hi: l.part ? l.part[1] : "", ls: [] });
    parts[parts.length-1].ls.push(l);
  });
  $("#app").innerHTML = `<section class="view stack">
    <div class="hero">
      <span class="eyebrow">${esc(APP.hi)}${APP.tagline ? " \u00b7 " + esc(APP.tagline) : ""}</span>
      <h1>${esc(APP.title)}</h1>
      <p>${it.lead ? esc(it.lead) + " " : ""}${LESSONS.length} lessons and ${QS.length} exam-style questions. Each lesson starts with a short story, then the tables, tricks and traps, a quiz and a one-screen summary.</p>
      <div class="meter" aria-label="Lessons done"><i style="width:${done/LESSONS.length*100}%"></i></div>
      <div class="row between"><span class="muted num" style="font-size:13px">${done}/${LESSONS.length} lessons done</span>
      ${nextL ? `<button class="btn pri sm" type="button" data-open="${nextL.id}">${done? "Continue" : "Start"}: ${esc(nextL.title)}</button>` : `<span class="muted" style="font-size:13px">All lessons done. Try a mock test.</span>`}</div>
    </div>
    ${it.tip ? `<div class="callout"><b>How to study it.</b> ${esc(it.tip)} ${esc(it.order || "")}</div>` : ""}
    ${HEATMAP ? `<details class="block hmwrap"><summary><h3>Exam heat map</h3><span class="muted">which lessons carry the marks in each exam \u203a</span></summary>${heatHTML(false)}</details>` : ""}
    ${parts.map(p => `${p.name ? `<div class="grph"><h2>${esc(p.name)}</h2><span>${p.ls.length} lessons</span></div>${p.hi?`<p class="muted" style="font-size:13px;margin:-8px 0 2px">${p.hi}</p>`:""}` : ""}
      <div class="lessons">${p.ls.map(l => lessonRow(l, nextL)).join("")}</div>`).join("")}
    <p class="foot">The dots show how often a topic is asked &mdash; three dots means almost every paper.${hubLink(" A plan across every app in this subject, and revision across all of them, is in ", APP.hub ? APP.hub.title : "", null, ".")}</p>
  </section>`;
  $("#app").querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openLesson(b.dataset.open, "learn")));
  bindGo($("#app"));
}

function blockHTML(b){
  if (b.k==="p") return `<div class="plain"><p>${b.h}</p></div>`;
  if (b.k==="hot") return `<div class="hot"><span class="lab">Why it is asked</span>${b.h}</div>`;
  if (b.k==="story") return `<div class="story"><span class="lab">${esc(APP.storyLabel || "The story first \u00b7 two minutes")}</span>${b.h}${b.key?`<p class="key"><b>${esc(APP.keyLabel || "Carry this into the tables:")}</b> ${esc(b.key)}</p>`:""}</div>`;
  if (b.k==="trick") return `<div class="trick"><span class="lab">Trick</span>${b.h}</div>`;
  if (b.k==="trap") return `<div class="trap"><span class="lab">Trap · don't mix these up</span>${b.h}</div>`;
  if (b.k==="link") return `<div class="link"><span class="lab">Link it up</span>${b.h}</div>`;
  if (b.k==="ex") return `<div class="link"><span class="lab">Worked example</span>${b.h}</div>`;
  if (b.k==="facts") return `<div class="block"><h3>${b.title}</h3><dl class="facts">${b.rows.map(r=>`<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join("")}</dl></div>`;
  if (b.k==="tl") return `<div class="block"><h3>${b.title}</h3><ul class="tl">${b.rows.map(r=>`<li><span class="y">${r[0]}</span><span>${r[1]}</span></li>`).join("")}</ul></div>`;
  if (b.k==="table") return `<div class="block"><h3>${b.title}</h3><div class="tbl"><table><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  if (b.k==="fig") return `<div class="block${b.wide?" phblock":""}"><h3>${b.title}</h3><figure class="fig${b.wide?" wide":""}"${b.wide?` style="--minw:${b.wide}px"`:""}>${b.svg}<figcaption>${b.cap}</figcaption></figure></div>`;
  return typeof visBlock === "function" ? visBlock(b) : "";      // photos, maps, charts, timelines… from study-visual.js
}

let LQ = null;
function openLesson(id, step){
  if (HUB || !L(id) || appOf(id) !== APP.id) { openApp(appOf(id), id); return; }   // the hub shows lessons in their own app
  const l = L(id), i = LNUM(id);
  if (step === "quiz") { LQ = { id, list: shuffle(byLesson(id)).map(q => ({q, perm:makePerm(q)})), i:0, score:0, picked:null }; }
  const head = `<div class="lhead"><button class="back" type="button" id="lback">‹ Lessons</button></div>
    <span class="eyebrow">${esc(APP.title)} · Lesson ${i} of ${LESSONS.length} · ${l.hi}</span><h1>${esc(l.title)}</h1>
    <p class="muted" style="font-size:13px">Asked in CGL ${heatDots(l.heat)} ${l.heat===3?"— almost every shift":l.heat===2?"— often":"— now and then"}</p>
    <div class="steps" role="tablist">
      <button type="button" data-step="learn" aria-current="${step==="learn"?"step":"false"}">1 · Learn</button>
      <button type="button" data-step="quiz" aria-current="${step==="quiz"?"step":"false"}">2 · Quiz</button>
      <button type="button" data-step="sum" aria-current="${step==="sum"?"step":"false"}">3 · Summary</button>
    </div>`;
  let body = "";
  if (step === "learn") {
    body = `<div class="stack">${l.blocks.map(blockHTML).join("")}
      <div class="row end"><button class="btn pri" type="button" id="toquiz">Take the quiz · ${byLesson(id).length} questions</button></div></div>`;
  } else if (step === "quiz") {
    body = `<div id="lq"></div>`;
  } else {
    const nxt = LESSONS[i];
    body = `<div class="stack"><div class="block"><h3>Remember these</h3><ul class="sum">${l.sum.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
      <div class="row between"><button class="btn" type="button" id="relearn">Read again</button>
      ${nxt ? `<button class="btn pri" type="button" id="nextles">Next: ${esc(nxt.title)}</button>` : `<button class="btn pri" type="button" id="tomock">Take a mock test</button>`}</div></div>`;
    S.les[id] = Object.assign(S.les[id]||{}, {done:1}); save(); renderTop();
  }
  $("#app").innerHTML = `<section class="view stack">${head}${body}</section>`;
  $("#lback").onclick = () => go("learn");
  $("#app").querySelectorAll("[data-step]").forEach(b => b.onclick = () => openLesson(id, b.dataset.step));
  if (step==="learn") $("#toquiz").onclick = () => openLesson(id,"quiz");
  if (step==="quiz") renderLQ();
  if (step==="sum") {
    $("#relearn").onclick = () => openLesson(id,"learn");
    const n = $("#nextles"); if (n) n.onclick = () => openLesson(LESSONS[i].id,"learn");
    const m = $("#tomock"); if (m) m.onclick = () => go("mock");
  }
  window.scrollTo(0,0);
}

function optsHTML(q, perm, state){
  return perm.map((oi, k) => {
    let cls = "opt";
    if (state.reveal) { if (oi === q.a) cls += " ok"; else if (oi === state.picked) cls += " no"; }
    else if (state.sel === oi) cls += " sel";
    return `<button type="button" class="${cls}" data-oi="${oi}" ${state.reveal?"disabled":""}><span class="k">${"ABCD"[k]}</span><span>${esc(q.o[oi])}</span></button>`;
  }).join("");
}
function expHTML(q, picked){
  const ok = picked === q.a;
  return `<div class="exp">${ok ? `<b class="okl">Correct.</b>` : `<b class="nol">Answer: ${esc(q.o[q.a])}.</b>`} ${esc(q.e)}</div>`;
}
function metaHTML(q, no){
  return `<div class="qmeta"><span class="qno">${no}</span><span class="tag">L${LNUM(q.t)} \u00b7 ${esc(L(q.t).title)}</span>${q.src?`<span class="tag src" title="Reported by candidates after this paper (memory-based)">\ud83d\udcdc ${esc(q.src)}</span>`:""}${q.p?`<span class="tag pyq" title="This fact comes up again and again in SSC papers">Repeatedly asked</span>`:""}
  <button type="button" class="bm" data-bm="${q.id}" aria-pressed="${S.bm[q.id]?"true":"false"}" aria-label="Bookmark">${S.bm[q.id]?"★":"☆"}</button></div>`;
}

function renderLQ(){
  const box = $("#lq");
  if (LQ.i >= LQ.list.length) {
    const n = LQ.list.length;
    const st = S.les[LQ.id] || {}; st.best = Math.max(st.best||0, LQ.score); S.les[LQ.id] = st; save();
    box.innerHTML = `<div class="stack"><div class="block stack"><span class="eyebrow">Quiz done</span>
      <div class="scorebig"><span class="num">${LQ.score}</span><span class="muted">/ ${n} correct</span></div>
      <p class="muted">${LQ.score===n ? "Full marks." : LQ.score >= n*0.8 ? "Strong. Review the ones you missed under Practice → Mistakes." : "Read the story and the Trap boxes once more, then retry. Missed questions are saved under Practice → Mistakes."}</p></div>
      <div class="row between"><button class="btn" type="button" id="retry">Retry quiz</button><button class="btn pri" type="button" id="tosum">See summary</button></div></div>`;
    $("#retry").onclick = () => openLesson(LQ.id,"quiz");
    $("#tosum").onclick = () => openLesson(LQ.id,"sum");
    return;
  }
  const it = LQ.list[LQ.i], q = it.q;
  const reveal = LQ.picked !== null;
  box.innerHTML = `<div class="stack"><div class="meter"><i style="width:${LQ.i/LQ.list.length*100}%"></i></div>
    <article class="qcard">${metaHTML(q, `Q${LQ.i+1}/${LQ.list.length}`)}
    <p class="qt">${esc(q.q)}</p><div class="opts">${optsHTML(q, it.perm, {picked:LQ.picked, reveal})}</div>
    ${reveal ? expHTML(q, LQ.picked) : ""}</article>
    ${reveal ? `<div class="row end"><button class="btn pri" type="button" id="lqnext">${LQ.i+1 < LQ.list.length ? "Next question" : "Finish"}</button></div>` : `<p class="muted" style="font-size:13px">Score so far: <span class="num">${LQ.score}</span></p>`}</div>`;
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (LQ.picked !== null) return;
    LQ.picked = +b.dataset.oi; const ok = LQ.picked === q.a; if (ok) LQ.score++; record(q, ok); renderLQ();
  });
  bindBM(box);
  const nx = $("#lqnext"); if (nx) nx.onclick = () => { LQ.i++; LQ.picked = null; renderLQ(); window.scrollTo(0,0); };
}

function bindBM(root){
  root.querySelectorAll("[data-bm]").forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    const id = b.dataset.bm; if (S.bm[id]) delete S.bm[id]; else S.bm[id] = 1; save();
    b.setAttribute("aria-pressed", S.bm[id] ? "true":"false"); b.textContent = S.bm[id] ? "★" : "☆";
  });
}

/* ============================================================
   PRACTICE
   ============================================================ */
let PF = "all", PSHOW = 20, PORDER = null, PPERM = {}, PPICK = {};
const hasHot = () => LESSONS.some(l => l.heat === 3) && LESSONS.some(l => l.heat !== 3);
function practiceList(){
  let list = QS;
  if (PF === "pyq") list = QS.filter(q => q.p);
  else if (PF === "src") list = QS.filter(q => q.src);
  else if (PF === "hot") list = QS.filter(q => L(q.t).heat === 3);
  else if (PF === "wrong") list = QS.filter(q => S.ans[q.id] === 0);
  else if (PF === "new") list = QS.filter(q => S.ans[q.id] === undefined);
  else if (PF === "bm") list = QS.filter(q => S.bm[q.id]);
  else if (PF !== "all") list = QS.filter(q => q.t === PF);
  if (PORDER) { const pos = new Map(PORDER.map((id,i)=>[id,i])); list = list.slice().sort((a,b)=>(pos.get(a.id)??0)-(pos.get(b.id)??0)); }
  return list;
}
function renderPractice(){
  const wrongN = QS.filter(q => S.ans[q.id] === 0).length, bmN = QS.filter(q=>S.bm[q.id]).length;
  const pyqN = QS.filter(q=>q.p).length, hotN = QS.filter(q=>L(q.t).heat===3).length;
  const chips = [["all",`All ${QS.length}`],["new","Not tried"],["wrong",`Mistakes ${wrongN}`]]
    .concat(hasHot() ? [["hot",`Most-asked topics ${hotN}`]] : [])
    .concat(QS.some(q => q.src) ? [["src",`Reported in papers ${QS.filter(q=>q.src).length}`]] : [])
    .concat([["pyq",`Repeatedly asked ${pyqN}`],["bm",`Starred ${bmN}`]])
    .concat(LESSONS.map(l=>[l.id,`L${LNUM(l.id)} ${l.title}`]));
  const list = practiceList();
  $("#app").innerHTML = `<section class="view stack">
    <div class="stack" style="gap:6px"><span class="eyebrow">Question bank · ${QS.length} questions</span><h1>Practice</h1>
    <p class="muted">Tap an option to check it. Wrong answers go to <b>Mistakes</b> until you get them right. <b>Repeatedly asked</b> marks the facts that come up again and again in SSC papers${hasHot() ? "; <b>Most-asked topics</b> is every question from the three-dot lessons" : ""}.</p></div>
    <div class="chips" role="group" aria-label="Filter">${chips.map(c=>`<button type="button" class="chip" data-f="${c[0]}" aria-pressed="${PF===c[0]}">${esc(c[1])}</button>`).join("")}</div>
    <div class="row between"><span class="muted num" style="font-size:13px">${list.length} questions</span>
      <div class="row"><button class="btn sm ghost" type="button" id="pshuf">${PORDER?"In order":"Shuffle"}</button></div></div>
    <div class="stack" id="plist"></div>
  </section>`;
  $("#app").querySelectorAll("[data-f]").forEach(b => b.onclick = () => { PF = b.dataset.f; PSHOW = 20; PPICK = {}; renderPractice(); });
  $("#pshuf").onclick = () => { PORDER = PORDER ? null : shuffle(QS.map(q=>q.id)); PSHOW = 20; renderPractice(); };
  const chipOn = $(`.chip[aria-pressed="true"]`); if (chipOn) chipOn.scrollIntoView({block:"nearest", inline:"center"});
  drawPList();
}
function pCard(q, idx){
  if (!PPERM[q.id]) PPERM[q.id] = makePerm(q);
  const picked = PPICK[q.id]; const reveal = picked !== undefined;
  return `<article class="qcard" data-q="${q.id}">${metaHTML(q, "Q"+(idx+1))}<p class="qt">${esc(q.q)}</p>
    <div class="opts">${optsHTML(q, PPERM[q.id], {picked: reveal?picked:null, reveal})}</div>${reveal?expHTML(q,picked):""}</article>`;
}
function drawPList(){
  const list = practiceList(), box = $("#plist");
  if (!list.length) { box.innerHTML = `<p class="empty">${PF==="wrong"?"No mistakes saved. Answer some questions first, or you've cleared them all.":PF==="bm"?"Nothing starred yet. Tap ☆ on any question.":"Nothing here."}</p>`; return; }
  box.innerHTML = list.slice(0, PSHOW).map((q,i)=>pCard(q,i)).join("") + (list.length > PSHOW ? `<button class="btn" type="button" id="pmore">Show 20 more (${list.length-PSHOW} left)</button>` : "");
  box.querySelectorAll(".qcard").forEach(bindCard);
  const more = $("#pmore"); if (more) more.onclick = () => { PSHOW += 20; drawPList(); };
}
function bindCard(card){
  card.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const q = QS.find(x => x.id === card.dataset.q); if (PPICK[q.id] !== undefined) return;
    PPICK[q.id] = +b.dataset.oi; record(q, PPICK[q.id] === q.a);
    const idx = +card.querySelector(".qno").textContent.slice(1) - 1;
    const tmp = document.createElement("div"); tmp.innerHTML = pCard(q, idx); const nc = tmp.firstElementChild;
    card.replaceWith(nc); bindCard(nc);
  });
  bindBM(card);
}

/* ============================================================
   MOCK TEST
   ============================================================ */
let M = null, MCFG = {n:25, scope:"all", neg:1}, LEAVE_TO = null;
function mockPool(scope){
  if (scope === "all") return QS;
  if (scope === "pyq") return QS.filter(q=>q.p);
  if (scope === "src") return QS.filter(q=>q.src);
  if (scope === "hot") return QS.filter(q=>L(q.t).heat===3);
  if (scope === "wrong") return QS.filter(q=>S.ans[q.id]===0);
  return QS.filter(q=>q.t===scope);
}
function renderMock(){
  if (M && M.running) return drawMockRun();
  if (M && M.done) return drawMockResult();
  const hist = (S.mocks||[]).slice(-6).reverse();
  $("#app").innerHTML = `<section class="view stack">
    <div class="stack" style="gap:6px"><span class="eyebrow">Timed, SSC pattern</span><h1>Mock test</h1>
    <p class="muted">+2 for a right answer, &minus;0.5 for a wrong one, 36 seconds a question (CGL Tier-1 pace). Answers show only after you submit.</p></div>
    <div class="block stack">
      <fieldset><legend>Questions</legend><div class="radios">${[10,25,50,100].map(n=>`<label><input type="radio" name="mn" id="mn${n}" value="${n}" ${MCFG.n===n?"checked":""}><span>${n} · ${Math.round(n*36/60)} min</span></label>`).join("")}</div></fieldset>
      <fieldset><legend>From</legend><select id="mscope" aria-label="Topics to draw from">
        <option value="all">Everything (${QS.length} Q)</option>
        ${hasHot() ? `<option value="hot">Most-asked topics only</option>` : ""}
        ${QS.some(q => q.src) ? `<option value="src">Reported in papers only</option>` : ""}
        <option value="pyq">Repeatedly asked only</option>
        <option value="wrong">My mistakes</option>
        ${LESSONS.map(l=>`<option value="${l.id}">L${LNUM(l.id)} · ${esc(l.title)}</option>`).join("")}
      </select></fieldset>
      <label class="row" style="gap:8px;font-weight:600"><input type="checkbox" id="mneg" ${MCFG.neg?"checked":""}> Negative marking (&minus;0.5)</label>
      <div id="merr" class="muted" style="font-size:14px"></div>
      <div class="row end"><button class="btn pri" type="button" id="mstart">Start test</button></div>
    </div>
    ${hist.length ? `<div class="block"><h3>Recent attempts</h3><div class="hist">${hist.map(h=>`<div><span>${esc(h.d)} · ${h.n} Q</span><span class="num">${h.score}/${h.max} · ${h.acc}%</span></div>`).join("")}</div></div>` : ""}
  </section>`;
  if ([...$("#mscope").options].some(o => o.value === MCFG.scope)) $("#mscope").value = MCFG.scope;
  $("#mstart").onclick = () => {
    MCFG.n = +(document.querySelector('input[name="mn"]:checked')||{value:25}).value;
    MCFG.scope = $("#mscope").value; MCFG.neg = $("#mneg").checked ? 1 : 0;
    const pool = mockPool(MCFG.scope);
    if (!pool.length) { $("#merr").textContent = "No questions in that set yet. Pick another source."; return; }
    const qs = shuffle(pool).slice(0, MCFG.n);
    M = { running:true, list: qs.map(q=>({q, perm:makePerm(q)})), ans: qs.map(()=>null), mark: qs.map(()=>false), i:0, neg:MCFG.neg, secs: qs.length*36, start: Date.now(), showPal:false, confirm:false };
    M.end = M.start + M.secs*1000;
    startTimer(); drawMockRun();
  };
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(() => {
    if (!M || !M.running) { clearInterval(timerId); return; }
    const left = Math.max(0, Math.round((M.end - Date.now())/1000));
    const el = $("#mtime"); if (el) { el.textContent = fmt(left); el.classList.toggle("low", left <= 60); }
    if (left <= 0) submitMock();
  }, 1000);
}
const fmt = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
function drawMockRun(){
  const it = M.list[M.i], q = it.q, left = Math.max(0, Math.round((M.end-Date.now())/1000));
  const answered = M.ans.filter(a=>a!==null).length;
  $("#app").innerHTML = `<section class="view stack">
    <div class="mbar"><span class="timer num ${left<=60?"low":""}" id="mtime">${fmt(left)}</span>
      <span class="muted num" style="font-size:13px;flex:1">Q ${M.i+1}/${M.list.length} · ${answered} answered</span>
      <button class="btn sm" type="button" id="mpal">${M.showPal?"Hide":"All Qs"}</button></div>
    ${LEAVE_TO ? `<div class="confirm"><b>Leave the test?</b><span>Your answers so far will be scored now.</span><div class="row"><button class="btn sm pri" type="button" id="lvy">Submit and leave</button><button class="btn sm" type="button" id="lvn">Stay</button></div></div>` : ""}
    ${M.showPal ? `<div class="block"><div class="pal">${M.list.map((_,k)=>`<button type="button" data-j="${k}" class="${M.ans[k]!==null?"a":""} ${M.mark[k]?"m":""} ${k===M.i?"cur":""}" aria-label="Question ${k+1}">${k+1}</button>`).join("")}</div>
      <p class="muted" style="font-size:12px;margin-top:8px">Filled = answered · gold line = marked for review</p></div>` : ""}
    <article class="qcard"><div class="qmeta"><span class="qno">Q${M.i+1}</span><span class="tag">L${LNUM(q.t)}</span>${M.mark[M.i]?`<span class="tag pyq">Marked</span>`:""}</div>
      <p class="qt">${esc(q.q)}</p><div class="opts">${optsHTML(q, it.perm, {sel:M.ans[M.i], reveal:false})}</div></article>
    <div class="row between"><button class="btn" type="button" id="mprev" ${M.i===0?"disabled":""}>‹ Prev</button>
      <button class="btn ghost" type="button" id="mmark">${M.mark[M.i]?"Unmark":"Mark"}</button>
      <button class="btn ghost" type="button" id="mclr" ${M.ans[M.i]===null?"disabled":""}>Clear</button>
      <button class="btn ${M.i<M.list.length-1?"pri":""}" type="button" id="mnext" ${M.i===M.list.length-1?"disabled":""}>Next ›</button></div>
    ${M.confirm ? `<div class="confirm"><b>Submit the test?</b><span>${M.list.length-answered} unanswered${M.mark.filter(Boolean).length?`, ${M.mark.filter(Boolean).length} marked for review`:""}.</span><div class="row"><button class="btn sm pri" type="button" id="msubY">Submit</button><button class="btn sm" type="button" id="msubN">Keep going</button></div></div>`
      : `<button class="btn pri" type="button" id="msub">Submit test</button>`}
  </section>`;
  $("#app").querySelectorAll(".opt").forEach(b => b.onclick = () => { M.ans[M.i] = +b.dataset.oi; drawMockRun(); });
  $("#mprev").onclick = () => { if (M.i>0){M.i--; drawMockRun();} };
  $("#mnext").onclick = () => { if (M.i<M.list.length-1){M.i++; drawMockRun(); window.scrollTo(0,0);} };
  $("#mmark").onclick = () => { M.mark[M.i] = !M.mark[M.i]; drawMockRun(); };
  $("#mclr").onclick = () => { M.ans[M.i] = null; drawMockRun(); };
  $("#mpal").onclick = () => { M.showPal = !M.showPal; drawMockRun(); };
  $("#app").querySelectorAll("[data-j]").forEach(b => b.onclick = () => { M.i = +b.dataset.j; drawMockRun(); });
  const s = $("#msub"); if (s) s.onclick = () => { M.confirm = true; drawMockRun(); };
  const y = $("#msubY"); if (y) y.onclick = submitMock;
  const n = $("#msubN"); if (n) n.onclick = () => { M.confirm = false; drawMockRun(); };
  const lvy = $("#lvy"); if (lvy) lvy.onclick = () => { const t = LEAVE_TO; LEAVE_TO = null; submitMock(); go(t); };
  const lvn = $("#lvn"); if (lvn) lvn.onclick = () => { LEAVE_TO = null; drawMockRun(); };
}
function showMockLeave(tab){ LEAVE_TO = tab; drawMockRun(); }
function submitMock(){
  if (!M || !M.running) return;
  clearInterval(timerId);
  M.running = false; M.done = true; M.confirm = false;
  let c=0,w=0,sk=0; const per = {};
  M.list.forEach((it,k) => {
    const a = M.ans[k], t = it.q.t; per[t] = per[t] || {c:0,n:0}; per[t].n++;
    if (a===null) sk++; else if (a===it.q.a) { c++; per[t].c++; S.ans[it.q.id]=1; } else { w++; S.ans[it.q.id]=0; }
  });
  const max = M.list.length*2, score = +(c*2 - (M.neg? w*0.5 : 0)).toFixed(1);
  const used = Math.min(M.secs, Math.round((Date.now()-M.start)/1000));
  M.res = {c,w,sk,score,max,used,per, acc: (c+w) ? Math.round(c*100/(c+w)) : 0};
  const d = new Date(); const ds = d.toLocaleDateString("en-IN",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
  S.mocks = (S.mocks||[]).concat([{d:ds, n:M.list.length, score, max, acc:M.res.acc}]).slice(-20); save(); renderTop();
  M.filter = "wrong";
  if (TAB==="mock") drawMockResult();
}
function drawMockResult(){
  const r = M.res;
  const per = Object.keys(r.per).sort((a,b)=>LNUM(a)-LNUM(b)).map(t => `<div><span>L${LNUM(t)} · ${esc(L(t).title)}</span><span class="num">${r.per[t].c}/${r.per[t].n}</span></div>`).join("");
  const rows = M.list.map((it,k)=>({it,k})).filter(({it,k}) => M.filter==="all" ? true : M.filter==="wrong" ? (M.ans[k]!==null && M.ans[k]!==it.q.a) : M.ans[k]===null);
  $("#app").innerHTML = `<section class="view stack">
    <div class="stack" style="gap:6px"><span class="eyebrow">Result</span>
    <div class="scorebig"><span class="num">${r.score}</span><span class="muted">/ ${r.max} marks</span></div></div>
    <div class="kpis"><div class="kpi g"><span class="num">${r.c}</span><span>right</span></div><div class="kpi b"><span class="num">${r.w}</span><span>wrong</span></div><div class="kpi"><span class="num">${r.sk}</span><span>skipped</span></div><div class="kpi"><span class="num">${r.acc}%</span><span>accuracy</span></div></div>
    <p class="muted num" style="font-size:13px">Time used ${fmt(r.used)} of ${fmt(M.secs)}</p>
    <div class="block"><h3>By lesson</h3><div class="hist">${per}</div></div>
    <div class="row between"><button class="btn" type="button" id="mnew">New test</button><button class="btn pri" type="button" id="mretry">Retake same questions</button></div>
    <h2>Review</h2>
    <div class="chips">${[["wrong",`Wrong ${r.w}`],["skip",`Skipped ${r.sk}`],["all",`All ${M.list.length}`]].map(c=>`<button class="chip" type="button" data-rf="${c[0]}" aria-pressed="${M.filter===c[0]}">${c[1]}</button>`).join("")}</div>
    <div class="stack">${rows.length ? rows.map(({it,k}) => `<article class="qcard">${metaHTML(it.q, "Q"+(k+1))}<p class="qt">${esc(it.q.q)}</p><div class="opts">${optsHTML(it.q, it.perm, {picked:M.ans[k], reveal:true})}</div>${M.ans[k]===null?`<div class="exp"><b class="nol">Skipped. Answer: ${esc(it.q.o[it.q.a])}.</b> ${esc(it.q.e)}</div>`:expHTML(it.q, M.ans[k])}</article>`).join("") : `<p class="empty">Nothing in this list.</p>`}</div>
  </section>`;
  bindBM($("#app"));
  $("#app").querySelectorAll("[data-rf]").forEach(b => b.onclick = () => { M.filter = b.dataset.rf; drawMockResult(); });
  $("#mnew").onclick = () => { M = null; renderMock(); };
  $("#mretry").onclick = () => {
    const list = M.list.map(it=>({q:it.q, perm:makePerm(it.q)}));

/* ============================================================
   PLAN MAKER
   A plan is generated, never stored: only its length, the start date and your own ticks
   live in localStorage, so it survives changes to the lessons. Reading a lesson or taking
   its quiz in the app ticks that task by itself.
   ============================================================ */
const DAYMS = 86400000, MAXPD = 4;     // at most four new lessons a day, unless the must-do lessons need more
const label = d => d + " day" + (d === 1 ? "" : "s");

/* the closing revision days, built first so a plan is always exactly `days` long */
function planTailDays(days){
  const t = [];
  const rv = (rv, l, s) => ({ k:"rev", label:l, sub:s, go:[APP.id, null, "revise"], rv });
  if (HUB && days >= 30) APP.apps.filter(a => ["anc","med","mod"].includes(a.era)).forEach(a => t.push({ title:"Revision", sub:a.title, tasks:[
    { k:"rev", label:`${a.title}: Revise → 30 days`, sub:"Every summary in the app", go:[a.id, null, "revise"] },
    { k:"prac", label:`${a.title}: practise your mistakes`, sub:"Practice → Mistakes", go:[a.id, null, "practice"] },
    { k:"mock", label:`${a.title}: a 25-question mock`, sub:"Mock tab", go:[a.id, null, "mock"] }]}));
  if (days >= 15) t.push({ title:"Revision", sub:(TIMELINE.some(x => x.rows.length) ? "Timeline, tricks" : "Tricks") + " and traps", tasks:[
    ...(TIMELINE.some(x => x.rows.length) ? [rv("time", "Revise \u2192 Timeline, top to bottom", "Be able to place every date")] : []),
    rv("tricks", "Revise → Tricks, all of them", "The mnemonics"),
    rv("traps", "Revise → Traps, all of them", "The pairs SSC swaps")]});
  if (days >= 10) t.push({ title:"Revision", sub:"Full-length test", tasks: HUB
    ? APP.apps.filter(a => ["anc","med","mod"].includes(a.era)).map(a => ({ k:"mock", label:`${a.title}: a 50-question mock, timed`, sub:"Then go through every mistake", go:[a.id, null, "mock"] }))
    : [{ k:"mock", label:"A 50-question mock, timed", sub:"Mock tab · 30 min", go:[APP.id, null, "mock"] },
       { k:"prac", label:"Go through every mistake it throws up", sub:"Practice → Mistakes", go:[APP.id, null, "practice"] }]});
  t.push({ title:"The day before", sub:"and the hour before", tasks:[
    rv("week", "Revise → 7 days: the most-asked lessons only", "About an hour"),
    HUB ? rv("tricks", "Revise → Traps once more", "The swaps cost the most marks")
        : { k:"flash", label:"Flashcards from your mistakes", sub:"Revise → Flashcards → My mistakes", go:[APP.id, null, "revise"], rv:"flash" },
    rv("last", "Revise → Last moment, in the final hour", "The pairings sheet — nothing new today")]});
  return t;
}
/* which lessons fit: every three-dot lesson always; then the rest, most-asked first, while there is room */
function planPool(days){
  const studyDays = Math.max(1, days - planTailDays(days).length), room = studyDays * MAXPD;
  const must = LESSONS.filter(l => l.heat === 3);
  const rest = LESSONS.filter(l => l.heat !== 3).slice().sort((a,b) => (b.heat - a.heat) || (pCount(b.id) - pCount(a.id)));
  const pick = new Set(must.map(l => l.id));
  rest.forEach(l => { if (pick.size < room) pick.add(l.id); });
  return LESSONS.filter(l => pick.has(l.id));
}
function buildPlan(days){
  const pool = planPool(days), tail = planTailDays(days);
  const studyDays = Math.max(1, days - tail.length);
  const out = [];
  for (let d = 0; d < studyDays; d++) {   // spread evenly: one or two a day in a long plan, not a rush and then nothing
    const mine = pool.slice(Math.round(d * pool.length / studyDays), Math.round((d+1) * pool.length / studyDays));
    const prev = d > 0 ? out[d-1].lessons : null;
    const tasks = [];
    mine.forEach(l => tasks.push({ k:"read", id:l.id, label:`Read: ${l.title}`, sub:`${HUB ? A(l.app).title + " · " : ""}story first, then the tables`, go:[appOf(l.id), l.id, null] }));
    mine.forEach(l => tasks.push({ k:"quiz", id:l.id, label:`Quiz: ${l.title}`, sub:"The lesson's step 2", go:[appOf(l.id), l.id, null] }));
    if (prev && prev.length) tasks.push({ k:"recap", label:"Re-read yesterday's summaries", sub:prev.map(l=>l.title).join(" · "), go:[appOf(prev[0].id), prev[0].id, null] });
    if (mine.length) tasks.push({ k:"prac", label:`Practise ${mine.length > 1 ? 30 : 20} questions on today's lessons`, sub:"Practice → pick the lesson", go:[appOf(mine[0].id), null, "practice"] });
    else tasks.push({ k:"prac", label:"Catch up, then clear your Mistakes list", sub:"Practice → Mistakes", go:[HUB ? APP.apps[0].id : APP.id, null, "practice"] });
    out.push({ title:"Day", sub: mine.length ? [...new Set(mine.map(l => HUB ? A(l.app).title : (l.part ? l.part[0] : APP.title)))].join(" + ") : "Catch-up", lessons: mine, tasks });
  }
  tail.forEach(x => out.push(x));
  return { days, list: out, pool, dropped: LESSONS.filter(l => !pool.includes(l)) };
}
function planNote(days){
  const p = buildPlan(days), per = p.pool.length / Math.max(1, days - planTailDays(days).length);
  const pace = per <= 1.05 ? "about one lesson a day" : per <= 2.05 ? "one or two lessons a day" : "about " + Math.round(per) + " lessons a day";
  return p.dropped.length
    ? `Crash course: the ${p.pool.length} most-asked lessons, ${pace}. Leaves out ${p.dropped.length}.`
    : `All ${p.pool.length} lessons, ${pace}, then ${planTailDays(days).length} revision day${planTailDays(days).length>1?"s":""}.`;
}
const autoDone = t => (t.k === "read" && !!lessonState(t.id).done) || (t.k === "quiz" && lessonState(t.id).best != null);
function planState(){ return S.plan && APP.plans.includes(S.plan.days) ? S.plan : null; }

function renderPlan(){
  const st = planState();
  if (!st) {
    $("#app").innerHTML = `<section class="view stack">
      <div class="stack" style="gap:6px"><span class="eyebrow">Plan maker \u00b7 ${esc(APP.title)}</span><h1>How long do you have?</h1>

      <div class="plancfg">${APP.plans.map(d => {

          </div></button>`;
      }).join("")}</div>
      <p class="foot">A shorter plan does not squeeze the syllabus &mdash; it keeps every lesson that is asked almost every paper and drops the least-asked ones, and says which.${HUB ? "" : hubLink(" For a plan across every app in this subject, open ", APP.hub ? APP.hub.title : "", "plan", ".")}</p>
    </section>`;
    $("#app").querySelectorAll("[data-days]").forEach(b => b.onclick = () => { S.plan = { days:+b.dataset.days, start: Date.now(), done:{} }; save(); renderPlan(); });
    bindGo($("#app"));
    return;
  }
  const pl = buildPlan(st.days), total = pl.list.length;
  const today = Math.min(Math.max(Math.floor((Date.now() - st.start) / DAYMS), 0), total - 1);
  const isDone = (t, key) => autoDone(t) || !!st.done[key];
  const allTasks = pl.list.reduce((a,d)=>a+d.tasks.length, 0);
  const doneTasks = pl.list.reduce((a,d,i)=>a + d.tasks.filter((t,j)=>isDone(t, `d${i}t${j}`)).length, 0);
  $("#app").innerHTML = `<section class="view stack">
    <div class="hero"><span class="eyebrow">${label(st.days)} plan · started ${new Date(st.start).toLocaleDateString("en-IN",{day:"numeric",month:"short"})}</span>
      <h1>Day ${today+1} of ${total}</h1>
      <p>${planNote(st.days)}</p>
      <div class="meter" aria-label="Plan progress"><i style="width:${allTasks?doneTasks/allTasks*100:0}%"></i></div>
      <div class="row between"><span class="muted num" style="font-size:13px">${doneTasks}/${allTasks} tasks done</span>
        <button class="btn sm ghost" type="button" id="pchg">Change plan</button></div></div>
    ${pl.dropped.length ? `<div class="trap"><span class="lab">Left out of this plan</span>${pl.dropped.map(l=>esc(l.title)).join(" · ")}. Open them if you find time.</div>` : ""}
    ${pl.list.map((d,i) => {
      const dn = d.tasks.filter((t,j)=>isDone(t, `d${i}t${j}`)).length, all = dn === d.tasks.length;
      return `<details class="pday ${i===today?"cur":""} ${all?"allgood":""}" ${i===today?"open":""}>
        <summary><span class="dno">${all?"✓ ":""}Day ${i+1}</span>
          <span class="dt">${esc(d.title==="Day" ? d.sub : d.title + " · " + d.sub)}<small>${d.tasks.length} task${d.tasks.length>1?"s":""}${i===today?" · today":""}</small></span>
          <span class="dp">${dn}/${d.tasks.length}</span></summary>
        <div class="body">${d.tasks.map((t,j) => {
          const key = `d${i}t${j}`, auto = autoDone(t), done = auto || !!st.done[key];
          return `<div class="ptask-row"><button type="button" class="ptask" data-k="${key}" aria-pressed="${done}" ${auto?"disabled":""}>
            <span class="box">${done?"✓":""}</span>
            <span class="lbl">${esc(t.label)}${auto?`<span class="autotag">done in the lesson</span>`:""}<small>${esc(t.sub||"")}</small></span></button>
            ${t.go ? `<button type="button" class="btn sm ghost" data-ptgo="${i}:${j}">Open</button>` : ""}</div>`;
        }).join("")}</div></details>`;
    }).join("")}
    <p class="foot">\u201cToday\u201d is counted from the day you started, so a missed day stays visible instead of quietly disappearing.${HUB ? "" : hubLink(" A plan across every app in this subject is in ", APP.hub ? APP.hub.title : "", "plan", ".")}</p>
  </section>`;
  $("#pchg").onclick = () => { if (confirm("Change the plan? Your ticks on this plan will be cleared.")) { S.plan = null; save(); renderPlan(); } };
  $("#app").querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
    const k = b.dataset.k; if (st.done[k]) delete st.done[k]; else st.done[k] = 1; save(); renderPlan();
  });
  $("#app").querySelectorAll("[data-ptgo]").forEach(b => b.onclick = () => {
    const [i, j] = b.dataset.ptgo.split(":").map(Number), t = pl.list[i].tasks[j];
    if (t.rv) RV = t.rv;
    if (t.k === "quiz" && t.go[0] === APP.id) { openLesson(t.id, "quiz"); return; }
    openApp(t.go[0], t.go[1], t.go[2]);
  });
  bindGo($("#app"));
  const cur = $(".pday.cur"); if (cur && cur.scrollIntoView) cur.scrollIntoView({block:"center"});
}

/* ============================================================
   BOOT
   ============================================================ */
if (typeof VIS !== "undefined" && typeof visInit === "function") visInit();
renderTop();
const hashTab = () => (location.hash||"").replace("#","");
go(TABS.includes(hashTab()) ? hashTab() : TABS[0]);
/* the back button, or a link that only changes the fragment, should move tabs */
window.addEventListener("hashchange", () => {
  const t = hashTab();
  if (TABS.includes(t) && t !== TAB && !(M && M.running)) go(t);
});
/* progress made in another History app (another tab, or synced from your account) */
window.addEventListener("storage", e => { if (e.key && e.key !== KEY && APP.apps.some(a => a.key === e.key) && (TAB === "plan" || TAB === "start")) go(TAB); });

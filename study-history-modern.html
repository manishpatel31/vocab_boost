<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>

<title>Modern India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Shared by every History page (built by tools/history/build.js).
   Layout: a manuscript folio — parchment paper, maroon ink, gold figures; one-column app with a bottom tab bar. */
:root{
  --paper:#f3efe4; --sheet:#fffdf6; --sunk:#e8e1cf;
  --ink:#241c14; --ink2:#5d5141; --rule:#d8cdb4;
  --blue:#7a2230; --on-blue:#ffffff; --blue-bg:#f4e2e1;
  --accent:#9a6a12; --accent-bg:#f8ecc9;
  --good:#1b6b4a; --good-bg:#ddefe4; --bad:#a8291f; --bad-bg:#f8e0dc;
  --warn-bg:#fcf0cf;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* era groups on the Learn screen */
.eras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.erac{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:grid;gap:6px}
.erac b{font-family:var(--f-display);font-size:15px;font-weight:700;line-height:1.25}
.erac .hi{font-size:12px;color:var(--ink2)}
.erac .mt{font-family:var(--f-num);font-size:11px;color:var(--ink2)}
.erac .meter{height:6px}
.erac[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.grph{display:flex;align-items:baseline;gap:8px;padding:14px 2px 4px;border-top:2px solid var(--ink);margin-top:4px}
.grph h2{font-size:17px}
.grph span{font-size:12px;color:var(--ink2);margin-left:auto;font-family:var(--f-num)}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}
.dots{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--rule);display:block}
.dots i.on{background:var(--accent)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.hot{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px;font-size:15px}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.facts.prose dd{font-weight:400;line-height:1.55}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap,.link{border-radius:var(--r);padding:12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.link{background:var(--sunk);border-color:transparent}
.trick .lab,.trap .lab,.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.link .lab{color:var(--ink2)}
.mn{font-family:var(--f-num);font-weight:600;background:var(--sheet);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.tag.src{background:var(--good-bg);color:var(--good)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:22px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
/* one-line revision rows (last week / last moment) */
.lines{display:grid;gap:0}
.lines div{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px dashed var(--rule);font-size:15px}
.lines div:first-child{border-top:0}
.lines b{font-weight:700}
.lines span{color:var(--ink2)}
.callout{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;font-size:15px}

/* plan maker */
.plancfg{display:grid;gap:12px}
.pday{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.pday > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pday > summary::-webkit-details-marker{display:none}
.pday .dno{font-family:var(--f-num);font-weight:700;font-size:13px;background:var(--sunk);border-radius:99px;padding:2px 10px;white-space:nowrap}
.pday.cur .dno{background:var(--blue);color:var(--on-blue)}
.pday.allgood .dno{background:var(--good-bg);color:var(--good)}
.pday .dt{min-width:0;font-weight:600;font-size:15px}
.pday .dt small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
.pday .dp{font-family:var(--f-num);font-size:12px;color:var(--ink2);white-space:nowrap}
.pday .body{padding:0 14px 12px;display:grid;gap:8px;border-top:1px dashed var(--rule);margin-top:2px;padding-top:10px}
.ptask{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;width:100%;font-size:15px}
.ptask .box{width:22px;height:22px;border-radius:6px;border:1.6px solid var(--rule);display:grid;place-items:center;font-size:14px;color:var(--on-blue);margin-top:1px}
.ptask[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.ptask[aria-pressed="true"] .lbl{text-decoration:line-through;color:var(--ink2)}
.ptask .lbl small{display:block;font-size:12px;color:var(--ink2);text-decoration:none}
/* the story first: plain-language opener for beginners */
.story{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;font-size:16.5px;line-height:1.65}
.story .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.story p{margin:0}
.story .key{background:var(--blue-bg);border-radius:8px;padding:8px 12px;font-size:15px;line-height:1.5}
.story .key b{color:var(--blue)}
/* hub: app cards and the beginner path */
.appcs{display:grid;gap:12px}
.appc{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;text-align:left;width:100%;cursor:pointer}
.appc:hover{border-color:var(--blue)}
.appc .hd{display:flex;align-items:center;gap:10px}
.appc .ic{font-size:26px;line-height:1}
.appc .hd b{font-family:var(--f-display);font-size:17px;font-weight:700;display:block}
.appc .hd small{font-size:12px;color:var(--ink2)}

{"id":"L17","g":"mod","heat":3,"title":"Europeans arrive · Plassey & Buxar","hi":"यूरोपीय आगमन · प्लासी एवं बक्सर","blocks":[{"k":"hot","h":"Order of arrival, factory locations, and the <b>Plassey–Buxar pair<\/b> are asked every year. The one-line difference: <b>Plassey gave the Company Bengal; Buxar gave it the legal right to Bengal.<\/b>"},{"k":"story","h":"<p>In 1498 the Portuguese sailor <b>Vasco da Gama<\/b> reached Calicut by sea. Europe wanted Indian spices and cloth, and now it had a sea route. The Dutch, English, Danes and French followed. Each set up trading companies and factories (trading posts, not workshops) along the coast. At first they were only traders who needed the permission of Indian rulers.<\/p><p>But the companies also had soldiers and forts, and they fought each other. In the south the English beat the French in the Carnatic Wars. In Bengal, the young Nawab <b>Siraj-ud-Daulah<\/b> distrusted the English East India Company. The English commander <b>Robert Clive<\/b> won over the Nawab's commander <b>Mir Jafar<\/b> with a promise: betray your master and you will be Nawab. At Plassey on 23 June 1757 Siraj was betrayed and lost. In one afternoon the traders became the real power in Bengal.<\/p><p>The next Nawab, Mir Qasim, tried to stop the Company's abuse of its trade passes. He joined the Nawab of Awadh and the Mughal emperor Shah Alam II, but all three lost at <b>Buxar<\/b> in 1764. In 1765 the emperor gave the Company the Diwani, the legal right to collect Bengal's revenue. Plassey gave power; Buxar gave the right.<\/p>","key":"European trading companies fought over India's trade; Plassey (1757) gave the English power in Bengal and Buxar (1764) gave them the legal right."},{"k":"table","title":"Who came when (order of arrival)","head":["Power","Came","First factory","Note"],"rows":[["<b>Portuguese<\/b>","<b>1498<\/b> — Vasco da Gama lands at <b>Calicut<\/b>, welcomed by the Zamorin","Cochin (1500/1503)","First in, <b>last out<\/b> (Goa, Daman &amp; Diu freed in <b>1961<\/b>); first Viceroy <b>Francisco de Almeida<\/b>; real founder <b>Alfonso de Albuquerque<\/b> (took Goa, 1510)"],["<b>Dutch<\/b>","1602 — United East India Company","<b>Masulipatnam<\/b> (1605)","Beaten by the English at the <b>Battle of Bedara (1759)<\/b>; traded in spices &amp; textiles; Pulicat mint"],["<b>English<\/b>","1600 charter from Elizabeth I","<b>Surat<\/b> (1613, under Jahangir)","Factories: Surat, Masulipatnam, <b>Madras/Fort St George (1639)<\/b>, <b>Bombay (1668, from Charles II)<\/b>, <b>Calcutta/Fort William (1690, Job Charnock)<\/b>"],["<b>Danish<\/b>","1616","<b>Tranquebar<\/b> (1620), Serampore","Sold their settlements to the English in 1845"],["<b>French<\/b>","1664 — under Colbert, Louis XIV","<b>Surat<\/b> (1668), then <b>Pondicherry (1674)<\/b>","Chandernagore, Mahe, Karaikal, Yanam; lost the Carnatic wars"]]},{"k":"mapfig","title":"Where the Europeans settled","pins":[["1",75.78,11.25,"Calicut","n"],["2",76.27,9.93,"Cochin","n"],["3",73.83,15.49,"Goa","n"],["4",81.13,16.17,"Masulipatnam","n"],["5",80.32,13.42,"Pulicat","n"],["6",72.83,21.17,"Surat","n"],["7",80.29,13.08,"Madras","n"],["8",72.84,18.94,"Bombay","n"],["9",88.36,22.57,"Calcutta","n"],["10",79.85,11.03,"Tranquebar","n"],["11",88.34,22.75,"Serampore","n"],["12",79.83,11.93,"Pondicherry","n"],["13",88.37,22.87,"Chandernagore","n"],["14",75.53,11.7,"Mahe","n"],["15",79.84,10.92,"Karaikal","n"]],"facts":[["1 · Calicut","Portuguese — Vasco da Gama lands, 1498"],["2 · Cochin","Portuguese — first factory, 1500"],["3 · Goa","Portuguese — taken 1510; freed 1961"],["4 · Masulipatnam","Dutch, 1605; English, 1611"],["5 · Pulicat","Dutch — Fort Geldria"],["6 · Surat","English — first factory, 1613"],["7 · Madras","English — Fort St George, 1639"],["8 · Bombay","English — 1668"],["9 · Calcutta","English — Fort William, 1690s"],["10 · Tranquebar","Danish, 1620"],["11 · Serampore","Danish"],["12 · Pondicherry","French, 1674"],["13 · Chandernagore","French"],["14 · Mahe","French"],["15 · Karaikal","French"]],"cap":"Order of arrival: Portuguese (1498), Dutch (1602), English (1600 charter, 1613 factory), Danish (1616), French (1664). Use ＋ or ⛶ for the Hooghly and Coromandel clusters."},{"k":"trick","h":"<b>Order of arrival<\/b> — <span class=\"mn\">Po-Du-En-Da-Fr<\/span>: <b>Po<\/b>rtuguese (1498), <b>Du<\/b>tch, <b>En<\/b>glish, <b>Da<\/b>nish, <b>Fr<\/b>ench. \"<i>Portuguese came first and left last.<\/i>\"<br><b>English presidency forts<\/b>: <b>Madras = Fort St George<\/b>, <b>Calcutta = Fort William<\/b>, <b>Bombay = Fort St David? No —<\/b> Fort St David is <b>Cuddalore<\/b>. Remember <span class=\"mn\">George–Madras, William–Calcutta, David–Cuddalore<\/span>."},{"k":"table","title":"Carnatic Wars (English vs French)","head":["War","Years","Treaty / result"],"rows":[["First","1746–48","<b>Treaty of Aix-la-Chapelle<\/b> — inconclusive"],["Second","1749–54","Treaty of Pondicherry; <b>Dupleix<\/b> recalled; English gain"],["Third","1758–63","<b>Battle of Wandiwash (1760)<\/b> — Eyre Coote crushes Lally; <b>Treaty of Paris (1763)<\/b> ends French ambitions in India"]]},{"k":"facts","title":"Bengal: the two battles that made an empire","rows":[["<b>Black Hole tragedy<\/b>","1756 — alleged suffocation of English prisoners by <b>Siraj-ud-Daulah<\/b>; reported by Holwell"],["<b>Battle of Plassey<\/b>","<b>23 June 1757<\/b> — <b>Robert Clive<\/b> beat <b>Siraj-ud-Daulah<\/b>, who was betrayed by <b>Mir Jafar<\/b>, Rai Durlabh and Jagat Seth. Mir Jafar became Nawab"],["Mir Qasim","Replaced Mir Jafar (1760), then resisted the Company's misuse of <i>dastak<\/i> — abolished all inland duties"],["<b>Battle of Buxar<\/b>","<b>22 October 1764<\/b> — <b>Hector Munro<\/b> beat the joint army of <b>Mir Qasim + Shuja-ud-Daulah (Awadh) + Shah Alam II (Mughal)<\/b>. The decisive one"],["<b>Treaty of Allahabad<\/b>","<b>1765<\/b> — Awadh returned to Shuja-ud-Daulah as a buffer; the Company got <b>Kara &amp; Allahabad<\/b>"],["<b>Diwani rights<\/b>","1765 — Shah Alam II granted the Company the <b>Diwani (revenue collection) of Bengal, Bihar &amp; Odisha<\/b>"],["<b>Dual government<\/b>","1765–72, set up by <b>Clive<\/b> — the Company collected revenue (Diwani) while the Nawab kept administration (Nizamat); ended by <b>Warren Hastings<\/b> in 1772"],["<b>Bengal famine<\/b>","1770 — about a third of Bengal's population died"]]},{"k":"mapfig","title":"The battles that built the Company's rule","pins":[["1",88.25,23.8,"Plassey","n"],["2",88.4,22.95,"Bedara","n"],["3",79.6,12.5,"Wandiwash","n"],["4",83.98,25.57,"Buxar","n"]],"facts":[["1 · Plassey","23 June 1757 — Clive beat Siraj-ud-Daulah"],["2 · Bedara","1759 — English beat the Dutch"],["3 · Wandiwash","1760 — English beat the French (Third Carnatic War)"],["4 · Buxar","1764 — Munro beat Mir Qasim, Shuja-ud-Daula and Shah Alam II"]],"cap":"Plassey gave the Company Bengal's politics; Buxar and the Treaty of Allahabad (1765) gave it the Diwani of Bengal, Bihar and Odisha."},{"k":"photos","title":"Plassey and after, in pictures","items":[["Vasco_da_Gama","Vasco da Gama","Calicut, 1498"],["Fort_St._George,_Chennai","Fort St. George","Madras, 1639"],["Robert_Clive","Robert Clive","Plassey"],["Siraj_ud-Daulah","Siraj ud-Daulah","Nawab of Bengal"],["Mir_Jafar","Mir Jafar","The puppet Nawab"],["Shuja-ud-Daula","Shuja-ud-Daula","Buxar"]]},{"k":"trick","h":"<b>Plassey vs Buxar<\/b> — <span class=\"mn\">P 1757 = Power, B 1764 = Bill of rights<\/span>. Plassey made the Company the real master of Bengal; Buxar + the 1765 Diwani made it the <i>legal<\/i> master. Dates read like a ladder: <b>57 → 64 → 65<\/b>."},{"k":"trap","h":"<b>Clive<\/b> fought Plassey; <b>Hector Munro<\/b> fought Buxar — don't give Clive both. The Diwani was granted in <b>1765<\/b>, not 1757. The <b>Battle of Wandiwash (1760)<\/b> settled the French question, while <b>Bedara (1759)<\/b> settled the Dutch."}],"sum":["Order: Portuguese (1498, Vasco da Gama at Calicut) → Dutch (Masulipatnam) → English (Surat 1613) → Danish (Tranquebar) → French (Pondicherry 1674).","Forts: Fort St George–Madras (1639), Fort William–Calcutta (1690, Job Charnock), Fort St David–Cuddalore. Bombay came from Charles II in 1668.","Carnatic Wars: I ended by Aix-la-Chapelle; III decided at Wandiwash 1760 and the Treaty of Paris 1763. Dutch beaten at Bedara 1759.","Plassey 23 June 1757 — Clive beat Siraj-ud-Daulah (betrayed by Mir Jafar). Buxar 22 Oct 1764 — Munro beat Mir Qasim + Shuja-ud-Daulah + Shah Alam II.","Treaty of Allahabad 1765; Diwani of Bengal, Bihar & Odisha granted 1765; Dual government 1765–72 (Clive), ended by Warren Hastings."],"part":["From traders to rulers","व्यापारी से शासक"]},
{"id":"L18","g":"mod","heat":2,"title":"British expansion — Mysore, Sikh & annexations","hi":"ब्रिटिश विस्तार","blocks":[{"k":"hot","h":"The Anglo-Mysore and Anglo-Sikh wars with their treaties, plus the two tools of expansion — <b>Subsidiary Alliance (Wellesley)<\/b> and <b>Doctrine of Lapse (Dalhousie)<\/b> — and which states each swallowed."},{"k":"story","h":"<p>Once the Company held Bengal, it wanted more, and it grew in two ways: war and clever treaties. In the south, <b>Haidar Ali<\/b> and his son <b>Tipu Sultan<\/b> of Mysore were its toughest enemies. They fought four wars. Tipu, the Tiger of Mysore, died defending his capital Seringapatam in 1799. In the north-west, the Sikh kingdom fell after two wars, and Punjab was annexed in 1849.<\/p><p>Wars cost money, so the British also used rules. <b>Lord Wellesley<\/b> brought in the Subsidiary Alliance (1798). An Indian king kept his throne but had to keep and pay for a British army, accept a British officer called a Resident at his court, and give up his own foreign policy. Hyderabad signed first. Slowly such rulers became powerless.<\/p><p>Fifty years later <b>Lord Dalhousie<\/b> used the Doctrine of Lapse: if a ruler died without a natural heir, his state passed to the Company. Satara, Jhansi and Nagpur were taken this way. In 1856 he took Awadh too, on the charge of misgovernment. Wars with Nepal, Burma and Afghanistan, and the annexation of Sindh, filled out the map. Anger over these lost kingdoms fed straight into 1857. The tables give each war, treaty and annexation.<\/p>","key":"The Company grew by wars against Mysore and the Sikhs and by two tools: Wellesley's Subsidiary Alliance and Dalhousie's Doctrine of Lapse."},{"k":"table","title":"Anglo-Mysore Wars","head":["War","Years","Against","Ended by"],"rows":[["First","1767–69","Haidar Ali","Treaty of Madras"],["Second","1780–84","Haidar Ali, then <b>Tipu Sultan<\/b>","<b>Treaty of Mangalore (1784)<\/b> — Haidar died in 1782"],["Third","1790–92","Tipu Sultan vs <b>Cornwallis<\/b>","<b>Treaty of Seringapatam (1792)<\/b> — Tipu lost half his kingdom"],["Fourth","1799","Tipu vs <b>Wellesley<\/b>","<b>Tipu died defending Seringapatam<\/b>, 4 May 1799 — the \"Tiger of Mysore\"; Wodeyars restored under subsidiary alliance"]]},{"k":"mapfig","title":"Wars and annexations","pins":[["1",76.69,12.42,"Srirangapatna","n"],["2",74.86,31.17,"Sobraon","n"],["3",73.6,32.65,"Chillianwala","n"],["4",74,17.68,"Satara","n"],["5",83.97,21.47,"Sambalpur","n"],["6",78.57,25.45,"Jhansi","n"],["7",79.09,21.15,"Nagpur","n"],["8",80.95,26.85,"Lucknow (Awadh)","n"]],"facts":[["1 · Srirangapatna","Tipu killed, 1799 — Fourth Anglo-Mysore War"],["2 · Sobraon","1846 — First Anglo-Sikh War"],["3 · Chillianwala","1849 — Second Anglo-Sikh War"],["4 · Satara","Lapse, 1848 — the first"],["5 · Sambalpur","Lapse, 1849"],["6 · Jhansi","Lapse, 1853"],["7 · Nagpur","Lapse, 1854"],["8 · Lucknow (Awadh)","Annexed for 'misrule', 1856"]],"cap":"Wellesley's Subsidiary Alliance (1798) and Dalhousie's Doctrine of Lapse (1848–56) brought state after state under the Company."},{"k":"photos","title":"Rulers who fought the Company","items":[["Hyder_Ali","Hyder Ali","Mysore"],["Tipu_Sultan","Tipu Sultan","The Tiger of Mysore"],["Tipu's_Tiger","Tipu's Tiger","His mechanical toy"],["Ranjit_Singh","Ranjit Singh","The Lion of Punjab"]]},{"k":"table","title":"Anglo-Sikh Wars","head":["War","Years","Ended by","Result"],"rows":[["First","1845–46","<b>Treaty of Lahore<\/b> (1846) &amp; Treaty of Bhairowal","Jalandhar Doab taken; Kashmir sold to <b>Gulab Singh<\/b> (Treaty of Amritsar, 1846)"],["Second","1848–49","—","<b>Punjab annexed<\/b> by <b>Dalhousie<\/b>; Dalip Singh exiled; <b>Koh-i-Noor<\/b> taken to England"]]},{"k":"facts","title":"Two tools of annexation","rows":[["<b>Subsidiary Alliance<\/b> — Lord Wellesley (1798)","The ruler keeps his throne but must keep a British force, pay for it, accept a British Resident, and have no foreign relations. Order of signing: <b>Hyderabad (1798, first)<\/b> → Mysore (1799) → Awadh (1801) → <b>Peshwa Baji Rao II (Bassein, 1802)<\/b> → Scindia, Bhonsle"],["<b>Doctrine of Lapse<\/b> — Lord Dalhousie (1848–56)","If a ruler died without a <b>natural<\/b> heir, the state \"lapsed\" to the Company. Annexed: <b>Satara (1848, first)<\/b>, Jaitpur &amp; Sambalpur (1849), Baghat (1850), <b>Udaipur (1852)<\/b>, <b>Jhansi (1853)<\/b>, <b>Nagpur (1854)<\/b>. <b>Awadh (1856)<\/b> was taken not by lapse but on the charge of <b>misgovernment<\/b>"]]},{"k":"trick","h":"<b>Doctrine of Lapse victims<\/b> — <span class=\"mn\">SA-JA-SA-BA-U-JH-NA<\/span>: Satara, Jaitpur, Sambalpur, Baghat, Udaipur, Jhansi, Nagpur. Remember <b>Satara first, Nagpur last, Awadh not at all<\/b> (Awadh = misgovernment, 1856).<br><b>Subsidiary Alliance firsts<\/b>: <b>H<\/b>yderabad was the <b>first<\/b> to sign — <i>H for \"head of the queue\"<\/i>."},{"k":"facts","title":"Other wars and annexations","rows":[["Anglo-Burmese","1824–26 (Treaty of <b>Yandabo<\/b>), 1852, 1885 — Burma fully annexed"],["Anglo-Afghan","1839–42, 1878–80 (Treaty of Gandamak), 1919 (Treaty of Rawalpindi)"],["Anglo-Nepal","1814–16 — <b>Treaty of Sugauli (1816)<\/b>; gave the British Shimla, Kumaon, Garhwal and the Gurkha recruitment right"],["Sindh","Annexed <b>1843<\/b> by Charles Napier"],["<b>1853 firsts<\/b>","First <b>railway<\/b> (Bombay–Thane, 16 April 1853, 34 km), first <b>telegraph<\/b> (Calcutta–Agra) — both under <b>Dalhousie<\/b>"],["Dalhousie's other work","<b>Wood's Despatch (1854)<\/b> — \"Magna Carta of English education in India\"; Public Works Department; postage stamp (1854); Widow Remarriage preparation"]]},{"k":"trap","h":"<b>Awadh was annexed in 1856 for misgovernment, not under the Doctrine of Lapse<\/b> — the single most common trap in this chapter. Tipu Sultan died in the <b>Fourth<\/b> Anglo-Mysore war (1799), not the third. Punjab was annexed after the <b>Second<\/b> Anglo-Sikh war (1849)."}],"sum":["Anglo-Mysore: II ended by Mangalore 1784, III by Seringapatam 1792, IV (1799) killed Tipu Sultan.","Anglo-Sikh: I ended by the Treaty of Lahore 1846 (Kashmir sold to Gulab Singh at Amritsar); II (1849) annexed Punjab and took the Koh-i-Noor.","Subsidiary Alliance = Wellesley, 1798; Hyderabad signed first, then Mysore, Awadh, the Peshwa (Bassein 1802).","Doctrine of Lapse = Dalhousie; Satara first (1848), then Jaitpur, Sambalpur, Baghat, Udaipur, Jhansi, Nagpur. Awadh (1856) went for misgovernment.","Treaty of Sugauli 1816 (Nepal), Yandabo 1826 (Burma); Sindh annexed 1843; first railway and telegraph 1853 under Dalhousie; Wood's Despatch 1854."],"part":["From traders to rulers","व्यापारी से शासक"]},
{"id":"L19","g":"mod","heat":3,"title":"Governors-General & Viceroys","hi":"गवर्नर-जनरल एवं वायसराय","blocks":[{"k":"hot","h":"Pure \"who did what\" marks — 1 to 2 questions a shift. Learn each name with <b>one or two signature acts<\/b>, and the order of the big ones."},{"k":"story","h":"<p>This lesson is a long list of British rulers, each with a few famous acts. Do not learn it as a list. Learn it as three phases, and inside each phase tie every name to one big act.<\/p><p><b>Phase 1: the Company conquers (1772 to 1856).<\/b> Governors-General build the system and take land. Warren Hastings is the first Governor-General of Bengal. Cornwallis fixes land revenue with the Permanent Settlement. Wellesley spreads the Subsidiary Alliance. Bentinck is the reformer: he abolishes sati and brings English education. <b>Dalhousie<\/b> is the great annexer and moderniser: Doctrine of Lapse, railways, telegraph. Their acts are about land, law and expansion.<\/p><p><b>Phase 2: the Crown rules and Indians wake up (1858 to 1905).<\/b> After 1857 the Governor-General becomes Viceroy; Canning is the last of one and the first of the other. Mayo holds the first census, Lytton gags the Indian-language press, Ripon brings local self-government, and under Dufferin the Congress is born. <b>Phase 3: the freedom struggle (1905 to 1947).<\/b> Each Viceroy now matches a turning point: Curzon partitions Bengal, Minto II brings separate electorates, Chelmsford sees Jallianwala, Irwin signs a pact with Gandhi, Linlithgow faces Quit India, and Mountbatten hands over power. The trick box gives the pairs.<\/p>","key":"Think in three phases, Company conquest, Crown rule with Indian awakening, and the freedom struggle, and tie each ruler to one big act."},{"k":"facts","title":"Governors of Bengal / Governors-General","rows":[["<b>Robert Clive<\/b> (1757–60, 1765–67)","Plassey; <b>Dual government<\/b> in Bengal"],["<b>Warren Hastings<\/b> (1772–85)","First <b>Governor-General of Bengal<\/b> (Regulating Act 1773); ended dual government; <b>Asiatic Society of Bengal (1784, with William Jones)<\/b>; Supreme Court at Calcutta (1774); first Anglo-Maratha and second Anglo-Mysore wars; impeached in England (Edmund Burke)"],["<b>Lord Cornwallis<\/b> (1786–93)","<b>Permanent Settlement of Bengal (1793)<\/b>; <b>Cornwallis Code<\/b>; separated revenue and justice; \"<b>father of Indian civil services<\/b>\"; policy of <b>Europeanisation<\/b>; third Anglo-Mysore war"],["<b>Sir John Shore<\/b> (1793–98)","Policy of <b>non-intervention<\/b>; Charter Act 1793"],["<b>Lord Wellesley<\/b> (1798–1805)","<b>Subsidiary Alliance<\/b>; fourth Anglo-Mysore war (Tipu killed); Fort William College (1800); called himself \"Bengal Tiger\""],["<b>Lord Minto I<\/b> (1807–13)","<b>Treaty of Amritsar (1809)<\/b> with Ranjit Singh"],["<b>Lord Hastings<\/b> (1813–23)","Ended the Marathas (third war); Treaty of Sugauli; ended the \"ring-fence\" policy"],["<b>Lord Amherst<\/b> (1823–28)","First Anglo-Burmese war"],["<b>Lord William Bentinck<\/b> (1828–35)","<b>Abolished sati (1829)<\/b>; suppressed <b>thugee<\/b> and infanticide; <b>English made the medium of instruction (1835, with Macaulay's Minute)<\/b>; Charter Act 1833 made him the first <b>Governor-General of India<\/b>"],["<b>Lord Auckland<\/b> (1836–42)","First Anglo-Afghan war"],["<b>Lord Ellenborough<\/b> (1842–44)","Annexed <b>Sindh (1843)<\/b>; abolished slavery (1843)"],["<b>Lord Hardinge I<\/b> (1844–48)","First Anglo-Sikh war; banned human sacrifice"],["<b>Lord Dalhousie<\/b> (1848–56)","<b>Doctrine of Lapse<\/b>; annexed Punjab &amp; Awadh; <b>first railway and telegraph (1853)<\/b>; <b>Wood's Despatch (1854)<\/b>; postal reform; PWD; Widow Remarriage groundwork; \"maker of modern India\""],["<b>Lord Canning<\/b> (1856–62)","<b>Revolt of 1857<\/b>; last Governor-General and <b>first Viceroy<\/b>; universities of Calcutta, Bombay &amp; Madras (1857); Indian Councils Act 1861; Indian Penal Code enforced (1860)"]]},{"k":"photos","title":"Governors-General in pictures","items":[["Warren_Hastings","Warren Hastings","First GG of Bengal, 1773"],["Charles_Cornwallis,_1st_Marquess_Cornwallis","Cornwallis","Permanent Settlement"],["Richard_Wellesley,_1st_Marquess_Wellesley","Wellesley","Subsidiary Alliance"],["Lord_William_Bentinck","William Bentinck","First GG of India; sati abolished"],["James_Broun-Ramsay,_1st_Marquess_of_Dalhousie","1st Marquess of Dalhousie","Doctrine of Lapse; railways"],["Charles_Canning,_1st_Earl_Canning","Canning","Last GG, first Viceroy"]]},{"k":"facts","title":"Viceroys (from 1858)","rows":[["<b>Lord Mayo<\/b> (1869–72)","First <b>census<\/b> (1872, non-synchronous); Department of Agriculture; Rajkumar College; <b>only Viceroy murdered in office<\/b> (Andaman, 1872)"],["<b>Lord Lytton<\/b> (1876–80)","Delhi Durbar 1877 (Victoria as <b>Kaiser-i-Hind<\/b>) during a famine; <b>Vernacular Press Act (1878)<\/b>; <b>Arms Act (1878)<\/b>; lowered the ICS age to 19"],["<b>Lord Ripon<\/b> (1880–84)","\"<b>Father of local self-government<\/b>\" (1882); repealed the Vernacular Press Act; <b>Ilbert Bill (1883)<\/b> controversy; first <b>Factory Act (1881)<\/b>; Hunter Commission on education"],["<b>Lord Dufferin<\/b> (1884–88)","<b>Indian National Congress founded (1885)<\/b>; third Anglo-Burmese war"],["<b>Lord Lansdowne<\/b> (1888–94)","Indian Councils Act 1892; <b>Durand Line (1893)<\/b>; Factory Act 1891"],["<b>Lord Curzon<\/b> (1899–1905)","<b>Partition of Bengal (1905)<\/b>; <b>Indian Universities Act (1904)<\/b>; <b>Ancient Monuments Preservation Act (1904)<\/b> — set up the modern ASI; Police Commission (Fraser); created the <b>NWFP<\/b>; famine commission"],["<b>Lord Minto II<\/b> (1905–10)","<b>Morley-Minto Reforms / Indian Councils Act 1909<\/b> — <b>separate electorates<\/b> for Muslims; Muslim League founded 1906 (Dhaka)"],["<b>Lord Hardinge II<\/b> (1910–16)","<b>Capital shifted from Calcutta to Delhi (1911)<\/b>; <b>Partition of Bengal annulled (1911)<\/b>; Delhi Durbar for George V; Hindu Mahasabha (1915)"],["<b>Lord Chelmsford<\/b> (1916–21)","<b>Montagu-Chelmsford Reforms / Act of 1919<\/b>; <b>Rowlatt Act &amp; Jallianwala Bagh (1919)<\/b>; Sadler Commission; Khilafat &amp; Non-Cooperation begin"],["<b>Lord Reading<\/b> (1921–26)","Chauri Chaura (1922); Moplah revolt; <b>repealed the Press Act &amp; the Rowlatt Act (1922)<\/b>; Kakori (1925)"],["<b>Lord Irwin<\/b> (1926–31)","<b>Simon Commission (1928)<\/b>; <b>Lahore session &amp; Purna Swaraj (1929)<\/b>; Dandi March; <b>Gandhi-Irwin Pact (5 March 1931)<\/b>"],["<b>Lord Willingdon<\/b> (1931–36)","Second &amp; third <b>Round Table Conferences<\/b>; <b>Communal Award (1932)<\/b> &amp; <b>Poona Pact<\/b>; <b>Government of India Act 1935<\/b>; RBI set up (1935)"],["<b>Lord Linlithgow<\/b> (1936–43)","Second World War; <b>August Offer (1940)<\/b>; <b>Cripps Mission &amp; Quit India (1942)<\/b>; Bengal famine (1943)"],["<b>Lord Wavell<\/b> (1943–47)","<b>Wavell Plan &amp; Simla Conference (1945)<\/b>; <b>Cabinet Mission (1946)<\/b>; Direct Action Day; INA trials"],["<b>Lord Mountbatten<\/b> (1947–48)","<b>Last Viceroy<\/b>; <b>3 June Plan<\/b>; <b>Indian Independence Act 1947<\/b>; first Governor-General of free India"],["<b>C. Rajagopalachari<\/b> (1948–50)","<b>First and only Indian Governor-General<\/b>"]]},{"k":"photos","title":"Viceroys in pictures","items":[["George_Robinson,_1st_Marquess_of_Ripon","Lord Ripon","Local self-government"],["George_Curzon,_1st_Marquess_Curzon_of_Kedleston","Lord Curzon","Partition of Bengal, 1905"],["Charles_Hardinge,_1st_Baron_Hardinge_of_Penshurst","Lord Hardinge","Capital to Delhi, 1911"],["Lord_Irwin","Lord Irwin","Gandhi–Irwin Pact"],["Louis_Mountbatten,_1st_Earl_Mountbatten_of_Burma","Lord Mountbatten","Last Viceroy"]]},{"k":"trick","h":"<b>Reform ↔ Viceroy pairs<\/b> — <span class=\"mn\">Ri-Lo, Cu-Par, Mi-Sep, Ha-Del, Che-Row, Ir-Pact, Wi-Act35, Lin-QI, Wa-Cab, Mo-Free<\/span>:<br><b>Ri<\/b>pon–<b>Lo<\/b>cal bodies · <b>Cu<\/b>rzon–<b>Par<\/b>tition of Bengal · <b>Mi<\/b>nto II–<b>Sep<\/b>arate electorates · <b>Ha<\/b>rdinge II–<b>Del<\/b>hi capital · <b>Che<\/b>lmsford–<b>Row<\/b>latt/Jallianwala · <b>Ir<\/b>win–Gandhi-Irwin <b>Pact<\/b> · <b>Wi<\/b>llingdon–<b>Act 1935<\/b> · <b>Lin<\/b>lithgow–<b>Q<\/b>uit <b>I<\/b>ndia · <b>Wa<\/b>vell–<b>Cab<\/b>inet Mission · <b>Mo<\/b>untbatten–<b>Free<\/b>dom."},{"k":"trap","h":"<b>Bentinck<\/b> abolished sati (1829) and brought in English education (1835) — not Dalhousie or Ripon. <b>Canning<\/b> is both the <b>last Governor-General<\/b> and the <b>first Viceroy<\/b>. <b>Lytton<\/b> passed the Vernacular Press Act and <b>Ripon repealed<\/b> it. <b>Mayo<\/b> is the census + the only murdered Viceroy."}],"sum":["Warren Hastings = first Governor-General of Bengal; Bentinck = first Governor-General of India; Canning = last Governor-General and first Viceroy; Mountbatten = last Viceroy; Rajagopalachari = only Indian Governor-General.","Cornwallis: Permanent Settlement 1793, father of the Indian civil services. Wellesley: Subsidiary Alliance. Dalhousie: Doctrine of Lapse, railways & telegraph 1853, Wood's Despatch 1854.","Bentinck: sati abolished 1829, English education 1835 (Macaulay's Minute). Mayo: first census 1872; the only Viceroy murdered in office.","Lytton: Vernacular Press Act & Arms Act 1878. Ripon: local self-government 1882, Factory Act 1881, Ilbert Bill 1883. Dufferin: Congress founded 1885. Curzon: Partition of Bengal 1905, Ancient Monuments Act 1904.","Minto II: separate electorates 1909. Hardinge II: capital to Delhi 1911 and partition annulled. Chelmsford: 1919 Act, Rowlatt, Jallianwala. Irwin: Simon Commission, Purna Swaraj, Gandhi-Irwin Pact. Willingdon: Act of 1935, Poona Pact. Linlithgow: Quit India. Wavell: Cabinet Mission."],"part":["From traders to rulers","व्यापारी से शासक"]},
{"id":"L20","g":"mod","heat":3,"title":"Revolt of 1857","hi":"1857 का विद्रोह","blocks":[{"k":"hot","h":"A certainty. The exam asks: who led where, who suppressed it, the immediate cause, which places stayed quiet, and what changed after it."},{"k":"story","h":"<p>By 1857, anger against the Company had piled up. Kings had lost their states to the Doctrine of Lapse, and Awadh had been seized. Craftsmen were ruined and peasants paid heavy land tax. Many feared the British wanted to change their religion. Indian soldiers (sepoys) had low pay and little hope of promotion. Then came the spark: cartridges for the new Enfield rifle, said to be greased with cow and pig fat. This offended Hindu and Muslim soldiers alike.<\/p><p>At Barrackpore, <b>Mangal Pandey<\/b> fired on his officers in March 1857. On 10 May the soldiers at <b>Meerut<\/b> rose, marched to Delhi and declared the old Mughal king Bahadur Shah Zafar their emperor. The revolt spread across north India, and in each centre a local leader took charge: Nana Saheb at Kanpur, Begum Hazrat Mahal at Lucknow, <b>Rani Lakshmibai<\/b> at Jhansi, Kunwar Singh in Bihar.<\/p><p>But Punjab, Bengal and most of the south stayed quiet, and many princes helped the British. By July 1858 the revolt was declared over. Yet it changed everything: Company rule ended, and the British Crown took direct control through a Viceroy. The tables match each centre with its leader and its British suppressor.<\/p>","key":"Years of anger met a spark in the greased cartridges; the revolt failed, but it ended Company rule and brought in the Crown."},{"k":"facts","title":"Causes and the spark","rows":[["Political","Doctrine of Lapse; annexation of Awadh (1856); the Mughal title to be ended after Bahadur Shah"],["Economic","Ruin of handicrafts, heavy land revenue, drain of wealth, <i>Inam<\/i> commission in the Deccan"],["Social/religious","Fear of conversion; abolition of sati and widow remarriage seen as interference; <b>Religious Disabilities Act (1850)<\/b>"],["Military","Indians' low pay and no promotion; <b>General Service Enlistment Act (1856)<\/b> forced overseas service"],["<b>Immediate cause<\/b>","The new <b>Enfield P-53 rifle<\/b> cartridges, greased with cow and pig fat"],["<b>Start<\/b>","<b>29 March 1857 — Mangal Pandey<\/b> at <b>Barrackpore<\/b> (34th Native Infantry) fired on his officers; hanged 8 April. Full revolt at <b>Meerut on 10 May 1857<\/b>; Delhi taken 11–12 May"],["Figurehead","<b>Bahadur Shah II \"Zafar\"<\/b> proclaimed emperor; exiled to <b>Rangoon<\/b> (died 1862)"]]},{"k":"table","title":"Centre ↔ Indian leader ↔ British suppressor","head":["Centre","Indian leader","Suppressed by"],"rows":[["<b>Delhi<\/b>","Bahadur Shah II, <b>Bakht Khan<\/b>","John Nicholson, Hudson, Lt. Willoughby"],["<b>Kanpur<\/b>","<b>Nana Saheb<\/b> &amp; <b>Tantia Tope<\/b> (Ramchandra Pandurang)","<b>Sir Colin Campbell<\/b> / Hugh Wheeler, Havelock"],["<b>Lucknow<\/b>","<b>Begum Hazrat Mahal<\/b> &amp; Birjis Qadr","Colin Campbell &amp; Henry Lawrence (Lawrence died)"],["<b>Jhansi &amp; Gwalior<\/b>","<b>Rani Lakshmibai<\/b> (d. 17/18 June 1858) &amp; Tantia Tope","<b>Sir Hugh Rose<\/b>"],["<b>Bareilly<\/b>","<b>Khan Bahadur Khan<\/b>","Sir Colin Campbell"],["<b>Arrah / Bihar<\/b>","<b>Kunwar Singh<\/b> &amp; Amar Singh","William Taylor, Vincent Eyre"],["<b>Faizabad<\/b>","<b>Maulvi Ahmadullah Shah<\/b>","—"],["<b>Allahabad<\/b>","Liaquat Ali","Colonel Neill"],["<b>Mathura / Barout<\/b>","Devi Singh / Shah Mal","—"],["<b>Assam<\/b>","Kandarpeshwar Singh","—"]]},{"k":"mapfig","title":"Centres of the Revolt of 1857","under":"<defs><marker id=\"ahtxhn2j\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"#c0392b\"/><\/marker><\/defs><path d=\"M179.9,168L173.4,173\" fill=\"none\" stroke=\"#c0392b\" stroke-width=\"4\" stroke-linecap=\"round\" opacity=\".75\" marker-end=\"url(#ahtxhn2j)\" style=\"vector-effect:non-scaling-stroke\"/><path d=\"M179.9,168L173.4,173\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.4\" stroke-dasharray=\"2 8\" class=\"rvf\" style=\"animation:rvflow 1.2s linear infinite;vector-effect:non-scaling-stroke\"/><text x=\"183.6\" y=\"160\" font-size=\"12\" font-weight=\"700\" style=\"fill:#c0392b;paint-order:stroke;stroke:var(--sheet);stroke-width:3px\">Meerut, 10 May 1857<\/text>","pins":[["1",77.21,28.65,"Delhi","n"],["2",80.33,26.45,"Kanpur","n"],["3",80.95,26.85,"Lucknow","n"],["4",78.57,25.45,"Jhansi & Gwalior","n"],["5",79.43,28.37,"Bareilly","n"],["6",84.66,25.56,"Arrah / Bihar","n"],["7",82.15,26.78,"Faizabad","n"],["8",81.85,25.44,"Allahabad","n"],["9",77.67,27.49,"Mathura / Barout","n"],["10",91.75,26.18,"Assam","n"]],"facts":[["1 · Delhi","Bahadur Shah II, Bakht Khan · put down by John Nicholson, Hudson, Lt. Willoughby"],["2 · Kanpur","Nana Saheb & Tantia Tope (Ramchandra Pandurang) · put down by Sir Colin Campbell / Hugh Wheeler, Havelock"],["3 · Lucknow","Begum Hazrat Mahal & Birjis Qadr · put down by Colin Campbell & Henry Lawrence (Lawrence died)"],["4 · Jhansi & Gwalior","Rani Lakshmibai (d. 17/18 June 1858) & Tantia Tope · put down by Sir Hugh Rose"],["5 · Bareilly","Khan Bahadur Khan · put down by Sir Colin Campbell"],["6 · Arrah / Bihar","Kunwar Singh & Amar Singh · put down by William Taylor, Vincent Eyre"],["7 · Faizabad","Maulvi Ahmadullah Shah · put down by —"],["8 · Allahabad","Liaquat Ali · put down by Colonel Neill"],["9 · Mathura / Barout","Devi Singh / Shah Mal · put down by —"],["10 · Assam","Kandarpeshwar Singh · put down by —"]],"cap":"It began at Meerut on 10 May 1857 (Mangal Pandey's protest at Barrackpore came in March). The rebels marched to Delhi and proclaimed Bahadur Shah II emperor."},{"k":"photos","title":"The leaders of 1857","items":[["Mangal_Pandey","Mangal Pandey","Barrackpore"],["Bahadur_Shah_Zafar","Bahadur Shah Zafar","Delhi"],["Rani_of_Jhansi","Rani of Jhansi","Jhansi"],["Tantia_Tope","Tantia Tope","Kanpur, Gwalior"],["Begum_Hazrat_Mahal","Begum Hazrat Mahal","Lucknow"],["Kunwar_Singh","Kunwar Singh","Arrah"],["Nana_Sahib","Nana Sahib","Kanpur"]]},{"k":"trick","h":"<b>Leader ↔ place<\/b> — \"<b>K<\/b>anpur has <b>N<\/b>ana, <b>L<\/b>ucknow has the <b>Begum<\/b>, <b>J<\/b>hansi has the <b>Rani<\/b>, <b>B<\/b>areilly has <b>Khan<\/b>, <b>A<\/b>rrah has <b>Kunwar<\/b>.\" The British suppressor to remember: <b>Hugh Rose for Jhansi<\/b>, <b>Colin Campbell for Kanpur &amp; Lucknow<\/b>.<br><b>Dates<\/b> — <span class=\"mn\">29 March (Mangal Pandey) → 10 May (Meerut) → 8 July 1858 (declared over)<\/span>."},{"k":"facts","title":"Character, and what changed after","rows":[["Which places stayed calm","<b>Punjab, Sindh, Rajputana, Kashmir, most of South India, Bengal<\/b>; Sikh and Gurkha troops helped the British"],["Who stayed loyal to the British","Scindia of Gwalior, Nizam of Hyderabad, Raja of Jodhpur, Nawab of Bhopal, rulers of Patiala/Nabha/Jind, Holkar"],["Who called it what","<b>V. D. Savarkar<\/b> — \"<b>First War of Indian Independence<\/b>\"; <b>Benjamin Disraeli<\/b> — \"a national rising\"; <b>Sir John Lawrence &amp; Seeley<\/b> — \"a mere sepoy mutiny\"; <b>R. C. Majumdar<\/b> — neither first, nor national, nor a war of independence; <b>Karl Marx<\/b> — a national revolt"],["<b>Government of India Act 1858<\/b>","Company rule ended; power to the <b>Crown<\/b>; office of the <b>Secretary of State for India<\/b> with a 15-member Council created; the <b>Governor-General became Viceroy<\/b>; the Court of Directors and Board of Control abolished"],["<b>Queen's Proclamation (1 Nov 1858)<\/b>","Read at Allahabad by Canning; promised no more annexation and respect for Indian religions and treaties"],["Army reorganised","Ratio of European to Indian troops raised; artillery kept with Europeans; recruitment shifted to \"martial races\" (Punjab, Nepal); Peel Commission (1859)"]]},{"k":"trap","h":"Mangal Pandey's act was at <b>Barrackpore<\/b> (Bengal), while the real revolt broke out at <b>Meerut<\/b> — SSC swaps these. <b>Rani Lakshmibai died at Gwalior<\/b>, not Jhansi. Nana Saheb's general was <b>Tantia Tope<\/b>, whose real name was <b>Ramchandra Pandurang<\/b>. The revolt was declared over on <b>8 July 1858<\/b>."}],"sum":["Immediate cause: Enfield P-53 greased cartridges. Mangal Pandey at Barrackpore, 29 March 1857; revolt from Meerut, 10 May 1857; declared over 8 July 1858.","Delhi–Bakht Khan; Kanpur–Nana Saheb & Tantia Tope; Lucknow–Begum Hazrat Mahal; Jhansi–Rani Lakshmibai (suppressed by Hugh Rose); Bareilly–Khan Bahadur Khan; Arrah–Kunwar Singh; Faizabad–Maulvi Ahmadullah Shah.","Punjab, Sindh, Rajputana, Kashmir, Bengal and most of the south stayed quiet; Sikh and Gurkha troops aided the British.","Savarkar called it the First War of Independence; Sir John Lawrence called it a sepoy mutiny; R. C. Majumdar denied all three claims.","Government of India Act 1858: Crown rule, Secretary of State for India, Governor-General becomes Viceroy. Queen's Proclamation, 1 Nov 1858, read at Allahabad."],"part":["From traders to rulers","व्यापारी से शासक"]},
{"id":"L21","g":"mod","heat":2,"title":"Socio-religious reform movements","hi":"सामाजिक-धार्मिक सुधार आंदोलन","blocks":[{"k":"hot","h":"One question nearly every shift: <b>who founded which organisation, in which year, in which city<\/b>, and their newspaper or slogan. Learn the table, not the story."},{"k":"story","h":"<p>In the 1800s, educated Indians looked hard at their own society. They saw evils like sati (burning a widow on her husband's pyre), child marriage, the ban on widows remarrying, and untouchability. They formed societies to reform things from within. The table looks long, but it sorts easily into four groups.<\/p><p><b>1. The Bengal pioneers<\/b> came first. <b>Raja Ram Mohan Roy<\/b>, the father of the Indian Renaissance, founded the Brahmo Samaj (1828) and helped end sati. Vidyasagar won the right of widows to remarry. <b>2. The revivalists<\/b> looked back to old roots: <b>Dayanand Saraswati's<\/b> Arya Samaj (Back to the Vedas), the Theosophists with Annie Besant, and Vivekananda's Ramakrishna Mission. <b>3. Voices against caste<\/b>: Jyotiba Phule's Satyashodhak Samaj in Pune, Sree Narayana Guru in Kerala, Periyar, and Ambedkar. <b>4. Muslim and Sikh reform<\/b>: Sir Syed Ahmad Khan's Aligarh movement for modern education, the Deoband school, and the Singh Sabha.<\/p><p>Next, tie each group to a city: Brahmo to Calcutta, Prarthana to Bombay, Satyashodhak to Pune, Ramakrishna to Belur. Finally, note that many campaigns ended in a law: sati banned in 1829, widow remarriage allowed in 1856, the Age of Consent Act in 1891. Learn the founder and the year as a pair.<\/p>","key":"Group the reformers into Bengal pioneers, revivalists, anti-caste fighters, and Muslim and Sikh reformers, then tie each to a city and a law."},{"k":"table","title":"Organisation ↔ founder ↔ year ↔ place","head":["Organisation","Founder","Year · Place"],"rows":[["<b>Atmiya Sabha<\/b>","Raja Ram Mohan Roy","1815 · Calcutta"],["<b>Brahmo Samaj<\/b>","<b>Raja Ram Mohan Roy<\/b>","<b>1828<\/b> · Calcutta"],["Tattvabodhini Sabha","Debendranath Tagore","1839 · Calcutta"],["Brahmo Samaj of India","<b>Keshab Chandra Sen<\/b>","1866"],["Sadharan Brahmo Samaj","Anand Mohan Bose &amp; Shivnath Shastri","1878"],["<b>Prarthana Samaj<\/b>","Atmaram Pandurang (with <b>M. G. Ranade<\/b> &amp; R. G. Bhandarkar)","1867 · Bombay"],["<b>Arya Samaj<\/b>","<b>Swami Dayanand Saraswati<\/b>","<b>1875<\/b> · Bombay (HQ later Lahore); slogan \"<b>Back to the Vedas<\/b>\"; book <b><i>Satyarth Prakash<\/i><\/b>; <b>Shuddhi<\/b> movement"],["<b>Theosophical Society<\/b>","<b>Madame Blavatsky &amp; Col. H. S. Olcott<\/b>","1875 · New York; Indian HQ <b>Adyar, Madras (1882)<\/b>; later led by <b>Annie Besant<\/b>"],["<b>Ramakrishna Mission<\/b>","<b>Swami Vivekananda<\/b>","<b>1897<\/b> · Belur, Calcutta; guru <b>Ramakrishna Paramahamsa<\/b>; Vivekananda spoke at the <b>Chicago Parliament of Religions, 1893<\/b>"],["<b>Satyashodhak Samaj<\/b>","<b>Jyotiba Phule<\/b>","1873 · Pune; book <b><i>Gulamgiri<\/i><\/b>; opened the first girls' school (1848) with Savitribai Phule"],["<b>Aligarh Movement / MAO College<\/b>","<b>Sir Syed Ahmad Khan<\/b>","1875 · Aligarh (became AMU in 1920); journal <i>Tahzib-ul-Akhlaq<\/i>"],["<b>Deoband Movement<\/b>","Muhammad Qasim Nanautavi &amp; Rashid Ahmad Gangohi","1866 · Deoband (UP)"],["<b>Ahmadiya Movement<\/b>","Mirza Ghulam Ahmad","1889 · Qadian"],["<b>Singh Sabha<\/b>","Thakur Singh &amp; Gyani Gyan Singh","1873 · Amritsar"],["<b>Servants of India Society<\/b>","<b>Gopal Krishna Gokhale<\/b>","1905 · Bombay"],["<b>Self-Respect Movement<\/b>","<b>E. V. Ramaswami Naicker \"Periyar\"<\/b>","1925 · Tamil Nadu"],["<b>Bahishkrit Hitkarini Sabha<\/b>","<b>B. R. Ambedkar<\/b>","1924 · Bombay; papers <i>Mooknayak<\/i>, <i>Bahishkrit Bharat<\/i>"],["<b>Sree Narayana Dharma Paripalana (SNDP)<\/b>","<b>Sree Narayana Guru<\/b>","1903 · Kerala; \"one caste, one religion, one God\""],["<b>Young Bengal Movement<\/b>","<b>Henry Vivian Derozio<\/b>","1820s–30s · Hindu College, Calcutta"],["Dev Samaj","Shiv Narayan Agnihotri","1887 · Lahore"],["Radhaswami Movement","Tulsi Ram (Shiv Dayal Saheb)","1861 · Agra"]]},{"k":"mapfig","title":"Where the reform movements began","pins":[["1",88.36,22.57,"Atmiya Sabha, Brahmo Samaj, Tattvabodhini Sabha","n"],["2",72.88,19.08,"Prarthana Samaj, Arya Samaj, Servants of India Society, Bahishkrit Hitkarini Sabha","n"],["3",88.35,22.63,"Ramakrishna Mission","n"],["4",73.86,18.52,"Satyashodhak Samaj","n"],["5",78.08,27.88,"Aligarh Movement / MAO College","n"],["6",77.68,29.69,"Deoband Movement","n"],["7",75.38,31.82,"Ahmadiya Movement","n"],["8",74.87,31.63,"Singh Sabha","n"],["9",78.7,11,"Self-Respect Movement","n"],["10",76.3,10,"Sree Narayana Dharma Paripalana (SNDP)","n"],["11",88.37,22.58,"Young Bengal Movement","n"],["12",74.35,31.55,"Dev Samaj","n"],["13",78,27.18,"Radhaswami Movement","n"]],"facts":[["1 · Calcutta","Atmiya Sabha (1815); Brahmo Samaj (1828); Tattvabodhini Sabha (1839)"],["2 · Bombay","Prarthana Samaj (1867); Arya Samaj (1875); Servants of India Society (1905); Bahishkrit Hitkarini Sabha (1924)"],["3 · Belur","Ramakrishna Mission (1897)"],["4 · Pune","Satyashodhak Samaj (1873)"],["5 · Aligarh","Aligarh Movement / MAO College (1875)"],["6 · Deoband","Deoband Movement (1866)"],["7 · Qadian","Ahmadiya Movement (1889)"],["8 · Amritsar","Singh Sabha (1873)"],["9 · Tamil Nadu","Self-Respect Movement (1925)"],["10 · Kerala","Sree Narayana Dharma Paripalana (SNDP) (1903)"],["11 · Hindu College","Young Bengal Movement (1820)"],["12 · Lahore","Dev Samaj (1887)"],["13 · Agra","Radhaswami Movement (1861)"]],"cap":"Calcutta and Bombay led the way. The Theosophical Society began in New York (1875) and moved to Adyar, Madras."},{"k":"trick","h":"<b>1875 is a double year<\/b>: <b>Arya Samaj<\/b> AND the <b>Theosophical Society<\/b> AND <b>MAO College, Aligarh<\/b>. Remember <span class=\"mn\">1875 = A-T-A<\/span>.<br><b>Samaj ↔ city<\/b>: <b>Brahmo<\/b>–Calcutta, <b>Prarthana<\/b>–Bombay (Pune region), <b>Arya<\/b>–Bombay/Lahore, <b>Satyashodhak<\/b>–Pune, <b>Ramakrishna<\/b>–Belur."},{"k":"facts","title":"Reformers — the one line each","rows":[["<b>Raja Ram Mohan Roy<\/b>","\"<b>Father of the Indian Renaissance<\/b>\"; got <b>sati abolished (1829)<\/b> with Bentinck; paper <b><i>Sambad Kaumudi<\/i><\/b> (Bengali) &amp; <i>Mirat-ul-Akhbar<\/i> (Persian); title \"Raja\" from Akbar II; died at Bristol, 1833"],["<b>Ishwar Chandra Vidyasagar<\/b>","<b>Widow Remarriage Act, 1856<\/b>; founded Bethune school; paper <i>Som Prakash<\/i>"],["<b>Swami Dayanand Saraswati<\/b>","Arya Samaj; \"Back to the Vedas\"; <i>Satyarth Prakash<\/i>; opposed idol worship and caste"],["<b>Swami Vivekananda<\/b>","Ramakrishna Mission; <i>Rajyoga<\/i>, <i>Karmayoga<\/i>; Chicago speech 1893; his birthday (<b>12 January<\/b>) is National Youth Day"],["<b>Annie Besant<\/b>","Theosophist; <b>Central Hindu College, Banaras (1898)<\/b> which grew into BHU; <b>Home Rule League (1916, Madras)<\/b>; <b>first woman President of the Congress (1917, Calcutta)<\/b>; paper <i>New India<\/i>"],["<b>Jyotiba Phule<\/b>","Satyashodhak Samaj; <i>Gulamgiri<\/i>; first school for girls and for untouchables"],["<b>B. R. Ambedkar<\/b>","Mahad Satyagraha (1927), Kalaram temple entry (1930); <b>Poona Pact (1932)<\/b> with Gandhi; chairman of the <b>Drafting Committee<\/b>; <i>Annihilation of Caste<\/i>; adopted Buddhism, 1956"],["<b>Sir Syed Ahmad Khan<\/b>","Aligarh movement; <i>Asar-us-Sanadid<\/i>; loyalist, urged Muslims to take English education"],["<b>Veerasalingam Pantulu<\/b>","Widow remarriage in Andhra — \"Vidyasagar of the South\""],["<b>Behramji Malabari<\/b>","<b>Age of Consent Act, 1891<\/b>"],["<b>Pandita Ramabai<\/b>","Arya Mahila Samaj; <b>Sharda Sadan<\/b> (1889) for widows"],["<b>Dhondo Keshav Karve<\/b>","Widows' home and the first Indian women's university (SNDT, 1916)"],["<b>Gopal Hari Deshmukh \"Lokahitawadi\"<\/b>","Maharashtra social reform through journalism"]]},{"k":"photos","title":"Reformers in pictures","items":[["Ram_Mohan_Roy","Ram Mohan Roy","Brahmo Samaj"],["Ishwar_Chandra_Vidyasagar","Ishwar Chandra Vidyasagar","Widow remarriage"],["Dayananda_Saraswati","Dayananda Saraswati","Arya Samaj"],["Swami_Vivekananda","Swami Vivekananda","Ramakrishna Mission"],["Jyotirao_Phule","Jyotirao Phule","Satyashodhak Samaj"],["Savitribai_Phule","Savitribai Phule","First girls' school"],["Syed_Ahmad_Khan","Syed Ahmad Khan","Aligarh"],["Narayana_Guru","Narayana Guru","SNDP"],["Periyar_E._V._Ramasamy","Periyar","Self-Respect"]]},{"k":"facts","title":"Reform laws — year and reformer","rows":[["Sati abolished","<b>1829<\/b> — Bentinck + Ram Mohan Roy (Regulation XVII)"],["Slavery abolished","1843 — Ellenborough"],["<b>Hindu Widow Remarriage Act<\/b>","<b>1856<\/b> — Vidyasagar's campaign, under Dalhousie/Canning"],["Female infanticide banned","1795, 1802, 1870 (Act VIII)"],["<b>Age of Consent Act<\/b>","<b>1891<\/b> — Malabari; raised the age to 12"],["<b>Sarda Act (Child Marriage Restraint)<\/b>","<b>1929<\/b> — marriage age 14 for girls, 18 for boys"],["Caste Disabilities Removal Act","1850"]]},{"k":"trap","h":"<b>Brahmo Samaj = 1828 Ram Mohan Roy; Arya Samaj = 1875 Dayanand Saraswati<\/b> — the most-swapped pair in the paper. The <b>Theosophical Society was founded in New York<\/b> (1875), with its Indian HQ at Adyar from 1882. <b>Annie Besant was the first woman Congress President (1917)<\/b>; <b>Sarojini Naidu was the first Indian woman<\/b> President (1925, Kanpur)."}],"sum":["Brahmo Samaj 1828 (Ram Mohan Roy); Prarthana Samaj 1867 (Atmaram Pandurang, Ranade); Arya Samaj 1875 (Dayanand Saraswati, 'Back to the Vedas', Satyarth Prakash).","Theosophical Society 1875 New York, Adyar HQ 1882, later Annie Besant. Ramakrishna Mission 1897 at Belur (Vivekananda; Chicago speech 1893).","Satyashodhak Samaj 1873 (Jyotiba Phule, Gulamgiri); SNDP 1903 (Sree Narayana Guru); Self-Respect Movement 1925 (Periyar); Bahishkrit Hitkarini Sabha 1924 (Ambedkar).","Ram Mohan Roy = sati abolished 1829; Vidyasagar = Widow Remarriage Act 1856; Malabari = Age of Consent Act 1891; Sarda Act 1929.","Annie Besant = first woman Congress President (1917); Sarojini Naidu = first Indian woman President (1925)."],"part":["Reform and awakening","सुधार और जागरण"]},
{"id":"L31","g":"mod","heat":2,"title":"Press, education & newspapers","hi":"प्रेस · शिक्षा · समाचार पत्र","blocks":[{"k":"hot","h":"Expect one question on <b>who started which newspaper<\/b> and one on an <b>education commission or press law, with its year and Viceroy<\/b>. Pairs like <b>Al-Hilal–Azad<\/b>, <b>Comrade–Mohammad Ali<\/b>, <b>Hunter Commission–Ripon<\/b> and <b>Metcalfe–liberator of the press<\/b> come back again and again."},{"k":"story","h":"<p>When the East India Company first ruled Bengal, there was no newspaper at all. In <b>1780<\/b> an Irishman, <b>James Augustus Hicky<\/b>, printed <i>Hicky's Bengal Gazette<\/i> in Calcutta. He mocked Company officials, and in 1782 his press was seized. From the very start, the rulers feared the printed word.<\/p><p>Indians soon learned to use this weapon. <b>Raja Ram Mohan Roy<\/b> wrote papers in Bengali and Persian; later <i>Amrita Bazar Patrika<\/i>, <i>The Hindu<\/i> and Tilak's <i>Kesari<\/i> carried news of famine, unfair taxes and the Congress to every town. The British answered with laws. <b>Lord Lytton's Vernacular Press Act (1878)<\/b> gagged Indian-language papers, so <i>Amrita Bazar Patrika<\/i> switched to English almost overnight to escape it. New press laws in 1908 and 1910 were aimed at the angry Swadeshi papers.<\/p><p>Schooling followed a similar path. At first the Company backed Persian and Sanskrit learning. Then <b>Macaulay's Minute (1835)<\/b> made English the language of higher education, and <b>Wood's Despatch (1854)<\/b> led to the first three universities in 1857. The result surprised the rulers: English-educated Indians read about liberty and democracy, and used that same English to demand freedom.<\/p>"},{"k":"table","title":"Newspaper ↔ founder ↔ year","head":["Paper","Founder / editor","Year · language · note"],"rows":[["<b><i>Hicky's Bengal Gazette<\/i><\/b>","<b>James Augustus Hicky<\/b>","<b>1780<\/b> · English · Calcutta — <b>India's first newspaper<\/b> (also called the <i>Calcutta General Advertiser<\/i>)"],["<i>Sambad Kaumudi<\/i>","<b>Raja Ram Mohan Roy<\/b>","1821 · Bengali"],["<i>Mirat-ul-Akhbar<\/i>","<b>Raja Ram Mohan Roy<\/b>","1822 · <b>Persian<\/b>; closed in protest against the press regulation of 1823"],["<b><i>Bombay Samachar<\/i><\/b>","Fardunjee Marzban","<b>1822<\/b> · <b>Gujarati<\/b>; still published — among the oldest newspapers in Asia"],["<b><i>Amrita Bazar Patrika<\/i><\/b>","<b>Sisir Kumar Ghosh &amp; Motilal Ghosh<\/b>","<b>1868<\/b> · began in <b>Bengali<\/b>; turned <b>English<\/b> in 1878 to escape the Vernacular Press Act"],["<b><i>The Hindu<\/i><\/b>","G. Subramania Iyer &amp; M. Veeraraghavachariar","<b>1878<\/b> · English · <b>Madras<\/b> (began as a weekly)"],["<i>Kesari<\/i> / <i>Maratha<\/i>","<b>Bal Gangadhar Tilak<\/b> (with Agarkar &amp; Chiplunkar)","1881 · Marathi / English"],["<b><i>Bengalee<\/i><\/b>","<b>Surendranath Banerjee<\/b> (editor from 1879)","English · Calcutta; he was jailed for contempt of court in 1883"],["<b><i>Bande Mataram<\/i><\/b>","<b>Bipin Chandra Pal<\/b>; edited by <b>Aurobindo Ghosh<\/b>","1906 · English daily · Calcutta — voice of the Extremists"],["<b><i>Comrade<\/i><\/b>","<b>Maulana Mohammad Ali<\/b>","1911 · <b>English<\/b> · Calcutta, later Delhi; his Urdu paper was <i>Hamdard<\/i>"],["<b><i>Al-Hilal<\/i><\/b>","<b>Maulana Abul Kalam Azad<\/b>","<b>1912<\/b> · <b>Urdu<\/b> weekly · Calcutta; banned in 1914, followed by <i>Al-Balagh<\/i>"],["<i>Young India<\/i> / <i>Navajivan<\/i>","<b>Mahatma Gandhi<\/b> (from 1919)","English / Gujarati weeklies"],["<i>Harijan<\/i>","<b>Mahatma Gandhi<\/b>","1933 · weekly against untouchability"]]},{"k":"tlfig","title":"Newspapers of the national movement","rows":[[1780,"Hicky's Bengal Gazette — James Augustus Hicky",""],[1821,"Sambad Kaumudi — Raja Ram Mohan Roy",""],[1822,"Mirat-ul-Akhbar — Raja Ram Mohan Roy",""],[1822,"Bombay Samachar — Fardunjee Marzban",""],[1868,"Amrita Bazar Patrika — Sisir Kumar Ghosh & Motilal Ghosh",""],[1878,"The Hindu — G. Subramania Iyer & M. Veeraraghavachariar",""],[1881,"Kesari / Maratha — Bal Gangadhar Tilak",""],[1883,"Bengalee — Surendranath Banerjee",""],[1906,"Bande Mataram — Bipin Chandra Pal; edited by Aurobindo Ghosh",""],[1911,"Comrade — Maulana Mohammad Ali",""],[1912,"Al-Hilal — Maulana Abul Kalam Azad",""],[1933,"Harijan — Mahatma Gandhi",""]],"cap":"From Hicky's Bengal Gazette (1780) to Gandhi's Harijan (1933). Tilak's Kesari was in Marathi; Azad's Al-Hilal in Urdu."},{"k":"tl","title":"Press laws — tightening and loosening","rows":[["1799","<b>Censorship of the Press Act<\/b> — <b>Wellesley<\/b>, out of fear of French propaganda"],["1823","<b>Licensing Regulations<\/b> — acting Governor-General <b>John Adam<\/b>; Ram Mohan Roy stopped <i>Mirat-ul-Akhbar<\/i> in protest"],["<b>1835<\/b>","<b>Metcalfe's Act<\/b> — <b>Charles Metcalfe<\/b> repealed the 1823 rules: the '<b>liberator of the Indian press<\/b>'"],["1857","Licensing Act — <b>Canning<\/b>, during the Revolt"],["1867","Press and Registration of Books Act — <b>John Lawrence<\/b>"],["<b>1878<\/b>","<b>Vernacular Press Act<\/b> — <b>Lytton<\/b>; the 'gagging act', aimed only at Indian-language papers; <b>repealed by Ripon in 1882<\/b>"],["<b>1908<\/b>","<b>Newspapers (Incitement to Offences) Act<\/b> — <b>Minto II<\/b>, after the Muzaffarpur bomb"],["<b>1910<\/b>","<b>Indian Press Act<\/b> — <b>Minto II<\/b>; papers had to deposit security money"],["1922","The 1908 and 1910 Acts repealed under <b>Reading<\/b>"],["1931","Indian Press (Emergency Powers) Act — during Civil Disobedience"]]},{"k":"tl","title":"Education — institutions, reports and plans","rows":[["<b>1781<\/b>","<b>Calcutta Madrasa<\/b> — <b>Warren Hastings<\/b> (Persian and Arabic learning)"],["1784","Asiatic Society of Bengal — <b>William Jones<\/b>"],["<b>1791<\/b>","<b>Sanskrit College, Benares<\/b> — <b>Jonathan Duncan<\/b>, the British Resident"],["<b>1800<\/b>","<b>Fort William College<\/b>, Calcutta — <b>Wellesley<\/b>"],["<b>1813<\/b>","<b>Charter Act<\/b> — first state money for education: ₹1 lakh a year"],["1817","Hindu College, Calcutta"],["<b>1835<\/b>","<b>Macaulay's Minute<\/b> (2 Feb) — English as the medium of higher education; accepted by <b>Bentinck<\/b>"],["<b>1854<\/b>","<b>Wood's Despatch<\/b> — <b>Dalhousie<\/b>; the 'Magna Carta of English education in India'"],["<b>1857<\/b>","Universities of <b>Calcutta, Bombay &amp; Madras<\/b> on the London University model — <b>Canning<\/b>"],["<b>1882<\/b>","<b>Hunter Commission<\/b> (W. W. Hunter) — <b>Ripon<\/b>; primary and secondary education"],["<b>1902 / 1904<\/b>","<b>Raleigh Commission<\/b> → <b>Indian Universities Act, 1904<\/b> — <b>Curzon<\/b>"],["<b>1917–19<\/b>","<b>Sadler Commission<\/b> (Calcutta University Commission) — <b>Chelmsford<\/b>"],["<b>1929<\/b>","<b>Hartog Committee<\/b> — auxiliary committee of the <b>Simon Commission<\/b>"],["<b>1937<\/b>","<b>Wardha Scheme / Basic Education (Nai Talim)<\/b> — Gandhi's idea, worked out by a committee under <b>Zakir Hussain<\/b>"],["<b>1944<\/b>","<b>Sargent Plan<\/b> — John Sargent, Educational Adviser to the government"]]},{"k":"facts","title":"Education reports — the one line each","rows":[["<b>Macaulay's Minute<\/b>","English for higher education; the idea of '<b>downward filtration<\/b>' — teach a few in English and learning would trickle down; claimed 'a single shelf of a good European library' was worth all the native literature of India and Arabia"],["<b>Wood's Despatch<\/b>","<b>Sir Charles Wood<\/b>, President of the Board of Control: an education department in every province, <b>universities<\/b> in the presidency towns, grants-in-aid, vernacular primary schools, women's education"],["<b>Hunter Commission<\/b>","Handed primary education to district and municipal boards"],["<b>Raleigh Commission / 1904 Act<\/b>","Tighter government control over universities — nationalists saw it as an attack on higher education"],["<b>Sadler Commission<\/b>","Michael Sadler; a <b>12-year school course<\/b> and an intermediate stage; Asutosh Mukherjee was a member"],["<b>Hartog Committee<\/b>","Philip Hartog; warned of '<b>wastage and stagnation<\/b>' — consolidate primary education rather than expand it"],["<b>Wardha Scheme<\/b>","Free, compulsory education for seven years in the mother tongue, built around a <b>productive craft<\/b>"],["<b>Sargent Plan<\/b>","Free, compulsory education for children aged <b>6 to 14<\/b>, to be reached in 40 years"]]},{"k":"trick","h":"<b>Education reports in order<\/b> — <span class=\"mn\">My Wise Hunter Rides Swiftly Home With Sargent<\/span>: <b>M<\/b>acaulay 1835 → <b>W<\/b>ood 1854 → <b>H<\/b>unter 1882 → <b>R<\/b>aleigh 1902 → <b>S<\/b>adler 1917 → <b>H<\/b>artog 1929 → <b>W<\/b>ardha 1937 → <b>S<\/b>argent 1944.<br><b>Paper ↔ Maulana<\/b>: <span class=\"mn\">A-A<\/span> = <b>A<\/b>zad – <b>A<\/b>l-Hilal (Urdu); <span class=\"mn\">M-C<\/span> = <b>M<\/b>ohammad Ali – <b>C<\/b>omrade (English)."},{"k":"trap","h":"<b>Metcalfe freed the press (1835); Lytton gagged it (1878); Ripon repealed the gag (1882).<\/b> The <b>Hunter Commission of 1882<\/b> (education, Ripon) is not the <b>Hunter Committee of 1919<\/b> (Jallianwala Bagh). <i>Amrita Bazar Patrika<\/i> did not close under the 1878 Act — it <b>changed to English<\/b>. The newspaper <i>Bande Mataram<\/i> (Pal and Aurobindo) is not Bankim's song. <i>Comrade<\/i> was in <b>English<\/b>, <i>Al-Hilal<\/i> in <b>Urdu<\/b>."}],"sum":["Hicky's Bengal Gazette (1780, Calcutta) was India's first newspaper; Ram Mohan Roy ran Sambad Kaumudi in Bengali and Mirat-ul-Akhbar in Persian.","Amrita Bazar Patrika (1868, Sisir Kumar and Motilal Ghosh) turned English overnight to escape Lytton's Vernacular Press Act of 1878; The Hindu also began in 1878 at Madras.","Al-Hilal (Urdu) was Maulana Azad's paper, Comrade (English) was Mohammad Ali's, Bengalee was Surendranath Banerjee's, and Bande Mataram was run by Bipin Chandra Pal and Aurobindo Ghosh.","Metcalfe freed the press in 1835 and is called its liberator; Ripon repealed the Vernacular Press Act in 1882; the Newspapers Act of 1908 and Indian Press Act of 1910 hit the Swadeshi press.","Education: Calcutta Madrasa 1781, Sanskrit College Benares 1791, Macaulay's Minute 1835, Wood's Despatch 1854, Hunter 1882, Raleigh 1902 and Universities Act 1904, Sadler 1917, Hartog 1929, Wardha 1937, Sargent 1944."],"part":["Reform and awakening","सुधार और जागरण"]},
{"id":"L22","g":"mod","heat":3,"title":"Congress, Moderates & Extremists","hi":"कांग्रेस · नरमपंथी एवं गरमपंथी","blocks":[{"k":"hot","h":"Guaranteed: the 1885 founding details, the Surat split, the Partition of Bengal and Swadeshi, Lucknow Pact, Home Rule League — with years and presidents."},{"k":"story","h":"<p>By the 1880s, educated Indians wanted a voice in how they were ruled. In 1885 a retired British officer, <b>A. O. Hume<\/b>, helped them found the <b>Indian National Congress<\/b> in Bombay. Its early leaders, the Moderates, like <b>Dadabhai Naoroji<\/b> and Gokhale, were polite and patient. They sent petitions and made speeches asking for reforms within British rule. Naoroji also showed how British rule drained India's wealth.<\/p><p>Many younger Indians grew tired of asking politely. The anger burst out in 1905, when Lord Curzon split Bengal in two. Bengal answered with Swadeshi (use Indian goods) and boycott of British goods, the first mass movement. The Extremists, Lal-Bal-Pal, led by <b>Bal Gangadhar Tilak<\/b>, demanded Swaraj (self-rule) as a birthright. The two camps clashed, and in 1907 the Congress split at Surat. Meanwhile the Muslim League was founded in 1906, and in 1909 the British gave Muslims separate electorates.<\/p><p>The protests worked: the partition was cancelled in 1911. In 1916 the Moderates and Extremists reunited, and the Congress and the League signed the <b>Lucknow Pact<\/b>. Tilak and Annie Besant started Home Rule Leagues. The tables give the dates and the Congress presidents.<\/p>","key":"The Congress began with polite petitions; the 1905 Partition of Bengal pushed it toward Swadeshi and Swaraj, a split in 1907 and a reunion in 1916."},{"k":"facts","title":"The founding of the Congress","rows":[["Founded","<b>28 December 1885<\/b> at <b>Gokuldas Tejpal Sanskrit College, Bombay<\/b>"],["Founder","<b>Allan Octavian Hume<\/b>, a retired British civil servant; Sir William Wedderburn and Dadabhai Naoroji helped him"],["First President","<b>W. C. Bonnerjee<\/b> (Womesh Chandra Banerjee); 72 delegates"],["Viceroy then","<b>Lord Dufferin<\/b>"],["Earlier bodies","Bangabhasha Prakashika Sabha (1836), Landholders' Society (1838), British India Society (1839), <b>British Indian Association (1851)<\/b>, <b>East India Association (1866, Dadabhai Naoroji, London)<\/b>, <b>Indian Association (1876, Surendranath Banerjee &amp; Anand Mohan Bose)<\/b>, Madras Mahajan Sabha (1884), Bombay Presidency Association (1885)"],["\"Safety valve\" theory","Lala Lajpat Rai's reading of Hume's intent, from Hume's own papers (W. Wedderburn's biography)"]]},{"k":"table","title":"Moderates vs Extremists","head":["Point","Moderates (1885–1905)","Extremists (1905–1919)"],"rows":[["Leaders","<b>Dadabhai Naoroji<\/b>, <b>G. K. Gokhale<\/b>, Surendranath Banerjee, Pherozeshah Mehta, W. C. Bonnerjee, Badruddin Tyabji, R. C. Dutt","<b>Lal-Bal-Pal<\/b> — <b>Lala Lajpat Rai<\/b>, <b>Bal Gangadhar Tilak<\/b>, <b>Bipin Chandra Pal<\/b>; also Aurobindo Ghosh"],["Method","Petitions, prayers, resolutions — \"<b>political mendicancy<\/b>\" (Tilak's jibe)","Swadeshi, boycott, passive resistance, national education"],["Goal","Reform within the empire","<b>Swaraj<\/b> — \"<b>Swaraj is my birthright and I shall have it<\/b>\" (Tilak)"],["Key ideas","Naoroji's <b>Drain Theory<\/b> (<i>Poverty and Un-British Rule in India<\/i>); Gokhale was Gandhi's \"political guru\"","Tilak: <i>Kesari<\/i> (Marathi) &amp; <i>Maratha<\/i> (English); started <b>Ganapati (1893)<\/b> and <b>Shivaji (1895)<\/b> festivals; <b>first to demand Swaraj<\/b>"]]},{"k":"photos","title":"Moderates and Extremists","items":[["Dadabhai_Naoroji","Dadabhai Naoroji","Grand Old Man · drain theory"],["Gopal_Krishna_Gokhale","Gopal Krishna Gokhale","Gandhi's political guru"],["Surendranath_Banerjee","Surendranath Banerjee","Moderate"],["Bal_Gangadhar_Tilak","Bal Gangadhar Tilak","Swaraj is my birthright"],["Lala_Lajpat_Rai","Lala Lajpat Rai","Punjab Kesari"],["Bipin_Chandra_Pal","Bipin Chandra Pal","Bengal"],["Allan_Octavian_Hume","Allan Octavian Hume","Founder, 1885"],["Annie_Besant","Annie Besant","Home Rule, 1916"]]},{"k":"tl","title":"1905–1916, the decisive decade","rows":[["<b>1905<\/b>","<b>Partition of Bengal<\/b> announced by <b>Curzon<\/b> (16 Oct 1905 = the day it took effect, observed as a day of mourning); <b>Swadeshi &amp; Boycott movement<\/b> begins — the first mass movement"],["<b>1906<\/b>","<b>Muslim League<\/b> founded at <b>Dhaka<\/b> by Nawab Salimullah &amp; Aga Khan; Congress (Dadabhai Naoroji, Calcutta) adopts <b>Swaraj<\/b> as the goal"],["<b>1907<\/b>","<b>Surat Split<\/b> — Congress divides into Moderates and Extremists; president Rash Behari Ghosh"],["<b>1909<\/b>","<b>Morley-Minto Reforms<\/b> — <b>separate electorates<\/b> for Muslims"],["<b>1911<\/b>","Partition of Bengal <b>annulled<\/b>; capital moved to Delhi"],["<b>1915–16<\/b>","Tilak and Annie Besant start the <b>Home Rule Leagues<\/b> (Tilak: April 1916, Pune; Besant: September 1916, Madras)"],["<b>1916<\/b>","<b>Lucknow Pact<\/b> — Congress and Muslim League come together, and the Moderates and Extremists reunite; president <b>Ambica Charan Majumdar<\/b>"],["<b>1917<\/b>","<b>Annie Besant<\/b> becomes the first woman Congress President; <b>Champaran<\/b> satyagraha; <b>Montagu Declaration (August Declaration)<\/b> promises responsible government"]]},{"k":"trick","h":"<b>Lal-Bal-Pal<\/b> gives you all three Extremists at once: <b>Lal<\/b>a Lajpat Rai (Punjab), <b>Bal<\/b> Gangadhar Tilak (Maharashtra), <b>Pal<\/b> = Bipin Chandra Pal (Bengal) — one from each region.<br><b>1905-06-07<\/b> is a run: <b>Partition → Muslim League → Surat Split<\/b>."},{"k":"facts","title":"Presidents you must know","rows":[["First President","<b>W. C. Bonnerjee<\/b> (1885)"],["First Muslim President","<b>Badruddin Tyabji<\/b> (1887, Madras)"],["First English President","George Yule (1888)"],["Only President three times","<b>Dadabhai Naoroji<\/b> (1886, 1893, 1906) — \"<b

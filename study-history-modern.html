>Grand Old Man of India<\/b>\", also the first Indian in the British Parliament"],["First woman President","<b>Annie Besant<\/b> (1917, Calcutta)"],["First Indian woman President","<b>Sarojini Naidu<\/b> (1925, Kanpur) — the \"Nightingale of India\""],["President at Lahore (1929, Purna Swaraj)","<b>Jawaharlal Nehru<\/b>"],["President at Karachi (1931, Fundamental Rights resolution)","<b>Sardar Vallabhbhai Patel<\/b>"],["President at Haripura (1938) &amp; Tripuri (1939)","<b>Subhas Chandra Bose<\/b> — resigned in 1939 after beating Gandhi's candidate Pattabhi Sitaramayya, and founded the <b>Forward Bloc<\/b>"],["President at the time of Independence","<b>J. B. Kripalani<\/b> (1947)"],["Youngest &amp; longest-serving President","<b>Maulana Abul Kalam Azad<\/b> — youngest ever at 35 (1923, Delhi special session) and President right through 1940–46, the longest stretch"]]},{"k":"trap","h":"The Partition of Bengal was <b>announced in 1905 and annulled in 1911<\/b>; Curzon ordered it, Hardinge II annulled it. The <b>Surat Split was 1907<\/b> and the <b>reunion was 1916 at Lucknow<\/b>. Dadabhai Naoroji was president <b>three<\/b> times — nobody else in the early period."}],"sum":["Congress founded 28 Dec 1885 at Gokuldas Tejpal Sanskrit College, Bombay, by A. O. Hume; first President W. C. Bonnerjee; Viceroy Dufferin.","Moderates: Naoroji (Drain Theory), Gokhale, Surendranath Banerjee. Extremists: Lal-Bal-Pal; Tilak's papers Kesari and Maratha; 'Swaraj is my birthright'.","1905 Partition of Bengal (Curzon) → Swadeshi; 1906 Muslim League at Dhaka; 1907 Surat Split; 1909 separate electorates; 1911 partition annulled; 1916 Home Rule Leagues + Lucknow Pact.","Presidents: first W. C. Bonnerjee; first Muslim Badruddin Tyabji (1887); thrice Dadabhai Naoroji; first woman Annie Besant (1917); first Indian woman Sarojini Naidu (1925).","Lahore 1929 (Purna Swaraj) — Nehru. Karachi 1931 (Fundamental Rights) — Sardar Patel. Haripura 1938 & Tripuri 1939 — Subhas Chandra Bose, who then founded the Forward Bloc."],"part":["The freedom struggle","स्वतंत्रता संग्राम"]},
{"id":"L23","g":"mod","heat":3,"title":"Gandhian era — 1917 to 1934","hi":"गांधी युग","blocks":[{"k":"hot","h":"The most asked single stretch in all of History. Fix the <b>four movements in order with their years<\/b>, why each ended, and the three Round Table Conferences."},{"k":"story","h":"<p><b>Mohandas Karamchand Gandhi<\/b> spent about twenty years in South Africa, where he developed satyagraha: fighting injustice through peaceful refusal and a readiness to suffer. He returned to India in 1915. First he tried it on local problems: indigo farmers at <b>Champaran<\/b> (1917), mill workers in Ahmedabad and peasants of Kheda (1918). He won, and became a leader of ordinary people.<\/p><p>In 1919 the Rowlatt Act let the British jail people without trial. At Jallianwala Bagh in Amritsar, General Dyer fired on an unarmed crowd. Gandhi then launched the <b>Non-Cooperation Movement<\/b> (1920): give up titles, leave British schools and courts, boycott foreign cloth. When a crowd killed policemen at Chauri Chaura in 1922, he called it off, because the struggle had to stay non-violent.<\/p><p>In 1928 the all-British Simon Commission was met with Go back Simon. In 1929, at Lahore, the Congress demanded <b>Purna Swaraj<\/b> (complete independence). In 1930 Gandhi walked to Dandi and made salt, breaking a British law and starting Civil Disobedience. The Gandhi-Irwin Pact paused it, and Gandhi attended the Second Round Table Conference in London. The tables put these events in order, year by year.<\/p>","key":"Gandhi's peaceful mass movements grew step by step, from local satyagrahas to Non-Cooperation and the Salt March, and each one ended for a clear reason."},{"k":"tl","title":"Gandhi's movements in order","rows":[["1893–1914","South Africa — first satyagraha at <b>Johannesburg (1906)<\/b> against the Asiatic Registration Act; founded <b>Phoenix Settlement<\/b> &amp; <b>Tolstoy Farm<\/b>; paper <i>Indian Opinion<\/i>"],["<b>1915<\/b>","Returns to India (9 Jan — now <b>Pravasi Bharatiya Divas<\/b>); founds the <b>Sabarmati/Satyagraha Ashram<\/b> (Kochrab 1915, Sabarmati 1917)"],["<b>1917<\/b>","<b>Champaran Satyagraha<\/b> (Bihar) — against the <b>tinkathia<\/b> indigo system; his <b>first satyagraha in India<\/b>; invited by Rajkumar Shukla"],["<b>1918<\/b>","<b>Ahmedabad Mill Strike<\/b> — his first <b>hunger strike<\/b>; <b>Kheda Satyagraha<\/b> (Gujarat) — his first <b>non-cooperation<\/b>, for revenue remission in a famine; Sardar Patel joined here"],["<b>1919<\/b>","<b>Rowlatt Act<\/b> (\"no vakil, no dalil, no appeal\") → first all-India <b>hartal, 6 April<\/b>; <b>Jallianwala Bagh, 13 April 1919<\/b> (Gen. <b>Dyer<\/b>; Punjab Lt-Gov <b>O'Dwyer<\/b>); <b>Hunter Commission<\/b>; Tagore returned his knighthood; <b>Khilafat<\/b> movement starts"],["<b>1920–22<\/b>","<b>Non-Cooperation Movement<\/b> — approved at the <b>Nagpur session (Dec 1920)<\/b>; surrender of titles, boycott of councils, schools, courts and foreign cloth; withdrawn after <b>Chauri Chaura (5 Feb 1922, Gorakhpur)<\/b>"],["<b>1923–27<\/b>","<b>Swaraj Party<\/b> (C. R. Das &amp; Motilal Nehru, 1923); <b>Simon Commission (1927/28)<\/b> — \"<b>Go back Simon<\/b>\", all-white, no Indian member; <b>Lala Lajpat Rai injured at Lahore (Oct 1928)<\/b> and died"],["<b>1928<\/b>","<b>Nehru Report<\/b> (Motilal Nehru) — dominion status; <b>Bardoli Satyagraha<\/b> — Vallabhbhai Patel wins the title <b>Sardar<\/b> from the women of Bardoli"],["<b>1929<\/b>","<b>Lahore session<\/b>, Nehru presiding — <b>Purna Swaraj<\/b>; the tricolour hoisted on the Ravi on <b>31 Dec 1929<\/b>; <b>26 January 1930<\/b> observed as the first <b>Independence Day<\/b>"],["<b>1930–34<\/b>","<b>Civil Disobedience<\/b> — <b>Dandi March, 12 March to 6 April 1930<\/b>, 385 km from Sabarmati to Dandi with <b>78 followers<\/b>; salt law broken 6 April; <b>Gandhi-Irwin Pact, 5 March 1931<\/b> suspended it; relaunched after the 2nd RTC; finally withdrawn <b>1934<\/b>"],["<b>1932<\/b>","<b>Communal Award<\/b> (Ramsay MacDonald) gave separate electorates to the Depressed Classes → Gandhi's fast → <b>Poona Pact, 24 Sept 1932<\/b> (Gandhi–Ambedkar): reserved seats instead of separate electorates"]]},{"k":"mapfig","title":"Gandhi's campaigns on the map","under":"<defs><marker id=\"ah231ja6\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"#c69214\"/><\/marker><\/defs><path d=\"M84.9,288L90.9,300L92.7,312L91.8,322L89,329\" fill=\"none\" stroke=\"#c69214\" stroke-width=\"4\" stroke-linecap=\"round\" opacity=\".75\" marker-end=\"url(#ah231ja6)\" style=\"vector-effect:non-scaling-stroke\"/><path d=\"M84.9,288L90.9,300L92.7,312L91.8,322L89,329\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.4\" stroke-dasharray=\"2 8\" class=\"rvf\" style=\"animation:rvflow 1.2s linear infinite;vector-effect:non-scaling-stroke\"/><text x=\"115\" y=\"316\" font-size=\"12\" font-weight=\"700\" style=\"fill:#c69214;paint-order:stroke;stroke:var(--sheet);stroke-width:3px\">Dandi March · 385 km<\/text>","pins":[["1",69.6,21.64,"Porbandar","n"],["2",84.8,26.9,"Champaran","n"],["3",72.58,23.06,"Ahmedabad","n"],["4",72.69,22.75,"Kheda","n"],["5",74.87,31.62,"Amritsar","n"],["6",83.6,26.65,"Chauri Chaura","n"],["7",73.11,21.12,"Bardoli","n"],["8",72.8,20.89,"Dandi","n"],["9",78.6,20.73,"Wardha (Sevagram)","n"]],"facts":[["1 · Porbandar","Born 2 Oct 1869"],["2 · Champaran","1917 — first satyagraha in India (indigo)"],["3 · Ahmedabad","1918 — mill strike; Sabarmati Ashram"],["4 · Kheda","1918 — revenue satyagraha"],["5 · Amritsar","1919 — Jallianwala Bagh, 13 April"],["6 · Chauri Chaura","1922 — violence ends Non-Cooperation"],["7 · Bardoli","1928 — Patel's satyagraha"],["8 · Dandi","1930 — Salt March, 12 March–6 April"],["9 · Wardha (Sevagram)","Ashram from 1936"]],"cap":"The Dandi March (gold arrow) walked 385 km from Sabarmati to Dandi in 24 days with 78 followers to break the salt law."},{"k":"photos","title":"Gandhi's struggle in pictures","items":[["Salt_March","Salt March","1930"],["Sabarmati_Ashram","Sabarmati Ashram","Ahmedabad"],["Jallianwala_Bagh","Jallianwala Bagh","Amritsar, 1919"],["Sevagram","Sevagram","Wardha"],["Gandhi–Irwin_Pact","Gandhi–Irwin Pact","March 1931"]]},{"k":"trick","h":"<b>Gandhi's first three<\/b> — <span class=\"mn\">Cham-Khe-Ahm<\/span> in <span class=\"mn\">17-18-18<\/span>: <b>Cham<\/b>paran (indigo, Bihar), <b>Khe<\/b>da (revenue, Gujarat), <b>Ahm<\/b>edabad (mill wages). First satyagraha = Champaran; first hunger strike = Ahmedabad.<br><b>Why movements ended<\/b>: Non-Cooperation → <b>Chauri Chaura<\/b>; Civil Disobedience → <b>Gandhi-Irwin Pact<\/b>; Quit India → arrests."},{"k":"table","title":"Three Round Table Conferences (London)","head":["RTC","Date","Congress","Note"],"rows":[["First","Nov 1930 – Jan 1931","<b>Boycotted<\/b>","Ambedkar and the Princes attended"],["Second","Sept – Dec 1931","<b>Gandhi attended<\/b> — the only one","As the sole Congress representative, after the Gandhi-Irwin Pact; deadlocked on minorities"],["Third","Nov – Dec 1932","Boycotted","Led to the White Paper and the <b>Act of 1935<\/b>"]]},{"k":"facts","title":"Gandhi — names, papers, ideas","rows":[["Full name","Mohandas Karamchand Gandhi; born <b>2 Oct 1869, Porbandar<\/b>; died <b>30 Jan 1948<\/b> (Nathuram Godse)"],["Titles","\"<b>Mahatma<\/b>\" from <b>Rabindranath Tagore<\/b>; \"<b>Father of the Nation<\/b>\" from <b>Subhas Chandra Bose<\/b>; \"<b>half-naked fakir<\/b>\" from Churchill"],["Papers","<b><i>Young India<\/i><\/b> (English), <b><i>Harijan<\/i><\/b>, <i>Navajivan<\/i> (Gujarati), <i>Indian Opinion<\/i> (South Africa)"],["Books","<b><i>My Experiments with Truth<\/i><\/b> (autobiography), <i>Hind Swaraj<\/i> (1909)"],["Political guru","<b>Gopal Krishna Gokhale<\/b>"],["First Congress session he presided","<b>Belgaum, 1924<\/b> — the only one"],["Ashrams","Phoenix &amp; Tolstoy Farm (South Africa), Kochrab &amp; Sabarmati (Ahmedabad), <b>Sevagram/Wardha<\/b> (1936)"]]},{"k":"trap","h":"The Dandi March began <b>12 March 1930<\/b> and the salt law was broken on <b>6 April 1930<\/b> — two different dates. Gandhi attended <b>only the Second<\/b> Round Table Conference. He presided over <b>only one<\/b> Congress session, at <b>Belgaum in 1924<\/b>. The <b>Nagpur session (1920)<\/b> approved Non-Cooperation; the <b>Calcutta special session (Sept 1920)<\/b> first adopted it."}],"sum":["Champaran 1917 (indigo, first satyagraha in India) → Ahmedabad mill strike & Kheda 1918 → Rowlatt + Jallianwala Bagh 13 April 1919.","Non-Cooperation 1920–22, approved at Nagpur, withdrawn after Chauri Chaura (5 Feb 1922). Swaraj Party 1923 (C. R. Das & Motilal Nehru).","Simon Commission 1928 ('Go back Simon'); Nehru Report & Bardoli 1928; Lahore session 1929 — Purna Swaraj, 26 Jan 1930 first Independence Day.","Dandi March 12 March – 6 April 1930, 385 km, 78 followers. Gandhi-Irwin Pact 5 March 1931. Communal Award 1932 → Poona Pact 24 Sept 1932.","Gandhi attended only the Second RTC and presided over only one Congress session (Belgaum, 1924). 'Mahatma' from Tagore; 'Father of the Nation' from Subhas Chandra Bose."],"part":["The freedom struggle","स्वतंत्रता संग्राम"]},
{"id":"L32","g":"mod","heat":2,"title":"Women & lesser-known heroes of the freedom struggle","hi":"स्वतंत्रता संग्राम की महिलाएँ एवं गुमनाम नायक","blocks":[{"k":"hot","h":"SSC now asks about <b>lesser-known heroes<\/b> — 'Kanaklata Barua belonged to which state?', 'who led the Rampa rebellion?', 'who founded the Swadeshi Steam Navigation Company?'. Match each <b>name to a place and one deed<\/b>."},{"k":"story","h":"<p>History books often remember a few big names, but the freedom struggle was fought in every corner of India — by queens, poets, students and tribal chiefs. Long before 1857, <b>Rani Velu Nachiyar<\/b> of Sivaganga won back her kingdom from the Company in 1780 with Hyder Ali's help, and <b>Rani Chennamma<\/b> of Kittur took up the sword in 1824 when the British refused to accept her adopted son.<\/p><p>In the hills, the Company's roads, taxes and forest rules angered tribes who had lived freely for centuries. <b>Tirot Sing<\/b> of the Khasis, <b>Tilka Manjhi<\/b> near Bhagalpur and <b>Alluri Sitarama Raju<\/b> in the Rampa hills fought back with bows and guns. Most were captured or killed, but their courage lived on in local songs.<\/p><p>Under Gandhi, women came out in thousands. <b>Usha Mehta<\/b> ran a secret radio in 1942; <b>Matangini Hazra<\/b>, aged 73, and <b>Kanaklata Barua<\/b>, just 17, were shot while carrying the tricolour. In the south, <b>V. O. Chidambaram Pillai<\/b> even started an Indian shipping company to break the British hold on the sea trade. Their stories show that freedom was won by ordinary people as much as by famous leaders.<\/p>"},{"k":"table","title":"Women of the struggle","head":["Name","Region","Remember her for"],"rows":[["<b>Rani Velu Nachiyar<\/b>","<b>Sivaganga<\/b> (Tamil Nadu)","Fought the Company and regained her kingdom in <b>1780<\/b> with <b>Hyder Ali<\/b>'s help; called 'Veeramangai'"],["<b>Kittur Rani Chennamma<\/b>","<b>Kittur<\/b> (Karnataka)","Revolt of <b>1824<\/b> when the British refused to recognise her adopted son; the collector Thackeray was killed; died in captivity (1829); ally <b>Sangolli Rayanna<\/b>"],["<b>Rani Avantibai<\/b>","<b>Ramgarh<\/b> (Madhya Pradesh)","Fought in <b>1857<\/b>; took her own life in 1858 rather than surrender"],["<b>Jhalkari Bai<\/b>","<b>Jhansi<\/b>","In Rani Lakshmibai's women's army; dressed as the Rani to mislead the British (1857–58)"],["<b>Bhikaji Cama<\/b>","Bombay → Paris","Unfurled an Indian flag at the International Socialist Congress, <b>Stuttgart (Germany), 22 Aug 1907<\/b>"],["<b>Sarojini Naidu<\/b>","Hyderabad","'<b>Nightingale of India<\/b>'; led the <b>Dharasana<\/b> salt raid (1930); <b>first woman Governor<\/b> (United Provinces, 1947); her birthday, 13 Feb, is National Women's Day"],["<b>Kasturba Gandhi<\/b>","Gujarat","Died in detention at the <b>Aga Khan Palace, Pune<\/b>, 22 Feb 1944"],["<b>Aruna Asaf Ali<\/b>","Delhi / Bombay","Hoisted the flag at Gowalia Tank, 9 Aug 1942; <b>first Mayor of Delhi (1958)<\/b>"],["<b>Usha Mehta<\/b>","Bombay","Ran the secret <b>Congress Radio<\/b> during Quit India (1942)"],["<b>Matangini Hazra<\/b>","<b>Tamluk<\/b>, Midnapore (Bengal)","'<b>Gandhi Buri<\/b>'; shot at 73 leading a march on the Tamluk police station, <b>Sept 1942<\/b>"],["<b>Kanaklata Barua<\/b>","<b>Gohpur<\/b> (Assam)","Shot at 17 while trying to hoist the flag at the Gohpur police station, <b>Sept 1942<\/b>"],["<b>Sucheta Kripalani<\/b>","Uttar Pradesh","Founded the All India Mahila Congress (1940); <b>India's first woman Chief Minister<\/b> (UP, 1963)"],["<b>Kamaladevi Chattopadhyay<\/b>","Mangalore (Karnataka)","<b>First Indian woman to contest a legislative election<\/b> (Madras, 1926); revived handicrafts after 1947"],["<b>Pritilata Waddedar<\/b>","Chittagong","Led the attack on the <b>Pahartali European Club<\/b> (1932); took poison to avoid arrest"],["<b>Kalpana Dutta<\/b>","Chittagong","Comrade of Surya Sen in the Chittagong group; sentenced to transportation for life"],["<b>Bina Das<\/b>","Calcutta","Fired at Bengal Governor <b>Stanley Jackson<\/b> at the Calcutta University convocation (1932)"],["<b>Rani Gaidinliu<\/b>","Manipur / Naga hills","<b>Zeliangrong Naga<\/b> leader; jailed at 16 in 1932 and freed only in 1947; Nehru called her 'Rani'"]]},{"k":"mapfig","title":"Women of the struggle","pins":[["1",78.53,9.85,"Rani Velu Nachiyar","n"],["2",74.8,15.6,"Kittur Rani Chennamma","n"],["3",80.7,23,"Rani Avantibai","n"],["4",78.57,25.45,"Jhalkari Bai","n"],["5",72.84,18.94,"Bhikaji Cama","n"],["6",78.49,17.39,"Sarojini Naidu","n"],["7",69.6,21.64,"Kasturba Gandhi","n"],["8",77.21,28.61,"Aruna Asaf Ali","n"],["9",72.9,19.1,"Usha Mehta","n"],["10",87.92,22.28,"Matangini Hazra","n"],["11",93.4,26.75,"Kanaklata Barua","n"],["12",80.95,26.85,"Sucheta Kripalani","n"],["13",74.86,12.91,"Kamaladevi Chattopadhyay","n"],["14",91.83,22.36,"Pritilata Waddedar","n"],["15",91.9,22.45,"Kalpana Dutta","n"],["16",88.36,22.57,"Bina Das","n"],["17",93.94,25,"Rani Gaidinliu","n"]],"facts":[["1 · Rani Velu Nachiyar","Sivaganga (Tamil Nadu) — Fought the Company and regained her kingdom in 1780 with Hyder Ali's help"],["2 · Kittur Rani Chennamma","Kittur (Karnataka) — Revolt of 1824 when the British refused to recognise her adopted son"],["3 · Rani Avantibai","Ramgarh (Madhya Pradesh) — Fought in 1857"],["4 · Jhalkari Bai","Jhansi — In Rani Lakshmibai's women's army"],["5 · Bhikaji Cama","Bombay → Paris — Unfurled an Indian flag at the International Socialist Congress, Stuttgart (Germany), 22 Aug 1907"],["6 · Sarojini Naidu","Hyderabad — 'Nightingale of India'"],["7 · Kasturba Gandhi","Gujarat — Died in detention at the Aga Khan Palace, Pune, 22 Feb 1944"],["8 · Aruna Asaf Ali","Delhi / Bombay — Hoisted the flag at Gowalia Tank, 9 Aug 1942"],["9 · Usha Mehta","Bombay — Ran the secret Congress Radio during Quit India (1942)"],["10 · Matangini Hazra","Tamluk, Midnapore (Bengal) — 'Gandhi Buri'"],["11 · Kanaklata Barua","Gohpur (Assam) — Shot at 17 while trying to hoist the flag at the Gohpur police station, Sept 1942"],["12 · Sucheta Kripalani","Uttar Pradesh — Founded the All India Mahila Congress (1940)"],["13 · Kamaladevi Chattopadhyay","Mangalore (Karnataka) — First Indian woman to contest a legislative election (Madras, 1926)"],["14 · Pritilata Waddedar","Chittagong — Led the attack on the Pahartali European Club (1932)"],["15 · Kalpana Dutta","Chittagong — Comrade of Surya Sen in the Chittagong group"],["16 · Bina Das","Calcutta — Fired at Bengal Governor Stanley Jackson at the Calcutta University convocation (1932)"],["17 · Rani Gaidinliu","Manipur / Naga hills — Zeliangrong Naga leader"]],"cap":"Chittagong (Pritilata, Kalpana Dutta) is now in Bangladesh. Bhikaji Cama unfurled an Indian flag at Stuttgart in 1907."},{"k":"photos","title":"Women of the struggle in pictures","items":[["Velu_Nachiyar","Velu Nachiyar","Sivaganga"],["Kittur_Chennamma","Kittur Chennamma","Kittur"],["Bhikaji_Cama","Bhikaji Cama","Stuttgart, 1907"],["Sarojini_Naidu","Sarojini Naidu","Nightingale of India"],["Aruna_Asaf_Ali","Aruna Asaf Ali","Quit India, 1942"],["Matangini_Hazra","Matangini Hazra","Tamluk"],["Kanaklata_Barua","Kanaklata Barua","Gohpur"],["Rani_Gaidinliu","Rani Gaidinliu","Naga hills"],["Pritilata_Waddedar","Pritilata Waddedar","Chittagong"]]},{"k":"table","title":"Tribal and regional heroes","head":["Hero","Area","What they did"],"rows":[["<b>Tilka Manjhi<\/b>","Bhagalpur region (Bihar / Jharkhand)","Led an early Adivasi revolt in the 1780s; tradition says he shot Collector <b>Augustus Cleveland<\/b>; hanged at Bhagalpur"],["<b>Tirot Sing<\/b>","<b>Khasi hills<\/b> (Meghalaya)","Chief of Nongkhlaw; <b>Anglo-Khasi war, 1829–33<\/b>, against a British road through his land; died in Dhaka jail (1835)"],["<b>U Kiang Nongbah<\/b>","<b>Jaintia hills<\/b> (Meghalaya)","Led the Jaintia rising of <b>1860–62<\/b>; hanged at <b>Jowai<\/b>, 1862"],["<b>Veer Narayan Singh<\/b>","<b>Sonakhan<\/b> (Chhattisgarh)","Gave hoarded grain to the starving in the 1856 famine; joined 1857; hanged at Raipur — <b>Chhattisgarh's first martyr of 1857<\/b>"],["<b>Alluri Sitarama Raju<\/b>","<b>Rampa<\/b>, Godavari agency (Andhra)","<b>Rampa rebellion, 1922–24<\/b>, against forest laws; killed in 1924"],["<b>V. O. Chidambaram Pillai<\/b>","<b>Tuticorin<\/b> (Tamil Nadu)","<b>Swadeshi Steam Navigation Company (1906)<\/b>; '<b>Kappalottiya Tamizhan<\/b>' (the Tamil helmsman); given two life sentences (1908)"],["<b>Subramania Bharati<\/b>","Tamil Nadu","Patriotic poet, '<b>Mahakavi<\/b>'; edited the weekly <i>India<\/i>; escaped to French <b>Pondicherry<\/b> (1908)"],["<b>Vanchinathan<\/b>","Tirunelveli (Tamil Nadu)","Shot Collector <b>Robert Ashe<\/b> at <b>Maniyachi<\/b> station (17 June 1911), then shot himself"],["<b>Tirupur Kumaran<\/b>","Tirupur (Tamil Nadu)","Beaten to death in 1932 while holding the national flag — '<b>Kodi Kaatha Kumaran<\/b>' (Kumaran who saved the flag)"]]},{"k":"mapfig","title":"Tribal and regional heroes","pins":[["1",87,25.24,"Tilka Manjhi","n"],["2",91.6,25.5,"Tirot Sing","n"],["3",92.2,25.45,"U Kiang Nongbah","n"],["4",82.5,21.5,"Veer Narayan Singh","n"],["5",81.8,17.6,"Alluri Sitarama Raju","n"],["6",78.13,8.79,"V. O. Chidambaram Pillai","n"],["7",77.7,9.1,"Subramania Bharati","n"],["8",77.7,8.73,"Vanchinathan","n"],["9",77.34,11.11,"Tirupur Kumaran","n"]],"facts":[["1 · Tilka Manjhi","Bhagalpur region (Bihar / Jharkhand)"],["2 · Tirot Sing","Khasi hills (Meghalaya)"],["3 · U Kiang Nongbah","Jaintia hills (Meghalaya)"],["4 · Veer Narayan Singh","Sonakhan (Chhattisgarh)"],["5 · Alluri Sitarama Raju","Rampa, Godavari agency (Andhra)"],["6 · V. O. Chidambaram Pillai","Tuticorin (Tamil Nadu)"],["7 · Subramania Bharati","Tamil Nadu"],["8 · Vanchinathan","Tirunelveli (Tamil Nadu)"],["9 · Tirupur Kumaran","Tirupur (Tamil Nadu)"]],"cap":"Numbers match the list. Places are approximate. Use ＋ or ⛶ to zoom in."},{"k":"facts","title":"Khilafat leaders","rows":[["Why the movement","After the First World War the Turkish Sultan, the <b>Khalifa<\/b> of Sunni Muslims, lost his power; Indian Muslims protested and <b>Gandhi joined<\/b> them (1919–24)"],["Khilafat Day","<b>17 October 1919<\/b>"],["<b>Ali brothers<\/b>","<b>Mohammad Ali (Jauhar)<\/b> and <b>Shaukat Ali<\/b> — the main Khilafat leaders; Mohammad Ali presided over the Congress at <b>Kakinada (1923)<\/b>"],["<b>Hakim Ajmal Khan<\/b>","Presided over the <b>Ahmedabad<\/b> Congress (1921); a founder of <b>Jamia Millia Islamia<\/b> (1920)"],["<b>M. A. Ansari<\/b>","Presided over the <b>Madras<\/b> Congress (1927); led a medical mission to Turkey (1912); later Chancellor of Jamia"],["End","Lost its purpose when <b>Mustafa Kemal Ataturk<\/b> abolished the Caliphate in 1924"]]},{"k":"trick","h":"<b>Two women martyrs of 1942<\/b> — <span class=\"mn\">MM–KA<\/span>: <b>M<\/b>atangini – <b>M<\/b>idnapore (Tamluk); <b>K<\/b>anaklata – <b>A<\/b>ssam (Gohpur).<br><b>Meghalaya's two chiefs<\/b> — <span class=\"mn\">T-K, K-J<\/span>: <b>T<\/b>irot – <b>K<\/b>hasi; <b>K<\/b>iang – <b>J<\/b>aintia.<br><b>V.O.C.<\/b> = '<span class=\"mn\">Very Own Company<\/span>' — he founded an Indian shipping company."},{"k":"trap","h":"<b>Aruna Asaf Ali hoisted the flag; Usha Mehta ran the radio<\/b>. <b>Sucheta Kripalani = first woman Chief Minister<\/b>; <b>Sarojini Naidu = first woman Governor<\/b>. <b>Kittur Chennamma (1824)<\/b> fought 33 years before 1857 — do not put her in the 1857 list; <b>Avantibai and Jhalkari Bai<\/b> belong to 1857. <b>Tirot Sing<\/b> (Khasi, 1829–33) and <b>U Kiang Nongbah<\/b> (Jaintia, 1860–62) are both from Meghalaya but from different hills and decades. <b>Alluri Sitarama Raju<\/b> led Rampa; <b>Birsa Munda<\/b> led the Munda Ulgulan."}],"sum":["Before 1857: Rani Velu Nachiyar of Sivaganga regained her kingdom in 1780 with Hyder Ali's help; Kittur Rani Chennamma revolted in 1824. In 1857: Rani Avantibai of Ramgarh and Jhalkari Bai of Jhansi.","Bhikaji Cama flew an Indian flag at Stuttgart in 1907; Sarojini Naidu was the first woman Governor; Sucheta Kripalani the first woman Chief Minister; Kasturba died at the Aga Khan Palace in 1944.","Quit India 1942: Aruna Asaf Ali hoisted the flag, Usha Mehta ran Congress Radio, Matangini Hazra was shot at Tamluk and Kanaklata Barua at Gohpur, Assam.","Tribal heroes: Tilka Manjhi (Bhagalpur), Tirot Sing (Khasi, 1829-33), U Kiang Nongbah (Jaintia, 1862), Veer Narayan Singh (Chhattisgarh, 1857), Alluri Sitarama Raju (Rampa, 1922-24), Rani Gaidinliu (Naga).","South: V. O. Chidambaram Pillai founded the Swadeshi Steam Navigation Company in 1906; Vanchinathan shot Collector Ashe in 1911. Khilafat: the Ali brothers, Hakim Ajmal Khan and M. A. Ansari."],"part":["The freedom struggle","स्वतंत्रता संग्राम"]},
{"id":"L24","g":"mod","heat":3,"title":"Revolutionaries, INA & Independence","hi":"क्रांतिकारी · आज़ाद हिंद फौज · स्वतंत्रता","blocks":[{"k":"hot","h":"Bhagat Singh, Azad, the Kakori and Lahore conspiracy cases, Bose and the INA, Quit India, and the 1946–47 plans — expect at least one, often two."},{"k":"story","h":"<p>Not everyone believed peaceful protest alone would win freedom. From the early 1900s young <b>revolutionaries<\/b> chose bombs and guns. In Bengal, groups like the Anushilan Samiti formed, and <b>Khudiram Bose<\/b> was hanged at 18. Abroad, Indians formed the Ghadar Party in San Francisco. In 1925 Ramprasad Bismil's group robbed a train at Kakori. Then <b>Bhagat Singh<\/b>, Chandra Shekhar Azad and their comrades shot the officer Saunders to avenge Lala Lajpat Rai, and threw bombs in the Assembly to be heard. Bhagat Singh, Sukhdev and Rajguru were hanged in 1931.<\/p><p>During the Second World War, Britain wanted India's help but would not promise freedom. Gandhi answered with <b>Quit India<\/b> on 8 August 1942: Do or Die. Leaders were jailed at once, but people set up parallel governments in places like Ballia and Satara. Abroad, <b>Subhas Chandra Bose<\/b> led the Indian National Army to fight the British.<\/p><p>After the war, the INA trials and the navy mutiny of 1946 showed Britain it could no longer rely on Indian soldiers. Plans like the Cabinet Mission failed to keep India united, and violence grew. Finally the Mountbatten Plan divided the country, and India became free on 15 August 1947.<\/p>","key":"Revolutionaries, Quit India and Bose's INA together shook British rule, and after the war Britain left, dividing the country in 1947."},{"k":"facts","title":"Revolutionary movement","rows":[["<b>Anushilan Samiti<\/b> (1902) &amp; <b>Yugantar<\/b>","Bengal — Barindra Kumar Ghosh, Bhupendranath Datta, Pulin Behari Das"],["<b>Abhinav Bharat<\/b> (1904)","<b>V. D. Savarkar<\/b>, Nasik; book <i>The Indian War of Independence 1857<\/i>"],["<b>Muzaffarpur bomb<\/b> (1908)","<b>Khudiram Bose<\/b> &amp; <b>Prafulla Chaki<\/b> — targeted Kingsford, killed the Kennedys. Khudiram hanged at 18"],["<b>Alipore Conspiracy Case<\/b> (1908)","Aurobindo Ghosh, Barindra Ghosh; Chittaranjan Das defended Aurobindo"],["<b>Delhi Conspiracy<\/b> (1912)","Rash Behari Bose &amp; Sachindra Nath Sanyal — bomb on Hardinge II"],["<b>Ghadar Party<\/b> (1913, San Francisco)","Lala Hardayal, Sohan Singh Bhakna, Kartar Singh Sarabha; paper <i>Ghadar<\/i>; <b>Komagata Maru<\/b> incident (1914)"],["<b>Berlin Committee<\/b> (1915)","Virendranath Chattopadhyay; <b>Provisional Government of India at Kabul (1915)<\/b> — Raja Mahendra Pratap"],["<b>Hindustan Republican Association<\/b> (1924, Kanpur)","Sachindra Nath Sanyal, Ramprasad Bismil, Jogesh Chatterjee"],["<b>Kakori Conspiracy<\/b> (9 Aug 1925)","Train robbery; <b>Ramprasad Bismil, Ashfaqullah Khan, Roshan Singh, Rajendra Lahiri hanged<\/b>"],["<b>HSRA<\/b> (1928, Feroz Shah Kotla)","Renamed <b>Hindustan Socialist Republican Association<\/b> — <b>Chandra Shekhar Azad<\/b>, <b>Bhagat Singh<\/b>, Sukhdev, Rajguru, Bhagwati Charan Vohra"],["<b>Saunders killed<\/b> (17 Dec 1928)","Bhagat Singh, Rajguru, Azad — revenge for Lala Lajpat Rai"],["<b>Assembly bomb<\/b> (8 April 1929)","<b>Bhagat Singh &amp; Batukeshwar Dutt<\/b> threw bombs in the Central Legislative Assembly — \"to make the deaf hear\""],["<b>Lahore Conspiracy Case<\/b>","<b>Bhagat Singh, Sukhdev &amp; Rajguru hanged at Lahore on 23 March 1931<\/b> — now <b>Shaheed Diwas<\/b>. Jatin Das died after a 63-day hunger strike (1929)"],["<b>Chandra Shekhar Azad<\/b>","Died fighting at <b>Alfred Park, Allahabad, 27 Feb 1931<\/b>"],["<b>Chittagong Armoury Raid<\/b> (1930)","<b>Surya Sen \"Masterda\"<\/b>, with Kalpana Dutta &amp; Pritilata Waddedar"],["<b>Bina Das<\/b> / <b>Shanti Ghosh &amp; Suniti Chaudhary<\/b>","Fired at the Bengal Governor (1932) / killed the Comilla magistrate (1931)"],["Books/slogans","<b>\"Inquilab Zindabad\"<\/b> — Bhagat Singh (coined by Hasrat Mohani); <i>Why I am an Atheist<\/i> — Bhagat Singh; <b>\"Sarfaroshi ki tamanna\"<\/b> — Bismil Azimabadi, made famous by Ramprasad Bismil"]]},{"k":"mapfig","title":"Revolutionaries on the map","pins":[["1",85.39,26.12,"Muzaffarpur","n"],["2",88.33,22.53,"Alipore","n"],["3",80.79,26.87,"Kakori","n"],["4",74.35,31.55,"Lahore","n"],["5",77.21,28.61,"Delhi","n"],["6",81.85,25.44,"Allahabad","n"],["7",91.83,22.36,"Chittagong","n"],["8",73.79,20,"Nasik","n"],["9",92.73,11.62,"Port Blair","n"]],"facts":[["1 · Muzaffarpur","1908 — Khudiram Bose"],["2 · Alipore","1908 — conspiracy case"],["3 · Kakori","1925 — train robbery"],["4 · Lahore","1928–31 — Saunders; Bhagat Singh hanged"],["5 · Delhi","1929 — Assembly bomb"],["6 · Allahabad","1931 — Azad at Alfred Park"],["7 · Chittagong","1930 — armoury raid, Surya Sen"],["8 · Nasik","1904 — Abhinav Bharat"],["9 · Port Blair","Cellular Jail — Kala Pani"]],"cap":"Numbers match the list. Places are approximate. Use ＋ or ⛶ to zoom in."},{"k":"photos","title":"Revolutionaries in pictures","items":[["Bhagat_Singh","Bhagat Singh","Hanged 23 March 1931"],["Chandra_Shekhar_Azad","Chandra Shekhar Azad","HSRA"],["Ram_Prasad_Bismil","Ram Prasad Bismil","Kakori"],["Ashfaqulla_Khan","Ashfaqulla Khan","Kakori"],["Khudiram_Bose","Khudiram Bose","Muzaffarpur"],["Surya_Sen","Surya Sen","Chittagong"],["Cellular_Jail","Cellular Jail","Port Blair"]]},{"k":"trick","h":"<b>Four hanged in Kakori<\/b> — <span class=\"mn\">BARR<\/span>: <b>B<\/b>ismil, <b>A<\/b>shfaqullah, <b>R<\/b>oshan Singh, <b>R<\/b>ajendra Lahiri.<br><b>Three hanged in Lahore<\/b> — <span class=\"mn\">B-S-R<\/span>: <b>B<\/b>hagat Singh, <b>S<\/b>ukhdev, <b>R<\/b>ajguru, on <b>23 March 1931<\/b>."},{"k":"facts","title":"Subhas Chandra Bose & the INA","rows":[["Early career","Resigned from the ICS (1921); Congress President at <b>Haripura (1938)<\/b> &amp; <b>Tripuri (1939)<\/b>; resigned and founded the <b>Forward Bloc (1939)<\/b>"],["Escape","Escaped from house arrest in Jan 1941 to Germany via Kabul as \"Ziauddin\"; ran <b>Azad Hind Radio<\/b> from Berlin — where he was first called \"<b>Netaji<\/b>\""],["<b>INA / Azad Hind Fauj<\/b>","First raised by <b>Mohan Singh<\/b> (1942) with <b>Rash Behari Bose<\/b>'s Indian Independence League; Bose took command at <b>Singapore, 4 July 1943<\/b> — \"<b>Give me blood and I will give you freedom<\/b>\""],["<b>Azad Hind Government<\/b>","Proclaimed at Singapore, <b>21 October 1943<\/b>; took Andaman &amp; Nicobar (renamed <b>Shahid<\/b> &amp; <b>Swaraj<\/b> islands), Dec 1943"],["Brigades","Gandhi, Nehru, Azad and <b>Rani Jhansi<\/b> (women's regiment under <b>Capt. Lakshmi Sahgal<\/b>) brigades; slogans <b>\"Jai Hind\"<\/b> and \"Chalo Delhi\""],["End","Died in an air crash at <b>Taihoku (Taipei), 18 August 1945<\/b> (officially); <b>INA trials<\/b> at the Red Fort (1945–46), defended by Bhulabhai Desai, Nehru, Asaf Ali, Tej Bahadur Sapru"],["<b>RIN Mutiny<\/b>","<b>18 February 1946<\/b> — Royal Indian Navy ratings at Bombay; the last big shock to British confidence"]]},{"k":"mapfig","title":"The INA reaches India","pins":[["Moirang",93.77,24.5,"INA flag, 14 April 1944"],["Imphal",93.94,24.82,"1944 campaign","l"],["Kohima",94.11,25.67,"1944"],["Port Blair",92.73,11.62,"Bose hoists the tricolour, 30 Dec 1943"]],"under":"<defs><marker id=\"ahvryob6\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"#c0392b\"/><\/marker><\/defs><path d=\"M522.9,308L500.7,278L484,260\" fill=\"none\" stroke=\"#c0392b\" stroke-width=\"4\" stroke-linecap=\"round\" opacity=\".75\" marker-end=\"url(#ahvryob6)\" style=\"vector-effect:non-scaling-stroke\"/><path d=\"M522.9,308L500.7,278L484,260\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.4\" stroke-dasharray=\"2 8\" class=\"rvf\" style=\"animation:rvflow 1.2s linear infinite;vector-effect:non-scaling-stroke\"/><text x=\"493.3\" y=\"316\" font-size=\"12\" font-weight=\"700\" style=\"fill:#c0392b;paint-order:stroke;stroke:var(--sheet);stroke-width:3px\">from Burma<\/text>","cap":"The INA marched with the Japanese army from Burma towards Imphal and Kohima in 1944; Bose's Azad Hind government named the Andamans 'Shaheed' and Nicobar 'Swaraj'."},{"k":"photos","title":"Netaji and the INA","items":[["Subhas_Chandra_Bose","Subhas Chandra Bose","Netaji"],["Indian_National_Army","Indian National Army","Azad Hind Fauj"],["Rash_Behari_Bose","Rash Behari Bose","Handed over the INA"],["Lakshmi_Sahgal","Lakshmi Sahgal","Rani of Jhansi Regiment"]]},{"k":"tl","title":"Quit India to Independence","rows":[["<b>Aug 1940<\/b>","<b>August Offer<\/b> — dominion status after the war; rejected"],["<b>Oct 1940<\/b>","Individual Satyagraha — <b>Vinoba Bhave<\/b> the first satyagrahi, <b>Nehru<\/b> the second"],["<b>Mar 1942<\/b>","<b>Cripps Mission<\/b> — dominion status and the right of provinces to opt out; rejected. Gandhi called it \"a post-dated cheque\""],["<b>8 Aug 1942<\/b>","<b>Quit India Resolution<\/b> at Gowalia Tank, Bombay — \"<b>Do or Die<\/b>\"; leaders arrested on 9 Aug (<b>August Kranti<\/b>); parallel governments at <b>Ballia (Chittu Pandey)<\/b>, <b>Tamluk/Midnapore (Jatiya Sarkar)<\/b> and <b>Satara (Prati Sarkar, Y. B. Chavan &amp; Nana Patil)<\/b>; Aruna Asaf Ali hoisted the flag; Usha Mehta ran the Congress Radio"],["<b>1944<\/b>","<b>C. R. Formula<\/b> (Rajagopalachari) and the Gandhi-Jinnah talks fail"],["<b>1945<\/b>","<b>Wavell Plan<\/b> &amp; the <b>Simla Conference<\/b> — failed over the League's claim to name all Muslim members"],["<b>Mar 1946<\/b>","<b>Cabinet Mission<\/b> — <b>Pethick-Lawrence, Stafford Cripps, A. V. Alexander<\/b>; proposed a three-tier federation and a Constituent Assembly; rejected Pakistan"],["<b>16 Aug 1946<\/b>","<b>Direct Action Day<\/b> — the League's call; Calcutta killings"],["<b>2 Sept 1946<\/b>","<b>Interim Government<\/b> under <b>Nehru<\/b>; League joined in October"],["<b>9 Dec 1946<\/b>","<b>Constituent Assembly<\/b> first meets; Sachchidananda Sinha temporary chairman, <b>Rajendra Prasad<\/b> elected President on 11 Dec"],["<b>20 Feb 1947<\/b>","<b>Attlee's declaration<\/b> — British withdrawal by June 1948"],["<b>3 June 1947<\/b>","<b>Mountbatten Plan<\/b> — partition; date advanced to <b>15 August 1947<\/b>"],["<b>18 July 1947<\/b>","<b>Indian Independence Act<\/b> passed; <b>Radcliffe Commission<\/b> drew the boundary"],["<b>14–15 Aug 1947<\/b>","Independence; Nehru's \"Tryst with Destiny\"; Gandhi was in <b>Noakhali<\/b>, not Delhi"]]},{"k":"trick","h":"<b>Cabinet Mission's three members<\/b> — <span class=\"mn\">PCA<\/span>: <b>P<\/b>ethick-Lawrence, <b>C<\/b>ripps, <b>A<\/b>lexander.<br><b>Parallel governments in Quit India<\/b> — <span class=\"mn\">BTS<\/span>: <b>B<\/b>allia, <b>T<\/b>amluk, <b>S<\/b>atara."},{"k":"trap","h":"<b>Bhagat Singh was hanged for the Saunders murder (Lahore Conspiracy Case), not the Assembly bombing<\/b> — for the Assembly bombing he was given life. <b>Quit India began 8 August 1942<\/b> (resolution) with arrests on <b>9 August<\/b>. The <b>Cripps Mission (1942)<\/b> and the <b>Cabinet Mission (1946)<\/b> are different — Cripps was in both."}],"sum":["Kakori 1925 — Bismil, Ashfaqullah, Roshan Singh, Rajendra Lahiri hanged. HSRA 1928. Saunders killed Dec 1928; Assembly bomb 8 April 1929; Bhagat Singh, Sukhdev, Rajguru hanged 23 March 1931. Azad died at Alfred Park, 27 Feb 1931.","Chittagong Armoury Raid 1930 — Surya Sen. Ghadar Party 1913 San Francisco. Abhinav Bharat 1904 — Savarkar.","INA first raised by Mohan Singh; Bose took command at Singapore 4 July 1943; Azad Hind Government 21 Oct 1943; Rani Jhansi regiment under Capt. Lakshmi Sahgal; Bose died at Taihoku, 18 Aug 1945. RIN Mutiny 18 Feb 1946.","August Offer 1940 → Cripps Mission 1942 → Quit India 8 Aug 1942 ('Do or Die') with parallel governments at Ballia, Tamluk, Satara → Wavell Plan 1945 → Cabinet Mission 1946 (Pethick-Lawrence, Cripps, Alexander) → Direct Action Day 16 Aug 1946.","Constituent Assembly first met 9 Dec 1946; Mountbatten Plan 3 June 1947; Indian Independence Act 18 July 1947; freedom 15 Aug 1947; Radcliffe drew the boundary."],"part":["The freedom struggle","स्वतंत्रता संग्राम"]},
{"id":"L25","g":"mod","heat":2,"title":"Constitutional development & economic policy","hi":"संवैधानिक विकास · आर्थिक नीति","blocks":[{"k":"hot","h":"The Acts from 1773 to 1947 — \"which Act introduced X\" is a standing question. Add the three land revenue settlements and the Drain Theory."},{"k":"story","h":"<p>The British ruled India through a chain of laws passed in London. Each Act gave the government a little more shape and, slowly, gave Indians a little more space. First Parliament reined in the Company: the <b>Regulating Act<\/b> of 1773 created a Governor-General of Bengal, and the 1833 Act made him Governor-General of India. After 1857, the <b>1858 Act<\/b> handed India to the Crown. Then Indians were let in step by step: nominated members (1861), indirect elections (1892), separate electorates (1909), dyarchy (shared power) in the provinces (1919), and provincial autonomy under the <b>1935 Act<\/b>, the main source of India's Constitution.<\/p><p>The other half of this lesson is money. To collect land tax, the British used three systems. In Bengal, Cornwallis's <b>Permanent Settlement<\/b> fixed the tax forever and made zamindars the owners. In Madras and Bombay, the Ryotwari system dealt directly with the farmer. In the north-west, the Mahalwari system dealt with the whole village. Heavy taxes, forced cash crops like indigo and the ruin of handicrafts made people poor; Naoroji called this the drain of wealth. Peasants and tribal people rose again and again, from the Santhals to Birsa Munda's Ulgulan. The tables give each Act and each settlement.<\/p>","key":"British Acts slowly gave Indians a share in government, while British land revenue systems and the drain of wealth made peasants poorer."},{"k":"table","title":"Acts 1773–1947 — one feature each","head":["Act","Year","The one thing it introduced"],"rows":[["<b>Regulating Act<\/b>","1773","First British interference; <b>Governor-General of Bengal<\/b> (Warren Hastings); Supreme Court at Calcutta (1774)"],["Pitt's India Act","1784","<b>Board of Control<\/b> — dual government of the Company and the Crown"],["Charter Act","1793","Company's monopoly extended 20 years; Governor-General given power over the presidencies"],["<b>Charter Act<\/b>","1813","Ended the Company's monopoly except in tea &amp; China; <b>₹1 lakh for education<\/b>; allowed missionaries"],["<b>Charter Act<\/b>","1833","<b>Governor-General of India<\/b> (Bentinck); Company becomes a purely administrative body; <b>Law Member (Macaulay)<\/b> added; Law Commission"],["<b>Charter Act<\/b>","1853","First to separate legislative and executive functions; introduced <b>open competition<\/b> for the civil services (Macaulay Committee)"],["<b>Government of India Act<\/b>","<b>1858<\/b>","Crown rule; <b>Secretary of State for India<\/b>; Viceroy; \"Act for the Good Government of India\""],["<b>Indian Councils Act<\/b>","1861","<b>Portfolio system<\/b>; Indians nominated to the legislative council for the first time; ordinance power"],["Indian Councils Act","1892","Indirect <b>elections<\/b> introduced (nomination by recommendation); budget discussion allowed"],["<b>Morley-Minto / Indian Councils Act<\/b>","<b>1909<\/b>","<b>Separate electorates<\/b> for Muslims; <b>Satyendra Prasad Sinha<\/b> became the first Indian in the Viceroy's Executive Council"],["<b>Montagu-Chelmsford / GoI Act<\/b>","<b>1919<\/b>","<b>Dyarchy<\/b> in the provinces (transferred and reserved subjects); <b>bicameral<\/b> central legislature; separation of central and provincial budgets; a <b>Public Service Commission (1926)<\/b>; franchise widened"],["<b>Government of India Act<\/b>","<b>1935<\/b>","<b>Provincial autonomy<\/b> (dyarchy ended in provinces, introduced at the centre); <b>All-India Federation<\/b> proposed; <b>RBI<\/b>; <b>Federal Court (1937)<\/b>; separate electorates extended; Burma separated; the <b>main source of our Constitution<\/b>"],["Indian Independence Act","1947","Two dominions; the Constituent Assembly made fully sovereign; the office of Secretary of State abolished"]]},{"k":"tlfig","title":"Constitutional Acts, 1773–1947","rows":[[1773,"Regulating Act",""],[1784,"Pitt's India Act",""],[1793,"Charter Act",""],[1813,"Charter Act",""],[1833,"Charter Act",""],[1853,"Charter Act",""],[1858,"Government of India Act",""],[1861,"Indian Councils Act",""],[1892,"Indian Councils Act",""],[1909,"Morley-Minto / Indian Councils Act",""],[1919,"Montagu-Chelmsford / GoI Act",""],[1935,"Government of India Act",""],[1947,"Indian Independence Act",""]],"cap":"Regulating Act (1773) to the Indian Independence Act (1947): each Act added a step towards self-government."},{"k":"trick","h":"<b>Three \"first\" Acts<\/b> — <span class=\"mn\">1773 Bengal, 1833 India, 1858 Crown<\/span>: first Governor-General <i>of Bengal<\/i> (1773), first Governor-General <i>of India<\/i> (1833), first <i>Crown<\/i> rule (1858).<br><b>Dyarchy<\/b>: introduced in the <b>provinces by 1919<\/b>, moved to the <b>centre by 1935<\/b> — it travels upward."},{"k":"table","title":"Land revenue settlements","head":["System","Who · Year","Where","How it worked"],"rows":[["<b>Permanent Settlement / Zamindari<\/b>","<b>Cornwallis, 1793<\/b> (idea: John Shore)","Bengal, Bihar, Odisha, Varanasi, north Madras — <b>~19%<\/b> of British India","Zamindar fixed as owner, revenue fixed forever at 10/11 to the state; peasants became tenants"],["<b>Ryotwari<\/b>","<b>Thomas Munro &amp; Capt. Read, 1820<\/b>","Madras, Bombay, Assam, Coorg — <b>~51%<\/b>","Settlement directly with the <b>ryot<\/b> (cultivator); revisable every 20–30 years"],["<b>Mahalwari<\/b>","<b>Holt Mackenzie, 1822<\/b>; revised by <b>William Bentinck, 1833<\/b>","North-West Provinces, Punjab, Central India — <b>~30%<\/b>","Settlement with the <b>village/mahal<\/b> as a unit through the headman"]]},{"k":"mapfig","title":"Three land settlements, roughly by today's states","fill":{"WB":"#c0503a","BR":"#c0503a","JH":"#c0503a","OD":"#c0503a","TN":"#2f6db5","AP":"#2f6db5","KA":"#2f6db5","MH":"#2f6db5","GJ":"#2f6db5","AS":"#2f6db5","KL":"#2f6db5","TG":"#2f6db5","UP":"#2f8f4e","PB":"#2f8f4e","HR":"#2f8f4e","MP":"#2f8f4e","DL":"#2f8f4e"},"legend":[["#c0503a","Permanent (Zamindari)"],["#2f6db5","Ryotwari"],["#2f8f4e","Mahalwari"]],"cap":"Permanent Settlement (Cornwallis, 1793) — Bengal, Bihar, Odisha; Ryotwari (Munro, 1820) — Madras, Bombay, Assam; Mahalwari (Holt Mackenzie, 1822) — the North-West Provinces, Punjab, Central India. Approximate."},{"k":"facts","title":"Economic impact — terms SSC asks","rows":[["<b>Drain of wealth<\/b>","<b>Dadabhai Naoroji<\/b>, <i>Poverty and Un-British Rule in India<\/i> (1901)"],["De-industrialisation","Ruin of handloom and handicraft; India turned into a supplier of raw material and a market for British goods"],["<b>Commercialisation of agriculture<\/b>","Forced cash crops — indigo, cotton, jute, opium"],["<b>Indigo revolt<\/b>","<b>1859–60, Bengal<\/b> — Digambar &amp; Bishnu Biswas; <i>Nil Darpan<\/i> by <b>Dinabandhu Mitra<\/b>"],["Deccan riots","1875 — against moneylenders; led to the Deccan Agriculturists' Relief Act 1879"],["Santhal rebellion","1855–56 — <b>Sidhu &amp; Kanhu<\/b>"],["<b>Munda rebellion / Ulgulan<\/b>","1899–1900 — <b>Birsa Munda<\/b> (his birthday, <b>15 November<\/b>, is Janjatiya Gaurav Divas)"],["Kol, Bhil, Khond, Ahom rebellions","Kol 1831 (Buddho Bhagat), Bhil 1818, Khond 1846, Ahom 1828"],["Moplah revolt","1921, Malabar"],["<b>Champaran<\/b> &amp; <b>Bardoli<\/b>","Indigo tinkathia (1917) and revenue hike (1928)"],["Peasant bodies","<b>Kisan Sabha, 1918<\/b> (Awadh, Baba Ramchandra); <b>All India Kisan Sabha, 1936<\/b> (Sahajanand Saraswati); Eka movement 1921"],["Early railways &amp; famine","First railway 1853; <b>Famine Commissions<\/b> — Campbell (1866), Strachey (1880), Lyall (1896), MacDonnell (1900)"]]},{"k":"trap","h":"<b>Permanent Settlement = Cornwallis 1793<\/b>; <b>Ryotwari = Munro<\/b>; <b>Mahalwari = Mackenzie/Bentinck<\/b>. The <b>largest area<\/b> was under <b>Ryotwari (~51%)<\/b>, not Zamindari. The <b>1935 Act<\/b> — not 1919 — is the main source of the Indian Constitution."}],"sum":["1773 Regulating Act — Governor-General of Bengal. 1784 Pitt's India Act — Board of Control. 1813 — ₹1 lakh for education. 1833 — Governor-General of India. 1853 — open competition for the civil services.","1858 — Crown rule, Secretary of State, Viceroy. 1861 — portfolio system. 1909 — separate electorates. 1919 — dyarchy in provinces, bicameral centre. 1935 — provincial autonomy, RBI, Federal Court; main source of the Constitution.","Permanent Settlement/Zamindari — Cornwallis 1793, ~19%. Ryotwari — Munro 1820, ~51% (largest). Mahalwari — Mackenzie 1822/Bentinck 1833, ~30%.","Drain theory — Dadabhai Naoroji, Poverty and Un-British Rule in India. Indigo revolt 1859–60; Nil Darpan by Dinabandhu Mitra.","Tribal revolts: Santhal 1855 (Sidhu & Kanhu), Munda Ulgulan 1899–1900 (Birsa Munda), Kol 1831, Moplah 1921. All India Kisan Sabha 1936."],"part":["Constitution and after 1947","संविधान और 1947 के बाद"]},
{"id":"L33","g":"mod","heat":2,"title":"India after 1947: integration & reorganisation","hi":"स्वतंत्रता के बाद · एकीकरण एवं राज्य पुनर्गठन","blocks":[{"k":"hot","h":"Post-1947 history is now a regular SSC topic: <b>how Junagadh, Hyderabad and Kashmir joined<\/b>, the <b>year each state was formed<\/b>, and the <b>members of the States Reorganisation Commission<\/b>. It overlaps with Polity questions."},{"k":"story","h":"<p>On 15 August 1947 India was free, but it was not yet one country on the map. Besides the British provinces there were over 560 <b>princely states<\/b>, big and small, and the British had told them they could join India, join Pakistan or try to stay independent. A broken map would have meant a weak nation.<\/p><p><b>Sardar Vallabhbhai Patel<\/b>, the Home Minister, and his secretary <b>V. P. Menon<\/b> took on the job. They asked each ruler to sign an <b>Instrument of Accession<\/b>, handing over only defence, external affairs and communications. Using persuasion, pensions and, when needed, pressure, they brought nearly every state in by 15 August. Only three held out: <b>Junagadh<\/b> joined after a plebiscite in 1948, <b>Hyderabad<\/b> after the army's <b>Operation Polo<\/b>, and <b>Kashmir<\/b> when Maharaja Hari Singh signed in October 1947 as raiders attacked.<\/p><p>Next came the question of language. People wanted states where their own language was spoken. When <b>Potti Sriramulu<\/b> died fasting for a Telugu state in 1952, Andhra was created in 1953. The <b>Fazl Ali Commission<\/b> then studied the whole map, and the <b>States Reorganisation Act of 1956<\/b> made language the main basis of our states.<\/p>"},{"k":"facts","title":"Integrating the princely states","rows":[["<b>States Ministry<\/b>","Set up in July 1947 — minister <b>Sardar Patel<\/b>, secretary <b>V. P. Menon<\/b>"],["<b>Instrument of Accession<\/b>","The ruler handed over only <b>defence, external affairs and communications<\/b>"],["Standstill Agreement","Kept existing arrangements running until a final decision"],["Number of states","Over 560"],["Patel","'<b>Iron Man of India<\/b>'; his birthday, <b>31 October<\/b>, is <b>Rashtriya Ekta Diwas<\/b>; <b>Statue of Unity<\/b> (2018) at Kevadia, Gujarat"],["V. P. Menon's book","<i>The Story of the Integration of the Indian States<\/i> (1956)"]]},{"k":"table","title":"The holdouts and the later additions","head":["Territory","Problem","How and when it joined"],"rows":[["<b>Junagadh<\/b>","The Nawab acceded to <b>Pakistan<\/b> though most of his people were Hindu","Indian control in Nov 1947; <b>plebiscite, Feb 1948<\/b> — overwhelmingly for India"],["<b>Hyderabad<\/b>","The <b>Nizam<\/b> (Mir Osman Ali Khan) wanted independence; <b>Razakars<\/b> under Qasim Rizvi","<b>Operation Polo<\/b> ('police action'), <b>13–17 Sept 1948<\/b>"],["<b>Jammu &amp; Kashmir<\/b>","<b>Maharaja Hari Singh<\/b> delayed; tribal raiders from Pakistan invaded","Instrument of Accession signed <b>26 Oct 1947<\/b>; Indian troops flown in on 27 Oct"],["Dadra &amp; Nagar Haveli","Portuguese enclave","Freed by volunteers in 1954; merged with India in 1961"],["<b>Pondicherry<\/b>","French settlements","<b>De facto transfer 1954<\/b>; de jure 1962"],["<b>Goa, Daman &amp; Diu<\/b>","The Portuguese refused to leave","<b>Operation Vijay, Dec 1961<\/b>; Goa became a state in 1987"],["<b>Sikkim<\/b>","Protectorate under the Chogyal","<b>36th Amendment, 1975<\/b> — India's <b>22nd state<\/b>"]]},{"k":"mapfig","title":"The holdouts and the later additions","pins":[["1",70.46,21.52,"Junagadh","n"],["2",78.49,17.39,"Hyderabad","n"],["3",74.8,34.08,"Jammu & Kashmir","n"],["4",73,20.27,"Dadra & Nagar Haveli","n"],["5",79.81,11.94,"Pondicherry","n"],["6",73.83,15.49,"Goa, Daman & Diu","n"],["7",88.61,27.33,"Sikkim","n"]],"facts":[["1 · Junagadh","Indian control in Nov 1947; plebiscite, Feb 1948 — overwhelmingly for India"],["2 · Hyderabad","Operation Polo ('police action'), 13–17 Sept 1948"],["3 · Jammu & Kashmir","Instrument of Accession signed 26 Oct 1947; Indian troops flown in on 27 Oct"],["4 · Dadra & Nagar Haveli","Freed by volunteers in 1954; merged with India in 1961"],["5 · Pondicherry","De facto transfer 1954; de jure 1962"],["6 · Goa, Daman & Diu","Operation Vijay, Dec 1961; Goa became a state in 1987"],["7 · Sikkim","36th Amendment, 1975 — India's 22nd state"]],"cap":"Numbers match the list. Places are approximate. Use ＋ or ⛶ to zoom in."},{"k":"photos","title":"The integrators","items":[["Vallabhbhai_Patel","Vallabhbhai Patel","Iron Man of India"],["V._P._Menon","V. P. Menon","Secretary, States Ministry"],["Statue_of_Unity","Statue of Unity","Kevadia, Gujarat"]]},{"k":"tl","title":"Language and the new map","rows":[["1948","<b>Dhar Commission<\/b> (S. K. Dhar) — preferred administrative convenience to language"],["Dec 1948","<b>JVP Committee<\/b> — <b>J<\/b>awaharlal Nehru, <b>V<\/b>allabhbhai Patel, <b>P<\/b>attabhi Sitaramayya; also rejected language as the basis for now"],["<b>1952<\/b>","<b>Potti Sriramulu<\/b>'s fast unto death for a Telugu state; he died on 15 Dec 1952"],["<b>1 Oct 1953<\/b>","<b>Andhra State<\/b> — the first state formed on a linguistic basis after Independence; capital Kurnool"],["<b>Dec 1953<\/b>","<b>States Reorganisation Commission<\/b> — <b>Fazl Ali<\/b> (chairman), <b>K. M. Panikkar<\/b>, <b>H. N. Kunzru<\/b>; report 1955"],["<b>1 Nov 1956<\/b>","<b>States Reorganisation Act<\/b> — <b>14 states and 6 Union Territories<\/b>"]]},{"k":"tl","title":"New states after 1956","rows":[["<b>1960<\/b>","<b>Maharashtra and Gujarat<\/b> (Bombay State split), 1 May"],["<b>1963<\/b>","<b>Nagaland<\/b>"],["<b>1966<\/b>","<b>Haryana<\/b> (from Punjab); Chandigarh a Union Territory"],["<b>1971<\/b>","<b>Himachal Pradesh<\/b>"],["<b>1972<\/b>","<b>Manipur, Meghalaya, Tripura<\/b>"],["<b>1975<\/b>","<b>Sikkim<\/b> — 22nd state"],["<b>1987<\/b>","<b>Mizoram, Arunachal Pradesh, Goa<\/b>"],["<b>2000<\/b>","<b>Chhattisgarh<\/b> (from MP, 1 Nov), <b>Uttarakhand<\/b> (from UP, 9 Nov), <b>Jharkhand<\/b> (from Bihar, 15 Nov)"],["<b>2014<\/b>","<b>Telangana<\/b> (from Andhra Pradesh, 2 June) — 29th state"],["<b>2019<\/b>","<b>J&amp;K<\/b> reorganised into two Union Territories, <b>J&amp;K and Ladakh<\/b> (31 Oct) — India now has 28 states"],["<b>2020<\/b>","<b>Dadra &amp; Nagar Haveli<\/b> and <b>Daman &amp; Diu<\/b> merged into one Union Territory (26 Jan)"]]},{"k":"facts","title":"The Republic begins","rows":[["Constitution adopted","<b>26 November 1949<\/b> — now <b>Constitution Day<\/b>"],["Constitution in force","<b>26 January 1950<\/b> — chosen because 26 Jan 1930 was the first Purna Swaraj day"],["First President","<b>Dr Rajendra Prasad<\/b>"],["<b>First general election<\/b>","<b>Oct 1951 – Feb 1952<\/b>; first Chief Election Commissioner <b>Sukumar Sen<\/b>; Nehru continued as Prime Minister"],["Renamed states","Madras → <b>Tamil Nadu<\/b> (1969); Mysore → <b>Karnataka<\/b> (1973); Orissa → <b>Odisha<\/b> (2011)"]]},{"k":"trick","h":"<b>Three holdouts<\/b> — <span class=\"mn\">J-H-K<\/span>: <b>J<\/b>unagadh – plebiscite; <b>H<\/b>yderabad – Polo; <b>K<\/b>ashmir – Instrument.<br><b>SRC members<\/b> — <span class=\"mn\">FPK<\/span>: <b>F<\/b>azl Ali, <b>P<\/b>anikkar, <b>K<\/b>unzru. Do not mix with <b>JVP<\/b> (Jawaharlal, Vallabhbhai, Pattabhi).<br><b>November 2000 triplets<\/b> — <span class=\"mn\">C-U-J = 1, 9, 15<\/span>: Chhattisgarh, Uttarakhand, Jharkhand."},{"k":"trap","h":"<b>Andhra State (1953)<\/b> was the first linguistic state after Independence; <b>Andhra Pradesh<\/b> came in 1956. Before Independence, <b>Orissa (1936)<\/b> was the first province formed on language. <b>Operation Polo = Hyderabad (1948)<\/b>; <b>Operation Vijay = Goa (1961)<\/b>. Goa became a <b>Union Territory in 1961<\/b> but a <b>state only in 1987<\/b>. Pondicherry: <b>de facto 1954, de jure 1962<\/b>. The Constitution was <b>adopted on 26 Nov 1949<\/b> but <b>came into force on 26 Jan 1950<\/b>."}],"sum":["Sardar Patel and V. P. Menon brought over 560 princely states in through the Instrument of Accession, which gave India only defence, external affairs and communications.","The three holdouts: Junagadh (plebiscite, Feb 1948), Hyderabad (Operation Polo, Sept 1948) and Kashmir (accession by Hari Singh, 26 Oct 1947). Goa was freed by Operation Vijay in 1961; Sikkim became the 22nd state in 1975.","Potti Sriramulu's fast led to Andhra State in 1953; the Fazl Ali Commission (Fazl Ali, Panikkar, Kunzru) led to the States Reorganisation Act of 1956, which made 14 states and 6 Union Territories.","Later states: Maharashtra and Gujarat 1960, Nagaland 1963, Haryana 1966, Himachal 1971, Manipur, Meghalaya and Tripura 1972, Mizoram, Arunachal and Goa 1987, Chhattisgarh, Uttarakhand and Jharkhand 2000, Telangana 2014.","The Constitution was adopted on 26 Nov 1949 and came into force on 26 Jan 1950; the first general election was held in 1951-52 under Sukumar Sen; J and K became two Union Territories in 2019."],"part":["Constitution and after 1947","संविधान और 1947 के बाद"]}
];

["L17","Vasco da Gama reached Calicut in:",["1498","1492","1510","1600"],"He landed at Calicut in May 1498 and was received by the Zamorin.","p"],

["L17","The Battle of Buxar (1764) was won for the English by:",["Hector Munro","Robert Clive","Eyre Coote","Warren Hastings"],"Munro defeated the combined forces of Mir Qasim, Shuja-ud-Daulah and Shah Alam II.","p"],
["L17","The Diwani rights of Bengal, Bihar and Odisha were granted to the Company in 1765 by:",["Shah Alam II","Mir Jafar","Siraj-ud-Daulah","Shuja-ud-Daulah"],"Shah Alam II granted the right to collect revenue after the Treaty of Allahabad.","p"],

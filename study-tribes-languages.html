am<\/b>"],["Body","Tribes Advisory Council — up to 20 members, three-fourths of them ST members of the state assembly","Autonomous District Councils — usually up to 30 members, not more than 4 nominated by the Governor and the rest elected"],["Who declares","The President declares an area a Scheduled Area","The Governor can create or change an autonomous district"],["Powers","The Governor can keep a law of Parliament or the state away from a Scheduled Area, or apply it with changes","The councils make laws on land, forests, inheritance, marriage and social customs, and run village courts"],["How many","—","10 councils: 3 in Assam (Bodoland Territorial Council, Karbi Anglong, Dima Hasao), 3 in Meghalaya (Khasi, Jaintia, Garo Hills), 3 in Mizoram (Chakma, Lai, Mara), 1 in Tripura"]]},{"k":"facts","title":"Laws, bodies and schemes","rows":[["PESA Act, 1996","Panchayats (Extension to Scheduled Areas) Act — carries Part IX (panchayats) into Fifth Schedule areas and gives the gram sabha a strong say; based on the Bhuria Committee"],["Forest Rights Act, 2006","Scheduled Tribes and Other Traditional Forest Dwellers (Recognition of Forest Rights) Act — in force from 31 December 2007; nodal ministry: Tribal Affairs"],["FRA — the numbers","Cut-off date 13 December 2005; other forest dwellers must show 3 generations (75 years) of residence; individual land up to 4 hectares; the gram sabha starts the process"],["FRA — firsts","Mendha Lekha (Gadchiroli, Maharashtra) won community forest rights, then the right to sell its bamboo; the Soligas of BR Hills (Karnataka) were the first to win forest rights inside a tiger reserve"],["Ministry of Tribal Affairs","Set up in October 1999, taken out of the Ministry of Social Justice"],["National Commission for STs","Article 338A — the 89th Amendment (2003) split the old joint commission for SCs and STs; it began work in 2004"],["Article 164(1) proviso","A minister for tribal welfare is required in Chhattisgarh, Jharkhand, Madhya Pradesh and >Madhya Pradesh<\/b>, but the highest <b>share<\/b> is <b>Mizoram<\/b> — and the largest <b>tribe<\/b> is the <b>Bhil<\/b>, not the Gond."}],"sum":["Article 342: the President notifies STs (after consulting the Governor); only Parliament can change the list.","Fifth Schedule (Art. 244(1)): Scheduled Areas in 10 states, Tribes Advisory Councils. Sixth Schedule (Art. 244(2)): Assam, Meghalaya, Tripura, Mizoram — 10 autonomous district councils.","NCST: Article 338A, 89th Amendment 2003. Ministry of Tribal Affairs: 1999. PESA: 1996.","Forest Rights Act 2006 (in force 31 Dec 2007): cut-off 13 Dec 2005, 75 years for other forest dwellers, up to 4 ha.","PVTGs: 75 in 18 states and the Andaman and Nicobar Islands; Odisha has the most (13). PM JANMAN (Khunti, 15 Nov 2023) is for them.","Census 2011: STs 10.43 crore, 8.6%; largest tribe Bhil; most STs Madhya Pradesh; highest share Mizoram; lowest share Uttar Pradesh; none in Punjab, Haryana, Delhi, Chandigarh, Puducherry."],"part":["Part 1 · Scheduled Tribes and where they live","अनुसूचित जनजातियाँ और उनके क्षेत्र"],"g":"tl"},

gest tribe; Gondwana; Gondi (a Dravidian language); Gond painting (GI tag 2023, Dindori); the Pardhans are their bards"],["<b>Baiga<\/b>","Madhya Pradesh and Chhattisgarh (Maikal hills)","A PVTG; <i>bewar<\/i> shifting cultivation without a plough; famous tattoos; Baiga Chak in Dindori"],["<b>Sahariya<\/b>","Madhya Pradesh and Rajasthan","A PVTG in both states — Rajasthan's only PVTG (Baran district)"],["<b>Korku<\/b>","Madhya Pradesh and Maharashtra (Melghat)","Speak Korku, a Munda (Austro-Asiatic) language"],["<b>Tharu<\/b>","Uttar Pradesh, Uttarakhand, Bihar (and Nepal)","People of the Terai forests along the Nepal border"],["<b>Bhotia<\/b>","Uttarakhand (and Himachal Pradesh)","Traders who crossed the Himalayan passes to Tibet; Mana, Niti and Johar valleys"],["<b>Warli<\/b>","Maharashtra (Palghar, Thane) and Gujarat","Warli painting — white figures on mud walls; Jivya Soma Mashe made it famous"],["<b>Siddi<\/b>","Gujarat, Karnataka, Goa","Of African descent; Jambur village near Gir; the Dhamal dance"],["<b>Garasia<\/b>","Rajasthan (Sirohi, Udaipur) and Gujarat","A Bhil-related tribe of the Aravallis"]]},{"k":"facts","title":"Words to know","rows":[["Ghotul","The youth dormitory of the Murias of Bastar, written about by Verrier Elwin"],["Bewar","The Baigas' slash-and-burn farming on hill slopes, without ploughing the earth"],["Pithora","Ritual wall painting of the Rathwas and Bhilalas of Gujarat and Madhya Pradesh"],["Gondwana","The old name of the Gond country of central India — the geologists' Gondwanaland is named after it"],["Halbi","The common link language of Bastar"],["Verrier Elwin","Anthropologist of the Baigas, Gonds and Murias; later adviser on the North-East to Nehru"]]},{"k":"link","h":"Bhil and Gond dances, the Bastar region's dances and the Siddi Dhamal are in the <b>Folk Dances<\/b> app (lessons on Madhya Pradesh & Gujarat and Odisha & Chhattisgarh)."},{"k":"trick","h":"Himalayan tribes, west to east — <b>“Bakarwal goats, Gaddi sheep, Changpa pashmina, Bhotia salt”<\/b>.<br>The two giants — <b>“Bhil Bigger, Gond Gondwana”<\/b>: Bhil is the largest; Gond gave its name to a region."},{"k":"trap","h":"<b>Gondi<\/b> is a <b>Dravidian<\/b> language, though the Gonds live in the north of the Deccan; <b>Korku<\/b> nearby is <b>Austro-Asiatic<\/b>. The <b>ghotul<\/b> is <b>Muria<\/b>, not Baiga. The <b>Sahariya<\/b> are a PVTG in <b>both<\/b> Rajasthan and Madhya Pradesh. <b>Bhotia<\/b> (Uttarakhand) is not the same as <b>Bhutia<\/b> (Sikkim)."}],"sum":["Bhils: India's largest tribe — MP, Gujarat, Rajasthan, Maharashtra; archers; Bhagoria.","Gonds: second largest — Gondwana; Gondi is Dravidian; Gond painting GI (2023); Rani Durgavati.","Baiga (MP–Chhattisgarh): PVTG, bewar farming. Muria (Bastar): ghotul. Abujh Maria: PVTG of Abujhmarh.","Himalaya: Gaddi (Himachal shepherds), Bakarwal (J&K), Changpa and Brokpa (Ladakh), Jaunsari and Bhotia (Uttarakhand), Tharu (Terai).","West: Mina (Rajasthan's largest), Sahariya (Rajasthan's only PVTG), Rathwa (Pithora), Warli (painting), Siddi (African descent)."],"part":["Part 1 · Scheduled Tribes and where they live","अनुसूचित जनजातियाँ और उनके क्षेत्र"],"g":"tl"},
{"id":"T3","heat":3,"title":"Tribes of the east: Jharkhand, Odisha, West Bengal, Bihar","hi":"पूर्वी भारत की जनजातियाँ","blocks":[{"k":"hot","h":"Most asked: the <b>Santhals<\/b> (Santhal Parganas, Santhali, Ol Chiki), <b>Mundas<\/b> and <b>Oraons<\/b> (Kurukh), <b>Hos<\/b> of Kolhan, Odisha's PVTGs — <b>Bonda<\/b>, <b>Dongria Kondh<\/b> (Niyamgiri), <b>Juang<\/b>, <b>Saora<\/b> — and the <b>Kondhs<\/b>, Odisha's largest tribe."},{"k":"story","h":"<p>The <b>Chota Nagpur plateau<\/b> is the oldest tribal homeland of the east. Three peoples fill it. The <b>Santhals<\/b>, India's third-largest tribe, live in the <b>Santhal Parganas<\/b> and far beyond. The <b>Mundas<\/b> of the Ranchi–Khunti plateau held their land jointly as the descendants of the clan founders, a system called <b>khuntkatti<\/b>; its breakdown drove Birsa Munda's rising. The <b>Oraons<\/b> came later and speak <b>Kurukh<\/b>, a <b>Dravidian<\/b> language, unlike the <b>Munda<\/b> languages (Santhali, Mundari, Ho) around them. To the south, in <b>Kolhan<\/b>, live the <b>Hos<\/b>.<\/p><p><b>Odisha<\/b> has 62 tribes — more than any other state — and 13 PVTGs. The <b>Kondhs<\/b> are the largest; Kandhamal district is named after them. In the Niyamgiri hills, the <b>Dongria Kondhs<\/b> worship the mountain as their god Niyam Raja and, in 2013, their village councils turned away a bauxite mine. In Malkangiri live the <b>Bondas<\/b>, whose women wear heavy bead necklaces and metal neck rings. The <b>Saoras<\/b> paint spirit pictures, <b>idital<\/b>, on their walls.<\/p>","key":"Santhal (Santhal Parganas), Munda (khuntkatti), Oraon (Kurukh — Dravidian), Ho (Kolhan); Odisha: 62 tribes, 13 PVTGs, Kondh largest, Dongria Kondh of Niyamgiri, Bonda of Malkangiri."},{"k":"table","title":"Tribes of the east and their homelands","head":["Tribe","Homeland","Remember"],"rows":[["Santhal","Santhal Parganas (Jharkhand)","India's third-largest tribe; also in West Bengal, Odisha, Bihar and Assam."],["Ho","Kolhan (West Singhbhum, Jharkhand)","They speak Ho, a Munda language, written in the Warang Citi script."],["Munda","Ranchi–Khunti plateau (Jharkhand)","Birsa Munda's people; they speak Mundari."],["Sauria Paharia","Rajmahal Hills (Jharkhand)","A PVTG; with the Mal Paharia, among the oldest people of the Rajmahal Hills."],["Asur","Netarhat plateau (Jharkhand)","A PVTG who were traditional iron-smelters."],["Dongria Kondh","Niyamgiri Hills (Odisha)","A PVTG whose gram sabhas voted against bauxite mining on their sacred hill in 2013."],["Bonda","Bonda Hills, Malkangiri (Odisha)","A PVTG; the women wear layers of bead necklaces and metal neck rings and shave their heads."],["Juang","Keonjhar (Odisha)","A PVTG of the Keonjhar hills, once shifting cultivators."],["Saora (Sora)","Gajapati district (Odisha)","Known for idital wall paintings and their own script, Sorang Sompeng."],["Toto","Totopara, Alipurduar (West Bengal)","A PVTG living in one village near the Bhutan border."]]},{"k":"facts","title":"More tribes of the east","rows":[["Oraon","Jharkhand, Chhattisgarh, Odisha, West Bengal — speak Kurukh (Dravidian); Sarhul and Karma; the Tana Bhagat movement (1914) began among them"],["Kondh (Kandha)","Odisha's largest tribe; Kandhamal is named after them; the British ended their meriah sacrifice in the 1840s"],["Birhor","A PVTG of Jharkhand — wandering monkey-catchers and rope-makers who live in camps called tanda"],["Kharia","Jharkhand and Odisha — speak Kharia, a Munda language"],["Lodha","A PVTG of West Bengal and Odisha, once wrongly branded under the Criminal Tribes Act"],["Tharu","Also in West Champaran, Bihar, around the Valmiki forests"]]},{"k":"table","title":"Tribal shares of the eastern states (Census 2011)","head":["State","ST share","Note"],"rows":[["Jharkhand","26.2%","32 tribes; Santhal the largest"],["Odisha","22.8%","62 tribes — the most of any state; 13 PVTGs"],["West Bengal","5.8%","Santhals are more than half of the state's STs"],["Bihar","1.3%","Most tribal areas went to Jharkhand in 2000"]]},{"k":"link","h":"The Santhal Hul, Birsa Munda's Ulgulan and the Kol rising are in lesson T6; the scripts Ol Chiki, Warang Citi and Sorang Sompeng in T8. Chhau, Santhali and Jhumair dances are in the <b>Folk Dances<\/b> app."},{"k":"trick","h":"Munda family of languages — <b>“San-Mun-Ho-Kha”<\/b>: Santhali, Mundari, Ho, Kharia — all <b>Austro-Asiatic<\/b>. The odd one out on the plateau is <b>Kurukh<\/b> of the <b>Oraons<\/b> — <b>“Oraon = Other (Dravidian)”<\/b>."},{"k":"trap","h":"<b>Odisha<\/b> has the <b>most tribes (62)<\/b> and the <b>most PVTGs (13)<\/b>, but <b>Madhya Pradesh<\/b> has the most tribal <b>people<\/b>. The <b>Dongria Kondh<\/b> are of <b>Niyamgiri<\/b> (Rayagada–Kalahandi), the <b>Bonda<\/b> of <b>Malkangiri<\/b>. <b>Kolhan<\/b> is the land of the <b>Ho<\/b>, even though the British called many Munda-speaking peoples “Kols”."}],"sum":["Santhals: India's third-largest tribe — Santhal Parganas, Santhali (Ol Chiki).","Mundas: Ranchi–Khunti, khuntkatti land; Hos: Kolhan; Oraons: Kurukh — a Dravidian language.","Jharkhand PVTGs include the Asur (iron-smelters), Birhor (rope-makers), Sauria and Mal Paharia.","Odisha: 62 tribes and 13 PVTGs; Kondhs the largest; Dongria Kondh (Niyamgiri), Bonda (Malkangiri), Juang (Keonjhar), Saora (idital).","West Bengal: Toto of Totopara (PVTG), Lodha; Bihar: Tharu of West Champaran."],"part":["Part 1 · Scheduled Tribes and where they live","अनुसूचित जनजातियाँ और उनके क्षेत्र"],"g":"tl"},
{"id":"T4","heat":3,"title":"Tribes of the North-East","hi":"पूर्वोत्तर भारत की जनजातियाँ","blocks":[{"k":"hot","h":"Most asked: the <b>Naga tribes<\/b> and their districts (Angami, Ao, Konyak, Sumi, Lotha), the matrilineal <b>Khasis and Garos<\/b> of Meghalaya, the <b>Mizos<\/b>, the <b>Bodos<\/b> of Assam, the <b>Apatanis<\/b> of Ziro, the <b>Nyishis<\/b> (largest in Arunachal), the <b>Adis<\/b>, the <b>Monpas<\/b> of Tawang, and the <b>Bhutias and Lepchas<\/b> of Sikkim."},{"k":"story","h":"<p>The North-East holds more than a hundred tribes, and most of them speak <b>Tibeto-Burman<\/b> languages. In <b>Nagaland<\/b> each district is home to one major Naga tribe: the <b>Angamis<\/b> of Kohima, the <b>Aos<\/b> of Mokokchung, the tattooed <b>Konyaks<\/b> of Mon, the <b>Sumis<\/b>, the <b>Lothas<\/b> and many more. They meet every December at the <b>Hornbill Festival<\/b>.<\/p><p><b>Meghalaya<\/b> is different. Its three peoples — the <b>Khasis<\/b>, the <b>Jaintias (Pnar)<\/b> and the <b>Garos<\/b> — are <b>matrilineal<\/b>: children take the mother's clan name, and among the Khasis the youngest daughter keeps the family home. The Khasi tongue is <b>Austro-Asiatic<\/b>, a cousin of Santhali far to the west.<\/p><p>In <b>Arunachal Pradesh<\/b> the <b>Nyishis<\/b> are the largest tribe; the <b>Apatanis<\/b> farm fish in their rice fields in the <b>Ziro valley<\/b>; the <b>Adis<\/b> live along the Siang; and the Buddhist <b>Monpas<\/b> keep the great monastery of <b>Tawang<\/b>. Assam's largest plains tribe is the <b>Bodo<\/b>; Mizoram's people are the <b>Mizos<\/b>; and in Sikkim the <b>Lepchas<\/b>, the oldest settlers, live beside the <b>Bhutias<\/b> and <b>Limbus<\/b>.<\/p>","key":"Nagaland: a tribe per district (Angami–Kohima, Ao–Mokokchung, Konyak–Mon); Meghalaya: Khasi, Jaintia, Garo — matrilineal; Arunachal: Nyishi largest, Apatani of Ziro; Assam: Bodo; Sikkim: Lepcha, Bhutia, Limbu."},{"k":"table","title":"Tribes of the North-East and their states","head":["Tribe","State","Remember"],"rows":[["Angami","Nagaland","Kohima district; terraced wet-rice fields; Khonoma is called India's first green village."],["Ao","Nagaland","Mokokchung district; the first Naga tribe to take up Christianity (1872); Moatsu festival."],["Konyak","Nagaland","Mon district; tattooed former head-hunters ruled by chiefs called Angh."],["Sumi (Sema)","Nagaland","Zunheboto district; Tuluni and Ahuna festivals."],["Lotha","Nagaland","Wokha district; Tokhu Emong festival."],["Chakhesang","Nagaland","Phek district; the name joins Chakhru, Kheza and Sangtam."],["Khasi","Meghalaya","Matrilineal — the youngest daughter keeps the family home; their language is Austro-Asiatic."],["Garo (A·chik)","Meghalaya","Matrilineal; the Wangala harvest festival of the hundred drums."],["Jaintia (Pnar)","Meghalaya","Matrilineal; the Behdienkhlam festival at Jowai."],["Mizo","Mizoram","Mizoram's main people; Chapchar Kut and the Cheraw bamboo dance."],["Bodo","Assam","The largest plains tribe of Assam; the Bathou faith; the Bodoland Territorial Region."],["Mishing","Assam","A riverside people of the Brahmaputra and Majuli who live in stilt houses."],["Karbi","Assam","The Karbi Anglong hills; their own autonomous council."],["Dimasa","Assam","The Dima Hasao hills; once ruled the Dimasa kingdom."],["Apatani","Arunachal Pradesh","The Ziro valley; paddy-cum-fish farming; the women's old nose plugs and facial tattoos."],["Nyishi","Arunachal Pradesh","The largest tribe of Arunachal; the hornbill-beak head-dress; Nyokum festival."],["Adi","Arunachal Pradesh","The Siang valley; Solung festival and the Ponung dance."],["Monpa","Arunachal Pradesh","Tawang and West Kameng; Tibetan Buddhists — Losar and Torgya."],["Galo","Arunachal Pradesh","West Siang; the Mopin festival."],["Idu Mishmi","Arunachal Pradesh","The Dibang valley; the Reh festival."],["Bhutia","Sikkim","Of Tibetan origin; Buddhists; Losoong is their new year."],["Lepcha","Sikkim","Sikkim's earliest people; the Dzongu reserve in North Sikkim is kept for them."],["Limbu","Sikkim","Also called Tsong; they have their own Limbu (Sirijonga) script."],["Tangkhul Naga","Manipur","Ukhrul district, home of the Shirui lily; the Luira Phanit festival."],["Tripuri","Tripura","The largest tribe of Tripura; they speak Kokborok."],["Jamatia","Tripura","A Kokborok-speaking tribe with its own traditional council, the Hoda."]]},{"k":"facts","title":"More to know","rows":[["Matrilineal tribes","Khasi, Jaintia (Pnar) and Garo of Meghalaya — descent through the mother; the Khasi youngest daughter is the Ka Khadduh, keeper of the family home"],["Kuki","The hills of Manipur, and parts of Mizoram, Nagaland and Assam; Chavang Kut harvest festival (1 November); the Anglo-Kuki War of 1917–19"],["Meitei","The valley people of Manipur — not a Scheduled Tribe; their language, Manipuri (Meiteilon), is in the Eighth Schedule"],["Reang (Bru)","Tripura's only PVTG; the Hojagiri dance; Bru families who fled Mizoram were settled in Tripura under a 2020 agreement"],["Chakma","Buddhists who came from the Chittagong Hill Tracts; their own autonomous council in Mizoram; also in Tripura and Arunachal"],["Bodo","Bodofa Upendranath Brahma led their movement; the 2020 Bodo Accord renamed the area the Bodoland Territorial Region"],["Apatani","The Apatani cultural landscape of Ziro is on India's tentative list for World Heritage (2014)"],["Language families","Most North-East tribes speak Tibeto-Burman languages (Naga, Mizo, Garo, Bodo); Khasi and Pnar are Austro-Asiatic"]]},{"k":"link","h":"Bihu, Cheraw, Hojagiri, Nongkrem and other dances are in the <b>Folk Dances<\/b> app (lessons on Assam, Meghalaya–Mizoram–Tripura, Manipur–Nagaland–Sikkim, and Arunachal). Tribal festivals of the North-East are in T6."},{"k":"trick","h":"Naga tribes by district — <b>“KA-MA-MK”<\/b>: <b>K<\/b>ohima–<b>A<\/b>ngami, <b>M<\/b>okokchung–<b>A<\/b>o, <b>M<\/b>on–<b>K<\/b>onyak.<br>Meghalaya from west to east — <b>“G-K-J”<\/b>: the <b>G<\/b>aro Hills, the <b>K<\/b>hasi Hills, the <b>J<\/b>aintia Hills."},{"k":"trap","h":"<b>Bhutia<\/b> (Sikkim) is not <b>Bhotia<\/b> (Uttarakhand). The <b>Khasi<\/b> language is <b>Austro-Asiatic<\/b>, but <b>Garo<\/b> is <b>Tibeto-Burman<\/b> — both are matrilineal. The <b>Meiteis<\/b> of the Manipur valley are <b>not<\/b> a Scheduled Tribe. The largest tribe of Arunachal is the <b>Nyishi<\/b>, not the Adi."}],"sum":["Nagaland: Angami (Kohima), Ao (Mokokchung), Konyak (Mon), Sumi (Zunheboto), Lotha (Wokha), Chakhesang (Phek).","Meghalaya: Khasi, Jaintia (Pnar), Garo — matrilineal; Khasi is Austro-Asiatic.","Arunachal: Nyishi (largest), Apatani (Ziro), Adi (Siang), Monpa (Tawang), Galo, Idu Mishmi.","Assam: Bodo (largest plains tribe), Mishing, Karbi, Dimasa. Mizoram: Mizo. Tripura: Tripuri (largest), Reang (PVTG).","Sikkim: Lepcha (earliest, Dzongu), Bhutia, Limbu. Manipur: Tangkhul Naga, Kuki; Meiteis are not ST."],"part":["Part 1 · Scheduled Tribes and where they live","अनुसूचित जनजातियाँ और उनके क्षेत्र"],"g":"tl"},
{"id":"T5","heat":2,"title":"Tribes of the south and the islands","hi":"दक्षिण भारत और द्वीपों की जनजातियाँ","blocks":[{"k":"hot","h":"Most asked: the <b>Todas<\/b> of the Nilgiris, the <b>Irulas<\/b>, <b>Chenchus<\/b> and <b>Soligas<\/b>, and above all the <b>Andaman and Nicobar<\/b> tribes — <b>Jarawa, Onge, Sentinelese, Great Andamanese, Shompen<\/b> and <b>Nicobarese<\/b>: where each lives, which are Negrito and which Mongoloid, and which are PVTGs."},{"k":"story","h":"<p>The <b>Nilgiri Hills<\/b> are a tribal world in miniature. The <b>Todas<\/b> herd sacred buffaloes and live in barrel-roofed huts; the <b>Kotas<\/b> were their potters, smiths and musicians; the <b>Kurumbas<\/b> gathered from the forest; the <b>Irulas<\/b> are famous snake catchers. On the plains to the east, the <b>Chenchus<\/b> still hunt and gather in the <b>Nallamala<\/b> forest, and in Karnataka the <b>Soligas<\/b> of the BR Hills and the honey-gathering <b>Jenu Kurubas<\/b> live inside today's tiger reserves.<\/p><p>Far out in the Bay of Bengal live India's most isolated people. On the Andaman Islands are four <b>Negrito<\/b> groups: the <b>Great Andamanese<\/b> (now a small group on Strait Island), the <b>Jarawas<\/b>, the <b>Onges<\/b> of Little Andaman and the <b>Sentinelese<\/b>, who allow no visitors at all. In the Nicobars live two <b>Mongoloid<\/b> peoples: the forest-dwelling <b>Shompens<\/b> of Great Nicobar and the <b>Nicobarese<\/b>, the largest island tribe. Five of these six — all but the Nicobarese — are PVTGs.<\/p>","key":"Nilgiris: Toda (buffaloes), Kota (artisans), Irula (snakes); Chenchu (Nallamala); Soliga (BR Hills); Andaman — Negrito: Great Andamanese, Jarawa, Onge, Sentinelese; Nicobar — Mongoloid: Shompen, Nicobarese."},{"k":"table","title":"The island tribes","head":["Tribe","Where they live","Remember"],"rows":[["Great Andamanese","Strait Island","Once ten tribes across Great Andaman; now about 50 people, resettled on Strait Island. Negrito."],["Jarawa","The western forests of South and Middle Andaman","Hunter-gatherers whose reserve is crossed by the Andaman Trunk Road. Negrito."],["Onge","Dugong Creek, Little Andaman","Semi-nomadic hunter-gatherers, about a hundred people. Negrito."],["Sentinelese","North Sentinel Island","They reject all contact; going within 5 nautical miles of the island is banned. Negrito."],["Shompen","The inner forests of Great Nicobar","Hunter-gatherers of Mongoloid stock — the only PVTG of the Nicobar group."],["Nicobarese","Car Nicobar and the other Nicobar Islands","The largest island tribe; Mongoloid; coconuts, pigs and canoes — not a PVTG."]]},{"k":"table","title":"Tribes of the south and what they are known for","head":["Tribe","Known for","Where"],"rows":[["Toda","Buffalo herding and barrel-roofed huts","Nilgiri Hills, Tamil Nadu — a PVTG; their red-and-black Toda embroidery has a GI tag."],["Kota","Pottery, smithy and music for the Nilgiri villages","Nilgiri Hills, Tamil Nadu — a PVTG of artisans."],["Irula","Catching snakes and rats","Tamil Nadu — a PVTG; their snake catchers' co-operative (1978) supplies venom for antivenom."],["Jenu Kuruba","Gathering wild honey","Karnataka (Nagarhole and Kodagu forests) — a PVTG; jenu means honey in Kannada."],["Chenchu","Hunting and gathering in the Nallamala forest","Andhra Pradesh and Telangana, around Srisailam — a PVTG."],["Soliga","Winning forest rights inside a tiger reserve","The Biligiri Rangana (BR) Hills, Karnataka."],["Kani","Sharing the arogyapacha herb that became the medicine Jeevani","Kerala — an early case of a tribe sharing the profit from its knowledge."],["Cholanaikkan","Living in the rock shelters of the Nilambur forest","Kerala — one of the last hunter-gatherer PVTGs of South India."],["Koya","The Medaram Sammakka–Saralamma Jatara","The Godavari valley — Telangana, Andhra Pradesh, Chhattisgarh."],["Lambada (Banjara)","Mirror-work embroidery and the Teej festival","A former trading people, now an ST in Telangana and Andhra Pradesh."]]},{"k":"facts","title":"More to know","rows":[["Negrito and Mongoloid","Negrito: Great Andamanese, Jarawa, Onge, Sentinelese (Andaman). Mongoloid: Shompen and Nicobarese (Nicobar)"],["A&N PVTGs","All the island tribes except the Nicobarese — five in all"],["Tamil Nadu PVTGs","Toda, Kota, Kurumba, Irula, Paniya, Kattunayakan — six, mostly in the Nilgiris"],["Kerala PVTGs","Cholanaikkan, Kadar, Kattunayakan, Koraga, Kurumba"],["Karnataka PVTGs","Jenu Kuruba and Koraga"],["Badaga","The largest community of the Nilgiris — but not a Scheduled Tribe"],["Bo language","A Great Andamanese tongue; its last speaker, Boa Sr, died in 2010"],["Lakshadweep","About 95% of its people are Scheduled Tribes — the highest share anywhere"],["Irula snake catchers","Two Irulas, Masi Sadaiyan and Vadivel Gopal, received the Padma Shri in 2023"]]},{"k":"trick","h":"Andaman's four Negritos — <b>“GOJS”<\/b>: <b>G<\/b>reat Andamanese, <b>O<\/b>nge, <b>J<\/b>arawa, <b>S<\/b>entinelese. Nicobar's two Mongoloids — <b>“S-N”<\/b>: <b>S<\/b>hompen, <b>N<\/b>icobarese.<br>Nilgiri trio — <b>“Toda Tends, Kota Crafts, Irula Catches”<\/b>."},{"k":"trap","h":"The <b>Nicobarese<\/b> are the largest island tribe but are <b>not<\/b> a PVTG. The <b>Onges<\/b> live on <b>Little<\/b> Andaman, the <b>Shompens<\/b> on <b>Great Nicobar<\/b>. The <b>Badagas<\/b> of the Nilgiris are <b>not<\/b> STs. The <b>Chenchus<\/b> live in both <b>Andhra Pradesh and Telangana<\/b> — the Nallamala forest spans the border."}],"sum":["Nilgiris: Toda (buffaloes, barrel huts, embroidery), Kota (artisans), Kurumba, Irula (snake catchers) — all PVTGs.","Chenchu: Nallamala (AP–Telangana); Soliga: BR Hills (Karnataka); Jenu Kuruba: honey; Kani: Jeevani; Koya: Medaram.","Andaman (Negrito): Great Andamanese (Strait Island), Jarawa (ATR forests), Onge (Little Andaman), Sentinelese (North Sentinel).","Nicobar (Mongoloid): Shompen (Great Nicobar, PVTG), Nicobarese (Car Nicobar, not a PVTG).","Lakshadweep is about 95% ST; Badagas are not ST."],"part":["Part 1 · Scheduled Tribes and where they live","अनुसूचित जनजातियाँ और उनके क्षेत्र"],"g":"tl"}

const QB = [
["T1","Under which Article does the President specify the Scheduled Tribes of a state?",["Article 342","Article 341","Article 338","Article 244"],"Article 342 is for Scheduled Tribes; Article 341 does the same job for Scheduled Castes.",""],
["T1","Once the list of Scheduled Tribes of a state is notified, who can add a community to it?",["Parliament, by law","The Governor of the state","The state legislature","The National Commission for Scheduled Tribes"],"Article 342(2): only Parliament can include or exclude a community, by passing a law.",""],
["T1","Which Article defines the term “Scheduled Tribes”?",["Article 366(25)","Article 366(24)","Article 342(2)","Article 15(4)"],"Article 366(25) says STs are the communities deemed so under Article 342. Clause 24 of the same Article defines Scheduled Castes.",""],
["T1","The Sixth Schedule applies to the tribal areas of which four states?",["Assam, Meghalaya, Tripura and Mizoram","Assam, Nagaland, Manipur and Mizoram","Meghalaya, Nagaland, Arunachal Pradesh and Sikkim","Tripura, Manipur, Nagaland and Arunachal Pradesh"],"Article 244(2) and the Sixth Schedule cover Assam, Meghalaya, Tripura and Mizoram only.",""],
["T1","Which of these states is NOT covered by the Sixth Schedule?",["Nagaland","Mizoram","Tripura","Meghalaya"],"Nagaland has its own special provision (Article 371A) but no Sixth Schedule councils.",""],
["T1","Tribes Advisory Councils are a feature of which Schedule?",["Fifth Schedule","Sixth Schedule","Seventh Schedule","Eleventh Schedule"],"Fifth Schedule states have a Tribes Advisory Council of up to 20 members; Sixth Schedule areas have autonomous district councils instead.",""],
["T1","Who declares an area to be a “Scheduled Area” under the Fifth Schedule?",["The President","The Governor","Parliament","The Ministry of Tribal Affairs"],"The President declares Scheduled Areas by order; the Governor then looks after them and reports to the President.",""],
["T1","How many autonomous district councils are there under the Sixth Schedule (as of October 2026)?",["10","6","12","4"],"Three each in Assam, Meghalaya and Mizoram and one in Tripura — ten in all.",""],
["T1","The Bodoland Territorial Council works under which Schedule of the Constitution?",["Sixth Schedule","Fifth Schedule","Eighth Schedule","Ninth Schedule"],"The Bodoland Territorial Council in Assam is one of the Sixth Schedule's autonomous councils.",""],
["T1","Which of these is an autonomous district council of Mizoram?",["Chakma","Karbi Anglong","Dima Hasao","Garo Hills"],"Mizoram has the Chakma, Lai and Mara councils. Karbi Anglong and Dima Hasao are in Assam, Garo Hills in Meghalaya.",""],
["T1","Which Article provides for the National Commission for Scheduled Tribes?",["Article 338A","Article 338","Article 340","Article 339"],"Article 338A was added by the 89th Amendment, 2003. Article 338 is the commission for Scheduled Castes.",""],
["T1","The National Commission for Scheduled Tribes was created as a separate body by which Constitutional Amendment?",["89th Amendment, 2003","65th Amendment, 1990","86th Amendment, 2002","73rd Amendment, 1992"],"The 65th Amendment had set up one joint commission for SCs and STs; the 89th split it into two.",""],
["T1","Which Article provides grants-in-aid from the Centre to states for the welfare of Scheduled Tribes?",["Article 275(1)","Article 282","Article 280","Article 293"],"The first proviso to Article 275(1) gives grants for tribal welfare and for raising the administration of Scheduled Areas.",""],
["T1","How many Lok Sabha seats are reserved for Scheduled Tribes?",["47","84","79","41"],"47 seats for STs and 84 for SCs, after the 2008 delimitation.",""],
["T1","The Constitution requires a separate minister for tribal welfare in which group of states?",["Chhattisgarh, Jharkhand, Madhya Pradesh and Odisha","Bihar, Jharkhand, Odisha and West Bengal","Assam, Meghalaya, Tripura and Mizoram","Gujarat, Rajasthan, Maharashtra and Madhya Pradesh"],"The proviso to Article 164(1), as changed by the 94th Amendment (2006), names these four; Bihar was dropped.",""],
["T1","The PESA Act, which extended panchayats to Scheduled Areas, was passed in:",["1996","1992","2006","1993"],"The Panchayats (Extension to Scheduled Areas) Act, 1996 followed the Bhuria Committee's report.",""],
["T1","PESA extends the panchayat provisions to the areas of which Schedule?",["Fifth Schedule","Sixth Schedule","Eleventh Schedule","Twelfth Schedule"],"PESA carries Part IX of the Constitution into Fifth Schedule areas; Sixth Schedule areas have their own councils.",""],
["T1","The Ministry of Tribal Affairs was set up in:",["1999","1985","2004","1950"],"It was carved out of the Ministry of Social Justice and Empowerment in October 1999.",""],
["T1","Which committee (1965) laid down the tests used to decide whether a community is a Scheduled Tribe?",["Lokur Committee","Dhebar Commission","Bhuria Committee","Xaxa Committee"],"The Lokur Committee's tests: primitive traits, distinct culture, geographical isolation, shyness of contact and backwardness.",""],
["T1","Which was the first commission on Scheduled Areas and Scheduled Tribes, appointed under Article 339?",["Dhebar Commission","Lokur Committee","Kaka Kalelkar Commission","Bhuria Commission"],"U. N. Dhebar headed it in 1960–61; Dilip Singh Bhuria headed the second (2002–04).",""],
["T1","The full name of the Forest Rights Act, 2006 begins “The Scheduled Tribes and Other Traditional Forest Dwellers …”. What comes next?",["(Recognition of Forest Rights) Act","(Protection of Forests) Act","(Conservation of Forests) Act","(Rehabilitation and Resettlement) Act"],"The Act recognises rights that forest-dwellers already had; it does not grant new land.",""],
["T1","Under the Forest Rights Act, what is the cut-off date for forest occupation?",["13 December 2005","31 December 2007","1 January 2006","15 August 1980"],"The land must have been occupied before 13 December 2005; the Act itself came into force on 31 December 2007.",""],
["T1","Under the Forest Rights Act, “other traditional forest dwellers” must have lived in the forest for at least:",["Three generations (75 years)","Two generations (50 years)","25 years","100 years"],"A generation is counted as 25 years, so three generations means 75 years before 13 December 2005.",""],
["T1","Under the Forest Rights Act, the most land that can be recognised for one claimant is:",["4 hectares","2 hectares","5 hectares","10 hectares"],"Individual land rights are capped at 4 hectares.",""],
["T1","Who is the nodal ministry for the Forest Rights Act?",["Ministry of Tribal Affairs","Ministry of Environment, Forest and Climate Change","Ministry of Rural Development","Ministry of Home Affairs"],"Although the Act is about forests, it is run by the Ministry of Tribal Affairs.",""],
["T1","Under the Forest Rights Act, which body starts the process of deciding forest rights?",["The gram sabha","The district collector","The state forest department","The Tribes Advisory Council"],"The gram sabha receives and checks claims; committees at the sub-division and district levels follow.",""],
["T1","Which tribe became the first to win forest rights inside a tiger reserve, at BR Hills in Karnataka?",["Soliga","Toda","Jenu Kuruba","Irula"],"The Soligas of Biligiri Rangaswamy Temple Tiger Reserve won the rights in 2011.",""],
["T1","Mendha Lekha, famous for its community forest rights and its own bamboo sales, is a village in:",["Maharashtra","Chhattisgarh","Odisha","Jharkhand"],"Mendha Lekha is in Gadchiroli district; its motto is “our government in Delhi and Mumbai, but we are the government in our village”.",""],
["T1","How many Particularly Vulnerable Tribal Groups (PVTGs) are there (as of October 2026)?",["75","52","705","87"],"75 PVTGs live in 18 states and the Andaman and Nicobar Islands. 52 was the first list of 1975; 705 is the number of ST groups.",""],
["T1","Which state has the largest number of PVTGs?",["Odisha","Madhya Pradesh","Jharkhand","Andhra Pradesh"],"Odisha has 13 PVTGs; undivided Andhra Pradesh comes next with 12.",""],
["T1","Which is the only Union Territory with PVTGs?",["Andaman and Nicobar Islands","Lakshadweep","Ladakh","Dadra and Nagar Haveli and Daman and Diu"],"Its five PVTGs are the Great Andamanese, Jarawa, Onge, Sentinelese and Shompen.",""],
["T1","Which of these is NOT a test for naming a group as a PVTG?",["A rising population","A pre-agricultural level of technology","A very low level of literacy","A subsistence economy"],"A PVTG has a stagnant or falling population, not a rising one.",""],
["T1","Before 2006, PVTGs were called:",["Primitive Tribal Groups","Denotified Tribes","Backward Hill Tribes","Nomadic Tribes"],"The term “Primitive Tribal Groups” (1975) was replaced by “Particularly Vulnerable Tribal Groups” in 2006.",""],
["T1","PM JANMAN, a mission for PVTGs, was launched in 2023 at:",["Khunti, Jharkhand","Shahdol, Madhya Pradesh","Bijapur, Chhattisgarh","Ranchi, Jharkhand"],"It was launched at Khunti, Birsa Munda's district, on Janjatiya Gaurav Divas, 15 November 2023.",""],
["T1","The National Sickle Cell Anaemia Elimination Mission was launched in 2023 at:",["Shahdol, Madhya Pradesh","Khunti, Jharkhand","Dantewada, Chhattisgarh","Mayurbhanj, Odisha"],"It was launched on 1 July 2023; sickle cell disease is common in many tribal communities.",""],
["T1","According to Census 2011, Scheduled Tribes make up what share of India's population?",["8.6%","16.6%","10.4%","6.8%"],"About 10.43 crore people. 16.6% is the share of Scheduled Castes.",""],
["T1","According to Census 2011, which is the largest tribe of India?",["Bhil","Gond","Santhal","Mina"],"The Bhils are the largest; the Gonds come second.",""],
["T1","According to Census 2011, which state has the largest number of tribal people?",["Madhya Pradesh","Mizoram","Odisha","Jharkhand"],"Madhya Pradesh has about 1.53 crore STs, 14.7% of India's tribal population.",""],
["T1","Among the states, which has the highest share of Scheduled Tribes in its population (Census 2011)?",["Mizoram","Nagaland","Meghalaya","Arunachal Pradesh"],"Mizoram: 94.4%. Among UTs, Lakshadweep is higher at 94.8%.",""],
["T1","Among states that have Scheduled Tribes, which has the lowest ST share of its population (Census 2011)?",["Uttar Pradesh","Bihar","Tamil Nadu","Kerala"],"Uttar Pradesh is about 0.6%; Tamil Nadu (1.1%) and Bihar (1.3%) come next.",""],
["T1","Which of these has no Scheduled Tribe list at all?",["Haryana","Uttar Pradesh","Goa","Kerala"],"No tribes are notified in Punjab, Haryana, Delhi, Chandigarh and Puducherry.",""],
["T1","Which body buys and markets tribal forest produce and crafts, and runs the Aadi Mahotsav?",["TRIFED","NAFED","KVIC","NCST"],"TRIFED, the Tribal Co-operative Marketing Development Federation, was set up in 1987.",""],
["T1","In 2024, Parliament added the Pahari Ethnic Group, Paddari, Koli and Gadda Brahmin to the ST list of:",["Jammu and Kashmir","Himachal Pradesh","Ladakh","Uttarakhand"],"The Constitution (Jammu and Kashmir) Scheduled Tribes Order (Amendment) Act, 2024 added the four communities.",""],
["T2","The Gaddi people live mainly in which state or UT?",["Himachal Pradesh","Rajasthan","Jammu and Kashmir","Uttarakhand"],"Shepherds of the Dhauladhar range; Bharmour in Chamba is their homeland. They move their flocks up to high pastures in summer and down in winter.","","","",""],
["T2","The Kinnaura people live mainly in which state or UT?",["Himachal Pradesh","Gujarat","Jammu and Kashmir","Kerala"],"The people of Kinnaur on the Sutlej, near the Tibet border.","","","",""],
["T2","The Lahaula people live mainly in which state or UT?",["Himachal Pradesh","Jammu and Kashmir","Uttarakhand","Madhya Pradesh"],"The people of the Lahaul valley beyond the Rohtang Pass.","","","",""],
["T2","The Bakarwal people live mainly in which state or UT?",["Jammu and Kashmir","Chhattisgarh","Madhya Pradesh","Kerala"],"Nomadic goat and sheep herders (Gujjar-Bakarwal) who cross the Pir Panjal with the seasons.","","","",""],
["T2","The Changpa people live mainly in which state or UT?",["Ladakh","Gujarat","Madhya Pradesh","Kerala"],"Nomads of the high Changthang plateau who rear the goats that give pashmina wool.","","","",""],
["T2","The Brokpa people live mainly in which state or UT?",["Ladakh","Kerala","Punjab","Jammu and Kashmir"],"Of the Dah-Hanu villages on the Indus; they speak Brokskat, a Dardic language.","","","",""],
["T2","The Jaunsari people live mainly in which state or UT?",["Uttarakhand","Jammu and Kashmir","Maharashtra","Rajasthan"],"Of Jaunsar-Bawar in Dehradun district; known for the old custom of polyandry.","","","",""],
["T2","The Raji (Ban Rawat) people live mainly in which state or UT?",["Uttarakhand","Kerala","Ladakh","Punjab"],"A PVTG of Pithoragarh district — once forest-dwelling hunter-gatherers.","","","",""],
["T2","The Mina people live mainly in which state or UT?",["Rajasthan","Uttarakhand","Maharashtra","Madhya Pradesh"],"The largest tribe of Rajasthan, in the east of the state (Jaipur, Dausa, Sawai Madhopur).","","","",""],
["T2","The Rathwa people live mainly in which state or UT?",["Gujarat","Uttarakhand","Jammu and Kashmir","Maharashtra"],"Of Chhota Udepur; they paint the ritual Pithora wall paintings.","","","",""],
["T2","The Kotwalia people live mainly in which state or UT?",["Gujarat","Rajasthan","Chhattisgarh","Madhya Pradesh"],"A PVTG of bamboo-workers in south Gujarat.","","","",""],
["T2","The Madia Gond people live mainly in which state or UT?",["Maharashtra","Rajasthan","Chhattisgarh","Kerala"],"A PVTG of Gadchiroli district; Hemalkasa's Lok Biradari hospital serves them.","","","",""],
["T2","The Bharia people live mainly in which state or UT?",["Madhya Pradesh","Gujarat","Kerala","Ladakh"],"A PVTG of the deep Patalkot valley in Chhindwara district.","","","",""],
["T2","The Muria people live mainly in which state or UT?",["Chhattisgarh","Maharashtra","Jammu and Kashmir","Madhya Pradesh"],"A Gond people of Bastar, famous for the ghotul — the village youth dormitory.","","","",""],
["T2","The Abujh Maria people live mainly in which state or UT?",["Chhattisgarh","Jammu and Kashmir","Madhya Pradesh","Maharashtra"],"A PVTG of the remote Abujhmarh hills (Narayanpur).","","","",""],
["T2","The Dandami Maria (Bison-horn Maria) people live mainly in which state or UT?",["Chhattisgarh","Rajasthan","Jammu and Kashmir","Himachal Pradesh"],"Of Dantewada and Bastar — named for the bison-horn head-dress worn in their dance.","","","",""],
["T2","The Bhils, India's largest tribe, live mainly in which group of states?",["Madhya Pradesh, Gujarat, Rajasthan and Maharashtra","Assam, Meghalaya and Tripura","Kerala, Tamil Nadu and Karnataka","Bihar, West Bengal and Odisha"],"The Bhil country runs across western Madhya Pradesh, eastern Gujarat, southern Rajasthan and northern Maharashtra.",""],
["T2","The Bhils are traditionally famous as skilled:",["Archers","Boat-builders","Salt traders","Snake catchers"],"Bhil archers appear in old stories — Eklavya is often linked with them; the name is often traced to a Dravidian word for bow.",""],
["T2","Gondi, the language of the Gonds, belongs to which language family?",["Dravidian","Indo-Aryan","Austro-Asiatic","Tibeto-Burman"],"Gondi is a Dravidian language, like Kurukh of the Oraons.",""],
["T2","The old region of central India called Gondwana is named after which tribe?",["Gond","Bhil","Baiga","Korku"],"Gondwana means the land of the Gonds; geologists later named the ancient supercontinent Gondwanaland after it.",""],
["T2","Rani Durgavati, who fought the Mughal army in 1564, was a queen of which people?",["Gond","Bhil","Santhal","Mina"],"She ruled the Gond kingdom of Garha-Mandla and died fighting Akbar's general Asaf Khan.",""],
["T2","Gond painting received a GI tag in 2023. Which district of Madhya Pradesh did the tag name as its home?",["Dindori","Jhabua","Bastar","Mandla"],"The GI names Dindori, home of Patangarh village, where Jangarh Singh Shyam began. Bastar is in Chhattisgarh.",""],
["T2","Jangarh Singh Shyam, who made Gond art known to the world, belonged to which Gond group?",["Pardhan Gond","Raj Gond","Madia Gond","Muria Gond"],"The Pardhans are the bards and musicians of the Gonds; Jangarh Singh Shyam was a Pardhan Gond of Patangarh.",""],
["T2","The Pardhans are the traditional bards and musicians of which tribe?",["Gond","Bhil","Tharu","Gaddi"],"Pardhans sing the Gond clan stories and genealogies.",""],
["T2","“Bewar”, a form of shifting cultivation without ploughing, is practised by which tribe?",["Baiga","Gaddi","Tharu","Mina"],"The Baigas believed that ploughing hurt Mother Earth, so they farmed burnt hill slopes instead.",""],
["T2","The Baigas, a PVTG, live mainly in:",["Madhya Pradesh and Chhattisgarh","Rajasthan and Gujarat","Himachal Pradesh and Uttarakhand","Assam and Meghalaya"],"They live in the Maikal hills; Baiga Chak in Dindori (MP) is their heartland.",""],
["T2","The ghotul, a village youth dormitory, belongs to which tribe?",["Muria","Baiga","Bhil","Gaddi"],"The Murias of Bastar (Chhattisgarh) run the ghotul; Verrier Elwin wrote about it.",""],
["T2","Which tribe is the only PVTG of Rajasthan?",["Sahariya","Mina","Bhil","Garasia"],"The Sahariyas live mainly in Baran district; they are also a PVTG in Madhya Pradesh.",""],
["T2","Besides Rajasthan, the Sahariyas are a PVTG in which state?",["Madhya Pradesh","Gujarat","Uttar Pradesh","Haryana"],"Sahariyas live in Gwalior, Shivpuri, Guna and nearby districts of Madhya Pradesh.",""],
["T2","Which is the largest tribe of Rajasthan?",["Mina","Bhil","Sahariya","Garasia"],"Minas live in the east of the state; Bhils are the second-largest tribe there.",""],
["T2","The Tharus live mainly in:",["The Terai along the Nepal border","The Nilgiri Hills","The Bastar plateau","The Garo Hills"],"Tharus live in the Terai forests of Uttar Pradesh, Uttarakhand and Bihar, and in Nepal.",""],
["T2","The Gaddis of Himachal Pradesh are traditionally:",["Shepherds","Fishermen","Iron-smelters","Honey gatherers"],"Gaddis move their sheep and goats between the high pastures of the Dhauladhar and the lower hills.",""],
["T2","Bharmour, the homeland of the Gaddis, is in which district?",["Chamba","Kullu","Kinnaur","Shimla"],"Bharmour in Chamba district, Himachal Pradesh, is called Gadderan, the land of the Gaddis.",""],
["T2","The Bhotias of Uttarakhand were traditionally:",["Traders with Tibet across the Himalayan passes","Rice farmers of the Terai","Fishermen of the Ganga","Weavers of Kullu shawls"],"Bhotias of the Mana, Niti and Johar valleys carried grain, salt and wool across the passes.",""],
["T2","Jaunsar-Bawar, home of the Jaunsari tribe, is in which district of Uttarakhand?",["Dehradun","Pithoragarh","Chamoli","Udham Singh Nagar"],"Jaunsar-Bawar is in the north-west of Dehradun district; the Jaunsaris were known for polyandry.",""],
["T2","Pashmina wool comes from goats reared by which nomadic people?",["Changpa","Gaddi","Bakarwal","Bhotia"],"The Changpas rear pashmina goats on the Changthang plateau of Ladakh.",""],
["T2","Warli painting, with white stick figures on mud walls, belongs mainly to which state?",["Maharashtra","Odisha","Assam","Kerala"],"Warlis live in Palghar and Thane districts of Maharashtra and nearby Gujarat; Jivya Soma Mashe made the art famous.",""],
["T2","The Siddis of Gujarat and Karnataka are of what origin?",["African","Tibetan","Persian","Burmese"],"Siddis descend from Africans who came to India centuries ago; Jambur near Gir is a Siddi village.",""],
["T2","Pithora, a ritual wall painting, is made by which tribe?",["Rathwa","Warli","Mina","Tharu"],"The Rathwas of Chhota Udepur (Gujarat) and the Bhilalas paint Pithora on their walls.",""],
["T2","Korku, a language of Madhya Pradesh and Maharashtra, belongs to which family?",["Austro-Asiatic (Munda)","Dravidian","Tibeto-Burman","Indo-Aryan"],"Korku is a Munda language, like Santhali and Mundari, even though its neighbours speak Indo-Aryan and Dravidian languages.",""],
["T2","Patalkot, a deep valley in Chhindwara, is home to which PVTG?",["Bharia","Baiga","Sahariya","Abujh Maria"],"The Bharias of Patalkot live in a deep, horseshoe-shaped valley in the Satpura hills of Chhindwara district.",""],
["T2","Which anthropologist wrote about the Baigas, the Gonds and the Muria ghotul?",["Verrier Elwin","Christoph von Fürer-Haimendorf","B. S. Guha","S. C. Roy"],"Verrier Elwin lived among the tribes of central India; Fürer-Haimendorf is known for the Gonds of Adilabad and the Apatanis.",""],
["T2","Which language serves as the common link language of the Bastar region?",["Halbi","Gondi","Kurukh","Bhili"],"Halbi, an Indo-Aryan speech, is used across Bastar between peoples who speak different mother tongues.",""],
["T2","Which tribe is NOT matched correctly with its state or UT?",["Gaddi — Uttarakhand","Changpa — Ladakh","Mina — Rajasthan","Muria — Chhattisgarh"],"The Gaddis belong to Himachal Pradesh.",""],
["T3","The homeland of the Santhal tribe is:",["Santhal Parganas (Jharkhand)","Keonjhar (Odisha)","Bonda Hills, Malkangiri (Odisha)","Netarhat plateau (Jharkhand)"],"India's third-largest tribe; also in West Bengal, Odisha, Bihar and Assam.","","","",""],
["T3","The homeland of the Ho tribe is:",["Kolhan (West Singhbhum, Jharkhand)","Santhal Parganas (Jharkhand)","Gajapati district (Odisha)","Niyamgiri Hills (Odisha)"],"They speak Ho, a Munda language, written in the Warang Citi script.","","","",""],
["T3","The homeland of the Munda tribe is:",["Ranchi–Khunti plateau (Jharkhand)","Netarhat plateau (Jharkhand)","Gajapati district (Odisha)","Kolhan (West Singhbhum, Jharkhand)"],"Birsa Munda's people; they speak Mundari.","","","",""],
["T3","The homeland of the Sauria Paharia tribe is:",["Rajmahal Hills (Jharkhand)","Santhal Parganas (Jharkhand)","Netarhat plateau (Jharkhand)","Gajapati district (Odisha)"],"A PVTG; with the Mal Paharia, among the oldest people of the Rajmahal Hills.","","","",""],
["T3","The homeland of the Asur tribe is:",["Netarhat plateau (Jharkhand)","Gajapati district (Odisha)","Bonda Hills, Malkangiri (Odisha)","Niyamgiri Hills (Odisha)"],"A PVTG who were traditional iron-smelters.","","","",""],
["T3","The homeland of the Dongria Kondh tribe is:",["Niyamgiri Hills (Odisha)","Ranchi–Khunti plateau (Jharkhand)","Netarhat plateau (Jharkhand)","Bonda Hills, Malkangiri (Odisha)"],"A PVTG whose gram sabhas voted against bauxite mining on their sacred hill in 2013.","","","",""],
["T3","The homeland of the Bonda tribe is:",["Bonda Hills, Malkangiri (Odisha)","Ranchi–Khunti plateau (Jharkhand)","Keonjhar (Odisha)","Kolhan (West Singhbhum, Jharkhand)"],"A PVTG; the women wear layers of bead necklaces and metal neck rings and shave their heads.","","","",""],
["T3","The homeland of the Juang tribe is:",["Keonjhar (Odisha)","Kolhan (West Singhbhum, Jharkhand)","Totopara, Alipurduar (West Bengal)","Ranchi–Khunti plateau (Jharkhand)"],"A PVTG of the Keonjhar hills, once shifting cultivators.","","","",""],
["T3","The homeland of the Saora (Sora) tribe is:",["Gajapati district (Odisha)","Keonjhar (Odisha)","Santhal Parganas (Jharkhand)","Netarhat plateau (Jharkhand)"],"Known for idital wall paintings and their own script, Sorang Sompeng.","","","",""],
["T3","The homeland of the Toto tribe is:",["Totopara, Alipurduar (West Bengal)","Kolhan (West Singhbhum, Jharkhand)","Santhal Parganas (Jharkhand)","Keonjhar (Odisha)"],"A PVTG living in one village near the Bhutan border.","","","",""],
["T3","The Santhal Parganas, the homeland of the Santhals, is now in which state?",["Jharkhand","West Bengal","Odisha","Bihar"],"The Santhal Parganas division is in north-east Jharkhand; it was formed after the Hul of 1855.",""],
["T3","Santhali belongs to which language family?",["Austro-Asiatic","Dravidian","Indo-Aryan","Tibeto-Burman"],"Santhali is the largest of the Munda languages, a branch of Austro-Asiatic.",""],
["T3","Kurukh, the language of the Oraons, belongs to which family?",["Dravidian","Austro-Asiatic","Indo-Aryan","Tibeto-Burman"],"Kurukh is Dravidian, unlike the Munda languages spoken by the Santhals, Mundas and Hos around them.",""],
["T3","The “khuntkatti” system of joint clan ownership of land belongs to which tribe?",["Munda","Bhil","Toda","Gaddi"],"Under khuntkatti, the descendants of the founders who cleared the forest held the land together; its break-up fed Birsa's movement.",""],
["T3","Which is the largest tribe of Odisha?",["Kondh","Santhal","Bonda","Juang"],"The Kondhs (Kandhas) are Odisha's largest tribe; Kandhamal district is named after them.",""],
["T3","Kandhamal district of Odisha takes its name from which tribe?",["Kondh","Juang","Saora","Bonda"],"Kandhamal means the land of the Kandhas, or Kondhs.",""],
["T3","Which state has the largest number of Scheduled Tribe communities — 62?",["Odisha","Jharkhand","Madhya Pradesh","Assam"],"Odisha has 62 tribes, including 13 PVTGs.",""],
["T3","The Dongria Kondhs worship which hill as the seat of their god Niyam Raja?",["Niyamgiri","Mahendragiri","Deomali","Gandhamardan"],"In 2013 their gram sabhas rejected bauxite mining on the Niyamgiri hills, after the Supreme Court asked them to decide.",""],
["T3","In 2013, who did the Supreme Court say must decide whether bauxite could be mined in the Niyamgiri hills?",["The gram sabhas of the area","The Governor of Odisha","The Ministry of Mines","The National Commission for Scheduled Tribes"],"The court held that under the Forest Rights Act the local gram sabhas must decide; all of them said no.",""],
["T3","Bonda women are known for wearing:",["Layers of bead necklaces and metal neck rings","Nose plugs and facial tattoos","Bison-horn head-dresses","Long white shawls"],"Bonda women of Malkangiri also shave their heads. Nose plugs and tattoos belong to the Apatanis of Arunachal.",""],
["T3","Idital wall paintings are the art of which tribe of Odisha?",["Saora","Bonda","Kondh","Juang"],"Saora idital paintings are made to honour spirits and ancestors.",""],
["T3","The Asur, a PVTG of Jharkhand, were traditionally:",["Iron-smelters","Shepherds","Salt makers","Boat-builders"],"The Asurs of the Netarhat plateau smelted iron from local ore.",""],
["T3","The Birhors of Jharkhand are known as wandering:",["Monkey-catchers and rope-makers","Fishermen","Potters","Weavers"],"The Birhors, a PVTG, lived in forest camps called tanda and made ropes from creeper fibre.",""],
["T3","The Hos are the main tribe of which region of Jharkhand?",["Kolhan","Santhal Parganas","Palamu","Damodar valley"],"Kolhan (the Singhbhum area) is the land of the Hos.",""],
["T3","The Tana Bhagat movement of 1914 arose among which tribe?",["Oraon","Santhal","Munda","Ho"],"Jatra Bhagat began it among the Oraons, rejecting taxes, liquor and spirit worship; the Tana Bhagats later followed Gandhi.",""],
["T3","Which of these is a Dravidian-speaking tribe of the Chota Nagpur plateau?",["Oraon","Santhal","Munda","Ho"],"The Oraons speak Kurukh; the Santhals, Mundas and Hos speak Munda (Austro-Asiatic) languages.",""],

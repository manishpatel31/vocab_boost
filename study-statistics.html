ssion", "scatter diagram, Pearson and Spearman, regression lines, association of attributes, multiple and partial correlation (three variables)", "L6, L7"], ["Probability theory", "definitions, conditional and compound probability, independence, Bayes’ theorem", "L8"], ["Random variable and distributions", "expectation, variance, higher moments, binomial, Poisson, normal, exponential, joint distribution of two discrete variables", "L9–L11"], ["Sampling theory", "population and sample, parameter and statistic, sampling and non-sampling errors, sampling methods, sampling distributions, sample size", "L12"], ["Statistical inference", "point and interval estimation, properties of estimators, methods of estimation, testing of hypotheses, Z, t, χ² and F tests", "L13–L15"], ["Analysis of variance", "one-way and two-way classified data", "L16"], ["Time series analysis", "components, trend by different methods, seasonal variation", "L17"], ["Index numbers", "construction problems, types and formulae, base shifting and splicing, cost of living index, uses", "L18"]]}, {"k": "p", "h": "<b>Statistics</b> means two things: numerical facts collected for a purpose (plural sense — “the statistics of rainfall”), and the science of collecting, presenting, analysing and interpreting such data (singular sense). The whole group you are interested in is the <b>population</b>; the part you actually observe is a <b>sample</b>. A number that describes a population is a <b>parameter</b> (μ, σ, P); the same kind of number worked out from a sample is a <b>statistic</b> (x̄, s, p). Inference (L13–L15) is the art of judging a parameter from a statistic."}, {"k": "table", "title": "Variables and scales of measurement", "head": ["Idea", "Meaning", "Examples"], "rows": [["Qualitative (attribute)", "a quality, not measured in numbers", "gender, blood group, colour"], ["Quantitative · discrete", "countable values with gaps", "children in a family, defects per item"], ["Quantitative · continuous", "any 5 mark"], "ans": "0.125 mark (positive)", "tip": "If you can strike out one or two options the expected gain rises sharply — this is expectation (L9) at work."}, {"k": "facts", "title": "A 10-week plan that works for this paper", "rows": [["Weeks 1–2", "L2–L5: descriptive statistics. Make your own formula sheet; do every numeric question here without a calculator"], ["Weeks 3–4", "L6–L7 correlation and regression, L8 probability"], ["Weeks 5–6", "L9–L11 random variables and distributions (binomial, Poisson, normal are the scoring core)"], ["Weeks 7–8", "L12–L16 sampling, estimation, tests, ANOVA — learn the table of test statistics and degrees of freedom"], ["Week 9", "L17–L18 time series and index numbers (quick, formula-driven marks)"], ["Week 10", "full mocks of 100 questions in 2 hours; revise the traps tab daily"], ["Every day", "20 mixed questions in Practice; redo the Mistakes list on weekends"]]}, {"k": "trick", "h": "<b>Two passes.</b> In the first pass answer the one-step questions (definitions, direct formula) — they are worth the same 2 marks as a long calculation. In the second pass do the calculations. <b>Use the options:</b> a correlation must lie in [−1, 1], a probability in [0, 1], a variance cannot be negative, and the GM of positive numbers lies between the HM and the AM — such checks remove wrong options in seconds."}, {"k": "trap", "h": "<b>Parameter ≠ statistic:</b> μ and σ belong to the population, x̄ and s to the sample. <b>Discrete vs continuous:</b> “number of children” is discrete even though its mean (2.4) is a decimal. <b>Interval vs ratio:</b> temperature in °C has no true zero, so “twice as hot” is meaningless. <b>Σx² is not (Σx)²</b>."}, {"k": "link", "h": "Σ rules and x̄ return in every formula of L3–L7; the population/sample split decides whether you divide by n or by n − 1 (L4, L13)."}, {"k": "q", "q": "Which scale of measurement has a true zero?", "o": ["Ratio", "Interval", "Ordinal", "Nominal"], "e": "Only the ratio scale has a true zero, so only there are ratios like “twice as much” meaningful."}], "sum": ["Paper II: 100 questions, 200 marks, 2 hours; 0.50 negative marking as reported for recent cycles — confirm in the notice", "Parameter (μ, σ) describes a population; statistic (x̄, s) describes a sample", "Discrete = countable, continuous = measurable; qualitative variables are attributes", "Scales: nominal (names) < ordinal (order) < interval (equal gaps) < ratio (true zero)", "Σc = nc, Σ(x − x̄) = 0, variance = Σx²/n − x̄²"]},

he variable", "inequality of income or wealth"]]}, {"k": "ex", "q": "A family spends ₹1,200 of its ₹4,800 budget on food. What angle does food get in a pie chart?", "steps": ["Angle = (value/total) × 360°", "= (1200/4800) × 360° = (1/4) × 360°"], "ans": "90°"}, {"k": "ex", "q": "Classes are 0–10, 10–20, 20–40, 40–70 with frequencies 5, 8, 12, 9. Find the heights of the histogram rectangles.", "steps": ["Unequal widths → plot frequency density = f/width", "0–10: 5/10 = 0.5; 10–20: 8/10 = 0.8", "20–40: 12/20 = 0.6; 40–70: 9/30 = 0.3"], "ans": "0.5, 0.8, 0.6, 0.3 (per unit width)", "tip": "If the question uses the smallest width (10) as the unit, multiply each by 10: 5, 8, 6, 3."}, {"k": "ex", "q": "Using Sturges’ rule, how many classes suit 100 observations? If the range is 56, what width should they have?", "steps": ["k = 1 + 3.322 log₁₀100 = 1 + 3.322 × 2 = 7.644", "Round to a whole number of classes: about 8", "Width ≈ 56/8 = 7"], "ans": "8 classes of width 7"}, {"k": "trick", "h": "<b>Histogram → mode, ogive → median.</b> The two ogives (less than and more than) cross at the median; drop a perpendicular to the x-axis. <b>Pie chart:</b> 1% of the total is 3.6°."}, {"k": "trap", "h": "<b>Class limits vs class boundaries:</b> in 10–19, 20–29 the limits are 10 and 19 but the boundaries are 9.5 and 19.5 — widths and histograms use boundaries. <b>Histogram heights with unequal classes</b> are densities, not frequencies. <b>Bar diagrams</b> have gaps between bars and are one-dimensional; histograms have no gaps and their <i>area</i> carries the frequency. <b>Secondary data</b> are not “less accurate” by definition — they are simply reused."}, {"k": "link", "h": "Grouped frequency tables built here are the input of the grouped mean, median and mode (L3) and of the grouped SD (L4)."}, {"k": "q", "q": "Which graph is used to find the median graphically?", "o": ["Ogive", "Histogram", "Pie chart", "Bar diagram"], "e": "The less-than and more-than ogives intersect at the median."}], "sum": ["Primary data: first-hand for the purpose; secondary: collected by others, check suitability before use", "Table parts: number, title, caption (columns), stub (rows), body, head-note, foot-note, source", "Class mark = (L + U)/2; width = difference of boundaries; Sturges k = 1 + 3.322 log₁₀N", "Pie angle = value/total × 360°; histogram with unequal widths uses f/width", "Histogram locates the mode; ogives locate the median and quartiles; Lorenz curve shows inequality"]}

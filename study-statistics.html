ual variances = homoscedasticity"]]}, {"k": "ex", "q": "Three methods give: A 5, 7, 6; B 8, 9, 10; C 4, 5, 6. Test whether the methods differ (F₀.₀₅(2, 6) = 5.14).", "steps": ["G = 60, N = 9, CF = 60²/9 = 400", "ΣΣx² = 432 → TSS = 32", "SST = (18² + 27² + 15²)/3 − 400 = 26; SSE = 6", "MST = 26/2 = 13; MSE = 6/6 = 1; F = 13"], "ans": "F = 13 &gt; 5.14 → the methods differ"}, {"k": "ex", "q": "In a one-way ANOVA with 4 treatments and 20 observations, SST = 60 and SSE = 80. Find F.", "steps": ["df: treatments 3, error 16", "MST = 60/3 = 20; MSE = 80/16 = 5", "F = 20/5"], "ans": "F = 4 with (3, 16) df"}, {"k": "trick", "h": "<b>Fill the table by df first</b>: total N − 1 splits into treatments k − 1 and error N − k. Then MS = SS/df and F = MS/MS(error). <b>SS add up; MS do not.</b>"}, {"k": "trap", "h": "<b>F is MS(between)/MS(within)</b>, not SS/SS. <b>Error df in two-way (one value per cell) is (r − 1)(c − 1)</b>, not rc − 1. <b>ANOVA tests means</b>, even though it is named after variance. <b>A significant F does not say which means differ.</b>"}, {"k": "link", "h": "With two groups, one-way ANOVA is the two-sample t test: F = t². Its F ratio is the F distribution of L15; its sums of squares split variance as in L4."}, {"k": "q", "q": "In one-way ANOVA with 5 groups and 30 observations, the error degrees of freedom are:", "o": ["25", "29", "4", "24"], "e": "N − k = 30 − 5 = 25."}], "sum": ["TSS = SST + SSE; df N − 1 = (k − 1) + (N − k)", "CF = G²/N; TSS = ΣΣx² − CF; SST = ΣTᵢ²/nᵢ − CF", "F = MST/MSE with (k − 1, N − k) df", "Two-way: df rc − 1 = (r − 1) + (c − 1) + (r − 1)(c − 1); two F ratios", "Assumptions: normality, independence, equal variances, additivity"]},
{"id": "L17", "heat": 2, "title": "Time series analysis", "hi": "काल श्रेणी विश्लेषण", "blocks": [{"k": "hot", "h": "<b>Quick, formula-based marks.</b> Name the component from a description (trend, seasonal, cyclical, irregular), additive versus multiplicative models, moving averages (odd and even periods), the least-squares trend with coded years, and seasonal indices: methods, adjustment to 400 (or 1200), and deseasonalising."}, {"k": "p", "h": "A <b>time series</b> is a set of values recorded at successive times. Its movement is split into four <b>components</b>: the long-run <b>secular trend</b> (T), <b>seasonal</b> variation (S) that repeats within a year (festival sales, crop seasons), <b>cyclical</b> variation (C) that lasts more than a year (business cycles: prosperity, recession, depression, recovery) and <b>irregular</b> variation (I) caused by unpredictable events (floods, strikes)."}, {"k": "formula", "title": "Models and trend", "rows": [["Additive model", "Y = T + S + C + I", "components independent; seasonal effects add to 0"], ["Multiplicative model", "Y = T × S × C × I", "more common; seasonal indices average 100"], ["Semi-averages", "average each half; join the two points", "simple, affected by extremes"], ["Moving average (odd k)", "average of k successive values, placed at the middle one", "3-yearly: (y₁ + y₂ + y₃)/3, …"], ["Moving average (even k)", "average, then centre by averaging pairs (2 × 4 MA)", "loses values at both ends"], ["Least squares, linear", "y = a + bx; with Σx = 0: a = Σy/n, b = Σxy/Σx²", "code odd n as …, −1, 0, 1, …; even n as …, −3, −1, 1, 3, …"], ["Other curves", "parabola y = a + bx + cx²; exponential y = abˣ (fit log y)", ""]]}, {"k": "formula", "title": "Seasonal variation", "rows": [["Simple averages", "average each season over years, express as % of the grand average", "assumes no trend"], ["Ratio to trend", "Y/T × 100 for each period, then average by season", "multiplicative"], ["Ratio to moving average", "Y / (centred 12-month or 4-quarter MA) × 100", "the most widely used"], ["Link relatives", "each season as % of the previous one, chained", "Pearson’s method"], ["Adjustment", "multiply indices by 400/Σ (quarters) or 1200/Σ (months)", "additive model: make them sum to 0"], ["Deseasonalised value", "Y / S × 100 (multiplicative); Y − S (additive)", ""]]}, {"k": "ex", "q": "Sales (₹ lakh) for 2019–2023 are 10, 12, 15, 16, 22. Fit a straight-line trend by least squares and estimate 2025.", "steps": ["Code x = −2, −1, 0, 1, 2 (origin 2021); Σy = 75, Σx² = 10", "Σxy = −20 − 12 + 0 + 16 + 44 = 28", "a = 75/5 = 15, b = 28/10 = 2.8 → y = 15 + 2.8x", "2025 → x = 4: y = 15 + 2.8 × 4"], "ans": "26.2 (₹ lakh)"}, {"k": "ex", "q": "Find the 3-yearly moving averages of 20, 24, 22, 28, 30, 27, 33.", "steps": ["(20 + 24 + 22)/3 = 22", "(24 + 22 + 28)/3 = 24.67, (22 + 28 + 30)/3 = 26.67", "(28 + 30 + 27)/3 = 28.33, (30 + 27 + 33)/3 = 30"], "ans": "22, 24.67, 26.67, 28.33, 30 (placed against the 2nd to 6th years)"}, {"k": "ex", "q": "Quarterly seasonal indices come out as 90, 110, 105, 103. Adjust them.", "steps": ["Σ = 408; they should total 400", "Multiply each by 400/408"], "ans": "88.24, 107.84, 102.94, 100.98"}, {"k": "trick", "h": "<b>Within a year → seasonal; more than a year, wave-like → cyclical; sudden one-off → irregular; decades → trend.</b> <b>Moving average period = length of the cycle</b> removes that cycle. <b>Coded x with Σx = 0</b> makes a and b one-line divisions."}, {"k": "trap", "h": "<b>Even-period moving averages must be centred.</b> <b>Seasonal indices total 400 for quarters and 1200 for months</b> (multiplicative). <b>With even n, coding by −3, −1, 1, 3 makes x half-years</b>: b is then the change per half-year, so double it for a yearly change. <b>Moving averages lose values at the ends</b> and cannot forecast."}, {"k": "link", "h": "The least-squares trend is the regression of y on time (L7). Deseasonalised and deflated series (L18) let you compare like with like."}, {"k": "q", "q": "A rise in demand for umbrellas every monsoon is an example of:", "o": ["seasonal variation", "secular trend", "cyclical variation", "irregular variation"], "e": "It repeats within each year at the same season."}], "sum": ["Components: trend, seasonal (within a year), cyclical (> 1 year, business cycle), irregular", "Additive Y = T + S + C + I; multiplicative Y = T × S × C × I", "Trend: freehand, semi-averages, moving averages (centre even periods), least squares a = Σy/n, b = Σxy/Σx²", "Seasonal: simple averages, ratio to trend, ratio to moving average, link relatives; adjust to 400/1200", "Deseasonalised = Y/S × 100"]},
{"id": "L18", "heat": 3, "title": "Index numbers", "hi": "सूचकांक", "blocks": [{"k": "hot", "h": "<b>Asked in every paper.</b> Laspeyres, Paasche, Fisher, Marshall–Edgeworth and Dorbish–Bowley from a small table; which formula satisfies the time-reversal and factor-reversal tests; base shifting, splicing and chain indices; the cost of living index (aggregate expenditure and family budget methods); real wages and purchasing power."}, {"k": "p", "h": "An <b>index number</b> measures the relative change in a group of related variables (prices, quantities) between a <b>base period</b> (index 100) and a <b>current period</b>. Building one raises fixed problems: its purpose, the choice of base (a normal period), the items, the source of prices, the weights, the average (AM or GM) and the formula. Weighting by base-year quantities q₀ gives <b>Laspeyres</b>; by current quantities q₁ gives <b>Paasche</b>; their geometric mean is <b>Fisher’s ideal index</b>."}, {"k": "formula", "title": "Price index formulae (×100)", "rows": [["Simple aggregative", "Σp₁/Σp₀", "fails the units test"], ["Simple average of relatives", "Σ(p₁/p₀ × 100)/n", "GM of relatives satisfies the circular test"], ["Laspeyres", "Σp₁q₀ / Σp₀q₀", "base-year quantities; tends to overstate"], ["Paasche", "Σp₁q₁ / Σp₀q₁", "current quantities; tends to understate"], ["Fisher (ideal)", "√(Laspeyres × Paasche)", "satisfies time and factor reversal"], ["Marshall–Edgeworth", "Σp₁(q₀ + q₁) / Σp₀(q₀ + q₁)", "satisfies time reversal"], ["Dorbish–Bowley", "(Laspeyres + Paasche)/2", "AM of the two"], ["Kelly (fixed weights)", "Σp₁q / Σp₀q, q fixed", "satisfies time reversal and the circular test"], ["Quantity index", "swap p and q: Laspeyres Σq₁p₀/Σq₀p₀", "value index Σp₁q₁/Σp₀q₀"]]}, {"k": "table", "title": "Tests of adequacy", "head": ["Test", "Condition", "Satisfied by"], "rows": [["Unit test", "free of the units of measurement", "every formula except the simple aggregative"], ["Time reversal", "P₀₁ × P₁₀ = 1", "Fisher, Marshall–Edgeworth, Kelly, simple aggregative, simple GM of relatives — not Laspeyres or Paasche"], ["Factor reversal", "P₀₁ × Q₀₁ = Σp₁q₁/Σp₀q₀ (the value ratio)", "Fisher only"], ["Circular test", "P₀₁ × P₁₂ × P₂₀ = 1", "simple GM of relatives, simple aggregative and Kelly’s fixed-weight index; not Fisher, Laspeyres or Paasche"]]}, {"k": "formula", "title": "Using index numbers", "rows": [["Chain index", "link relative = p₁/p₀ × 100; chain index = (link relative × previous chain index)/100", "base changes every year"], ["Base shifting", "new index = old index / (old index of the new base year) × 100", "old index 156, old index of the new base year 120 → 156/120 × 100 = 130"], ["Splicing", "multiply the new series by (old index of the link year)/100", "joins two series into one"], ["Deflating", "real value = money value / price index × 100", "real wage"], ["Purchasing power of money", "100 / price index", "index 125 → 0.80 (80 paise)"], ["Cost of living index", "aggregate expenditure: Σp₁q₀/Σp₀q₀ × 100; family budget: ΣIV/ΣV with I = p₁/p₀ × 100, V = p₀q₀", "the two methods give the same answer"]]}, {"k": "ex", "q": "Prices p₀ = 10, 8, 5 and p₁ = 12, 10, 6; quantities q₀ = 4, 5, 10 and q₁ = 5, 4, 12. Find the Laspeyres, Paasche and Fisher indices.", "steps": ["Σp₀q₀ = 40 + 40 + 50 = 130; Σp₁q₀ = 48 + 50 + 60 = 158 → L = 158/130 × 100 ≈ 121.54", "Σp₀q₁ = 50 + 32 + 60 = 142; Σp₁q₁ = 60 + 40 + 72 = 172 → P = 172/142 × 100 ≈ 121.13", "F = √(121.54 × 121.13) ≈ 121.33"], "ans": "L ≈ 121.54, P ≈ 121.13, F ≈ 121.33"}, {"k": "ex", "q": "A worker’s wage rose from ₹20,000 to ₹27,000 while the consumer price index rose from 100 to 150. Find the real wage and say whether the worker is better off.", "steps": ["Real wage = 27000/150 × 100 = 18,000 (in base-year rupees)", "18,000 &lt; 20,000"], "ans": "₹18,000 — worse off by 10%"}, {"k": "ex", "q": "Indices on base 2015 = 100 are 2019: 125 and 2023: 150. Shift the base to 2019.", "steps": ["New index = old / 125 × 100", "2019 → 100; 2023 → 150/125 × 100 = 120"], "ans": "2019: 100, 2023: 120"}, {"k": "trick", "h": "<b>L-q₀, P-q₁</b>: Laspeyres looks back (base quantities), Paasche looks at the present. <b>Fisher between them:</b> F lies between L and P, and so do Marshall–Edgeworth and Dorbish–Bowley. <b>Only Fisher passes factor reversal</b>; Laspeyres and Paasche fail both reversal tests."}, {"k": "trap", "h": "<b>Do not swap the weights</b> — Laspeyres uses q₀ in numerator and denominator; Paasche uses q₁ in both. <b>Fisher does not satisfy the circular test.</b> <b>Base shifting divides by the old index of the new base</b>, not by 100. <b>Family budget method weights are values p₀q₀</b>, not quantities."}, {"k": "link", "h": "An index number is a weighted mean (L3): Laspeyres is the weighted AM of price relatives with weights p₀q₀. Deflating with a CPI parallels deseasonalising a time series (L17)."}, {"k": "q", "q": "Which index number satisfies the factor reversal test?", "o": ["Fisher’s", "Laspeyres’", "Paasche’s", "Marshall–Edgeworth’s"], "e": "Only Fisher’s ideal index satisfies P₀₁ × Q₀₁ = Σp₁q₁/Σp₀q₀."}], "sum": ["Laspeyres Σp₁q₀/Σp₀q₀; Paasche Σp₁q₁/Σp₀q₁; Fisher √(L × P)", "Marshall–Edgeworth uses q₀ + q₁; Dorbish–Bowley = (L + P)/2", "Time reversal: Fisher, M–E, Kelly; factor reversal: Fisher only; circular: GM of relatives, Kelly", "Base shift: old/old(new base) × 100; real wage = money wage/CPI × 100; purchasing power = 100/CPI", "Cost of living: aggregate expenditure Σp₁q₀/Σp₀q₀ = family budget ΣIV/ΣV with V = p₀q₀"]}
//@@L

["L4", "Group 1: 40 items, mean 50, variance 16. Group 2: 60 items, mean 45, variance 25. The variance of the combined group is:", ["27.4", "21.4", "20.5", "47"], "Combined mean = 47; d₁ = 3, d₂ = −2; σ² = [40(16 + 9) + 60(25 + 4)]/100 = (1000 + 1740)/100 = 27.4. (21.4 forgets the d² terms.)", "p"],
["L4", "For a sample of 10 observations the variance computed with divisor n is 18. The unbiased estimate (divisor n − 1) is:", ["20", "16.2", "18", "19"], "s² = nσ²/(n − 1) = 10 × 18/9 = 20."],
["L4", "For 10 observations Σx = 60 and Σx² = 400. The standard deviation is:", ["2", "4", "6.32", "40"], "Mean = 6; variance = 400/10 − 36 = 4; SD = 2."],
["L4", "The coefficient of variation is 20% and the mean is 35. The standard deviation is:", ["7", "1.75", "5.71", "70"], "σ = CV × x̄/100 = 20 × 35/100 = 7."],
["L4", "For a normal distribution with SD 15, the quartile deviation is approximately:", ["10", "12", "15", "7.5"], "QD ≈ (2/3)σ = 10. (12 is the mean deviation, (4/5)σ.)"],
["L4", "Which of these is a relative measure of dispersion?", ["Coefficient of variation", "Standard deviation", "Quartile deviation", "Mean deviation"], "A relative measure is a pure number (a ratio); SD, QD and MD carry the units of the data."],
["L4", "Every observation of a data set is increased by 10. The standard deviation:", ["does not change", "increases by 10", "increases by √10", "becomes 10 times"], "Adding a constant shifts every value and the mean equally, so deviations — and the SD — do not change."],
["L4", "Every observation is multiplied by −2. The new standard deviation is:", ["2 times the old SD", "−2 times the old SD", "4 times the old SD", "the same as the old SD"], "σ(bx) = |b|σ = 2σ. The SD can never be negative."],
["L4", "A data set has mean 50 and CV 10%. If 10 is added to every observation, the new CV is:", ["8.33%", "10%", "12%", "20%"], "SD = 5 stays the same; the new mean is 60, so CV = 5/60 × 100 = 8.33%."],
["L4", "The variance of a set of observations that are all equal to 7 is:", ["0", "7", "49", "1"], "Every deviation from the mean is 0, so the variance is 0."],
["L4", "For 20 observations the mean is 10 and the SD is 2. It was later found that an observation 8 had been wrongly read as 12. The correct SD is:", ["1.99", "2", "2.1", "1.8"], "Σx = 200 → 196; Σx² = 20(4 + 100) = 2080 → 2080 − 144 + 64 = 2000. Mean = 9.8; variance = 100 − 96.04 = 3.96; SD ≈ 1.99."],
["L5", "The first central moment (about the mean) of any distribution is:", ["0", "1", "the mean", "the variance"], "μ₁ = Σ(x − x̄)/n = 0 always."],
["L5", "The second central moment μ₂ is equal to the:", ["variance", "standard deviation", "mean deviation", "square of the mean"], "μ₂ = Σ(x − x̄)²/n = σ².", "p"],
["L5", "The first two moments about 10 are 2 and 20. The mean and variance are:", ["12 and 16", "12 and 20", "2 and 16", "10 and 18"], "Mean = 10 + μ₁′ = 12; μ₂ = μ₂′ − μ₁′² = 20 − 4 = 16."],
["L5", "The first three moments about 4 are 1, 4 and 10. The third central moment μ₃ is:", ["0", "10", "−2", "4"], "μ₃ = μ₃′ − 3μ₂′μ₁′ + 2μ₁′³ = 10 − 12 + 2 = 0, so the distribution is symmetric."],
["L5", "The first four moments about 3 are −1, 10, −30 and 200. The fourth central moment μ₄ is:", ["137", "200", "260", "146"], "μ₄ = μ₄′ − 4μ₃′μ₁′ + 6μ₂′μ₁′² − 3μ₁′⁴ = 200 − 120 + 60 − 3 = 137."],
["L5", "For a distribution μ₂ = 4 and μ₄ = 60. The value of β₂ and the shape are:", ["3.75, leptokurtic", "3.75, platykurtic", "15, leptokurtic", "0.75, platykurtic"], "β₂ = μ₄/μ₂² = 60/16 = 3.75 > 3 → more peaked than normal: leptokurtic.", "p"],
["L5", "For a distribution μ₂ = 9 and μ₃ = −13.5. The value of β₁ is:", ["0.25", "−0.25", "0.5", "1.5"], "β₁ = μ₃²/μ₂³ = 182.25/729 = 0.25. β₁ is a square, so it is never negative."],
["L5", "For a distribution μ₂ = 4 and μ₃ = 4. The moment coefficient of skewness γ₁ = μ₃/σ³ is:", ["0.5", "1", "0.25", "2"], "σ = 2, σ³ = 8 → γ₁ = 4/8 = 0.5."],
["L5", "Mean = 60, mode = 54, SD = 12. Karl Pearson’s coefficient of skewness is:", ["0.5", "−0.5", "1.5", "0.6"], "Sk = (Mean − Mode)/σ = 6/12 = 0.5.", "p"],
["L5", "Mean = 30, median = 32, SD = 6. Karl Pearson’s coefficient of skewness is:", ["−1", "−0.33", "1", "0.33"], "Sk = 3(Mean − Median)/σ = 3(−2)/6 = −1."],
["L5", "Q₁ = 15, median = 25 and Q₃ = 30. Bowley’s coefficient of skewness is:", ["−0.33", "0.33", "−0.2", "0.2"], "(Q₃ + Q₁ − 2Md)/(Q₃ − Q₁) = (30 + 15 − 50)/15 = −5/15 = −0.33.", "p"],
["L5", "Bowley’s coefficient of skewness always lies between:", ["−1 and +1", "−3 and +3", "0 and 1", "0 and 3"], "Because |Q₃ + Q₁ − 2Md| can never exceed Q₃ − Q₁."],
["L5", "In a distribution, Mean > Median > Mode. The distribution is:", ["positively skewed", "negatively skewed", "symmetric", "mesokurtic"], "The mean is pulled furthest towards the long right tail."],
["L5", "A distribution has a long tail to the left. Which is true?", ["Mean < Median < Mode", "Mean > Median > Mode", "Mean = Median = Mode", "Median > Mode > Mean"], "Negative skew: the mean is pulled left of the median, which is left of the mode."],
["L5", "A curve with β₂ = 3 is called:", ["mesokurtic", "leptokurtic", "platykurtic", "bimodal"], "β₂ = 3 is the normal curve’s value — mesokurtic. γ₂ = β₂ − 3 = 0."],
["L5", "Karl Pearson’s coefficient of skewness is 0.5, the mean is 40 and the SD is 10. The mode is:", ["35", "45", "39.5", "20"], "Mode = Mean − Sk × σ = 40 − 5 = 35."],
["L5", "Karl Pearson’s coefficient of skewness is −0.6, the SD is 5 and the median is 20. The mean is:", ["19", "21", "17", "23"], "Sk = 3(Mean − Median)/σ → Mean = 20 + (−0.6 × 5)/3 = 20 − 1 = 19."],
["L5", "Kelly’s coefficient of skewness is based on:", ["the 10th and 90th percentiles and the median", "the quartiles and the median", "the mean and the mode", "the third and second central moments"], "Kelly uses P₁₀, P₅₀ and P₉₀ so that more of the data is used than in Bowley’s quartile measure."],
["L5", "Which of the following is unaffected by a change of origin and scale?", ["β₂", "μ₂", "μ₃", "the mean"], "β₂ = μ₄/μ₂² is a pure number: the bʳ factors cancel."],
["L5", "The first four moments about the mean of a distribution are 0, 5, 2 and 60. Its β₂ is:", ["2.4", "12", "3", "0.16"], "β₂ = μ₄/μ₂² = 60/25 = 2.4 (platykurtic)."],
["L5", "The first two moments about 3 are −1 and 10. The mean and variance are:", ["2 and 9", "4 and 9", "2 and 11", "−1 and 10"], "Mean = 3 + (−1) = 2; μ₂ = 10 − (−1)² = 9."],
["L5", "Q₁ = 20, Q₃ = 50 and Bowley’s coefficient of skewness is 0.2. The median is:", ["32", "35", "38", "29"], "0.2 × 30 = 70 − 2Md → 6 = 70 − 2Md → Md = 32."],
["L6", "Karl Pearson’s coefficient of correlation always lies between:", ["−1 and +1", "0 and 1", "−∞ and +∞", "−3 and +3"], "|Cov(x, y)| ≤ σₓσᵧ (Cauchy–Schwarz), so |r| ≤ 1."],
["L6", "Cov(x, y) = 12, σₓ = 4 and σᵧ = 5. The correlation coefficient is:", ["0.6", "0.48", "2.4", "0.8"], "r = 12/(4 × 5) = 0.6.", "p"],
["L6", "For 5 pairs, Σx = 30, Σy = 50, Σxy = 350, Σx² = 220 and Σy² = 570. The correlation coefficient is:", ["0.94", "0.89", "0.75", "1.25"], "r = (5 × 350 − 30 × 50)/√[(5 × 220 − 900)(5 × 570 − 2500)] = 250/√(200 × 350) = 250/264.6 ≈ 0.945."],
["L6", "If r = 0.8 between x and y, the percentage of the variation in y explained by x is:", ["64%", "80%", "89%", "20%"], "Coefficient of determination r² = 0.64 → 64%.", "p"],
["L6", "r(x, y) = 0.5. If u = 2x + 3 and v = 4 − y, then r(u, v) is:", ["−0.5", "0.5", "−1", "1"], "Origins are ignored; the scale factors 2 and −1 have opposite signs, so the sign flips: −0.5."],
["L6", "For 6 pairs of ranks Σd² = 14. Spearman’s rank correlation is:", ["0.6", "0.4", "0.8", "0.33"], "ρ = 1 − 6 × 14/(6 × 35) = 1 − 84/210 = 0.6.", "p"],
["L6", "Spearman’s ρ for 10 pairs of ranks is 0.8. The value of Σd² is:", ["33", "30", "36", "18"], "0.8 = 1 − 6Σd²/990 → Σd² = 0.2 × 990/6 = 33."],
["L6", "Two judges rank 5 candidates in exactly opposite orders. Spearman’s rank correlation is:", ["−1", "0", "1", "−0.5"], "d = 4, 2, 0, −2, −4 → Σd² = 40; ρ = 1 − 240/120 = −1."],
["L6", "Marks in two tests: A (80, 70, 70, 60, 50) and B (75, 72, 60, 65, 50). Spearman’s rank correlation, with the correction for the tie, is:", ["0.8", "0.83", "0.9", "0.75"], "Ranks A: 1, 2.5, 2.5, 4, 5; B: 1, 2, 4, 3, 5. Σd² = 0 + 0.25 + 2.25 + 1 + 0 = 3.5; tie correction (2³ − 2)/12 = 0.5 → 4. ρ = 1 − 6 × 4/120 = 0.8."],
["L6", "(AB) = 40, (Aβ) = 10, (αB) = 20, (αβ) = 30. Yule’s coefficient of association is:", ["0.71", "0.5", "0.83", "0.29"], "Q = (40 × 30 − 10 × 20)/(40 × 30 + 10 × 20) = 1000/1400 = 0.71.", "p"],
["L6", "In a population of 200, (A) = 80 and (B) = 50. If A and B are independent, (AB) should be:", ["20", "40", "25", "130"], "(AB) = (A)(B)/N = 80 × 50/200 = 20."],
["L6", "If (AB)(αβ) = (Aβ)(αB), Yule’s coefficient of association is:", ["0", "1", "−1", "0.5"], "The numerator (AB)(αβ) − (Aβ)(αB) is zero: the attributes are independent."],
["L6", "The coefficient of colligation Y is 0.5. Yule’s Q is:", ["0.8", "0.25", "1", "0.67"], "Q = 2Y/(1 + Y²) = 1/1.25 = 0.8."],
["L6", "r = 0.6 from 16 pairs. The probable error of r (to 2 decimals) is:", ["0.11", "0.16", "0.27", "0.04"], "PE = 0.6745 (1 − 0.36)/√16 = 0.6745 × 0.64/4 = 0.108 ≈ 0.11."],
["L6", "r = 0 between two variables means that:", ["there is no linear relationship between them", "they are independent", "they have a perfect non-linear relationship", "one variable is constant"], "r measures only linear association; y = x² on symmetric x gives r = 0 with a perfect curved relation."],
["L6", "All points of a scatter diagram lie on a straight line that falls from left to right. Then r is:", ["−1", "0", "+1", "between 0 and −1"], "A perfect linear relation with negative slope gives r = −1."],
["L6", "Cov(x, y) = −16, var(x) = 16 and var(y) = 25. The correlation coefficient is:", ["−0.8", "−0.04", "−0.16", "0.8"], "r = −16/(4 × 5) = −0.8. Divide by the SDs, not the variances."],
["L6", "If r = 0.9, the coefficient of non-determination (1 − r²) is:", ["0.19", "0.1", "0.81", "0.9"], "1 − 0.81 = 0.19."],
["L6", "N = 100, (A) = 60, (B) = 50. Which value of (AB) would make the data inconsistent?", ["5", "10", "30", "50"], "(αβ) = N − (A) − (B) + (AB) = (AB) − 10 must not be negative, so (AB) ≥ 10; also (AB) ≤ 50. Only 5 breaks this."],
["L6", "Spearman’s rank correlation is especially useful when:", ["the data are qualitative but can be ranked", "both variables are normally distributed", "the relation is known to be exactly linear", "the sample size is very large"], "Ranks let you correlate attributes such as beauty or honesty that cannot be measured."],
["L6", "The correlation between x and y = 10 − 2x is:", ["−1", "−2", "0", "+1"], "y is an exact linear function of x with a negative slope."],
["L6", "r = 0.4, σₓ = 5 and σᵧ = 3. The covariance of x and y is:", ["6", "0.027", "37.5", "8"], "Cov = r σₓ σᵧ = 0.4 × 15 = 6."],
["L7", "The two regression coefficients are bᵧₓ = 1.6 and bₓᵧ = 0.4. The correlation coefficient is:", ["0.8", "0.64", "1", "−0.8"], "r = +√(1.6 × 0.4) = √0.64 = 0.8, positive like the coefficients.", "p"],
["L7", "The two regression coefficients are −0.5 and −0.8. The correlation coefficient is:", ["−0.63", "0.63", "−0.4", "−0.65"], "r = −√(0.5 × 0.8) = −√0.4 ≈ −0.63; r takes the common negative sign."],
["L7", "The two regression lines are 3x − 2y = 5 and x − 4y = −5. The means x̄ and ȳ are:", ["x̄ = 3, ȳ = 2", "x̄ = 2, ȳ = 3", "x̄ = 5, ȳ = 5", "x̄ = 1, ȳ = −1"], "Both lines pass through (x̄, ȳ): solving them together gives x = 3, y = 2.", "p"],
["L7", "The two regression lines are 3x − 2y = 5 and x − 4y = −5. The correlation coefficient is:", ["0.41", "2.45", "0.17", "0.67"], "Taking 3x − 2y = 5 as y on x gives bᵧₓ = 1.5 and bₓᵧ = 4 (product 6 > 1, impossible). So it is x on y: bₓᵧ = 2/3, and y on x is y = (x + 5)/4: bᵧₓ = 1/4. r = √(1/6) ≈ 0.41."],
["L7", "r = 0.6, σₓ = 3 and σᵧ = 5. The regression coefficient of y on x is:", ["1", "0.36", "0.6", "1.67"], "bᵧₓ = r σᵧ/σₓ = 0.6 × 5/3 = 1. (0.36 is bₓᵧ = 0.6 × 3/5.)"],
["L7", "x̄ = 10, ȳ = 40 and the regression coefficient of y on x is 2.5. The estimate of y when x = 14 is:", ["50", "35", "45", "41.6"], "y − 40 = 2.5(14 − 10) = 10 → y = 50."],
["L7", "bᵧₓ = 1.6 and r = 0.8. The regression coefficient of x on y is:", ["0.4", "0.5", "1.28", "0.64"], "bₓᵧ = r²/bᵧₓ = 0.64/1.6 = 0.4."],
["L7", "If r = 0, the two regression lines are:", ["perpendicular to each other", "coincident", "parallel", "inclined at 45°"], "With r = 0 the lines are y = ȳ and x = x̄, parallel to the axes and at right angles."],
["L7", "If r = ±1, the two regression lines:", ["coincide", "are perpendicular", "are parallel but distinct", "do not meet"], "tan θ = 0 when r² = 1, so θ = 0 and the lines are the same."],
["L7", "The two regression lines intersect at the point:", ["(x̄, ȳ)", "(0, 0)", "(σₓ, σᵧ)", "(bₓᵧ, bᵧₓ)"], "Both lines pass through the point of means.", "p"],
["L7", "u = x/2 and v = y/3, and the regression coefficient of v on u is 0.8. The regression coefficient of y on x is:", ["1.2", "0.53", "0.8", "4.8"], "y = 3v, x = 2u → bᵧₓ = (3/2) × 0.8 = 1.2. Change of scale changes the coefficients."],
["L7", "σᵧ = 10 and r = 0.6. The standard error of estimate of y on x is:", ["8", "6", "4", "6.4"], "Sᵧₓ = σᵧ√(1 − r²) = 10 × √0.64 = 8."],
["L7", "Which pair cannot be the two regression coefficients of a bivariate distribution?", ["1.5 and 0.8", "0.5 and 1.2", "−0.4 and −0.9", "2 and 0.3"], "Their product 1.2 would make r² > 1. The other products are 0.6, 0.36 and 0.6.", "p"],
["L7", "Which pair cannot be the two regression coefficients?", ["0.6 and −0.5", "0.6 and 0.5", "−0.6 and −0.5", "0.2 and 0.9"], "Both regression coefficients must have the same sign (the sign of r)."],
["L7", "r₁₂ = 0.7, r₁₃ = 0.5 and r₂₃ = 0.5. The partial correlation r₁₂.₃ is:", ["0.6", "0.7", "0.45", "0.52"], "(0.7 − 0.25)/√(0.75 × 0.75) = 0.45/0.75 = 0.6.", "p"],
["L7", "r₁₂ = 0.6, r₁₃ = 0.6 and r₂₃ = 0. The multiple correlation R₁.₂₃ is:", ["0.85", "0.72", "1.2", "0.6"], "R² = (0.36 + 0.36 − 0)/(1 − 0) = 0.72 → R ≈ 0.85."],
["L7", "If r₁₃ = r₂₃ = 0, the partial correlation r₁₂.₃ equals:", ["r₁₂", "0", "1", "r₁₂²"], "The formula reduces to (r₁₂ − 0)/√(1 × 1) = r₁₂: holding an unrelated variable fixed changes nothing."],
["L7", "The multiple correlation coefficient R₁.₂₃ lies between:", ["0 and 1", "−1 and 1", "−1 and 0", "1 and ∞"], "R is the correlation between x₁ and its best linear estimate, which is never negative."],
["L7", "The line of regression of y on x is fitted by minimising the sum of squares of:", ["the vertical deviations (in y) from the line", "the horizontal deviations (in x) from the line", "the perpendicular distances from the line", "the deviations of x from x̄"], "Least squares for y on x minimises Σ(y − a − bx)²."],
["L7", "If σₓ = σᵧ, then:", ["bᵧₓ = bₓᵧ = r", "bᵧₓ = 1/bₓᵧ", "r = 0", "the regression lines are perpendicular"], "bᵧₓ = rσᵧ/σₓ = r and bₓᵧ = rσₓ/σᵧ = r."],
["L7", "For 5 pairs Σx = 15, Σy = 40, Σxy = 130 and Σx² = 55. The line of regression of y on x is:", ["y = 5 + x", "y = 8 + x", "y = 5 + 2x", "y = 3 + x"], "bᵧₓ = (5 × 130 − 15 × 40)/(5 × 55 − 225) = 50/50 = 1; a = ȳ − bx̄ = 8 − 3 = 5."],
["L7", "bᵧₓ = 0.8 and bₓᵧ = 0.45. The coefficient of determination is:", ["0.36", "0.6", "1.25", "0.625"], "r² = bᵧₓ × bₓᵧ = 0.36."],
["L7", "σ₁ = 4, σ₂ = 2, r₁₂ = 0.7, r₁₃ = 0.5, r₂₃ = 0.5. The partial regression coefficient b₁₂.₃ is:", ["1.2", "0.6", "0.3", "1.4"], "b₁₂.₃ = (σ₁/σ₂)(r₁₂ − r₁₃r₂₃)/(1 − r₂₃²) = 2 × 0.45/0.75 = 1.2."],
["L8", "Three fair coins are tossed. The probability of exactly two heads is:", ["3/8", "1/2", "1/4", "2/3"], "HHT, HTH, THH → 3 of the 8 equally likely outcomes = 3/8."],
["L8", "Two dice are thrown. The probability that the sum is 7 is:", ["1/6", "7/36", "5/36", "1/12"], "(1, 6), (2, 5), (3, 4), (4, 3), (5, 2), (6, 1): 6 of 36 = 1/6."],
["L8", "Two dice are thrown. The probability that the sum is a prime number is:", ["5/12", "1/2", "7/18", "4/9"], "Sums 2, 3, 5, 7, 11 occur 1 + 2 + 4 + 6 + 2 = 15 ways → 15/36 = 5/12."],
["L8", "A card is drawn from a pack of 52. The probability that it is a king or a heart is:", ["4/13", "17/52", "1/4", "1/52"], "13 hearts + 4 kings − 1 king of hearts = 16 → 16/52 = 4/13.", "p"],
["L8", "A card is drawn from a pack of 52. The probability that it is a face card (J, Q or K) is:", ["3/13", "4/13", "1/4", "1/13"], "12 face cards → 12/52 = 3/13."],

["L8", "A bag has 5 red and 3 blue balls. Two balls are drawn at random. The probability that both are red is:", ["5/14", "25/64", "5/8", "3/28"], "C(5, 2)/C(8, 2) = 10/28 = 5/14."],
["L8", "P(A) = 0.6, P(B) = 0.5 and P(A ∩ B) = 0.3. P(A ∪ B) is:", ["0.8", "1.1", "0.3", "0.9"], "0.6 + 0.5 − 0.3 = 0.8."],
["L8", "P(A) = 0.6, P(B) = 0.5 and P(A ∩ B) = 0.3. Which is true?", ["A and B are independent", "A and B are mutually exclusive", "P(A | B) = 0.5", "P(A ∪ B) = 1"], "P(A)P(B) = 0.3 = P(A ∩ B), so they are independent; P(A | B) = 0.3/0.5 = 0.6."],

["L8", "A and B are mutually exclusive with P(A) = 0.3 and P(B) = 0.4. P(A ∪ B) is:", ["0.7", "0.58", "0.12", "0.4"], "For exclusive events P(A ∩ B) = 0, so P(A ∪ B) = 0.7."],
["L8", "Two events with non-zero probabilities are mutually exclusive. They are:", ["dependent", "independent", "exhaustive", "equally likely"], "P(A ∩ B) = 0 but P(A)P(B) > 0, so they cannot be independent.", "p"],

["L8", "The probability that a leap year chosen at random has 53 Sundays is:", ["2/7", "1/7", "53/366", "1/2"], "A leap year has 52 weeks + 2 days; 2 of the 7 day-pairs include a Sunday → 2/7."],
["L8", "Urn I has 3 white and 2 black balls; urn II has 2 white and 3 black. An urn is chosen at random and a ball drawn from it is white. The probability that it came from urn I is:", ["3/5", "1/2", "3/10", "2/5"], "(½ × 3/5)/(½ × 3/5 + ½ × 2/5) = 3/5.", "p"],
["L8", "1% of a population has a disease. A test detects it in 90% of those who have it but also gives a positive result for 5% of healthy people. A person tests positive. The probability that the person has the disease is about:", ["0.15", "0.9", "0.85", "0.01"], "P(D | +) = 0.009/(0.009 + 0.0495) = 0.009/0.0585 = 2/13 ≈ 0.15."],
["L8", "Factory X makes 60% of the bolts with 1% defective; factory Y makes 40% with 3% defective. The probability that a bolt picked at random is defective is:", ["0.018", "0.04", "0.02", "0.012"], "0.6 × 0.01 + 0.4 × 0.03 = 0.006 + 0.012 = 0.018."],
["L8", "A family has two children and at least one of them is a boy. The probability that both are boys is:", ["1/3", "1/2", "1/4", "2/3"], "Equally likely BB, BG, GB, GG; ‘at least one boy’ leaves BB, BG, GB → 1/3."],
["L8", "A can solve a problem with probability 1/2 and B with probability 1/3, independently. The probability that the problem is solved is:", ["2/3", "1/6", "5/6", "1/2"], "1 − P(both fail) = 1 − (1/2)(2/3) = 2/3."],
["L8", "The axiomatic definition of probability was given by:", ["A. N. Kolmogorov", "R. A. Fisher", "Karl Pearson", "Pierre-Simon Laplace"], "Kolmogorov (1933) built probability on three axioms; Laplace is linked with the classical definition."],
["L8", "A limitation of the classical definition of probability is that it:", ["needs the outcomes to be equally likely and finite in number", "cannot be used with coins or dice", "gives probabilities greater than 1", "needs a very large number of trials"], "Favourable/total works only when the cases are finite and equally likely."],
["L8", "Three coins are tossed. The probability of at least two heads is:", ["1/2", "3/8", "1/4", "7/8"], "HHT, HTH, THH, HHH → 4/8 = 1/2."],
["L9", "P(X = x) = kx for x = 1, 2, 3, 4. The value of k is:", ["1/10", "1/4", "1/24", "1/5"], "k(1 + 2 + 3 + 4) = 10k = 1 → k = 1/10.", "p"],
["L9", "P(X = x) = k(x² + 1) for x = 0, 1, 2. The value of k is:", ["1/8", "1/5", "1/6", "1/3"], "k(1 + 2 + 5) = 8k = 1 → k = 1/8."],
["L9", "X takes the values 1, 2, 3 with probabilities 0.2, 0.5, 0.3. E(X) is:", ["2.1", "2", "1.9", "2.3"], "0.2 + 1.0 + 0.9 = 2.1."],
["L9", "X takes the values 1, 2, 3 with probabilities 0.2, 0.5, 0.3. Var(X) is:", ["0.49", "4.9", "0.7", "0.41"], "E(X²) = 0.2 + 2 + 2.7 = 4.9; Var = 4.9 − 2.1² = 4.9 − 4.41 = 0.49.", "p"],

["L9", "For the score X on one throw of a fair die, Var(X) is:", ["2.92", "3.5", "17.5", "15.17"], "E(X) = 3.5, E(X²) = 91/6; Var = 91/6 − 12.25 = 35/12 ≈ 2.92."],
["L9", "X has density f(x) = 3x² for 0 < x < 1. E(X) is:", ["3/4", "1/2", "3/5", "1"], "∫₀¹ x · 3x² dx = 3/4."],
["L9", "f(x) = k for 2 < x < 6 (0 elsewhere) is a density. The value of k is:", ["1/4", "1/6", "4", "1/2"], "Area = k × (6 − 2) = 1 → k = 1/4."],
["L9", "f(x) = kx² for 0 < x < 3 (0 elsewhere) is a density. The value of k is:", ["1/9", "1/3", "1/27", "3"], "∫₀³ kx² dx = 9k = 1 → k = 1/9."],
["L9", "Which is NOT a property of a distribution function F(x)?", ["F(x) can decrease as x increases", "F(−∞) = 0", "F(∞) = 1", "0 ≤ F(x) ≤ 1"], "F(x) = P(X ≤ x) never decreases."],
["L9", "X and Y are independent with Var(X) = 4 and Var(Y) = 9. Var(X − Y) is:", ["13", "−5", "5", "√13"], "For independent variables Var(X − Y) = Var X + Var Y = 13.", "p"],

["L9", "X and Y are independent with E(X) = 2 and E(Y) = 5. E(XY) is:", ["10", "7", "2.5", "3"], "For independent variables E(XY) = E(X)E(Y) = 10."],
["L9", "E(XY) = 12, E(X) = 3 and E(Y) = 3. Cov(X, Y) is:", ["3", "9", "12", "4"], "Cov = E(XY) − E(X)E(Y) = 12 − 9 = 3."],
["L9", "By Chebyshev’s inequality, P(|X − μ| ≥ 3σ) is at most:", ["1/9", "1/3", "0.0027", "8/9"], "P(|X − μ| ≥ kσ) ≤ 1/k² = 1/9. (0.0027 is the exact value only for a normal variable.)"],
["L9", "By Chebyshev’s inequality, P(|X − μ| < 2σ) is at least:", ["3/4", "1/4", "0.9545", "1/2"], "1 − 1/k² = 1 − 1/4 = 3/4, for any distribution."],
["L9", "Joint pmf: p(0, 0) = 0.1, p(0, 1) = 0.2, p(1, 0) = 0.3, p(1, 1) = 0.4. P(X = 1) is:", ["0.7", "0.4", "0.6", "0.3"], "Marginal: p(1, 0) + p(1, 1) = 0.3 + 0.4 = 0.7."],
["L9", "Joint pmf: p(0, 0) = 0.1, p(0, 1) = 0.2, p(1, 0) = 0.3, p(1, 1) = 0.4. Cov(X, Y) is:", ["−0.02", "0.4", "0.02", "0"], "E(X) = 0.7, E(Y) = 0.6, E(XY) = 0.4 → Cov = 0.4 − 0.42 = −0.02."],
["L9", "A game pays ₹10 with probability 0.3 and costs ₹5 with probability 0.7. The expected gain per game is:", ["−₹0.5", "₹1.5", "₹5", "₹0.5"], "10 × 0.3 − 5 × 0.7 = 3 − 3.5 = −0.5 → an expected loss of ₹0.5."],
["L9", "The moment generating function of X is (0.4 + 0.6eᵗ)¹⁰. The mean of X is:", ["6", "4", "2.4", "0.6"], "It is the binomial MGF with n = 10, p = 0.6 → mean np = 6. (2.4 is the variance.)"],
["L9", "The moment generating function of X is e^(3(eᵗ − 1)). The variance of X is:", ["3", "9", "√3", "1/3"], "It is the Poisson MGF with m = 3; the variance equals m = 3."],
["L9", "For a continuous random variable X, P(X = 5) is:", ["0", "f(5)", "F(5)", "1 − F(5)"], "A single point has zero area under the density."],
["L9", "Var(X) = 9 and E(X) = 4. E(X²) is:", ["25", "13", "7", "16"], "E(X²) = Var(X) + [E(X)]² = 9 + 16 = 25."],
["L10", "A fair coin is tossed 8 times. The probability of exactly 3 heads is:", ["7/32", "3/8", "1/8", "5/16"], "C(8, 3)/2⁸ = 56/256 = 7/32."],
["L10", "A binomial distribution has mean 6 and variance 4.2. Its parameters are:", ["n = 20, p = 0.3", "n = 30, p = 0.2", "n = 20, p = 0.7", "n = 60, p = 0.1"], "q = 4.2/6 = 0.7 → p = 0.3 → n = 6/0.3 = 20.", "p"],
["L10", "A distribution is said to have mean 4 and variance 5. Which is true?", ["It cannot be binomial, since a binomial variance is less than its mean", "It is binomial with p = 0.8", "It is binomial with n = 20", "It is Poisson with m = 4"], "Binomial variance npq < np because q < 1; and a Poisson would need mean = variance."],
["L10", "The variance of a binomial distribution with n = 10 and p = 0.4 is:", ["2.4", "4", "6", "1.55"], "npq = 10 × 0.4 × 0.6 = 2.4. (4 is the mean.)"],
["L10", "The standard deviation of a binomial distribution with n = 100 and p = 0.1 is:", ["3", "9", "10", "0.9"], "√(npq) = √9 = 3. (9 is the variance.)"],
["L10", "A shooter hits a target with probability 0.2 per shot. In 4 independent shots, the probability of at least one hit is:", ["0.5904", "0.8", "0.4096", "0.0016"], "1 − 0.8⁴ = 1 − 0.4096 = 0.5904."],
["L10", "The mode of a binomial distribution with n = 10 and p = 0.3 is:", ["3", "3.3", "4", "2"], "(n + 1)p = 3.3 → mode = 3 (its integer part)."],
["L10", "A binomial distribution is symmetric when:", ["p = 1/2", "n is even", "np is an integer", "p = q = 1"], "β₁ = (q − p)²/(npq) = 0 only when p = q = 1/2."],
["L10", "For a Poisson distribution with mean 3, the variance is:", ["3", "9", "√3", "1/3"], "Mean = variance = m for a Poisson distribution.", "p"],
["L10", "X is Poisson with mean 3. Given e⁻³ = 0.0498, P(X = 2) is about:", ["0.224", "0.0747", "0.149", "0.448"], "e⁻³ × 3²/2! = 0.0498 × 4.5 ≈ 0.224."],
["L10", "For a Poisson variable P(X = 2) = P(X = 3). The mean is:", ["3", "2", "2.5", "6"], "e⁻ᵐm²/2 = e⁻ᵐm³/6 → m = 3.", "p"],
["L10", "For a Poisson variable P(X = 1) = 2P(X = 2). The mean is:", ["1", "2", "0.5", "4"], "e⁻ᵐm = 2 × e⁻ᵐm²/2 = e⁻ᵐm² → m = 1."],
["L10", "Items are defective with probability 0.01. Using the Poisson approximation, the probability that a lot of 200 has no defective item is about (e⁻² = 0.1353):", ["0.1353", "0.2707", "0.8647", "0.0135"], "m = np = 200 × 0.01 = 2 → P(0) = e⁻² ≈ 0.1353."],
["L10", "β₁ for a Poisson distribution with mean 4 is:", ["0.25", "4", "2", "3.25"], "β₁ = 1/m = 0.25. (3.25 is β₂ = 3 + 1/m.)"],
["L10", "β₂ for a Poisson distribution with mean 2 is:", ["3.5", "3", "0.5", "5"], "β₂ = 3 + 1/m = 3.5: always leptokurtic, approaching the normal 3 as m grows."],
["L10", "X and Y are independent Poisson variables with means 2 and 3. Then X + Y is:", ["Poisson with mean 5", "Poisson with mean 6", "binomial with n = 5", "normal with mean 5"], "The Poisson distribution is additive: the means add."],
["L10", "Each trial succeeds with probability 0.2. The expected number of trials up to and including the first success is:", ["5", "4", "0.2", "8"], "Geometric (trials): mean 1/p = 5. (4 = q/p counts the failures before it.)"],
["L10", "For a geometric distribution counting the failures before the first success, with p = 0.5, the variance is:", ["2", "1", "4", "0.5"], "Variance q/p² = 0.5/0.25 = 2."],
["L10", "5 items are drawn without replacement from a lot of 20 that has 8 defectives. The expected number of defectives drawn is:", ["2", "2.5", "4", "1.6"], "Hypergeometric mean = nM/N = 5 × 8/20 = 2."],
["L10", "A lot of 10 items has 3 defectives. Two items are drawn without replacement. The probability that both are defective is:", ["1/15", "9/100", "3/10", "2/15"], "C(3, 2)/C(10, 2) = 3/45 = 1/15. (9/100 assumes replacement.)"],
["L10", "X is uniform on the integers 1, 2, …, 10. Var(X) is:", ["8.25", "9.17", "5.5", "33"], "(n² − 1)/12 = 99/12 = 8.25."],
["L10", "For a binomial distribution with n = 10 and p = 0.5, the ratio P(X = 5)/P(X = 4) is:", ["6/5", "5/6", "1", "1/2"], "[(n − r)/(r + 1)](p/q) with r = 4: (6/5)(1) = 6/5."],
["L10", "For a binomial distribution with n = 5, the sum of the mean and the variance is 1.8. The value of p is:", ["0.2", "0.3", "0.8", "0.36"], "np + npq = 5p(2 − p) = 1.8 → p² − 2p + 0.36 = 0 → p = 0.2 (p = 1.8 is impossible)."],
["L11", "X ~ N(50, 25). The standard normal value for X = 60 is:", ["2", "0.4", "10", "0.5"], "N(50, 25) has σ = √25 = 5 → z = (60 − 50)/5 = 2. Dividing by 25 is the classic slip.", "p"],
["L11", "For the standard normal variable Z, P(Z > 1.96) is about:", ["0.025", "0.05", "0.975", "0.0228"], "Φ(1.96) ≈ 0.975, so the right tail is 0.025."],
["L11", "For the standard normal variable Z, P(−1.96 < Z < 1.96) is about:", ["0.95", "0.975", "0.6827", "0.99"], "2Φ(1.96) − 1 ≈ 0.95: the 95% band."],
["L11", "IQ is N(100, 15²). Given Φ(1) = 0.8413, the proportion with IQ below 85 is:", ["0.1587", "0.8413", "0.3413", "0.0228"], "z = (85 − 100)/15 = −1 → Φ(−1) = 1 − 0.8413 = 0.1587."],
["L11", "Marks of 1,000 students are N(60, 8²). Given Φ(2) = 0.9772, about how many score above 76?", ["23", "977", "46", "159"], "z = (76 − 60)/8 = 2 → tail 1 − 0.9772 = 0.0228 → about 23 students.", "p"],
["L11", "For a normal distribution, mean, median and mode are:", ["all equal", "in the order mean > median > mode", "in the order mode > median > mean", "unrelated"], "The curve is symmetric with a single peak, so all three coincide at μ."],
["L11", "The coefficient of kurtosis β₂ of a normal distribution is:", ["3", "0", "1", "2"], "Normal is the mesokurtic standard: β₂ = 3, γ₂ = 0."],
["L11", "The percentage of a normal population within μ ± 3σ is about:", ["99.73%", "95.45%", "68.27%", "99%"], "±1σ: 68.27%, ±2σ: 95.45%, ±3σ: 99.73%."],
["L11", "The quartile deviation of a normal distribution with σ = 20 is about:", ["13.49", "15.96", "20", "10"], "QD ≈ 0.6745σ = 13.49. (15.96 is the MD, 0.7979σ.)"],
["L11", "The mean deviation about the mean of a normal distribution with σ = 10 is about:", ["7.98", "6.745", "10", "8.5"], "MD = σ√(2/π) ≈ 0.7979 × 10 ≈ 7.98."],
["L11", "The points of inflexion of N(30, 16) are at:", ["26 and 34", "14 and 46", "22 and 38", "29 and 31"], "σ = √16 = 4 → μ ± σ = 26 and 34."],
["L11", "For N(50, 10²), the first and third quartiles are about:", ["43.26 and 56.74", "40 and 60", "45 and 55", "36.5 and 63.5"], "Q₁, Q₃ = μ ∓ 0.6745σ = 50 ∓ 6.745."],
["L11", "X ~ N(10, 4) and Y ~ N(20, 9) are independent. The distribution of X + Y is:", ["N(30, 13)", "N(30, 5)", "N(30, 25)", "N(10, 13)"], "Means add (30) and, for independent variables, variances add (13)."],
["L11", "X ~ N(10, 4) and Y ~ N(20, 9) are independent. The variance of 2X − Y is:", ["25", "17", "−1", "7"], "Var = 2² × 4 + 9 = 25. The minus sign does not subtract a variance."],
["L11", "X has an exponential distribution with λ = 0.5. Its mean and variance are:", ["2 and 4", "0.5 and 0.25", "2 and 2", "0.5 and 4"], "Mean 1/λ = 2, variance 1/λ² = 4.", "p"],
["L11", "X is exponential with mean 3. Given e⁻¹ = 0.3679, P(X > 3) is:", ["0.3679", "0.6321", "0.5", "0.1353"], "λ = 1/3 → P(X > 3) = e^(−3/3) = e⁻¹ ≈ 0.3679."],
["L11", "The memoryless (lack of memory) property belongs to which continuous distribution?", ["Exponential", "Normal", "Uniform", "Beta"], "P(X > s + t | X > s) = P(X > t) holds only for the exponential among continuous laws (and the geometric among discrete ones)."],
["L11", "X is uniform on (0, 12). Its variance is:", ["12", "6", "144", "3"], "(b − a)²/12 = 144/12 = 12."],
["L11", "X is uniform on (2, 8). P(3 < X < 5) is:", ["1/3", "1/2", "1/6", "5/8"], "Length 2 out of 6 → 1/3."],
["L11", "A binomial variable has n = 100 and p = 0.5. Its normal approximation has mean and SD:", ["50 and 5", "50 and 25", "50 and 10", "25 and 5"], "Mean np = 50, SD √(npq) = √25 = 5."],
["L11", "X is normal with σ = 10, and P(X > 80) = 0.0228 (Φ(2) = 0.9772). The mean μ is:", ["60", "70", "78", "100"], "A right tail of 0.0228 means z = 2 → 80 = μ + 2 × 10 → μ = 60."],
["L11", "The maximum ordinate (height) of the standard normal curve is about:", ["0.3989", "1", "0.5", "0.2420"], "At z = 0, f = 1/√(2π) ≈ 0.3989. (0.2420 is the height at z = ±1.)"],
["L11", "For any normal distribution, the proportion of values lying below the mean is:", ["0.5", "0.68", "0.3413", "depends on σ"], "The curve is symmetric about μ."],
["L12", "From a list of 5,000 voters, a random number between 1 and 10 is chosen and then every 10th voter is taken. This is:", ["systematic sampling", "simple random sampling", "cluster sampling", "stratified sampling"], "A random start followed by a fixed interval k = N/n is systematic sampling.", "p"],
["L12", "A few villages are chosen at random and every household in the chosen villages is surveyed. This is:", ["cluster sampling", "stratified sampling", "systematic sampling", "quota sampling"], "Whole groups (clusters) are selected and fully enumerated.", "p"],
["L12", "A population is divided into homogeneous groups and a random sample is drawn from every group. This is:", ["stratified sampling", "cluster sampling", "multistage sampling", "purposive sampling"], "Homogeneous strata, with a sample from each stratum, is stratified sampling."],
["L12", "A survey selects states, then districts within the selected states, then villages, and finally households. This is:", ["multistage sampling", "multiphase sampling", "cluster sampling", "systematic sampling"], "Selection in successive stages of ever smaller units is multistage sampling."],
["L12", "An interviewer must contact 30 men and 20 women but may choose whom to interview. This is:", ["quota sampling", "stratified random sampling", "systematic sampling", "simple random sampling"], "Fixed quotas filled at the interviewer’s choice — a non-probability method."],
["L12", "An investigator deliberately selects units he considers typical of the population. This is:", ["purposive (judgement) sampling", "simple random sampling", "cluster sampling", "systematic sampling"], "Selection by judgement is purposive sampling; personal bias can enter."],
["L12", "How many different samples of size 3 can be drawn without replacement from a population of 8 units?", ["56", "512", "336", "24"], "C(8, 3) = 56. (512 = 8³ counts ordered samples with replacement; 336 counts ordered samples without replacement.)"],
["L12", "How many ordered samples of size 2 can be drawn with replacement from a population of 6 units?", ["36", "15", "30", "12"], "6² = 36."],
["L12", "In simple random sampling without replacement of 10 units from 50, the probability that a particular unit is included is:", ["1/5", "1/50", "1/10", "10/49"], "n/N = 10/50 = 1/5."],
["L12", "σ = 20 and n = 100. The standard error of the sample mean is:", ["2", "0.2", "20", "4"], "σ/√n = 20/10 = 2.", "p"],
["L12", "The population proportion is 0.4 and n = 96. The standard error of the sample proportion is:", ["0.05", "0.0025", "0.24", "0.004"], "√(PQ/n) = √(0.24/96) = √0.0025 = 0.05."],
["L12", "To halve the standard error of the mean, the sample size must be:", ["multiplied by 4", "doubled", "halved", "multiplied by √2"], "SE ∝ 1/√n, so n must become 4n."],
["L12", "σ = 10, n = 25 drawn without replacement from N = 101. The standard error of the mean is:", ["1.74", "2", "1.6", "0.4"], "(10/5) × √[(101 − 25)/(101 − 1)] = 2 × √0.76 ≈ 1.74."],
["L12", "Strata have 600, 300 and 100 units. With proportional allocation, how many of a sample of 50 come from the second stratum?", ["15", "30", "5", "16"], "nₕ = 50 × 300/1000 = 15."],
["L12", "Stratum 1 has N₁ = 400 and S₁ = 5; stratum 2 has N₂ = 600 and S₂ = 10. Under Neyman allocation of n = 80, the sample from stratum 1 is:", ["20", "32", "40", "60"], "nₕ ∝ NₕSₕ: 2000 and 6000 → 80 × 2000/8000 = 20. (32 is proportional allocation.)"],
["L12", "σ = 15. The sample size needed to estimate the mean within ±3 with 95% confidence is:", ["97", "10", "25", "75"], "n = (1.96 × 15/3)² = 9.8² = 96.04 → round up to 97. (10 forgets to square.)"],
["L12", "Nothing is known about a proportion. The sample size needed to estimate it within ±0.05 with 95% confidence is:", ["385", "769", "100", "196"], "n = 1.96² × 0.25/0.05² = 384.16 → round up to 385. Use P = 0.5, the worst case, so PQ = 0.25. (769 uses P alone instead of PQ.)"],
["L12", "Which statement about non-sampling errors is correct?", ["They occur in a census as well as in a sample survey", "They disappear in a census", "They always fall as the sample size rises", "They can be found exactly from the sample"], "Measurement, response and processing errors occur in any enquiry, and are often larger in a census."],
["L12", "Sampling error generally decreases when:", ["the sample size increases", "the population size increases", "non-response increases", "a non-probability method is used"], "Sampling error ∝ 1/√n."],
["L12", "Independent samples: σ₁ = 6, n₁ = 36 and σ₂ = 8, n₂ = 64. The standard error of the difference of the sample means is:", ["1.41", "2", "0.25", "14"], "√(36/36 + 64/64) = √2 ≈ 1.41."],
["L12", "For systematic sampling of 60 units from a population of 1,200, the sampling interval is:", ["20", "60", "12", "1140"], "k = N/n = 1200/60 = 20."],
["L12", "The list of all units from which a sample is drawn is called the:", ["sampling frame", "sampling unit", "sampling distribution", "strata"], "The frame is the list; a sampling unit is one element of it."],
["L13", "Which of the following is an unbiased estimator of the population variance σ²?", ["Σ(x − x̄)²/(n − 1)", "Σ(x − x̄)²/n", "Σ(x − x̄)²/(n + 1)", "Σx²/n"], "E[Σ(x − x̄)²] = (n − 1)σ², so dividing by n − 1 removes the bias.", "p"],

["L13", "A sample from an exponential distribution f(x) = λe^(−λx) has mean 4. The ML estimate of λ is:", ["0.25", "4", "16", "0.0625"], "λ̂ = 1/x̄ = 1/4 = 0.25."],
["L13", "A sample from a uniform distribution on (0, θ) has mean 7. The method-of-moments estimate of θ is:", ["14", "7", "3.5", "49"], "E(X) = θ/2 → θ/2 = x̄ → θ̂ = 2 × 7 = 14."],

["L13", "σ = 10 and n = 100. The width of the 99% confidence interval for μ is:", ["5.16", "3.92", "2.58", "10.32"], "2 × 2.58 × 10/10 = 5.16."],
["L13", "In a sample of 600, 40% favour a policy. The margin of error of a 95% confidence interval for the proportion is about:", ["0.039", "0.02", "0.0784", "0.4"], "SE = √(0.4 × 0.6/600) = 0.02; margin = 1.96 × 0.02 ≈ 0.039."],
["L13", "If the sample size is made four times as large, the width of a confidence interval for the mean becomes:", ["half", "one-fourth", "double", "unchanged"], "Width ∝ 1/√n = 1/√4 = 1/2."],
["L13", "An estimator Tₙ is consistent for θ if:", ["Tₙ approaches θ in probability as n increases", "E(Tₙ) = θ for every n", "it has the smallest variance", "it uses all the sample observations"], "Consistency is a large-sample property: the estimator homes in on θ."],
["L13", "For a normal population, the more efficient estimator of μ is:", ["the sample mean", "the sample median", "the sample mode", "the mid-range of the sample"], "The median’s variance is about π/2 times that of the mean (efficiency ≈ 0.64)."],
["L13", "For a random sample from a Poisson distribution, a sufficient statistic for the mean is:", ["Σxᵢ", "the largest observation", "x₁", "the sample median"], "The likelihood depends on the data only through Σxᵢ (factorisation theorem)."],
["L13", "The method of maximum likelihood was developed by:", ["R. A. Fisher", "Karl Pearson", "A. A. Markov", "Jerzy Neyman"], "Fisher introduced ML in the 1920s; Karl Pearson gave the method of moments."],
["L13", "If θ̂ is the maximum likelihood estimator of θ, then the MLE of g(θ) is g(θ̂). This is the:", ["invariance property", "unbiasedness property", "sufficiency property", "Cramér–Rao bound"], "MLEs are invariant under functions of the parameter."],
["L13", "The Cramér–Rao inequality gives:", ["a lower bound for the variance of an unbiased estimator", "an upper bound for the bias of an estimator", "the sample size for a given precision", "the critical value of a test"], "No unbiased estimator (under regularity conditions) can have variance below this bound."],
["L13", "For a sample of 5 from a population with variance 10, E[Σ(x − x̄)²/n] is:", ["8", "10", "12.5", "2"], "E = (n − 1)σ²/n = 4 × 10/5 = 8 — the divisor-n variance is biased downwards."],
["L13", "Two unbiased estimators of θ have variances 4 and 5. The efficiency of the second relative to the first is:", ["0.8", "1.25", "0.2", "0.45"], "Efficiency = Var(T₁)/Var(T₂) = 4/5 = 0.8."],
["L13", "A sample of 9 has x̄ = 50 and s = 6 (divisor n − 1). With t₀.₀₂₅ at 8 df = 2.306, the upper 95% confidence limit for μ is:", ["54.61", "53.92", "63.84", "51.54"], "50 + 2.306 × 6/3 = 50 + 4.612 = 54.61."],
["L14", "A Type II error is committed when:", ["H₀ is accepted although it is false", "H₀ is rejected although it is true", "H₀ is rejected and it is false", "H₀ is accepted and it is true"], "Type I: reject a true H₀; Type II: accept a false H₀.", "p"],
["L14", "The probability of a Type II error is 0.2. The power of the test is:", ["0.8", "0.2", "0.95", "0.05"], "Power = 1 − β = 0.8."],
["L14", "The critical value of Z for a two-tailed test at the 1% level is:", ["2.58", "2.33", "1.96", "1.645"], "Each tail holds 0.5%: z = 2.58 (2.33 is the one-tailed 1% value).", "p"],
["L14", "The critical value of Z for a right-tailed test at the 5% level is:", ["1.645", "1.96", "2.33", "1.28"], "The whole 5% is in one tail: z = 1.645."],
["L14", "H₀: μ = 50. A sample of 100 has x̄ = 52; σ = 10. The value of the Z statistic is:", ["2", "0.2", "20", "0.02"], "Z = (52 − 50)/(10/√100) = 2/1 = 2."],
["L14", "In 100 trials there are 60 successes. To test H₀: P = 0.5, the Z statistic is:", ["2", "1", "0.2", "2.04"], "Z = (0.6 − 0.5)/√(0.5 × 0.5/100) = 0.1/0.05 = 2. Using the sample p in the SE gives 2.04 — wrong under H₀."],
["L14", "x̄₁ = 68, x̄₂ = 65; σ₁ = 10, σ₂ = 5; n₁ = n₂ = 50. The Z statistic for the difference of means is about:", ["1.9", "1.34", "2.12", "0.6"], "SE = √(100/50 + 25/50) = √2.5 ≈ 1.58; Z = 3/1.58 ≈ 1.90."],
["L14", "The degrees of freedom for a one-sample t test with n = 15 are:", ["14", "15", "13", "16"], "n − 1 = 14."],
["L14", "The degrees of freedom for a two-sample t test with n₁ = 10 and n₂ = 12 are:", ["20", "21", "22", "11"], "n₁ + n₂ − 2 = 20.", "p"],
["L14", "A paired t test is applied to 12 pairs of observations. The degrees of freedom are:", ["11", "22", "12", "10"], "Pairs give one difference each: n − 1 = 11."],
["L14", "r = 0.6 from n = 18 pairs. The t statistic for testing ρ = 0 is:", ["3", "2.4", "3.6", "2.25"], "t = r√(n − 2)/√(1 − r²) = 0.6 × 4/0.8 = 3, with 16 df."],
["L14", "A sample of 9 has x̄ = 54 and s = 6 (divisor n − 1). For H₀: μ = 50, the t statistic is:", ["2", "0.67", "6", "1.33"], "t = (54 − 50)/(6/√9) = 4/2 = 2, with 8 df."],
["L14", "The variance of Student’s t distribution with 10 degrees of freedom is:", ["1.25", "1", "10", "0.8"], "ν/(ν − 2) = 10/8 = 1.25."],
["L14", "As the degrees of freedom increase, the t distribution tends to the:", ["standard normal distribution", "χ² distribution", "F distribution", "uniform distribution"], "Its tails thin out and its variance ν/(ν − 2) tends to 1."],
["L14", "A test gives a p-value of 0.03. At the 5% level of significance, H₀ is:", ["rejected", "accepted", "neither rejected nor accepted", "rejected only at the 1% level"], "Reject when the p-value is below α: 0.03 < 0.05. (At 1% it would not be rejected.)"],
["L14", "For a fixed sample size, reducing α from 5% to 1% will:", ["increase β (the Type II error)", "decrease β", "increase the power", "leave β unchanged"], "A smaller critical region makes it harder to reject a false H₀ as well."],
["L14", "H₀: μ = 50 against H₁: μ > 50 calls for:", ["a right-tailed test", "a left-tailed test", "a two-tailed test", "no test at all"], "The critical region lies where H₁ points: the right tail."],
["L14", "The most powerful test for a simple null against a simple alternative is given by the:", ["Neyman–Pearson lemma", "central limit theorem", "Cramér–Rao inequality", "Chebyshev inequality"], "The lemma shows that the likelihood-ratio critical region is most powerful."],
["L14", "Two samples of 100 have proportions 0.3 and 0.2. Using the pooled proportion, the Z statistic for their difference is about:", ["1.63", "1.77", "2", "0.06"], "p̂ = 0.25; SE = √(0.25 × 0.75 × 0.02) ≈ 0.0612; Z = 0.1/0.0612 ≈ 1.63."],
["L14", "The t distribution was introduced by:", ["W. S. Gosset (‘Student’)", "R. A. Fisher", "Karl Pearson", "Jerzy Neyman"], "Gosset published it under the pen name ‘Student’ in 1908."],

["L15", "A sample of 11 has s² = 20 (divisor n − 1). For H₀: σ² = 10, the χ² statistic is:", ["20", "22", "2", "10"], "χ² = (n − 1)s²/σ₀² = 10 × 20/10 = 20, with 10 df."],

["L15", "F₀.₀₅(10, 5) = 4.74. The value of F₀.₉₅(5, 10) is about:", ["0.21", "4.74", "0.95", "2.37"], "F₁₋α(ν₁, ν₂) = 1/Fα(ν₂, ν₁) = 1/4.74 ≈ 0.21."],
["L15", "A t statistic with ν df has the value 2.5. Its square follows F with (1, ν) df and equals:", ["6.25", "5", "1.58", "2.5"], "t² = 6.25."],
["L15", "A χ² variable takes values in the range:", ["0 to ∞", "−∞ to ∞", "0 to 1", "−1 to 1"], "It is a sum of squares, so it is never negative."],
["L15", "Yates’ correction for continuity is applied in:", ["a 2 × 2 contingency table with small expected frequencies", "any F test", "a large-sample Z test for means", "ANOVA"], "It subtracts N/2 from |ad − bc| to offset the use of a continuous χ² for discrete counts."],
["L15", "In a χ² goodness-of-fit test, classes are pooled when:", ["an expected frequency is less than 5", "an observed frequency is 0", "the χ² value is too large", "the df exceed 30"], "Small expected frequencies make the χ² approximation unreliable."],

["L16", "The technique of analysis of variance was developed by:", ["R. A. Fisher", "Karl Pearson", "W. S. Gosset", "Francis Galton"], "Fisher developed ANOVA for agricultural experiments at Rothamsted."],
["L16", "With only two groups, a one-way ANOVA gives F = 9. The equivalent two-sample t statistic has absolute value:", ["3", "9", "81", "4.5"], "F = t², so |t| = √9 = 3."],

["L17", "The steady growth of a country’s population over several decades is an example of:", ["secular trend", "seasonal variation", "cyclical variation", "irregular variation"], "A long-term, smooth movement is the trend.", "p"],
["L17", "Alternating periods of boom and depression in business activity over several years are:", ["cyclical variations", "seasonal variations", "secular trend", "irregular variations"], "Wave-like movements lasting more than a year are cyclical (the business cycle)."],
["L17", "A sudden fall in production because of a flood is an example of:", ["irregular variation", "cyclical variation", "seasonal variation", "secular trend"], "Unpredictable, one-off events cause irregular (random) variation."],
["L17", "Higher sales of sweets every year during Diwali are an example of:", ["seasonal variation", "cyclical variation", "secular trend", "irregular variation"], "A pattern that repeats at the same time each year is seasonal."],
["L17", "The multiplicative model of a time series is:", ["Y = T × S × C × I", "Y = T + S + C + I", "Y = T × S + C × I", "Y = (T + S)(C + I)"], "Components multiply; the additive model adds them."],

["L17", "A straight-line trend by least squares with years coded so that Σx = 0 gives n = 5, Σy = 150, Σxy = 40 and Σx² = 10. The trend equation is:", ["y = 30 + 4x", "y = 30 + 0.25x", "y = 150 + 4x", "y = 4 + 30x"], "a = Σy/n = 30; b = Σxy/Σx² = 4.", "p"],
["L17", "The trend is y = 30 + 4x with x = 0 at the middle year and x in years. The trend value 3 years after the middle year is:", ["42", "34", "12", "37"], "30 + 4 × 3 = 42."],
["L17", "Six years are coded −5, −3, −1, 1, 3, 5 for a least-squares trend. One unit of x then equals:", ["half a year", "one year", "two years", "one quarter"], "Successive years differ by 2 units, so one unit is half a year."],
["L17", "By semi-averages, 6 years’ data 10, 12, 14, 18, 20, 22 give half-averages 12 and 20. The average annual increase in the trend is:", ["2.67", "8", "4", "1.33"], "The two averages are 3 years apart: (20 − 12)/3 = 2.67 per year."],

["L17", "Data show a regular cycle of 5 years. To remove it, the moving average should cover:", ["5 years", "3 years", "4 years", "10 years"], "The period of the moving average should equal the cycle length: 5 years."],
["L17", "The four phases of a business cycle, in order, are:", ["prosperity, recession, depression, recovery", "recovery, depression, prosperity, recession", "depression, prosperity, recession, recovery", "recession, recovery, prosperity, depression"], "Boom turns down (recession) to the bottom (depression) and climbs back (recovery)."],

<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>

<title>Important Days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Shared by every History page (built by tools/history/build.js).
   Layout: a manuscript folio — parchment paper, maroon ink, gold figures; one-column app with a bottom tab bar. */
:root{
  --paper:#f3efe4; --sheet:#fffdf6; --sunk:#e8e1cf;
  --ink:#241c14; --ink2:#5d5141; --rule:#d8cdb4;
  --blue:#7a2230; --on-blue:#ffffff; --blue-bg:#f4e2e1;
  --accent:#9a6a12; --accent-bg:#f8ecc9;
  --good:#1b6b4a; --good-bg:#ddefe4; --bad:#a8291f; --bad-bg:#f8e0dc;
  --warn-bg:#fcf0cf;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* era groups on the Learn screen */
.eras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.erac{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:grid;gap:6px}
.erac b{font-family:var(--f-display);font-size:15px;font-weight:700;line-height:1.25}
.erac .hi{font-size:12px;color:var(--ink2)}
.erac .mt{font-family:var(--f-num);font-size:11px;color:var(--ink2)}
.erac .meter{height:6px}
.erac[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.grph{display:flex;align-items:baseline;gap:8px;padding:14px 2px 4px;border-top:2px solid var(--ink);margin-top:4px}
.grph h2{font-size:17px}
.grph span{font-size:12px;color:var(--ink2);margin-left:auto;font-family:var(--f-num)}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}
.dots{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--rule);display:block}
.dots i.on{background:var(--accent)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.hot{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px;font-size:15px}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.facts.prose dd{font-weight:400;line-height:1.55}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap,.link{border-radius:var(--r);padding:12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.link{background:var(--sunk);border-color:transparent}
.trick .lab,.trap .lab,.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.link .lab{color:var(--ink2)}
.mn{font-family:var(--f-num);font-weight:600;background:var(--sheet);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.tag.src{background:var(--good-bg);color:var(--good)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:22px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
/* one-line revision rows (last week / last moment) */
.lines{display:grid;gap:0}
.lines div{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px dashed var(--rule);font-size:15px}
.lines div:first-child{border-top:0}
.lines b{font-weight:700}
.lines span{color:var(--ink2)}
.callout{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;font-size:15px}

/* plan maker */
.plancfg{display:grid;gap:12px}
.pday{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.pday > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pday > summary::-webkit-details-marker{display:none}
.pday .dno{font-family:var(--f-num);font-weight:700;font-size:13px;background:var(--sunk);border-radius:99px;padding:2px 10px;white-space:nowrap}
.pday.cur .dno{background:var(--blue);color:var(--on-blue)}
.pday.allgood .dno{background:var(--good-bg);color:var(--good)}
.pday .dt{min-width:0;font-weight:600;font-size:15px}
.pday .dt small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
.pday .dp{font-family:var(--f-num);font-size:12px;color:var(--ink2);white-space:nowrap}
.pday .body{padding:0 14px 12px;display:grid;gap:8px;border-top:1px dashed var(--rule);margin-top:2px;padding-top:10px}
.ptask{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;width:100%;font-size:15px}
.ptask .box{width:22px;height:22px;border-radius:6px;border:1.6px solid var(--rule);display:grid;place-items:center;font-size:14px;color:var(--on-blue);margin-top:1px}
.ptask[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.ptask[aria-pressed="true"] .lbl{text-decoration:line-through;color:var(--ink2)}
.ptask .lbl small{display:block;font-size:12px;color:var(--ink2);text-decoration:none}
/* the story first: plain-language opener for beginners */
.story{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;font-size:16.5px;line-height:1.65}
.story .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.story p{margin:0}
.story .key{background:var(--blue-bg);border-radius:8px;padding:8px 12px;font-size:15px;line-height:1.5}
.story .key b{color:var(--blue)}
/* hub: app cards and the beginner path */
.appcs{display:grid;gap:12px}
.appc{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;text-align:left;width:100%;cursor:pointer}
.appc:hover{border-color:var(--blue)}
.appc .hd{display:flex;align-items:center;gap:10px}
.appc .ic{font-size:26px;line-height:1}
.appc .hd b{font-family:var(--f-display);font-size:17px;font-weight:700;display:block}
.appc .hd small{font-size:12px;color:var(--ink2)}
.appc .hd .go{margin-left:auto;font-weight:700;color:var(--blue);white-space:nowrap}
.appc p{margin:0;font-size:14.5px;color:var(--ink2)}
.appc .meta{font-family:var(--f-num);font-size:12px;color:var(--ink2)}
.steps-list{margin:0;padding-left:22px;display:grid;gap:8px}
.steps-list li::marker{font-family:var(--f-num);font-weight:700;color:var(--accent)}
.golink{background:none;border:0;padding:0;color:var(--blue);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px;font:inherit}
/* plan: a task can open its lesson; ticks found from your progress are marked */
.ptask-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.ptask-row .btn{margin-top:2px}
.autotag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--good);background:var(--good-bg);border-radius:99px;padding:0 7px;margin-left:6px;text-decoration:none!important;vertical-align:1px}
.revdone{justify-self:start}
/* exam heat map: lessons × exams */
.hmwrap > summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hmwrap > summary::-webkit-details-marker{display:none}
.hmwrap > summary h3{margin:0}
.hmwrap[open] > summary{margin-bottom:10px}
.hmt th small{display:block;font-weight:500;text-transform:none;letter-spacing:0;font-size:11px}
.hmt th[scope=row]{font-size:14px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink)}
.hmt th[scope=row] .golink{text-decoration:none;color:var(--ink);text-align:left}
.hm{text-align:center;font-size:12px;letter-spacing:1px;white-space:nowrap}
.hm span{display:inline-block;min-width:46px;border-radius:6px;padding:3px 6px;font-weight:700}
.hm.h3 span{background:var(--bad);color:#fff}
.hm.h2 span{background:color-mix(in srgb, var(--accent) 70%, var(--sheet));color:#fff}
.hm.h1 span{background:var(--accent-bg);color:var(--accent)}
.hm.h0 span{background:var(--sunk);color:var(--ink2)}
.hmkey{font-size:12.5px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.hmkey .hm span{min-width:0}
@media (prefers-reduced-motion: no-preference){ .opt,.chip,.btn{transition:background-color .15s, border-color .15s} }

{"id":"D1","heat":3,"title":"Days that honour people","hi":"महान व्यक्तियों को समर्पित दिवस","blocks":[{"k":"hot","h":"The most-asked kind: <b>whose birthday is this day?<\/b> — Teachers' Day (Radhakrishnan), Engineers' Day (Visvesvaraya), National Sports Day (Dhyan Chand), Statistics Day (Mahalanobis), Mathematics Day (Ramanujan), Youth Day (Vivekananda)."},{"k":"story","h":"<p>India marks its heroes by turning their birthdays into days with a purpose. A teacher-philosopher's birthday became <b>Teachers' Day<\/b>; an engineer who built dams became <b>Engineers' Day<\/b>; a hockey wizard became <b>Sports Day<\/b>; a monk who inspired the young became <b>Youth Day<\/b>.<\/p><p>So learn each day as a <b>person + job<\/b> pair: Radhakrishnan taught → 5 September; Visvesvaraya built → 15 September; Ramanujan counted → 22 December; Mahalanobis measured → 29 June; Dr B. C. Roy healed → 1 July.<\/p>","key":"The day's theme matches the person's work: teacher, engineer, sportsman, statistician, mathematician, doctor."},{"k":"table","title":"Days and dates","head":["Day","Date","Whom it honours"],"rows":[["National Youth Day","12 January","Birth anniversary of Swami Vivekananda (1863)."],["Parakram Diwas","23 January","Birth anniversary of Netaji Subhas Chandra Bose; observed since 2021."],["Martyrs' Day (Shaheed Diwas)","30 January","Mahatma Gandhi was assassinated on this day in 1948."],["National Women's Day","13 February","Birth anniversary of Sarojini Naidu."],["Shaheed Diwas for Bhagat Singh, Rajguru and Sukhdev","23 March","They were hanged in Lahore in 1931."],["Ambedkar Jayanti","14 April","Birth anniversary of Dr B. R. Ambedkar."],["National Statistics Day","29 June","Birth anniversary of P. C. Mahalanobis."],["National Doctors' Day","1 July","Birth and death anniversary of Dr B. C. Roy."],["Sadbhavana Diwas","20 August","Birth anniversary of Rajiv Gandhi."],["National Sports Day","29 August","Birth anniversary of hockey wizard Major Dhyan Chand."],["Teachers' Day","5 September","Birth anniversary of Dr Sarvepalli Radhakrishnan."],["Engineers' Day","15 September","Birth anniversary of Sir M. Visvesvaraya."],["Gandhi Jayanti","2 October","Also Lal Bahadur Shastri's birth anniversary."],["Rashtriya Ekta Diwas (National Unity Day)","31 October","Birth anniversary of Sardar Vallabhbhai Patel; since 2014."],["National Education Day","11 November","Birth anniversary of Maulana Abul Kalam Azad, India's first Education Minister."],["Children's Day","14 November","Birth anniversary of Jawaharlal Nehru."],["Janjatiya Gaurav Divas","15 November","Birth anniversary of Birsa Munda; since 2021."],["Mahaparinirvan Diwas","6 December","Death anniversary of Dr B. R. Ambedkar."],["National Mathematics Day","22 December","Birth anniversary of Srinivasa Ramanujan."],["Kisan Diwas (National Farmers' Day)","23 December","Birth anniversary of Chaudhary Charan Singh."],["Good Governance Day","25 December","Birth anniversary of Atal Bihari Vajpayee."],["Veer Bal Diwas","26 December","Martyrdom of the young sons (Sahibzadas) of Guru Gobind Singh; since 2022."]]},{"k":"calendar","title":"The year of birthdays","rows":[[1,12,"National Youth Day"],[1,23,"Parakram Diwas"],[1,30,"Martyrs' Day (Shaheed Diwas)"],[2,13,"National Women's Day"],[3,23,"Shaheed Diwas for Bhagat Singh, Rajguru and Sukhdev"],[4,14,"Ambedkar Jayanti"],[6,29,"National Statistics Day"],[7,1,"National Doctors' Day"],[8,20,"Sadbhavana Diwas"],[8,29,"National Sports Day"],[9,5,"Teachers' Day"],[9,15,"Engineers' Day"],[10,2,"Gandhi Jayanti"],[10,31,"Rashtriya Ekta Diwas (National Unity Day)"],[11,11,"National Education Day"],[11,14,"Children's Day"],[11,15,"Janjatiya Gaurav Divas"],[12,6,"Mahaparinirvan Diwas"],[12,22,"National Mathematics Day"],[12,23,"Kisan Diwas (National Farmers' Day)"],[12,25,"Good Governance Day"],[12,26,"Veer Bal Diwas"]],"cap":"Tap a month to see its days. January is busiest: Vivekananda (12), Netaji (23), and Gandhi's death anniversary (30)."},{"k":"table","title" hree: <b>5 Teacher, 14 Hindi, 15 Engineer<\/b>. December's farmer-to-governance run: <b>22 Ramanujan, 23 Charan Singh (Kisan), 24 Consumer, 25 Vajpayee (Good Governance)<\/b> — four days in a row."},{"k":"trap","h":"<b>National Youth Day<\/b> (12 Jan, Vivekananda) vs <b>International Youth Day<\/b> (12 Aug). <b>Teachers' Day<\/b> in India is 5 Sep; <b>World Teachers' Day<\/b> is 5 Oct. <b>National Education Day<\/b> is Azad's birthday (11 Nov); <b>Children's Day<\/b> is Nehru's (14 Nov)."}],"sum":["National Youth Day 12 Jan (Vivekananda); Parakram Diwas 23 Jan (Netaji); Martyrs' Day 30 Jan (Gandhi).","Statistics Day 29 Jun (Mahalanobis); Doctors' Day 1 Jul (B. C. Roy); Sports Day 29 Aug (Dhyan Chand).","Teachers' Day 5 Sep (Radhakrishnan); Engineers' Day 15 Sep (Visvesvaraya); National Unity Day 31 Oct (Patel).","Education Day 11 Nov (Azad); Children's Day 14 Nov (Nehru); Janjatiya Gaurav Divas 15 Nov (Birsa Munda).","Mathematics Day 22 Dec (Ramanujan); Kisan Diwas 23 Dec (Charan Singh); Good Governance Day 25 Dec (Vajpayee)."],"part":["Part 1 · National days of India","भारत के राष्ट्रीय दिवस"],"g":"dy"},
{"id":"D2","heat":3,"title":"National days for causes and events","hi":"कारणों और घटनाओं के राष्ट्रीय दिवस","blocks":[{"k":"hot","h":"Asked often: <b>National Science Day<\/b> (Raman effect), <b>National Voters' Day<\/b>, <b>National Technology Day<\/b> (Pokhran-II), <b>Constitution Day<\/b>, <b>National Handloom Day<\/b>, <b>Hindi Diwas<\/b>, <b>Panchayati Raj Day<\/b> and the new <b>National Space Day<\/b>."},{"k":"story","h":"<p>Other national days remember an <b>event<\/b>. On 28 February 1928 C. V. Raman announced his discovery — so that is <b>National Science Day<\/b>. On 11 May 1998 India tested nuclear weapons at Pokhran — <b>National Technology Day<\/b>. On 7 August 1905 the Swadeshi movement began — <b>National Handloom Day<\/b>. On 23 August 2023 Chandrayaan-3 touched down on the Moon — <b>National Space Day<\/b>.<\/p><p>The Constitution gives two: it was <b>adopted<\/b> on 26 November 1949 (Constitution Day) and came <b>into force<\/b> on 26 January 1950 (Republic Day). The Election Commission was born a day before — 25 January 1950 — so that is <b>National Voters' Day<\/b>.<\/p>","key":"Constitution adopted 26 Nov 1949 (Constitution Day); in force 26 Jan 1950 (Republic Day); EC founded 25 Jan 1950 (Voters' Day)."},{"k":"table","title":"Days and dates","head":["Day","Date","Why this date"],"rows":[["National Startup Day","16 January","Since 2022."],["National Girl Child Day","24 January","Since 2008."],["National Voters' Day","25 January","The Election Commission was set up on 25 January 1950."],["Republic Day","26 January","The Constitution came into force in 1950."],["National Science Day","28 February","C. V. Raman announced the Raman effect in 1928."],["National Safety Day","4 March",""],["National Vaccination Day","16 March","The first dose of oral polio vaccine was given in 1995."],["Civil Services Day","21 April","Sardar Patel addressed the first batch of officers in 1947."],["National Panchayati Raj Day","24 April","The 73rd Amendment came into force in 1993."],["National Technology Day","11 May","Pokhran-II nuclear tests, 1998."],["Anti-Terrorism Day","21 May","Death anniversary of Rajiv Gandhi (1991)."],["Samvidhan Hatya Diwas","25 June","Marks the Emergency of 1975; declared in 2024."],["National Broadcasting Day","23 July","Organised radio broadcasting began in 1927."],["National Handloom Day","7 August","The Swadeshi movement was launched on 7 August 1905."],["Partition Horrors Remembrance Day","14 August","Since 2021."],["Independence Day","15 August","1947."],["National Space Day","23 August","Chandrayaan-3 landed near the Moon's south pole in 2023."],["Hindi Diwas","14 September","The Constituent Assembly adopted Hindi as an official language in 1949."],["National Press Day","16 November","The Press Council of India began work in 1966."],["Constitution Day (Samvidhan Divas)","26 November","The Constitution was adopted in 1949; observed since 2015."],["National Pollution Control Day","2 December","In memory of the Bhopal gas tragedy victims (1984)."],["National Energy Conservation Day","14 December",""],["National Consumer Day","24 December","The Consumer Protection Act, 1986 got assent."]]},{"k":"calendar","title":"Days for causes, month by month","rows":[[1,16,"National Startup Day"],[1,24,"National Girl Child Day"],[1,25,"National Voters' Day"],[1,26,"Republic Day"],[2,28,"National Science Day"],[3,4,"National Safety Day"],[3,16,"National Vaccination Day"],[4,21,"Civil Services Day"],[4,24,"National Panchayati Raj Day"],[5,11,"National Technology Day"],[5,21,"Anti-Terrorism Day"],[6,25,"Samvidhan Hatya Diwas"],[7,23,"National Broadcasting Day"],[8,7,"National Handloom Day"],[8,14,"Partition Horrors Remembrance Day"],[8,15,"Independence Day"],[8,23,"National Space Day"],[9,14,"Hindi Diwas"],[11,16,"National Press Day"],[11,26,"Constitution Day (Samvidhan Divas)"],[12,2,"National Pollution Control Day"],[12,14,"National Energy Conservation Day"],[12,24,"National Consumer Day"]],"cap":"Tap a month. Many began recently — Startup Day (2022), Girl Child Day (2008), Voters' Day (2011)."},{"k":"trick","h":"Late January cluster — <b>24 girl, 25 voter, 26 republic<\/b>: a girl grows up, votes, and celebrates the Republic. <b>11 May 1998 = Technology<\/b>; <b>23 Aug 2023 = Space<\/b>."},{"k":"trap","h":"<b>Constitution Day<\/b> (26 Nov) is not <b>Republic Day<\/b> (26 Jan). <b>Hindi Diwas<\/b> (14 Sep, India) is not <b>World Hindi Day<\/b> (10 Jan). <b>National Science Day<\/b> is 28 Feb — not Raman's birthday (7 Nov)."}],"sum":["National Voters' Day 25 Jan; Republic Day 26 Jan; National Science Day 28 Feb (Raman effect, 1928).","Panchayati Raj Day 24 Apr; National Technology Day 11 May (Pokhran-II); Anti-Terrorism Day 21 May.","National Handloom Day 7 Aug (Swadeshi, 1905); National Space Day 23 Aug (Chandrayaan-3); Hindi Diwas 14 Sep.","Constitution Day 26 Nov (adopted 1949); National Pollution Control Day 2 Dec (Bhopal).","National Consumer Day 24 Dec; Samvidhan Hatya Diwas 25 Jun (Emergency, 1975)."],"part":["Part 1 · National days of India","भारत के राष्ट्रीय दिवस"],"g":"dy"},
{"id":"D3","heat":2,"title":"Armed forces and security days","hi":"सशस्त्र बल और सुरक्षा दिवस","blocks":[{"k":"hot","h":"Regulars: <b>Army Day<\/b> (15 Jan), <b>Air Force Day<\/b> (8 Oct), <b>Navy Day<\/b> (4 Dec), <b>Armed Forces Flag Day<\/b> (7 Dec), <b>Kargil Vijay Diwas<\/b> (26 Jul) and <b>Vijay Diwas<\/b> (16 Dec)."},{"k":"story","h":"<p>Each service has its own birthday-like day. The <b>Army<\/b> celebrates 15 January, when General K. M. Cariappa took over from the last British commander in 1949. The <b>Air Force<\/b> was set up on 8 October 1932. The <b>Navy<\/b> marks 4 December, when Indian missile boats struck Karachi in 1971 (Operation Trident).<\/p><p>Two victories are remembered: <b>16 December<\/b> 1971, when Pakistan's army surrendered in Dhaka and Bangladesh was born, and <b>26 July<\/b> 1999, when the Kargil heights were won back. On <b>7 December<\/b> every citizen can donate on Armed Forces Flag Day.<\/p>","key":"Army 15 Jan, Air Force 8 Oct, Navy 4 Dec; Kargil 26 Jul, Vijay Diwas 16 Dec."},{"k":"cards","title":"The three services' days","rows":[["Army Day","15 January","1949: K. M. Cariappa became the first Indian Commander-in-Chief","🪖"],["Air Force Day","8 October","1932: the Indian Air Force was set up","✈️"],["Navy Day","4 December","1971: Operation Trident, the attack on Karachi harbour","⚓"]]},{"k":"table","title":"Days and dates","head":["Day","Date","Why this date"],"rows":[["Armed Forces Veterans' Day","14 January","Field Marshal K. M. Cariappa retired on this day in 1953."],["Army Day","15 January","Cariappa became the first Indian Commander-in-Chief in 1949."],["NDRF Raising Day","19 January",""],["Indian Coast Guard Day","1 February",""],["CISF Raising Day","10 March",""],["CRPF Raising Day","27 July",""],["Kargil Vijay Diwas","26 July","Victory in the Kargil war, 1999 (Operation Vijay)."],["Air Force Day","8 October","The Indian Air Force was formed in 1932."],["Territorial Army Day","9 October",""],["Police Commemoration Day","21 {"id":"D4","heat":2,"title":"World days: January to April","hi":"विश्व दिवस: जनवरी–अप्रैल","blocks":[{"k":"hot","h":"Favourites from these months: <b>World Hindi Day<\/b>, <b>International Mother Language Day<\/b>, <b>International Women's Day<\/b>, <b>World Consumer Rights Day<\/b>, <b>World Heritage Day<\/b>, <b>World Book Day<\/b> and <b>World Intellectual Property Day<\/b>."},{"k":"story","h":"<p>Most world days are fixed by the <b>United Nations<\/b> or one of its agencies, and many have a story. <b>International Mother Language Day<\/b> (21 Feb) remembers students killed in Dhaka in 1952 while demanding Bengali as a state language. <b>World Book Day<\/b> (23 Apr) falls on the day Shakespeare and Cervantes died. <b>World Hindi Day<\/b> (10 Jan) remembers the first World Hindi Conference in Nagpur in 1975.<\/p>","key":"Feb 21 mother language, Mar 8 women, Mar 15 consumers, Apr 18 heritage, Apr 23 books."},{"k":"table","title":"Days and dates","head":["Day","Date","Note"],"rows":[["World Braille Day","4 January","Birth anniversary of Louis Braille."],["World Hindi Day","10 January","The first World Hindi Conference was held in Nagpur in 1975."],["International Day of Education","24 January",""],["World Pulses Day","10 February",""],["World Radio Day","13 February","Proclaimed by UNESCO."],["World Day of Social Justice","20 February",""],["International Mother Language Day","21 February","Remembers the 1952 language movement in Dhaka; declared by UNESCO."],["International Women's Day","8 March",""],["World Consumer Rights Day","15 March","Inspired by J. F. Kennedy's 1962 speech."],["International Day of Happiness","20 March",""],["World Poetry Day","21 March",""],["World Theatre Day","27 March",""],["International Day for Sport for Development and Peace","6 April",""],["International Day of Human Space Flight","12 April","Yuri Gagarin's flight, 1961."],["World Heritage Day (International Day for Monuments and Sites)","18 April",""],["World Book and Copyright Day", {"id":"D5","heat":2,"title":"World days: May to August","hi":"विश्व दिवस: मई–अगस्त","blocks":[{"k":"hot","h":"Asked a lot: <b>International Day of Yoga<\/b> (21 Jun), <b>World Population Day<\/b> (11 Jul), <b>World Day Against Child Labour<\/b> (12 Jun), <b>World Red Cross Day<\/b> (8 May), <b>World Press Freedom Day<\/b> (3 May), <b>World Milk Day<\/b> (1 Jun) and <b>International Youth Day<\/b> (12 Aug)."},{"k":"story","h":"<p><b>International Day of Yoga<\/b> is India's gift to the calendar: proposed by India at the UN in 2014 and first observed on 21 June 2015 — the longest day of the year in the northern hemisphere. <b>World Red Cross Day<\/b> is Henry Dunant's birthday; <b>World Chess Day<\/b> marks FIDE's founding; <b>Olympic Day<\/b> marks the IOC's.<\/p>","key":"21 June — yoga (longest day); 11 July — population; 12 August — youth."},{"k":"table","title":"Days and dates","head":["Day","Date","Note"],"rows":[["International Labour Day (May Day)","1 May",""],["World Press Freedom Day","3 May",""],["World Red Cross Day","8 May","Birth anniversary of Henry Dunant, founder of the Red Cross."],["International Day of Families","15 May",""],["World Telecommunication and Information Society Day","17 May","ITU was founded on 17 May 1865."],["International Museum Day","18 May",""],["World Milk Day","1 June","Declared by the FAO in 2001; India's National Milk Day is 26 November (Verghese Kurien)."],["World Bicycle Day","3 June",""],["World Day Against Child Labour","12 June","Started by the ILO in 2002."],["World Refugee Day","20 June",""],["International Day of Yoga","21 June","First observed in 2015, after India's proposal at the UN."],["International Olympic Day","23 June","The IOC was founded on 23 June 1894."],["International Day Against Drug Abuse and Illicit Trafficking","26 June",""],["World Population Day","11 July","Set up by the UNDP's governing council in 1989."],["World Youth Skills Day","15 July",""],["Nelson Mandela International Day","18 July","Mandela' {"id":"D6","heat":2,"title":"World days: September to December","hi":"विश्व दिवस: सितंबर–दिसंबर","blocks":[{"k":"hot","h":"Most asked: <b>International Literacy Day<\/b>, <b>International Day of Peace<\/b>, <b>World Tourism Day<\/b>, <b>World Teachers' Day<\/b>, <b>World Post Day<\/b>, <b>World Food Day<\/b>, <b>UN Day<\/b>, <b>Human Rights Day<\/b> and the day for <b>persons with disabilities<\/b>."},{"k":"story","h":"<p>The last four months are full of UN birthdays. The <b>UN<\/b> itself was born on 24 October 1945 (UN Day); its food agency, the <b>FAO<\/b>, a week earlier on 16 October (World Food Day). The <b>Universal Postal Union<\/b> dates from 9 October 1874 (World Post Day). And on 10 December 1948 the UN adopted the <b>Universal Declaration of Human Rights<\/b> — Human Rights Day.<\/p>","key":"16 Oct FAO, 24 Oct UN, 10 Dec human rights."},{"k":"table","title":"Days and dates","head":["Day","Date","Note"],"rows":[["International Literacy Day","8 September",""],["International Day of Democracy","15 September",""],["International Day of Peace","21 September",""],["World Tourism Day","27 September",""],["International Day of Older Persons","1 October",""],["International Day of Non-Violence","2 October","Gandhi's birthday."],["World Teachers' Day","5 October","India's own Teachers' Day is 5 September."],["World Post Day","9 October","The Universal Postal Union was founded in 1874."],["International Day of the Girl Child","11 October",""],["World Standards Day","14 October",""],["World Food Day","16 October","The FAO was founded on 16 October 1945."],["International Day for the Eradication of Poverty","17 October",""],["United Nations Day","24 October","The UN Charter came into force in 1945."],["World Cities Day","31 October",""],["World Science Day for Peace and Development","10 November",""],["International Day for Tolerance","16 November",""],["World Television Day","21 November",""],["International Day for the Elimination of Violence against Women","25 Nov {"id":"D7","heat":3,"title":"Health days","hi":"स्वास्थ्य दिवस","blocks":[{"k":"hot","h":"Health days are asked in almost every exam: <b>World Health Day<\/b> (WHO's birthday), <b>World TB Day<\/b>, <b>World Malaria Day<\/b>, <b>World No Tobacco Day<\/b>, <b>World Blood Donor Day<\/b>, <b>World Heart Day<\/b>, <b>World Diabetes Day<\/b> and <b>World AIDS Day<\/b>."},{"k":"story","h":"<p>Many health days honour a scientist's birthday or discovery. <b>World Blood Donor Day<\/b> is Karl Landsteiner's birthday (he found the ABO groups). <b>World Diabetes Day<\/b> is Frederick Banting's (insulin). <b>World TB Day<\/b> is the day Robert Koch announced the TB germ. <b>World Mosquito Day<\/b> marks Ronald Ross's malaria discovery in India. <b>World Rabies Day<\/b> is Pasteur's death anniversary.<\/p>","key":"WHO born 7 Apr 1948; Landsteiner 14 Jun; Banting 14 Nov; Koch 24 Mar; Ross 20 Aug."},{"k":"table","title":"Days and dates","head":["Day","Date","Note"],"rows":[["World Leprosy Day","Last Sunday of January","India observes Anti-Leprosy Day on 30 January (Gandhi's death anniversary)."],["World Cancer Day","4 February",""],["National Deworming Day (India)","10 February",""],["World Hearing Day","3 March",""],["World Kidney Day","Second Thursday of March",""],["World Down Syndrome Day","21 March",""],["World Tuberculosis Day","24 March","Robert Koch announced the TB bacterium in 1882."],["World Autism Awareness Day","2 April",""],["World Health Day","7 April","The WHO was founded on 7 April 1948."],["World Homoeopathy Day","10 April","Birth anniversary of Samuel Hahnemann."],["World Haemophilia Day","17 April",""],["World Malaria Day","25 April",""],["World Hand Hygiene Day","5 May",""],["National Dengue Day (India)","16 May",""],["World Hypertension Day","17 May",""],["World No Tobacco Day","31 May",""],["World Blood Donor Day","14 June","Birth anniversary of Karl Landsteiner, who found the ABO blood groups."],["World Zoonoses Day","6 July","Louis Pasteur gave the first rabies vaccine on 6 July 1885."],["World Hepatitis Day","28 July","Birthday of Baruch Blumberg, who discovered the hepatitis B virus."],["World Mosquito Day","20 August","Ronald Ross showed in 1897 that mosquitoes carry malaria."],["World Patient Safety Day","17 September",""],["World Alzheimer's Day","21 September",""],["World Rabies Day","28 September","Death anniversary of Louis Pasteur."],["World Heart Day","29 September",""],["World Mental Health Day","10 October",""],["World Polio Day","24 October","Started by Rotary International."],["World Pneumonia Day","12 November",""],["World Diabetes Day","14 November","Birthday of Frederick Banting, co-discoverer of insulin."],["World AIDS Day","1 December",""],["Universal Health Coverage Day","12 December",""]]},{"k":"calendar","title":"Health days","rows":[[2,4,"World Cancer Day"],[2,10,"National Deworming Day (India)"],[3,3,"World Hearing Day"],[3,21,"World Down Syndrome Day"],[3,24,"World Tuberculosis Day"],[4,2,"World Autism Awareness Day"],[4,7,"World Health Day"],[4,10,"World Homoeopathy Day"],[4,17,"World Haemophilia Day"],[4,25,"World Malaria Day"],[5,5,"World Hand Hygiene Day"],[5,16,"National Dengue Day (India)"],[5,17,"World Hypertension Day"],[5,31,"World No Tobacco Day"],[6,14,"World Blood Donor Day"],[7,6,"World Zoonoses Day"],[7,28,"World Hepatitis Day"],[8,20,"World Mosquito Day"],[9,17,"World Patient Safety Day"],[9,21,"World Alzheimer's Day"],[9,28,"World Rabies Day"],[9,29,"World Heart Day"],[10,10,"World Mental Health Day"],[10,24,"World Polio Day"],[11,12,"World Pneumonia Day"],[11,14,"World Diabetes Day"],[12,1,"World AIDS Day"],[12,12,"Universal Health Coverage Day"]],"cap":"World Health Day is 7 April, the day the WHO was founded (1948)."},{"k":"trick","h":"Year-ends: <b>World AIDS Day opens December<\/b> (1 Dec). <b>Tobacco closes May<\/b> (31 May). <b>Heart in September<\/b> (29 Sep), <b>mind in October<\/b> (10 Oct)."},{"k":"trap","h":"<b>World Health Day<\/b> 7 Apr vs <b>World Heart Day<\/b> 29 Sep. <b>World TB Day<\/b> 24 Mar vs <b>World Malaria Day<\/b> 25 Apr. <b>World Polio Day<\/b> 24 Oct shares its date with <b>UN Day<\/b>."}],"sum":["World Cancer Day 4 Feb; World TB Day 24 Mar; World Health Day 7 Apr (WHO, 1948).","World Malaria Day 25 Apr; World No Tobacco Day 31 May; World Blood Donor Day 14 Jun.","World Hepatitis Day 28 Jul; World Mosquito Day 20 Aug; World Heart Day 29 Sep.","World Mental Health Day 10 Oct; World Polio Day 24 Oct; World Diabetes Day 14 Nov.","World AIDS Day 1 Dec; Universal Health Coverage Day 12 Dec."],"part":["Part 2 · World days","विश्व दिवस"],"g":"dy"},
{"id":"D8","heat":3,"title":"Environment and nature days","hi":"पर्यावरण और प्रकृति दिवस","blocks":[{"k":"hot","h":"Very common: <b>World Environment Day<\/b> (5 Jun), <b>Earth Day<\/b> (22 Apr), <b>World Water Day<\/b> (22 Mar), <b>World Wetlands Day<\/b> (2 Feb), <b>World Wildlife Day<\/b> (3 Mar), <b>World Ozone Day<\/b> (16 Sep), <b>International Tiger Day<\/b> (29 Jul) and <b>Biodiversity Day<\/b> (22 May)."},{"k":"story","h":"<p>Nature days often mark the signing of a treaty. <b>World Wetlands Day<\/b> (2 Feb) — the Ramsar Convention of 1971. <b>World Wildlife Day<\/b> (3 Mar) — CITES, 1973. <b>World Ozone Day<\/b> (16 Sep) — the Montreal Protocol, 1987. <b>World Environment Day<\/b> (5 Jun) — the Stockholm Conference opened on that day in 1972, and the UN Environment Programme (UNEP) was born from it.<\/p><p>Late March is the forest-and-water week: <b>Forests on 21, Water on 22, Weather on 23<\/b>.<\/p>","key":"Treaty days: 2 Feb Ramsar, 3 Mar CITES, 16 Sep Montreal. 21-22-23 March: forests, water, weather."},{"k":"table","title":"Days and dates","head":["Day","Date","Note"],"rows":[["World Wetlands Day","2 February","The Ramsar Convention was signed on 2 February 1971."],["World Wildlife Day","3 March","CITES was signed on 3 March 1973."],["World Sparrow Day","20 March",""],["International Day of Forests","21 March",""],["World Water Day","22 March",""],["World Meteorological Day","23 March","The WMO came into being in 1950."],["International Day of Zero Waste","30 March","Observed since 2023."],["Earth Day","22 April","First held in 1970."],["World Bee Day","20 May",""],["International Day for Biological Diversity","22 May",""],["World Environment Day","5 June","Set up after the 1972 Stockholm Conference; led by UNEP."],["World Oceans Day","8 June",""],["World Day to Combat Desertification and Drought","17 June",""],["International Day for the Conservation of the Mangrove Ecosystem","26 July",""],["World Nature Conservation Day","28 July",""],["Internationa /* ---------- quiz games (60 seconds) ---------- */
function labDeck(id){
  const d = LAB_CONF.decks.find(x => x.id === id);
  const ask = (pre, t) => pre ? `${pre} ${t}${/[?:]$/.test(pre) ? "" : "?"}` : t;
  let items = d.make ? d.make() : d.pairs.map(p => ({ p: ask(d.q, p[0]), a: p[1], note: p[2] || "", raw: p[0], pool: "a" }));
  if (d.rq && !d.make) {   // also ask the other way round, where an answer belongs to one prompt only
    const n = {}; d.pairs.forEach(p => { n[p[1]] = (n[p[1]] || 0) + 1; });
    items = items.concat(d.pairs.filter(p => n[p[1]] === 1).map(p => ({ p: ask(d.rq, p[1]), a: p[0], note: p[2] || "", raw: p[1], pool: "p" })));
  }
  return { d, items };
}
function labIntro(id){

      <p style="margin:0">${L.best[d.id] ? "Your best: <b>" + L.best[d.id] + "</b>" : "First go — no pressure."}</p>
      <div class="row" style="justify-content:center"><button class="btn pri" type="button" id="labgo">▶ Start</button><button class="btn" type="button" id="labpairs">See all pairs</button>${d.lesson ? `<button class="btn ghost" type="button" id="lablesson">Read the lesson</button>` : ""}</div></div>
    <div id="labpairlist"></div></section>`;
  labBindHome();
  $("#labgo").onclick = () => labRun(id);
  $("#labpairs").onclick = () => { $("#labpairlist").innerHTML = `<div class="block"><h3>${list.length} pairs to know</h3><div class="lab-pairs">${list.map(p => `<div><span>${esc(p[0])}</span><b>${esc(p[1])}</b></div>`).join("")}</div></div>`; };
  const lb = $("#lablesson"); if (lb) lb.onclick = () => openLesson(d.lesson, "learn");
}
let LG = null;
function labRun(id){
  labStop();
  const { d, items } = labDeck(id);
  LG = { d, items: shuffle(items), i: 0, score: 0, right: 0, tried: 0, combo: 0, maxc: 0, left: 60, miss: [], lock: false };
  $("#app").innerHTML = `<section class="view stack lab-play">
    <div class="lab-hud"><button class="back" type="button" id="labquit">✕ Stop</button><span class="lab-combo" id="labcombo"></span><span class="sc" id="labscore">0</span></div>
    <div class="lab-time" id="labtime"><i style="width:100%"></i></div>
    <div class="lab-q" id="labq" aria-live="polite"></div>
    <div class="lab-opts" id="labopts"></div>
    <div class="lab-flash" id="labflash"></div></section>`;
  $("#labquit").onclick = () => { labStop(); labOver(); };
  labNext();
  LAB.timer = setInterval(() => {
    LG.left--; const t = $("#labtime"); if (!t) { labStop(); return; }
    t.firstElementChild.style.width = (LG.left / 60 * 100) + "%"; t.classList.toggle("low", LG.left <= 10);
    if (LG.left <= 0) { labStop(); labOver(); }
  }, 1000);
}
function labOptions(it){
  const d = LG.d;
  if (d.opts) return d.opts.slice();
  if (d.options) return d.options(it);
  // wrong options come from the same side of the deck as the answer (names with names, dates with dates)
  const answers = [...new Set(it.all || LG.items.filter(x => x.pool === it.pool).map(x => x.a))].filter(a => a !== it.a);
  const pool = shuffle(answers).slice(0, 3);
  return shuffle([it.a].concat(pool));
}
function labNext(){
  if (LG.i >= LG.items.length) { LG.items = shuffle(LG.items); LG.i = 0; }
  const it = LG.items[LG.i], opts = labOptions(it);
  LG.cur = it; LG.lock = false;
  const q = $("#labq"); q.innerHTML = `<span class="lab-pop">${esc(it.p)}</span>`;
  const box = $("#labopts"); box.className = "lab-opts" + (opts.length === 3 ? " three" : "");
  box.innerHTML = opts.map(o => `<button type="button" data-o="${esc(o)}">${esc(o)}</button>`).join("");
  box.querySelectorAll("button").forEach(b => b.onclick = () => labPick(b));
}
function labPick(b){
  if (LG.lock) return; LG.lock = true;
  const it = LG.cur, ok = b.dataset.o === it.a;
  LG.tried++;
  if (ok) {
    LG.right++; LG.combo++; LG.maxc = Math.max(LG.maxc, LG.combo);
    const gain = 10 + Math.min(LG.combo - 1, 5) * 2;
    LG.score += gain; b.classList.add("ok");
    $("#labflash").textContent = it.note ? it.note : "+" + gain;
  } else {
    LG.combo = 0; b.classList.add("no");
    $("#labopts").querySelectorAll("button").forEach(x => { if (x.dataset.o === it.a) x.classList.add("ok"); });
    LG.miss.push(it); $("#labflash").textContent = (it.note ? it.note + " · " : "") + "Answer: " + it.a;
  }
  $("#labscore").textContent = LG.score;
  $("#labcombo").textContent = LG.combo >= 2 ? "🔥 ×" + LG.combo : "";
  LG.i++;
  setTimeout(() => { if (LAB.timer && $("#labopts")) labNext(); }, ok ? 450 : 1200);
}
function labOver(){
  const L = labS(), id = LG.d.id, best = !L.best[id] || LG.score > L.best[id];
  if (best && LG.score > 0) L.best[id] = LG.score;
  L.xp = (L.xp || 0) + LG.right; L.plays = (L.plays || 0) + 1; save();
  const acc = LG.tried ? Math.round(LG.right * 100 / LG.tried) : 0, seen = new Set();
  const miss = LG.miss.filter(m => { if (seen.has(m.p)) return false; seen.add(m.p); return true; });
  const { r } = labRank(L.xp);
  $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}
    <div class="block lab-res lab-pop"><span class="eyebrow">${esc(LG.d.title)}</span><div class="big">${LG.score}</div>
      <p>${best && LG.score > 0 ? "🎉 New best!" : "Best: " + (L.best[id] || 0)} · ${LG.right}/${LG.tried} right (${acc}%) · longest combo ${LG.maxc} · +${LG.right} XP</p>
      <p class="muted" style="margin:0">${r[2]} ${r[1]} · ${L.xp} XP</p>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn pri" type="button" id="again">Play again</button><button class="btn" type="button" data-lab-home>More games</button></div></div>
    ${miss.length ? `<div class="block"><h3>Fix these ${miss.length}</h3><div class="lab-miss">${miss.map(m => `<div><span>${esc(m.p)}</span><b>${esc(m.a)}</b></div>`).join("")}</div></div>` : (LG.tried ? `<div class="block"><p style="margin:0">💯 No mistakes — try to beat your score.</p></div>` : "")}
  </section>`;
  labBindHome();
  $("#again").onclick = () => labRun(id);
}

/* ---------- memory match ---------- */
function labMatch(){
  labStop();
  const all = LAB_CONF.decks.find(d => d.id === LAB_CONF.match.deck).pairs, n = {};
  all.forEach(p => { n[p[1]] = (n[p[1]] || 0) + 1; });
  const pairs = shuffle(all.filter(p => n[p[1]] === 1)).slice(0, 6);
  const cards = shuffle(pairs.flatMap((p, i) => [{ k: i, t: p[0] }, { k: i, t: p[1] }]));
  const M = { cards, up: [], done: new Set(), moves: 0, t0: Date.now() };
  const draw = () => {
    $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}
      <div class="lab-hud"><div><span class="eyebrow">Memory Match</span><h2 style="margin:4px 0 0">${esc(LAB_CONF.match.title)}</h2></div><span class="sc">${M.moves} moves</span></div>
      <div class="mm">${M.cards.map((c, i) => `<button type="button" data-i="${i}" class="${M.done.has(c.k) ? "done" : M.up.includes(i) ? "up" : ""}" aria-label="${M.done.has(c.k) || M.up.includes(i) ? esc(c.t) : "Hidden card " + (i + 1)}">${M.done.has(c.k) || M.up.includes(i) ? esc(c.t) : "?"}</button>`).join("")}</div></section>`;
    labBindHome();
    $("#app").querySelectorAll(".mm button").forEach(b => b.onclick = () => flip(+b.dataset.i));
  };
  const flip = i => {
    if (M.up.length === 2 || M.up.includes(i) || M.done.has(M.cards[i].k)) return;
    M.up.push(i); draw();
    if (M.up.length === 2) {
      M.moves++;
      const [a, b] = M.up;
      if (M.cards[a].k === M.cards[b].k) { M.done.add(M.cards[a].k); M.up = []; setTimeout(() => { draw(); if (M.done.size === 6) done(); }, 250); }
      else setTimeout(() => { M.up = []; draw(); }, 900);
    }
  };
  const done = () => {
    const L = labS(), best = !L.match || M.moves < L.match; if (best) L.match = M.moves;
    L.xp = (L.xp || 0) + 12; L.plays = (L.plays || 0) + 1; save();
    $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}<div class="block lab-res lab-pop"><span class="eyebrow">Memory Match</span><div class="big">${M.moves}</div>
      <p>moves · ${Math.round((Date.now() - M.t0) / 1000)} s · ${best ? "🎉 New best!" : "Best: " + L.match + " moves"} · +12 XP</p>
      <div class="lab-pairs" style="text-align:left">${pairs.map(p => `<div><span>${esc(p[0])}</span><b>${esc(p[1])}</b></div>`).join("")}</div>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn pri" type="button" id="again">New cards</button><button class="btn" type="button" data-lab-home>More games</button></div></div></section>`;
    labBindHome(); $("#again").onclick = labMatch;
  };
  draw(); window.scrollTo(0, 0);
}


/* ---------- decks from the lessons' own tables ---------- */
/** Rows of a lesson's n-th table as [prompt, answer, note] (tags stripped), so a deck never repeats the data. */
function labRows(lessonId, n){
  const strip = s => String(s == null ? "" : s).replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&minus;/g, "−").trim();
  const l = LESSONS.find(x => x.id === lessonId), t = l ? l.blocks.filter(b => b.k === "table")[n || 0] : null;
  return t ? t.rows.map(r => [strip(r[0]), strip(r[1]), strip(r[2])]) : [];
}
/** A "grand mix" deck: a few rows from every listed deck, with each deck's own question wording. */
function labMix(decks){
  // wrong options come from the whole deck (all), so a deck drawn only once or twice in the 80 still has enough
  return shuffle(decks.flatMap(d => { const all = [...new Set(d.pairs.map(p => p[1]))];
    return d.pairs.map(p => ({ p: d.q ? `${d.q} ${p[0]}${/[?:]$/.test(d.q) ? "" : "?"}` : p[0], a: p[1], note: p[2] || "", pool: d.id, all })); })).slice(0, 80);
}

<script>

    <div class="block"><h3>Where the marks are</h3><dl class="facts prose">${GROUPS.filter(g=>ERANOTE[g.id]).map(g=>`<div><dt>${esc(g.name)}</dt><dd>${ERANOTE[g.id]}</dd></div>`).join("")}</dl>
      <p class="muted" style="font-size:13px;margin-top:8px">The dots next to each lesson show how often its topic comes up: three dots means almost every shift.</p></div>
  </section>`;
  bindGo($("#app"));
  $("#toplan").onclick = () => go("plan");
}

/* ============================================================
   LEARN (subject app)
   ============================================================ */
function lessonRow(l, nextL){
  const st = lessonState(l.id), n = byLesson(l.id).length;
  return `<button type="button" class="les ${lesDone(l)?"done":""} ${nextL&&l.id===nextL.id?"next":""}" data-open="${l.id}">
    <span class="no">${lesDone(l) ? "✓" : LNUM(l.id)}</span>
    <span class="t"><b>${esc(l.title)}${heatDots(l.heat)}</b><span>${l.hi} · ${n} questions</span></span>
    <span class="sc">${st.best!=null ? `best<br>${st.best}/${n}` : ""}</span></button>`;
}
function renderLearn(){
  const done = LESSONS.filter(lesDone).length;
  const nextL = LESSONS.find(l => !lesDone(l));
  const it = INTROS[APP.id] || {};
  const parts = [];
  LESSONS.forEach(l => {
    const name = l.part ? l.part[0] : "";
    if (!parts.length || parts[parts.length-1].name !== name) parts.push({ name, hi: l.part ? l.part[1] : "", ls: [] });
    parts[parts.length-1].ls.push(l);
  });
  $("#app").innerHTML = `<section class="view stack">
    <div class="hero">
      <span class="eyebrow">${esc(APP.hi)}${APP.tagline ? " \u00b7 " + esc(APP.tagline) : ""}</span>
      <h1>${esc(APP.title)}</h1>
      <p>${it.lead ? esc(it.lead) + " " : ""}${LESSONS.length} lessons and ${QS.length} exam-style questions. Each lesson starts with a short story, then the tables, tricks and traps, a quiz and a one-screen summary.</p>
      <div class="meter" aria-label="Lessons done"><i style="width:${done/LESSONS.length*100}%"></i></div>
      <div class="row between"><span class="muted num" style="font-size:13px">${done}/${LESSONS.length} lessons done</span>
      ${nextL ? `<button class="btn pri sm" type="button" data-open="${nextL.id}">${done? "Continue" : "Start"}: ${esc(nextL.title)}</button>` : `<span class="muted" style="font-size:13px">All lessons done. Try a mock test.</span>`}</div>
    </div>
    ${it.tip ? `<div class="callout"><b>How to study it.</b> ${esc(it.tip)} ${esc(it.order || "")}</div>` : ""}
    ${HEATMAP ? `<details class="block hmwrap"><summary><h3>Exam heat map</h3><span class="muted">which lessons carry the marks in each exam \u203a</span></summary>${heatHTML(false)}</details>` : ""}
    ${parts.map(p => `${p.name ? `<div class="grph"><h2>${esc(p.name)}</h2><span>${p.ls.length} lessons</span></div>${p.hi?`<p class="muted" style="font-size:13px;margin:-8px 0 2px">${p.hi}</p>`:""}` : ""}
      <div class="lessons">${p.ls.map(l => lessonRow(l, nextL)).join("")}</div>`).join("")}
    <p class="foot">The dots show how often a topic is asked &mdash; three dots means almost every paper.${hubLink(" A plan across every app in this subject, and revision across all of them, is in ", APP.hub ? APP.hub.title : "", null, ".")}</p>
  </section>`;
  $("#app").querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openLesson(b.dataset.open, "learn")));
  bindGo($("#app"));
}

function blockHTML(b){
  if (b.k==="p") return `<div class="plain"><p>${b.h}</p></div>`;
  if (b.k==="hot") return `<div class="hot"><span class="lab">Why it is asked</span>${b.h}</div>`;
  if (b.k==="story") return `<div class="story"><span class="lab">${esc(APP.storyLabel || "The story first \u00b7 two minutes")}</span>${b.h}${b.key?`<p class="key"><b>${esc(APP.keyLabel || "Carry this into the tables:")}</b> ${esc(b.key)}</p>`:""}</div>`;
  if (b.k==="trick") return `<div class="trick"><span class="lab">Trick</span>${b.h}</div>`;
  if (b.k==="trap") return `<div class="trap"><span class="lab">Trap · don't mix these up</span>${b.h}</div>`;
  if (b.k==="link") return `<div class="link"><span class="lab">Link it up</span>${b.h}</div>`;
  if (b.k==="ex") return `<div class="link"><span class="lab">Worked example</span>${b.h}</div>`;
  if (b.k==="facts") return `<div class="block"><h3>${b.title}</h3><dl class="facts">${b.rows.map(r=>`<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join("")}</dl></div>`;
  if (b.k==="tl") return `<div class="block"><h3>${b.title}</h3><ul class="tl">${b.rows.map(r=>`<li><span class="y">${r[0]}</span><span>${r[1]}</span></li>`).join("")}</ul></div>`;
  if (b.k==="table") return `<div class="block"><h3>${b.title}</h3><div class="tbl"><table><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  if (b.k==="fig") return `<div class="block${b.wide?" phblock":""}"><h3>${b.title}</h3><figure class="fig${b.wide?" wide":""}"${b.wide?` style="--minw:${b.wide}px"`:""}>${b.svg}<figcaption>${b.cap}</figcaption></figure></div>`;
  return typeof visBlock === "function" ? visBlock(b) : "";      // photos, maps, charts, timelines… from study-visual.js
}

let LQ = null;
function openLesson(id, step){
  if (HUB || !L(id) || appOf(id) !== APP.id) { openApp(appOf(id), id); return; }   // the hub shows lessons in their own app
  const l = L(id), i = LNUM(id);
  if (step === "quiz") { LQ = { id, list: shuffle(byLesson(id)).map(q => ({q, perm:makePerm(q)})), i:0, score:0, picked:null }; }
  const head = `<div class="lhead"><button class="back" type="button" id="lback">‹ Lessons</button></div>
    <span class="eyebrow">${esc(APP.title)} · Lesson ${i} of ${LESSONS.length} · ${l.hi}</span><h1>${esc(l.title)}</h1>
    <p class="muted" style="font-size:13px">Asked in CGL ${heatDots(l.heat)} ${l.heat===3?"— almost every shift":l.heat===2?"— often":"— now and then"}</p>
    <div class="steps" role="tablist">
      <button type="button" data-step="learn" aria-current="${step==="learn"?"step":"false"}">1 · Learn</button>
      <button type="button" data-step="quiz" aria-current="${step==="quiz"?"step":"false"}">2 · Quiz</button>
      <button type="button" data-step="sum" aria-current="${step==="sum"?"step":"false"}">3 · Summary</button>
    </div>`;
  let body = "";
  if (step === "learn") {
    body = `<div class="stack">${l.blocks.map(blockHTML).join("")}
      <div class="row end"><button class="btn pri" type="button" id="toquiz">Take the quiz · ${byLesson(id).length} questions</button></div></div>`;
  } else if (step === "quiz") {
    body = `<div id="lq"></div>`;
  } else {
    const nxt = LESSONS[i];
    body = `<div class="stack"><div class="block"><h3>Remember these</h3><ul class="sum">${l.sum.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
      <div class="row between"><button class="btn" type="button" id="relearn">Read again</button>
      ${nxt ? `<button class="btn pri" type="button" id="nextles">Next: ${esc(nxt.title)}</button>` : `<button class="btn pri" type="button" id="tomock">Take a mock test</button>`}</div></div>`;
    S.les[id] = Object.assign(S.les[id]||{}, {done:1}); save(); renderTop();
  }
  $("#app").innerHTML = `<section class="view stack">${head}${body}</section>`;
  $("#lback").onclick = () => go("learn");
  $("#app").querySelectorAll("[data-step]").forEach(b => b.onclick = () => openLesson(id, b.dataset.step));
  if (step==="learn") $("#toquiz").onclick = () => openLesson(id,"quiz");
  if (step==="quiz") renderLQ();
  if (step==="sum") {
    $("#relearn").onclick = () => openLesson(id,"learn");
    const n = $("#nextles"); if (n) n.onclick = () => openLesson(LESSONS[i].id,"learn");
    const m = $("#tomock"); if (m) m.onclick = () => go("mock");
  }
  window.scrollTo(0,0);
}

function optsHTML(q, perm, state){
  return perm.map((oi, k) => {
    let cls = "opt";
    if (state.reveal) { if (oi === q.a) cls += " ok"; else if (oi === state.picked) cls += " no"; }
    else if (state.sel === oi) cls += " sel";
    return `<button type="button" class="${cls}" data-oi="${oi}" ${state.reveal?"disabled":""}><span class="k">${"ABCD"[k]}</span><span>${esc(q.o[oi])}</span></button>`;
  }).join("");
}
function expHTML(q, picked){
  const ok = picked === q.a;
  return `<div class="exp">${ok ? `<b class="okl">Correct.</b>` : `<b class="nol">Answer: ${esc(q.o[q.a])}.</b>`} ${esc(q.e)}</div>`;
}
function metaHTML(q, no){
  return `<div class="qmeta"><span class="qno">${no}</span><span class="tag">L${LNUM(q.t)} \u00b7 ${esc(L(q.t).title)}</span>${q.src?`<span class="tag src" title="Reported by candidates after this paper (memory-based)">\ud83d\udcdc ${esc(q.src)}</span>`:""}${q.p?`<span class="tag pyq" title="This fact comes up again and again in SSC papers">Repeatedly asked</span>`:""}
  <button type="button" class="bm" data-bm="${q.id}" aria-pressed="${S.bm[q.id]?"true":"false"}" aria-label="Bookmark">${S.bm[q.id]?"★":"☆"}</button></div>`;
}

function renderLQ(){
  const box = $("#lq");
  if (LQ.i >= LQ.list.length) {
    const n = LQ.list.length;
    const st = S.les[LQ.id] || {}; st.best = Math.max(st.best||0, LQ.score); S.les[LQ.id] = st; save();
    box.innerHTML = `<div class="stack"><div class="block stack"><span class="eyebrow">Quiz done</span>
      <div class="scorebig"><span class="num">${LQ.score}</span><span class="muted">/ ${n} correct</span></div>
      <p class="muted">${LQ.score===n ? "Full marks." : LQ.score >= n*0.8 ? "Strong. Review the ones you missed under Practice → Mistakes." : "Read the story and the Trap boxes once more, then retry. Missed questions are saved under Practice → Mistakes."}</p></div>
      <div class="row between"><button class="btn" type="button" id="retry">Retry quiz</button><button class="btn pri" type="button" id="tosum">See summary</button></div></div>`;
    $("#retry").onclick = () => openLesson(LQ.id,"quiz");
    $("#tosum").onclick = () => openLesson(LQ.id,"sum");
    return;
  }
  const it = LQ.list[LQ.i], q = it.q;
  const reveal = LQ.picked !== null;
  box.innerHTML = `<div class="stack"><div class="meter"><i style="width:${LQ.i/LQ.list.length*100}%"></i></div>
    <article class="qcard">${metaHTML(q, `Q${LQ.i+1}/${LQ.list.length}`)}
    <p class="qt">${esc(q.q)}</p><div class="opts">${optsHTML(q, it.perm, {picked:LQ.picked, reveal})}</div>
    ${reveal ? expHTML(q, LQ.picked) : ""}</article>
    ${reveal ? `<div class="row end"><button class="btn pri" type="button" id="lqnext">${LQ.i+1 < LQ.list.length ? "Next question" : "Finish"}</button></div>` : `<p class="muted" style="font-size:13px">Score so far: <span class="num">${LQ.score}</span></p>`}</div>`;
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (LQ.picked !== null) return;
    LQ.picked = +b.dataset.oi; const ok = LQ.picked === q.a; if (ok) LQ.score++; record(q, ok); renderLQ();
  });
  bindBM(box);
  const nx = $("#lqnext"); if (nx) nx.onclick = () => { LQ.i++; LQ.picked = null; renderLQ(); window.scrollTo(0,0); };
}

function bindBM(root){
  root.querySelectorAll("[data-bm]").forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    const id = b.dataset.bm; if (S.bm[id]) delete S.bm[id]; else S.bm[id] = 1; save();
    b.setAttribute("aria-pressed", S.bm[id] ? "true":"false"); b.textContent = S.bm[id] ? "★" : "☆";
  });
}

/* ============================================================
   PRACTICE
   ============================================================ */
let PF = "all", PSHOW = 20, PORDER = null, PPERM = {}, PPICK = {};
const hasHot = () => LESSONS.some(l => l.heat === 3) && LESSONS.some(l => l.heat !== 3);
function practiceList(){
  let list = QS;
  if (PF === "pyq") list = QS.filter(q => q.p);
  else if (PF === "src") list = QS.filter(q => q.src);
  else if (PF === "hot") list = QS.filter(q => L(q.t).heat === 3);
  else if (PF === "wrong") list = QS.filter(q => S.ans[q.id] === 0);
  else if (PF === "new") list = QS.filter(q => S.ans[q.id] === undefined);
  else if (PF === "bm") list = QS.filter(q => S.bm[q.id]);
  else if (PF !== "all") list = QS.filter(q => q.t === PF);
  if (PORDER) { const pos = new Map(PORDER.map((id,i)=>[id,i])); list = list.slice().sort((a,b)=>(pos.get(a.id)??0)-(pos.get(b.id)??0)); }
  return list;
}
function renderPractice(){
  const wrongN = QS.filter(q => S.ans[q.id] === 0).length, bmN = QS.filter(q=>S.bm[q.id]).length;
  const pyqN = QS.filter(q=>q.p).length, hotN = QS.filter(q=>L(q.t).heat===3).length;
  const chips = [["all",`All ${QS.length}`],["new","Not tried"],["wrong",`Mistakes ${wrongN}`]]
    .concat(hasHot() ? [["hot",`Most-asked topics ${hotN}`]] : [])
    .concat(QS.some(q => q.src) ? [["src",`Reported in papers ${QS.filter(q=>q.src).length}`]] : [])
    .concat([["pyq",`Repeatedly asked ${pyqN}`],["bm",`Starred ${bmN}`]])
    .concat(LESSONS.map(l=>[l.id,`L${LNUM(l.id)} ${l.title}`]));
  const list = practiceList();
  $("#app").innerHTML = `<section class="view stack">
    <div class="stack" style="gap:6px"><span class="eyebrow">Question bank · ${QS.length} questions</span><h1>Practice</h1>
    <p class="muted">Tap an option to check it. Wrong answers go to <b>Mistakes</b> until you get them right. <b>Repeatedly asked</b> marks the facts that come up again and again in SSC papers${hasHot() ? "; <b>Most-asked topics</b> is every question from the three-dot lessons" : ""}.</p></div>
    <div class="chips" role="group" aria-label="Filter">${chips.map(c=>`<button type="button" class="chip" data-f="${c[0]}" aria-pressed="${PF===c[0]}">${esc(c[1])}</button>`).join("")}</div>
    <div class="row between"><span class="muted num" style="font-size:13px">${list.length} questions</span>
      <div class="row"><button class="btn sm ghost" type="button" id="pshuf">${PORDER?"In order":"Shuffle"}</button></div></div>
    <div class="stack" id="plist"></div>
  </section>`;
  $("#app").querySelectorAll("[data-f]").forEach(b => b.onclick = () => { PF = b.dataset.f; PSHOW = 20; PPICK = {}; renderPractice(); });
  $("#pshuf").onclick = () => { PORDER = PORDER ? null : shuffle(QS.map(q=>q.id)); PSHOW = 20; renderPractice(); };
  const chipOn = $(`.chip[aria-pressed="true"]`); if (chipOn) chipOn.scrollIntoView({block:"nearest", inline:"center"});
  drawPList();
}
function pCard(q, idx){
  if (!PPERM[q.id]) PPERM[q.id] = makePerm(q);
  const picked = PPICK[q.id]; const reveal = picked !== undefined;
  return `<article class="qcard" data-q="${q.id}">${metaHTML(q, "Q"+(idx+1))}<p class="qt">${esc(q.q)}</p>
    <div class="opts">${optsHTML(q, PPERM[q.id], {picked: reveal?picked:null, reveal})}</div>${reveal?expHTML(q,picked):""}</article>`;
}
function drawPList(){
  const list = practiceList(), box = $("#plist");
  if (!list.length) { box.innerHTML = `<p class="empty">${PF==="wrong"?"No mistakes saved. Answer some questions first, or you've cleared them all.":PF==="bm"?"Nothing starred yet. Tap ☆ on any question.":"Nothing here."}</p>`; return; }
  box.innerHTML = list.slice(0, PSHOW).map((q,i)=>pCard(q,i)).join("") + (list.length > PSHOW ? `<button class="btn" type="button" id="pmore">Show 20 more (${list.length-PSHOW} left)</button>` : "");
  box.querySelectorAll(".qcard").forEach(bindCard);
  const more = $("#pmore"); if (more) more.onclick = () => { PSHOW += 20; drawPList(); };
}
function bindCard(card){
  card.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const q = QS.find(x => x.id === card.dataset.q); if (PPICK[q.id] !== undefined) return;
    PPICK[q.id] = +b.dataset.oi; record(q, PPICK[q.id] === q.a);
    const idx = +card.querySelector(".qno").textContent.slice(1) - 1;
    const tmp = document.createElement("div"); tmp.innerHTML = pCard(q, idx); const nc = tmp.firstElementChild;
    card.replaceWith(nc); bindCard(nc);
  });
  bindBM(card);
}

/* ============================================================
   MOCK TEST
   ============================================================ */
let M = null, MCFG = {n:25, scope:"all", neg:1}, LEAVE_TO = null;
function mockPool(scope){
  if (scope === "all") return QS;
  if (scope === "pyq") return QS.filter(q=>q.p);
  if (scope === "src") return QS.filter(q=>q.src);
  if (scope === "hot") return QS.filter(q=>L(q.t).heat===3);
  if (scope === "wrong") return QS.filter(q=>S.ans[q.id]===0);
  return QS.filter(q=>q.t===scope);
}
function renderMock(){
  if (M && M.running) return drawMockRun();
  if (M && M.done) return drawMockResult();
  const hist = (S.mocks||[]).slice(-6).reverse();
  $("#app").innerHTML = `<section class="view stack">
    <div class="stack" style="gap:6px"><span class="eyebrow">Timed, SSC pattern</span><h1>Mock test</h1>
    <p class="muted">+2 for a right answer, &minus;0.5 for a wrong one, 36 seconds a question (CGL Tier-1 pace). Answers show only after you submit.</p></div>
    <div class="block stack">
      <fieldset><legend>Questions</legend><div class="radios">${[10,25,50,100].map(n=>`<label><input type="radio" name="mn" id="mn${n}" value="${n}" ${MCFG.n===n?"checked":""}><span>${n} · ${Math.round(n*36/60)} min</span></label>`).join("")}</div></fieldset>
      <fieldset><legend>From</legend><select id="mscope" aria-label="Topics to draw from">
        <option value="all">Everything (${QS.length} Q)</option>
        ${hasHot() ? `<option value="hot">Most-asked topics only</option>` : ""}
        ${QS.some(q => q.src) ? `<option value="src">Reported in papers only</option>` : ""}
        <option value="pyq">Repeatedly asked only</option>
        <option value="wrong">My mistakes</option>
        ${LESSONS.map(l=>`<option value="${l.id}">L${LNUM(l.id)} · ${esc(l.title)}</option>`).join("")}
      </select></fieldset>
      <label class="row" style="gap:8px;font-weight:600"><input type="checkbox" id="mneg" ${MCFG.neg?"checked":""}> Negative marking (&minus;0.5)</label>
      <div id="merr" class="muted" style="font-size:14px"></div>
      <div class="row end"><button class="btn pri" type="button" id="mstart">Start test</button></div>
    </div>
    ${hist.length ? `<div class="block"><h3>Recent attempts</h3><div class="hist">${hist.map(h=>`<div><span>${esc(h.d)} · ${h.n} Q</span><span class="num">${h.score}/${h.max} · ${h.acc}%</span></div>`).join("")}</div></div>` : ""}
  </section>`;
  if ([...$("#mscope").options].some(o => o.value === MCFG.scope)) $("#mscope").value = MCFG.scope;
  $("#mstart").onclick = () => {
    MCFG.n = +(document.querySelector('input[name="mn"]:checked')||{value:25}).value;
    MCFG.scope = $("#mscope").value; MCFG.neg = $("#mneg").checked ? 1 : 0;
    const pool = mockPool(MCFG.scope);
    if (!pool.length) { $("#merr").textContent = "No questions in that set yet. Pick another source."; return; }
    const qs = shuffle(pool).slice(0, MCFG.n);
    M = { running:true, list: qs.map(q=>({q, perm:makePerm(q)})), ans: qs.map(()=>null), mark: qs.map(()=>false), i:0, neg:MCFG.neg, secs: qs.length*36, start: Date.now(), showPal:false, confirm:false };
    M.end = M.start + M.secs*1000;
    startTimer(); drawMockRun();
  };
}
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(() => {
    if (!M || !M.running) { clearInterval(timerId); return; }
    const left = Math.max(0, Math.round((M.end - Date.now())/1000));
    const el = $("#mtime"); if (el) { el.textContent = fmt(left); el.classList.toggle("low", left <= 60); }
    if (left <= 0) submitMock();
  }, 1000);
}
const fmt = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
function drawMockRun(){
  const it = M.list[M.i], q = it.q, left = Math.max(0, Math.round((M.end-Date.now())/1000));
  const answered = M.ans.filter(a=>a!==null).length;
  $("#app").innerHTML = `<section class="view stack">
    <div class="mbar"><span class="timer num ${left<=60?"low":""}" id="mtime">${fmt(left)}</span>
      <span class="muted num" style="font-size:13px;flex:1">Q ${M.i+1}/${M.list.length} · ${answered} answered</span>
      <button class="btn sm" type="button" id="mpal">${M.showPal?"Hide":"All Qs"}</button></div>
    ${LEAVE_TO ? `<div class="confirm"><b>Leave the test?</b><span>Your answers so far will be scored now.</span><div class="row"><button class="btn sm pri" type="button" id="lvy">Submit and leave</button><button class="btn sm" type="button" id="lvn">Stay</button></div></div>` : ""}
    ${M.showPal ? `<div class="block"><div class="pal">${M.list.map((_,k)=>`<button type="button" data-j="${k}" class="${M.ans[k]!==null?"a":""} ${M.mark[k]?"m":""} ${k===M.i?"cur":""}" aria-label="Question ${k+1}">${k+1}</button>`).join("")}</div>
      <p class="muted" style="font-size:12px;margin-top:8px">Filled = answered · gold line = marked for review</p></div>` : ""}
    <article class="qcard"><div class="qmeta"><span class="qno">Q${M.i+1}</span><span class="tag">L${LNUM(q.t)}</span>${M.mark[M.i]?`<span class="tag pyq">Marked</span>`:""}</div>
      <p class="qt">${esc(q.q)}</p><div class="opts">${optsHTML(q, it.perm, {sel:M.ans[M.i], reveal:false})}</div></article>

function showMockLeave(tab){ LEAVE_TO = tab; drawMockRun(); }
function submitMock(){
  if (!M || !M.running) return;
  clearInterval(timerId);
  M.running = false; M.done = true; M.confirm = false;
  let c=0,w=0,sk=0; const per = {};
  M.list.forEach((it,k) => {
    const a = M.ans[k], t = it.q.t; per[t] = per[t] || {c:0,n:0}; per[t].n++;
    if (a===null) sk++; else if (a===it.q.a) { c++; per[t].c++; S.ans[it.q.id]=1; } else { w++; S.ans[it.q.id]=0; }
  });
  const max = M.list.length*2, score = +(c*2 - (M.neg? w*0.5 : 0)).toFixed(1);
  const used = Math.min(M.secs, Math.round((Date.now()-M.start)/1000));
  M.res = {c,w,sk,score,max,used,per, acc: (c+w) ? Math.round(c*100/(c+w)) : 0};
  const d = new Date(); const ds = d.toLocaleDateString("en-IN",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
  S.mocks = (S.mocks||[]).concat([{d:ds, n:M.list.length, score, max, acc:M.res.acc}]).slice(-20); save(); renderTop();
  M.filter = "wrong";
  if (TAB==="mock") drawMockResult();
}
function drawMockResult(){

    <div class="kpis"><div class="kpi g"><span class="num">${r.c}</span><span>right</span></div><div class="kpi b"><span class="num">${r.w}</span><span>wrong</span></div><div class="kpi"><span class="num">${r.sk}</span><span>skipped</span></div><div class="kpi"><span class="num">${r.acc}%</span><span>accuracy</span></div></div>

    <div class="stack">${rows.length ? rows.map(({it,k}) => `<article class="qcard">${metaHTML(it.q, "Q"+(k+1))}<p class="qt">${esc(it.q.q)}</p><div class="opts">${optsHTML(it.q, it.perm, {picked:M.ans[k], reveal:true})}</div>${M.ans[k]===null?`<div class="exp"><b class="nol">Skipped. Answer: ${esc(it.q.o[it.q.a])}.</b> ${esc(it.q.e)}</div>`:expHTML(it.q, M.ans[k])}</article>`).join("") : `<p class="empty">Nothing in this list.</p>`}</div>
  </section>`;
  bindBM($("#app"));
  $("#app").querySelectorAll("[data-rf]").forEach(b => b.onclick = () => { M.filter = b.dataset.rf; drawMockResult(); });

    M.end = M.start + M.secs*1000; startTimer(); drawMockRun();

}

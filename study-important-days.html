{"id":"D1","heat":3,"title":"Days that honour people","hi":"महान व्यक्तियों को समर्पित दिवस","blocks":[{"k":"hot","h":"The most-asked kind: <b>whose birthday is this day?<\/b> — Teachers' Day (Radhakrishnan), Engineers' Day (Visvesvaraya), National Sports Day (Dhyan Chand), Statistics Day (Mahalanobis), Mathematics Day (Ramanujan), Youth Day (Vivekananda)."},{"k":"story","h":"<p>India marks its heroes by turning their birthdays into days with a purpose. A teacher-philosopher's birthday became <b>Teachers' Day<\/b>; an engineer who built dams became <b>Engineers' Day<\/b>; a hockey wizard became <b>Sports Day<\/b>; a monk who inspired the young became <b>Youth Day<\/b>.<\/p><p>So learn each day as a <b>person + job<\/b> pair: Radhakrishnan taught → 5 September; Visvesvaraya built → 15 September; Ramanujan counted → 22 December; Mahalanobis measured → 29 June; Dr B. C. Roy healed → 1 July.<\/p>","key":"The day's theme matches the person's work: teacher, engineer, sportsman, statistician, mathematician, doctor."},{"k":"table","title":"Days and dates","head":["Day","Date","Whom it honours"],"rows":[["National Youth Day","12 January","Birth anniversary of Swami Vivekananda (1863)."],["Parakram Diwas","23 January","Birth anniversary of Netaji Subhas Chandra Bose; observed since 2021."],["Martyrs' Day (Shaheed Diwas)","30 January","Mahatma Gandhi was assassinated on this day in 1948."],["National Women's Day","13 February","Birth anniversary of Sarojini Naidu."],["Shaheed Diwas for Bhagat Singh, Rajguru and Sukhdev","23 March","They were hanged in Lahore in 1931."],["Ambedkar Jayanti","14 April","Birth anniversary of Dr B. R. Ambedkar."],["National Statistics Day","29 June","Birth anniversary of P. C. Mahalanobis."],["National Doctors' Day","1 July","Birth and death anniversary of Dr B. C. Roy."],["Sadbhavana Diwas","20 August","Birth anniversary of Rajiv Gandhi."],["National Sports Day","29 August","Birth anniversary of hockey wizard Major Dhyan Chand."],["Teachers' Day", hree: <b>5 Teacher, 14 Hindi, 15 Engineer<\/b>. December's farmer-to-governance run: <b>22 Ramanujan, 23 Charan Singh (Kisan), 24 Consumer, 25 Vajpayee (Good Governance)<\/b> — four days in a row."},{"k":"trap","h":"<b>National Youth Day<\/b> (12 Jan, Vivekananda) vs <b>International Youth Day<\/b> (12 Aug). <b>Teachers' Day<\/b> in India is 5 Sep; <b>World Teachers' Day<\/b> is 5 Oct. <b>National Education Day<\/b> is Azad's birthday (11 Nov); <b>Children's Day<\/b> is Nehru's (14 Nov)."}],"sum":["National Youth Day 12 Jan (Vivekananda); Parakram Diwas 23 Jan (Netaji); Martyrs' Day 30 Jan (Gandhi).","Statistics Day 29 Jun (Mahalanobis); Doctors' Day 1 Jul (B. C. Roy); Sports Day 29 Aug (Dhyan Chand).","Teachers' Day 5 Sep (Radhakrishnan); Engineers' Day 15 Sep (Visvesvaraya); National Unity Day 31 Oct (Patel).","Education Day 11 Nov (Azad); Children's Day 14 Nov (Nehru); Janjatiya Gaurav Divas 15 Nov (Birsa Munda).","Mathematics Day 22 Dec (Ramanujan); Kisan Diwas 23 Dec (Charan Singh); Good Governance Day 25 Dec (Vajpayee)."],"part":["Part 1 · National days of India","भारत के राष्ट्रीय दिवस"],"g":"dy"},
{"id":"D2","heat":3,"title":"National days for causes and events","hi":"कारणों और घटनाओं के राष्ट्रीय दिवस","blocks":[{"k":"hot","h":"Asked often: <b>National Science Day<\/b> (Raman effect), <b>National Voters' Day<\/b>, <b>National Technology Day<\/b> (Pokhran-II), <b>Constitution Day<\/b>, <b>National Handloom Day<\/b>, <b>Hindi Diwas<\/b>, <b>Panchayati Raj Day<\/b> and the new <b>National Space Day<\/b>."},{"k":"story","h":"<p>Other national days remember an <b>event<\/b>. On 28 February 1928 C. V. Raman announced his discovery — so that is <b>National Science Day<\/b>. On 11 May 1998 India tested nuclear weapons at Pokhran — <b>National Technology Day<\/b>. On 7 August 1905 the Swadeshi movement began — <b>National Handloom Day<\/b>. On 23 August 2023 Chandrayaan-3 touched down on the Moon — <b>National Space Day<\/b>.<\/p><p>The Constitution gives two: it was <b>adopted<\/b> on 26 November 1949 (Constitution Day) and came <b>into force<\/b> on 26 January 1950 (Republic Day). The Election Commission was born a day before — 25 January 1950 — so that is <b>National Voters' Day<\/b>.<\/p>","key":"Constitution adopted 26 Nov 1949 (Constitution Day); in force 26 Jan 1950 (Republic Day); EC founded 25 Jan 1950 (Voters' Day)."},{"k":"table","title":"Days and dates","head":["Day","Date","Why this date"],"rows":[["National Startup Day","16 January","Since 2022."],["National Girl Child Day","24 January","Since 2008."],["National Voters' Day","25 January","The Election Commission was set up on 25 January 1950."],["Republic Day","26 January","The Constitution came into force in 1950."],["National Science Day","28 February","C. V. Raman announced the Raman effect in 1928."],["National Safety Day","4 March",""],["National Vaccination Day","16 March","The first dose of oral polio vaccine was given in 1995."],["Civil Services Day","21 April","Sardar Patel addressed the first batch of officers in 1947."],["National Panchayati Raj Day","24 April","The 73rd Amendment came into force in 1993."],["National Technology Day","11 May","Pokhran-II nuclear tests, 1998."],["Anti-Terrorism Day","21 May","Death anniversary of Rajiv Gandhi (1991)."],["Samvidhan Hatya Diwas","25 June","Marks the Emergency of 1975; declared in 2024."],["National Broadcasting Day","23 July","Organised radio broadcasting began in 1927."],["National Handloom Day","7 August","The Swadeshi movement was launched on 7 August 1905."],["Partition Horrors Remembrance Day","14 August","Since 2021."],["Independence Day","15 August","1947."],["National Space Day","23 August","Chandrayaan-3 landed near the Moon's south pole in 2023."],["Hindi Diwas","14 September","The Constituent Assembly adopted Hindi as an official language in 1949."],["National Press Day","16 November","The Press Council of India began work in 1966."],["Constitution Day (Samvidhan Divas)","26 November","The Constitution was adopted in 1949; observed since 2015."],["National Pollution Control Day","2 December","In memory of the Bhopal gas tragedy victims (1984)."],["National Energy Conservation Day","14 December",""],["National Consumer Day","24 December","The Consumer Protection Act, 1986 got assent."]]},{"k":"calendar","title":"Days for causes, month by month","rows":[[1,16,"National Startup Day"],[1,24,"National Girl Child Day"],[1,25,"National Voters' Day"],[1,26,"Republic Day"],[2,28,"National Science Day"],[3,4,"National Safety Day"],[3,16,"National Vaccination Day"],[4,21,"Civil Services Day"],[4,24,"National Panchayati Raj Day"],[5,11,"National Technology Day"],[5,21,"Anti-Terrorism Day"],[6,25,"Samvidhan Hatya Diwas"],[7,23,"National Broadcasting Day"],[8,7,"National Handloom Day"],[8,14,"Partition Horrors Remembrance Day"],[8,15,"Independence Day"],[8,23,"National Space Day"],[9,14,"Hindi Diwas"],[11,16,"National Press Day"],[11,26,"Constitution Day (Samvidhan Divas)"],[12,2,"National Pollution Control Day"],[12,14,"National Energy Conservation Day"],[12,24,"National Consumer Day"]],"cap":"Tap a month. Many began recently — Startup Day (2022), Girl Child Day (2008), Voters' Day (2011)."},{"k":"trick","h":"Late January cluster — <b>24 girl, 25 voter, 26 republic<\/b>: a girl grows up, votes, and celebrates the Republic. <b>11 May 1998 = Technology<\/b>; <b>23 Aug 2023 = Space<\/b>."},{"k":"trap","h":"<b>Constitution Day<\/b> (26 Nov) is not <b>Republic Day<\/b> (26 Jan). <b>Hindi Diwas<\/b> (14 Sep, India) is not <b>World Hindi Day<\/b> (10 Jan). <b>National Science Day<\/b> is 28 Feb — not Raman's birthday (7 Nov)."}],"sum":["National Voters' Day 25 Jan; Republic Day 26 Jan; National Science Day 28 Feb (Raman effect, 1928).","Panchayati Raj Day 24 Apr; National Technology Day 11 May (Pokhran-II); Anti-Terrorism Day 21 May.","National Handloom Day 7 Aug (Swadeshi, 1905); National Space Day 23 Aug (Chandrayaan-3); Hindi Diwas 14 Sep.","Constitution Day 26 Nov (adopted 1949); National Pollution Control Day 2 Dec (Bhopal).","National Consumer Day 24 Dec; Samvidhan Hatya Diwas 25 Jun (Emergency, 1975)."],"part":["Part 1 · National days of India","भारत के राष्ट्रीय दिवस"],"g":"dy"},
{"id":"D3","heat":2,"title":"Armed forces and security days","hi":"सशस्त्र बल और सुरक्षा दिवस","blocks":[{"k":"hot","h":"Regulars: <b>Army Day<\/b> (15 Jan), <b>Air Force Day<\/b> (8 Oct), <b>Navy Day<\/b> (4 Dec), <b>Armed Forces Flag Day<\/b> (7 Dec), <b>Kargil Vijay Diwas<\/b> (26 Jul) and <b>Vijay Diwas<\/b> (16 Dec)."},{"k":"story","h":"<p>Each service has its own birthday-like day. The <b>Army<\/b> celebrates 15 January, when General K. M. Cariappa took over from the last British commander in 1949. The <b>Air Force<\/b> was set up on 8 October 1932. The <b>Navy<\/b> marks 4 December, when Indian missile boats struck Karachi in 1971 (Operation Trident).<\/p><p>Two victories are remembered: <b>16 December<\/b> 1971, when Pakistan's army surrendered in Dhaka and Bangladesh was born, and <b>26 July<\/b> 1999, when the Kargil heights were won back. On <b>7 December<\/b> every citizen can donate on Armed Forces Flag Day.<\/p>","key":"Army 15 Jan, Air Force 8 Oct, Navy 4 Dec; Kargil 26 Jul, Vijay Diwas 16 Dec."},{"k":"cards","title":"The three services' days","rows":[["Army Day","15 January","1949: K. M. Cariappa became the first Indian Commander-in-Chief","🪖"],["Air Force Day","8 October","1932: the Indian Air Force was set up","✈️"],["Navy Day","4 December","1971: Operation Trident, the attack on Karachi harbour","⚓"]]},{"k":"table","title":"Days and dates","head":["Day","Date","Why this date"],"rows":[["Armed Forces Veterans' Day","14 January","Field Marshal K. M. Cariappa retired on this day in 1953."],["Army Day","15 January","Cariappa became the first Indian Commander-in-Chief in 1949."],["NDRF Raising Day","19 January",""],["Indian Coast Guard Day","1 February",""],["CISF Raising Day","10 March",""],["CRPF Raising Day","27 July",""],["Kargil Vijay Diwas","26 July","Victory in the Kargil war, 1999 (Operation Vijay)."],["Air Force Day","8 October","The Indian Air Force was formed in 1932."],["Territorial Army Day","9 October",""],["Police Commemoration Day","21 {"id":"D4","heat":2,"title":"World days: January to April","hi":"विश्व दिवस: जनवरी–अप्रैल","blocks":[{"k":"hot","h":"Favourites from these months: <b>World Hindi Day<\/b>, <b>International Mother Language Day<\/b>, <b>International Women's Day<\/b>, <b>World Consumer Rights Day<\/b>, <b>World Heritage Day<\/b>, <b>World Book Day<\/b> and <b>World Intellectual Property Day<\/b>."},{"k":"story","h":"<p>Most world days are fixed by the <b>United Nations<\/b> or one of its agencies, and many have a story. <b>International Mother Language Day<\/b> (21 Feb) remembers students killed in Dhaka in 1952 while demanding Bengali as a state language. <b>World Book Day<\/b> (23 Apr) falls on the day Shakespeare and Cervantes died. <b>World Hindi Day<\/b> (10 Jan) remembers the first World Hindi Conference in Nagpur in 1975.<\/p>","key":"Feb 21 mother language, Mar 8 women, Mar 15 consumers, Apr 18 heritage, Apr 23 books."},{"k":"table","title":"Days and dates","head":["Day","Date","Note"],"rows":[["World Braille Day","4 January","Birth anniversary of Louis Braille."],["World Hindi Day","10 January","The first World Hindi Conference was held in Nagpur in 1975."],["International Day of Education","24 January",""],["World Pulses Day","10 February",""],["World Radio Day","13 February","Proclaimed by UNESCO."],["World Day of Social Justice","20 February",""],["International Mother Language Day","21 February","Remembers the 1952 language movement in Dhaka; declared by UNESCO."],["International Women's Day","8 March",""],["World Consumer Rights Day","15 March","Inspired by J. F. Kennedy's 1962 speech."],["International Day of Happiness","20 March",""],["World Poetry Day","21 March",""],["World Theatre Day","27 March",""],["International Day for Sport for Development and Peace","6 April",""],["International Day of Human Space Flight","12 April","Yuri Gagarin's flight, 1961."],["World Heritage Day (International Day for Monuments and Sites)","18 April",""],["World Book and Copyright Day", {"id":"D5","heat":2,"title":"World days: May to August","hi":"विश्व दिवस: मई–अगस्त","blocks":[{"k":"hot","h":"Asked a lot: <b>International Day of Yoga<\/b> (21 Jun), <b>World Population Day<\/b> (11 Jul), <b>World Day Against Child Labour<\/b> (12 Jun), <b>World Red Cross Day<\/b> (8 May), <b>World Press Freedom Day<\/b> (3 May), <b>World Milk Day<\/b> (1 Jun) and <b>International Youth Day<\/b> (12 Aug)."},{"k":"story","h":"<p><b>International Day of Yoga<\/b> is India's gift to the calendar: proposed by India at the UN in 2014 and first observed on 21 June 2015 — the longest day of the year in the northern hemisphere. <b>World Red Cross Day<\/b> is Henry Dunant's birthday; <b>World Chess Day<\/b> marks FIDE's founding; <b>Olympic Day<\/b> marks the IOC's.<\/p>","key":"21 June — yoga (longest day); 11 July — population; 12 August — youth."},{"k":"table","title":"Days and dates","head":["Day","Date","Note"],"rows":[["International Labour Day (May Day)","1 May",""],["World Press Freedom Day","3 May",""],["World Red Cross Day","8 May","Birth anniversary of Henry Dunant, founder of the Red Cross."],["International Day of Families","15 May",""],["World Telecommunication and Information Society Day","17 May","ITU was founded on 17 May 1865."],["International Museum Day","18 May",""],["World Milk Day","1 June","Declared by the FAO in 2001; India's National Milk Day is 26 November (Verghese Kurien)."],["World Bicycle Day","3 June",""],["World Day Against Child Labour","12 June","Started by the ILO in 2002."],["World Refugee Day","20 June",""],["International Day of Yoga","21 June","First observed in 2015, after India's proposal at the UN."],["International Olympic Day","23 June","The IOC was founded on 23 June 1894."],["International Day Against Drug Abuse and Illicit Trafficking","26 June",""],["World Population Day","11 July","Set up by the UNDP's governing council in 1989."],["World Youth Skills Day","15 July",""],["Nelson Mandela International Day","18 July","Mandela' {"id":"D6","heat":2,"title":"World days: September to December","hi":"विश्व दिवस: सितंबर–दिसंबर","blocks":[{"k":"hot","h":"Most asked: <b>International Literacy Day<\/b>, <b>International Day of Peace<\/b>, <b>World Tourism Day<\/b>, <b>World Teachers' Day<\/b>, <b>World Post Day<\/b>, <b>World Food Day<\/b>, <b>UN Day<\/b>, <b>Human Rights Day<\/b> and the day for <b>persons with disabilities<\/b>."},{"k":"story","h":"<p>The last four months are full of UN birthdays. The <b>UN<\/b> itself was born on 24 October 1945 (UN Day); its food agency, the <b>FAO<\/b>, a week earlier on 16 October (World Food Day). The <b>Universal Postal Union<\/b> dates from 9 October 1874 (World Post Day). And on 10 December 1948 the UN adopted the <b>Universal Declaration of Human Rights<\/b> — Human Rights Day.<\/p>","key":"16 Oct FAO, 24 Oct UN, 10 Dec human rights."},{"k":"table","title":"Days and dates","head":["Day","Date","Note"],"rows":[["International Literacy Day","8 September",""],["International Day of Democracy","15 September",""],["International Day of Peace","21 September",""],["World Tourism Day","27 September",""],["International Day of Older Persons","1 October",""],["International Day of Non-Violence","2 October","Gandhi's birthday."],["World Teachers' Day","5 October","India's own Teachers' Day is 5 September."],["World Post Day","9 October","The Universal Postal Union was founded in 1874."],["International Day of the Girl Child","11 October",""],["World Standards Day","14 October",""],["World Food Day","16 October","The FAO was founded on 16 October 1945."],["International Day for the Eradication of Poverty","17 October",""],["United Nations Day","24 October","The UN Charter came into force in 1945."],["World Cities Day","31 October",""],["World Science Day for Peace and Development","10 November",""],["International Day for Tolerance","16 November",""],["World Television Day","21 November",""],["International Day for the Elimination of Violence against Women","25 Nov {"id":"D7","heat":3,"title":"Health days","hi":"स्वास्थ्य दिवस","blocks":[{"k":"hot","h":"Health days are asked in almost every exam: <b>World Health Day<\/b> (WHO's birthday), <b>World TB Day<\/b>, <b>World Malaria Day<\/b>, <b>World No Tobacco Day<\/b>, <b>World Blood Donor Day<\/b>, <b>World Heart Day<\/b>, <b>World Diabetes Day<\/b> and <b>World AIDS Day<\/b>."},{"k":"story","h":"<p>Many health days honour a scientist's birthday or discovery. <b>World Blood Donor Day<\/b> is Karl Landsteiner's birthday (he found the ABO groups). <b>World Diabetes Day<\/b> is Frederick Banting's (insulin). <b>World TB Day<\/b> is the day Robert Koch announced the TB germ. <b>World Mosquito Day<\/b> marks Ronald Ross's malaria discovery in India. <b>World Rabies Day<\/b> is Pasteur's death anniversary.<\/p>","key":"WHO born 7 Apr 1948; Landsteiner 14 Jun; Banting 14 Nov; Koch 24 Mar; Ross 20 Aug."},{"k":"table","title":"Days and dates","head":["Day","Date","Note"],"rows":[["World Leprosy Day","Last Sunday of January","India observes Anti-Leprosy Day on 30 January (Gandhi's death anniversary)."],["World Cancer Day","4 February",""],["National Deworming Day (India)","10 February",""],["World Hearing Day","3 March",""],["World Kidney Day","Second Thursday of March",""],["World Down Syndrome Day","21 March",""],["World Tuberculosis Day","24 March","Robert Koch announced the TB bacterium in 1882."],["World Autism Awareness Day","2 April",""],["World Health Day","7 April","The WHO was founded on 7 April 1948."],["World Homoeopathy Day","10 April","Birth anniversary of Samuel Hahnemann."],["World Haemophilia Day","17 April",""],["World Malaria Day","25 April",""],["World Hand Hygiene Day","5 May",""],["National Dengue Day (India)","16 May",""],["World Hypertension Day","17 May",""],["World No Tobacco Day","31 May",""],["World Blood Donor Day","14 June","Birth anniversary of Karl Landsteiner, who found the ABO blood groups."],["World Zoonoses Day","6 July","Louis Pasteur gave the first ra {"id":"D8","heat":3,"title":"Environment and nature days","hi":"पर्यावरण और प्रकृति दिवस","blocks":[{"k":"hot","h":"Very common: <b>World Environment Day<\/b> (5 Jun), <b>Earth Day<\/b> (22 Apr), <b>World Water Day<\/b> (22 Mar), <b>World Wetlands Day<\/b> (2 Feb), <b>World Wildlife Day<\/b> (3 Mar), <b>World Ozone Day<\/b> (16 Sep), <b>International Tiger Day<\/b> (29 Jul) and <b>Biodiversity Day<\/b> (22 May)."},{"k":"story","h":"<p>Nature days often mark the signing of a treaty. <b>World Wetlands Day<\/b> (2 Feb) — the Ramsar Convention of 1971. <b>World Wildlife Day<\/b> (3 Mar) — CITES, 1973. <b>World Ozone Day<\/b> (16 Sep) — the Montreal Protocol, 1987. <b>World Environment Day<\/b> (5 Jun) — the Stockholm Conference opened on that day in 1972, and the UN Environment Programme (UNEP) was born from it.<\/p><p>Late March is the forest-and-water week: <b>Forests on 21, Water on 22, Weather on 23<\/b>.<\/p>","key":"Treaty days: 2 Feb Ramsar, 3 Mar CITES, 16 Sep Montreal. 21-22-23 March: forests, water, weather."},{"k":"table","title":"Days and dates","head":["Day","Date","Note"],"rows":[["World Wetlands Day","2 February","The Ramsar Convention was signed on 2 February 1971."],["World Wildlife Day","3 March","CITES was signed on 3 March 1973."],["World Sparrow Day","20 March",""],["International Day of Forests","21 March",""],["World Water Day","22 March",""],["World Meteorological Day","23 March","The WMO came into being in 1950."],["International Day of Zero Waste","30 March","Observed since 2023."],["Earth Day","22 April","First held in 1970."],["World Bee Day","20 May",""],["International Day for Biological Diversity","22 May",""],["World Environment Day","5 June","Set up after the 1972 Stockholm Conference; led by UNEP."],["World Oceans Day","8 June",""],["World Day to Combat Desertification and Drought","17 June",""],["International Day for the Conservation of the Mangrove Ecosystem","26 July",""],["World Nature Conservation Day","28 July",""],["Internationa   .steps + .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .steps + .stack > .plain,.steps + .stack > .row,.steps + .stack > p,.steps + .stack > .fig,.steps + .stack > h2,.steps + .stack > .tbl{grid-column:1/-1}
  .steps + .stack > .plain{max-width:86ch;font-size:17px}
  .steps + .stack > .hot,.steps + .stack > .story{grid-column:1/-1}
  .steps + .stack > .story{max-width:none;padding:20px 24px;font-size:17.5px}
  .steps + .stack > .story p{max-width:80ch}
  .steps + .stack:not(:has(> .block ~ .block)) > .block{grid-column:1/-1}
  .block,.qcard{padding:18px 20px;border-radius:14px}

  /* quizzes and question bank */
  #lq > .stack{display:grid;grid-template-columns:minmax(0,1fr);max-width:980px;gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qt{font-size:18px}
  #plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #plist .opts{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:wrap;overflow:visible}

  /* mock test: question with the answer grid alongside */
  .mbar{top:calc(env(safe-area-inset-top,0px) + 67px)}
  .view > .qcard{max-width:1000px}
  .view > .row.between{max-width:1000px}
  .view > #msub{max-width:1000px;width:100%}
  .view > .block.stack{max-width:760px}
  .pal{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .kpis{max-width:760px}

  /* revise: summary cards and sheets in columns */
  #rv > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #rv > .stack > .grph,#rv > .stack > p,#rv > .stack > .search,#rv > .stack > .callout{grid-column:1/-1}
  #dgl,#lml,#tll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #dgl > .grph,#dgl > p,#lml > p,#tll > .grph{grid-column:1/-1}
  #rv .search,#rv > #dgl ~ .search{max-width:520px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flash{min-height:300px;max-width:760px;margin:0 auto;padding:32px 36px}
  .flash .front{font-size:22px}

  /* learn: era cards across the top */
  .eras{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}
  .les{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}

</style>
<script id="shabd-deeplink">
(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();
</script>

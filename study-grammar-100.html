that the rest describes: brothers-in-law, commanders-in-chief, passers-by, lookers-on, step-daughters.","Words ending in -ful are one word, so add -s at the end: mouthfuls, spoonfuls, bagfuls.","With man / woman showing gender before a profession, make both plural: men teachers, women doctors."],"TB":[],"T":["Which one is the real person? The brother (in law) → brothers-in-law. The passer (by) → passers-by."],"X":[{"s":"Both of his *brother in laws* live in Agra.","f":"brothers-in-law","w":"Main noun: brother."},{"s":"All the *man teachers* were called by the principal.","f":"men teachers","w":"Gender word + profession → both plural."},{"s":"Some *passer bys* stopped to help him.","f":"passers-by","w":"Main noun: passer."},{"s":"She gulped down two *mouthsful* of coffee.","f":"mouthfuls","w":"One word; -s at the end."}],"N":[],"Q":[{"k":"f","q":"Both his ___ are lawyers.","o":["sons-in-law","son-in-laws","sons-in-laws","son-in-law"],"a":0,"e":"Main noun: son.","r":36},{"k":"e","o":["Three spoonsful","of sugar","are too much for tea.","No error"],"a":0,"e":"-ful is one word: “three spoonfuls”.","r":36}]},{"n":37,"title":"Use the collective noun","L":["English has a specific word for many groups. Writing “a group of …” is not grammatically wrong, but SSC treats the collective noun as the better choice."],"TB":[["Group of","Collective noun"],["cats","clowder"],["bees","swarm"],["wolves","pack"],["merchants / travellers","caravan"],["cattle","herd"],["fish","shoal / school"],["ships","fleet"],["stars","galaxy / constellation"],["people (angry)","mob"],["sheep","flock"]],"T":["A collective noun usually takes a singular verb (Rule 59): “A pack of wolves <b>was<\/b> seen.”"],"X":[{"s":"She adopted *a group of cats* she found in a box.","f":"a clowder","w":"Collective noun."},{"s":"The heat killed *the group of bees* in its hive.","f":"the swarm","w":"Collective noun."},{"s":"*A group of wolves* was seen in the national park.","f":"A pack of wolves","w":"Collective noun."},{"s":"*A group of merchants* passes through our village every July.","f":"A caravan of merchants","w":"Collective noun."}],"N":[],"Q":[{"k":"f","q":"A ___ of ships was seen near the coast.","o":["fleet","herd","pack","swarm"],"a":0,"e":"A group of ships is a fleet.","r":37},{"k":"f","q":"The shepherd led his ___ of sheep up the hill.","o":["flock","pack","swarm","clowder"],"a":0,"e":"A group of sheep is a flock.","r":37}]},{"n":38,"title":"Apostrophe: joint possession, pronouns, and -s endings","L":["Two owners of the <b>same<\/b> thing joined by “and” → apostrophe only on the last one: “David and Mindy’s car” (one car). Separate things → both: “Ram’s and Shyam’s bags”.","Some pronouns take ’s: everybody’s, somebody’s, nobody’s, everyone’s, someone’s, one’s, anyone’s.","A plural ending in -s takes only an apostrophe: parents’, students’. For words ending in an s / sh sound before “sake”, use only the apostrophe: for goodness’ sake, for conscience’ sake. (“For God’s sake” is the fixed form.)"],"TB":[],"T":["One thing shared → last name only. Plural -s → just ’."],"X":[{"s":"*David’s and Mindy’s* car has stopped working.","f":"David and Mindy’s","w":"One shared car."},{"s":"Your *parents’s* trust in you has gone down.","f":"parents’","w":"Plural -s → only ’."},{"s":"The earthquake destroyed *everyone’s* house in our society.","f":"(no error)","w":"Pronouns like everyone take ’s."},{"s":"For *god* sake, please forgive me.","f":"God’s","w":"Possessive needed."},{"s":"*Rahul and his friends’s* behaviour at the party was bad.","f":"Rahul and his friends’","w":"From the lecture homework."}],"N":["The PDF prints the answer as “gods”. The correct fixed form is “For God’s sake”."],"Q":[{"k":"f","q":"This is ___ shop; they run it together.","o":["Ramesh and Suresh’s","Ramesh’s and Suresh’s","Ramesh’s and Suresh","Ramesh and Suresh"],"a":0,"e":"One shared shop → apostrophe on the last name only.","r":38},{"k":"e","o":["The students’s hostel","is being","repaired this month.","No error"],"a":0,"e":"Plural ending in -s → only the apostrophe: “students’ hostel”.","r":38}]},{"n":39,"title":"Apostrophe on a compound noun goes at the end","L":["For the possessive of a compound noun, put ’s at the very end: my son-in-law’s sister, my father-in-law’s business, the commander-in-chief’s order."],"TB":[],"T":["Treat the whole compound as one word and add ’s after the last part."],"X":[{"s":"My *son’s in law* sister works there.","f":"son-in-law’s","w":"’s at the end."},{"s":"I took over my *father’s in law* business.","f":"father-in-law’s","w":"’s at the end."}],"N":[],"Q":[{"k":"f","q":"My ___ car was stolen last night.","o":["sister-in-law’s","sister’s-in-law","sisters-in-law","sister’s in law’s"],"a":0,"e":"’s goes at the end of the compound.","r":39},{"k":"e","o":["The editor-in-chief’s","decision","is final.","No error"],"a":3,"e":"’s at the end of the compound. Correct.","r":39}]},{"n":40,"title":"’s with non-living things (allowed cases)","L":["Normally, non-living things use “of”: the leg of the table. But ’s is allowed in these cases:","Personification: the Sun’s fury, Death’s icy hands, Nature’s law, Fortune’s favourite, the country’s honour. Dignified objects: the court’s order, duty’s call. Celestial bodies: the Earth’s atmosphere, the Moon’s surface.","Time, weight, value and distance: a day’s journey, a ton’s weight, two metres’ gap, a pound’s worth. Idioms: at a stone’s throw, at one’s wit’s end, for heaven’s sake."],"TB":[],"T":["Sentences using these forms are usually “No error” in SSC."],"X":[{"s":"No one will be saved from the *sun’s fury* this time.","f":"(no error)","w":"Personification."},{"s":"Mohit has received a *court’s order* barring him from the hotel.","f":"(no error)","w":"Dignified object."},{"s":"Experts have noticed changes in *Earth’s atmosphere*.","f":"(no error)","w":"Celestial body."},{"s":"We sat at a *2 metres’ gap* from each other.","f":"(no error)","w":"Distance."},{"s":"This resort is at a *stone’s throw* from the beach.","f":"(no error)","w":"Idiom."}],"N":[],"Q":[{"k":"e","o":["The table’s leg","was broken","during the shifting.","No error"],"a":0,"e":"An ordinary object uses “of”: “The leg of the table”.","r":40},{"k":"e","o":["It is only","an hour’s drive","from here to the lake.","No error"],"a":3,"e":"Time → ’s is allowed. Correct.","r":40},{"k":"f","q":"The room was dirty and the ___ was broken.","o":["door of the room","room’s door","rooms’ door","door’s room"],"a":0,"e":"An ordinary object uses “of”.","r":40}]}],"test":[{"k":"e","o":["She bought","new furnitures","for her flat.","No error"],"a":1,"e":"Furniture is uncountable: “new furniture”.","r":31},{"k":"f","q":"He gave me ___ about the exam.","o":["some information","an information","informations","many informations"],"a":0,"e":"Information is uncountable.","r":31},{"k":"e","o":["The police found","no evidences","against him.","No error"],"a":1,"e":"Evidence is uncountable: “no evidence”.","r":31},{"k":"f","q":"I need ___ for my new office.","o":["some stationery","a stationery","stationeries","many stationery"],"a":0,"e":"Stationery is uncountable.","r":31},{"k":"e","o":["Politics are","not my cup of tea,","so I avoid debates.","No error"],"a":0,"e":"“Politics” as a field is singular: “Politics is”.","r":32},{"k":"f","q":"Billiards ___ my father’s favourite game.","o":["is","are","were","have been"],"a":0,"e":"Game name → singular.","r":32},{"k":"f","q":"The news from the flood-hit areas ___ worrying.","o":["is","are","were","have been"],"a":0,"e":"News → singular.","r":32},{"k":"e","o":["My trousers","is torn,","so I cannot wear them.","No error"],"a":1,"e":"Always plural: “are torn”.","r":33},{"k":"f","q":"The proceeds of the sale ___ given to charity.","o":["were","was","is","has been"],"a":0,"e":"Always plural.","r":33},{"k":"e","o":["A pair of shoes","is kept","near the door.","No error"],"a":3,"e":"The verb follows “pair”. Correct.","r":33},{"k":"e","o":["The peasantry","of this area","is very poor.","No error"],"a":2,"e":"Peasantry → plural: “are very poor”.","r":34},{"k":"f","q":"The children ___ playing in the park.","o":["are","is","was","has been"],"a":0,"e":"Children → plural.","r":34},{"k":"e","o":["A cattle","was grazing","in the field.","No error"],"a":0,"e":"Cattle takes no “a” and is plural: “Cattle were grazing”.","r":34},{"k":"e","o":["We saw","many deers","in the zoo.","No error"],"a":1,"e":"Deer has the same plural form: “many deer”.","r":35},{"k":"f","q":"Several ___ of birds are found in this sanctuary.","o":["species","specie","speciess","specieses"],"a":0,"e":"Species has the same singular and plural form.","r":35},{"k":"f","q":"The ___ of the missing boy are still unknown.","o":["whereabouts","whereabout","whereabouts’s","whereabout’s"],"a":0,"e":"Whereabouts has no singular form.","r":35},{"k":"e","o":["Two aircraft","were seen","flying low over the city.","No error"],"a":3,"e":"Aircraft has the same plural form. Correct.","r":35},{"k":"e","o":["Many passer-bys","gathered","at the accident site.","No error"],"a":0,"e":"Main noun: passer → “passers-by”.","r":36},{"k":"f","q":"The two ___ met to discuss the war.","o":["commanders-in-chief","commander-in-chiefs","commanders-in-chiefs","commander-ins-chief"],"a":0,"e":"Main noun: commander.","r":36},{"k":"f","q":"The hospital has hired five ___.","o":["women doctors","woman doctors","women doctor","womans doctors"],"a":0,"e":"Gender word + profession → both plural.","r":36},{"k":"e","o":["A group of cattle","was grazing","near the river.","No error"],"a":0,"e":"A group of cattle is “a herd of cattle”.","r":37},{"k":"f","q":"A ___ of fish was seen near the boat.","o":["shoal","pack","flock","fleet"],"a":0,"e":"A group of fish is a shoal (or school).","r":37},{"k":"e","o":["Sita’s and Gita’s mother","is a doctor","in the city hospital.","No error"],"a":0,"e":"They share one mother: “Sita and Gita’s mother”.","r":38},{"k":"f","q":"He stole ___ purse.","o":["somebody’s","somebodys","somebodies’","somebody"],"a":0,"e":"Indefinite pronouns take ’s.","r":38},{"k":"f","q":"The ___ common room is on the first floor.","o":["teachers’","teachers’s","teacher’s’","teachers"],"a":0,"e":"Plural in -s → just the apostrophe.","r":38},{"k":"e","o":["My brother’s-in-law","shop is","near the bus stand.","No error"],"a":0,"e":"’s goes at the end: “brother-in-law’s shop”.","r":39},{"k":"f","q":"The ___ speech was telecast live.","o":["commander-in-chief’s","commander’s-in-chief","commanders-in-chief","commander-in-chiefs’"],"a":0,"e":"’s at the end of the compound.","r":39},{"k":"e","o":["The house is","at a stone’s throw","from the station.","No error"],"a":3,"e":"Idiom with ’s. Correct.","r":40},{"k":"f","q":"The ___ surface has many craters.","o":["Moon’s","Moons","Moons’","Moon"],"a":0,"e":"Celestial bodies can take ’s.","r":40},{"k":"e","o":["The pen’s cap","is lost,","so it has dried up.","No error"],"a":0,"e":"An ordinary object uses “of”: “The cap of the pen”.","r":40}],"hw":[{"s":"Go to a nearby store and bring a cake of soap.","e":"Soap is uncountable; count it with a unit."},{"s":"Even after receiving many summonses, he didn’t appear in the court.","e":"Summons is singular; its plural is summonses."},{"s":"Our company has set up its new headquarters in South Delhi.","e":"Headquarters has the same form in singular and plural."},{"s":"Rahul and his friends’ behaviour at the party was extremely bad.","e":"Plural in -s → just the apostrophe."}]},{"n":5,"name":"Adverb and article","hi":"क्रियाविशेषण और आर्टिकल","rules":[{"n":41,"title":"Linking verb + adjective, action verb + adverb","L":["A linking verb does not show an action; it connects the subject to a quality of the subject. The word after it describes the <b>subject<\/b>, so it is an adjective.","Linking verbs: be forms, become, get, grow, feel, smell, taste, sound, keep, remain, prove, look, seem, appear, turn.","An action verb is described by an adverb: behaved <b>rudely<\/b>, ran <b>quickly<\/b>."],"TB":[],"T":["Test: replace the verb with “is”. If the sentence still makes sense (He got mad → He is mad), use the adjective."],"X":[{"s":"She behaved very *rude* with Ajay’s parents.","f":"rudely","w":"Behave is an action."},{"s":"He got really *madly* when he saw them.","f":"mad","w":"Get is linking here."},{"s":"She kept *calmly* during the interrogation.","f":"calm","w":"Keep is linking here."},{"s":"I don’t feel *safely* here.","f":"safe","w":"Feel is linking."},{"s":"When he heard the news, he became really *sadly*.","f":"sad","w":"From the lecture homework."}],"N":[],"Q":[{"k":"f","q":"The flowers smell ___.","o":["sweet","sweetly","sweetness","more sweetly"],"a":0,"e":"Smell is a linking verb here → adjective.","r":41},{"k":"e","o":["The soldier fought","brave","till the end.","No error"],"a":1,"e":"Fight is an action → adverb: “fought bravely”.","r":41},{"k":"f","q":"The milk has turned ___.","o":["sour","sourly","sourness","to sour"],"a":0,"e":"Turn is linking here → adjective.","r":41}]},{"n":42,"title":"Same form for adjective and adverb: fast, hard, late, straight","L":["Fast, hard, late, straight, early, daily, weekly, monthly and yearly work as both adjective and adverb with the same form.","Adding -ly often creates a different word: <b>hardly<\/b> = barely (ना के बराबर), <b>lately<\/b> = recently. “Straightly” and “fastly” do not exist.","<b>Everyday<\/b> (one word) is an adjective: everyday life. <b>Every day<\/b> (two words) is an adverb of frequency: I study every day."],"TB":[],"T":["Worked hard (mehnat se) vs hardly worked (barely). Came late vs lately (recently)."],"X":[{"s":"We have to make some *choices hard* in life.","f":"hard choices","w":"The adjective goes before the noun."},{"s":"Reeta came home *lately* because of the traffic.","f":"late","w":"Late = not on time."},{"s":"She had to take an *every day appointment* with a therapist.","f":"appointment every day","w":"Adverb of frequency."},{"s":"Yash told him *straightly* to stop bothering him.","f":"straight","w":"“Straightly” is not a word."}],"N":[],"Q":[{"k":"f","q":"He works ___ to support his family.","o":["hard","hardly","hardy","hardness"],"a":0,"e":"Works with effort → hard.","r":42},{"k":"e","o":["She runs so fastly","that nobody","can catch her.","No error"],"a":0,"e":"“Fastly” is not a word: “runs so fast”.","r":42},{"k":"f","q":"I have not seen him ___.","o":["lately","late","later","latest"],"a":0,"e":"Recently → lately.","r":42}]},{"n":43,"title":"Adjectives ending in -ly","L":["When -ly is added to an adjective, you get an adverb (nice → nicely). When -ly is added to a <b>noun<\/b>, you get an <b>adjective<\/b> (man → manly).","So these are adjectives, not adverbs: godly, kingly, queenly, fatherly, motherly, brotherly, friendly, manly, womanly, miserly, niggardly, lively, lovely, deadly, cowardly, costly, likely.","To use them as adverbs, write “in a … manner” or “like a …”."],"TB":[],"T":["She treats me in a motherly manner. He behaved like a coward. He spoke in a friendly way."],"X":[{"s":"She always treats me *motherly*.","f":"like a mother / in a motherly manner","w":"Motherly is an adjective."},{"s":"He has a very deep and *manly* voice.","f":"(no error)","w":"Adjective before a noun."},{"s":"Those who act *cowardly* in danger are not fit for the army.","f":"in a cowardly manner","w":"Cowardly is an adjective."},{"s":"He always acts *miserly*.","f":"like a miser","w":"Miserly is an adjective."},{"s":"He doesn’t treat me *friendly*.","f":"in a friendly manner","w":"From the lecture homework."}],"N":[],"Q":[{"k":"f","q":"He spoke to the new employee ___.","o":["in a friendly manner","friendly","friendlily","friend"],"a":0,"e":"Friendly is an adjective.","r":43},{"k":"e","o":["The children","behaved very","lovely at the party.","No error"],"a":2,"e":"Lovely is an adjective. Use “behaved very nicely” (or “in a lovely manner”).","r":43}]},{"n":44,"title":"Where adverbs of frequency go","L":["<b>Indefinite<\/b> frequency (often, seldom, always, rarely, never, usually, hardly ever): before the main verb, after the first helping verb, and after “be”.","<b>Definite<\/b> frequency (daily, weekly, monthly, yearly, every day): at the end of the clause.","Regularly, frequently and occasionally can go in either place."],"TB":[],"T":["I rarely have. She has always been. He is never late. He goes to the gym daily."],"X":[{"s":"I *have rarely* time for painting.","f":"rarely have","w":"Before the main verb “have”."},{"s":"He *daily goes* to the gym.","f":"goes to the gym daily","w":"Definite frequency → end."}],"N":[],"Q":[{"k":"f","q":"She ___ to office by bus.","o":["usually goes","goes usually","usually is going","is usually going"],"a":0,"e":"Indefinite frequency before the main verb, simple present for habit.","r":44},{"k":"e","o":["He never is","late for","his classes.","No error"],"a":0,"e":"After “be”, the adverb comes after the verb: “He is never late”.","r":44},{"k":"e","o":["We meet","our grandparents","monthly.","No error"],"a":3,"e":"Definite frequency at the end. Correct.","r":44}]},{"n":45,"title":"Too much / much too; still / yet","L":["<b>Too much<\/b> goes before a noun: too much money. <b>Much too<\/b> goes before an adjective or adverb: much too angry.","<b>Still<\/b> shows an action continuing; it is placed before the main verb (after “be”): “He is still recovering.”","<b>Yet<\/b> is used in negatives and questions, usually with the present perfect, at the end of the clause: “She hasn’t finished the book yet.”"],"TB":[],"T":["Much too + adjective. Too much + noun. Still = अभी भी (continuing). Not … yet = अभी तक नहीं."],"X":[{"s":"His teachers were *too much angry* with him.","f":"much too angry","w":"Before an adjective."},{"s":"You have spent *much too money* on your suit.","f":"too much money","w":"Before a noun."},{"s":"He cannot come because he is *yet recovering*.","f":"still recovering","w":"Continuing action."},{"s":"She *hasn’t still finished* reading the book.","f":"hasn’t finished reading the book yet","w":"Negative present perfect → yet at the end."}],"N":[],"Q":[{"k":"f","q":"This coat is ___ expensive for me.","o":["much too","too much","very much","much"],"a":0,"e":"Before an adjective → much too.","r":45},{"k":"e","o":["There is much too","sugar","in this tea.","No error"],"a":0,"e":"Before a noun: “too much sugar”.","r":45},{"k":"f","q":"Has the parcel arrived ___?","o":["yet","still","already yet","till"],"a":0,"e":"A question in the present perfect → yet at the end.","r":45}]},{"n":46,"title":"Inversion after a negative adverb or an adverb of place","L":["When a sentence begins with a negative or limiting adverb (never, seldom, rarely, hardly, scarcely, barely, no sooner, not only, little, nowhere, only then), the helping verb comes before the subject: Adverb + helping verb + subject + main verb.","When a sentence begins with an adverb of place, the main verb comes before the subject, and the verb agrees with that subject: “Away <b>went<\/b> the thief.” “Near the house <b>were<\/b> three bodies.”","“So / neither + helping verb + subject”: “Rajesh joined me, and <b>so did Kunal<\/b>.”"],"TB":[],"T":["Never have I… Barely had she… Hardly had he… Here comes the bus. Down fell the tree."],"X":[{"s":"*Barely she had* got back in bed when the alarm went off.","f":"Barely had she","w":"Inversion."},{"s":"*Never I have* encountered such rudeness.","f":"Never have I","w":"Inversion."},{"s":"Two metres from their house *was* lying three dead bodies.","f":"were","w":"The subject (three bodies) is plural."},{"s":"Rajesh joined me and *so Kunal did*.","f":"so did Kunal","w":"So + helping verb + subject."},{"s":"Two miles beyond those buildings *were* located a small temple.","f":"was","w":"From the lecture homework: subject is “a small temple”."}],"N":[],"Q":[{"k":"f","q":"Seldom ___ such a beautiful sunset.","o":["have I seen","I have seen","I seen","did I saw"],"a":0,"e":"Negative adverb first → inversion.","r":46},{"k":"e","o":["Not only he sings","but he also dances","very well.","No error"],"a":0,"e":"Negative opening → inversion: “Not only does he sing”.","r":46},{"k":"f","q":"I don’t like coffee, and ___.","o":["neither does my wife","neither my wife does","my wife neither does","so does my wife"],"a":0,"e":"Negative agreement: neither + helping verb + subject.","r":46}]},{"n":47,"title":"A / an vs the","L":["<b>A / an<\/b> introduces something for the first time, or one of many. <b>The<\/b> points to something specific: already known, defined by a clause, or the only one.","“I saw <b>the<\/b> fireman <b>who saved my life<\/b>” — the clause makes it specific. “My uncle gifted me <b>an<\/b> expensive watch” — any one watch, first mention."],"TB":[],"T":["Can the listener tell exactly which one? Yes → the. No → a / an."],"X":[{"s":"I was happy to see *a* fireman who saved my life.","f":"the","w":"Specific: defined by the clause."},{"s":"I can’t believe that he lives in *the* small flat in that society.","f":"a","w":"One of many flats, first mention."},{"s":"My uncle gifted me *the* expensive watch on my birthday.","f":"an","w":"First mention."},{"s":"*A* man whom we met on the way is my brother-in-law.","f":"The","w":"Specific: defined by the clause."},{"s":"He wanted to buy *the* big house for his parents.","f":"a","w":"From the lecture homework."},{"s":"He stole *a* charger of my phone.","f":"the","w":"From the lecture homework: my phone has one specific charger."}],"N":[],"Q":[{"k":"f","q":"___ book you lent me was very useful.","o":["The","A","An","No article"],"a":0,"e":"Specific: defined by “you lent me”.","r":47},{"k":"e","o":["I bought a pen yesterday,","but a pen","does not write well.","No error"],"a":1,"e":"Second mention of the same pen: “but the pen”.","r":47},{"k":"f","q":"I saw ___ elephant in the zoo yesterday.","o":["an","a","the","no article"],"a":0,"e":"First mention, vowel sound → an.","r":47}]},{"n":48,"title":"A vs an: go by the sound","L":["Use <b>an<\/b> before a vowel <b>sound<\/b>, and <b>a<\/b> before a consonant sound. The spelling does not matter.","Vowel letter, consonant sound (“yu” or “wa”): unit, unique, utopia, universal, uniform, useful, union, university, European, eulogy, one, once. → <b>a<\/b>.","Consonant letter, vowel sound: hour, heir, heiress, honest, honour, honorary. Abbreviations starting with F, H, L, M, N, R, S, X (said “ef, aitch, el, em, en, ar, es, ex”): an FIR, an SMS, an MNC, an LLB, an MLA. → <b>an<\/b>."],"TB":[],"T":["Say the word aloud. “A-unique” sounds right because unique starts with “yu”. “An-FIR” because F is said “ef”."],"X":[{"s":"My brother has *an unique* sense of humour.","f":"a unique","w":"“Yu” sound."},{"s":"I will not hesitate in lodging *a FIR* against you.","f":"an FIR","w":"“Ef” sound."},{"s":"The spammer sent him *a SMS*.","f":"an SMS","w":"“Es” sound."},{"s":"They awarded him *a honorary* degree.","f":"an honorary","w":"Silent h."}],"N":[],"Q":[{"k":"f","q":"He is ___ MLA from Patna.","o":["an","a","the","no article"],"a":0,"e":"M is said “em”, a vowel sound.","r":48},{"k":"f","q":"She studies at ___ university in Delhi.","o":["a","an","the","no article"],"a":0,"e":"University starts with a “yu” sound.","r":48},{"k":"e","o":["He waited for","a hour","at the station.","No error"],"a":1,"e":"Silent h: “an hour”.","r":48}]},{"n":49,"title":"A proper noun used as a common noun takes an article","L":["When a famous name is used to mean “a person like him” or “a thing like it”, it becomes a common noun and takes an article: <b>a<\/b> Sachin (a great batsman), <b>the<\/b> Robin Hood of his area, <b>the<\/b> Shakespeare of India (Kalidas)."],"TB":[],"T":["“Like …” meaning → add a / the. The same name used for the real person → no article."],"X":[{"s":"He is known as *Robin Hood* of his area.","f":"the Robin Hood","w":"Used as a common noun."},{"s":"Accept that you are not *Sachin*.","f":"a Sachin","w":"A great batsman like Sachin."}],"N":[],"Q":[{"k":"f","q":"Kalidas is often called ___ Shakespeare of India.","o":["the","a","an","no article"],"a":0,"e":"A proper noun used as a common noun, made specific by “of India”.","r":49},{"k":"e","o":["He thinks he is","a Einstein","because he topped the class.","No error"],"a":1,"e":"E here sounds like “ai”, a vowel sound: “an Einstein”.","r":49}]},{"n":50,"title":"No article with places used for their purpose, and with certain names","L":["School, college, university, hospital, church, temple, jail, prison, market, bed, court: no article when you go there for its main purpose. “Go to <b>school<\/b>” (to study), “go to <b>bed<\/b>” (to sleep). With another purpose, use the: “She went to <b>the<\/b> school to meet the principal.”","No article with names of games, days, months, colours, seasons, festivals, subjects, languages, cities, most countries, continents, single lakes, diseases and meals: play cricket, on Monday, in June, Diwali, Hindi, Asia.","Exceptions: countries with a plural or “union” name take the (the USA, the UK, the Netherlands). Oceans, rivers, mountain ranges and groups of islands take the."],"TB":[],"T":["Purpose → no article. Visiting for another reason → the."],"X":[{"s":"You should send your children to *the school*.","f":"school","w":"To study: its purpose."},{"s":"Yamini came home and went to *the bed*.","f":"bed","w":"To sleep."},{"s":"We always wait for *the Christmas*.","f":"Christmas","w":"Festival name."},{"s":"As soon as I can, I will shift to *the Australia*.","f":"Australia","w":"Country name."}],"N":[],"Q":[{"k":"f","q":"My father goes to ___ every Sunday to pray.","o":["church","the church","a church","an church"],"a":0,"e":"For its main purpose → no article.","r":50},{"k":"e","o":["The mother went to","the hospital","to see her sick son.","No error"],"a":3,"e":"She is visiting, not being treated, so “the hospital” is correct.","r":50},{"k":"f","q":"Do you know how to play ___?","o":["chess","the chess","a chess","an chess"],"a":0,"e":"Game name → no article.","r":50}]}],"test":[{"k":"e","o":["The food tastes","deliciously,","so let’s order more.","No error"],"a":1,"e":"Taste is linking here → adjective: “tastes delicious”.","r":41},{"k":"f","q":"She looked ___ at the stranger.","o":["angrily","angry","anger","angered"],"a":0,"e":"Look (an action: to direct the eyes) → adverb.","r":41},{"k":"e","o":["He remained","silent throughout","the meeting.","No error"],"a":3,"e":"Remain is linking → adjective. Correct.","r":41},{"k":"f","q":"The plan sounds ___ to me.","o":["good","well","nicely","goodly"],"a":0,"e":"Sound is linking → adjective.","r":41},{"k":"e","o":["The train arrived","lately due to fog,","so we missed the function.","No error"],"a":1,"e":"Not on time → “arrived late”.","r":42},{"k":"f","q":"He could ___ walk after the accident.","o":["hardly","hard","harder","hardy"],"a":0,"e":"Barely → hardly.","r":42},{"k":"f","q":"Go ___ and turn left at the temple.","o":["straight","straightly","straighten","straightness"],"a":0,"e":"“Straightly” is not a word.","r":42},{"k":"e","o":["The old man","spoke to us","fatherly.","No error"],"a":2,"e":"Fatherly is an adjective: “in a fatherly manner”.","r":43},{"k":"f","q":"It was a ___ mistake; many people lost their lives.","o":["deadly","deadlily","deadily","death"],"a":0,"e":"Deadly is an adjective before a noun.","r":43},{"k":"e","o":["She visits","often her grandparents","in the village.","No error"],"a":1,"e":"Indefinite frequency before the main verb: “often visits her grandparents”.","r":44},{"k":"e","o":["The magazine","weekly is published","in Hindi and English.","No error"],"a":1,"e":"Definite frequency goes at the end: “The magazine is published weekly in Hindi and English”.","r":44},{"k":"e","o":["He has always been","a sincere student","in our class.","No error"],"a":3,"e":"After the first helping verb. Correct.","r":44},{"k":"e","o":["The weather","is too much hot","to go out today.","No error"],"a":1,"e":"Before an adjective: “much too hot”.","r":45},{"k":"f","q":"He is ___ sleeping; don’t disturb him.","o":["still","yet","already","till"],"a":0,"e":"Continuing action → still.","r":45},{"k":"e","o":["The results","have not been declared","still.","No error"],"a":2,"e":"Negative present perfect → “yet”.","r":45},{"k":"e","o":["Hardly she had","reached home","when it began to rain.","No error"],"a":0,"e":"Inversion: “Hardly had she reached”.","r":46},{"k":"f","q":"Never ___ such a rude person.","o":["have I met","I have met","I met","I had meet"],"a":0,"e":"Negative adverb first → inversion.","r":46},{"k":"f","q":"Here ___ the bus we were waiting for.","o":["comes","come","is coming it","it comes"],"a":0,"e":"Adverb of place first → main verb before subject.","r":46},{"k":"e","o":["She passed the exam","and so","her brother did.","No error"],"a":2,"e":"So + helping verb + subject: “so did her brother”.","r":46},{"k":"e","o":["I met the old friend","at the station","yesterday.","No error"],"a":0,"e":"First mention of one of your friends: “an old friend”.","r":47},{"k":"f","q":"Please close ___ door behind you.","o":["the","a","an","no article"],"a":0,"e":"Both speakers know which door → the.","r":47},{"k":"e","o":["The girl in the red dress","is my","cousin.","No error"],"a":3,"e":"Specific, defined by the phrase. Correct.","r":47},{"k":"e","o":["She is","a honest","officer.","No error"],"a":1,"e":"Silent h: “an honest officer”.","r":48},{"k":"f","q":"He wants to become ___ IAS officer.","o":["an","a","the","no article"],"a":0,"e":"I is a vowel sound.","r":48},{"k":"f","q":"This is ___ one-way street.","o":["a","an","the","no article"],"a":0,"e":"“One” starts with a “wa” sound.","r":48},{"k":"e","o":["Tagore is called","Bard","of Bengal.","No error"],"a":1,"e":"A title used as a common noun and made specific: “the Bard of Bengal”.","r":49},{"k":"f","q":"This town is ___ Venice of the East.","o":["the","a","an","no article"],"a":0,"e":"Proper noun used as a common noun, made specific.","r":49},{"k":"e","o":["After dinner,","the children went","to the bed.","No error"],"a":2,"e":"To sleep: “went to bed”.","r":50},{"k":"f","q":"He was sent to ___ for five years for fraud.","o":["jail","the jail","a jail","an jail"],"a":0,"e":"As a prisoner → its main purpose → no article.","r":50},{"k":"e","o":["We will meet","on the Monday","at the office.","No error"],"a":1,"e":"No article with days: “on Monday”.","r":50}],"hw":[{"s":"When he got the news of his friend’s accident, he became really sad.","e":"Become is linking → adjective."},{"s":"I have always supported him in all his problems, yet he doesn’t treat me in a friendly manner.","e":"Friendly is an adjective."},{"s":"He told me that he wanted to buy a big house for his parents.","e":"First mention, one of many → a."},{"s":"I complained against him because he stole the charger of my phone.","e":"Specific: my phone’s charger → the."}]},{"n":6,"name":"Subject–verb agreement","hi":"कर्ता-क्रिया मेल","rules":[{"n":51,"title":"Nouns joined by with / along with / as well as → verb follows the first","L":["With, along with, together with, as well as, besides, including, excluding, except, like, unlike, but, in addition to, accompanied by, followed by, and not, but not, rather than are not true joiners like “and”. They add extra information.","So the subject is only the <b>first<\/b> noun, and the verb agrees with it."],"TB":[],"T":["Put the phrase in brackets: “The prime minister (accompanied by his bodyguards) <b>comes<\/b>…” Read the sentence without the bracket."],"X":[{"s":"The prime minister accompanied by his bodyguards *come* to the Red Fort every year.","f":"comes","w":"Subject: the prime minister."},{"s":"All the languages besides Hindi *is* spoken by the new student.","f":"are","w":"Subject: all the languages."},{"s":"Rahul unlike his friends *have* never missed my class.","f":"has","w":"From chapter 1 homework: subject is Rahul."}],"N":[],"Q":[{"k":"f","q":"The captain, along with his players, ___ reached the stadium.","o":["has","have","are","were"],"a":0,"e":"Subject: the captain.","r":51},{"k":"e","o":["The teacher as well as","the students","were present.","No error"],"a":2,"e":"Subject: the teacher → “was present”.","r":51},{"k":"f","q":"The students, and not their teacher, ___ responsible for the noise.","o":["are","is","was","has been"],"a":0,"e":"Subject: the students (plural).","r":51}]},{"n":52,"title":"Each / either / neither / every: all singular","L":["Each / either / neither + of + plural noun → singular verb. Each / either / neither + singular noun → singular verb.","“Each boy and each girl” / “every man and every woman” → still singular, because each one is taken separately."],"TB":[],"T":["Each, every, either, neither → always think “one at a time” → singular."],"X":[{"s":"Each of my cats *were* fed by my neighbour.","f":"was","w":"Each of → singular."},{"s":"Each chapter of the new book *are* interesting.","f":"is","w":"Each + singular noun."},{"s":"Every girl and every boy *were* given sweets.","f":"was","w":"Every … and every … → singular."}],"N":[],"Q":[{"k":"f","q":"Every man, woman and child ___ given a food packet.","o":["was","were","are","have been"],"a":0,"e":"Every → singular even with a list.","r":52},{"k":"e","o":["Each of the answers","carry","two marks.","No error"],"a":1,"e":"Each of → singular: “carries”.","r":52}]},{"n":53,"title":"One of + plural noun + singular verb; the + adjective + plural verb","L":["“One of my friends” — the subject is <b>one<\/b>, so the verb is singular. The noun after “one of” must be plural.","“The + adjective” means a whole class of people: the rich, the poor, the young, the old, the brave. It is plural."],"TB":[],"T":["One of + plural noun + singular verb. The rich / the poor → plural verb, “they”."],"X":[{"s":"One of my friends *own* a furniture shop.","f":"owns","w":"Subject: one."},{"s":"The rich always *looks* down on the poor.","f":"look","w":"The rich = rich people."},{"s":"When I was in trouble, one of my *friend* lent me money.","f":"friends","w":"From the lecture homework: one of + plural noun."}],"N":[],"Q":[{"k":"f","q":"One of the windows ___ broken.","o":["is","are","were","have been"],"a":0,"e":"Subject: one.","r":53},{"k":"e","o":["The poor","is not always","unhappy.","No error"],"a":1,"e":"The poor = poor people: “are not always”.","r":53},{"k":"f","q":"One of the ___ was absent today.","o":["teachers","teacher","teacher’s","teachers’"],"a":0,"e":"One of + plural noun.","r":53}]},{"n":54,"title":"Two articles = two people; one article = one person","L":["“<b>The<\/b> principal and <b>the<\/b> secretary” → two different people → plural verb.","“<b>The<\/b> principal and secretary” → one person holding both posts → singular verb.","So when the sentence clearly means one person (the Vice-President is also the Chairman of the Rajya Sabha), use only one article."],"TB":[],"T":["Count the articles: two articles, two people. Also check “their” / “his” later in the sentence for a hint."],"X":[{"s":"*The host and hostess* of the party were very nice, and they welcomed each guest.","f":"The host and the hostess","w":"Two different people need two articles."},{"s":"The principal and the secretary of our school *is* coming.","f":"are","w":"Two articles → two people."},{"s":"The Vice-President and *the* chairman of the Rajya Sabha is elected by an electoral college.","f":"(remove the)","w":"One person holds both posts."}],"N":[],"Q":[{"k":"f","q":"The poet and ___ singer has arrived.","o":["(no article)","the","a","an"],"a":0,"e":"“Has” shows one person → one article only.","r":54},{"k":"e","o":["The secretary and","the treasurer","has resigned.","No error"],"a":2,"e":"Two articles → two people: “have resigned”.","r":54}]},{"n":55,"title":"Gerund or infinitive as subject → singular verb","L":["When an -ing form (gerund) or a to-infinitive is the subject, it names one activity. So the verb is singular."],"TB":[],"T":["Writing poems <b>is<\/b>… To give advice <b>is<\/b> easy… Don’t be misled by the plural noun inside the phrase."],"X":[{"s":"Writing poems *have* been my hobby since school.","f":"has","w":"Gerund subject → singular."},{"s":"To give suggestions *are* easy.","f":"is","w":"Infinitive subject → singular."}],"N":[],"Q":[{"k":"f","q":"Reading novels ___ my favourite pastime.","o":["is","are","were","have been"],"a":0,"e":"Gerund subject → singular.","r":55},{"k":"e","o":["To make friends","are easy,","but keeping them is hard.","No error"],"a":1,"e":"Infinitive subject → “is easy”.","r":55}]},{"n":56,"title":"Either…or / neither…nor / not only…but also → verb follows the nearer subject","L":["With these pairs, the verb agrees with the subject <b>closest<\/b> to it (the second one)."],"TB":[],"T":["Neither Shruti nor her friends <b>are<\/b>… Either the students or the teacher <b>is<\/b>… Look at the noun just before the verb. Tip: put the plural noun second."],"X":[{"s":"Neither Shruti nor her friends *is* going.","f":"are","w":"Nearer: friends."},{"s":"Either Ashish or his colleagues *is* responsible.","f":"are","w":"Nearer: colleagues."},{"s":"Not only my parents but also my brother *are* coming.","f":"is","w":"Nearer: brother."},{"s":"Neither the murderer nor his accomplices *was* convicted.","f":"were","w":"From the lecture homework."}],"N":[],"Q":[{"k":"f","q":"Either you or he ___ to go.","o":["has","have","are","were"],"a":0,"e":"Nearer subject: he.","r":56},{"k":"e","o":["Neither the manager","nor his assistants","was present at the meeting.","No error"],"a":2,"e":"Nearer: assistants → “were present”.","r":56}]},{"n":57,"title":"Many + plural, many a + singular","L":["<b>Many<\/b> + plural noun + plural verb. <b>Many a<\/b> + singular noun + singular verb (it means “many, one by one”). <b>A great / good many<\/b> + plural noun + plural verb."],"TB":[],"T":["“Many a man <b>has<\/b> tried.” The “a” is your signal for singular."],"X":[{"s":"Many aspirants preparing for this exam *was* shocked.","f":"were","w":"Many + plural."},{"s":"Many a man *have* tried to climb Everest without oxygen.","f":"has","w":"Many a → singular."},{"s":"A great many lives *was* saved by the rescue team.","f":"were","w":"A great many → plural."}],"N":[],"Q":[{"k":"f","q":"Many a student ___ failed in this subject.","o":["has","have","are","were"],"a":0,"e":"Many a → singular.","r":57},{"k":"e","o":["Many a","soldiers","has died for the nation.","No error"],"a":1,"e":"Many a + singular noun: “many a soldier has died”.","r":57}]},{"n":58,"title":"A number of vs the number of","L":["<b>A number of<\/b> = many → plural noun + plural verb. <b>The number of<\/b> = the count (एक संख्या) → singular verb."],"TB":[],"T":["A number of students <b>are<\/b>… The number of students <b>is<\/b>…"],"X":[{"s":"A number of players *is* still injured.","f":"are","w":"A number of = many."},{"s":"The number of employees getting laid off *are* increasing.","f":"is","w":"The number = the count."},{"s":"The number of students using unfair means *are* increasing.","f":"is","w":"From the lecture homework."}],"N":[],"Q":[{"k":"f","q":"A number of trains ___ late because of fog.","o":["are","is","was","has been"],"a":0,"e":"A number of = many.","r":58},{"k":"e","o":["The number of accidents","have gone up","this year.","No error"],"a":1,"e":"The number = the count: “has gone up”.","r":58}]},{"n":59,"title":"Collective nouns; none of","L":["A collective noun (committee, team, jury, family, army, class, government) acting as one unit → singular verb.","When the members act separately or disagree, the idea is plural → plural verb: “The jury <b>have<\/b> different opinions.”","The lecture treats <b>none of<\/b> + plural noun as singular (none = not one)."],"TB":[],"T":["One decision → singular. Different opinions, quarrelling, taking their seats → plural."],"X":[{"s":"The committee *have* agreed to build a park.","f":"has","w":"One decision."},{"s":"The jury *has* different opinions about the case.","f":"have","w":"Members differ."},{"s":"None of his friends *were* present at his funeral.","f":"was","w":"None = not one."}],"N":["Modern English also accepts “none of + plural noun + plural verb”. In SSC questions, follow the lecture and pick singular when you must choose."],"Q":[{"k":"f","q":"The team ___ selected its new captain.","o":["has","have","are","were"],"a":0,"e":"One decision → singular (note “its”).","r":59},{"k":"e","o":["The family","are divided","over the property.","No error"],"a":3,"e":"The members disagree → plural verb. Correct.","r":59}]},{"n":60,"title":"Titles and proper names as subject → singular","L":["The name of a book, film, series or one thing is singular even if it looks plural: “The Harry Potter series <b>was<\/b> written by J.K. Rowling.” “The Arabian Nights <b>is<\/b> a classic.”","A word can change number with its meaning: “Mathematics (the subject) <b>is<\/b> my favourite.” But “His mathematics (calculation skills) <b>are<\/b> weak.”"],"TB":[],"T":["Title or name → singular. Watch for a possessive like “his / her”: it often turns a subject word into “skills”."],"X":[{"s":"The Harry Potter series *were* written by J.K. Rowling.","f":"was","w":"One series (title)."},{"s":"Mathematics *have* always been my favourite subject.","f":"has","w":"Subject name."},{"s":"I think that his mathematics *is* very weak.","f":"are","w":"Here mathematics = calculation skills."}],"N":[],"Q":[{"k":"f","q":"“Great Expectations” ___ written by Charles Dickens.","o":["was","were","are","have been"],"a":0,"e":"Title → singular.","r":60},{"k":"e","o":["The United States","have a","presidential system.","No error"],"a":1,"e":"Name of one country → “has a”.","r":60}]}],"test":[{"k":"e","o":["The actor,","along with his fans,","were dancing on the stage.","No error"],"a":2,"e":"Subject: the actor → “was dancing”.","r":51},{"k":"f","q":"The ship with all its crew ___ lost at sea.","o":["was","were","have been","are"],"a":0,"e":"Subject: the ship.","r":51},{"k":"e","o":["Nobody except the students","are allowed","in the library.","No error"],"a":1,"e":"Subject: nobody → “is allowed”.","r":51},{"k":"f","q":"Each boy and each girl ___ a prize.","o":["gets","get","are getting","have got"],"a":0,"e":"Each … and each … → singular.","r":52},{"k":"e","o":["Either of the two rooms","are available","for tonight.","No error"],"a":1,"e":"Either of → singular: “is available”.","r":52},{"k":"f","q":"Every one of the tickets ___ sold.","o":["was","were","have been","are"],"a":0,"e":"Every one → singular.","r":52},{"k":"e","o":["One of the most","important chapter","is missing.","No error"],"a":1,"e":"One of + plural noun: “important chapters”.","r":53},{"k":"f","q":"The old ___ special care.","o":["need","needs","is needing","has need"],"a":0,"e":"The old = old people → plural.","r":53},{"k":"e","o":["One of my cousins","is a pilot","in the Air Force.","No error"],"a":3,"e":"One of + plural noun + singular verb. Correct.","r":53},{"k":"e","o":["The chairman and","the managing director","is attending the meeting.","No error"],"a":2,"e":"Two articles → two people: “are attending”.","r":54},{"k":"f","q":"The collector and ___ District Magistrate is on leave today.","o":["(no article)","the","a","an"],"a":0,"e":"One person holds both posts, shown by “is”.","r":54},{"k":"e","o":["Swimming in rivers","are dangerous","during the monsoon.","No error"],"a":1,"e":"Gerund subject → “is dangerous”.","r":55},{"k":"f","q":"To err ___ human.","o":["is","are","were","being"],"a":0,"e":"Infinitive subject → singular.","r":55},{"k":"e","o":["Either the teacher","or the students","has the key.","No error"],"a":2,"e":"Nearer subject: students → “have the key”.","r":56},{"k":"f","q":"Neither the players nor the coach ___ happy with the result.","o":["was","were","are","have been"],"a":0,"e":"Nearer subject: the coach.","r":56},{"k":"f","q":"Not only the students but also the principal ___ present.","o":["was","were","are","have been"],"a":0,"e":"Nearer subject: the principal.","r":56},{"k":"e","o":["Many a bridge","have collapsed","due to the flood.","No error"],"a":1,"e":"Many a → singular: “has collapsed”.","r":57},{"k":"f","q":"A good many people ___ against the new law.","o":["are","is","has been","was"],"a":0,"e":"A good many → plural.","r":57},{"k":"e","o":["Many students","have applied","for the scholarship.","No error"],"a":3,"e":"Many + plural. Correct.","r":57},{"k":"e","o":["A number of boys","was playing","in the ground.","No error"],"a":1,"e":"A number of = many → “were playing”.","r":58},{"k":"f","q":"The number of unemployed youths ___ rising.","o":["is","are","were","have been"],"a":0,"e":"The number = the count.","r":58},{"k":"e","o":["The army","have surrounded","the area.","No error"],"a":1,"e":"Acting as one unit → “has surrounded”.","r":59},{"k":"f","q":"The audience ___ taking their seats.","o":["are","is","was","has"],"a":0,"e":"“Their seats” shows the members acting separately → plural.","r":59},{"k":"e","o":["The government","has announced","a new policy.","No error"],"a":3,"e":"One unit, one decision. Correct.","r":59},{"k":"e","o":["The Three Musketeers","are a famous novel","by Alexandre Dumas.","No error"],"a":1,"e":"Title → singular: “is a famous novel”.","r":60},{"k":"f","q":"Physics ___ my weakest subject.","o":["is","are","were","have been"],"a":0,"e":"Subject name → singular.","r":60},{"k":"e","o":["Her statistics","is very accurate","in this report.","No error"],"a":1,"e":"Here statistics = the figures → “are very accurate”.","r":60},{"k":"f","q":"The famous singer and dancer ___ performing tonight.","o":["is","are","were","have been"],"a":0,"e":"One article → one person.","r":54},{"k":"f","q":"Rice as well as pulses ___ grown in this state.","o":["is","are","were","have been"],"a":0,"e":"Subject: rice (uncountable, singular).","r":51},{"k":"e","o":["Playing cards","is his only hobby","after retirement.","No error"],"a":3,"e":"Gerund subject → singular. Correct.","r":55}],"hw":[{"s":"When I was facing a financial crisis, one of my friends lent me some money.","e":"One of + plural noun."},{"s":"Owing to lack of evidence, neither the murderer nor his accomplices were convicted.","e":"Nearer subject: accomplices."},{"s":"The number of students using unfair means to pass the exams is increasing day by day.","e":"The number = the count."},{"s":"Two miles beyond those buildings was located a small but beautiful temple.","e":"Inversion after a place phrase; subject: a temple."}]},{"n":7,"name":"Tense and question tag","hi":"काल","rules":[{"n":61,"title":"Right verb form after each helping verb","L":["Each helping verb fixes the form of the main verb after it:"],"TB":[["Helping verb","Main verb form","Example"],["do / does / did","V1","did not go"],["is / am / are / was / were (continuous)","V-ing","is playing"],["has / have / had","V3","has written"],["has been / have been / had been","V-ing (active) or V3 (passive)","has been working"],["will / shall / can / may / must","V1","will go"]],"T":["“Did went”, “has wrote”, “is play”, “has been worked” are the classic traps. Check the form right after the helping verb."],"X":[{"s":"Abhishek does not *took* the bus to school.","f":"take","w":"Does + V1."},{"s":"He did not *went* to school yesterday.","f":"go","w":"Did + V1."},{"s":"Trisha is *play* chess with her friends.","f":"playing","w":"Is + V-ing."},{"s":"Brian Wiest has already *wrote* three books.","f":"written","w":"Has + V3."},{"s":"She had not *ate* at such an expensive restaurant before.","f":"eaten","w":"Had + V3."},{"s":"She has been *worked* on this report since eight o’clock.","f":"working","w":"Has been + V-ing (active)."}],"N":[],"Q":[{"k":"f","q":"Did you ___ the news last night?","o":["hear","heard","hearing","hears"],"a":0,"e":"Did + V1.","r":61},{"k":"e","o":["The children have","went to school","by bus.","No error"],"a":1,"e":"Have + V3: “have gone”.","r":61},{"k":"f","q":"He has been ___ for two hours.","o":["waiting","waited","wait","waits"],"a":0,"e":"Has been + V-ing (active).","r":61}]},{"n":62,"title":"Since / for with a continuing action → present perfect (continuous)","L":["If an action started in the past and is still going on, use the <b>present perfect continuous<\/b> (has / have been + V-ing) with since / for.","For stative verbs (know, love, own…), use the present perfect instead: “I have known her for 5 years.”","With “since” (from a point in past to now), the main clause is present perfect: “She <b>has not called<\/b> me since she moved.”"],"TB":[],"T":["Since 2022 / for the last 10 years → has / have been + V-ing. Never “is working since”."],"X":[{"s":"I *am teaching* English for the last 10 years.","f":"have been teaching","w":"Continuing action."},{"s":"Shruti *is working* as a content writer since 2022.","f":"has been working","w":"Continuing action."},{"s":"She *is living* here for the last 20 years.","f":"has been living","w":"Continuing action."},{"s":"I *have been knowing* her for 5 years.","f":"have known","w":"Stative verb."},{"s":"Nalini *didn’t call* me even once since she moved.","f":"has not called","w":"Since → present perfect."},{"s":"I *am waiting* here for you for the last 2 hours.","f":"have been waiting","w":"From the lecture homework."}],"N":[],"Q":[{"k":"f","q":"It ___ since morning.","o":["has been raining","is raining","was raining","rains"],"a":0,"e":"Since morning and still going on.","r":62},{"k":"e","o":["We are living","in this house","since 2015.","No error"],"a":0,"e":"Since 2015 and still → “We have been living”.","r":62},{"k":"f","q":"I ___ him since childhood.","o":["have known","am knowing","know","have been knowing"],"a":0,"e":"Stative verb with since → present perfect.","r":62}]},{"n":63,"title":"Signal words for simple present and present continuous","L":["<b>Simple present<\/b>: habits, facts, proverbs, and words like always, often, daily, every day, regularly, frequently, occasionally, seldom, never, usually.","<b>Present continuous<\/b>: at this time, at this moment, at present, currently, these days, right now, now, look!, listen!."],"TB":[],"T":["Habit or fact → simple present. Happening now → is / am / are + V-ing."],"X":[{"s":"As Rohan lives in the mountains, he *has often gone* for a hike.","f":"often goes","w":"Habit → simple present."},{"s":"He *is seldom leaving* his home.","f":"seldom leaves","w":"Habit → simple present."}],"N":[],"Q":[{"k":"f","q":"Water ___ at 100°C.","o":["boils","is boiling","boiled","has boiled"],"a":0,"e":"Scientific fact → simple present.","r":63},{"k":"e","o":["Look! The baby","sleeps","on the sofa.","No error"],"a":1,"e":"“Look!” shows it is happening now: “is sleeping”.","r":63},{"k":"f","q":"These days she ___ for the bank exam.","o":["is preparing","prepares","prepared","has prepare"],"a":0,"e":"These days → present continuous.","r":63}]},{"n":64,"title":"Present perfect signals; past perfect with before / after","L":["<b>Present perfect<\/b> signals: yet, so far, already, just, just now*, lately, recently, of late. (*“just now” is often used with the past too.)","<b>Past perfect<\/b> is for the earlier of two past actions: Past perfect + before + simple past. Simple past + after + past perfect.","Don’t use past perfect for a single past action, or for the later action."],"TB":[],"T":["The action that happened first gets “had + V3”. After “after”, the earlier action; before “before”, the earlier action."],"X":[{"s":"I *hadn’t got* any email about the interview yet.","f":"haven’t got","w":"Yet → present perfect."},{"s":"Her children *hadn’t been* well lately.","f":"haven’t been","w":"Lately → present perfect."},{"s":"I *never met* anyone from India before I started living with Sangeeta.","f":"had never met","w":"Earlier past action."},{"s":"The doctor *had arrived* after the patient had died.","f":"arrived","w":"The doctor arrived later."}],"N":[],"Q":[{"k":"f","q":"The train ___ before we reached the station.","o":["had left","has left","left","leaves"],"a":0,"e":"Earlier past action → past perfect.","r":64},{"k":"e","o":["I have finished","my homework","an hour ago.","No error"],"a":0,"e":"“Ago” is a past signal: “I finished my homework an hour ago”.","r":64},{"k":"f","q":"We ___ three chapters so far.","o":["have completed","had completed","completed","complete"],"a":0,"e":"So far → present perfect.","r":64}]},{"n":65,"title":"Simple past and simple future signals","L":["<b>Simple past<\/b>: yesterday, ago, in the past, last day / Sunday / week / year, in 2010.","<b>Simple future<\/b>: tomorrow, next week / year, in the coming days, shortly, presently (= soon), in 2040."],"TB":[],"T":["A finished past time word never takes the present perfect (“have gone … last Sunday” is wrong). A future time word needs will / shall."],"X":[{"s":"It *had rained* heavily yesterday.","f":"rained","w":"Single past action."},{"s":"I *have gone* to the cinema last Sunday.","f":"went","w":"Last Sunday → simple past."},{"s":"The guests *arrive* shortly.","f":"will arrive","w":"Shortly → future."},{"s":"We *gather* more information in the coming days.","f":"will gather","w":"Future signal."}],"N":["The PDF’s printed answer for “the guests arrive shortly” is reversed. The correct form is “will arrive”."],"Q":[{"k":"f","q":"She ___ her grandparents next month.","o":["will visit","visited","has visited","had visited"],"a":0,"e":"Next month → future.","r":65},{"k":"e","o":["He has left","the company","in 2019.","No error"],"a":0,"e":"A past year → simple past: “He left the company in 2019”.","r":65},{"k":"f","q":"My father ___ me a watch two days ago.","o":["gave","has given","had given","gives"],"a":0,"e":"Ago → simple past.","r":65}]},{"n":66,"title":"Sequence of tenses; no future after if / when / until","L":["If the main (reporting) clause is in the past, the dependent clause is also put in the past: “My mother asked me where I <b>was<\/b> going.” (Exception: universal truths stay present.)","In time and condition clauses after when, while, if, until, unless, as soon as, before, after, provided that, do not use “will”. Use the present for a future meaning."],"TB":[],"T":["Asked / wanted to know → was / had. “I will call when I finish.” (not “when I will finish”)"],"X":[{"s":"My mother asked me where I *am* going.","f":"was","w":"Past reporting verb."},{"s":"The teacher wanted to know if the students *have* completed their homework.","f":"had","w":"Past reporting verb."},{"s":"I will call Shraddha when I *will finish* my presentation.","f":"finish","w":"No future after “when”."},{"s":"You will get a seat only if someone *will cancel* his ticket.","f":"cancels","w":"No future after “if”."}],"N":[],"Q":[{"k":"f","q":"I will wait here until you ___ back.","o":["come","will come","came","had come"],"a":0,"e":"No future after “until”.","r":66},{"k":"e","o":["He said that","he is","very busy that day.","No error"],"a":1,"e":"Past reporting verb → “he was very busy”.","r":66},{"k":"e","o":["Our teacher told us","that the earth","revolves round the sun.","No error"],"a":3,"e":"A universal truth stays in the present. Correct.","r":66}]},{"n":67,"title":"By the time","L":["<b>Past<\/b>: Past perfect + by the time + simple past. “The suspects <b>had escaped<\/b> by the time the police <b>arrived<\/b>.”","<b>Future<\/b>: Future perfect + by the time + simple present. “I <b>will have completed<\/b> my homework by the time you <b>come<\/b> back.”"],"TB":[],"T":["The action right after “by the time” happens later. The other action is already finished: had + V3 / will have + V3."],"X":[{"s":"The suspects already *escaped* by the time the police arrived.","f":"had already escaped","w":"Earlier action."},{"s":"I *finished* all the chores by the time my mother woke up.","f":"had finished","w":"Earlier action."},{"s":"By the time you come back, I *will complete* my homework.","f":"will have completed","w":"Future perfect."},{"s":"He will have held that post for ten years by the time he *will retire*.","f":"retires","w":"No future after “by the time”."}],"N":[],"Q":[{"k":"f","q":"By the time we reached the cinema, the film ___.","o":["had started","started","has started","was starting"],"a":0,"e":"Earlier action → past perfect.","r":67},{"k":"e","o":["By the time the guests arrive,","we will cook","all the dishes.","No error"],"a":1,"e":"Future perfect: “we will have cooked”.","r":67}]},{"n":68,"title":"Keep the tense consistent with the meaning","L":["Actions in the same time frame keep the same tense: a story in the past stays past; a general habit stays present.","Joining two clauses with “and / but” does not allow a switch of time unless the meaning changes."],"TB":[],"T":["Read the whole sentence and find its time frame first, then check every verb against it."],"X":[{"s":"My parents threw me a party and *invite* all my friends.","f":"invited","w":"Past story."},{"s":"Most people *bought* groceries from the supermarket, but we prefer our local shop.","f":"buy","w":"General present habit."},{"s":"When I was a kid, every morning we *plucks* flowers.","f":"plucked","w":"Past story."},{"s":"The judge asked him if he *has* stolen the money.","f":"had","w":"Past reporting verb."},{"s":"It grew fast as the country *is experiencing* a boom at that time.","f":"was experiencing","w":"Past time frame."},{"s":"Most children like to rest after they *returned* from school.","f":"return","w":"General habit."},{"s":"When I was in college, I studied till 10 pm and then I *go* to bed.","f":"went","w":"From the lecture homework."}],"N":[],"Q":[{"k":"f","q":"She opened the door and ___ out.","o":["walked","walks","has walked","had walk"],"a":0,"e":"Same past time frame.","r":68},{"k":"e","o":["Every day he gets up early","and went","for a walk.","No error"],"a":1,"e":"Daily habit → “and goes”.","r":68}]},{"n":69,"title":"Question tags","L":["A tag = helping verb + pronoun. It uses the same helping verb as the statement (or do / does / did if there is none).","A positive statement takes a negative tag, and a negative statement takes a positive tag. Never, seldom, hardly, barely, scarcely, no and nothing make a statement negative.","Contracted forms in negative tags: isn’t, doesn’t, won’t, shouldn’t. Special cases: I am → aren’t I; Let’s → shall we; imperative → will you."],"TB":[],"T":["Copy the helping verb, flip positive/negative, use a pronoun. “Never” counts as negative."],"X":[{"s":"We have already met each other, *didn’t we*?","f":"haven’t we","w":"Helping verb: have."},{"s":"Trains in India never come on time, *aren’t they*?","f":"do they","w":"Never → negative; no helping verb → do."},{"s":"The new HR was late on his first day, *weren’t he*?","f":"wasn’t he","w":"Helping verb: was."},{"s":"An aspirant should be consistent, *don’t he*?","f":"shouldn’t he","w":"Helping verb: should."},{"s":"Let’s go for dinner, *will we*?","f":"shall we","w":"Let’s → shall we."},{"s":"You haven’t seen the film, *did you*?","f":"have you","w":"Helping verb: have."}],"N":[],"Q":[{"k":"f","q":"I am your friend, ___?","o":["aren’t I","am not I","isn’t it","don’t I"],"a":0,"e":"I am → aren’t I.","r":69},{"k":"f","q":"She hardly ever smiles, ___?","o":["does she","doesn’t she","is she","isn’t she"],"a":0,"e":"Hardly makes it negative → positive tag.","r":69},{"k":"e","o":["Close the window,","isn’t it?","It is very cold.","No error"],"a":1,"e":"An imperative takes “will you?”.","r":69}]},{"n":70,"title":"Tags after everybody, nobody, none… → they","L":["When the subject is everybody, everyone, somebody, someone, nobody, no one, anybody, anyone, none, each, either, neither or all, the tag pronoun is <b>they<\/b>.","Nobody, no one, none and neither are negative, so the tag is positive. “All of you” → the tag is “you”."],"TB":[],"T":["Everybody came, didn’t they? Nobody called, did they? All of you agree, don’t you?"],"X":[{"s":"Everybody has come on time today, *hasn’t he*?","f":"haven’t they","w":"Everybody → they."},{"s":"None of his colleagues came to the party, *have they*?","f":"did they","w":"Past simple → did."},{"s":"All of you were present there, *weren’t they*?","f":"weren’t you","w":"All of you → you."},{"s":"None of them objected to this proposal, *did he*?","f":"did they","w":"From the lecture homework."}],"N":[],"Q":[{"k":"f","q":"Someone has taken my pen, ___?","o":["haven’t they","hasn’t he","hasn’t it","didn’t they"],"a":0,"e":"Someone → they; helping verb has → haven’t they.","r":70},{"k":"e","o":["Nobody knew","the answer,","didn’t they?","No error"],"a":2,"e":"Nobody is negative → positive tag: “did they?”.","r":70}]}],"test":[{"k":"e","o":["Did you finished","the work","I gave you?","No error"],"a":0,"e":"Did + V1: “Did you finish”.","r":61},{"k":"f","q":"They have ___ to Goa twice.","o":["been","be","being","was"],"a":0,"e":"Have + V3.","r":61},{"k":"e","o":["She is write","a letter","to her friend.","No error"],"a":0,"e":"Is + V-ing: “She is writing”.","r":61},{"k":"f","q":"The letter has ___ posted.","o":["been","being","be","was"],"a":0,"e":"Present perfect passive: has been + V3.","r":61},{"k":"e","o":["He is working","in this office","for ten years.","No error"],"a":0,"e":"Continuing action for ten years → “He has been working”.","r":62},{"k":"f","q":"They ___ married for twenty years.","o":["have been","are","were","have being"],"a":0,"e":"A continuing state → present perfect of be.","r":62},{"k":"e","o":["She has been","teaching here","since 2018.","No error"],"a":3,"e":"Continuing action with since. Correct.","r":62},{"k":"f","q":"The earth ___ round the sun.","o":["moves","is moving","moved","has moved"],"a":0,"e":"Universal fact → simple present.","r":63},{"k":"e","o":["Currently she","works","on a new project.","No error"],"a":1,"e":"Currently → present continuous: “is working”.","r":63},{"k":"f","q":"He ___ to the gym every morning.","o":["goes","is going","has gone","went to"],"a":0,"e":"Daily habit → simple present.","r":63},{"k":"e","o":["I have just","finished","my lunch.","No error"],"a":3,"e":"Just → present perfect. Correct.","r":64},{"k":"f","q":"When I reached the party, all the food ___ eaten.","o":["had been","has been","was being","is"],"a":0,"e":"Earlier past action → past perfect passive.","r":64},{"k":"e","o":["After he had finished","his work,","he had gone home.","No error"],"a":2,"e":"The later action → simple past: “he went home”.","r":64},{"k":"e","o":["She has met","the principal","yesterday.","No error"],"a":0,"e":"Yesterday → simple past: “She met”.","r":65},{"k":"f","q":"The minister ___ the new hospital next week.","o":["will inaugurate","inaugurated","has inaugurated","inaugurates yet"],"a":0,"e":"Next week → future.","r":65},{"k":"e","o":["We visited","Agra","last year.","No error"],"a":3,"e":"Last year → simple past. Correct.","r":65},{"k":"e","o":["I will tell him","the truth","when he will come.","No error"],"a":2,"e":"No future after “when”: “when he comes”.","r":66},{"k":"f","q":"He asked me what I ___.","o":["wanted","want","will want","wants"],"a":0,"e":"Past reporting verb → past.","r":66},{"k":"f","q":"If it ___ tomorrow, the match will be cancelled.","o":["rains","will rain","rained","has rained"],"a":0,"e":"No future after “if”.","r":66},{"k":"e","o":["By the time I reached,","the meeting","already ended.","No error"],"a":2,"e":"Earlier action → past perfect: “had already ended”.","r":67},{"k":"f","q":"By the time you get this letter, I ___ Delhi.","o":["will have left","will leave","left","have left"],"a":0,"e":"Future perfect.","r":67},{"k":"f","q":"By the time he ___ , the shop had closed.","o":["arrived","had arrived","arrives","will arrive"],"a":0,"e":"The later action after “by the time” → simple past.","r":67},{"k":"e","o":["He entered the room,","switched on the fan","and sits down.","No error"],"a":2,"e":"Past story → “and sat down”.","r":68},{"k":"f","q":"Yesterday I went to the market and ___ some fruit.","o":["bought","buy","have bought","had buy"],"a":0,"e":"Same past time frame.","r":68},{"k":"e","o":["She can drive,","can’t it?","She learnt last year.","No error"],"a":1,"e":"The pronoun must match “she”: “can’t she?”.","r":69},{"k":"f","q":"You won’t be late, ___?","o":["will you","won’t you","are you","do you"],"a":0,"e":"Negative statement → positive tag.","r":69},{"k":"f","q":"He seldom goes out, ___?","o":["does he","doesn’t he","is he","did he"],"a":0,"e":"Seldom makes it negative → positive tag.","r":69},{"k":"e","o":["Everyone enjoyed","the party,","didn’t he?","No error"],"a":2,"e":"Everyone → they: “didn’t they?”.","r":70},{"k":"f","q":"Neither of them came, ___?","o":["did they","didn’t they","did he","didn’t he"],"a":0,"e":"Neither → negative → positive tag with they.","r":70},{"k":"f","q":"Nothing happened, ___?","o":["did it","didn’t it","did they","had it"],"a":0,"e":"Nothing takes “it”, and it is negative → positive tag.","r":70}],"hw":[{"s":"I have been waiting here for you for the last 2 hours.","e":"Continuing action → present perfect continuous."},{"s":"When he reached his village, he found that the news of his arrival had preceded him.","e":"“Arrived” should be the noun “arrival”; and the earlier past action takes had + V3."},{"s":"None of them objected to this proposal, did they?","e":"None → they."},{"s":"When I was in college, I used to study till 10 pm and then went to bed.","e":"Keep the past time frame."}]},{"n":8,"name":"Conjunction","hi":"संयोजक","rules":[{"n":71,"title":"Correlatives join words of the same kind (parallelism)","L":["Either…or, neither…nor, not only…but also, both…and must be followed by the same kind of word on each side: verb with verb, noun with noun, clause with clause.","So place the first half just before the first item: “You can <b>either go<\/b> on a vacation <b>or stay<\/b> at home.”","<b>Both<\/b> pairs only with <b>and<\/b>, never with “as well as”."],"TB":[],"T":["Check the word right after each half. Either + verb … or + verb. Not only + verb … but also + verb."],"X":[{"s":"*Either you can* go for a vacation or stay at home.","f":"You can either go","w":"Verb with verb."},{"s":"The teacher teaches them *not only* mathematics but also provides counselling.","f":"not only teaches them mathematics","w":"Verb with verb."},{"s":"Both my friend *as well as* I like Hollywood movies.","f":"and","w":"Both…and."},{"s":"The war *not only caused* destruction and death but also generations of hatred.","f":"caused not only","w":"From the lecture homework: noun with noun."}],"N":[],"Q":[{"k":"f","q":"He is ___ intelligent but also hardworking.","o":["not only","not only is","only not","both"],"a":0,"e":"Adjective … adjective.","r":71},{"k":"e","o":["She neither","likes tea","nor coffee.","No error"],"a":0,"e":"Neither should stand before the first noun: “She likes neither tea nor coffee”.","r":71},{"k":"f","q":"Both the teacher ___ the students enjoyed the trip.","o":["and","as well as","or","with"],"a":0,"e":"Both…and.","r":71}]},{"n":72,"title":"Hardly / scarcely … when; no sooner … than","L":["<b>Hardly / scarcely / barely + had + subject + V3 … when<\/b> + simple past.","<b>No sooner + had + subject + V3 … than<\/b> + simple past.","These start with a negative adverb, so the helping verb comes before the subject (inversion)."],"TB":[],"T":["No sooner → than (both have “n”). Hardly / scarcely → when. And always “had I”, never “I had”."],"X":[{"s":"Hardly had I started breakfast *than* the bell rang.","f":"when","w":"Hardly…when."},{"s":"*Scarcely he had* entered the office when everyone laughed.","f":"Scarcely had he","w":"Inversion."},{"s":"No sooner had the dance ended *when* the audience cheered.","f":"than","w":"No sooner…than."}],"N":[],"Q":[{"k":"f","q":"No sooner had he left ___ it started raining.","o":["than","when","then","that"],"a":0,"e":"No sooner…than.","r":72},{"k":"e","o":["Hardly had we reached","the station than","the train left.","No error"],"a":1,"e":"Hardly…when: “the station when”.","r":72}]},{"n":73,"title":"Although…yet; so…as; as…as","L":["<b>Although / though<\/b> pairs with <b>yet<\/b> or a comma, never with “but”.","<b>As…as<\/b> is used in positive and negative sentences. <b>So…as<\/b> is used only in negative sentences."],"TB":[],"T":["Although … , yet … (never but). Not so … as ✔. So … as in a positive sentence ✘."],"X":[{"s":"Though there were many people, *but* there was pin-drop silence.","f":"yet","w":"Though…yet."},{"s":"Radhika is *not so intelligent as* she used to be.","f":"(no error)","w":"So…as in a negative sentence is fine."},{"s":"Shivam’s car is *so* expensive as mine.","f":"as","w":"Positive sentence → as…as."}],"N":[],"Q":[{"k":"f","q":"Although he worked hard, ___ he failed.","o":["yet","but","still but","and"],"a":0,"e":"Although…yet.","r":73},{"k":"e","o":["This box is","so heavy as","that one.","No error"],"a":1,"e":"Positive sentence → “as heavy as”.","r":73}]},{"n":74,"title":"So…that; too…to","L":["<b>So + adjective + that<\/b> + clause (result). <b>Too + adjective + to<\/b> + V1 (too much to allow the action).","“Too” already has a negative sense, so do not add “not” after “too…to”."],"TB":[],"T":["Clause after it (subject + verb) → so…that. V1 after it → too…to."],"X":[{"s":"The dumbbells were *too* heavy that he sprained his wrist.","f":"so","w":"A clause follows."},{"s":"Aryan was *too* tired that he couldn’t attend class.","f":"so","w":"A clause follows."},{"s":"His marks were *so* low to get admission.","f":"too","w":"An infinitive follows."},{"s":"He was *so* old to walk on his own.","f":"too","w":"An infinitive follows."}],"N":[],"Q":[{"k":"f","q":"The tea is ___ hot to drink.","o":["too","so","very","such"],"a":0,"e":"An infinitive follows.","r":74},{"k":"e","o":["He was so","weak that","he could not stand.","No error"],"a":3,"e":"So…that with a clause. Correct.","r":74}]},{"n":75,"title":"Between…and; lest…should","L":["<b>Between<\/b> pairs with <b>and<\/b>, never with “to”: between 9 pm and 10 pm. (From…to is the other pair.)","<b>Lest<\/b> means “so that … not”. It takes <b>should<\/b> (or a bare V1), never “will” and never “not”."],"TB":[],"T":["Between A and B. From A to B. Lest + should + V1."],"X":[{"s":"British rule lasted *between 1858 to 1947*.","f":"between 1858 and 1947","w":"Between…and."},{"s":"The chief guest will arrive *between 9 pm to 10 pm*.","f":"between 9 pm and 10 pm","w":"Between…and."},{"s":"Study for 10 hours daily, lest you *will* fail.","f":"should","w":"Lest…should."}],"N":[],"Q":[{"k":"f","q":"Walk carefully lest you ___.","o":["should fall","will fall","should not fall","fall not"],"a":0,"e":"Lest…should (no “not”).","r":75},{"k":"e","o":["The shop is closed","from 1 pm and 2 pm","for lunch.","No error"],"a":1,"e":"From…to or between…and: “between 1 pm and 2 pm”.","r":75}]},{"n":76,"title":"Such…as vs such…that","L":["<b>Such…as<\/b>: “as” works as a relative pronoun (जो / जैसा). It is followed by a clause that is missing its subject or object: “such students <b>as<\/b> are serious”.","<b>Such…that<\/b>: “that” is a conjunction showing result (कि). A complete clause follows: “such a bad-tempered person <b>that<\/b> no one can live with her”."],"TB":[],"T":["After “such”, if the next clause is complete by itself → that. If it needs “as” to be its subject → as. Never “such … who”."],"X":[{"s":"I teach only *such students who* are serious.","f":"such students as","w":"As = relative pronoun."},{"s":"She is such a bad-tempered person *as* no one can live with her.","f":"that","w":"Result clause."},{"s":"It was such a ferocious animal *as* everyone stayed away.","f":"that","w":"Result clause."}],"N":[],"Q":[{"k":"f","q":"He is not such a fool ___ he looks.","o":["as","that","who","which"],"a":0,"e":"“As he looks” = relative sense.","r":76},{"k":"e","o":["It was such a","boring film that","we left early.","No error"],"a":3,"e":"Result clause → that. Correct.","r":76}]},{"n":77,"title":"Don’t double conjunctions: as…so, that + what / where","L":["One link is enough. If “as / since / because” begins the sentence, do not add “so” in the other clause.","In reported speech, do not put “that” before a question word (what, where, when, why, how, if, whether): “I asked her <b>where<\/b> she was going.”"],"TB":[],"T":["As … so ✘. Asked that where ✘."],"X":[{"s":"As I have lived in Mumbai for a year, *so* I know how expensive it is.","f":"(remove so)","w":"As already joins the clauses."},{"s":"I asked her *that where* she was going.","f":"where","w":"Remove that."},{"s":"Her husband asked her *that what* she was doing.","f":"what","w":"Remove that."},{"s":"He angrily asked me *if* I had met Rajni *or not*.","f":"whether I had met Rajni or not","w":"From the lecture homework: “or not” pairs with whether."}],"N":[],"Q":[{"k":"f","q":"Since it was raining, ___ we stayed indoors.","o":["(no word)","so","therefore so","hence so"],"a":0,"e":"Since already joins the clauses.","r":77},{"k":"e","o":["The officer asked me","that why","I was late.","No error"],"a":1,"e":"Remove that: “asked me why”.","r":77}]},{"n":78,"title":"Until vs unless; no “not” with them","L":["<b>Until<\/b> is about time (जब तक). <b>Unless<\/b> is about condition (जब तक नहीं / अगर नहीं).","Both already carry a negative idea, so do not add “not” in the same clause."],"TB":[],"T":["Wait until I return (time). You won’t pass unless you study (condition). “Unless you do not” ✘."],"X":[{"s":"*Until* you control your diet, you won’t lose fat.","f":"Unless","w":"Condition."},{"s":"Please wait for me here *unless* I return.","f":"until","w":"Time."},{"s":"Yash will not go on the trip unless he *does not have* enough money.","f":"has","w":"No double negative."}],"N":[],"Q":[{"k":"f","q":"You will not succeed ___ you work hard.","o":["unless","until","if","when"],"a":0,"e":"Condition.","r":78},{"k":"e","o":["Unless you do not","apologise,","I will not talk to you.","No error"],"a":0,"e":"No “not” with unless: “Unless you apologise”.","r":78}]},{"n":79,"title":"The reason … is that; no “supposing if”","L":["“Reason” already means “because”. So after “the reason … is / was”, use <b>that<\/b>, not because.","Supposing already means “if”, so “supposing if” is double. Use one of them."],"TB":[],"T":["The reason is that… ✔. The reason is because ✘. Supposing / if — pick one."],"X":[{"s":"The reason she is upset is *because* she broke up.","f":"that","w":"Reason … that."},{"s":"The reason Payal missed the meeting was *because* she had a headache.","f":"that","w":"Reason … that."},{"s":"*Supposing if* you are wrong, will you apologise?","f":"Supposing / If","w":"Use only one."}],"N":[],"Q":[{"k":"f","q":"The reason for his absence was ___ he was ill.","o":["that","because","why","as"],"a":0,"e":"Reason … that.","r":79},{"k":"e","o":["Supposing if","he refuses,","what will you do?","No error"],"a":0,"e":"Use one: “Supposing he refuses” or “If he refuses”.","r":79}]},{"n":80,"title":"Pick the conjunction that fits the meaning","L":["Many errors are about meaning, not form. Check the logical link between the two clauses:","<b>Contrast<\/b> (but, yet, although, though) — the second part is unexpected. <b>Result<\/b> (so, therefore) — the second part follows. <b>Reason<\/b> (as, because, since). <b>Condition<\/b> (if, unless). <b>Purpose<\/b> (so that)."],"TB":[],"T":["Read both clauses and ask: surprise → yet / but. Effect → so. Cause → because / as."],"X":[{"s":"He has all the skills and money, *and* he dare not start a company.","f":"yet","w":"Contrast."},{"s":"She wouldn’t have suffered *when* you had helped her in time.","f":"if","w":"Condition."},{"s":"He has very little money, *so* he offered to pay for her treatment.","f":"yet","w":"Contrast."},{"s":"Her husband was very loving and caring *although* she left him.","f":"yet","w":"Contrast."},{"s":"Yamini broke my laptop, *but* I asked her to get it repaired.","f":"so","w":"Result."},{"s":"I missed my bus *as* I had to book a taxi.","f":"so","w":"Result."},{"s":"They had shot him thrice *as* he survived.","f":"yet","w":"From the lecture homework: contrast."},{"s":"She had not seen me for 10 years *but* she was not able to recognise me.","f":"so","w":"From the lecture homework: result."}],"N":[],"Q":[{"k":"f","q":"He was tired, ___ he kept working.","o":["yet","so","because","as"],"a":0,"e":"Contrast.","r":80},{"k":"e","o":["It was raining heavily,","because we cancelled","the picnic.","No error"],"a":1,"e":"Result: “so we cancelled”.","r":80}]}],"test":[{"k":"e","o":["He not only lost","his money","but also his reputation.","No error"],"a":0,"e":"Noun with noun: “He lost not only his money but also his reputation”.","r":71},{"k":"f","q":"You can ___ call me or send a message.","o":["either","neither","both","whether"],"a":0,"e":"Either…or, placed before the first verb.","r":71},{"k":"e","o":["Both Ravi as well as Sita","have passed","the exam.","No error"],"a":0,"e":"Both…and: “Both Ravi and Sita”.","r":71},{"k":"e","o":["No sooner did","the bell ring","when the students ran out.","No error"],"a":2,"e":"No sooner…than: “than the students ran out”.","r":72},{"k":"f","q":"Scarcely ___ the room when the lights went off.","o":["had I entered","I had entered","did I entered","I entered"],"a":0,"e":"Inversion with past perfect.","r":72},{"k":"f","q":"Hardly had she sat down ___ the phone rang.","o":["when","than","then","that"],"a":0,"e":"Hardly…when.","r":72},{"k":"e","o":["Though he is rich,","but he lives","a simple life.","No error"],"a":1,"e":"Though…yet (or a comma): “yet he lives”.","r":73},{"k":"f","q":"She is not ___ tall as her sister.","o":["so","too","such","more"],"a":0,"e":"So…as is allowed in a negative sentence.","r":73},{"k":"e","o":["Ravi is","so strong as","his brother.","No error"],"a":1,"e":"Positive sentence → “as strong as”.","r":73},{"k":"e","o":["The box was","too heavy that","nobody could lift it.","No error"],"a":1,"e":"A clause follows: “so heavy that”.","r":74},{"k":"f","q":"He is ___ proud to ask for help.","o":["too","so","such","very"],"a":0,"e":"An infinitive follows → too…to.","r":74},{"k":"e","o":["The question was","too difficult","for me to answer.","No error"],"a":3,"e":"Too…to (with “for me”). Correct.","r":74},{"k":"e","o":["The exam will be held","between 10 am to 1 pm","on Monday.","No error"],"a":1,"e":"Between…and: “between 10 am and 1 pm”.","r":75},{"k":"f","q":"Take an umbrella lest it ___.","o":["should rain","will rain","rains not","should not rain"],"a":0,"e":"Lest…should.","r":75},{"k":"e","o":["Such people","who break the rules","should be punished.","No error"],"a":1,"e":"Such…as: “as break the rules”.","r":76},{"k":"f","q":"It was such a hot day ___ we stayed indoors.","o":["that","as","so","which"],"a":0,"e":"Result clause → that.","r":76},{"k":"e","o":["As the road was blocked,","so we took","another route.","No error"],"a":1,"e":"As already links the clauses: remove “so”.","r":77},{"k":"f","q":"My friend asked me ___ I would join him.","o":["whether","that whether","that if","that"],"a":0,"e":"No “that” before whether.","r":77},{"k":"e","o":["She told me","that she would","come the next day.","No error"],"a":3,"e":"“That” before a statement is fine. Correct.","r":77},{"k":"e","o":["Wait here","unless I come back","from the bank.","No error"],"a":1,"e":"Time → “until I come back”.","r":78},{"k":"f","q":"You cannot enter the hall ___ you show your admit card.","o":["unless","until","if not unless","till not"],"a":0,"e":"Condition.","r":78},{"k":"e","o":["Until he does not","pay the fine,","he cannot leave.","No error"],"a":0,"e":"Condition and no double negative: “Unless he pays”.","r":78},{"k":"e","o":["The reason why he left","was because","he was not paid.","No error"],"a":1,"e":"Reason … that: “was that”.","r":79},{"k":"f","q":"___ you lost the key, what would you do?","o":["Supposing","Supposing if","If supposing","Suppose if"],"a":0,"e":"Use only one conditional word.","r":79},{"k":"e","o":["He is poor,","so he is","honest.","No error"],"a":1,"e":"Contrast: “but he is honest” / “yet he is honest”.","r":80},{"k":"f","q":"She studied hard ___ she could get a scholarship.","o":["so that","because","although","unless"],"a":0,"e"

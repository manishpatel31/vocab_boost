<script>
/* शब्दRegister bridge: follows the app's Light / Dark / Auto choice when opened inside the app. */
(function(){
  var root = document.documentElement;
  function apply(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  try{
    var q = new URLSearchParams(location.search);
    if(q.get('theme')) apply(q.get('theme'));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data) return;
    if(e.data.type === 'shabd-theme') apply(e.data.theme);
  });
})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grammar 100</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hind:wght@400;500;600&family=Caveat:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-width column, a course list that opens into rule lessons, bottom tab bar. The teacher's red pen is the one bold element. */
:root{
  --paper:#f3f5f7; --card:#ffffff; --ink:#1a2230; --muted:#5b6576; --line:#dde2e8;
  --pen:#c73a26; --pen-soft:#fbe7e3; --fix:#16734f; --fix-soft:#e1f3ea;
  --hl:#ffe36b; --hl-soft:#fff6cc; --navy:#223a6b; --navy-soft:#e5ebf6;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Hind","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-pen:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11151c; --card:#1a2029; --ink:#e6e9ef; --muted:#9aa4b5; --line:#2b3340;
  --pen:#ff7a63; --pen-soft:#3a1f1b; --fix:#4fca94; --fix-soft:#16342a;
  --hl:#e3c440; --hl-soft:#332c10; --navy:#9db8ee; --navy-soft:#1f2a40;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151c; --card:#1a2029; --ink:#e6e9ef; --muted:#9aa4b5; --line:#2b3340;
  --pen:#ff7a63; --pen-soft:#3a1f1b; --fix:#4fca94; --fix-soft:#16342a;
  --hl:#e3c440; --hl-soft:#332c10; --navy:#9db8ee; --navy-soft:#1f2a40;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font:16px/1.55 var(--f-body);margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
header.top .in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;flex:1;min-width:0}
.brand b{color:var(--pen)}
.stat{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;line-height:1.35;font-variant-numeric:tabular-nums}
.stat b{color:var(--ink)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--pen)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:27px;font-weight:800;letter-spacing:-.015em}
h2{font-size:21px;font-weight:800}
h3{font-size:17px;font-weight:600}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hi{font-size:15px;color:var(--muted);font-weight:500}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;font-weight:600;font-size:15px}
.btn.pri{background:var(--pen);border-color:var(--pen);color:#fff}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.sm{padding:7px 12px;font-size:14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.meter{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--fix);border-radius:6px}
.hero{padding-block:20px 6px}
.hero p{color:var(--muted);margin-top:6px}
/* course */
.unit{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.unit>button.uh{width:100%;background:none;border:0;text-align:left;padding:14px 16px;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.unum{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--navy);background:var(--navy-soft);border-radius:10px;width:44px;height:44px;display:grid;place-items:center}
.unit.done .unum{background:var(--fix-soft);color:var(--fix)}
.uh .t{min-width:0}
.uh .t b{display:block;font-size:17px;font-family:var(--f-display)}
.uh .t span{font-size:13.5px;color:var(--muted)}
.uh .sc{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.ubody{border-top:1px solid var(--line)}
.rl{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;padding:11px 16px;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.rl .n{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rl .tt{font-size:15px;min-width:0}
.rl .ok{font-size:13px;color:var(--fix);font-weight:600}
.rl.next{background:var(--hl-soft)}
.rl.test{grid-template-columns:34px 1fr auto;background:var(--navy-soft);border-bottom:0}
.rl.test .tt b{font-family:var(--f-display)}
/* lesson */
.back{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps span.on{background:var(--pen)}
.rulehead .no{font-family:var(--f-pen);font-size:30px;color:var(--pen);line-height:1;font-weight:700}
.logic p{max-width:65ch}
.logic p+p{margin-top:10px}
.trick{background:var(--hl-soft);border-radius:12px;padding:12px 14px;position:relative}
.trick .lab,.trap .lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:4px}
.trick .lab{color:var(--ink)}
.trick .lab mark{background:var(--hl);color:#1a2230;padding:1px 6px;border-radius:4px}
.trap{border:1px dashed var(--pen);border-radius:12px;padding:12px 14px;background:var(--pen-soft)}
.trap .lab{color:var(--pen)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--paper)}
td:first-child{font-weight:600}
.exlist{display:flex;flex-direction:column;gap:10px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.ex .s{font-size:16px}
.ex .s u{text-decoration:underline dotted var(--pen);text-decoration-thickness:2px;text-underline-offset:4px}
.ex .s s{color:var(--pen);text-decoration-thickness:2px}
.ex .pen{font-family:var(--f-pen);font-size:22px;color:var(--fix);font-weight:700;line-height:1.1;margin-left:6px}
.ex .why{font-size:14px;color:var(--muted);margin-top:4px}
.ex .tap{font-size:12.5px;color:var(--muted);font-family:var(--f-mono);margin-top:6px}
/* questions */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tag{background:var(--navy-soft);color:var(--navy);border-radius:6px;padding:2px 7px}
.qstem{font-size:17px;font-weight:500}
.blank{display:inline-block;min-width:64px;border-bottom:2px solid var(--ink);margin:0 3px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;width:100%}
.opt .k{font-family:var(--f-mono);font-size:13px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--card)}
.opt.sel{border-color:var(--navy);background:var(--navy-soft)}
.opt.ok{border-color:var(--fix);background:var(--fix-soft)}
.opt.ok .k{background:var(--fix);color:#fff;border-color:var(--fix)}
.opt.no{border-color:var(--pen);background:var(--pen-soft)}
.opt.no .k{background:var(--pen);color:#fff;border-color:var(--pen)}
.opt:disabled{cursor:default}
.exp{font-size:15px;border-left:3px solid var(--fix);padding:4px 0 4px 12px}
.exp.bad{border-color:var(--pen)}
.exp b{font-family:var(--f-display)}
.okl{color:var(--fix)} .nol{color:var(--pen)}
/* test */
.timer{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.timer.low{color:var(--pen);border-color:var(--pen)}
.pal{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.pal button{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:6px 0;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.pal button.a{background:var(--navy-soft);border-color:var(--navy);color:var(--navy)}
.pal button.cur{outline:2px solid var(--pen);outline-offset:1px}
.pal button.r{background:var(--fix-soft);border-color:var(--fix);color:var(--fix)}
.pal button.w{background:var(--pen-soft);border-color:var(--pen);color:var(--pen)}
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-family:var(--f-display);font-weight:800;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.g b{color:var(--fix)} .tile.r b{color:var(--pen)}
.block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.confirm{background:var(--pen-soft);border:1px solid var(--pen);border-radius:12px;padding:12px 14px}
.hw li{margin-bottom:8px}
.hw li span{display:block;font-size:14px;color:var(--muted)}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 14px;font:inherit;color:var(--ink)}
details.rv{background:var(--card);border:1px solid var(--line);border-radius:12px}
details.rv summary{list-style:none;padding:11px 14px;display:grid;grid-template-columns:34px 1fr;gap:8px;cursor:pointer}
details.rv summary::-webkit-details-marker{display:none}
details.rv summary .n{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
details.rv .b{padding:0 14px 12px 56px;font-size:15px}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.foot{font-size:13px;color:var(--muted);text-align:center;padding-top:8px}
@media (max-width:420px){.pal{grid-template-columns:repeat(6,1fr)}h1{font-size:24px}}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<script>
const DATA = [{"n":1,"name":"Pronoun","hi":"सर्वनाम","rules":[{"n":1,"title":"My vs mine: possessive adjective vs possessive pronoun","L":["A possessive <b>adjective<\/b> (my, our, your, his, her, its, their) always needs a noun right after it: <i>my book, their offer<\/i>.","A possessive <b>pronoun<\/b> (mine, ours, yours, his, hers, theirs) replaces the whole “adjective + noun”, so no noun comes after it: <i>This book is mine<\/i> (= my book).","When the subject is “You and X”, the possessive is <b>your<\/b>; when it is “You and I” or “He and I”, it is <b>our<\/b>. The first person decides."],"TB":[["Form","I","We","You","He / She / It","They"],["Adjective (noun follows)","my","our","your","his / her / its","their"],["Pronoun (stands alone)","mine","ours","yours","his / hers","theirs"]],"T":["Look right after the word. A noun there → my / your / our / their. Nothing there → mine / yours / ours / theirs. Possessives never take an apostrophe: its, yours, theirs (never your's, their's). <b>It's<\/b> = it is / it has."],"X":[{"s":"I have decided that I won’t work at *yours* company anymore.","f":"your","w":"A noun (company) follows, so the adjective form is needed."},{"s":"*Their* is the best offer you can get.","f":"Theirs","w":"No noun follows; theirs = their offer."},{"s":"I can’t buy this car because *it’s* cost is out of my budget.","f":"its","w":"It’s means “it is”. The possessive is its."},{"s":"You and Rohan should not waste *his* time wandering here and there.","f":"your","w":"You + third person → your."},{"s":"You and I have done *my* best to make her happy.","f":"our","w":"You and I → our."},{"s":"He and I will leave no stone unturned to complete *ours* assignment.","f":"our","w":"A noun (assignment) follows → our."}],"N":[],"Q":[{"k":"e","o":["This laptop is not mine;","it must be your’s","because your name is on it.","No error"],"a":1,"e":"The possessive pronoun is “yours”, without an apostrophe.","r":1},{"k":"f","q":"The decision was ___, not ours, so they must face the consequences.","o":["theirs","their","their’s","them"],"a":0,"e":"No noun follows, so the possessive pronoun “theirs” is needed.","r":1},{"k":"e","o":["The company changed","it’s logo last year","after the merger.","No error"],"a":1,"e":"“It’s” means “it is”. The possessive adjective is “its logo”.","r":1}]},{"n":2,"title":"Reflexive pronoun after certain verbs","L":["Some verbs, in these meanings, must have an object. When the doer does the action to himself, a reflexive pronoun (myself, ourselves, yourself, himself, herself, itself, themselves) fills that object slot.","Verbs to remember: absent, present, adapt, adjust, acquit, exert, apply, hurt, prostrate, submit, resign, reconcile, introduce, avail, amuse, enjoy, satisfy, avenge, pride.","The reflexive must agree with the subject: “The minister and his members absented <b>themselves<\/b>.”"],"TB":[],"T":["Learn them with their prepositions: absent oneself <b>from<\/b>, avail oneself <b>of<\/b>, pride oneself <b>on<\/b>, adapt oneself <b>to<\/b>, resign oneself <b>to<\/b>, apply oneself <b>to<\/b>, reconcile oneself <b>to<\/b>."],"X":[{"s":"He *introduced to* the Chairman as the General Secretary of the party.","f":"introduced himself to","w":"“Introduce” needs an object: whom did he introduce? Himself."},{"s":"He *prostrated* before his master who taught him in school.","f":"prostrated himself","w":"Prostrate is transitive here, so it needs “himself”."},{"s":"The minister and his cabinet members absented *himself* from the meeting.","f":"themselves","w":"Plural subject → themselves."},{"s":"That was our first business-class journey, so we tried to *avail of* all the facilities.","f":"avail ourselves of","w":"From the lecture homework: avail + reflexive + of."}],"N":[],"Q":[{"k":"f","q":"We tried to avail ___ all the facilities of the hotel.","o":["ourselves of","of","us of","ourself of"],"a":0,"e":"“Avail” takes a reflexive object and the preposition “of”.","r":2},{"k":"e","o":["Several students absented","from the class","to watch the match.","No error"],"a":0,"e":"Absent needs a reflexive object: “absented themselves from”.","r":2},{"k":"f","q":"She prides ___ her punctuality.","o":["herself on","on","herself in","her on"],"a":0,"e":"The pattern is “pride oneself on something”.","r":2}]},{"n":3,"title":"Each / Either / Neither + of + plural noun + singular verb","L":["In “Each of the boys”, the real subject is <b>each<\/b>: one boy at a time. “Of the boys” only names the group he is picked from.","So the noun after “of” is plural, but the verb is singular and the pronoun that refers back is singular too (his / her).","Either and neither mean “one of two” and follow the same pattern."],"TB":[],"T":["Each / Either / Neither + <b>of<\/b> + plural noun → singular verb + his/her. The “of” is your signal to go singular."],"X":[{"s":"Each of the boys *have* completed *their* assignment.","f":"has … his","w":"Each → singular verb and singular pronoun."},{"s":"Each of these 5 students *have* worked very hard on this project.","f":"has","w":"Each of → singular verb."},{"s":"They told me that neither of them *were* present when the accident happened.","f":"was","w":"Neither of → singular verb."}],"N":[],"Q":[{"k":"e","o":["Each of the players","have been given","a new kit.","No error"],"a":1,"e":"Each of → singular: “has been given”.","r":3},{"k":"f","q":"Neither of the two answers ___ correct.","o":["is","are","were","have been"],"a":0,"e":"Neither of + plural noun takes a singular verb.","r":3},{"k":"e","o":["Either of these two roads","lead to","the railway station.","No error"],"a":1,"e":"Either of → singular verb: “leads”.","r":3}]},{"n":4,"title":"Out-of-class comparison: “that of” / “those of”","L":["A comparison must be between the same kind of things. “The air of Delhi is more polluted than Mumbai” compares <b>air<\/b> with a <b>city<\/b>. That is wrong.","Repeat the compared noun with <b>that of<\/b> (singular) or <b>those of<\/b> (plural), or use an apostrophe: “than that of Mumbai”, “than Rahul’s”."],"TB":[],"T":["Ask: “What is being compared?” Air ↔ air, speed ↔ speed, salaries ↔ salaries. Singular noun → that of. Plural noun → those of. A person’s name → Rahul’s."],"X":[{"s":"The air of Delhi is more polluted than *Mumbai*.","f":"that of Mumbai","w":"Delhi’s air is compared with Mumbai’s air, so “that of Mumbai” (that = air)."},{"s":"The maximum speed of my car is way more than *yours*.","f":"that of yours","w":"Speed is compared with speed: that of yours = the speed of your car."},{"s":"Rohit’s sense of humour is better than *Rahul*.","f":"Rahul’s","w":"Sense of humour ↔ sense of humour. No need to repeat the noun; the apostrophe does it."}],"N":[],"Q":[{"k":"f","q":"The climate of Shimla is cooler than ___.","o":["that of Patna","Patna","those of Patna","of Patna"],"a":0,"e":"Climate is compared with climate, and “climate” is singular, so “that of Patna”.","r":4},{"k":"e","o":["The salaries of government teachers","are better than","private school teachers.","No error"],"a":2,"e":"Salaries are compared with salaries: “than those of private school teachers”.","r":4},{"k":"e","o":["My handwriting is","much neater than","that of my brother.","No error"],"a":3,"e":"Handwriting is compared with handwriting using “that of”. The sentence is correct.","r":4}]},{"n":5,"title":"Who, whom, which, that, what","L":["<b>Who<\/b> (subject) and <b>whom<\/b> (object) are for people. <b>Which<\/b> is for things, and also for a whole clause. <b>That<\/b> is used for emphasis: after superlatives, only, all, same, the few, none, nothing, and when the antecedent is a person and a thing together. <b>What<\/b> means “the thing which” and has no antecedent before it.","Who or whom? Rewrite the relative clause with he/him. “The girl ___ you had slapped” → you had slapped <b>her<\/b> → whom. “Sahil, ___ just started” → <b>he<\/b> started → who."],"TB":[],"T":["he → who, him → whom. After the same / only / the few / superlative / all → that. No noun before it and it means “the thing which” → what."],"X":[{"s":"The girl *who* you had slapped in the class complained to the principal.","f":"whom","w":"You slapped her → object → whom."},{"s":"Sahil, *whom* just started last week, is already doing good at his new job.","f":"who","w":"He started → subject → who."},{"s":"The car *which / who* is standing in front of my house is my father’s.","f":"which","w":"A car is a thing."},{"s":"You have never questioned any decision of your master, *that* is a proof of your loyalty.","f":"which","w":"The relative refers to the whole previous clause, so “which”."},{"s":"The few people *who* came to my party are my only friends.","f":"that","w":"After “the few” → that."},{"s":"He told me that he saw the same boy *who* killed your dog.","f":"that","w":"After “the same” → that."},{"s":"I cannot predict *that* might happen if you don’t submit your fees on time.","f":"what","w":"No antecedent; “the thing which” → what."},{"s":"You shouldn’t judge a person when you don’t know *that* he has gone through.","f":"what","w":"“The things which he has gone through” → what."}],"N":["In the lecture sentence about Sahil, “doing good” should also be “doing well” (well is the adverb; see Rule 17)."],"Q":[{"k":"f","q":"This is the same pen ___ I lost yesterday.","o":["that","which","who","what"],"a":0,"e":"After “the same”, the relative pronoun is “that”.","r":5},{"k":"f","q":"I don’t know ___ he wants from me.","o":["what","that","which","whom"],"a":0,"e":"There is no antecedent and it means “the thing which”, so “what”.","r":5},{"k":"e","o":["The man whom","came to our house yesterday","is my uncle.","No error"],"a":0,"e":"He came → subject → “who”.","r":5}]},{"n":6,"title":"The relative pronoun takes its verb from its antecedent","L":["Who / which / that have no number of their own. They copy the number of the noun they refer to (the antecedent).","“He is one of <b>those who<\/b> can sacrifice <b>their<\/b> lives.” Who refers to <b>those<\/b> (plural), so the verb and pronoun are plural.","“This is one of the best <b>novels that have<\/b> been written.” That refers to novels, which is plural.","Exception: “the <b>only one<\/b> of the girls <b>that has<\/b> scored…” Here that refers to “the only one”, so it is singular."],"TB":[],"T":["Find the noun just before who/that and match the verb to it. “One of those who” → plural. “The only one of … who” → singular."],"X":[{"s":"He is one of those who can sacrifice *his* life for the country.","f":"their lives","w":"Who → those (plural)."},{"s":"This novel is one of the best novels that *has* been written in the last 10 years.","f":"have","w":"That → novels (plural)."},{"s":"Roshni is the only one of the girls that *have* scored more than 98%.","f":"has","w":"That → the only one (singular)."}],"N":[],"Q":[{"k":"e","o":["She is one of those women","who never loses","patience in a crisis.","No error"],"a":1,"e":"Who refers to “those women” (plural), so “never lose”.","r":6},{"k":"f","q":"He is the only one of the students who ___ cleared the exam.","o":["has","have","were","are"],"a":0,"e":"Who refers to “the only one”, so the verb is singular.","r":6},{"k":"e","o":["This is one of the most interesting books","that has been published","this year.","No error"],"a":1,"e":"That refers to “books” (plural): “that have been published”.","r":6}]},{"n":7,"title":"When the subject is “one”","L":["When the subject is the indefinite pronoun <b>one<\/b>, keep using “one” forms all through the sentence: one’s, oneself. Do not switch to he, his or himself."],"TB":[],"T":["One → one’s → oneself. Never one → his."],"X":[{"s":"One should respect *his* parents.","f":"one’s","w":"The subject is “one”."},{"s":"One should never criticise others if *he* is not sure of *his* facts.","f":"one … one’s","w":"Keep “one” throughout: “if one is not sure of one’s facts”."},{"s":"One should adapt *himself* to changing conditions.","f":"oneself","w":"Reflexive of one → oneself."}],"N":["The printed answer for the second sentence changes only “his”. Change both: “if one is not sure of one’s facts”."],"Q":[{"k":"f","q":"One should always keep ___ promises.","o":["one’s","his","their","ones"],"a":0,"e":"With the subject “one”, the possessive is “one’s”.","r":7},{"k":"e","o":["One must do","his duty","honestly and sincerely.","No error"],"a":1,"e":"Subject “one” → “one’s duty”.","r":7},{"k":"f","q":"One should not overestimate ___.","o":["oneself","himself","themselves","itself"],"a":0,"e":"The reflexive form of “one” is “oneself”.","r":7}]},{"n":8,"title":"All / some / most / half / % / fraction + of + noun → verb follows the noun","L":["Words of quantity (all, some, most, a lot, lots, plenty, half, 20 percent, one-third, two-fifths) do not fix the number themselves. The verb follows the noun after <b>of<\/b>.","Countable plural noun → plural verb: “Some of the students <b>were<\/b> absent.” Uncountable or singular noun → singular verb: “Half of the class <b>has<\/b>…”, “Most of the milk <b>has<\/b>…”"],"TB":[],"T":["Skip the quantity word, read the noun after “of”, and match the verb to it."],"X":[{"s":"Some of the students *was* absent yesterday.","f":"were","w":"Students is plural."},{"s":"Half of the class *have* not completed the assignment.","f":"has","w":"Class is a singular collective noun."},{"s":"All of the chairs *was* in perfect condition.","f":"were","w":"Chairs is plural."}],"N":[],"Q":[{"k":"f","q":"Most of the milk ___ gone sour.","o":["has","have","are","were"],"a":0,"e":"Milk is uncountable, so the verb is singular.","r":8},{"k":"e","o":["Forty percent of the students","has failed","in English this year.","No error"],"a":1,"e":"Students is plural: “have failed”.","r":8},{"k":"f","q":"Two-thirds of the city ___ flooded last night.","o":["was","were","have been","are"],"a":0,"e":"City is singular, so “was”.","r":8}]},{"n":9,"title":"Pronouns in a comparison: subject with subject, object with object","L":["After than / as … as, a verb is usually understood: “You are stronger than <b>he<\/b> (is).” So the pronoun must be in the case it would have in that hidden clause.","“I like you more than <b>him<\/b>” means “than I like him”. “I like you more than <b>he<\/b>” means “than he likes you”. The case changes the meaning."],"TB":[],"T":["Finish the sentence in your head. Than he (is) / than I (am) / as smart as he (is)."],"X":[{"s":"You are stronger than *him*, so you can easily defeat him.","f":"he","w":"Than he is."},{"s":"Their tallest player was shorter than *me*.","f":"I","w":"Than I was."},{"s":"You are as smart as *him*.","f":"he","w":"As he is."}],"N":[],"Q":[{"k":"f","q":"She sings better than ___.","o":["I","me","myself","mine"],"a":0,"e":"Than I (sing).","r":9},{"k":"f","q":"I trust you more than ___ (meaning: than I trust him).","o":["him","he","his","himself"],"a":0,"e":"The hidden clause is “than I trust him”, so the object form.","r":9},{"k":"e","o":["My younger brother","is now as tall","as me.","No error"],"a":2,"e":"As I (am): “as tall as I”.","r":9}]},{"n":10,"title":"Object case after prepositions","L":["Between, with, besides, including, excluding, but (= except), like, unlike, together with, along with, as well as, and not, in addition to, rather than, accompanied by, no less than, nothing but are prepositions or prepositional phrases.","A pronoun after a preposition is its object, so it takes the object form: me, him, her, us, them."],"TB":[],"T":["Between you and <b>me<\/b>. Everyone but <b>him<\/b>. Like <b>her<\/b>. If you can put “to” or “for” there, it is object case."],"X":[{"s":"Between you and *I*, he is not dressed properly for the occasion.","f":"me","w":"Between is a preposition."},{"s":"Everyone but *he* was happy to receive a gift on Christmas.","f":"him","w":"But = except, a preposition."}],"N":[],"Q":[{"k":"f","q":"Everyone went to the fair except ___.","o":["him","he","his","himself"],"a":0,"e":"Except is a preposition, so the object form.","r":10},{"k":"e","o":["Between you and I,","this plan","will not work.","No error"],"a":0,"e":"Between is a preposition: “between you and me”.","r":10},{"k":"e","o":["Unlike his brother,","he","never complains.","No error"],"a":3,"e":"The sentence is correct.","r":10}]}],"test":[{"k":"e","o":["Is this pen yours","or is it","her’s?","No error"],"a":2,"e":"The possessive pronoun is “hers”, without an apostrophe.","r":1},{"k":"f","q":"Ravi and I have finished ___ project on time.","o":["our","ours","my","his"],"a":0,"e":"A noun follows, and “Ravi and I” → our.","r":1},{"k":"e","o":["When the boss arrived,","the clerk presented","before him with the file.","No error"],"a":1,"e":"Present needs a reflexive object here: “presented himself before him”.","r":2},{"k":"f","q":"After the long illness, she slowly reconciled ___ to the new routine.","o":["herself","her","hers","to herself"],"a":0,"e":"Reconcile + reflexive + to.","r":2},{"k":"e","o":["Each of the girls","have brought","her own lunch.","No error"],"a":1,"e":"Each of → singular: “has brought”.","r":3},{"k":"f","q":"Neither of my parents ___ fond of spicy food.","o":["is","are","were","have been"],"a":0,"e":"Neither of → singular.","r":3},{"k":"e","o":["The population of Mumbai","is larger than","Pune.","No error"],"a":2,"e":"Population ↔ population: “than that of Pune”.","r":4},{"k":"f","q":"The roads of this town are wider than ___.","o":["those of Patna","that of Patna","Patna","Patna’s road"],"a":0,"e":"Roads is plural, so “those of”.","r":4},{"k":"f","q":"The boy ___ you praised yesterday is my cousin.","o":["whom","who","which","whose"],"a":0,"e":"You praised him → object → whom.","r":5},{"k":"f","q":"He is the best teacher ___ I have ever met.","o":["that","who","whom","which"],"a":0,"e":"After a superlative, use “that”.","r":5},{"k":"e","o":["I could not understand","that he said","in the meeting.","No error"],"a":1,"e":"There is no antecedent: “what he said”.","r":5},{"k":"f","q":"She left without saying goodbye, ___ hurt us deeply.","o":["which","that","what","who"],"a":0,"e":"The relative refers to the whole clause, so “which”.","r":5},{"k":"e","o":["Ramesh is one of those officers","who has never taken","a bribe.","No error"],"a":1,"e":"Who refers to “those officers”: “who have never taken”.","r":6},{"k":"f","q":"Priya is the only one of my friends who ___ visited me.","o":["has","have","are","were"],"a":0,"e":"The antecedent is “the only one”, so the verb is singular.","r":6},{"k":"e","o":["One should not","lose his temper","over small things.","No error"],"a":1,"e":"Subject “one” → “lose one’s temper”.","r":7},{"k":"f","q":"One must take care of ___ health.","o":["one’s","his","their","our"],"a":0,"e":"Keep “one” throughout.","r":7},{"k":"e","o":["Half of the mangoes","was rotten","when the box arrived.","No error"],"a":1,"e":"Mangoes is plural: “were rotten”.","r":8},{"k":"f","q":"A lot of the work ___ been finished.","o":["has","have","are","were"],"a":0,"e":"Work is uncountable, so the verb is singular.","r":8},{"k":"e","o":["Plenty of water","is available","in the tank.","No error"],"a":3,"e":"Water is uncountable, so the singular verb is correct.","r":8},{"k":"e","o":["Seema can solve","these puzzles faster","than me.","No error"],"a":2,"e":"Than I (can): “faster than I”.","r":9},{"k":"f","q":"He is not as clever as ___.","o":["she","her","hers","herself"],"a":0,"e":"As she (is).","r":9},{"k":"f","q":"I have known you longer than ___ (meaning: than he has known you).","o":["he","him","his","himself"],"a":0,"e":"The hidden clause is “than he has known you”.","r":9},{"k":"e","o":["All the students","including he","went on the trip.","No error"],"a":1,"e":"Including is a preposition: “including him”.","r":10},{"k":"f","q":"There is no secret between ___.","o":["you and me","you and I","I and you","he and I"],"a":0,"e":"Between is a preposition, so the pronoun takes the object form “me”.","r":10},{"k":"e","o":["Nobody but she","knew the answer","to the riddle.","No error"],"a":0,"e":"But = except, a preposition: “nobody but her”.","r":10},{"k":"e","o":["You and Mohan","should finish","his work first.","No error"],"a":2,"e":"You + third person → “your work”.","r":1},{"k":"e","o":["The team adapted","themselves quickly","to the new coach.","No error"],"a":3,"e":"Adapt + reflexive + to. The sentence is correct.","r":2},{"k":"e","o":["Each of the candidates","was asked","to show their admit card.","No error"],"a":2,"e":"Each → singular pronoun: “his or her admit card”.","r":3},{"k":"f","q":"This is one of the finest poems that ___ ever been written.","o":["have","has","is","was"],"a":0,"e":"That refers to “poems” (plural).","r":6},{"k":"e","o":["Nobody in our class","works as hard","as her.","No error"],"a":2,"e":"As she (does): “as hard as she”.","r":9}],"hw":[{"s":"Rahul, unlike his friends, has never missed my class.","e":"From the lecture homework. The verb follows “Rahul” (Rule 51), not “friends”."},{"s":"He told me that he knew the girl who won that race.","e":"“Whom” was wrong: she won → subject → who."},{"s":"Rahul is the most intelligent student that I have ever taught.","e":"After a superlative → that."},{"s":"We tried to avail ourselves of all the facilities.","e":"Avail + reflexive + of."}]},{"n":2,"name":"Adjective","hi":"विशेषण","rules":[{"n":11,"title":"Ordinal before cardinal: “the first five”, not “the five first”","L":["An ordinal (first, second, last, next) picks the position; a cardinal (one, two, five) counts. The ordinal comes first: <b>the first five<\/b> questions, <b>the last two<\/b> men.","“The five first questions” would mean five different questions that are each “first”. That is impossible, since only one thing can be first."],"TB":[],"T":["Position before count: first five, last ten, next three."],"X":[{"s":"He has solved the *five first* questions of the exercise.","f":"first five","w":"Ordinal before cardinal."},{"s":"The policeman checked only the *ten first* trucks in the line.","f":"first ten","w":"Ordinal before cardinal."},{"s":"Fifteen men went into the lion’s den, but only the *two last* survived.","f":"last two","w":"Ordinal before cardinal."}],"N":[],"Q":[{"k":"f","q":"The ___ chapters of the book are the most difficult.","o":["last three","three last","last third","three lasts"],"a":0,"e":"Ordinal (last) comes before cardinal (three).","r":11},{"k":"e","o":["Only the two first","rows of the hall","were reserved for guests.","No error"],"a":0,"e":"Ordinal before cardinal: “the first two rows”.","r":11}]},{"n":12,"title":"Each / either / neither / every + singular noun + singular verb","L":["Without “of”, these words are adjectives and take a <b>singular<\/b> noun: each boy, every cousin, either side.","The subject then is singular, so the verb and the later pronoun are singular too."],"TB":[],"T":["Each / every + singular noun + singular verb. “Every cousin of mine <b>is<\/b> coming.”"],"X":[{"s":"Each boy of this class *were* called by the principal.","f":"was","w":"Each boy → singular."},{"s":"According to the rules, each speaker *were* allowed five minutes.","f":"was","w":"Each speaker → singular."},{"s":"I am going only because every cousin of mine *are* coming.","f":"is","w":"Every cousin → singular."},{"s":"I know that each player of our team *have* tried his best.","f":"has","w":"From the lecture homework."}],"N":[],"Q":[{"k":"f","q":"Every student and every teacher ___ present at the assembly.","o":["was","were","are","have been"],"a":0,"e":"Every … and every … still takes a singular verb.","r":12},{"k":"e","o":["Either side","of the road","are lined with trees.","No error"],"a":2,"e":"Either side → singular: “is lined”.","r":12},{"k":"f","q":"Each window in the building ___ been cleaned.","o":["has","have","were","are"],"a":0,"e":"Each + singular noun → singular verb.","r":12}]},{"n":13,"title":"Some vs any","L":["<b>Some<\/b> is used in positive sentences. <b>Any<\/b> is used in negative sentences and questions.","Exception: in a request or an offer, “some” is used even in a question: “Would you like some tea?”"],"TB":[],"T":["Yes-sentence → some. No / never / question → any. Polite offer → some."],"X":[{"s":"I don’t have *some / any* experience of this field.","f":"any","w":"Negative sentence."},{"s":"She told me she needed *any* time to think about my proposal.","f":"some","w":"Positive sentence."},{"s":"You are all invited, but please don’t bring *some* presents.","f":"any","w":"Negative sentence."}],"N":[],"Q":[{"k":"f","q":"There isn’t ___ milk left in the fridge.","o":["any","some","a few","many"],"a":0,"e":"Negative sentence → any.","r":13},{"k":"e","o":["She has not","made some mistakes","in this essay.","No error"],"a":1,"e":"Negative sentence → “any mistakes”.","r":13},{"k":"f","q":"Would you like ___ more rice?","o":["some","any","a few","many"],"a":0,"e":"An offer takes “some” even in a question; rice is uncountable.","r":13}]},{"n":14,"title":"Adjectives that cannot be compared","L":["Some adjectives are already absolute: something cannot be “more perfect” or “very unique”. Do not use very, more, most or -er/-est with them.","The list: impossible, universal, eternal, chief, ideal, supreme, perfect, unique, excellent, full, empty, entire, dead, free, circular, rectangular, complete, extreme, round, square."],"TB":[],"T":["If the word already means 100%, it cannot go to 110%. Replace “the most unique” with “a unique”."],"X":[{"s":"I can assure you that this school is *most excellent*.","f":"excellent","w":"Excellent cannot be compared."},{"s":"I see it as *the most ideal* place to get married.","f":"an ideal","w":"Ideal cannot be compared."},{"s":"I guess some humans are born with *the most unique* talents.","f":"unique","w":"Unique cannot be compared."},{"s":"The architect said those tiles would look *most excellent* in our house.","f":"excellent","w":"From the lecture homework."}],"N":[],"Q":[{"k":"e","o":["The jar was","completely empty","when I checked it.","No error"],"a":3,"e":"“Completely” is not a degree of comparison; it only emphasises. The sentence is correct.","r":14},{"k":"f","q":"This is ___ solution to the problem.","o":["an ideal","the most ideal","a more ideal","the idealest"],"a":0,"e":"Ideal is an absolute adjective.","r":14},{"k":"e","o":["His answer was","more perfect","than mine.","No error"],"a":1,"e":"Perfect cannot be compared. Rewrite: “His answer was perfect; mine was not.”","r":14}]},{"n":15,"title":"Comparing one member with its own group: “than any other”","L":["If a person is compared with a group he belongs to, take him out of it: “Rohan is taller than <b>all the other<\/b> boys of his class.” Otherwise he is being compared with himself.","The same logic applies to “than any <b>other<\/b>” and “no <b>other<\/b> … as … as”."],"TB":[],"T":["Same group → add <b>other<\/b>. Different group → no “other”: “Mumbai is bigger than any city in Kerala.”"],"X":[{"s":"Rohan is taller than *all the boys* of his class.","f":"all the other boys","w":"Rohan is one of those boys."},{"s":"Rahul is more hardworking than *all the employees* of our company.","f":"all the other employees","w":"Rahul is an employee too."},{"s":"I think *no animal* is as cunning as a fox.","f":"no other animal","w":"A fox is itself an animal."}],"N":[],"Q":[{"k":"f","q":"Mount Everest is higher than ___ peak in the world.","o":["any other","any","all","every"],"a":0,"e":"Everest is itself a peak in the world.","r":15},{"k":"e","o":["Delhi is larger","than any other city","in Nepal.","No error"],"a":1,"e":"Delhi is not in Nepal, so no “other”: “than any city in Nepal”.","r":15},{"k":"f","q":"Sachin was better than ___ batsman of his era.","o":["any other","any","all","each"],"a":0,"e":"Sachin belongs to that group, so “any other”.","r":15}]},{"n":16,"title":"No “more” with -er, no “most” with -est","L":["A comparative (stronger) or superlative (nicest) is already complete. Adding more or most makes a double comparison.","To strengthen a comparative, use <b>much, far, a lot<\/b>. To strengthen a superlative, use <b>by far, much<\/b>."],"TB":[],"T":["More + -er = wrong. Most + -est = wrong. Much stronger / by far the nicest."],"X":[{"s":"He is *more stronger* than Ajay.","f":"much stronger","w":"Double comparative."},{"s":"The younger one is *more prettier* than the older one.","f":"much prettier","w":"Double comparative."},{"s":"He is *the most nicest* person I have ever met.","f":"by far the nicest","w":"Double superlative."},{"s":"He should answer as he is *the most wisest* among us.","f":"the wisest","w":"From the lecture homework."}],"N":[],"Q":[{"k":"f","q":"This road is ___ than the highway.","o":["much narrower","more narrower","most narrow","very narrower"],"a":0,"e":"Strengthen a comparative with “much”.","r":16},{"k":"e","o":["She is by far","the most cleverest girl","in the class.","No error"],"a":1,"e":"Double superlative: “the cleverest”.","r":16}]},{"n":17,"title":"Pairs that are often confused","L":["<b>Later<\/b> (time) vs <b>latter<\/b> (the second of two). <b>Farther<\/b> (distance) vs <b>further<\/b> (more, additional).","<b>Good<\/b> is an adjective, <b>well<\/b> is an adverb (but “I am well” = healthy, an adjective). <b>Bad<\/b> is an adjective, <b>ill<\/b> can be an adverb: “ill-treated”.","<b>Far<\/b> in questions and negatives; <b>a long way<\/b> in positive sentences. <b>Last<\/b> (final) vs <b>latest<\/b> (newest). <b>Next<\/b> (order) vs <b>nearest<\/b> (distance)."],"TB":[],"T":["Latter = दो में से बाद वाला. Farther = दूरी. Further = और आगे / अतिरिक्त."],"X":[{"s":"Of these two cuisines, I would love to have the *later* one.","f":"latter","w":"Second of two."},{"s":"Let’s postpone this meeting to a *latter* date.","f":"later","w":"Time."},{"s":"I wanted to discuss that topic *farther*.","f":"further","w":"More discussion, not distance."},{"s":"My college is located *further* than hers.","f":"farther","w":"Distance."},{"s":"This new restaurant serves *well* Indian food.","f":"good","w":"Describes a noun (food)."},{"s":"I prepared a lot, but the meeting didn’t go *good*.","f":"well","w":"Describes a verb (go)."},{"s":"He was grossly *bad* treated by you.","f":"ill","w":"Adverb before a participle."},{"s":"He is not an *ill* person.","f":"bad","w":"Adjective before a noun."},{"s":"How *far / a long way* is the library from your house?","f":"far","w":"Question."},{"s":"He is good at shooting the ball into the net from *far*.","f":"a long way","w":"Positive sentence."}],"N":[],"Q":[{"k":"f","q":"Have you read the ___ issue of the magazine? It came out yesterday.","o":["latest","last","latter","later"],"a":0,"e":"Newest → latest.","r":17},{"k":"f","q":"For ___ details, contact the office.","o":["further","farther","farthest","furthest"],"a":0,"e":"Additional information → further.","r":17},{"k":"e","o":["She speaks English","very good","for a beginner.","No error"],"a":1,"e":"The word describes the verb “speaks”, so the adverb “well”.","r":17}]},{"n":18,"title":"-ing adjective vs -ed adjective (present vs past participle)","L":["The <b>-ing<\/b> form describes the thing that causes the feeling: a confusing question, an interesting novel, a horrifying man (डरावना).","The <b>-ed / V3<\/b> form describes the one who feels it, or something that has undergone the action: a confused student, a horrified man (डरा हुआ), a lost book."],"TB":[],"T":["-ing = gives the feeling. -ed = gets the feeling (or has undergone the action)."],"X":[{"s":"He solved that *confused* question very easily.","f":"confusing","w":"The question causes confusion."},{"s":"He gifted his girlfriend a very *interested* novel.","f":"interesting","w":"The novel causes interest."},{"s":"I could not find my *losing* book.","f":"lost","w":"The book has been lost."}],"N":[],"Q":[{"k":"f","q":"The film was so ___ that half the audience fell asleep.","o":["boring","bored","bore","bores"],"a":0,"e":"The film causes boredom.","r":18},{"k":"e","o":["The tired workers","sat down","after an exhausted day.","No error"],"a":2,"e":"The day causes the tiredness: “an exhausting day”.","r":18},{"k":"f","q":"The ___ passengers were rescued by the navy.","o":["stranded","stranding","strand","strands"],"a":0,"e":"The passengers have undergone the action.","r":18}]},{"n":19,"title":"Little, a little, the little; few, a few, the few","L":["<b>Little / few<\/b> = hardly any (negative sense). <b>A little / a few<\/b> = some (positive sense). <b>The little / the few<\/b> = all of the small amount that exists.","Little and its forms go with uncountable nouns (money, sugar, sleep). Few and its forms go with countable plurals (days, students)."],"TB":[],"T":["“Very little”, never “very a little”. “The few” / “the little” always has a “that / which / who” idea: all that there was."],"X":[{"s":"Could you give me *___* sugar?","f":"a little","w":"Positive request for some."},{"s":"I offered him *a little* money that I had with me.","f":"the little","w":"All the small amount I had."},{"s":"I got very *a little* sleep last night.","f":"very little","w":"Negative sense; very + little."},{"s":"The doctor advised him to rest for *the few* days.","f":"a few","w":"Positive sense, some days."},{"s":"The school cancelled the debate as *a few* students participated.","f":"few","w":"Negative sense, hardly any."},{"s":"*A few* pastries that I had kept for you were finished by him.","f":"The few","w":"From the lecture homework: all the pastries I had kept."}],"N":[],"Q":[{"k":"f","q":"There is ___ hope of his recovery; the doctors have given up.","o":["little","a little","the little","few"],"a":0,"e":"Negative sense with an uncountable noun.","r":19},{"k":"f","q":"___ friends he had deserted him in his bad days.","o":["The few","A few","Few","Little"],"a":0,"e":"All of the small number he had → the few.","r":19},{"k":"e","o":["I have","a few money left,","so I can buy a snack.","No error"],"a":1,"e":"Money is uncountable: “a little money”.","r":19}]},{"n":20,"title":"Choose the right degree from the meaning","L":["Comparing two → comparative (better, stronger, wiser). Comparing three or more → superlative (best, smallest).","When two adjectives are joined by “and” in a comparison, both must be in the same degree: “stronger and <b>wiser<\/b> than”."],"TB":[],"T":["Count what is compared: two → -er, more than two → -est. Check every adjective joined by “and”."],"X":[{"s":"Rahul is stronger and *wise* than Mahesh.","f":"wiser","w":"Both adjectives must be comparative."},{"s":"We bought dresses from the same store, but mine is *best* than hers.","f":"better","w":"Two things → comparative."},{"s":"I got the *smaller* one of all the options available.","f":"smallest","w":"More than two → superlative."}],"N":[],"Q":[{"k":"f","q":"Of the two sisters, Meera is the ___.","o":["taller","tallest","most tall","more taller"],"a":0,"e":"Two people → comparative.","r":20},{"k":"e","o":["This is the","more beautiful place","I have ever visited.","No error"],"a":1,"e":"Compared with every place → superlative: “the most beautiful place”.","r":20},{"k":"f","q":"She is cleverer and ___ than her brother.","o":["more hardworking","hardworking","most hardworking","hardworkinger"],"a":0,"e":"Both adjectives joined by “and” must be comparative.","r":20}]}],"test":[{"k":"e","o":["The first two chapters","and the three last ones","are very important.","No error"],"a":1,"e":"Ordinal before cardinal: “the last three”.","r":11},{"k":"f","q":"Answer the ___ questions only.","o":["first four","four first","first fourth","fourth first"],"a":0,"e":"Ordinal before cardinal.","r":11},{"k":"e","o":["Every boy and girl","were given","a certificate.","No error"],"a":1,"e":"Every → singular: “was given”.","r":12},{"k":"f","q":"Neither candidate ___ able to answer the question.","o":["was","were","are","have been"],"a":0,"e":"Neither + singular noun → singular verb.","r":12},{"k":"e","o":["Each of the rooms","has","an attached bathroom.","No error"],"a":3,"e":"Each of + plural noun + singular verb. Correct.","r":12},{"k":"f","q":"I looked everywhere, but I could not find ___ trace of him.","o":["any","some","a little","few"],"a":0,"e":"Negative sentence → any.","r":13},{"k":"f","q":"Can I have ___ water, please?","o":["some","any","few","a few"],"a":0,"e":"A request takes “some”.","r":13},{"k":"e","o":["The minister called","a meeting of his","most chief advisers.","No error"],"a":2,"e":"Chief is absolute: “his chief advisers”.","r":14},{"k":"f","q":"This is ___ opportunity, so don’t miss it.","o":["a unique","the most unique","a very unique","a more unique"],"a":0,"e":"Unique is absolute and takes no very / more / most.","r":14},{"k":"e","o":["Kalidas was greater","than any poet","of ancient India.","No error"],"a":1,"e":"Kalidas was a poet of ancient India: “than any other poet”.","r":15},{"k":"f","q":"Gold is more precious than ___ metal.","o":["any other","any","all","every"],"a":0,"e":"Gold is itself a metal.","r":15},{"k":"e","o":["Lucknow is bigger","than any town","in Goa.","No error"],"a":3,"e":"Lucknow is not in Goa, so “any town” is correct.","r":15},{"k":"e","o":["Of all the students,","she is the most brightest","in mathematics.","No error"],"a":1,"e":"Double superlative: “the brightest”.","r":16},{"k":"f","q":"This problem is ___ than the last one.","o":["far easier","more easier","most easy","very easier"],"a":0,"e":"Strengthen a comparative with “far”.","r":16},{"k":"e","o":["I prefer tea and coffee,","but the later","is my favourite.","No error"],"a":1,"e":"The second of two: “the latter”.","r":17},{"k":"f","q":"He runs ___ enough to win the race.","o":["well","good","nice","better than"],"a":0,"e":"Describes the verb “runs” → adverb.","r":17},{"k":"f","q":"The station is ___ from here, so let’s take a cab.","o":["a long way","far","farther","further"],"a":0,"e":"Positive sentence → a long way.","r":17},{"k":"e","o":["She could not walk","any farther","without resting.","No error"],"a":3,"e":"Farther refers to physical distance. Correct.","r":17},{"k":"e","o":["The news was","really shocked","for the whole family.","No error"],"a":1,"e":"The news causes the shock: “really shocking”.","r":18},{"k":"f","q":"She was ___ by the loud noise.","o":["frightened","frightening","fright","frighten"],"a":0,"e":"She receives the feeling.","r":18},{"k":"f","q":"We need to repair the ___ window.","o":["broken","breaking","broke","break"],"a":0,"e":"The window has undergone the action.","r":18},{"k":"e","o":["He has little friends,","so he often","feels lonely.","No error"],"a":0,"e":"Friends is countable: “few friends”.","r":19},{"k":"f","q":"She spent ___ money she had on books.","o":["the little","a little","little","few"],"a":0,"e":"All of the small amount she had.","r":19},{"k":"f","q":"I have ___ doubts; could you explain once more?","o":["a few","few","a little","little"],"a":0,"e":"Some doubts, countable → a few.","r":19},{"k":"e","o":["Very a few people","attended the meeting","on Sunday.","No error"],"a":0,"e":"“Very few” (no “a” after very).","r":19},{"k":"e","o":["Of the two proposals,","the first is","the best.","No error"],"a":2,"e":"Two things → comparative: “the better”.","r":20},{"k":"f","q":"Ravi is the ___ of all the boys in the team.","o":["tallest","taller","most tall","tall"],"a":0,"e":"More than two → superlative.","r":20},{"k":"e","o":["He is richer","and generous","than his cousin.","No error"],"a":1,"e":"Both adjectives must be comparative: “and more generous”.","r":20},{"k":"e","o":["I did not","get some help","from anyone.","No error"],"a":1,"e":"Negative sentence → “any help”.","r":13},{"k":"e","o":["The exhausted players","were given water","during the break.","No error"],"a":3,"e":"The players feel the tiredness → exhausted. Correct.","r":18}],"hw":[{"s":"I think Rahul should answer this question as he is the wisest among us.","e":"“Most wisest” was a double superlative."},{"s":"The architect said that those tiles would look excellent in our house.","e":"“Excellent” cannot take “most”."},{"s":"I know that each player of our team has tried his best to win the match.","e":"Each + singular noun → singular verb."},{"s":"The few pastries that I had kept for you after the party were finished by him.","e":"All the pastries that I had kept → the few."}]},{"n":3,"name":"Verb and modals","hi":"क्रिया","rules":[{"n":21,"title":"Fall / fell, rise / raise, lie / lay","L":["Each pair has one verb that happens by itself (intransitive, no object) and one that you do to something (transitive, takes an object)."],"TB":[["Verb","V2","V3","Meaning"],["fall","fell","fallen","गिरना (no object)"],["fell","felled","felled","गिराना, e.g. fell a tree"],["rise","rose","risen","उठना / बढ़ना (no object)"],["raise","raised","raised","उठाना / बढ़ाना / पालना"],["lie","lay","lain","लेटना / पड़े होना (no object)"],["lay","laid","laid","लिटाना / रखना"]],"T":["Is there an object right after the verb? Yes → fell, raise, lay. No → fall, rise, lie. Watch out: “lay” is also the V2 of “lie”."],"X":[{"s":"I knew I had sprained my ankle the moment I *felled*.","f":"fell","w":"No object; past of fall."},{"s":"Your favourite vase *felled* off the table.","f":"fell","w":"The vase fell by itself."},{"s":"Yash *has raised* as one of the top athletes in the state.","f":"has risen","w":"No object."},{"s":"It’s crucial *to rise* awareness about global warming.","f":"to raise","w":"Object: awareness."},{"s":"I felt sick, so I *laid* on a bench nearby.","f":"lay","w":"Past of lie (no object)."},{"s":"She *had lain* the bag down before she left.","f":"had laid","w":"Object: the bag."},{"s":"Somehow she managed to *rise* her hand and call for help.","f":"raise","w":"From the lecture homework: object “her hand”."}],"N":[],"Q":[{"k":"f","q":"The sun ___ in the east.","o":["rises","raises","rose up","raised"],"a":0,"e":"No object → rise.","r":21},{"k":"e","o":["The woodcutter fell","three old trees","before noon.","No error"],"a":0,"e":"“Fell a tree” takes an object; its past is “felled”.","r":21},{"k":"f","q":"He has ___ in bed all day because of fever.","o":["lain","laid","lay","lied"],"a":0,"e":"Lie (no object) → V3 lain.","r":21}]},{"n":22,"title":"Verbs with the same V1, V2 and V3","L":["Some verbs never add -ed: wed, cost, set, bet, bid, thrust, hit, cut, slit, spread, read, burst, quit, shut, shed, cast, rid, telecast, broadcast, overcast, forecast, put, let, hurt."],"TB":[],"T":["Hit-hit-hit, shut-shut-shut. “Shutted”, “hitted”, “broadcasted” are errors in SSC."],"X":[{"s":"After getting scolded, he *shutted* the door.","f":"shut","w":"Same V1/V2/V3."},{"s":"The concert will be *broadcasted* live on radio.","f":"broadcast","w":"Same V1/V2/V3."},{"s":"He *hitted* the ball so hard that it went out of the stadium.","f":"hit","w":"From the lecture homework."}],"N":[],"Q":[{"k":"f","q":"The price of onions has ___ us a lot this year.","o":["cost","costed","costs","costing"],"a":0,"e":"Cost-cost-cost.","r":22},{"k":"e","o":["The bomb bursted","in the crowded market,","injuring many.","No error"],"a":0,"e":"Burst-burst-burst: “The bomb burst”.","r":22},{"k":"f","q":"The match was ___ live on television.","o":["telecast","telecasted","telecasting","telecasts"],"a":0,"e":"Telecast-telecast-telecast.","r":22}]},{"n":23,"title":"V3 used as a verb vs special adjective forms","L":["Some verbs have a separate adjective form. When you need the verb (with has / had / was), use the normal V3. Use the special form only as an adjective before a noun."],"TB":[["Verb (V3)","Adjective form"],["melted","molten (molten gold)"],["proved","proven (a proven fact)"],["sunk","sunken (a sunken ship)"],["shrunk","shrunken (a shrunken shirt)"],["struck","stricken (a grief-stricken family)"],["shaved","shaven (a clean-shaven face)"],["drunk","drunken (a drunken driver)"],["loaded","laden (a laden truck)"]],"T":["After has / have / had / was, use the verb form: has melted, could not be proved. Before a noun, use the adjective: molten lava, sunken ship."],"X":[{"s":"He has already *molten* some gold for your necklace.","f":"melted","w":"A verb is needed after “has”."},{"s":"The charges against him could not be *proven* in court.","f":"proved","w":"Passive verb after “be”."}],"N":[],"Q":[{"k":"f","q":"The ship ___ near the coast in 1912.","o":["sank","sunken","sinked","sunked"],"a":0,"e":"A past-tense verb is needed; sunken is only an adjective.","r":23},{"k":"e","o":["The volcano poured out","streams of melted lava","for days.","No error"],"a":1,"e":"Before a noun, the adjective form is “molten lava”.","r":23},{"k":"f","q":"A ___ driver caused the accident last night.","o":["drunken","drunk","drinking","drank"],"a":0,"e":"Before a noun, the adjective form “drunken” is used.","r":23}]},{"n":24,"title":"Stative verbs have no -ing form","L":["Stative verbs describe a state (thinking, owning, feeling, senses, liking), not an action. So they are not used in continuous tenses.","The list: think, believe, consider, have, own, possess, look, seem, appear, consist, contain, comprise, feel, smell, taste, sound, know, resemble, like, love, want, agree, hate, forgive, forget, remember, depend, exist.","When the same verb means an action, -ing is fine: “I am <b>having<\/b> lunch” (eating), “She is <b>tasting<\/b> the soup” (testing it)."],"TB":[],"T":["State → simple tense (I remember, he resembles, I have known). Action meaning → -ing allowed."],"X":[{"s":"I *am vaguely remembering* that I met him at a concert.","f":"vaguely remember","w":"State of memory."},{"s":"He *is strongly resembling* his brother.","f":"strongly resembles","w":"State of likeness."},{"s":"I *have been knowing* Mr Verma for the last 5 years.","f":"have known","w":"From the lecture homework."}],"N":[],"Q":[{"k":"f","q":"This box ___ old letters and photographs.","o":["contains","is containing","are containing","has been containing"],"a":0,"e":"Contain is stative.","r":24},{"k":"e","o":["I am not understanding","what you are trying","to say.","No error"],"a":0,"e":"Understand is stative: “I do not understand”.","r":24},{"k":"e","o":["The chef is tasting","the soup to check","the salt.","No error"],"a":3,"e":"Here “tasting” is an action (testing), so -ing is correct.","r":24}]},{"n":25,"title":"No “as” after make, choose, elect, appoint, call, consider…","L":["With make, choose, elect, select, anoint, appoint, name, call, think and consider, the complement follows the object directly: “They elected him <b>captain<\/b>.”"],"TB":[],"T":["Consider him a friend. Appoint her principal. Adding “as” is the error. (Regard, treat, describe and see do take “as”.)"],"X":[{"s":"I consider him *as* one of my closest friends.","f":"(remove as)","w":"Consider + object + complement."},{"s":"The team decided to make him *as* captain.","f":"(remove as)","w":"Make + object + complement."}],"N":[],"Q":[{"k":"f","q":"The committee appointed her ___ of the project.","o":["the head","as the head","to the head","for the head"],"a":0,"e":"Appoint + object + complement, without “as”.","r":25},{"k":"e","o":["We all regard him","as the best teacher","in the school.","No error"],"a":3,"e":"Regard takes “as”. Correct.","r":25},{"k":"e","o":["They named","their son as","Arjun.","No error"],"a":1,"e":"Name + object + complement: “named their son Arjun”.","r":25}]},{"n":26,"title":"Active or passive? Doer or receiver","L":["If the subject <b>does<\/b> the action → active. If the subject <b>receives<\/b> it → passive: be + V3.","Check tense too: “was treating” (past continuous active) → “was being treated” (past continuous passive)."],"TB":[],"T":["Ask: can the subject do this? A car cannot steal; it is stolen. Children can tease; they are teasing."],"X":[{"s":"My car *stole / was stolen* by somebody.","f":"was stolen","w":"The car receives the action."},{"s":"Somebody *stole / was stolen* my car.","f":"stole","w":"Somebody is the doer."},{"s":"The wounded woman *was treating* by the doctor.","f":"was being treated","w":"The woman receives the treatment."},{"s":"Some children *were being teased* the animals.","f":"were teasing","w":"The children are the doers."}],"N":[],"Q":[{"k":"f","q":"The new bridge ___ next year.","o":["will be opened","will open","will be opening","opens by"],"a":0,"e":"The bridge receives the action.","r":26},{"k":"e","o":["English is spoken","in many countries","all over the world.","No error"],"a":3,"e":"English receives the action. Correct passive.","r":26},{"k":"e","o":["The thief caught","by the police","near the station.","No error"],"a":0,"e":"The thief receives the action: “was caught”.","r":26}]},{"n":27,"title":"Used to / be used to / be used + infinitive","L":["<b>Used to + V1<\/b> = a past habit that has ended: “I used to play cricket.”","<b>Be / get / become used to + V-ing<\/b> = accustomed to (आदत होना): “I am used to working at night.” Here “to” is a preposition.","<b>Be used + to-infinitive<\/b> = passive of “use” (इस्तेमाल किया जाना): “The car was used to carry drugs.”"],"TB":[],"T":["Habit that ended → used to play. Accustomed → am used to playing. Was utilised → was used to carry."],"X":[{"s":"When I was a child, I used to *playing* cricket with my father.","f":"play","w":"Past habit → used to + V1."},{"s":"I worked at a call centre for 7 years, so I am used to *work* night shifts.","f":"working","w":"Accustomed → used to + V-ing."},{"s":"The stolen car was used to *carrying* illegal drugs.","f":"carry","w":"Passive of use → to + V1."},{"s":"In America he became used to *drive* on the right.","f":"driving","w":"From the lecture homework."}],"N":[],"Q":[{"k":"f","q":"My grandfather ___ walk five kilometres every morning.","o":["used to","was used to","is used to","use to"],"a":0,"e":"A past habit → used to + V1.","r":27},{"k":"e","o":["She is used to","wake up early","because of her job.","No error"],"a":1,"e":"Accustomed → used to + V-ing: “waking up”.","r":27},{"k":"f","q":"This knife is used to ___ vegetables.","o":["cut","cutting","cuts","being cut"],"a":0,"e":"Passive of use → to + V1.","r":27}]},{"n":28,"title":"Need and dare","L":["As modals (mostly in negatives and questions) they take a bare V1 and no “to”: “You <b>need not worry<\/b>”, “How <b>dare you say<\/b> that?”","As main verbs they behave like ordinary verbs with “to”: “You <b>do not need to pay<\/b>”, “He <b>needs to<\/b> rest.”"],"TB":[],"T":["need not + V1 / dare not + V1 / How dare you + V1. With do / does / did, use “need to”."],"X":[{"s":"You need not *to worry* about this mole.","f":"worry","w":"Modal need → bare V1."},{"s":"How dare you *to say* these words to my father?","f":"say","w":"Modal dare → bare V1."},{"s":"You *do not need pay* anything.","f":"do not need to pay / need not pay","w":"Main verb need takes “to”."}],"N":[],"Q":[{"k":"f","q":"You ___ come to office tomorrow; it is a holiday.","o":["need not","need not to","do not need","not need"],"a":0,"e":"Modal need → need not + V1.","r":28},{"k":"e","o":["He dared not","to speak","in front of the manager.","No error"],"a":1,"e":"Modal dare → bare infinitive: “dared not speak”.","r":28},{"k":"f","q":"She ___ to finish the report by Monday.","o":["needs","need","needn’t","need not"],"a":0,"e":"A positive sentence with “to” uses need as a main verb: needs to.","r":28}]},{"n":29,"title":"Can, may, could, might","L":["<b>Can<\/b>: ability, informal request, negative possibility (It can’t be true). <b>May<\/b>: polite permission or request, and possibility.","<b>Could<\/b>: polite request, remote possibility, past of can. <b>Might<\/b>: weaker possibility, and past of may in reported speech."],"TB":[],"T":["Ability → can. Asking permission politely → may I. Asking someone to do something politely → could you. Reported past → might."],"X":[{"s":"Let Shruti handle clients as she *may* speak several languages.","f":"can","w":"Ability."},{"s":"I forgot my phone; *will* I use yours to call home?","f":"may","w":"Asking permission."},{"s":"*May* you come with me to the clinic?","f":"Could","w":"Requesting someone to act."},{"s":"He told me that he *may* join Aman’s batch.","f":"might","w":"Past reporting verb → might."}],"N":[],"Q":[{"k":"f","q":"___ I come in, sir?","o":["May","Can","Might to","Will"],"a":0,"e":"A polite request for permission.","r":29},{"k":"e","o":["She said that","she may be late","for the meeting.","No error"],"a":1,"e":"Past reporting verb → “she might be late”.","r":29},{"k":"f","q":"He is only three, but he ___ read simple words.","o":["can","may","might","must"],"a":0,"e":"Ability → can.","r":29}]},{"n":30,"title":"Would, should, ought to, must","L":["<b>Would<\/b>: polite request, past habit, past of will. <b>Should<\/b>: general advice. <b>Ought to<\/b>: moral duty or advice.","<b>Must<\/b>: strong obligation, or a very strong likelihood (He must be tired)."],"TB":[],"T":["Duty to country, parents, the poor → ought to. Health or study advice → should. A rule → must."],"X":[{"s":"When I was a child, I *would* hide under the bed to scare my parents.","f":"(no error)","w":"Past habit → would."},{"s":"If you earn a decent income, you *dare* help the poor.","f":"ought to / should","w":"Moral duty."},{"s":"If you want to lose weight, you *may* stop eating fast food.","f":"should","w":"Advice."},{"s":"I feel that one *could* love one’s country.","f":"ought to / should","w":"Moral duty."}],"N":[],"Q":[{"k":"f","q":"We ___ respect our elders.","o":["ought to","would","might","dare"],"a":0,"e":"A moral duty → ought to.","r":30},{"k":"e","o":["You must","wear a helmet","while riding a bike.","No error"],"a":3,"e":"A rule or obligation → must. Correct.","r":30},{"k":"f","q":"___ you please pass the salt?","o":["Would","Should","Must","Ought"],"a":0,"e":"A polite request → would.","r":30}]}],"test":[{"k":"e","o":["The price of petrol","has raised sharply","in the last two months.","No error"],"a":1,"e":"No object: “has risen”.","r":21},{"k":"f","q":"The workers ___ the injured man gently on the stretcher.","o":["laid","lay","lied","lain"],"a":0,"e":"Object (the man) → lay → past laid.","r":21},{"k":"e","o":["The old tree","fell during","the storm last night.","No error"],"a":3,"e":"The tree fell by itself. Correct.","r":21},{"k":"f","q":"The government has ___ the tax on luxury cars.","o":["raised","risen","rose","rised"],"a":0,"e":"Object (the tax) → raise.","r":21},{"k":"e","o":["She quitted her job","last year to start","her own business.","No error"],"a":0,"e":"Quit-quit-quit: “She quit her job”.","r":22},{"k":"f","q":"The results of the exam were ___ on the website yesterday.","o":["put","putted","puts","putting"],"a":0,"e":"Put-put-put.","r":22},{"k":"e","o":["The news spreaded","quickly through","the village.","No error"],"a":0,"e":"Spread-spread-spread: “The news spread”.","r":22},{"k":"e","o":["The cloth has","shrunken after","the first wash.","No error"],"a":1,"e":"A verb is needed after “has”: “has shrunk”.","r":23},{"k":"f","q":"Divers found the ___ treasure near the island.","o":["sunken","sunk","sinking","sank"],"a":0,"e":"Before a noun, the adjective form “sunken” is used.","r":23},{"k":"e","o":["This book is belonging","to my elder brother,","not to me.","No error"],"a":0,"e":"Belong is stative: “This book belongs”.","r":24},{"k":"f","q":"I ___ what you mean now.","o":["see","am seeing","have been seeing","was seeing"],"a":0,"e":"See (understand) is stative.","r":24},{"k":"e","o":["We are having","dinner at a new restaurant","tonight.","No error"],"a":3,"e":"“Having dinner” means eating, an action. Correct.","r":24},{"k":"e","o":["The people elected","him as their leader","by a huge margin.","No error"],"a":1,"e":"Elect + object + complement: “elected him their leader”.","r":25},{"k":"f","q":"Everyone considered her ___ in the office.","o":["the best worker","as the best worker","to the best worker","like the best worker"],"a":0,"e":"Consider + object + complement.","r":25},{"k":"e","o":["The letter wrote","by my grandfather","is still with me.","No error"],"a":0,"e":"The letter receives the action: “The letter written”.","r":26},{"k":"f","q":"The patient ___ to the ICU when I reached the hospital.","o":["was being taken","was taking","had taking","is taking"],"a":0,"e":"The patient receives the action, and it was in progress.","r":26},{"k":"e","o":["The police","arrested the thief","within an hour.","No error"],"a":3,"e":"The police are the doers. Correct.","r":26},{"k":"f","q":"She has lived in Shimla for years, so she is used to ___ in the cold.","o":["living","live","lived","be living"],"a":0,"e":"Accustomed → used to + V-ing.","r":27},{"k":"e","o":["I use to","go for a walk","every evening in my school days.","No error"],"a":0,"e":"Past habit → “I used to go”.","r":27},{"k":"f","q":"Earlier, mobile phones ___ used only for calls.","o":["were","used","use to","are"],"a":0,"e":"Passive: “were used for calls”.","r":27},{"k":"e","o":["You need not","to apologise;","it wasn’t your fault.","No error"],"a":1,"e":"Modal need → bare V1: “need not apologise”.","r":28},{"k":"f","q":"How dare he ___ my diary!","o":["read","to read","reading","reads"],"a":0,"e":"Modal dare → bare V1.","r":28},{"k":"e","o":["Does he need","buy a new laptop","for the course?","No error"],"a":1,"e":"With does, need is a main verb: “need to buy”.","r":28},{"k":"e","o":["May you lend","me your notes","for a day?","No error"],"a":0,"e":"“May” asks permission for yourself. To ask someone else to act, use “Could you lend”.","r":29},{"k":"f","q":"It is cloudy; it ___ rain in the evening.","o":["may","can","must to","would to"],"a":0,"e":"Possibility → may.","r":29},{"k":"f","q":"He said that he ___ visit us next week.","o":["might","may","can","will"],"a":0,"e":"Past reporting verb → might.","r":29},{"k":"e","o":["Every citizen","ought vote","in the elections.","No error"],"a":1,"e":"Ought is followed by “to”: “ought to vote”.","r":30},{"k":"f","q":"In our childhood we ___ play in the fields till sunset.","o":["would","should","must","ought to"],"a":0,"e":"A past habit → would.","r":30},{"k":"f","q":"You look pale; you ___ see a doctor.","o":["should","would","may","dare"],"a":0,"e":"Advice → should.","r":30},{"k":"e","o":["The accused","was proved guilty","by the court.","No error"],"a":3,"e":"After “was”, the verb form “proved” is correct.","r":23}],"hw":[{"s":"Somehow she managed to raise her hand and call for help.","e":"Object (her hand) → raise."},{"s":"He hit the ball so hard that it went out of the stadium.","e":"Hit-hit-hit."},{"s":"I have known Mr Verma for the last 5 years.","e":"Know is stative."},{"s":"When he shifted to America, he became used to driving on the right side of the road.","e":"Accustomed → used to + V-ing."}]},{"n":4,"name":"Noun","hi":"संज्ञा","rules":[{"n":31,"title":"Uncountable nouns: no a / an / one / many / -s","L":["These nouns are treated as a mass or an idea, so they cannot be counted. Do not use a, an, one, two, these, those, many or a plural -s/-es with them. The verb stays singular.","Material-type: bread, soap, shampoo, sand, iron, paper, hair, brick, food, grass, garbage, filth.","Abstract-type: scenery, machinery, jewellery, cutlery, crockery, stationery, luggage, baggage, money, evidence, equipment, furniture, advice, work, music, information, knowledge, wealth. Others: business, research, abuse, percentage, alphabet."],"TB":[],"T":["To count them, add a unit: a piece of advice, an item of furniture, a cake of soap, a loaf of bread, a lot of luggage."],"X":[{"s":"Our NGO helps people who collect *garbages* for a living.","f":"garbage","w":"Uncountable."},{"s":"Her house survived because it was made of the best quality *bricks*.","f":"brick","w":"The lecture lists brick as a material noun."},{"s":"The scientists had all the *equipments* they needed.","f":"equipment","w":"Uncountable."},{"s":"Tourists visit Kashmir to see the beautiful *sceneries*.","f":"scenery","w":"Uncountable."},{"s":"Go to a nearby store and bring *a soap*.","f":"a cake of soap","w":"From the lecture homework."}],"N":["In everyday English “bricks” is also common. In SSC questions, follow the lecture list and treat brick as a material (uncountable)."],"Q":[{"k":"f","q":"She gave me a very useful ___.","o":["piece of advice","advice","advices","advise"],"a":0,"e":"Advice is uncountable; count it with “a piece of”.","r":31},{"k":"e","o":["All the furnitures","in this room","are made of teak.","No error"],"a":0,"e":"Furniture is uncountable: “All the furniture … is made”.","r":31},{"k":"f","q":"How much ___ do you have for this trip?","o":["luggage","luggages","the luggages","a luggage"],"a":0,"e":"Luggage is uncountable.","r":31}]},{"n":32,"title":"Nouns that look plural but are singular","L":["These end in -s but name one subject, game, disease or thing, so they take a singular verb.","Subjects: physics, mathematics, economics, politics. Games: billiards, darts, athletics, dominoes. Diseases: rickets, measles, mumps, diabetes, rabies, shingles. Others: innings, news, summons."],"TB":[],"T":["Name of a subject, game or disease + singular verb. “The news <b>is<\/b> good.” “A summons <b>was<\/b> issued.”"],"X":[{"s":"Mathematics *are* one of the subjects I have found very difficult.","f":"is","w":"Subject name → singular."},{"s":"Darts *are* a form of throwing game.","f":"is","w":"Game name → singular."},{"s":"The news of her promotion *were* the reason for her smile.","f":"was","w":"News → singular."},{"s":"Rickets *cause* problems in the calcification of bones.","f":"causes","w":"Disease name → singular."},{"s":"Even after receiving many *summons*, he didn’t appear in court.","f":"summonses","w":"From the lecture homework: summons is singular, its plural is summonses."}],"N":[],"Q":[{"k":"f","q":"Measles ___ a highly infectious disease.","o":["is","are","were","have been"],"a":0,"e":"Disease name → singular.","r":32},{"k":"e","o":["Economics are","my favourite subject","in college.","No error"],"a":0,"e":"Subject name → singular: “Economics is”.","r":32}]},{"n":33,"title":"Nouns that are always plural","L":["These nouns are always plural and take a plural verb.","Pairs: scissors, tongs, pliers, pincers, bellows, trousers, pants, pyjamas, shorts, spectacles, glasses, binoculars, scales, fetters, shackles.","Also: compliments, thanks, congratulations, regards; valuables, eatables, belongings, goods, surroundings, movables; ashes, remains, ruins, proceedings, clothes, outskirts, arrears, dues, alms, riches, earnings, savings, proceeds, odds."],"TB":[],"T":["To make them singular, use “a pair of”: “A pair of scissors <b>is<\/b> on the table.” Then the verb follows “pair”."],"X":[{"s":"The binoculars *was* not in focus.","f":"were","w":"Always plural."},{"s":"Tongs *is* used by my grandmother to make chapatis.","f":"are","w":"Always plural."},{"s":"All his goods *was* packed in boxes.","f":"were","w":"Always plural."},{"s":"The outskirts of the city *has* some good hospitals.","f":"have","w":"Always plural."}],"N":[],"Q":[{"k":"f","q":"My spectacles ___ broken.","o":["are","is","was","has been"],"a":0,"e":"Always plural.","r":33},{"k":"f","q":"A pair of scissors ___ lying on the table.","o":["is","are","were","have been"],"a":0,"e":"The verb follows “a pair”, which is singular.","r":33},{"k":"e","o":["His savings","was spent","on his daughter’s wedding.","No error"],"a":1,"e":"Savings is always plural: “were spent”.","r":33}]},{"n":34,"title":"Nouns that look singular but are plural","L":["Cattle, vermin, police, gentry, peasantry, people, poultry, cavalry, clergy, infantry and children have no -s, but they always mean many, so they take a plural verb."],"TB":[],"T":["No “a” and no “-s” with these: never “a cattle” or “polices”. The police <b>are<\/b> / cattle <b>are<\/b> / people <b>are<\/b>."],"X":[{"s":"Cattle *was* considered wealth in ancient times.","f":"were","w":"Always plural."},{"s":"Poultry *is* domesticated birds kept for eggs and meat.","f":"are","w":"Always plural."},{"s":"The police *was* informed by the locals.","f":"were","w":"Always plural."},{"s":"Most people *doesn’t* exercise daily.","f":"don’t","w":"People → plural."}],"N":[],"Q":[{"k":"f","q":"The cattle ___ grazing in the field.","o":["are","is","was","has been"],"a":0,"e":"Always plural.","r":34},{"k":"e","o":["The police has","arrested","the main suspect.","No error"],"a":0,"e":"Police → plural: “The police have”.","r":34}]},{"n":35,"title":"Same form in singular and plural","L":["Deer, sheep, fish, species, series, aircraft, offspring, issue (children), whereabouts, headquarters, wages and means do not add -s for the plural. The verb follows the meaning.","<b>Wages<\/b> as income → plural verb. Wages as result or reward (“the wages of sin is death”) → singular.","<b>Means<\/b> as money or resources → plural verb. Means as a method or medium → singular or plural by the meaning (one means / various means)."],"TB":[],"T":["Never add -s: aircrafts, sheeps, deers, headquarter are all wrong. Read the determiner: “two series are”, “this series is”."],"X":[{"s":"I saw the remains of some *aircrafts*.","f":"aircraft","w":"Same form."},{"s":"Two series of lectures *is* scheduled for next week.","f":"are","w":"Two series → plural."},{"s":"The wages of the workers *was* increased.","f":"were","w":"Income → plural."},{"s":"The wages of burning midnight oil *are* always worth it.","f":"is","w":"Result → singular."},{"s":"His means *is* not enough to support a large family.","f":"are","w":"Money → plural."},{"s":"Various means *was* used to contact their family.","f":"were","w":"Various → plural."},{"s":"Our company has set up its new *headquarter* in South Delhi.","f":"headquarters","w":"From the lecture homework."}],"N":[],"Q":[{"k":"f","q":"Three ___ were grazing near the river.","o":["sheep","sheeps","sheepes","sheep’s"],"a":0,"e":"Same singular and plural form.","r":35},{"k":"e","o":["This series of books","are very popular","among children.","No error"],"a":1,"e":"This series → singular: “is very popular”.","r":35}]},{"n":36,"title":"Plural of compound nouns","L":["In a compound noun, make the <b>main noun<\/b> plural, the part

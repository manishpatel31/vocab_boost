:"Purpose → so that.","r":80},{"k":"f","q":"I stayed at home ___ I was not feeling well.","o":["as","so","yet","though"],"a":0,"e":"Reason → as.","r":80},{"k":"f","q":"He ran fast, ___ he missed the train.","o":["but","so","because","as"],"a":0,"e":"Contrast: running fast should have helped.","r":80},{"k":"e","o":["She gave me","such advice as","was very useful.","No error"],"a":3,"e":"Such…as with “as” as the subject of the clause. Correct.","r":76},{"k":"e","o":["Speak softly","lest you should","wake the baby.","No error"],"a":3,"e":"Lest…should. Correct.","r":75}],"hw":[{"s":"The war caused not only destruction and death but also generations of hatred between the two communities.","e":"Parallelism: noun with noun."},{"s":"You would be surprised to know that they had shot him thrice, yet he survived.","e":"Contrast → yet."},{"s":"She had not seen me for the last 10 years, so she was not able to recognise me.","e":"Result → so."},{"s":"When I met him, he angrily asked me whether I had met Rajni or not.","e":"“Or not” pairs with whether."}]},{"n":9,"name":"Preposition","hi":"संबंधसूचक","rules":[{"n":81,"title":"Verbs that take no preposition before the object","L":["These verbs are transitive: the object comes right after them, with no preposition.","Meet, join, obey, violate, ask, kid, tell, inform, remind, warn, thank, advise, reach, resist, resemble, attack, afford, demand, comprise, investigate, enter, flee, explain, describe, discuss, disobey, order, stress, emphasise, await, despise, marry, accompany, answer, approach, attend, lack, sign."],"TB":[],"T":["Discuss the matter (not discuss about). Enter the room (not enter into). Comprise three parts (not comprise of). Reach Delhi (not reach at)."],"X":[{"s":"The play *comprises of* three acts.","f":"comprises","w":"No preposition."},{"s":"Juhi strongly *resembles of* her grandmother.","f":"resembles","w":"No preposition."},{"s":"The police are *investigating into* the murder.","f":"investigating","w":"No preposition."},{"s":"Let’s *discuss about* your situation.","f":"discuss","w":"No preposition."}],"N":[],"Q":[{"k":"f","q":"We reached ___ at 10 pm.","o":["Mumbai","at Mumbai","to Mumbai","in Mumbai"],"a":0,"e":"Reach takes a direct object.","r":81},{"k":"e","o":["The thief entered","into the house","through the window.","No error"],"a":1,"e":"Enter takes a direct object: “entered the house”.","r":81},{"k":"f","q":"She married ___ last year.","o":["a doctor","with a doctor","to a doctor","for a doctor"],"a":0,"e":"Marry takes a direct object.","r":81}]},{"n":82,"title":"“To” before the person: when it is needed and when it is not","L":["<b>No “to”<\/b> before the person after: ask, beg, inform, advise, allow, call, assure, apprise, remind, warn, thank, wish, order, request, invite, forbid, welcome, congratulate, compliment. “I asked <b>the cook<\/b>.”","<b>Use “to”<\/b> before the person after: propose, announce, apologise, plead, talk, report, suggest, speak, listen, write, pray, complain, describe, explain, appeal, reply, object. “I apologised <b>to<\/b> my client.” “Explain <b>to me<\/b> the cause.”"],"TB":[],"T":["Thank him, tell him, ask him. But explain to him, suggest to him, apologise to him."],"X":[{"s":"I always *ask to* the cook to add extra sauce.","f":"ask","w":"No “to”."},{"s":"I want to *thank to* Reeta.","f":"thank","w":"No “to”."},{"s":"My parents *forbade to me* from going.","f":"forbade me","w":"No “to”."},{"s":"I *apologised my client* for cancelling.","f":"apologised to my client","w":"“To” needed."},{"s":"He *proposed his parents* that they go to Kerala.","f":"proposed to his parents","w":"“To” needed."},{"s":"I asked the doctor to *explain me* the cause.","f":"explain to me","w":"“To” needed."},{"s":"He *suggested his friends* that they invest.","f":"suggested to his friends","w":"From the lecture homework."}],"N":[],"Q":[{"k":"f","q":"Please explain ___ how this machine works.","o":["to me","me","for me","with me"],"a":0,"e":"Explain + to + person.","r":82},{"k":"e","o":["He congratulated","to me","on my success.","No error"],"a":1,"e":"No “to”: “congratulated me”.","r":82},{"k":"e","o":["She complained","the manager","about the poor service.","No error"],"a":1,"e":"“To” needed: “complained to the manager”.","r":82}]},{"n":83,"title":"Because vs because of; in case vs in case of; unless vs without","L":["A <b>conjunction<\/b> is followed by a clause (subject + verb). A <b>preposition<\/b> is followed by a noun or pronoun (no verb of its own)."],"TB":[["Conjunction (+ clause)","Preposition (+ noun)"],["because","because of"],["in case","in case of"],["unless","without"],["although / though","despite / in spite of"]],"T":["Look after the word. Subject + verb → because / in case. Only a noun phrase → because of / in case of."],"X":[{"s":"The match was stopped *because* the heavy rain.","f":"because of","w":"A noun follows."},{"s":"I love spring *because of* the flowers and leaves fill my heart with joy.","f":"because","w":"A clause follows (…fill my heart)."},{"s":"People bought groceries in bulk *in case of* the lockdown gets extended.","f":"in case","w":"A clause follows."},{"s":"You can call me *in case* any emergency.","f":"in case of","w":"A noun follows."}],"N":[],"Q":[{"k":"f","q":"The flight was delayed ___ bad weather.","o":["because of","because","since","as"],"a":0,"e":"A noun phrase follows.","r":83},{"k":"e","o":["In case of","it rains,","take an umbrella.","No error"],"a":0,"e":"A clause follows: “In case it rains”.","r":83}]},{"n":84,"title":"Instead of, in spite of, despite","L":["<b>Instead of<\/b> = in place of (की बजाय). <b>In spite of / despite<\/b> = regardless of (के बावजूद).","<b>Despite<\/b> is never followed by “of”. <b>In spite of<\/b> always is."],"TB":[],"T":["Despite the rain ✔. Despite of the rain ✘. In spite of the rain ✔."],"X":[{"s":"*Inspite of* buying a new car, I used my father’s old car.","f":"Instead of","w":"In place of."},{"s":"*Instead of* the financial difficulties, they never borrowed.","f":"In spite of","w":"Regardless of."},{"s":"*Despite of* criticism, Tobey kept trying.","f":"Despite","w":"No “of”."}],"N":[],"Q":[{"k":"f","q":"___ his illness, he attended the meeting.","o":["Despite","Despite of","Instead of","In spite"],"a":0,"e":"Regardless of → despite (no of).","r":84},{"k":"e","o":["She drank juice","in spite of tea","because she had a cold.","No error"],"a":1,"e":"In place of → “instead of tea”.","r":84}]},{"n":85,"title":"Two words joined by “and” that take different prepositions","L":["When two words share one object but need different prepositions, write both prepositions: “superior <b>to<\/b> but cheaper <b>than<\/b> yours”, “liable <b>for<\/b> any loss <b>of<\/b> or damage <b>to<\/b> this car”."],"TB":[],"T":["Test each word alone with the object. If they need different prepositions, write both."],"X":[{"s":"My bag is *superior* but cheaper than yours.","f":"superior to","w":"Superior takes “to”."},{"s":"I won’t be liable for any *loss and damage to* this car.","f":"loss of or damage to","w":"Loss takes “of”."}],"N":[],"Q":[{"k":"f","q":"He was both interested ___ and good at mathematics.","o":["in","at","for","with"],"a":0,"e":"Interested in, good at: both are needed.","r":85},{"k":"e","o":["She is fond","and devoted","to her pets.","No error"],"a":0,"e":"Fond takes “of”: “She is fond of and devoted to her pets”.","r":85}]},{"n":86,"title":"Between vs among","L":["<b>Between<\/b> is used for two. <b>Among<\/b> is used for more than two.","Between can be used for more than two when each one has a separate relationship with every other one: an agreement between four countries."],"TB":[],"T":["Two → between. A crowd, group or class → among. A treaty / agreement / trade between several parties → between."],"X":[{"s":"My mother stood *among* me and my brother.","f":"between","w":"Two people."},{"s":"There could be pickpockets *between* the passengers.","f":"among","w":"A crowd."},{"s":"A peace agreement was signed *among* India, China, Pakistan and Sri Lanka.","f":"between","w":"Mutual agreement."}],"N":[],"Q":[{"k":"f","q":"The property was divided ___ the two brothers.","o":["between","among","within","in"],"a":0,"e":"Two people.","r":86},{"k":"e","o":["He distributed","the sweets between","all the children of the village.","No error"],"a":1,"e":"More than two → “among”.","r":86}]},{"n":87,"title":"Angry at / with","L":["Angry, annoyed, vexed and disgusted take <b>at<\/b> for a thing or situation, and <b>with<\/b> for a person."],"TB":[],"T":["Angry with someone. Angry at something."],"X":[{"s":"I was angry *at* my mother for not telling me.","f":"with","w":"A person."},{"s":"I was angry *with* my new phone’s performance.","f":"at","w":"A thing."}],"N":[],"Q":[{"k":"f","q":"The teacher was annoyed ___ the student for coming late.","o":["with","at","on","about"],"a":0,"e":"A person → with.","r":87},{"k":"e","o":["He was vexed","with the delay","in the delivery.","No error"],"a":1,"e":"A thing → “at the delay”.","r":87}]},{"n":88,"title":"Supply to / with / for","L":["Supply something <b>to<\/b> somebody. Supply somebody <b>with<\/b> something. Supply something <b>for<\/b> a purpose."],"TB":[],"T":["Thing first → to the person. Person first → with the thing. Purpose → for."],"X":[{"s":"She supplies stationery *with* all the schools.","f":"to","w":"Thing first → to."},{"s":"I supplied him *to* food and medicines.","f":"with","w":"Person first → with."},{"s":"I supply medicines to homeless people *to* their treatment.","f":"for","w":"Purpose."}],"N":[],"Q":[{"k":"f","q":"The company supplies the army ___ uniforms.","o":["with","to","for","by"],"a":0,"e":"Person / group first → with.","r":88},{"k":"e","o":["The NGO supplied","books to","the village school.","No error"],"a":3,"e":"Thing first → to. Correct.","r":88}]},{"n":89,"title":"Fixed prepositions","L":["Some words always take the same preposition. SSC asks these often."],"TB":[["Correct","Common mistake"],["accused of","accused for"],["cope with","cope up with"],["dispose of","dispose off"],["afraid of","afraid from"],["different from","different than"],["confident of","confident for"],["deal in (goods), deal with (people or topics)","deal software"],["prefer to","prefer than"],["senior / junior / superior / inferior to","senior than"],["congratulate on","congratulate for"]],"T":["Learn them as one unit, the way you learn a word’s spelling."],"X":[{"s":"Rohan was accused *for* theft.","f":"of","w":"Accused of."},{"s":"She is still coping *up with* her mother’s death.","f":"with","w":"Cope with."},{"s":"Dispose *off* all the extra items.","f":"of","w":"Dispose of."},{"s":"She is afraid *from* wild animals.","f":"of","w":"Afraid of."},{"s":"Your curry tastes different *than* the one at your mother’s.","f":"from","w":"Different from."},{"s":"I am confident *for* my success.","f":"of","w":"From the lecture homework: confident of."},{"s":"His company *deal with* computer software.","f":"deals in","w":"From the lecture homework: deal in goods, plus singular verb."}],"N":[],"Q":[{"k":"f","q":"He is senior ___ me by two years.","o":["to","than","from","over"],"a":0,"e":"Senior to.","r":89},{"k":"e","o":["We congratulated him","for his success","in the exam.","No error"],"a":1,"e":"Congratulate on: “on his success”.","r":89}]},{"n":90,"title":"Infinitive describing a noun needs its preposition","L":["When a to-infinitive describes a noun, that noun must be the object of the infinitive. If the verb needs a preposition to take that object, keep the preposition at the end.","“No one to talk” ✘ — you talk <b>to<\/b> someone → “no one to talk <b>to<\/b>”. “Someone to rely” ✘ → “someone to rely <b>on<\/b>”."],"TB":[],"T":["Turn it around: talk to no one, rely on someone, sit on a chair, write with a pen. The preposition stays."],"X":[{"s":"He had no one *to talk*.","f":"to talk to","w":"Talk to someone."},{"s":"He needs someone *to rely*.","f":"to rely on","w":"Rely on someone."},{"s":"They didn’t even offer me a chair *to sit*.","f":"to sit on","w":"From the lecture homework."}],"N":[],"Q":[{"k":"f","q":"Give me a pen to ___.","o":["write with","write","write by","writing"],"a":0,"e":"Write with a pen.","r":90},{"k":"e","o":["The child","has no toys","to play.","No error"],"a":2,"e":"Play with toys: “to play with”.","r":90}]}],"test":[{"k":"e","o":["The committee","discussed about","the new proposal.","No error"],"a":1,"e":"Discuss takes no preposition: “discussed the proposal”.","r":81},{"k":"f","q":"The soldiers ___ the enemy camp at night.","o":["attacked","attacked on","attacked at","attacked to"],"a":0,"e":"Attack takes a direct object.","r":81},{"k":"e","o":["This book","lacks in","proper examples.","No error"],"a":1,"e":"The verb lack takes no preposition: “lacks proper examples”.","r":81},{"k":"f","q":"We must obey ___.","o":["the law","to the law","with the law","for the law"],"a":0,"e":"Obey takes a direct object.","r":81},{"k":"e","o":["He replied","my letter","after a week.","No error"],"a":1,"e":"“To” needed: “replied to my letter”.","r":82},{"k":"f","q":"She informed ___ about the change in schedule.","o":["us","to us","for us","with us"],"a":0,"e":"Inform takes no “to”.","r":82},{"k":"f","q":"He apologised ___ for his rude words.","o":["to her","her","with her","for her"],"a":0,"e":"Apologise + to + person.","r":82},{"k":"e","o":["The school was closed","because of","the teachers were on strike.","No error"],"a":1,"e":"A clause follows: “because the teachers were on strike”.","r":83},{"k":"f","q":"___ fire, break the glass.","o":["In case of","In case","Because","Unless"],"a":0,"e":"A noun follows.","r":83},{"k":"e","o":["You cannot pass","without you study","regularly.","No error"],"a":1,"e":"A clause follows → “unless you study”.","r":83},{"k":"e","o":["Despite of","his hard work,","he failed.","No error"],"a":0,"e":"“Despite” takes no “of”.","r":84},{"k":"f","q":"He came by bus ___ taking a taxi.","o":["instead of","in spite of","despite","despite of"],"a":0,"e":"In place of → instead of.","r":84},{"k":"e","o":["He has great respect","and faith","in his teachers.","No error"],"a":0,"e":"Respect takes “for”: “respect for and faith in his teachers”.","r":85},{"k":"f","q":"The new model is similar ___, but faster than, the old one.","o":["to","with","than","from"],"a":0,"e":"Similar takes “to”.","r":85},{"k":"e","o":["There was a quarrel","among the two neighbours","last night.","No error"],"a":1,"e":"Two → “between the two neighbours”.","r":86},{"k":"f","q":"The prize money was shared ___ the five winners.","o":["among","between","within","amongst to"],"a":0,"e":"More than two, no mutual pairing → among.","r":86},{"k":"f","q":"A trade agreement was signed ___ five Asian nations.","o":["between","among","with","amid"],"a":0,"e":"A mutual agreement between parties → between.","r":86},{"k":"e","o":["My father was angry","at me","for wasting money.","No error"],"a":1,"e":"A person → “angry with me”.","r":87},{"k":"f","q":"She was disgusted ___ the dirty kitchen.","o":["at","with","on","for"],"a":0,"e":"A thing → at.","r":87},{"k":"e","o":["The government supplied","food with","the flood victims.","No error"],"a":1,"e":"Thing first → “food to the flood victims”.","r":88},{"k":"f","q":"They supplied the hospital ___ oxygen cylinders.","o":["with","to","for","by"],"a":0,"e":"Place / person first → with.","r":88},{"k":"e","o":["She is afraid","from the dark,","so she keeps a light on.","No error"],"a":1,"e":"Afraid of: “afraid of the dark”.","r":89},{"k":"f","q":"I prefer walking ___ driving.","o":["to","than","over than","from"],"a":0,"e":"Prefer … to.","r":89},{"k":"f","q":"How do you cope ___ so much pressure?","o":["with","up with","up","for"],"a":0,"e":"Cope with.","r":89},{"k":"e","o":["The old files","must be disposed of","by Friday.","No error"],"a":3,"e":"Dispose of. Correct.","r":89},{"k":"e","o":["My opinion","is different than","yours.","No error"],"a":1,"e":"Different from: “different from yours”.","r":89},{"k":"e","o":["She has no house","to live","in the city.","No error"],"a":1,"e":"Live in a house: “to live in”.","r":90},{"k":"f","q":"He has no friends to play ___.","o":["with","to","by","for"],"a":0,"e":"Play with friends.","r":90},{"k":"f","q":"There is nothing to worry ___.","o":["about","for","on","with"],"a":0,"e":"Worry about something.","r":90},{"k":"e","o":["He resisted","the temptation","to eat sweets.","No error"],"a":3,"e":"Resist takes a direct object. Correct.","r":81}],"hw":[{"s":"When I went to their house, they didn’t even offer me a chair to sit on.","e":"Sit on a chair."},{"s":"I have studied really hard, so I am confident of my success.","e":"Confident of."},{"s":"He told me that his company deals in computer software.","e":"Deal in goods, and “company” takes a singular verb."},{"s":"He suggested to his friends that they all should invest in his company.","e":"Suggest + to + person."}]},{"n":10,"name":"Advanced verbs and conditionals","hi":"कृदंत और शर्त","rules":[{"n":91,"title":"Dangling -ing phrase (present participle): wrong subject","L":["An opening -ing phrase (“Walking in the park, …”) borrows its doer from the subject of the main clause.","“Walking in the park, a snake bit him” says the snake was walking. Fix it by making the right person the subject, or by giving the phrase its own subject: “While he was walking in the park, a snake bit him.”"],"TB":[],"T":["Ask “Who was walking?” The answer must be the first noun after the comma."],"X":[{"s":"*Walking in the park*, a snake bit him.","f":"While he was walking in the park","w":"The snake was not walking."},{"s":"*Walking down the road*, a car caught Rohit’s attention.","f":"While Rohit was walking down the road","w":"The car was not walking."},{"s":"*Climbing the mountain*, animals were seen by the hikers.","f":"While the hikers were climbing the mountain","w":"The animals were not climbing."},{"s":"*Travelling through the metro*, her mobile went missing.","f":"While she was travelling through the metro","w":"The mobile was not travelling."},{"s":"*While driving to work*, a truck hit her car.","f":"While she was driving to work","w":"From the lecture homework."}],"N":[],"Q":[{"k":"f","q":"___, I saw a rainbow.","o":["Looking out of the window","Looking out of the window, a rainbow","While looking out, the rainbow","Looked out of the window"],"a":0,"e":"The subject “I” is the one looking.","r":91},{"k":"e","o":["Opening the door,","a strange smell","hit me.","No error"],"a":0,"e":"The smell did not open the door. The phrase needs its own subject: “When I opened the door, a strange smell hit me.”","r":91}]},{"n":92,"title":"Dangling “Being …” phrase","L":["The same logic applies to “Being + adjective / V3”. The phrase describes the subject of the main clause.","“Being injured, we took him to hospital” says <b>we<\/b> were injured. Fix: “He being injured, we took him to hospital” (absolute phrase) or “As he was injured, we…”."],"TB":[],"T":["Who was injured / sick / strong? That person must be the subject, or must be named at the start of the phrase."],"X":[{"s":"*Being injured*, we took him to hospital.","f":"He being injured","w":"We were not injured."},{"s":"*Being hospitalised*, Radhika’s parents took care of her.","f":"She being hospitalised","w":"Her parents were not in hospital."},{"s":"*Being strong*, his mother called him to help with the lifting.","f":"He being strong","w":"His mother is not the strong one."}],"N":[],"Q":[{"k":"f","q":"___, the match was cancelled.","o":["It being a rainy day","Being a rainy day","Been a rainy day","Being rainy day"],"a":0,"e":"The phrase needs its own subject “it”.","r":92},{"k":"e","o":["Being a hot day,","we stayed","indoors.","No error"],"a":0,"e":"We were not a hot day: “It being a hot day”.","r":92}]},{"n":93,"title":"Perfect participle: “Having + V3” for the earlier action","L":["When one action is completed before another, use <b>Having + V3<\/b> (or After + V-ing) for the first action: “Having played for two hours, he went home.”","A plain -ing form shows two actions at the same time, so it cannot show “first this, then that”.","Passive: <b>Having been + V3<\/b>: “Having been caught, the thief confessed.”"],"TB":[],"T":["First action finished → Having + V3. Subject received the action → Having been + V3."],"X":[{"s":"*Having played* for 2 hours, he went home.","f":"(no error)","w":"Correct perfect participle."},{"s":"*Completing* the assignment, Suhani lay on the sofa.","f":"Having completed","w":"The earlier action."},{"s":"*Sleeping* for 2 hours, she woke up.","f":"Having slept","w":"The earlier action."},{"s":"*Having caught*, the thief admitted his crime.","f":"Having been caught","w":"The thief was caught (passive)."}],"N":[],"Q":[{"k":"f","q":"___ his work, he went out to play.","o":["Having finished","Finishing","Finished","Having been finished"],"a":0,"e":"The earlier action, done by him.","r":93},{"k":"e","o":["Having been selected","for the job,","she thanked her teachers.","No error"],"a":3,"e":"She was selected (passive), then thanked. Correct.","r":93}]},{"n":94,"title":"“To” as a preposition: + V-ing","L":["In these phrases, “to” is a <b>preposition<\/b>, so a noun or gerund (V-ing) follows, not V1.","Look forward to, with a view to, in addition to, pay attention to, conducive to, accustomed to, used to (= habit), prone to, vulnerable to, addicted to, devoted to, indifferent to, object to, averse to, opposed to, committed to, prefer … to.","<b>Prefer A to B<\/b>: “I prefer watching films <b>to<\/b> reading novels.” Never “prefer … than”."],"TB":[],"T":["Check: can you put a noun after this “to”? (look forward to the holidays ✔) Then it takes V-ing: look forward to meeting you."],"X":[{"s":"We are looking forward to *join* his company.","f":"joining","w":"Preposition to."},{"s":"He was not accustomed to *work* at night.","f":"working","w":"Preposition to."},{"s":"I prefer watching Hollywood movies *than* reading novels.","f":"to","w":"Prefer … to."},{"s":"She started yoga with a view to *improve* her health.","f":"improving","w":"From the lecture homework."}],"N":[],"Q":[{"k":"f","q":"She is committed to ___ the poor.","o":["helping","help","helped","be help"],"a":0,"e":"Committed to + V-ing.","r":94},{"k":"e","o":["I object to","be treated","like a child.","No error"],"a":1,"e":"Object to + V-ing: “being treated”.","r":94}]},{"n":95,"title":"Verbs followed by infinitive vs gerund","L":["<b>To-infinitive<\/b> after: seem, appear, decide, desire, want, try, endeavour, hurry, fail, happen, refuse, promise, prove, hope, plan, agree, afford, manage, offer, wish.","<b>Gerund<\/b> after: enjoy, detest, mind, resent, avoid, excuse, resist, miss, prevent, defer, delay, postpone, consider, appreciate, admire, forgive, recollect, suggest, risk, admit, deny, finish, practise, keep, quit.","Stop, forget and remember take both with a change of meaning: “stop to smoke” (pause in order to smoke) vs “stop smoking” (quit). “Forgot to bring” (did not bring) vs “forgot bringing” (brought but doesn’t recall)."],"TB":[],"T":["Future or intention → to-infinitive (decide to, want to). Something already happening or general activity → gerund (enjoy, avoid, consider)."],"X":[{"s":"He decided *going* on a trip to Manali.","f":"to go","w":"Decide + to."},{"s":"She failed *meeting* the deadline.","f":"to meet","w":"Fail + to."},{"s":"She forgot *bringing* her laptop to the meeting.","f":"to bring","w":"She did not bring it."},{"s":"He detests *to wait* in long queues.","f":"waiting","w":"Detest + gerund."},{"s":"She avoids *to eat* junk food.","f":"eating","w":"Avoid + gerund."},{"s":"She is considering *to follow* her dream.","f":"following","w":"Consider + gerund."},{"s":"The director deferred *to make* the decision.","f":"making","w":"From the lecture homework."}],"N":[],"Q":[{"k":"f","q":"I don’t mind ___ for a few minutes.","o":["waiting","to wait","wait","waited"],"a":0,"e":"Mind + gerund.","r":95},{"k":"f","q":"They refused ___ the documents.","o":["to sign","signing","sign","signed"],"a":0,"e":"Refuse + to.","r":95},{"k":"e","o":["He suggested","to go","for a movie.","No error"],"a":1,"e":"Suggest + gerund: “suggested going”.","r":95}]},{"n":96,"title":"Bare infinitive after let, make, see, hear…","L":["After let, bid, make, see, notice, feel, hear, watch, have and help (optional), the next verb is a <b>bare infinitive<\/b> (V1 without “to”): “She lets her brother <b>borrow<\/b> her car.”","In the passive, “to” comes back: “He was made <b>to work<\/b>.” “He was seen <b>to enter<\/b>.”"],"TB":[],"T":["Let him go. Made me cry. Heard her sing. Saw him cross. No “to” in active voice."],"X":[{"s":"She lets his brother *to borrow* her car.","f":"borrow","w":"Let + bare V1."},{"s":"We heard him *to say* mean things.","f":"say","w":"Hear + bare V1."},{"s":"We saw him *to cross* the road.","f":"cross","w":"See + bare V1."}],"N":[],"Q":[{"k":"f","q":"The teacher made us ___ the poem twice.","o":["read","to read","reading","reads"],"a":0,"e":"Make + bare V1 (active).","r":96},{"k":"e","o":["He was made","work","on Sunday.","No error"],"a":1,"e":"Passive brings back “to”: “was made to work”.","r":96}]},{"n":97,"title":"Causative verbs: make / have / get","L":["When someone gets a task done by another, look at what follows the object:","<b>Doer<\/b> after make / have → bare V1: “The coach made the players <b>practise<\/b>.” “He had the cook <b>prepare<\/b> dinner.” (With get + doer → to + V1: “She got the mechanic <b>to repair<\/b> it.”)","<b>Receiver<\/b> (the thing acted on) after have / get → V3: “She got her car <b>repaired<\/b>.” “I had my hair <b>cut<\/b>.”"],"TB":[],"T":["Can the object do the action? A cook can prepare → bare V1. A car cannot repair itself → V3."],"X":[{"s":"The coach made the players *to practise* every day.","f":"practise","w":"Doer → bare V1."},{"s":"The director had the actors *rehearsed* their lines.","f":"rehearse","w":"Doer → bare V1."},{"s":"Ranjan had the cook *prepared* a meal.","f":"prepare","w":"Doer → bare V1."},{"s":"Anaya got her car *to repair* by the mechanic.","f":"repaired","w":"Receiver → V3."},{"s":"The chef had the food *tasting* by his assistants.","f":"tasted","w":"Receiver → V3."},{"s":"I got my presentation *to review* by my supervisor.","f":"reviewed","w":"Receiver → V3."}],"N":[],"Q":[{"k":"f","q":"I had my watch ___ yesterday.","o":["repaired","repair","to repair","repairing"],"a":0,"e":"The watch is the receiver → V3.","r":97},{"k":"e","o":["She had the plumber","fixed","the leaking tap.","No error"],"a":1,"e":"The plumber is the doer → bare V1: “fix”.","r":97}]},{"n":98,"title":"The three conditionals","L":["<b>Type 1 (possible future)<\/b>: If + simple present → will + V1. “If you finish on time, the boss will promote you.”","<b>Type 2 (unreal present)<\/b>: If + V2 / were → would / could / might + V1. “If I <b>were<\/b> the President, I would help.” Here V2 is not past time; it shows imagination. Use <b>were<\/b> for all subjects.","<b>Type 3 (unreal past)<\/b>: If + had + V3 → would / could / might + have + V3. “If Abhishek had completed his degree, they might <b>have hired<\/b> him.”"],"TB":[],"T":["Never “will” in the if-clause. Were, not was, for imagination. Had + V3 in the if-clause → have + V3 in the result."],"X":[{"s":"If you *will finish* the project on time, the boss will promote you.","f":"finish","w":"No will after if."},{"s":"If I *was* the President of the USA, I would help poor countries.","f":"were","w":"Imagination → were."},{"s":"If Abhishek had completed his degree, they *might hire* him.","f":"might have hired","w":"Type 3."}],"N":[],"Q":[{"k":"f","q":"If I ___ wings, I would fly to the mountains.","o":["had","have","will have","had had"],"a":0,"e":"Unreal present → V2.","r":98},{"k":"e","o":["If it will rain","tomorrow,","the match will be cancelled.","No error"],"a":0,"e":"No will after if: “If it rains”.","r":98},{"k":"f","q":"If you had left earlier, you ___ the train.","o":["would have caught","would catch","will catch","had caught"],"a":0,"e":"Type 3.","r":98}]},{"n":99,"title":"Mixed conditionals","L":["Sometimes the time of the “if” part and the result part differ. Then the two halves are mixed.","<b>Unreal state that never changes + past result<\/b>: If + were / V2 → would have + V3. “If I <b>were<\/b> his father, I would have taught him a lesson.” You can never become his father, so the condition is a permanent unreal state, not a past event.","<b>Past condition + present result<\/b>: If + had + V3 → would / could + V1 (now / today). “If Juhi had asked for help that day, she <b>could be<\/b> alive today.”"],"TB":[],"T":["A condition that can never be true (being someone else, being from another country) → were. A result about now or today → would / could + V1."],"X":[{"s":"If I *had been* his father, I would have taught him a lesson.","f":"were","w":"A permanent unreal state."},{"s":"If she *had been* from the USA, she would have got the opportunities she deserved.","f":"were","w":"Where she is from cannot change."},{"s":"If Juhi had asked for help, she *could have been* alive today.","f":"could be","w":"Result is about today."},{"s":"We would have adjusted our plans if we *were* informed.","f":"had been informed","w":"From the lecture homework: past condition, past result."}],"N":["“If I had been his father…” is not a grammar error in general English, and many books accept it. The lecture’s point is about meaning: for a state that can never change, SSC-style answers prefer “were”."],"Q":[{"k":"f","q":"If you had taken the medicine yesterday, you ___ better now.","o":["would feel","would have felt","will feel","felt"],"a":0,"e":"Past condition, present result.","r":99},{"k":"e","o":["If I had won","the lottery last year,","I would be rich now.","No error"],"a":3,"e":"Past condition, present result. Correct.","r":99}]},{"n":100,"title":"I wish","L":["<b>Wish about the present<\/b>: I wish + V2 (were for “be”). “I wish I <b>knew<\/b> the answer.” “I wish I <b>were<\/b> more fluent.”","<b>Wish about the past<\/b>: I wish + had + V3. “I wish I <b>had listened<\/b> to my parents.”","As with conditionals, V2 here is imagination, not past time."],"TB":[],"T":["A past clue (when I was…, last year, then) → had + V3. No past clue → V2 / were."],"X":[{"s":"I wish I *know* how to solve this problem.","f":"knew","w":"Present wish → V2."},{"s":"I wish I *was* more fluent.","f":"were","w":"Imagination → were."},{"s":"I wish I *listened* to my parents when my company was making profits.","f":"had listened","w":"Past wish."}],"N":[],"Q":[{"k":"f","q":"I wish I ___ a car when I was in college.","o":["had had","had","have","would have"],"a":0,"e":"Past wish → had + V3.","r":100},{"k":"f","q":"She wishes she ___ taller.","o":["were","was","is","had been being"],"a":0,"e":"Present wish → were.","r":100},{"k":"e","o":["I wish","I have","more free time.","No error"],"a":1,"e":"Present wish → V2: “I had”.","r":100}]}],"test":[{"k":"e","o":["Reaching the station,","the train","had already left.","No error"],"a":0,"e":"The train did not reach the station. The -ing phrase needs its own subject: “When we reached the station, the train had already left.”","r":91},{"k":"f","q":"___, she found a wallet on the road.","o":["Walking to school","Walking to school, a wallet","While walking to school, the wallet","Walked to school"],"a":0,"e":"The subject “she” is walking.","r":91},{"k":"e","o":["Sitting on the bench,","he read","the newspaper.","No error"],"a":3,"e":"He was sitting. Correct.","r":91},{"k":"e","o":["Being a holiday,","the office","was closed.","No error"],"a":0,"e":"The office was not a holiday: “It being a holiday”.","r":92},{"k":"f","q":"___, the students went home early.","o":["The teacher being absent","Being absent","Being the teacher absent","The teacher been absent"],"a":0,"e":"The phrase needs its own subject.","r":92},{"k":"e","o":["Finishing his homework,","he went","to bed.","No error"],"a":0,"e":"The earlier action: “Having finished his homework”.","r":93},{"k":"f","q":"___ by the police, the thief confessed.","o":["Having been caught","Having caught","Catching","Being catch"],"a":0,"e":"He received the action, before confessing.","r":93},{"k":"f","q":"___ the letter, she posted it.","o":["Having written","Writing","Having been written","Wrote"],"a":0,"e":"The earlier action, done by her.","r":93},{"k":"e","o":["I look forward","to meet","you soon.","No error"],"a":1,"e":"Look forward to + V-ing: “to meeting”.","r":94},{"k":"f","q":"He is addicted to ___ video games.","o":["playing","play","played","plays"],"a":0,"e":"Addicted to + V-ing.","r":94},{"k":"e","o":["She prefers","reading books","than watching TV.","No error"],"a":2,"e":"Prefer … to: “to watching TV”.","r":94},{"k":"e","o":["He enjoys","to play","cricket on weekends.","No error"],"a":1,"e":"Enjoy + gerund: “playing”.","r":95},{"k":"f","q":"We hope ___ the project by June.","o":["to finish","finishing","finish","finished"],"a":0,"e":"Hope + to.","r":95},{"k":"f","q":"She denied ___ the money.","o":["stealing","to steal","steal","stolen"],"a":0,"e":"Deny + gerund.","r":95},{"k":"e","o":["They postponed","to hold","the meeting.","No error"],"a":1,"e":"Postpone + gerund: “holding”.","r":95},{"k":"e","o":["I saw","her dance","on the stage.","No error"],"a":3,"e":"See + bare V1. Correct.","r":96},{"k":"f","q":"Let me ___ you with your bags.","o":["help","to help","helping","helped"],"a":0,"e":"Let + bare V1.","r":96},{"k":"e","o":["The police","made him","to confess his crime.","No error"],"a":2,"e":"Make + bare V1 (active): “made him confess”.","r":96},{"k":"e","o":["I got my hair","cut","at the new salon.","No error"],"a":3,"e":"The hair is the receiver → V3 “cut”. Correct.","r":97},{"k":"f","q":"She had her house ___ before Diwali.","o":["painted","paint","to paint","painting"],"a":0,"e":"The house is the receiver → V3.","r":97},{"k":"f","q":"The manager had his secretary ___ the letters.","o":["type","typed","to typing","types"],"a":0,"e":"The secretary is the doer → bare V1.","r":97},{"k":"e","o":["We got","the plumber fixed","the pipe.","No error"],"a":1,"e":"Get + doer → to + V1: “got the plumber to fix”.","r":97},{"k":"e","o":["If I was","a bird,","I would fly high.","No error"],"a":0,"e":"Imagination → “If I were”.","r":98},{"k":"f","q":"If you study regularly, you ___ the exam.","o":["will pass","would pass","would have passed","passed"],"a":0,"e":"Type 1.","r":98},{"k":"f","q":"If he had called me, I ___ him.","o":["would have helped","would help","will help","helped"],"a":0,"e":"Type 3.","r":98},{"k":"e","o":["Unless you","will work hard,","you will fail.","No error"],"a":1,"e":"No will after unless: “Unless you work hard”.","r":98},{"k":"f","q":"If I were an Olympic athlete, I ___ a gold medal last year.","o":["would have won","would win","will win","won"],"a":0,"e":"A permanent unreal state with a past result.","r":99},{"k":"e","o":["If you had slept early","last night,","you would not have been tired now.","No error"],"a":2,"e":"The result is about now: “you would not be tired now”.","r":99},{"k":"e","o":["I wish","I had bought","that house last year.","No error"],"a":3,"e":"Past wish → had + V3. Correct.","r":100},{"k":"f","q":"I wish I ___ how to swim.","o":["knew","know","had knew","will know"],"a":0,"e":"Present wish → V2.","r":100}],"hw":[{"s":"While she was driving to work, a truck hit her car and caused a lot of damage.","e":"The dangling -ing phrase needs its own subject."},{"s":"She started doing yoga with a view to improving her physical and mental health.","e":"With a view to + V-ing."},{"s":"The managing director deferred making the decision about launching any new product.","e":"Defer + gerund."},{"s":"We would have adjusted our plans accordingly if we had been informed about the changes.","e":"Past condition → had been + V3."}]}];
</script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return "q" + (h >>> 0).toString(36); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- data ---------- */
const CH = DATA;
const RULES = []; const RULE = {}; const QALL = {};
CH.forEach(c => {
  c.rules.forEach(r => { r.ch = c.n; RULES.push(r); RULE[r.n] = r; r.Q.forEach(q => { q.id = hash("r" + (q.q || q.o.join("/"))); q.src = "rule"; QALL[q.id] = q; }); });
  c.test.forEach(q => { q.id = hash("t" + (q.q || q.o.join("/"))); q.src = "test"; QALL[q.id] = q; });
});
const chOf = n => CH[Math.ceil(n / 10) - 1];
const makePerm = q => {
  const idx = q.o.map((_, i) => i);
  if (q.k === "e") return idx;
  return shuffle(idx);
};

/* ---------- saved progress (this browser only) ---------- */
const KEY = "grammar100_v1";
let S = { done: {}, ans: {}, wrong: {}, tests: {}, last: 1 };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const record = (q, ok) => {
  S.ans[q.id] = ok ? 1 : 0;
  if (ok) delete S.wrong[q.id]; else S.wrong[q.id] = 1;
  save(); renderTop();
};

function renderTop() {
  const done = Object.keys(S.done).length;
  const ids = Object.keys(S.ans).filter(k => QALL[k]);
  const right = ids.filter(k => S.ans[k] === 1).length;
  const pct = ids.length ? Math.round(right * 100 / ids.length) : 0;
  $("#topstat").innerHTML = `<b>${done}</b>/100 rules<br><b>${pct}%</b> accuracy`;
}

/* ---------- routing ---------- */
let TAB = "course"; let T = null; let timerId = null;
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function go(tab) {
  if (T && !T.done && tab !== "testrun") { T = null; stopTimer(); }
  TAB = tab;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  ({ course: renderCourse, tests: renderTests, revise: renderRevise, mistakes: renderMistakes })[tab]();
  window.scrollTo(0, 0);
  try { history.replaceState(null, "", "#" + tab); } catch (e) {}
}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => {
  if (T && !T.done && T.started) { showLeave(b.dataset.tab); return; }
  go(b.dataset.tab);
}));
const view = html => { $("#app").innerHTML = `<section class="view stack">${html}</section>`; };
const on = (sel, fn) => $("#app").querySelectorAll(sel).forEach(el => el.addEventListener("click", e => fn(el, e)));

/* ---------- course ---------- */
let OPEN = null;
function nextRule() { const r = RULES.find(r => !S.done[r.n]); return r ? r.n : null; }
function renderCourse() {
  const done = Object.keys(S.done).length, nx = nextRule();
  if (OPEN === null) OPEN = nx ? chOf(nx).n : 1;
  view(`
    <div class="hero stack">
      <span class="eyebrow">SSC CGL · Error spotting · 100 rules</span>
      <h1>Learn a rule, test it, move on</h1>
      <p>Each rule gives you the logic and a trick, then the examples from the lecture, then 2–3 new questions. After every 10 rules there is a 30-question unit test.</p>
      <div class="meter" aria-label="Rules done"><i style="width:${done}%"></i></div>
      <div class="row between"><span class="muted" style="font-size:14px">${done} of 100 rules done</span>
      ${nx ? `<button class="btn pri sm" type="button" data-rule="${nx}">${done ? "Continue" : "Start"}: Rule ${nx}</button>` : `<button class="btn ink sm" type="button" id="tomock">Take the full mock</button>`}</div>
    </div>
    ${CH.map(c => {
      const d = c.rules.filter(r => S.done[r.n]).length, t = S.tests["u" + c.n];
      const open = OPEN === c.n;
      return `<div class="unit ${d === 10 ? "done" : ""}">
        <button type="button" class="uh" data-unit="${c.n}" aria-expanded="${open}">
          <span class="unum">${d === 10 ? "✓" : c.n}</span>
          <span class="t"><b>${esc(c.name)}</b><span>${c.hi} · Rules ${c.rules[0].n}–${c.rules[9].n}</span></span>
          <span class="sc">${d}/10${t ? `<br>test ${t.best}/60` : ""}</span>
        </button>
        ${open ? `<div class="ubody">${c.rules.map(r => `
          <button type="button" class="rl ${r.n === nx ? "next" : ""}" data-rule="${r.n}">
            <span class="n">${r.n}</span><span class="tt">${esc(r.title)}</span><span class="ok">${S.done[r.n] ? "✓ done" : r.n === nx ? "Next" : ""}</span>
          </button>`).join("")}
          <button type="button" class="rl test" data-test="u${c.n}">
            <span class="n">30Q</span><span class="tt"><b>Unit ${c.n} test</b><br><span class="muted" style="font-size:13.5px">${d < 10 ? `${10 - d} rule${10 - d === 1 ? "" : "s"} left before this test` : "Ready · 20 minutes · +2 / −0.5"}</span></span><span class="ok">${t ? `best ${t.best}` : ""}</span>
          </button></div>` : ""}
      </div>`;
    }).join("")}
    <p class="foot">Based on the “100 most important rules of grammar” lecture and its PDF. Where the PDF’s printed answer was wrong, the lesson says so in a red box.</p>`);
  on("[data-rule]", b => openRule(+b.dataset.rule, "learn"));
  on("[data-unit]", b => { const n = +b.dataset.unit; OPEN = OPEN === n ? -1 : n; renderCourse(); });
  on("[data-test]", b => startTest(b.dataset.test));
  const m = $("#tomock"); if (m) m.onclick = () => startTest("mock");
}

/* ---------- rule lesson ---------- */
let RQ = null;
const mark = s => esc(s).replace(/\*(.+?)\*/g, "<u>$1</u>");
const markFix = (s, f) => esc(s).replace(/\*(.+?)\*/g, (_, w) => `<s>${w}</s><span class="pen">${esc(f)}</span>`);
function openRule(n, step) {
  const r = RULE[n]; if (!r) return;
  S.last = n; save();
  TAB = "course";
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === "course" ? "page" : "false"));
  const stepIdx = { learn: 0, quiz: 1, done: 2 }[step];
  const head = `<div class="row between"><button class="back" type="button" id="back">‹ Unit ${r.ch}</button><span class="eyebrow">Rule ${n} of 100</span></div>
    <div class="steps" aria-hidden="true"><span class="on"></span><span class="${stepIdx >= 1 ? "on" : ""}"></span><span class="${stepIdx >= 2 ? "on" : ""}"></span></div>
    <div class="rulehead stack" style="gap:6px"><span class="no">Rule ${n}</span><h1>${esc(r.title)}</h1></div>`;
  let body = "";
  if (step === "learn") {
    body = `<div class="logic">${r.L.map(p => `<p>${p}</p>`).join("")}</div>
      ${r.TB.length ? `<div class="tbl"><table><thead><tr>${r.TB[0].map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${r.TB.slice(1).map(row => `<tr>${row.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : ""}
      ${r.T.map(t => `<div class="trick"><span class="lab"><mark>Trick</mark></span>${t}</div>`).join("")}
      ${r.N.map(t => `<div class="trap"><span class="lab">Correction to the PDF / note</span>${t}</div>`).join("")}
      <div class="row between"><h2>Examples from the lecture</h2><button class="btn sm" type="button" id="showall">Show all fixes</button></div>
      <p class="muted" style="font-size:14px;margin-top:-6px">The underlined part is wrong. Say the correction in your head, then tap to check.</p>
      <div class="exlist">${r.X.map((x, i) => `<button type="button" class="ex" data-ex="${i}"><div class="s">${mark(x.s)}</div><div class="tap">Tap to see the fix</div></button>`).join("")}</div>
      <button class="btn pri wide" type="button" id="toquiz">Practise this rule · ${r.Q.length} questions</button>`;
  } else if (step === "quiz") {
    body = `<div id="rq"></div>`;
  } else {
    const nx = RULE[n + 1], unitEnd = n % 10 === 0;
    const sc = RQ && RQ.n === n ? RQ.score : null;
    body = `<div class="block stack">
      <span class="eyebrow">Rule ${n} done</span>
      ${sc !== null ? `<div class="scorebig"><span class="num">${sc}</span><span class="muted">/ ${r.Q.length} correct</span></div>` : ""}
      ${r.T.map(t => `<div class="trick"><span class="lab"><mark>Remember</mark></span>${t}</div>`).join("")}
      <div class="row">
        <button class="btn" type="button" id="relearn">Read the rule again</button>
        <button class="btn" type="button" id="redo">Redo questions</button>
      </div>
      ${unitEnd ? `<div class="confirm stack" style="background:var(--navy-soft);border-color:var(--navy)"><b>Unit ${r.ch} complete.</b><span>Time for the unit test: 30 new questions mixed across Rules ${n - 9}–${n}, 20 minutes, SSC marking.</span>
        <button class="btn pri" type="button" id="unittest">Start Unit ${r.ch} test</button></div>` : ""}
      ${nx ? `<button class="btn ${unitEnd ? "" : "pri"} wide" type="button" id="nextrule">Next: Rule ${n + 1} · ${esc(nx.title)}</button>` : `<button class="btn pri wide" type="button" id="tomock2">Take the full mock</button>`}
    </div>`;
  }
  view(head + body);
  $("#back").onclick = () => { OPEN = r.ch; go("course"); };
  if (step === "learn") {
    on("[data-ex]", b => revealEx(b, r.X[+b.dataset.ex]));
    $("#showall").onclick = () => $("#app").querySelectorAll("[data-ex]").forEach(b => revealEx(b, r.X[+b.dataset.ex]));
    $("#toquiz").onclick = () => { RQ = { n, i: 0, score: 0, perms: r.Q.map(makePerm), picked: null }; openRule(n, "quiz"); };
  }
  if (step === "quiz") { if (!RQ || RQ.n !== n) RQ = { n, i: 0, score: 0, perms: r.Q.map(makePerm), picked: null }; renderRQ(); }
  if (step === "done") {
    $("#relearn").onclick = () => openRule(n, "learn");
    $("#redo").onclick = () => { RQ = { n, i: 0, score: 0, perms: r.Q.map(makePerm), picked: null }; openRule(n, "quiz"); };
    const u = $("#unittest"); if (u) u.onclick = () => startTest("u" + r.ch);
    const nb = $("#nextrule"); if (nb) nb.onclick = () => openRule(n + 1, "learn");
    const m = $("#tomock2"); if (m) m.onclick = () => startTest("mock");
  }
  window.scrollTo(0, 0);
}
function fixHTML(x) {
  if (/^\(no error\)/i.test(x.f)) return esc(x.s).replace(/\*(.+?)\*/g, '<u style="text-decoration-color:var(--fix)">$1</u>') + `<span class="pen">no error</span>`;
  if (/^\(remove/i.test(x.f)) return esc(x.s).replace(/\*(.+?)\*/g, (_, w) => `<s>${w}</s><span class="pen">${esc(x.f.replace(/[()]/g, ""))}</span>`);
  return markFix(x.s, x.f);
}
function revealEx(b, x) {
  if (b.dataset.open) return; b.dataset.open = 1;
  b.innerHTML = `<div class="s">${fixHTML(x)}</div><div class="why">${esc(x.w)}</div>`;
}

function qHTML(q, perm, st) {
  const prompt = q.k === "e" ? `<p class="muted" style="font-size:14.5px">Find the part with the error.</p>` : `<div class="qstem">${esc(q.q).replace(/___/g, '<span class="blank"></span>')}</div>`;
  const opts = perm.map((oi, k) => {
    let cls = "opt";
    if (st.reveal) { if (oi === q.a) cls += " ok"; else if (oi === st.picked) cls += " no"; }
    else if (st.sel === oi) cls += " sel";
    return `<button type="button" class="${cls}" data-oi="${oi}" ${st.reveal ? "disabled" : ""}><span class="k">${"ABCD"[k]}</span><span>${esc(q.o[oi])}</span></button>`;
  }).join("");
  return prompt + `<div class="opts">${opts}</div>`;
}
function expHTML(q, picked) {
  const ok = picked === q.a;
  return `<div class="exp ${ok ? "" : "bad"}">${ok ? `<b class="okl">Correct.</b>` : picked == null ? `<b class="nol">Not answered. Answer: ${esc(q.o[q.a])}.</b>` : `<b class="nol">Answer: ${esc(q.o[q.a])}.</b>`} ${esc(q.e)}</div>`;
}
function renderRQ() {
  const r = RULE[RQ.n], box = $("#rq");
  if (RQ.i >= r.Q.length) { S.done[r.n] = 1; save(); renderTop(); openRule(r.n, "done"); return; }
  const q = r.Q[RQ.i], perm = RQ.perms[RQ.i], rev = RQ.picked !== null;
  box.innerHTML = `<div class="qcard">
    <div class="qmeta"><span>Question ${RQ.i + 1} of ${r.Q.length}</span><span class="tag">Rule ${r.n}</span></div>
    ${qHTML(q, perm, { reveal: rev, picked: RQ.picked })}
    ${rev ? expHTML(q, RQ.picked) : ""}
    ${rev ? `<button class="btn pri" type="button" id="rqnext">${RQ.i + 1 < r.Q.length ? "Next question" : "Finish rule"}</button>` : ""}
  </div>`;
  if (!rev) box.querySelectorAll("[data-oi]").forEach(b => b.onclick = () => {
    RQ.picked = +b.dataset.oi; const ok = RQ.picked === q.a; if (ok) RQ.score++; record(q, ok); renderRQ();
  });
  else $("#rqnext").onclick = () => { RQ.i++; RQ.picked = null; renderRQ(); window.scrollTo(0, 0); };
}

/* ---------- tests ---------- */
function renderTests() {
  const mock = S.tests.mock;
  view(`<div class="hero stack"><span class="eyebrow">Unit tests · SSC marking +2 / −0.5</span><h1>Tests</h1>
    <p>Each unit test has 30 questions that do not appear in the lessons. The full mock mixes 50 questions from all 100 rules.</p></div>
    <button type="button" class="unit" style="text-align:left;padding:14px 16px;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%" data-test="mock">
      <span class="unum" style="background:var(--pen-soft);color:var(--pen)">50</span>
      <span class="uh"><span class="t"><b style="font-family:var(--f-display);font-size:17px;display:block">Full mock</b><span class="muted" style="font-size:13.5px">50 random questions · 35 minutes</span></span></span>
      <span class="stat">${mock ? `best<br><b>${mock.best}/100</b>` : ""}</span>
    </button>
    ${CH.map(c => { const t = S.tests["u" + c.n], d = c.rules.filter(r => S.done[r.n]).length;
      return `<button type="button" class="unit" style="text-align:left;padding:14px 16px;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%" data-test="u${c.n}">
        <span class="unum">${c.n}</span>
        <span><b style="font-family:var(--f-display);font-size:17px;display:block">${esc(c.name)}</b><span class="muted" style="font-size:13.5px">Rules ${c.rules[0].n}–${c.rules[9].n} · ${d}/10 learnt${t ? ` · ${t.n} attempt${t.n > 1 ? "s" : ""}` : ""}</span></span>
        <span class="stat">${t ? `best<br><b>${t.best}/60</b>` : "30Q"}</span></button>`; }).join("")}`);
  on("[data-test]", b => startTest(b.dataset.test));
}
function startTest(id) {
  let qs, title, mins;
  if (id === "mock") {
    const pool = CH.flatMap(c => c.test.concat(c.rules.flatMap(r => r.Q)));
    qs = shuffle(pool).slice(0, 50); title = "Full mock"; mins = 35;
  } else {
    const c = CH[+id.slice(1) - 1]; qs = shuffle(c.test); title = `Unit ${c.n} test · ${c.name}`; mins = 20;
  }
  T = { id, title, qs, perms: qs.map(makePerm), ans: qs.map(() => null), cur: 0, dur: mins * 60, left: mins * 60, done: false, started: false, leave: null };
  TAB = "testrun"; renderTestIntro();
}
function renderTestIntro() {
  const c = T.id === "mock" ? null : CH[+T.id.slice(1) - 1];
  const d = c ? c.rules.filter(r => S.done[r.n]).length : 100;
  view(`<button class="back" type="button" id="back">‹ Back</button>
    <div class="block stack"><span class="eyebrow">${T.qs.length} questions · ${T.dur / 60} minutes</span><h1>${esc(T.title)}</h1>
    <p class="muted">+2 for a correct answer, −0.5 for a wrong one, 0 if you leave it. You can move between questions and change answers until you submit. The timer submits for you when it runs out.</p>
    ${c && d < 10 ? `<div class="trap"><span class="lab">Heads-up</span>You have finished ${d} of the 10 rules in this unit. You can still take the test now.</div>` : ""}
    <button class="btn pri wide" type="button" id="begin">Start test</button></div>`);
  $("#back").onclick = () => { T = null; go(TAB === "testrun" ? "tests" : "tests"); };
  $("#begin").onclick = () => { T.started = true; T.t0 = Date.now(); stopTimer(); timerId = setInterval(tick, 1000); renderTestRun(); };
}
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
function tick() {
  if (!T || T.done) { stopTimer(); return; }
  T.left = Math.max(0, T.dur - Math.floor((Date.now() - T.t0) / 1000));
  const el = $("#timer"); if (el) { el.textContent = fmt(T.left); el.classList.toggle("low", T.left <= 120); }
  if (T.left <= 0) submitTest();
}
function renderTestRun() {
  const q = T.qs[T.cur], perm = T.perms[T.cur], r = RULE[q.r];
  const answered = T.ans.filter(a => a !== null).length;
  view(`<div class="row between"><span class="eyebrow">${esc(T.title)}</span><span class="timer" id="timer">${fmt(T.left)}</span></div>
    <div class="qcard">
      <div class="qmeta"><span>Question ${T.cur + 1} of ${T.qs.length}</span></div>
      ${qHTML(q, perm, { reveal: false, sel: T.ans[T.cur] })}
      <div class="row between">
        <button class="btn sm" type="button" id="prev" ${T.cur ? "" : "disabled"}>‹ Previous</button>
        ${T.ans[T.cur] !== null ? `<button class="btn sm" type="button" id="clr">Clear</button>` : ""}
        <button class="btn sm ${T.cur + 1 < T.qs.length ? "ink" : ""}" type="button" id="next" ${T.cur + 1 < T.qs.length ? "" : "disabled"}>Next ›</button>
      </div>
    </div>
    <div class="block stack" style="gap:10px">
      <div class="row between"><span class="muted" style="font-size:14px">${answered} of ${T.qs.length} answered</span><button class="btn pri sm" type="button" id="sub">Submit test</button></div>
      <div id="confirmbox"></div>
      <div class="pal">${T.qs.map((_, i) => `<button type="button" data-go="${i}" class="${T.ans[i] !== null ? "a" : ""} ${i === T.cur ? "cur" : ""}">${i + 1}</button>`).join("")}</div>
    </div>`);
  on("[data-oi]", b => { T.ans[T.cur] = +b.dataset.oi; if (T.cur + 1 < T.qs.length) T.cur++; renderTestRun(); });
  on("[data-go]", b => { T.cur = +b.dataset.go; renderTestRun(); });
  $("#prev").onclick = () => { T.cur--; renderTestRun(); };
  $("#next").onclick = () => { T.cur++; renderTestRun(); };
  const c = $("#clr"); if (c) c.onclick = () => { T.ans[T.cur] = null; renderTestRun(); };
  $("#sub").onclick = () => {
    const left = T.qs.length - T.ans.filter(a => a !== null).length;
    $("#confirmbox").innerHTML = `<div class="confirm stack" style="gap:8px"><span>${left ? `${left} question${left > 1 ? "s are" : " is"} unanswered. ` : ""}Submit now?</span>
      <div class="row"><button class="btn pri sm" type="button" id="yes">Yes, submit</button><button class="btn sm" type="button" id="no">Keep going</button></div></div>`;
    $("#yes").onclick = submitTest; $("#no").onclick = () => { $("#confirmbox").innerHTML = ""; };
  };
}
function showLeave(tab) {
  const box = $("#confirmbox"); if (!box) { go(tab); return; }
  box.innerHTML = `<div class="confirm stack" style="gap:8px"><span>Leave the test? Your answers will be lost.</span>
    <div class="row"><button class="btn pri sm" type="button" id="lv">Leave test</button><button class="btn sm" type="button" id="st">Stay</button></div></div>`;
  $("#lv").onclick = () => { T = null; stopTimer(); go(tab); };
  $("#st").onclick = () => { box.innerHTML = ""; };
  box.scrollIntoView({ block: "center" });
}
function submitTest() {
  if (!T || T.done) return;
  stopTimer(); T.done = true;
  let right = 0, wrong = 0;
  T.qs.forEach((q, i) => { const a = T.ans[i]; if (a === null) return; const ok = a === q.a; ok ? right++ : wrong++; record(q, ok); });
  const max = T.qs.length * 2, score = right * 2 - wrong * 0.5;
  T.res = { right, wrong, skip: T.qs.length - right - wrong, score, max, time: Math.min(T.dur, Math.round((Date.now() - T.t0) / 1000)) };
  const prev = S.tests[T.id] || { best: -Infinity, n: 0 };
  S.tests[T.id] = { best: Math.max(prev.best, score), last: score, n: prev.n + 1 }; save();
  T.filter = "all"; renderResult();
}
function renderResult() {
  const R = T.res, c = T.id === "mock" ? null : CH[+T.id.slice(1) - 1];
  const weak = {}; T.qs.forEach((q, i) => { if (T.ans[i] !== q.a) weak[q.r] = (weak[q.r] || 0) + 1; });
  const weakList = Object.entries(weak).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const list = T.qs.map((q, i) => ({ q, i })).filter(({ q, i }) => T.filter === "all" || (T.filter === "wrong" ? T.ans[i] !== null && T.ans[i] !== q.a : T.ans[i] === null));
  view(`<button class="back" type="button" id="back">‹ Tests</button>
    <div class="block stack"><span class="eyebrow">${esc(T.title)} · result</span>
      <div class="scorebig"><span class="num">${R.score}</span><span class="muted">/ ${R.max} marks</span></div>
      <div class="tiles"><div class="tile g"><b>${R.right}</b><span>correct</span></div><div class="tile r"><b>${R.wrong}</b><span>wrong</span></div><div class="tile"><b>${R.skip}</b><span>skipped · ${fmt(R.time)} used</span></div></div>
      ${weakList.length ? `<div class="stack" style="gap:8px"><span class="eyebrow">Revise these rules</span><div class="chiprow" style="flex-wrap:wrap">${weakList.map(([n, k]) => `<button class="chip" type="button" data-rule="${n}">Rule ${n} · ${k} missed</button>`).join("")}</div></div>` : `<p class="okl"><b>Full marks on accuracy.</b></p>`}
      <div class="row"><button class="btn pri" type="button" id="again">Retake</button>${c && c.n < 10 ? `<button class="btn" type="button" id="nextunit">Go to Unit ${c.n + 1}</button>` : ""}</div>
    </div>
    <div class="row between"><h2>Review</h2><div class="chiprow">${["all", "wrong", "skipped"].map(f => `<button class="chip" type="button" data-f="${f}" aria-pressed="${T.filter === f}">${f[0].toUpperCase() + f.slice(1)}</button>`).join("")}</div></div>
    <div class="pal">${T.qs.map((q, i) => `<button type="button" data-jump="${i}" class="${T.ans[i] === null ? "" : T.ans[i] === q.a ? "r" : "w"}">${i + 1}</button>`).join("")}</div>
    ${list.length ? list.map(({ q, i }) => `<div class="qcard" id="rv${i}"><div class="qmeta"><span>Q${i + 1}</span><button class="tag" style="border:0" type="button" data-rule="${q.r}">Rule ${q.r} · ${esc(RULE[q.r].title)}</button></div>
      ${qHTML(q, T.perms[i], { reveal: true, picked: T.ans[i] })}${expHTML(q, T.ans[i])}</div>`).join("") : `<p class="muted">Nothing here.</p>`}
    ${c && c.hw.length ? `<div class="block stack"><span class="eyebrow">Lecture homework · Unit ${c.n}</span><p class="muted" style="font-size:14px">The four practice sentences from the PDF, corrected.</p><ol class="hw">${c.hw.map(h => `<li>${esc(h.s)}<span>${esc(h.e)}</span></li>`).join("")}</ol></div>` : ""}`);
  $("#back").onclick = () => { T = null; go("tests"); };
  $("#again").onclick = () => startTest(T.id);
  const nu = $("#nextunit"); if (nu) nu.onclick = () => { T = null; openRule(c.n * 10 + 1, "learn"); };
  on("[data-rule]", b => { T = null; openRule(+b.dataset.rule, "learn"); });
  on("[data-f]", b => { T.filter = b.dataset.f; renderResult(); });
  on("[data-jump]", b => { if (T.filter !== "all") { T.filter = "all"; renderResult(); } const el = document.getElementById("rv" + b.dataset.jump); if (el) el.scrollIntoView({ block: "start" }); });
}

/* ---------- revise ---------- */
let RVQ = "", RVU = 0;
function renderRevise() {
  view(`<div class="hero stack"><span class="eyebrow">One-screen revision</span><h1>All 100 tricks</h1><p>Tap a rule to see its trick and one worked example. Search by any word, like “lest”, “each”, or “had + V3”.</p></div>
    <input class="search" id="q" type="search" placeholder="Search rules" value="${esc(RVQ)}" aria-label="Search rules">
    <div class="chiprow"><button class="chip" type="button" data-u="0" aria-pressed="${RVU === 0}">All</button>${CH.map(c => `<button class="chip" type="button" data-u="${c.n}" aria-pressed="${RVU === c.n}">${esc(c.name)}</button>`).join("")}</div>
    <div class="stack" id="rvlist" style="gap:8px"></div>`);
  const draw = () => {
    const s = RVQ.trim().toLowerCase();
    const rs = RULES.filter(r => (!RVU || r.ch === RVU) && (!s || (r.title + " " + r.T.join(" ") + " " + r.L.join(" ")).toLowerCase().includes(s)));
    $("#rvlist").innerHTML = rs.length ? rs.map(r => { const x = r.X[0];
      return `<details class="rv"><summary><span class="n">${r.n}</span><span>${esc(r.title)} ${S.done[r.n] ? `<span class="okl" style="font-size:13px">✓</span>` : ""}</span></summary>
      <div class="b stack" style="gap:8px"><div>${r.T.join("<br>")}</div>
      <div class="ex" style="padding:10px 12px"><div class="s">${fixHTML(x)}</div></div>
      <button class="btn sm" type="button" data-rule="${r.n}" style="align-self:flex-start">Open lesson</button></div></details>`; }).join("") : `<p class="muted">No rule matches “${esc(RVQ)}”.</p>`;
    $("#rvlist").querySelectorAll("[data-rule]").forEach(b => b.onclick = () => openRule(+b.dataset.rule, "learn"));
  };
  $("#q").addEventListener("input", e => { RVQ = e.target.value; draw(); });
  on("[data-u]", b => { RVU = +b.dataset.u; renderRevise(); });
  draw();
}

/* ---------- mistakes ---------- */
let MQ = null;
function renderMistakes() {
  const ids = Object.keys(S.wrong).filter(k => QALL[k]);
  if (!MQ) MQ = { list: shuffle(ids), i: 0, picked: null, perm: null };
  const byRule = {}; ids.forEach(k => { const r = QALL[k].r; byRule[r] = (byRule[r] || 0) + 1; });
  const top = Object.entries(byRule).sort((a, b) => b[1] - a[1]).slice(0, 8);
  if (!ids.length) {
    view(`<div class="hero stack"><span class="eyebrow">Mistake bank</span><h1>No mistakes saved</h1><p>Every question you get wrong, in a lesson or a test, lands here. Answer it correctly once and it leaves the bank.</p></div>
      <button class="btn pri" type="button" id="go1">${nextRule() ? `Continue with Rule ${nextRule()}` : "Take the full mock"}</button>`);
    $("#go1").onclick = () => nextRule() ? openRule(nextRule(), "learn") : startTest("mock");
    return;
  }
  MQ.list = MQ.list.filter(k => S.wrong[k] || k === MQ.cur);
  ids.forEach(k => { if (!MQ.list.includes(k)) MQ.list.push(k); });
  if (MQ.i >= MQ.list.length) MQ.i = 0;
  const id = MQ.list[MQ.i]; MQ.cur = id; const q = QALL[id];
  if (!MQ.perm || MQ.permFor !== id) { MQ.perm = makePerm(q); MQ.permFor = id; }
  const rev = MQ.picked !== null;
  view(`<div class="hero stack"><span class="eyebrow">Mistake bank · ${ids.length} question${ids.length > 1 ? "s" : ""}</span><h1>Fix your mistakes</h1>
    <p>Answer correctly once and the question leaves the bank.</p>
    <div class="chiprow" style="flex-wrap:wrap">${top.map(([n, k]) => `<button class="chip" type="button" data-rule="${n}">Rule ${n} · ${k}</button>`).join("")}</div></div>
    <div class="qcard"><div class="qmeta"><span>${MQ.i + 1} of ${MQ.list.length}</span><button class="tag" style="border:0" type="button" data-rule="${q.r}">Rule ${q.r} · ${esc(RULE[q.r].title)}</button></div>
      ${qHTML(q, MQ.perm, { reveal: rev, picked: MQ.picked })}
      ${rev ? expHTML(q, MQ.picked) + `<button class="btn pri" type="button" id="mnext">Next</button>` : ""}</div>`);
  on("[data-rule]", b => openRule(+b.dataset.rule, "learn"));
  if (!rev) on("[data-oi]", b => { MQ.picked = +b.dataset.oi; record(q, MQ.picked === q.a); renderMistakes(); });
  else $("#mnext").onclick = () => { MQ.picked = null; MQ.perm = null; if (!S.wrong[id]) { MQ.list.splice(MQ.i, 1); } else MQ.i++; MQ.cur = null; renderMistakes(); };
}

/* ---------- boot ---------- */
renderTop();
const start = (location.hash || "").replace("#", "");
go(["course", "tests", "revise", "mistakes"].includes(start) ? start : "course");

</script>

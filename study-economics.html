<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Indian Economy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: Economics PYQ Workbook — follows the शब्दRegister Paper / Indigo look; one column + bottom tabs on phones, sidebar on PC. */
:root{
  --paper:#f6f3ea; --sheet:#fffdf7; --sunk:#ebe6d8;
  --ink:#1d2a22; --ink2:#56625a; --rule:#dcd5c3;
  --blue:#1f5c3d; --on-blue:#ffffff; --blue-bg:#dcebdf;
  --accent:#b4530f; --accent-bg:#fbe7d3;
  --good:#1b7547; --good-bg:#dff1e6; --bad:#b0271f; --bad-bg:#f8e1de;
  --warn-bg:#fff2d2;
  --f-display:"Fraunces", "Tiro Devanagari Hindi", Georgia, serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap{border-radius:var(--r);padding:12px 14px 12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.trick .lab,.trap .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.rk div{grid-template-columns:minmax(0,48%) minmax(0,1fr)}
.rk dd{min-width:0;overflow-wrap:anywhere}
.hot{border-radius:var(--r);padding:12px 14px;background:var(--warn-bg,var(--accent-bg));border-left:4px solid var(--warn,var(--accent))}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--warn,var(--accent))}
.heatb{display:inline-block;font-size:11px;letter-spacing:-.1em;margin-left:6px;vertical-align:1px}
.heat{display:flex;flex-direction:column;gap:2px}
.hrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(60px,1fr) 44px;gap:10px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:9px 2px;color:inherit;font:inherit;cursor:pointer}
.hrow:last-child{border-bottom:0}
.hrow .ht{display:flex;flex-direction:column;min-width:0}
.hrow .ht .muted{font-size:12px}
.hbar{height:10px;border-radius:5px;background:var(--rule);overflow:hidden}
.hbar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hp{text-align:right;font-weight:700}

.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.pyr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pyr div{text-align:center;font-size:13px}
.pyr b{display:block;font-size:14px}
.pm{fill:var(--blue)} .pf{fill:var(--accent)}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.pal button.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.pal button.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.rk{display:grid;gap:0}
.rk div{display:grid;grid-template-columns:minmax(0,48%) 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:15px}
.rk div:first-child{border-top:0}
.rk dt{font-size:13px;color:var(--ink2);margin:0}
.rk dt.up{color:var(--good)} .rk dt.dn{color:var(--bad)}
.rk dd{margin:0;font-weight:600;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:24px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.gbar{display:grid;grid-template-columns:78px 1fr 52px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.gbar .tr{height:12px;background:var(--sunk);border-radius:3px;position:relative;overflow:hidden}
.gbar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:3px}
.gbar .tr i.neg{background:var(--bad)}
.gbar .v{font-family:var(--f-num);text-align:right}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
@media (prefers-reduced-motion: no-preference){ .opt,.chip,.btn{transition:background-color .15s, border-color .15s} }
.link{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px}
.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.icheck{background:var(--sheet);border:1.5px dashed var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.icheck .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.cat{font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;white-space:nowrap}
.cat.CS{background:var(--blue-bg);color:var(--blue)} .cat.CSS{background:var(--accent-bg);color:var(--accent)} .cat.ST{background:var(--sunk);color:var(--ink)} .cat.OT{background:var(--sunk);color:var(--ink2)}

/* ---- workbook additions ---- */
table.cover td:nth-child(4){min-width:180px}
.plist .dl{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.plist .dl em{font-style:normal;font-weight:700;color:var(--blue);text-align:right}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--rule)}
.ladder li{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--rule)}
.ladder .rk-n{font-size:22px;font-weight:600;color:var(--blue);text-align:right}
.ladder .rk-t{min-width:0}
.ladder .rk-t b{display:block;line-height:1.3}
.ladder .rk-t span{font-size:13px;color:var(--ink2)}
.ladder .rk-d{font-weight:700;font-size:14px;white-space:nowrap}
.ladder li.up .rk-d{color:var(--good)} .ladder li.dn .rk-d{color:var(--bad)}
.ladder small{font-weight:600;color:var(--ink2)}
table.cover td{min-width:90px}
.peek{border:1.5px dashed var(--blue);background:var(--blue-bg);color:var(--blue);border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer;min-height:36px;width:100%}
.pubs{display:grid;gap:12px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.plist li{padding:7px 0;border-top:1px dashed var(--rule);display:grid;gap:1px}
.plist li:first-child{border-top:0}
.plist li span{font-size:13px;color:var(--ink2)}
.seg{scroll-snap-type:x proximity}

<script>
"use strict";
const LESSONS = [
{ id:"L1", heat:2, title:"Basics: economies, micro & macro, goods", hi:"अर्थव्यवस्था की मूल बातें", blocks:[
 {k:"hot", h:"<b>2–3 questions every paper.</b> SSC keeps asking <b>who is the father of what</b> (Smith, Marshall, Keynes), <b>is this micro or macro?</b>, the <b>four factors and their rewards</b>, and the newer favourite — <b>public vs private vs club vs common-pool goods</b>."},
 {k:"facts", title:"Who said what", rows:[["Adam Smith","Father of (modern) economics · <b>Wealth of Nations, 1776</b> · invisible hand · laissez-faire · canons of taxation"],["Alfred Marshall","Principles of Economics, 1890 · father of <b>microeconomics</b> · welfare definition · cardinal utility"],["J.M. Keynes","General Theory of Employment, Interest and Money, <b>1936</b> · father of <b>macroeconomics</b> · aggregate demand · animal spirits"],["Lionel Robbins","<b>Scarcity</b> definition — unlimited wants, limited resources with alternative uses"],["Ragnar Frisch","Split economics into micro and macro (1933)"],["Hicks & Allen","Ordinal utility — ranking, indifference curves"],["Malthus","Population grows geometrically, food arithmetically (1798)"]]},
 {k:"table", title:"Micro vs macro", head:["","Microeconomics","Macroeconomics"], rows:[["Also called","Price theory","Income & employment theory"],["Looks at","One consumer, one firm, one market","Whole economy — aggregates"],["Examples","Price of rice, wage of a worker, demand for tea","GDP, inflation, unemployment, budget, money supply"],["Approach","Bottom-up","Top-down"]]},
 {k:"trick", h:"<b>“Market supply of rice” and “a worker's wage” are micro</b> even though they sound big. If the option says <i>national, total, general price level, aggregate</i> → macro. Budget and inflation control are macro."},
 {k:"table", title:"Four kinds of goods (two tests)", head:["Type","Excludable?","Rival?","Example"], rows:[["Private","Yes","Yes","Food, clothes, car"],["Public","No","No","Defence, street lights, police"],["Common-pool","No","Yes","Fish in a lake, forest timber"],["Club","Yes","No","Netflix, paid online course"]]},
 {k:"facts", title:"Factors & their rewards", rows:[["Land","Rent"],["Labour","Wages"],["Capital","Interest"],["Entrepreneur","Profit"],["Rent + interest + profit","Operating surplus"]]},
 {k:"p", h:"<b>Economic systems.</b> Capitalist = private ownership + profit motive + market prices (laissez-faire). Socialist = state ownership, central planning. <b>Mixed</b> = both — India's model since 1950 (socialist-leaning till 1991). Central problems: <b>what, how and for whom</b> to produce. <b>Opportunity cost</b> = value of the next best alternative given up."},
 {k:"p", h:"<b>Sectors.</b> Primary — agriculture, fishing, mining, forestry. Secondary — manufacturing (blue collar). Tertiary — services (banking, education, transport). <b>Intermediate goods</b> are used up in production (copper for utensils, tea leaves); <b>capital goods</b> are used again and again and depreciate (machines); fridge and shirt bought by households are <b>final</b> goods."},
 {k:"trap", h:"<b>Public transport is not a pure public good</b> — you buy a ticket (excludable). In “example of a public good” questions, pick police, defence or street lights."},
 {k:"link", h:"Keynes returns in L5 (unemployment from deficient demand), L6 (liquidity preference, liquidity trap) and L10 (raise government spending in a depression). Adam Smith returns in L11 (canons of taxation)."},
 {k:"q", q:"Who is called the father of macroeconomics?", o:["J.M. Keynes","Adam Smith","Alfred Marshall","Lionel Robbins"], e:"General Theory, 1936 — aggregate demand drives output and jobs."},
 {k:"q", q:"Netflix is an example of which kind of good?", o:["Club good","Public good","Common-pool resource","Private good"], e:"Excludable (subscription) but non-rival (my watching doesn't reduce yours)."}
], sum:["Smith 1776 modern economics; Marshall 1890 micro; Keynes 1936 macro; Robbins scarcity.","Micro = price theory; macro = income & employment theory.","Public goods are non-excludable and non-rival; club goods excludable but non-rival.","Rewards: rent, wages, interest, profit.","India: mixed economy since 1950.","Intermediate goods are used up; capital goods are reused and depreciate."]},

{ id:"L2", heat:2, title:"Demand, supply, utility & elasticity", hi:"मांग, पूर्ति, उपयोगिता, लोच", blocks:[
 {k:"hot", h:"<b>Regular in CGL, CHSL and Steno.</b> Favourites: <b>exceptions to the law of demand</b> (Giffen, Veblen), <b>cross elasticity</b> sign for substitutes vs complements, <b>Ed = 1 maximises revenue</b>, and the 2025 trend of <b>snob vs bandwagon</b> effect."},
 {k:"facts", title:"The laws", rows:[["Law of demand","Price ↑ → quantity demanded ↓ (inverse, downward slope), <b>ceteris paribus</b>"],["Law of supply","Price ↑ → quantity supplied ↑"],["Equilibrium","Where demand = supply"],["Movement along the curve","Caused by change in the good's <b>own price</b>"],["Shift of the curve","Income, tastes, prices of related goods change"],["Diminishing marginal utility","Each extra unit gives less satisfaction; TU = sum of MU"],["Indifference curve","Also called <b>iso-utility curve</b> (ordinal — Hicks & Allen)"]]},
 {k:"table", title:"Elasticity at a glance", head:["Value","Name","Curve"], rows:[["∞","Perfectly elastic","Horizontal"],[">1","Relatively elastic","Flatter"],["=1","Unitary — <b>total revenue is maximum</b>","Rectangular hyperbola"],["<1","Relatively inelastic","Steeper"],["0","Perfectly inelastic","Vertical"]]},
 {k:"facts", title:"Cross & income elasticity", rows:[["Substitutes (tea–coffee)","Cross elasticity <b>positive</b>"],["Complements (tea–sugar, car–petrol)","Cross elasticity <b>negative</b>"],["Formula","Ed = %ΔQ ÷ %ΔP (negative sign); Es = %ΔQs ÷ %ΔP (positive)"],["More substitutes","More elastic demand"]]},
 {k:"table", title:"Exceptions to the law of demand", head:["Case","Why demand rises with price"], rows:[["Giffen good","Inferior staple of the very poor"],["Veblen / conspicuous good","Status — diamonds, luxury watches"],["Speculation","Expect still higher prices (shares, gold, silver)"],["Necessities","Must buy anyway"]]},
 {k:"trick", h:"<b>Snob vs bandwagon:</b> snob buys <i>because few others have it</i> (demand falls as others buy); bandwagon buys <i>because everyone has it</i> (Labubu dolls, Stanley cups). Veblen = demand rises <i>with price</i>."},
 {k:"trap", h:"<b>“Substitute goods” is NOT an exception</b> to the law of demand — it's a classic wrong option. Exceptions are Giffen, Veblen, speculative goods and necessities."},
 {k:"link", h:"A perfectly elastic (horizontal) demand curve is the demand curve of a single firm in perfect competition — L3."},
 {k:"q", q:"Cross elasticity of demand between tea and coffee is…", o:["Positive","Negative","Zero","Infinite"], e:"They are substitutes: price of coffee up → demand for tea up."},
 {k:"q", q:"Total revenue is maximum when price elasticity of demand is…", o:["Equal to 1","Greater than 1","Less than 1","Zero"], e:"At unitary elasticity a small price change leaves revenue unchanged — the peak."}
], sum:["Law of demand: inverse; holds ceteris paribus.","Own price → movement; other factors → shift.","Ed = 1 → TR maximum.","Substitutes +, complements − cross elasticity.","Exceptions: Giffen, Veblen, speculation, necessities — not substitutes.","Indifference curve = iso-utility curve (ordinal)."]},

{ id:"L3", heat:2, title:"Market structures & costs", hi:"बाज़ार संरचना और लागत", blocks:[
 {k:"hot", h:"<b>One question most shifts.</b> Feature-matching: “which is NOT a feature of oligopoly”, “homogeneous product → ?”, “selling costs → ?”, plus the shape of AFC and why AC/AVC/MC are U-shaped."},
 {k:"table", title:"Four markets", head:["Market","Sellers","Product","Key word"], rows:[["Perfect competition","Very many","Homogeneous","Price taker; free entry & exit; horizontal demand curve; vegetable mandi"],["Monopolistic competition","Many","Differentiated","Brands, <b>selling costs</b> (ads); toothpaste; normal profit in the long run"],["Oligopoly","Few, large","Homogeneous or differentiated","<b>Interdependence</b> (Jio–Airtel); entry barriers"],["Monopoly","One","No close substitute","Price maker; barriers; Indian Railways"]]},
 {k:"facts", title:"Buyer-side and special cases", rows:[["Monopsony","<b>Single buyer</b> (government buying fighter jets; one mine hiring all labour)"],["Oligopsony","Few buyers"],["Natural monopoly","Huge fixed cost → <b>economies of scale</b>; one firm is cheapest (rail, water, power grids)"],["Duopoly","Two sellers"]]},
 {k:"table", title:"Cost curves", head:["Curve","Shape","Why"], rows:[["AFC","<b>Rectangular hyperbola</b>, never touches the axes","Fixed cost spread over more units"],["AVC, AC, MC","U-shaped","<b>Law of variable proportions</b>"],["Fixed cost","Rent, interest, insurance","Doesn't change with output"],["Variable cost","Raw material, wages of casual labour","Changes with output"]]},
 {k:"trick", h:"<b>Count the sellers:</b> 1 → monopoly, 2 → duopoly, few → oligopoly, many with brands → monopolistic, very many identical → perfect. “Infinite/large number of sellers” is therefore the wrong option in any oligopoly question."},
 {k:"trap", h:"<b>Selling costs belong to monopolistic competition</b> (textbook answer). One lecture mentioned an answer key that took monopoly — if both appear, go with monopolistic competition. <b>Replacement investment = depreciation</b>, not new investment."},
 {k:"link", h:"Natural monopoly is why railways and atomic energy stayed reserved for the public sector after 1991 — L15."},
 {k:"q", q:"The demand curve faced by a firm in perfect competition is…", o:["Horizontal (perfectly elastic)","Downward sloping","Vertical","Upward sloping"], e:"The firm is a price taker — it can sell any amount at the market price."},
 {k:"q", q:"A market with a single buyer is called…", o:["Monopsony","Monopoly","Oligopoly","Duopoly"], e:"Mono = one, opsony = buying."}
], sum:["Perfect: homogeneous, price taker, horizontal demand.","Monopolistic: differentiated products + selling costs.","Oligopoly: few sellers, interdependence.","Monopsony = one buyer; natural monopoly = economies of scale.","AFC rectangular hyperbola; AC/AVC/MC U-shaped (variable proportions)."]},

{ id:"L4", heat:2, title:"National income", hi:"राष्ट्रीय आय", blocks:[
 {k:"hot", h:"<b>Moderate but steady</b> — about 1–2 questions per paper, more in recent selection posts. The same four ideas repeat: <b>GDP vs GNP (NFIA)</b>, <b>gross vs net (depreciation)</b>, <b>what is excluded from GDP</b>, and the <b>multiplier</b>."},
 {k:"facts", title:"The ladder", rows:[["GDP","Market value of all <b>final</b> goods & services produced <b>within the domestic territory</b> in a year"],["GNP","GDP + <b>NFIA</b> (factor income from abroad − paid abroad) — by nationals anywhere"],["NDP / NNP","Gross − <b>depreciation</b>"],["NNP at factor cost","= National income (NNP at market price − net indirect taxes)"],["GVA","Output − intermediate consumption; GDP = GVA + product taxes − product subsidies"],["Personal income","NI + transfers − undistributed profits − corporate tax − social security contributions"],["PDI","Personal income − personal direct taxes"],["Per capita income","National income ÷ population"]]},
 {k:"trick", h:"<b>“Gross → Net: subtract depreciation. Domestic → National: add NFIA.”</b> A Toyota plant in India adds to India's GDP and Japan's GNP. So “increases GDP but not GNP” = profits of a <b>foreign company</b> operating here."},
 {k:"table", title:"Three methods & exclusions", head:["Method","Formula / note"], rows:[["Expenditure","GDP = C + I + G + (X − M)"],["Income","Rent + wages + interest + profit + mixed income"],["Value added (product)","Sum of value added at each stage — avoids double counting"],["<b>Excluded</b>","Intermediate goods, second-hand goods, transfer payments, housework, imports, pure financial deals"]]},
 {k:"facts", title:"Price basis", rows:[["Nominal GDP","At <b>current prices</b> — includes inflation"],["Real GDP","At <b>constant (base-year)</b> prices"],["GDP deflator","Nominal ÷ real × 100"],["Base year","Revised from 2011-12 to <b>2022-23</b> (new series Feb 2026)"],["Who computes","NSO, Ministry of Statistics (MoSPI)"]]},
 {k:"facts", title:"Multiplier & circular flow", rows:[["Investment multiplier","K = 1 ÷ (1 − MPC) = <b>1 ÷ MPS</b>"],["Leakages","Saving, taxes, imports"],["Injections","Investment, government spending, exports"],["Sectors","2 = households + firms; 3 = + government; 4 = + rest of world"]]},
 {k:"trap", h:"<b>Remittances are current transfers, not factor income</b> — so a remittance surge doesn't make GNP exceed GDP. India's NFIA is <b>negative</b> (profit outflows), so GDP > GNP. A/R PYQ: “GDP is not a full measure of welfare because it ignores distribution, pollution and depreciation” — both true, R explains A."},
 {k:"link", h:"Services are now over half of GDP while agriculture still employs the most people — the 1950–90 structural shift is in L14; poverty and inequality measures (Lorenz, Gini) are in L18."},
 {k:"q", q:"What distinguishes GNP from GDP?", o:["Net factor income from abroad","Depreciation","Indirect taxes","Subsidies"], e:"GNP = GDP + NFIA."},
 {k:"q", q:"If MPC is 0.8, the investment multiplier is…", o:["5","4","8","1.25"], e:"K = 1 ÷ (1 − 0.8) = 1 ÷ 0.2 = 5."}
], sum:["GDP = final goods within borders; GNP adds NFIA.","Gross − depreciation = net.","Excluded: intermediate, second-hand, transfers, housework.","GDP = C + I + G + (X − M).","Multiplier = 1/MPS.","Base year now 2022-23; NSO computes."]},

{ id:"L5", heat:2, title:"Inflation & unemployment", hi:"मुद्रास्फीति और बेरोज़गारी", blocks:[
 {k:"hot", h:"<b>About 1–2 per paper; CGL 2025 loved statements.</b> Types by speed, demand-pull vs cost-push (“all EXCEPT” questions), <b>WPI vs CPI</b> (who publishes, weights, services), stagflation, Phillips curve and the unemployment types."},
 {k:"table", title:"By speed (lecture scale)", head:["Type","Rate","Note"], rows:[["Creeping","≤ 3%","Healthy — “like salt in food”"],["Walking / trotting","3–10%","Warning"],["Running","10–20%",""],["Galloping","> 20%","Double/triple digits"],["Hyperinflation","Extremely high (Cagan: > 50% a month)","Money loses value fast"]]},
 {k:"table", title:"By cause", head:["Type","Trigger","Examples"], rows:[["Demand-pull","Too much money chasing too few goods","<b>Income-tax cut</b>, higher govt spending, easy credit"],["Cost-push","Input costs rise","Oil prices, wage hikes, crop failure, hoarding & black marketing"]]},
 {k:"table", title:"WPI vs CPI", head:["","WPI","CPI"], rows:[["Published by","Office of Economic Adviser, <b>DPIIT</b> (Commerce)","<b>NSO, MoSPI</b>"],["Base","2011-12 (revision to 2022-23 announced)","<b>2024</b> (new series 2026; was 2012)"],["Services?","<b>No</b>","Yes"],["Biggest weight","Manufactured products (~64%)","Food & beverages"],["Order of weights","Manufactured > Primary (~22%) > Fuel & power (~13%)",""],["Use","Producer prices","<b>RBI target: 4% ± 2</b>"]]},
 {k:"facts", title:"Words SSC confuses", rows:[["Deflation","General price level falling"],["Disinflation","<b>Rate</b> of inflation falling (prices still rising, slower)"],["Stagflation","High inflation + high unemployment + stagnant growth"],["Reflation","Deliberate stimulus to pull out of deflation"],["Recession","Two consecutive quarters of negative growth"],["Shrinkflation","Smaller pack, same price"],["Core inflation","Excludes food & fuel"],["Inflation tax","Loss of purchasing power from inflation"],["Phillips curve","Short-run trade-off: inflation ↑ unemployment ↓ (breaks in stagflation)"]]},
 {k:"table", title:"Unemployment types", head:["Type","Meaning"], rows:[["Disguised","Extra workers with zero marginal productivity — farms"],["Seasonal","Work only in sowing/harvest season"],["Frictional","Between jobs — temporary, search"],["Structural","Skill mismatch, structural change in economy"],["Cyclical","Recession / business cycle"]]},
 {k:"facts", title:"Measuring jobs", rows:[["PLFS","Periodic Labour Force Survey — MoSPI"],["Current Weekly Status","Employed if worked ≥ <b>1 hour</b> on any day of the reference week"],["Main vs marginal worker (Census)","≥ 183 days vs < 183 days a year"],["Working age","15–64 (dependency ratio: 0–14 and 65+)"],["Labour codes","Four codes in force from 21 Nov 2025; Social Security Code covers gig & platform workers"]]},
 {k:"trick", h:"<b>“Cost-push in India can result from all EXCEPT…” → reduction in income tax.</b> A tax cut puts money in pockets — that's demand-pull. Anything about oil, wages, poor harvest or hoarding is cost-push."},
 {k:"trap", h:"<b>Measure NOT used to check deflation → cutting government spending.</b> Deflation needs more money: raise spending, cut taxes, cut rates. A/R: “cost-push is <i>always</i> due to excess demand” — R false (“always” words are usually wrong)."},
 {k:"link", h:"How RBI fights inflation — repo, CRR, OMO — is L7. Why inflation hurts lenders and helps borrowers: real interest = nominal − inflation (Fisher)."},
 {k:"q", q:"Which index does the RBI target under flexible inflation targeting?", o:["CPI (combined)","WPI","GDP deflator","IIP"], e:"4% CPI inflation with a ±2% band, since 2016."},
 {k:"q", q:"High inflation with stagnant growth and high unemployment is…", o:["Stagflation","Disinflation","Reflation","Deflation"], e:"It contradicts the Phillips-curve trade-off."}
], sum:["Creeping ≤3 → walking → running → galloping → hyper.","Tax cut = demand-pull; oil/wages/hoarding = cost-push.","WPI: DPIIT, no services, manufactured highest. CPI: NSO, base 2024, food highest.","RBI targets CPI 4 ± 2.","Disinflation = slower rise; deflation = falling prices.","Disguised unemployment = zero marginal productivity (farms)."]},

{ id:"L6", heat:2, title:"Money, RBI & currency", hi:"मुद्रा, आरबीआई और नोट", blocks:[
 {k:"hot", h:"<b>Steady 1 question.</b> RBI founding facts, <b>who issues the ₹1 note</b>, currency presses vs mints, governors in order, and <b>M0–M4</b> (which is narrow, which broad, which most liquid)."},
 {k:"facts", title:"RBI basics", rows:[["Recommended by","Hilton Young Commission (1926)"],["Act / start","RBI Act <b>1934</b> → began <b>1 April 1935</b> in Kolkata"],["HQ","Shifted to <b>Mumbai in 1937</b>"],["Nationalised","<b>1 Jan 1949</b>"],["First governor","Sir Osborne Smith; first Indian: <b>C.D. Deshmukh</b>"],["Only governor later PM","Manmohan Singh"],["Governor now","<b>Sanjay Malhotra</b> (26th, Dec 2024)"],["Notes","RBI issues all notes <b>except ₹1</b> — ₹1 note and all coins are issued by the Ministry of Finance (₹1 note signed by the Finance Secretary)"]]},
 {k:"tl", title:"Governors in order (recent)", rows:[["2003–08","Y.V. Reddy"],["2008–13","D. Subbarao"],["2013–16","Raghuram Rajan"],["2016–18","Urjit Patel"],["2018–24","Shaktikanta Das"],["Dec 2024–","Sanjay Malhotra"]]},
 {k:"table", title:"Where money is made", head:["Kind","Places","Owner"], rows:[["Note presses","<b>Nashik</b> (Maharashtra), <b>Dewas</b> (MP)","SPMCIL — Government of India"],["Note presses","<b>Mysuru</b> (Karnataka), <b>Salboni</b> (WB)","BRBNMPL — RBI subsidiary (1995)"],["Mints (coins)","Mumbai, Hyderabad, Kolkata, Noida","SPMCIL"]]},
 {k:"trap", h:"<b>Mumbai is a mint, not a note press.</b> A lecture listed it as a press. Presses: Nashik, Dewas, Mysuru, Salboni."},
 {k:"table", title:"Money supply (RBI measures)", head:["Measure","Made of","Name"], rows:[["M0","Currency in circulation + bankers' deposits with RBI + other deposits with RBI","Reserve / base / <b>high-powered</b> money"],["M1","Currency with public + <b>demand</b> deposits + other deposits with RBI","<b>Narrow money</b> — most liquid"],["M2","M1 + post-office <b>savings</b> deposits",""],["M3","M1 + <b>time</b> deposits with banks","<b>Broad money</b> (aggregate monetary resources)"],["M4","M3 + all post-office deposits (excl. NSC)","Least liquid"]]},
 {k:"trick", h:"<b>Liquidity falls as the number rises: M1 > M2 > M3 > M4.</b> “Demand = M1, time = M3.” Cash is the most liquid asset of all."},
 {k:"facts", title:"Money theory", rows:[["Functions","Primary: medium of exchange, measure of value · Secondary: store of value, standard of deferred payment"],["Barter problem","Double coincidence of wants — money removes it"],["Fisher","Quantity theory MV = PT"],["Cambridge","Cash-balance approach M = kPY"],["Keynes","<b>Liquidity preference</b> — transaction, precautionary, speculative motives"],["Liquidity trap","Rates near zero; demand for money perfectly elastic; monetary policy ineffective"],["Fiat money","Legal tender by government order; a <b>cheque is not legal tender</b>"]]},
 {k:"facts", title:"Note motifs (currency-design questions)", rows:[["₹10","Konark Sun Temple"],["₹20","Ellora caves"],["₹50","Hampi stone chariot"],["₹100","Rani ki Vav"],["₹200","Sanchi Stupa"],["₹500","Red Fort"]]},
 {k:"link", h:"High-powered money × money multiplier = broad money. The multiplier falls when CRR rises — L7."},
 {k:"q", q:"Which note is NOT issued by the RBI?", o:["₹1","₹10","₹2","₹5"], e:"The ₹1 note is issued by the Ministry of Finance."},
 {k:"q", q:"M3 is also called…", o:["Broad money","Narrow money","Reserve money","High-powered money"], e:"M1 + time deposits with banks."}
], sum:["RBI: Act 1934, began 1 Apr 1935, Mumbai 1937, nationalised 1949.","₹1 note & coins: Ministry of Finance.","Presses: Nashik, Dewas (GoI); Mysuru, Salboni (RBI). Mumbai = mint.","M0 high-powered; M1 narrow; M3 broad; liquidity falls M1→M4.","Keynes: liquidity preference; liquidity trap."]},

{ id:"L7", heat:3, title:"Monetary policy, MPC & RBI tools", hi:"मौद्रिक नीति और एमपीसी", blocks:[
 {k:"hot", h:"<b>Most-asked banking area — about 30 of 400 PYQs.</b> Repo vs reverse repo, CRR vs SLR, what happens when CRR rises, <b>“which is NOT a monetary tool”</b> (fiscal items!), and MPC membership (asked in CGL 2025)."},
 {k:"table", title:"Quantitative tools", head:["Tool","What it is","To fight inflation"], rows:[["Repo","RBI <b>lends</b> to banks short-term against G-sec collateral","Raise"],["Reverse repo / SDF","RBI <b>absorbs</b> banks' surplus money; SDF (no collateral) is the LAF floor since 2022","Raise"],["MSF","Overnight emergency borrowing using SLR securities; repo + 0.25%","Raise"],["Bank rate","Long-term lending to banks, <b>no collateral</b>; aligned to MSF","Raise"],["CRR","Share of NDTL kept as <b>cash with RBI — earns no interest</b>","Raise"],["SLR","Share of NDTL kept by the bank itself in cash, gold, G-secs","Raise"],["OMO","RBI buys/sells government securities","<b>Sell</b> (absorbs cash)"]]},
 {k:"facts", title:"Rates now (check before exam)", rows:[["Repo","<b>5.25%</b> (since Dec 2025; MPC meets 5–7 Oct 2026)"],["SDF / MSF","5.00% / 5.50%"],["CRR","3% (cut in stages, 2025)"],["SLR","18%"],["Inflation target","CPI 4% ± 2 (till 2031)"]]},
 {k:"facts", title:"Monetary Policy Committee", rows:[["Set up","2016 (RBI Act amended; Urjit Patel Committee 2014 idea)"],["Members","<b>6</b> — Governor (chair), Deputy Governor in charge of monetary policy, <b>one RBI officer nominated by the Central Board</b>, three experts appointed by the central government"],["Term","External members 4 years"],["Decides","Repo rate"],["Votes","Majority; Governor has a casting vote; quorum 4"],["Meets","At least 4 times a year (6 in practice)"]]},
 {k:"table", title:"Qualitative (selective) tools", head:["Tool","Meaning"], rows:[["Moral suasion","RBI persuades banks by letters and meetings"],["Credit rationing","RBI fixes sector quotas (priority sector)"],["Margin requirement","Loan-to-value cut for speculative sectors"],["Direct action","Penalties on defaulting banks"]]},
 {k:"trick", h:"<b>To fight inflation, every rate and ratio goes UP</b> (repo, reverse repo, CRR, SLR, bank rate) and OMO <b>sells</b>. Hawkish = dear = tight = contractionary; dovish = cheap = easy = expansionary. <b>Monetary = RBI; fiscal = government.</b>"},

 {k:"link", h:"Monetary tool for a BoP deficit → exchange-rate action/devaluation (L16). Narasimham Committees cut CRR/SLR in the 1990s (L8)."},

{ id:"L9", heat:3, title:"Budget: receipts & expenditure", hi:"बजट: प्राप्तियाँ और व्यय", blocks:[
 {k:"hot", h:"<b>Budget & fiscal ≈ 40 of 400 PYQs.</b> The question is almost always a classification: <b>revenue or capital? receipt or expenditure?</b> Plus Articles (112, 114, 116, 117) and who prepares the budget."},
 {k:"table", title:"The four boxes", head:["","Revenue (no asset/liability change)","Capital (changes assets/liabilities)"], rows:[["Receipts","Tax (direct + indirect); non-tax: interest, dividends, fees, fines","<b>Borrowings</b>, disinvestment, recovery of loans"],["Expenditure","Salaries, pensions, <b>interest</b>, subsidies, grants to states, defence services","Roads, bridges, buildings, machinery, <b>loans given</b>, loan repayment"]]},
 {k:"trick", h:"<b>Ask two questions:</b> does it create a liability or reduce an asset? → capital receipt. Does it create an asset or reduce a liability? → capital expenditure. Everything else is revenue. <b>Interest paid is revenue; loan repaid is capital.</b>"},
 {k:"facts", title:"Constitution & procedure", rows:[["Annual Financial Statement","<b>Art 112</b> — the word “budget” is not in the Constitution; laid in the President's name"],["Appropriation Bill","Art 114"],["Vote on account","Art 116 — interim budget in election years (2019, 2024)"],["Finance Bill","<b>Art 117</b> — tax proposals; only in Lok Sabha"],["Prepared by","Budget Division, Department of Economic Affairs"],["Fiscal year","1 April – 31 March (since 1867)"],["Date","1 February (since 2017); Rail Budget merged 2017"],["Firsts","First budget 1860 — James Wilson; independent India 1947 — R.K. Shanmukham Chetty"],["Records","Morarji Desai most budgets (10); Sitharaman 9 in a row (2026-27)"],["Funds","Consolidated Fund 266(1); Public Account 266(2); Contingency Fund 267"]]},
 {k:"facts", title:"Gender & outcome budgeting", rows:[["Gender budget","Since 2005-06 · Part A 100% for women · Part B 30–99% · Part C below 30% (new)"],["Child budgeting","2008-09"]]},
 {k:"trap", h:"<b>Grants to states for creating assets are revenue expenditure</b> — the assets belong to the states, not the centre (hence ‘effective revenue deficit’). <b>Disinvestment is a capital receipt that creates no liability</b>; a loan from RBI is a capital receipt that does."},
 {k:"link", h:"Revenue minus capital pieces give the deficits in L10. Taxes in the revenue box are split into direct and indirect in L11."},
 {k:"q", q:"Interest paid on government loans is…", o:["Revenue expenditure","Capital expenditure","Capital receipt","Revenue receipt"], e:"No asset is created — it's a current cost."},
 {k:"q", q:"Disinvestment proceeds are classified as…", o:["Non-debt capital receipt","Revenue receipt","Debt-creating capital receipt","Tax revenue"], e:"Selling assets reduces assets without creating a liability."}
], sum:["Art 112 AFS; 114 appropriation; 116 vote on account; 117 Finance Bill.","Capital receipt: borrowing, disinvestment, loan recovery.","Capital exp: assets, loans given, loan repayment.","Interest, salaries, subsidies, grants = revenue exp.","Budget Division of DEA prepares; 1 Feb since 2017."]},

 {k:"table", title:"LPG keyword sorter", head:["Letter","Means","Keywords"], rows:[["L","Liberalisation","<b>Licence raj ended</b>, de-licensing, removing quantitative restrictions, cutting tariffs, de-reservation, interest-rate freedom"],["P","Privatisation","<b>Disinvestment</b>, selling PSU shares, strategic sale, state from owner to facilitator"],["G","Globalisation","FDI/FPI, <b>MNC entry</b> (Coca-Cola, McDonald's), integration with world, outsourcing, convertibility"]]},
 {k:"facts", title:"NIP 24 July 1991", rows:[["Licensing","Abolished except 5 (now): alcohol, tobacco cigarettes, defence & aerospace electronics, industrial explosives, hazardous chemicals"],["Public-sector reservation","Cut from 17 to 8 → now <b>2: atomic energy, railway operations</b>"],["FDI","51% automatic in 34 priority industries; FIPB under PMO"],["MRTP","Asset limit removed"],["Other","Exit policy for sick units; second-generation reforms later (governance, labour, finance)"]]},
 {k:"trick", h:"<b>Option elimination for 1991 statements:</b> words like ‘only’, ‘solely’, ‘all’, ‘completely’ are usually false; a long, balanced, explanatory option is usually true. ‘Socialisation’ and ‘self-reliance in defence’ are NOT part of LPG."},
 {k:"trap", h:"<b>Devaluation made exports cheaper, not imports cheaper</b> (statement PYQ). India devalued in <b>1949, 1966 and 1991</b> (a lecture said 1948/1969). DIPAM (disinvestment) is in the <b>Ministry of Finance</b>, not Commerce."},
 {k:"facts", title:"Effects", rows:[["Good","Forex rose to record highs; GDP growth up; services/IT boom; more choice for consumers"],["Criticism","Jobless growth (capital-intensive), inequality, farm distress (fertiliser subsidy cuts, volatile prices)"],["Banking","New private & foreign banks entered"],["Navratna/Maharatna","PSEs given autonomy; HAL became Maharatna (Oct 2024)"]]},
 {k:"link", h:"1991 ties everything: fiscal deficit (L10), Narasimham (L8), devaluation & convertibility (L16), WTO 1995 (L17), indicative planning from the 8th plan (L13)."},
 {k:"q", q:"Abolition of industrial licensing for most industries in 1991 is part of…", o:["Liberalisation","Privatisation","Globalisation","Stabilisation"], e:"L for Licence raj."},
 {k:"q", q:"Which was NOT a component of the 1991 reforms?", o:["Socialisation","Liberalisation","Privatisation","Globalisation"], e:"LPG only."}
], sum:["1991 = BoP crisis, forex ~2 weeks of imports.","Gold pledged; rupee devalued 1 & 3 July; IMF SAP.","L = licences; P = disinvestment; G = FDI/MNCs.","Reserved now: atomic energy, railways.","Devaluation makes exports cheaper."]},

{ id:"L16", heat:3, title:"Balance of payments, forex & rupee", hi:"भुगतान संतुलन, विदेशी मुद्रा", blocks:[
 {k:"hot", h:"<b>Third of the big three.</b> CGL 2025 asked BoP vs BoT statements, ‘which is NOT in current account’, and devaluation effects. Also forex components, convertibility, FERA→FEMA."},
 {k:"table", title:"BoP structure", head:["Account","Contains"], rows:[["Current — visible","Export & import of <b>goods</b> (= balance of trade)"],["Current — invisible","Services, factor income, <b>remittances & gifts</b> (unilateral transfers)"],["Capital","FDI, FPI, external loans (ECB), banking capital, <b>capital transfers</b>, reserves change"]]},
 {k:"trick", h:"<b>BoT = goods only; BoP = everything.</b> So ‘affects BoP but not BoT’ → remittances, services, foreign investment, loans. ‘Not a component of current account’ → capital transfers / FDI."},
 {k:"facts", title:"Forex & exchange rate", rows:[["Forex reserves","Foreign currency assets + gold + <b>SDR</b> + reserve tranche position (IMF); ~$700 bn"],["SDR basket","USD, EUR, CNY, JPY, GBP — ‘paper gold’"],["Devaluation","<b>Government</b> deliberately lowers value (fixed regime)"],["Depreciation","Market forces lower value (floating)"],["Effect","Exports cheaper, imports dearer → BoP improves; too much → imported inflation (oil)"],["LERMS","March 1992 — 60% at market rate, 40% official"],["Market-determined","March 1993"],["Current-account convertibility","<b>August 1994</b>"],["Capital account","Partial — Tarapore Committees 1997, 2006"],["FERA → FEMA","1973 (criminal) → 1999 (civil), in force 1 June 2000"]]},
 {k:"facts", title:"Remittances & deficits", rows:[["Remittances","India largest recipient — ~$135 bn (FY25)"],["Usual position","Trade deficit always; current-account deficit usually (surplus in some quarters, e.g. Q4 FY25)"],["CA surplus means","Country is lending to the rest of the world"],["Twin deficit","Fiscal + current account"]]},
 {k:"trap", h:"<b>Monetary measure for a BoP deficit → exchange-rate action/devaluation by RBI.</b> Export promotion, import duty and tourism promotion are government (fiscal/trade) measures. Taxes on foreign investment and interest-rate changes act on the <b>capital</b> account, not current."},
 {k:"link", h:"The 1991 crisis was a BoP crisis (L15); FDI vs FPI and trade bodies are in L17."},
 {k:"q", q:"Remittances from Indians abroad are recorded in…", o:["Current account","Capital account","Balance of trade","Reserve account"], e:"They are unilateral transfers — an invisible item."},
 {k:"q", q:"The rupee became convertible on current account in…", o:["1994","1991","1993","1997"], e:"August 1994 (IMF Article VIII)."}
], sum:["BoT = goods; BoP = all transactions.","Remittances: current; FDI/FPI/loans: capital.","Devaluation = govt; depreciation = market.","LERMS 1992 → float 1993 → CA convertibility 1994.","FERA 1973 → FEMA 1999 (1 June 2000).","Forex = FCA + gold + SDR + RTP."]},

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hash = s => { let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5)+h + s.charCodeAt(i))|0; return "q"+(h>>>0).toString(36); };
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; };
const L = id => LESSONS.find(l => l.id === id);
const LNUM = id => LESSONS.findIndex(l => l.id === id) + 1;

const QS = QB.map(r => {
  const fixed = !!r[6];
  return { t:r[0], q:r[1], o:r[2], e:r[3], p:(r[4]||"").includes("p"), a: fixed ? (r[5]||0) : 0, fixed, id:hash(r[1]) };
});
const byLesson = id => QS.filter(q => q.t === id);
// order of options to show: array of original indexes
const makePerm = q => q.fixed ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i));

const KEY = APP.key;
let S = { ans:{}, bm:{}, les:{}, mocks:[] };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const record = (q, ok) => { S.ans[q.id] = ok ? 1 : 0; save(); renderTop(); };

function renderTop(){
  const ids = Object.keys(S.ans).filter(k => QS.some(q => q.id === k));
  const right = ids.filter(k => S.ans[k] === 1).length;
  const pct = ids.length ? Math.round(right*100/ids.length) : 0;
  $("#topstat").innerHTML = `<b>${ids.length}</b>/${QS.length} tried<br><b>${pct}%</b> right now`;
}

function blockHTML(b){
  if (b.k==="p") return `<div class="plain"><p>${b.h}</p></div>`;
  if (b.k==="trick") return `<div class="trick"><span class="lab">Trick</span>${b.h}</div>`;
  if (b.k==="link") return `<div class="link"><span class="lab">Link · connect the dots</span>${b.h}</div>`;
  if (b.k==="q") { const perm = shuffle(b.o.map((_,i)=>i)); return `<div class="icheck" data-ic><span class="lab">Quick check</span><p class="qt">${esc(b.q)}</p><div class="opts">${perm.map((oi,k)=>`<button type="button" class="opt" data-ioi="${oi}"><span class="k">${"ABCD"[k]}</span><span>${esc(b.o[oi])}</span></button>`).join("")}</div><div class="exp" hidden><b class="okl"></b> ${esc(b.e)}</div></div>`; }
  if (b.k==="hot") return `<div class="hot"><span class="lab">🔥 Exam radar · how often it's asked</span>${b.h}</div>`;
  if (b.k==="trap") return `<div class="trap"><span class="lab">Trap · correction</span>${b.h}</div>`;
  if (b.k==="facts") return `<div class="block"><h3>${b.title}</h3><dl class="facts">${b.rows.map(r=>`<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join("")}</dl></div>`;
  if (b.k==="tl") return `<div class="block"><h3>${b.title}</h3><ul class="tl">${b.rows.map(r=>`<li><span class="y">${r[0]}</span><span>${r[1]}</span></li>`).join("")}</ul></div>`;
  if (b.k==="table") {
    const isNum = (ci) => b.numcol==="all" ? ci>0 : (b.numcol===1 && ci===1) || (typeof b.numcol==="string" && b.numcol.includes(String(ci)));
    return `<div class="block"><h3>${b.title}</h3><div class="tbl"><table><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map((c,ci)=>`<td class="${isNum(ci)?"n":""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  }
  if (b.k==="fig") return `<div class="block"><h3>${b.title}</h3><figure class="fig">${b.svg}<figcaption>${b.cap}</figcaption></figure></div>`;
  if (b.k==="pyr") return `<div class="block"><h3>${b.title}</h3><div class="pyr">${b.items.map(it=>`<div>${PYR(it.rows)}<b>${it.name}</b><span class="muted">${it.note}</span></div>`).join("")}</div><p class="muted" style="font-size:13px;margin-top:8px"><span style="color:var(--blue)">■</span> males · <span style="color:var(--accent)">■</span> females · top = old, base = young</p></div>`;
  return "";
}

let LQ = null;
function openLesson(id, step){
  const l = L(id), i = LNUM(id);
  if (step === "quiz") { LQ = { id, list: shuffle(byLesson(id)).map(q => ({q, perm:makePerm(q)})), i:0, score:0, picked:null }; }
  const head = `<div class="lhead"><button class="back" type="button" id="lback">‹ Lessons</button></div>
    <span class="eyebrow">Lesson ${i} of ${LESSONS.length} · ${l.hi}</span><h1>${esc(l.title)}</h1>
    <div class="steps" role="tablist">
      <button type="button" data-step="learn" aria-current="${step==="learn"?"step":"false"}">1 · Learn</button>
      <button type="button" data-step="quiz" aria-current="${step==="quiz"?"step":"false"}">2 · Quiz</button>
      <button type="button" data-step="sum" aria-current="${step==="sum"?"step":"false"}">3 · Summary</button>
    </div>`;
  let body = "";
  if (step === "learn") {
    body = `<div class="stack">${l.blocks.map(blockHTML).join("")}
      <div class="row end"><button class="btn pri" type="button" id="toquiz">Take the lesson quiz · ${byLesson(id).length} questions</button></div></div>`;
  } else if (step === "quiz") {
    body = `<div id="lq"></div>`;
  } else {
    const nxt = LESSONS[i];
    body = `<div class="stack"><div class="block"><h3>Remember these</h3><ul class="sum">${l.sum.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
      <div class="row between"><button class="btn" type="button" id="relearn">Read again</button>
      ${nxt ? `<button class="btn pri" type="button" id="nextles">Next: ${esc(nxt.title)}</button>` : `<button class="btn pri" type="button" id="tomock">Take a mock test</button>`}</div></div>`;
    S.les[id] = Object.assign(S.les[id]||{}, {done:1}); save();
  }
  $("#app").innerHTML = `<section class="view stack">${head}${body}</section>`;
  $("#lback").onclick = () => renderLearn();
  $("#app").querySelectorAll("[data-step]").forEach(b => b.onclick = () => openLesson(id, b.dataset.step));
  if (step==="learn") { $("#toquiz").onclick = () => openLesson(id,"quiz");
    const ics = l.blocks.filter(b=>b.k==="q");
    $("#app").querySelectorAll("[data-ic]").forEach((box,n) => { const b = ics[n];
      box.querySelectorAll("[data-ioi]").forEach(btn => btn.onclick = () => {
        if (box.dataset.done) return; box.dataset.done = 1; const pick = +btn.dataset.ioi;
        box.querySelectorAll("[data-ioi]").forEach(x => { const oi=+x.dataset.ioi; x.disabled = true; if (oi===0) x.classList.add("ok"); else if (oi===pick) x.classList.add("no"); });
        const ex = box.querySelector(".exp"); ex.hidden = false; const lab = ex.querySelector("b");
        if (pick===0) { lab.textContent = "Correct."; } else { lab.className = "nol"; lab.textContent = "Answer: " + b.o[0] + "."; }
      }); }); }
  if (step==="quiz") renderLQ();
  if (step==="sum") {
    $("#relearn").onclick = () => openLesson(id,"learn");
    const n = $("#nextles"); if (n) n.onclick = () => openLesson(LESSONS[i].id,"learn");
    const m = $("#tomock"); if (m) m.onclick = () => go("mock");
  }
  window.scrollTo(0,0);
}

function optsHTML(q, perm, state){
  // state: {picked: originalIndex|null, reveal: bool, sel: originalIndex|null}
  return perm.map((oi, k) => {
    let cls = "opt";
    if (state.reveal) { if (oi === q.a) cls += " ok"; else if (oi === state.picked) cls += " no"; }
    else if (state.sel === oi) cls += " sel";
    return `<button type="button" class="${cls}" data-oi="${oi}" ${state.reveal?"disabled":""}><span class="k">${"ABCD"[k]}</span><span>${esc(q.o[oi])}</span></button>`;
  }).join("");
}
function expHTML(q, picked){
  const ok = picked === q.a;
  return `<div class="exp">${ok ? `<b class="okl">Correct.</b>` : `<b class="nol">Answer: ${esc(q.o[q.a])}.</b>`} ${esc(q.e)}</div>`;
}
function metaHTML(q, no){
  return `<div class="qmeta"><span class="qno">${no}</span><span class="tag">L${LNUM(q.t)} · ${esc(L(q.t).title)}</span>${q.p?`<span class="tag pyq">High-yield</span>`:""}
  <button type="button" class="bm" data-bm="${q.id}" aria-pressed="${S.bm[q.id]?"true":"false"}" aria-label="Bookmark">${S.bm[q.id]?"★":"☆"}</button></div>`;
}

function renderLQ(){
  const box = $("#lq");
  if (LQ.i >= LQ.list.length) {
    const n = LQ.list.length, l = L(LQ.id);
    const st = S.les[LQ.id] || {}; st.best = Math.max(st.best||0, LQ.score); S.les[LQ.id] = st; save();
    box.innerHTML = `<div class="stack"><div class="block stack"><span class="eyebrow">Quiz done</span>
      <div class="scorebig"><span class="num">${LQ.score}</span><span class="muted">/ ${n} correct</span></div>
      <p class="muted">${LQ.score===n ? "Full marks." : LQ.score >= n*0.8 ? "Strong. Review the ones you missed in Practice → Mistakes." : "Read the lesson once more, then retry. Missed questions are saved under Practice → Mistakes."}</p></div>
      <div class="row between"><button class="btn" type="button" id="retry">Retry quiz</button><button class="btn pri" type="button" id="tosum">See summary</button></div></div>`;
    $("#retry").onclick = () => openLesson(LQ.id,"quiz");
    $("#tosum").onclick = () => openLesson(LQ.id,"sum");
    return;
  }
  const it = LQ.list[LQ.i], q = it.q;
  const reveal = LQ.picked !== null;
  box.innerHTML = `<div class="stack"><div class="meter"><i style="width:${LQ.i/LQ.list.length*100}%"></i></div>
    <article class="qcard">${metaHTML(q, `Q${LQ.i+1}/${LQ.list.length}`)}
    <p class="qt">${esc(q.q)}</p><div class="opts">${optsHTML(q, it.perm, {picked:LQ.picked, reveal})}</div>
    ${reveal ? expHTML(q, LQ.picked) : ""}</article>
    ${reveal ? `<div class="row end"><button class="btn pri" type="button" id="lqnext">${LQ.i+1 < LQ.list.length ? "Next question" : "Finish"}</button></div>` : `<p class="muted" style="font-size:13px">Score so far: <span class="num">${LQ.score}</span></p>`}</div>`;
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (LQ.picked !== null) return;
    LQ.picked = +b.dataset.oi; const ok = LQ.picked === q.a; if (ok) LQ.score++; record(q, ok); renderLQ();
  });
  bindBM(box);
  const nx = $("#lqnext"); if (nx) nx.onclick = () => { LQ.i++; LQ.picked = null; renderLQ(); window.scrollTo(0,0); };
}

function bindBM(root){
  root.querySelectorAll("[data-bm]").forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    const id = b.dataset.bm; if (S.bm[id]) delete S.bm[id]; else S.bm[id] = 1; save();
    b.setAttribute("aria-pressed", S.bm[id] ? "true":"false"); b.textContent = S.bm[id] ? "★" : "☆";
  });
}

   PRACTICE
   ============================================================ */
let PF = "all", PSHOW = 20, PORDER = null, PPERM = {}, PPICK = {};
function practiceList(){
  let list = QS;
  if (PF === "pyq") list = QS.filter(q => q.p);
  else if (PF === "hot") list = QS.filter(q => (L(q.t).heat||1) === 3);
  else if (PF === "wrong") list = QS.filter(q => S.ans[q.id] === 0);
  else if (PF === "new") list = QS.filter(q => S.ans[q.id] === undefined);
  else if (PF === "bm") list = QS.filter(q => S.bm[q.id]);
  else if (PF !== "all") list = QS.filter(q => q.t === PF);
  if (PORDER) { const pos = new Map(PORDER.map((id,i)=>[id,i])); list = list.slice().sort((a,b)=>(pos.get(a.id)??0)-(pos.get(b.id)??0)); }
  return list;
}
function renderPractice(){
  const wrongN = QS.filter(q => S.ans[q.id] === 0).length, bmN = QS.filter(q=>S.bm[q.id]).length, pyqN = QS.filter(q=>q.p).length;
  const chips = [["all",`All ${QS.length}`],["new","Not tried"],["wrong",`Mistakes ${wrongN}`],["hot",`🔥 Hot topics ${QS.filter(q=>(L(q.t).heat||1)===3).length}`],["pyq",`PYQ ${pyqN}`],["bm",`Starred ${bmN}`]].concat(LESSONS.map((l,i)=>[l.id,`L${i+1} ${l.title}`]));
  const list = practiceList();
  $("#app").innerHTML = `<section class="view stack">
    <div class="stack" style="gap:6px"><span class="eyebrow">Question bank</span><h1>Practice</h1>
    <p class="muted">Tap an option to check it. Wrong answers go to <b>Mistakes</b> until you get them right.</p></div>
    <div class="chips" role="group" aria-label="Filter">${chips.map(c=>`<button type="button" class="chip" data-f="${c[0]}" aria-pressed="${PF===c[0]}">${esc(c[1])}</button>`).join("")}</div>
    <div class="row between"><span class="muted num" style="font-size:13px">${list.length} questions</span>
      <div class="row"><button class="btn sm ghost" type="button" id="pshuf">${PORDER?"In order":"Shuffle"}</button></div></div>
    <div class="stack" id="plist"></div>
  </section>`;
  $("#app").querySelectorAll("[data-f]").forEach(b => b.onclick = () => { PF = b.dataset.f; PSHOW = 20; PPICK = {}; renderPractice(); });
  $("#pshuf").onclick = () => { PORDER = PORDER ? null : shuffle(QS.map(q=>q.id)); PSHOW = 20; renderPractice(); };
  const chipOn = $(`.chip[aria-pressed="true"]`); if (chipOn) chipOn.scrollIntoView({block:"nearest", inline:"center"});
  drawPList();
}
function pCard(q, idx){
  if (!PPERM[q.id]) PPERM[q.id] = makePerm(q);
  const picked = PPICK[q.id]; const reveal = picked !== undefined;
  return `<article class="qcard" data-q="${q.id}">${metaHTML(q, "Q"+(idx+1))}<p class="qt">${esc(q.q)}</p>
    <div class="opts">${optsHTML(q, PPERM[q.id], {picked: reveal?picked:null, reveal})}</div>${reveal?expHTML(q,picked):""}</article>`;
}
function drawPList(){
  const list = practiceList(), box = $("#plist");
  if (!list.length) { box.innerHTML = `<p class="empty">${PF==="wrong"?"No mistakes saved. Answer some questions first, or you've cleared them all.":PF==="bm"?"Nothing starred yet. Tap ☆ on any question.":"Nothing here."}</p>`; return; }
  box.innerHTML = list.slice(0, PSHOW).map((q,i)=>pCard(q,i)).join("") + (list.length > PSHOW ? `<button class="btn" type="button" id="pmore">Show 20 more (${list.length-PSHOW} left)</button>` : "");
  bindP(box);
  const more = $("#pmore"); if (more) more.onclick = () => { PSHOW += 20; drawPList(); };
}
function bindP(box){ box.querySelectorAll(".qcard").forEach(bindCard); }
function bindCard(card){
  card.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const q = QS.find(x => x.id === card.dataset.q); if (PPICK[q.id] !== undefined) return;
    PPICK[q.id] = +b.dataset.oi; record(q, PPICK[q.id] === q.a);
    const idx = +card.querySelector(".qno").textContent.slice(1) - 1;
    const tmp = document.createElement("div"); tmp.innerHTML = pCard(q, idx); const nc = tmp.firstElementChild;
    card.replaceWith(nc); bindCard(nc);
  });
  bindBM(card);
}

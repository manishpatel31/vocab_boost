{"id":"R1","heat":3,"title":"Cropping seasons: kharif, rabi and zaid","hi":"फ़सल ऋतुएँ: ख़रीफ़, रबी और ज़ायद","blocks":[{"k":"hot","h":"The commonest agriculture question: <b>“Which of these is a rabi / kharif crop?”<\/b> Rice, maize, cotton, soybean, groundnut are <b>kharif<\/b>; wheat, barley, gram, mustard are <b>rabi<\/b>; watermelon and cucumber are <b>zaid<\/b>."},{"k":"story","h":"<p>India's farm year follows the monsoon. When the rains arrive in <b>June–July<\/b>, farmers sow the <b>kharif<\/b> crops — rice, maize, jowar, bajra, cotton, jute, groundnut and soybean — and harvest them in <b>September–October<\/b>. Kharif comes from an Arabic word for autumn.<\/p><p>As the rains end, the <b>rabi<\/b> crops go in during <b>October–December<\/b> — wheat, barley, gram, peas and mustard — and are cut in <b>March–April<\/b>; winter rain from western disturbances helps them. In the short summer gap (<b>March–June<\/b>) comes <b>zaid<\/b>: watermelon, muskmelon, cucumber, vegetables and fodder.<\/p>","key":"Kharif = monsoon (June → October): rice, cotton. Rabi = winter (October → April): wheat, mustard. Zaid = summer gap: melons."},{"k":"facts","title":"The three seasons","rows":[["Kharif","Sown June–July with the monsoon; harvested September–October"],["Rabi","Sown October–December; harvested March–April"],["Zaid","Between rabi and kharif, roughly March–June"],["Sesamum (til)","Kharif in the north, rabi in the south"],["Sugarcane","Not seasonal — takes about a year in the field"],["Aus, Aman, Boro","The three rice crops of West Bengal (autumn, winter, summer)"]]},{"k":"info","title":"The crop calendar","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 230\" role=\"img\" aria-label=\"Kharif, rabi and zaid across the year\">\n  <text x=\"133\" y=\"20\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">Jan<\/text><line x1=\"110\" y1=\"28\" x2=\"110\" y2=\"200\" class=\"grid\"/><text x=\"180\" y=\"20\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">Feb<\/text><line x1=\"157\" y1=\"28\" x2=\"157\" y2=\"200\" class=\"grid\"/><text x=\"227\" y=\"20\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">Mar<\/text><line x1=\"204\" y1=\"28\" x2=\"204\" y2=\"200\" class=\"grid\"/><text x=\"274\" y=\"20\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">Apr<\/text><line x1=\"251\" y1=\"28\" x2=\"251\" y2=\"200\" class=\"grid\"/><text x=\"321\" y=\"20\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">May<\/text><line x1=\"298\" y1=\"28\" x2=\"298\" y2=\"200\" class=\"grid\"/><text x=\"368\" y=\"20\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">Jun<\/text><line x1=\"345\" y1=\"28\" x2=\"345\" y2=\"200\" class=\"grid\"/><text x=\"415\" y=\"20\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">Jul<\/text><line x1=\"392\" y1=\"28\" x2=\"392\" y2=\"200\" class=\"grid\"/><text x=\"462\" y=\"20\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">Aug<\/text><line x1=\"439\" y1=\"28\" x2=\"439\" y2=\"200\" class=\"grid\"/><text x=\"509\" y=\"20\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">Sep<\/text><line x1=\"486\" y1=\"28\" x2=\"486\" y2=\"200\" class=\"grid\"/><text x=\"556\" y=\"20\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">Oct<\/text><line x1=\"533\" y1=\"28\" x2=\"533\" y2=\"200\" class=\"grid\"/><text x=\"603\" y=\"20\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">Nov<\/text><line x1=\"580\" y1=\"28\" x2=\"580\" y2=\"200\" class=\"grid\"/><text x=\"650\" y=\"20\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">Dec<\/text><line x1=\"627\" y1=\"28\" x2=\"627\" y2=\"200\" class=\"grid\"/>\n  <text x=\"100\" y=\"60\" text-anchor=\"end\" font-size=\"14\" class=\"b\" style=\"fill:#2f8f4e\">Kharif<\/text><rect x=\"368.5\" y=\"40\" width=\"225.60000000000002\" height=\"30\" rx=\"8\" fill=\"#2f8f4e\" class=\"anim-in\" style=\"animation-delay:0ms\"/><text x=\"376.5\" y=\"85\" font-size=\"10.5\" class=\"mut\">Rice, maize, jowar, bajra, cotton, jute, groundnut, soybean<\/text><text x=\"100\" y=\"115\" text-anchor=\"end\" font-size=\"14\" class=\"b\" style=\"fill:#c69214\">Rabi<\/text><rect x=\"556.5\" y=\"95\" width=\"117.5\" height=\"30\" rx=\"8\" fill=\"#c69214\" class=\"anim-in\" style=\"animation-delay:150ms\"/><rect x=\"110\" y=\"95\" width=\"164.5\" height=\"30\" rx=\"8\" fill=\"#c69214\" class=\"anim-in\" style=\"animation-delay:150ms\"/><text x=\"118\" y=\"140\" font-size=\"10.5\" class=\"mut\">Wheat, barley, gram, mustard, peas, masoor<\/text><text x=\"100\" y=\"170\" text-anchor=\"end\" font-size=\"14\" class=\"b\" style=\"fill:#c0503a\">Zaid<\/text><rect x=\"227.5\" y=\"150\" width=\"164.5\" height=\"30\" rx=\"8\" fill=\"#c0503a\" class=\"anim-in\" style=\"animation-delay:300ms\"/><text x=\"235.5\" y=\"195\" font-size=\"10.5\" class=\"mut\">Watermelon, muskmelon, cucumber, fodder<\/text>\n  <text x=\"110\" y=\"222\" font-size=\"11\" class=\"mut\">Bars run from sowing to harvest.<\/text><\/svg><\/figure>","cap":"Kharif rides the south-west monsoon; rabi grows through the cool winter on stored moisture and irrigation; zaid fills the short summer gap."},{"k":"table","title":"Which season is each crop?","head":["Crop","Season","Note"],"rows":[["Rice (paddy)","Kharif","Sown with the monsoon (June–July), harvested in autumn."],["Maize","Kharif","Also grown as a rabi crop in Bihar."],["Jowar","Kharif",""],["Bajra","Kharif",""],["Ragi","Kharif",""],["Cotton","Kharif",""],["Jute","Kharif",""],["Groundnut","Kharif","Mostly a kharif oilseed."],["Soybean","Kharif",""],["Arhar (tur)","Kharif",""],["Urad","Kharif",""],["Wheat","Rabi","Sown October–December, harvested March–April."],["Barley","Rabi",""],["Gram (chana)","Rabi","India's most important pulse."],["Mustard","Rabi",""],["Peas","Rabi",""],["Linseed","Rabi",""],["Masoor (lentil)","Rabi",""],["Watermelon","Zaid","Zaid = the short summer season between rabi and kharif (March–June)."],["Muskmelon","Zaid",""],["Cucumber","Zaid",""],["Fodder crops (summer)","Zaid",""],["Sugarcane","Perennial (about a year)","Stays in the field for about 10–18 months."],["Tea","Perennial (about a year)","A plantation bush plucked for many years."]]},{"k":"indiamap","title":"Tap a state — the crops it leads in and its breeds","cap":"Built from the lessons' tables. Revise has a Map quiz on the same list."},{"k":"table","title":"Hindi name → English name","head":["Hindi name","English name","Note"],"rows":[["Gehun","Wheat",""],["Jau","Barley",""],["Makka","Maize",""],["Jowar","Sorghum",""],["Bajra","Pearl millet",""],["Ragi (mandua)","Finger millet","Very rich in calcium."],["Kangni","Foxtail millet",""],["Chana","Chickpea (gram)",""],["Arhar (tur)","Pigeon pea",""],["Masoor","Lentil",""],["Moong","Green gram",""],["Urad","Black gram",""],["Sarson","Mustard",""],["Til","Sesame (sesamum)",""],["Alsi","Linseed (flax)",""],["Mungphali","Groundnut",""],["Kapas","Cotton",""],["Ganna","Sugarcane",""]]},{"k":"trick","h":"<b>Kharif = Khet + Rain<\/b> — monsoon crops. <b>Rabi = Ravi (winter sun)<\/b> — wheat and mustard. Kharif four: <b>“Rice Makes Cotton Grow”<\/b> — Rice, Maize, Cotton, Groundnut. Rabi four: <b>“We Buy Good Mustard”<\/b> — Wheat, Barley, Gram, Mustard."},{"k":"trap","h":"<b>Gram (chana) is rabi<\/b>, but <b>arhar, moong and urad are kharif<\/b>. <b>Maize<\/b> is mainly kharif, though Bihar grows it in rabi too. <b>Sugarcane<\/b> is not a seasonal crop at all."}],"sum":["Kharif crops are sown with the monsoon (June–July) and harvested September–October.","Rabi crops are sown October–December and harvested March–April.","Zaid crops grow in the short summer between rabi and kharif.","Kharif: rice, maize, jowar, bajra, cotton, jute, groundnut, soybean, arhar.","Rabi: wheat, barley, gram, peas, mustard, linseed, masoor."],"part":["Part 1 · Seasons and crops","फ़सल ऋतुएँ और फ़सलें"],"g":"ag"},
{"id":"R2","heat":3,"title":"Food crops: climate, soil and leading states","hi":"खाद्य फ़सलें: जलवायु, मिट्टी और अग्रणी राज्य","blocks":[{"k":"hot","h":"Asked often: <b>the climate a crop needs<\/b> (rice — over 100 cm rain; wheat — 50–75 cm; cotton — black soil, 210 frost-free days) and <b>the top state<\/b> (wheat — UP, bajra — Rajasthan, pulses — MP)."},{"k":"story","h":"<p><b>Rice<\/b> is India's main food crop and needs heat (above 25°C), humidity and over 100 cm of rain — or canals in dry Punjab and Haryana. <b>Wheat<\/b> is the second; it wants a cool growing season and bright sun at ripening, with 50–75 cm of rain. India is the world's <b>second-largest<\/b> producer of both rice and wheat (after China) and the <b>largest exporter of rice<\/b>.<\/p><p><b>Millets<\/b> — jowar, bajra and ragi — are 'coarse grains' that grow in dry, poor soils and are rich in nutrients. India is the world's largest producer of millets and of <b>pulses<\/b> (also the largest consumer and importer of pulses). Pulses are legumes: their roots fix nitrogen, so they restore soil fertility.<\/p>","key":"Rice >100 cm rain; wheat 50–75 cm; millets dry soils; pulses fix nitrogen. UP–wheat, Rajasthan–bajra, MP–pulses."},{"k":"table","title":"What each crop needs","head":["Crop","Climate and soil","Note"],"rows":[["Rice","Above 25°C, high humidity, over 100 cm rain","Grows best in clayey alluvial soil; needs standing water."],["Wheat","Cool growing season, bright sun at ripening, 50–75 cm rain","Two zones: the Ganga–Satluj plains and the black-soil Deccan."],["Maize","21–27°C and old alluvial soil","Used as food and fodder."],["Bajra","Sandy soils and shallow black soil, very dry",""],["Pulses","Little moisture; they fix nitrogen in the soil","Leguminous — so they are rotated with other crops."],["Sugarcane","21–27°C, 75–100 cm rain, hot and humid","Can grow on many soils; needs heavy manure and labour."],["Cotton","Black soil, 210 frost-free days, bright sunshine","The Deccan plateau's black (regur) soil is ideal."],["Jute","Flood plains where the soil is renewed every year, high temperature","Called the 'golden fibre'."],["Tea","Warm, moist, frost-free; well-drained slopes rich in humus","Needs frequent showers all year and a lot of cheap labour."],["Coffee","Hill slopes with shade, warm and wet","Arabica coffee was first grown in the Baba Budan Hills."],["Rubber","Over 200 cm rain and above 25°C — moist equatorial climate",""]]},{"k":"photos","title":"Food crops in pictures","items":[["Rice","Rice","Kharif · 100+ cm rain"],["Wheat","Wheat","Rabi · cool, then warm and dry"],["Maize","Maize","Kharif"],["Sorghum","Sorghum","Jowar"],["Pearl_millet","Pearl millet","Bajra"],["Finger_millet","Finger millet","Ragi"],["Chickpea","Chickpea","Gram (chana)"],["Pigeon_pea","Pigeon pea","Arhar (tur)"]]},{"k":"table","title":"Leading state (2023–24 estimates)","head":["Crop","Leading state","Note"],"rows":[["Wheat","Uttar Pradesh","UP leads every year; then Madhya Pradesh and Punjab."],["Bajra","Rajasthan","Rajasthan grows nearly half of India's bajra."],["Jowar","Maharashtra",""],["Ragi","Karnataka",""],["Gram (chana)","Madhya Pradesh",""],["Pulses (all together)","Madhya Pradesh","MP is called the 'pulse bowl'."],["Barley","Rajasthan",""]]},{"k":"mapfig","title":"Which state leads in food crops","marks":[["UP","Wheat"],["RJ","Bajra · Barley"],["MH","Jowar"],["KA","Ragi"],["MP","Gram · Pulses"]],"cap":"2023–24 estimates. Uttar Pradesh leads in wheat; Rajasthan in bajra and barley; Madhya Pradesh in gram and pulses."},{"k":"facts","title":"Soils and crops (see the Indian Geography app for soils)","rows":[["Alluvial soil","Rice, wheat, sugarcane — the northern plains"],["Black (regur) soil","Cotton — Deccan plateau; holds moisture"],["Red soil","Millets, pulses, groundnut"],["Laterite soil","Tea, coffee, cashew (with manure)"],["Arid (desert) soil","Bajra, and other crops once irrigated"],["Rice — leading state","West Bengal in most years, with UP and Punjab close (rankings shift)"]]},{"k":"trick","h":"Rain ladder: <b>Rubber 200+ → Rice 100+ → Sugarcane 75–100 → Wheat 50–75<\/b>. Millets map: <b>“Ra-Ba, Ma-Jo, Ka-Ra”<\/b> — Rajasthan Bajra, Maharashtra Jowar, Karnataka Ragi."},{"k":"trap","h":"<b>Jowar<\/b> leader is <b>Maharashtra<\/b>, not Rajasthan (Rajasthan leads <b>bajra<\/b>). The top <b>rice<\/b> state changes from year to year — learn that West Bengal is traditionally first but don't trust a fixed ranking."}],"sum":["Rice needs over 100 cm rain and above 25°C; wheat needs a cool season and 50–75 cm.","India is second in rice and wheat (after China) and the largest rice exporter.","India is the largest producer of millets and of pulses.","Wheat — UP; bajra — Rajasthan; jowar — Maharashtra; ragi — Karnataka; pulses — MP.","Black soil suits cotton; alluvial soil suits rice, wheat and sugarcane."],"part":["Part 1 · Seasons and crops","फ़सल ऋतुएँ और फ़सलें"],"g":"ag"},
{"id":"R3","heat":2,"title":"Cash and fibre crops: sugarcane, cotton, jute, oilseeds","hi":"नक़दी और रेशा फ़सलें: गन्ना, कपास, जूट, तिलहन","blocks":[{"k":"hot","h":"Know the <b>top state<\/b> for each (sugarcane — UP, cotton — Gujarat, jute — West Bengal, groundnut — Gujarat, mustard — Rajasthan, soybean — MP) and <b>which part of the plant<\/b> gives each fibre."},{"k":"story","h":"<p><b>Sugarcane<\/b> is a tropical and subtropical crop; India is the world's second-largest producer after Brazil, and <b>Uttar Pradesh<\/b> grows the most. It gives sugar, gur and khandsari, and its molasses goes into ethanol. <b>Cotton<\/b> loves the black soil of the Deccan; <b>Gujarat<\/b> and <b>Maharashtra<\/b> lead. <b>Jute<\/b>, the 'golden fibre', grows in the flood plains of the Ganga–Brahmaputra delta — <b>West Bengal<\/b> grows over half.<\/p><p><b>Oilseeds<\/b> cover a large area: <b>groundnut<\/b> (mostly kharif, Gujarat), <b>mustard<\/b> (rabi, Rajasthan), <b>soybean<\/b> (kharif, Madhya Pradesh — the 'Soya State'), sesamum, castor, sunflower and linseed. India still imports much of its edible oil.<\/p>","key":"UP–sugarcane; Gujarat–cotton and groundnut; WB–jute; Rajasthan–mustard; MP–soybean."},{"k":"table","title":"Leading state (2023–24 estimates)","head":["Crop","Leading state","Note"],"rows":[["Sugarcane","Uttar Pradesh","Then Maharashtra and Karnataka."],["Cotton","Gujarat","Maharashtra has the largest cotton area."],["Jute","West Bengal","Over half of India's jute; then Bihar and Assam."],["Groundnut","Gujarat",""],["Rapeseed and mustard","Rajasthan",""],["Soybean","Madhya Pradesh","MP is called the 'Soya State'."],["Castor seed","Gujarat",""],["Raw silk (mulberry)","Karnataka",""]]},{"k":"mapfig","title":"Which state leads in cash and fibre crops","marks":[["UP","Sugarcane"],["GJ","Cotton · Groundnut · Castor seed"],["WB","Jute"],["RJ","Rapeseed and mustard"],["MP","Soybean"],["KA","Raw silk"]],"cap":"2023–24 estimates. Gujarat leads in cotton, groundnut and castor; West Bengal in jute; UP in sugarcane."},{"k":"table","title":"Where each fibre comes from","head":["Fibre","Comes from","Note"],"rows":[["Cotton","Hairs on the seed (inside the boll)","The boll is picked; ginning separates fibre from seed."],["Jute","Stem (bast fibre)","Stems are soaked in water — 'retting' — to loosen the fibre."],["Coir","Husk of the coconut","Kerala is the centre of the coir industry."],["Silk","Cocoon of the silkworm","Rearing silkworms is sericulture."],["Wool","Fleece of sheep (and goats)",""],["Pashmina","Undercoat of the Changthangi goat","From Ladakh."]]},{"k":"photos","title":"Cash crops in pictures","items":[["Sugarcane","Sugarcane","UP leads"],["Cotton","Cotton","Gujarat leads · black soil"],["Jute","Jute","West Bengal · the golden fibre"],["Peanut","Peanut","Groundnut — Gujarat"],["Mustard_plant","Mustard plant","Rajasthan"],["Soybean","Soybean","Madhya Pradesh"]]},{"k":"trick","h":"<b>“G-G-C”<\/b> — Gujarat grows Groundnut, Cotton and Castor. <b>Jute = Bengal's Gold<\/b>; <b>Cotton = White Gold<\/b>."},{"k":"trap","h":"<b>Maharashtra<\/b> has the largest <b>area<\/b> under cotton, but <b>Gujarat<\/b> usually has the most <b>production<\/b>. India is <b>second<\/b> in sugarcane — <b>Brazil<\/b> is first."}],"sum":["Sugarcane — UP leads; India is second in the world after Brazil.","Cotton grows best in black soil with 210 frost-free days; Gujarat leads production.","Jute (golden fibre) — West Bengal; fibre comes from the stem after retting.","Groundnut — Gujarat; mustard — Rajasthan; soybean — Madhya Pradesh.","Cotton comes from seed hairs, coir from coconut husk, silk from silkworm cocoons."],"part":["Part 1 · Seasons and crops","फ़सल ऋतुएँ और फ़सलें"],"g":"ag"},
{"id":"R4","heat":2,"title":"Plantation crops, spices and horticulture","hi":"बागान फ़सलें, मसाले और बाग़वानी","blocks":[{"k":"hot","h":"Asked often: <b>tea — Assam, coffee — Karnataka, rubber — Kerala<\/b>; <b>black pepper = King of spices, cardamom = Queen of spices<\/b>; and the home of Indian coffee — the <b>Baba Budan Hills<\/b>."},{"k":"story","h":"<p>The British brought <b>tea<\/b> to Assam's hills in the 1830s; today <b>Assam<\/b> grows over half of India's tea and India is the world's second-largest producer after China. <b>Coffee<\/b> came first — legend says Baba Budan carried Arabica beans from Yemen to the <b>Baba Budan Hills<\/b> of Karnataka. <b>Karnataka<\/b> grows about 70% of India's coffee. <b>Rubber<\/b> is an equatorial crop of <b>Kerala<\/b>.<\/p><p>India is the largest producer, consumer and exporter of <b>spices<\/b>; Kerala is called the 'Spice Garden of India'. India is also second in the world in fruits and vegetables. Saffron grows at <b>Pampore<\/b> in Kashmir.<\/p>","key":"Tea–Assam, coffee–Karnataka, rubber–Kerala, saffron–J&K. Pepper = king, cardamom = queen."},{"k":"table","title":"Leading state (2023–24 estimates)","head":["Crop","Leading state","Note"],"rows":[["Tea","Assam","Over half of India's tea; then West Bengal (Darjeeling, Dooars)."],["Coffee","Karnataka","About 70% of India's coffee (Kodagu, Chikkamagaluru)."],["Natural rubber","Kerala","Rubber Board — Kottayam."],["Small cardamom","Kerala","Idukki district."],["Saffron","Jammu and Kashmir","Pampore is the 'saffron town'."],["Apple","Jammu and Kashmir","Then Himachal Pradesh."],["Red chilli","Andhra Pradesh","Guntur is famous for chillies."],["Mango","Uttar Pradesh",""],["Potato","Uttar Pradesh",""],["Onion","Maharashtra","Lasalgaon (Nashik) is Asia's biggest onion market."],["Grapes","Maharashtra","Nashik is called the grape capital of India."],["Cashew","Maharashtra",""]]},{"k":"mapfig","title":"Which state leads in plantation crops, spices and fruit","marks":[["AS","Tea"],["KA","Coffee"],["KL","Natural rubber · Small cardamom"],["JK","Saffron · Apple"],["AP","Red chilli"],["UP","Mango · Potato"],["MH","Onion · Grapes · Cashew"]],"cap":"2023–24 estimates. Assam — tea; Karnataka — coffee; Kerala — rubber and cardamom; J&K — saffron and apples; Maharashtra — onion, grapes and cashew."},{"k":"table","title":"Famous nicknames","head":["Nickname","Crop","Note"],"rows":[["King of spices","Black pepper",""],["Queen of spices","Small cardamom",""],["Golden fibre","Jute",""],["White gold","Cotton",""],["Red gold","Saffron","The costliest spice by weight."],["Green gold","Bamboo",""],["Miracle rice","IR-8","High-yielding rice of the Green Revolution, from IRRI (Philippines)."],["Shree Anna (nutri-cereals)","Millets","Name used in the 2023–24 Budget."]]},{"k":"photos","title":"Plantation crops and spices in pictures","items":[["Tea","Tea","Assam"],["Coffee","Coffee","Karnataka"],["Natural_rubber","Rubber","Kerala"],["Elettaria_cardamomum","Cardamom","Cardamom — Kerala"],["Saffron","Saffron","Kashmir"],["Black_pepper","Black pepper","Kerala"],["Cashew","Cashew","Maharashtra"],["Coconut","Coconut","Kerala"]]},{"k":"facts","title":"Plantation farming","rows":[["What it is","One crop grown on a large estate with big capital and hired labour"],["Main plantation crops","Tea, coffee, rubber, sugarcane, banana, coconut"],["Tea regions","Assam, Darjeeling and Dooars (WB), Nilgiris (TN), Kerala"],["Coffee varieties","Arabica (best known) and Robusta"],["Spices Board","Kochi, Kerala"],["India in spices","Largest producer, consumer and exporter"]]},{"k":"trick","h":"<b>“A-K-K”<\/b> for the plantation trio: <b>A<\/b>ssam tea, <b>K<\/b>arnataka coffee, <b>K<\/b>erala rubber. <b>King Pepper, Queen Cardamom<\/b>."},{"k":"trap","h":"<b>Coffee<\/b> is led by <b>Karnataka<\/b>, not Kerala. Arabica beans came from <b>Yemen<\/b>. Darjeeling tea is in <b>West Bengal<\/b>, not Assam."}],"sum":["Tea — Assam; coffee — Karnataka; natural rubber — Kerala.","Coffee began in the Baba Budan Hills of Karnataka (Arabica from Yemen).","Black pepper is the King of spices; small cardamom the Queen of spices.","India is the largest producer, consumer and exporter of spices.","Saffron and apple — Jammu and Kashmir; onion and grapes — Maharashtra."],"part":["Part 1 · Seasons and crops","फ़सल ऋतुएँ और फ़सलें"],"g":"ag"},
{"id":"R5","heat":2,"title":"Types of farming and shifting cultivation","hi":"कृषि के प्रकार और स्थानांतरी खेती","blocks":[{"k":"hot","h":"Two favourites: <b>the local names of shifting cultivation<\/b> (Jhum — north-east, Podu — Andhra, Bewar — MP, Kuruwa — Jharkhand) and <b>the '-culture' words<\/b> (sericulture — silk, apiculture — bees, viticulture — grapes)."},{"k":"story","h":"<p>In <b>shifting cultivation<\/b> ('slash and burn'), a patch of forest is cut and burnt, crops are grown on the ash for a few years, and when the soil tires the farmers move on and let the forest grow back. It is <b>primitive subsistence<\/b> farming — grown to feed the family. In India it has many local names; in the north-east it is <b>jhum<\/b>. Abroad it is <b>milpa<\/b> (Mexico), <b>roca<\/b> (Brazil) and <b>ladang<\/b> (Indonesia).<\/p><p><b>Intensive subsistence<\/b> farming uses a small plot with heavy labour and inputs. <b>Commercial<\/b> farming grows crops for sale; <b>plantation<\/b> farming is its estate form (tea, coffee, rubber). <b>Mixed farming<\/b> combines crops with livestock. <b>Terrace farming<\/b> cuts steps into hill slopes to stop soil erosion.<\/p>","key":"Slash and burn = jhum (NE), podu (AP), bewar (MP), kuruwa (Jharkhand); milpa (Mexico), roca (Brazil), ladang (Indonesia)."},{"k":"table","title":"Shifting cultivation in India","head":["Local name","Region / state","Note"],"rows":[["Jhum (jhumming)","North-eastern states","Assam, Meghalaya, Mizoram, Nagaland and others."],["Podu or Penda","Andhra Pradesh",""],["Bewar or Dahiya","Madhya Pradesh",""],["Pama Dabi, Koman or Bringa","Odisha",""],["Kumari","Western Ghats",""],["Valre or Waltre","South-eastern Rajasthan",""],["Khil","Himalayan belt",""],["Kuruwa","Jharkhand",""]]},{"k":"mapfig","title":"Shifting cultivation has a different name in each region","marks":[["NL","Jhum",0,-6],["MZ","Jhum"],["AP","Podu · Penda"],["MP","Bewar · Dahiya"],["OD","Pama Dabi · Koman · Bringa"],["KL","Kumari",-10,0],["RJ","Valre · Waltre",10,40],["UT","Khil"],["JH","Kuruwa"]],"cap":"Slash-and-burn farming: a patch of forest is cleared and burnt, farmed for a few years and left to recover. Jhum is the north-east's name for it."},{"k":"table","title":"Shifting cultivation abroad","head":["Name","Country / region","Note"],"rows":[["Milpa","Mexico and Central America",""],["Conuco","Venezuela",""],["Roca","Brazil",""],["Masole","Central Africa",""],["Ladang","Indonesia","Also used in Malaysia."],["Ray","Vietnam",""]]},{"k":"table","title":"The '-culture' words","head":["Term","What is raised","Note"],"rows":[["Sericulture","Silkworms (silk)",""],["Apiculture","Honeybees",""],["Pisciculture","Fish",""],["Viticulture","Grapes",""],["Floriculture","Flowers",""],["Olericulture","Vegetables",""],["Pomology","Fruits",""],["Vermiculture","Earthworms (for compost)",""],["Silviculture","Forest trees",""],["Mariculture","Marine organisms in sea water",""],["Lac culture","Lac insects",""],["Horticulture","Fruits, vegetables and flowers together",""]]},{"k":"trick","h":"<b>“Very Grapey Vines”<\/b> — viticulture = grapes. <b>“Apis”<\/b> is the Latin for bee → apiculture. <b>“Pisces”<\/b> = fish → pisciculture. <b>“Seri”<\/b> = silk → sericulture. <b>“Olera”<\/b> = vegetables."},{"k":"trap","h":"<b>Horticulture<\/b> is the whole garden group; <b>pomology<\/b> is only fruits and <b>olericulture<\/b> only vegetables. <b>Vermiculture<\/b> is earthworms, not worms for silk."}],"sum":["Shifting cultivation = slash and burn; jhum in north-east India.","Podu (Andhra Pradesh), Bewar (MP), Kumari (Western Ghats), Kuruwa (Jharkhand), Khil (Himalaya).","Abroad: milpa (Mexico), conuco (Venezuela), roca (Brazil), ladang (Indonesia), ray (Vietnam).","Plantation = one crop on a large estate; mixed farming = crops plus livestock.","Sericulture — silk; apiculture — bees; pisciculture — fish; viticulture — grapes."],"part":["Part 2 · Farming, revolutions, water and animals","खेती, क्रांतियाँ, सिंचाई और पशुपालन"],"g":"ag"},
{"id":"R6","heat":3,"title":"Agricultural revolutions","hi":"कृषि क्रांतियाँ","blocks":[{"k":"hot","h":"Pure matching questions: <b>revolution → product<\/b> (white — milk, blue — fish, yellow — oilseeds, round — potato, silver — eggs) and <b>revolution → father<\/b> (Swaminathan — Green in India, Kurien — White)."},{"k":"story","h":"<p>In the mid-1960s India faced food shortages. High-yielding <b>wheat<\/b> seeds bred by <b>Norman Borlaug<\/b> in Mexico, with fertilisers and irrigation, transformed Punjab, Haryana and western UP. <b>M. S. Swaminathan<\/b> led the effort in India and is called the father of India's <b>Green Revolution<\/b>; IR-8 rice from the Philippines followed. Borlaug won the Nobel Peace Prize in 1970.<\/p><p>Then came milk. <b>Verghese Kurien<\/b> built the Amul cooperative at Anand and, as head of the <b>NDDB<\/b>, ran <b>Operation Flood<\/b> from 1970 — the <b>White Revolution<\/b> that made India the world's largest milk producer. Other colours followed for fish (blue), oilseeds (yellow), eggs (silver), potato (round) and more.<\/p>","key":"Green — foodgrains (Borlaug/Swaminathan); White — milk (Kurien, Operation Flood 1970); Blue — fish; Yellow — oilseeds."},{"k":"table","title":"Revolution → what it boosted","head":["Revolution","Product","Note"],"rows":[["Green Revolution","Foodgrains (wheat and rice)","High-yielding seeds, fertilisers and irrigation from the mid-1960s."],["White Revolution","Milk","Operation Flood, 1970."],["Blue Revolution","Fish (aquaculture)",""],["Yellow Revolution","Oilseeds","Especially mustard and sunflower."],["Pink Revolution","Onions and prawns (also pharmaceuticals)","Books differ — onion and prawns are the usual answers."],["Golden Revolution","Horticulture (fruits) and honey",""],["Golden Fibre Revolution","Jute",""],["Silver Revolution","Eggs and poultry",""],["Silver Fibre Revolution","Cotton",""],["Round Revolution","Potato",""],["Grey Revolution","Fertilisers",""],["Red Revolution","Meat and tomatoes",""],["Black Revolution","Petroleum (ethanol and biodiesel)",""],["Brown Revolution","Leather (and cocoa)",""],["Sweet Revolution","Honey (beekeeping)",""],["Purple Revolution","Lavender","Under the Aroma Mission, mainly in Jammu and Kashmir."],["Evergreen Revolution","Lasting growth of all farm output","M. S. Swaminathan's idea — more output without harming the soil."]]},{"k":"info","title":"The revolutions by colour","html":"<div class=\"fam\"><div><span aria-hidden=\"true\" style=\"display:block;height:24px;border-radius:6px;background:#2f8f4e;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Green Revolution<\/b><small>Foodgrains (wheat and rice)<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:24px;border-radius:6px;background:#f4f1ea;border:1px solid rgba(0,0,0,.15)\"><\/span><b>White Revolution<\/b><small>Milk<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:24px;border-radius:6px;background:#2f6db5;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Blue Revolution<\/b><small>Fish (aquaculture)<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:24px;border-radius:6px;background:#f2c14e;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Yellow Revolution<\/b><small>Oilseeds<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:24px;border-radius:6px;background:#e88aa6;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Pink Revolution<\/b><small>Onions and prawns (also pharmaceuticals)<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:24px;border-radius:6px;background:#d4a017;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Golden Revolution<\/b><small>Horticulture (fruits) and honey<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:24px;border-radius:6px;background:#c9a35a;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Golden Fibre Revolution<\/b><small>Jute<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:24px;border-radius:6px;background:#c0c0c0;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Silver Revolution<\/b><small>Eggs and poultry<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:24px;border-radius:6px;background:#d9d9d9;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Silver Fibre Revolution<\/b><small>Cotton<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:24px;border-radius:6px;background:#a9805a;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Round Revolution<\/b><small>Potato<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:24px;border-radius:6px;background:#8a8a8a;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Grey Revolution<\/b><small>Fertilisers<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:24px;border-radius:6px;background:#c0392b;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Red Revolution<\/b><small>Meat and tomatoes<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:24px;border-radius:6px;background:#222;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Black Revolution<\/b><small>Petroleum (ethanol and biodiesel)<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:24px;border-radius:6px;background:#7a4a22;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Brown Revolution<\/b><small>Leather (and cocoa)<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:24px;border-radius:6px;background:#f6b73c;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Sweet Revolution<\/b><small>Honey (beekeeping)<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:24px;border-radius:6px;background:#7d4fb5;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Purple Revolution<\/b><small>Lavender<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:24px;border-radius:6px;background:#1f6b3a;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Evergreen Revolution<\/b><small>Lasting growth of all farm output<\/small><\/div><\/div>","cap":"Green — foodgrains (M. S. Swaminathan); White — milk (Verghese Kurien, Operation Flood); Blue — fish; Yellow — oilseeds; Golden fibre — jute; Silver — eggs; Round — potato."},{"k":"table","title":"Fathers of the revolutions","head":["Person","Revolution","Note"],"rows":[["Norman Borlaug","Green Revolution (world)","Nobel Peace Prize 1970 for high-yielding wheat."],["M. S. Swaminathan","Green Revolution (India)","Bharat Ratna 2024 (posthumous)."],["Verghese Kurien","White Revolution","The 'Milkman of India'; led Amul and the NDDB."],["Sam Pitroda","Yellow Revolution","As listed in exam guides."],["Hiralal Chaudhuri and Arun Krishnan","Blue Revolution","As listed in exam guides."],["Nirpakh Tutej","Golden Revolution","As listed in exam guides."],["Vishal Tewari","Red Revolution","As listed in exam guides."],["Indira Gandhi","Silver Revolution","As listed in exam guides."]]},{"k":"facts","title":"Key facts","rows":[["Green Revolution began","Mid-1960s (1966–67 wheat crop) in Punjab, Haryana, western UP"],["Wheat seeds","Mexican dwarf varieties; Indian ones like Kalyan Sona and Sonalika"],["Operation Flood","1970–1996 in three phases, run by the NDDB"],["National Milk Day","26 November — Verghese Kurien's birthday"],["Rainbow Revolution","Name for all the revolutions together (National Agriculture Policy, 2000)"],["Green Revolution's side effects","Falling groundwater, soil damage, gains limited to a few crops and states"]]},{"k":"trick","h":"Colour logic: <b>White<\/b> = milk, <b>Blue<\/b> = water (fish), <b>Yellow<\/b> = mustard flowers (oilseeds), <b>Round<\/b> = potato shape, <b>Silver<\/b> = eggshell shine, <b>Grey<\/b> = fertiliser dust, <b>Red<\/b> = meat/tomato, <b>Black<\/b> = oil, <b>Brown<\/b> = leather, <b>Golden fibre<\/b> = jute, <b>Silver fibre<\/b> = cotton."},{"k":"trap","h":"<b>Golden Revolution<\/b> = horticulture/honey but <b>Golden Fibre<\/b> = jute. <b>Silver<\/b> = eggs but <b>Silver Fibre<\/b> = cotton. Borlaug is the father of the Green Revolution <b>worldwide<\/b>; Swaminathan in <b>India<\/b>."}],"sum":["Green Revolution — foodgrains; Borlaug (world), M. S. Swaminathan (India).","White Revolution — milk; Verghese Kurien; Operation Flood from 1970.","Blue — fish; Yellow — oilseeds; Silver — eggs; Round — potato.","Golden — horticulture; Golden Fibre — jute; Silver Fibre — cotton.","Grey — fertilisers; Red — meat and tomato; Black — petroleum; Brown — leather."],"part":["Part 2 · Farming, revolutions, water and animals","खेती, क्रांतियाँ, सिंचाई और पशुपालन"],"g":"ag"},
{"id":"R7","heat":2,"title":"Irrigation and river projects","hi":"सिंचाई और नदी परियोजनाएँ","blocks":[{"k":"hot","h":"Asked: <b>the largest source of irrigation<\/b> (wells and tube wells), <b>where tank irrigation is common<\/b> (peninsular India), and <b>project → river<\/b> (Bhakra — Sutlej, Hirakud — Mahanadi, Sardar Sarovar — Narmada, Tehri — Bhagirathi)."},{"k":"story","h":"<p>Only part of India's farmland is irrigated; the rest depends on the monsoon. <b>Wells and tube wells<\/b> are now the largest source — especially in Punjab, Haryana and western UP. <b>Canals<\/b> come next, from rivers such as the Ganga and Sutlej. <b>Tanks<\/b> are common in peninsular India (Tamil Nadu, Karnataka, Telangana), where hard rock holds little groundwater. The <b>Grand Anicut<\/b> (Kallanai) on the Kaveri, built by the Chola king Karikala, is among the oldest working water structures in the world.<\/p><p>After 1947 Nehru called big dams the <b>'temples of modern India'<\/b>. The <b>Damodar Valley<\/b> project (1948) was the first multipurpose project; <b>Bhakra Nangal<\/b> on the Sutlej followed. Modern methods — <b>drip<\/b> (water drop by drop at the roots) and <b>sprinkler<\/b> irrigation — save water.<\/p>","key":"Largest source: wells and tube wells. Tanks: south India. Bhakra — Sutlej; Hirakud — Mahanadi; Tehri — Bhagirathi."},{"k":"table","title":"Project → river","head":["Project","River","Note"],"rows":[["Bhakra Nangal","Sutlej","Gobind Sagar reservoir; Nehru's 'temples of modern India'."],["Hirakud","Mahanadi","Odisha; one of the world's longest earthen dams."],["Sardar Sarovar","Narmada","Gujarat."],["Tehri","Bhagirathi","Uttarakhand; India's highest dam."],["Nagarjuna Sagar","Krishna","On the Telangana–Andhra border."],["Srisailam","Krishna","Andhra Pradesh."],["Damodar Valley","Damodar","India's first multipurpose project (1948), on the TVA model."],["Mettur","Kaveri","Tamil Nadu."],["Krishna Raja Sagar","Kaveri","Karnataka; Brindavan Gardens."],["Indira Gandhi Canal","Sutlej and Beas (from Harike barrage)","Rajasthan; India's longest canal."],["Salal","Chenab","Jammu and Kashmir."],["Ukai","Tapi","Gujarat."],["Idukki","Periyar","Kerala; arch dam."],["Gandhi Sagar","Chambal","Madhya Pradesh."],["Pong","Beas","Himachal Pradesh."],["Farakka Barrage","Ganga","West Bengal."],["Rihand","Rihand (a tributary of the Son)","Uttar Pradesh; Govind Ballabh Pant Sagar reservoir."],["Polavaram","Godavari","Andhra Pradesh."]]},{"k":"rivermap","title":"The rivers behind the big projects","hl":["Sutlej","Beas","Mahanadi","Krishna","Narmada","Tapi","Kaveri","Godavari","Damodar","Kosi","Chambal","Tungabhadra"],"pins":[["Bhakra",76.43,31.41,"","l"],["Hirakud",83.87,21.52,""],["Nagarjuna Sagar",79.31,16.57,""],["Sardar Sarovar",73.75,21.83,"","l"],["DVC",86.8,23.7,""],["Kosi barrage",86.95,26.5,""],["Gandhi Sagar",75.55,24.7,"","l"],["Tungabhadra",76.33,15.27,"","l"]],"cap":"Multipurpose river valley projects: irrigation, power and flood control."},{"k":"facts","title":"Irrigation basics","rows":[["Largest source","Wells and tube wells (groundwater)"],["Tank irrigation","Peninsular India — Tamil Nadu, Karnataka, Telangana"],["Drip irrigation","Water reaches the roots drop by drop — saves the most water"],["Sprinkler irrigation","Water sprayed like rain — good for uneven land"],["Highest dam","Tehri (Uttarakhand)"],["Longest canal","Indira Gandhi (Rajasthan) Canal"],["Scheme","PM Krishi Sinchayee Yojana (2015) — 'Har Khet Ko Pani', 'Per Drop More Crop'"]]},{"k":"trick","h":"<b>“Bhakra Sutlej, Hira Mahanadi, Sardar Narmada, Tehri Bhagirathi”<\/b> — say it twice. <b>Two Kaveri dams<\/b>: KRS (Karnataka) up the river, Mettur (Tamil Nadu) down."},{"k":"trap","h":"<b>Gandhi Sagar<\/b> dam is on the <b>Chambal<\/b>, not the Narmada. <b>Indira Gandhi Canal<\/b> starts at the Harike barrage in <b>Punjab<\/b> but irrigates <b>Rajasthan<\/b>. <b>Nagarjuna Sagar<\/b> and <b>Srisailam<\/b> are both on the <b>Krishna<\/b>."}],"sum":["Wells and tube wells are India's largest source of irrigation.","Tank irrigation is common in peninsular India.","Bhakra Nangal — Sutlej; Hirakud — Mahanadi; Sardar Sarovar — Narmada; Tehri — Bhagirathi.","Damodar Valley (1948) was the first multipurpose project.","Drip irrigation saves the most water; PMKSY aims at 'Per Drop More Crop'."],"part":["Part 2 · Farming, revolutions, water and animals","खेती, क्रांतियाँ, सिंचाई और पशुपालन"],"g":"ag"},
{"id":"R8","heat":2,"title":"Animal husbandry and fisheries","hi":"पशुपालन और मत्स्य पालन","blocks":[{"k":"hot","h":"Asked: <b>breed → state<\/b> (Gir — Gujarat, Murrah — Haryana, Jamunapari — UP, Chokla — Rajasthan), <b>India's rank in milk<\/b> (first) and fish (second), and exotic breeds (Holstein-Friesian, Jersey)."},{"k":"story","h":"<p>India is the world's <b>largest milk producer<\/b>, with about a quarter of world output; <b>Uttar Pradesh<\/b> produces the most milk, followed by Rajasthan and Madhya Pradesh. India also has the world's largest population of cattle and buffaloes. The <b>Murrah<\/b> buffalo of Haryana is the star milk animal; desi cows such as <b>Gir<\/b> and <b>Sahiwal<\/b> are being improved under the <b>Rashtriya Gokul Mission<\/b> (2014).<\/p><p>India is the world's <b>second-largest fish producer<\/b>, and most fish now come from inland farms; <b>Andhra Pradesh<\/b> is the top fish-producing state. Andhra Pradesh also leads in eggs. The <b>PM Matsya Sampada Yojana<\/b> (2020) funds the 'Blue Revolution'.<\/p>","key":"Milk — India 1st, UP top state; fish — India 2nd, Andhra top state. Murrah — Haryana; Gir — Gujarat; Jamunapari — UP."},{"k":"table","title":"Indian breeds and their home states","head":["Breed","Home state","Note"],"rows":[["Gir","Gujarat","Milch cow from the Gir forest."],["Sahiwal","Punjab","One of the best milch breeds; origin in Pakistan's Punjab."],["Red Sindhi","Sindh (now in Pakistan)","Milch breed."],["Tharparkar","Rajasthan","Dual-purpose cow of the Thar desert."],["Rathi","Rajasthan",""],["Nagori","Rajasthan","Draught breed."],["Hariana","Haryana","Dual-purpose."],["Ongole","Andhra Pradesh","Draught and dual-purpose breed exported to Brazil."],["Punganur","Andhra Pradesh","A dwarf cow."],["Kankrej","Gujarat",""],["Deoni","Maharashtra",""],["Khillari","Maharashtra","Draught breed."],["Hallikar","Karnataka","Draught breed."],["Amrit Mahal","Karnataka","Draught breed."],["Kangayam","Tamil Nadu","Draught breed."],["Vechur","Kerala","Among the smallest cattle in the world."],["Malvi","Madhya Pradesh",""],["Siri","Sikkim",""],["Murrah buffalo","Haryana","India's best milch buffalo — 'black gold'."],["Nili-Ravi buffalo","Punjab",""],["Jaffarabadi buffalo","Gujarat","The heaviest Indian buffalo."],["Mehsana buffalo","Gujarat",""],["Surti buffalo","Gujarat",""],["Bhadawari buffalo","Uttar Pradesh","Milk very high in fat."],["Nagpuri buffalo","Maharashtra",""],["Toda buffalo","Tamil Nadu","Nilgiri hills."],["Chilika buffalo","Odisha",""],["Jamunapari goat","Uttar Pradesh","Etawah; large milch goat."],["Barbari goat","Uttar Pradesh",""],["Beetal goat","Punjab",""],["Sirohi goat","Rajasthan",""],["Black Bengal goat","West Bengal",""],["Osmanabadi goat","Maharashtra",""],["Changthangi goat","Ladakh","Gives pashmina."],["Malabari goat","Kerala",""],["Chokla sheep","Rajasthan","The 'Indian Merino' — fine carpet wool."],["Nali sheep","Rajasthan",""],["Deccani sheep","Maharashtra",""],["Bellary sheep","Karnataka",""],["Gaddi sheep","Himachal Pradesh",""],["Nellore sheep","Andhra Pradesh",""],["Kadaknath chicken","Madhya Pradesh","Black meat; GI tag for Jhabua."]]},{"k":"mapfig","title":"Indian breeds by home state","marks":[["GJ","Gir · Kankrej · Jaffarabadi buffalo +2"],["PB","Sahiwal · Nili-Ravi buffalo · Beetal goat"],["RJ","Tharparkar · Rathi · Nagori +3"],["HR","Hariana · Murrah buffalo"],["AP","Ongole · Punganur · Nellore sheep"],["MH","Deoni · Khillari · Nagpuri buffalo +2"],["KA","Hallikar · Amrit Mahal · Bellary sheep"],["TN","Kangayam · Toda buffalo"],["KL","Vechur · Malabari goat"],["MP","Malvi · Kadaknath chicken"],["SK","Siri"],["UP","Bhadawari buffalo · Jamunapari goat · Barbari goat"],["OD","Chilika buffalo"],["WB","Black Bengal goat"],["LA","Changthangi goat"],["HP","Gaddi sheep"]],"cap":"Gir and Kankrej (Gujarat), Sahiwal (Punjab), Ongole (Andhra), Murrah buffalo (Haryana), Jamunapari goat (UP)…"},{"k":"photos","title":"Breeds in pictures","items":[["Gir_cattle","Gir","Gujarat"],["Sahiwal_cattle","Sahiwal","Punjab"],["Tharparkar_cattle","Tharparkar","Rajasthan"],["Ongole_cattle","Ongole","Andhra Pradesh"],["Murrah_buffalo","Murrah buffalo","Haryana"],["Jamunapari_goat","Jamunapari goat","Uttar Pradesh"],["Kadaknath","Kadaknath","Madhya Pradesh"],["Changthangi","Changthangi","Ladakh"]]},{"k":"table","title":"Where foreign breeds come from","head":["Breed","Origin","Note"],"rows":[["Holstein-Friesian","Netherlands","The highest milk yield of any cattle breed."],["Jersey","Jersey Island (British Channel Islands)","Milk rich in fat."],["Brown Swiss","Switzerland",""]]},{"k":"facts","title":"Numbers (as of 2023–24 data, Basic Animal Husbandry Statistics)","rows":[["Milk production","About 239 million tonnes (2023–24); India 1st in the world"],["Per capita milk","About 471 grams a day (2023–24)"],["Top milk states","Uttar Pradesh, then Rajasthan and Madhya Pradesh"],["Fish","India 2nd in the world; Andhra Pradesh the top state"],["Eggs","Andhra Pradesh the top state"],["Livestock Census","20th in 2019; the 21st was carried out in 2024–25"],["Days","World Milk Day 1 June · National Milk Day 26 Nov · National Fish Farmers' Day 10 July · World Fisheries Day 21 Nov"]]},{"k":"trick","h":"<b>“Gir-Gujarat, Murrah-Haryana”<\/b> — both start with a hard sound and are the champions of their kind. Gujarat's buffalo trio: <b>“J-M-S”<\/b> — Jaffarabadi, Mehsana, Surti."},{"k":"trap","h":"<b>Murrah<\/b> is a <b>buffalo<\/b>, not a cow. <b>Changthangi<\/b> (Ladakh) gives <b>pashmina<\/b>, not angora. <b>Holstein-Friesian<\/b> is from the <b>Netherlands<\/b>, Jersey from the British Channel Islands."}],"sum":["India is the largest milk producer; Uttar Pradesh is the top milk state.","India is the second-largest fish producer; Andhra Pradesh leads fish and eggs.","Gir, Kankrej — Gujarat; Sahiwal — Punjab; Tharparkar, Rathi — Rajasthan; Ongole — Andhra.","Murrah — Haryana; Jaffarabadi, Mehsana, Surti — Gujarat; Jamunapari — UP; Chokla — Rajasthan.","Holstein-Friesian — Netherlands; Jersey — Channel Islands; Brown Swiss — Switzerland."],"part":["Part 2 · Farming, revolutions, water and animals","खेती, क्रांतियाँ, सिंचाई और पशुपालन"],"g":"ag"},
{"id":"R9","heat":2,"title":"Agricultural institutions and research institutes","hi":"कृषि संस्थान और अनुसंधान केंद्र","blocks":[{"k":"hot","h":"Asked: <b>headquarters<\/b> (NABARD — Mumbai, NDDB — Anand, Tea Board — Kolkata, Coffee Board — Bengaluru, Rubber Board — Kottayam, Spices Board — Kochi) and <b>founding years<\/b> (ICAR 1929, NABARD 1982, FCI 1965)."},{"k":"story","h":"<p>The <b>ICAR<\/b>, set up in 1929, is the apex body for farm research and education; it runs more than a hundred institutes, such as the <b>IARI (Pusa Institute)<\/b> in New Delhi, which began at Pusa in Bihar in 1905. <b>NABARD<\/b> (1982, Mumbai) is the apex bank for rural credit. The <b>Food Corporation of India<\/b> (1965) buys grain at MSP, stores the buffer stock and supplies the PDS.<\/p><p>The <b>CACP<\/b> (1965, as the Agricultural Prices Commission) recommends the MSP. <b>NAFED<\/b> (1958) runs cooperative marketing; <b>APEDA<\/b> (1986) promotes farm exports. Each plantation crop has a board: Tea — <b>Kolkata<\/b>, Coffee — <b>Bengaluru<\/b>, Rubber — <b>Kottayam<\/b>, Spices — <b>Kochi<\/b>. Abroad, the <b>FAO<\/b> sits in Rome and the <b>IRRI<\/b> in the Philippines.<\/p>","key":"ICAR 1929 Delhi; NABARD 1982 Mumbai; FCI 1965; CACP → MSP; NDDB Anand; Tea Kolkata, Coffee Bengaluru, Rubber Kottayam, Spices Kochi."},{"k":"table","title":"Headquarters","head":["Body","Headquarters","Note"],"rows":[["ICAR (Indian Council of Agricultural Research)","New Delhi",""],["NABARD","Mumbai",""],["Food Corporation of India (FCI)","New Delhi",""],["National Dairy Development Board (NDDB)","Anand","Gujarat."],["Amul (GCMMF)","Anand",""],["MPEDA (marine products exports)","Kochi",""],["Spices Board","Kochi",""],["Coconut Development Board","Kochi",""],["Coffee Board","Bengaluru",""],["Central Silk Board","Bengaluru",""],["Tea Board","Kolkata",""],["Jute Corporation of India","Kolkata",""],["Rubber Board","Kottayam",""],["Tobacco Board","Guntur",""],["National Fisheries Development Board","Hyderabad",""],["ICRISAT (semi-arid tropics crops)","Patancheru (Hyderabad)","International institute for millets, pulses and groundnut."],["FAO (Food and Agriculture Organization)","Rome",""],["IRRI (International Rice Research Institute)","Los Baños (Philippines)",""],["CIMMYT (maize and wheat centre)","Mexico","Where Borlaug bred his wheat."]]},{"k":"table","title":"Year set up","head":["Body","Year","Note"],"rows":[["ICAR","1929","Set up on 16 July 1929 as the Imperial Council of Agricultural Research."],["NABARD","1982","12 July 1982, on the B. Sivaraman Committee's advice."],["Food Corporation of India","1965","Under the Food Corporations Act, 1964."],["NAFED","1958","Set up on 2 October 1958."],["APEDA","1986","Under the APEDA Act, 1985."],["MPEDA","1972",""],["FAO","1945","16 October 1945 — now World Food Day."],["IARI (Pusa Institute)","1905","Started at Pusa, Bihar; moved to Delhi in 1936."]]},{"k":"table","title":"ICAR research institutes","head":["Institute","Location","Note"],"rows":[["Indian Agricultural Research Institute (IARI)","New Delhi","Called the Pusa Institute."],["National Rice Research Institute","Cuttack",""],["Indian Institute of Rice Research","Hyderabad",""],["Indian Institute of Wheat and Barley Research","Karnal",""],["National Dairy Research Institute","Karnal",""],["Central Soil Salinity Research Institute","Karnal",""],["Indian Institute of Millets Research","Hyderabad","A Global Centre of Excellence on millets."],["Indian Institute of Pulses Research","Kanpur",""],["Indian Institute of Sugarcane Research","Lucknow",""],["Sugarcane Breeding Institute","Coimbatore",""],["Central Institute for Cotton Research","Nagpur",""],["Central Potato Research Institute","Shimla",""],["Indian Veterinary Research Institute","Izatnagar (Bareilly)",""],["Central Arid Zone Research Institute","Jodhpur",""],["Central Institute for Research on Goats","Makhdoom (Mathura)",""],["Central Sheep and Wool Research Institute","Avikanagar (Rajasthan)",""],["Central Institute for Research on Buffaloes","Hisar",""],["Central Plantation Crops Research Institute","Kasaragod",""],["Indian Institute of Spices Research","Kozhikode",""],["Central Tuber Crops Research Institute","Thiruvananthapuram",""],["Indian Institute of Horticultural Research","Bengaluru",""],["Indian Institute of Soil Science","Bhopal",""],["Central Marine Fisheries Research Institute","Kochi",""],["Central Inland Fisheries Research Institute","Barrackpore",""],["National Research Centre on Camel","Bikaner",""]]},{"k":"trick","h":"Boards by crop region: <b>Tea → Kolkata<\/b> (Assam/Bengal tea), <b>Coffee → Bengaluru<\/b> (Karnataka coffee), <b>Rubber → Kottayam<\/b>, <b>Spices and Coconut → Kochi<\/b> (Kerala). Karnal's trio: <b>“Wheat, Dairy, Salt”<\/b>."},{"k":"trap","h":"<b>NABARD<\/b> is in <b>Mumbai<\/b>, but <b>NAFED, APEDA, FCI and ICAR<\/b> are in <b>New Delhi<\/b>. The <b>NRRI<\/b> (rice) is at <b>Cuttack<\/b>, while the <b>IIRR<\/b> is at Hyderabad. <b>ICRISAT<\/b> is in Hyderabad, <b>IRRI<\/b> in the Philippines."}],"sum":["ICAR (1929, New Delhi) is the apex body for farm research; IARI is the Pusa Institute.","NABARD (1982) is in Mumbai; FCI (1965) runs procurement and the buffer stock.","CACP recommends MSP; NAFED (1958) and APEDA (1986) handle marketing and exports.","Tea Board Kolkata, Coffee Board Bengaluru, Rubber Board Kottayam, Spices Board Kochi.","NRRI Cuttack, NDRI Karnal, CPRI Shimla, CAZRI Jodhpur, IIMR Hyderabad."],"part":["Part 3 · Institutions and schemes","संस्थान और योजनाएँ"],"g":"ag"},
{"id":"R10","heat":3,"title":"Schemes, MSP, farm terms and the Year of Millets","hi":"योजनाएँ, एमएसपी, कृषि शब्दावली और मिलेट्स वर्ष","blocks":[{"k":"hot","h":"Asked every year: <b>PM-KISAN<\/b> (₹6,000 a year, 2019), <b>PMFBY<\/b> (crop insurance, 2016), <b>Soil Health Card<\/b> (2015), <b>e-NAM<\/b> (2016), <b>who recommends MSP<\/b> (CACP), <b>hydroponics<\/b>, and the <b>International Year of Millets 2023<\/b>."},{"k":"story","h":"<p>Before each season the <b>CACP<\/b> recommends a <b>Minimum Support Price<\/b> for 22 crops and the Cabinet approves it; sugarcane gets a <b>Fair and Remunerative Price<\/b> instead. The FCI buys at MSP and keeps a <b>buffer stock<\/b>. Since 2019, <b>PM-KISAN<\/b> pays farmers ₹6,000 a year in three instalments, <b>PMFBY<\/b> insures crops at a small premium, the <b>Soil Health Card<\/b> tells farmers what nutrients their soil needs, and <b>e-NAM<\/b> lets them sell online across mandis.<\/p><p>At India's proposal, the UN declared <b>2023 the International Year of Millets<\/b>. India had already marked 2018 as its National Year of Millets, and the 2023–24 Budget called millets <b>'Shree Anna'<\/b>. Hyderabad's Indian Institute of Millets Research became a Global Centre of Excellence.<\/p>","key":"CACP → MSP; PM-KISAN ₹6,000 (2019); PMFBY 2016; Soil Health Card 2015; e-NAM 2016; Millets Year 2023 (India's proposal)."},{"k":"table","title":"When each scheme began","head":["Scheme","Year","Note"],"rows":[["PM-KISAN","2019","Launched at Gorakhpur on 24 February 2019 (paid from December 2018)."],["Pradhan Mantri Fasal Bima Yojana (PMFBY)","2016",""],["Soil Health Card scheme","2015","Launched at Suratgarh, Rajasthan, on 19 February 2015."],["e-NAM (National Agriculture Market)","2016","Launched on 14 April 2016."],["Kisan Credit Card","1998","Designed by NABARD on the R. V. Gupta Committee's advice."],["PM Krishi Sinchayee Yojana (PMKSY)","2015",""],["Paramparagat Krishi Vikas Yojana","2015",""],["PM Kisan Maan Dhan Yojana","2019",""],["Agriculture Infrastructure Fund","2020",""],["PM Matsya Sampada Yojana","2020",""],["Operation Greens","2018",""],["Rashtriya Gokul Mission","2014",""],["National Food Security Mission","2007",""]]},{"k":"tlfig","title":"Farm schemes, year by year","rows":[[2019,"PM-KISAN",""],[2016,"Pradhan Mantri Fasal Bima Yojana",""],[2015,"Soil Health Card scheme",""],[2016,"e-NAM",""],[1998,"Kisan Credit Card",""],[2015,"PM Krishi Sinchayee Yojana",""],[2015,"Paramparagat Krishi Vikas Yojana",""],[2019,"PM Kisan Maan Dhan Yojana",""],[2020,"Agriculture Infrastructure Fund",""],[2020,"PM Matsya Sampada Yojana",""],[2018,"Operation Greens",""],[2014,"Rashtriya Gokul Mission",""],[2007,"National Food Security Mission",""]],"cap":"From the Kisan Credit Card (1998) to PM-KISAN (2019) and the Agriculture Infrastructure Fund (2020)."},{"k":"table","title":"What each scheme gives","head":["Scheme","What it does","Note"],"rows":[["PM-KISAN","₹6,000 a year income support in three instalments","Paid straight to farmers' bank accounts; 100% central funding."],["PMFBY","Crop insurance at a low premium","Farmers pay 2% (kharif), 1.5% (rabi), 5% (commercial and horticultural crops)."],["Soil Health Card","A report of soil nutrients with fertiliser advice","Slogan: 'Swasth Dhara, Khet Hara'."],["e-NAM","An online trading platform linking APMC mandis","Run by the Small Farmers' Agribusiness Consortium (SFAC)."],["Kisan Credit Card","Short-term crop loans on easy terms","Extended to animal husbandry and fisheries in 2018–19."],["PMKSY","Irrigation — 'Har Khet Ko Pani', 'Per Drop More Crop'",""],["Paramparagat Krishi Vikas Yojana","Organic farming in clusters",""],["PM-KUSUM","Solar pumps and solar power for farmers",""],["PM Kisan Maan Dhan","₹3,000 a month pension after age 60","For small and marginal farmers."],["Operation Greens","Steady prices of tomato, onion and potato","Called 'TOP'."],["PM-AASHA","Price support for pulses and oilseeds",""]]},{"k":"table","title":"Farm terms","head":["Term","Meaning","Note"],"rows":[["Minimum Support Price (MSP)","Price at which the government buys a crop, fixed before sowing","Recommended by the CACP; approved by the Cabinet Committee on Economic Affairs."],["Fair and Remunerative Price (FRP)","Price sugar mills must pay for sugarcane",""],["Buffer stock","Foodgrain reserve kept by the government through the FCI","Used for the PDS and in shortages."],["Hydroponics","Growing plants without soil, in nutrient-rich water",""],["Aeroponics","Growing plants with roots hanging in air, sprayed with nutrient mist",""],["Aquaponics","Fish farming and soil-less crops together","Fish waste feeds the plants."],["Organic farming","Farming without chemical fertilisers or pesticides","Sikkim became India's first fully organic state (2016)."],["Crop rotation","Growing different crops one after another on the same land","Keeps the soil fertile."],["Mixed cropping","Growing two or more crops together in the same field",""],["Green manure","Ploughing young green plants back into the soil",""],["Agmark","Quality certification mark for farm produce","Under the Agricultural Produce (Grading and Marking) Act, 1937."],["Zero Budget Natural Farming","Farming with almost no bought inputs (Subhash Palekar)",""]]},{"k":"facts","title":"Years and days to remember","rows":[["International Year of Millets","2023 — proposed by India, declared by the UN General Assembly in 2021"],["International Year of Pulses","2016"],["2026 (UN years)","International Year of the Woman Farmer; International Year of Rangelands and Pastoralists"],["World Food Day","16 October — FAO's founding day"],["Kisan Diwas (National Farmers' Day)","23 December — Chaudhary Charan Singh's birthday"],["World Soil Day","5 December"],["World Pulses Day","10 February"],["National Agricultural Education Day","3 December — Dr Rajendra Prasad's birthday"]]},{"k":"trick","h":"Scheme years in order: <b>KCC 98 → Soil Card 15 → PMKSY 15 → Fasal Bima 16 → e-NAM 16 → KISAN 19<\/b>. Think <b>“Credit, Soil, Water, Insurance, Market, Cash”<\/b>."},{"k":"trap","h":"The <b>CACP recommends<\/b> the MSP but the <b>Cabinet (CCEA) decides<\/b> it. Sugarcane has an <b>FRP<\/b>, not an MSP. <b>Hydroponics<\/b> uses water, <b>aeroponics<\/b> air mist. 2023 was the Year of <b>Millets<\/b>; 2016 was <b>Pulses<\/b>."}],"sum":["CACP recommends MSP for 22 crops; the CCEA approves it; sugarcane has an FRP.","PM-KISAN (2019) gives ₹6,000 a year in three instalments of ₹2,000.","PMFBY (2016) crop insurance; Soil Health Card (2015); e-NAM (2016); KCC (1998).","Hydroponics grows plants in nutrient water without soil; Sikkim is the first fully organic state.","The UN declared 2023 the International Year of Millets on India's proposal; millets = Shree Anna."],"part":["Part 3 · Institutions and schemes","संस्थान और योजनाएँ"],"g":"ag"}
];

:root[data-skin] body{background-color:var(--app-bg);background-image:var(--app-pattern);background-size:var(--app-psize);background-attachment:fixed}
:root[data-skin] h1,:root[data-skin] h2{letter-spacing:-.01em}

/* ===== Desktop layout (PC / tablet landscape) ===== */
@media (min-width: 1024px){
  :root{--side:236px}
  body{padding-left:var(--side);font-size:16.5px}
  .top{border-bottom:1px solid var(--rule)}
  .top-in{max-width:1320px;padding:16px 36px}
  .brand{font-size:21px}
  .brand small{font-size:13px}
  .stat{font-size:13px}
  .wrap{max-width:1320px;padding:0 36px 56px}
  .view{padding-top:28px}
  h1{font-size:34px} h2{font-size:22px} h3{font-size:17px}

  /* bottom tab bar becomes a left sidebar */
  .nav{top:0;bottom:0;left:0;right:auto;width:var(--side);height:auto;border-top:0;border-right:1px solid var(--rule);padding:84px 14px 20px;display:block;overflow:auto}
  .nav-in{display:flex;flex-direction:column;gap:4px;height:auto;max-width:none;margin:0}
  .nav-in::before{content:"Sections";display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:0 14px 8px}
  .nav button{flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-size:15px;min-height:0;height:auto;width:100%;text-align:left}
  .nav button svg{width:20px;height:20px;flex-shrink:0}
  .nav button:hover{background:var(--sunk)}
  .nav button[aria-current="page"]{background:var(--blue-bg)}
  .nav button[aria-current="page"] span{border-bottom:0!important}

  /* home: intro beside progress */
  .hero{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);column-gap:48px;align-items:end;padding-bottom:10px}
  .hero > .eyebrow,.hero > h1,.hero > p{grid-column:1}
  .hero > .meter{grid-column:2;grid-row:3;align-self:center}
  .hero > .row{grid-column:2;grid-row:2;align-self:end}

  /* lesson reader: facts, timelines, tricks sit side by side */
  .lhead{margin-bottom:0}
  .steps{max-width:640px}
  .steps + .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .steps + .stack > .plain,.steps + .stack > .row,.steps + .stack > p,.steps + .stack > .fig,.steps + .stack > h2,.steps + .stack > .tbl{grid-column:1/-1}
  .steps + .stack > .plain{max-width:86ch;font-size:17px}
  .steps + .stack > .hot,.steps + .stack > .story{grid-column:1/-1}
  .steps + .stack > .story{max-width:none;padding:20px 24px;font-size:17.5px}
  .steps + .stack > .story p{max-width:80ch}
  .steps + .stack:not(:has(> .block ~ .block)) > .block{grid-column:1/-1}
  .block,.qcard{padding:18px 20px;border-radius:14px}

  /* quizzes and question bank */
  #lq > .stack{display:grid;grid-template-columns:minmax(0,1fr);max-width:980px;gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qt{font-size:18px}
  #plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #plist .opts{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:wrap;overflow:visible}

  /* mock test: question with the answer grid alongside */
  .mbar{top:calc(env(safe-area-inset-top,0px) + 67px)}
  .view > .qcard{max-width:1000px}
  .view > .row.between{max-width:1000px}
  .view > #msub{max-width:1000px;width:100%}
  .view > .block.stack{max-width:760px}
  .pal{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .kpis{max-width:760px}

  /* revise: summary cards and sheets in columns */
  #rv > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #rv > .stack > .grph,#rv > .stack > p,#rv > .stack > .search,#rv > .stack > .callout{grid-column:1/-1}
  #dgl,#lml,#tll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #dgl > .grph,#dgl > p,#lml > p,#tll > .grph{grid-column:1/-1}
  #rv .search,#rv > #dgl ~ .search{max-width:520px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flash{min-height:300px;max-width:760px;margin:0 auto;padding:32px 36px}
  .flash .front{font-size:22px}

  /* learn: era cards across the top */
  .eras{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}
  .les{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}

(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();

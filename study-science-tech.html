{"id":"ST1","heat":2,"title":"Who runs Indian science: departments and councils","hi":"भारतीय विज्ञान कौन चलाता है: विभाग और परिषदें","blocks":[{"k":"hot","h":"Asked often: the year each body began (<b>CSIR 1942, DAE 1954, DRDO 1958, DST 1971, DBT 1986, MoES 2006<\/b>), which bodies sit <b>directly under the Prime Minister<\/b> (atomic energy and space), the old names of <b>ICMR<\/b> (1911) and <b>ICAR<\/b> (1929), and who heads <b>CSIR<\/b>."},{"k":"story","h":"<p>Think of Indian science as a house with many rooms. The <b>Ministry of Science and Technology<\/b> holds three of them: the <b>Department of Science and Technology<\/b> (1971), which pays for research in universities and runs the big missions; the <b>Department of Biotechnology<\/b> (1986); and the <b>Department of Scientific and Industrial Research<\/b> (1985), under which the giant <b>CSIR<\/b> and its national labs work. CSIR is older than independent India — it began in 1942, and its first Director-General was <b>Shanti Swarup Bhatnagar<\/b>.<\/p><p>Two rooms are kept right next to the Prime Minister: <b>atomic energy<\/b> (DAE, 1954) and <b>space<\/b> (DoS, 1972), because they are strategic. Weather, oceans and the poles have their own <b>Ministry of Earth Sciences<\/b> (2006). Medicine and farming have councils of their own — <b>ICMR<\/b> and <b>ICAR<\/b> — and defence research belongs to <b>DRDO<\/b> under the Defence Ministry.<\/p>","key":"Three departments in the S&T ministry (DST, DBT, DSIR); two under the PM (atom, space); councils for medicine (ICMR), farming (ICAR) and industry (CSIR)."},{"k":"table","title":"Who runs what","head":["Body","Works under","Remember"],"rows":[["Department of Science and Technology (DST)","Ministry of Science and Technology","Set up in May 1971; funds research and runs missions such as Quantum and NM-ICPS."],["Department of Biotechnology (DBT)","Ministry of Science and Technology","1986; grew out of the National Biotechnology Board (1982). Runs BIRAC and Genome India."],["Department of Scientific and Industrial Research (DSIR)","Ministry of Science and Technology","1985; CSIR works under it."],["Council of Scientific and Industrial Research (CSIR)","Department of Scientific and Industrial Research","1942; the Prime Minister is its President; about 37 national labs."],["Department of Atomic Energy (DAE)","The Prime Minister directly","3 August 1954; BARC, NPCIL and the nuclear plants."],["Department of Space (DoS)","The Prime Minister directly","1972; ISRO works under it (see the Space app)."],["India Meteorological Department (IMD)","Ministry of Earth Sciences","1875; the ministry itself was formed in 2006."],["Indian Council of Medical Research (ICMR)","Department of Health Research","1911 as the Indian Research Fund Association; renamed ICMR in 1949."],["Indian Council of Agricultural Research (ICAR)","Department of Agricultural Research and Education","16 July 1929, as the Imperial Council of Agricultural Research."],["Defence Research and Development Organisation (DRDO)","Ministry of Defence","1958; its chairman is also Secretary, Department of Defence R&D."]]},{"k":"facts","title":"The people at the top","rows":[["President of CSIR","The Prime Minister (CSIR's Director-General runs it day to day)"],["First Director-General of CSIR","Shanti Swarup Bhatnagar"],["First chairman, Atomic Energy Commission (1948)","Homi J. Bhabha"],["Principal Scientific Adviser (post from 1999)","First: A. P. J. Abdul Kalam; then R. Chidambaram, K. VijayRaghavan and Ajay K. Sood (since 2022, as of 2026)"],["PM-STIAC (2018)","Prime Minister's Science, Technology and Innovation Advisory Council — chaired by the Principal Scientific Adviser"],["Ministers","Science and Technology and Earth Sciences have a Minister of State (Independent Charge) — Dr Jitendra Singh (as of 2026)"],["BIRAC (2012)","Biotechnology Industry Research Assistance Council — DBT's not-for-profit company for biotech start-ups"],["Vigyan Dhara (2024)","DST scheme that merged its three umbrella schemes into one"]]},{"k":"trick","h":"<b>“Three in the ministry, two with the PM”<\/b> — DST, DBT, DSIR sit in the Ministry of Science and Technology; <b>Atom<\/b> (DAE) and <b>Space<\/b> (DoS) report straight to the Prime Minister. Years in a line: <b>42–54–58–71–86–06<\/b> = CSIR, DAE, DRDO, DST, DBT, MoES."},{"k":"trap","h":"<b>CSIR<\/b> works under <b>DSIR<\/b>, not DST. <b>ICMR<\/b> is under the <b>Department of Health Research<\/b> (Health Ministry), not DBT; <b>ICAR<\/b> is under <b>DARE<\/b> (Agriculture Ministry). <b>DRDO<\/b> belongs to the <b>Defence<\/b> Ministry, and <b>ISRO<\/b> to the Department of Space — neither is in the S&T ministry."},{"k":"link","h":"Where each institute has its headquarters — CSIR, NPL, NCL, CCMB, IMD, ICAR's crop institutes and ICMR's NIV — is in <a href=\"study-hq-founders.html?lesson=H4\">Headquarters &amp; Founders<\/a> (H4, H5). ISRO's centres and the Department of Space are in <a href=\"study-space.html\">Space &amp; ISRO<\/a> (L5); DRDO's missiles are in <a href=\"study-defence.html?lesson=F5\">Defence<\/a>."}],"sum":["The Ministry of Science and Technology has three departments: DST (1971), DBT (1986) and DSIR (1985).","CSIR (1942) works under DSIR; the Prime Minister is its President; its first DG was S. S. Bhatnagar.","DAE (1954) and the Department of Space (1972) work directly under the Prime Minister.","Ministry of Earth Sciences (2006) runs IMD, NCPOR, INCOIS and NIOT.","ICMR (1911, Department of Health Research); ICAR (1929, DARE); DRDO (1958, Ministry of Defence).","The first Principal Scientific Adviser (1999) was A. P. J. Abdul Kalam; PM-STIAC is chaired by the PSA."],"part":["Part 1 · The science system and nuclear energy","विज्ञान व्यवस्था और परमाणु ऊर्जा"],"g":"st"},
{"id":"ST2","heat":2,"title":"CSIR labs, science policies, ANRF and science days","hi":"सीएसआईआर प्रयोगशालाएँ, विज्ञान नीतियाँ, एएनआरएफ और विज्ञान दिवस","blocks":[{"k":"hot","h":"Asked: a <b>CSIR lab and its city<\/b>, the <b>Scientific Policy Resolution (1958)<\/b> and the later policies, the <b>Anusandhan National Research Foundation<\/b> (2023) and its money, and <b>National Science Day<\/b> (28 February, the Raman effect)."},{"k":"story","h":"<p>CSIR's labs are spread across the country, and each sits where its work makes sense: metals in <b>Jamshedpur<\/b>, the Steel City; mining and coal in <b>Dhanbad<\/b>; salt and seaweed on the coast at <b>Bhavnagar<\/b>; Himalayan plants at <b>Palampur<\/b>; aircraft at <b>Bengaluru<\/b>, where the Hansa and Saras planes were designed.<\/p><p>The rules for science came in steps. Nehru's <b>Scientific Policy Resolution<\/b> of <b>1958<\/b> promised to build science into the nation; the <b>Technology Policy Statement<\/b> followed in 1983, the <b>S&amp;T Policy<\/b> in 2003 and the <b>Science, Technology and Innovation Policy<\/b> in 2013. In <b>2023<\/b> Parliament passed the <b>Anusandhan National Research Foundation (ANRF) Act<\/b>, which set up one big funder for research in universities and colleges, chaired by the Prime Minister, in place of the old Science and Engineering Research Board.<\/p>","key":"Lab cities follow the work (metals Jamshedpur, coal Dhanbad, salt Bhavnagar); policies 1958, 1983, 2003, 2013; ANRF 2023."},{"k":"table","title":"CSIR labs and their cities","head":["Lab","City","Known for"],"rows":[["National Aerospace Laboratories (NAL)","Bengaluru","Civil aircraft — the Hansa trainer and the Saras transport plane."],["Central Scientific Instruments Organisation (CSIO)","Chandigarh","Scientific and medical instruments."],["Institute of Microbial Technology (IMTECH)","Chandigarh","Microbes; keeps a national collection of microbe cultures."],["Indian Institute of Chemical Technology (IICT)","Hyderabad","Chemical technology, drugs and pesticides."],["Institute of Genomics and Integrative Biology (IGIB)","New Delhi","Genomics; developed the CRISPR therapy BIRSA 101 (2025)."],["Central Road Research Institute (CRRI)","New Delhi","Roads and traffic."],["Central Building Research Institute (CBRI)","Roorkee","Buildings and earthquake-safe design."],["Indian Institute of Petroleum (IIP)","Dehradun","Petroleum, fuels and biofuels."],["Institute of Himalayan Bioresource Technology (IHBT)","Palampur","Himalayan plants, tea and flowers."],["Indian Institute of Integrative Medicine (IIIM)","Jammu","Drugs from plants; lavender farming in J&K (the 'Purple Revolution')."],["Central Institute of Medicinal and Aromatic Plants (CIMAP)","Lucknow","Medicinal and aromatic plants; leads the Aroma Mission."],["Indian Institute of Toxicology Research (IITR)","Lucknow","Safety of chemicals, food and the environment."],["National Metallurgical Laboratory (NML)","Jamshedpur","Metals and alloys — in the Steel City."],["Central Mechanical Engineering Research Institute (CMERI)","Durgapur","Machines, small tractors and robots."],["Central Institute of Mining and Fuel Research (CIMFR)","Dhanbad","Mining safety and coal."],["Central Glass and Ceramic Research Institute (CGCRI)","Kolkata","Glass, ceramics and optical fibres."],["Central Salt and Marine Chemicals Research Institute (CSMCRI)","Bhavnagar","Salt, seaweed and desalination on the Gujarat coast."],["Central Electrochemical Research Institute (CECRI)","Karaikudi","Electrochemistry and batteries."],["Structural Engineering Research Centre (SERC)","Chennai","Bridges, towers and big structures."],["National Institute for Interdisciplinary Science and Technology (NIIST)","Thiruvananthapuram","Materials and agro-processing."],["North East Institute of Science and Technology (NEIST)","Jorhat","Science for the north-east; earlier the Regional Research Laboratory."],["Advanced Materials and Processes Research Institute (AMPRI)","Bhopal","New materials such as composites and foams."]]},{"k":"mapfig","title":"CSIR labs in this lesson, city by city","pins":[["1",77.6,12.97,"Bengaluru","n"],["2",76.78,30.73,"Chandigarh","n"],["3",78.48,17.4,"Hyderabad","n"],["4",77.2,28.6,"New Delhi","n"],["5",77.89,29.87,"Roorkee","n"],["6",78.03,30.32,"Dehradun","n"],["7",76.53,32.11,"Palampur","n"],["8",74.86,32.73,"Jammu","n"],["9",80.95,26.85,"Lucknow","n"],["10",86.2,22.8,"Jamshedpur","n"],["11",87.32,23.55,"Durgapur","n"],["12",86.43,23.8,"Dhanbad","n"],["13",88.36,22.57,"Kolkata","n"],["14",72.15,21.76,"Bhavnagar","n"],["15",78.78,10.07,"Karaikudi","n"],["16",80.27,13.08,"Chennai","n"],["17",76.95,8.52,"Thiruvananthapuram","n"],["18",94.2,26.75,"Jorhat","n"],["19",77.41,23.26,"Bhopal","n"]],"facts":[["1 · Bengaluru","NAL"],["2 · Chandigarh","CSIO, IMTECH"],["3 · Hyderabad","IICT"],["4 · New Delhi","IGIB, CRRI"],["5 · Roorkee","CBRI"],["6 · Dehradun","IIP"],["7 · Palampur","IHBT"],["8 · Jammu","IIIM"],["9 · Lucknow","CIMAP, IITR"],["10 · Jamshedpur","NML"],["11 · Durgapur","CMERI"],["12 · Dhanbad","CIMFR"],["13 · Kolkata","CGCRI"],["14 · Bhavnagar","CSMCRI"],["15 · Karaikudi","CECRI"],["16 · Chennai","SERC"],["17 · Thiruvananthapuram","NIIST"],["18 · Jorhat","NEIST"],["19 · Bhopal","AMPRI"]],"cap":"Numbers match the list. Labs sit near their work: metals in Jamshedpur, coal in Dhanbad, salt on the Gujarat coast."},{"k":"table","title":"India's science policies","head":["Policy","Year","Prime Minister"],"rows":[["Scientific Policy Resolution","1958","Jawaharlal Nehru"],["Technology Policy Statement","1983","Indira Gandhi"],["Science and Technology Policy","2003","Atal Bihari Vajpayee"],["Science, Technology and Innovation Policy","2013","Manmohan Singh — released at the 100th Indian Science Congress, Kolkata"],["Draft Science, Technology and Innovation Policy (STIP)","2020","Draft put out for comment in December 2020"]]},{"k":"facts","title":"ANRF and the research fund","rows":[["Law","Anusandhan National Research Foundation Act, 2023 (passed August 2023; in force February 2024)"],["Replaced","The Science and Engineering Research Board (SERB, 2008)"],["Board","The Prime Minister is President; the Ministers of Science and Technology and of Education are Vice-Presidents"],["Department","DST is its administrative department"],["Money","₹50,000 crore over five years (2023–28) — about ₹14,000 crore from the government, the rest from industry and other non-government sources"],["RDI scheme (2025)","A ₹1 lakh crore Research, Development and Innovation fund for long-term, low-cost loans to private R&D, held through a special fund under ANRF"]]},{"k":"table","title":"Science days","head":["Day","Date","Why this date"],"rows":[["National Science Day","28 February","C. V. Raman announced the Raman effect in 1928; first observed in 1987"],["National Technology Day","11 May","Pokhran-II tests, 1998"],["National Space Day","23 August","Chandrayaan-3 landed on the Moon, 2023"],["National Mathematics Day","22 December","Birthday of Srinivasa Ramanujan"],["Engineers' Day","15 September","Birthday of M. Visvesvaraya"]]},{"k":"facts","title":"Old academies, still asked","rows":[["Indian Science Congress Association","1914; first session in Kolkata (then Calcutta)"],["Indian Academy of Sciences, Bengaluru","Founded by C. V. Raman in 1934"],["Indian National Science Academy (INSA), New Delhi","Founded in 1935 as the National Institute of Sciences of India"],["National Science Day 2026 theme","'Women in Science: Catalysing Viksit Bharat'"]]},{"k":"trick","h":"Policy years — <b>“58, 83, 03, 13”<\/b>: each a generation apart, Nehru → Indira → Vajpayee → Manmohan. ANRF = <b>A<\/b>ct 20<b>23<\/b>, money <b>50<\/b>,000 crore, chaired by the <b>PM<\/b>."},{"k":"trap","h":"National Science Day (<b>28 February<\/b>) marks the <b>discovery<\/b> of the Raman effect, not Raman's birthday (7 November). <b>National Technology Day<\/b> is 11 May. Two CSIR labs are in <b>Chandigarh<\/b> (CSIO, IMTECH) and two in <b>Lucknow<\/b> (CIMAP, IITR) — and more Lucknow labs are in the HQ app."},{"k":"link","h":"The older CSIR labs — NPL and the National Chemical Laboratory, CCMB, NGRI, CDRI, NBRI, CFTRI, CLRI, NEERI, CEERI and NIO — are in <a href=\"study-hq-founders.html?lesson=H4\">Headquarters &amp; Founders<\/a>. All the days of the year are in <a href=\"study-important-days.html?lesson=D2\">Important Days<\/a>; Raman and Bhatnagar themselves are in <a href=\"study-inventions.html?lesson=I9\">Inventions &amp; Discoveries<\/a>."}],"sum":["CSIR labs by city: NAL Bengaluru, IICT Hyderabad, IGIB Delhi, CBRI Roorkee, IIP Dehradun, IHBT Palampur, IIIM Jammu.","CIMAP and IITR Lucknow, NML Jamshedpur, CMERI Durgapur, CIMFR Dhanbad, CSMCRI Bhavnagar, CECRI Karaikudi, SERC Chennai.","Policies: Scientific Policy Resolution 1958, Technology Policy Statement 1983, S&T Policy 2003, STI Policy 2013, draft STIP 2020.","ANRF Act 2023 replaced SERB; the PM chairs its board; ₹50,000 crore over five years; DST is its department.","A ₹1 lakh crore RDI fund (2025) lends to private research through ANRF.","National Science Day is 28 February (Raman effect, 1928); 2026 theme: Women in Science."],"part":["Part 1 · The science system and nuclear energy","विज्ञान व्यवस्था और परमाणु ऊर्जा"],"g":"st"},
{"id":"ST3","heat":2,"title":"Nuclear energy I: the three stages, reactors and bodies","hi":"परमाणु ऊर्जा I: त्रि-चरणीय कार्यक्रम, रिएक्टर और संस्थाएँ","blocks":[{"k":"hot","h":"Asked: <b>Bhabha's three-stage programme<\/b> and why it ends with <b>thorium<\/b>, what <b>PHWR<\/b> and <b>FBR<\/b> mean, the <b>PFBR<\/b> at Kalpakkam, which body does what (<b>BARC, NPCIL, BHAVINI, AERB, UCIL<\/b>), and the research reactors <b>Apsara, CIRUS, Dhruva, KAMINI<\/b>."},{"k":"story","h":"<p>India has little uranium but some of the world's largest reserves of <b>thorium<\/b>, in the monazite sands of the Kerala, Tamil Nadu and Odisha coasts. Thorium cannot run a reactor by itself, so in 1954 <b>Homi J. Bhabha<\/b> drew up a plan in three steps.<\/p><p><b>Stage 1<\/b>: burn natural uranium in <b>pressurised heavy water reactors<\/b> (PHWRs). They give power and leave behind <b>plutonium-239<\/b>. <b>Stage 2<\/b>: burn that plutonium in <b>fast breeder reactors<\/b>, which 'breed' more fuel than they use and, with a thorium blanket, turn thorium into <b>uranium-233<\/b>. <b>Stage 3<\/b>: run reactors on thorium and uranium-233 — power for centuries.<\/p><p>Stage 1 has run since the 1970s. Stage 2 began on <b>6 April 2026<\/b>, when the 500 MWe <b>Prototype Fast Breeder Reactor<\/b> at <b>Kalpakkam<\/b> reached first criticality — about sixteen years late. Stage 3 is still on the drawing board, in designs such as BARC's Advanced Heavy Water Reactor.<\/p>","key":"Uranium (PHWR) → plutonium (fast breeder) → thorium (stage 3). PFBR, Kalpakkam: first criticality 6 April 2026."},{"k":"table","title":"The nuclear family: who does what","head":["Body","Job","Where and when"],"rows":[["Atomic Energy Commission (AEC)","Sets India's atomic energy policy","1948; Homi J. Bhabha was the first chairman."],["Bhabha Atomic Research Centre (BARC)","Leads India's nuclear research from Trombay","Trombay, Mumbai; began in 1954 as AEET, renamed after Bhabha in 1967."],["Indira Gandhi Centre for Atomic Research (IGCAR)","Researches fast breeder reactors at Kalpakkam","Kalpakkam, Tamil Nadu; set up in 1971."],["Nuclear Power Corporation of India Ltd (NPCIL)","Builds and runs India's nuclear power stations (except the PFBR)","Mumbai; 1987. Runs every working power reactor except the fast breeder."],["BHAVINI (Bharatiya Nabhikiya Vidyut Nigam)","Builds and runs the PFBR at Kalpakkam","Kalpakkam; 2003. Built the 500 MWe PFBR."],["Atomic Energy Regulatory Board (AERB)","Checks nuclear and radiation safety","Mumbai; 1983. Became a statutory body under the SHANTI Act, 2025."],["Uranium Corporation of India Ltd (UCIL)","Mines and processes uranium","1967; its first mine is at Jaduguda, Jharkhand."],["Nuclear Fuel Complex (NFC)","Makes fuel bundles for reactors","Hyderabad; 1971."],["IREL (India) Ltd","Mines beach sands for monazite, the ore of thorium","1950; mineral sands of Kerala, Tamil Nadu and Odisha."],["Heavy Water Board","Makes heavy water for reactors","Plants at Kota, Tuticorin, Talcher, Manuguru, Hazira, Thal and Vadodara."],["Raja Ramanna Centre for Advanced Technology (RRCAT)","Works on lasers and particle accelerators","Indore; 1984."]]},{"k":"table","title":"The three stages","head":["Stage","Reactor","Fuel → what it gives"],"rows":[["1","Pressurised heavy water reactor (PHWR)","Natural uranium → power and plutonium-239"],["2","Fast breeder reactor (FBR)","Plutonium-239 with uranium; a thorium blanket → more fuel than it burns, and uranium-233"],["3","Thorium-based reactors (e.g. the Advanced Heavy Water Reactor design)","Thorium-232 with uranium-233 → power from India's thorium"]]},{"k":"table","title":"Reactor types","head":["Type","Full form","In India"],"rows":[["PHWR","Pressurised Heavy Water Reactor","The workhorse: natural uranium, heavy water as moderator and coolant; 220, 540 and 700 MWe units"],["BWR","Boiling Water Reactor","Tarapur 1 and 2 (1969), from the USA — India's oldest working reactors"],["VVER","Russian pressurised water reactor","Kudankulam, 1,000 MWe each; enriched uranium and ordinary water"],["FBR","Fast Breeder Reactor","FBTR and PFBR at Kalpakkam; liquid sodium coolant and no moderator"],["AHWR","Advanced Heavy Water Reactor","BARC's thorium design for stage 3"],["BSR / SMR","Bharat Small Reactor / Small Modular Reactor","BSR: a 220 MWe PHWR for industry; BARC is designing the BSMR-200 and SMR-55"]]},{"k":"table","title":"Research and test reactors","head":["Reactor","Year","Remember"],"rows":[["Apsara","1956","India's and Asia's first research reactor, at Trombay; rebuilt as Apsara-U (2018)"],["CIRUS","1960","Built with Canada at Trombay"],["Dhruva","1985","100 MW research reactor at BARC, fully Indian"],["FBTR","1985","Fast Breeder Test Reactor, Kalpakkam — runs on plutonium-uranium carbide fuel"],["KAMINI","1996","Kalpakkam — the world's only reactor running on uranium-233"],["PFBR","2026","500 MWe Prototype Fast Breeder Reactor, Kalpakkam — first criticality 6 April 2026"]]},{"k":"facts","title":"PFBR and the Nuclear Energy Mission (as of October 2026)","rows":[["PFBR size and fuel","500 MWe; mixed uranium-plutonium oxide (MOX) fuel; cooled by liquid sodium"],["Designed and built by","IGCAR designed it; BHAVINI built it (construction began 2004; first planned for 2010)"],["Where it stands","First criticality 6 April 2026; low-power tests and power-raising come before commercial operation"],["Elsewhere","Russia is the only other country running a commercial-scale fast breeder"],["Nuclear Energy Mission","Budget 2025-26: ₹20,000 crore for small modular reactors, at least five working by 2033"],["Long-term goal","100 GW of nuclear power by 2047 (about 8.8 GW today)"]]},{"k":"trick","h":"<b>“U → Pu → Th”<\/b>: Stage 1 uses <b>U<\/b>ranium, Stage 2 <b>P<\/b>l<b>u<\/b>tonium, Stage 3 <b>Th<\/b>orium. Kalpakkam is the <b>“K for breeder”<\/b> town: FBTR, KAMINI, PFBR, IGCAR and BHAVINI are all there."},{"k":"trap","h":"<b>NPCIL<\/b> runs the ordinary power reactors; the fast breeder belongs to <b>BHAVINI<\/b>. <b>AERB<\/b> is the safety regulator, not an operator. In a PHWR the fuel is <b>natural<\/b> uranium; Kudankulam's VVERs need <b>enriched<\/b> uranium. The PFBR is cooled by <b>liquid sodium<\/b>, not heavy water."},{"k":"link","h":"Fission, fusion, half-life and the parts of a reactor (moderator, control rods, coolant) are in <a href=\"study-chemistry.html?lesson=K18\">Chemistry<\/a> (K18); Bhabha's life is in <a href=\"study-inventions.html?lesson=I9\">Inventions &amp; Discoveries<\/a>; BARC's and IGCAR's addresses in <a href=\"study-hq-founders.html?lesson=H4\">Headquarters &amp; Founders<\/a>."}],"sum":["Bhabha's three stages: PHWR on natural uranium → fast breeder on plutonium → thorium with uranium-233.","India has huge thorium (monazite sands) but little uranium — hence the plan.","The 500 MWe PFBR at Kalpakkam (BHAVINI) reached first criticality on 6 April 2026 — stage 2 has begun.","BARC researches, NPCIL runs power plants, BHAVINI the breeder, AERB regulates, UCIL mines uranium (Jaduguda).","Apsara 1956 (first in Asia), CIRUS 1960 (Canada), Dhruva 1985, FBTR 1985, KAMINI 1996 (uranium-233).","Nuclear Energy Mission (2025): ₹20,000 crore for SMRs; 100 GW by 2047."],"part":["Part 1 · The science system and nuclear energy","विज्ञान व्यवस्था और परमाणु ऊर्जा"],"g":"st"},
{"id":"ST4","heat":2,"title":"Nuclear energy II: plants, partners, laws and Pokhran","hi":"परमाणु ऊर्जा II: संयंत्र, साझेदार, कानून और पोखरण","blocks":[{"k":"hot","h":"Asked: a <b>plant and its state<\/b>, the <b>foreign partner<\/b> of Tarapur, Rawatbhata, Kudankulam, Jaitapur and Kovvada, <b>Pokhran 1974 and 1998<\/b> (code names, leaders), the <b>nuclear doctrine<\/b> (no first use), the <b>2008 deal<\/b>, and the new <b>SHANTI Act, 2025<\/b>."},{"k":"story","h":"<p>On <b>18 May 1974<\/b>, under Indira Gandhi, scientists led by <b>Raja Ramanna<\/b> set off a 'peaceful nuclear explosion' in the desert at <b>Pokhran<\/b> — code-named <b>Smiling Buddha<\/b>. The world answered by forming the <b>Nuclear Suppliers Group<\/b> and cutting off help. Twenty-four years later, on <b>11 and 13 May 1998<\/b>, came five more tests — <b>Operation Shakti<\/b> — led by <b>A. P. J. Abdul Kalam<\/b> and <b>R. Chidambaram<\/b> under Prime Minister Vajpayee, and India declared itself a nuclear-weapon state. In 2003 it set out a doctrine of <b>no first use<\/b>.<\/p><p>The door reopened in <b>2008<\/b> with the India–US civil nuclear agreement and a waiver from the NSG. Russia's reactors rose at <b>Kudankulam<\/b>, while India built its own 700 MWe reactors at Kakrapar and Rawatbhata. In <b>December 2025<\/b> Parliament passed the <b>SHANTI Act<\/b>, which replaced the Atomic Energy Act of 1962 and the nuclear liability law of 2010 and, for the first time, let private Indian companies build and run nuclear plants.<\/p>","key":"Pokhran 1974 Smiling Buddha (Ramanna) · 1998 Shakti (Kalam, Chidambaram) · 2003 no first use · 2008 Indo-US deal · 2025 SHANTI Act."},{"k":"table","title":"Nuclear power plants at work","head":["Plant","State","Remember"],"rows":[["Tarapur","Maharashtra","India's first nuclear power station (1969); its two oldest units are boiling water reactors from the USA."],["Rawatbhata (Rajasthan Atomic Power Station)","Rajasthan","Near Kota; unit 1 built with Canada (1973); 700 MWe units 7 (2025) and 8 (fuel loaded September 2026)."],["Kalpakkam (Madras Atomic Power Station)","Tamil Nadu","India's first fully home-built PHWRs (1984); also FBTR, KAMINI and the PFBR."],["Narora","Uttar Pradesh","On the Ganga in Bulandshahr district; 1991."],["Kakrapar","Gujarat","Near Surat; unit 3 was India's first home-grown 700 MWe PHWR (commercial in 2023)."],["Kaiga","Karnataka","Uttara Kannada; unit 1 ran non-stop for a world-record 962 days (2018)."],["Kudankulam","Tamil Nadu","India's largest — 1,000 MWe VVERs built with Russia; units 1–2 running, 3–6 being built."]]},{"k":"table","title":"New and planned plants","head":["Plant","State","Remember"],"rows":[["Gorakhpur (Fatehabad)","Haryana","Four home-grown 700 MWe PHWRs being built — Haryana's first nuclear plant."],["Mahi Banswara","Rajasthan","Four 700 MWe PHWRs; foundation stone 25 September 2025; a joint venture of NPCIL (51%) and NTPC (49%)."],["Chutka","Madhya Pradesh","Two 700 MWe PHWRs planned in Mandla district."],["Jaitapur","Maharashtra","Six French EPRs (about 9,900 MWe) planned with EDF — would be the world's largest nuclear site."],["Kovvada","Andhra Pradesh","Six US AP1000 reactors (Westinghouse) planned in Srikakulam district."]]},{"k":"mapfig","title":"Nuclear power: working plants and new ones","pins":[["1",72.66,19.83,"Tarapur — Maharashtra","n"],["2",75.61,24.88,"Rawatbhata (Rajasthan Atomic Power Station) — Rajasthan","n"],["3",80.17,12.56,"Kalpakkam (Madras Atomic Power Station) — Tamil Nadu","n"],["4",78.38,28.16,"Narora — Uttar Pradesh","n"],["5",73.35,21.24,"Kakrapar — Gujarat","n"],["6",74.44,14.86,"Kaiga — Karnataka","n"],["7",77.71,8.17,"Kudankulam — Tamil Nadu","n"],["8",75.58,29.48,"Gorakhpur (Fatehabad) — Haryana (new or planned)","n"],["9",74.44,23.55,"Mahi Banswara — Rajasthan (new or planned)","n"],["10",80.4,22.6,"Chutka — Madhya Pradesh (new or planned)","n"],["11",73.35,16.6,"Jaitapur — Maharashtra (new or planned)","n"],["12",83.66,18.05,"Kovvada — Andhra Pradesh (new or planned)","n"]],"facts":[["1 · Tarapur","Maharashtra — working"],["2 · Rawatbhata (Rajasthan Atomic Power Station)","Rajasthan — working"],["3 · Kalpakkam (Madras Atomic Power Station)","Tamil Nadu — working"],["4 · Narora","Uttar Pradesh — working"],["5 · Kakrapar","Gujarat — working"],["6 · Kaiga","Karnataka — working"],["7 · Kudankulam","Tamil Nadu — working"],["8 · Gorakhpur (Fatehabad)","Haryana — new or planned"],["9 · Mahi Banswara","Rajasthan — new or planned"],["10 · Chutka","Madhya Pradesh — new or planned"],["11 · Jaitapur","Maharashtra — new or planned"],["12 · Kovvada","Andhra Pradesh — new or planned"]],"cap":"1–7 are working; 8–12 are being built or planned. Most sit on a coast or a big river, for cooling water."},{"k":"table","title":"Foreign partners","head":["Plant or reactor","Partner country","Design"],"rows":[["Tarapur units 1 and 2 (1969)","USA","Boiling water reactors supplied by General Electric."],["Rawatbhata unit 1 (1973)","Canada","A CANDU-type heavy water reactor."],["the CIRUS research reactor (1960)","Canada","Its plutonium was used for the 1974 test."],["Kudankulam","Russia","VVER-1000 pressurised water reactors (Rosatom)."],["Jaitapur (planned)","France","EDF's EPR design."],["Kovvada (planned)","USA","Westinghouse AP1000 design."]]},{"k":"tl","title":"India's nuclear road","rows":[["1948","Atomic Energy Commission set up; Atomic Energy Act passed"],["1956","Apsara, Asia's first research reactor, at Trombay"],["1962","Atomic Energy Act, 1962 replaces the 1948 law"],["1969","Tarapur — India's first nuclear power station"],["1974","Pokhran-I, 'Smiling Buddha' (18 May)"],["1998","Pokhran-II, 'Operation Shakti' (11 and 13 May)"],["2003","Nuclear doctrine: no first use"],["2008","India–US civil nuclear agreement; NSG waiver"],["2010","Civil Liability for Nuclear Damage Act"],["2025","SHANTI Act opens nuclear power to private Indian companies"],["2026","PFBR first criticality (6 April) — stage 2 begins"]]},{"k":"facts","title":"Pokhran and the doctrine","rows":[["Pokhran-I","18 May 1974, 'Smiling Buddha'; PM Indira Gandhi; team led by Raja Ramanna; one device"],["Pokhran-II","11 and 13 May 1998, 'Operation Shakti'; PM Vajpayee; A. P. J. Abdul Kalam (DRDO) and R. Chidambaram (DAE); five devices"],["Where","Pokhran test range, Jaisalmer district, Rajasthan"],["Nuclear doctrine (January 2003)","No first use; credible minimum deterrent; massive retaliation; no use against non-nuclear-weapon states"],["Nuclear Command Authority","Political Council chaired by the Prime Minister; Executive Council chaired by the National Security Adviser; weapons handled by the Strategic Forces Command"],["Treaties","India has not signed the NPT (1968) or the CTBT (1996); it is not in the NSG but joined the MTCR (2016), Wassenaar (2017) and Australia Group (2018)"]]},{"k":"facts","title":"The laws, and where things stand (as of October 2026)","rows":[["Atomic Energy Act, 1962","Kept nuclear power with the government only — repealed in 2025"],["Civil Liability for Nuclear Damage Act, 2010","Made the operator liable and let it claim from suppliers — foreign suppliers stayed away; repealed in 2025"],["SHANTI Act, 2025","Sustainable Harnessing and Advancement of Nuclear Energy for Transforming India — passed 17–18 December 2025; assent 20 December 2025"],["What SHANTI changes","Private Indian companies may build and run plants under licence; AERB becomes statutory; liability caps by reactor size; enrichment, reprocessing and spent fuel stay with the government"],["Capacity","24 reactors, about 8,780 MW (about 3% of electricity); about 22,380 MW expected by 2031–32"]]},{"k":"trick","h":"Partners by letter — <b>“US Tara, Can Rawat, Rus Kudan, Fra Jaita, US Kovva”<\/b>. Plants in a ring: <b>Ta-Ra-Ka-Na-Ka-Ka-Ku<\/b> — Tarapur, Rawatbhata, Kalpakkam, Narora, Kakrapar, Kaiga, Kudankulam."},{"k":"trap","h":"<b>Narora<\/b> is in Uttar Pradesh, <b>Kakrapar<\/b> in Gujarat and <b>Kaiga<\/b> in Karnataka. <b>Gorakhpur<\/b> nuclear plant is in <b>Haryana<\/b> (Fatehabad), not Uttar Pradesh. The 1974 test was led by <b>Raja Ramanna<\/b>; Kalam led the <b>1998<\/b> tests. SHANTI replaced the <b>1962<\/b> Act, not the 1948 one."},{"k":"link","h":"Every power plant by state — thermal, hydro, solar and wind as well as nuclear — is in <a href=\"study-indian-geography.html?lesson=G12\">Indian Geography<\/a> (G12). Agni, Prithvi and the nuclear triad are in <a href=\"study-defence.html?lesson=F5\">Defence<\/a>; National Technology Day (11 May) in <a href=\"study-important-days.html?lesson=D2\">Important Days<\/a>."}],"sum":["Working plants: Tarapur (MH, 1969), Rawatbhata (RJ), Kalpakkam (TN), Narora (UP), Kakrapar (GJ), Kaiga (KA), Kudankulam (TN, largest).","Partners: Tarapur USA, Rawatbhata-1 and CIRUS Canada, Kudankulam Russia, Jaitapur France (planned), Kovvada USA (planned).","Pokhran-I 18 May 1974 'Smiling Buddha' (Raja Ramanna); Pokhran-II 11 and 13 May 1998 'Operation Shakti' (Kalam, Chidambaram).","Doctrine 2003: no first use; NCA's Political Council is chaired by the PM.","2008: India–US civil nuclear deal and NSG waiver; India is not in the NSG and has not signed the NPT or CTBT.","SHANTI Act 2025 replaced the Atomic Energy Act 1962 and the CLND Act 2010 and lets private Indian firms run plants."],"part":["Part 1 · The science system and nuclear energy","विज्ञान व्यवस्था और परमाणु ऊर्जा"],"g":"st"},
{"id":"ST5","heat":2,"title":"Biotechnology and health technology","hi":"जैव प्रौद्योगिकी और स्वास्थ्य प्रौद्योगिकी","blocks":[{"k":"hot","h":"Asked: <b>Bt cotton<\/b> (the only GM crop grown), <b>GM mustard DMH-11<\/b> and the <b>GEAC<\/b>, the <b>Genome India<\/b> project, which company made which <b>vaccine<\/b> (Covaxin, ZyCoV-D, Cervavac), and India's firsts in <b>gene and cell therapy<\/b> — NexCAR19, BIRSA 101 — and <b>genome-edited rice<\/b>."},{"k":"story","h":"<p>In <b>2002<\/b> India allowed its first genetically modified crop: <b>Bt cotton<\/b>, carrying a gene from the soil bacterium <i>Bacillus thuringiensis<\/i> that kills the bollworm. It is still the only GM crop farmers may grow. <b>Bt brinjal<\/b> was cleared by the regulator, the <b>GEAC<\/b>, in 2009 but put on hold in 2010; <b>GM mustard DMH-11<\/b>, bred at Delhi University, was cleared in 2022 and is stuck in the Supreme Court.<\/p><p>The pandemic turned India into a vaccine lab. Bharat Biotech made <b>Covaxin<\/b>, Zydus made <b>ZyCoV-D<\/b> — the world's first DNA vaccine for people — and Gennova made India's first <b>mRNA<\/b> vaccine. Then came the cures: the first home-grown <b>CAR-T<\/b> cancer therapy (2023), a <b>haemophilia<\/b> gene-therapy trial at CMC Vellore (2024), and <b>BIRSA 101<\/b>, a CRISPR therapy for sickle cell disease (2025). In 2025 India also released the first <b>genome-edited rice<\/b> and the data of the <b>Genome India<\/b> project — 10,000 Indian genomes.<\/p>","key":"Bt cotton 2002 is the only GM crop · GEAC is under the Environment Ministry · ZyCoV-D DNA, GEMCOVAC mRNA, Covaxin inactivated · BIRSA 101 CRISPR (2025)."},{"k":"table","title":"Vaccines made in India","head":["Vaccine","Maker","Remember"],"rows":[["Covaxin","Bharat Biotech","India's first home-grown COVID-19 vaccine (with ICMR-NIV); an inactivated (killed) virus vaccine."],["Covishield","Serum Institute of India","The Oxford–AstraZeneca vaccine made in Pune; a viral-vector vaccine."],["ZyCoV-D","Zydus (Cadila)","The world's first DNA vaccine for humans, against COVID-19 (2021); given without a needle."],["Corbevax","Biological E","A protein-subunit COVID-19 vaccine from Hyderabad."],["GEMCOVAC","Gennova Biopharmaceuticals","India's first mRNA vaccine (2022), from Pune."],["iNCOVACC","Bharat Biotech","India's first nasal COVID-19 vaccine (2022–23)."],["Cervavac","Serum Institute of India","India's first home-grown HPV vaccine against cervical cancer (2022), backed by DBT–BIRAC."],["Rotavac","Bharat Biotech","India's first home-grown rotavirus (diarrhoea) vaccine (2015)."],["Pneumosil","Serum Institute of India","India's first home-grown pneumococcal (pneumonia) vaccine (2020)."]]},{"k":"table","title":"Firsts in gene therapy, medicine and crops","head":["Breakthrough","Developed by","Remember"],"rows":[["NexCAR19","ImmunoACT (IIT Bombay) with Tata Memorial Centre","India's first home-grown CAR-T cell therapy for blood cancers; approved October 2023."],["First human gene-therapy trial for haemophilia A in India","CMC Vellore","Announced in 2024; a lentiviral vector adds the Factor VIII gene to the patient's own stem cells."],["BIRSA 101","CSIR-IGIB","India's first home-grown CRISPR gene therapy, for sickle cell disease (November 2025); named after Birsa Munda."],["DRR Dhan 100 (Kamala)","ICAR-Indian Institute of Rice Research, Hyderabad","Genome-edited rice released in May 2025; ripens about 20 days earlier and yields more."],["Pusa DST Rice 1","ICAR-Indian Agricultural Research Institute, New Delhi","Genome-edited rice for salty and alkaline soils (May 2025)."],["Nafithromycin (Miqnaf)","Wockhardt, with BIRAC","India's first home-grown antibiotic (November 2024), for drug-resistant pneumonia."],["GM mustard DMH-11","Deepak Pental's team, University of Delhi","Dhara Mustard Hybrid-11; GEAC cleared its release in October 2022; the case is in the Supreme Court."],["Bt cotton","Mahyco with Monsanto","Approved in 2002 — still the only GM crop grown commercially in India."]]},{"k":"facts","title":"GM crops and the GEAC","rows":[["GEAC","Genetic Engineering Appraisal Committee — under the Ministry of Environment, Forest and Climate Change; works under the 1989 Rules of the Environment (Protection) Act, 1986"],["Bt cotton","Approved in 2002; the only GM crop grown commercially in India (as of 2026)"],["Bt brinjal","Cleared by GEAC in 2009; the government put a moratorium on it in February 2010 (it is grown in Bangladesh)"],["GM mustard DMH-11","Made with the barnase–barstar system; GEAC approved its environmental release in October 2022; in July 2024 the Supreme Court gave a split verdict and asked the Centre to frame a national policy on GM crops"],["Genome-edited plants","Edits that add no foreign DNA (SDN-1 and SDN-2) were freed from the GM rules in 2022 — which let the 2025 rice varieties through"]]},{"k":"facts","title":"Big biotech programmes","rows":[["Genome India","DBT project begun in 2020; about 10,000 genomes from dozens of Indian population groups; data released on 9 January 2025"],["Indian Biological Data Centre (IBDC)","Faridabad, Haryana — India's first national store for life-science data; holds the Genome India data"],["IndiGen (2019)","CSIR's earlier project that sequenced about 1,000 Indian genomes"],["BioE3 Policy (August 2024)","Biotechnology for Economy, Environment and Employment — biomanufacturing hubs and biofoundries"],["HPV vaccination (28 February 2026)","Free nationwide drive for 14-year-old girls launched at Ajmer; uses one dose of Gardasil-4"]]},{"k":"trick","h":"Vaccine types by letter — <b>“Co-In, Zy-DNA, Gem-mRNA, Corbe-Protein, Covi-Vector”<\/b>: Covaxin inactivated, ZyCoV-D DNA, GEMCOVAC mRNA, Corbevax protein, Covishield viral vector."},{"k":"trap","h":"<b>GEAC<\/b> belongs to the <b>Environment<\/b> Ministry, not the Department of Biotechnology. <b>Cervavac<\/b> is India's own HPV vaccine, but the 2026 national drive uses <b>Gardasil-4<\/b>. <b>Covishield<\/b> was made by the Serum Institute but designed at Oxford; <b>Covaxin<\/b> is the fully Indian one. Genome-edited rice is <b>not<\/b> GM rice — no foreign gene is added."},{"k":"link","h":"What a gene, DNA and CRISPR are — and genome sequencing and DNA barcoding — are in <a href=\"study-space.html?lesson=L16\">Space &amp; ISRO<\/a> (L16) and <a href=\"study-biology.html?lesson=L23\">Biology<\/a> (L23). The pioneers of vaccines and antibiotics (Jenner, Pasteur, Fleming) are in <a href=\"study-inventions.html?lesson=I5\">Inventions &amp; Discoveries<\/a>."}],"sum":["Bt cotton (2002) is India's only commercially grown GM crop; Bt brinjal is on hold since 2010.","GM mustard DMH-11 (Delhi University) was cleared by GEAC in 2022; the Supreme Court split in 2024.","GEAC is under the Ministry of Environment, Forest and Climate Change.","Covaxin — Bharat Biotech; ZyCoV-D — Zydus (first DNA vaccine); GEMCOVAC — Gennova (first mRNA); Cervavac — Serum Institute (HPV).","NexCAR19 (2023) first Indian CAR-T; BIRSA 101 (2025) first Indian CRISPR therapy, for sickle cell; haemophilia gene therapy at CMC Vellore.","Genome India: 10,000 genomes, data out January 2025 at IBDC Faridabad; genome-edited rice DRR Dhan 100 and Pusa DST Rice 1 (May 2025)."],"part":["Part 2 · Biotech, new missions and Digital India","जैव प्रौद्योगिकी, नए मिशन और डिजिटल इंडिया"],"g":"st"},
{"id":"ST6","heat":2,"title":"National missions in new technology","hi":"नई प्रौद्योगिकी के राष्ट्रीय मिशन","blocks":[{"k":"hot","h":"Asked: the year, money and ministry of each mission — <b>Quantum<\/b> (2023, ₹6,003 crore, DST), <b>Semiconductor<\/b> (2021, ₹76,000 crore, MeitY), <b>IndiaAI<\/b> (2024, ₹10,372 crore), <b>Green Hydrogen<\/b> (2023, 5 MMT by 2030), <b>Supercomputing<\/b> (2015, PARAM), <b>NM-ICPS<\/b> (2018) — and where the first <b>chip fab<\/b> is coming up (Dholera)."},{"k":"story","h":"<p>Since 2015 India has bet on a string of 'missions' — each with a fixed sum of money, a ministry in charge and a target. The <b>National Supercomputing Mission<\/b> (2015) builds PARAM machines with C-DAC. The <b>India Semiconductor Mission<\/b> (2021) pays half the cost of chip plants; Micron's assembly unit at Sanand came first, and the Tata–PSMC fab at <b>Dholera<\/b> in Gujarat is to be India's first commercial chip factory.<\/p><p>In 2023 came the <b>National Green Hydrogen Mission<\/b> (5 million tonnes a year by 2030) and the <b>National Quantum Mission<\/b>, with four hubs at IISc and three IITs. The <b>IndiaAI Mission<\/b> (2024) buys GPUs that start-ups can rent cheaply and backs Indian AI models. Under the sea, the <b>Deep Ocean Mission<\/b> (2021) is building <b>Matsya-6000<\/b> to carry three people 6,000 metres down.<\/p>","key":"Supercomputing 2015 · NM-ICPS 2018 · Deep Ocean and Semiconductor 2021 · Green Hydrogen and Quantum 2023 · IndiaAI 2024 · Nuclear Energy 2025."},{"k":"table","title":"Missions and when they began","head":["Mission","Approved","Money and aim"],"rows":[["National Supercomputing Mission","2015","₹4,500 crore; build and install PARAM supercomputers"],["National Mission on Interdisciplinary Cyber-Physical Systems (NM-ICPS)","2018","₹3,660 crore; 25 Technology Innovation Hubs; extended to December 2027"],["Deep Ocean Mission","2021","₹4,077 crore; Samudrayaan (Matsya-6000), deep-sea minerals"],["India Semiconductor Mission","2021","₹76,000 crore for chip fabs, packaging units and design"],["National Green Hydrogen Mission","2023","₹19,744 crore; 5 million tonnes of green hydrogen a year by 2030"],["National Quantum Mission","2023","₹6,003.65 crore (2023-24 to 2030-31); four thematic hubs"],["IndiaAI Mission","2024","₹10,371.92 crore; GPUs, Indian AI models, datasets"],["Nuclear Energy Mission","2025","₹20,000 crore for small modular reactors; 100 GW by 2047"],["Nano Mission","2007","DST's mission for nanoscience and nanotechnology"]]},{"k":"table","title":"Which ministry runs it","head":["Mission","Ministry or department","Run with"],"rows":[["National Supercomputing Mission","DST and MeitY together","C-DAC, Pune and IISc, Bengaluru"],["NM-ICPS","Department of Science and Technology","25 hubs in IITs, IISc and other institutes"],["National Quantum Mission","Department of Science and Technology","Four T-Hubs"],["Deep Ocean Mission","Ministry of Earth Sciences","NIOT, Chennai"],["India Semiconductor Mission","Ministry of Electronics and IT","Semi-Conductor Laboratory, Mohali"],["IndiaAI Mission","Ministry of Electronics and IT","IndiaAI Independent Business Division"],["National Green Hydrogen Mission","Ministry of New and Renewable Energy","SIGHT incentives; port hubs"],["Nuclear Energy Mission","Department of Atomic Energy","BARC and NPCIL, with private partners"]]},{"k":"facts","title":"Quantum and AI (as of October 2026)","rows":[["Quantum T-Hubs","IISc Bengaluru — computing; IIT Madras with C-DOT — communication; IIT Bombay — sensing and metrology; IIT Delhi — materials and devices"],["Quantum targets","Computers of 50–1,000 physical qubits in eight years; satellite quantum communication over 2,000 km"],["QpiAI-Indus (April 2025)","A 25-qubit machine from a Bengaluru start-up — India's first full-stack quantum computer"],["IndiaAI compute","More than 38,000 GPUs offered to start-ups and researchers at low hourly rates"],["Indian AI models","Shown at the India AI Impact Summit, Bharat Mandapam, February 2026 — Sarvam's models and BharatGen's Param2"]]},{"k":"facts","title":"Chips, supercomputers and hydrogen (as of October 2026)","rows":[["Chip projects","12 approved by May 2026 (about ₹1.64 lakh crore); the first was Micron's assembly and test unit at Sanand (2023)"],["First commercial fab","Tata Electronics with PSMC of Taiwan at Dholera, Gujarat — target about 2028"],["Packaging units","Tata at Jagiroad (Assam); CG Power–Renesas and Kaynes at Sanand; HCL–Foxconn near Jewar (Uttar Pradesh)"],["Semiconductor Mission 2.0","Announced in the Budget 2026-27; equipment, materials and Indian chip design"],["Supercomputers","40 systems of about 68 petaflops under the mission (September 2026); PARAM Shivay at IIT (BHU) was the first built in India under it (2019)"],["PARAM Rudra","Three systems dedicated in September 2024 at Pune, Delhi and Kolkata; another at IIT Bombay (January 2026)"],["Weather supercomputers","Arka (IITM Pune) and Arunika (NCMRWF Noida), 2024"],["Green hydrogen hubs","Deendayal (Kandla), Paradip and V.O. Chidambaranar (Tuticorin) ports, recognised in 2025"],["SIGHT","Strategic Interventions for Green Hydrogen Transition — ₹17,490 crore of the mission's money for electrolysers and green hydrogen"]]},{"k":"trick","h":"Mission years as a staircase — <b>“15 Super, 18 Cyber, 21 Ocean & Chips, 23 Hydrogen & Quantum, 24 AI, 25 Nuclear”<\/b>. Money: Chips <b>76<\/b> thousand crore, Hydrogen <b>19.7<\/b>, AI <b>10.4<\/b>, Quantum <b>6<\/b>."},{"k":"trap","h":"The <b>Quantum<\/b> Mission is run by <b>DST<\/b>, but <b>IndiaAI<\/b> and <b>Semiconductor<\/b> by <b>MeitY<\/b>; <b>Green Hydrogen<\/b> by <b>MNRE<\/b>, not the Petroleum Ministry. <b>Micron<\/b>'s Sanand plant packs and tests memory chips — it is not a fab; the first fab is <b>Dholera<\/b>. The <b>Deep Ocean Mission<\/b> is MoES's, not ISRO's."},{"k":"link","h":"Samudrayaan and Matsya-6000 in detail, and ISRO's Vikram 3201 chip, are in <a href=\"study-space.html?lesson=L15\">Space &amp; ISRO<\/a> (L15). Green hydrogen colours and the scheme money are in <a href=\"study-govt-schemes.html?lesson=L12\">Government Schemes<\/a> (L12); PARAM 8000 and the history of computers in <a href=\"study-computer.html\">Computer Knowledge<\/a>; the 2026 chip and AI news month by month in <a href=\"study-current-affairs.html\">Current Affairs 2026<\/a>."}],"sum":["National Supercomputing Mission 2015 (DST + MeitY, C-DAC): 40 systems, about 68 PF by September 2026.","NM-ICPS 2018: ₹3,660 crore, 25 Technology Innovation Hubs (DST).","India Semiconductor Mission 2021: ₹76,000 crore; first fab Tata–PSMC at Dholera; Micron's ATMP at Sanand came first.","National Green Hydrogen Mission (MNRE, January 2023): ₹19,744 crore, 5 MMT a year by 2030; hubs at Kandla, Paradip, Tuticorin.","National Quantum Mission (DST, April 2023): ₹6,003.65 crore; hubs at IISc and IITs Madras, Bombay, Delhi.","IndiaAI Mission (MeitY, March 2024): ₹10,371.92 crore; 38,000+ GPUs. Deep Ocean Mission (MoES, 2021): Matsya-6000."],"part":["Part 2 · Biotech, new missions and Digital India","जैव प्रौद्योगिकी, नए मिशन और डिजिटल इंडिया"],"g":"st"},
{"id":"ST7","heat":2,"title":"Digital India and digital public infrastructure","hi":"डिजिटल इंडिया और डिजिटल सार्वजनिक अवसंरचना","blocks":[{"k":"hot","h":"Asked: the year each platform began (<b>Aadhaar 2010, DigiLocker 2015, UPI 2016, CoWIN 2021, ONDC and Bhashini 2022<\/b>), who runs it, the <b>DPDP Act, 2023<\/b> (Data Protection Board, ₹250 crore), the <b>IT Rules, 2021<\/b>, <b>CERT-In<\/b> (2004, six-hour rule), and the latest <b>UPI<\/b> numbers."},{"k":"story","h":"<p>Most countries let private companies build their digital roads. India built public ones that anyone may use, now called <b>digital public infrastructure<\/b> or the <b>India Stack<\/b>. The first layer is identity: <b>Aadhaar<\/b>, whose first number was given on 29 September 2010 to Ranjana Sonawane of <b>Tembhli<\/b> village in Nandurbar, Maharashtra. Then payments: <b>UPI<\/b> (2016) lets any bank app pay any other. Then data: <b>DigiLocker<\/b> (2015) keeps your certificates, and consent tools let you share them.<\/p><p>On top came platforms for health (<b>CoWIN<\/b> for COVID vaccines, <b>ABHA<\/b> health IDs), trade (<b>ONDC<\/b>, an open network rather than one big shop) and language (<b>Bhashini<\/b>, AI translation). With so much data online, India passed the <b>Digital Personal Data Protection Act<\/b> in 2023; its rules were notified in November 2025.<\/p>","key":"Identity (Aadhaar 2010) → payments (UPI 2016) → data (DigiLocker 2015) → platforms (CoWIN, ONDC, Bhashini) → protection (DPDP Act 2023)."},{"k":"table","title":"Platforms and when they began","head":["Platform","Began","What it does"],"rows":[["Aadhaar","2010","A 12-digit identity number linked to fingerprints, iris and face; issued by UIDAI."],["DigiLocker","2015","A cloud locker for official documents; papers kept in it are legally valid."],["UPI","2016","Instant bank-to-bank payments from a phone; built by NPCI."],["UMANG","2017","One app for central, state and local government services."],["ABHA (Ayushman Bharat Health Account)","2021","A 14-digit health ID under the Ayushman Bharat Digital Mission."],["CoWIN","2021","Booked and recorded COVID-19 vaccinations and gave certificates with a QR code."],["ONDC","2022","Open Network for Digital Commerce — any buyer app can reach any seller on the network."],["Bhashini","2022","AI tools to translate and speak in Indian languages."],["U-WIN","2024","A digital record of routine vaccinations for children and pregnant women."]]},{"k":"facts","title":"Aadhaar and UPI in numbers","rows":[["UIDAI","Set up in 2009 (first chairman Nandan Nilekani); a statutory body under MeitY since the Aadhaar Act, 2016"],["First Aadhaar","29 September 2010, Tembhli village, Nandurbar district, Maharashtra"],["Aadhaar numbers issued","More than 138 crore (end of 2024)"],["Supreme Court, 2018","Upheld Aadhaar (Puttaswamy case) but limited its use by private companies; the 2017 ruling had made privacy a fundamental right"],["UPI, September 2026","24.07 billion transactions worth ₹29.37 lakh crore; record month August 2026 (24.51 billion)"],["UPI abroad","Live in 11 foreign countries (August 2026), including Bhutan, Nepal, Singapore, the UAE, France, Sri Lanka, Mauritius, Qatar, Cambodia, Greece and the Maldives"]]},{"k":"table","title":"Laws and watchdogs","head":["Law or body","Year","What it does"],"rows":[["Information Technology Act","2000","Made e-records and digital signatures legal and defined cyber crimes (see Computer Knowledge)."],["CERT-In","2004","National agency that handles cyber attacks; under Section 70B of the IT Act; incidents must be reported within 6 hours."],["NCIIPC","2014","Protects critical information infrastructure such as power grids and banks; part of NTRO (Section 70A)."],["IT (Intermediary Guidelines and Digital Media Ethics Code) Rules","2021","Duties of social media, digital news and OTT platforms; an amendment of February 2026 covers AI-made 'synthetic' content."],["Digital Personal Data Protection Act","2023","India's personal data law; a Data Protection Board; penalties up to ₹250 crore."],["Telecommunications Act","2023","Replaced the Indian Telegraph Act of 1885."],["DPDP Rules","2025","Notified on 14 November 2025; fully in force after 18 months (by May 2027)."]]},{"k":"facts","title":"Words of the DPDP Act, 2023","rows":[["Data Principal","The person the data is about"],["Data Fiduciary","The company or body that decides why and how the data is used"],["Consent Manager","A registered platform through which a person gives, manages or withdraws consent"],["Significant Data Fiduciary","A large data handler with extra duties, such as a data protection officer and audits"],["Children","Anyone under 18; their data needs verifiable consent of a parent"],["Penalty","Up to ₹250 crore for failing to protect data; assent 11 August 2023"]]},{"k":"facts","title":"Who runs what","rows":[["Digital India","Launched 1 July 2015; Ministry of Electronics and Information Technology (MeitY)"],["UPI","National Payments Corporation of India (NPCI), set up by the RBI and Indian Banks' Association"],["ONDC","Set up by DPIIT (Ministry of Commerce and Industry) in December 2021; first pilot in five cities, April 2022"],["Bhashini","MeitY's National Language Translation Mission; launched 4 July 2022 at Gandhinagar"],["CoWIN and U-WIN","Ministry of Health and Family Welfare"],["JAM trinity","Jan Dhan accounts, Aadhaar and Mobile phones — the base for direct benefit transfers"]]},{"k":"trick","h":"Launch years as a ladder — <b>“10 Aadhaar, 15 Locker, 16 UPI, 17 UMANG, 21 CoWIN, 22 ONDC-Bhashini, 23 DPDP”<\/b>. ID digits: <b>Aadhaar 12, ABHA 14<\/b>."},{"k":"trap","h":"<b>ONDC<\/b> is an open <b>network<\/b> run under <b>DPIIT<\/b>, not an app and not run by NPCI. <b>CERT-In<\/b> is under <b>MeitY<\/b> (Section 70B); <b>NCIIPC<\/b> is part of <b>NTRO<\/b> (Section 70A). The DPDP Act's board is the <b>Data Protection Board of India<\/b>, and the maximum penalty is <b>₹250 crore<\/b>, not ₹500 crore. UPI is built by <b>NPCI<\/b>, not the RBI."},{"k":"link","h":"IT Act sections (66, 66A–66F, 67) and the 1930 cyber helpline are in <a href=\"study-computer-internet.html?lesson=C22\">Computer Knowledge<\/a> (C22). NEFT, RTGS, IMPS, RuPay and how UPI fits with them are in <a href=\"study-banking.html?lesson=N7\">Banking<\/a> (N7); UMANG and GeM in <a href=\"study-govt-schemes.html?lesson=L12\">Government Schemes<\/a>."}],"sum":["Aadhaar: UIDAI 2009, first number 29 September 2010 at Tembhli (Nandurbar, Maharashtra); Aadhaar Act 2016; over 138 crore issued.","DigiLocker 2015, UPI 2016 (NPCI), UMANG 2017, CoWIN and ABHA 2021, ONDC and Bhashini 2022, U-WIN 2024.","UPI in September 2026: 24.07 billion transactions (₹29.37 lakh crore); live in 11 foreign countries.","DPDP Act 2023: Data Principal, Data Fiduciary, Consent Manager, Data Protection Board; penalty up to ₹250 crore; rules notified 14 November 2025.","IT Rules 2021 govern social media and OTT; a 2026 amendment covers AI-made content.","CERT-In (2004, Section 70B) — report incidents within 6 hours; NCIIPC (NTRO) guards critical infrastructure."],"part":["Part 2 · Biotech, new missions and Digital India","जैव प्रौद्योगिकी, नए मिशन और डिजिटल इंडिया"],"g":"st"},
{"id":"ST8","heat":2,"title":"Polar, ocean and earth science","hi":"ध्रुवीय, महासागर और पृथ्वी विज्ञान","blocks":[{"k":"hot","h":"Asked: India's stations — <b>Dakshin Gangotri<\/b> (1983), <b>Maitri<\/b> (1989), <b>Bharati<\/b> (2012) in Antarctica and <b>Himadri<\/b> (2008) in the Arctic — the <b>first expedition<\/b> (1981–82), <b>NCPOR<\/b> Goa, the <b>Indian Antarctic Act, 2022<\/b>, <b>IMD<\/b>'s colour warnings, and <b>INCOIS<\/b>' tsunami warning centre."},{"k":"story","h":"<p>In December 1981 a team led by <b>S. Z. Qasim<\/b> sailed from Goa and landed in Antarctica on 9 January 1982 — India's <b>first expedition<\/b>. Two years later India built <b>Dakshin Gangotri<\/b> on the ice shelf; snow slowly buried it, and in 1990 it was closed. Its successor, <b>Maitri<\/b> (1989), stands on rock in the <b>Schirmacher Oasis<\/b>, and <b>Bharati<\/b> (2012), made of shipping containers, sits in the <b>Larsemann Hills<\/b>. In the far north, <b>Himadri<\/b> (2008) is India's Arctic station at <b>Ny-Ålesund<\/b> on Norway's Svalbard islands.<\/p><p>All of them are run by the <b>National Centre for Polar and Ocean Research<\/b> in Goa, under the Ministry of Earth Sciences. In 2022 Parliament passed the <b>Indian Antarctic Act<\/b>, so Indian law now applies to Indian expeditions there. Closer to home, <b>IMD<\/b> gives colour-coded warnings and <b>INCOIS<\/b> in Hyderabad runs the tsunami warning centre set up after the 2004 tsunami.<\/p>","key":"Dakshin Gangotri 1983 (closed 1990) · Maitri 1989 · Bharati 2012 · Himadri 2008 (Svalbard) · NCPOR Goa · Indian Antarctic Act 2022."},{"k":"table","title":"India's research stations","head":["Station","Where","Remember"],"rows":[["Dakshin Gangotri","An ice shelf in Queen Maud Land, Antarctica","India's first Antarctic station (1983–84); buried in ice and closed in 1990; now a supply base."],["Maitri","Schirmacher Oasis, Antarctica","Built in 1989; Maitri II, a greener replacement, is planned for about 2029."],["Bharati","Larsemann Hills, Antarctica","Opened in 2012; built from 134 shipping containers."],["Himadri","Ny-Ålesund, Svalbard (Norway), in the Arctic","India's first Arctic research station (2008)."],["IndARC (underwater observatory)","Kongsfjorden, Svalbard","India's first underwater observatory in the Arctic (2014)."],["Himansh","Chandra basin, Spiti (Himachal Pradesh)","A high-altitude station for studying Himalayan glaciers (2016)."]]},{"k":"tlfig","title":"India's polar and Himalayan stations","rows":[[1983,"Dakshin Gangotri","Antarctica — closed 1990"],[1989,"Maitri","Antarctica"],[2008,"Himadri","Arctic (Svalbard)"],[2012,"Bharati","Antarctica"],[2014,"IndARC","Arctic, under water"],[2016,"Himansh","Himalaya (Spiti)"]],"cap":"Maitri II, to replace Maitri, is targeted for about 2029."},{"k":"photos","title":"The stations in pictures","items":[["Dakshin_Gangotri","Dakshin Gangotri","1983"],["Maitri_(research_station)","Maitri","1989"],["Bharati_(research_station)","Bharati","2012"],["Himadri_Station","Himadri","2008, Svalbard"]]},{"k":"facts","title":"Antarctica and the Arctic","rows":[["First expedition","Left Goa in December 1981, led by S. Z. Qasim; landed on 9 January 1982"],["Antarctic Treaty","India joined in 1983 and became a consultative member the same year"],["Indian Antarctic Act, 2022","India's first law on Antarctica (passed August 2022); permits for every Indian expedition; bans mining; a Committee on Antarctic Governance and Environmental Protection, chaired by the MoES Secretary"],["ATCM 2024","India hosted the 46th Antarctic Treaty Consultative Meeting at Kochi, May 2024"],["Svalbard Treaty","Signed by British India in 1920 — the basis for India's Arctic station"],["Arctic Council","India has been an observer since 2013"],["Arctic Policy","'India and the Arctic: building a partnership for sustainable development', March 2022 — six pillars"],["Maitri II","A new green station to replace Maitri; completion targeted for about January 2029"]]},{"k":"table","title":"Earth-science bodies of MoES","head":["Body","City","Job"],"rows":[["India Meteorological Department (IMD)","New Delhi","Weather forecasts and warnings; set up in 1875."],["National Centre for Polar and Ocean Research (NCPOR)","Vasco da Gama, Goa","Runs the Antarctic and Arctic stations; named NCAOR from 1998 to 2018."],["Indian National Centre for Ocean Information Services (INCOIS)","Hyderabad","Ocean forecasts, fishing-zone advisories and the tsunami warning centre (2007)."],["National Institute of Ocean Technology (NIOT)","Chennai","Ocean technology; building the Matsya-6000 submersible."],["Indian Institute of Tropical Meteorology (IITM)","Pune","Monsoon research; runs the 6 km Bharat Forecast System (2025)."],["National Centre for Medium Range Weather Forecasting (NCMRWF)","Noida","Weather forecasts several days ahead."],["National Centre for Earth Science Studies (NCESS)","Thiruvananthapuram","Earth system science — coasts, land and natural hazards."]]},{"k":"facts","title":"Warnings and weather","rows":[["IMD colour codes","Green — no action; Yellow — be aware; Orange — be prepared; Red — take action"],["Tsunami warnings","Indian Tsunami Early Warning Centre at INCOIS, Hyderabad (2007) — also warns other Indian Ocean countries"],["Cyclone names","Chosen in turn from lists of the 13 countries of the WMO/ESCAP Panel on Tropical Cyclones"],["Mission Mausam (September 2024)","₹2,000 crore to make India 'weather-ready' — by IMD, IITM and NCMRWF"],["Apps","Mausam (weather), Meghdoot (farm advisories), Damini (lightning alerts)"],["PRITHVI scheme (2024)","MoES umbrella scheme joining five schemes on atmosphere, ocean, polar, seismology and outreach"]]},{"k":"trick","h":"Stations in order — <b>“Dakshin–Maitri–Himadri–Bharati”: 83, 89, 08, 12<\/b>. South (Dakshin) first, Friendship (Maitri) next, Snow-home (Himadri) in the north, Bharati last."},{"k":"trap","h":"<b>Himadri<\/b> is in the <b>Arctic<\/b> (Svalbard, Norway), not Antarctica. <b>Dakshin Gangotri<\/b> is no longer a research station. <b>NCPOR<\/b> is in <b>Goa<\/b> (Vasco da Gama), but <b>NIOT<\/b> (ocean technology) is in <b>Chennai<\/b> and <b>INCOIS<\/b> in <b>Hyderabad<\/b>. A <b>red<\/b> alert means take action; <b>orange<\/b> means be prepared."},{"k":"link","h":"Samudrayaan and Matsya-6000 are in <a href=\"study-space.html?lesson=L15\">Space &amp; ISRO<\/a> (L15); the monsoon itself in <a href=\"study-indian-geography.html?lesson=G9\">Indian Geography<\/a> (G9); cyclones, El Niño and earthquakes in <a href=\"study-physical-geography.html\">Physical Geography<\/a>; NIO and NCPOR addresses in <a href=\"study-hq-founders.html?lesson=H4\">Headquarters &amp; Founders<\/a>."}],"sum":["Antarctic stations: Dakshin Gangotri (1983–84, closed 1990), Maitri (1989, Schirmacher Oasis), Bharati (2012, Larsemann Hills).","Arctic: Himadri (2008) at Ny-Ålesund, Svalbard; IndARC underwater observatory (2014). Himalaya: Himansh (2016).","First expedition 1981–82 led by S. Z. Qasim; India joined the Antarctic Treaty in 1983.","Indian Antarctic Act 2022; India hosted the 46th ATCM at Kochi in 2024; Arctic Policy 2022; Arctic Council observer since 2013.","NCPOR Goa runs the polar work; INCOIS Hyderabad runs the tsunami centre (2007); NIOT Chennai; IITM Pune; IMD New Delhi (1875).","Mission Mausam (2024): ₹2,000 crore. IMD red = take action, orange = be prepared."],"part":["Part 3 · Earth science, awards, terms and revision","पृथ्वी विज्ञान, पुरस्कार, शब्दावली और दोहराव"],"g":"st"},
{"id":"ST9","heat":1,"title":"Science awards and scientists of today","hi":"विज्ञान पुरस्कार और आज के वैज्ञानिक","blocks":[{"k":"hot","h":"Asked: the four <b>Rashtriya Vigyan Puraskar<\/b> awards and their limits, the first <b>Vigyan Ratna<\/b> (G. Padmanabhan, 2024) and the 2025 one (Jayant Narlikar), the <b>team awards<\/b>, the <b>Infosys Prize<\/b>, the <b>Kalinga Prize<\/b>, and Indian-origin winners of the <b>Fields, Abel and Turing<\/b> awards."},{"k":"story","h":"<p>For decades the prize every young Indian scientist wanted was the <b>Shanti Swarup Bhatnagar Prize<\/b>, given by CSIR since <b>1958<\/b>. In 2023 the government cut down hundreds of science awards and put one national award in their place: the <b>Rashtriya Vigyan Puraskar<\/b>. It has four parts, like the Padma awards: <b>Vigyan Ratna<\/b> for a lifetime, <b>Vigyan Shri<\/b> for distinguished work, <b>Vigyan Yuva–Shanti Swarup Bhatnagar<\/b> for scientists up to 45, and <b>Vigyan Team<\/b> for groups.<\/p><p>The first awards were presented by President Droupadi Murmu on <b>22 August 2024<\/b> — 33 in all, with the first Vigyan Ratna to the biochemist <b>G. Padmanabhan<\/b> and the team award to <b>Chandrayaan-3<\/b>. In 2025 the Vigyan Ratna went, after his death, to the astrophysicist <b>Jayant Narlikar<\/b>, and the team award to CSIR's <b>Aroma Mission<\/b>. The same year India lost several giants: Narlikar, <b>K. Kasturirangan<\/b>, <b>R. Chidambaram<\/b> and <b>M. R. Srinivasan<\/b>.<\/p>","key":"RVP (from 2023, first given 2024): Vigyan Ratna, Shri, Yuva–SSB (up to 45), Team. Ratna 2024 Padmanabhan; 2025 Narlikar."},{"k":"table","title":"Rashtriya Vigyan Puraskar: the four awards","head":["Award","For","Remember"],"rows":[["Vigyan Ratna","Lifetime achievement in science","Up to 3 a year; 2024 — G. Padmanabhan; 2025 — Jayant Narlikar (posthumous)."],["Vigyan Shri","Distinguished work by a scientist","Up to 25 a year."],["Vigyan Yuva–Shanti Swarup Bhatnagar","Young scientists up to 45 years of age","Up to 25 a year; carries on the name of the old Bhatnagar Prize."],["Vigyan Team","Teams of three or more scientists","Up to 3 a year; 2024 — Team Chandrayaan-3; 2025 — CSIR Aroma Mission."]]},{"k":"facts","title":"About the Rashtriya Vigyan Puraskar","rows":[["Instituted","2023, when the government merged and cut down hundreds of science awards; first presented in 2024"],["First ceremony","22 August 2024 at Rashtrapati Bhavan — 33 awards, presented by President Droupadi Murmu"],["What winners get","A medal and a certificate (sanad)"],["Fields","13 domains, from physics, chemistry and mathematics to atomic energy and space"],["2025 list","Announced in October 2025: Vigyan Ratna Jayant Narlikar (posthumous), 8 Vigyan Shri, 14 Vigyan Yuva, team award to CSIR Aroma Mission"],["Bhatnagar Prize","Given by CSIR from 1958 to scientists under 45; its name now lives on in Vigyan Yuva"]]},{"k":"table","title":"Other science prizes","head":["Prize","Given by","Remember"],"rows":[["Infosys Prize","Infosys Science Foundation","Six fields; USD 100,000 each; for researchers under 40 since 2024."],["Kalinga Prize","UNESCO","For making science popular; set up in 1952 with money from Biju Patnaik."],["SASTRA Ramanujan Prize","SASTRA University, Thanjavur","For mathematicians aged 32 or under — the age at which Ramanujan died."],["Fields Medal","International Mathematical Union","Indian-origin winners: Manjul Bhargava (2014) and Akshay Venkatesh (2018)."],["Abel Prize","Norwegian Academy of Science and Letters","S. R. Srinivasa Varadhan (2007) for probability theory."],["Turing Award","Association for Computing Machinery (ACM)","Raj Reddy (1994) — the first winner of Asian origin; for artificial intelligence."]]},{"k":"table","title":"Scientists of today and the recent past","head":["Scientist","Field","Remember"],"rows":[["G. Padmanabhan","Biochemistry","First Vigyan Ratna (2024); known for work on the malaria parasite; former director of IISc."],["Jayant Narlikar","Astrophysics","Hoyle–Narlikar theory of gravity; founded IUCAA, Pune; died May 2025; Vigyan Ratna 2025."],["K. Kasturirangan","Space science","ISRO chairman 1994–2003; headed the committee that drafted the National Education Policy 2020; died April 2025."],["R. Chidambaram","Nuclear physics","Key figure in the 1974 and 1998 tests; Principal Scientific Adviser 2001–2018; died January 2025."],["M. R. Srinivasan","Nuclear engineering","Built India's nuclear power plants; former chairman of the Atomic Energy Commission; died May 2025."],["N. Kalaiselvi","Electrochemistry","First woman Director-General of CSIR (2022); works on lithium-ion batteries."],["Gagandeep Kang","Vaccines and gut infections","Helped develop Rotavac; first Indian woman elected a Fellow of the Royal Society (2019)."],["C. N. R. Rao","Solid-state chemistry","Bharat Ratna 2014; a world leader in the chemistry of materials."]]},{"k":"photos","title":"Faces to know","items":[["Jayant_Narlikar","Jayant Narlikar","Vigyan Ratna 2025"],["K._Kasturirangan","K. Kasturirangan","ISRO chairman, NEP 2020"],["Rajagopala_Chidambaram","R. Chidambaram","Pokhran, PSA 2001–18"],["C._N._R._Rao","C. N. R. Rao","Bharat Ratna 2014"],["Gagandeep_Kang","Gagandeep Kang","Rotavac; FRS 2019"],["Venkatraman_Ramakrishnan","Venki Ramakrishnan","Nobel Chemistry 2009"],["Manjul_Bhargava","Manjul Bhargava","Fields Medal 2014"],["Homi_J._Bhabha","Homi J. Bhabha","Three-stage plan"]]},{"k":"facts","title":"Indian Nobel laureates in science","rows":[["C. V. Raman","Physics 1930 — the only one who worked in India"],["Har Gobind Khorana","Medicine 1968 (Indian-born, US citizen)"],["Subrahmanyan Chandrasekhar","Physics 1983 (Indian-born, US citizen)"],["Venkatraman Ramakrishnan","Chemistry 2009 — the most recent Indian-origin science laureate (as of the 2026 prizes)"]]},{"k":"trick","h":"The four RVPs climb like a ladder — <b>Ratna (a life), Shri (a career), Yuva (under 45), Team (three or more)<\/b>. Limits: <b>3–25–25–3<\/b>."},{"k":"trap","h":"The <b>Bhatnagar Prize<\/b> was not abolished in name — it became <b>Vigyan Yuva–Shanti Swarup Bhatnagar<\/b>. The <b>Kalinga Prize<\/b> is given by <b>UNESCO<\/b> for popularising science, not by Odisha. <b>Khorana<\/b> won for <b>Medicine<\/b>, not Chemistry; <b>Ramakrishnan<\/b> for Chemistry."},{"k":"link","h":"Raman, the Boses, Bhabha, Sarabhai, Kalam, Khorana and the other classic scientists are in <a href=\"study-inventions.html?lesson=I9\">Inventions &amp; Discoveries<\/a> (I9). The Nobel Prize itself, with every Indian laureate, is in <a href=\"study-awards.html?lesson=A6\">Awards &amp; Honours<\/a> (A6); this year's prize winners month by month in <a href=\"study-current-affairs.html\">Current Affairs 2026<\/a>."}],"sum":["Rashtriya Vigyan Puraskar (instituted 2023, first given 22 August 2024): Vigyan Ratna, Vigyan Shri, Vigyan Yuva–SSB (up to 45), Vigyan Team.","Vigyan Ratna: G. Padmanabhan (2024), Jayant Narlikar (2025, posthumous). Team: Chandrayaan-3 (2024), CSIR Aroma Mission (2025).","The Bhatnagar Prize (CSIR, 1958) lives on as Vigyan Yuva–SSB.","Infosys Prize: six fields, USD 100,000, under 40. Kalinga Prize: UNESCO, 1952 (Biju Patnaik).","Fields: Manjul Bhargava (2014), Akshay Venkatesh (2018); Abel: S. R. S. Varadhan (2007); Turing: Raj Reddy (1994).","Died in 2025: Jayant Narlikar, K. Kasturirangan, R. Chidambaram, M. R. Srinivasan. N. Kalaiselvi is CSIR's first woman DG."],"part":["Part 3 · Earth science, awards, terms and revision","पृथ्वी विज्ञान, पुरस्कार, शब्दावली और दोहराव"],"g":"st"},
{"id":"ST10","heat":2,"title":"Everyday technology terms","hi":"रोज़मर्रा की प्रौद्योगिकी के शब्द","blocks":[{"k":"hot","h":"Asked: full forms (<b>LED, LASER, LiDAR, RADAR, SONAR, GPS, NavIC, RFID<\/b>), one-line meanings (<b>nanotechnology, 3D printing, graphene, qubit<\/b>), <b>5G<\/b> (October 2022) and the <b>Bharat 6G Vision<\/b> (2023), and <b>biofuels<\/b> — E20, 2G ethanol, SAF."},{"k":"story","h":"<p>Most technology words are short forms that tell you how the thing works. <b>RADAR<\/b> finds things with <b>radio<\/b> waves, <b>SONAR<\/b> with <b>sound<\/b> under water and <b>LiDAR<\/b> with <b>light<\/b> from a laser. <b>GPS<\/b> is America's navigation system; <b>NavIC<\/b> is India's own, covering India and about 1,500 km around it. An <b>LED<\/b> is a tiny semiconductor that glows; India's UJALA scheme put crores of LED bulbs in homes.<\/p><p>Mobile networks came in generations. India switched on <b>5G<\/b> on <b>1 October 2022<\/b>, one of the fastest roll-outs anywhere, and in March 2023 released the <b>Bharat 6G Vision<\/b>. In September 2025 BSNL launched a 4G network built entirely on Indian equipment. On the road, petrol now carries <b>20% ethanol (E20)<\/b> — a target India reached in 2025, five years before the original 2030 date.<\/p>","key":"RADAR radio, SONAR sound, LiDAR light · 5G 1 October 2022 · Bharat 6G Vision March 2023 · E20 reached in 2025."},{"k":"table","title":"Full forms","head":["Short form","Full form","Remember"],"rows":[["LED","Light-Emitting Diode","A semiconductor that glows when current flows; the UJALA scheme (2015) spread LED bulbs."],["OLED","Organic Light-Emitting Diode","Each pixel makes its own light — thin, bendable screens."],["LASER","Light Amplification by Stimulated Emission of Radiation","A narrow, single-colour, powerful beam of light."],["LiDAR","Light Detection and Ranging","Measures distance with laser pulses — 3D maps, self-driving cars, Moon landers."],["RADAR","Radio Detection and Ranging","Uses radio waves to find aircraft, ships and storms."],["SONAR","Sound Navigation and Ranging","Uses sound waves under water."],["GPS","Global Positioning System","The United States' satellite navigation system."],["NavIC","Navigation with Indian Constellation","India's own regional navigation satellites (IRNSS); see the Space app."],["GAGAN","GPS Aided GEO Augmented Navigation","Makes GPS accurate enough for aircraft landings — ISRO with the Airports Authority."],["RFID","Radio-Frequency Identification","Tags read by radio waves — FASTag on cars."],["NFC","Near-Field Communication","Tap-to-pay over a few centimetres."],["Li-Fi","Light Fidelity","Sends data with flickering LED light instead of radio waves."],["IoT","Internet of Things","Everyday devices with sensors linked to the internet."],["UAV","Unmanned Aerial Vehicle","A drone — an aircraft with no pilot on board."],["CCUS","Carbon Capture, Utilisation and Storage","Catching carbon dioxide from chimneys to use or bury it."],["SAF","Sustainable Aviation Fuel","Jet fuel made from waste oils, crop waste or other non-fossil sources."],["CBG","Compressed Biogas","Biogas from waste, cleaned and compressed like CNG; the SATAT scheme (2018)."]]},{"k":"table","title":"Terms and their meaning","head":["Term","Meaning","Remember"],"rows":[["Nanotechnology","Working with matter at a scale of 1 to 100 nanometres","One nanometre is a billionth of a metre; DST's Nano Mission began in 2007."],["3D printing","Building an object layer by layer from a digital design","Also called additive manufacturing; India's first 3D-printed post office opened in Bengaluru in 2023."],["Graphene","A sheet of carbon just one atom thick","Very strong and a very good conductor of heat and electricity."],["Semiconductor","A material whose conductivity lies between a conductor's and an insulator's","Silicon chips are made from it."],["Superconductor","A material with zero electrical resistance when cooled enough","Used in MRI magnets and particle accelerators."],["Fuel cell","A device that turns hydrogen and oxygen into electricity, leaving only water","Powers hydrogen buses and cars."],["Blockchain","A shared digital ledger that is very hard to alter","Copies are kept on many computers at once."],["Deepfake","AI-made fake video or audio that looks real","Covered by the IT Rules amendment of 2026."],["Qubit","The unit of a quantum computer, which can be 0 and 1 at the same time","The National Quantum Mission aims for 50–1,000 of them."],["Green hydrogen","Hydrogen made by splitting water with renewable electricity","Grey hydrogen is made from natural gas without capturing the CO₂."],["Ethanol blending","Mixing ethanol from sugarcane or grain into petrol","E20 means 20% ethanol in petrol."],["Digital twin","A live virtual copy of a real machine, building or city","Kept up to date with data from sensors."]]},{"k":"facts","title":"Mobile networks","rows":[["5G in India","Launched 1 October 2022 at the India Mobile Congress, New Delhi"],["5G test bed","Built by eight institutes led by IIT Madras"],["Home-grown 4G","BSNL's 4G network on Indian equipment (C-DOT core, Tejas radios, TCS integration) launched at Jharsuguda, Odisha, on 27 September 2025"],["Fifth country","With it India joined Denmark, Sweden, South Korea and China as makers of their own telecom stack (government's claim)"],["Bharat 6G Vision","Released in March 2023 — aims to make India a front-line developer of 6G by 2030"],["Bharat 6G Alliance","Formed in July 2023 by industry, academia and government to build 6G technology and patents"]]},{"k":"facts","title":"Biofuels","rows":[["Generations","1G — from sugarcane and grain; 2G — from crop waste and other non-food matter; 3G — from algae"],["National Policy on Biofuels","2018; amended in 2022 to bring the E20 target forward from 2030 to 2025-26"],["E20","20% ethanol in petrol — reached across India in 2025; higher blends are being studied (as of 2026)"],["Panipat 2G ethanol plant","Indian Oil's plant that makes ethanol from rice straw; dedicated on 10 August 2022"],["World Biofuel Day","10 August — Rudolf Diesel ran his engine on peanut oil in 1893"],["Global Biofuels Alliance","Launched at the G20 summit in New Delhi, September 2023"],["SAF","Indicative targets of 1% in international flights in 2027 and 2% in 2028"]]},{"k":"trick","h":"<b>Ra<\/b>dio–<b>So<\/b>und–<b>Li<\/b>ght: <b>RA<\/b>DAR, <b>SO<\/b>NAR, <b>Li<\/b>DAR — the first letters tell you the wave. <b>Li-Fi<\/b> is Wi-Fi done with light."},{"k":"trap","h":"<b>NavIC<\/b> is <b>regional<\/b>, not global like GPS. <b>GAGAN<\/b> is not a separate system — it corrects GPS for aircraft. <b>2G ethanol<\/b> means second-generation (crop waste), nothing to do with 2G phones. <b>Green<\/b> hydrogen uses renewable power; <b>grey<\/b> comes from natural gas."},{"k":"link","h":"AI, machine learning, cloud computing (SaaS, PaaS, IaaS), blockchain, AR and VR are explained in <a href=\"study-computer-internet.html?lesson=C17\">Computer Knowledge<\/a> (C17). NavIC, GAGAN and how satellites navigate are in <a href=\"study-space.html?lesson=L8\">Space &amp; ISRO<\/a> (L8); semiconductors and the photoelectric effect in <a href=\"study-physics.html\">Physics<\/a>; fuels and combustion in <a href=\"study-chemistry.html?lesson=K14\">Chemistry<\/a> (K14)."}],"sum":["LED light-emitting diode; LASER light amplification by stimulated emission of radiation; LiDAR light detection and ranging.","RADAR uses radio waves, SONAR sound, LiDAR laser light. GPS is American; NavIC Indian and regional; GAGAN corrects GPS for aircraft.","Nanotechnology works at 1–100 nanometres; 3D printing builds layer by layer; graphene is one-atom-thick carbon; a qubit can be 0 and 1 at once.","5G launched 1 October 2022; Bharat 6G Vision March 2023; BSNL's home-grown 4G launched September 2025.","E20 (20% ethanol) reached in 2025; National Policy on Biofuels 2018 (amended 2022); Panipat 2G ethanol from rice straw (2022).","World Biofuel Day is 10 August; the Global Biofuels Alliance began at the G20 in New Delhi (2023)."],"part":["Part 3 · Earth science, awards, terms and revision","पृथ्वी विज्ञान, पुरस्कार, शब्दावली और दोहराव"],"g":"st"},
{"id":"ST11","heat":2,"title":"Mixed revision: science and technology in India","hi":"मिश्रित दोहराव: भारत में विज्ञान एवं प्रौद्योगिकी","blocks":[{"k":"hot","h":"Exam papers mix these topics in one question: 'which pair is wrongly matched', 'which came first', 'which is NOT under ministry X'. This lesson trains exactly that, across all ten lessons."},{"k":"story","h":"<p>Before the exam, hang every fact on one of three pegs. <b>Who<\/b> runs it — a ministry, a department or a council. <b>When<\/b> it began — a year. <b>Where<\/b> it is — a city, a state or a continent. Most science-and-technology questions in SSC are one of those three, dressed up as 'which pair is correct'.<\/p><p>Read the years below as a single story: CSIR in 1942 before independence, atomic energy in the 1950s, space in the 1960s and 70s, biotechnology in the 1980s, Digital India in 2015, and a rush of missions after 2020 — semiconductors, hydrogen, quantum, AI — ending with the SHANTI Act and the fast breeder of 2025–26.<\/p>","key":"Who runs it · when it began · where it is — three pegs for every fact."},{"k":"facts","title":"Years in one place","rows":[["1942","CSIR"],["1948 · 1954","Atomic Energy Commission · Department of Atomic Energy"],["1958","DRDO; Scientific Policy Resolution"],["1971","DST"],["1974 · 1998","Pokhran-I (Smiling Buddha) · Pokhran-II (Operation Shakti)"],["1981–83","First Antarctic expedition; Dakshin Gangotri; Antarctic Treaty"],["1986","DBT"],["1989","Maitri station"],["2002","Bt cotton approved"],["2006","Ministry of Earth Sciences"],["2008","Himadri (Arctic); India–US nuclear deal"],["2010 · 2016","First Aadhaar · UPI"],["2012","Bharati station"],["2015","Digital India; DigiLocker; Supercomputing Mission"],["2018","NM-ICPS"],["2021","India Semiconductor Mission; Deep Ocean Mission; ZyCoV-D"],["2022","5G; ONDC; Bhashini; Indian Antarctic Act"],["2023","Quantum and Green Hydrogen Missions; ANRF Act; DPDP Act; Bharat 6G Vision"],["2024","IndiaAI Mission; first Rashtriya Vigyan Puraskar; BioE3"],["2025","SHANTI Act; BIRSA 101; genome-edited rice; Genome India data; E20; DPDP Rules"],["2026","PFBR first criticality (6 April); national HPV drive (28 February)"]]},{"k":"facts","title":"Numbers that change (as of October 2026)","rows":[["Nuclear power","24 reactors, about 8,780 MW; target 100 GW by 2047"],["Chip projects","12 approved (May 2026)"],["Supercomputers","40 under the mission, about 68 petaflops (September 2026)"],["GPUs under IndiaAI","More than 38,000"],["UPI","24.07 billion transactions in September 2026; live in 11 foreign countries"],["Aadhaar","More than 138 crore numbers (end-2024)"]]},{"k":"trick","h":"For 'which is NOT under X' questions, remember the outsiders: <b>DAE and Space<\/b> report to the PM; <b>DRDO<\/b> to Defence; <b>ICMR<\/b> to Health; <b>ICAR<\/b> to Agriculture; <b>GEAC<\/b> to Environment; <b>Green Hydrogen<\/b> to MNRE; <b>AI and chips<\/b> to MeitY; <b>Quantum<\/b> to DST."},{"k":"trap","h":"Watch the near-misses: <b>NCPOR Goa<\/b> vs <b>NIOT Chennai<\/b>; <b>Himadri<\/b> (Arctic) vs <b>Himansh<\/b> (Himalaya); <b>Covaxin<\/b> (Bharat Biotech) vs <b>Covishield<\/b> (Serum Institute); <b>Kakrapar<\/b> (Gujarat) vs <b>Kaiga<\/b> (Karnataka); <b>1962 Act<\/b> (repealed) vs <b>1948 Act<\/b> (the first)."}],"sum":["Who: DAE and Space under the PM; CSIR under DSIR; ICMR under Health; ICAR under Agriculture; GEAC under Environment.","When: CSIR 1942, DAE 1954, DRDO 1958, DST 1971, DBT 1986, MoES 2006; Digital India 2015.","Missions: Supercomputing 2015, NM-ICPS 2018, Semiconductor and Deep Ocean 2021, Quantum and Green Hydrogen 2023, IndiaAI 2024.","Nuclear: PFBR critical 6 April 2026; SHANTI Act 2025; Pokhran 1974 and 1998.","Poles: Dakshin Gangotri 1983, Maitri 1989, Himadri 2008, Bharati 2012; Indian Antarctic Act 2022.","Awards: Rashtriya Vigyan Puraskar from 2024 — Vigyan Ratna, Shri, Yuva–SSB, Team."],"part":["Part 3 · Earth science, awards, terms and revision","पृथ्वी विज्ञान, पुरस्कार, शब्दावली और दोहराव"],"g":"st"}
];

  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}

  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}

<script id="shabd-deeplink">
(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();

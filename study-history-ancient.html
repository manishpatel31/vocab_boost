["L1","The first Palaeolithic tool in India was discovered in 1863 by:",["Robert Bruce Foote","John Marshall","V. S. Wakankar","Alexander Cunningham"],"Robert Bruce Foote found it at Pallavaram near Chennai. Wakankar discovered Bhimbetka's rock art in 1957.",""],
["L1","The Bhimbetka rock shelters are famous for:",["Prehistoric rock paintings","The earliest ploughed field","Pit dwellings","Ash mounds"],"Bhimbetka (MP) is a UNESCO site known for its rock paintings; the ploughed field is at Kalibangan and pit dwellings at Burzahom.","p"],
["L1","Which period is correctly described as 'proto-history'?",["A period with writing that has not been deciphered","A period with no writing at all","A period with readable written records","The period of the Stone Age only"],"Proto-history has writing we cannot read — the Harappan phase. No writing at all = prehistory.",""],
["L1","Pit dwellings of the Neolithic age have been found at:",["Burzahom, Kashmir","Chirand, Bihar","Piklihal, Karnataka","Lahuradewa, UP"],"Burzahom in Kashmir is famous for pit dwellings and for a dog buried with its master.",""],
["L1","The correct chronological order of the Stone Ages is:",["Palaeolithic – Mesolithic – Neolithic – Chalcolithic","Mesolithic – Palaeolithic – Neolithic – Chalcolithic","Neolithic – Mesolithic – Palaeolithic – Chalcolithic","Palaeolithic – Neolithic – Mesolithic – Chalcolithic"],"Trick: Pa-Me-Ne-Cha. Tools shrink from hand-axes to microliths, then life settles with polished tools and pottery.",""],
["L1","Microliths are characteristic tools of which age?",["Mesolithic","Palaeolithic","Neolithic","Chalcolithic"],"Microliths are tiny stone blades, the hallmark of the Mesolithic (Middle Stone) Age.",""],
["L1","The earliest evidence of rice cultivation in India comes from:",["Lahuradewa, Uttar Pradesh","Mehrgarh","Kalibangan","Inamgaon"],"Lahuradewa (UP) gives the earliest rice; Mehrgarh gives the earliest wheat and barley.",""],
["L1","Who wrote the Arthashastra?",["Kautilya","Megasthenes","Kalhana","Banabhatta"],"Kautilya (Chanakya), minister of Chandragupta Maurya, wrote the Arthashastra on statecraft.","p"],
["L1","'Rajatarangini', a history of Kashmir, was written by:",["Kalhana","Vishakhadatta","Harisena","Bilhana"],"Kalhana's Rajatarangini is one of the few genuine historical chronicles of ancient India.","p"],
["L1","The oldest Neolithic site of the Indian subcontinent, with the earliest evidence of farming, is:",["Mehrgarh","Burzahom","Chirand","Daojali Hading"],"Mehrgarh (in present-day Balochistan) is the oldest Neolithic site, with wheat and barley cultivation.",""],
["L1","Which of these is a literary, and not an archaeological, source of history?",["The Puranas","Coins","Inscriptions","Monuments"],"The Puranas are literary. Coins, inscriptions and monuments are archaeological.",""],
["L1","The study of coins is known as:",["Numismatics","Epigraphy","Palaeography","Ethnography"],"Numismatics is the study of coins and currency.","p"],
["L1","'Indica', an account of Mauryan India, was written by:",["Megasthenes","Fa-Hien","Al-Beruni","Ibn Battuta"],"Megasthenes was the Greek ambassador of Seleucus Nicator at Chandragupta Maurya's court.","p"],
["L2","The Indus Valley Civilisation site of Harappa was discovered in 1921 by:",["Daya Ram Sahni","R. D. Banerji","S. R. Rao","John Marshall"],"Daya Ram Sahni excavated Harappa in 1921; R. D. Banerji found Mohenjodaro in 1922. John Marshall then headed the ASI.",""],
["L2","The Great Bath is located at:",["Mohenjodaro","Harappa","Lothal","Kalibangan"],"The Great Bath, about 11.88 m by 7.01 m and 2.43 m deep, is the most famous structure of Mohenjodaro.","p"],
["L2","The only Harappan site with a dockyard is:",["Lothal","Dholavira","Surkotada","Chanhudaro"],"Lothal in Gujarat has the dockyard and is called the 'Manchester of the Indus'.","p"],
["L2","The earliest evidence of a ploughed field in the Indian subcontinent was found at:",["Kalibangan","Banawali","Lothal","Rakhigarhi"],"Kalibangan in Rajasthan, on the Ghaggar, gave the earliest ploughed field; Banawali gave a toy plough.","p"],
["L2","The largest Harappan site in India is:",["Rakhigarhi","Mohenjodaro","Dholavira","Lothal"],"Rakhigarhi (Haryana) is the largest Harappan site in India; Mohenjodaro, the largest overall, is in Pakistan.","p"],
["L2","Harappan bricks were made in the ratio:",["4 : 2 : 1","3 : 2 : 1","2 : 2 : 1","4 : 3 : 1"],"Burnt bricks of the ratio 4:2:1 (length : breadth : thickness), laid in English bond, are a Harappan signature.",""],
["L2","Dholavira is famous for its:",["Water reservoirs and a stadium","Bead-making factory","Dockyard","Coffin burial"],"Dholavira (Gujarat) has elaborate water reservoirs, a stadium and a three-part town plan; it is a UNESCO site.","p"],
["L2","Which metal was NOT known to the Harappans?",["Iron","Copper","Bronze","Tin"],"The Harappan civilisation belongs to the Bronze Age; iron was unknown to it.",""],
["L2","The southernmost site of the Indus Valley Civilisation is:",["Daimabad","Sutkagendor","Alamgirpur","Manda"],"Corners MAD-S: Manda north, Alamgirpur east, Daimabad south, Sutkagendor west.",""],
["L2","Horse bones were found at which Harappan site?",["Surkotada","Lothal","Harappa","Banawali"],"Surkotada in Gujarat gave the first clear horse bones — but no horse appears on any Harappan seal.",""],
["L2","Chanhudaro is best known as a centre of:",["Bead making","Shipbuilding","Cotton weaving","Brick making"],"Chanhudaro was a bead-making centre, and the only major Harappan site without a citadel.","p"],
["L2","The Harappan script is described as 'boustrophedon', which means it was written:",["Right to left and then left to right in alternate lines","Only from left to right","Only from right to left","From top to bottom"],"Boustrophedon writing turns at the end of each line, like a plough. The script is still undeciphered.",""],
["L2","Harappan weights were generally in multiples of:",["16","10","12","20"],"Harappan weights followed a binary then decimal scheme, with 16 and its multiples prominent.",""],
["L2","The easternmost site of the Harappan civilisation is:",["Alamgirpur","Manda","Daimabad","Ropar"],"Alamgirpur on the Hindon in Uttar Pradesh is the easternmost Harappan site.",""],
["L2","Which animal is most commonly shown on Harappan seals?",["The humped bull / unicorn","The horse","The lion","The camel"],"The humped bull and the 'unicorn' dominate the seals. The horse and lion are absent.",""],
["L2","Which of these was NOT found in any Harappan city?",["A temple","A granary","A covered drainage system","A citadel"],"No structure has been identified as a temple anywhere in the Harappan world.",""],
["L2","Mohenjodaro literally means:",["Mound of the dead","City of walls","Place of water","Town of traders"],"Mohenjodaro, on the Indus in Sindh, means 'mound of the dead' in Sindhi.","p"],
["L3","The Gayatri Mantra is found in which Mandala of the Rigveda?",["Third","First","Ninth","Tenth"],"The Gayatri Mantra, addressed to Savitri, is in Mandala III of the Rigveda.","p"],
["L3","'Satyameva Jayate', India's national motto, is taken from:",["The Mundaka Upanishad","The Rigveda","The Bhagavad Gita","The Aitareya Brahmana"],"It comes from the Mundaka Upanishad, part of the Atharvaveda tradition.","p"],
["L3","Which Veda is considered the root of Indian music?",["Samaveda","Rigveda","Yajurveda","Atharvaveda"],"The Samaveda sets the hymns to melody, so Indian classical music traces itself to it. Trick: Sama → Sangeet.","p"],
["L3","The priest associated with the Yajurveda is the:",["Adhvaryu","Hotri","Udgatri","Brahma"],"Priests in Veda order R-Y-S-A are Hotri, Adhvaryu, Udgatri, Brahma (HAUB).",""],
["L3","The Purusha Sukta, which describes the origin of the four varnas, occurs in:",["Mandala X of the Rigveda","Mandala I of the Rigveda","The Samaveda","The Atharvaveda"],"The Purusha Sukta and the Nadi Sukta both appear in the tenth and latest Mandala of the Rigveda.","p"],
["L3","The Vedic name of the river Sutlej is:",["Shutudri","Vipasha","Parushni","Askini"],"West to east the Punjab rivers are Vitasta (Jhelum), Askini (Chenab), Parushni (Ravi), Vipasha (Beas), Shutudri (Sutlej).",""],
["L3","Which river is mentioned most often in the Rigveda?",["Sindhu","Saraswati","Ganga","Yamuna"],"The Sindhu (Indus) is the most frequently mentioned; the Saraswati is called the holiest (Naditama).",""],
["L3","How many hymns does the Rigveda contain?",["1,028","1,017","1,128","1,208"],"The Rigveda has 1,028 hymns (suktas) arranged in 10 mandalas.",""],
["L3","The chief deity of the Rigveda, with about 250 hymns to his name, is:",["Indra","Agni","Varuna","Prajapati"],"Indra comes first with roughly 250 hymns, followed by Agni with about 200. Prajapati rises only in the Later Vedic age.","p"],
["L3","Which Vedic assembly is believed to be the oldest, and the only one in which women took part?",["Vidatha","Sabha","Samiti","Gana"],"The Vidatha was the oldest assembly; it disappeared in the Later Vedic period.",""],
["L3","Ayurveda, Dhanurveda, Gandharvaveda and Shilpaveda are known as:",["Upavedas","Vedangas","Aranyakas","Brahmanas"],"These four are the Upavedas. The six Vedangas are Shiksha, Kalpa, Vyakarana, Nirukta, Chhanda and Jyotisha.",""],
["L3","The Atharvaveda mainly deals with:",["Charms, spells and medicine","Rituals of sacrifice","Melodies and music","Philosophical speculation"],"The Atharvaveda collects charms, spells and cures, which is why it is also called the Brahmaveda.","p"],
["L3","The Nyaya school of Indian philosophy was founded by:",["Gautama","Kapila","Kanada","Jaimini"],"Samkhya–Kapila, Yoga–Patanjali, Nyaya–Gautama, Vaisheshika–Kanada, Mimamsa–Jaimini, Vedanta–Badarayana.",""],
["L3","Which pottery type is associated with the Later Vedic period?",["Painted Grey Ware","Ochre Coloured Pottery","Black and Red Ware only","Northern Black Polished Ware alone"],"Painted Grey Ware marks the Later Vedic period in the Ganga–Yamuna doab; NBP Ware comes after it.",""],
["L3","How many principal Upanishads are there, out of 108 in all?",["13","11","18","10"],"Of the 108 Upanishads, 13 are regarded as principal.",""],
["L3","Which of these was NOT a feature of the Later Vedic period?",["Cattle rearing as the main source of wealth","Rigid division into four varnas","Large sacrifices such as the Rajasuya","The rise of Prajapati as the chief god"],"Cattle wealth and pastoralism belong to the Early (Rig) Vedic period; the Later Vedic economy was agricultural.",""],
["L4","Gautama Buddha delivered his first sermon at:",["Sarnath","Bodh Gaya","Lumbini","Kushinagar"],"Enlightenment came at Bodh Gaya, but the first sermon (Dharmachakra Pravartana) was at Sarnath's Deer Park.","p"],
["L4","Gautama Buddha attained Mahaparinirvana at:",["Kushinagar","Sarnath","Vaishali","Rajgriha"],"He died at Kushinagar (UP) at the age of 80.","p"],
["L4","Mahavira was the:",["24th Tirthankara","First Tirthankara","23rd Tirthankara","Founder of Jainism"],"Jainism was not founded by Mahavira; he was the 24th and last Tirthankara, and a reformer.","p"],
["L4","The symbol of Mahavira as a Tirthankara is the:",["Lion","Bull","Snake","Conch"],"Rishabhanatha's symbol is the bull, Parshvanatha's the snake, Neminatha's the conch and Mahavira's the lion.",""],
["L4","The Fourth Buddhist Council was held under the patronage of:",["Kanishka","Ashoka","Ajatashatru","Kalashoka"],"Councils Ra-Vai-Pa-Ka were held under Ajatashatru, Kalashoka, Ashoka and Kanishka respectively.","p"],
["L4","The Third Buddhist Council was presided over by:",["Moggaliputta Tissa","Mahakassapa","Vasumitra","Sabakami"],"It met at Pataliputra under Ashoka, and added the Abhidhamma Pitaka.",""],
["L4","Which of the Three Pitakas deals with monastic discipline?",["Vinaya Pitaka","Sutta Pitaka","Abhidhamma Pitaka","Jataka"],"Vinaya = rules of the Sangha, Sutta = the Buddha's discourses, Abhidhamma = philosophy.","p"],
["L4","In Buddhist art, the horse is a symbol of Buddha's:",["Renunciation","Birth","Enlightenment","Death"],"Lotus/bull = birth, horse = renunciation, bodhi tree = enlightenment, wheel = first sermon, stupa = death.",""],
["L4","Which text lists the sixteen Mahajanapadas?",["Anguttara Nikaya","Rigveda","Arthashastra","Mahabhashya"],"The Buddhist Anguttara Nikaya names the sixteen Mahajanapadas; the Jain Bhagavati Sutra also lists them.","p"],
["L4","Which Mahajanapada was a republic (gana-sangha) with its capital at Vaishali?",["Vajji","Magadha","Kosala","Avanti"],"Vajji and Malla were the two republics; the rest were monarchies.",""],
["L4","Who shifted the Magadhan capital from Rajgriha to Pataliputra?",["Udayin","Bimbisara","Ajatashatru","Mahapadma Nanda"],"Ajatashatru fortified Pataliputra; his successor Udayin made it the capital.",""],
["L4","The fifth vow of Brahmacharya was added to Jainism by:",["Mahavira","Parshvanatha","Rishabhanatha","Bhadrabahu"],"Parshvanatha had taught four vows; Mahavira added Brahmacharya (celibacy) as the fifth.",""],
["L4","The Jain doctrine that truth has many sides is called:",["Syadvada / Anekantavada","Sallekhana","Kaivalya","Triratna"],"Syadvada or Anekantavada is the Jain theory of the many-sidedness of reality.",""],
["L4","The Ajivika sect was founded by:",["Makkhali Gosala","Sanjaya Belatthiputta","Purana Kassapa","Brihaspati"],"Makkhali Gosala's Ajivika sect taught strict fatalism (niyati).",""],
["L4","Mahavira was born at:",["Kundagrama, Vaishali","Lumbini","Pavapuri","Kundalvana"],"He was born at Kundagrama near Vaishali and died at Pavapuri in Bihar.",""],
["L4","The language used by Mahavira to preach was:",["Prakrit","Pali","Sanskrit","Magadhi Apabhramsha"],"Mahavira preached in Prakrit (Ardha-Magadhi); the Buddha used Pali.",""],
["L4","Which dynasty of Magadha was overthrown by Chandragupta Maurya?",["Nanda","Haryanka","Shishunaga","Kanva"],"Chandragupta Maurya, helped by Chanakya, defeated the last Nanda ruler Dhanananda.",""],
["L5","The Kalinga war was fought in:",["261 BCE","321 BCE","305 BCE","232 BCE"],"Ashoka fought Kalinga in 261 BCE and described his remorse in Rock Edict XIII.",""],
["L5","In which of his edicts does Ashoka describe the Kalinga war?",["Rock Edict XIII","Rock Edict I","Rock Edict XII","Pillar Edict VII"],"Rock Edict XIII is the longest and records the Kalinga war; Edict XII deals with religious tolerance.","p"],
["L5","The Brahmi script of Ashoka's edicts was deciphered in 1837 by:",["James Prinsep","William Jones","Alexander Cunningham","John Marshall"],"James Prinsep deciphered Brahmi, unlocking the Ashokan inscriptions.","p"],
["L5","Ashoka's personal name appears in which of his inscriptions?",["The Maski and Gujarra minor rock edicts","Rock Edict XIII","The Rummindei pillar inscription","The Schism edict"],"Elsewhere he is 'Devanampiya Piyadassi'; only Maski, Gujarra, Nittur and Udegolam use the name Ashoka.","p"],
["L5","The Mauryan official in charge of state agriculture was the:",["Sitadhyaksha","Panyadhyaksha","Akaradhyaksha","Sulkadhyaksha"],"Sita = crown land, so Sitadhyaksha looked after state agriculture; Panyadhyaksha handled commerce.",""],
["L5","Who was the Mauryan official in charge of tolls and customs?",["Sulkadhyaksha","Pautavadhyaksha","Samsthadhyaksha","Navadhyaksha"],"Sulka = toll. Pautava = weights and measures, Samstha = markets, Nava = shipping.",""],
["L5","Chandragupta Maurya spent his last days as a follower of:",["Jainism","Buddhism","the Ajivika sect","Vedic Brahmanism"],"He abdicated, became a Jain under Bhadrabahu and died by sallekhana at Shravanabelagola.","p"],
["L5","Megasthenes was the ambassador of which ruler at the Mauryan court?",["Seleucus Nicator","Alexander","Antiochus","Ptolemy Philadelphus"],"Seleucus sent Megasthenes to Chandragupta Maurya after the treaty of 305 BCE.","p"],
["L5","The National Emblem of India is taken from the Lion Capital at:",["Sarnath","Sanchi","Lauriya Nandangarh","Rampurva"],"The Sarnath Lion Capital was adopted as the National Emblem on 26 January 1950.","p"],
["L5","The new post created by Ashoka to propagate dhamma was the:",["Dhamma Mahamatta","Rajjuka","Yukta","Pradeshika"],"Dhamma Mahamattas were officers appointed specially to spread and supervise dhamma.",""],
["L5","The last ruler of the Mauryan dynasty was:",["Brihadratha","Dasharatha","Samprati","Shalishuka"],"Brihadratha was killed in about 185 BCE by his general Pushyamitra Sunga.",""],
["L5","The chief revenue collector in the Mauryan administration was the:",["Samaharta","Sannidhata","Amatya","Rajjuka"],"Samaharta collected revenue; Sannidhata was the treasurer.",""],
["L5","Mauryan coins were mainly:",["Punch-marked silver coins","Gold dinaras","Lead coins","Copper token coins"],"Punch-marked silver coins, called pana or karshapana, were the standard Mauryan currency.",""],
["L5","Which Ashokan inscription records his visit to the Buddha's birthplace?",["The Rummindei (Lumbini) pillar inscription","The Queen's edict","The Barabar cave inscription","Rock Edict II"],"The Rummindei pillar records the visit and the tax relief he granted the village.",""],
["L5","Megasthenes recorded that Indian society was divided into how many classes?",["Seven","Four","Five","Nine"],"Megasthenes spoke of seven castes, not the four varnas, and said there was no slavery in India.",""],
["L5","Ashoka's edicts in the north-west were written in which script?",["Kharosthi","Brahmi","Greek only","Devanagari"],"Kharosthi was used at Shahbazgarhi and Mansehra; Greek and Aramaic appear at Kandahar.",""],
["L5","Which Mauryan ruler bore the title 'Amitraghata'?",["Bindusara","Chandragupta Maurya","Ashoka","Dasharatha"],"Bindusara, Ashoka's father, was called Amitraghata — 'slayer of foes'.",""],
["L6","The Saka era, used as India's national calendar, was started in 78 CE by:",["Kanishka","Rudradaman I","Gautamiputra Satakarni","Chandragupta I"],"Kanishka began the Saka era in 78 CE; it was adopted as India's national calendar on 22 March 1957.","p"],
["L6","The Junagadh (Girnar) rock inscription, the first long inscription in Sanskrit, belongs to:",["Rudradaman I","Kharavela","Kanishka","Samudragupta"],"Rudradaman I, a Shaka ruler, recorded the repair of the Sudarshana lake in it.","p"],
["L6","The Hathigumpha inscription is associated with:",["Kharavela of Kalinga","Ashoka","Pulakeshin II","Simuka"],"Kharavela's Hathigumpha inscription is at Udayagiri in Odisha; he was a Jain.","p"],
["L6","Which dynasty was the first in India to issue lead coins?",["Satavahana","Kushana","Indo-Greek","Sunga"],"The Satavahanas issued lead coins; the Indo-Greeks issued the first gold coins and the Kushanas the purest.",""],
["L6","The Gandhara school of art was strongly influenced by:",["Greek / Hellenistic art","Persian art","Chinese art","Roman architecture only"],"Gandhara sculpture shows Greek influence — wavy hair, muscular bodies and folded drapery in grey schist.","p"],
["L6","The Mathura school of sculpture mainly used:",["Red sandstone","Blue-grey schist","White marble","Black basalt"],"Mathura used spotted red sandstone; Gandhara used grey schist and Amaravati white marble.",""],
["L6","The capital of the Satavahanas was:",["Pratishthana (Paithan)","Amaravati only","Vatapi","Manyakheta"],"Pratishthana, modern Paithan in Maharashtra, was the Satavahana capital.",""],
["L6","The Greek ruler Menander, who became a Buddhist, features in which text?",["Milindapanho","Mahavamsa","Divyavadana","Lalitavistara"],"Milindapanho ('Questions of Milinda') records his dialogue with the monk Nagasena.",""],
["L6","Kanishka's capital was:",["Purushapura (Peshawar)","Taxila","Mathura only","Bactra"],"Purushapura, modern Peshawar, was Kanishka's capital; Mathura was a second centre.",""],
["L6","The oldest extant work of Tamil literature is:",["Tolkappiyam","Thirukkural","Silappadikaram","Manimekalai"],"Tolkappiyam by Tolkappiyar is a work on Tamil grammar and poetics, the oldest Tamil text.",""],
["L6","The Thirukkural, often called the 'Tamil Veda', was composed by:",["Thiruvalluvar","Ilango Adigal","Sattanar","Nakkirar"],"Thiruvalluvar's Kural has 1,330 couplets on ethics and statecraft.","p"],
["L6","The Chera capital during the Sangam Age was:",["Vanji","Uraiyur","Madurai","Korkai"],"Chera–Vanji, Chola–Uraiyur, Pandya–Madurai. Muziris was the Chera port.",""],
["L6","The Sunga dynasty was founded by:",["Pushyamitra Sunga","Agnimitra","Vasudeva","Simuka"],"Pushyamitra Sunga founded the dynasty after killing the last Maurya, Brihadratha.",""],
["L6","The railings and gateways of the Sanchi stupa were added by the:",["Sungas and Satavahanas","Mauryas","Kushanas","Guptas"],"Ashoka began the stupa; the Sungas and Satavahanas added the railings and the carved toranas.",""],
["L6","Which Satavahana ruler is regarded as the greatest of the line?",["Gautamiputra Satakarni","Simuka","Hala","Vasishthiputra Pulumavi"],"Gautamiputra Satakarni defeated the Shakas and is praised in the Nasik inscription of his mother Gautami Balashri.",""],
["L6","The Amaravati school of art chiefly used:",["White marble","Red sandstone","Grey schist","Terracotta"],"Amaravati, in Andhra under the Satavahanas, worked in white marble with narrative panels.",""],
["L7","The Allahabad Pillar inscription (Prayag Prashasti) praises:",["Samudragupta","Chandragupta I","Chandragupta II","Skandagupta"],"It was composed by Samudragupta's court poet Harisena and engraved on an Ashokan pillar.","p"],
["L7","Samudragupta has been called the 'Indian Napoleon' by:",["V. A. Smith","R. C. Majumdar","D. D. Kosambi","James Prinsep"],"The historian V. A. Smith gave him that name for his many conquests.",""],
["L7","The Gupta era began in:",["319–320 CE","78 CE","58 BCE","78 BCE"],"Chandragupta I started the Gupta era in 319–20 CE; the Saka era is 78 CE and the Vikrama Samvat 58 BCE.",""],
["L7","Nalanda University was founded by:",["Kumaragupta I","Harshavardhana","Dharmapala","Chandragupta II"],"Kumaragupta I founded Nalanda; Harsha only patronised it later and Dharmapala founded Vikramashila.","p"],
["L7","Fa-Hien visited India during the reign of:",["Chandragupta II","Samudragupta","Harshavardhana","Kanishka"],"Fa-Hien came in Chandragupta II's time and wrote Fo-Kuo-Ki; Hiuen Tsang came under Harsha.","p"],
["L7","Which Gupta ruler took the title 'Shakari' after defeating the Shakas?",["Chandragupta II","Samudragupta","Skandagupta","Kumaragupta I"],"Chandragupta II 'Vikramaditya' destroyed the Western Kshatrapas and took the title Shakari.",""],
["L7","Aryabhata's major astronomical work is:",["Aryabhatiya","Brihat Samhita","Panchasiddhantika","Brahmasphuta Siddhanta"],"Aryabhatiya and Surya Siddhanta are Aryabhata's; Brihat Samhita is Varahamihira's.","p"],
["L7","Who stated that the earth rotates on its axis and explained eclipses scientifically?",["Aryabhata","Varahamihira","Brahmagupta","Sushruta"],"Aryabhata said the earth is round and rotates, and explained solar and lunar eclipses.",""],
["L7","The Sushruta Samhita deals mainly with:",["Surgery","Astrology","Grammar","Statecraft"],"Sushruta is called the father of plastic surgery; Charaka's Samhita deals with general medicine.",""],
["L7","Kalidasa's play about Shakuntala is called:",["Abhijnanashakuntalam","Meghaduta","Raghuvamsha","Kumarasambhava"],"Abhijnanashakuntalam is his best-known play; Meghaduta is a poem.","p"],
["L7","Gupta gold coins were known as:",["Dinara","Pana","Tanka","Varaha"],"The Guptas issued gold dinaras — the largest number of gold coins in ancient India.","p"],
["L7","Which Gupta ruler repelled the Huna invasion?",["Skandagupta","Kumaragupta I","Chandragupta II","Samudragupta"],"Skandagupta defeated the Hunas and also repaired the Sudarshana lake, as his Junagadh inscription records.","p"],
["L7","The Dashavatara temple at Deogarh belongs to which period?",["Gupta","Maurya","Kushana","Chalukya"],"It is a Gupta-period temple, one of the earliest examples of the Nagara style.",""],
["L7","Which Gupta ruler issued the famous 'Lyrist' (veena-playing) coin?",["Samudragupta","Chandragupta I","Chandragupta II","Kumaragupta I"],"Samudragupta's lyrist type shows him playing the veena, pointing to his love of music.",""],
["L7","Who was the court poet who composed the Allahabad Prashasti?",["Harisena","Banabhatta","Ravikirti","Vishakhadatta"],"Harisena served Samudragupta; Ravikirti wrote the Aihole inscription for Pulakeshin II.","p"],
["L7","Chandragupta I married a princess of which clan, strengthening his position?",["Lichchhavi","Shakya","Jnatrika","Malla"],"His marriage to the Lichchhavi princess Kumaradevi is commemorated on his coins.",""],
["L8","Harshavardhana was defeated on the Narmada by:",["Pulakeshin II","Narasimhavarman I","Dharmapala","Mihir Bhoja"],"The Aihole inscription of Ravikirti records Pulakeshin II's victory over Harsha.",""],
["L8","The biography of Harshavardhana, the Harshacharita, was written by:",["Banabhatta","Harisena","Kalhana","Bilhana"],"Banabhatta, Harsha's court poet, also wrote Kadambari.","p"],
["L8","The rock-cut Kailasa temple at Ellora was built by:",["Krishna I of the Rashtrakutas","Rajaraja I of the Cholas","Narasimhavarman I of the Pallavas","Dhanga of the Chandelas"],"Krishna I had it carved out of a single rock from the top down.","p"],
["L8","The Brihadeshwara temple at Thanjavur was built by:",["Rajaraja I","Rajendra I","Karikala","Narasimhavarman II"],"Rajaraja I built it; it is one of the Great Living Chola Temples, a UNESCO site.","p"],
["L8","The Khajuraho temples were built by the:",["Chandelas","Solankis","Eastern Gangas","Palas"],"Khajuraho, including the Kandariya Mahadeva temple, is Chandela work.","p"],
["L8","The Konark Sun temple was built by:",["Narasimhadeva I of the Eastern Gangas","Amoghavarsha","Rana Kumbha","Rajendra Chola"],"Narasimhadeva I of the Eastern Ganga dynasty built it in the 13th century.","p"],
["L8","The Dilwara Jain temples at Mount Abu were built under the:",["Solankis (Chalukyas of Gujarat)","Chandelas","Rashtrakutas","Pratiharas"],"They belong to the Solanki period, which also produced the Modhera Sun temple and Rani ki Vav.",""],
["L8","Vikramashila University was founded by:",["Dharmapala","Kumaragupta I","Devapala","Harshavardhana"],"Dharmapala of the Pala dynasty founded Vikramashila in Bihar.","p"],
["L8","The Chinese pilgrim Hiuen Tsang's account of India is called:",["Si-Yu-Ki","Fo-Kuo-Ki","Rehla","Indica"],"Si-Yu-Ki means 'Records of the Western World'. Fo-Kuo-Ki is Fa-Hien's.",""],
["L8","The Uttaramerur inscription is an important source on:",["Chola village self-government","Gupta land grants","Mauryan taxation","Mughal mansabdari"],"It records how village assemblies were elected under the Cholas.",""],
["L8","Harshavardhana belonged to which dynasty?",["Pushyabhuti (Vardhana)","Maukhari","Maitraka","Gurjara-Pratihara"],"He belonged to the Pushyabhuti or Vardhana dynasty and ruled from Kannauj.",""],
["L8","The Shore temple and the rathas at Mahabalipuram were built by the:",["Pallavas","Cholas","Chalukyas","Rashtrakutas"],"Narasimhavarman I 'Mamalla' gave Mamallapuram (Mahabalipuram) its name and monuments.","p"],
["L8","The tripartite struggle for Kannauj was fought among the:",["Palas, Pratiharas and Rashtrakutas","Cholas, Pandyas and Cheras","Chalukyas, Pallavas and Cholas","Senas, Palas and Chandelas"],"The three powers fought over Kannauj through the 8th and 9th centuries.",""],
["L8","Amoghavarsha, who wrote Kavirajamarga in Kannada, belonged to which dynasty?",["Rashtrakuta","Chalukya","Hoysala","Kadamba"],"Amoghavarsha I was a Rashtrakuta ruler and a patron of Kannada literature.",""],
["L8","The bronze Nataraja image is the finest achievement of which dynasty's art?",["Chola","Pallava","Gupta","Rashtrakuta"],"Chola bronzes, cast by the lost-wax method, are famous above all for the dancing Shiva.",""],
["L8","Which ancient university was destroyed by Bakhtiyar Khalji in 1193?",["Nalanda","Takshashila","Valabhi","Odantapuri"],"Nalanda was sacked by Bakhtiyar Khalji; it is now a UNESCO World Heritage site.",""],
["L1","'Mudrarakshasa', a play on the rise of Chandragupta Maurya, was written by:",["Vishakhadatta","Kalhana","Banabhatta","Megasthenes"],"Vishakhadatta wrote Mudrarakshasa. Kalhana wrote Rajatarangini and Banabhatta the Harshacharita.",""],
["L1","The Sanskrit grammar 'Ashtadhyayi' was composed by:",["Panini","Patanjali","Kautilya","Kalhana"],"Panini's Ashtadhyayi is the oldest surviving Sanskrit grammar; Patanjali wrote the Mahabhashya, a commentary on it.",""],
["L1","Neolithic ash mounds have been found mainly in:",["Karnataka","Kashmir","Bihar","Assam"],"Sanganakallu and Piklihal in Karnataka are the famous ash-mound sites. Kashmir (Burzahom) is known for pit dwellings instead.",""],
["L1","The rock paintings of Bhimbetka were brought to light in 1957 by:",["V. S. Wakankar","Robert Bruce Foote","Daya Ram Sahni","Alexander Cunningham"],"Wakankar discovered the Bhimbetka shelters in 1957. Bruce Foote had found India's first Palaeolithic tool at Pallavaram in 1863.",""],
["L1","The 'Mahabhashya', a commentary on Panini's grammar, was written by:",["Patanjali","Panini","Kautilya","Vishakhadatta"],"Patanjali's Mahabhashya explains the Ashtadhyayi and is also a source for Sunga-period history.",""],
["L1","The first metal to be used by human beings was:",["Copper","Iron","Bronze","Tin"],"Copper came first, which is why the Stone-Copper phase is called Chalcolithic; iron appears much later, in the Later Vedic age.",""],
["L2","The bronze statuette known as the 'Dancing Girl' was found at:",["Mohenjodaro","Harappa","Lothal","Kalibangan"],"The Dancing Girl, cast by the lost-wax method, comes from Mohenjodaro, along with the bearded priest figure.","p"],
["L2","Which Harappan site was the first to be excavated after Independence?",["Ropar","Lothal","Kalibangan","Dholavira"],"Ropar (Rupnagar) on the Sutlej was taken up first after 1947; it also gave a dog buried with a human.",""],
["L2","The mature phase of the Harappan civilisation is dated to:",["2600–1900 BCE","3500–3000 BCE","1900–1500 BCE","1500–1000 BCE"],"The mature or urban phase ran from about 2600 to 1900 BCE; decline set in around 1900 BCE.",""],
["L2","Harappan seals were most commonly made of:",["Steatite","Copper","Ivory","Gold"],"Steatite (soft soapstone) was the usual material, cut square with an animal figure and a line of script.",""],
["L2","The Greeks called the cotton grown in the Indus region:",["Sindon","Kalingam","Patola","Carbasina"],"Cotton was first cultivated by the Harappans, and the Greeks named it Sindon after the Sindhu (Indus).",""],
["L2","Coffin burial and the R-37 cemetery are associated with which Harappan site?",["Harappa","Mohenjodaro","Lothal","Surkotada"],"Harappa gave the coffin burial and cemetery R-37; Lothal is famous for a double burial instead.",""],
["L2","A bronze chariot was among the finds at which Harappan site?",["Daimabad","Banawali","Rakhigarhi","Chanhudaro"],"Daimabad in Maharashtra, the southernmost Harappan site, gave the well-known bronze chariot and animal figures.",""],
["L3","Which Mandala of the Rigveda is devoted entirely to the god Soma?",["Ninth","Third","Tenth","First"],"Mandala IX is the Soma Mandala. Mandala III has the Gayatri Mantra and Mandala X the Purusha Sukta.","p"],
["L3","The Mahabharata, the longest poem in the world, is attributed to:",["Ved Vyasa","Valmiki","Kalidasa","Panini"],"Ved Vyasa composed the Mahabharata; Valmiki composed the Ramayana.",""],
["L3","Which scholar held that the original home of the Aryans was the Arctic region?",["Bal Gangadhar Tilak","Max Muller","Dayanand Saraswati","A. C. Das"],"Tilak argued for an Arctic home. Max Muller said Central Asia, Dayanand said Tibet and A. C. Das the Sapta-Sindhu itself.",""],
["L3","Which Veda has two recensions known as Shukla and Krishna?",["Yajurveda","Rigveda","Samaveda","Atharvaveda"],"The Yajurveda, the book of sacrificial ritual, survives in a White (Shukla) and a Black (Krishna) recension.",""],
["L3","The prayer 'Asato Ma Sadgamaya' is taken from the:",["Brihadaranyaka Upanishad","Mundaka Upanishad","Maha Upanishad","Aitareya Brahmana"],"It comes from the Brihadaranyaka Upanishad. 'Satyameva Jayate' is from the Mundaka and 'Vasudhaiva Kutumbakam' from the Maha Upanishad.",""],
["L4","The First Buddhist Council was held at:",["Rajgriha","Vaishali","Pataliputra","Kundalvana"],"It met in the Sattapanni cave at Rajgriha under Ajatashatru, and compiled the Vinaya and Sutta Pitakas.","p"],
["L4","Gautama Buddha attained enlightenment at the age of:",["35","29","40","80"],"He renounced the world at 29, gained enlightenment at 35 at Bodh Gaya, and died at 80 at Kushinagar.",""],
["L4","The Jain Agamas were finally written down at the second Jain council held at:",["Valabhi","Pataliputra","Vaishali","Mathura"],"The Valabhi council of 512 CE, under Devardhi Kshamasramana, put the Agamas in writing; the first council at Pataliputra had led to the Digambara-Svetambara split.",""],
["L4","The first woman to be admitted into the Buddhist Sangha was:",["Mahaprajapati Gotami","Trishala","Yashodhara","Sanghamitra"],"Buddha's aunt and foster-mother Mahaprajapati Gotami was admitted on Ananda's pleading.",""],
["L4","The Charvaka or Lokayata school of materialism is traditionally attributed to:",["Brihaspati","Makkhali Gosala","Purana Kassapa","Sanjaya Belatthiputta"],"Brihaspati is named as the founder of Charvaka materialism. Makkhali Gosala founded the fatalist Ajivika sect.",""],
["L4","Which of these was NOT one of the four Mahajanapadas that fought for supremacy in north India?",["Vajji","Magadha","Kosala","Avanti"],"The four contenders were Magadha, Kosala, Avanti and Vatsa. Vajji was a republic, not one of the four monarchies in that struggle.",""],
["L5","Which of these was NOT a provincial capital of the Mauryan empire?",["Kaushambi","Taxila","Ujjain","Suvarnagiri"],"The provincial capitals were Taxila, Ujjain, Suvarnagiri and Tosali, with Pataliputra as the imperial capital.",""],
["L5","A Mauryan provincial governor, usually a prince of the royal house, was called:",["Kumara","Rajjuka","Pradeshika","Yukta"],"The Kumara or Aryaputra headed a province. Rajjukas measured land and Pradeshikas were district officers.",""],
["L5","The queen named in Ashoka's so-called 'Queen's Edict' is:",["Karuvaki","Kumaradevi","Trishala","Mahamaya"],"The edict mentions queen Karuvaki, mother of prince Tivara. Kumaradevi was the Lichchhavi wife of Chandragupta I.",""],
["L5","Which Ashokan rock edict prohibits animal sacrifice and festive gatherings?",["Rock Edict I","Rock Edict II","Rock Edict XII","Rock Edict XIII"],"Edict I bans animal sacrifice, Edict II provides medical aid, Edict XII preaches tolerance and Edict XIII describes Kalinga.",""],
["L5","Ashoka sent which two of his children to spread Buddhism in Sri Lanka?",["Mahendra and Sanghamitra","Tivara and Charumati","Dasharatha and Samprati","Kunala and Jalauka"],"His son Mahendra and daughter Sanghamitra led the mission to Sri Lanka after the Third Buddhist Council.","p"],
["L5","The Mauryan official called the Akaradhyaksha was in charge of:",["Mines","Ships","Markets","Weights and measures"],"Akara means mine. Navadhyaksha looked after shipping, Samsthadhyaksha markets and Pautavadhyaksha weights.",""],
["L6","'Buddhacharita', a Sanskrit life of the Buddha, was written by:",["Ashvaghosha","Nagasena","Vasumitra","Charaka"],"Ashvaghosha, who lived at Kanishka's court, wrote the Buddhacharita and was vice-president of the Fourth Buddhist Council.","p"],
["L6","The Tamil epic 'Silappadikaram' was composed by:",["Ilango Adigal","Sattanar","Thiruvalluvar","Tolkappiyar"],"Ilango Adigal wrote Silappadikaram; Sattanar wrote Manimekalai, the other great Sangam epic.","p"],
["L6","'Manimekalai', a Sangam-age Buddhist epic, was written by:",["Sattanar","Ilango Adigal","Nakkirar","Thiruvalluvar"],"Sattanar composed Manimekalai as a sequel to Silappadikaram.",""],
["L6","The Sangam assemblies of Tamil poets were held under the patronage of which dynasty?",["Pandya","Chera","Chola","Satavahana"],"The three Sangams were held at Madurai under Pandya patronage, which is why Madurai is the Sangam city.",""],
["L6","The physician Charaka, author of the Charaka Samhita, was patronised by:",["Kanishka","Ashoka","Chandragupta II","Harshavardhana"],"Charaka was a court physician of Kanishka, who also patronised Ashvaghosha and Nagarjuna.",""],
["L6","The railings of the Bharhut stupa, carved with Jataka scenes, belong to which period?",["Sunga","Maurya","Gupta","Kushana"],"Bharhut in Madhya Pradesh has Sunga-period railings, just as the Sungas added the railings at Sanchi.",""],
["L7","Brahmagupta's major work on mathematics and astronomy is:",["Brahmasphuta Siddhanta","Aryabhatiya","Brihat Samhita","Sushruta Samhita"],"Brahmagupta's Brahmasphuta Siddhanta gave the first clear rules for calculating with zero.",""],
["L7","'Panchasiddhantika' and 'Brihat Samhita' were written by:",["Varahamihira","Aryabhata","Brahmagupta","Charaka"],"Varahamihira, one of the nine gems, wrote both. Aryabhata wrote the Aryabhatiya.",""],
["L7","Which Gupta ruler was the first of the line to take the title 'Maharajadhiraja'?",["Chandragupta I","Sri Gupta","Samudragupta","Skandagupta"],"Chandragupta I took the grand title and started the Gupta era in 319–20 CE; his predecessors used only 'Maharaja'.",""],
["L7","The 'nine gems' or navaratnas of the court, said to include Kalidasa, are associated with:",["Chandragupta II","Samudragupta","Kumaragupta I","Harshavardhana"],"Tradition places the navaratnas, Kalidasa and Varahamihira among them, at the court of Chandragupta II Vikramaditya.",""],
["L7","The iron pillar at Mehrauli in Delhi, famous for resisting rust, is attributed to:",["Chandragupta II","Ashoka","Samudragupta","Kanishka"],"Its inscription names a king 'Chandra', generally identified with Chandragupta II, and shows Gupta skill in metallurgy.",""],
["L8","Pulakeshin II, who defeated Harshavardhana, belonged to which dynasty?",["Chalukyas of Badami","Rashtrakutas","Pallavas","Cholas"],"Pulakeshin II was a Chalukya of Vatapi (Badami); his victory is recorded in the Aihole inscription of Ravikirti.",""],
["L8","The capital of the Rashtrakuta dynasty was:",["Manyakheta","Vatapi","Kanchipuram","Thanjavur"],"Manyakheta (Malkhed) was the Rashtrakuta capital. Vatapi was Chalukyan and Kanchipuram Pallava.",""],
["L8","The Hoysaleshwara temple at Halebid and the Chennakeshava temple at Belur were built by the:",["Hoysalas","Chalukyas","Kakatiyas","Cholas"],"These star-shaped Vesara temples are Hoysala work, now UNESCO World Heritage sites.",""],
["L8","Which Chola ruler assumed the title 'Gangaikonda Chola' after his northern campaign?",["Rajendra I","Rajaraja I","Karikala","Kulottunga I"],"Rajendra I reached the Ganga and took the title; he also built a new capital, Gangaikondacholapuram.",""],
["L8","In Chola administration, the largest territorial division was called a:",["Mandalam","Nadu","Ur","Kurram"],"The Chola order ran Mandalam (province), then Valanadu and Nadu, down to the Ur or village.",""],
["L8","Which is regarded as the oldest university of ancient India?",["Takshashila","Nalanda","Vikramashila","Valabhi"],"Takshashila is the oldest centre of learning; Nalanda was founded later by Kumaragupta I and Vikramashila by Dharmapala.",""]

:root[data-skin] body{background-color:var(--app-bg);background-image:var(--app-pattern);background-size:var(--app-psize);background-attachment:fixed}
:root[data-skin] h1,:root[data-skin] h2{letter-spacing:-.01em}

/* ===== Desktop layout (PC / tablet landscape) ===== */
@media (min-width: 1024px){
  :root{--side:236px}
  body{padding-left:var(--side);font-size:16.5px}
  .top{border-bottom:1px solid var(--rule)}
  .top-in{max-width:1320px;padding:16px 36px}
  .brand{font-size:21px}
  .brand small{font-size:13px}
  .stat{font-size:13px}
  .wrap{max-width:1320px;padding:0 36px 56px}
  .view{padding-top:28px}
  h1{font-size:34px} h2{font-size:22px} h3{font-size:17px}

  /* bottom tab bar becomes a left sidebar */
  .nav{top:0;bottom:0;left:0;right:auto;width:var(--side);height:auto;border-top:0;border-right:1px solid var(--rule);padding:84px 14px 20px;display:block;overflow:auto}
  .nav-in{display:flex;flex-direction:column;gap:4px;height:auto;max-width:none;margin:0}
  .nav-in::before{content:"Sections";display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:0 14px 8px}
  .nav button{flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-size:15px;min-height:0;height:auto;width:100%;text-align:left}
  .nav button svg{width:20px;height:20px;flex-shrink:0}
  .nav button:hover{background:var(--sunk)}
  .nav button[aria-current="page"]{background:var(--blue-bg)}
  .nav button[aria-current="page"] span{border-bottom:0!important}

  /* home: intro beside progress */
  .hero{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);column-gap:48px;align-items:end;padding-bottom:10px}
  .hero > .eyebrow,.hero > h1,.hero > p{grid-column:1}
  .hero > .meter{grid-column:2;grid-row:3;align-self:center}
  .hero > .row{grid-column:2;grid-row:2;align-self:end}

  /* lesson reader: facts, timelines, tricks sit side by side */
  .lhead{margin-bottom:0}
  .steps{max-width:640px}
  .steps + .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .steps + .stack > .plain,.steps + .stack > .row,.steps + .stack > p,.steps + .stack > .fig,.steps + .stack > h2,.steps + .stack > .tbl{grid-column:1/-1}
  .steps + .stack > .plain{max-width:86ch;font-size:17px}
  .steps + .stack > .hot,.steps + .stack > .story{grid-column:1/-1}
  .steps + .stack > .story{max-width:none;padding:20px 24px;font-size:17.5px}
  .steps + .stack > .story p{max-width:80ch}
  .steps + .stack:not(:has(> .block ~ .block)) > .block{grid-column:1/-1}
  .block,.qcard{padding:18px 20px;border-radius:14px}

  /* quizzes and question bank */
  #lq > .stack{display:grid;grid-template-columns:minmax(0,1fr);max-width:980px;gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qt{font-size:18px}
  #plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #plist .opts{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:wrap;overflow:visible}

  /* mock test: question with the answer grid alongside */
  .mbar{top:calc(env(safe-area-inset-top,0px) + 67px)}
  .view > .qcard{max-width:1000px}
  .view > .row.between{max-width:1000px}
  .view > #msub{max-width:1000px;width:100%}
  .view > .block.stack{max-width:760px}
  .pal{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .kpis{max-width:760px}

  /* revise: summary cards and sheets in columns */
  #rv > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #rv > .stack > .grph,#rv > .stack > p,#rv > .stack > .search,#rv > .stack > .callout{grid-column:1/-1}
  #dgl,#lml,#tll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #dgl > .grph,#dgl > p,#lml > p,#tll > .grph{grid-column:1/-1}
  #rv .search,#rv > #dgl ~ .search{max-width:520px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flash{min-height:300px;max-width:760px;margin:0 auto;padding:32px 36px}
  .flash .front{font-size:22px}

  /* learn: era cards across the top */
  .eras{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}
  .les{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}

  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();

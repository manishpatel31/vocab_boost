const LESSONS = [
{"id":"L1","g":"anc","heat":2,"title":"Sources & the Stone Age","hi":"इतिहास के स्रोत · पाषाण काल","blocks":[{"k":"hot","h":"One question most years, almost always from the <b>same three things<\/b>: how history is divided, which site gave the first evidence of something (fire, agriculture, burial), and which source is literary vs archaeological. Learn the <i>firsts<\/i> — SSC asks \"earliest evidence of X was found at …\"."},{"k":"story","h":"<p>How do we know anything about people who lived thousands of years ago? We use <b>sources<\/b> (clues left behind). Some are things we dig up: stone tools, pots, coins, carvings on rock. These are archaeological sources. Others are things people wrote, like the Vedas or a traveller's account. These are literary sources. Historians also split the past by writing. The time before any writing is <b>prehistory<\/b>. Writing we cannot yet read, like the Harappan script, is proto-history. Once we can read it, it is history.<\/p><p>The longest chapter of the human story is the Stone Age, when tools were made of stone. Early humans hunted, gathered food and kept moving. Over time their tools got smaller and sharper (tiny blades called microliths). Then came a big change: people learned to farm and keep animals, so they settled in villages and made pottery. Later they mixed stone with copper, the first metal humans used.<\/p><p>So the order is simple: Old Stone, Middle Stone, New Stone, then Stone-and-Copper. Each step left clues at real places: the earliest fire at Kurnool caves, early farming at <b>Mehrgarh<\/b> and Lahuradewa, rock paintings at <b>Bhimbetka<\/b>. The tables tell you which clue was found where.<\/p>","key":"History is divided by writing, and the Stone Age moved step by step from wandering hunters to settled farmers."},{"k":"p","h":"History is studied from <b>sources<\/b>. <b>Archaeological<\/b> sources are things you dig up or read off stone — inscriptions, coins, monuments, pottery. <b>Literary<\/b> sources are written works — the Vedas, Puranas, Sangam texts, and accounts of foreign travellers. Anything before writing is <b>prehistory<\/b>; the phase with writing we cannot yet read (Harappan) is <b>proto-history<\/b>; once we can read the script, it is <b>history<\/b>."},{"k":"facts","title":"The three words SSC loves","rows":[["Prehistory","No writing at all — Stone Age"],["Proto-history","Writing exists but is undeciphered — Harappan"],["History","Writing exists and is readable — from the Vedic/Mahajanapada age on"],["Epigraphy","Study of inscriptions"],["Numismatics","Study of coins"],["Palaeography","Study of old scripts / writing"],["Archaeology","Study of material remains by excavation"]]},{"k":"table","title":"Stone Age at a glance","head":["Age","Rough date","Tools","Life"],"rows":[["Palaeolithic (Old Stone)","~2 mya – 12,000 BCE","Hand-axe, cleaver, quartzite","Hunting &amp; gathering; nomadic"],["Mesolithic (Middle Stone)","12,000 – 10,000 BCE","Microliths (tiny blades)","Hunting + first animal taming (dog)"],["Neolithic (New Stone)","10,000 – 2,500 BCE","Polished, ground tools; pottery","Farming, herding, settled villages"],["Chalcolithic (Stone–Copper)","2,500 – 700 BCE","Stone + copper","Villages, painted pottery"]]},{"k":"info","title":"The Stone Age in one strip","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 190\" role=\"img\" aria-label=\"The four ages of stone\">\n  <g class=\"anim-in\" style=\"animation-delay:0ms\"><path d=\"M10 40 h150 l14 30 l-14 30 h-150 l14 -30z\" fill=\"#a9805a\" opacity=\".9\"/>\n    <text x=\"92\" y=\"66\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" style=\"fill:#fff\">Palaeolithic<\/text><text x=\"92\" y=\"85\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:#fff\">Old Stone<\/text>\n    <text x=\"92\" y=\"122\" text-anchor=\"middle\" font-size=\"11.5\" class=\"b\">~2 mya – 12,000 BCE<\/text>\n    <text x=\"92\" y=\"142\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">Hand-axes, cleavers<\/text><text x=\"92\" y=\"157\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">hunting and gathering<\/text><\/g><g class=\"anim-in\" style=\"animation-delay:150ms\"><path d=\"M176 40 h150 l14 30 l-14 30 h-150 l14 -30z\" fill=\"#c69214\" opacity=\".9\"/>\n    <text x=\"258\" y=\"66\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" style=\"fill:#fff\">Mesolithic<\/text><text x=\"258\" y=\"85\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:#fff\">Middle Stone<\/text>\n    <text x=\"258\" y=\"122\" text-anchor=\"middle\" font-size=\"11.5\" class=\"b\">12,000 – 10,000 BCE<\/text>\n    <text x=\"258\" y=\"142\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">Microliths<\/text><text x=\"258\" y=\"157\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">first tamed animal (dog)<\/text><\/g><g class=\"anim-in\" style=\"animation-delay:300ms\"><path d=\"M342 40 h150 l14 30 l-14 30 h-150 l14 -30z\" fill=\"#2f8f4e\" opacity=\".9\"/>\n    <text x=\"424\" y=\"66\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" style=\"fill:#fff\">Neolithic<\/text><text x=\"424\" y=\"85\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:#fff\">New Stone<\/text>\n    <text x=\"424\" y=\"122\" text-anchor=\"middle\" font-size=\"11.5\" class=\"b\">10,000 – 2,500 BCE<\/text>\n    <text x=\"424\" y=\"142\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">Polished tools, pottery<\/text><text x=\"424\" y=\"157\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">farming, villages<\/text><\/g><g class=\"anim-in\" style=\"animation-delay:450ms\"><path d=\"M508 40 h150 l14 30 l-14 30 h-150 l14 -30z\" fill=\"#c0503a\" opacity=\".9\"/>\n    <text x=\"590\" y=\"66\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" style=\"fill:#fff\">Chalcolithic<\/text><text x=\"590\" y=\"85\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:#fff\">Stone + copper<\/text>\n    <text x=\"590\" y=\"122\" text-anchor=\"middle\" font-size=\"11.5\" class=\"b\">2,500 – 700 BCE<\/text>\n    <text x=\"590\" y=\"142\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">Copper and stone<\/text><text x=\"590\" y=\"157\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">painted pottery<\/text><\/g>\n  <text x=\"10\" y=\"24\" font-size=\"11\" class=\"mut\">Older ←<\/text><text x=\"670\" y=\"24\" text-anchor=\"end\" font-size=\"11\" class=\"mut\">→ Newer<\/text><\/svg><\/figure>","cap":"Tools tell the age: big hand-axes (Palaeolithic), tiny microliths (Mesolithic), polished tools and pottery (Neolithic), then copper (Chalcolithic)."},{"k":"facts","title":"Firsts — pure marks","rows":[["Earliest evidence of fire","Kurnool caves (Andhra Pradesh)"],["Earliest evidence of agriculture","Lahuradewa (UP) — rice; Mehrgarh (now Pakistan) — wheat/barley"],["Earliest human burial","Bhimbetka region / Mesolithic sites; dog buried with human at Burzahom (Kashmir)"],["Rock paintings","Bhimbetka, MP — UNESCO site, discovered 1957 by V. S. Wakankar"],["First Palaeolithic tool found in India","Pallavaram (Chennai), 1863, by Robert Bruce Foote"],["Pit dwellings","Burzahom, Kashmir"],["Ash mounds","Sanganakallu / Piklihal, Karnataka"],["Oldest Neolithic site (India)","Mehrgarh (Balochistan) — also earliest farming"]]},{"k":"mapfig","title":"Prehistoric sites on the map","pins":[["Bhimbetka",77.61,22.94,"Rock paintings",""],["Kurnool caves",78.1,15.4,"Earliest fire","l"],["Lahuradewa",82.98,26.77,"Earliest rice",""],["Mehrgarh",67.62,29.38,"Wheat, barley","l"],["Burzahom",74.87,34.17,"Pit dwellings",""],["Pallavaram",80.15,12.97,"First Palaeolithic tool",""],["Sanganakallu",76.95,15.18,"Ash mounds","l"],["Chirand",84.85,25.71,"Neolithic",""],["Inamgaon",74.2,18.6,"Chalcolithic","l"]],"cap":"Mehrgarh (now in Pakistan) has the earliest farming in the subcontinent; Lahuradewa (UP) the earliest rice."},{"k":"photos","title":"Prehistory in pictures","items":[["Bhimbetka_rock_shelters","Bhimbetka","Madhya Pradesh"],["Hand_axe","Hand axe","Palaeolithic tool"],["Microlith","Microlith","Mesolithic blades"],["Mehrgarh","Mehrgarh","Balochistan"],["Burzahom_archaeological_site","Burzahom","Kashmir"]]},{"k":"trick","h":"<b>Age order<\/b> — <span class=\"mn\">Pa-Me-Ne-Cha<\/span> = Palaeolithic → Mesolithic → Neolithic → Chalcolithic. Tool size <i>shrinks<\/i> then life <i>settles<\/i>: big hand-axe → tiny microlith → polished axe + pot.<br><b>Bruce Foote<\/b> gave the first tool at <b>Pallavaram<\/b> — both start with P."},{"k":"trap","h":"Bhimbetka is <b>rock paintings<\/b>, not the oldest farming. The oldest <b>farming<\/b> evidence is Mehrgarh (wheat/barley) and Lahuradewa (rice). And the <b>first metal<\/b> used by humans was <b>copper<\/b>, not iron."},{"k":"facts","title":"Who wrote what (literary sources)","rows":[["Arthashastra","Kautilya / Chanakya — Mauryan statecraft"],["Indica","Megasthenes — Greek envoy at Chandragupta Maurya's court"],["Mudrarakshasa","Vishakhadatta — on Chandragupta's rise"],["Rajatarangini","Kalhana — history of Kashmir"],["Harshacharita","Banabhatta — on Harshavardhana"],["Ashtadhyayi","Panini — Sanskrit grammar"],["Mahabhashya","Patanjali"],["Si-Yu-Ki","Hiuen Tsang (Xuanzang) — \"Records of the Western World\""]]}],"sum":["Prehistory = no writing · Proto-history = undeciphered writing (Harappa) · History = readable writing.","Order: Palaeolithic → Mesolithic → Neolithic → Chalcolithic (Pa-Me-Ne-Cha).","Fire → Kurnool caves. Rice farming → Lahuradewa. Wheat/barley + oldest Neolithic → Mehrgarh. Rock art → Bhimbetka (Wakankar, 1957).","First Palaeolithic tool in India: Pallavaram, 1863, Robert Bruce Foote.","Epigraphy = inscriptions · Numismatics = coins · Palaeography = scripts."]},
{"id":"L2","g":"anc","heat":3,"title":"Indus Valley Civilisation","hi":"सिंधु घाटी सभ्यता","blocks":[{"k":"hot","h":"<b>The single most asked ancient topic.<\/b> Expect 1–2 questions every CGL shift: site ↔ river, site ↔ discovery (dockyard, great bath, ploughed field, stadium), who excavated it, and the \"which of these is in India / Pakistan\" trap. Memorise the site table cold."},{"k":"story","h":"<p>About 4,500 years ago, along the Indus river and its neighbours, people built some of the world's first planned cities. Then they were forgotten. In 1921 <b>Daya Ram Sahni<\/b> dug at Harappa, and a year later R. D. Banerji found <b>Mohenjodaro<\/b>. That is why we call it the Harappan or Indus Valley Civilisation.<\/p><p>Why did cities grow here? Rivers gave water, fertile soil and easy transport. Farmers grew wheat, barley and cotton; they were among the first people in the world to grow cotton. Extra food let towns grow. The towns were laid out in a grid, with streets crossing at right angles and covered drains running under them. Bricks had the same fixed shape everywhere. Traders used standard weights and stamped seals. They knew copper and bronze but not iron, so this is a Bronze Age culture. Their script still cannot be read.<\/p><p>Each big site is remembered for one special find: the Great Bath at Mohenjodaro, a dockyard at <b>Lothal<\/b>, water reservoirs at Dholavira, a ploughed field at Kalibangan. After about 1900 BCE the cities declined. No one knows exactly why; floods, drying rivers and other ideas are all suggested. The tables pair each site with its river and its famous find.<\/p>","key":"The Indus people built planned, well-drained cities beside rivers, and each site is remembered for one special find."},{"k":"p","h":"Also called the <b>Harappan Civilisation<\/b> (after the first site found) and the <b>Bronze Age<\/b> civilisation of India. Discovered in <b>1921<\/b> by <b>Daya Ram Sahni<\/b> at Harappa; Mohenjodaro found <b>1922<\/b> by <b>R. D. Banerji<\/b>. Mature phase <b>2600–1900 BCE<\/b>. It belonged to the <b>Bronze Age<\/b> — copper and bronze were known, <b>iron was not<\/b>."},{"k":"table","title":"Site ↔ river ↔ what was found (learn this row by row)","head":["Site","River / place","Famous for"],"rows":[["Harappa","Ravi · Pakistan","First site found (1921, Daya Ram Sahni); granaries, coffin burial, R-37 cemetery"],["Mohenjodaro","Indus · Pakistan","<b>Great Bath<\/b>, Great Granary (largest building), bronze Dancing Girl, Pashupati seal, bearded priest; \"Mound of the Dead\""],["Lothal","Bhogavo · Gujarat","<b>Dockyard<\/b> — \"Manchester of the Indus\"; rice husk, fire altars, double burial"],["Dholavira","Khadir island · Gujarat","Water reservoirs, <b>stadium<\/b>, Harappan signboard, three-part town; UNESCO site"],["Kalibangan","Ghaggar · Rajasthan","<b>Ploughed field<\/b> (earliest), fire altars, camel bones; \"black bangles\""],["Rakhigarhi","Ghaggar · Haryana","<b>Largest Harappan site in India<\/b>"],["Banawali","Haryana","Toy plough, barley, lacks the usual grid"],["Chanhudaro","Sindh · Pakistan","<b>Bead-making<\/b> factory; only site without a citadel; cat chased by dog footprints"],["Surkotada","Gujarat","First true <b>horse bones<\/b>"],["Ropar / Rupnagar","Sutlej · Punjab","First site excavated after Independence; dog buried with human"],["Alamgirpur","Hindon · UP","<b>Easternmost<\/b> site"],["Sutkagendor","Dasht · Pakistan","<b>Westernmost<\/b> site"],["Daimabad","Pravara · Maharashtra","<b>Southernmost<\/b> site; bronze chariot"],["Manda","Chenab · J&amp;K","<b>Northernmost<\/b> site"]]},{"k":"worldfig","title":"Harappan sites on the map","vb":"618 125 82 72","minw":320,"maxw":620,"pins":[["1",72.86,30.63,"Harappa","n"],["2",68.14,27.33,"Mohenjodaro","n"],["3",72.25,22.52,"Lothal","n"],["4",70.21,23.89,"Dholavira","n"],["5",74.13,29.47,"Kalibangan","n"],["6",76.12,29.29,"Rakhigarhi","n"],["7",75.4,29.6,"Banawali","n"],["8",68.32,26.17,"Chanhudaro","n"],["9",70.83,23.62,"Surkotada","n"],["10",76.52,30.97,"Ropar","n"],["11",77.48,29,"Alamgirpur","n"],["12",61.95,25.5,"Sutkagendor","n"],["13",74.7,19.51,"Daimabad","n"],["14",74.75,32.9,"Manda","n"]],"legend":[["1 Harappa","Ravi, Pakistan"],["2 Mohenjodaro","Indus, Pakistan"],["3 Lothal","Bhogavo, Gujarat"],["4 Dholavira","Khadir island, Gujarat"],["5 Kalibangan","Ghaggar, Rajasthan"],["6 Rakhigarhi","Ghaggar, Haryana"],["7 Banawali","Haryana"],["8 Chanhudaro","Sindh, Pakistan"],["9 Surkotada","Gujarat"],["10 Ropar","Sutlej, Punjab"],["11 Alamgirpur","Hindon, UP"],["12 Sutkagendor","Dasht, Pakistan"],["13 Daimabad","Pravara, Maharashtra"],["14 Manda","Chenab, J&K"]],"cap":"The extremes: Sutkagendor (west), Alamgirpur (east), Manda (north), Daimabad (south). Most sites in India are in Gujarat, Rajasthan and Haryana."},{"k":"photos","title":"Harappan finds in pictures","items":[["Great_Bath,_Mohenjo-daro","Great Bath","Mohenjodaro"],["Dancing_Girl","Dancing Girl","Bronze · Mohenjodaro"],["Pashupati_seal","Pashupati seal","Mohenjodaro"],["Priest-King","Priest-King","Steatite · Mohenjodaro"],["Dholavira","Dholavira","Gujarat · UNESCO"],["Lothal","Lothal","The dockyard"]]},{"k":"trick","h":"<b>Corners of the Harappan map<\/b> — <span class=\"mn\">MAD-S<\/span>: <b>M<\/b>anda = North, <b>A<\/b>lamgirpur = East, <b>D<\/b>aimabad = South, <b>S<\/b>utkagendor = West.<br><b>Lothal = dock<\/b> (both have an \"L/o\" boat feel: <i>Lothal has the Lo-ading dock<\/i>). <b>Dholavira = \"Dho\" = water<\/b> → reservoirs. <b>Kalibangan = Kal (plough) + bangan<\/b> → ploughed field."},{"k":"facts","title":"Town planning & society","rows":[["Layout","<b>Grid pattern<\/b>, streets cutting at right angles; citadel (west, upper) + lower town (east)"],["Bricks","Burnt mud bricks in ratio <b>4:2:1<\/b>, laid in English bond"],["Drainage","Covered underground drains with manholes — the civilisation's hallmark"],["Weights","Binary and decimal: 1, 2, 4, 8, 16, 32 … (16 and its multiples); chert cubes"],["Script","<b>Boustrophedon<\/b> — right to left, then left to right; pictographic; still undeciphered"],["Seals","Mostly <b>steatite<\/b>; commonest animal on seals = <b>humped bull / unicorn<\/b>; <b>no horse<\/b> on seals"],["Metals known","Copper, bronze, gold, silver, lead, tin — <b>no iron<\/b>"],["Crops","Wheat, barley, cotton (first in the world — Greeks called it <i>Sindon<\/i>), peas; rice only at Lothal &amp; Rangpur"],["Animals","Bull, buffalo, elephant, rhino, dog, cat — <b>lion and horse absent<\/b> from seals"],["Worship","Mother Goddess, Pashupati (proto-Shiva), pipal tree, humped bull; <b>no temple found<\/b>"],["Great Bath","Mohenjodaro — 11.88 × 7.01 m, 2.43 m deep; bitumen-lined"],["Port towns","Lothal, Sutkagendor, Balakot, Allahdino, Kuntasi, Rangpur"]]},{"k":"info","title":"How a Harappan town was laid out","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 640 260\" role=\"img\" aria-label=\"A Harappan town: citadel on the west, lower town on the east\">\n  <rect x=\"20\" y=\"40\" width=\"170\" height=\"180\" rx=\"6\" class=\"abg\"/><text x=\"105\" y=\"30\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Citadel (west, raised)<\/text>\n  <rect x=\"45\" y=\"70\" width=\"70\" height=\"40\" rx=\"4\" fill=\"#2f6db5\" opacity=\".55\"/><text x=\"80\" y=\"95\" text-anchor=\"middle\" font-size=\"10\" class=\"b\" style=\"fill:#fff\">Great Bath<\/text>\n  <rect x=\"45\" y=\"130\" width=\"120\" height=\"50\" rx=\"4\" fill=\"#c69214\" opacity=\".7\"/><text x=\"105\" y=\"160\" text-anchor=\"middle\" font-size=\"10\" class=\"b\" style=\"fill:#fff\">Granary<\/text>\n  <rect x=\"230\" y=\"40\" width=\"390\" height=\"180\" rx=\"6\" class=\"gbg\"/><text x=\"425\" y=\"30\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Lower town (east) — houses<\/text>\n  <line x1=\"270\" y1=\"40\" x2=\"270\" y2=\"220\" stroke=\"#a9805a\" stroke-width=\"5\" opacity=\".6\"/><line x1=\"330\" y1=\"40\" x2=\"330\" y2=\"220\" stroke=\"#a9805a\" stroke-width=\"5\" opacity=\".6\"/><line x1=\"390\" y1=\"40\" x2=\"390\" y2=\"220\" stroke=\"#a9805a\" stroke-width=\"5\" opacity=\".6\"/><line x1=\"450\" y1=\"40\" x2=\"450\" y2=\"220\" stroke=\"#a9805a\" stroke-width=\"5\" opacity=\".6\"/><line x1=\"510\" y1=\"40\" x2=\"510\" y2=\"220\" stroke=\"#a9805a\" stroke-width=\"5\" opacity=\".6\"/><line x1=\"570\" y1=\"40\" x2=\"570\" y2=\"220\" stroke=\"#a9805a\" stroke-width=\"5\" opacity=\".6\"/>\n  <line x1=\"230\" y1=\"80\" x2=\"620\" y2=\"80\" stroke=\"#a9805a\" stroke-width=\"5\" opacity=\".6\"/><line x1=\"230\" y1=\"135\" x2=\"620\" y2=\"135\" stroke=\"#a9805a\" stroke-width=\"5\" opacity=\".6\"/><line x1=\"230\" y1=\"190\" x2=\"620\" y2=\"190\" stroke=\"#a9805a\" stroke-width=\"5\" opacity=\".6\"/>\n  <path d=\"M230 245 H620\" stroke=\"#2f6db5\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/><text x=\"425\" y=\"240\" text-anchor=\"middle\" font-size=\"11\" class=\"b\" style=\"fill:#2f6db5\">covered drains along the streets<\/text>\n  <text x=\"425\" y=\"135\" text-anchor=\"middle\" font-size=\"11\" class=\"mut\">streets meet at right angles — a grid<\/text><\/svg><\/figure>","cap":"A raised citadel on the west, a lower town of houses on the east, a grid of streets, covered drains and burnt bricks in the ratio 4:2:1."},{"k":"trap","h":"<b>Horse<\/b>: bones at Surkotada, but <b>no horse on any seal<\/b> — a classic trick option. <b>Iron was unknown<\/b> (it is a Bronze Age culture). <b>No temple<\/b> has been found anywhere. The <b>largest site overall<\/b> is Mohenjodaro; the <b>largest in India<\/b> is Rakhigarhi."},{"k":"tl","title":"Who found what","rows":[["1921","Harappa — Daya Ram Sahni (under John Marshall, ASI head)"],["1922","Mohenjodaro — R. D. Banerji"],["1931","Chanhudaro — N. G. Majumdar"],["1953","Kalibangan — A. Ghosh; Lothal — S. R. Rao (1955)"],["1967–68","Dholavira — J. P. Joshi; excavated by R. S. Bisht (1990)"],["1963","Rakhigarhi — Suraj Bhan"]]},{"k":"p","h":"<b>Decline (1900 BCE)<\/b> — no single accepted reason. Theories: Aryan invasion (Wheeler), floods (Marshall, S. R. Rao), drying of the Ghaggar-Hakra, earthquake (Dales), deforestation and ecological change (Fairservis)."}],"sum":["Harappa 1921 (Daya Ram Sahni) · Mohenjodaro 1922 (R. D. Banerji) · ASI head John Marshall. Mature phase 2600–1900 BCE.","Great Bath + Dancing Girl + Pashupati seal = Mohenjodaro. Dockyard = Lothal. Reservoirs + stadium = Dholavira. Ploughed field = Kalibangan. Bead factory = Chanhudaro. Horse bones = Surkotada.","Corners MAD-S: Manda N, Alamgirpur E, Daimabad S, Sutkagendor W. Largest site = Mohenjodaro; largest in India = Rakhigarhi.","Bricks 4:2:1 · grid streets · covered drains · weights in multiples of 16 · boustrophedon script, undeciphered.","Knew copper/bronze, first cotton growers; did NOT know iron; no horse on seals; no temple found."]},
{"id":"L3","g":"anc","heat":3,"title":"Vedic Age","hi":"वैदिक काल","blocks":[{"k":"hot","h":"Asked every year: which Veda has what, the four <b>Vedangas/Upavedas<\/b>, \"Satyameva Jayate\" and other mottos' source, river names (Sindhu most mentioned, Saraswati most holy), and Early vs Later Vedic differences."},{"k":"story","h":"<p>After the Indus cities faded, we meet a people called the Aryans in the land of seven rivers, the <b>Sapta-Sindhu<\/b> (the Punjab region). We know them not from cities but from their hymns, the <b>Vedas<\/b>. These were sung and memorised long before they were written down. The oldest, the <b>Rigveda<\/b>, praises gods like Indra and Agni and names many rivers.<\/p><p>Life in the Early (Rig) Vedic age, about 1500 to 1000 BCE, was simple. People herded cattle, and cows meant wealth. Tribes had chiefs and met in assemblies like the Sabha and Samiti. Then people moved east into the Ganga plains. With iron ploughs (iron tools for farming) they became settled farmers. Chiefs grew into kings who held huge sacrifices. Society became stricter, with four fixed varnas (social classes), and women lost some of their earlier place. This is the Later Vedic age, 1000 to 600 BCE.<\/p><p>Four Vedas came out of this time: Rig (hymns), Yajur (rituals), Sama (melodies) and Atharva (charms and medicine). Around them grew more texts, ending with the <b>Upanishads<\/b> (books of philosophy), the source of India's motto Satyameva Jayate. The tables sort out which Veda has what, and how Early and Later Vedic life differed.<\/p>","key":"Cattle-herders of the Rigveda became farming kingdoms in the Later Vedic age, and the four Vedas record that change."},{"k":"p","h":"<b>Early (Rig) Vedic 1500–1000 BCE<\/b>, <b>Later Vedic 1000–600 BCE<\/b>. The Aryans' home is debated — Max Müller said Central Asia, Bal Gangadhar Tilak said the Arctic, Dayanand Saraswati said Tibet, A. C. Das said the Sapta-Sindhu region itself."},{"k":"table","title":"The four Vedas — one line each","head":["Veda","What it is","Keys"],"rows":[["<b>Rigveda<\/b>","1,028 hymns in 10 mandalas; oldest text in the world still in use","Mandalas II–VII oldest; IX = Soma; X = <b>Purusha Sukta<\/b> (varna origin) and <b>Nadi Sukta<\/b> (rivers); <b>Gayatri Mantra<\/b> in III. Priest: <b>Hotri<\/b>"],["<b>Yajurveda<\/b>","Rituals — how to perform the sacrifice; prose + verse","Shukla (white) &amp; Krishna (black) recensions. Priest: <b>Adhvaryu<\/b>"],["<b>Samaveda<\/b>","Melodies for the hymns — <b>root of Indian music<\/b>","Priest: <b>Udgatri<\/b>"],["<b>Atharvaveda<\/b>","Charms, spells, medicine, magic — the \"people's Veda\"","Latest; also called Brahmaveda. Priest: <b>Brahma<\/b>"]]},{"k":"cards","title":"The four Vedas","rows":[["Rigveda","Hymns · Hotri","1,028 hymns in 10 mandalas; the oldest","📜"],["Yajurveda","Rituals · Adhvaryu","Prose and verse; Shukla and Krishna","🔥"],["Samaveda","Melodies · Udgatri","The root of Indian music","🎶"],["Atharvaveda","Charms · Brahma","Medicine and magic; the people's Veda","🌿"]]},{"k":"trick","h":"<b>Priest ↔ Veda<\/b> — <span class=\"mn\">HAUB<\/span> in Veda order R-Y-S-A: <b>H<\/b>otri (Rig), <b>A<\/b>dhvaryu (Yajur), <b>U<\/b>dgatri (Sama), <b>B<\/b>rahma (Atharva).<br><b>Sa<\/b>maveda → <b>Sa<\/b>ngeet (music). <b>Atharva<\/b> → <b>a<\/b>ushadhi (medicine/magic)."},{"k":"facts","title":"Mottos and where they come from","rows":[["Satyameva Jayate (India)","<b>Mundaka Upanishad<\/b>"],["Yogakshema Samriddhi (LIC)","—; LIC motto <i>Yogakshemam Vahamyaham<\/i> — Bhagavad Gita"],["Shramev Jayate","Labour Ministry"],["Dhyeyo Mahadhyeyah / \"Sarve Bhavantu Sukhinah\"","Upanishads"],["Asato Ma Sadgamaya","Brihadaranyaka Upanishad"],["Vasudhaiva Kutumbakam","Maha Upanishad"],["\"Charaiveti\" (keep moving)","Aitareya Brahmana"]]},{"k":"facts","title":"Vedic literature family","rows":[["Brahmanas","Prose explanations of the rituals of each Veda"],["Aranyakas","\"Forest books\" — philosophy of sacrifice"],["Upanishads","Philosophy; 108 in all, <b>13 principal<\/b>; source of \"Satyameva Jayate\""],["Vedangas (6)","Shiksha, Kalpa, Vyakarana, Nirukta, Chhanda, Jyotisha"],["Upavedas (4)","Ayurveda (medicine), Dhanurveda (archery), Gandharvaveda (music), Shilpaveda/Sthapatyaveda (architecture)"],["Six schools (Shad-darshana)","Samkhya (Kapila), Yoga (Patanjali), Nyaya (Gautama), Vaisheshika (Kanada), Mimamsa (Jaimini), Vedanta (Badarayana/Shankara)"],["Epics","Ramayana (Valmiki) · Mahabharata (Ved Vyasa) — longest poem in the world"]]},{"k":"table","title":"Rivers in the Rigveda","head":["Vedic name","Modern name"],"rows":[["Sindhu","Indus — <b>most mentioned<\/b>"],["Saraswati","Ghaggar-Hakra — <b>holiest / Naditama<\/b>"],["Vitasta","Jhelum"],["Askini / Chandrabhaga","Chenab"],["Parushni / Iravati","Ravi"],["Vipasha","Beas"],["Shutudri","Sutlej"],["Drishadvati","Chautang / Ghaggar branch"],["Kubha","Kabul"],["Suvastu","Swat"]]},{"k":"rivermap","title":"The rivers of the Rigveda","show":["Indus","Jhelum","Chenab","Ravi","Beas","Sutlej","Yamuna","Ganga"],"hl":["Indus","Jhelum","Chenab","Ravi","Beas","Sutlej","Yamuna","Ganga"],"label":["Indus","Jhelum","Chenab","Beas","Sutlej","Yamuna","Ganga"],"vb":"20 0 300 290","info":{"Indus":"Sindhu — the most mentioned river","Jhelum":"Vitasta","Chenab":"Askini (Chandrabhaga)","Ravi":"Parushni (Iravati)","Beas":"Vipasha","Sutlej":"Shutudri","Yamuna":"Yamuna — mentioned a few times","Ganga":"Ganga — mentioned once in the Rigveda"},"cap":"Tap a river for its Vedic name. The early Vedic people lived in the land of seven rivers (Sapta-Sindhu); later they moved east into the Ganga–Yamuna doab."},{"k":"trick","h":"<b>Five Punjab rivers, west → east<\/b> — <span class=\"mn\">Ji-Che-Ra-Be-Sa<\/span> (Jhelum, Chenab, Ravi, Beas, Sutlej) and their Vedic names in the same order: <span class=\"mn\">Vi-As-Pa-Vi-Shu<\/span> (Vitasta, Askini, Parushni, Vipasha, Shutudri)."},{"k":"table","title":"Early vs Later Vedic — the comparison SSC asks","head":["Point","Early (Rig) Vedic","Later Vedic"],"rows":[["Area","Sapta-Sindhu, Punjab–Haryana","Doab — Kuru, Panchala, Kosala, Videha; eastward"],["Economy","Pastoral; cattle = wealth (<i>gavishti<\/i> = war for cows)","Agriculture dominant; iron (<i>shyama/krishna ayas<\/i>) ploughs"],["Chief god","<b>Indra<\/b> (250 hymns), then Agni (200), Varuna","<b>Prajapati<\/b>, then Rudra and Vishnu rise; Indra, Agni fall"],["Politics","Tribal chief (<i>rajan<\/i>); assemblies <b>Sabha, Samiti, Vidatha, Gana<\/b>","Large kingdoms; big sacrifices — Rajasuya, Ashvamedha, Vajapeya; Sabha &amp; Samiti decline, Vidatha vanishes"],["Society","Varna by occupation, flexible; women attended Sabha","Rigid 4 varnas; <b>four ashramas<\/b> appear; women's position falls"],["Pottery","Ochre Coloured Pottery","<b>Painted Grey Ware<\/b> then Northern Black Polished Ware"]]},{"k":"trap","h":"<b>Indra<\/b> is the Rigveda's chief god — Vishnu and Shiva become major only later. <b>Vidatha<\/b> is the <i>oldest<\/i> assembly and the only one where women took part; it is the one that <b>disappears<\/b> in the Later Vedic age. The Gayatri Mantra is in Mandala <b>III<\/b> (dedicated to Savitri/Savitra), not Mandala I."}],"sum":["Rigveda: 1,028 hymns, 10 mandalas; Gayatri Mantra in Mandala III; Purusha Sukta (varna) and Nadi Sukta in Mandala X.","Priests H-A-U-B: Hotri (Rig), Adhvaryu (Yajur), Udgatri (Sama), Brahma (Atharva). Samaveda = music; Atharvaveda = medicine/magic.","Satyameva Jayate → Mundaka Upanishad. 108 Upanishads, 13 principal.","Sindhu = most mentioned river; Saraswati = holiest (Naditama). Vedic names Vi-As-Pa-Vi-Shu = Jhelum, Chenab, Ravi, Beas, Sutlej.","Early Vedic: Indra, cattle wealth, Sabha–Samiti–Vidatha. Later Vedic: Prajapati, iron ploughs, big sacrifices, Vidatha gone, 4 ashramas."]},
{"id":"L4","g":"anc","heat":3,"title":"Mahajanapadas, Buddhism & Jainism","hi":"महाजनपद · बौद्ध एवं जैन धर्म","blocks":[{"k":"hot","h":"Two or three questions a shift between the two religions: Buddhist councils (year–place–king–president), the Four Noble Truths, Jain Tirthankaras and their symbols, Mahavira's five vows, and which text belongs to which religion."},{"k":"story","h":"<p>By about 600 BCE, farming had made the Ganga plains rich. Small tribes grew into sixteen big states called <b>Mahajanapadas<\/b>. They fought each other, and one won: <b>Magadha<\/b> in Bihar. It had iron ore, elephants and fertile land. Its kings, starting with Bimbisara, built the power that the Mauryas later turned into an empire.<\/p><p>The same time was full of big questions. Later Vedic rituals had become costly and caste rules tight. Many thinkers asked: why do people suffer, and how can we be free? Two answers lasted. A Shakya prince, Gautama, gave up palace life, found enlightenment at Bodh Gaya and became the <b>Buddha<\/b>. He taught a Middle Path, the Four Noble Truths and the Eightfold Path, in Pali, the people's language. <b>Mahavira<\/b>, the 24th Tirthankara (teacher-saint) of Jainism, taught strict non-violence and five vows, in Prakrit.<\/p><p>Both spoke to ordinary people, not just priests, and both won royal support. Kings like Ashoka and Kanishka backed Buddhism; Chandragupta Maurya turned Jain. Monks met in councils to protect the teachings, and in time both faiths split into sects. The tables compare the two founders, list the four Buddhist councils and give the Jain Tirthankaras.<\/p>","key":"Magadha won the race among sixteen states, while Buddha and Mahavira offered ordinary people a way out of suffering beyond costly rituals."},{"k":"facts","title":"16 Mahajanapadas — only what is asked","rows":[["Source","<b>Anguttara Nikaya<\/b> (Buddhist) lists 16; Jain <i>Bhagavati Sutra<\/i> also lists them"],["The four that fought for supremacy","Magadha, Kosala, Avanti, Vatsa"],["Winner","<b>Magadha<\/b> — iron ore at Rajgir, elephants, two capitals (Rajgriha then Pataliputra)"],["Only republics (gana-sangha)","<b>Vajji<\/b> (Vaishali) and <b>Malla<\/b>"],["Dynasties of Magadha in order","Haryanka → Shishunaga → Nanda → Maurya"],["Haryanka","Bimbisara (capital Rajgriha; contemporary of Buddha &amp; Mahavira) → Ajatashatru (founded Pataliputra's fort) → Udayin (shifted capital to <b>Pataliputra<\/b>)"],["Shishunaga","Shishunaga destroyed Avanti; Kalashoka held the <b>2nd Buddhist Council<\/b>"],["Nanda","Mahapadma Nanda \"Ugrasena\"; last ruler <b>Dhanananda<\/b>, beaten by Chandragupta Maurya"]]},{"k":"table","title":"Buddhism vs Jainism — the compare question","head":["Point","Buddhism","Jainism"],"rows":[["Founder","<b>Gautama Buddha<\/b> (563–483 BCE)","<b>Vardhamana Mahavira<\/b> — 24th Tirthankara (540–468 BCE)"],["Born at","<b>Lumbini<\/b> (Nepal); mother Mahamaya, father Suddhodana (Shakya clan)","<b>Kundagrama<\/b>, Vaishali; father Siddhartha, mother Trishala (Jnatrika clan)"],["Enlightenment","<b>Bodh Gaya<\/b> under a pipal tree, age 35 — \"Nirvana/Bodhi\"","<b>Jrimbhikagrama<\/b> on the Rijupalika river, age 42 — \"Kaivalya\""],["First sermon","<b>Sarnath<\/b> (Deer Park) — <i>Dharmachakra Pravartana<\/i>","Preached in <b>Prakrit<\/b> (Ardha-Magadhi)"],["Death","<b>Kushinagar<\/b> (UP), age 80 — <i>Mahaparinirvana<\/i>","<b>Pavapuri<\/b> (Bihar), age 72"],["Language","<b>Pali<\/b>","<b>Prakrit<\/b>"],["Goal","Nirvana — end suffering, Middle Path","Kaivalya — free the soul; extreme non-violence"],["Sects","<b>Mahayana<\/b> (idol worship, Sanskrit, Bodhisattva) · <b>Hinayana/Theravada<\/b> (Pali) · Vajrayana (Tantric, Tibet)","<b>Digambara<\/b> (naked, Bhadrabahu) · <b>Svetambara<\/b> (white-clad, Sthulabhadra)"],["Key texts","<b>Tripitaka<\/b>: Vinaya, Sutta, Abhidhamma (all in Pali); Jatakas; Milindapanho","<b>Agamas / 12 Angas<\/b>; Kalpasutra (Bhadrabahu); Acharanga Sutra"],["Royal patrons","Bimbisara, Ajatashatru, <b>Ashoka<\/b>, Kanishka, Harsha","Bimbisara, <b>Chandragupta Maurya<\/b>, Kharavela, Amoghavarsha, Kumarapala"]]},{"k":"facts","title":"Buddhism — the doctrine","rows":[["Four Noble Truths","(1) <i>Dukkha<\/i> — there is suffering (2) <i>Dukkha Samudaya<\/i> — it has a cause, desire (3) <i>Dukkha Nirodha<\/i> — it can be ended (4) <i>Dukkha Nirodha Marga<\/i> — the Eightfold Path ends it"],["Eightfold Path (Ashtangika Marga)","Right view, intention, speech, action, livelihood, effort, mindfulness, concentration"],["Triratna","<b>Buddha, Dhamma, Sangha<\/b>"],["Five symbols of Buddha's life","Lotus &amp; bull = birth · <b>Horse = renunciation<\/b> (Mahabhinishkramana) · <b>Bodhi tree = enlightenment<\/b> · <b>Wheel = first sermon<\/b> · <b>Stupa = death<\/b>"],["First disciples","Sariputta &amp; Moggallana; first woman: <b>Mahaprajapati Gotami<\/b> (his aunt), through Ananda"],["Teachers before enlightenment","Alara Kalama, Ramaputta Udraka"],["Horse / charioteer","Horse <b>Kanthaka<\/b>; charioteer <b>Channa<\/b>"]]},{"k":"table","title":"Four Buddhist Councils — year, place, king, president","head":["#","Year","Place","King","President / result"],"rows":[["1st","483 BCE","<b>Rajgriha<\/b> (Sattapanni cave)","Ajatashatru","<b>Mahakassapa<\/b> — Vinaya &amp; Sutta Pitaka compiled"],["2nd","383 BCE","<b>Vaishali<\/b>","Kalashoka","Sabakami — split into Sthaviravadin &amp; Mahasanghika"],["3rd","250 BCE","<b>Pataliputra<\/b>","<b>Ashoka<\/b>","<b>Moggaliputta Tissa<\/b> — Abhidhamma Pitaka added; missions sent abroad"],["4th","~72 CE","<b>Kundalvana, Kashmir<\/b>","<b>Kanishka<\/b>","<b>Vasumitra<\/b> (vice: Ashvaghosha) — final split into Mahayana &amp; Hinayana; Sanskrit adopted"]]},{"k":"mapfig","title":"The Buddha's life and the four councils","pins":[["1",83.28,27.48,"Lumbini","n"],["2",84.99,24.7,"Bodh Gaya","n"],["3",83.02,25.38,"Sarnath","n"],["4",83.89,26.74,"Kushinagar","n"],["5",85.42,25.03,"Rajgir","n"],["6",85.13,25.99,"Vaishali","n"],["7",85.14,25.6,"Pataliputra","n"],["8",74.9,34.2,"Kundalvana","n"]],"facts":[["1 · Lumbini","Born · now in Nepal"],["2 · Bodh Gaya","Enlightenment under the Bodhi tree"],["3 · Sarnath","First sermon — Dharmachakra Pravartana"],["4 · Kushinagar","Mahaparinirvana (death)"],["5 · Rajgir","1st council · 483 BCE · Ajatashatru"],["6 · Vaishali","2nd council · 383 BCE · Kalashoka"],["7 · Pataliputra","3rd council · 250 BCE · Ashoka"],["8 · Kundalvana","4th council · ~72 CE · Kanishka"]],"cap":"1–4: the four great places of the Buddha's life; 5–8: the four councils in order. Use ＋ or ⛶ to separate the Bihar cluster."},{"k":"photos","title":"Buddhist sites in pictures","items":[["Mahabodhi_Temple","Mahabodhi Temple","Bodh Gaya"],["Dhamek_Stupa","Dhamek Stupa","Sarnath"],["Lumbini","Lumbini","Birthplace"],["Mahaparinirvana_Temple","Mahaparinirvana Temple","Kushinagar"],["Saptaparni_Cave","Saptaparni Cave","Rajgir · first council"]]},{"k":"trick","h":"<b>Councils<\/b> — <span class=\"mn\">Ra-Vai-Pa-Ka<\/span> (Rajgriha, Vaishali, Pataliputra, Kashmir) under <span class=\"mn\">A-Ka-A-Ka<\/span> (Ajatashatru, Kalashoka, Ashoka, Kanishka).<br><b>Presidents<\/b>: <span class=\"mn\">Ma-Sa-Mo-Va<\/span> — Mahakassapa, Sabakami, Moggaliputta Tissa, Vasumitra."},{"k":"facts","title":"Jainism — the doctrine","rows":[["Five vows","<b>Ahimsa<\/b> (non-violence), <b>Satya<\/b> (truth), <b>Asteya<\/b> (non-stealing), <b>Aparigraha<\/b> (non-possession), <b>Brahmacharya<\/b> (celibacy) — the 5th added by <b>Mahavira<\/b>; first four by Parshvanatha"],["Three jewels (Triratna)","Right faith, right knowledge, right conduct"],["Core ideas","<b>Syadvada / Anekantavada<\/b> — many-sidedness of truth; <b>Kaivalya<\/b>; <b>Sallekhana<\/b> (fast unto death)"],["1st Tirthankara","<b>Rishabhanatha / Adinath<\/b> — symbol bull; mentioned in the Rigveda"],["23rd Tirthankara","<b>Parshvanatha<\/b> — symbol snake"],["24th Tirthankara","<b>Mahavira<\/b> — symbol <b>lion<\/b>"],["22nd Tirthankara","Neminatha — symbol conch"],["Jain councils","1st: Pataliputra (~300 BCE, Chandragupta Maurya, Sthulabhadra) → Digambara/Svetambara split. 2nd: <b>Valabhi<\/b> (512 CE, Devardhi Kshamasramana) — Agamas written down"],["Mahavira's first disciple","Jamali (also his son-in-law); 11 Ganadharas"]]},{"k":"trap","h":"Jainism was <b>not founded<\/b> by Mahavira — he is the <b>24th<\/b> Tirthankara and a <i>reformer<\/i>; Rishabhanatha was the first. Buddha attained enlightenment at <b>Bodh Gaya<\/b> but gave his <b>first sermon at Sarnath<\/b> — don't swap them. Buddha was born at <b>Lumbini<\/b>, died at <b>Kushinagar<\/b>."},{"k":"facts","title":"Other sects of the time","rows":[["Ajivika","<b>Makkhali Gosala<\/b> — strict fatalism (niyati)"],["Charvaka / Lokayata","Materialism — <b>Brihaspati<\/b>; \"eat, drink, be merry\""],["Ajnana","Sanjaya Belatthiputta — agnosticism"],["Akriyavada","Purana Kassapa"]]}],"sum":["Buddha: born Lumbini, enlightened Bodh Gaya, first sermon Sarnath, died Kushinagar. Language Pali; Tripitaka = Vinaya + Sutta + Abhidhamma.","Four Noble Truths + Eightfold Path + Triratna (Buddha, Dhamma, Sangha). Symbols: horse = renunciation, bodhi tree = enlightenment, wheel = first sermon, stupa = death.","Councils Ra-Vai-Pa-Ka under Ajatashatru, Kalashoka, Ashoka, Kanishka; presidents Mahakassapa, Sabakami, Moggaliputta Tissa, Vasumitra. 4th = Mahayana–Hinayana split.","Mahavira = 24th Tirthankara (symbol lion), born Kundagrama, died Pavapuri; language Prakrit; added the 5th vow Brahmacharya.","Magadha dynasties: Haryanka → Shishunaga → Nanda → Maurya. Vajji and Malla were the republics."]},
{"id":"L5","g":"anc","heat":3,"title":"Mauryan Empire","hi":"मौर्य साम्राज्य","blocks":[{"k":"hot","h":"Ashoka is a <b>guaranteed<\/b> area: which edict says what, where the pillars stand, the Kalinga war year, Megasthenes, and Mauryan officials (<i>Sitadhyaksha<\/i>, <i>Panyadhyaksha<\/i>…). Also the Arthashastra's famous terms."},{"k":"story","h":"<p>Around 322 BCE a young man named <b>Chandragupta Maurya<\/b>, guided by the clever teacher <b>Chanakya<\/b> (Kautilya), overthrew the Nanda king of Magadha. He built India's first great empire, with its capital at Pataliputra. He even beat the Greek general Seleucus, who then sent an ambassador, Megasthenes, to his court. Chanakya's book, the Arthashastra, shows how the state was run: officers for farming, trade, mines and tolls, and spies everywhere.<\/p><p>His grandson <b>Ashoka<\/b> made the empire bigger still. In 261 BCE he conquered Kalinga (in Odisha). The war killed and uprooted huge numbers of people, and Ashoka was filled with regret. He turned to Buddhism and decided to rule by dhamma (a code of good conduct): kindness, tolerance and care for people and animals.<\/p><p>To spread this message he had it carved on rocks and pillars across the land. These edicts are our best record of him, and one of his pillars, at Sarnath, gave India its National Emblem. After Ashoka the empire weakened, and in 185 BCE the last Maurya, Brihadratha, was killed by his own general, <b>Pushyamitra Sunga<\/b>. The tables cover the rulers, the edicts and the officials.<\/p>","key":"Chandragupta and Chanakya built the empire by force and planning; Ashoka, shaken by the Kalinga war, ruled by dhamma and carved it in stone."},{"k":"tl","title":"The dynasty in order","rows":[["322/321 BCE","<b>Chandragupta Maurya<\/b> founds the empire with Chanakya's help, defeating Dhanananda"],["305 BCE","Beats <b>Seleucus Nicator<\/b>; treaty gives him Kabul, Kandahar, Herat, Balochistan; marries Helena. Seleucus sends <b>Megasthenes<\/b> as envoy"],["298 BCE","Abdicates, turns Jain under <b>Bhadrabahu<\/b>, dies by <i>sallekhana<\/i> at <b>Shravanabelagola<\/b> (Karnataka)"],["298–273 BCE","<b>Bindusara<\/b> \"Amitraghata\" (slayer of foes); Greek envoy <b>Deimachus<\/b>"],["273/268–232 BCE","<b>Ashoka<\/b> \"Devanampiya Piyadassi\" — crowned 269 BCE"],["261 BCE","<b>Kalinga War<\/b> — described in his own <b>13th Rock Edict<\/b>; he turns to Buddhism (teacher Upagupta/Nigrodha)"],["250 BCE","<b>3rd Buddhist Council<\/b> at Pataliputra; sends son <b>Mahendra<\/b> and daughter <b>Sanghamitra<\/b> to Sri Lanka"],["185/184 BCE","Last ruler <b>Brihadratha<\/b> killed by his general <b>Pushyamitra Sunga<\/b>"]]},{"k":"facts","title":"Ashoka's inscriptions — the most asked table","rows":[["Script &amp; language","Mostly <b>Brahmi<\/b> in Prakrit; <b>Kharosthi<\/b> in the north-west (Shahbazgarhi, Mansehra); Greek &amp; Aramaic at Kandahar/Shar-i-Kuna"],["Deciphered by","<b>James Prinsep<\/b> (1837) — Brahmi"],["Major Rock Edicts","14 in number"],["Rock Edict XIII","Longest — the <b>Kalinga war<\/b> and remorse; names 5 Greek kings"],["Rock Edict XII","<b>Religious tolerance<\/b>"],["Rock Edict I","Bans animal sacrifice and festive gatherings"],["Rock Edict II","Medical help for men and animals"],["Minor Rock Edict (Maski &amp; Gujarra)","The only ones that use his personal name <b>\"Ashoka\"<\/b> — elsewhere he is \"Devanampiya Piyadassi\""],["Pillar Edict VII","Summary of his dhamma work — longest pillar edict"],["Rummindei / Lumbini pillar","Records his visit to Buddha's birthplace and tax relief for the village"],["Schism / Sarnath–Sanchi edict","Warns monks against splitting the Sangha"],["Queen's Edict","Mentions queen <b>Karuvaki<\/b>, mother of Tivara"],["Sarnath Lion Capital","<b>National Emblem<\/b> (adopted 26 Jan 1950); the <b>Ashoka Chakra<\/b> of 24 spokes from its abacus is on the flag"]]},{"k":"mapfig","title":"Where Ashoka's edicts stand","pins":[["Girnar",70.53,21.52,"Major rock edict","l"],["Kalsi",77.85,30.52,"Major rock edict",""],["Shahbazgarhi",72.17,34.22,"Kharosthi script","l"],["Dhauli",85.84,20.19,"Kalinga edict",""],["Jaugada",84.83,19.53,"Kalinga edict","l"],["Sopara",72.8,19.42,"","l"],["Maski",76.66,15.96,"Name 'Ashoka' appears","l"],["Sarnath",83.02,25.38,"Lion capital",""],["Sanchi",77.74,23.48,"Stupa, pillar",""],["Rummindei",83.28,27.48,"Lumbini pillar","l"],["Yerragudi",77.7,15.2,"",""]],"cap":"Rock edicts on the frontiers, pillars in the heartland. The Maski edict was the first to name 'Ashoka'; James Prinsep read the Brahmi script in 1837."},{"k":"photos","title":"The Mauryas in pictures","items":[["Lion_Capital_of_Ashoka","Lion Capital of Ashoka","Sarnath — the national emblem"],["Sanchi_Stupa","Sanchi Stupa","Begun by Ashoka"],["Dhauli","Dhauli","Kalinga edicts"],["Rampurva_capitals","Rampurva","Bull capital"],["Didarganj_Yakshi","Didarganj Yakshi","Mauryan polish"]]},{"k":"trick","h":"<b>Edict numbers<\/b> — \"<b>One<\/b> stops sacrifice, <b>Two<\/b> gives treatment, <b>Twelve<\/b> gives tolerance, <b>Thirteen<\/b> tells of Kalinga.\" Remember <span class=\"mn\">1-sacrifice, 2-doctor, 12-tolerance, 13-Kalinga<\/span>.<br><b>Only two edicts name \"Ashoka\"<\/b>: <span class=\"mn\">MG<\/span> = <b>M<\/b>aski, <b>G<\/b>ujarra (also Nittur &amp; Udegolam)."},{"k":"facts","title":"Mauryan administration (from the Arthashastra)","rows":[["Capital","Pataliputra; four provinces — Taxila, Ujjain, Suvarnagiri, Tosali (+ Kalinga later)"],["Provincial governor","<b>Kumara / Aryaputra<\/b> (usually a prince)"],["Sitadhyaksha","In charge of <b>crown/state agriculture<\/b>"],["Panyadhyaksha","<b>Commerce<\/b>"],["Akaradhyaksha","<b>Mines<\/b>"],["Lohadhyaksha","Metals / iron"],["Navadhyaksha","Ships / shipping"],["Sulkadhyaksha","<b>Tolls and customs<\/b>"],["Pautavadhyaksha","Weights and measures"],["Samsthadhyaksha","Markets"],["Sannidhata","<b>Treasurer<\/b>"],["Samaharta","<b>Chief revenue collector<\/b>"],["Rajjukas","Land measurement and justice in the districts"],["Dhamma Mahamatta","New post created by <b>Ashoka<\/b> to spread dhamma"],["Spies","<i>Gudhapurusha<\/i>; stationary = <b>Samstha<\/b>, wandering = <b>Sanchara<\/b>"],["Tax","<b>Bhaga<\/b> = 1/6 of produce; <b>Bali<\/b>, <b>Pindakara<\/b>, <b>Hiranya<\/b> (cash)"],["Coins","<b>Punch-marked silver<\/b> coins called <i>Pana<\/i> / Karshapana"]]},{"k":"facts","title":"Megasthenes' Indica — what SSC quotes","rows":[["He was","Greek ambassador of Seleucus at <b>Chandragupta Maurya's<\/b> court"],["Society","Said Indian society had <b>7 castes<\/b> (not 4) and that there was <b>no slavery<\/b>"],["City","Pataliputra was run by 6 committees of 5 members each; it had 64 gates and 570 towers"],["Army","Chandragupta's army: 6 lakh infantry, 30,000 cavalry, 9,000 elephants"]]},{"k":"trap","h":"Chandragupta Maurya became a <b>Jain<\/b>; Ashoka became a <b>Buddhist<\/b> — a favourite swap. Ashoka did <b>not<\/b> make Buddhism the state religion or stop ruling; his <i>dhamma<\/i> was a code of conduct. Brahmi was deciphered by <b>James Prinsep<\/b>, not William Jones. The Sarnath capital has <b>four lions<\/b>, and only <b>three are visible<\/b> in the emblem."}],"sum":["322 BCE Chandragupta + Chanakya beat Dhanananda; 305 BCE treaty with Seleucus; Megasthenes writes Indica. Chandragupta dies a Jain at Shravanabelagola.","Ashoka: crowned 269 BCE, Kalinga War 261 BCE (Rock Edict XIII), 3rd Buddhist Council 250 BCE at Pataliputra.","Edicts: I bans sacrifice, II medical aid, XII tolerance, XIII Kalinga. Only Maski & Gujarra name 'Ashoka'. Brahmi deciphered by James Prinsep, 1837.","Officials: Sitadhyaksha (agriculture), Panyadhyaksha (commerce), Akaradhyaksha (mines), Sulkadhyaksha (tolls), Sannidhata (treasury), Samaharta (revenue).","Last Maurya Brihadratha killed by Pushyamitra Sunga, 185 BCE. Sarnath Lion Capital = National Emblem."]},
{"id":"L6","g":"anc","heat":2,"title":"Post-Mauryan & the Sangam Age","hi":"मौर्योत्तर काल · संगम युग","blocks":[{"k":"hot","h":"Kanishka and the Gandhara/Mathura schools are the certainty here; add Satavahana coinage, Kharavela's Hathigumpha inscription, and Sangam literature (Tolkappiyam, Thirukkural)."},{"k":"story","h":"<p>When the Mauryan empire broke up, no single power held India. Many smaller dynasties took its place. Some were local, like the Sungas who replaced the Mauryas, and the <b>Satavahanas<\/b> in the Deccan. Others came in from the north-west: Indo-Greeks, Shakas and Kushanas. The greatest Kushana king, <b>Kanishka<\/b>, ruled from Purushapura (Peshawar) and started the Saka era of 78 CE, which India still uses as its national calendar.<\/p><p>With so many peoples meeting and trading, ideas mixed, and you can see it in art. For the first time the Buddha was carved as a human figure instead of a symbol. In <b>Gandhara<\/b> the style looked Greek, with wavy hair and folded robes in grey stone. In <b>Mathura<\/b> it was purely Indian, in red sandstone. Kings also left long inscriptions and new coins.<\/p><p>Meanwhile the far south had its own story. Three Tamil kingdoms, the Cheras, Cholas and Pandyas, traded pepper, cotton and pearls from busy ports. Poets met in assemblies called Sangams at Madurai, so this is the <b>Sangam Age<\/b>. Their works, like the Thirukkural, are the oldest Tamil literature. The tables list the dynasties, compare the art schools and map the Sangam kingdoms.<\/p>","key":"After the Mauryas many smaller kings, some from outside, ruled; their mixing gave new art in Gandhara and Mathura, while the Tamil south had its Sangam Age."},{"k":"table","title":"Dynasties after the Mauryas","head":["Dynasty","Founder / famous ruler","Must-know"],"rows":[["<b>Sunga<\/b> (185–73 BCE)","Pushyamitra Sunga","Capital Pataliputra/Vidisha; Patanjali in his court; <b>Sanchi &amp; Bharhut stupa railings<\/b>; Brahmanical revival"],["<b>Kanva<\/b> (73–28 BCE)","Vasudeva","Short-lived, ended by Satavahanas"],["<b>Satavahana<\/b> (1st c. BCE–2nd c. CE)","Simuka; greatest <b>Gautamiputra Satakarni<\/b>","Capital <b>Pratishthana/Paithan<\/b>; first to issue <b>lead<\/b> coins; land grants to Brahmins; Nasik &amp; Nanaghat inscriptions; <b>matrilineal names<\/b> (Gautamiputra, Vasishthiputra)"],["<b>Indo-Greek<\/b>","<b>Menander<\/b> (Milinda)","First to issue <b>gold coins<\/b> in India; turned Buddhist via Nagasena — <i>Milindapanho<\/i>"],["<b>Shaka<\/b> (Western Kshatrapas)","<b>Rudradaman I<\/b>","<b>Junagadh / Girnar inscription<\/b> — first long Sanskrit inscription; repaired Sudarshana lake. Shakas defeated by <b>Chandragupta II<\/b>"],["<b>Kushana<\/b> (1st–3rd c. CE)","Kujula Kadphises; greatest <b>Kanishka<\/b> (78 CE)","Capital <b>Purushapura (Peshawar)<\/b> &amp; Mathura; started the <b>Saka era (78 CE)<\/b>; 4th Buddhist Council; patron of Ashvaghosha, Charaka, Nagarjuna, Vasumitra; purest <b>gold coins<\/b>"],["<b>Chedi / Mahameghavahana<\/b>","<b>Kharavela<\/b> of Kalinga","<b>Hathigumpha inscription<\/b> (Udayagiri, Odisha); a Jain"]]},{"k":"mapfig","title":"After the Mauryas: the main seats of power","pins":[["Vidisha",77.81,23.52,"Sunga",""],["Paithan",75.38,19.48,"Satavahana","l"],["Peshawar",71.57,34.01,"Kushana capital","l"],["Mathura",77.67,27.49,"Kushana",""],["Sakala",74.52,32.49,"Menander","l"],["Girnar",70.53,21.52,"Rudradaman (Shaka)","l"],["Udayagiri",85.79,20.26,"Kharavela",""]]},{"k":"table","title":"Gandhara vs Mathura school — the compare question","head":["Point","Gandhara","Mathura"],"rows":[["Influence","<b>Greek / Hellenistic<\/b>","Purely <b>indigenous<\/b>"],["Material","Blue-grey schist / stucco","<b>Red sandstone<\/b> (spotted, from Sikri)"],["Look","Wavy hair, muscular, Apollo-like, heavy drapery with folds","Heavy body, shaven head/ushnisha, thin clinging robe, smiling"],["Patron","Kushanas","Kushanas"],["Note","<b>First images of Buddha<\/b> made here (and at Mathura) — before this he was shown only by symbols","Also carved Jain and Hindu images"]]},{"k":"photos","title":"Gandhara and Mathura side by side","items":[["Gandhara_Buddha","Gandhara Buddha","Gandhara · grey schist, wavy hair"],["Gandhara_art","Gandhara art","Greek influence"],["Mathura_art","Mathura art","Red sandstone · Indian"],["Bodhisattva_Maitreya","Bodhisattva Maitreya","Mathura"]]},{"k":"p","h":"The third school, <b>Amaravati<\/b> (Andhra, Satavahana), used <b>white marble<\/b> and favoured narrative panels of Buddha's life."},{"k":"facts","title":"Sangam Age (c. 300 BCE – 300 CE) — Tamilakam","rows":[["Three kingdoms","<b>Chera<\/b> (capital Vanji, port Muziris — pepper), <b>Chola<\/b> (Uraiyur, port Puhar/Kaveripattinam — cotton), <b>Pandya<\/b> (Madurai, port Korkai — pearls)"],["Sangams","Three assemblies of poets at Madurai under Pandya patronage"],["<b>Tolkappiyam<\/b>","Oldest Tamil work — grammar, by Tolkappiyar"],["<b>Thirukkural<\/b> / Kural","By <b>Thiruvalluvar<\/b> — \"the Tamil Veda\"; ethics in 1,330 couplets"],["Silappadikaram","Ilango Adigal — earliest Tamil epic"],["Manimekalai","Sattanar — Buddhist epic"],["Ettutogai / Pattuppattu","Eight anthologies &amp; ten idylls — the Sangam corpus"],["Famous ruler","<b>Karikala<\/b> (Chola) — won the battle of Venni; <b>Senguttuvan<\/b> (Chera); <b>Nedunjeliyan<\/b> (Pandya)"]]},{"k":"mapfig","title":"The three Sangam kingdoms","vb":"90 380 240 230","fill":{"KL":"#e0a040","TN":"#c0503a"},"pins":[["Vanji (Chera)",76.2,10.2,"port Muziris","l"],["Uraiyur (Chola)",78.68,10.83,"port Puhar",""],["Madurai (Pandya)",78.12,9.93,"port Korkai",""]],"cap":"Chera in the west (Kerala), Chola in the Kaveri delta, Pandya in the far south. The three Sangams of poets met at Madurai."},{"k":"trick","h":"<b>Sangam capitals<\/b> — <span class=\"mn\">Che-Va, Cho-U, Pan-Ma<\/span>: <b>Che<\/b>ra–<b>Va<\/b>nji, <b>Cho<\/b>la–<b>U<\/b>raiyur, <b>Pan<\/b>dya–<b>Ma<\/b>durai. Ports: <b>M<\/b>uziris–<b>M<\/b>asala/pepper (Chera), <b>P<\/b>uhar–cotton (Chola), <b>K<\/b>orkai–pearls (Pandya)."},{"k":"trap","h":"The <b>Saka era (78 CE)<\/b> was started by <b>Kanishka<\/b> and is India's <b>national calendar<\/b> (adopted 22 March 1957). The <b>Vikrama Samvat (58 BCE)<\/b> is linked to Vikramaditya of Ujjain, and the <b>Gupta era (319–20 CE)<\/b> to Chandragupta I. Don't confuse them."}],"sum":["Sunga: Pushyamitra, Sanchi/Bharhut railings. Satavahana: Gautamiputra Satakarni, Paithan, first lead coins, matrilineal names.","Kanishka: Purushapura capital, Saka era 78 CE (India's national calendar), 4th Buddhist Council, purest gold coins, patron of Ashvaghosha & Charaka.","Rudradaman I: Junagadh/Girnar inscription — first long Sanskrit inscription. Kharavela: Hathigumpha inscription.","Gandhara = Greek style, grey schist. Mathura = indigenous, red sandstone. Amaravati = white marble.","Sangam: Chera-Vanji, Chola-Uraiyur, Pandya-Madurai. Tolkappiyam = oldest Tamil text; Thirukkural by Thiruvalluvar."]},
{"id":"L7","g":"anc","heat":3,"title":"Gupta Empire — the golden age","hi":"गुप्त साम्राज्य","blocks":[{"k":"hot","h":"Asked almost every shift: Samudragupta's <b>Allahabad/Prayag Prashasti<\/b> (and who wrote it), Chandragupta II's titles and his court's \"nine gems\", Aryabhata–Varahamihira–Sushruta, and Fa-Hien's visit."},{"k":"story","h":"<p>Around 320 CE a family from Magadha rose to unite much of north India again. These were the <b>Guptas<\/b>. Chandragupta I began their era and took the title of great king of kings. His son <b>Samudragupta<\/b> won so many wars that a historian later called him the Indian Napoleon; his court poet Harisena listed his victories on a pillar at Allahabad. Then <b>Chandragupta II<\/b>, called Vikramaditya, defeated the Shakas and made the empire rich and secure. (Do not mix him up with Chandragupta Maurya, who lived about 600 years earlier.)<\/p><p>Peace and wealth gave people time for learning and art, which is why this is called a golden age. <b>Aryabhata<\/b> said the earth turns and explained eclipses. Sushruta wrote on surgery. <b>Kalidasa<\/b> wrote plays and poems like Abhijnanashakuntalam. Stone temples began to rise, and the Guptas issued more gold coins than any earlier rulers. Kumaragupta I founded Nalanda, a great university. The Chinese pilgrim Fa-Hien visited and wrote about the land.<\/p><p>Later the Hunas attacked. Skandagupta beat them back, but weaker rulers followed, and the empire broke up by about 550 CE. The tables give the kings in order and match each scholar to his work.<\/p>","key":"The Gupta kings united the north, and the peace that followed produced a golden age of science, poetry and art."},{"k":"tl","title":"The Gupta line","rows":[["240 CE","<b>Sri Gupta<\/b> founds the family; son Ghatotkacha"],["319–335 CE","<b>Chandragupta I<\/b> — first great ruler; title <b>Maharajadhiraja<\/b>; married Lichchhavi princess <b>Kumaradevi<\/b>; started the <b>Gupta era (319–20 CE)<\/b>"],["335–375 CE","<b>Samudragupta<\/b> — \"<b>Indian Napoleon<\/b>\" (named so by V. A. Smith); <b>Allahabad Pillar Prashasti<\/b> by his court poet <b>Harisena<\/b>; performed Ashvamedha; issued the <b>Lyrist (veena-playing) coin<\/b>"],["375–415 CE","<b>Chandragupta II \"Vikramaditya\"<\/b> — destroyed the Shakas, took title <b>Shakari<\/b>; first Gupta to issue <b>silver<\/b> coins; <b>Fa-Hien<\/b> visited; <b>Mehrauli iron pillar<\/b> linked to \"Chandra\"; <b>nine gems (Navaratna)<\/b> in court"],["415–455 CE","<b>Kumaragupta I \"Mahendraditya\"<\/b> — founded <b>Nalanda University<\/b>; worshipped Kartikeya"],["455–467 CE","<b>Skandagupta<\/b> — beat the <b>Hunas<\/b>; repaired Sudarshana lake (Junagadh inscription)"],["~550 CE","Empire breaks up; last notable ruler Vishnugupta"]]},{"k":"facts","title":"Science, art and letters","rows":[["<b>Aryabhata<\/b>","<i>Aryabhatiya<\/i>, <i>Surya Siddhanta<\/i> — said the earth is round and rotates; explained eclipses; value of π"],["<b>Varahamihira<\/b>","<i>Panchasiddhantika<\/i>, <i>Brihat Samhita<\/i>, <i>Brihat Jataka<\/i> — astronomy, astrology"],["<b>Brahmagupta<\/b>","<i>Brahmasphuta Siddhanta<\/i> — <b>zero as a number<\/b>, gravity hint (7th c., post-Gupta)"],["<b>Sushruta<\/b>","<i>Sushruta Samhita<\/i> — surgery; \"father of plastic surgery\""],["<b>Charaka<\/b>","<i>Charaka Samhita<\/i> — medicine (Kushana period)"],["<b>Kalidasa<\/b>","<i>Abhijnanashakuntalam<\/i>, <i>Meghaduta<\/i>, <i>Raghuvamsha<\/i>, <i>Kumarasambhava<\/i>, <i>Malavikagnimitram<\/i>, <i>Ritusamhara<\/i>"],["Nine gems (Navaratna)","Kalidasa, Amarasimha, Dhanvantari, Varahamihira, Vararuchi, Ghatakarpara, Kshapanaka, Shanku, Vetala Bhatta"],["<b>Fa-Hien<\/b>","Chinese pilgrim, came under Chandragupta II; book <i>Fo-Kuo-Ki<\/i>; stayed 6 years; said there was no capital punishment"],["Art","Ajanta murals, Dashavatara temple at <b>Deogarh<\/b>, Bhitargaon brick temple, Udayagiri caves; <b>Nagara temple style<\/b> begins"],["Coins","<b>Dinara<\/b> — gold coins; Guptas issued the <b>largest number of gold coins<\/b> in ancient India"],["Land grant terms","<i>Agrahara<\/i> (to Brahmins, tax-free), <i>Devagrahara<\/i> (to temples), <i>Nivi-dharma<\/i>"]]},{"k":"photos","title":"The Gupta age in pictures","items":[["Iron_pillar_of_Delhi","Iron pillar of Delhi","Rust-free iron"],["Dashavatara_Temple,_Deogarh","Dashavatara Temple","One of the first stone temples"],["Ajanta_Caves","Ajanta Caves","Paintings"],["Udayagiri_Caves","Udayagiri Caves","Varaha panel"],["Aryabhata","Aryabhata","Statue at IUCAA, Pune"],["Sanchi","Sanchi","Temple 17"]]},{"k":"trick","h":"<b>Gupta kings in order<\/b> — <span class=\"mn\">Sri-Gha-Cha-Sa-Cha-Ku-Ska<\/span>: Sri Gupta → Ghatotkacha → Chandragupta I → Samudragupta → Chandragupta II → Kumaragupta → Skandagupta.<br><b>Traveller ↔ king<\/b>: <b>Fa<\/b>-Hien → <b>Cha<\/b>ndragupta II (<i>Fa for Four-hundred CE<\/i>); <b>Hiuen Tsang<\/b> → <b>Harsha<\/b> (both H); <b>I-tsing<\/b> → late 7th c."},{"k":"trap","h":"<b>Chandragupta Maurya<\/b> (322 BCE, Mauryan) ≠ <b>Chandragupta I/II<\/b> (Gupta) — SSC mixes these constantly. The <b>Allahabad Prashasti<\/b> is Samudragupta's, written by <b>Harisena<\/b>, and it is engraved on an <b>Ashokan pillar<\/b>. Nalanda was founded by <b>Kumaragupta I<\/b>, not Harsha (Harsha only patronised it)."}],"sum":["Chandragupta I started the Gupta era (319–20 CE), title Maharajadhiraja. Samudragupta = Indian Napoleon; Allahabad Prashasti by Harisena; Lyrist coin.","Chandragupta II Vikramaditya: beat the Shakas (title Shakari), first silver coins, Fa-Hien visited, nine gems in court.","Kumaragupta I founded Nalanda. Skandagupta defeated the Hunas.","Aryabhata (earth rotates), Varahamihira, Sushruta (surgery), Brahmagupta (zero). Kalidasa wrote Abhijnanashakuntalam and Meghaduta.","Gupta gold coins = Dinara, the largest number of gold coins in ancient India; Nagara temple style begins."]},
{"id":"L8","g":"anc","heat":2,"title":"Harsha & the southern kingdoms","hi":"हर्षवर्धन · दक्षिण भारत","blocks":[{"k":"hot","h":"Harsha + Hiuen Tsang is a standard pair. In the south, learn the temple-building credit: Pallava = Mahabalipuram, Rashtrakuta = Ellora Kailasa, Chola = Brihadeshwara, Chandela = Khajuraho, Solanki = Dilwara."},{"k":"story","h":"<p>After the Guptas, <b>Harshavardhana<\/b> was the last great king to unite much of north India, ruling from Kannauj from 606 CE. We know him well thanks to two writers. His court poet <b>Banabhatta<\/b> wrote his life story, the Harshacharita. The Chinese pilgrim <b>Hiuen Tsang<\/b> stayed for years, studied at Nalanda and described Harsha's kingdom. But Harsha could not conquer the south: the Chalukya king Pulakeshin II stopped him on the Narmada river.<\/p><p>That defeat points to the bigger picture. Power was now spread among many regional kingdoms. They fought each other, but they also competed to build splendid temples. That is why this lesson is really a list of builders. The Pallavas carved the temples at Mahabalipuram. The Rashtrakutas cut the Kailasa temple at Ellora out of a single rock. The <b>Cholas<\/b> built the giant Brihadeshwara temple at Thanjavur and sent a navy across the sea; their villages even elected their own assemblies.<\/p><p>Further north, the Palas, Pratiharas and Rashtrakutas spent years fighting over Kannauj. The Chandelas built Khajuraho and the Eastern Gangas built Konark. The tables pair each dynasty with its capital, its great king and its famous temple.<\/p>","key":"Harsha was the last big northern king; after him regional dynasties competed, and each is remembered by the temple it built."},{"k":"facts","title":"Harshavardhana (606–647 CE)","rows":[["Dynasty &amp; capital","<b>Pushyabhuti / Vardhana<\/b> dynasty; capital shifted from Thanesar to <b>Kannauj<\/b>"],["Titles","<b>Siladitya<\/b>; last great ruler of ancient north India"],["Biographer","<b>Banabhatta<\/b> — <i>Harshacharita<\/i> and <i>Kadambari<\/i>"],["Chinese visitor","<b>Hiuen Tsang (Xuanzang)<\/b>, 629–645 CE; book <i>Si-Yu-Ki<\/i>; called \"Prince of Pilgrims\"; studied at Nalanda"],["His own plays","<i>Nagananda<\/i>, <i>Ratnavali<\/i>, <i>Priyadarshika<\/i>"],["Defeat","Beaten by <b>Pulakeshin II<\/b> (Chalukya) on the Narmada — recorded in the <b>Aihole inscription<\/b> (by Ravikirti)"],["Assemblies","Kannauj assembly (643 CE) and Prayag assembly (every 5 years, gave away all wealth)"]]},{"k":"table","title":"Southern & regional dynasties — who built what","head":["Dynasty","Capital","Greatest ruler","Famous for"],"rows":[["<b>Pallava<\/b>","Kanchipuram","<b>Narasimhavarman I \"Mamalla\"<\/b>","<b>Mahabalipuram<\/b> rathas &amp; Shore temple; Dravidian style begins; beat Pulakeshin II"],["<b>Chalukya of Badami<\/b>","Vatapi / Badami","<b>Pulakeshin II<\/b>","<b>Aihole<\/b>, Badami &amp; Pattadakal temples; Vesara style; defeated Harsha"],["<b>Rashtrakuta<\/b>","Manyakheta","<b>Amoghavarsha<\/b> (wrote <i>Kavirajamarga<\/i>), Krishna I","<b>Kailasa temple, Ellora<\/b> (Krishna I); Elephanta caves"],["<b>Chola<\/b>","Thanjavur / Gangaikondacholapuram","<b>Rajaraja I<\/b> &amp; <b>Rajendra I<\/b>","<b>Brihadeshwara temple<\/b> (Rajaraja I); navy took Sri Lanka &amp; SE Asia; <b>local self-government<\/b> (Ur, Sabha/Mahasabha, Nagaram); Uttaramerur inscription; bronze <b>Nataraja<\/b>"],["<b>Pala<\/b>","Munger/Pataliputra","Dharmapala, Devapala","Founded <b>Vikramashila<\/b> university; Buddhism's last royal patrons"],["<b>Pratihara<\/b>","Kannauj","Mihir Bhoja","Fought the \"tripartite struggle\" for Kannauj with Palas &amp; Rashtrakutas"],["<b>Chandela<\/b>","Khajuraho","Dhanga, Vidyadhara","<b>Khajuraho temples<\/b> (Kandariya Mahadeva)"],["<b>Solanki / Chalukya of Gujarat<\/b>","Anhilwara","Bhima I, Kumarapala","<b>Dilwara Jain temples<\/b>, Modhera Sun temple, Rani ki Vav"],["<b>Eastern Ganga<\/b>","Kalinga","Narasimhadeva I, Anantavarman","<b>Konark Sun temple<\/b> (Narasimhadeva I), Jagannath Puri temple"],["<b>Sena<\/b>","Bengal","Lakshmanasena","Jayadeva's <i>Gita Govinda<\/i>; ended by Bakhtiyar Khalji"]]},{"k":"mapfig","title":"Regional dynasties and their capitals","pins":[["1",79.7,12.83,"Pallava","n"],["2",75.68,15.92,"Chalukya of Badami","n"],["3",77.15,17.2,"Rashtrakuta","n"],["4",79.13,10.79,"Chola","n"],["5",86.47,25.38,"Pala","n"],["6",79.92,27.05,"Pratihara","n"],["7",79.92,24.85,"Chandela","n"],["8",72.12,23.85,"Solanki / Chalukya of Gujarat","n"],["9",85.83,19.81,"Eastern Ganga","n"],["10",88.13,24.87,"Sena","n"]],"facts":[["1 · Pallava","Kanchipuram — Mahabalipuram rathas & Shore temple"],["2 · Chalukya of Badami","Badami — Aihole, Badami & Pattadakal temples"],["3 · Rashtrakuta","Manyakheta — Kailasa temple, Ellora (Krishna I)"],["4 · Chola","Thanjavur — Brihadeshwara temple (Rajaraja I)"],["5 · Pala","Munger — Founded Vikramashila university"],["6 · Pratihara","Kannauj — Fought the \"tripartite struggle\" for Kannauj with Palas & Rashtrakutas"],["7 · Chandela","Khajuraho — Khajuraho temples (Kandariya Mahadeva)"],["8 · Solanki / Chalukya of Gujarat","Anhilwara — Dilwara Jain temples, Modhera Sun temple, Rani ki Vav"],["9 · Eastern Ganga","Puri–Konark — Konark Sun temple (Narasimhadeva I), Jagannath Puri temple"],["10 · Sena","Gauda — Jayadeva's Gita Govinda"]],"cap":"Numbers match the list. Places are approximate. Use ＋ or ⛶ to zoom in."},{"k":"photos","title":"What they built","items":[["Shore_Temple","Shore Temple","Pallava · Mahabalipuram"],["Kailasa_temple,_Ellora","Kailasa temple","Rashtrakuta"],["Brihadisvara_Temple,_Thanjavur","Brihadisvara Temple","Chola"],["Kandariya_Mahadeva_Temple","Kandariya Mahadeva Temple","Chandela · Khajuraho"],["Konark_Sun_Temple","Konark Sun Temple","Eastern Ganga"],["Rani_ki_vav","Rani ki vav","Solanki"],["Pattadakal","Pattadakal","Chalukya"],["Modhera_Sun_Temple","Modhera Sun Temple","Solanki"]]},{"k":"trick","h":"<b>Temple ↔ dynasty<\/b> — <span class=\"mn\">Ma-Pa, Ka-Ra, Bri-Cho, Kha-Cha, Di-So, Ko-Ga<\/span>: <b>Ma<\/b>habalipuram–<b>Pa<\/b>llava, <b>Ka<\/b>ilasa–<b>Ra<\/b>shtrakuta, <b>Bri<\/b>hadeshwara–<b>Cho<\/b>la, <b>Kha<\/b>juraho–<b>Cha<\/b>ndela, <b>Di<\/b>lwara–<b>So<\/b>lanki, <b>Ko<\/b>nark–Eastern <b>Ga<\/b>nga."},{"k":"facts","title":"Ancient universities","rows":[["Nalanda","Bihar; founded by <b>Kumaragupta I<\/b>; destroyed by Bakhtiyar Khalji (1193); UNESCO site"],["Vikramashila","Bihar; founded by <b>Dharmapala<\/b> (Pala)"],["Takshashila","Now in Pakistan; oldest; Chanakya and Charaka linked to it"],["Valabhi","Gujarat; Maitraka patronage; I-tsing studied here"],["Odantapuri","Bihar; Pala period; oldest Mahavihara of Bihar"]]},{"k":"mapfig","title":"The ancient universities","pins":[["Nalanda",85.44,25.14,"Kumaragupta I",""],["Vikramashila",87.28,25.32,"Dharmapala",""],["Takshashila",72.84,33.75,"the oldest","l"],["Valabhi",71.88,21.89,"Maitrakas","l"],["Odantapuri",85.52,25.2,"Pala","l"]],"cap":"Nalanda and Vikramashila were burnt by Bakhtiyar Khalji. Takshashila is now in Pakistan."},{"k":"photos","title":"Nalanda in pictures","items":[["Nalanda_mahavihara","Nalanda","Bihar · UNESCO"],["Vikramashila","Vikramashila","Bihar"]]},{"k":"trap","h":"<b>Chola local self-government<\/b> is the standard answer for \"village administration\" in ancient India — the Uttaramerur inscription records how village assemblies were elected. Note that the <b>Kailasa temple at Ellora is rock-cut<\/b> (carved top-down from one rock) while Brihadeshwara is built up from blocks."}],"sum":["Harsha: Vardhana dynasty, capital Kannauj; Banabhatta wrote Harshacharita; Hiuen Tsang visited (Si-Yu-Ki); beaten by Pulakeshin II (Aihole inscription).","Mahabalipuram = Pallava; Kailasa Ellora = Rashtrakuta (Krishna I); Brihadeshwara = Chola (Rajaraja I); Khajuraho = Chandela; Dilwara = Solanki; Konark = Eastern Ganga.","Cholas: strong navy, bronze Nataraja, famous village self-government (Uttaramerur inscription).","Nalanda — Kumaragupta I; Vikramashila — Dharmapala; Takshashila the oldest.","Tripartite struggle for Kannauj: Palas vs Pratiharas vs Rashtrakutas."]}
];

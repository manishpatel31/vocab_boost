<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">

<title>Trigonometry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: Physics PYQ Workbook — follows the शब्दRegister Paper / Indigo look; one column + bottom tabs on phones, sidebar on PC. */
:root{
  --paper:#f6f3ea; --sheet:#fffdf7; --sunk:#ebe6d8;
  --ink:#1d2a22; --ink2:#56625a; --rule:#dcd5c3;
  --blue:#1f5c3d; --on-blue:#ffffff; --blue-bg:#dcebdf;
  --accent:#b4530f; --accent-bg:#fbe7d3;
  --good:#1b7547; --good-bg:#dff1e6; --bad:#b0271f; --bad-bg:#f8e1de;
  --warn-bg:#fff2d2;
  --f-display:"Fraunces", "Tiro Devanagari Hindi", Georgia, serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap{border-radius:var(--r);padding:12px 14px 12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.trick .lab,.trap .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.rk div{grid-template-columns:minmax(0,48%) minmax(0,1fr)}
.rk dd{min-width:0;overflow-wrap:anywhere}
.hot{border-radius:var(--r);padding:12px 14px;background:var(--warn-bg,var(--accent-bg));border-left:4px solid var(--warn,var(--accent))}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--warn,var(--accent))}
.heatb{display:inline-block;font-size:11px;letter-spacing:-.1em;margin-left:6px;vertical-align:1px}
.heat{display:flex;flex-direction:column;gap:2px}
.hrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(60px,1fr) 44px;gap:10px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:9px 2px;color:inherit;font:inherit;cursor:pointer}
.hrow:last-child{border-bottom:0}
.hrow .ht{display:flex;flex-direction:column;min-width:0}
.hrow .ht .muted{font-size:12px}
.hbar{height:10px;border-radius:5px;background:var(--rule);overflow:hidden}
.hbar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hp{text-align:right;font-weight:700}

.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.pyr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pyr div{text-align:center;font-size:13px}
.pyr b{display:block;font-size:14px}
.pm{fill:var(--blue)} .pf{fill:var(--accent)}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.pal button.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.pal button.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.rk{display:grid;gap:0}
.rk div{display:grid;grid-template-columns:minmax(0,48%) 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:15px}
.rk div:first-child{border-top:0}
.rk dt{font-size:13px;color:var(--ink2);margin:0}
.rk dt.up{color:var(--good)} .rk dt.dn{color:var(--bad)}
.rk dd{margin:0;font-weight:600;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:24px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.gbar{display:grid;grid-template-columns:78px 1fr 52px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.gbar .tr{height:12px;background:var(--sunk);border-radius:3px;position:relative;overflow:hidden}
.gbar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:3px}
.gbar .tr i.neg{background:var(--bad)}
.gbar .v{font-family:var(--f-num);text-align:right}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
@media (prefers-reduced-motion: no-preference){ .opt,.chip,.btn{transition:background-color .15s, border-color .15s} }
.link{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px}
.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.icheck{background:var(--sheet);border:1.5px dashed var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.icheck .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.cat{font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;white-space:nowrap}
.cat.CS{background:var(--blue-bg);color:var(--blue)} .cat.CSS{background:var(--accent-bg);color:var(--accent)} .cat.ST{background:var(--sunk);color:var(--ink)} .cat.OT{background:var(--sunk);color:var(--ink2)}

/* ---- workbook additions ---- */
table.cover td:nth-child(4){min-width:180px}
.plist .dl{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.plist .dl em{font-style:normal;font-weight:700;color:var(--blue);text-align:right}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--rule)}
.ladder li{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--rule)}
.ladder .rk-n{font-size:22px;font-weight:600;color:var(--blue);text-align:right}
.ladder .rk-t{min-width:0}
.ladder .rk-t b{display:block;line-height:1.3}
.ladder .rk-t span{font-size:13px;color:var(--ink2)}
.ladder .rk-d{font-weight:700;font-size:14px;white-space:nowrap}
.ladder li.up .rk-d{color:var(--good)} .ladder li.dn .rk-d{color:var(--bad)}
.ladder small{font-weight:600;color:var(--ink2)}
table.cover td{min-width:90px}
.peek{border:1.5px dashed var(--blue);background:var(--blue-bg);color:var(--blue);border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer;min-height:36px;width:100%}
.pubs{display:grid;gap:12px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.plist li{padding:7px 0;border-top:1px dashed var(--rule);display:grid;gap:1px}
.plist li:first-child{border-top:0}
.plist li span{font-size:13px;color:var(--ink2)}
.seg{scroll-snap-type:x proximity}
@media (max-width: 700px){
  table.cover thead{display:none}
  table.cover tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--rule)}
  table.cover td{border:0;padding:0;min-width:0;font-size:14px}
  table.cover td:first-child{grid-column:1/-1;font-size:15px}
  table.cover td:nth-child(4){grid-column:1/-1;min-width:0}
  table.cover td[data-l]::before{content:attr(data-l);display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
}
/* ---- maths blocks ---- */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:10px}
.fcard{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:var(--r);padding:10px 12px;display:grid;gap:4px;min-width:0}
.fcard .fn{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.fcard .fx{font-family:var(--f-num);font-size:16px;color:var(--ink);overflow-wrap:anywhere;line-height:1.45}
.fcard .fnote{font-size:13px;color:var(--ink2)}
.ex{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.ex .exhead .lab{display:inline;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:700}
.ex .src{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:700;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:0 8px}
.ex .exq{font-weight:600}
.ex details summary{cursor:pointer;font-weight:700;color:var(--blue);list-style:none}
.ex details summary::-webkit-details-marker{display:none}
.ex details summary::before{content:'▸ '}
.ex details[open] summary::before{content:'▾ '}
.ex ol{margin:8px 0 0;padding-left:20px;display:grid;gap:4px}
.ex .exans{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--good-bg);color:var(--good);font-weight:700}
.figwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:12px}
.figwrap figure{margin:0;display:grid;gap:6px;justify-items:center;text-align:center}
.fig svg,.figwrap svg{width:100%;max-width:340px;height:auto;color:var(--ink)}
.fig figcaption,.figwrap figcaption{font-size:13px;color:var(--ink2)}
sup,sub{font-size:.72em;line-height:0}

{ id:"L1", heat:3, title:"Basics: the six ratios", hi:"मूल त्रिकोणमितीय अनुपात", blocks:[
 {k:"hot", h:"<b>Almost every CGL Tier 1 shift has 1–2 trigonometry questions, and the easiest one is usually this type:</b> one ratio is given (e.g. 7 cot P = 24) and you must find another ratio or an expression. Tier 2 asks the same idea with bigger expressions. Expect 30–60 seconds per question once the triangle is drawn."},

 {k:"fig", title:"Naming the sides for angle θ", svg:'<svg viewBox="0 0 280 190" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M40 160 H240 L40 40 Z"/><path d="M40 148 H52 V160"/><path d="M210 160 A30 30 0 0 1 214.3 144.6" style="stroke:var(--accent)"/><text x="194" y="155" fill="currentColor" stroke="none" style="fill:var(--accent)">θ</text><text x="28" y="38" fill="currentColor" stroke="none">A</text><text x="26" y="174" fill="currentColor" stroke="none">B</text><text x="244" y="174" fill="currentColor" stroke="none">C</text><text x="24" y="104" fill="currentColor" stroke="none" font-weight="700">P</text><text x="136" y="176" fill="currentColor" stroke="none" font-weight="700">B</text><text x="146" y="92" fill="currentColor" stroke="none" font-weight="700">H</text><text x="160" y="30" fill="currentColor" stroke="none">sin θ = P/H</text><text x="160" y="46" fill="currentColor" stroke="none">cos θ = B/H</text><text x="160" y="62" fill="currentColor" stroke="none">tan θ = P/B</text></svg>', cap:"For θ at C: P = AB (opposite), B = BC (adjacent), H = AC (hypotenuse). If the angle moves to A, P and B swap."},
 {k:"formula", title:"The six ratios", rows:[["sin θ","P / H","opposite ÷ hypotenuse"],["cos θ","B / H","adjacent ÷ hypotenuse"],["tan θ","P / B","opposite ÷ adjacent"],["cosec θ","H / P = 1/sin θ","reciprocal of sin"],["sec θ","H / B = 1/cos θ","reciprocal of cos"],["cot θ","B / P = 1/tan θ","reciprocal of tan"]]},
 {k:"formula", title:"Reciprocal & quotient relations", rows:[["Reciprocal pairs","sin θ·cosec θ = 1, cos θ·sec θ = 1, tan θ·cot θ = 1","each pair multiplies to 1"],["Quotient","tan θ = sin θ / cos θ","(P/H) ÷ (B/H) = P/B"],["Quotient","cot θ = cos θ / sin θ","reciprocal of the above"],["Range (acute θ)","0 < sin θ, cos θ < 1;  sec θ, cosec θ > 1","H is the longest side"],["tan, cot","any positive value","P and B can be in any ratio"]]},
 {k:"table", title:"Pythagorean triplets that SSC loves", head:["Triplet (P, B, H)","Typical given","Then"], rows:[["3, 4, 5","tan θ = 3/4","sin = 3/5, cos = 4/5"],["5, 12, 13","cos θ = 5/13 or sec θ = 13/5","sin = 12/13, tan = 12/5"],["8, 15, 17","sin θ = 8/17","cos = 15/17, tan = 8/15"],["7, 24, 25","cot θ = 24/7","sin = 7/25, cos = 24/25"],["20, 21, 29","tan θ = 20/21","sin = 20/29"],["9, 40, 41","sin θ = 9/41","cos = 40/41"],["12, 35, 37","cos θ = 35/37","cot = 35/12"],["11, 60, 61","tan θ = 11/60","sin = 11/61"]]},
 {k:"figs", title:"Draw the triangle from one ratio", items:[

  {svg:'<svg viewBox="0 0 260 120" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M30 90 H234 L30 30.5 Z"/><path d="M30 80 H40 V90"/><path d="M204 90 A30 30 0 0 1 205.2 81.6" style="stroke:var(--accent)"/><text x="16" y="64" fill="currentColor" stroke="none" font-weight="700">7</text><text x="126" y="107" fill="currentColor" stroke="none" font-weight="700">24</text><text x="136" y="50" fill="currentColor" stroke="none" font-weight="700" style="fill:var(--blue)">25</text><text x="16" y="28" fill="currentColor" stroke="none">R</text><text x="16" y="104" fill="currentColor" stroke="none">Q</text><text x="238" y="104" fill="currentColor" stroke="none" style="fill:var(--accent)">P</text></svg>', cap:"7 cot P = 24 → cot P = B/P = 24/7 → H = 25, sin P = 7/25."}]},
 {k:"ex", src:"SSC CGL 2023 · 27 Jul S3", q:"If 7 cot P = 24, then find sin P.", steps:["cot P = 24/7 = Base/Perpendicular → B = 24, P = 7","H = √(24² + 7²) = √625 = 25 (7-24-25 triplet)","sin P = P/H = 7/25"], ans:"7/25", tip:"Spot the triplet 7-24-25 at once; no need to square."},
 {k:"ex", src:"SSC CGL Tier-I · 3 Mar 2020 S1", q:"If 6 tan A = 5, then (8 sin A − 4 cos A)/(cos A − 2 sin A) = ?", steps:["Every term has degree 1 in sin/cos, so divide top and bottom by cos A","= (8 tan A − 4)/(1 − 2 tan A), with tan A = 5/6","= (20/3 − 4)/(1 − 5/3) = (8/3)/(−2/3) = −4"], ans:"−4", tip:"Homogeneous expression → divide by cos and put tan. Never find sin and cos separately."},
 {k:"ex", src:"SSC Selection Post · 9 Nov 2020 S2", q:"If sec θ = 13/5, then (10 tan θ + 24 cosec θ)/(39 sin θ − 10 sec θ) = ?", steps:["sec θ = H/B = 13/5 → B = 5, H = 13, P = 12","tan θ = 12/5, cosec θ = 13/12, sin θ = 12/13","Numerator = 24 + 26 = 50; Denominator = 36 − 26 = 10","Answer = 50/10 = 5"], ans:"5"},
 {k:"trick", h:"<b>Memory hook:</b> “<b>S</b>ome <b>P</b>eople <b>H</b>ave, <b>C</b>urly <b>B</b>rown <b>H</b>air, <b>T</b>hrough <b>P</b>roper <b>B</b>rushing” → sin = P/H, cos = B/H, tan = P/B. The other three are just upside down.<br><b>Divide trick:</b> if every term of an expression has the same degree in sin and cos (like a sin θ + b cos θ over c sin θ + d cos θ), divide by cos θ (or cos²θ) and use tan θ directly."},
 {k:"trap", h:"<b>tan θ = 3/4 does not mean the sides are 3 and 4</b> — they are 3k and 4k. Ratios never change, so this does not matter for ratio answers, but it matters if a length is asked.<br><b>sin²θ means (sin θ)²</b>, not sin(θ²). And <b>sin θ cannot exceed 1</b> (P &lt; H); an option like sin θ = 5/4 is impossible."},

], sum:["sin = P/H, cos = B/H, tan = P/B; cosec, sec, cot are their reciprocals","Given one ratio → draw the triangle, use a triplet (3-4-5, 5-12-13, 8-15-17, 7-24-25) to get H","Same-degree expression in sin and cos → divide by cos θ and put tan θ","sin θ, cos θ ≤ 1 and sec θ, cosec θ ≥ 1 for every acute θ"]},
{ id:"L2", heat:3, title:"Standard angle values", hi:"मानक कोणों के मान", blocks:[
 {k:"hot", h:"<b>Asked in nearly every Tier 1 shift.</b> Either directly (“cosec 30° − cos 60° = ?”) or hidden inside a longer expression with squares of 30°, 45°, 60°. Tier 2 adds 15°, 75°, 18°, 36° and 22.5°. These are pure-memory marks — the table below must be automatic."},
 {k:"table", title:"The master table", head:["θ","0°","30°","45°","60°","90°"], rows:[["sin θ","0","1/2","1/√2","√3/2","1"],["cos θ","1","√3/2","1/√2","1/2","0"],["tan θ","0","1/√3","1","√3","not defined"],["cot θ","not defined","√3","1","1/√3","0"],["sec θ","1","2/√3","√2","2","not defined"],["cosec θ","not defined","2","√2","2/√3","1"]]},
 {k:"trick", h:"<b>Square-root method:</b> write 0, 1, 2, 3, 4 under 0°, 30°, 45°, 60°, 90°. Divide by 4 and take the square root: √(0/4), √(1/4), √(2/4), √(3/4), √(4/4) = 0, ½, 1/√2, √3/2, 1 → that is <b>sin</b>. Read the same row backwards → <b>cos</b>. tan = sin ÷ cos, and the last three rows are reciprocals."},
 {k:"figs", title:"Where the values come from", items:[
  {svg:'<svg viewBox="0 0 240 170" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M40 140 H199 L40 48 Z"/><path d="M40 128 H52 V140"/><path d="M175 140 A24 24 0 0 1 178.2 128" style="stroke:var(--accent)"/><path d="M40 68 A20 20 0 0 0 57.3 58" style="stroke:var(--blue)"/><text x="146" y="135" fill="currentColor" stroke="none" style="fill:var(--accent)">30°</text><text x="46" y="86" fill="currentColor" stroke="none" style="fill:var(--blue)">60°</text><text x="26" y="98" fill="currentColor" stroke="none" font-weight="700">1</text><text x="110" y="158" fill="currentColor" stroke="none" font-weight="700">√3</text><text x="124" y="84" fill="currentColor" stroke="none" font-weight="700">2</text><text x="28" y="44" fill="currentColor" stroke="none">A</text><text x="26" y="154" fill="currentColor" stroke="none">B</text><text x="203" y="154" fill="currentColor" stroke="none">C</text></svg>', cap:"Half of an equilateral triangle: sides 1 : √3 : 2. sin 30° = 1/2, tan 60° = √3/1."},
  {svg:'<svg viewBox="0 0 200 170" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M40 140 H160 L40 20 Z"/><path d="M40 128 H52 V140"/><path d="M136 140 A24 24 0 0 1 143 123" style="stroke:var(--accent)"/><text x="108" y="135" fill="currentColor" stroke="none" style="fill:var(--accent)">45°</text><text x="26" y="84" fill="currentColor" stroke="none" font-weight="700">1</text><text x="96" y="158" fill="currentColor" stroke="none" font-weight="700">1</text><text x="106" y="70" fill="currentColor" stroke="none" font-weight="700">√2</text><text x="28" y="18" fill="currentColor" stroke="none">A</text><text x="26" y="154" fill="currentColor" stroke="none">B</text><text x="164" y="154" fill="currentColor" stroke="none">C</text></svg>', cap:"Half of a square: sides 1 : 1 : √2. sin 45° = cos 45° = 1/√2, tan 45° = 1."}]},
 {k:"table", title:"Tier 2 special angles", head:["Angle","sin","cos","tan"], rows:[["15°","(√3 − 1)/(2√2)","(√3 + 1)/(2√2)","2 − √3"],["75°","(√3 + 1)/(2√2)","(√3 − 1)/(2√2)","2 + √3"],["18°","(√5 − 1)/4","√(10 + 2√5)/4","—"],["36°","√(10 − 2√5)/4","(√5 + 1)/4","—"],["22.5°","√(2 − √2)/2","√(2 + √2)/2","√2 − 1"],["67.5°","√(2 + √2)/2","√(2 − √2)/2","√2 + 1"]]},
 {k:"formula", title:"Handy results built from the table", rows:[["15° and 75°","tan 15° + tan 75° = 4;  tan 15°·tan 75° = 1","(2 − √3) + (2 + √3)"],["sin 15°·cos 15°","= ¼","= ½ sin 30°"],["18° and 36°","sin 18° = (√5 − 1)/4,  cos 36° = (√5 + 1)/4","cos 36° − sin 18° = ½,  sin 18°·cos 36° = ¼"],["22.5°","tan 22.5° = √2 − 1,  cot 22.5° = √2 + 1","from tan 45° = 2t/(1 − t²)"],["sin 54°","= cos 36° = (√5 + 1)/4","complementary angles (L4)"]]},
 {k:"ex", src:"SSC CGL 2023 · 25 Jul S3", q:"What is the value of 5√3 cos 60° tan 30° − 3 cos 0° + 3 cos²45° + 2 sin²60°?", steps:["5√3 × ½ × 1/√3 = 5/2","− 3 × 1 = −3","3 × (1/√2)² = 3/2;  2 × (√3/2)² = 3/2","5/2 − 3 + 3/2 + 3/2 = 2.5"], ans:"2.5", tip:"Square first, then multiply: cos²45° = ½, sin²60° = ¾, tan²30° = ⅓, sec²60° = 4."},
 {k:"ex", src:"SSC CPO 2019 · 13 Mar S1", q:"The value of sin²30°·cos²45° + 2 tan²30° − sec²60° is:", steps:["sin²30° = ¼, cos²45° = ½ → ⅛","2 tan²30° = 2 × ⅓ = ⅔","sec²60° = 4","⅛ + ⅔ − 4 = (3 + 16 − 96)/24 = −77/24"], ans:"−77/24"},

{ id:"L3", heat:3, title:"Fundamental identities", hi:"मूल सर्वसमिकाएँ", blocks:[
 {k:"hot", h:"<b>The single most-asked trigonometry type in CGL.</b> Tier 1: “If sec A + tan A = 3, find cos A” or “simplify (sin⁴θ + cos⁴θ)/(1 − 2 sin²θ cos²θ)”. Tier 2: the same with a variable (sec θ + tan θ = p) or higher powers (sin⁶ + cos⁶). Every one of them is one of the three identities below in disguise."},
 {k:"formula", title:"The three Pythagorean identities", rows:[["Identity 1","sin²θ + cos²θ = 1","sin²θ = 1 − cos²θ = (1 − cos θ)(1 + cos θ)"],["Identity 2","sec²θ − tan²θ = 1","(sec θ − tan θ)(sec θ + tan θ) = 1"],["Identity 3","cosec²θ − cot²θ = 1","(cosec θ − cot θ)(cosec θ + cot θ) = 1"],["Why","divide P² + B² = H² by H², B² or P²","one triangle gives all three"]]},
 {k:"figs", title:"Each identity is Pythagoras on a scaled triangle", items:[
  {svg:'<svg viewBox="0 0 230 165" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M40 140 H200 L40 40 Z"/><path d="M40 128 H52 V140"/><path d="M174 140 A26 26 0 0 1 178 126.2" style="stroke:var(--accent)"/><text x="158" y="135" fill="currentColor" stroke="none" style="fill:var(--accent)">θ</text><text x="34" y="94" text-anchor="end" fill="currentColor" stroke="none" font-weight="700">sin θ</text><text x="120" y="158" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">cos θ</text><text x="104" y="64" fill="currentColor" stroke="none" font-weight="700" style="fill:var(--blue)">1</text></svg>', cap:"Hypotenuse 1 → sides sin θ and cos θ → sin²θ + cos²θ = 1."},
  {svg:'<svg viewBox="0 0 230 165" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M40 140 H200 L40 40 Z"/><path d="M40 128 H52 V140"/><path d="M174 140 A26 26 0 0 1 178 126.2" style="stroke:var(--accent)"/><text x="158" y="135" fill="currentColor" stroke="none" style="fill:var(--accent)">θ</text><text x="34" y="94" text-anchor="end" fill="currentColor" stroke="none" font-weight="700">tan θ</text><text x="120" y="158" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">1</text><text x="104" y="64" fill="currentColor" stroke="none" font-weight="700" style="fill:var(--blue)">sec θ</text></svg>', cap:"Base 1 → sides tan θ and sec θ → 1 + tan²θ = sec²θ."}]},
 {k:"formula", title:"Pair results (the CGL favourites)", rows:[["sec θ + tan θ = x","sec θ − tan θ = 1/x","sec θ = (x² + 1)/(2x),  tan θ = (x² − 1)/(2x),  sin θ = (x² − 1)/(x² + 1)"],["cosec θ + cot θ = y","cosec θ − cot θ = 1/y","cosec θ = (y² + 1)/(2y),  cot θ = (y² − 1)/(2y),  cos θ = (y² − 1)/(y² + 1)"],["sin θ + cos θ = x","sin θ·cos θ = (x² − 1)/2","because (sin θ + cos θ)² = 1 + 2 sin θ cos θ"],["sin θ − cos θ = x","sin θ·cos θ = (1 − x²)/2","(sin θ + cos θ)² + (sin θ − cos θ)² = 2"],["tan θ + cot θ = x","= 1/(sin θ cos θ) = sec θ·cosec θ","tan²θ + cot²θ = x² − 2"]]},
 {k:"formula", title:"Higher powers & standard simplifications", rows:[["sin⁴θ + cos⁴θ","= 1 − 2 sin²θ cos²θ","(a² + b²) = (a + b)² − 2ab with a + b = 1"],["sin⁶θ + cos⁶θ","= 1 − 3 sin²θ cos²θ","(a³ + b³) = (a + b)³ − 3ab(a + b)"],["sin⁴θ − cos⁴θ","= sin²θ − cos²θ","(a² − b²) = (a − b)(a + b), a + b = 1"],["tan²θ − sin²θ","= tan²θ·sin²θ","same for cot²θ − cos²θ = cot²θ·cos²θ"],["(1 + sin θ)/(1 − sin θ)","= (sec θ + tan θ)²","multiply top and bottom by (1 + sin θ)"],["cos θ/(1 − sin θ) + cos θ/(1 + sin θ)","= 2 sec θ","common denominator 1 − sin²θ = cos²θ"]]},
 {k:"ex", src:"SSC CGL 2023 · 21 Jul S1", q:"If sec A + tan A = 3, then cos A is equal to:", steps:["(sec A + tan A)(sec A − tan A) = 1 → sec A − tan A = 1/3","Add: 2 sec A = 3 + 1/3 = 10/3 → sec A = 5/3","cos A = 3/5"], ans:"3/5", tip:"Direct formula: sec A = (x² + 1)/(2x) = 10/6 = 5/3."},
 {k:"ex", src:"SSC CGL 2023 · 24 Jul S4", q:"Simplify (1 + sin⁴θ + cos⁴θ)/(cos²θ + sin⁴θ).", steps:["Numerator: 1 + (1 − 2 sin²θ cos²θ) = 2(1 − sin²θ cos²θ)","Denominator: cos²θ + sin²θ(1 − cos²θ) = cos²θ + sin²θ − sin²θ cos²θ = 1 − sin²θ cos²θ","Ratio = 2"], ans:"2", tip:"Answer is a constant → just put θ = 90°: (1 + 1 + 0)/(0 + 1) = 2."},
 {k:"ex", src:"SSC CGL Tier 2 · 13 Sep 2019", q:"If sec θ + tan θ = p (p > 1), then (cosec θ + 1)/(cosec θ − 1) = ?", steps:["Divide top and bottom by cosec θ: (1 + sin θ)/(1 − sin θ)","Multiply by (1 + sin θ)/(1 + sin θ): (1 + sin θ)²/cos²θ","= ((1 + sin θ)/cos θ)² = (sec θ + tan θ)² = p²"], ans:"p²"},
 {k:"trick", h:"<b>If the answer is a number (no θ in the options), put a convenient angle.</b> θ = 90° or 0° kills half the terms; θ = 45° makes sin = cos. Check with a second angle if two options survive.<br><b>sec + tan = x → sec − tan = 1/x</b>: “sum × difference = 1” is the fastest step in the whole chapter."},
 {k:"trap", h:"sec θ + tan θ = x gives sec θ − tan θ = <b>1/x</b>, not −x or x − 1.<br>sin θ + cos θ = x gives sin θ cos θ = <b>(x² − 1)/2</b> — students forget the ÷2.<br>sin²θ + cos²θ = 1 needs the <b>same angle</b>: sin²30° + cos²60° = ½, not 1."},
 {k:"link", h:"Identity 2 and 3 return in L6 (minimum of a tan²θ + b cot²θ) and in L4 when complementary angles turn sec into cosec. sin θ + cos θ = x ties to L8: (sin θ + cos θ)² = 1 + sin 2θ."},
 {k:"q", q:"If cosec θ − cot θ = 1/3, then cosec θ + cot θ = ?", o:["3","1/3","−3","9"], e:"Product of the pair is 1 → 1 ÷ (1/3) = 3."}
], sum:["sin² + cos² = 1, sec² − tan² = 1, cosec² − cot² = 1 (all from Pythagoras)","sec θ + tan θ = x ⇒ sec θ − tan θ = 1/x; same for cosec θ + cot θ","sin θ + cos θ = x ⇒ sin θ cos θ = (x² − 1)/2","sin⁴ + cos⁴ = 1 − 2s²c², sin⁶ + cos⁶ = 1 − 3s²c², sin⁴ − cos⁴ = sin² − cos²","Constant answer → put θ = 0°, 45° or 90°"]},
{ id:"L4", heat:2, title:"Complementary angles & products", hi:"पूरक कोण और गुणनफल", blocks:[
 {k:"hot", h:"<b>About one question every 2–3 Tier 1 shifts, and a regular in Tier 2.</b> Typical forms: “cot 13° cot 27° cot 60° cot 63° cot 77° = ?”, “if sin 3A = cos(30° − A) find A”, or a long fraction where every angle pairs up to 90°. If the angles look ugly (38°, 52°, 67°), the question is from this lesson."},
 {k:"fig", title:"Why sin of one acute angle = cos of the other", svg:'<svg viewBox="0 0 290 190" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M40 160 H240 L40 40 Z"/><path d="M40 148 H52 V160"/><path d="M210 160 A30 30 0 0 1 214.3 144.6" style="stroke:var(--accent)"/><text x="196" y="155" fill="currentColor" stroke="none" style="fill:var(--accent)">θ</text><path d="M40 64 A24 24 0 0 0 60.6 52.3" style="stroke:var(--blue)"/><text x="46" y="84" fill="currentColor" stroke="none" style="fill:var(--blue)">90° − θ</text><text x="28" y="38" fill="currentColor" stroke="none">A</text><text x="26" y="174" fill="currentColor" stroke="none">B</text><text x="244" y="174" fill="currentColor" stroke="none">C</text><text x="18" y="108" fill="currentColor" stroke="none" font-weight="700">a</text><text x="136" y="176" fill="currentColor" stroke="none" font-weight="700">b</text><text x="146" y="92" fill="currentColor" stroke="none" font-weight="700">c</text><text x="112" y="24" fill="currentColor" stroke="none">sin θ = a/c = cos(90° − θ)</text><text x="112" y="40" fill="currentColor" stroke="none">tan θ = a/b = cot(90° − θ)</text></svg>', cap:"The two acute angles of a right triangle add to 90°. The side opposite θ is adjacent to (90° − θ), so the ratios swap."},
 {k:"formula", title:"Complement rule: change the angle, add/remove “co”", rows:[["sin ↔ cos","sin(90° − θ) = cos θ,  cos(90° − θ) = sin θ","e.g. sin 27° = cos 63°"],["tan ↔ cot","tan(90° − θ) = cot θ,  cot(90° − θ) = tan θ","e.g. tan 23° = cot 67°"],["sec ↔ cosec","sec(90° − θ) = cosec θ,  cosec(90° − θ) = sec θ","e.g. sec 52° = cosec 38°"]]},
 {k:"formula", title:"If A + B = 90° (both acute)", rows:[["Equal ratios","sin A = cos B,  tan A = cot B,  sec A = cosec B","and the reverse: sin A = cos B ⇒ A + B = 90°"],["Products = 1","tan A·tan B = 1,  sin A·sec B = 1,  cos A·cosec B = 1","cot A·cot B = 1"],["Squares","sin²A + sin²B = 1,  cos²A + cos²B = 1","sec²A − cot²B = 1"],["Equation type","sin xA = cos yA ⇒ xA + yA = 90°","also tan 2A = cot(A − 18°) ⇒ 3A − 18° = 90°"]]},
 {k:"formula", title:"Long products and sums", rows:[["tan 1°·tan 2°·…·tan 89°","= 1","pairs (1°, 89°)… multiply to 1, middle tan 45° = 1"],["cos 1°·cos 2°·…·cos 100°","= 0","contains cos 90° = 0"],["sin²1° + sin²2° + … + sin²89°","= 44½ = 89/2","44 pairs (= 1 each) + sin²45° = ½"],["sin²5° + sin²10° + … + sin²85°","= 8½","8 pairs + sin²45°; add sin²90° = 1 if the series runs to 90°"],["Rule for n terms","sum of sin² over angles symmetric about 45° = n/2","n terms, each pair = 1"]]},
 {k:"ex", src:"SSC CHSL 2023 · 2 Aug S2", q:"The value of cot 13° cot 27° cot 60° cot 63° cot 77° is:", steps:["13° + 77° = 90° → cot 13°·cot 77° = cot 13°·tan 13° = 1","27° + 63° = 90° → cot 27°·cot 63° = 1","Left: cot 60° = 1/√3"], ans:"1/√3", tip:"Pair first, then the leftover standard angle is the answer."},
 {k:"ex", src:"SSC CGL Tier 2 · 15 Nov 2020", q:"If sin 3A = cos(30° − A), A acute, then 2 cosec A + tan²2A − cot²A = ?", steps:["sin 3A = cos(30° − A) ⇒ 3A + 30° − A = 90° ⇒ A = 30°","2 cosec 30° = 4, tan²60° = 3, cot²30° = 3","4 + 3 − 3 = 4"], ans:"4"},
 {k:"ex", src:"SSC CGL Tier 2 · 15 Nov 2020", q:"(2 sin²38° sec²52° + cos 64° sin 26° + sin²64°)/(tan²23° + cot²23° − sec²67° − cosec²67°) = ?", steps:["sec 52° = cosec 38° → 2 sin²38°·cosec²38° = 2","sin 26° = cos 64° → cos²64° + sin²64° = 1 → numerator = 3","sec 67° = cosec 23°, cosec 67° = sec 23° → (tan²23° − sec²23°) + (cot²23° − cosec²23°) = −1 − 1 = −2","3/(−2) = −3/2"], ans:"−3/2", tip:"Convert every angle above 45° into its complement below 45°; then identities finish it."},
 {k:"trick", h:"<b>Scan for pairs that add to 90°</b> before doing anything else (13 + 77, 27 + 63, 38 + 52, 23 + 67). Write the bigger angle as 90° − (smaller) and switch sin↔cos, tan↔cot, sec↔cosec.<br><b>Equation trick:</b> sin(…) = cos(…) or tan(…) = cot(…) with acute angles → the two angles add to 90°."},
 {k:"trap", h:"<b>sin²1° + … + sin²89° is 44½, not 45</b> — the middle term sin²45° is only ½. Count the terms: 89 terms = 44 pairs + 1.<br>A product that includes <b>cos 90°</b> (or tan 0°, sin 0°) is 0; one including <b>tan 90°</b> is undefined — read the range of angles carefully."},
 {k:"link", h:"This is the 90° case of allied angles (L7): sin(90° + θ) = cos θ too, but with sign rules. In triangles (L9), B + C = 90° when A = 90°, so the same rules apply."},
 {k:"q", q:"sin(90° − θ)·sec θ = ?", o:["1","cos²θ","tan θ","0"], e:"sin(90° − θ) = cos θ, and cos θ·sec θ = 1."}
], sum:["sin(90° − θ) = cos θ, tan(90° − θ) = cot θ, sec(90° − θ) = cosec θ (and vice versa)","A + B = 90° ⇒ tan A tan B = 1, sin²A + sin²B = 1, sin A sec B = 1","sin xA = cos yA (acute) ⇒ xA + yA = 90°","tan 1°…tan 89° = 1; sin²1° + … + sin²89° = 44½; product with cos 90° = 0"]},
{ id:"L5", heat:3, title:"Simplification & value putting", hi:"सरलीकरण और मान रखना", blocks:[
 {k:"hot", h:"<b>1 question in most Tier 1 shifts, 2–3 in Tier 2.</b> “1/(cosec θ − cot θ) − 1/sin θ is equal to?” or “(2 cos³θ − cos θ)/(sin θ − 2 sin³θ) = ?”. The options are ratios like tan θ, cot θ, sec θ — perfect for <b>value putting</b>, which solves most of them in under 30 seconds."},
 {k:"p", h:"An identity is true for <b>every</b> angle. So if the question says “A is equal to which option”, put any convenient angle into the question and into each option — only the correct option matches. Choose an angle where all terms are defined and the options give <b>different</b> numbers."},
 {k:"fig", title:"Which angle to put", svg:'<svg viewBox="0 0 320 200" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="10"><defs><marker id="trgAh" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L6 3 L0 6 z" stroke="none" style="fill:currentColor"/></marker></defs><rect x="96" y="6" width="128" height="30" rx="6" style="fill:var(--accent-bg)"/><text x="160" y="25" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">Look at the options</text><path d="M140 36 L60 78" marker-end="url(#trgAh)"/><path d="M160 36 V78" marker-end="url(#trgAh)"/><path d="M180 36 L260 78" marker-end="url(#trgAh)"/><rect x="4" y="80" width="100" height="46" rx="6"/><text x="54" y="99" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">Only numbers</text><text x="54" y="115" text-anchor="middle" fill="currentColor" stroke="none">put 0°, 45°, 90°</text><rect x="110" y="80" width="100" height="46" rx="6"/><text x="160" y="99" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">Ratios of θ</text><text x="160" y="115" text-anchor="middle" fill="currentColor" stroke="none">put 30° or 60°</text><rect x="216" y="80" width="100" height="46" rx="6"/><text x="266" y="99" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">Condition given</text><text x="266" y="115" text-anchor="middle" fill="currentColor" stroke="none">find θ first</text><path d="M54 126 L118 162" marker-end="url(#trgAh)"/><path d="M160 126 V162" marker-end="url(#trgAh)"/><path d="M266 126 L202 162" marker-end="url(#trgAh)"/><rect x="56" y="164" width="208" height="30" rx="6" style="stroke:var(--blue)"/><text x="160" y="183" text-anchor="middle" fill="currentColor" stroke="none">Two options tie? Try a 2nd angle</text></svg>', cap:"45° is the worst choice when options mix tan/cot or sin/cos — they become equal there."},
 {k:"formula", title:"Algebra moves that finish most simplifications", rows:[["Convert","write everything in sin and cos","tan = s/c, sec = 1/c, cosec = 1/s"],["Conjugate","(1 − sin θ)(1 + sin θ) = cos²θ","also (sec − tan)(sec + tan) = 1"],["Rationalise","1/(cosec θ − cot θ) = cosec θ + cot θ","multiply by the conjugate"],["Factor","2 cos³θ − cos θ = cos θ(2 cos²θ − 1)","and sin θ − 2 sin³θ = sin θ(1 − 2 sin²θ) = sin θ(2 cos²θ − 1)"],["a² − b²","sec⁴θ − tan⁴θ = sec²θ + tan²θ","because sec²θ − tan²θ = 1"],["Common results","(sec θ − cos θ)(cosec θ − sin θ)(tan θ + cot θ) = 1","√(sec²θ + cosec²θ) = tan θ + cot θ"]]},
 {k:"table", title:"Test values at 30° and 60° (to separate options)", head:["θ","sin","cos","tan","cot","sec","cosec"], rows:[["30°","1/2","√3/2","1/√3","√3","2/√3","2"],["60°","√3/2","1/2","√3","1/√3","2","2/√3"]]},
 {k:"ex", src:"SSC CGL 2024 · 23 Sep S2", q:"The value of 1/(cosec θ − cot θ) − 1/sin θ is equal to:", steps:["Algebra: 1/(cosec θ − cot θ) = cosec θ + cot θ (product of the pair = 1)","So the expression = cosec θ + cot θ − cosec θ = cot θ","Check by θ = 60°: 1/(2/√3 − 1/√3) − 2/√3 = √3 − 2/√3 = 1/√3 = cot 60° ✓"], ans:"cot θ", tip:"At θ = 60° the options tan, cosec, cot, sec are √3, 2/√3, 1/√3, 2 — all different, so one put is enough."},
 {k:"ex", src:"SSC CGL 2024 · 10 Sep S2", q:"If cot θ = 4/3, then evaluate: sec θ(1 + cot²θ)(cosec²θ − cot²θ)/cosec³θ.", steps:["1 + cot²θ = cosec²θ and cosec²θ − cot²θ = 1","Expression = sec θ·cosec²θ·1/cosec³θ = sec θ/cosec θ = tan θ","tan θ = 3/4"], ans:"3/4", tip:"Simplify first, substitute last."},
 {k:"ex", src:"SSC CGL 2024 · 13 Sep S2", q:"If tan x/sec x = 1/2 (x acute), then (sin x + cos x)² = ?", steps:["tan x/sec x = (sin x/cos x)·cos x = sin x = 1/2 → x = 30°","(1/2 + √3/2)² = (1 + √3)²/4 = (4 + 2√3)/4","= (2 + √3)/2"], ans:"(2 + √3)/2"},
 {k:"trick", h:"<b>Value putting checklist:</b> (1) Options are numbers → put θ = 0°, 45° or 90° (whichever keeps every term defined). (2) Options are tan/cot/sec… → put θ = 30° or 60°, never 45°. (3) A condition fixes θ (sin θ + cos θ = √2 ⇒ θ = 45°) → use that θ. (4) Two options still equal → test them at a second angle."},
 {k:"trap", h:"<b>When value putting fails:</b> at θ = 45°, tan θ = cot θ = 1 and sin θ = cos θ, so several options tie; at 0° or 90°, tan, sec, cot or cosec may be undefined; and when the question has a variable condition (sec θ + tan θ = p), you must use algebra. Also, a constant answer at one angle is not proof unless the options are constants."},
 {k:"link", h:"Value putting also kills Tier 2 questions from L8 (compound angles) and L9 (A + B + C = 180°: put A = B = C = 60°, or A = 90°, B = C = 45°)."},
 {k:"q", q:"(1 + tan²θ)/(1 + cot²θ) = ?", o:["tan²θ","cot²θ","1","sec²θ"], e:"sec²θ/cosec²θ = tan²θ. Note: θ = 45° gives 1 for three options — θ = 60° gives 4/(4/3) = 3 = tan²60° only."}
], sum:["Identity questions: put a convenient angle into the question and the options","Number options → θ = 0°, 45°, 90°; ratio options → θ = 30° or 60° (avoid 45°)","Algebra moves: convert to sin/cos, use conjugates, factor a² − b²","1/(cosec θ − cot θ) = cosec θ + cot θ; (1 − sin θ)(1 + sin θ) = cos²θ","Value putting fails with variable conditions or when options tie — then simplify"]},
{ id:"L6", heat:2, title:"Maximum & minimum values", hi:"अधिकतम और न्यूनतम मान", blocks:[
 {k:"hot", h:"<b>About one question every 2–3 Tier 1 shifts; more common in Tier 2.</b> Forms: “maximum value of 5 sin θ + 12 cos θ”, “minimum value of 9 tan²θ + 4 cot²θ”, “greatest value of sin¹²θ + cos²⁰θ”. Each is a one-line formula — the only danger is a trap where the formula’s value cannot actually be reached."},
 {k:"p", h:"sin θ and cos θ always stay between −1 and 1, so every expression built from them has a <b>range</b>. Three tools find it: (1) combine a sin θ + b cos θ into one sine of size √(a² + b²); (2) use sin²θ + cos²θ = 1 to turn a sin²θ + b cos²θ into a + (b − a)cos²θ; (3) use AM ≥ GM when a product of two terms is constant (tan θ·cot θ = 1)."},
 {k:"formula", title:"Range formulas", rows:[["a sin θ + b cos θ","from −√(a² + b²) to +√(a² + b²)","5 sin θ + 12 cos θ: −13 to 13"],["a sin θ ± b cos θ + c","from c − √(a² + b²) to c + √(a² + b²)","the constant just shifts the range"],["a sin²θ + b cos²θ","between a and b","= a + (b − a)cos²θ, and 0 ≤ cos²θ ≤ 1"],["a tan²θ + b cot²θ","minimum 2√(ab)","AM ≥ GM, product ab is constant; no maximum"],["a sec²θ + b cosec²θ","minimum (√a + √b)²","= (a + b) + a tan²θ + b cot²θ ≥ a + b + 2√(ab)"],["sin θ·cos θ","maximum ½, minimum −½","= ½ sin 2θ"],["sin θ + cos θ","maximum √2 (at 45°)","a = b = 1 → √(1 + 1)"],["sin⁴θ + cos⁴θ","from ½ to 1","= 1 − 2 sin²θ cos²θ = 1 − ½ sin²2θ"]]},
 {k:"figs", title:"Why √(a² + b²)", items:[
  {svg:'<svg viewBox="0 0 280 180" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M40 150 H220 V60 Z"/><path d="M208 150 V138 H220"/><path d="M70 150 A30 30 0 0 0 66.8 136.6" style="stroke:var(--accent)"/><text x="76" y="146" fill="currentColor" stroke="none" style="fill:var(--accent)">α</text><text x="130" y="168" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">a</text><text x="228" y="110" fill="currentColor" stroke="none" font-weight="700">b</text><text x="96" y="92" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700" style="fill:var(--blue)">R = √(a² + b²)</text><text x="140" y="26" text-anchor="middle" fill="currentColor" stroke="none">cos α = a/R, sin α = b/R</text><text x="140" y="44" text-anchor="middle" fill="currentColor" stroke="none">a sin θ + b cos θ = R sin(θ + α)</text></svg>', cap:"Take out R = √(a² + b²): the bracket becomes sin θ cos α + cos θ sin α = sin(θ + α), which lies between −1 and 1."},
  {svg:'<svg viewBox="0 0 280 180" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M40 40 H240 M40 140 H240" stroke-dasharray="4 3" style="stroke:var(--blue)"/><path d="M40 90 H240" stroke-width="1"/><path d="M40 90 Q65 -10 90 90 T140 90 T190 90 T240 90" style="stroke:var(--accent)"/><text x="244" y="44" fill="currentColor" stroke="none">+R</text><text x="244" y="144" fill="currentColor" stroke="none">−R</text><text x="244" y="94" fill="currentColor" stroke="none">0</text><text x="140" y="170" text-anchor="middle" fill="currentColor" stroke="none">θ →</text><text x="140" y="24" text-anchor="middle" fill="currentColor" stroke="none">R sin(θ + α) swings between ±R</text></svg>', cap:"The combined wave never goes above +R or below −R, so max = √(a² + b²), min = −√(a² + b²)."}]},
 {k:"ex", src:"SSC CGL 2023 · 20 Jul S3", q:"The maximum value of (sin¹²θ + cos²⁰θ) for all real values of θ is:", steps:["0 ≤ sin²θ ≤ 1, so higher powers are never larger: sin¹²θ ≤ sin²θ and cos²⁰θ ≤ cos²θ","So sin¹²θ + cos²⁰θ ≤ sin²θ + cos²θ = 1","At θ = 0°: 0 + 1 = 1 → the bound is reached"], ans:"1", tip:"Put θ = 0° and θ = 90° — both give 1; any angle in between gives less."},
 {k:"ex", q:"Find the maximum value of 3 sin θ + 4 cos θ + 7.", steps:["√(3² + 4²) = 5","3 sin θ + 4 cos θ lies between −5 and 5","Maximum = 7 + 5 = 12 (minimum 7 − 5 = 2)"], ans:"12", tip:"Constant stays; add/subtract √(a² + b²)."},
 {k:"ex", q:"Find the minimum value of 9 tan²θ + 4 cot²θ.", steps:["AM ≥ GM: 9 tan²θ + 4 cot²θ ≥ 2√(9 tan²θ·4 cot²θ)","tan²θ·cot²θ = 1 → 2√36 = 12","Reached when 9 tan²θ = 4 cot²θ, i.e. tan²θ = 2/3 — possible"], ans:"12", tip:"2√(ab) — multiply the coefficients, root, double."},
 {k:"trick", h:"<b>Three one-liners:</b> a sin + b cos → <b>±√(a² + b²)</b>; a sin² + b cos² → <b>between a and b</b>; a tan² + b cot² → <b>≥ 2√(ab)</b>.<br>Triplets save time: (3, 4) → 5, (5, 12) → 13, (8, 15) → 17, (7, 24) → 25."},
 {k:"trap", h:"<b>AM ≥ GM needs the equality case to be possible.</b> 2 cos²θ + 8 sec²θ ≥ 2√16 = 8 would need cos⁴θ = 4 — impossible. Since 8 &gt; 2, the true minimum is at cos²θ = 1: 2 + 8 = <b>10</b>. Rule: a cos²θ + b sec²θ has minimum 2√(ab) only when b ≤ a, else a + b.<br>Same idea: sin²θ + cos²θ + tan²θ + cot²θ + sec²θ + cosec²θ is <b>7</b> (1 + 2 + 4), not 6 from a blind AM-GM on six terms.<br>Max of sin θ cos θ is <b>½</b>, not 1."},
 {k:"link", h:"sin θ cos θ = ½ sin 2θ and R sin(θ + α) both come from L8 (compound and double angles). L3’s identities (sec² = 1 + tan²) turn a sec² + b cosec² into the tan² + cot² form."},
 {k:"q", q:"The maximum value of 8 sin θ + 15 cos θ is:", o:["17","23","7","15"], e:"√(64 + 225) = √289 = 17. (23 adds the coefficients.)"}
], sum:["a sin θ + b cos θ (+ c): c ± √(a² + b²)","a sin²θ + b cos²θ lies between a and b","a tan²θ + b cot²θ ≥ 2√(ab); a sec²θ + b cosec²θ ≥ (√a + √b)²","sin θ cos θ ≤ ½, sin θ + cos θ ≤ √2, sin⁴θ + cos⁴θ ≥ ½","AM–GM minimum must be reachable — check a cos²θ + b sec²θ when b > a"]},
{ id:"L7", heat:2, title:"Allied angles & quadrants", hi:"संबद्ध कोण और चतुर्थांश", blocks:[
 {k:"hot", h:"<b>Tier 1: an occasional direct value</b> (“cos 120° = ?”, “sin 330° = ?”). <b>Tier 2 and long expressions:</b> angles like 150°, 225°, 300°, 420° or negative angles hidden inside a sum. Every such angle reduces to 0°–90° in two steps: pick the rule, then fix the sign."},
 {k:"p", h:"An angle beyond 90° is measured from the positive x-axis, anti-clockwise. Its ratios equal the ratios of its <b>reference angle</b> (the acute angle it makes with the x-axis) — only the <b>sign</b> changes, and the sign depends on the quadrant where the angle ends."},
 {k:"figs", title:"Signs in the four quadrants", items:[
  {svg:'<svg viewBox="0 0 280 220" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M20 110 H260 M140 10 V210"/><rect x="152" y="22" width="96" height="72" rx="6" style="fill:var(--accent-bg)"/><text x="200" y="52" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">I: All +</text><text x="200" y="70" text-anchor="middle" fill="currentColor" stroke="none">0° to 90°</text><text x="80" y="52" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700" style="fill:var(--accent)">II: sin, cosec +</text><text x="80" y="70" text-anchor="middle" fill="currentColor" stroke="none">90° to 180°</text><text x="80" y="152" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700" style="fill:var(--accent)">III: tan, cot +</text><text x="80" y="170" text-anchor="middle" fill="currentColor" stroke="none">180° to 270°</text><text x="200" y="152" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700" style="fill:var(--accent)">IV: cos, sec +</text><text x="200" y="170" text-anchor="middle" fill="currentColor" stroke="none">270° to 360°</text><text x="262" y="104" text-anchor="end" fill="currentColor" stroke="none">0°</text><text x="146" y="20" fill="currentColor" stroke="none">90°</text><text x="22" y="104" fill="currentColor" stroke="none">180°</text><text x="146" y="206" fill="currentColor" stroke="none">270°</text></svg>', cap:"ASTC — “Add Sugar To Coffee”: All, Sin, Tan, Cos are positive in quadrants I, II, III, IV (with their reciprocals)."},
  {svg:'<svg viewBox="0 0 280 200" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M20 130 H260 M140 20 V190" stroke-width="1"/><circle cx="140" cy="130" r="70" stroke-dasharray="4 3"/><path d="M140 130 L79.4 95" style="stroke:var(--accent)"/><path d="M79.4 95 V130" stroke-dasharray="4 3"/><path d="M154 130 A14 14 0 0 0 127.9 123" style="stroke:var(--blue)"/><text x="150" y="116" fill="currentColor" stroke="none" style="fill:var(--blue)">150°</text><path d="M118 130 A22 22 0 0 1 120.9 119" style="stroke:var(--accent)"/><text x="92" y="126" fill="currentColor" stroke="none" style="fill:var(--accent)">30°</text><circle cx="79.4" cy="95" r="2.5" style="fill:var(--accent)" stroke="none"/><text x="74" y="86" text-anchor="end" fill="currentColor" stroke="none">P(−√3/2, ½)</text><text x="144" y="144" fill="currentColor" stroke="none">O</text></svg>', cap:"150° = 180° − 30°. P is (cos 150°, sin 150°) = (−√3/2, ½): sin stays +½ in quadrant II, cos becomes negative."}]},
 {k:"formula", title:"Reduction rule in two steps", rows:[["Step 1 — function","90° ± θ or 270° ± θ → change: sin↔cos, tan↔cot, sec↔cosec","180° ± θ or 360° ± θ → keep the same function"],["Step 2 — sign","sign of the ORIGINAL ratio in the quadrant where the angle lies","treat θ as acute for this"],["Negative angle","sin(−θ) = −sin θ,  cos(−θ) = cos θ,  tan(−θ) = −tan θ","only cos and sec are even"],["Beyond 360°","remove full turns: sin 420° = sin 60°","ratios repeat every 360° (tan every 180°)"]]},
 {k:"table", title:"The standard reductions", head:["Angle","sin","cos","tan"], rows:[["90° − θ","cos θ","sin θ","cot θ"],["90° + θ","cos θ","−sin θ","−cot θ"],["180° − θ","sin θ","−cos θ","−tan θ"],["180° + θ","−sin θ","−cos θ","tan θ"],["270° − θ","−cos θ","−sin θ","cot θ"],["270° + θ","−cos θ","sin θ","−cot θ"],["360° − θ (= −θ)","−sin θ","cos θ","−tan θ"]]},
 {k:"table", title:"Values to know beyond 90°", head:["θ","sin","cos","tan"], rows:[["120°","√3/2","−1/2","−√3"],["135°","1/√2","−1/√2","−1"],["150°","1/2","−√3/2","−1/√3"],["210°","−1/2","−√3/2","1/√3"],["225°","−1/√2","−1/√2","1"],["240°","−√3/2","−1/2","√3"],["300°","−√3/2","1/2","−√3"],["315°","−1/√2","1/√2","−1"],["330°","−1/2","√3/2","−1/√3"]]},
 {k:"ex", src:"SSC CGL 2023 · 18 Jul S4", q:"Find the exact value of cos 120°.", steps:["120° = 180° − 60° → same function, cos","120° is in quadrant II, where cos is negative","cos 120° = −cos 60° = −½ = −0.5"], ans:"−0.5", tip:"Or 90° + 30° → cos changes to sin: −sin 30° = −½. Both routes agree."},
 {k:"ex", src:"SSC CHSL 2017 · 22 Jan (morning)", q:"What is the value of sin 330°?", steps:["330° = 360° − 30° → keep sin","Quadrant IV: sin is negative","sin 330° = −sin 30° = −½"], ans:"−1/2"},
 {k:"ex", q:"Evaluate sin 420°·cos 390° + cos(−300°)·sin(−330°).", steps:["sin 420° = sin 60°, cos 390° = cos 30°","cos(−300°) = cos 300° = cos 60°;  sin(−330°) = −sin 330° = sin 30°","= sin 60° cos 30° + cos 60° sin 30° = ¾ + ¼ = 1"], ans:"1", tip:"It is sin(60° + 30°) = sin 90° (L8)."},
 {k:"trick", h:"<b>“Add Sugar To Coffee”</b> for signs (I All, II Sin, III Tan, IV Cos).<br><b>Vertical axis (90°, 270°) → change the function; horizontal axis (180°, 360°) → keep it.</b> Nod your head up-down at 90°/270° (“yes, change”), side-to-side at 180°/360° (“no change”)."},
 {k:"trap", h:"<b>Take the sign from the ORIGINAL ratio</b>, not the new one: cos(90° + θ) is in quadrant II where cos is negative → <b>−sin θ</b> (not +sin θ).<br><b>tan(180° + θ) = +tan θ</b> (quadrant III, tan positive) — students often write −tan θ.<br><b>cos(−θ) = cos θ</b>, but sin(−θ) = −sin θ."},
 {k:"link", h:"L4’s complementary rule is the 90° − θ row of this table. In triangles (L9), A + B = 180° − C gives sin(A + B) = sin C and cos(A + B) = −cos C — the 180° − θ row."},
 {k:"q", q:"tan 135° = ?", o:["−1","1","0","√3"], e:"135° = 180° − 45°, quadrant II (tan negative) → −tan 45° = −1."}
], sum:["ASTC: All, Sin, Tan, Cos positive in quadrants I–IV","90°/270° ± θ → change function; 180°/360° ± θ → same function","Sign = sign of the original ratio in that quadrant (θ acute)","sin(−θ) = −sin θ, cos(−θ) = cos θ, tan(−θ) = −tan θ; remove 360° turns first","cos 120° = −½, sin 150° = ½, tan 135° = −1, sin 330° = −½"]},
{ id:"L8", heat:2, title:"Compound & multiple angles", hi:"संयुक्त और बहुगुण कोण", blocks:[
 {k:"hot", h:"<b>Mainly Tier 2</b> (1–2 questions), occasionally Tier 1. Forms: “A + B = 45°, find (1 + tan A)(1 + tan B)”, “3 sin x + 4 cos x = 2, find 3 cos x − 4 sin x”, “find cos 2θ if tan θ = 3/4”, or a hidden formula like 3 sin 20° − 4 sin³20° (= sin 60°). Recognising the formula is the whole question."},
 {k:"formula", title:"Sum and difference formulas", rows:[["sin(A ± B)","sin A cos B ± cos A sin B","sign stays the same"],["cos(A ± B)","cos A cos B ∓ sin A sin B","sign flips"],["tan(A ± B)","(tan A ± tan B)/(1 ∓ tan A tan B)","tan 15° = (1 − 1/√3)/(1 + 1/√3) = 2 − √3"],["cot(A + B)","(cot A cot B − 1)/(cot A + cot B)","reciprocal of the tan formula"],["Product forms","sin(A + B) sin(A − B) = sin²A − sin²B","cos(A + B) cos(A − B) = cos²A − sin²B"]]},
 {k:"formula", title:"Double and triple angles", rows:[["sin 2θ","2 sin θ cos θ = 2 tan θ/(1 + tan²θ)","put B = A in sin(A + B)"],["cos 2θ","cos²θ − sin²θ = 2cos²θ − 1 = 1 − 2sin²θ = (1 − tan²θ)/(1 + tan²θ)","four forms — pick the one that matches"],["tan 2θ","2 tan θ/(1 − tan²θ)",""],["Half-angle squares","1 + cos 2θ = 2cos²θ,  1 − cos 2θ = 2sin²θ","so (1 − cos 2θ)/(1 + cos 2θ) = tan²θ"],["sin 3θ","3 sin θ − 4 sin³θ","“3 sin − 4 sin³”"],["cos 3θ","4 cos³θ − 3 cos θ","“4 cos³ − 3 cos” (order reversed)"],["tan 3θ","(3 tan θ − tan³θ)/(1 − 3 tan²θ)",""]]},
 {k:"formula", title:"SSC special results", rows:[["A + B = 45°","(1 + tan A)(1 + tan B) = 2","also (cot A − 1)(cot B − 1) = 2"],["a sin x + b cos x = c","a cos x − b sin x = ±√(a² + b² − c²)","square both and add: sum of squares = a² + b²"],["tan A = 1/2, tan B = 1/3","A + B = 45°","(½ + ⅓)/(1 − ⅙) = 1"],["sin θ·sin(60° − θ)·sin(60° + θ)","= ¼ sin 3θ","cos version: ¼ cos 3θ;  tan version: tan 3θ"]]},
 {k:"fig", title:"Why sin 2θ = 2 sin θ cos θ", svg:'<svg viewBox="0 0 280 190" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M140 20 L60 160 H220 Z"/><path d="M140 20 V160" stroke-dasharray="4 3"/><path d="M140 148 H152 V160"/><path d="M125.1 46.1 A30 30 0 0 0 154.9 46.1" style="stroke:var(--accent)"/><text x="144" y="70" fill="currentColor" stroke="none" style="fill:var(--accent)">2θ</text><text x="134" y="14" fill="currentColor" stroke="none">O</text><text x="86" y="88" fill="currentColor" stroke="none" font-weight="700">1</text><text x="188" y="88" fill="currentColor" stroke="none" font-weight="700">1</text><text x="100" y="176" text-anchor="middle" fill="currentColor" stroke="none" style="fill:var(--blue)">sin θ</text><text x="180" y="176" text-anchor="middle" fill="currentColor" stroke="none" style="fill:var(--blue)">sin θ</text><text x="146" y="120" fill="currentColor" stroke="none">cos θ</text></svg>', cap:"Isosceles triangle, equal sides 1, apex 2θ. Area = ½·1·1·sin 2θ. The altitude (cos θ) splits the base into 2 sin θ, so area = ½·2 sin θ·cos θ. Equate: sin 2θ = 2 sin θ cos θ."},
 {k:"ex", src:"SSC CGL Tier 2 · 18 Nov 2020", q:"If 3 sin x + 4 cos x = 2, then the value of 3 cos x − 4 sin x is:", steps:["Let 3 cos x − 4 sin x = y","Square and add: (3 sin x + 4 cos x)² + (3 cos x − 4 sin x)² = 9 + 16 = 25 (the cross terms cancel)","4 + y² = 25 → y² = 21 → y = √21 (the options give the positive root)"], ans:"√21", tip:"Direct: √(a² + b² − c²) = √(9 + 16 − 4)."},
 {k:"ex", q:"If A + B = 45°, show that (1 + tan A)(1 + tan B) = 2.", steps:["tan(A + B) = tan 45° = 1 → (tan A + tan B)/(1 − tan A tan B) = 1","tan A + tan B = 1 − tan A tan B → tan A + tan B + tan A tan B = 1","(1 + tan A)(1 + tan B) = 1 + (tan A + tan B + tan A tan B) = 1 + 1 = 2"], ans:"2", tip:"Check with A = 0°, B = 45°: (1 + 0)(1 + 1) = 2. So (1 + tan 20°)(1 + tan 25°) = 2 instantly."},
 {k:"ex", q:"If tan θ = 3/4, find cos 2θ and sin 2θ.", steps:["cos 2θ = (1 − tan²θ)/(1 + tan²θ) = (1 − 9/16)/(1 + 9/16) = 7/25","sin 2θ = 2 tan θ/(1 + tan²θ) = (3/2)/(25/16) = 24/25","Check: (7/25)² + (24/25)² = 1 ✓"], ans:"cos 2θ = 7/25, sin 2θ = 24/25"},
 {k:"trick", h:"<b>Spot a formula in disguise:</b> 2 sin x cos x → sin 2x; cos²x − sin²x → cos 2x; 3 sin x − 4 sin³x → sin 3x; 4 cos³x − 3 cos x → cos 3x; (tan A + tan B)/(1 − tan A tan B) → tan(A + B).<br><b>Value check:</b> any identity in A and B can be tested at A = 0° or A = B."},
 {k:"trap", h:"<b>sin 2θ ≠ 2 sin θ</b> (sin 60° = √3/2, but 2 sin 30° = 1).<br><b>cos(A + B) has a MINUS</b>: cos A cos B − sin A sin B. sin keeps the sign, cos flips it.<br>sin 3θ = 3 sin θ − <b>4</b> sin³θ, but cos 3θ = <b>4</b> cos³θ − 3 cos θ — the order is reversed."},
 {k:"link", h:"These formulas produce the L2 values (sin 75° = sin(45° + 30°), tan 22.5° from tan 2θ) and the L6 range: a sin θ + b cos θ = R sin(θ + α). In L9 they meet A + B + C = 180°."},
 {k:"q", q:"cos²15° − sin²15° = ?", o:["√3/2","1","1/2","0"], e:"cos²θ − sin²θ = cos 2θ → cos 30° = √3/2. (1 would be cos² + sin².)"}
], sum:["sin(A ± B) = sin A cos B ± cos A sin B; cos(A ± B) = cos A cos B ∓ sin A sin B","tan(A ± B) = (tan A ± tan B)/(1 ∓ tan A tan B)","sin 2θ = 2 sin θ cos θ; cos 2θ = 1 − 2sin²θ = 2cos²θ − 1; tan 2θ = 2t/(1 − t²)","sin 3θ = 3 sin θ − 4 sin³θ; cos 3θ = 4 cos³θ − 3 cos θ","A + B = 45° ⇒ (1 + tan A)(1 + tan B) = 2"]},
{ id:"L9", heat:2, title:"Triangle identities & simple equations", hi:"त्रिभुज सर्वसमिकाएँ और सरल समीकरण", blocks:[
 {k:"hot", h:"<b>Equation type: about one question every few Tier 1 shifts, regular in Tier 2.</b> “If 2 sin²θ + 3 cos θ = 3 (0° &lt; θ &lt; 90°), find sec²θ + cot²θ” — solve for θ, then evaluate. <b>Triangle type (mostly Tier 2):</b> “In △ABC, tan((A + B)/2) = ?” or “tan A + tan B + tan C = ?”. Both reward one idea: find the angle first."},
 {k:"formula", title:"In any triangle: A + B + C = 180°", rows:[["Pair of angles","A + B = 180° − C","then use the 180° − θ row of L7"],["sin, cos, tan","sin(A + B) = sin C,  cos(A + B) = −cos C,  tan(A + B) = −tan C","sin keeps sign, cos and tan flip"],["Half angles","(A + B)/2 = 90° − C/2","sin((A + B)/2) = cos(C/2),  tan((A + B)/2) = cot(C/2)"],["Tan sum = product","tan A + tan B + tan C = tan A·tan B·tan C","from tan(A + B) = −tan C"],["Cot products","cot A cot B + cot B cot C + cot C cot A = 1","divide the tan result by tan A tan B tan C"],["Right angle at C","A + B = 90°","complementary rules of L4: sin²A + sin²B = 1"]]},
 {k:"fig", title:"The angle sum drives every result", svg:'<svg viewBox="0 0 280 190" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M30 160 H250 L90 40 Z"/><path d="M58 160 A28 28 0 0 0 42.5 135" style="stroke:var(--accent)"/><path d="M222 160 A28 28 0 0 1 227.6 143.2" style="stroke:var(--accent)"/><path d="M82.8 54.3 A16 16 0 0 0 102.8 49.6" style="stroke:var(--blue)"/><text x="22" y="176" fill="currentColor" stroke="none">A</text><text x="252" y="176" fill="currentColor" stroke="none">B</text><text x="86" y="32" fill="currentColor" stroke="none">C</text><text x="62" y="152" fill="currentColor" stroke="none" style="fill:var(--accent)">A</text><text x="202" y="152" fill="currentColor" stroke="none" style="fill:var(--accent)">B</text><text x="86" y="74" fill="currentColor" stroke="none" style="fill:var(--blue)">C</text><text x="128" y="36" fill="currentColor" stroke="none" font-size="11">A + B = 180° − C</text><text x="128" y="54" fill="currentColor" stroke="none" font-size="11">(A + B)/2 = 90° − C/2</text></svg>', cap:"Replace A + B by 180° − C (or the half-sum by 90° − C/2) and apply the allied-angle rules."},
 {k:"formula", title:"Solving a simple trig equation (SSC style)", rows:[["Step 1","write everything in ONE ratio","sin²θ = 1 − cos²θ, cos²θ = 1 − sin²θ"],["Step 2","solve the quadratic","2 sin²θ − 3 sin θ + 1 = 0 → (2 sin θ − 1)(sin θ − 1) = 0"],["Step 3","keep only roots in the given range","0° &lt; θ &lt; 90° rejects sin θ = 1 (θ = 90°) and any value outside −1 to 1"],["Step 4","evaluate the asked expression at that θ","usually 30°, 45° or 60°"],["a sin θ + b cos θ = c","divide by √(a² + b²) and use L8","√3 cos θ + sin θ = 1 → cos(θ − 30°) = ½"],["x + 1/x = 2","forces x = 1","sin θ + cosec θ = 2 ⇒ sin θ = 1 ⇒ any power sum = 2"]]},
 {k:"ex", src:"SSC CGL 2021 Tier 1 · 18 Apr 2022 S3", q:"If 2 sin²θ + 3 cos θ = 3, 0° &lt; θ &lt; 90°, then sec²θ + cot²θ = ?", steps:["2(1 − cos²θ) + 3 cos θ = 3 → 2 cos²θ − 3 cos θ + 1 = 0","(2 cos θ − 1)(cos θ − 1) = 0 → cos θ = ½ (cos θ = 1 gives θ = 0°, not allowed)","θ = 60°: sec²60° + cot²60° = 4 + ⅓ = 13/3 = 4⅓"], ans:"4⅓", tip:"Try the option angles: θ = 60° gives 2(¾) + 3(½) = 3 ✓."},
 {k:"ex", src:"SSC CGL Tier 2 · 13 Sep 2019", q:"If 2 cos²θ + 3 sin θ = 3, 0° &lt; θ &lt; 90°, find sin²2θ + cos²θ + tan²2θ + cosec²2θ.", steps:["2(1 − sin²θ) + 3 sin θ = 3 → 2 sin²θ − 3 sin θ + 1 = 0","sin θ = ½ (sin θ = 1 rejected) → θ = 30°, 2θ = 60°","¾ + ¾ + 3 + 4/3 = 35/6"], ans:"35/6"},
 {k:"ex", q:"In △ABC, tan A = 1 and tan B = 2. Find tan C.", steps:["tan C = −tan(A + B) = −(tan A + tan B)/(1 − tan A tan B)","= −(1 + 2)/(1 − 2) = 3","Check: tan A + tan B + tan C = 6 = 1·2·3 ✓"], ans:"3", tip:"Equilateral value put for identities: A = B = C = 60° → tan A + tan B + tan C = 3√3 = tan A tan B tan C."},
 {k:"trick", h:"<b>Equation questions: test the options.</b> Put 30°, 45°, 60° into the given equation — the one that satisfies it is θ. Then evaluate.<br><b>Triangle identities: value put</b> A = B = C = 60°, or A = 90°, B = C = 45° — then compare with the options."},
 {k:"trap", h:"<b>Reject roots outside the range:</b> in 0° &lt; θ &lt; 90°, cos θ = 1 (θ = 0°) and sin θ = 1 (θ = 90°) are not allowed; sin θ = 2 or −2 is never possible.<br><b>In a triangle, cos(A + B) = −cos C</b>, not cos C. And tan(A + B) = <b>−</b>tan C."},
 {k:"link", h:"The triangle results are L7’s allied angles with 180° − C; the equation step uses L3’s identities to reach one ratio. Angles of elevation in L10 are also solved by finding the angle first."},
 {k:"q", q:"In △ABC, sin((B + C)/2) = ?", o:["cos(A/2)","sin(A/2)","−cos(A/2)","cos A"], e:"(B + C)/2 = 90° − A/2 → sin(90° − A/2) = cos(A/2)."}
], sum:["A + B = 180° − C: sin(A + B) = sin C, cos(A + B) = −cos C, tan(A + B) = −tan C","(A + B)/2 = 90° − C/2: sin ↔ cos, tan ↔ cot","tan A + tan B + tan C = tan A tan B tan C; cot A cot B + cot B cot C + cot C cot A = 1","Equation: one ratio → quadratic → keep the root in range → evaluate","Option-testing with 30°, 45°, 60° is often fastest"]},
{ id:"L10", heat:3, title:"Heights & distances", hi:"ऊँचाई और दूरी", blocks:[
 {k:"hot", h:"<b>About one question in most Tier 1 shifts and 1–2 in Tier 2.</b> Forms: tower + one angle (find height/distance), observer moving towards the tower (30° → 60°), two ships seen from a lighthouse, shadow longer by x m when the sun’s altitude drops, building and tower (elevation + depression). Nearly every one uses only 30°, 45° and 60°."},
 {k:"p", h:"The <b>angle of elevation</b> is measured UP from the horizontal to the line of sight; the <b>angle of depression</b> is measured DOWN from the horizontal. Because the two horizontals are parallel, the depression seen from the top equals the elevation seen from the bottom (alternate angles). Every problem is one or two right triangles with <b>tan θ = height ÷ horizontal distance</b>."},
 {k:"figs", title:"The two standard pictures", items:[
  {svg:'<svg viewBox="0 0 280 200" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M20 170 H262"/><path d="M240 170 V60" stroke-width="2.4"/><path d="M228 170 V158 H240"/><path d="M49.5 170 L240 60 M176.5 170 L240 60" style="stroke:var(--accent)"/><path d="M75.5 170 A26 26 0 0 0 72 157" style="stroke:var(--accent)"/><text x="80" y="165" fill="currentColor" stroke="none" font-size="11">30°</text><path d="M196.5 170 A20 20 0 0 0 186.5 152.7" style="stroke:var(--accent)"/><text x="196" y="160" fill="currentColor" stroke="none" font-size="11">60°</text><text x="246" y="64" fill="currentColor" stroke="none">A</text><text x="246" y="182" fill="currentColor" stroke="none">B</text><text x="246" y="120" fill="currentColor" stroke="none" font-weight="700" style="fill:var(--blue)">h</text><text x="44" y="188" fill="currentColor" stroke="none">C</text><text x="172" y="188" fill="currentColor" stroke="none">D</text><text x="113" y="188" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700" style="fill:var(--blue)">x</text><text x="208" y="188" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700" style="fill:var(--blue)">d</text></svg>', cap:"Observer walks from C (30°) to D (60°). BD = h/√3, BC = h√3, so x = CD = 2h/√3 = 2d. Height h = x/(cot 30° − cot 60°) = (√3/2)x."},
  {svg:'<svg viewBox="0 0 280 200" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M20 170 H262"/><path d="M50 170 V70" stroke-width="2.4"/><path d="M50 158 H62 V170"/><path d="M50 70 H262" stroke-dasharray="4 3"/><text x="150" y="64" fill="currentColor" stroke="none" font-size="11">horizontal</text><path d="M50 70 L223 170" style="stroke:var(--accent)"/><path d="M80 70 A30 30 0 0 1 76 85" style="stroke:var(--blue)"/><text x="84" y="86" fill="currentColor" stroke="none" font-size="11" style="fill:var(--blue)">30°</text><path d="M193 170 A30 30 0 0 1 197 155" style="stroke:var(--blue)"/><text x="166" y="164" fill="currentColor" stroke="none" font-size="11" style="fill:var(--blue)">30°</text><circle cx="223" cy="170" r="3" style="fill:var(--accent)" stroke="none"/><text x="40" y="64" fill="currentColor" stroke="none">T</text><text x="40" y="184" fill="currentColor" stroke="none">O</text><text x="226" y="186" fill="currentColor" stroke="none">S</text><text x="34" y="124" fill="currentColor" stroke="none" font-weight="700">h</text><text x="136" y="188" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">d = h cot 30°</text></svg>', cap:"Depression from the top T to the ship S = elevation of T seen from S (alternate angles, horizontals parallel)."}]},
 {k:"formula", title:"Working formulas", rows:[["One angle","h = d·tan θ,  d = h·cot θ","30°: h = d/√3;  45°: h = d;  60°: h = √3 d"],["Two angles, same side","h = x/(cot α − cot β)","x = distance between the two points, α < β"],["30° → 60° walk","distance walked = 2 × remaining distance","h = (√3/2) × distance walked"],["Two angles, opposite sides","total distance = h(cot α + cot β)","two ships on either side of a lighthouse"],["Complementary angles","α + β = 90° from distances a and b → h = √(ab)","tan α·tan β = 1 → (h/a)(h/b) = 1"],["Shadow","shadow = h·cot θ","shadow = h → 45°; shadow = √3 h → 30°;  shadow = h/√3 → 60°"],["Observer’s height","add the eye height to the tower part above the eye","h_tower = d·tan θ + eye height"]]},
 {k:"table", title:"30-45-60 side ratios (height : distance : line of sight)", head:["Angle","h : d","h : line of sight"], rows:[["30°","1 : √3","1 : 2"],["45°","1 : 1","1 : √2"],["60°","√3 : 1","√3 : 2"]]},
 {k:"ex", src:"SSC CGL 2021 Tier 1 · 11 Apr 2022 S1", q:"The angle of elevation of the top of an unfinished tower at a point 78 m from its base is 30°. How much higher must the tower be raised (in m) so that the angle of elevation of the top at the same point becomes 60°?", steps:["Present height = 78 tan 30° = 78/√3 = 26√3","Finished height = 78 tan 60° = 78√3","Raise by 78√3 − 26√3 = 52√3"], ans:"52√3 m", tip:"tan 60° = 3 × tan 30°, so the finished tower is 3 times as tall: raise = 2 × 26√3."},
 {k:"ex", src:"SSC CHSL 2023 Tier 2 · 10 Jan 2024 S1", q:"The shadow of a tower is 40 m longer when the Sun’s altitude is 30° than when it is 45°. Find the height of the tower.", steps:["Shadows: h cot 30° = h√3 and h cot 45° = h","h√3 − h = 40 → h = 40/(√3 − 1)","Rationalise: h = 40(√3 + 1)/2 = 20(√3 + 1) m"], ans:"20(√3 + 1) m"},
 {k:"ex", q:"From the top of a lighthouse 60 m high, the angles of depression of two ships on the same side are 45° and 30°. Find the distance between the ships.", steps:["Near ship (45°): distance = 60 cot 45° = 60","Far ship (30°): distance = 60 cot 30° = 60√3","Gap = 60√3 − 60 = 60(√3 − 1) ≈ 43.9 m"], ans:"60(√3 − 1) m", tip:"Same side → subtract the cot values; opposite sides → add them."},
 {k:"trick", h:"<b>Draw first, then use only tan.</b> For 30°/45°/60°, write sides straight from the ratio table — no calculation.<br><b>30° → 60° walk:</b> the walked distance is twice the remaining distance and the height is (√3/2) × walked.<br><b>Approximation:</b> √3 ≈ 1.732, so 60(√3 − 1) ≈ 43.9 and 20(√3 + 1) ≈ 54.6 — use this to pick options quickly."},
 {k:"trap", h:"<b>Eye height:</b> if a 1.5 m tall person sees the top at 45° from 28.5 m, the tower is 28.5 + 1.5 = <b>30 m</b>, not 28.5 m.<br><b>Depression is measured from the horizontal</b>, not from the vertical tower — the angle inside the triangle at the top is 90° − depression.<br><b>Same side vs opposite sides:</b> subtract distances for the same side, add them for opposite sides."},
 {k:"link", h:"Uses only L2’s standard values (tan 30°, 45°, 60°) and L1’s tan = P/B. Shadow and ladder problems are the same triangle as the 30-60-90 triangle of Geometry."},
 {k:"q", q:"A tower casts a shadow equal to its own height. The Sun’s angle of elevation is:", o:["45°","30°","60°","90°"], e:"tan θ = h/h = 1 → θ = 45°."}

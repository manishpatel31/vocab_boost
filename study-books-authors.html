<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>

<title>Books &amp; Authors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Shared by every History page (built by tools/history/build.js).
   Layout: a manuscript folio — parchment paper, maroon ink, gold figures; one-column app with a bottom tab bar. */
:root{
  --paper:#f3efe4; --sheet:#fffdf6; --sunk:#e8e1cf;
  --ink:#241c14; --ink2:#5d5141; --rule:#d8cdb4;
  --blue:#7a2230; --on-blue:#ffffff; --blue-bg:#f4e2e1;
  --accent:#9a6a12; --accent-bg:#f8ecc9;
  --good:#1b6b4a; --good-bg:#ddefe4; --bad:#a8291f; --bad-bg:#f8e0dc;
  --warn-bg:#fcf0cf;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* era groups on the Learn screen */
.eras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.erac{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:grid;gap:6px}
.erac b{font-family:var(--f-display);font-size:15px;font-weight:700;line-height:1.25}
.erac .hi{font-size:12px;color:var(--ink2)}
.erac .mt{font-family:var(--f-num);font-size:11px;color:var(--ink2)}
.erac .meter{height:6px}
.erac[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.grph{display:flex;align-items:baseline;gap:8px;padding:14px 2px 4px;border-top:2px solid var(--ink);margin-top:4px}
.grph h2{font-size:17px}
.grph span{font-size:12px;color:var(--ink2);margin-left:auto;font-family:var(--f-num)}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}
.dots{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--rule);display:block}
.dots i.on{background:var(--accent)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.hot{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px;font-size:15px}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.facts.prose dd{font-weight:400;line-height:1.55}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap,.link{border-radius:var(--r);padding:12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.link{background:var(--sunk);border-color:transparent}
.trick .lab,.trap .lab,.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.link .lab{color:var(--ink2)}
.mn{font-family:var(--f-num);font-weight:600;background:var(--sheet);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.tag.src{background:var(--good-bg);color:var(--good)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:22px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
/* one-line revision rows (last week / last moment) */
.lines{display:grid;gap:0}
.lines div{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px dashed var(--rule);font-size:15px}
.lines div:first-child{border-top:0}
.lines b{font-weight:700}
.lines span{color:var(--ink2)}
.callout{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;font-size:15px}

/* plan maker */
.plancfg{display:grid;gap:12px}
.pday{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.pday > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pday > summary::-webkit-details-marker{display:none}
.pday .dno{font-family:var(--f-num);font-weight:700;font-size:13px;background:var(--sunk);border-radius:99px;padding:2px 10px;white-space:nowrap}
.pday.cur .dno{background:var(--blue);color:var(--on-blue)}
.pday.allgood .dno{background:var(--good-bg);color:var(--good)}
.pday .dt{min-width:0;font-weight:600;font-size:15px}
.pday .dt small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
.pday .dp{font-family:var(--f-num);font-size:12px;color:var(--ink2);white-space:nowrap}
.pday .body{padding:0 14px 12px;display:grid;gap:8px;border-top:1px dashed var(--rule);margin-top:2px;padding-top:10px}
.ptask{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;width:100%;font-size:15px}
.ptask .box{width:22px;height:22px;border-radius:6px;border:1.6px solid var(--rule);display:grid;place-items:center;font-size:14px;color:var(--on-blue);margin-top:1px}
.ptask[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.ptask[aria-pressed="true"] .lbl{text-decoration:line-through;color:var(--ink2)}
.ptask .lbl small{display:block;font-size:12px;color:var(--ink2);text-decoration:none}
/* the story first: plain-language opener for beginners */
.story{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;font-size:16.5px;line-height:1.65}
.story .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.story p{margin:0}
.story .key{background:var(--blue-bg);border-radius:8px;padding:8px 12px;font-size:15px;line-height:1.5}
.story .key b{color:var(--blue)}
/* hub: app cards and the beginner path */
.appcs{display:grid;gap:12px}
.appc{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;text-align:left;width:100%;cursor:pointer}
.appc:hover{border-color:var(--blue)}
.appc .hd{display:flex;align-items:center;gap:10px}
.appc .ic{font-size:26px;line-height:1}
.appc .hd b{font-family:var(--f-display);font-size:17px;font-weight:700;display:block}
.appc .hd small{font-size:12px;color:var(--ink2)}

{"id":"B1","heat":3,"title":"Ancient Indian classics","hi":"प्राचीन भारतीय ग्रंथ","blocks":[{"k":"hot","h":"A book ↔ author question comes in almost every GA section. From the ancient period the favourites are <b>Arthashastra, Indica, Ashtadhyayi, Kalidasa's plays, Harshacharita, Rajatarangini, Mricchakatika, Mudrarakshasa<\/b> and the <b>Tamil epics<\/b>."},{"k":"story","h":"<p>Think of ancient India as a <b>library with three shelves<\/b>. The first shelf holds the <b>epics and grammar<\/b>: Valmiki's Ramayana, Vyasa's Mahabharata and Panini's Ashtadhyayi. The second holds <b>courts and kings<\/b>: Chanakya's Arthashastra for Chandragupta Maurya, Kalidasa's plays in the Gupta court, and Banabhatta's biography of Harsha. The third holds <b>science<\/b>: Aryabhata's mathematics, Charaka's medicine and Sushruta's surgery.<\/p><p>Foreign visitors left notes too — <b>Megasthenes<\/b> (Greek, Mauryan court), <b>Fa-Hien<\/b> and <b>Hiuen Tsang<\/b> (Chinese Buddhist pilgrims). Down south, Tamil poets wrote the <b>Tirukkural<\/b> and the twin epics <b>Silappatikaram<\/b> and <b>Manimekalai<\/b>.<\/p>","key":"Match the book to its king's court: Arthashastra — Chandragupta Maurya; Kalidasa — Chandragupta II; Harshacharita — Harsha; Buddhacharita — Kanishka."},{"k":"photos","title":"The classics in pictures","items":[["Arthashastra","Arthashastra","Kautilya"],["Abhijnanashakuntalam","Abhijnanashakuntalam","Kalidasa"],["Panchatantra","Panchatantra","Vishnu Sharma"],["Ashtadhyayi","Ashtadhyayi","Panini"],["Aryabhatiya","Aryabhatiya","Aryabhata"],["Sushruta_Samhita","Sushruta Samhita","Sushruta"],["Tirukkural","Tirukkural","Tiruvalluvar"],["Gita_Govinda","Gita Govinda","Jayadeva"],["Xuanzang","Hiuen Tsang","Si-Yu-Ki"]]},{"k":"table","title":"Books and authors","head":["Book","Author","Note"],"rows":[["Arthashastra","Kautilya (Chanakya)","A treatise on statecraft and economy from the Mauryan age."],["Indica","Megasthenes","Greek ambassador of Seleucus at the court of Chandragupta Maurya."],["Ashtadhyayi","Panini","The classic grammar of Sanskrit, in eight chapters."],["Yoga Sutras","Patanjali","The foundational text of yoga; Patanjali also wrote the Mahabhashya on Panini."],["Abhijnanashakuntalam","Kalidasa","Play about Dushyanta and Shakuntala; Kalidasa adorned Chandragupta II's court."],["Meghadutam","Kalidasa","'The Cloud Messenger' — a lyric poem."],["Mricchakatika","Sudraka","'The Little Clay Cart', a Sanskrit play."],["Mudrarakshasa","Vishakhadatta","Play on Chanakya outwitting Rakshasa to secure Chandragupta's throne."],["Swapnavasavadattam","Bhasa","'The Dream of Vasavadatta'."],["Harshacharita","Banabhatta","Biography of King Harshavardhana by his court poet; Bana also wrote Kadambari."],["Rajatarangini","Kalhana","Chronicle of the kings of Kashmir, 12th century."],["Gita Govinda","Jayadeva","Love of Radha and Krishna; 12th-century Odisha/Bengal."],["Kamasutra","Vatsyayana",""],["Aryabhatiya","Aryabhata","Mathematics and astronomy (5th century)."],["Brihat Samhita","Varahamihira","An encyclopaedia of astronomy and astrology; Varahamihira was one of the 'nine gems'."],["Lilavati","Bhaskaracharya (Bhaskara II)","Arithmetic, 12th century."],["Charaka Samhita","Charaka","Classic text of Ayurvedic medicine."],["Sushruta Samhita","Sushruta","Surgery — Sushruta is called the father of surgery."],["Panchatantra","Vishnu Sharma","Animal fables teaching statecraft."],["Hitopadesha","Narayana Pandit","Fables, partly drawn from the Panchatantra."],["Amarakosha","Amarasimha","A Sanskrit thesaurus."],["Kathasaritsagara","Somadeva","'Ocean of the Streams of Stories', from Kashmir."],["Ratnavali","Harshavardhana","Harsha also wrote Nagananda and Priyadarshika."],["Buddhacharita","Ashvaghosha","Life of the Buddha; Ashvaghosha was at Kanishka's court."],["Tirukkural","Tiruvalluvar","Tamil couplets on virtue, wealth and love."],["Silappatikaram","Ilango Adigal","Tamil epic of Kannagi and Kovalan."],["Manimekalai","Sattanar","Tamil Buddhist epic, a sequel to Silappatikaram."],["Ramayana","Valmiki","Called the Adi Kavya (first poem)."],["Mahabharata","Ved Vyasa","The longest epic poem in the world."],["Vikramankadevacharita","Bilhana","Life of the Chalukya king Vikramaditya VI."],["Si-Yu-Ki","Hiuen Tsang (Xuanzang)","Chinese pilgrim's record of India in Harsha's time."],["Fo-Kuo-Ki","Fa-Hien (Faxian)","Chinese pilgrim in the reign of Chandragupta II."]]},{"k":"cards","title":"Sort them by subject","rows":[["Statecraft","Arthashastra · Kautilya","Also Megasthenes' Indica, a Greek view of Mauryan India","👑"],["Grammar and words","Ashtadhyayi · Panini","Amarakosha (Amarasimha), Yoga Sutras (Patanjali)","🔤"],["Drama and poetry","Kalidasa","Shakuntalam, Meghadutam; Bhasa, Sudraka, Vishakhadatta, Jayadeva","🎭"],["Science and medicine","Aryabhata · Varahamihira","Lilavati (Bhaskara II), Charaka and Sushruta Samhita","🔭"],["Stories","Panchatantra · Vishnu Sharma","Hitopadesha, Kathasaritsagara","🦊"],["History and travel","Rajatarangini · Kalhana","Harshacharita (Banabhatta); Fa-Hien and Hiuen Tsang","🧭"],["Tamil Sangam","Tirukkural · Tiruvalluvar","Silappatikaram and Manimekalai, the twin epics","🌺"]]},{"k":"trick","h":"<b>Court poets<\/b> — <i>“Kanishka's Ashva, Gupta's Kali, Harsha's Bana”<\/i>: Ashvaghosha (Kanishka), Kalidasa (Chandragupta II), Banabhatta (Harsha). <b>Chinese pilgrims<\/b> in order: <b>Fa-Hien first (Gupta), Hiuen Tsang later (Harsha)<\/b> — F comes before H."},{"k":"trap","h":"<b>Mudrarakshasa<\/b> is by Vishakhadatta, <b>Mricchakatika<\/b> by Sudraka — both are plays, papers swap them. <b>Indica<\/b> is Megasthenes (Greek), <b>Kitab-ul-Hind<\/b> is Al-Biruni (medieval). <b>Harsha<\/b> himself wrote three plays (Ratnavali, Nagananda, Priyadarshika) — <b>Harshacharita<\/b> is about him, by Bana."}],"sum":["Arthashastra — Kautilya; Indica — Megasthenes; Ashtadhyayi — Panini.","Kalidasa wrote Abhijnanashakuntalam and Meghadutam; Sudraka wrote Mricchakatika; Vishakhadatta wrote Mudrarakshasa.","Harshacharita — Banabhatta; Rajatarangini (Kashmir) — Kalhana; Gita Govinda — Jayadeva.","Aryabhatiya — Aryabhata; Charaka Samhita — medicine; Sushruta Samhita — surgery.","Tirukkural — Tiruvalluvar; Silappatikaram — Ilango Adigal; Manimekalai — Sattanar."],"part":["Part 1 · Classics of India","भारत के शास्त्रीय ग्रंथ"],"g":"bk"},
{"id":"B2","heat":3,"title":"Medieval and Mughal-era works","hi":"मध्यकालीन और मुग़लकालीन ग्रंथ","blocks":[{"k":"hot","h":"Asked often: <b>Baburnama<\/b> (and its language), <b>Humayun-nama<\/b>, <b>Akbarnama / Ain-i-Akbari<\/b>, <b>Kitab-ul-Hind<\/b>, <b>Rihla<\/b>, <b>Padmavat<\/b>, <b>Ramcharitmanas<\/b> and <b>Prithviraj Raso<\/b>."},{"k":"story","h":"<p>Medieval India wrote its own history. The Mughal emperors kept <b>memoirs<\/b> — Babur's Baburnama and Jahangir's Tuzuk-i-Jahangiri — and hired <b>court historians<\/b>: Abul Fazl for Akbar, Abdul Hamid Lahori for Shah Jahan. Babur's daughter <b>Gulbadan Begum<\/b> wrote her brother Humayun's life — one of the few histories by a woman.<\/p><p>Travellers watched from outside: <b>Al-Biruni<\/b> came with Mahmud of Ghazni, <b>Ibn Battuta<\/b> served Muhammad bin Tughlaq, and <b>Bernier<\/b> saw Shah Jahan's court. Meanwhile the Bhakti poets wrote for the people in their own tongues — <b>Tulsidas, Surdas, Kabir<\/b> — and <b>Jayasi<\/b> wrote the Padmavat.<\/p>","key":"Memoirs: Babur, Jahangir. Court histories: Abul Fazl (Akbar), Lahori (Shah Jahan). Travellers: Al-Biruni, Ibn Battuta, Bernier."},{"k":"photos","title":"In pictures","items":[["Babur","Babur","Baburnama"],["Abu'l-Fazl_ibn_Mubarak","Abul Fazl","Akbarnama"],["Jahangir","Jahangir","Tuzuk-i-Jahangiri"],["Al-Biruni","Al-Biruni","Kitab-ul-Hind"],["Ibn_Battuta","Ibn Battuta","Rihla"],["Amir_Khusrau","Amir Khusrau","Khazain-ul-Futuh"],["Tulsidas","Tulsidas","Ramcharitmanas"],["Kabir","Kabir","Bijak"],["Dara_Shikoh","Dara Shikoh","Majma-ul-Bahrain"],["Krishnadevaraya","Krishnadevaraya","Amuktamalyada"]]},{"k":"table","title":"Books and authors","head":["Book","Author","Note"],"rows":[["Baburnama (Tuzuk-i-Baburi)","Babur","Memoirs of the founder of the Mughal empire, in Chagatai Turkish."],["Humayun-nama","Gulbadan Begum","Babur's daughter wrote the life of her brother Humayun."],["Akbarnama","Abul Fazl","Official history of Akbar's reign; its third volume is the Ain-i-Akbari."],["Muntakhab-ut-Tawarikh","Abdul Qadir Badauni","A critical history of Akbar's reign."],["Tuzuk-i-Jahangiri","Jahangir","Jahangir's memoirs."],["Padshahnama","Abdul Hamid Lahori","History of Shah Jahan's reign."],["Kitab-ul-Hind (Tahqiq-i-Hind)","Al-Biruni","Came with Mahmud of Ghazni; wrote about Indian science and society."],["Rihla","Ibn Battuta","Moroccan traveller at the court of Muhammad bin Tughlaq."],["Tabaqat-i-Nasiri","Minhaj-us-Siraj","History dedicated to Sultan Nasiruddin Mahmud."],["Tarikh-i-Firoz Shahi","Ziauddin Barani","History of the Delhi Sultanate up to Firoz Shah Tughlaq; Barani also wrote Fatawa-i-Jahandari."],["Tabaqat-i-Akbari","Nizamuddin Ahmad",""],["Majma-ul-Bahrain","Dara Shikoh","'The Mingling of Two Oceans' — Sufism and Vedanta."],["Padmavat","Malik Muhammad Jayasi","Awadhi epic on Rani Padmini of Chittor."],["Ramcharitmanas","Tulsidas","The Ramayana retold in Awadhi."],["Sursagar","Surdas","Songs of Krishna's childhood in Braj Bhasha."],["Bijak","Kabir","Sayings and dohas of Kabir."],["Prithviraj Raso","Chand Bardai","Court poet's epic on Prithviraj Chauhan."],["Bihari Satsai","Bihari","700 dohas in Braj Bhasha."],["Amuktamalyada","Krishnadevaraya","Telugu poem by the Vijayanagara emperor."],["Shahnama","Firdausi","Persian 'Book of Kings', written for Mahmud of Ghazni."],["Khazain-ul-Futuh","Amir Khusrau","Campaigns of Alauddin Khalji; Khusrau is the 'Parrot of India'."],["Kitab-i-Nauras","Ibrahim Adil Shah II","Songs in Dakhni by the Bijapur sultan."],["Travels in the Mogul Empire","François Bernier","French physician in Shah Jahan's and Aurangzeb's time."],["Qanun-i-Humayuni","Khwandamir",""]]},{"k":"shelf","title":"The Mughal shelf","hue":30,"rows":[["Baburnama","Babur",""],["Humayun-nama","Gulbadan Begum",""],["Akbarnama","Abul Fazl",""],["Muntakhab-ut-Tawarikh","Abdul Qadir Badauni",""],["Tuzuk-i-Jahangiri","Jahangir",""],["Padshahnama","Abdul Hamid Lahori",""],["Majma-ul-Bahrain","Dara Shikoh",""]],"cap":"In order: Babur wrote his own memoir; his daughter Gulbadan wrote Humayun's; Abul Fazl and Badauni wrote Akbar's reign (one praising, one critical); Jahangir wrote his own; Lahori wrote Shah Jahan's."},{"k":"trick","h":"Mughal order of memoir-writers: <b>Babur wrote, Humayun was written about (by his sister), Akbar was written about (Abul Fazl), Jahangir wrote again<\/b> — <i>write, written, written, write<\/i>."},{"k":"trap","h":"The <b>Baburnama<\/b> is in <b>Turkish (Chagatai)<\/b>, not Persian. <b>Ain-i-Akbari<\/b> is a part of the <b>Akbarnama<\/b> — both by Abul Fazl. <b>Badauni<\/b> criticised Akbar; <b>Abul Fazl<\/b> praised him. <b>Shahnama<\/b> is Firdausi's Persian epic, not about Shah Jahan."}],"sum":["Baburnama (Turkish) — Babur; Humayun-nama — Gulbadan Begum; Tuzuk-i-Jahangiri — Jahangir.","Akbarnama and Ain-i-Akbari — Abul Fazl; Muntakhab-ut-Tawarikh — Badauni; Padshahnama — Abdul Hamid Lahori.","Kitab-ul-Hind — Al-Biruni; Rihla — Ibn Battuta; Tarikh-i-Firoz Shahi — Ziauddin Barani.","Padmavat — Jayasi; Ramcharitmanas — Tulsidas; Sursagar — Surdas; Prithviraj Raso — Chand Bardai.","Amuktamalyada — Krishnadevaraya; Khazain-ul-Futuh — Amir Khusrau."],"part":["Part 1 · Classics of India","भारत के शास्त्रीय ग्रंथ"],"g":"bk"},
{"id":"B3","heat":3,"title":"Books and newspapers of the freedom struggle","hi":"स्वतंत्रता संग्राम की पुस्तकें और समाचार पत्र","blocks":[{"k":"hot","h":"High-yield: <b>Discovery of India, My Experiments with Truth, Poverty and Un-British Rule, Gita Rahasya, Anandamath, Neel Darpan, Gulamgiri, Annihilation of Caste<\/b> — and <b>which leader ran which newspaper<\/b> (Kesari, Young India, Al-Hilal, Mooknayak, Bengal Gazette)."},{"k":"story","h":"<p>India's freedom fighters fought with <b>pens<\/b> as much as with protests. Many of their best books were written <b>in jail<\/b>: Tilak's Gita Rahasya in Mandalay, Nehru's Discovery of India in Ahmednagar Fort, Bhagat Singh's essay in Lahore.<\/p><p>Newspapers carried their ideas to every town. Tilak's <b>Kesari<\/b> roused Maharashtra; Gandhi's <b>Young India<\/b> and <b>Harijan<\/b> spread non-violence; Maulana Azad's <b>Al-Hilal<\/b> spoke to Urdu readers; Ambedkar's <b>Mooknayak<\/b> gave a voice to the oppressed. It all began with <b>Hicky's Bengal Gazette<\/b> in 1780 — India's first newspaper.<\/p>","key":"Jail books: Gita Rahasya (Mandalay), Discovery of India (Ahmednagar). First newspaper: Bengal Gazette, 1780."},{"k":"photos","title":"In pictures","items":[["Hicky's_Bengal_Gazette","Hicky's Bengal Gazette","India's first newspaper, 1780"],["Bal_Gangadhar_Tilak","Bal Gangadhar Tilak","Kesari · Mahratta"],["Abul_Kalam_Azad","Maulana Azad","Al-Hilal"],["Annie_Besant","Annie Besant","New India"],["B._R._Ambedkar","B. R. Ambedkar","Mooknayak"],["Ram_Mohan_Roy","Raja Ram Mohan Roy","Sambad Kaumudi"],["Mahatma_Gandhi","Mahatma Gandhi","Young India · Harijan"],["Jawaharlal_Nehru","Jawaharlal Nehru","The Discovery of India"]]},{"k":"table","title":"Books","head":["Book","Author","Note"],"rows":[["The Story of My Experiments with Truth","Mahatma Gandhi","Autobiography, first in Gujarati (Satya na Prayogo)."],["The Discovery of India","Jawaharlal Nehru","Written in Ahmednagar Fort jail, 1942–46."],["Glimpses of World History","Jawaharlal Nehru","Letters from prison to his daughter Indira."],["Poverty and Un-British Rule in India","Dadabhai Naoroji","Explains the 'drain of wealth' theory."],["Gita Rahasya","Bal Gangadhar Tilak","Written in Mandalay jail."],["Anandamath","Bankim Chandra Chattopadhyay","The novel that contains 'Vande Mataram'."],["Gitanjali","Rabindranath Tagore","Won the Nobel Prize in Literature, 1913 — the first for an Asian."],["Neel Darpan","Dinabandhu Mitra","Play on the oppression of indigo farmers."],["Gulamgiri","Jyotiba Phule","'Slavery' — against caste oppression (1873)."],["Annihilation of Caste","B. R. Ambedkar","Undelivered speech of 1936."],["The Indian Struggle","Subhas Chandra Bose",""],["The Indian War of Independence, 1857","V. D. Savarkar","Called 1857 the first war of independence."],["India Wins Freedom","Maulana Abul Kalam Azad",""],["India Divided","Rajendra Prasad",""],["Why I Am an Atheist","Bhagat Singh","Essay written in Lahore jail, 1930."],["The Golden Threshold","Sarojini Naidu","Poems; she was called the 'Nightingale of India'."],["Savitri","Sri Aurobindo","Epic poem in blank verse."],["Satyarth Prakash","Swami Dayanand Saraswati","Founder of the Arya Samaj."],["Tuhfat-ul-Muwahhidin","Raja Ram Mohan Roy","A Persian work against idolatry."],["Unhappy India","Lala Lajpat Rai","A reply to Katherine Mayo's 'Mother India'."],["Economic History of India","R. C. Dutt",""],["Hind Swaraj","Mahatma Gandhi","Written in 1909 on a ship from London to South Africa."]]},{"k":"table","title":"Newspapers and journals","head":["Paper","Started / edited by","Note"],"rows":[["Kesari","Bal Gangadhar Tilak","Marathi paper; Mahratta was his English one."],["Young India","Mahatma Gandhi","Gandhi also ran Harijan, Navjivan and, in South Africa, Indian Opinion."],["Indian Opinion","Mahatma Gandhi","Started in South Africa, 1903."],["Al-Hilal","Maulana Abul Kalam Azad","Urdu weekly, 1912."],["Comrade","Mohammad Ali Jauhar",""],["Bengal Gazette","James Augustus Hicky","India's first newspaper, 1780 ('Hicky's Bengal Gazette')."],["New India","Annie Besant","Also Commonweal; she started the Home Rule League."],["Mooknayak","B. R. Ambedkar","Marathi fortnightly, 1920; also Bahishkrit Bharat."],["Sambad Kaumudi","Raja Ram Mohan Roy","Bengali weekly; also Mirat-ul-Akhbar in Persian."],["Rast Goftar","Dadabhai Naoroji","Gujarati paper, 1851."],["National Herald","Jawaharlal Nehru","Founded 1938."],["Amrita Bazar Patrika","Sisir Kumar Ghosh","Started with his brother Motilal Ghosh."],["Ghadar","Ghadar Party (Lala Har Dayal)","Published from San Francisco, 1913."],["Bombay Chronicle","Pherozeshah Mehta",""],["Hindu Patriot","Harish Chandra Mukherjee","Exposed the indigo planters."]]},{"k":"info","title":"Mastheads of the freedom struggle","html":"<div class=\"fam\"><div style=\"background:var(--sheet);border-top:4px double var(--ink)\"><b style=\"font:800 19px/1.15 var(--f-display,Georgia,serif);letter-spacing:.01em\">Kesari<\/b><span class=\"n\">Bal Gangadhar Tilak<\/span><small>Marathi paper; Mahratta was his English one.<\/small><\/div><div style=\"background:var(--sheet);border-top:4px double var(--ink)\"><b style=\"font:800 19px/1.15 var(--f-display,Georgia,serif);letter-spacing:.01em\">Young India<\/b><span class=\"n\">Mahatma Gandhi<\/span><small>Gandhi also ran Harijan, Navjivan and, in South Africa, Indian Opinion.<\/small><\/div><div style=\"background:var(--sheet);border-top:4px double var(--ink)\"><b style=\"font:800 19px/1.15 var(--f-display,Georgia,serif);letter-spacing:.01em\">Indian Opinion<\/b><span class=\"n\">Mahatma Gandhi<\/span><small>Started in South Africa, 1903.<\/small><\/div><div style=\"background:var(--sheet);border-top:4px double var(--ink)\"><b style=\"font:800 19px/1.15 var(--f-display,Georgia,serif);letter-spacing:.01em\">Al-Hilal<\/b><span class=\"n\">Maulana Abul Kalam Azad<\/span><small>Urdu weekly, 1912.<\/small><\/div><div style=\"background:var(--sheet);border-top:4px double var(--ink)\"><b style=\"font:800 19px/1.15 var(--f-display,Georgia,serif);letter-spacing:.01em\">Comrade<\/b><span class=\"n\">Mohammad Ali Jauhar<\/span><small><\/small><\/div><div style=\"background:var(--sheet);border-top:4px double var(--ink)\"><b style=\"font:800 19px/1.15 var(--f-display,Georgia,serif);letter-spacing:.01em\">Bengal Gazette<\/b><span class=\"n\">James Augustus Hicky<\/span><small>India's first newspaper, 1780 ('Hicky's Bengal Gazette').<\/small><\/div><div style=\"background:var(--sheet);border-top:4px double var(--ink)\"><b style=\"font:800 19px/1.15 var(--f-display,Georgia,serif);letter-spacing:.01em\">New India<\/b><span class=\"n\">Annie Besant<\/span><small>Also Commonweal; she started the Home Rule League.<\/small><\/div><div style=\"background:var(--sheet);border-top:4px double var(--ink)\"><b style=\"font:800 19px/1.15 var(--f-display,Georgia,serif);letter-spacing:.01em\">Mooknayak<\/b><span class=\"n\">B. R. Ambedkar<\/span><small>Marathi fortnightly, 1920; also Bahishkrit Bharat.<\/small><\/div><div style=\"background:var(--sheet);border-top:4px double var(--ink)\"><b style=\"font:800 19px/1.15 var(--f-display,Georgia,serif);letter-spacing:.01em\">Sambad Kaumudi<\/b><span class=\"n\">Raja Ram Mohan Roy<\/span><small>Bengali weekly; also Mirat-ul-Akhbar in Persian.<\/small><\/div><div style=\"background:var(--sheet);border-top:4px double var(--ink)\"><b style=\"font:800 19px/1.15 var(--f-display,Georgia,serif);letter-spacing:.01em\">Rast Goftar<\/b><span class=\"n\">Dadabhai Naoroji<\/span><small>Gujarati paper, 1851.<\/small><\/div><div style=\"background:var(--sheet);border-top:4px double var(--ink)\"><b style=\"font:800 19px/1.15 var(--f-display,Georgia,serif);letter-spacing:.01em\">National Herald<\/b><span class=\"n\">Jawaharlal Nehru<\/span><small>Founded 1938.<\/small><\/div><div style=\"background:var(--sheet);border-top:4px double var(--ink)\"><b style=\"font:800 19px/1.15 var(--f-display,Georgia,serif);letter-spacing:.01em\">Amrita Bazar Patrika<\/b><span class=\"n\">Sisir Kumar Ghosh<\/span><small>Started with his brother Motilal Ghosh.<\/small><\/div><div style=\"background:var(--sheet);border-top:4px double var(--ink)\"><b style=\"font:800 19px/1.15 var(--f-display,Georgia,serif);letter-spacing:.01em\">Ghadar<\/b><span class=\"n\">Ghadar Party (Lala Har Dayal)<\/span><small>Published from San Francisco, 1913.<\/small><\/div><div style=\"background:var(--sheet);border-top:4px double var(--ink)\"><b style=\"font:800 19px/1.15 var(--f-display,Georgia,serif);letter-spacing:.01em\">Bombay Chronicle<\/b><span class=\"n\">Pherozeshah Mehta<\/span><small><\/small><\/div><div style=\"background:var(--sheet);border-top:4px double var(--ink)\"><b style=\"font:800 19px/1.15 var(--f-display,Georgia,serif);letter-spacing:.01em\">Hindu Patriot<\/b><span class=\"n\">Harish Chandra Mukherjee<\/span><small>Exposed the indigo planters.<\/small><\/div><\/div>","cap":"Pair the paper with its founder: Kesari–Tilak, Al-Hilal–Azad, Mooknayak–Ambedkar, Sambad Kaumudi–Ram Mohan Roy, New India–Annie Besant."},{"k":"tlfig","title":"When they started","rows":[[1780,"Bengal Gazette","Hicky · the first"],[1821,"Sambad Kaumudi","Ram Mohan Roy"],[1851,"Rast Goftar","Dadabhai Naoroji"],[1853,"Hindu Patriot","H. C. Mukherjee"],[1868,"Amrita Bazar Patrika","the Ghosh brothers"],[1881,"Kesari","Tilak"],[1903,"Indian Opinion","Gandhi, South Africa"],[1912,"Al-Hilal","Azad"],[1913,"Ghadar","San Francisco"],[1914,"New India","Annie Besant"],[1919,"Young India","Gandhi takes over"],[1920,"Mooknayak","Ambedkar"],[1938,"National Herald","Nehru"]],"cap":"From Hicky's Bengal Gazette (1780) to Nehru's National Herald (1938)."},{"k":"trick","h":"Gandhi's four papers — <b>“Young Harijans Need Opinions”<\/b>: Young India, Harijan, Navjivan, Indian Opinion. <b>Tilak = K & M<\/b>: Kesari (Marathi), Mahratta (English)."},{"k":"trap","h":"<b>Anandamath<\/b> (Bankim) contains Vande Mataram; <b>Gitanjali<\/b> (Tagore) won the Nobel. <b>Al-Hilal<\/b> is Azad's; <b>Comrade<\/b> is Mohammad Ali's. <b>Discovery of India<\/b> and <b>Glimpses of World History<\/b> are both Nehru's — don't give one to Gandhi."}],"sum":["My Experiments with Truth and Hind Swaraj — Gandhi; Discovery of India and Glimpses of World History — Nehru.","Poverty and Un-British Rule — Dadabhai Naoroji; Gita Rahasya — Tilak; Anandamath — Bankim Chandra.","Neel Darpan — Dinabandhu Mitra; Gulamgiri — Jyotiba Phule; Annihilation of Caste — Ambedkar.","Kesari — Tilak; Young India and Harijan — Gandhi; Al-Hilal — Azad; Mooknayak — Ambedkar.","Hicky's Bengal Gazette (1780) was India's first newspaper."],"part":["Part 1 · Classics of India","भारत के शास्त्रीय ग्रंथ"],"g":"bk"},
{"id":"B4","heat":2,"title":"Hindi and regional literature, and pen names","hi":"हिंदी व क्षेत्रीय साहित्य और उपनाम","blocks":[{"k":"hot","h":"Hindi classics (<b>Godan, Kamayani, Madhushala, Rashmirathi, Bharat Bharati, Maila Aanchal, Raag Darbari<\/b>), famous regional novels, and <b>real names behind pen names<\/b> (Premchand, Nirala, Dinkar, Gulzar) appear regularly."},{"k":"story","h":"<p>Hindi writing grew up in a hundred years. <b>Bharatendu Harishchandra<\/b> is its father. <b>Premchand<\/b> wrote of villages and farmers (Godan); the <b>Chhayavad<\/b> poets — Prasad, Nirala, Pant, Mahadevi — made Hindi poetry lyrical; <b>Dinkar<\/b> roared with national pride; <b>Bachchan<\/b> sang the Madhushala.<\/p><p>Many writers are better known by a <b>pen name<\/b>: Dhanpat Rai is Premchand, Suryakant Tripathi is Nirala, Sampooran Singh Kalra is Gulzar. And every language has its landmark — Bengali Devdas and Pather Panchali, Malayalam Chemmeen, Kannada Samskara, Marathi Yayati.<\/p>","key":"Godan — Premchand; Kamayani — Prasad; Madhushala — Bachchan; Rashmirathi — Dinkar; Bharat Bharati — Maithili Sharan Gupt."},{"k":"photos","title":"Writers in pictures","items":[["Premchand","Premchand","Godan"],["Jaishankar_Prasad","Jaishankar Prasad","Kamayani"],["Suryakant_Tripathi_'Nirala'","Nirala","Saroj Smriti"],["Ramdhari_Singh_Dinkar","Dinkar","Rashmirathi"],["Mahadevi_Varma","Mahadevi Varma","Yama"],["Gulzar","Gulzar","Lyricist and poet"],["Kuvempu","Kuvempu","Kannada"],["Ghalib","Mirza Ghalib","Urdu ghazals"]]},{"k":"table","title":"Books and authors","head":["Book","Author","Note"],"rows":[["Godan","Premchand","His last complete novel (1936); also Gaban, Nirmala, Rangbhoomi."],["Kamayani","Jaishankar Prasad","Epic poem, a pillar of Chhayavad."],["Madhushala","Harivansh Rai Bachchan","'The Tavern' — 135 quatrains."],["Rashmirathi","Ramdhari Singh Dinkar","Karna's story; Dinkar won the Jnanpith for Urvashi."],["Bharat Bharati","Maithili Sharan Gupt","He was called 'Rashtrakavi' by Gandhi."],["Yama","Mahadevi Varma","Won the Jnanpith (1982)."],["Maila Aanchal","Phanishwar Nath Renu","Regional novel set in Purnia, Bihar."],["Tamas","Bhisham Sahni","Partition novel; Sahitya Akademi 1975."],["Raag Darbari","Shrilal Shukla","Satire on village politics."],["Gunahon Ka Devta","Dharamvir Bharati","He also wrote the verse play Andha Yug."],["Pinjar","Amrita Pritam","Punjabi novel on Partition; she was the first woman to win the Sahitya Akademi Award."],["Jhootha Sach","Yashpal",""],["Shekhar: Ek Jeevani","Agyeya",""],["Chandrakanta","Devaki Nandan Khatri","Fantasy novel that made people learn Hindi to read it."],["Devdas","Sarat Chandra Chattopadhyay","Bengali novel; he also wrote Parineeta."],["Pather Panchali","Bibhutibhushan Bandyopadhyay","Bengali novel; filmed by Satyajit Ray."],["Chemmeen","Thakazhi Sivasankara Pillai","Malayalam novel of fishing folk."],["Samskara","U. R. Ananthamurthy","Kannada novel."],["Yayati","V. S. Khandekar","Marathi novel; Jnanpith 1974."],["Mrityunjay","Shivaji Sawant","Marathi novel on Karna."],["Kitne Pakistan","Kamleshwar","Sahitya Akademi 2003."],["Aadha Gaon","Rahi Masoom Raza",""],["Odakkuzhal","G. Sankara Kurup","Malayalam poems — won the first Jnanpith Award (1965)."],["Ramayana Darshanam","Kuvempu","Kannada epic; Jnanpith 1967."],["Naukar ki Kameez","Vinod Kumar Shukla","Hindi novel; the author won the 59th Jnanpith (2024)."]]},{"k":"table","title":"Pen names","head":["Known as","Real name","Note"],"rows":[["Premchand","Dhanpat Rai Srivastava",""],["Nirala","Suryakant Tripathi",""],["Dinkar","Ramdhari Singh",""],["Gulzar","Sampooran Singh Kalra",""],["Agyeya","Sachchidananda Hirananda Vatsyayan",""],["Firaq Gorakhpuri","Raghupati Sahay",""],["Kuvempu","K. V. Puttappa",""],["Nagarjun","Vaidyanath Mishra",""],["Sahir Ludhianvi","Abdul Hayee",""],["Kaifi Azmi","Athar Husain Rizvi",""],["Mirza Ghalib","Mirza Asadullah Baig Khan",""],["Bharatendu","Harishchandra","Father of modern Hindi literature."]]},{"k":"info","title":"Pen name → real name","html":"<div class=\"fam\"><div><small style=\"text-transform:uppercase;letter-spacing:.08em;font-size:10.5px\">known as<\/small><b style=\"font:700 20px/1.1 var(--f-display,Georgia,serif);color:var(--accent)\">Premchand<\/b><small>Dhanpat Rai Srivastava<\/small><\/div><div><small style=\"text-transform:uppercase;letter-spacing:.08em;font-size:10.5px\">known as<\/small><b style=\"font:700 20px/1.1 var(--f-display,Georgia,serif);color:var(--accent)\">Nirala<\/b><small>Suryakant Tripathi<\/small><\/div><div><small style=\"text-transform:uppercase;letter-spacing:.08em;font-size:10.5px\">known as<\/small><b style=\"font:700 20px/1.1 var(--f-display,Georgia,serif);color:var(--accent)\">Dinkar<\/b><small>Ramdhari Singh<\/small><\/div><div><small style=\"text-transform:uppercase;letter-spacing:.08em;font-size:10.5px\">known as<\/small><b style=\"font:700 20px/1.1 var(--f-display,Georgia,serif);color:var(--accent)\">Gulzar<\/b><small>Sampooran Singh Kalra<\/small><\/div><div><small style=\"text-transform:uppercase;letter-spacing:.08em;font-size:10.5px\">known as<\/small><b style=\"font:700 20px/1.1 var(--f-display,Georgia,serif);color:var(--accent)\">Agyeya<\/b><small>Sachchidananda Hirananda Vatsyayan<\/small><\/div><div><small style=\"text-transform:uppercase;letter-spacing:.08em;font-size:10.5px\">known as<\/small><b style=\"font:700 20px/1.1 var(--f-display,Georgia,serif);color:var(--accent)\">Firaq Gorakhpuri<\/b><small>Raghupati Sahay<\/small><\/div><div><small style=\"text-transform:uppercase;letter-spacing:.08em;font-size:10.5px\">known as<\/small><b style=\"font:700 20px/1.1 var(--f-display,Georgia,serif);color:var(--accent)\">Kuvempu<\/b><small>K. V. Puttappa<\/small><\/div><div><small style=\"text-transform:uppercase;letter-spacing:.08em;font-size:10.5px\">known as<\/small><b style=\"font:700 20px/1.1 var(--f-display,Georgia,serif);color:var(--accent)\">Nagarjun<\/b><small>Vaidyanath Mishra<\/small><\/div><div><small style=\"text-transform:uppercase;letter-spacing:.08em;font-size:10.5px\">known as<\/small><b style=\"font:700 20px/1.1 var(--f-display,Georgia,serif);color:var(--accent)\">Sahir Ludhianvi<\/b><small>Abdul Hayee<\/small><\/div><div><small style=\"text-transform:uppercase;letter-spacing:.08em;font-size:10.5px\">known as<\/small><b style=\"font:700 20px/1.1 var(--f-display,Georgia,serif);color:var(--accent)\">Kaifi Azmi<\/b><small>Athar Husain Rizvi<\/small><\/div><div><small style=\"text-transform:uppercase;letter-spacing:.08em;font-size:10.5px\">known as<\/small><b style=\"font:700 20px/1.1 var(--f-display,Georgia,serif);color:var(--accent)\">Mirza Ghalib<\/b><small>Mirza Asadullah Baig Khan<\/small><\/div><div><small style=\"text-transform:uppercase;letter-spacing:.08em;font-size:10.5px\">known as<\/small><b style=\"font:700 20px/1.1 var(--f-display,Georgia,serif);color:var(--accent)\">Bharatendu<\/b><small>Harishchandra · Father of modern Hindi literature.<\/small><\/div><\/div>","cap":"The four asked most: Premchand (Dhanpat Rai), Nirala (Suryakant Tripathi), Dinkar (Ramdhari Singh) and Gulzar (Sampooran Singh Kalra)."},{"k":"trick","h":"Chhayavad's four pillars — <b>“Pra-Ni-Pa-Ma”<\/b>: Prasad, Nirala, Pant, Mahadevi. First Jnanpith — <b>G. Sankara Kurup, Odakkuzhal (1965), Malayalam<\/b>."},{"k":"trap","h":"<b>Rashmirathi<\/b> is Dinkar's, but his Jnanpith was for <b>Urvashi<\/b>. <b>Devdas<\/b> is Sarat Chandra's (Bengali), not Premchand's. <b>Pinjar<\/b> is by Amrita Pritam (Punjabi). <b>Andha Yug<\/b> and <b>Gunahon Ka Devta<\/b> are both Dharamvir Bharati's."}],"sum":["Godan — Premchand; Kamayani — Jaishankar Prasad; Madhushala — Harivansh Rai Bachchan.","Rashmirathi — Dinkar; Bharat Bharati — Maithili Sharan Gupt; Maila Aanchal — Renu; Raag Darbari — Shrilal Shukla.","Devdas — Sarat Chandra; Pather Panchali — Bibhutibhushan; Pinjar — Amrita Pritam.","Premchand = Dhanpat Rai; Nirala = Suryakant Tripathi; Gulzar = Sampooran Singh Kalra.","The first Jnanpith (1965) went to G. Sankara Kurup for Odakkuzhal."],"part":["Part 2 · Modern Indian writing","आधुनिक भारतीय लेखन"],"g":"bk"},
{"id":"B5","heat":3,"title":"Indian writing in English","hi":"भारतीय अंग्रेज़ी लेखन","blocks":[{"k":"hot","h":"Very frequent: <b>Booker-winning Indians<\/b> (Rushdie, Arundhati Roy, Kiran Desai, Adiga), <b>R. K. Narayan's Malgudi<\/b>, <b>Mulk Raj Anand<\/b>, <b>Khushwant Singh<\/b>, <b>Vikram Seth<\/b>, <b>Amitav Ghosh<\/b>, <b>Jhumpa Lahiri<\/b> — and popular names like <b>Shobhaa De<\/b> and <b>Chetan Bhagat<\/b>."},{"k":"story","h":"<p>Indian English fiction began with three friends of the 1930s: <b>Mulk Raj Anand<\/b> (Untouchable), <b>R. K. Narayan<\/b> (the gentle town of Malgudi) and <b>Raja Rao<\/b> (Kanthapura). After Independence came <b>Khushwant Singh<\/b>'s Partition story Train to Pakistan.<\/p><p>In 1981 <b>Salman Rushdie<\/b>'s Midnight's Children won the Booker, and the world started reading India. <b>Arundhati Roy<\/b> (1997), <b>Kiran Desai<\/b> (2006) and <b>Aravind Adiga<\/b> (2008) followed. <b>Jhumpa Lahiri<\/b> won the Pulitzer, <b>V. S. Naipaul<\/b> the Nobel, and <b>Amitav Ghosh<\/b> became the first English writer to win the Jnanpith.<\/p>","key":"Booker Indians in order: Rushdie 1981, Roy 1997, Kiran Desai 2006, Adiga 2008."},{"k":"photos","title":"Writers in pictures","items":[["Salman_Rushdie","Salman Rushdie","Midnight's Children"],["Arundhati_Roy","Arundhati Roy","The God of Small Things"],["Kiran_Desai","Kiran Desai","The Inheritance of Loss"],["Aravind_Adiga","Aravind Adiga","The White Tiger"],["Vikram_Seth","Vikram Seth","A Suitable Boy"],["Amitav_Ghosh","Amitav Ghosh","The Shadow Lines"],["Jhumpa_Lahiri","Jhumpa Lahiri","Interpreter of Maladies"],["Mulk_Raj_Anand","Mulk Raj Anand","Untouchable"],["R._K._Narayan","R. K. Narayan","Malgudi Days"],["Raja_Rao","Raja Rao","Kanthapura"],["Khushwant_Singh","Khushwant Singh","Train to Pakistan"],["Ruskin_Bond","Ruskin Bond","The Room on the Roof"]]},{"k":"table","title":"Books and authors","head":["Book","Author","Note"],"rows":[["Midnight's Children","Salman Rushdie","Booker 1981; also the 'Booker of Bookers'."],["The God of Small Things","Arundhati Roy","Booker 1997."],["The Inheritance of Loss","Kiran Desai","Booker 2006."],["The White Tiger","Aravind Adiga","Booker 2008."],["A Suitable Boy","Vikram Seth","One of the longest English novels."],["The Shadow Lines","Amitav Ghosh","Ghosh was the first English-language writer to win the Jnanpith (2018)."],["Interpreter of Maladies","Jhumpa Lahiri","Pulitzer Prize for Fiction, 2000."],["Untouchable","Mulk Raj Anand","Also Coolie."],["Malgudi Days","R. K. Narayan","Stories set in the imaginary town of Malgudi; also The Guide."],["Kanthapura","Raja Rao","A village in the Gandhian movement."],["Train to Pakistan","Khushwant Singh","Partition novel."],["Delhi: A Novel","Khushwant Singh",""],["The Room on the Roof","Ruskin Bond","His first novel, written at 17."],["Five Point Someone","Chetan Bhagat","Filmed as 3 Idiots."],["The Immortals of Meluha","Amish Tripathi","First of the Shiva Trilogy."],["Sacred Games","Vikram Chandra",""],["Sultry Days","Shobhaa De",""],["A House for Mr Biswas","V. S. Naipaul","Naipaul won the Nobel Prize in Literature, 2001."],["Clear Light of Day","Anita Desai",""],["The Great Indian Novel","Shashi Tharoor","The Mahabharata retold as the freedom struggle."],["My Story","Kamala Das",""],["The Autobiography of an Unknown Indian","Nirad C. Chaudhuri",""],["Wise and Otherwise","Sudha Murty",""],["A Fine Balance","Rohinton Mistry",""],["The Palace of Illusions","Chitra Banerjee Divakaruni","The Mahabharata told by Draupadi."],["India After Gandhi","Ramachandra Guha","History of independent India."],["The Argumentative Indian","Amartya Sen","Essays; Sen won the Nobel in Economics, 1998."]]},{"k":"shelf","title":"The prize shelf","hue":200,"rows":[["Midnight's Children","Salman Rushdie","Booker"],["The God of Small Things","Arundhati Roy","Booker"],["The Inheritance of Loss","Kiran Desai","Booker"],["The White Tiger","Aravind Adiga","Booker"],["The Shadow Lines","Amitav Ghosh","Jnanpith"],["Interpreter of Maladies","Jhumpa Lahiri","Pulitzer"],["A House for Mr Biswas","V. S. Naipaul","Nobel"],["The Argumentative Indian","Amartya Sen","Nobel"]],"cap":"The badge shows the prize the book or its writer is remembered for."},{"k":"tlfig","title":"Booker winners of Indian origin","rows":[[1971,"V. S. Naipaul","In a Free State"],[1981,"Salman Rushdie","Midnight's Children"],[1997,"Arundhati Roy","The God of Small Things"],[2006,"Kiran Desai","The Inheritance of Loss"],[2008,"Aravind Adiga","The White Tiger"],[2022,"Geetanjali Shree","Tomb of Sand · International Booker"],[2025,"Banu Mushtaq","Heart Lamp · International Booker"]],"cap":"Five Booker Prizes (1971–2008), then two International Bookers for translated books: Hindi (2022) and Kannada (2025)."},{"k":"trick","h":"Booker years — <b>“81 Rushdie, 97 Roy, 06 Desai, 08 Adiga”<\/b>: <i>Rushdie Rolled Down Alleys<\/i>. Malgudi = <b>Narayan<\/b> (both have an 'a-l-g/n' music)."},{"k":"trap","h":"<b>Kiran Desai<\/b> (Inheritance of Loss, Booker) is the daughter of <b>Anita Desai<\/b> (Clear Light of Day). <b>Train to Pakistan<\/b> is Khushwant Singh, not Bhisham Sahni (Tamas). <b>Interpreter of Maladies<\/b> won the <b>Pulitzer<\/b>, not the Booker."}],"sum":["Midnight's Children — Rushdie (Booker 1981); The God of Small Things — Arundhati Roy (1997).","The Inheritance of Loss — Kiran Desai (2006); The White Tiger — Aravind Adiga (2008).","Untouchable — Mulk Raj Anand; Malgudi Days — R. K. Narayan; Kanthapura — Raja Rao; Train to Pakistan — Khushwant Singh.","A Suitable Boy — Vikram Seth; The Shadow Lines — Amitav Ghosh; Interpreter of Maladies — Jhumpa Lahiri (Pulitzer).","Sultry Days — Shobhaa De; Sacred Games — Vikram Chandra; Five Point Someone — Chetan Bhagat."],"part":["Part 2 · Modern Indian writing","आधुनिक भारतीय लेखन"],"g":"bk"},
{"id":"B6","heat":2,"title":"Autobiographies of leaders and public figures","hi":"नेताओं की आत्मकथाएँ","blocks":[{"k":"hot","h":"Asked often: <b>Wings of Fire<\/b>, <b>Long Walk to Freedom<\/b>, <b>Becoming<\/b>, <b>I Am Malala<\/b>, <b>Mein Kampf<\/b>, <b>My Experiments with Truth<\/b> (in B3), and books by Indian leaders like <b>Pranab Mukherjee, L. K. Advani, Natwar Singh, Kiran Bedi<\/b>."},{"k":"story","h":"<p>An autobiography is a life told by the person who lived it. <b>Kalam<\/b> told his journey from Rameswaram to the missile labs in Wings of Fire. <b>Mandela<\/b> wrote Long Walk to Freedom about 27 years in prison. <b>Malala<\/b> told how she was shot for going to school. <b>Michelle Obama<\/b>'s Becoming became one of the best-selling memoirs ever.<\/p><p>Indian leaders write too — Pranab Mukherjee's trilogy on his decades in politics, Advani's My Country My Life, and Prime Minister Modi's Exam Warriors for students.<\/p>","key":"Wings of Fire — Kalam; Long Walk to Freedom — Mandela; Becoming — Michelle Obama; I Am Malala — Malala."},{"k":"photos","title":"Who wrote them","items":[["A._P._J._Abdul_Kalam","A. P. J. Abdul Kalam","Wings of Fire"],["Nelson_Mandela","Nelson Mandela","Long Walk to Freedom"],["Barack_Obama","Barack Obama","Dreams from My Father"],["Michelle_Obama","Michelle Obama","Becoming"],["Malala_Yousafzai","Malala Yousafzai","I Am Malala"],["Bill_Clinton","Bill Clinton","My Life"],["Benazir_Bhutto","Benazir Bhutto","Daughter of the East"],["Indira_Gandhi","Indira Gandhi","My Truth"],["L._K._Advani","L. K. Advani","My Country My Life"],["Pranab_Mukherjee","Pranab Mukherjee","The Turbulent Years"],["Kiran_Bedi","Kiran Bedi","I Dare!"],["Narendra_Modi","Narendra Modi","Exam Warriors"]]},{"k":"table","title":"Books and authors","head":["Book","Author","Note"],"rows":[["Wings of Fire","A. P. J. Abdul Kalam","Autobiography, with Arun Tiwari."],["Ignited Minds","A. P. J. Abdul Kalam",""],["Long Walk to Freedom","Nelson Mandela",""],["Mein Kampf","Adolf Hitler",""],["Dreams from My Father","Barack Obama","Also The Audacity of Hope and A Promised Land."],["Becoming","Michelle Obama",""],["I Am Malala","Malala Yousafzai","Youngest Nobel laureate (Peace, 2014)."],["My Life","Bill Clinton",""],["Daughter of the East","Benazir Bhutto",""],["In the Line of Fire","Pervez Musharraf",""],["My Truth","Indira Gandhi",""],["My Country My Life","L. K. Advani",""],["The Turbulent Years","Pranab Mukherjee","Also The Dramatic Decade and The Coalition Years."],["I Dare!","Kiran Bedi","First woman IPS officer."],["Exam Warriors","Narendra Modi","Book for students on exam stress."],["One Life Is Not Enough","K. Natwar Singh",""],["I Do What I Do","Raghuram Rajan","Former RBI Governor."],["Matters of Discretion","I. K. Gujral",""],["The Story of My Life","Helen Keller","Deaf-blind author."],["Toward Freedom","Jawaharlal Nehru","Also called 'An Autobiography'."],["Lal Salaam","Smriti Irani","Her first novel (2021)."]]},{"k":"trick","h":"Kalam's books — <b>“Wings Ignite 2020”<\/b>: Wings of Fire, Ignited Minds, India 2020."},{"k":"trap","h":"<b>The Story of My Life<\/b> is Helen Keller's; <b>My Experiments with Truth<\/b> is Gandhi's. <b>My Truth<\/b> is Indira Gandhi's; <b>My Life<\/b> is Bill Clinton's. <b>Dreams from My Father<\/b> is Barack's; <b>Becoming<\/b> is Michelle's."}],"sum":["Wings of Fire and Ignited Minds — A. P. J. Abdul Kalam.","Long Walk to Freedom — Nelson Mandela; I Am Malala — Malala Yousafzai; Becoming — Michelle Obama.","Dreams from My Father — Barack Obama; My Life — Bill Clinton; Daughter of the East — Benazir Bhutto.","My Country My Life — L. K. Advani; The Turbulent Years — Pranab Mukherjee; One Life Is Not Enough — Natwar Singh.","I Dare! — Kiran Bedi; Exam Warriors — Narendra Modi; The Story of My Life — Helen Keller."],"part":["Part 2 · Modern Indian writing","आधुनिक भारतीय लेखन"],"g":"bk"},
{"id":"B7","heat":2,"title":"Books by sportspersons","hi":"खिलाड़ियों की पुस्तकें","blocks":[{"k":"hot","h":"A sports autobiography turns up most years: <b>Playing It My Way<\/b> (Sachin), <b>Straight from the Heart<\/b> (Kapil), <b>Sunny Days<\/b> (Gavaskar), <b>Unbreakable<\/b> (Mary Kom), <b>A Shot at History<\/b> (Bindra), <b>The Race of My Life<\/b> (Milkha)."},{"k":"story","h":"<p>Champions like to tell their own stories. <b>Sachin<\/b> called his Playing It My Way; <b>Kapil Dev<\/b> spoke Straight from the Heart; <b>Yuvraj<\/b> wrote about The Test of My Life — beating cancer. <b>Milkha Singh<\/b>'s The Race of My Life became the film Bhaag Milkha Bhaag, and <b>Abhinav Bindra<\/b> wrote A Shot at History about India's first individual Olympic gold.<\/p><p>Women champions too: <b>Mary Kom<\/b> — Unbreakable, <b>Saina Nehwal<\/b> — Playing to Win, <b>Sania Mirza<\/b> — Ace Against Odds, <b>P. T. Usha<\/b> — Golden Girl.<\/p>","key":"Titles often hint at the sport: 'Shot' — shooter Bindra; 'Ace' — tennis Sania; 'Race' — runner Milkha; '281' — Laxman's famous innings."},{"k":"photos","title":"Who wrote them","items":[["Sachin_Tendulkar","Sachin Tendulkar","Playing It My Way"],["Kapil_Dev","Kapil Dev","Straight from the Heart"],["Sunil_Gavaskar","Sunil Gavaskar","Sunny Days"],["Sourav_Ganguly","Sourav Ganguly","A Century Is Not Enough"],["Yuvraj_Singh","Yuvraj Singh","The Test of My Life"],["V._V._S._Laxman","V. V. S. Laxman","281 and Beyond"],["Milkha_Singh","Milkha Singh","The Race of My Life"],["P._T._Usha","P. T. Usha","Golden Girl"],["M._C._Mary_Kom","M. C. Mary Kom","Unbreakable"],["Saina_Nehwal","Saina Nehwal","Playing to Win"],["Sania_Mirza","Sania Mirza","Ace Against Odds"],["Abhinav_Bindra","Abhinav Bindra","A Shot at History"]]},{"k":"table","title":"Books and authors","head":["Book","Author","Note"],"rows":[["Playing It My Way","Sachin Tendulkar","Autobiography, 2014."],["Straight from the Heart","Kapil Dev",""],["Sunny Days","Sunil Gavaskar","He also wrote Idols and One-Day Wonders."],["A Century Is Not Enough","Sourav Ganguly",""],["The Test of My Life","Yuvraj Singh","About beating cancer."],["281 and Beyond","V. V. S. Laxman","Named after his 281 against Australia (2001)."],["The Race of My Life","Milkha Singh","Basis of the film Bhaag Milkha Bhaag."],["Golden Girl","P. T. Usha",""],["Unbreakable","M. C. Mary Kom",""],["Playing to Win","Saina Nehwal",""],["Ace Against Odds","Sania Mirza",""],["A Shot at History","Abhinav Bindra","India's first individual Olympic gold (2008)."],["Goal","Dhyan Chand","Autobiography of the hockey wizard."],["Mind Master","Viswanathan Anand",""],["Controversially Yours","Shoaib Akhtar",""],["Open","Andre Agassi",""],["No Spin","Shane Warne",""],["Imperfect","Sanjay Manjrekar",""],["I Am Zlatan","Zlatan Ibrahimović",""],["The Greatest: My Own Story","Muhammad Ali",""]]},{"k":"shelf","title":"The sports shelf","hue":120,"rows":[["Playing It My Way","Sachin Tendulkar",""],["Straight from the Heart","Kapil Dev",""],["Sunny Days","Sunil Gavaskar",""],["A Century Is Not Enough","Sourav Ganguly",""],["The Test of My Life","Yuvraj Singh",""],["281 and Beyond","V. V. S. Laxman",""],["The Race of My Life","Milkha Singh",""],["Golden Girl","P. T. Usha",""],["Unbreakable","M. C. Mary Kom",""],["Playing to Win","Saina Nehwal",""],["Ace Against Odds","Sania Mirza",""],["A Shot at History","Abhinav Bindra",""],["Goal","Dhyan Chand",""],["Mind Master","Viswanathan Anand",""]],"cap":"Match the title to the player: the titles often hint at the career — 281 and Beyond (Laxman's 281), The Race of My Life (Milkha), Golden Girl (P. T. Usha)."},{"k":"trick","h":"Read the title as a clue: <b>Ace<\/b> (tennis), <b>Shot<\/b> (shooting), <b>Race<\/b> (track), <b>Goal<\/b> (hockey), <b>281<\/b> (Laxman's score), <b>Mind<\/b> (chess — Anand)."},{"k":"trap","h":"<b>Sunny Days<\/b> is Gavaskar's (nickname Sunny), not Sourav's. <b>Unbreakable<\/b> is Mary Kom's. <b>Playing to Win<\/b> (Saina) vs <b>Playing It My Way<\/b> (Sachin) — mind the words."}],"sum":["Playing It My Way — Sachin Tendulkar; Straight from the Heart — Kapil Dev; Sunny Days — Sunil Gavaskar.","A Century Is Not Enough — Sourav Ganguly; The Test of My Life — Yuvraj Singh; 281 and Beyond — V. V. S. Laxman.","The Race of My Life — Milkha Singh; Golden Girl — P. T. Usha; Goal — Dhyan Chand.","Unbreakable — Mary Kom; Playing to Win — Saina Nehwal; Ace Against Odds — Sania Mirza.","A Shot at History — Abhinav Bindra; Mind Master — Viswanathan Anand."],"part":["Part 3 · The world and recent books","विश्व और हाल की पुस्तकें"],"g":"bk"},
{"id":"B8","heat":2,"title":"World classics and great thinkers","hi":"विश्व क्लासिक और विचारक","blocks":[{"k":"hot","h":"Classic pairs keep coming back: <b>Das Kapital, Wealth of Nations, Origin of Species, The Prince, The Republic, Social Contract, Animal Farm, War and Peace, Hamlet, A Brief History of Time, The Alchemist<\/b>."},{"k":"story","h":"<p>Some books changed how the world thinks. <b>Plato's Republic<\/b> and <b>Aristotle's Politics<\/b> began political philosophy; <b>Machiavelli<\/b>'s The Prince taught rulers to be practical; <b>Rousseau<\/b>'s Social Contract inspired the French Revolution. In economics, <b>Adam Smith<\/b> argued for free markets in The Wealth of Nations (1776), <b>Karl Marx<\/b> answered with Das Kapital, and <b>Keynes<\/b> rescued the 1930s with his General Theory. <b>Darwin<\/b>'s Origin of Species (1859) changed biology.<\/p><p>And then the great stories — Homer's Iliad, Shakespeare's plays, Tolstoy's War and Peace, Dickens's Oliver Twist, Orwell's Animal Farm — and modern favourites like The Alchemist and Harry Potter.<\/p>","key":"Economics: Smith (Wealth of Nations), Marx (Das Kapital), Keynes (General Theory). Politics: Plato, Aristotle, Machiavelli, Rousseau, Hobbes."},{"k":"photos","title":"Writers and thinkers in pictures","items":[["William_Shakespeare","William Shakespeare","Hamlet"],["Leo_Tolstoy","Leo Tolstoy","War and Peace"],["Fyodor_Dostoevsky","Fyodor Dostoevsky","Crime and Punishment"],["Victor_Hugo","Victor Hugo","Les Misérables"],["Charles_Dickens","Charles Dickens","Oliver Twist"],["George_Orwell","George Orwell","Animal Farm"],["Homer","Homer","Iliad"],["Dante_Alighieri","Dante Alighieri","The Divine Comedy"],["Miguel_de_Cervantes","Miguel de Cervantes","Don Quixote"],["John_Milton","John Milton","Paradise Lost"],["Johann_Wolfgang_von_Goethe","Johann Wolfgang von Goethe","Faust"],["Jane_Austen","Jane Austen","Pride and Prejudice"],["Mark_Twain","Mark Twain","The Adventures of Tom Sawyer"],["Ernest_Hemingway","Ernest Hemingway","The Old Man and the Sea"],["Karl_Marx","Karl Marx","Das Kapital"],["Adam_Smith","Adam Smith","The Wealth of Nations"]]},{"k":"table","title":"Books and authors","head":["Book","Author","Note"],"rows":[["Hamlet","William Shakespeare","Also Macbeth, Othello, King Lear, Romeo and Juliet, The Merchant of Venice."],["War and Peace","Leo Tolstoy","Also Anna Karenina."],["Crime and Punishment","Fyodor Dostoevsky",""],["Les Misérables","Victor Hugo",""],["Oliver Twist","Charles Dickens","Also A Tale of Two Cities, David Copperfield."],["Animal Farm","George Orwell","Also Nineteen Eighty-Four; Orwell was born in Motihari, Bihar."],["Iliad","Homer","Also the Odyssey."],["The Divine Comedy","Dante Alighieri",""],["Don Quixote","Miguel de Cervantes",""],["Paradise Lost","John Milton",""],["Faust","Johann Wolfgang von Goethe",""],["Pride and Prejudice","Jane Austen",""],["The Adventures of Tom Sawyer","Mark Twain",""],["The Old Man and the Sea","Ernest Hemingway","Pulitzer 1953."],["Das Kapital","Karl Marx","With Engels he also wrote The Communist Manifesto (1848)."],["The Wealth of Nations","Adam Smith","1776 — Smith is the father of economics."],["On the Origin of Species","Charles Darwin","1859 — natural selection."],["The Prince","Niccolò Machiavelli",""],["The Republic","Plato",""],["Politics","Aristotle",""],["The Social Contract","Jean-Jacques Rousseau",""],["Utopia","Thomas More",""],["One Hundred Years of Solitude","Gabriel García Márquez",""],["Harry Potter series","J. K. Rowling",""],["The Alchemist","Paulo Coelho","Brazilian novelist."],["The Da Vinci Code","Dan Brown",""],["A Brief History of Time","Stephen Hawking",""],["Sapiens","Yuval Noah Harari",""],["Gulliver's Travels","Jonathan Swift",""],["Robinson Crusoe","Daniel Defoe",""],["Pygmalion","George Bernard Shaw",""],["Silent Spring","Rachel Carson","Started the modern environmental movement (1962)."],["To Kill a Mockingbird","Harper Lee",""],["Alice's Adventures in Wonderland","Lewis Carroll",""],["Leviathan","Thomas Hobbes",""],["The General Theory of Employment, Interest and Money","John Maynard Keynes",""],["Uncle Tom's Cabin","Harriet Beecher Stowe",""]]},{"k":"cards","title":"Thinkers and their one big book","rows":[["Karl Marx","Das Kapital","Communism","⚒️"],["Adam Smith","The Wealth of Nations","Father of economics","💰"],["Charles Darwin","On the Origin of Species","Evolution","🐢"],["Niccolò Machiavelli","The Prince","Power politics","🦁"],["Plato","The Republic","The ideal state","🏛️"],["Rousseau","The Social Contract","'Man is born free'","📜"],["Thomas Hobbes","Leviathan","The strong state","🐋"],["J. M. Keynes","The General Theory","Government spending","📈"],["Rachel Carson","Silent Spring","The environment","🌱"]]},{"k":"trick","h":"<b>Smith before Marx before Keynes<\/b> — 1776, 1867, 1936: capitalism, its critique, its repair. <b>George Orwell was born in India<\/b> (Motihari, Bihar) — a favourite twist."},{"k":"trap","h":"<b>The Republic<\/b> is Plato's; <b>Politics<\/b> is Aristotle's. <b>Utopia<\/b> is Thomas More's; <b>Leviathan<\/b> is Hobbes's. <b>Les Misérables<\/b> is Victor Hugo, not Dumas. <b>The Communist Manifesto<\/b> was Marx with Engels."}],"sum":["Hamlet — Shakespeare; War and Peace — Tolstoy; Oliver Twist — Dickens; Les Misérables — Victor Hugo.","Animal Farm and Nineteen Eighty-Four — Orwell; The Old Man and the Sea — Hemingway.","Das Kapital — Marx; The Wealth of Nations — Adam Smith; General Theory — Keynes.","The Republic — Plato; Politics — Aristotle; The Prince — Machiavelli; The Social Contract — Rousseau.","Origin of Species — Darwin; A Brief History of Time — Hawking; The Alchemist — Paulo Coelho."],"part":["Part 3 · The world and recent books","विश्व और हाल की पुस्तकें"],"g":"bk"},
{"id":"B9","heat":3,"title":"Recent books and prize-winners (2022–2026)","hi":"हाल की पुस्तकें और पुरस्कार विजेता","blocks":[{"k":"hot","h":"Current affairs questions ask about <b>new books and prize winners<\/b>: International Booker (Heart Lamp 2025, Taiwan Travelogue 2026), Booker (Flesh 2025), Sahitya Akademi 2025, and memoirs like <b>Knife<\/b>, <b>Spare<\/b>, <b>Mother Mary Comes to Me<\/b>."},{"k":"story","h":"<p>Two Indian books made history in the International Booker: <b>Geetanjali Shree<\/b>'s Tomb of Sand (2022) became the first Hindi winner, and <b>Banu Mushtaq<\/b>'s Heart Lamp (2025) the first Kannada winner — both shared with their translators, Daisy Rockwell and Deepa Bhasthi. In 2026 the prize went to <b>Taiwan Travelogue<\/b>, the first winner translated from Mandarin.<\/p><p>Meanwhile <b>Salman Rushdie<\/b> wrote Knife about surviving a stabbing, <b>Arundhati Roy<\/b> wrote her first memoir, and the Sahitya Akademi's 2025 awards (announced in March 2026) went to <b>Navtej Sarna<\/b> (English) and <b>Mamta Kalia<\/b> (Hindi).<\/p>","key":"International Booker: 2022 Tomb of Sand (Hindi), 2025 Heart Lamp (Kannada), 2026 Taiwan Travelogue. Booker: 2025 Flesh (David Szalay)."},{"k":"photos","title":"In pictures","items":[["Banu_Mushtaq","Banu Mushtaq","Heart Lamp · 2025"],["Geetanjali_Shree","Geetanjali Shree","Tomb of Sand · 2022"],["Samantha_Harvey","Samantha Harvey","Orbital · 2024"],["Paul_Lynch_(writer)","Paul Lynch","Prophet Song · 2023"],["Shehan_Karunatilaka","Shehan Karunatilaka","Seven Moons · 2022"],["Salman_Rushdie","Salman Rushdie","Knife · 2024"],["S._Jaishankar","S. Jaishankar","Why Bharat Matters"],["Arundhati_Roy","Arundhati Roy","Mother Mary Comes to Me"]]},{"k":"table","title":"Books and authors (as of October 2026)","head":["Book","Author","Note"],"rows":[["Heart Lamp","Banu Mushtaq","Kannada stories, translated by Deepa Bhasthi — International Booker 2025, the first for a Kannada book."],["Tomb of Sand (Ret Samadhi)","Geetanjali Shree","Translated by Daisy Rockwell — International Booker 2022, the first for a Hindi book."],["Taiwan Travelogue","Yáng Shuāng-zǐ","Translated by Lin King — International Booker 2026."],["Kairos","Jenny Erpenbeck","German novel — International Booker 2024."],["Flesh","David Szalay","Booker Prize 2025."],["Orbital","Samantha Harvey","Booker Prize 2024."],["Prophet Song","Paul Lynch","Booker Prize 2023."],["The Seven Moons of Maali Almeida","Shehan Karunatilaka","Sri Lankan writer — Booker Prize 2022."],["Knife","Salman Rushdie","Memoir (2024) about surviving the 2022 attack on him."],["Spare","Prince Harry","Memoir, 2023."],["Why Bharat Matters","S. Jaishankar","2024; his earlier book was The India Way (2020)."],["Mother Mary Comes to Me","Arundhati Roy","Memoir about her mother (2025)."],["The Presidential Years","Pranab Mukherjee","Last volume of his memoirs (2021)."],["The Light We Carry","Michelle Obama","2022."],["Crimson Spring","Navtej Sarna","English novel — Sahitya Akademi Award 2025 (announced March 2026)."],["Jeete Jee Allahabad","Mamta Kalia","Hindi memoir — Sahitya Akademi Award 2025."],["Spirit Nights","Easterine Kire","English — Sahitya Akademi Award 2024."]]},{"k":"tlfig","title":"The Booker and the International Booker, 2022–2026","rows":[[2025,"Banu Mushtaq","Heart Lamp · Intl"],[2022,"Geetanjali Shree","Tomb of Sand (Ret Samadhi) · Intl"],[2026,"Yáng Shuāng-zǐ","Taiwan Travelogue · Intl"],[2024,"Jenny Erpenbeck","Kairos · Intl"],[2025,"David Szalay","Flesh"],[2024,"Samantha Harvey","Orbital"],[2023,"Paul Lynch","Prophet Song"],[2022,"Shehan Karunatilaka","The Seven Moons of Maali Almeida"]],"cap":"International Booker: Tomb of Sand (2022, Hindi) and Heart Lamp (2025, Kannada) are the two Indian wins. The Booker itself: Karunatilaka (2022), Lynch, Harvey, Szalay."},{"k":"shelf","title":"On the new-books table","hue":280,"rows":[["Heart Lamp","Banu Mushtaq","Intl Booker"],["Tomb of Sand","Geetanjali Shree","Intl Booker"],["Taiwan Travelogue","Yáng const labRanks = () => LAB_CONF.ranks || LAB_RANKS_DEF;
function labRank(xp){ const R = labRanks(); let r = R[0]; R.forEach(x => { if (xp >= x[0]) r = x; }); const nx = R.find(x => x[0] > xp); return { r, nx }; }

function leaveLab(){ labStop(); LAB.view = "home"; }
function labStop(){ if (LAB.timer) { clearInterval(LAB.timer); LAB.timer = null; } }

/* ---------- home ---------- */
function renderLab(){

  const { r, nx } = labRank(L.xp || 0);
  const pct = nx ? Math.round(((L.xp || 0) - r[0]) * 100 / (nx[0] - r[0])) : 100;
  const card = d => `<button type="button" class="lab-g" data-lab-play="${d.id}"><span class="t"><span aria-hidden="true">${d.ico}</span><b>${esc(d.title)}</b></span><small>${esc(d.sub)}</small><span class="best">${L.best[d.id] ? "Best: " + L.best[d.id] : "Not played yet"}</span></button>`;

    <div class="block"><h3>How to use the Lab</h3><p class="muted" style="margin:0">Read a lesson first, then play its game until you can answer in about three seconds — that is the speed the exam needs. Each game lasts 60 seconds: right answers in a row build a combo for bonus points. Tap <b>See all pairs</b> on a game to revise its list.</p></div>

<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>

<title>World Geography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Shared by every History page (built by tools/history/build.js).
   Layout: a manuscript folio — parchment paper, maroon ink, gold figures; one-column app with a bottom tab bar. */
:root{
  --paper:#f3efe4; --sheet:#fffdf6; --sunk:#e8e1cf;
  --ink:#241c14; --ink2:#5d5141; --rule:#d8cdb4;
  --blue:#7a2230; --on-blue:#ffffff; --blue-bg:#f4e2e1;
  --accent:#9a6a12; --accent-bg:#f8ecc9;
  --good:#1b6b4a; --good-bg:#ddefe4; --bad:#a8291f; --bad-bg:#f8e0dc;
  --warn-bg:#fcf0cf;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* era groups on the Learn screen */
.eras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.erac{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:grid;gap:6px}
.erac b{font-family:var(--f-display);font-size:15px;font-weight:700;line-height:1.25}
.erac .hi{font-size:12px;color:var(--ink2)}
.erac .mt{font-family:var(--f-num);font-size:11px;color:var(--ink2)}
.erac .meter{height:6px}
.erac[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.grph{display:flex;align-items:baseline;gap:8px;padding:14px 2px 4px;border-top:2px solid var(--ink);margin-top:4px}
.grph h2{font-size:17px}
.grph span{font-size:12px;color:var(--ink2);margin-left:auto;font-family:var(--f-num)}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}
.dots{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--rule);display:block}
.dots i.on{background:var(--accent)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.hot{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px;font-size:15px}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.facts.prose dd{font-weight:400;line-height:1.55}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap,.link{border-radius:var(--r);padding:12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.link{background:var(--sunk);border-color:transparent}
.trick .lab,.trap .lab,.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.link .lab{color:var(--ink2)}
.mn{font-family:var(--f-num);font-weight:600;background:var(--sheet);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.tag.src{background:var(--good-bg);color:var(--good)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:22px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
/* one-line revision rows (last week / last moment) */
.lines{display:grid;gap:0}
.lines div{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px dashed var(--rule);font-size:15px}
.lines div:first-child{border-top:0}
.lines b{font-weight:700}
.lines span{color:var(--ink2)}
.callout{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;font-size:15px}

/* plan maker */
.plancfg{display:grid;gap:12px}
.pday{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.pday > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pday > summary::-webkit-details-marker{display:none}
.pday .dno{font-family:var(--f-num);font-weight:700;font-size:13px;background:var(--sunk);border-radius:99px;padding:2px 10px;white-space:nowrap}
.pday.cur .dno{background:var(--blue);color:var(--on-blue)}
.pday.allgood .dno{background:var(--good-bg);color:var(--good)}
.pday .dt{min-width:0;font-weight:600;font-size:15px}
.pday .dt small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
.pday .dp{font-family:var(--f-num);font-size:12px;color:var(--ink2);white-space:nowrap}
.pday .body{padding:0 14px 12px;display:grid;gap:8px;border-top:1px dashed var(--rule);margin-top:2px;padding-top:10px}
.ptask{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;width:100%;font-size:15px}
.ptask .box{width:22px;height:22px;border-radius:6px;border:1.6px solid var(--rule);display:grid;place-items:center;font-size:14px;color:var(--on-blue);margin-top:1px}
.ptask[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.ptask[aria-pressed="true"] .lbl{text-decoration:line-through;color:var(--ink2)}
.ptask .lbl small{display:block;font-size:12px;color:var(--ink2);text-decoration:none}
/* the story first: plain-language opener for beginners */
.story{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;font-size:16.5px;line-height:1.65}
.story .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.story p{margin:0}
.story .key{background:var(--blue-bg);border-radius:8px;padding:8px 12px;font-size:15px;line-height:1.5}
.story .key b{color:var(--blue)}
/* hub: app cards and the beginner path */
.appcs{display:grid;gap:12px}
.appc{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;text-align:left;width:100%;cursor:pointer}
.appc:hover{border-color:var(--blue)}
.appc .hd{display:flex;align-items:center;gap:10px}
.appc .ic{font-size:26px;line-height:1}
.appc .hd b{font-family:var(--f-display);font-size:17px;font-weight:700;display:block}
.appc .hd small{font-size:12px;color:var(--ink2)}

{"id":"W1","heat":3,"title":"Continents and oceans","hi":"महाद्वीप और महासागर","blocks":[{"k":"hot","h":"Asked again and again: <b>largest and smallest<\/b> continent and ocean, the <b>highest peak of each continent<\/b>, the <b>deepest point<\/b> (Mariana Trench) and the continent crossed by the <b>Equator and both Tropics<\/b> (Africa)."},{"k":"story","h":"<p>Earth has <b>seven continents<\/b>. Biggest to smallest: <b>Asia, Africa, North America, South America, Antarctica, Europe, Australia<\/b>. Asia holds about 30% of the land and 60% of the people. Africa has the most countries (54) and is the only continent cut by the Equator, the Tropic of Cancer and the Tropic of Capricorn. Antarctica is the coldest place — and the largest desert, because so little snow falls there.<\/p><p>Water covers about <b>71%<\/b> of the Earth. There are <b>five oceans<\/b>: <b>Pacific, Atlantic, Indian, Southern, Arctic<\/b>. The Pacific alone is bigger than all the land put together, and its <b>Mariana Trench<\/b> is the deepest point on Earth. The Indian Ocean is the only one named after a country.<\/p>","key":"Continents: Asia > Africa > N America > S America > Antarctica > Europe > Australia. Oceans: Pacific > Atlantic > Indian > Southern > Arctic."},{"k":"table","title":"Continents by area","head":["Continent","By area","Note"],"rows":[["Asia","the largest","About 30% of the world's land and about 60% of its people."],["Africa","the 2nd largest","54 countries — the most of any continent."],["North America","the 3rd largest",""],["South America","the 4th largest",""],["Antarctica","the 5th largest","Coldest, windiest and highest on average; no permanent people."],["Europe","the 6th largest",""],["Australia (Oceania)","the smallest","The island continent."]]},{"k":"table","title":"Highest peak of each continent","head":["Continent","Highest peak","Height and place"],"rows":[["Asia","Mount Everest","8,849 m — the highest point on Earth (Nepal–China border)."],["Africa","Mount Kilima pest point is in the <b>Pacific<\/b> (Mariana Trench), not the Atlantic. <b>Denali<\/b> (North America) and <b>Aconcagua<\/b> (South America) are often swapped."}],"sum":["Seven continents: Asia is the largest, Australia the smallest.","Africa has the most countries (54) and is crossed by the Equator and both Tropics.","Five oceans: Pacific (largest, deepest), Atlantic, Indian, Southern, Arctic (smallest).","Highest peaks: Everest (Asia), Aconcagua (S America), Denali (N America), Kilimanjaro (Africa), Elbrus (Europe).","Russia is the largest country, Vatican City the smallest, India the most populous."],"part":["Part 1 · Continents and countries","महाद्वीप और देश"],"g":"wg"},
{"id":"W2","heat":3,"title":"Countries and capitals","hi":"देश और राजधानियाँ","blocks":[{"k":"hot","h":"Every paper has one: <b>“What is the capital of X?”<\/b> SSC loves the trick ones — where the biggest city is <b>not<\/b> the capital: Australia (Canberra), Canada (Ottawa), Turkey (Ankara), Brazil (Brasília), Nigeria (Abuja), Myanmar (Naypyidaw), Switzerland (Bern)."},{"k":"story","h":"<p>Some countries built a brand-new capital away from the old big city. <b>Brazil<\/b> moved from Rio de Janeiro to <b>Brasília<\/b> in 1960. <b>Nigeria<\/b> moved from Lagos to <b>Abuja<\/b> in 1991. <b>Myanmar<\/b> moved from Yangon to <b>Naypyidaw<\/b> in 2005–06. <b>Australia<\/b> built <b>Canberra<\/b> because Sydney and Melbourne could not agree.<\/p><p>Some countries have <b>more than one capital<\/b>. <b>South Africa<\/b> has three: Pretoria (government), Cape Town (Parliament) and Bloemfontein (courts). <b>Bolivia<\/b> has Sucre (constitution) and La Paz (government). Kazakhstan's capital <b>Astana<\/b> was called Nur-Sultan from 2019 to 2022.<\/p>","key":"Big city is not the capital: Sydney→Canberra, Toronto→Ottawa, Istanbul→Ankara, Rio→Brasília, Lagos→Abuja, Yangon→Naypyidaw, Zurich→Bern."},{"k":"table","title":"Countries and capitals","head":["Country","Capital","Note"],"rows":[["Afghanistan","Kabul",""],["Nepal","Kathmandu",""],["Bhutan","Thimphu",""],["Bangladesh","Dhaka",""],["Myanmar","Naypyidaw","Took over from Yangon (Rangoon) in 2005–06."],["the Maldives","Malé",""],["China","Beijing",""],["Japan","Tokyo",""],["South Korea","Seoul",""],["North Korea","Pyongyang",""],["Mongolia","Ulaanbaatar",""],["Thailand","Bangkok",""],["Vietnam","Hanoi",""],["Cambodia","Phnom Penh",""],["Laos","Vientiane",""],["the Philippines","Manila",""],["Kazakhstan","Astana","Called Nur-Sultan from 2019 to 2022."],["Uzbekistan","Tashkent",""],["Tajikistan","Dushanbe",""],["Kyrgyzstan","Bishkek",""],["Turkmenistan","Ashgabat",""],["Iran","Tehran",""],["Iraq","Baghdad","On the Tigris."],["Saudi Arabia","Riyadh",""],["the United Arab Emirates","Abu Dhabi","Not Dubai."],["Qatar","Doha",""],["Oman","Muscat",""],["Jordan","Amman",""],["Syria","Damascus","One of the oldest lived-in cities."],["Turkey (Türkiye)","Ankara","Not Istanbul."],["Russia","Moscow",""],["Ukraine","Kyiv",""],["Germany","Berlin",""],["Switzerland","Bern","Not Zurich or Geneva."],["Canada","Ottawa","Not Toronto."],["Brazil","Brasília","Took over from Rio de Janeiro in 1960."],["Argentina","Buenos Aires",""],["Chile","Santiago",""],["Peru","Lima",""],["Colombia","Bogotá",""],["Venezuela","Caracas",""],["Cuba","Havana",""],["Australia","Canberra","Not Sydney."],["New Zealand","Wellington",""],["Egypt","Cairo",""],["Nigeria","Abuja","Took over from Lagos in 1991."],["Kenya","Nairobi",""],["Ethiopia","Addis Ababa","Headquarters of the African Union."],["Ghana","Accra",""],["Morocco","Rabat",""],["Tanzania","Dodoma","Dar es Salaam is the biggest city."],["Côte d'Ivoire","Yamoussoukro","Abidjan is the biggest city."]]},{"k":"facts","title":"Two or three capitals (and new capitals)","rows":[["South Africa","Pretoria (executive), Cape Town (legislative), Bloemfontein (judicial)"],["Bolivia","Sucre (constitutional) and La Paz (seat of government — the world's highest capital city)"],["Netherlands","Amsterdam is the capital; the government sits in The Hague"],["Sri Lanka","Sri Jayawardenepura Kotte (official); Colombo is the commercial capital"],["Malaysia","Kuala Lumpur; government offices in Putrajaya"],["Indonesia","Jakarta; a new capital, Nusantara, is being built on Borneo (move not complete as of 2026)"]]},{"k":"trick","h":"<b>“COAB BAN”<\/b> — <b>C<\/b>anberra, <b>O<\/b>ttawa, <b>A<\/b>nkara, <b>B<\/b>rasília, <b>B<\/b>ern, <b>A<\/b>buja, <b>N<\/b>aypyidaw: seven capitals that are not the biggest city. Picture Sydney, Toronto, Istanbul, Rio, Zurich, Lagos and Yangon crossed out on the map."},{"k":"trap","h":"UAE → <b>Abu Dhabi<\/b> (not Dubai). Turkey → <b>Ankara<\/b> (not Istanbul). Swit {"id":"W3","heat":3,"title":"Countries and currencies","hi":"देश और मुद्राएँ","blocks":[{"k":"hot","h":"A sure question: <b>“The currency of X is:”<\/b> — especially India's neighbours (Taka, Ngultrum, Rufiyaa, Kyat, Afghani) and the odd names (Rand, Ringgit, Baht, Won, Real)."},{"k":"story","h":"<p>Start with India's neighbours. Bangladesh uses the <b>Taka<\/b>, Bhutan the <b>Ngultrum<\/b> (tied one-to-one to the Indian rupee), Myanmar the <b>Kyat<\/b>, Maldives the <b>Rufiyaa<\/b> and Afghanistan the <b>Afghani<\/b>. Pakistan, Nepal and Sri Lanka all use a <b>Rupee<\/b>. Indonesia's <b>Rupiah<\/b> sounds similar but is a different word.<\/p><p>Many names come in families. <b>Dinar<\/b>: Kuwait, Iraq, Jordan, Bahrain, Algeria, Serbia. <b>Riyal / Rial<\/b>: Saudi Arabia, Qatar, Iran, Oman. <b>Peso<\/b>: Mexico, Argentina, Philippines, Chile. <b>Krona / Krone<\/b>: Sweden, Norway, Denmark. The <b>Euro<\/b> is shared by most of the European Union; Croatia joined in 2023 and Bulgaria in January 2026.<\/p>","key":"Neighbours: Taka, Ngultrum, Kyat, Rufiyaa, Afghani, Rupee. Families: Dinar, Riyal, Peso, Krona."},{"k":"table","title":"Countries and currencies","head":["Country","Currency","Note"],"rows":[["Japan","Yen",""],["China","Renminbi (Yuan)",""],["South Korea","Won",""],["Bangladesh","Taka",""],["Bhutan","Ngultrum","Pegged to the Indian rupee."],["Pakistan","Rupee",""],["Nepal","Rupee",""],["Sri Lanka","Rupee",""],["the Maldives","Rufiyaa",""],["Myanmar","Kyat",""],["Afghanistan","Afghani",""],["Indonesia","Rupiah",""],["Thailand","Baht",""],["Malaysia","Ringgit",""],["Vietnam","Dong",""],["the Philippines","Peso",""],["Mongolia","Tugrik",""],["Iran","Rial",""],["Saudi Arabia","Riyal",""],["the United Arab Emirates","Dirham",""],["Kuwait","Dinar",""],["Israel","Shekel",""],["Turkey (Türkiye)","Lira",""],["Russia","Rouble",""],["Ukraine","Hryvnia",""],["Poland","Zloty",""],["Hungary","Forint",""],["Sweden","Krona",""],["Norway","Krone",""],["the United Kingdom","Pound sterling",""],["Switzerland","Swiss franc",""],["Germany, France, Italy, Spain","Euro",""],["South Africa","Rand",""],["Nigeria","Naira",""],["Ghana","Cedi",""],["Kenya","Shilling",""],["Ethiopia","Birr",""],["Botswana","Pula",""],["Zambia","Kwacha",""],["Brazil","Real",""],["Mexico","Peso",""],["Venezuela","Bolívar",""],["Peru","Sol",""],["the United States","Dollar",""]]},{"k":"facts","title":"Currency families","rows":[["Rupee","India, Pakistan, Nepal, Sri Lanka, Mauritius, Seychelles"],["Dinar","Kuwait, Iraq, Jordan, Bahrain, Algeria, Tunisia, Serbia"],["Riyal / Rial","Saudi Arabia, Qatar (Riyal); Iran, Oman (Rial)"],["Peso","Mexico, Argentina, Chile, Colombia, Philippines, Cuba"],["Dollar","USA, Canada, Australia, New Zealand, Singapore"],["Euro","Most EU members — Germany, France, Italy, Spain…; Croatia from 2023, Bulgaria from 1 January 2026"],["Before the Euro","Italy — Lira; France — Franc; Germany — Deutsche Mark; Spain — Peseta"]]},{"k":"trick","h":"<b>“Ta-Ngu-Ky-Ru-Af”<\/b> — Taka, Ngultrum, Kyat, Rufiyaa, Afghani: Bangladesh, Bhutan, Myanmar, Maldives, Afghanistan — for Bangladesh, Bhutan, Myanmar, Maldives, Afghanistan. <b>R<\/b>and = <b>R<\/b>SA (South Africa)."},{"k":"trap","h":"<b>Rupiah<\/b> = Indonesia, <b>Rufiyaa<\/b> = Maldives, <b>Rupee<\/b> = India and neighbours. <b>Won<\/b> = Korea, <b>Yen<\/b> = Japan, <b>Yuan<\/b> = China. <b>Real<\/b> = Brazil; <b>Rial/Riyal<\/b> = Iran/Saudi. Turkey still uses the <b>Lira<\/b>; Italy's lira ended with the Euro."}],"sum":["India's neighbours: Taka (Bangladesh), Ngultrum (Bhutan), Kyat (Myanmar), Rufiyaa (Maldives), Afghani (Afghanistan).","Pakistan, Nepal and Sri Lanka use the Rupee; Indonesia uses the Rupiah.","Japan Yen, China Renminbi (Yuan), South Korea Won, Thailand Baht, Malaysia Ringgit.","Russia Rouble, UK Pound sterling, South Africa Rand, Brazil Real.","The Euro replaced the lira, franc and mark; Croatia joined in 2023 and Bulgaria in 2026."],"part":["Part 1 · Continents and countries","महाद्वीप और देश"],"g":"wg"},
{"id":"W4","heat":2,"title":"Parliaments and flags","hi":"संसद और ध्वज","blocks":[{"k":"hot","h":"<b>“The Parliament of X is called:”<\/b> — Diet (Japan), Knesset (Israel), Duma (Russia), Congress (USA), Jatiya Sangsad (Bangladesh), Majlis (Iran), Storting (Norway), Riksdag (Sweden). Flag questions are rarer: Nepal's non-rectangular flag is the favourite."},{"k":"story","h":"<p>Most parliaments have local names. In the USA it is the <b>Congress<\/b>; in Japan the <b>Diet<\/b>; in Russia the <b>Federal Assembly<\/b>, whose lower house is the <b>State Duma<\/b>. Israel's is the <b>Knesset<\/b>, Iran's the <b>Majlis<\/b> and Pakistan's the <b>Majlis-e-Shoora<\/b>. Bangladesh has the <b>Jatiya Sangsad<\/b>.<\/p><p>Northern Europe has the oldest: Iceland's <b>Althing<\/b> first met in 930 CE. Sweden has the <b>Riksdag<\/b>, Norway the <b>Storting<\/b>, Denmark the <b>Folketing<\/b>, Finland the <b>Eduskunta<\/b>, Poland the <b>Sejm<\/b> and Germany the <b>Bundestag<\/b>. China's top body is the <b>National People's Congress<\/b>.<\/p>","key":"Congress–USA, Diet–Japan, Duma–Russia, Knesset–Israel, Majlis–Iran, Storting–Norway, Riksdag–Sweden, Althing–Iceland."},{"k":"table","title":"Parliaments","head":["Country","Parliament","Note"],"rows":[["the United States","Congress","Senate + House of Representatives."],["Japan","Diet",""],["Russia","Federal Assembly (State Duma)","The Duma is the lower house."],["Israel","Knesset",""],["Iran","Majlis",""],["Pakistan","Majlis-e-Shoora",""],["Bangladesh","Jatiya Sangsad",""],["Nepal","Sanghiya Sansad (Federal Parliament)",""],["Bhutan","Chi Tshog (National Assembly: Tshogdu)","Old books give 'Tshogdu'."],["the Maldives","People's Majlis",""],["China","National People's Congress",""],["Mongolia","State Great Khural",""],["Germany","Bundestag","The lower house; the upper is the Bundesrat."],["Sweden","Riksdag",""],["Norway","Storting",""],["Denmark","Folketing",""],["Finland","Eduskunta",""],["Iceland","Althing","Among the oldest parliaments (930 CE)."],["Poland","Sejm",""],["Spain","Cortes Generales",""],["Ireland","Oireachtas (Dáil Éireann)",""],["the Netherlands","States General",""],["Ukraine","Verkhovna Rada",""],["Turkey (Türkiye)","Grand National Assembly",""],["Malaysia","Dewan Rakyat","The lower house of Parliament."]]},{"k":"table","title":"Flag clues","head":["What the flag shows","Country","Note"],"rows":[["The only national flag that is not a rectangle","Nepal","Two stacked triangles."],["A red maple leaf","Canada",""],["A green cedar tree","Lebanon",""],["A map of the island itself","Cyprus",""],["A red disc on white (Hinomaru)","Japan",""],["A thunder dragon","Bhutan",""],["A Star of David","Israel",""],["A rifle (AK-47)","Mozambique",""],["A square shape with a white cross","Switzerland","Vatican City's flag is also square."],["The oldest national flag in continuous use (Dannebrog)","Denmark",""],["A taegeuk (red-blue circle) with four trigrams","South Korea",""]]},{"k":"trick","h":"<b>“Dear Japan, Kind Israel, Duma Russia”<\/b> — Diet, Knesset, Duma. Nordic set, first letters of country and parliament: <b>“Sweet Raspberries, Nice Strawberries, Delicious Fruit, Fresh Eggs, Ice-cream Always”<\/b> → <b>S<\/b>weden–<b>R<\/b>iksdag, <b>N<\/b>orway–<b>S<\/b>torting, <b>D<\/b>enmark–<b>F<\/b>olketing, <b>F<\/b>inland–<b>E<\/b>duskunta, <b>I<\/b>celand–<b>A<\/b>lthing."},{"k":"trap","h":"<b>Majlis<\/b> (Iran) vs <b>Majlis-e-Shoora<\/b> (Pakistan) vs <b>People's Majlis<\/b> (Maldives). <b>Sejm<\/b> is Poland, not Sweden. <b>Bundestag<\/b> is Germany's lower house; <b>Bundesrat<\/b> is the upper house."}],"sum":["USA — Congress; Japan — Diet; Russia — Federal Assembly (State Duma); Israel — Knesset.","Iran — Majlis; Pakistan — Majlis-e-Shoora; Bangladesh — Jatiya Sangsad; Maldives — People's Majlis.","Sweden — Riksdag; Norway — Storting; Denmark — Folketing; Finland — Eduskunta; Poland — Sejm.","Iceland's Althing (930 CE) is among the oldest parliaments; Germany — Bundestag; China — National People's Congress.","Nepal has the only non-rectangular flag; Canada's flag has a maple leaf, Lebanon's a cedar tree."],"part":["Part 1 · Continents and countries","महाद्वीप और देश"],"g":"wg"},
{"id":"W5","heat":3,"title":"Mountains, peaks and ranges","hi":"पर्वत, चोटियाँ और श्रेणियाँ","blocks":[{"k":"hot","h":"Favourites: <b>Everest's height<\/b> (8,849 m), <b>K2 in the Karakoram<\/b>, the <b>longest range<\/b> (Andes), the <b>Ural<\/b> as the Europe–Asia line, <b>Kilimanjaro<\/b> in Tanzania and <b>Mont Blanc<\/b> in the Alps."},{"k":"story","h":"<p>The highest mountains are all in Asia. <b>Everest<\/b> (8,849 m) sits on the Nepal–China border; <b>K2<\/b> (8,611 m) is in the <b>Karakoram<\/b>; <b>Kangchenjunga<\/b> (8,586 m) is on the India–Nepal border in Sikkim. In 2020 Nepal and China announced Everest's new height together.<\/p><p>The <b>Andes<\/b> run about 7,000 km down South America — the longest range on land — and hold <b>Aconcagua<\/b>, the highest peak outside Asia. The <b>Rockies<\/b> and <b>Appalachians<\/b> cross North America; the <b>Alps<\/b> (Mont Blanc) and <b>Pyrenees<\/b> (France–Spain) are in Europe; the <b>Ural<\/b> mountains mark the line between Europe and Asia; the <b>Atlas<\/b> rise in Morocco and Algeria.<\/p>","key":"Everest 8,849 m; K2 — Karakoram; longest range — Andes; Europe–Asia line — Ural; Kilimanjaro — Tanzania; Mont Blanc — Alps."},{"k":"table","title":"Famous peaks","head":["Peak","Where","Note"],"rows":[["Mount Everest","Nepal–China border","8,849 m (Nepal–China survey, 2020); Sagarmatha in Nepali, Chomolungma in Tibetan."],["Kangchenjunga","India (Sikkim)–Nepal border","8,586 m — the world's third highest; India's highest."],["Mount Kilimanjaro","Tanzania","Africa's highest; a dormant volcano."],["Mount Kenya","Kenya","Africa's second highest."],["Mount Elbrus","Russia","Europe's highest, in the Caucasus."],["Mont Blanc","France–Italy border","Highest peak of the Alps."],["Matterhorn","Switzerland–Italy border",""],["Aconcagua","Argentina","Highest peak outside Asia."],["Chimborazo","Ecuador","Its top is the farthest point from the Earth's centre."],["Mount Fuji","Japan","Japan's highest; a sacred volcano on Honshu."],["Mount Kosciuszko","Australia",""],["Aoraki / Mount Cook","New Zealand",""],["Mount Ararat","Turkey (Türkiye)","Linked with Noah's Ark."],["Mount Olympus","Greece","Home of the Greek gods in myth."],["Mount Etna","Italy (Sicily)","Europe's most active large volcano."],["Mount Kinabalu","Malaysia (Borneo)",""],["Table Mountain","South Africa","Above Cape Town."],["Mauna Kea","USA (Hawaii)","Tallest mountain measured from its base on the sea floor."]]},{"k":"table","title":"Mountain ranges","head":["Range","Where","Note"],"rows":[["Andes","South America (west side)","The longest mountain range on land — about 7,000 km."],["Rockies","North America (Canada and USA)",""],["Appalachians","Eastern USA","Old, worn-down mountains."],["Alps","Europe (France, Switzerland, Italy, Austria)",""],["Pyrenees","France–Spain border","Andorra sits in them."],["Ural","Russia (Europe–Asia divide)","The traditional line between Europe and Asia."],["Caucasus","Between the Black Sea and the Caspian Sea","Has Elbrus."],["Carpathians","Eastern Europe (Romania, Slovakia, Ukraine)",""],["Apennines","Italy","The backbone of Italy."],["Atlas","North-west Africa (Morocco, Algeria, Tunisia)",""],["Drakensberg","South Africa and Lesotho",""],["Great Dividing Range","Eastern Australia",""],["Hindu Kush","Afghanistan and Pakistan",""],["Karakoram","Ladakh (India, including PoK) and China","Home of K2 (Godwin-Austen), 8,611 m — the second-highest peak."],["Zagros","Iran",""],["Tian Shan","Central Asia (China, Kyrgyzstan, Kazakhstan)",""],["Sierra Madre","Mexico",""],["Scandinavian Mountains","Norway and Sweden",""]]},{"k":"facts","title":"The highest peaks of the world","rows":[["1. Mount Everest","8,849 m — Himalayas (Nepal–China)"],["2. K2 (Godwin-Austen)","8,611 m — Karakoram"],["3. Kangchenjunga","8,586 m — Himalayas (India–Nepal)"],["4. Lhotse","8,516 m — next to Everest"],["5. Makalu","8,485 m — Nepal–China"],["Peaks above 8,000 m","14 in all, every one in the Himalaya or Karakoram"]]},{"k":"trick","h":"<b>“E-K-K”<\/b> = <b>E<\/b>verest, <b>K<\/b>2, <b>K<\/b>angchenjunga — the top three. For ranges, go west to east across Europe: <b>P<\/b>yrenees, <b>A<\/b>lps, <b>C<\/b>arpathians, <b>C<\/b>aucasus, <b>U<\/b>ral — <b>“PACCU”<\/b>."},{"k":"trap","h":"<b>K2<\/b> is in the <b>Karakoram<\/b>, not the Himalayas. <b>Mont Blanc<\/b> (Alps) is not Europe's highest — <b>Elbrus<\/b> (Caucasus) is. <b>Mauna Kea<\/b> is the tallest from its base, but Everest is the highest above sea level."}],"sum":["Everest (8,849 m) is the highest peak; K2 (8,611 m, Karakoram) is second; Kangchenjunga third.","The Andes are the longest range on land; Aconcagua is their highest peak.","The Ural mountains divide Europe and Asia; the Pyrenees divide France and Spain.","Kilimanjaro is in Tanzania; Elbrus (Russia) is Europe's highest; Mont Blanc tops the Alps.","Rockies and Appalachians — North America; Atlas — north-west Africa; Great Dividing Range — Australia."],"part":["Part 2 · Mountains, rivers and lands","पर्वत, नदियाँ और भू-भाग"],"g":"wg"},
{"id":"W6","heat":3,"title":"Rivers and cities on rivers","hi":"नदियाँ और नदी तट के नगर","blocks":[{"k":"hot","h":"Two question types: <b>records<\/b> (longest — Nile; largest by volume — Amazon; most countries — Danube) and <b>“City X stands on which river?”<\/b> — London–Thames, Paris–Seine, Rome–Tiber, Baghdad–Tigris, Vienna and Budapest–Danube."},{"k":"story","h":"<p>The <b>Nile<\/b> is the longest river (about 6,650 km). It flows north into the Mediterranean; at <b>Khartoum<\/b> the Blue Nile and White Nile join, and at <b>Cairo<\/b> it nears its delta. The <b>Amazon<\/b> carries the most water of any river. The <b>Yangtze<\/b> is Asia's longest; the <b>Huang He<\/b> is the 'Sorrow of China' for its floods.<\/p><p>In Europe the <b>Volga<\/b> is longest and empties into the Caspian Sea; the <b>Danube<\/b> passes through 10 countries and four capitals — <b>Vienna, Bratislava, Budapest, Belgrade<\/b>. Great cities grew on rivers: <b>London<\/b> on the Thames, <b>Paris<\/b> on the Seine, <b>Rome<\/b> on the Tiber, <b>Baghdad<\/b> on the Tigris, <b>New York<\/b> on the Hudson.<\/p>","key":"Nile longest; Amazon most water; Volga → Caspian; Danube 10 countries; London–Thames, Paris–Seine, Rome–Tiber, Baghdad–Tigris."},{"k":"table","title":"Where great rivers end","head":["River","Flows into","Note"],"rows":[["Nile","Mediterranean Sea","The longest river (about 6,650 km); flows north."],["Amazon","Atlantic Ocean","Largest by volume of water and by basin."],["Yangtze","East China Sea","Longest in Asia; the Three Gorges Dam."],["Mississippi","Gulf of Mexico","With the Missouri, the longest in North America. The US has called the gulf the 'Gulf of America' since 2025."],["Huang He (Yellow River)","Bohai Sea","Called the 'Sorrow of China' for its floods."],["Volga","Caspian Sea","The longest river in Europe."],["Danube","Black Sea","Flows through 10 countries — more than any other river."],["Rhine","North Sea",""],["Seine","English Channel","Flows through Paris."],["Mekong","South China Sea","Flows through six countries."],["Irrawaddy","Andaman Sea","Myanmar's main river."],["Indus","Arabian Sea",""],["Tigris and Euphrates","Persian Gulf (via the Shatt al-Arab)","The rivers of ancient Mesopotamia."],["Zambezi","Indian Ocean (Mozambique Channel)","Has Victoria Falls and the Kariba Dam."],["Niger","Gulf of Guinea",""],["Lena","Laptev Sea (Arctic Ocean)",""],["Colorado","Gulf of California","Carved the Grand Canyon."],["St Lawrence","Gulf of St Lawrence","Drains the Great Lakes into the Atlantic."]]},{"k":"table","title":"Cities on rivers","head":["City","River","Note"],"rows":[["Cairo","Nile",""],["Khartoum","Blue Nile and White Nile (where they meet)",""],["London","Thames",""],["Paris","Seine",""],["Rome","Tiber",""],["Vienna","Danube",""],["Budapest","Danube",""],["Berlin","Spree",""],["Cologne","Rhine",""],["Hamburg","Elbe",""],["Prague","Vltava",""],["Warsaw","Vistula",""],["Lisbon","Tagus",""],["Moscow","Moskva",""],["Kyiv","Dnieper",""],["Baghdad","Tigris",""],["Lahore","Ravi",""],["Dhaka","Buriganga",""],["Bangkok","Chao Phraya",""],["Phnom Penh","Mekong",""],["Wuhan","Yangtze",""],["Washington, D.C.","Potomac",""],["New York","Hudson",""],["Montreal","St Lawrence",""],["Melbourne","Yarra",""]]},{"k":"facts","title":"River records","rows":[["Longest river","Nile (Africa) — about 6,650 km"],["Largest by volume and basin","Amazon (South America)"],["Longest in Asia","Yangtze (China)"],["Longest in Europe","Volga (Russia)"],["Most countries","Danube — 10 countries"],["Crosses the Equator twice","Congo (also the deepest river)"],["Longest in Australia","Murray (with the Darling)"],["Big dams","Aswan High Dam — Nile (Egypt); Three Gorges — Yangtze (China); Hoover — Colorado (USA)"]]},{"k":"trick","h":"<b>“Danube's Four Capitals: Very Big Bright Buildings”<\/b> → <b>V<\/b>ienna, <b>B<\/b>ratislava, <b>B<\/b>udapest, <b>B<\/b>elgrade. <b>“Volga Visits the Caspian”<\/b> — both have a 'V' sound and neither reaches the ocean."},{"k":"trap","h":"The <b>Amazon<\/b> is the largest river, but the <b>Nile<\/b> is the longest. <b>Berlin<\/b> is on the <b>Spree<\/b>, not the Rhine. <b>Lahore<\/b> is on the <b>Ravi<\/b>, <b>Dhaka<\/b> on the <b>Buriganga<\/b>. The <b>Congo<\/b>, not the Amazon, crosses the Equator twice."}],"sum":["Nile — longest; Amazon — most water; Yangtze — longest in Asia; Volga — longest in Europe.","The Volga falls into the Caspian Sea; the Danube into the Black Sea; the Nile into the Mediterranean.","The Danube flows through 10 countries and past Vienna, Bratislava, Budapest and Belgrade.","London–Thames, Paris–Seine, Rome–Tiber, Berlin–Spree, Baghdad–Tigris, Cairo–Nile.","New York–Hudson, Washington–Potomac, New Orleans–Mississippi, Bangkok–Chao Phraya."],"part":["Part 2 · Mountains, rivers and lands","पर्वत, नदियाँ और भू-भाग"],"g":"wg"},
{"id":"W7","heat":2,"title":"Lakes and waterfalls","hi":"झीलें और जलप्रपात","blocks":[{"k":"hot","h":"Records again: <b>largest lake<\/b> (Caspian Sea), <b>largest freshwater lake<\/b> (Superior), <b>deepest<\/b> (Baikal), <b>highest navigable<\/b> (Titicaca), <b>highest waterfall<\/b> (Angel Falls) and where <b>Victoria<\/b> and <b>Niagara<\/b> Falls are."},{"k":"story","h":"<p>The <b>Caspian Sea<\/b> is called a sea but is really the world's largest lake. <b>Lake Superior<\/b> is the largest freshwater lake by area, while Siberia's <b>Lake Baikal<\/b> is the deepest and oldest and holds about a fifth of the world's unfrozen fresh surface water. High in the Andes, <b>Lake Titicaca<\/b> (Peru–Bolivia) is the highest lake that boats can sail on. <b>Lake Victoria<\/b>, Africa's largest, feeds the White Nile.<\/p><p>Water falls hardest in South America and Africa. <b>Angel Falls<\/b> in Venezuela drops 979 m — the highest. <b>Victoria Falls<\/b> on the Zambezi, between Zambia and Zimbabwe, is called <b>Mosi-oa-Tunya<\/b>, 'the smoke that thunders'. <b>Niagara Falls<\/b> lies between the USA and Canada, and <b>Iguazu<\/b> between Argentina and Brazil.<\/p>","key":"Caspian largest; Superior largest freshwater; Baikal deepest; Titicaca highest navigable; Angel Falls highest; Victoria Falls — Zambezi."},{"k":"table","title":"Lake records","head":["Lake","Known as","Note"],"rows":[["Caspian Sea","the largest lake in the world","Salty; touches Russia, Kazakhstan, Turkmenistan, Iran and Azerbaijan."],["Lake Superior","the largest freshwater lake by area","One of North America's Great Lakes."],["Lake Baikal","the deepest and oldest lake","In Siberia, Russia; about 1,640 m deep; holds about a fifth of the world's unfrozen fresh surface water."],["Lake Titicaca","the highest navigable lake","About 3,810 m up, on the Peru–Bolivia border."],["Dead Sea","the lowest lake on land","About 430 m below sea level; so salty that people float."],["Lake Victoria","the largest lake in Africa","Source of the White Nile; shared by Uganda, Kenya and Tanzania."],["Lake Tanganyika","the longest freshwater lake","Also Africa's deepest lake."],["Lake Ladoga","the largest lake in Europe","Near St Petersburg, Russia."],["Lake Volta","the largest artificial lake by area","In Ghana, behind the Akosombo Dam."],["Lake Michigan","the only Great Lake wholly inside the USA",""]]},{"k":"table","title":"Waterfalls","head":["Waterfall","Where","Note"],"rows":[["Angel Falls","Venezuela","The highest waterfall in the world (979 m)."],["Tugela Falls","South Africa","Often listed as the second highest."],["Victoria Falls","Zambia–Zimbabwe border","On the Zambezi; local name Mosi-oa-Tunya, 'the smoke that thunders'."],["Niagara Falls","USA–Canada border","On the Niagara River, between Lakes Erie and Ontario."],["Iguazu Falls","Argentina–Brazil border",""],["Kaieteur Falls","Guyana",""],["Boyoma (Stanley) Falls","DR Congo",""],["Sutherland Falls","New Zealand",""],["Khone Falls","Laos","On the Mekong; often called the widest waterfall."],["Rhine Falls","Switzerland","The largest plain waterfall in Europe."]]},{"k":"facts","title":"The Great Lakes of North America","rows":[["The five","Superior, Michigan, Huron, Erie, Ontario"],["Largest","Superior"],["Only one wholly in the USA","Michigan"],["Niagara Falls","On the Niagara River, from Lake Erie to Lake Ontario"],["Outlet to the sea","The St Lawrence River"]]},{"k":"trick","h":"Great Lakes — <b>HOMES<\/b>: <b>H<\/b>uron, <b>O<\/b>ntario, <b>M<\/b>ichigan, <b>E<\/b>rie, <b>S<\/b>uperior. Biggest to smallest by area — <b>“Super Heroes Must Eat Oranges”<\/b>: Superior, Huron, Michigan, Erie, Ontario."},{"k":"trap","h":"<b>Caspian<\/b> is the largest lake but it is salty; the largest <b>freshwater<\/b> lake is <b>Superior<\/b> (by area) and <b>Baikal<\/b> (by volume). The <b>Dead Sea<\/b> is a lake too. <b>Victoria Falls<\/b> is on the <b>Zambezi<\/b>, not on Lake Victoria."}],"sum":["Caspian Sea — largest lake; Superior — largest freshwater lake by area.","Baikal (Russia) — deepest and oldest lake; Titicaca (Peru–Bolivia) — highest navigable lake.","Lake Victoria — Africa's largest; source of the White Nile.","Angel Falls (Venezuela) — highest waterfall; Victoria Falls (Zambia–Zimbabwe) on the Zambezi.","Great Lakes are HOMES; Niagara Falls lies between Lakes Erie and Ontario."],"part":["Part 2 · Mountains, rivers and lands","पर्वत, नदियाँ और भू-भाग"],"g":"wg"},
{"id":"W8","heat":2,"title":"Deserts, plateaus and grasslands","hi":"मरुस्थल, पठार और घास के मैदान","blocks":[{"k":"hot","h":"SSC asks the <b>grassland names<\/b> almost every year — Pampas (Argentina), Steppes (Eurasia), Prairies (North America), Veld (South Africa), Downs (Australia). Also: <b>largest hot desert<\/b> (Sahara), <b>driest<\/b> (Atacama) and the <b>Roof of the World<\/b> (Pamir)."},{"k":"story","h":"<p>The <b>Sahara<\/b> covers most of North Africa — the largest hot desert. In the south, the <b>Kalahari<\/b> (Botswana) and the coastal <b>Namib<\/b> (Namibia) are home to the San people. The <b>Atacama<\/b> in Chile is so dry that some weather stations have never recorded rain. Asia has the cold <b>Gobi<\/b> (Mongolia–China), the <b>Taklamakan<\/b> and India's <b>Thar<\/b>.<\/p><p>Grasslands carry local names on every continent: <b>Prairies<\/b> in North America, <b>Pampas<\/b> in Argentina, <b>Steppes<\/b> across Eurasia, <b>Veld<\/b> in South Africa, <b>Downs<\/b> in Australia and <b>Canterbury<\/b> in New Zealand — all temperate. The tropical ones are the African <b>Savanna<\/b>, the <b>Llanos<\/b> of Venezuela and the <b>Campos<\/b> of Brazil. Above them all, the <b>Tibetan Plateau<\/b> is the highest and largest plateau, and the <b>Pamir<\/b> is the 'Roof of the World'.<\/p>","key":"Pampas–Argentina, Steppes–Eurasia, Prairies–N America, Veld–S Africa, Downs–Australia, Llanos–Venezuela, Campos–Brazil."},{"k":"table","title":"Deserts","head":["Desert","Where","Note"],"rows":[["Sahara","North Africa","The largest hot desert."],["Kalahari","Botswana (southern Africa)","Home of the San (Bushmen)."],["Namib","Namibia","A coastal desert; among the oldest in the world."],["Atacama","Chile","The driest non-polar desert."],["Patagonian","Argentina","The largest desert in the Americas."],["Gobi","Mongolia and China","A cold desert."],["Taklamakan","China (Xinjiang)",""],["Thar","India and Pakistan","The Great Indian Desert."],["Rub' al Khali","Saudi Arabia (Arabian Peninsula)","The 'Empty Quarter' — the largest sand sea."],["Great Victoria","Australia","Australia's largest desert."],["Mojave","USA (California and Nevada)","Death Valley — the lowest point of North America."],["Karakum","Turkmenistan",""],["Dasht-e-Kavir","Iran",""]]},{"k":"table","title":"Plateaus","head":["Plateau","Mainly in","Note"],"rows":[["Tibetan Plateau","China","The highest and largest plateau."],["Pamir","Tajikistan (Central Asia)","Called the 'Roof of the World'."],["Altiplano","Bolivia and Peru","Holds Lake Titicaca."],["Colorado Plateau","USA","The Grand Canyon cuts through it."],["Anatolian Plateau","Turkey (Türkiye)",""],["Iranian Plateau","Iran",""],["Mongolian Plateau","Mongolia",""],["Ethiopian Highlands","Ethiopia","Called the 'Roof of Africa'."],["Laurentian Plateau (Canadian Shield)","Canada",""],["Katanga Plateau","DR Congo","Rich in copper."]]},{"k":"table","title":"Grasslands","head":["Grassland","Where","Note"],"rows":[["Pampas","Argentina (and Uruguay)","Temperate; cattle ranching and wheat."],["Steppes","Eurasia (Ukraine to Central Asia)","Temperate; the biggest grassland belt."],["Prairies","North America (USA and Canada)","Temperate; 'wheat basket of the world'."],["Veld","South Africa","Temperate; high veld and low veld."],["Downs","Australia","Temperate; sheep farming."],["Canterbury","New Zealand","Temperate; sheep."],["Llanos","Venezuela and Colombia","Tropical; in the Orinoco basin."],["Campos","Brazil","Tropical."],["Savanna","Tropical Africa (e.g., the Serengeti)","Tropical; tall grass with scattered trees."],["Puszta","Hungary","Temperate."]]},{"k":"trick","h":"Temperate grasslands — <b>“PPS-VDC”<\/b>: <b>P<\/b>rairies, <b>P<\/b>ampas, <b>S<\/b>teppes, <b>V<\/b>eld, <b>D<\/b>owns, <b>C<\/b>anterbury. Tropical — <b>“SLC”<\/b>: <b>S<\/b>avanna, <b>L<\/b>lanos, <b>C<\/b>ampos. <b>Downs = Down Under<\/b> (Australia)."},{"k":"trap","h":"<b>Selvas<\/b> is the Amazon <b>rainforest<\/b>, not a grassland. <b>Llanos<\/b> are tropical (Venezuela), <b>Pampas<\/b> temperate (Argentina). The largest desert overall is <b>Antarctica<\/b>; the Sahara is the largest <b>hot<\/b> one. <b>Pamir<\/b> is the 'Roof of the World'; Ethiopia is the 'Roof of Africa'."}],"sum":["Sahara — largest hot desert; Atacama (Chile) — driest; Gobi — cold desert in Mongolia and China.","Kalahari (Botswana) and Namib (Namibia) in southern Africa; Thar in India and Pakistan.","Tibetan Plateau — highest and largest; Pamir — Roof of the World.","Temperate grasslands: Prairies, Pampas, Steppes, Veld, Downs, Canterbury.","Tropical grasslands: Savanna (Africa), Llanos (Venezuela–Colombia), Campos (Brazil)."],"part":["Part 2 · Mountains, rivers and lands","पर्वत, नदियाँ और भू-भाग"],"g":"wg"},
{"id":"W9","heat":3,"title":"Straits, canals, seas and islands","hi":"जलडमरूमध्य, नहरें, सागर और द्वीप","blocks":[{"k":"hot","h":"<b>“Which strait separates X and Y?”<\/b> and <b>“Which canal joins X and Y?”<\/b> are among the most-asked world-geography questions — Gibraltar, Bering, Palk, Malacca, Hormuz; Suez, Panama, Kiel. Also the <b>largest island<\/b> (Greenland)."},{"k":"story","h":"<p>A <b>strait<\/b> is a narrow sea passage between two pieces of land. <b>Gibraltar<\/b> separates Spain from Morocco and lets the Atlantic into the Mediterranean. The <b>Bering Strait<\/b> separates Russia from Alaska — Asia from North America. <b>Palk Strait<\/b> separates India from Sri Lanka. Oil tankers crowd <b>Hormuz<\/b> (Iran–Oman) and <b>Malacca<\/b> (Malaysia–Sumatra).<\/p><p>A <b>canal<\/b> is dug by people. The <b>Suez Canal<\/b> (Egypt, 1869) joins the Mediterranean and the Red Sea, so ships from Europe need not sail round Africa. The <b>Panama Canal<\/b> (1914) joins the Atlantic and the Pacific. The <b>Kiel Canal<\/b> in Germany joins the North Sea and the Baltic. The largest island is <b>Greenland<\/b>, which belongs to Denmark.<\/p>","key":"Gibraltar Spain–Morocco; Bering Russia–Alaska; Palk India–Sri Lanka; Suez Med–Red Sea; Panama Atlantic–Pacific; Kiel North Sea–Baltic."},{"k":"table","title":"Straits and what they separate","head":["Strait","Separates","Note"],"rows":[["Strait of Gibraltar","Spain and Morocco (Europe and Africa)","Joins the Atlantic and the Mediterranean."],["Bering Strait","Russia and Alaska, USA (Asia and North America)","Joins the Pacific and the Arctic."],["Palk Strait","India and Sri Lanka","Joins the Bay of Bengal and the Gulf of Mannar (through Palk Bay)."],["Strait of Malacca","Malay Peninsula and Sumatra (Indonesia)","Joins the Andaman Sea and the South China Sea."],["Strait of Hormuz","Iran and Oman","Joins the Persian Gulf and the Gulf of Oman; key oil route."],["Bab-el-Mandeb","Yemen and Djibouti (Asia and Africa)","Joins the Red Sea and the Gulf of Aden."],["Strait of Dover","England and France","Joins the English Channel and the North Sea."],["Bosphorus","European and Asian Turkey (at Istanbul)","Joins the Black Sea and the Sea of Marmara."],["Bass Strait","Australia and Tasmania",""],["Cook Strait","North Island and South Island of New Zealand",""],["Strait of Magellan","Mainland South America and Tierra del Fuego",""],["Drake Passage","South America and Antarctica",""],["Strait of Messina","Mainland Italy and Sicily",""],["Korea Strait","South Korea and Japan",""],["Sunda Strait","Java and Sumatra",""],["Strait of Florida","USA (Florida) and Cuba",""],["Mozambique Channel","Mozambique and Madagascar",""],["Davis Strait","Greenland and Baffin Island (Canada)",""]]},{"k":"table","title":"Canals and what they join","head":["Canal","Joins","Note"],"rows":[["Suez Canal","Mediterranean Sea and Red Sea","Egypt; opened 1869; no locks."],["Panama Canal","Atlantic and Pacific Oceans","Panama; opened 1914; uses locks; run by Panama since 1999."],["Kiel Canal","North Sea and Baltic Sea","Germany; opened 1895."],["Corinth Canal","Gulf of Corinth and Saronic Gulf (Aegean Sea)","Greece; opened 1893."],["Volga–Don Canal","Volga and Don rivers (Caspian side to the Black Sea side)","Russia; opened 1952."],["Soo Locks (Sault Ste. Marie)","Lake Superior and Lake Huron","USA–Canada."],["Welland Canal","Lake Erie and Lake Ontario","Canada; ships go round Niagara Falls."],["Grand Canal","Beijing and Hangzhou","China; the longest canal, begun about 2,500 years ago."],["Erie Canal","Hudson River and Lake Erie","New York State, USA."],["Manchester Ship Canal","Manchester and the Irish Sea (Mersey estuary)","England."]]},{"k":"table","title":"Islands and their countries","head":["Island","Belongs to","Note"],"rows":[["Greenland","Denmark","The largest island; self-governing."],["New Guinea","Indonesia and Papua New Guinea","The second-largest island."],["Borneo","Indonesia, Malaysia and Brunei","The third-largest island; shared by three countries."],["Baffin Island","Canada","The fifth largest."],["Sumatra","Indonesia",""],["Honshu","Japan","Japan's main island; Tokyo and Mount Fuji."],["Great Britain","United Kingdom",""],["Sicily","Italy","The largest island in the Mediterranean."],["Corsica","France","Napoleon's birthplace."],["Crete","Greece",""],["Tasmania","Australia",""],["Zanzibar","Tanzania","The 'Island of Cloves'."],["Galápagos Islands","Ecuador","Darwin's islands."],["Hawaii","USA",""],["Tierra del Fuego","Chile and Argentina",""]]},{"k":"facts","title":"Seas and gulfs worth knowing","rows":[["Sargasso Sea","In the North Atlantic — the only sea with no coastline"],["Dead Sea","Between Jordan and Israel/West Bank — the lowest and one of the saltiest"],["Red Sea","Between Africa and Arabia; joined to the Mediterranean by the Suez Canal"],["Yellow Sea","Between China and the Korean Peninsula"],["Adriatic Sea","Between Italy and the Balkans"],["Gulf of Guinea","West Africa — where the Equator meets the Prime Meridian (0°, 0°)"],["Gulf of Bothnia","Between Sweden and Finland"],["Dardanelles","Turkey — joins the Sea of Marmara and the Aegean Sea"],["Largest islands in order","Greenland, New Guinea, Borneo, Madagascar, Baffin"]]},{"k":"trick","h":"<b>Suez = S<\/b>ea to <b>S<\/b>ea (Mediterranean–Red); <b>Panama = P<\/b>acific (with the Atlantic). Islands by size — <b>“Green New Boots Make Baby”<\/b> → Greenland, New Guinea, Borneo, Madagascar, Baffin."},{"k":"trap","h":"<b>Australia<\/b> is a continent, not counted as an island — so <b>Greenland<\/b> is the largest island. <b>Bab-el-Mandeb<\/b> opens the Red Sea to the south; <b>Hormuz<\/b> opens the Persian Gulf. <b>Bosphorus<\/b> joins the Black Sea to Marmara; the <b>Dardanelles<\/b> joins Marmara to the Aegean."}],"sum":["Gibraltar separates Spain and Morocco; Bering separates Russia and Alaska; Palk separates India and Sri Lanka.","Hormuz (Iran–Oman) and Malacca (Malaysia–Sumatra) are key oil routes; Bab-el-Mandeb guards the Red Sea.","Suez Canal (1869) joins the Mediterranean and Red Sea; Panama Canal (1914) joins the Atlantic and Pacific.","Kiel Canal joins the North Sea and Baltic; the Grand Canal of China is the longest.","Greenland (Denmark) is the largest island; then New Guinea, Borneo, Madagascar and Baffin."],"part":["Part 3 · Seas, borders and peoples","समुद्र, सीमाएँ और लोग"],"g":"wg"},
{"id":"W10","heat":3,"title":"Boundary lines, nicknames and peoples","hi":"सीमा रेखाएँ, उपनाम और जनजातियाँ","blocks":[{"k":"hot","h":"Three quick-fire favourites: <b>boundary lines<\/b> (Durand, McMahon, Radcliffe, 38th and 49th Parallel), <b>nicknames<\/b> (Land of the Rising Sun, Land of the Midnight Sun, Land of Thousand Lakes) and <b>tribes<\/b> (Bushmen, Masai, Eskimo, Bedouin, Pygmies)."},{"k":"story","h":"<p>Many borders were drawn by one man with a pen. <b>Sir Mortimer Durand<\/b> drew the <b>Durand Line<\/b> (1893) between British India and Afghanistan — today Pakistan–Afghanistan. <b>Sir Henry McMahon<\/b> drew the <b>McMahon Line<\/b> (1914) — India–China. <b>Sir Cyril Radcliffe<\/b> drew the <b>Radcliffe Line<\/b> (1947) — India–Pakistan. Lines of latitude became borders too: the <b>38th Parallel<\/b> splits the two Koreas; the <b>49th Parallel<\/b> runs between the USA and Canada.<\/p><p>Places earn nicknames: <b>Japan<\/b> is the Land of the Rising Sun, <b>Norway<\/b> the Land of the Midnight Sun, <b>Finland<\/b> the Land of a Thousand Lakes, <b>Bhutan<\/b> the Land of the Thunder Dragon. And peoples are tied to places: the <b>Bushmen<\/b> of the Kalahari, the <b>Masai<\/b> of Kenya and Tanzania, the <b>Inuit<\/b> (Eskimo) of the Arctic and the <b>Bedouin<\/b> of the Arabian desert.<\/p>","key":"Durand Pak–Afg; McMahon India–China; Radcliffe India–Pak; 38th Koreas; 49th USA–Canada; Oder–Neisse Germany–Poland."},{"k":"table","title":"Boundary lines","head":["Line","Between","Note"],"rows":[["Durand Line","Pakistan and Afghanistan","Drawn in 1893 by Sir Mortimer Durand."],["McMahon Line","India and China","Drawn at the Simla Convention, 1914; China does not accept it."],["Radcliffe Line","India and Pakistan","Drawn in 1947 by Sir Cyril Radcliffe; also India–Bangladesh (then East Pakistan)."],["38th Parallel","North Korea and South Korea",""],["49th Parallel","USA and Canada",""],["17th Parallel","North and South Vietnam (1954–1976)",""],["Oder–Neisse Line","Germany and Poland","Fixed after World War II (1945)."],["Maginot Line","France and Germany","A line of French forts built in the 1930s."],["Mannerheim Line","Finland and the Soviet Union","A Finnish defence line on the Karelian Isthmus."],["Mason–Dixon Line","Pennsylvania and Maryland (USA)","The old line between the US North and South."],["Line of Control (LoC)","India and Pakistan (in Jammu and Kashmir)",""],["Line of Actual Control (LAC)","India and China (actual control)",""]]},{"k":"table","title":"Nicknames of places","head":["Nickname","Place","Note"],"rows":[["Land of the Rising Sun","Japan",""],["Land of the Midnight Sun","Norway",""],["Land of a Thousand Lakes","Finland",""],["Land of the Thunder Dragon","Bhutan",""],["Land of White Elephants","Thailand",""],["Land of Golden Pagodas","Myanmar",""],["Land of the Morning Calm","Korea",""],["Land of the Maple Leaf","Canada",""],["Land of the Long White Cloud","New Zealand","Aotearoa in Maori."],["Land of the Golden Fleece","Australia",""],["Dark Continent","Africa",""],["Gift of the Nile","Egypt",""],["Sugar Bowl of the World","Cuba",""],["Emerald Isle","Ireland",""],["Land of Cakes","Scotland",""],["Playground of Europe","Switzerland",""],["Cockpit of Europe","Belgium",""],["Eternal City","Rome",""],["Big Apple","New York",""],["Windy City","Chicago",""],["City of Golden Gate","San Francisco",""],["Forbidden City","Beijing (Lhasa in older books)",""],["Venice of the North","Stockholm",""],["Key to the Mediterranean","Gibraltar",""]]},{"k":"table","title":"Peoples and tribes of the world","head":["People","Homeland","Note"],"rows":[["Bushmen (San)","Kalahari Desert (Botswana, Namibia)","Hunter-gatherers."],["Masai (Maasai)","Kenya and Tanzania","Cattle herders."],["Eskimo (Inuit)","Arctic — Greenland, Canada, Alaska","Igloo; kayak; hunt seals."],["Bedouin","Arabian Desert","Arab desert nomads."],["Tuareg","Sahara Desert (Algeria, Mali, Niger)","Called 'blue men' for their indigo robes."],["Berber","North Africa (Morocco, Algeria)",""],["Pygmy","Congo Basin (Central Africa)","Short-statured forest people."],["Zulu","South Africa",""],["Khoikhoi (Hottentots)","Namibia and South Africa","Herders."],["Aboriginal","Australia",""],["Maori","New Zealand",""],["Sami (Lapps)","Lapland (Norway, Sweden, Finland)","Reindeer herders."],["Yakut","Siberia (Russia)",""],["Kirghiz","Kyrgyzstan (Central Asian steppes)","Herders of the grasslands."],["Ainu","Hokkaido (Japan)",""],["Fulani","West Africa (Sahel)","Cattle herders."],["Papuan","New Guinea",""]]},{"k":"facts","title":"Defence lines (not borders)","rows":[["Maginot Line","French forts facing Germany, built in the 1930s"],["Siegfried Line","German forts facing France (World War I and II)"],["Hindenburg Line","German World War I defence line in northern France (1916–17). Many GK books wrongly say 'Germany–Poland'"],["Mannerheim Line","Finnish defence line against the Soviet Union"]]},{"k":"trick","h":"<b>“Durand Divides Afghans; McMahon Marks Mountains (China); Radcliffe Ruled Partition.”<\/b> Parallels: <b>38 = Korea<\/b> (think of the 1950s Korean war line), <b>49 = USA–Canada<\/b> (both North American, '49 up north')."},{"k":"trap","h":"<b>Durand<\/b> = Pakistan–Afghanistan, <b>not<\/b> India–Afghanistan. The <b>Oder–Neisse<\/b> line is the Germany–Poland border; the <b>Hindenburg<\/b> line was a German war line in France. <b>Land of the Rising Sun<\/b> = Japan; <b>Midnight Sun<\/b> = Norway. <b>Bedouin<\/b> = Arab desert; <b>Tuareg<\/b> = Sahara."}],"sum":["Durand Line (1893) — Pakistan and Afghanistan; McMahon Line (1914) — India and China.","Radcliffe Line (1947) — India and Pakistan; 38th Parallel — the two Koreas; 49th Parallel — USA and Canada.","Oder–Neisse — Germany and Poland; Maginot — French forts facing Germany.","Japan — Rising Sun; Norway — Midnight Sun; Finland — Thousand Lakes; Bhutan — Thunder Dragon.","Bushmen — Kalahari; Masai — Kenya and Tanzania; Inuit — Arctic; Bedouin — Arabia; Pygmies — Congo."],"p /* ============================================================
   Lab games — shared by the workbook pages that have a "lab" tab (Chemistry and the Static GK apps).
   A page sets LAB_CONF before this file:
     { title, blurb, ranks?: [[xp, name, icon]…],
       decks: [{ id, ico, title, sub, lesson?, q? (prompt prefix), rq? (prefix for the reverse question),
                 pairs: [[prompt, answer, note?]…] | make(): items, list?(): pairs to show, opts?: fixed options, options?(item) }],
       match?: { deck, title, sub },                               — Memory Match from a deck's pairs
       specials?: [{ id, ico, title, sub, wide?, best?(L), start?(), open() }] }   — the page's own games (e.g. the periodic table)
   Games: 60-second quizzes with combos, Memory Match, XP and ranks. Scores live in the app's saved state (S.lab).
   Runs after the engine has booted, so it uses the engine's helpers ($, esc, shuffle, S, save, openLesson).
   ============================================================ */
/* ---------- state ---------- */
function labS(){ S.lab = S.lab || { best:{}, xp:0, plays:0, find:null, match:null }; S.lab.best = S.lab.best || {}; return S.lab; }
const LAB_RANKS_DEF = [[0,"Beginner","🌱"],[60,"Learner","📘"],[200,"Scholar","🎓"],[450,"Expert","🏆"],[900,"Topper","👑"]];
const labRanks = () => LAB_CONF.ranks || LAB_RANKS_DEF;
function labRank(xp){ const R = labRanks(); let r = R[0]; R.forEach(x => { if (xp >= x[0]) r = x; }); const nx = R.find(x => x[0] > xp); return { r, nx }; }
let LAB = { view: "home", sel: null, cat: null, timer: null };
function leaveLab(){ labStop(); LAB.view = "home"; }
function labStop(){ if (LAB.timer) { clearInterval(LAB.timer); LAB.timer = null; } }

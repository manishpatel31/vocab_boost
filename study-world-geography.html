{"id":"W1","heat":3,"title":"Continents and oceans","hi":"महाद्वीप और महासागर","blocks":[{"k":"hot","h":"Asked again and again: <b>largest and smallest<\/b> continent and ocean, the <b>highest peak of each continent<\/b>, the <b>deepest point<\/b> (Mariana Trench) and the continent crossed by the <b>Equator and both Tropics<\/b> (Africa)."},{"k":"story","h":"<p>Earth has <b>seven continents<\/b>. Biggest to smallest: <b>Asia, Africa, North America, South America, Antarctica, Europe, Australia<\/b>. Asia holds about 30% of the land and 60% of the people. Africa has the most countries (54) and is the only continent cut by the Equator, the Tropic of Cancer and the Tropic of Capricorn. Antarctica is the coldest place — and the largest desert, because so little snow falls there.<\/p><p>Water covers about <b>71%<\/b> of the Earth. There are <b>five oceans<\/b>: <b>Pacific, Atlantic, Indian, Southern, Arctic<\/b>. The Pacific alone is bigger than all the land put together, and its <b>Mariana Trench<\/b> is the deepest point on Earth. The Indian Ocean is the only one named after a country.<\/p>","key":"Continents: Asia > Africa > N America > S America > Antarctica > Europe > Australia. Oceans: Pacific > Atlantic > Indian > Southern > Arctic."},{"k":"table","title":"Continents by area","head":["Continent","By area","Note"],"rows":[["Asia","the largest","About 30% of the world's land and about 60% of its people."],["Africa","the 2nd largest","54 countries — the most of any continent."],["North America","the 3rd largest",""],["South America","the 4th largest",""],["Antarctica","the 5th largest","Coldest, windiest and highest on average; no permanent people."],["Europe","the 6th largest",""],["Australia (Oceania)","the smallest","The island continent."]]},{"k":"bars","title":"Continents by area","unit":"million km²","left":150,"hi":1,"rows":[["Asia",44.6,""],["Africa",30.4,""],["North America",24.7,""],["South America",17.8,""],["Antarctica",14.2,""],["Europe",10.2,""],["Austra {"id":"W2","heat":3,"title":"Countries and capitals","hi":"देश और राजधानियाँ","blocks":[{"k":"hot","h":"Every paper has one: <b>“What is the capital of X?”<\/b> SSC loves the trick ones — where the biggest city is <b>not<\/b> the capital: Australia (Canberra), Canada (Ottawa), Turkey (Ankara), Brazil (Brasília), Nigeria (Abuja), Myanmar (Naypyidaw), Switzerland (Bern)."},{"k":"story","h":"<p>Some countries built a brand-new capital away from the old big city. <b>Brazil<\/b> moved from Rio de Janeiro to <b>Brasília<\/b> in 1960. <b>Nigeria<\/b> moved from Lagos to <b>Abuja<\/b> in 1991. <b>Myanmar<\/b> moved from Yangon to <b>Naypyidaw<\/b> in 2005–06. <b>Australia<\/b> built <b>Canberra<\/b> because Sydney and Melbourne could not agree.<\/p><p>Some countries have <b>more than one capital<\/b>. <b>South Africa<\/b> has three: Pretoria (government), Cape Town (Parliament) and Bloemfontein (courts). <b>Bolivia<\/b> has Sucre (constitution) and La Paz (government). Kazakhstan's capital <b>Astana<\/b> was called Nur-Sultan from 2019 to 2022.<\/p>","key":"Big city is not the capital: Sydney→Canberra, Toronto→Ottawa, Istanbul→Ankara, Rio→Brasília, Lagos→Abuja, Yangon→Naypyidaw, Zurich→Bern."},{"k":"table","title":"Countries and capitals","head":["Country","Capital","Note"],"rows":[["Afghanistan","Kabul",""],["Nepal","Kathmandu",""],["Bhutan","Thimphu",""],["Bangladesh","Dhaka",""],["Myanmar","Naypyidaw","Took over from Yangon (Rangoon) in 2005–06."],["the Maldives","Malé",""],["China","Beijing",""],["Japan","Tokyo",""],["South Korea","Seoul",""],["North Korea","Pyongyang",""],["Mongolia","Ulaanbaatar",""],["Thailand","Bangkok",""],["Vietnam","Hanoi",""],["Cambodia","Phnom Penh",""],["Laos","Vientiane",""],["the Philippines","Manila",""],["Kazakhstan","Astana","Called Nur-Sultan from 2019 to 2022."],["Uzbekistan","Tashkent",""],["Tajikistan","Dushanbe",""],["Kyrgyzstan","Bishkek",""],["Turkmenistan","Ashgabat",""],["Iran","Tehran",""],["Iraq","Baghdad","On the Tigris."],["Saudi Arabia","Riyadh",""],["the United Arab Emirates","Abu Dhabi","Not Dubai."],["Qatar","Doha",""],["Oman","Muscat",""],["Jordan","Amman",""],["Syria","Damascus","One of the oldest lived-in cities."],["Turkey (Türkiye)","Ankara","Not Istanbul."],["Russia","Moscow",""],["Ukraine","Kyiv",""],["Germany","Berlin",""],["Switzerland","Bern","Not Zurich or Geneva."],["Canada","Ottawa","Not Toronto."],["Brazil","Brasília","Took over from Rio de Janeiro in 1960."],["Argentina","Buenos Aires",""],["Chile","Santiago",""],["Peru","Lima",""],["Colombia","Bogotá",""],["Venezuela","Caracas",""],["Cuba","Havana",""],["Australia","Canberra","Not Sydney."],["New Zealand","Wellington",""],["Egypt","Cairo",""],["Nigeria","Abuja","Took over from Lagos in 1991."],["Kenya","Nairobi",""],["Ethiopia","Addis Ababa","Headquarters of the African Union."],["Ghana","Accra",""],["Morocco","Rabat",""],["Tanzania","Dodoma","Dar es Salaam is the biggest city."],["Côte d'Ivoire","Yamoussoukro","Abidjan is the biggest city."]]},{"k":"facts","title":"Two or three capitals (and new capitals)","rows":[["South Africa","Pretoria (executive), Cape Town (legislative), Bloemfontein (judicial)"],["Bolivia","Sucre (constitutional) and La Paz (seat of government — the world's highest capital city)"],["Netherlands","Amsterdam is the capital; the government sits in The Hague"],["Sri Lanka","Sri Jayawardenepura Kotte (official); Colombo is the commercial capital"],["Malaysia","Kuala Lumpur; government offices in Putrajaya"],["Indonesia","Jakarta; a new capital, Nusantara, is being built on Borneo (move not complete as of 2026)"]]},{"k":"trick","h":"<b>“COAB BAN”<\/b> — <b>C<\/b>anberra, <b>O<\/b>ttawa, <b>A<\/b>nkara, <b>B<\/b>rasília, <b>B<\/b>ern, <b>A<\/b>buja, <b>N<\/b>aypyidaw: seven capitals that are not the biggest city. Picture Sydney, Toronto, Istanbul, Rio, Zurich, Lagos and Yangon crossed out on the map."},{"k":"trap","h":"UAE → <b>Abu Dhabi<\/b> (not Dubai). Turkey → <b>Ankara<\/b> (not Istanbul). Swit {"id":"W3","heat":3,"title":"Countries and currencies","hi":"देश और मुद्राएँ","blocks":[{"k":"hot","h":"A sure question: <b>“The currency of X is:”<\/b> — especially India's neighbours (Taka, Ngultrum, Rufiyaa, Kyat, Afghani) and the odd names (Rand, Ringgit, Baht, Won, Real)."},{"k":"story","h":"<p>Start with India's neighbours. Bangladesh uses the <b>Taka<\/b>, Bhutan the <b>Ngultrum<\/b> (tied one-to-one to the Indian rupee), Myanmar the <b>Kyat<\/b>, Maldives the <b>Rufiyaa<\/b> and Afghanistan the <b>Afghani<\/b>. Pakistan, Nepal and Sri Lanka all use a <b>Rupee<\/b>. Indonesia's <b>Rupiah<\/b> sounds similar but is a different word.<\/p><p>Many names come in families. <b>Dinar<\/b>: Kuwait, Iraq, Jordan, Bahrain, Algeria, Serbia. <b>Riyal / Rial<\/b>: Saudi Arabia, Qatar, Iran, Oman. <b>Peso<\/b>: Mexico, Argentina, Philippines, Chile. <b>Krona / Krone<\/b>: Sweden, Norway, Denmark. The <b>Euro<\/b> is shared by most of the European Union; Croatia joined in 2023 and Bulgaria in January 2026.<\/p>","key":"Neighbours: Taka, Ngultrum, Kyat, Rufiyaa, Afghani, Rupee. Families: Dinar, Riyal, Peso, Krona."},{"k":"table","title":"Countries and currencies","head":["Country","Currency","Note"],"rows":[["Japan","Yen",""],["China","Renminbi (Yuan)",""],["South Korea","Won",""],["Bangladesh","Taka",""],["Bhutan","Ngultrum","Pegged to the Indian rupee."],["Pakistan","Rupee",""],["Nepal","Rupee",""],["Sri Lanka","Rupee",""],["the Maldives","Rufiyaa",""],["Myanmar","Kyat",""],["Afghanistan","Afghani",""],["Indonesia","Rupiah",""],["Thailand","Baht",""],["Malaysia","Ringgit",""],["Vietnam","Dong",""],["the Philippines","Peso",""],["Mongolia","Tugrik",""],["Iran","Rial",""],["Saudi Arabia","Riyal",""],["the United Arab Emirates","Dirham",""],["Kuwait","Dinar",""],["Israel","Shekel",""],["Turkey (Türkiye)","Lira",""],["Russia","Rouble",""],["Ukraine","Hryvnia",""],["Poland","Zloty",""],["Hungary","Forint",""],["Sweden","Krona",""],["Norway","Krone",""],["the United Kingdom","Pound sterling",""],["Switzerland","Swiss franc",""],["Germany, France, Italy, Spain","Euro",""],["South Africa","Rand",""],["Nigeria","Naira",""],["Ghana","Cedi",""],["Kenya","Shilling",""],["Ethiopia","Birr",""],["Botswana","Pula",""],["Zambia","Kwacha",""],["Brazil","Real",""],["Mexico","Peso",""],["Venezuela","Bolívar",""],["Peru","Sol",""],["the United States","Dollar",""]]},{"k":"facts","title":"Currency families","rows":[["Rupee","India, Pakistan, Nepal, Sri Lanka, Mauritius, Seychelles"],["Dinar","Kuwait, Iraq, Jordan, Bahrain, Algeria, Tunisia, Serbia"],["Riyal / Rial","Saudi Arabia, Qatar (Riyal); Iran, Oman (Rial)"],["Peso","Mexico, Argentina, Chile, Colombia, Philippines, Cuba"],["Dollar","USA, Canada, Australia, New Zealand, Singapore"],["Euro","Most EU members — Germany, France, Italy, Spain…; Croatia from 2023, Bulgaria from 1 January 2026"],["Before the Euro","Italy — Lira; France — Franc; Germany — Deutsche Mark; Spain — Peseta"]]},{"k":"trick","h":"<b>“Ta-Ngu-Ky-Ru-Af”<\/b> — Taka, Ngultrum, Kyat, Rufiyaa, Afghani: Bangladesh, Bhutan, Myanmar, Maldives, Afghanistan — for Bangladesh, Bhutan, Myanmar, Maldives, Afghanistan. <b>R<\/b>and = <b>R<\/b>SA (South Africa)."},{"k":"trap","h":"<b>Rupiah<\/b> = Indonesia, <b>Rufiyaa<\/b> = Maldives, <b>Rupee<\/b> = India and neighbours. <b>Won<\/b> = Korea, <b>Yen<\/b> = Japan, <b>Yuan<\/b> = China. <b>Real<\/b> = Brazil; <b>Rial/Riyal<\/b> = Iran/Saudi. Turkey still uses the <b>Lira<\/b>; Italy's lira ended with the Euro."}],"sum":["India's neighbours: Taka (Bangladesh), Ngultrum (Bhutan), Kyat (Myanmar), Rufiyaa (Maldives), Afghani (Afghanistan).","Pakistan, Nepal and Sri Lanka use the Rupee; Indonesia uses the Rupiah.","Japan Yen, China Renminbi (Yuan), South Korea Won, Thailand Baht, Malaysia Ringgit.","Russia Rouble, UK Pound sterling, South Africa Rand, Brazil Real.","The Euro replaced the lira, franc and mark; Croatia joined in 2023 and Bulgaria in 2026."],"part":["Part 1 · Continents and countries","महाद् {"id":"W4","heat":2,"title":"Parliaments and flags","hi":"संसद और ध्वज","blocks":[{"k":"hot","h":"<b>“The Parliament of X is called:”<\/b> — Diet (Japan), Knesset (Israel), Duma (Russia), Congress (USA), Jatiya Sangsad (Bangladesh), Majlis (Iran), Storting (Norway), Riksdag (Sweden). Flag questions are rarer: Nepal's non-rectangular flag is the favourite."},{"k":"story","h":"<p>Most parliaments have local names. In the USA it is the <b>Congress<\/b>; in Japan the <b>Diet<\/b>; in Russia the <b>Federal Assembly<\/b>, whose lower house is the <b>State Duma<\/b>. Israel's is the <b>Knesset<\/b>, Iran's the <b>Majlis<\/b> and Pakistan's the <b>Majlis-e-Shoora<\/b>. Bangladesh has the <b>Jatiya Sangsad<\/b>.<\/p><p>Northern Europe has the oldest: Iceland's <b>Althing<\/b> first met in 930 CE. Sweden has the <b>Riksdag<\/b>, Norway the <b>Storting<\/b>, Denmark the <b>Folketing<\/b>, Finland the <b>Eduskunta<\/b>, Poland the <b>Sejm<\/b> and Germany the <b>Bundestag<\/b>. China's top body is the <b>National People's Congress<\/b>.<\/p>","key":"Congress–USA, Diet–Japan, Duma–Russia, Knesset–Israel, Majlis–Iran, Storting–Norway, Riksdag–Sweden, Althing–Iceland."},{"k":"table","title":"Parliaments","head":["Country","Parliament","Note"],"rows":[["the United States","Congress","Senate + House of Representatives."],["Japan","Diet",""],["Russia","Federal Assembly (State Duma)","The Duma is the lower house."],["Israel","Knesset",""],["Iran","Majlis",""],["Pakistan","Majlis-e-Shoora",""],["Bangladesh","Jatiya Sangsad",""],["Nepal","Sanghiya Sansad (Federal Parliament)",""],["Bhutan","Chi Tshog (National Assembly: Tshogdu)","Old books give 'Tshogdu'."],["the Maldives","People's Majlis",""],["China","National People's Congress",""],["Mongolia","State Great Khural",""],["Germany","Bundestag","The lower house; the upper is the Bundesrat."],["Sweden","Riksdag",""],["Norway","Storting",""],["Denmark","Folketing",""],["Finland","Eduskunta",""],["Iceland","Althing","Among the oldest parliaments (930 CE)."],["Poland","Sejm",""],["Spain","Cortes Generales",""],["Ireland","Oireachtas (Dáil Éireann)",""],["the Netherlands","States General",""],["Ukraine","Verkhovna Rada",""],["Turkey (Türkiye)","Grand National Assembly",""],["Malaysia","Dewan Rakyat","The lower house of Parliament."]]},{"k":"table","title":"Flag clues","head":["What the flag shows","Country","Note"],"rows":[["The only national flag that is not a rectangle","Nepal","Two stacked triangles."],["A red maple leaf","Canada",""],["A green cedar tree","Lebanon",""],["A map of the island itself","Cyprus",""],["A red disc on white (Hinomaru)","Japan",""],["A thunder dragon","Bhutan",""],["A Star of David","Israel",""],["A rifle (AK-47)","Mozambique",""],["A square shape with a white cross","Switzerland","Vatican City's flag is also square."],["The oldest national flag in continuous use (Dannebrog)","Denmark",""],["A taegeuk (red-blue circle) with four trigrams","South Korea",""]]},{"k":"photos","title":"The flags","items":[["Flag_of_Nepal","Nepal","The only national flag that is not a rectangle"],["Flag_of_Canada","Canada","A red maple leaf"],["Flag_of_Lebanon","Lebanon","A green cedar tree"],["Flag_of_Cyprus","Cyprus","A map of the island itself"],["Flag_of_Japan","Japan","A red disc on white (Hinomaru)"],["Flag_of_Bhutan","Bhutan","A thunder dragon"],["Flag_of_Israel","Israel","A Star of David"],["Flag_of_Mozambique","Mozambique","A rifle (AK-47)"],["Flag_of_Switzerland","Switzerland","A square shape with a white cross"],["Flag_of_Denmark","Denmark","The oldest national flag in continuous use (Dannebrog)"],["Flag_of_South_Korea","South Korea","A taegeuk (red-blue circle) with four trigrams"]]},{"k":"trick","h":"<b>“Dear Japan, Kind Israel, Duma Russia”<\/b> — Diet, Knesset, Duma. Nordic set, first letters of country and parliament: <b>“Sweet Raspberries, Nice Strawberries, Delicious Fruit, Fresh Eggs, Ice-cream Always”<\/b> → <b>S<\/b>weden–<b>R<\/b>iksdag, <b>N<\/b>orway–<b>S<\/b>torting, <b>D<\/b>enmark–<b>F<\/b>olketing, <b>F<\/b>inland–<b>E<\/b>duskunta, <b>I<\/b>celand–<b>A<\/b>lthing."},{"k":"trap","h":"<b>Majlis<\/b> (Iran) vs <b>Majlis-e-Shoora<\/b> (Pakistan) vs <b>People's Majlis<\/b> (Maldives). <b>Sejm<\/b> is Poland, not Sweden. <b>Bundestag<\/b> is Germany's lower house; <b>Bundesrat<\/b> is the upper house."}],"sum":["USA — Congress; Japan — Diet; Russia — Federal Assembly (State Duma); Israel — Knesset.","Iran — Majlis; Pakistan — Majlis-e-Shoora; Bangladesh — Jatiya Sangsad; Maldives — People's Majlis.","Sweden — Riksdag; Norway — Storting; Denmark — Folketing; Finland — Eduskunta; Poland — Sejm.","Iceland's Althing (930 CE) is among the oldest parliaments; Germany — Bundestag; China — National People's Congress.","Nepal has the only non-rectangular flag; Canada's flag has a maple leaf, Lebanon's a cedar tree."],"part":["Part 1 · Continents and countries","महाद्वीप और देश"],"g":"wg"},
{"id":"W5","heat":3,"title":"Mountains, peaks and ranges","hi":"पर्वत, चोटियाँ और श्रेणियाँ","blocks":[{"k":"hot","h":"Favourites: <b>Everest's height<\/b> (8,849 m), <b>K2 in the Karakoram<\/b>, the <b>longest range<\/b> (Andes), the <b>Ural<\/b> as the Europe–Asia line, <b>Kilimanjaro<\/b> in Tanzania and <b>Mont Blanc<\/b> in the Alps."},{"k":"story","h":"<p>The highest mountains are all in Asia. <b>Everest<\/b> (8,849 m) sits on the Nepal–China border; <b>K2<\/b> (8,611 m) is in the <b>Karakoram<\/b>; <b>Kangchenjunga<\/b> (8,586 m) is on the India–Nepal border in Sikkim. In 2020 Nepal and China announced Everest's new height together.<\/p><p>The <b>Andes<\/b> run about 7,000 km down South America — the longest range on land — and hold <b>Aconcagua<\/b>, the highest peak outside Asia. The <b>Rockies<\/b> and <b>Appalachians<\/b> cross North America; the <b>Alps<\/b> (Mont Blanc) and <b>Pyrenees<\/b> (France–Spain) are in Europe; the <b>Ural<\/b> mountains mark the line between Europe and Asia; the <b>Atlas<\/b> rise in Morocco and Algeria.<\/p>","key":"Everest 8,849 m; K2 — Karakoram; longest range — Andes; Europe–Asia line — Ural; Kilimanjaro — Tanzania; Mont Blanc — Alps."},{"k":"table","title":"Famous peaks","head":["Peak","Where","Note"],"rows":[["Mount Everest","Nepal–China border","8,849 m (Nepal–China survey, 2020); Sagarmatha in Nepali, Chomolungma in Tibetan."],["Kangchenjunga","India (Sikkim)–Nepal border","8,586 m — the world's third highest; India's highest."],["Mount Kilimanjaro","Tanzania","Africa's highest; a dormant volcano."],["Mount Kenya","Kenya","Africa's second highest."],["Mount Elbrus","Russia","Europe's highest, in the Caucasus."],["Mont Blanc","France–Italy border","Highest peak of the Alps."],["Matterhorn","Switzerland–Italy border",""],["Aconcagua","Argentina","Highest peak outside Asia."],["Chimborazo","Ecuador","Its top is the farthest point from the Earth's centre."],["Mount Fuji","Japan","Japan's highest; a sacred volcano on Honshu."],["Mount Kosciuszko","Australia",""],["Aoraki / Mount Cook","New Zealand",""],["Mount Ararat","Turkey (Türkiye)","Linked with Noah's Ark."],["Mount Olympus","Greece","Home of the Greek gods in myth."],["Mount Etna","Italy (Sicily)","Europe's most active large volcano."],["Mount Kinabalu","Malaysia (Borneo)",""],["Table Mountain","South Africa","Above Cape Town."],["Mauna Kea","USA (Hawaii)","Tallest mountain measured from its base on the sea floor."]]},{"k":"photos","title":"Peaks in pictures","items":[["Mount_Everest","Mount Everest","Nepal–China border"],["Mount_Kilimanjaro","Mount Kilimanjaro","Tanzania"],["Mount_Elbrus","Mount Elbrus","Russia"],["Mont_Blanc","Mont Blanc","France–Italy border"],["Matterhorn","Matterhorn","Switzerland–Italy border"],["Aconcagua","Aconcagua","Argentina"],["Mount_Fuji","Mount Fuji","Japan"],["Mount_Ararat","Mount Ararat","Turkey (Türkiye)"],["Mount_Kinabalu","Mount Kinabalu","Malaysia (Borneo)"],["Table_Mountain","Table Mountain","South Africa"]]},{"k":"table","title":"Mountain ranges","head":["Range","Where","Note"],"rows":[["Andes","South America (west side)","The longest mountain range on land — about 7,000 km."],["Rockies","North America (Canada and USA)",""],["Appalachians","Eastern USA","Old, worn-down mountains."],["Alps","Europe (France, Switzerland, Italy, Austria)",""],["Pyrenees","France–Spain border","Andorra sits in them."],["Ural","Russia (Europe–Asia divide)","The traditional line between Europe and Asia."],["Caucasus","Between the Black Sea and the Caspian Sea","Has Elbrus."],["Carpathians","Eastern Europe (Romania, Slovakia, Ukraine)",""],["Apennines","Italy","The backbone of Italy."],["Atlas","North-west Africa (Morocco, Algeria, Tunisia)",""],["Drakensberg","South Africa and Lesotho",""],["Great Dividing Range","Eastern Australia",""],["Hindu Kush","Afghanistan and Pakistan",""],["Karakoram","Ladakh (India, including PoK) and China","Home of K2 (Godwin-Austen), 8,611 m — the second-highest peak."],["Zagros","Iran",""],["Tian Shan","Central Asia (China, Kyrgyzstan, Kazakhstan)",""],["Sierra Madre","Mexico",""],["Scandinavian Mountains","Norway and Sweden",""]]},{"k":"facts","title":"The highest peaks of the world","rows":[["1. Mount Everest","8,849 m — Himalayas (Nepal–China)"],["2. K2 (Godwin-Austen)","8,611 m — Karakoram"],["3. Kangchenjunga","8,586 m — Himalayas (India–Nepal)"],["4. Lhotse","8,516 m — next to Everest"],["5. Makalu","8,485 m — Nepal–China"],["Peaks above 8,000 m","14 in all, every one in the Himalaya or Karakoram"]]},{"k":"trick","h":"<b>“E-K-K”<\/b> = <b>E<\/b>verest, <b>K<\/b>2, <b>K<\/b>angchenjunga — the top three. For ranges, go west to east across Europe: <b>P<\/b>yrenees, <b>A<\/b>lps, <b>C<\/b>arpathians, <b>C<\/b>aucasus, <b>U<\/b>ral — <b>“PACCU”<\/b>."},{"k":"trap","h":"<b>K2<\/b> is in the <b>Karakoram<\/b>, not the Himalayas. <b>Mont Blanc<\/b> (Alps) is not Europe's highest — <b>Elbrus<\/b> (Caucasus) is. <b>Mauna Kea<\/b> is the tallest from its base, but Everest is the highest above sea level."}],"sum":["Everest (8,849 m) is the highest peak; K2 (8,611 m, Karakoram) is second; Kangchenjunga third.","The Andes are the longest range on land; Aconcagua is their highest peak.","The Ural mountains divide Europe and Asia; the Pyrenees divide France and Spain.","Kilimanjaro is in Tanzania; Elbrus (Russia) is Europe's highest; Mont Blanc tops the Alps.","Rockies and Appalachians — North America; Atlas — north-west Africa; Great Dividing Range — Australia."],"part":["Part 2 · Mountains, rivers and lands","पर्वत, नदियाँ और भू-भाग"],"g":"wg"},
{"id":"W6","heat":3,"title":"Rivers and cities on rivers","hi":"नदियाँ और नदी तट के नगर","blocks":[{"k":"hot","h":"Two question types: <b>records<\/b> (longest — Nile; largest by volume — Amazon; most countries — Danube) and <b>“City X stands on which river?”<\/b> — London–Thames, Paris–Seine, Rome–Tiber, Baghdad–Tigris, Vienna and Budapest–Danube."},{"k":"story","h":"<p>The <b>Nile<\/b> is the longest river (about 6,650 km). It flows north into the Mediterranean; at <b>Khartoum<\/b> the Blue Nile and White Nile join, and at <b>Cairo<\/b> it nears its delta. The <b>Amazon<\/b> carries the most water of any river. The <b>Yangtze<\/b> is Asia's longest; the <b>Huang He<\/b> is the 'Sorrow of China' for its floods.<\/p><p>In Europe the <b>Volga<\/b> is longest and empties into the Caspian Sea; the <b>Danube<\/b> passes through 10 countries and four capitals — <b>Vienna, Bratislava, Budapest, Belgrade<\/b>. Great cities grew on rivers: <b>London<\/b> on the Thames, <b>Paris<\/b> on the Seine, <b>Rome<\/b> on the Tiber, <b>Baghdad<\/b> on the Tigris, <b>New York<\/b> on the Hudson.<\/p>","key":"Nile longest; Amazon most water; Volga → Caspian; Danube 10 countries; London–Thames, Paris–Seine, Rome–Tiber, Baghdad–Tigris."},{"k":"table","title":"Where great rivers end","head":["River","Flows into","Note"],"rows":[["Nile","Mediterranean Sea","The longest river (about 6,650 km); flows north."],["Amazon","Atlantic Ocean","Largest by volume of water and by basin."],["Yangtze","East China Sea","Longest in Asia; the Three Gorges Dam."],["Mississippi","Gulf of Mexico","With the Missouri, the longest in North America. The US has called the gulf the 'Gulf of America' since 2025."],["Huang He (Yellow River)","Bohai Sea","Called the 'Sorrow of China' for its floods."],["Volga","Caspian Sea","The longest river in Europe."],["Danube","Black Sea","Flows through 10 countries — more than any other river."],["Rhine","North Sea",""],["Seine","English Channel","Flows through Paris."],["Mekong","South China Sea","Flows through six countries."],["Irrawaddy","Andaman Sea","Myanmar's main river."],["Indus","Arabian Sea",""],["Tigris and Euphrates","Persian Gulf (via the Shatt al-Arab)","The rivers of ancient Mesopotamia."],["Zambezi","Indian Ocean (Mozambique Channel)","Has Victoria Falls and the Kariba Dam."],["Niger","Gulf of Guinea",""],["Lena","Laptev Sea (Arctic Ocean)",""],["Colorado","Gulf of California","Carved the Grand Canyon."],["St Lawrence","Gulf of St Lawrence","Drains the Great Lakes into the Atlantic."]]},{"k":"worldfig","title":"Where the great rivers reach the sea","minw":640,"pins":[["1",31,31.5,"Nile","n"],["2",-50,0,"Amazon","n"],["3",121.8,31.4,"Yangtze","n"],["4",-89.3,29.1,"Mississippi","n"],["5",119,37.8,"Huang He (Yellow River)","n"],["6",48,46,"Volga","n"],["7",29.6,45.2,"Danube","n"],["8",4.1,51.95,"Rhine","n"],["9",0.1,49.45,"Seine","n"],["10",106.7,9.6,"Mekong","n"],["11",95,15.9,"Irrawaddy","n"],["12",67.4,24,"Indus","n"],["13",48.5,29.9,"Tigris and Euphrates","n"],["14",36.3,-18.8,"Zambezi","n"],["15",6,4.3,"Niger","n"],["16",128,72.6,"Lena","n"],["17",-114.8,31.8,"Colorado","n"],["18",-66,49.5,"St Lawrence","n"]],"legend":[["1 Nile","Mediterranean Sea"],["2 Amazon","Atlantic Ocean"],["3 Yangtze","East China Sea"],["4 Mississippi","Gulf of Mexico"],["5 Huang He (Yellow River)","Bohai Sea"],["6 Volga","Caspian Sea"],["7 Danube","Black Sea"],["8 Rhine","North Sea"],["9 Seine","English Channel"],["10 Mekong","South China Sea"],["11 Irrawaddy","Andaman Sea"],["12 Indus","Arabian Sea"],["13 Tigris and Euphrates","Persian Gulf (via the Shatt al-Arab)"],["14 Zambezi","Indian Ocean (Mozambique Channel)"],["15 Niger","Gulf of Guinea"],["16 Lena","Laptev Sea (Arctic Ocean)"],["17 Colorado","Gulf of California"],["18 St Lawrence","Gulf of St Lawrence"]],"cap":"Each number marks a river's mouth. The Nile (longest) flows north into the Mediterranean; the Volga ends in the land-locked Caspian Sea."},{"k":"table","title":"Cities on rivers","head":["City","River","Note"],"rows":[["Cairo","Nile",""],["Khartoum","Blue Nile and White Nile (where they meet)",""],["London","Thames",""],["Paris","Seine",""],["Rome","Tiber",""],["Vienna","Danube",""],["Budapest","Danube",""],["Berlin","Spree",""],["Cologne","Rhine",""],["Hamburg","Elbe",""],["Prague","Vltava",""],["Warsaw","Vistula",""],["Lisbon","Tagus",""],["Moscow","Moskva",""],["Kyiv","Dnieper",""],["Baghdad","Tigris",""],["Lahore","Ravi",""],["Dhaka","Buriganga",""],["Bangkok","Chao Phraya",""],["Phnom Penh","Mekong",""],["Wuhan","Yangtze",""],["Washington, D.C.","Potomac",""],["New York","Hudson",""],["Montreal","St Lawrence",""],["Melbourne","Yarra",""]]},{"k":"facts","title":"River records","rows":[["Longest river","Nile (Africa) — about 6,650 km"],["Largest by volume and basin","Amazon (South America)"],["Longest in Asia","Yangtze (China)"],["Longest in Europe","Volga (Russia)"],["Most countries","Danube — 10 countries"],["Crosses the Equator twice","Congo (also the deepest river)"],["Longest in Australia","Murray (with the Darling)"],["Big dams","Aswan High Dam — Nile (Egypt); Three Gorges — Yangtze (China); Hoover — Colorado (USA)"]]},{"k":"trick","h":"<b>“Danube's Four Capitals: Very Big Bright Buildings”<\/b> → <b>V<\/b>ienna, <b>B<\/b>ratislava, <b>B<\/b>udapest, <b>B<\/b>elgrade. <b>“Volga Visits the Caspian”<\/b> — both have a 'V' sound and neither reaches the ocean."},{"k":"trap","h":"The <b>Amazon<\/b> is the largest river, but the <b>Nile<\/b> is the longest. <b>Berlin<\/b> is on the <b>Spree<\/b>, not the Rhine. <b>Lahore<\/b> is on the <b>Ravi<\/b>, <b>Dhaka<\/b> on the <b>Buriganga<\/b>. The <b>Congo<\/b>, not the Amazon, crosses the Equator twice."}],"sum":["Nile — longest; Amazon — most water; Yangtze — longest in Asia; Volga — longest in Europe.","The Volga falls into the Caspian Sea; the Danube into the Black Sea; the Nile into the Mediterranean.","The Danube flows through 10 countries and past Vienna, Bratislava, Budapest and Belgrade.","London–Thames, Paris–Seine, Rome–Tiber, Berlin–Spree, Baghdad–Tigris, Cairo–Nile.","New York–Hudson, Washington–Potomac, New Orleans–Mississippi, Bangkok–Chao Phraya."],"part":["Part 2 · Mountains, rivers and lands","पर्वत, नदियाँ और भू-भाग"],"g":"wg"},
{"id":"W7","heat":2,"title":"Lakes and waterfalls","hi":"झीलें और जलप्रपात","blocks":[{"k":"hot","h":"Records again: <b>largest lake<\/b> (Caspian Sea), <b>largest freshwater lake<\/b> (Superior), <b>deepest<\/b> (Baikal), <b>highest navigable<\/b> (Titicaca), <b>highest waterfall<\/b> (Angel Falls) and where <b>Victoria<\/b> and <b>Niagara<\/b> Falls are."},{"k":"story","h":"<p>The <b>Caspian Sea<\/b> is called a sea but is really the world's largest lake. <b>Lake Superior<\/b> is the largest freshwater lake by area, while Siberia's <b>Lake Baikal<\/b> is the deepest and oldest and holds about a fifth of the world's unfrozen fresh surface water. High in the Andes, <b>Lake Titicaca<\/b> (Peru–Bolivia) is the highest lake that boats can sail on. <b>Lake Victoria<\/b>, Africa's largest, feeds the White Nile.<\/p><p>Water falls hardest in South America and Africa. <b>Angel Falls<\/b> in Venezuela drops 979 m — the highest. <b>Victoria Falls<\/b> on the Zambezi, between Zambia and Zimbabwe, is called <b>Mosi-oa-Tunya<\/b>, 'the smoke that thunders'. <b>Niagara Falls<\/b> lies between the USA and Canada, and <b>Iguazu<\/b> between Argentina and Brazil.<\/p>","key":"Caspian largest; Superior largest freshwater; Baikal deepest; Titicaca highest navigable; Angel Falls highest; Victoria Falls — Zambezi."},{"k":"table","title":"Lake records","head":["Lake","Known as","Note"],"rows":[["Caspian Sea","the largest lake in the world","Salty; touches Russia, Kazakhstan, Turkmenistan, Iran and Azerbaijan."],["Lake Superior","the largest freshwater lake by area","One of North America's Great Lakes."],["Lake Baikal","the deepest and oldest lake","In Siberia, Russia; about 1,640 m deep; holds about a fifth of the world's unfrozen fresh surface water."],["Lake Titicaca","the highest navigable lake","About 3,810 m up, on the Peru–Bolivia border."],["Dead Sea","the lowest lake on land","About 430 m below sea level; so salty that people float."],["Lake Victoria","the largest lake in Africa","Source of the White Nile; shared by Uganda, Kenya and Tanzania."],["Lake Tanganyika","the longest freshwater lake","Also Africa's deepest lake."],["Lake Ladoga","the largest lake in Europe","Near St Petersburg, Russia."],["Lake Volta","the largest artificial lake by area","In Ghana, behind the Akosombo Dam."],["Lake Michigan","the only Great Lake wholly inside the USA",""]]},{"k":"worldfig","title":"Record lakes","minw":640,"pins":[["1",50.5,41.5,"Caspian Sea","n"],["2",-87.5,47.6,"Lake Superior","n"],["3",108,53.5,"Lake Baikal","n"],["4",-69.4,-15.8,"Lake Titicaca","n"],["5",35.5,31.5,"Dead Sea","n"],["6",33,-1,"Lake Victoria","n"],["7",29.5,-6,"Lake Tanganyika","n"],["8",31.5,61,"Lake Ladoga","n"],["9",0,7.5,"Lake Volta","n"],["10",-87,44,"Lake Michigan","n"]],"legend":[["1 Caspian Sea","the largest lake in the world"],["2 Lake Superior","the largest freshwater lake by area"],["3 Lake Baikal","the deepest and oldest lake"],["4 Lake Titicaca","the highest navigable lake"],["5 Dead Sea","the lowest lake on land"],["6 Lake Victoria","the largest lake in Africa"],["7 Lake Tanganyika","the longest freshwater lake"],["8 Lake Ladoga","the largest lake in Europe"],["9 Lake Volta","the largest artificial lake by area"],["10 Lake Michigan","the only Great Lake wholly inside the USA"]],"cap":"The Caspian is the largest lake; Baikal the deepest and oldest; Titicaca the highest navigable; the Dead Sea the lowest."},{"k":"table","title":"Waterfalls","head":["Waterfall","Where","Note"],"rows":[["Angel Falls","Venezuela","The highest waterfall in the world (979 m)."],["Tugela Falls","South Africa","Often listed as the second highest."],["Victoria Falls","Zambia–Zimbabwe border","On the Zambezi; local name Mosi-oa-Tunya, 'the smoke that thunders'."],["Niagara Falls","USA–Canada border","On the Niagara River, between Lakes Erie and Ontario."],["Iguazu Falls","Argentina–Brazil border",""],["Kaieteur Falls","Guyana",""],["Boyoma (Stanley) Falls","DR Congo",""],["Sutherland Falls","New Zealand",""],["Khone Falls","Laos","On the Mekong; often called the widest waterfall."],["Rhine Falls","Switzerland","The largest plain waterfall in Europe."]]},{"k":"worldfig","title":"Waterfalls on the map","minw":640,"pins":[["1",-62.53,5.97,"Angel Falls","n"],["2",28.9,-28.75,"Tugela Falls","n"],["3",25.86,-17.92,"Victoria Falls","n"],["4",-79.07,43.08,"Niagara Falls","n"],["5",-54.44,-25.69,"Iguazu Falls","n"],["6",-59.48,5.17,"Kaieteur Falls","n"],["7",25.2,0.5,"Boyoma (Stanley) Falls","n"],["8",167.7,-44.8,"Sutherland Falls","n"],["9",105.9,13.95,"Khone Falls","n"],["10",8.6,47.68,"Rhine Falls","n"]],"legend":[["1 Angel Falls","Venezuela"],["2 Tugela Falls","South Africa"],["3 Victoria Falls","Zambia–Zimbabwe border"],["4 Niagara Falls","USA–Canada border"],["5 Iguazu Falls","Argentina–Brazil border"],["6 Kaieteur Falls","Guyana"],["7 Boyoma (Stanley) Falls","DR Congo"],["8 Sutherland Falls","New Zealand"],["9 Khone Falls","Laos"],["10 Rhine Falls","Switzerland"]],"cap":"Angel Falls (Venezuela) is the highest; Victoria Falls is on the Zambezi; Niagara sits on the USA–Canada border."},{"k":"photos","title":"Waterfalls in pictures","items":[["Angel_Falls","Angel Falls","Venezuela"],["Tugela_Falls","Tugela Falls","South Africa"],["Victoria_Falls","Victoria Falls","Zambia–Zimbabwe border"],["Niagara_Falls","Niagara Falls","USA–Canada border"],["Iguazu_Falls","Iguazu Falls","Argentina–Brazil border"],["Kaieteur_Falls","Kaieteur Falls","Guyana"]]},{"k":"facts","title":"The Great Lakes of North America","rows":[["The five","Superior, Michigan, Huron, Erie, Ontario"],["Largest","Superior"],["Only one wholly in the USA","Michigan"],["Niagara Falls","On the Niagara River, from Lake Erie to Lake Ontario"],["Outlet to the sea","The St Lawrence River"]]},{"k":"trick","h":"Great Lakes — <b>HOMES<\/b>: <b>H<\/b>uron, <b>O<\/b>ntario, <b>M<\/b>ichigan, <b>E<\/b>rie, <b>S<\/b>uperior. Biggest to smallest by area — <b>“Super Heroes Must Eat Oranges”<\/b>: Superior, Huron, Michigan, Erie, Ontario."},{"k":"trap","h":"<b>Caspian<\/b> is the largest lake but it is salty; the largest <b>freshwater<\/b> lake is <b>Superior<\/b> (by area) and <b>Baikal<\/b> (by volume). The <b>Dead Sea<\/b> is a lake too. <b>Victoria Falls<\/b> is on the <b>Zambezi<\/b>, not on Lake Victoria."}],"sum":["Caspian Sea — largest lake; Superior — largest freshwater lake by area.","Baikal (Russia) — deepest and oldest lake; Titicaca (Peru–Bolivia) — highest navigable lake.","Lake Victoria — Africa's largest; source of the White Nile.","Angel Falls (Venezuela) — highest waterfall; Victoria Falls (Zambia–Zimbabwe) on the Zambezi.","Great Lakes are HOMES; Niagara Falls lies between Lakes Erie and Ontario."],"part":["Part 2 · Mountains, rivers and lands","पर्वत, नदियाँ और भू-भाग"],"g":"wg"},
{"id":"W8","heat":2,"title":"Deserts, plateaus and grasslands","hi":"मरुस्थल, पठार और घास के मैदान","blocks":[{"k":"hot","h":"SSC asks the <b>grassland names<\/b> almost every year — Pampas (Argentina), Steppes (Eurasia), Prairies (North America), Veld (South Africa), Downs (Australia). Also: <b>largest hot desert<\/b> (Sahara), <b>driest<\/b> (Atacama) and the <b>Roof of the World<\/b> (Pamir)."},{"k":"story","h":"<p>The <b>Sahara<\/b> covers most of North Africa — the largest hot desert. In the south, the <b>Kalahari<\/b> (Botswana) and the coastal <b>Namib<\/b> (Namibia) are home to the San people. The <b>Atacama<\/b> in Chile is so dry that some weather stations have never recorded rain. Asia has the cold <b>Gobi<\/b> (Mongolia–China), the <b>Taklamakan<\/b> and India's <b>Thar<\/b>.<\/p><p>Grasslands carry local names on every continent: <b>Prairies<\/b> in North America, <b>Pampas<\/b> in Argentina, <b>Steppes<\/b> across Eurasia, <b>Veld<\/b> in South Africa, <b>Downs<\/b> in Australia and <b>Canterbury<\/b> in New Zealand — all temperate. The tropical ones are the African <b>Savanna<\/b>, the <b>Llanos<\/b> of Venezuela and the <b>Campos<\/b> of Brazil. Above them all, the <b>Tibetan Plateau<\/b> is the highest and largest plateau, and the <b>Pamir<\/b> is the 'Roof of the World'.<\/p>","key":"Pampas–Argentina, Steppes–Eurasia, Prairies–N America, Veld–S Africa, Downs–Australia, Llanos–Venezuela, Campos–Brazil."},{"k":"table","title":"Deserts","head":["Desert","Where","Note"],"rows":[["Sahara","North Africa","The largest hot desert."],["Kalahari","Botswana (southern Africa)","Home of the San (Bushmen)."],["Namib","Namibia","A coastal desert; among the oldest in the world."],["Atacama","Chile","The driest non-polar desert."],["Patagonian","Argentina","The largest desert in the Americas."],["Gobi","Mongolia and China","A cold desert."],["Taklamakan","China (Xinjiang)",""],["Thar","India and Pakistan","The Great Indian Desert."],["Rub' al Khali","Saudi Arabia (Arabian Peninsula)","The 'Empty Quarter' — the largest sand sea."],["Great Victoria","Australia","Australia's largest desert."],["Mojave","USA (California and Nevada)","Death Valley — the lowest point of North America."],["Karakum","Turkmenistan",""],["Dasht-e-Kavir","Iran",""]]},{"k":"worldfig","title":"Deserts of the world","minw":640,"pins":[["1",10,23,"Sahara","n"],["2",22,-23,"Kalahari","n"],["3",15.5,-24,"Namib","n"],["4",-69.5,-24,"Atacama","n"],["5",-69,-45,"Patagonian","n"],["6",105,43,"Gobi","n"],["7",83,39,"Taklamakan","n"],["8",71,27,"Thar","n"],["9",50,20,"Rub' al Khali","n"],["10",128,-29,"Great Victoria","n"],["11",-116,35,"Mojave","n"],["12",59,39,"Karakum","n"],["13",54.5,34.5,"Dasht-e-Kavir","n"]],"legend":[["1 Sahara","North Africa — The largest hot desert"],["2 Kalahari","Botswana (southern Africa) — Home of the San (Bushmen)"],["3 Namib","Namibia — A coastal desert; among the oldest in the world"],["4 Atacama","Chile — The driest non-polar desert"],["5 Patagonian","Argentina — The largest desert in the Americas"],["6 Gobi","Mongolia and China — A cold desert"],["7 Taklamakan","China (Xinjiang)"],["8 Thar","India and Pakistan — The Great Indian Desert"],["9 Rub' al Khali","Saudi Arabia (Arabian Peninsula) — The 'Empty Quarter' — the largest sand sea"],["10 Great Victoria","Australia — Australia's largest desert"],["11 Mojave","USA (California and Nevada) — Death Valley — the lowest point of North America"],["12 Karakum","Turkmenistan"],["13 Dasht-e-Kavir","Iran"]],"cap":"Most hot deserts lie near 20–30° north and south, under the subtropical high-pressure belts; cold currents make the coastal Atacama and Namib."},{"k":"photos","title":"Deserts in pictures","items":[["Sahara_Desert","Sahara","North Africa"],["Namib_Desert","Namib","Namibia"],["Atacama_Desert","Atacama","Chile"],["Gobi_Desert","Gobi","Mongolia and China"],["Thar_Desert","Thar","India and Pakistan"],["Rub'_al_Khali","Rub' al Khali","Saudi Arabia (Arabian Peninsula)"]]},{"k":"table","title":"Plateaus","head":["Plateau","Mainly in","Note"],"rows":[["Tibetan Plateau","China","The highest and largest plateau."],["Pamir","Tajikistan (Central Asia)","Called the 'Roof of the World'."],["Altiplano","Bolivia and Peru","Holds Lake Titicaca."],["Colorado Plateau","USA","The Grand Canyon cuts through it."],["Anatolian Plateau","Turkey (Türkiye)",""],["Iranian Plateau","Iran",""],["Mongolian Plateau","Mongolia",""],["Ethiopian Highlands","Ethiopia","Called the 'Roof of Africa'."],["Laurentian Plateau (Canadian Shield)","Canada",""],["Katanga Plateau","DR Congo","Rich in copper."]]},{"k":"table","title":"Grasslands","head":["Grassland","Where","Note"],"rows":[["Pampas","Argentina (and Uruguay)","Temperate; cattle ranching and wheat."],["Steppes","Eurasia (Ukraine to Central Asia)","Temperate; the biggest grassland belt."],["Prairies","North America (USA and Canada)","Temperate; 'wheat basket of the world'."],["Veld","South Africa","Temperate; high veld and low veld."],["Downs","Australia","Temperate; sheep farming."],["Canterbury","New Zealand","Temperate; sheep."],["Llanos","Venezuela and Colombia","Tropical; in the Orinoco basin."],["Campos","Brazil","Tropical."],["Savanna","Tropical Africa (e.g., the Serengeti)","Tropical; tall grass with scattered trees."],["Puszta","Hungary","Temperate."]]},{"k":"trick","h":"Temperate grasslands — <b>“PPS-VDC”<\/b>: <b>P<\/b>rairies, <b>P<\/b>ampas, <b>S<\/b>teppes, <b>V<\/b>eld, <b>D<\/b>owns, <b>C<\/b>anterbury. Tropical — <b>“SLC”<\/b>: <b>S<\/b>avanna, <b>L<\/b>lanos, <b>C<\/b>ampos. <b>Downs = Down Under<\/b> (Australia)."},{"k":"trap","h":"<b>Selvas<\/b> is the Amazon <b>rainforest<\/b>, not a grassland. <b>Llanos<\/b> are tropical (Venezuela), <b>Pampas<\/b> temperate (Argentina). The largest desert overall is <b>Antarctica<\/b>; the Sahara is the largest <b>hot<\/b> one. <b>Pamir<\/b> is the 'Roof of the World'; Ethiopia is the 'Roof of Africa'."}],"sum":["Sahara — largest hot desert; Atacama (Chile) — driest; Gobi — cold desert in Mongolia and China.","Kalahari (Botswana) and Namib (Namibia) in southern Africa; Thar in India and Pakistan.","Tibetan Plateau — highest and largest; Pamir — Roof of the World.","Temperate grasslands: Prairies, Pampas, Steppes, Veld, Downs, Canterbury.","Tropical grasslands: Savanna (Africa), Llanos (Venezuela–Colombia), Campos (Brazil)."],"part":["Part 2 · Mountains, rivers and lands","पर्वत, नदियाँ और भू-भाग"],"g":"wg"},
{"id":"W9","heat":3,"title":"Straits, canals, seas and islands","hi":"जलडमरूमध्य, नहरें, सागर और द्वीप","blocks":[{"k":"hot","h":"<b>“Which strait separates X and Y?”<\/b> and <b>“Which canal joins X and Y?”<\/b> are among the most-asked world-geography questions — Gibraltar, Bering, Palk, Malacca, Hormuz; Suez, Panama, Kiel. Also the <b>largest island<\/b> (Greenland)."},{"k":"story","h":"<p>A <b>strait<\/b> is a narrow sea passage between two pieces of land. <b>Gibraltar<\/b> separates Spain from Morocco and lets the Atlantic into the Mediterranean. The <b>Bering Strait<\/b> separates Russia from Alaska — Asia from North America. <b>Palk Strait<\/b> separates India from Sri Lanka. Oil tankers crowd <b>Hormuz<\/b> (Iran–Oman) and <b>Malacca<\/b> (Malaysia–Sumatra).<\/p><p>A <b>canal<\/b> is dug by people. The <b>Suez Canal<\/b> (Egypt, 1869) joins the Mediterranean and the Red Sea, so ships from Europe need not sail round Africa. The <b>Panama Canal<\/b> (1914) joins the Atlantic and the Pacific. The <b>Kiel Canal<\/b> in Germany joins the North Sea and the Baltic. The largest island is <b>Greenland<\/b>, which belongs to Denmark.<\/p>","key":"Gibraltar Spain–Morocco; Bering Russia–Alaska; Palk India–Sri Lanka; Suez Med–Red Sea; Panama Atlantic–Pacific; Kiel North Sea–Baltic."},{"k":"table","title":"Straits and what they separate","head":["Strait","Separates","Note"],"rows":[["Strait of Gibraltar","Spain and Morocco (Europe and Africa)","Joins the Atlantic and the Mediterranean."],["Bering Strait","Russia and Alaska, USA (Asia and North America)","Joins the Pacific and the Arctic."],["Palk Strait","India and Sri Lanka","Joins the Bay of Bengal and the Gulf of Mannar (through Palk Bay)."],["Strait of Malacca","Malay Peninsula and Sumatra (Indonesia)","Joins the Andaman Sea and the South China Sea."],["Strait of Hormuz","Iran and Oman","Joins the Persian Gulf and the Gulf of Oman; key oil route."],["Bab-el-Mandeb","Yemen and Djibouti (Asia and Africa)","Joins the Red Sea and the Gulf of Aden."],["Strait of Dover","England and France","Joins the English Channel and the North Sea."],["Bosphorus","European and Asian Turkey (at Istanbul)","Joins the Black Sea and the Sea of Marmara."],["Bass Strait","Australia and Tasmania",""],["Cook Strait","North Island and South Island of New Zealand",""],["Strait of Magellan","Mainland South America and Tierra del Fuego",""],["Drake Passage","South America and Antarctica",""],["Strait of Messina","Mainland Italy and Sicily",""],["Korea Strait","South Korea and Japan",""],["Sunda Strait","Java and Sumatra",""],["Strait of Florida","USA (Florida) and Cuba",""],["Mozambique Channel","Mozambique and Madagascar",""],["Davis Strait","Greenland and Baffin Island (Canada)",""]]},{"k":"worldfig","title":"Straits on the map","minw":640,"pins":[["1",-5.6,35.95,"Strait of Gibraltar","n"],["2",-168.9,65.8,"Bering Strait","n"],["3",79.8,9.9,"Palk Strait","n"],["4",100.5,3,"Strait of Malacca","n"],["5",56.3,26.6,"Strait of Hormuz","n"],["6",43.3,12.6,"Bab-el-Mandeb","n"],["7",1.4,51,"Strait of Dover","n"],["8",29.05,41.1,"Bosphorus","n"],["9",146,-39.5,"Bass Strait","n"],["10",174.4,-41.2,"Cook Strait","n"],["11",-70.9,-53.5,"Strait of Magellan","n"],["12",-65,-56,"Drake Passage","n"],["13",15.6,38.2,"Strait of Messina","n"],["14",129,34.5,"Korea Strait","n"],["15",105.8,-5.9,"Sunda Strait","n"],["16",-80.5,24.3,"Strait of Florida","n"],["17",41,-18,"Mozambique Channel","n"],["18",-57,67,"Davis Strait","n"]],"legend":[["1 Strait of Gibraltar","Spain and Morocco (Europe and Africa)"],["2 Bering Strait","Russia and Alaska, USA (Asia and North America)"],["3 Palk Strait","India and Sri Lanka"],["4 Strait of Malacca","Malay Peninsula and Sumatra (Indonesia)"],["5 Strait of Hormuz","Iran and Oman"],["6 Bab-el-Mandeb","Yemen and Djibouti (Asia and Africa)"],["7 Strait of Dover","England and France"],["8 Bosphorus","European and Asian Turkey (at Istanbul)"],["9 Bass Strait","Australia and Tasmania"],["10 Cook Strait","North Island and South Island of New Zealand"],["11 Strait of Magellan","Mainland South America and Tierra del Fuego"],["12 Drake Passage","South America and Antarctica"],["13 Strait of Messina","Mainland Italy and Sicily"],["14 Korea Strait","South Korea and Japan"],["15 Sunda Strait","Java and Sumatra"],["16 Strait of Florida","USA (Florida) and Cuba"],["17 Mozambique Channel","Mozambique and Madagascar"],["18 Davis Strait","Greenland and Baffin Island (Canada)"]],"cap":"Gibraltar joins the Atlantic and the Mediterranean; Hormuz is the oil gateway of the Persian Gulf; Malacca is Asia's busiest shipping lane."},{"k":"table","title":"Canals and what they join","head":["Canal","Joins","Note"],"rows":[["Suez Canal","Mediterranean Sea and Red Sea","Egypt; opened 1869; no locks."],["Panama Canal","Atlantic and Pacific Oceans","Panama; opened 1914; uses locks; run by Panama since 1999."],["Kiel Canal","North Sea and Baltic Sea","Germany; opened 1895."],["Corinth Canal","Gulf of Corinth and Saronic Gulf (Aegean Sea)","Greece; opened 1893."],["Volga–Don Canal","Volga and Don rivers (Caspian side to the Black Sea side)","Russia; opened 1952."],["Soo Locks (Sault Ste. Marie)","Lake Superior and Lake Huron","USA–Canada."],["Welland Canal","Lake Erie and Lake Ontario","Canada; ships go round Niagara Falls."],["Grand Canal","Beijing and Hangzhou","China; the longest canal, begun about 2,500 years ago."],["Erie Canal","Hudson River and Lake Erie","New York State, USA."],["Manchester Ship Canal","Manchester and the Irish Sea (Mersey estuary)","England."]]},{"k":"worldfig","title":"Canals on the map","minw":640,"pins":[["1",32.35,30.6,"Suez Canal","n"],["2",-79.7,9.1,"Panama Canal","n"],["3",9.8,54.2,"Kiel Canal","n"],["4",22.96,37.93,"Corinth Canal","n"],["5",43.9,48.6,"Volga–Don Canal","n"],["6",-84.35,46.5,"Soo Locks (Sault Ste. Marie)","n"],["7",-79.2,43,"Welland Canal","n"],["8",118.5,33,"Grand Canal","n"],["9",-76,43,"Erie Canal","n"],["10",-2.6,53.4,"Manchester Ship Canal","n"]],"legend":[["1 Suez Canal","Mediterranean Sea and Red Sea"],["2 Panama Canal","Atlantic and Pacific Oceans"],["3 Kiel Canal","North Sea and Baltic Sea"],["4 Corinth Canal","Gulf of Corinth and Saronic Gulf (Aegean Sea)"],["5 Volga–Don Canal","Volga and Don rivers (Caspian side to the Black Sea side)"],["6 Soo Locks (Sault Ste. Marie)","Lake Superior and Lake Huron"],["7 Welland Canal","Lake Erie and Lake Ontario"],["8 Grand Canal","Beijing and Hangzhou"],["9 Erie Canal","Hudson River and Lake Erie"],["10 Manchester Ship Canal","Manchester and the Irish Sea (Mersey estuary)"]],"cap":"Suez (1869, no locks) joins the Mediterranean and Red Sea; Panama (1914, with locks) joins the Atlantic and Pacific."},{"k":"photos","title":"Canals in pictures","items":[["Suez_Canal","Suez Canal","Mediterranean Sea and Red Sea"],["Panama_Canal","Panama Canal","Atlantic and Pacific Oceans"],["Kiel_Canal","Kiel Canal","North Sea and Baltic Sea"],["Corinth_Canal","Corinth Canal","Gulf of Corinth and Saronic Gulf (Aegean Sea)"]]},{"k":"table","title":"Islands and their countries","head":["Island","Belongs to","Note"],"rows":[["Greenland","Denmark","The largest island; self-governing."],["New Guinea","Indonesia and Papua New Guinea","The second-largest island."],["Borneo","Indonesia, Malaysia and Brunei","The third-largest island; shared by three countries."],["Baffin Island","Canada","The fifth largest."],["Sumatra","Indonesia",""],["Honshu","Japan","Japan's main island; Tokyo and Mount Fuji."],["Great Britain","United Kingdom",""],["Sicily","Italy","The largest island in the Mediterranean."],["Corsica","France","Napoleon's birthplace."],["Crete","Greece",""],["Tasmania","Australia",""],["Zanzibar","Tanzania","The 'Island of Cloves'."],["Galápagos Islands","Ecuador","Darwin's islands."],["Hawaii","USA",""],["Tierra del Fuego","Chile and Argentina",""]]},{"k":"facts","title":"Seas and gulfs worth knowing","rows":[["Sargasso Sea","In the North Atlantic — the only sea with no coastline"],["Dead Sea","Between Jordan and Israel/West Bank — the lowest and one of the saltiest"],["Red Sea","Between Africa and Arabia; joined to the Mediterranean by the Suez Canal"],["Yellow Sea","Between China and the Korean Peninsula"],["Adriatic Sea","Between Italy and the Balkans"],["Gulf of Guinea","West Africa — where the Equator meets the Prime Meridian (0°, 0°)"],["Gulf of Bothnia","Between Sweden and Finland"],["Dardanelles","Turkey — joins the Sea of Marmara and the Aegean Sea"],["Largest islands in order","Greenland, New Guinea, Borneo, Madagascar, Baffin"]]},{"k":"trick","h":"<b>Suez = S<\/b>ea to <b>S<\/b>ea (Mediterranean–Red); <b>Panama = P<\/b>acific (with the Atlantic). Islands by size — <b>“Green New Boots Make Baby”<\/b> → Greenland, New Guinea, Borneo, Madagascar, Baffin."},{"k":"trap","h":"<b>Australia<\/b> is a continent, not counted as an island — so <b>Greenland<\/b> is the largest island. <b>Bab-el-Mandeb<\/b> opens the Red Sea to the south; <b>Hormuz<\/b> opens the Persian Gulf. <b>Bosphorus<\/b> joins the Black Sea to Marmara; the <b>Dardanelles<\/b> joins Marmara to the Aegean."}],"sum":["Gibraltar separates Spain and Morocco; Bering separates Russia and Alaska; Palk separates India and Sri Lanka.","Hormuz (Iran–Oman) and Malacca (Malaysia–Sumatra) are key oil routes; Bab-el-Mandeb guards the Red Sea.","Suez Canal (1869) joins the Mediterranean and Red Sea; Panama Canal (1914) joins the Atlantic and Pacific.","Kiel Canal joins the North Sea and Baltic; the Grand Canal of China is the longest.","Greenland (Denmark) is the largest island; then New Guinea, Borneo, Madagascar and Baffin."],"part":["Part 3 · Seas, borders and peoples","समुद्र, सीमाएँ और लोग"],"g":"wg"},
{"id":"W10","heat":3,"title":"Boundary lines, nicknames and peoples","hi":"सीमा रेखाएँ, उपनाम और जनजातियाँ","blocks":[{"k":"hot","h":"Three quick-fire favourites: <b>boundary lines<\/b> (Durand, McMahon, Radcliffe, 38th and 49th Parallel), <b>nicknames<\/b> (Land of the Rising Sun, Land of the Midnight Sun, Land of Thousand Lakes) and <b>tribes<\/b> (Bushmen, Masai, Eskimo, Bedouin, Pygmies)."},{"k":"story","h":"<p>Many borders were drawn by one man with a pen. <b>Sir Mortimer Durand<\/b> drew the <b>Durand Line<\/b> (1893) between British India and Afghanistan — today Pakistan–Afghanistan. <b>Sir Henry McMahon<\/b> drew the <b>McMahon Line<\/b> (1914) — India–China. <b>Sir Cyril Radcliffe<\/b> drew the <b>Radcliffe Line<\/b> (1947) — India–Pakistan. Lines of latitude became borders too: the <b>38th Parallel<\/b> splits the two Koreas; the <b>49th Parallel<\/b> runs between the USA and Canada.<\/p><p>Places earn nicknames: <b>Japan<\/b> is the Land of the Rising Sun, <b>Norway<\/b> the Land of the Midnight Sun, <b>Finland<\/b> the Land of a Thousand Lakes, <b>Bhutan<\/b> the Land of the Thunder Dragon. And peoples are tied to places: the <b>Bushmen<\/b> of the Kalahari, the <b>Masai<\/b> of Kenya and Tanzania, the <b>Inuit<\/b> (Eskimo) of the Arctic and the <b>Bedouin<\/b> of the Arabian desert.<\/p>","key":"Durand Pak–Afg; McMahon India–China; Radcliffe India–Pak; 38th Koreas; 49th USA–Canada; Oder–Neisse Germany–Poland."},{"k":"table","title":"Boundary lines","head":["Line","Between","Note"],"rows":[["Durand Line","Pakistan and Afghanistan","Drawn in 1893 by Sir Mortimer Durand."],["McMahon Line","India and China","Drawn at the Simla Convention, 1914; China does not accept it."],["Radcliffe Line","India and Pakistan","Drawn in 1947 by Sir Cyril Radcliffe; also India–Bangladesh (then East Pakistan)."],["38th Parallel","North Korea and South Korea",""],["49th Parallel","USA and Canada",""],["17th Parallel","North and South Vietnam (1954–1976)",""],["Oder–Neisse Line","Germany and Poland","Fixed after World War II (1945)."],["Maginot Line","France and Germany","A line of French forts built in the 1930s."],["Mannerheim Line","Finland and the Soviet Union","A Finnish defence line on the Karelian Isthmus."],["Mason–Dixon Line","Pennsylvania and Maryland (USA)","The old line between the US North and South."],["Line of Control (LoC)","India and Pakistan (in Jammu and Kashmir)",""],["Line of Actual Control (LAC)","India and China (actual control)",""]]},{"k":"worldfig","title":"Famous lines on the map","minw":640,"under":"<path d=\"M126.4,97.2L204.2,97.2\" fill=\"none\" stroke=\"#c0392b\" stroke-width=\"2.4\" stroke-dasharray=\"5 3\" style=\"vector-effect:non-scaling-stroke\"/><text x=\"112.5\" y=\"86.1\" font-size=\"8.5\" font-weight=\"700\" style=\"fill:#c0392b;paint-order:stroke;stroke:var(--sheet);stroke-width:2.5px\">49th Parallel<\/text><path d=\"M816.7,127.8L826.4,127.8\" fill=\"none\" stroke=\"#c0392b\" stroke-width=\"2.4\" stroke-dasharray=\"5 3\" style=\"vector-effect:non-scaling-stroke\"/><text x=\"829.2\" y=\"123.6\" font-size=\"8.5\" font-weight=\"700\" style=\"fill:#c0392b;paint-order:stroke;stroke:var(--sheet);stroke-width:2.5px\">38th Parallel<\/text><path d=\"M666.7,131.9L663.9,138.9L660.6,140.6L652.8,150L640.3,151.7\" fill=\"none\" stroke=\"#c0392b\" stroke-width=\"2.4\" stroke-dasharray=\"5 3\" style=\"vector-effect:non-scaling-stroke\"/><text x=\"623.6\" y=\"133.3\" font-size=\"8.5\" font-weight=\"700\" style=\"fill:#c0392b;paint-order:stroke;stroke:var(--sheet);stroke-width:2.5px\">Durand Line<\/text><path d=\"M722.5,155.8L729.2,152.2L737.5,154.7\" fill=\"none\" stroke=\"#c0392b\" stroke-width=\"2.4\" stroke-dasharray=\"5 3\" style=\"vector-effect:non-scaling-stroke\"/><text x=\"734.7\" y=\"145.8\" font-size=\"8.5\" font-weight=\"700\" style=\"fill:#c0392b;paint-order:stroke;stroke:var(--sheet);stroke-width:2.5px\">McMahon Line<\/text><path d=\"M675.6,143.1L674.7,146.1L674.4,151.4L663.9,156.9L662.5,165L658.6,167 :root[data-skin] body{background-color:var(--app-bg);background-image:var(--app-pattern);background-size:var(--app-psize);background-attachment:fixed}
:root[data-skin] h1,:root[data-skin] h2{letter-spacing:-.01em}

/* ===== Desktop layout (PC / tablet landscape) ===== */
@media (min-width: 1024px){
  :root{--side:236px}
  body{padding-left:var(--side);font-size:16.5px}
  .top{border-bottom:1px solid var(--rule)}
  .top-in{max-width:1320px;padding:16px 36px}
  .brand{font-size:21px}
  .brand small{font-size:13px}
  .stat{font-size:13px}
  .wrap{max-width:1320px;padding:0 36px 56px}
  .view{padding-top:28px}
  h1{font-size:34px} h2{font-size:22px} h3{font-size:17px}

  /* bottom tab bar becomes a left sidebar */
  .nav{top:0;bottom:0;left:0;right:auto;width:var(--side);height:auto;border-top:0;border-right:1px solid var(--rule);padding:84px 14px 20px;display:block;overflow:auto}
  .nav-in{display:flex;flex-direction:column;gap:4px;height:auto;max-width:none;margin:0}
  .nav-in::before{content:"Sections";display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:0 14px 8px}
  .nav button{flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-size:15px;min-height:0;height:auto;width:100%;text-align:left}
  .nav button svg{width:20px;height:20px;flex-shrink:0}
  .nav button:hover{background:var(--sunk)}
  .nav button[aria-current="page"]{background:var(--blue-bg)}
  .nav button[aria-current="page"] span{border-bottom:0!important}

  /* home: intro beside progress */
  .hero{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);column-gap:48px;align-items:end;padding-bottom:10px}
  .hero > .eyebrow,.hero > h1,.hero > p{grid-column:1}
  .hero > .meter{grid-column:2;grid-row:3;align-self:center}
  .hero > .row{grid-column:2;grid-row:2;align-self:end}

  /* lesson reader: facts, timelines, tricks sit side by side */
  .lhead{margin-bottom:0}
  .steps{max-width:640px}
  .steps + .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .steps + .stack > .plain,.steps + .stack > .row,.steps + .stack > p,.steps + .stack > .fig,.steps + .stack > h2,.steps + .stack > .tbl{grid-column:1/-1}
  .steps + .stack > .plain{max-width:86ch;font-size:17px}
  .steps + .stack > .hot,.steps + .stack > .story{grid-column:1/-1}
  .steps + .stack > .story{max-width:none;padding:20px 24px;font-size:17.5px}
  .steps + .stack > .story p{max-width:80ch}
  .steps + .stack:not(:has(> .block ~ .block)) > .block{grid-column:1/-1}
  .block,.qcard{padding:18px 20px;border-radius:14px}

  /* quizzes and question bank */
  #lq > .stack{display:grid;grid-template-columns:minmax(0,1fr);max-width:980px;gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qt{font-size:18px}
  #plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #plist .opts{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:wrap;overflow:visible}

  /* mock test: question with the answer grid alongside */
  .mbar{top:calc(env(safe-area-inset-top,0px) + 67px)}
  .view > .qcard{max-width:1000px}
  .view > .row.between{max-width:1000px}
  .view > #msub{max-width:1000px;width:100%}
  .view > .block.stack{max-width:760px}
  .pal{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .kpis{max-width:760px}

  /* revise: summary cards and sheets in columns */
  #rv > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #rv > .stack > .grph,#rv > .stack > p,#rv > .stack > .search,#rv > .stack > .callout{grid-column:1/-1}
  #dgl,#lml,#tll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #dgl > .grph,#dgl > p,#lml > p,#tll > .grph{grid-column:1/-1}
  #rv .search,#rv > #dgl ~ .search{max-width:520px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flash{min-height:300px;max-width:760px;margin:0 auto;padding:32px 36px}
  .flash .front{font-size:22px}

  /* learn: era cards across the top */
  .eras{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}
  .les{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}

(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();

{"id":"F1","heat":2,"title":"The armed forces: structure, mottos and academies","hi":"सशस्त्र बल: संरचना, आदर्श वाक्य और अकादमियाँ","blocks":[{"k":"hot","h":"Expect: <b>Supreme Commander<\/b> (the President), the <b>Chief of Defence Staff<\/b>, <b>mottos<\/b> of the three services, and <b>where<\/b> the IMA, NDA and other academies are."},{"k":"story","h":"<p>India's armed forces have three services — the <b>Army<\/b>, the <b>Navy<\/b> and the <b>Air Force<\/b> — under the Ministry of Defence. Their <b>Supreme Commander<\/b> is the <b>President of India<\/b>. Since 1 January 2020 a <b>Chief of Defence Staff<\/b> (CDS) heads the Department of Military Affairs and works for jointness among the three; the first CDS was General <b>Bipin Rawat<\/b>.<\/p><p>Each service has a Sanskrit or English motto: the Army's 'Service Before Self', the Navy's 'Sham No Varunah' and the Air Force's 'Nabhah Sparsham Deeptam' from the Gita. Young officers train at the <b>NDA<\/b> (Khadakwasla), then the <b>IMA<\/b> (Dehradun), the <b>Naval Academy<\/b> (Ezhimala) or the <b>Air Force Academy<\/b> (Dundigal).<\/p>","key":"Supreme Commander = President; first CDS = Bipin Rawat (2020); IMA Dehradun, NDA Khadakwasla."},{"k":"photos","title":"In pictures","items":[["National_Defence_Academy_(India)","National Defence Academy","Khadakwasla, Pune"],["Indian_Military_Academy","Indian Military Academy","Dehradun, 1932"],["Indian_Naval_Academy","Indian Naval Academy","Ezhimala, Kerala"],["Air_Force_Academy_(India)","Air Force Academy","Dundigal"],["Defence_Services_Staff_College","DSSC","Wellington, Tamil Nadu"]]},{"k":"table","title":"Mottos","head":["Force","Motto","Meaning / source"],"rows":[["Indian Army","Service Before Self",""],["Indian Navy","Sham No Varunah","'May the Lord of the Waters be auspicious unto us' (from the Taittiriya Upanishad)."],["Indian Air Force","Nabhah Sparsham Deeptam","'Touch the sky with glory' — from the Bhagavad Gita."],["Indian Coast Guard","Vayam Rakshamah","'We pr {"id":"F3","heat":2,"title":"Ranks, gallantry awards and firsts","hi":"रैंक, वीरता पुरस्कार और प्रथम","blocks":[{"k":"hot","h":"Popular: <b>Param Vir Chakra<\/b> (highest wartime) vs <b>Ashoka Chakra<\/b> (highest peacetime), the <b>first PVC<\/b>, <b>Field Marshals<\/b>, the only <b>Marshal of the IAF<\/b>, <b>equivalent ranks<\/b> (Colonel = Captain = Group Captain), and women firsts."},{"k":"story","h":"<p>Gallantry awards come in two ladders. In <b>war<\/b>: Param Vir Chakra, Maha Vir Chakra, Vir Chakra. In <b>peace<\/b>: Ashoka Chakra, Kirti Chakra, Shaurya Chakra. The very first Param Vir Chakra went to <b>Major Somnath Sharma<\/b>, killed defending Srinagar airfield at Badgam in 1947. The medal itself was designed by <b>Savitri Khanolkar<\/b>, born in Switzerland.<\/p><p>Only three officers have held five-star rank: Field Marshals <b>Sam Manekshaw<\/b> and <b>K. M. Cariappa<\/b>, and Marshal of the Air Force <b>Arjan Singh<\/b>.<\/p>","key":"War: PVC → MVC → VrC. Peace: Ashoka → Kirti → Shaurya. Five-stars: Manekshaw, Cariappa, Arjan Singh."},{"k":"table","title":"Equivalent ranks","head":["Army","Navy","Air Force"],"rows":[["General","Admiral","Air Chief Marshal"],["Lieutenant General","Vice Admiral","Air Marshal"],["Major General","Rear Admiral","Air Vice Marshal"],["Brigadier","Commodore","Air Commodore"],["Colonel","Captain","Group Captain"],["Lieutenant Colonel","Commander","Wing Commander"],["Major","Lieutenant Commander","Squadron Leader"],["Captain","Lieutenant","Flight Lieutenant"],["Lieutenant","Sub Lieutenant","Flying Officer"]]},{"k":"info","title":"The rank ladder","html":"<div style=\"display:grid;gap:4px\"><div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font:700 12px var(--f-body);color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;padding:0 10px\"><span>🪖 Army<\/span><span>⚓ Navy<\/span><span>✈️ Air Force<\/span><\/div><div class=\"anim-in\" style=\"animation-delay:0ms;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--accent) 34%,var(--sheet));font-size:13.5px\"><b>General<\/b><b>Admiral<\/b><b>Air Chief Marshal<\/b><\/div><div class=\"anim-in\" style=\"animation-delay:40ms;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--accent) 30%,var(--sheet));font-size:13.5px\"><b>Lieutenant General<\/b><b>Vice Admiral<\/b><b>Air Marshal<\/b><\/div><div class=\"anim-in\" style=\"animation-delay:80ms;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--accent) 27%,var(--sheet));font-size:13.5px\"><b>Major General<\/b><b>Rear Admiral<\/b><b>Air Vice Marshal<\/b><\/div><div class=\"anim-in\" style=\"animation-delay:120ms;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--accent) 23%,var(--sheet));font-size:13.5px\"><b>Brigadier<\/b><b>Commodore<\/b><b>Air Commodore<\/b><\/div><div class=\"anim-in\" style=\"animation-delay:160ms;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--accent) 20%,var(--sheet));font-size:13.5px\"><b>Colonel<\/b><b>Captain<\/b><b>Group Captain<\/b><\/div><div class=\"anim-in\" style=\"animation-delay:200ms;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--accent) 16%,var(--sheet));font-size:13.5px\"><b>Lieutenant Colonel<\/b><b>Commander<\/b><b>Wing Commander<\/b><\/div><div class=\"anim-in\" style=\"animation-delay:240ms;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--accent) 12%,var(--sheet));font-size:13.5px\"><b>Major<\/b><b>Lieutenant Commander<\/b><b>Squadron Leader<\/b><\/div><div class=\"anim-in\" style=\"animation-delay:280ms;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--accent) 9%,var(--sheet));font-size:13.5px\"><b>Captain<\/b><b>Lieutenant<\/b><b>Flight Lieutenant<\/b><\/div><div class=\"anim-in\" style=\"animation-delay:320ms;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--accent) 5%,var(--sheet));font-size:13.5px\"><b>Lieutenant<\/b><b>Sub Lieutenant<\/b><b>Flying Officer<\/b><\/div><\/div>","cap":"Read across: a Colonel = a Navy Captain = a Group Captain. Careful — an Army Captain equals only a Navy Lieutenant."},{"k":"table","title":"Gallantry and service awards","head":["Award","Rank","Note"],"rows":[["Param Vir Chakra","Highest wartime gallantry award","First awarded to Major Somnath Sharma (1947, posthumous); designed by Savitri Khanolkar."],["Maha Vir Chakra","Second-highest wartime gallantry award",""],["Vir Chakra","Third-highest wartime gallantry award",""],["Ashoka Chakra","Highest peacetime gallantry award","Also given to civilians — e.g. Neerja Bhanot; Rakesh Sharma received it too."],["Kirti Chakra","Second-highest peacetime gallantry award",""],["Shaurya Chakra","Third-highest peacetime gallantry award",""],["Param Vishisht Seva Medal","Highest award for distinguished service (not gallantry)",""]]},{"k":"info","title":"The medal ribbons","html":"<div class=\"fam\"><div><span aria-hidden=\"true\" style=\"display:block;height:30px;border-radius:4px;border:1px solid rgba(0,0,0,.15);background:linear-gradient(90deg,#5b2a86 0 100%)\"><\/span><b>Param Vir Chakra<\/b><span class=\"n\">Highest wartime gallantry award<\/span><small>First awarded to Major Somnath Sharma (1947, posthumous); designed by Savitri Khanolkar.<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:30px;border-radius:4px;border:1px solid rgba(0,0,0,.15);background:linear-gradient(90deg,#f39a1e 0 50%,#fff 50% 100%)\"><\/span><b>Maha Vir Chakra<\/b><span class=\"n\">Second-highest wartime gallantry award<\/span><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:30px;border-radius:4px;border:1px solid rgba(0,0,0,.15);background:linear-gradient(90deg,#f39a1e 0 50%,#1d2f6f 50% 100%)\"><\/span><b>Vir Chakra<\/b><span class=\"n\">Third-highest wartime gallantry award<\/span><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:30px;border-radius:4px;border:1px solid rgba(0,0,0,.15);background:linear-gradient(90deg,#1f7a3a 0 46%,#f39a1e 46% 54%,#1f7a3a 54% 100%)\"><\/span><b>Ashoka Chakra<\/b><span class=\"n\">Highest peacetime gallantry award<\/span><small>Also given to civilians — e.g. Neerja Bhanot; Rakesh Sharma received it too.<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:30px;border-radius:4px;border:1px solid rgba(0,0,0,.15);background:linear-gradient(90deg,#1f7a3a 0 30%,#f39a1e 30% 36%,#1f7a3a 36% 64%,#f39a1e 64% 70%,#1f7a3a 70% 100%)\"><\/span><b>Kirti Chakra<\/b><span class=\"n\">Second-highest peacetime gallantry award<\/span><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:30px;border-radius:4px;border:1px solid rgba(0,0,0,.15);background:linear-gradient(90deg,#1f7a3a 0 22%,#f39a1e 22% 27%,#1f7a3a 27% 47.5%,#f39a1e 47.5% 52.5%,#1f7a3a 52.5% 73%,#f39a1e 73% 78%,#1f7a3a 78% 100%)\"><\/span><b>Shaurya Chakra<\/b><span class=\"n\">Third-highest peacetime gallantry award<\/span><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:30px;border-radius:4px;border:1px solid rgba(0,0,0,.15);background:linear-gradient(90deg,#d4a017 0 44%,#1d2f6f 44% 56%,#d4a017 56% 100%)\"><\/span><b>Param Vishisht Seva Medal<\/b><span class=\"n\">Highest award for distinguished service (not gallantry)<\/span><\/div><\/div>","cap":"Wartime: Param Vir (purple), Maha Vir, Vir. Peacetime: Ashoka, Kirti, Shaurya — all on green, with one, two and three saffron stripes."},{"k":"table","title":"Firsts and famous names","head":["Who","Name","Note"],"rows":[["First Indian Commander-in-Chief of the Army","K. M. Cariappa","Took over on 15 January 1949 — Army Day."],["First Field Marshal","Sam Manekshaw","Made Field Marshal in 1973 after the 1971 victory."],["Second Field Marshal","K. M. Cariappa","Conferred in 1986."],["Only Marshal of the Indian Air Force","Arjan Singh","Five-star rank, 2002."],["First Chief of Defence Staff","Bipin Rawat","Took office on 1 January 2020."],["First Param Vir Chakra","Somnath Sharma","Battle of Badgam, 1947."],["First women fighter pilots of the IAF","Avani Chaturvedi, Bhawana Kanth and Mohana Singh","Commissioned in 2016."],["First woman to become Lieutenant General","Punita Arora",""],["First woman Air Marshal","Padmavathy Bandopadhyay",""],["First woman Rafale pilot","Shivangi Singh",""],["Missile Man of India","A. P. J. Abdul Kalam","Led the Integrated Guided Missile Development Programme."],["Missile Woman of India","Tessy Thomas","Led the Agni-IV project."]]},{"k":"photos","title":"Firsts in pictures","items":[["K._M._Cariappa","K. M. Cariappa","First Indian C-in-C · Field Marshal"],["Sam_Manekshaw","Sam Manekshaw","First Field Marshal, 1973"],["Arjan_Singh","Arjan Singh","Marshal of the IAF"],["Bipin_Rawat","Bipin Rawat","First Chief of Defence Staff"],["Somnath_Sharma","Somnath Sharma","First Param Vir Chakra"],["Avani_Chaturvedi","Avani Chaturvedi","First women fighter pilots"],["Tessy_Thomas","Tessy Thomas","Missile Woman of India"],["Param_Vir_Chakra","Param Vir Chakra","Designed by Savitri Khanolkar"]]},{"k":"trick","h":"Peacetime ladder <b>A-K-S<\/b> — <i>“Always Keep Smiling”<\/i>: Ashoka, Kirti, Shaurya. Wartime ladder <b>P-M-V<\/b> — Param, Maha, Vir (biggest word first)."},{"k":"trap","h":"<b>Colonel<\/b> (Army) = <b>Captain<\/b> (Navy) — but an Army <b>Captain<\/b> is only a Navy <b>Lieutenant<\/b>. <b>Ashoka Chakra<\/b> is peacetime; it is not the highest overall — the PVC is. <b>Manekshaw<\/b> was the first Field Marshal, Cariappa the second (though senior in age)."}],"sum":["Wartime gallantry: Param Vir Chakra, Maha Vir Chakra, Vir Chakra; peacetime: Ashoka, Kirti, Shaurya Chakra.","The first Param Vir Chakra went to Major Somnath Sharma (1947); the medal was designed by Savitri Khanolkar.","Field Marshals: Sam Manekshaw (first, 1973) and K. M. Cariappa (1986); Arjan Singh is the only Marshal of the IAF.","Colonel = Captain (Navy) = Group Captain; Brigadier = Commodore = Air Commodore.","The first women fighter pilots (2016): Avani Chaturvedi, Bhawana Kanth, Mohana Singh."],"part":["Part 1 · The armed forces","सशस्त्र बल"],"g":"df"},
{"id":"F4","heat":2,"title":"Paramilitary and central forces","hi":"अर्धसैनिक और केंद्रीय बल","blocks":[{"k":"hot","h":"Which force <b>guards which border<\/b> (BSF, ITBP, SSB, Assam Rifles), the <b>oldest<\/b> (Assam Rifles) and <b>largest<\/b> (CRPF) forces, the 'Black Cats' (NSG), and raising years are asked again and again."},{"k":"story","h":"<p>Behind the Army stand the <b>Central Armed Police Forces<\/b> under the Home Ministry. Learn them by the border they guard: the <b>BSF<\/b> faces Pakistan and Bangladesh, the <b>ITBP<\/b> the Himalayan border with China, the <b>SSB<\/b> the open borders with Nepal and Bhutan, and the <b>Assam Rifles<\/b> — India's oldest force, raised in 1835 — the Myanmar border.<\/p><p>Inside the country, the <b>CRPF<\/b> (the largest) handles internal security, the <b>CISF<\/b> guards airports and plants, and the <b>NSG<\/b> 'Black Cats' fight terror.<\/p>","key":"Pakistan & Bangladesh — BSF; China — ITBP; Nepal & Bhutan — SSB; Myanmar — Assam Rifles."},{"k":"table","title":"Forces and when they were raised","head":["Force","Raised","Role"],"rows":[["Border Security Force (BSF)","1965","Guards the Pakistan and Bangladesh borders — 'India's first line of defence'."],["Central Reserve Police Force (CRPF)","1939","Largest central armed police force; began as the Crown Representative's Police."],["Central Industrial Security Force (CISF)","1969","Guards industries, airports, the Delhi Metro and other key sites."],["Indo-Tibetan Border Police (ITBP)","1962","Guards the China border; called the 'Himveers'."],["Sashastra Seema Bal (SSB)","1963","Guards the Nepal and Bhutan borders."],["Assam Rifles","1835","Oldest paramilitary force; guards the Myanmar border; administered by the Home Ministry, operations under the Army."],["National Security Guard (NSG)","1984","Counter-terror force — the 'Black Cats'."],["Indian Coast Guard","1978","Under the Ministry of Defence."],["National Disaster Response Force (NDRF)","2006","Disaster relief, under the NDMA."],["Special Protection Group (SPG)","1988","Protects the Prime Minister."],["National Investigation Agency (NIA)","2009","Set up after the 26/11 Mumbai attacks."],["Research and Analysis Wing (R&AW)","1968","India's external intelligence agency."],["Intelligence Bureau (IB)","1887","One of the oldest intelligence agencies in the world; internal intelligence."]]},{"k":"tlfig","title":"When each force was raised","rows":[[1965,"BSF",""],[1939,"CRPF",""],[1969,"CISF",""],[1962,"ITBP",""],[1963,"SSB",""],[1835,"Assam Rifles",""],[1984,"NSG",""],[1978,"Indian Coast Guard",""],[2006,"NDRF",""],[1988,"SPG",""],[2009,"NIA",""],[1968,"R&AW",""],[1887,"IB",""]],"cap":"Assam Rifles (1835) is the oldest paramilitary force and the IB (1887) one of the oldest intelligence agencies; NIA (2009) is the newest here."},{"k":"table","title":"Who guards which border","head":["Neighbour","Force","Note"],"rows":[["Pakistan","BSF",""],["Bangladesh","BSF",""],["China","ITBP",""],["Nepal","SSB",""],["Bhutan","SSB",""],["Myanmar","Assam Rifles",""]]},{"k":"cards","title":"Border guards","rows":[["Pakistan","BSF","","🛡️"],["Bangladesh","BSF","","🛡️"],["China","ITBP","","🏔️"],["Nepal","SSB","","🌄"],["Bhutan","SSB","","🌄"],["Myanmar","Assam Rifles","","🌿"]],"cap":"BSF: Pakistan and Bangladesh. ITBP: China. SSB: Nepal and Bhutan (the open borders). Assam Rifles: Myanmar."},{"k":"trick","h":"<b>“SSB = Shanti Seema”<\/b> — the peaceful open borders (Nepal, Bhutan). <b>ITBP = Tibet<\/b> in its name → China border."},{"k":"trap","h":"<b>Assam Rifles<\/b> (1835) is the oldest, but <b>CRPF<\/b> is the largest. The <b>Coast Guard<\/b> is under Defence, not Home. <b>NSG<\/b> is the 'Black Cats'; <b>SPG<\/b> protects the Prime Minister."}],"sum":["BSF (1965) guards the Pakistan and Bangladesh borders; ITBP (1962) the China border; SSB (1963) Nepal and Bhutan.","Assam Rifles (1835) is the oldest paramilitary force and guards the Myanmar border.","CRPF (1939) is the largest CAPF; CISF (1969) guards industries and airports.","NSG (1984) — the Black Cats; SPG (1988) protects the PM; NIA set up in 2009.","The Indian Coast Guard (1978) is under the Ministry of Defence."],"part":["Part 2 · Weapons and operations","हथियार और अभियान"],"g":"df"},
{"id":"F5","heat":3,"title":"Missiles, weapons and platforms","hi":"मिसाइल, हथियार और प्लेटफ़ॉर्म","blocks":[{"k":"hot","h":"Always one: <b>BrahMos<\/b> (India–Russia, name), <b>Agni<\/b> range, <b>Prithvi<\/b> / <b>Akash<\/b> / <b>Nag<\/b> type, <b>INS Vikrant<\/b>, <b>Tejas<\/b>, <b>Arjun<\/b>, <b>IGMDP<\/b> and <b>Mission Shakti<\/b>."},{"k":"story","h":"<p>In 1983 India started the <b>Integrated Guided Missile Development Programme<\/b> (IGMDP) under <b>A. P. J. Abdul Kalam<\/b>. It gave five missiles — remember <b>“PATNA”<\/b>: <b>P<\/b>rithvi (surface-to-surface), <b>A<\/b>gni (long-range ballistic), <b>T<\/b>rishul (short-range air defence), <b>N<\/b>ag (anti-tank), <b>A<\/b>kash (surface-to-air).<\/p><p>Then came <b>BrahMos<\/b> with Russia — named after the <b>Brahmaputra<\/b> and the <b>Moskva<\/b> — one of the fastest cruise missiles. At sea, <b>INS Vikrant<\/b> (2022) is India's first home-built aircraft carrier, and <b>INS Arihant<\/b> its first nuclear-powered missile submarine. In 2019 <b>Mission Shakti<\/b> shot down a satellite in orbit.<\/p>","key":"IGMDP (1983, Kalam) = PATNA: Prithvi, Agni, Trishul, Nag, Akash."},{"k":"photos","title":"In pictures","items":[["Agni-V","Agni-V","MIRV · Mission Divyastra"],["BrahMos","BrahMos","Brahmaputra + Moskva"],["HAL_Tejas","Tejas","Light Combat Aircraft"],["INS_Vikrant_(2013)","INS Vikrant","First indigenous carrier, 2022"],["INS_Arihant","INS Arihant","Nuclear submarine"],["Dassault_Rafale","Rafale","From France, 2020"],["HAL_Prachand","Prachand","Light Combat Helicopter"],["Arjun_(tank)","Arjun","Main battle tank"],["Pinaka_multi-barrel_rocket_launcher","Pinaka","Shiva's bow"]]},{"k":"table","title":"Weapons and platforms","head":["Name","What it is","Note"],"rows":[["Agni-V","Intercontinental-range ballistic missile (5,000+ km)","Mission Divyastra (March 2024) tested it with MIRV warheads."],["Prithvi","Surface-to-surface ballistic missile","The first missile of the IGMDP."],["Akash","Surface-to-air missile",""],["Trishul","Short-range surface-to-air missile","Part of the IGMDP."],["Nag","Anti-tank guided missile","'Fire and forget'."],["BrahMos","Supersonic cruise missile","India–Russia joint venture; named after the Brahmaputra and Moskva rivers."],["Nirbhay","Subsonic long-range cruise missile",""],["Astra","Beyond-visual-range air-to-air missile",""],["K-4","Submarine-launched ballistic missile","For the Arihant-class submarines."],["Pralay","Short-range quasi-ballistic surface-to-surface missile",""],["Rudram","Anti-radiation air-to-surface missile","Destroys enemy radars."],["Arjun","Main battle tank","Built by DRDO."],["Tejas","Light Combat Aircraft","Built by HAL."],["Rafale","Multirole fighter jet from France (Dassault)","36 inducted from 2020."],["Prachand","Light Combat Helicopter","Built by HAL; inducted 2022."],["Dhruv","Advanced Light Helicopter",""],["INS Vikrant","First indigenous aircraft carrier","Commissioned on 2 September 2022."],["INS Vikramaditya","Aircraft carrier bought from Russia","Formerly Admiral Gorshkov; commissioned 2013."],["INS Arihant","First indigenous nuclear-powered ballistic missile submarine",""],["INS Kalvari","First Scorpene-class submarine","Built in India with French help (2017)."],["Pinaka","Multi-barrel rocket launcher","Named after Lord Shiva's bow."],["S-400 Triumf","Long-range air-defence system from Russia",""],["Netra","Airborne early warning and control aircraft (AEW&C)",""]]},{"k":"bars","title":"How far the missiles reach (approx.)","unit":"km","left":120,"hi":1,"rows":[["Agni-V",5000,"ICBM-class"],["K-4",3500,"from submarines"],["Nirbhay",1000,"cruise"],["Pralay",500,""],["BrahMos",450,"supersonic cruise"],["Prithvi-II",350,""],["Rudram",150,"anti-radiation"],["Astra",110,"air-to-air"],["Akash",30,"surface-to-air"],["Trishul",9,""],["Nag",4,"anti-tank"]],"cap":"Round figures from published reports; versions differ. The order is what exams test: Agni the longest, Nag the shortest."},{"k":"facts","title":"Programmes and makers","rows":[["IGMDP","1983, led by A. P. J. Abdul Kalam"],["DRDO","Defence Research and Development Organisation, set up in 1958"],["HAL","Hindustan Aeronautics Limited, Bengaluru — Tejas, Dhruv, Prachand"],["Mission Shakti","Anti-satellite missile test, 27 March 2019"],["Mission Divyastra","Agni-V with MIRV (several warheads), March 2024"],["Missile Man of India","A. P. J. Abdul Kalam"],["Missile Woman of India","Tessy Thomas"]]},{"k":"trick","h":"<b>PATNA<\/b> for the IGMDP five. <b>BrahMos = Brahmaputra + Moskva<\/b>. <b>Nag<\/b> bites tanks; <b>Akash<\/b> watches the sky; <b>Prithvi<\/b> hits the ground."},{"k":"trap","h":"<b>Akash<\/b> is surface-to-<b>air<\/b>; <b>Prithvi<\/b> is surface-to-<b>surface<\/b>. <b>INS Vikramaditya<\/b> came from Russia; <b>INS Vikrant<\/b> (2022) was built in India. <b>Astra<\/b> is air-to-air, not surface-to-air."}],"sum":["IGMDP (1983, Kalam): Prithvi, Agni, Trishul, Nag, Akash.","BrahMos is an India–Russia supersonic cruise missile named after the Brahmaputra and Moskva.","Agni-V is an intercontinental-range missile; Mission Divyastra (2024) tested it with MIRV warheads.","INS Vikrant (2022) is India's first indigenous aircraft carrier; INS Arihant its first nuclear ballistic-missile submarine.","Tejas — light combat aircraft; Arjun — main battle tank; Mission Shakti (2019) — anti-satellite test."],"part":["Part 2 · Weapons and operations","हथियार और अभियान"],"g":"df"},
{"id":"F6","heat":3,"title":"Military and rescue operations","hi":"सैन्य और बचाव अभियान","blocks":[{"k":"hot","h":"Operation names are favourites — old ones (<b>Polo, Vijay, Meghdoot, Blue Star, Cactus<\/b>) and new ones (<b>Ganga, Kaveri, Ajay, Dost<\/b>, and <b>Operation Sindoor<\/b> of May 2025)."},{"k":"story","h":"<p>Every big operation gets a code name. In 1948 <b>Operation Polo<\/b> brought Hyderabad into India; in 1961 <b>Operation Vijay<\/b> freed Goa. In 1984 <b>Meghdoot<\/b> took the Siachen glacier, and in 1988 <b>Cactus<\/b> saved the Maldives government from a coup.<\/p><p>Recent operations are often <b>rescue missions<\/b>, named after rivers or friendship: <b>Ganga<\/b> brought students home from Ukraine (2022), <b>Kaveri<\/b> from Sudan and <b>Ajay<\/b> from Israel (2023), <b>Dost<\/b> helped quake-hit Turkey. In May 2025, after the Pahalgam terror attack, <b>Operation Sindoor<\/b> struck terror camps in Pakistan and PoK.<\/p>","key":"Rescue missions are named after rivers: Ganga (Ukraine), Kaveri (Sudan), Sindhu (Iran)."},{"k":"table","title":"Operations","head":["Operation","What it was","Note"],"rows":[["Operation Polo","Integration of Hyderabad State, 1948","Also called 'police action'."],["Operation Vijay (1961)","Liberation of Goa from Portugal","Kargil 1999 was also named Operation Vijay."],["Operation Trident","Attack on Karachi harbour, 1971","Remembered on Navy Day (4 December)."],["Operation Meghdoot","Securing the Siachen Glacier, 1984",""],["Operation Blue Star","Golden Temple, Amritsar, 1984",""],["Operation Pawan","Indian Peace Keeping Force in Sri Lanka, 1987",""],["Operation Cactus","Foiling a coup in the Maldives, 1988",""],["Operation Shakti","Pokhran-II nuclear tests, 1998","The 1974 test was 'Smiling Buddha'."],["Operation Safed Sagar","Air Force operations in the Kargil war, 1999",""],["Operation Parakram","Military build-up after the 2001 Parliament attack",""],["Operation Black Tornado","NSG operation in the 26/11 Mumbai attacks, 2008",""],["Operation Rahat","Evacuation from war-torn Yemen, 2015",""],["Operation Maitri","Relief after the Nepal earthquake, 2015",""],["Operation Samudra Setu","Navy bringing Indians home in the COVID-19 pandemic, 2020",""],["Operation Ganga","Evacuation of Indians from Ukraine, 2022",""],["Operation Dost","Earthquake relief in Turkey and Syria, 2023",""],["Operation Kaveri","Evacuation from Sudan, 2023",""],["Operation Ajay","Evacuation from Israel, 2023",""],["Operation Brahma","Earthquake relief in Myanmar, 2025",""],["Operation Sindoor","Strikes on terror camps in Pakistan and PoK, May 2025","Launched after the Pahalgam terror attack of April 2025."],["Operation Sindhu","Evacuation of Indians from Iran, June 2025",""]]},{"k":"tlfig","title":"Military operations","rows":[[1948,"Polo","Integration of Hyderabad State"],[1961,"Vijay","Liberation of Goa from Portugal"],[1971,"Trident","Attack on Karachi harbour"],[1984,"Meghdoot","Securing the Siachen Glacier"],[1984,"Blue Star","Golden Temple, Amritsar"],[1987,"Pawan","Indian Peace Keeping Force in Sr…"],[1988,"Cactus","Foiling a coup in the Maldives"],[1998,"Shakti","Pokhran-II nuclear tests"],[1999,"Safed Sagar","Air Force operations in the Karg…"],[2001,"Parakram","Military build-up after the 2001…"],[2008,"Black Tornado","NSG operation in the 26/11 Mumba…"]],"cap":"From Operation Polo (Hyderabad, 1948) to Black Tornado (26/11, 2008). Shakti is Pokhran-II (1998); Pokhran-I (1974) was 'Smiling Buddha'."},{"k":"tlfig","title":"Rescue, relief and recent operations","rows":[[2015,"Rahat","Evacuation from war-torn Yemen"],[2015,"Maitri","Relief after the Nepal earthquake"],[2020,"Samudra Setu","Navy bringing Indians home in th…"],[2022,"Ganga","Evacuation of Indians from Ukraine"],[2023,"Dost","Earthquake relief in Turkey and …"],[2023,"Kaveri","Evacuation from Sudan"],[2023,"Ajay","Evacuation from Israel"],[2025,"Brahma","Earthquake relief in Myanmar"],[2025,"Sindoor","Strikes on terror camps in Pakis…"],[2025,"Sindhu","Evacuation of Indians from Iran"]],"cap":"Evacuations are named after rivers and gods — Ganga (Ukraine), Kaveri (Sudan), Ajay (Israel), Sindhu (Iran)."},{"k":"trick","h":"River rescues — <b>“Ganga flew from Ukraine, Kaveri from Sudan, Sindhu from Iran”<\/b>. <b>Meghdoot<\/b> = messenger of the clouds → the high Siachen."},{"k":"trap","h":"<b>Operation Vijay<\/b> names two things: Goa 1961 and Kargil 1999. <b>Operation Shakti<\/b> was Pokhran-II (1998); <b>Smiling Buddha<\/b> was Pokhran-I (1974). <b>Safed Sagar<\/b> was the Air Force's Kargil role."}],"sum":["Operation Polo — Hyderabad, 1948; Operation Vijay — Goa, 1961 (and Kargil, 1999).","Operation Meghdoot — Siachen, 1984; Operation Blue Star — Golden Temple, 1984; Operation Cactus — Maldives, 1988.","Operation Shakti — Pokhran-II, 1998; Operation Safed Sagar — IAF in Kargil.","Rescues: Rahat (Yemen 2015), Ganga (Ukraine 2022), Kaveri (Sudan 2023), Ajay (Israel 2023), Dost (Turkey 2023).","Operation Sindoor (May 2025) struck terror camps in Pakistan and PoK after the Pahalgam attack."],"part":["Part 3 · Military exercises","सैन्य अभ्यास"],"g":"df"},
{"id":"F7","heat":3,"title":"Army exercises with other countries","hi":"अन्य देशों के साथ सैन्य अभ्यास","blocks":[{"k":"hot","h":"The commonest defence question: <b>'Exercise X is held between India and which country?'<\/b> Top picks: <b>Yudh Abhyas<\/b> (USA), <b>Mitra Shakti<\/b> (Sri Lanka), <b>Surya Kiran<\/b> (Nepal), <b>Sampriti<\/b> (Bangladesh), <b>Nomadic Elephant<\/b> (Mongolia), <b>Garuda Shakti<\/b> (Indonesia), <b>Dharma Guardian<\/b> (Japan)."},{"k":"story","h":"<p>Exercise names often hide a clue to the partner. <b>Nomadic Elephant<\/b> — the nomads of Mongolia. <b>Surya Kiran<\/b> — the sun rising over Nepal's Himalaya. <b>Dharma Guardian<\/b> — Japan's Buddhist heritage. <b>Harimau<\/b> means 'tiger' in Malay (Malaysia). <b>Dustlik<\/b> means 'friendship' in Uzbek. <b>Sampriti<\/b> (harmony) with neighbour Bangladesh.<\/p><p>The US partnership has two: <b>Yudh Abhyas<\/b> (regular army) and <b>Vajra Prahar<\/b> (special forces).<\/p>","key":"Use the name's language: Harimau (Malay — Malaysia), Dustlik (Uzbek), Nomadic (Mongolia)."},{"k":"table","title":"Army exercises and partners","head":["Exercise","Partner country","Note"],"rows":[["Yudh Abhyas","USA","India's longest-running army exercise with the US; 22nd edition in Uttarakhand, September 2026."],["Vajra Prahar","USA","Special forces exercise."],["Mitra Shakti","Sri Lanka",""],["Surya Kiran","Nepal",""],["Sampriti","Bangladesh",""],["Nomadic Elephant","Mongolia","17th edition at Ulaanbaatar, 2025."],["Maitree","Thailand","14th edition at Umroi, Meghalaya, 2025."],["Shakti","France",""],["Ajeya Warrior","United Kingdom",""],["Dharma Guardian","Japan",""],["Garuda Shakti","Indonesia","Special forces exercise."],["Harimau Shakti","Malaysia",""],["Lamitiye","Seychelles",""],["Ekuverin","Maldives",""],["Dustlik","Uzbekistan",""],["Khanjar","Kyrgyzstan","Special forces; 13th edition in Assam, 2026."],["KAZIND","Kazakhstan",""],["Al Najah","Oman",""],["Desert Cyclone","UAE","First held in 2024."],["Au chelles","Lamitiye"],["13 Maldives","Ekuverin"],["14 Uzbekistan","Dustlik"],["15 Kyrgyzstan","Khanjar"],["16 Kazakhstan","KAZIND"],["17 Oman","Al Najah"],["18 UAE","Desert Cyclone"],["19 Australia","AustraHind"],["20 Vietnam","VINBAX"],["21 Egypt","Cyclone"],["22 Saudi Arabia","Sada Tanseeq"],["23 Singapore","Bold Kurukshetra"],["24 Cambodia","CINBAX"]],"cap":"Neighbours have one each — Surya Kiran (Nepal), Sampriti (Bangladesh), Mitra Shakti (Sri Lanka). The USA has two: Yudh Abhyas and Vajra Prahar.","minw":700},{"k":"trick","h":"South Asian neighbours — <b>“Sun in Nepal, Friendship in Sri Lanka, Harmony in Bangladesh”<\/b>: Surya Kiran, Mitra Shakti, Sampriti. Two '-Shakti' traps: <b>Garuda Shakti = Indonesia<\/b>, <b>Harimau Shakti = Malaysia<\/b>; plain <b>Shakti = France<\/b>."},{"k":"trap","h":"<b>Garuda<\/b> (air, France) ≠ <b>Garuda Shakti<\/b> (army, Indonesia). <b>Shakti<\/b> (France) ≠ <b>Mitra Shakti<\/b> (Sri Lanka). <b>Ajeya Warrior<\/b> is with the UK; <b>Indradhanush<\/b> is the UK air exercise."}],"sum":["Yudh Abhyas and Vajra Prahar — USA; Shakti — France; Ajeya Warrior — UK.","Mitra Shakti — Sri Lanka; Surya Kiran — Nepal; Sampriti — Bangladesh; Ekuverin — Maldives.","Nomadic Elephant — Mongolia; Dharma Guardian — Japan; Maitree — Thailand; VINBAX — Vietnam.","Garuda Shakti — Indonesia; Harimau Shakti — Malaysia; Bold Kurukshetra — Singapore.","Dustlik — Uzbekistan; Khanjar — Kyrgyzstan; KAZIND — Kazakhstan; Al Najah — Oman; Cyclone — Egypt."],"part":["Part 3 · Military exercises","सैन्य अभ्यास"],"g":"df"},
{"id":"F8","heat":2,"title":"Naval and air exercises","hi":"नौसैनिक और वायु अभ्यास","blocks":[{"k":"hot","h":"Frequent: <b>Varuna<\/b> (France), <b>Konkan<\/b> (UK), <b>SIMBEX<\/b> (Singapore), <b>JIMEX<\/b> (Japan), <b>AUSINDEX<\/b> (Australia), <b>SLINEX<\/b> (Sri Lanka); air: <b>Garuda<\/b> (France), <b>Cope India<\/b> (USA), <b>Indradhanush<\/b> (UK)."},{"k":"story","h":"<p>Many naval exercise names are simple abbreviations: <b>SIMBEX<\/b> = Singapore–India Maritime Bilateral Exercise, <b>JIMEX<\/b> = Japan–India, <b>SLINEX<\/b> = Sri Lanka–India, <b>AUSINDEX<\/b> = Australia–India. <b>Varuna<\/b>, the sea god, is with France; <b>Konkan<\/b>, India's west coast, with the UK.<\/p><p>In the air, <b>Garuda<\/b> (the eagle) flies with France, <b>Cope India<\/b> with the USA, and <b>Indradhanush<\/b> (rainbow) with the UK.<\/p>","key":"Read the abbreviation: SIMBEX Singapore, JIMEX Japan, SLINEX Sri Lanka, AUSINDEX Australia."},{"k":"table","title":"Naval exercises","head":["Exercise","Partner","Note"],"rows":[["Varuna","France",""],["Konkan","United Kingdom",""],["SIMBEX","Singapore",""],["JIMEX","Japan",""],["AUSINDEX","Australia",""],["SLINEX","Sri Lanka",""],["Bongosagar","Bangladesh",""],["Samudra Shakti","Indonesia",""],["Zayed Talwar","UAE",""],["Naseem Al Bahr","Oman",""],["Al Mohed Al Hindi","Saudi Arabia",""],["Samudra Laksamana","Malaysia",""]]},{"k":"table","title":"Air exercises","head":["Exercise","Partner","Note"],"rows":[["Garuda","France","Air Force exercise — not to be confused with the Army's Garuda Shakti (Indonesia)."],["Cope India","USA",""],["Indradhanush","United Kingdom",""],["Shinyuu Maitri","Japan",""],["Veer Guardian","Japan","First fighter exercise with Japan, 2023."],["Eastern Bridge","Oman",""],["Udara Shakti","Malaysia",""],["Siam Bharat","Thailand",""],["Avia Indra","Russia",""]]},{"k":"worldfig","title":"Naval and air exercise partners","pins":[["1",2.3,46.6,"France: Varuna, Garuda","n"],["2",-2,53,"United Kingdom: Konkan, Indradhanush","n"],["3",103.82,1.35,"Singapore: SIMBEX","n"],["4",138.5,36.5,"Japan: JIMEX, Shinyuu Maitri, Veer Guardian","n"],["5",134,-25,"Australia: AUSINDEX","n"],["6",80.7,7.9,"Sri Lanka: SLINEX","n"],["7",90.3,23.7,"Bangladesh: Bongosagar","n"],["8",113.9,-0.8,"Indonesia: Samudra Shakti","n"],["9",54.3,24,"UAE: Zayed Talwar","n"],["10",57,21.5,"Oman: Naseem Al Bahr, Eastern Bridge","n"],["11",45,24,"Saudi Arabia: Al Mohed Al Hindi","n"],["12",101.97,4.2,"Malaysia: Samudra Laksamana, Udara Shakti","n"],["13",-98,39,"USA: Cope India","n"],["14",101,15.5,"Thailand: Siam Bharat","n"],["15",45,56,"Russia: Avia Indra","n"]],"mark":["France","United Kingdom","Japan","Australia","Sri Lanka","Bangladesh","Indonesia","United Arab Emirates","Oman","Saudi Arabia","Malaysia","United States of America","Thailand","Russia"],"legend":[["1 France","Varuna · Garuda"],["2 United Kingdom","Konkan · Indradhanush"],["3 Singapore","SIMBEX"],["4 Japan","JIMEX · Shinyuu Maitri · Veer Guardian"],["5 Australia","AUSINDEX"],["6 Sri Lanka","SLINEX"],["7 Bangladesh","Bongosagar"],["8 Indonesia","Samudra Shakti"],["9 UAE","Zayed Talwar"],["10 Oman","Naseem Al Bahr · Eastern Bridge"],["11 Saudi Arabia","Al Mohed Al Hindi"],["12 Malaysia","Samudra Laksamana · Udara Shakti"],["13 USA","Cope India"],["14 Thailand","Siam Bharat"],["15 Russia","Avia Indra"]],"cap":"France: Varuna (navy) and Garuda (air). UK: Konkan and Indradhanush. Japan: JIMEX, Shinyuu Maitri and Veer Guardian.","minw":700},{"k":"trick","h":"France gets the gods: <b>Varuna (sea), Garuda (sky), Shakti (land)<\/b> — all three services with France have Hindu-myth names."},{"k":"trap","h":"<b>Konkan<\/b> is with the UK, not with any Konkan state. <b>Zayed Talwar<\/b> is UAE; <b>Naseem Al Bahr<\/b> is Oman; <b>Al Mohed Al Hindi<\/b> is Saudi Arabia."}],"sum":["Naval: Varuna — France; Konkan — UK; SIMBEX — Singapore; JIMEX — Japan; AUSINDEX — Australia.","SLINEX — Sri Lanka; Bongosagar — Bangladesh; Samudra Shakti — Indonesia; Zayed Talwar — {"id":"F9","heat":3,"title":"Multilateral exercises and the latest editions","hi":"बहुपक्षीय अभ्यास और नवीनतम संस्करण","blocks":[{"k":"hot","h":"Asked often: <b>Malabar<\/b> (the Quad navies), <b>MILAN<\/b> (India-hosted), <b>RIMPAC<\/b>, <b>Red Flag<\/b>, <b>Pitch Black<\/b>, <b>Tarang Shakti<\/b> (India's first multinational air exercise) and where the <b>latest edition<\/b> of an exercise was held."},{"k":"story","h":"<p>Some exercises bring many countries together. <b>Malabar<\/b> started in 1992 between India and the US and now includes all four <b>Quad<\/b> navies (with Japan and Australia). India hosts <b>MILAN<\/b> at Visakhapatnam, and in 2024 held <b>Tarang Shakti<\/b>, its first multinational air exercise. The US hosts <b>RIMPAC<\/b> near Hawaii and <b>Red Flag<\/b> in Alaska and Nevada; Australia hosts <b>Pitch Black<\/b>.<\/p><p>Current-affairs questions ask about the <b>latest edition<\/b> — its number, venue and month. Those change every year, so the table below is dated.<\/p>","key":"Malabar = Quad navies; MILAN = India hosts; Tarang Shakti = India's first multinational air exercise (2024)."},{"k":"table","title":"Multilateral and India's own exercises","head":["Exercise","Who takes part","Note"],"rows":[["Malabar","India, USA, Japan and Australia","Began in 1992 as an India–US naval exercise; all four Quad navies since 2020."],["INDRA","India and Russia (tri-service)",""],["Tiger Triumph","India and USA (tri-service amphibious)",""],["MILAN","Many navies, hosted by India","Held at Visakhapatnam in 2024 and 2026."],["RIMPAC","Many navies, hosted by the USA (Hawaii)","Rim of the Pacific — the world's largest maritime exercise."],["Red Flag","Many air forces, hosted by the USA (Alaska / Nevada)",""],["Pitch Black","Many air forces, hosted by Australia",""],["Tarang Shakti","Many air forces, hosted by India","India's first multinational air exercise, 2024."],["Desert Knight","India, France and UAE (air)",""],["Bright Star","Many countries, hosted by Egypt",""],["Sea Dragon","Anti-submarine exercise led by the USA (Guam)",""],["Cope Thunder","USA and the Philippines",""],["Desert Flag","Many air forces, hosted by the UAE",""],["Blue Flag","Many air forces, hosted by Israel",""],["Zapad","Many countries, hosted by Russia","India took part in 2025."],["TROPEX","Indian Navy's own theatre-level exercise",""],["Sea Vigil","India's coastal defence exercise",""],["Dosti","Coast guards of India, Maldives and Sri Lanka",""]]},{"k":"worldfig","title":"Where the big multilateral exercises are held","minw":700,"pins":[["1",135,20,"Malabar — India · USA · Japan · Australia (Quad)","n"],["2",-157.8,21.3,"RIMPAC — Hawaii, USA","n"],["3",-147.7,64.8,"Red Flag — Alaska / Nevada, USA","n"],["4",130.8,-12.5,"Pitch Black — Darwin, Australia","n"],["5",83.22,17.69,"MILAN — Visakhapatnam, India","n"],["6",77.2,26,"Tarang Shakti — India, 2024","n"],["7",31.2,30,"Bright Star — Egypt","n"],["8",54.4,24.3,"Desert Flag — UAE","n"],["9",34.9,31.2,"Blue Flag — Israel","n"],["10",37.6,55.7,"Zapad — Russia","n"],["11",144.8,13.4,"Sea Dragon — Guam (USA)","n"],["12",121,15,"Cope Thunder — Philippines","n"]],"legend":[["1 Malabar","India · USA · Japan · Australia (Quad)"],["2 RIMPAC","Hawaii, USA"],["3 Red Flag","Alaska / Nevada, USA"],["4 Pitch Black","Darwin, Australia"],["5 MILAN","Visakhapatnam, India"],["6 Tarang Shakti","India, 2024"],["7 Bright Star","Egypt"],["8 Desert Flag","UAE"],["9 Blue Flag","Israel"],["10 Zapad","Russia"],["11 Sea Dragon","Guam (USA)"],["12 Cope Thunder","Philippines"]],"cap":"RIMPAC (Hawaii) is the world's largest maritime exercise; Malabar is the Quad's naval exercise; India hosts MILAN and Tarang Shakti."},{"k":"table","title":"Recent editions (as of October 2026)","head":["Edition","Partner","Where and when"],"rows":[["Yudh Abhyas 2026 (22nd)","USA","Auli, Uttarakhand — September 2026."],["Mountain Guardian 2026","UAE","Mountain warfare, Uttarakhand — October 2026."],["Khanjar 2026 (13th)","Kyrgyzstan","Misamari, Assam — February 2026."],["Dustlik 2026","Uzbekistan","Pune — April 2026."],["Lamitiye 2026","Seychelles","Seychelles Defence Academy."],["Yudh Abhyas 2025 (21st)","USA","Fort Wainwright, Alaska — September 2025."],["Maitree 2025 (14th)","Thailand","Umroi, Meghalaya — September 2025."],["Nomadic Elephant 2025 (17th)","Mongolia","Ulaanbaatar — 2025."]]},{"k":"trick","h":"<b>MILAN<\/b> means 'meeting' — India meets many navies at Vizag. <b>Malabar<\/b> = India's Malabar coast, where it began."},{"k":"trap","h":"<b>Malabar<\/b> is multilateral now, not just India–US. <b>TROPEX<\/b> and <b>Sea Vigil<\/b> are India's own exercises — there is no partner country. Edition numbers and venues change every year — check the latest before your exam."}],"sum":["Malabar began in 1992 (India–US) and now has the four Quad navies: India, USA, Japan, Australia.","INDRA is India's tri-service exercise with Russia; Tiger Triumph a tri-service amphibious one with the USA.","MILAN is hosted by India at Visakhapatnam; Tarang Shakti (2024) was India's first multinational air exercise.","RIMPAC (Hawaii) and Red Flag are US-hosted; Pitch Black is Australia's; Bright Star is Egypt's.","Latest: Yudh Abhyas 2026 (22nd) at Auli; Mountain Guardian 2026 with the UAE in Uttarakhand."],"part":["Part 3 · Military exercises","सैन्य अभ्यास"],"g":"df"}

:root[data-skin] body{background-color:var(--app-bg);background-image:var(--app-pattern);background-size:var(--app-psize);background-attachment:fixed}
:root[data-skin] h1,:root[data-skin] h2{letter-spacing:-.01em}

/* ===== Desktop layout (PC / tablet landscape) ===== */
@media (min-width: 1024px){
  :root{--side:236px}
  body{padding-left:var(--side);font-size:16.5px}
  .top{border-bottom:1px solid var(--rule)}
  .top-in{max-width:1320px;padding:16px 36px}
  .brand{font-size:21px}
  .brand small{font-size:13px}
  .stat{font-size:13px}
  .wrap{max-width:1320px;padding:0 36px 56px}
  .view{padding-top:28px}
  h1{font-size:34px} h2{font-size:22px} h3{font-size:17px}

  /* bottom tab bar becomes a left sidebar */
  .nav{top:0;bottom:0;left:0;right:auto;width:var(--side);height:auto;border-top:0;border-right:1px solid var(--rule);padding:84px 14px 20px;display:block;overflow:auto}
  .nav-in{display:flex;flex-direction:column;gap:4px;height:auto;max-width:none;margin:0}
  .nav-in::before{content:"Sections";display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:0 14px 8px}
  .nav button{flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-size:15px;min-height:0;height:auto;width:100%;text-align:left}
  .nav button svg{width:20px;height:20px;flex-shrink:0}
  .nav button:hover{background:var(--sunk)}
  .nav button[aria-current="page"]{background:var(--blue-bg)}
  .nav button[aria-current="page"] span{border-bottom:0!important}

  /* home: intro beside progress */
  .hero{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);column-gap:48px;align-items:end;padding-bottom:10px}
  .hero > .eyebrow,.hero > h1,.hero > p{grid-column:1}
  .hero > .meter{grid-column:2;grid-row:3;align-self:center}
  .hero > .row{grid-column:2;grid-row:2;align-self:end}

  /* lesson reader: facts, timelines, tricks sit side by side */
  .lhead{margin-bottom:0}
  .steps{max-width:640px}
  .steps + .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .steps + .stack > .plain,.steps + .stack > .row,.steps + .stack > p,.steps + .stack > .fig,.steps + .stack > h2,.steps + .stack > .tbl{grid-column:1/-1}
  .steps + .stack > .plain{max-width:86ch;font-size:17px}
  .steps + .stack > .hot,.steps + .stack > .story{grid-column:1/-1}
  .steps + .stack > .story{max-width:none;padding:20px 24px;font-size:17.5px}
  .steps + .stack > .story p{max-width:80ch}
  .steps + .stack:not(:has(> .block ~ .block)) > .block{grid-column:1/-1}
  .block,.qcard{padding:18px 20px;border-radius:14px}

  /* quizzes and question bank */
  #lq > .stack{display:grid;grid-template-columns:minmax(0,1fr);max-width:980px;gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qt{font-size:18px}
  #plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #plist .opts{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:wrap;overflow:visible}

  /* mock test: question with the answer grid alongside */
  .mbar{top:calc(env(safe-area-inset-top,0px) + 67px)}
  .view > .qcard{max-width:1000px}
  .view > .row.between{max-width:1000px}
  .view > #msub{max-width:1000px;width:100%}
  .view > .block.stack{max-width:760px}
  .pal{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .kpis{max-width:760px}

  /* revise: summary cards and sheets in columns */
  #rv > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #rv > .stack > .grph,#rv > .stack > p,#rv > .stack > .search,#rv > .stack > .callout{grid-column:1/-1}
  #dgl,#lml,#tll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #dgl > .grph,#dgl > p,#lml > p,#tll > .grph{grid-column:1/-1}
  #rv .search,#rv > #dgl ~ .search{max-width:520px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flash{min-height:300px;max-width:760px;margin:0 auto;padding:32px 36px}
  .flash .front{font-size:22px}

  /* learn: era cards across the top */
  .eras{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}
  .les{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}

  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();

<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>

<title>Defence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Shared by every History page (built by tools/history/build.js).
   Layout: a manuscript folio — parchment paper, maroon ink, gold figures; one-column app with a bottom tab bar. */
:root{
  --paper:#f3efe4; --sheet:#fffdf6; --sunk:#e8e1cf;
  --ink:#241c14; --ink2:#5d5141; --rule:#d8cdb4;
  --blue:#7a2230; --on-blue:#ffffff; --blue-bg:#f4e2e1;
  --accent:#9a6a12; --accent-bg:#f8ecc9;
  --good:#1b6b4a; --good-bg:#ddefe4; --bad:#a8291f; --bad-bg:#f8e0dc;
  --warn-bg:#fcf0cf;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* era groups on the Learn screen */
.eras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.erac{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:grid;gap:6px}
.erac b{font-family:var(--f-display);font-size:15px;font-weight:700;line-height:1.25}
.erac .hi{font-size:12px;color:var(--ink2)}
.erac .mt{font-family:var(--f-num);font-size:11px;color:var(--ink2)}
.erac .meter{height:6px}
.erac[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.grph{display:flex;align-items:baseline;gap:8px;padding:14px 2px 4px;border-top:2px solid var(--ink);margin-top:4px}
.grph h2{font-size:17px}
.grph span{font-size:12px;color:var(--ink2);margin-left:auto;font-family:var(--f-num)}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}
.dots{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--rule);display:block}
.dots i.on{background:var(--accent)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.hot{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px;font-size:15px}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.facts.prose dd{font-weight:400;line-height:1.55}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap,.link{border-radius:var(--r);padding:12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.link{background:var(--sunk);border-color:transparent}
.trick .lab,.trap .lab,.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.link .lab{color:var(--ink2)}
.mn{font-family:var(--f-num);font-weight:600;background:var(--sheet);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.tag.src{background:var(--good-bg);color:var(--good)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:22px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
/* one-line revision rows (last week / last moment) */
.lines{display:grid;gap:0}
.lines div{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px dashed var(--rule);font-size:15px}
.lines div:first-child{border-top:0}
.lines b{font-weight:700}
.lines span{color:var(--ink2)}
.callout{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;font-size:15px}

/* plan maker */
.plancfg{display:grid;gap:12px}
.pday{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.pday > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pday > summary::-webkit-details-marker{display:none}
.pday .dno{font-family:var(--f-num);font-weight:700;font-size:13px;background:var(--sunk);border-radius:99px;padding:2px 10px;white-space:nowrap}
.pday.cur .dno{background:var(--blue);color:var(--on-blue)}
.pday.allgood .dno{background:var(--good-bg);color:var(--good)}
.pday .dt{min-width:0;font-weight:600;font-size:15px}
.pday .dt small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
.pday .dp{font-family:var(--f-num);font-size:12px;color:var(--ink2);white-space:nowrap}
.pday .body{padding:0 14px 12px;display:grid;gap:8px;border-top:1px dashed var(--rule);margin-top:2px;padding-top:10px}
.ptask{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;width:100%;font-size:15px}
.ptask .box{width:22px;height:22px;border-radius:6px;border:1.6px solid var(--rule);display:grid;place-items:center;font-size:14px;color:var(--on-blue);margin-top:1px}
.ptask[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.ptask[aria-pressed="true"] .lbl{text-decoration:line-through;color:var(--ink2)}
.ptask .lbl small{display:block;font-size:12px;color:var(--ink2);text-decoration:none}
/* the story first: plain-language opener for beginners */
.story{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;font-size:16.5px;line-height:1.65}
.story .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.story p{margin:0}
.story .key{background:var(--blue-bg);border-radius:8px;padding:8px 12px;font-size:15px;line-height:1.5}
.story .key b{color:var(--blue)}
/* hub: app cards and the beginner path */
.appcs{display:grid;gap:12px}
.appc{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;text-align:left;width:100%;cursor:pointer}
.appc:hover{border-color:var(--blue)}
.appc .hd{display:flex;align-items:center;gap:10px}
.appc .ic{font-size:26px;line-height:1}
.appc .hd b{font-family:var(--f-display);font-size:17px;font-weight:700;display:block}
.appc .hd small{font-size:12px;color:var(--ink2)}

const LESSONS = [
{"id":"F1","heat":2,"title":"The armed forces: structure, mottos and academies","hi":"सशस्त्र बल: संरचना, आदर्श वाक्य और अकादमियाँ","blocks":[{"k":"hot","h":"Expect: <b>Supreme Commander<\/b> (the President), the <b>Chief of Defence Staff<\/b>, <b>mottos<\/b> of the three services, and <b>where<\/b> the IMA, NDA and other academies are."},{"k":"story","h":"<p>India's armed forces have three services — the <b>Army<\/b>, the <b>Navy<\/b> and the <b>Air Force<\/b> — under the Ministry of Defence. Their <b>Supreme Commander<\/b> is the <b>President of India<\/b>. Since 1 January 2020 a <b>Chief of Defence Staff<\/b> (CDS) heads the Department of Military Affairs and works for jointness among the three; the first CDS was General <b>Bipin Rawat<\/b>.<\/p><p>Each service has a Sanskrit or English motto: the Army's 'Service Before Self', the Navy's 'Sham No Varunah' and the Air Force's 'Nabhah Sparsham Deeptam' from the Gita. Young officers train at the <b>NDA<\/b> (Khadakwasla), then the <b>IMA<\/b> (Dehradun), the <b>Naval Academy<\/b> (Ezhimala) or the <b>Air Force Academy<\/b> (Dundigal).<\/p>","key":"Supreme Commander = President; first CDS = Bipin Rawat (2020); IMA Dehradun, NDA Khadakwasla."},{"k":"table","title":"Mottos","head":["Force","Motto","Meaning / source"],"rows":[["Indian Army","Service Before Self",""],["Indian Navy","Sham No Varunah","'May the Lord of the Waters be auspicious unto us' (from the Taittiriya Upanishad)."],["Indian Air Force","Nabhah Sparsham Deeptam","'Touch the sky with glory' — from the Bhagavad Gita."],["Indian Coast Guard","Vayam Rakshamah","'We protect'."],["Border Security Force","Duty unto Death","Jeevan Paryant Kartavya."],["National Security Guard","Sarvatra Sarvottam Suraksha",""],["Assam Rifles","Friends of the North East",""],["National Cadet Corps","Unity and Discipline",""]]},{"k":"table","title":"Academies and where they are","head":["Institution","Place","Note"],"rows":[["Indian Military Academy","Dehradun","Trains Army officers; set up in 1932."],["National Defence Academy","Khadakwasla, Pune","First tri-service academy in the world; 1954."],["Officers Training Academy","Chennai","Short Service Commission officers."],["Indian Naval Academy","Ezhimala, Kerala",""],["Air Force Academy","Dundigal, Hyderabad",""],["Defence Services Staff College","Wellington, Tamil Nadu",""],["National Defence College","New Delhi",""],["College of Defence Management","Secunderabad",""],["High Altitude Warfare School","Gulmarg",""],["Counter Insurgency and Jungle Warfare School","Vairengte, Mizoram",""],["Rashtriya Indian Military College","Dehradun",""]]},{"k":"trick","h":"Navy's motto has <b>Varuna<\/b> (god of the sea) in it; the Air Force's has <b>Nabhah<\/b> (sky). <b>NDA = Khadakwasla<\/b> (K for Kadets), <b>IMA = Dehradun<\/b>."},{"k":"trap","h":"The <b>President<\/b> is Supreme Commander, not the Prime Minister or the Defence Minister. <b>'Service Before Self'<\/b> is the Army's motto. <b>NDA<\/b> is in Pune (Khadakwasla), not Dehradun."}],"sum":["The President is the Supreme Commander of the armed forces.","The first Chief of Defence Staff was General Bipin Rawat (1 January 2020).","Mottos: Army 'Service Before Self', Navy 'Sham No Varunah', Air Force 'Nabhah Sparsham Deeptam', Coast Guard 'Vayam Rakshamah'.","IMA Dehradun (1932), NDA Khadakwasla (1954), Naval Academy Ezhimala, Air Force Academy Dundigal.","High Altitude Warfare School — Gulmarg; Jungle Warfare School — Vairengte."],"part":["Part 1 · The armed forces","सशस्त्र बल"],"g":"df"},
{"id":"F2","heat":1,"title":"Commands of the Army, Navy and Air Force","hi":"थल, नौ और वायु सेना की कमान","blocks":[{"k":"hot","h":"Now and then: <b>headquarters of a command<\/b> (Northern Command — Udhampur, Eastern Naval — Visakhapatnam, Eastern Air — Shillong) and the <b>Andaman and Nicobar Command<\/b>, India's only tri-service command."},{"k":"story","h":"<p>Each service divides India into <b>commands<\/b>. The Army has seven, the Navy three, the Air Force seven. Learn them as a map: the Army's <b>Northern<\/b> command watches J&K from Udhampur; the <b>Eastern<\/b> Army and Navy commands sit in Kolkata and Visakhapatnam; the Air Force's <b>Eastern<\/b> command is up in Shillong.<\/p><p>In 2001 India created the <b>Andaman and Nicobar Command<\/b> at Port Blair — its first command where all three services work under one commander. The <b>Strategic Forces Command<\/b> (2003) manages nuclear weapons.<\/p>","key":"Army 7, Navy 3, Air Force 7; tri-service: Andaman and Nicobar Command (Port Blair, 2001)."},{"k":"table","title":"Commands and headquarters","head":["Command","Headquarters","Note"],"rows":[["Northern Command (Army)","Udhampur",""],["Western Command (Army)","Chandimandir",""],["Eastern Command (Army)","Kolkata",""],["Southern Command (Army)","Pune","Oldest Army command."],["Central Command (Army)","Lucknow",""],["South Western Command (Army)","Jaipur","Newest Army command (2005)."],["Army Training Command","Shimla",""],["Western Naval Command","Mumbai",""],["Eastern Naval Command","Visakhapatnam",""],["Southern Naval Command","Kochi","Training command of the Navy."],["Western Air Command","New Delhi",""],["Eastern Air Command","Shillong",""],["Central Air Command","Prayagraj",""],["South Western Air Command","Gandhinagar",""],["Southern Air Command","Thiruvananthapuram",""],["Training Command (IAF)","Bengaluru",""],["Maintenance Command (IAF)","Nagpur",""],["Andaman and Nicobar Command","Port Blair","India's first and only integrated tri-service theatre command (2001)."]]},{"k":"trick","h":"Navy's three on the coast — <b>West Mumbai, East Vizag, South Kochi<\/b>. IAF's odd ones: <b>Central = Prayagraj, Maintenance = Nagpur, Training = Bengaluru<\/b>."},{"k":"trap","h":"<b>Eastern Command<\/b> (Army) is Kolkata but <b>Eastern Air Command<\/b> is Shillong. <b>Western Command<\/b> (Army) is Chandimandir; <b>Western Air Command<\/b> is New Delhi. <b>Southern Command<\/b> (Army) is Pune; <b>Southern Naval Command<\/b> is Kochi."}],"sum":["Army commands: Northern Udhampur, Western Chandimandir, Eastern Kolkata, Southern Pune, Central Lucknow, South Western Jaipur, Training Shimla.","Naval commands: Western Mumbai, Eastern Visakhapatnam, Southern Kochi.","Air commands: Western New Delhi, Eastern Shillong, Central Prayagraj, South Western Gandhinagar, Southern Thiruvananthapuram.","IAF Training Command — Bengaluru; Maintenance Command — Nagpur.","Andaman and Nicobar Command (Port Blair, 2001) is the only tri-service theatre command."],"part":["Part 1 · The armed forces","सशस्त्र बल"],"g":"df"},
{"id":"F3","heat":2,"title":"Ranks, gallantry awards and firsts","hi":"रैंक, वीरता पुरस्कार और प्रथम","blocks":[{"k":"hot","h":"Popular: <b>Param Vir Chakra<\/b> (highest wartime) vs <b>Ashoka Chakra<\/b> (highest peacetime), the <b>first PVC<\/b>, <b>Field Marshals<\/b>, the only <b>Marshal of the IAF<\/b>, <b>equivalent ranks<\/b> (Colonel = Captain = Group Captain), and women firsts."},{"k":"story","h":"<p>Gallantry awards come in two ladders. In <b>war<\/b>: Param Vir Chakra, Maha Vir Chakra, Vir Chakra. In <b>peace<\/b>: Ashoka Chakra, Kirti Chakra, Shaurya Chakra. The very first Param Vir Chakra went to <b>Major Somnath Sharma<\/b>, killed defending Srinagar airfield at Badgam in 1947. The medal itself was designed by <b>Savitri Khanolkar<\/b>, born in Switzerland.<\/p><p>Only three officers have held five-star rank: Field Marshals <b>Sam Manekshaw<\/b> and <b>K. M. Cariappa<\/b>, and Marshal of the Air Force <b>Arjan Singh<\/b>.<\/p>","key":"War: PVC → MVC → VrC. Peace: Ashoka → Kirti → Shaurya. Five-stars: Manekshaw, Cariappa, Arjan Singh."},{"k":"table","title":"Equivalent ranks","head":["Army","Navy","Air Force"],"rows":[["General","Admiral","Air Chief Marshal"],["Lieutenant General","Vice Admiral","Air Marshal"],["Major General","Rear Admiral","Air Vice Marshal"],["Brigadier","Commodore","Air Commodore"],["Colonel","Captain","Group Captain"],["Lieutenant Colonel","Commander","Wing Commander"],["Major","Lieutenant Commander","Squadron Leader"],["Captain","Lieutenant","Flight Lieutenant"],["Lieutenant","Sub Lieutenant","Flying Officer"]]},{"k":"table","title":"Gallantry and service awards","head":["Award","Rank","Note"],"rows":[["Param Vir Chakra","Highest wartime gallantry award","First awarded to Major Somnath Sharma (1947, posthumous); designed by Savitri Khanolkar."],["Maha Vir Chakra","Second-highest wartime gallantry award",""],["Vir Chakra","Third-highest wartime gallantry award",""],["Ashoka Chakra","Highest peacetime gallantry award","Also given to civilians — e.g. Neerja Bhanot; Rakesh Sharma received it too."],["Kirti Chakra","Second-highest peacetime gallantry award",""],["Shaurya Chakra","Third-highest peacetime gallantry award",""],["Param Vishisht Seva Medal","Highest award for distinguished service (not gallantry)",""]]},{"k":"table","title":"Firsts and famous names","head":["Who","Name","Note"],"rows":[["First Indian Commander-in-Chief of the Army","K. M. Cariappa","Took over on 15 January 1949 — Army Day."],["First Field Marshal","Sam Manekshaw","Made Field Marshal in 1973 after the 1971 victory."],["Second Field Marshal","K. M. Cariappa","Conferred in 1986."],["Only Marshal of the Indian Air Force","Arjan Singh","Five-star rank, 2002."],["First Chief of Defence Staff","Bipin Rawat","Took office on 1 January 2020."],["First Param Vir Chakra","Somnath Sharma","Battle of Badgam, 1947."],["First women fighter pilots of the IAF","Avani Chaturvedi, Bhawana Kanth and Mohana Singh","Commissioned in 2016."],["First woman to become Lieutenant General","Punita Arora",""],["First woman Air Marshal","Padmavathy Bandopadhyay",""],["First woman Rafale pilot","Shivangi Singh",""],["Missile Man of India","A. P. J. Abdul Kalam","Led the Integrated Guided Missile Development Programme."],["Missile Woman of India","Tessy Thomas","Led the Agni-IV project."]]},{"k":"trick","h":"Peacetime ladder <b>A-K-S<\/b> — <i>“Always Keep Smiling”<\/i>: Ashoka, Kirti, Shaurya. Wartime ladder <b>P-M-V<\/b> — Param, Maha, Vir (biggest word first)."},{"k":"trap","h":"<b>Colonel<\/b> (Army) = <b>Captain<\/b> (Navy) — but an Army <b>Captain<\/b> is only a Navy <b>Lieutenant<\/b>. <b>Ashoka Chakra<\/b> is peacetime; it is not the highest overall — the PVC is. <b>Manekshaw<\/b> was the first Field Marshal, Cariappa the second (though senior in age)."}],"sum":["Wartime gallantry: Param Vir Chakra, Maha Vir Chakra, Vir Chakra; peacetime: Ashoka, Kirti, Shaurya Chakra.","The first Param Vir Chakra went to Major Somnath Sharma (1947); the medal was designed by Savitri Khanolkar.","Field Marshals: Sam Manekshaw (first, 1973) and K. M. Cariappa (1986); Arjan Singh is the only Marshal of the IAF.","Colonel = Captain (Navy) = Group Captain; Brigadier = Commodore = Air Commodore.","The first women fighter pilots (2016): Avani Chaturvedi, Bhawana Kanth, Mohana Singh."],"part":["Part 1 · The armed forces","सशस्त्र बल"],"g":"df"},
{"id":"F4","heat":2,"title":"Paramilitary and central forces","hi":"अर्धसैनिक और केंद्रीय बल","blocks":[{"k":"hot","h":"Which force <b>guards which border<\/b> (BSF, ITBP, SSB, Assam Rifles), the <b>oldest<\/b> (Assam Rifles) and <b>largest<\/b> (CRPF) forces, the 'Black Cats' (NSG), and raising years are asked again and again."},{"k":"story","h":"<p>Behind the Army stand the <b>Central Armed Police Forces<\/b> under the Home Ministry. Learn them by the border they guard: the <b>BSF<\/b> faces Pakistan and Bangladesh, the <b>ITBP<\/b> the Himalayan border with China, the <b>SSB<\/b> the open borders with Nepal and Bhutan, and the <b>Assam Rifles<\/b> — India's oldest force, raised in 1835 — the Myanmar border.<\/p><p>Inside the country, the <b>CRPF<\/b> (the largest) handles internal security, the <b>CISF<\/b> guards airports and plants, and the <b>NSG<\/b> 'Black Cats' fight terror.<\/p>","key":"Pakistan & Bangladesh — BSF; China — ITBP; Nepal & Bhutan — SSB; Myanmar — Assam Rifles."},{"k":"table","title":"Forces and when they were raised","head":["Force","Raised","Role"],"rows":[["Border Security Force (BSF)","1965","Guards the Pakistan and Bangladesh borders — 'India's first line of defence'."],["Central Reserve Police Force (CRPF)","1939","Largest central armed police force; began as the Crown Representative's Police."],["Central Industrial Security Force (CISF)","1969","Guards industries, airports, the Delhi Metro and other key sites."],["Indo-Tibetan Border Police (ITBP)","1962","Guards the China border; called the 'Himveers'."],["Sashastra Seema Bal (SSB)","1963","Guards the Nepal and Bhutan borders."],["Assam Rifles","1835","Oldest paramilitary force; guards the Myanmar border; administered by the Home Ministry, operations under the Army."],["National Security Guard (NSG)","1984","Counter-terror force — the 'Black Cats'."],["Indian Coast Guard","1978","Under the Ministry of Defence."],["National Disaster Response Force (NDRF)","2006","Disaster relief, under the NDMA."],["Special Protection Group (SPG)","1988","Protects the Prime Minister."],["National Investigation Agency (NIA)","2009","Set up after the 26/11 Mumbai attacks."],["Research and Analysis Wing (R&AW)","1968","India's external intelligence agency."],["Intelligence Bureau (IB)","1887","One of the oldest intelligence agencies in the world; internal intelligence."]]},{"k":"table","title":"Who guards which border","head":["Neighbour","Force","Note"],"rows":[["Pakistan","BSF",""],["Bangladesh","BSF",""],["China","ITBP",""],["Nepal","SSB",""],["Bhutan","SSB",""],["Myanmar","Assam Rifles",""]]},{"k":"trick","h":"<b>“SSB = Shanti Seema”<\/b> — the peaceful open borders (Nepal, Bhutan). <b>ITBP = Tibet<\/b> in its name → China border."},{"k":"trap","h":"<b>Assam Rifles<\/b> (1835) is the oldest, but <b>CRPF<\/b> is the largest. The <b>Coast Guard<\/b> is under Defence, not Home. <b>NSG<\/b> is the 'Black Cats'; <b>SPG<\/b> protects the Prime Minister."}],"sum":["BSF (1965) guards the Pakistan and Bangladesh borders; ITBP (1962) the China border; SSB (1963) Nepal and Bhutan.","Assam Rifles (1835) is the oldest paramilitary force and guards the Myanmar border.","CRPF (1939) is the largest CAPF; CISF (1969) guards industries and airports.","NSG (1984) — the Black Cats; SPG (1988) protects the PM; NIA set up in 2009.","The Indian Coast Guard (1978) is under the Ministry of Defence."],"part":["Part 2 · Weapons and operations","हथियार और अभियान"],"g":"df"},
{"id":"F5","heat":3,"title":"Missiles, weapons and platforms","hi":"मिसाइल, हथियार और प्लेटफ़ॉर्म","blocks":[{"k":"hot","h":"Always one: <b>BrahMos<\/b> (India–Russia, name), <b>Agni<\/b> range, <b>Prithvi<\/b> / <b>Akash<\/b> / <b>Nag<\/b> type, <b>INS Vikrant<\/b>, <b>Tejas<\/b>, <b>Arjun<\/b>, <b>IGMDP<\/b> and <b>Mission Shakti<\/b>."},{"k":"story","h":"<p>In 1983 India started the <b>Integrated Guided Missile Development Programme<\/b> (IGMDP) under <b>A. P. J. Abdul Kalam<\/b>. It gave five missiles — remember <b>“PATNA”<\/b>: <b>P<\/b>rithvi (surface-to-surface), <b>A<\/b>gni (long-range ballistic), <b>T<\/b>rishul (short-range air defence), <b>N<\/b>ag (anti-tank), <b>A<\/b>kash (surface-to-air).<\/p><p>Then came <b>BrahMos<\/b> with Russia — named after the <b>Brahmaputra<\/b> and the <b>Moskva<\/b> — one of the fastest cruise missiles. At sea, <b>INS Vikrant<\/b> (2022) is India's first home-built aircraft carrier, and <b>INS Arihant<\/b> its first nuclear-powered missile submarine. In 2019 <b>Mission Shakti<\/b> shot down a satellite in orbit.<\/p>","key":"IGMDP (1983, Kalam) = PATNA: Prithvi, Agni, Trishul, Nag, Akash."},{"k":"table","title":"Weapons and platforms","head":["Name","What it is","Note"],"rows":[["Agni-V","Intercontinental-range ballistic missile (5,000+ km)","Mission Divyastra (March 2024) tested it with MIRV warheads."],["Prithvi","Surface-to-surface ballistic missile","The first missile of the IGMDP."],["Akash","Surface-to-air missile",""],["Trishul","Short-range surface-to-air missile","Part of the IGMDP."],["Nag","Anti-tank guided missile","'Fire and forget'."],["BrahMos","Supersonic cruise missile","India–Russia joint venture; named after the Brahmaputra and Moskva rivers."],["Nirbhay","Subsonic long-range cruise missile",""],["Astra","Beyond-visual-range air-to-air missile",""],["K-4","Submarine-launched ballistic missile","For the Arihant-class submarines."],["Pralay","Short-range quasi-ballistic surface-to-surface missile",""],["Rudram","Anti-radiation air-to-surface missile","Destroys enemy radars."],["Arjun","Main battle tank","Built by DRDO."],["Tejas","Light Combat Aircraft","Built by HAL."],["Rafale","Multirole fighter jet from France (Dassault)","36 inducted from 2020."],["Prachand","Light Combat Helicopter","Built by HAL; inducted 2022."],["Dhruv","Advanced Light Helicopter",""],["INS Vikrant","First indigenous aircraft carrier","Commissioned on 2 September 2022."],["INS Vikramaditya","Aircraft carrier bought from Russia","Formerly Admiral Gorshkov; commissioned 2013."],["INS Arihant","First indigenous nuclear-powered ballistic missile submarine",""],["INS Kalvari","First Scorpene-class submarine","Built in India with French help (2017)."],["Pinaka","Multi-barrel rocket launcher","Named after Lord Shiva's bow."],["S-400 Triumf","Long-range air-defence system from Russia",""],["Netra","Airborne early warning and control aircraft (AEW&C)",""]]},{"k":"facts","title":"Programmes and makers","rows":[["IGMDP","1983, led by A. P. J. Abdul Kalam"],["DRDO","Defence Research and Development Organisation, set up in 1958"],["HAL","Hindustan Aeronautics Limited, Bengaluru — Tejas, Dhruv, Prachand"],["Mission Shakti","Anti-satellite missile test, 27 March 2019"],["Mission Divyastra","Agni-V with MIRV (several warheads), March 2024"],["Missile Man of India","A. P. J. Abdul Kalam"],["Missile Woman of India","Tessy Thomas"]]},{"k":"trick","h":"<b>PATNA<\/b> for the IGMDP five. <b>BrahMos = Brahmaputra + Moskva<\/b>. <b>Nag<\/b> bites tanks; <b>Akash<\/b> watches the sky; <b>Prithvi<\/b> hits the ground."},{"k":"trap","h":"<b>Akash<\/b> is surface-to-<b>air<\/b>; <b>Prithvi<\/b> is surface-to-<b>surface<\/b>. <b>INS Vikramaditya<\/b> came from Russia; <b>INS Vikrant<\/b> (2022) was built in India. <b>Astra<\/b> is air-to-air, not surface-to-air."}],"sum":["IGMDP (1983, Kalam): Prithvi, Agni, Trishul, Nag, Akash.","BrahMos is an India–Russia supersonic cruise missile named after the Brahmaputra and Moskva.","Agni-V is an intercontinental-range missile; Mission Divyastra (2024) tested it with MIRV warheads.","INS Vikrant (2022) is India's first indigenous aircraft carrier; INS Arihant its first nuclear ballistic-missile submarine.","Tejas — light combat aircraft; Arjun — main battle tank; Mission Shakti (2019) — anti-satellite test."],"part":["Part 2 · Weapons and operations","हथियार और अभियान"],"g":"df"},
{"id":"F6","heat":3,"title":"Military and rescue operations","hi":"सैन्य और बचाव अभियान","blocks":[{"k":"hot","h":"Operation names are favourites — old ones (<b>Polo, Vijay, Meghdoot, Blue Star, Cactus<\/b>) and new ones (<b>Ganga, Kaveri, Ajay, Dost<\/b>, and <b>Operation Sindoor<\/b> of May 2025)."},{"k":"story","h":"<p>Every big operation gets a code name. In 1948 <b>Operation Polo<\/b> brought Hyderabad into India; in 1961 <b>Operation Vijay<\/b> freed Goa. In 1984 <b>Meghdoot<\/b> took the Siachen glacier, and in 1988 <b>Cactus<\/b> saved the Maldives government from a coup.<\/p><p>Recent operations are often <b>rescue missions<\/b>, named after rivers or friendship: <b>Ganga<\/b> brought students home from Ukraine (2022), <b>Kaveri<\/b> from Sudan and <b>Ajay<\/b> from Israel (2023), <b>Dost<\/b> helped quake-hit Turkey. In May 2025, after the Pahalgam terror attack, <b>Operation Sindoor<\/b> struck terror camps in Pakistan and PoK.<\/p>","key":"Rescue missions are named after rivers: Ganga (Ukraine), Kaveri (Sudan), Sindhu (Iran)."},{"k":"table","title":"Operations","head":["Operation","What it was","Note"],"rows":[["Operation Polo","Integration of Hyderabad State, 1948","Also called 'police action'."],["Operation Vijay (1961)","Liberation of Goa from Portugal","Kargil 1999 was also named Operation Vijay."],["Operation Trident","Attack on Karachi harbour, 1971","Remembered on Navy Day (4 December)."],["Operation Meghdoot","Securing the Siachen Glacier, 1984",""],["Operation Blue Star","Golden Temple, Amritsar, 1984",""],["Operation Pawan","Indian Peace Keeping Force in Sri Lanka, 1987",""],["Operation Cactus","Foiling a coup in the Maldives, 1988",""],["Operation Shakti","Pokhran-II nuclear tests, 1998","The 1974 test was 'Smiling Buddha'."],["Operation Safed Sagar","Air Force operations in the Kargil war, 1999",""],["Operation Parakram","Military build-up after the 2001 Parliament attack",""],["Operation Black Tornado","NSG operation in the 26/11 Mumbai attacks, 2008",""],["Operation Rahat","Evacuation from war-torn Yemen, 2015",""],["Operation Maitri","Relief after the Nepal earthquake, 2015",""],["Operation Samudra Setu","Navy bringing Indians home in the COVID-19 pandemic, 2020",""],["Operation Ganga","Evacuation of Indians from Ukraine, 2022",""],["Operation Dost","Earthquake relief in Turkey and Syria, 2023",""],["Operation Kaveri","Evacuation from Sudan, 2023",""],["Operation Ajay","Evacuation from Israel, 2023",""],["Operation Brahma","Earthquake relief in Myanmar, 2025",""],["Operation Sindoor","Strikes on terror camps in Pakistan and PoK, May 2025","Launched after the Pahalgam terror attack of April 2025."],["Operation Sindhu","Evacuation of Indians from Iran, June 2025",""]]},{"k":"trick","h":"River rescues — <b>“Ganga flew from Ukraine, Kaveri from Sudan, Sindhu from Iran”<\/b>. <b>Meghdoot<\/b> = messenger of the clouds → the high Siachen."},{"k":"trap","h":"<b>Operation Vijay<\/b> names two things: Goa 1961 and Kargil 1999. <b>Operation Shakti<\/b> was Pokhran-II (1998); <b>Smiling Buddha<\/b> was Pokhran-I (1974). <b>Safed Sagar<\/b> was the Air Force's Kargil role."}],"sum":["Operation Polo — Hyderabad, 1948; Operation Vijay — Goa, 1961 (and Kargil, 1999).","Operation Meghdoot — Siachen, 1984; Operation Blue Star — Golden Temple, 1984; Operation Cactus — Maldives, 1988.","Operation Shakti — Pokhran-II, 1998; Operation Safed Sagar — IAF in Kargil.","Rescues: Rahat (Yemen 2015), Ganga (Ukraine 2022), Kaveri (Sudan 2023), Ajay (Israel 2023), Dost (Turkey 2023).","Operation Sindoor (May 2025) struck terror camps in Pakistan and PoK after the Pahalgam attack."],"part":["Part 3 · Military exercises","सैन्य अभ्यास"],"g":"df"},
{"id":"F7","heat":3,"title":"Army exercises with other countries","hi":"अन्य देशों के साथ सैन्य अभ्यास","blocks":[{"k":"hot","h":"The commonest defence question: <b>'Exercise X is held between India and which country?'<\/b> Top picks: <b>Yudh Abhyas<\/b> (USA), <b>Mitra Shakti<\/b> (Sri Lanka), <b>Surya Kiran<\/b> (Nepal), <b>Sampriti<\/b> (Bangladesh), <b>Nomadic Elephant<\/b> (Mongolia), <b>Garuda Shakti<\/b> (Indonesia), <b>Dharma Guardian<\/b> (Japan)."},{"k":"story","h":"<p>Exercise names often hide a clue to the partner. <b>Nomadic Elephant<\/b> — the nomads of Mongolia. <b>Surya Kiran<\/b> — the sun rising over Nepal's Himalaya. <b>Dharma Guardian<\/b> — Japan's Buddhist heritage. <b>Harimau<\/b> means 'tiger' in Malay (Malaysia). <b>Dustlik<\/b> means 'friendship' in Uzbek. <b>Sampriti<\/b> (harmony) with neighbour Bangladesh.<\/p><p>The US partnership has two: <b>Yudh Abhyas<\/b> (regular army) and <b>Vajra Prahar<\/b> (special forces).<\/p>","key":"Use the name's language: Harimau (Malay — Malaysia), Dustlik (Uzbek), Nomadic (Mongolia)."},{"k":"table","title":"Army exercises and partners","head":["Exercise","Partner country","Note"],"rows":[["Yudh Abhyas","USA","India's longest-running army exercise with the US; 22nd edition in Uttarakhand, September 2026."],["Vajra Prahar","USA","Special forces exercise."],["Mitra Shakti","Sri Lanka",""],["Surya Kiran","Nepal",""],["Sampriti","Bangladesh",""],["Nomadic Elephant","Mongolia","17th edition at Ulaanbaatar, 2025."],["Maitree","Thailand","14th edition at Umroi, Meghalaya, 2025."],["Shakti","France",""],["Ajeya Warrior","United Kingdom",""],["Dharma Guardian","Japan",""],["Garuda Shakti","Indonesia","Special forces exercise."],["Harimau Shakti","Malaysia",""],["Lamitiye","Seychelles",""],["Ekuverin","Maldives",""],["Dustlik","Uzbekistan",""],["Khanjar","Kyrgyzstan","Special forces; 13th edition in Assam, 2026."],["KAZIND","Kazakhstan",""],["Al Najah","Oman",""],["Desert Cyclone","UAE","First held in 2024."],["AustraHind","Australia",""],["VINBAX","Vietnam",""],["Cyclone","Egypt","Special forces exercise."],["Sada Tanseeq","Saudi Arabia","First held in 2024."],["Bold Kurukshetra","Singapore","Armoured exercise; 14th edition at Jodhpur."],["CINBAX","Cambodia",""]]},{"k":"trick","h":"South Asian neighbours — <b>“Sun in Nepal, Friendship in Sri Lanka, Harmony in Bangladesh”<\/b>: Surya Kiran, Mitra Shakti, Sampriti. Two '-Shakti' traps: <b>Garuda Shakti = Indonesia<\/b>, <b>Harimau Shakti = Malaysia<\/b>; plain <b>Shakti = France<\/b>."},{"k":"trap","h":"<b>Garuda<\/b> (air, France) ≠ <b>Garuda Shakti<\/b> (army, Indonesia). <b>Shakti<\/b> (France) ≠ <b>Mitra Shakti<\/b> (Sri Lanka). <b>Ajeya Warrior<\/b> is with the UK; <b>Indradhanush<\/b> is the UK air exercise."}],"sum":["Yudh Abhyas and Vajra Prahar — USA; Shakti — France; Ajeya Warrior — UK.","Mitra Shakti — Sri Lanka; Surya Kiran — Nepal; Sampriti — Bangladesh; Ekuverin — Maldives.","Nomadic Elephant — Mongolia; Dharma Guardian — Japan; Maitree — Thailand; VINBAX — Vietnam.","Garuda Shakti — Indonesia; Harimau Shakti — Malaysia; Bold Kurukshetra — Singapore.","Dustlik — Uzbekistan; Khanjar — Kyrgyzstan; KAZIND — Kazakhstan; Al Najah — Oman; Cyclone — Egypt."],"part":["Part 3 · Military exercises","सैन्य अभ्यास"],"g":"df"},
{"id":"F8","heat":2,"title":"Naval and air exercises","hi":"नौसैनिक और वायु अभ्यास","blocks":[{"k":"hot","h":"Frequent: <b>Varuna<\/b> (France), <b>Konkan<\/b> (UK), <b>SIMBEX<\/b> (Singapore), <b>JIMEX<\/b> (Japan), <b>AUSINDEX<\/b> (Australia), <b>SLINEX<\/b> (Sri Lanka); air: <b>Garuda<\/b> (France), <b>Cope India<\/b> (USA), <b>Indradhanush<\/b> (UK)."},{"k":"story","h":"<p>Many naval exercise names are simple abbreviations: <b>SIMBEX<\/b> = Singapore–India Maritime Bilateral Exercise, <b>JIMEX<\/b> = Japan–India, <b>SLINEX<\/b> = Sri Lanka–India, <b>AUSINDEX<\/b> = Australia–India. <b>Varuna<\/b>, the sea god, is with France; <b>Konkan<\/b>, India's west coast, with the UK.<\/p><p>In the air, <b>Garuda<\/b> (the eagle) flies with France, <b>Cope India<\/b> with the USA, and <b>Indradhanush<\/b> (rainbow) with the UK.<\/p>","key":"Read the abbreviation: SIMBEX Singapore, JIMEX Japan, SLINEX Sri Lanka, AUSINDEX Australia."},{"k":"table","title":"Naval exercises","head":["Exercise","Partner","Note"],"rows":[["Varuna","France",""],["Konkan","United Kingdom",""],["SIMBEX","Singapore",""],["JIMEX","Japan",""],["AUSINDEX","Australia",""],["SLINEX","Sri Lanka",""],["Bongosagar","Bangladesh",""],["Samudra Shakti","Indonesia",""],["Zayed Talwar","UAE",""],["Naseem Al Bahr","Oman",""],["Al Mohed Al Hindi","Saudi Arabia",""],["Samudra Laksamana","Malaysia",""]]},{"k":"table","title":"Air exercises","head":["Exercise","Partner","Note"],"rows":[["Garuda","France","Air Force exercise — not to be confused with the Army's Garuda Shakti (Indonesia)."],["Cope India","USA",""],["Indradhanush","United Kingdom",""],["Shinyuu Maitri","Japan",""],["Veer Guardian","Japan","First fighter exercise with Japan, 2023."],["Eastern Bridge","Oman",""],["Udara Shakti","Malaysia",""],["Siam Bharat","Thailand",""],["Avia Indra","Russia",""]]},{"k":"trick","h":"France gets the gods: <b>Varuna (sea), Garuda (sky), Shakti (land)<\/b> — all three services with France have Hindu-myth names."},{"k":"trap","h":"<b>Konkan<\/b> is with the UK, not with any Konkan state. <b>Zayed Talwar<\/b> is UAE; <b>Naseem Al Bahr<\/b> is Oman; <b>Al Mohed Al Hindi<\/b> is Saudi Arabia."}],"sum":["Naval: Varuna — France; Konkan — UK; SIMBEX — Singapore; JIMEX — Japan; AUSINDEX — Australia.","SLINEX — Sri Lanka; Bongosagar — Bangladesh; Samudra Shakti — Indonesia; Zayed Talwar — UAE.","Air: Garuda — France; Cope India — USA; Indradhanush — UK; Shinyuu Maitri and Veer Guardian — Japan.","Eastern Bridge — Oman; Udara Shakti — Malaysia; Avia Indra — Russia.","France has an exercise in all three services: Shakti, Varuna, Garuda."],"part":["Part 3 · Military exercises","सैन्य अभ्यास"],"g":"df"},
{"id":"F9","heat":3,"title":"Multilateral exercises and the latest editions","hi":"बहुपक्षीय अभ्यास और नवीनतम संस्करण","blocks":[{"k":"hot","h":"Asked often: <b>Malabar<\/b> (the Quad navies), <b>MILAN<\/b> (India-hosted), <b>RIMPAC<\/b>, <b>Red Flag<\/b>, <b>Pitch Black<\/b>, <b>Tarang Shakti<\/b> (India's first multinational air exercise) and where the <b>latest edition<\/b> of an exercise was held."},{"k":"story","h":"<p>Some exercises bring many countries together. <b>Malabar<\/b> started in 1992 between India and the US and now includes all four <b>Quad<\/b> navies (with Japan and Australia). India hosts <b>MILAN<\/b> at Visakhapatnam, and in 2024 held <b>Tarang Shakti<\/b>, its first multinational air exercise. The US hosts <b>RIMPAC<\/b> near Hawaii and <b>Red Flag<\/b> in Alaska and Nevada; Australia hosts <b>Pitch Black<\/b>.<\/p><p>Current-affairs questions ask about the <b>latest edition<\/b> — its number, venue and month. Those change every year, so the table below is dated.<\/p>","key":"Malabar = Quad navies; MILAN = India hosts; Tarang Shakti = India's first multinational air exercise (2024)."},{"k":"table","title":"Multilateral and India's own exercises","head":["Exercise","Who takes part","Note"],"rows":[["Malabar","India, USA, Japan and Australia","Began in 1992 as an India–US naval exercise; all four Quad navies since 2020."],["INDRA","India and Russia (tri-service)",""],["Tiger Triumph","India and USA (tri-service amphibious)",""],["MILAN","Many navies, hosted by India","Held at Visakhapatnam in 2024 and 2026."],["RIMPAC","Many navies, hosted by the USA (Hawaii)","Rim of the Pacific — the world's largest maritime exercise."],["Red Flag","Many air forces, hosted by the USA (Alaska / Nevada)",""],["Pitch Black","Many air forces, hosted by Australia",""],["Tarang Shakti","Many air forces, hosted by India","India's first multinational air exercise, 2024."],["Desert Knight","India, France and UAE (air)",""],["Bright Star","Many countries, hosted by Egypt",""],["Sea Dragon","Anti-submarine exercise led by the USA (Guam)",""],["Cope Thunder","USA and the Philippines",""],["Desert Flag","Many air forces, hosted by the UAE",""],["Blue Flag","Many air forces, hosted by Israel",""],["Zapad","Many countries, hosted by Russia","India took part in 2025."],["TROPEX","Indian Navy's own theatre-level exercise",""],["Sea Vigil","India's coastal defence exercise",""],["Dosti","Coast guards of India, Maldives and Sri Lanka",""]]},{"k":"table","title":"Recent editions (as of October 2026)","head":["Edition","Partner","Where and when"],"rows":[["Yudh Abhyas 2026 (22nd)","USA","Auli, Uttarakhand — September 2026."],["Mountain Guardian 2026","UAE","Mountain warfare, Uttarakhand — October 2026."],["Khanjar 2026 (13th)","Kyrgyzstan","Misamari, Assam — February 2026."],["Dustlik 2026","Uzbekistan","Pune — April 2026."],["Lamitiye 2026","Seychelles","Seychelles Defence Academy."],["Yudh Abhyas 2025 (21st)","USA","Fort Wainwright, Alaska — September 2025."],["Maitree 2025 (14th)","Thailand","Umroi, Meghalaya — September 2025."],["Nomadic Elephant 2025 (17th)","Mongolia","Ulaanbaatar — 2025."]]},{"k":"trick","h":"<b>MILAN<\/b> means 'meeting' — India meets many navies at Vizag. <b>Malabar<\/b> = India's Malabar coast, where it began."},{"k":"trap","h":"<b>Malabar<\/b> is multilateral now, not just India–US. <b>TROPEX<\/b> and <b>Sea Vigil<\/b> are India's own exercises — there is no partner country. Edition numbers and venues change every year — check the latest before your exam."}],"sum":["Malabar began in 1992 (India–US) and now has the four Quad navies: India, USA, Japan, Australia.","INDRA is India's tri-service exercise with Russia; Tiger Triumph a tri-service amphibious one with the USA.","MILAN is hosted by India at Visakhapatnam; Tarang Shakti (2024) was India's first multinational air exercise.","RIMPAC (Hawaii) and Red Flag are US-hosted; Pitch Black is Australia's; Bright Star is Egypt's.","Latest: Yudh Abhyas 2026 (22nd) at Auli; Mountain Guardian 2026 with the UAE in Uttarakhand."],"part":["Part 3 · Military exercises","सैन्य अभ्यास"],"g":"df"}
];

/* ---------- home ---------- */
function renderLab(){
  labStyle(); labStop();
  const L = labS();
  const sp = (LAB_CONF.specials || []).find(x => x.id === LAB.view); if (sp) return sp.open();
  const { r, nx } = labRank(L.xp || 0);

    <div class="lab-games">
      ${(LAB_CONF.specials || []).map(s => `<button type="button" class="lab-g${s.wide ? " wide" : ""}" data-lab-go="${s.id}"><span class="t"><span aria-hidden="true">${s.ico}</span><b>${esc(s.title)}</b></span><small>${s.sub}</small><span class="best">${s.best ? s.best(L) : ""}</span></button>`).join("")}
      ${LAB_CONF.decks.map(card).join("")}
      ${LAB_CONF.match ? `<button type="button" class="lab-g" data-lab-go="match"><span class="t"><span aria-hidden="true">🃏</span><b>Memory Match</b></span><small>${esc(LAB_CONF.match.sub)}</small><span class="best">${L.match ? "Best: " + L.match + " moves" : "Not played yet"}</span></button>` : ""}
    </div>
    <div class="block"><h3>How to use the Lab</h3><p class="muted" style="margin:0">Read a lesson first, then play its game until you can answer in about three seconds — that is the speed the exam needs. Each game lasts 60 seconds: right answers in a row build a combo for bonus points. Tap <b>See all pairs</b> on a game to revise its list.</p></div>

const labBack = () => `<div class="lhead"><button class="back" type="button" data-lab-home>‹ Lab</button></div>`;
function labBindHome(){ $("#app").querySelectorAll("[data-lab-home]").forEach(b => b.onclick = () => { labStop(); LAB.view = "home"; renderLab(); window.scrollTo(0,0); }); }

/* ---------- quiz games (60 seconds) ---------- */
function labDeck(id){
  const d = LAB_CONF.decks.find(x => x.id === id);
  const ask = (pre, t) => pre ? `${pre} ${t}${/[?:]$/.test(pre) ? "" : "?"}` : t;
  let items = d.make ? d.make() : d.pairs.map(p => ({ p: ask(d.q, p[0]), a: p[1], note: p[2] || "", raw: p[0], pool: "a" }));
  if (d.rq && !d.make) {   // also ask the other way round, where an answer belongs to one prompt only
    const n = {}; d.pairs.forEach(p => { n[p[1]] = (n[p[1]] || 0) + 1; });
    items = items.concat(d.pairs.filter(p => n[p[1]] === 1).map(p => ({ p: ask(d.rq, p[1]), a: p[0], note: p[2] || "", raw: p[1], pool: "p" })));
  }
  return { d, items };
}
function labIntro(id){
  const { d } = labDeck(id), L = labS();
  const list = d.list ? d.list() : d.pairs;
  $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}
    <div class="block stack lab-pop" style="text-align:center"><div style="font-size:46px" aria-hidden="true">${d.ico}</div><h1 style="margin:0">${esc(d.title)}</h1><p class="muted" style="margin:0">${esc(d.sub)} · 60 seconds · combos for answers in a row</p>
      <p style="margin:0">${L.best[d.id] ? "Your best: <b>" + L.best[d.id] + "</b>" : "First go — no pressure."}</p>
      <div class="row" style="justify-content:center"><button class="btn pri" type="button" id="labgo">▶ Start</button><button class="btn" type="button" id="labpairs">See all pairs</button>${d.lesson ? `<button class="btn ghost" type="button" id="lablesson">Read the lesson</button>` : ""}</div></div>
    <div id="labpairlist"></div></section>`;
  labBindHome();
  $("#labgo").onclick = () => labRun(id);
  $("#labpairs").onclick = () => { $("#labpairlist").innerHTML = `<div class="block"><h3>${list.length} pairs to know</h3><div class="lab-pairs">${list.map(p => `<div><span>${esc(p[0])}</span><b>${esc(p[1])}</b></div>`).join("")}</div></div>`; };
  const lb = $("#lablesson"); if (lb) lb.onclick = () => openLesson(d.lesson, "learn");
}
let LG = null;
function labRun(id){
  labStop();
  const { d, items } = labDeck(id);
  LG = { d, items: shuffle(items), i: 0, score: 0, right: 0, tried: 0, combo: 0, maxc: 0, left: 60, miss: [], lock: false };
  $("#app").innerHTML = `<section class="view stack lab-play">
    <div class="lab-hud"><button class="back" type="button" id="labquit">✕ Stop</button><span class="lab-combo" id="labcombo"></span><span class="sc" id="labscore">0</span></div>
    <div class="lab-time" id="labtime"><i style="width:100%"></i></div>
    <div class="lab-q" id="labq" aria-live="polite"></div>
    <div class="lab-opts" id="labopts"></div>
    <div class="lab-flash" id="labflash"></div></section>`;
  $("#labquit").onclick = () => { labStop(); labOver(); };
  labNext();
  LAB.timer = setInterval(() => {
    LG.left--; const t = $("#labtime"); if (!t) { labStop(); return; }
    t.firstElementChild.style.width = (LG.left / 60 * 100) + "%"; t.classList.toggle("low", LG.left <= 10);
    if (LG.left <= 0) { labStop(); labOver(); }
  }, 1000);
}
function labOptions(it){
  const d = LG.d;
  if (d.opts) return d.opts.slice();
  if (d.options) return d.options(it);
  // wrong options come from the same side of the deck as the answer (names with names, dates with dates)
  const answers = [...new Set(it.all || LG.items.filter(x => x.pool === it.pool).map(x => x.a))].filter(a => a !== it.a);
  const pool = shuffle(answers).slice(0, 3);
  return shuffle([it.a].concat(pool));
}
function labNext(){
  if (LG.i >= LG.items.length) { LG.items = shuffle(LG.items); LG.i = 0; }
  const it = LG.items[LG.i], opts = labOptions(it);
  LG.cur = it; LG.lock = false;
  const q = $("#labq"); q.innerHTML = `<span class="lab-pop">${esc(it.p)}</span>`;
  const box = $("#labopts"); box.className = "lab-opts" + (opts.length === 3 ? " three" : "");
  box.innerHTML = opts.map(o => `<button type="button" data-o="${esc(o)}">${esc(o)}</button>`).join("");
  box.querySelectorAll("button").forEach(b => b.onclick = () => labPick(b));
}
function labPick(b){
  if (LG.lock) return; LG.lock = true;
  const it = LG.cur, ok = b.dataset.o === it.a;
  LG.tried++;
  if (ok) {
    LG.right++; LG.combo++; LG.maxc = Math.max(LG.maxc, LG.combo);
    const gain = 10 + Math.min(LG.combo - 1, 5) * 2;
    LG.score += gain; b.classList.add("ok");
    $("#labflash").textContent = it.note ? it.note : "+" + gain;
  } else {
    LG.combo = 0; b.classList.add("no");
    $("#labopts").querySelectorAll("button").forEach(x => { if (x.dataset.o === it.a) x.classList.add("ok"); });
    LG.miss.push(it); $("#labflash").textContent = (it.note ? it.note + " · " : "") + "Answer: " + it.a;
  }
  $("#labscore").textContent = LG.score;
  $("#labcombo").textContent = LG.combo >= 2 ? "🔥 ×" + LG.combo : "";
  LG.i++;
  setTimeout(() => { if (LAB.timer && $("#labopts")) labNext(); }, ok ? 450 : 1200);
}
function labOver(){
  const L = labS(), id = LG.d.id, best = !L.best[id] || LG.score > L.best[id];
  if (best && LG.score > 0) L.best[id] = LG.score;
  L.xp = (L.xp || 0) + LG.right; L.plays = (L.plays || 0) + 1; save();
  const acc = LG.tried ? Math.round(LG.right * 100 / LG.tried) : 0, seen = new Set();
  const miss = LG.miss.filter(m => { if (seen.has(m.p)) return false; seen.add(m.p); return true; });
  const { r } = labRank(L.xp);
  $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}
    <div class="block lab-res lab-pop"><span class="eyebrow">${esc(LG.d.title)}</span><div class="big">${LG.score}</div>
      <p>${best && LG.score > 0 ? "🎉 New best!" : "Best: " + (L.best[id] || 0)} · ${LG.right}/${LG.tried} right (${acc}%) · longest combo ${LG.maxc} · +${LG.right} XP</p>
      <p class="muted" style="margin:0">${r[2]} ${r[1]} · ${L.xp} XP</p>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn pri" type="button" id="again">Play again</button><button class="btn" type="button" data-lab-home>More games</button></div></div>
    ${miss.length ? `<div class="block"><h3>Fix these ${miss.length}</h3><div class="lab-miss">${miss.map(m => `<div><span>${esc(m.p)}</span><b>${esc(m.a)}</b></div>`).join("")}</div></div>` : (LG.tried ? `<div class="block"><p style="margin:0">💯 No mistakes — try to beat your score.</p></div>` : "")}
  </section>`;
  labBindHome();
  $("#again").onclick = () => labRun(id);
}

/* ---------- memory match ---------- */
function labMatch(){
  labStop();
  const all = LAB_CONF.decks.find(d => d.id === LAB_CONF.match.deck).pairs, n = {};
  all.forEach(p => { n[p[1]] = (n[p[1]] || 0) + 1; });
  const pairs = shuffle(all.filter(p => n[p[1]] === 1)).slice(0, 6);
  const cards = shuffle(pairs.flatMap((p, i) => [{ k: i, t: p[0] }, { k: i, t: p[1] }]));
  const M = { cards, up: [], done: new Set(), moves: 0, t0: Date.now() };
  const draw = () => {
    $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}
      <div class="lab-hud"><div><span class="eyebrow">Memory Match</span><h2 style="margin:4px 0 0">${esc(LAB_CONF.match.title)}</h2></div><span class="sc">${M.moves} moves</span></div>
      <div class="mm">${M.cards.map((c, i) => `<button type="button" data-i="${i}" class="${M.done.has(c.k) ? "done" : M.up.includes(i) ? "up" : ""}" aria-label="${M.done.has(c.k) || M.up.includes(i) ? esc(c.t) : "Hidden card " + (i + 1)}">${M.done.has(c.k) || M.up.includes(i) ? esc(c.t) : "?"}</button>`).join("")}</div></section>`;
    labBindHome();
    $("#app").querySelectorAll(".mm button").forEach(b => b.onclick = () => flip(+b.dataset.i));
  };
  const flip = i => {
    if (M.up.length === 2 || M.up.includes(i) || M.done.has(M.cards[i].k)) return;
    M.up.push(i); draw();
    if (M.up.length === 2) {
      M.moves++;
      const [a, b] = M.up;
      if (M.cards[a].k === M.cards[b].k) { M.done.add(M.cards[a].k); M.up = []; setTimeout(() => { draw(); if (M.done.size === 6) done(); }, 250); }
      else setTimeout(() => { M.up = []; draw(); }, 900);
    }
  };
  const done = () => {
    const L = labS(), best = !L.match || M.moves < L.match; if (best) L.match = M.moves;
    L.xp = (L.xp || 0) + 12; L.plays = (L.plays || 0) + 1; save();
    $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}<div class="block lab-res lab-pop"><span class="eyebrow">Memory Match</span><div class="big">${M.moves}</div>
      <p>moves · ${Math.round((Date.now() - M.t0) / 1000)} s · ${best ? "🎉 New best!" : "Best: " + L.match + " moves"} · +12 XP</p>
      <div class="lab-pairs" style="text-align:left">${pairs.map(p => `<div><span>${esc(p[0])}</span><b>${esc(p[1])}</b></div>`).join("")}</div>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn pri" type="button" id="again">New cards</button><button class="btn" type="button" data-lab-home>More games</button></div></div></section>`;
    labBindHome(); $("#again").onclick = labMatch;
  };
  draw(); window.scrollTo(0, 0);
}


/* ---------- decks from the lessons' own tables ---------- */
/** Rows of a lesson's n-th table as [prompt, answer, note] (tags stripped), so a deck never repeats the data. */
function labRows(lessonId, n){
  const strip = s => String(s == null ? "" : s).replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&minus;/g, "−").trim();
  const l = LESSONS.find(x => x.id === lessonId), t = l ? l.blocks.filter(b => b.k === "table")[n || 0] : null;
  return t ? t.rows.map(r => [strip(r[0]), strip(r[1]), strip(r[2])]) : [];
}
/** A "grand mix" deck: a few rows from every listed deck, with each deck's own question wording. */
function labMix(decks){
  // wrong options come from the whole deck (all), so a deck drawn only once or twice in the 80 still has enough
  return shuffle(decks.flatMap(d => { const all = [...new Set(d.pairs.map(p => p[1]))];
    return d.pairs.map(p => ({ p: d.q ? `${d.q} ${p[0]}${/[?:]$/.test(d.q) ? "" : "?"}` : p[0], a: p[1], note: p[2] || "", pool: d.id, all })); })).slice(0, 80);
}

<script>
"use strict";
/* ============================================================
   Workbook engine — shared by the History and Computer Knowledge pages (tools/workbook/lib.js puts it in each one).
   APP.mode "era": a subject app with its own lessons and questions (Learn · Practice · Mock · Revise · Plan).
   APP.mode "hub": start here, a plan across a family of apps, and revision across all of them (no questions of its own).
   Optional data: APP.hub (a family hub to link to), HEATMAP (where the marks come from, by exam),
   a question's 8th field (the paper it was reported from), APP.tabs (the tabs, in order) — a tab the engine
   does not know (e.g. Chemistry's "lab") is drawn by the page's own script: render<Tab>() and, when you
   leave it, leave<Tab>().
   ============================================================ */
const HUB = APP.mode === "hub";
const EMBED = (() => { try { return window.parent !== window; } catch(e) { return true; } })();
const TABS = HUB ? ["start","plan","revise"] : (APP.tabs || ["learn","practice","mock","revise","plan"]);

/* ============================================================
   HELPERS & STATE
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hash = s => { let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5)+h + s.charCodeAt(i))|0; return "q"+(h>>>0).toString(36); };
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; };
const L = id => LESSONS.find(l => l.id === id);
const LNUM = id => LESSONS.findIndex(l => l.id === id) + 1;
const G = id => GROUPS.find(g => g.id === id) || GROUPS[0];
const A = id => APP.apps.find(a => a.id === id);
const appOf = id => (L(id) && L(id).app) || APP.id;       // in the hub, each lesson carries the app it lives in

const QS = QB.map(r => {
  const fixed = !!r[6];
  return { t:r[0], q:r[1], o:r[2], e:r[3], p:(r[4]||"").includes("p"), a: fixed ? (r[5]||0) : 0, fixed, id:hash(r[1]), src: r[7] || "" };
});
const byLesson = id => QS.filter(q => q.t === id);
const makePerm = q => q.fixed ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i));
const qCount = id => HUB ? null : byLesson(id).length;
const pCount = id => HUB ? ((APP.pcount||{})[id] || 0) : byLesson(id).filter(q=>q.p).length;

const KEY = APP.key;
let S = { ans:{}, bm:{}, les:{}, mocks:[], plan:null };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const record = (q, ok) => { S.ans[q.id] = ok ? 1 : 0; save(); renderTop(); };

/* Another History app's saved progress. Every page is on the same site, so the hub (and a
   plan) can see which lessons you have read and quizzed in the subject apps. */
function appState(a){ try { return JSON.parse(localStorage.getItem(a.key) || "{}") || {}; } catch(e) { return {}; } }
function lessonState(id){
  const owner = appOf(id);
  if (owner === APP.id) return S.les[id] || {};
  const a = A(owner); return a ? ((appState(a).les || {})[id] || {}) : {};
}
const lesDone = l => !!lessonState(l.id).done;
const heatDots = n => `<span class="dots" aria-label="Asked ${n===3?"almost every shift":n===2?"often":"now and then"}">${[1,2,3].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>`;

/* Open a lesson or a tab, here or in the History app it lives in. Inside पाठShala the
   app is asked to switch (so your session is tracked); on its own the page just navigates. */
function openApp(appId, lesson, tab){
  if (appId === APP.id) {
    if (lesson) openLesson(lesson, "learn"); else go(tab || TABS[0]);
    return;
  }
  const a = APP.hub && appId === APP.hub.id ? APP.hub : A(appId);
  if (!a) return;
  const here = () => { location.href = a.file + (lesson ? "?lesson=" + encodeURIComponent(lesson) : "") + (tab ? "#" + tab : ""); };
  if (!EMBED) return here();
  let ok = false;
  const onAck = e => { if (e.origin === location.origin && e.data && e.data.type === "shabd-open-ok") ok = true; };
  window.addEventListener("message", onAck);
  try { window.parent.postMessage({ type:"shabd-open", mod:a.id, lesson: lesson || null, tab: tab || null }, location.origin); } catch(e) {}
  setTimeout(() => { window.removeEventListener("message", onAck); if (!ok) here(); }, 700);
}
const hubLink = (before, label, tab, after) => APP.hub ? before + goLink(label, APP.hub.id, null, tab) + (after || "") : "";
const goLink = (label, appId, lesson, tab) => `<button type="button" class="golink" data-go="${esc(JSON.stringify([appId, lesson||null, tab||null]))}">${label}</button>`;
function bindGo(root){
  root.querySelectorAll("[data-go]").forEach(b => b.onclick = ev => { ev.stopPropagation(); const g = JSON.parse(b.dataset.go); openApp(g[0], g[1], g[2]); });
}

function renderTop(){
  if (HUB) {
    const done = LESSONS.filter(lesDone).length;
    $("#topstat").innerHTML = `<b>${done}</b>/${LESSONS.length} lessons<br>in ${APP.apps.length} apps`;
    return;
  }
  const ids = Object.keys(S.ans).filter(k => QS.some(q => q.id === k));
  const right = ids.filter(k => S.ans[k] === 1).length;
  const pct = ids.length ? Math.round(right*100/ids.length) : 0;
  $("#topstat").innerHTML = `<b>${ids.length}</b>/${QS.length} tried<br><b>${pct}%</b> right now`;
}

/* ============================================================
   ROUTING
   ============================================================ */
let TAB = TABS[0];
let timerId = null;
function go(tab){
  if (!TABS.includes(tab)) tab = TABS[0];
  const own = t => t.charAt(0).toUpperCase() + t.slice(1);
  if (TAB !== tab && typeof window["leave" + own(TAB)] === "function") window["leave" + own(TAB)]();
  TAB = tab;
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.tab===tab ? "page" : "false"));
  if (tab === "start") renderStart();
  if (tab === "learn") renderLearn();
  if (tab === "practice") renderPractice();
  if (tab === "mock") renderMock();
  if (tab === "revise") renderRevise();
  if (tab === "plan") renderPlan();
  if (!["start","learn","practice","mock","revise","plan"].includes(tab) && typeof window["render" + own(tab)] === "function") window["render" + own(tab)]();
  window.scrollTo(0,0);
  try { history.replaceState(null, "", location.pathname + location.search + "#" + tab); } catch(e) {}
}
document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => {
  if (TAB === "mock" && M && M.running && b.dataset.tab !== "mock") { go("mock"); showMockLeave(b.dataset.tab); return; }
  go(b.dataset.tab);
}));

/* ============================================================
   START HERE (hub)
   ============================================================ */
function renderStart(){
  const done = LESSONS.filter(lesDone).length;
  const cards = APP.apps.map(a => {
    const ls = LESSONS.filter(l => l.app === a.id), d = ls.filter(lesDone).length, it = INTROS[a.id] || {};

      <div class="meter" aria-label="Lessons done in every History app"><i style="width:${done/LESSONS.length*100}%"></i></div>

      <p class="muted" style="font-size:13px;margin-top:8px">The dots next to each lesson show how often its topic comes up: three dots means almost every shift.</p></div>

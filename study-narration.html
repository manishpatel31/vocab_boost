/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();

<script>
"use strict";
const IS = "Select the option that expresses the given sentence in indirect speech. ";
const DS = "Select the option that expresses the given sentence in direct speech. ";
const LESSONS = [
{ id:"L1", heat:3, title:"SSC CGL pattern & exam strategy", hi:"परीक्षा पैटर्न और रणनीति", sum:["About one narration question per CGL Tier 1 shift; one to three in Tier 2.", "Check RJPTW: reporting verb, joining word, pronouns, tense, time and place words.", "Most wrong options keep the original tense or time word."], blocks:[
 {k:"hot", h:"<b>Narration (direct–indirect speech) is asked in almost every SSC English section.</b> CGL Tier 1 (25 questions, +2 / −0.5) usually has <b>one</b> narration question in a shift. CGL Tier 2 (Paper 1, Module II: 45 questions, +3 / −1) has <b>one to three</b>. CHSL, CPO and Selection Post ask it in the same format. With the method below it takes 25–35 seconds."},
 {k:"table", title:"Where narration is asked in SSC exams", head:["Exam","English section","Narration questions (usual)","Marking"], rows:[
  ["CGL Tier 1","25 questions","0–1 per shift, mostly 1","+2 / −0.5"],
  ["CGL Tier 2 (Paper 1, Module II)","45 questions","1–3","+3 / −1"],
  ["CHSL Tier 1","25 questions","0–1","+2 / −0.5"],
  ["CPO Paper 1","50 questions","1–2","+1 / −0.25"],
  ["Selection Post / Stenographer","25–200 (by level)","1–2","Varies"]]},
 {k:"p", h:"<b>The wording is fixed:</b> “Select the option that expresses the given sentence in indirect speech” (or “in direct speech”). Four full sentences are given. They usually differ in only one or two places, so you are checking <b>five things</b>: the reporting verb, the joining word, the pronouns, the tense, and the time/place words."},
 {k:"table", title:"Recent pattern (2023–2025 shifts): what the sentences test", head:["Type","How often","Typical sentence"], rows:[
  ["Statements with tense change","Very often","He said, “I am writing a letter.”"],
  ["Questions (asked if / asked wh-)","Very often","She said to me, “Where do you live?”"],
  ["Commands and requests","Often","The teacher said to us, “Do not make a noise.”"],
  ["Time and place words","Often","He said, “I will come tomorrow.”"],
  ["Exclamations, wishes, greetings","Regular","She said, “What a lovely view!”"],
  ["Indirect → direct","Regular (about 1 in 4)","He told me that he was busy."],
  ["Exceptions (universal truth, past perfect, modals)","Tier 2 favourite","The teacher said, “The sun rises in the east.”"]]},
 {k:"trick", h:"<b>The 30-second elimination (RJPTW).</b> (1) <b>R</b>eporting verb: said to → told / asked / ordered / requested. (2) <b>J</b>oining word: that / if / whether / wh-word / to. (3) <b>P</b>ronouns: SON rule. (4) <b>T</b>ense: one step back if the reporting verb is past. (5) <b>W</b>ords of time and place: now → then, tomorrow → the next day. Most distractors fail at T or W."},
 {k:"trap", h:"SSC distractors are built from <b>one wrong change</b>: <i>is</i> left as <i>is</i>, <i>will</i> left as <i>will</i>, <i>tomorrow</i> left as <i>tomorrow</i>, a question left in question order (<i>asked where did I live</i>), or <i>said me</i> instead of <i>told me</i>."},
 {k:"link", h:"Narration and active–passive voice appear side by side and both test tense control. Revise them together; the Voice mini app uses the same layout."},
 {k:"q", q:"Which check usually removes the most wrong options in a narration question?", o:["The tense and time words","The spelling of names","The length of the sentence","The full stop"], e:"Most distractors keep the original tense or time word."}
]},
{ id:"L2", heat:3, title:"Basic rules: reporting verb & pronouns", hi:"मूल नियम · रिपोर्टिंग वर्ब और सर्वनाम", sum:["said → said; said to + person → told + person.", "Statement → that; question → if / whether / wh-word; order → to.", "SON rule: 1st person → subject, 2nd person → object, 3rd person → no change."], blocks:[
 {k:"hot", h:"Every narration question uses these rules. Pronoun mistakes are the second most common SSC distractor after tense."},
 {k:"p", h:"In <b>direct speech</b> the exact words are inside inverted commas: <i>Ram said, “I am tired.”</i> In <b>indirect speech</b> we report them in our own words: <i>Ram said that he was tired.</i> The verb outside the commas (<i>said</i>) is the <b>reporting verb</b>; the words inside are the <b>reported speech</b>."},
 {k:"formula", title:"Five steps of direct → indirect", rows:[
  ["1. Reporting verb","said → said; said to + person → told + person","He said to me → He told me"],
  ["2. Joining word","statement → that; question → if/whether or wh-word; order → to","told me that …"],
  ["3. Pronouns","SON rule (below)","“I” → he / she"],
  ["4. Tense","one step back if the reporting verb is in the past","am → was, will → would"],
  ["5. Time / place","near words → far words","now → then, here → there"]]},
 {k:"table", title:"SON rule for pronouns", head:["Person inside the commas","Changes to match","Example"], rows:[
  ["1st person (I, me, my, we, us, our)","<b>S</b>ubject of the reporting verb","He said, “I am ill.” → He said that <b>he</b> was ill."],
  ["2nd person (you, your)","<b>O</b>bject of the reporting verb","She said to me, “You are late.” → She told me that <b>I</b> was late."],
  ["3rd person (he, she, it, they)","<b>N</b>o change","He said, “She is clever.” → He said that she was clever."]]},
 {k:"ex", src:"PYQ-type · CGL Tier 1 format", q:"Select the option that expresses the given sentence in indirect speech.<br><i>Rita said to me, “You have done your work well.”</i>", steps:["said to me → <b>told me</b>","Statement → <b>that</b>","you (2nd person) → object of reporting verb = me → <b>I</b>; your → my","has/have done → <b>had done</b>"], ans:"Rita told me that I had done my work well."},
 {k:"trap", h:"<b>said me</b> and <b>told that</b> are both wrong. <i>told</i> must have a person after it (<i>told me that</i>); <i>said</i> must not (<i>said that</i>, or <i>said to me that</i> — rare)."},
 {k:"trick", h:"Do pronouns before tense. Once <i>I</i> has become <i>he</i>, the verb agreement (<i>was</i>, not <i>were</i>) follows easily."},
 {k:"q", q:"He said to her, “I like your dress.” Indirect:", o:["He told her that he liked her dress.","He told her that I liked your dress.","He said her that he liked her dress.","He told her that he likes her dress."], e:"said to → told; I → he; your → her; like → liked."}
]},
{ id:"L3", heat:3, title:"Tense change (backshift)", hi:"काल परिवर्तन", sum:["Past reporting verb → one step back: is → was, has → had, will → would.", "Simple past → past perfect (saw → had seen); past perfect stays.", "Present reporting verb (says) → no tense change."], blocks:[
 {k:"hot", h:"Tense is tested in nearly every SSC narration question. If the reporting verb is in the <b>past</b> (said, told, asked), the tense inside goes <b>one step back</b>."},
 {k:"formula", title:"Backshift table", rows:[
  ["Simple present → simple past","V1 / V5 → V2","“I write” → he wrote"],
  ["Present continuous → past continuous","is / am / are + Ving → was / were + Ving","“I am writing” → he was writing"],
  ["Present perfect → past perfect","has / have + V3 → had + V3","“I have written” → he had written"],
  ["Present perfect continuous → past perfect continuous","has been + Ving → had been + Ving","“I have been writing” → he had been writing"],
  ["Simple past → past perfect","V2 → had + V3","“I wrote” → he had written"],
  ["Past continuous → past perfect continuous","was + Ving → had been + Ving","“I was writing” → he had been writing"],
  ["Past perfect","no change","“I had written” → he had written"],
  ["will / shall → would","will / shall + V1 → would + V1","“I will write” → he would write"],
  ["can / may → could / might","modal + V1","“I can write” → he could write"]]},
 {k:"formula", title:"When the tense does NOT change", rows:[
  ["Reporting verb in present / future","says, will say → no backshift","He says, “I am busy” → He says that he is busy"],
  ["Universal truth / scientific fact","stays in present","The sun rises in the east"],
  ["Habitual fact still true","may stay in present","She said that she goes for a walk daily"],
  ["Past perfect, would, could, might, should, ought to, used to","no change","“I could swim” → he could swim"]]},
 {k:"ex", src:"PYQ-type · CGL Tier 1 format", q:"Select the option that expresses the given sentence in indirect speech.<br><i>He said, “I am writing a letter.”</i>", steps:["said → said that","I → he","am writing → <b>was writing</b>"], ans:"He said that he was writing a letter."},
 {k:"ex", src:"PYQ-type · CGL Tier 2 format", q:"Select the option that expresses the given sentence in indirect speech.<br><i>She said, “I bought this car last year.”</i>", steps:["bought (simple past) → <b>had bought</b>","this → that; last year → <b>the previous year</b>"], ans:"She said that she had bought that car the previous year."},
 {k:"trap", h:"<b>Simple past → past perfect</b>, not simple past. <i>“I saw him”</i> → <i>he had seen him</i>. SSC options often keep <i>saw</i>."},
 {k:"trick", h:"Think of each helping verb moving one step: is → was, has → had, was → had been, will → would, can → could, may → might. Past perfect is already at the back: it stays."},
 {k:"q", q:"She said, “I have finished my homework.” Indirect:", o:["She said that she had finished her homework.","She said that she has finished her homework.","She said that she finished her homework.","She said that I had finished my homework."], e:"has finished → had finished; I → she; my → her."}
]},
{ id:"L4", heat:2, title:"Exceptions & modals", hi:"अपवाद और मॉडल", sum:["Universal truths, habitual facts and historical facts keep their tense.", "can → could, may → might, must → had to (deduction stays must).", "would, could, should, might, ought to, used to: no change."], blocks:[
 {k:"hot", h:"Exceptions are a <b>Tier 2 favourite</b> and appear in Tier 1 about once a month. The universal-truth exception is the one SSC asks most."},
 {k:"formula", title:"Modal changes", rows:[
  ["will / shall","→ would","“I shall go” → he would go"],
  ["can","→ could","“I can help” → he could help"],
  ["may (possibility / permission)","→ might","“It may rain” → it might rain"],
  ["may (wish)","→ might (in a wish) / prayed that … might","“May you live long!” → prayed that I might live long"],
  ["must (obligation)","→ had to (or must)","“I must go” → he had to go"],
  ["must (deduction / permanent rule)","→ no change","“He must be tired” → he must be tired"],
  ["would, could, might, should, ought to, used to, had better","→ no change","“You should rest” → I should rest"]]},
 {k:"formula", title:"No-change cases", rows:[
  ["Universal truth","present stays","The teacher said that the earth revolves around the sun"],
  ["Historical fact","simple past may stay","He said that Akbar ruled India for many years"],
  ["Unreal past (wish / if only / it is time)","past stays","He said that he wished he were rich"],
  ["Conditional type 2 / 3","no change","He said that if he had money he would buy a car"],
  ["Past perfect","no change","She said that she had already eaten"]]},
 {k:"ex", src:"PYQ-type · CGL Tier 1 format", q:"Select the option that expresses the given sentence in indirect speech.<br><i>The teacher said, “The earth revolves around the sun.”</i>", steps:["Universal truth → tense does <b>not</b> change","said → said that"], ans:"The teacher said that the earth revolves around the sun."},
 {k:"trap", h:"An option with <i>revolved</i> is a trap for universal truths. But a <i>personal</i> present fact (<i>“I live in Delhi”</i>) <b>does</b> backshift → <i>he lived in Delhi</i>."},
 {k:"trick", h:"<b>Modals already in the past form never move:</b> would, could, might, should, ought to. If the option changes <i>should</i> to <i>should have</i>, it is wrong."},
 {k:"q", q:"He said, “You should take some rest.” Indirect (he said this to me):", o:["He told me that I should take some rest.","He told me that I should have taken some rest.","He told me that you should take some rest.","He told me that I shall take some rest."], e:"should does not change."}
]},
{ id:"L5", heat:3, title:"Time & place words", hi:"समय और स्थान सूचक शब्द", sum:["now → then, today → that day, tonight → that night.", "yesterday → the previous day, tomorrow → the next day, ago → before.", "this → that, these → those, here → there."], blocks:[
 {k:"hot", h:"Time words decide about one SSC narration question in three: often <b>two options are identical except for one time word</b>."},
 {k:"table", title:"Near → far words", head:["Direct","Indirect"], rows:[
  ["now","then"],["today","that day"],["tonight","that night"],["yesterday","the previous day / the day before"],["tomorrow","the next day / the following day"],
  ["last night","the previous night / the night before"],["last week / year","the previous week / year"],["next week / month","the following week / month"],["ago","before"],["this","that"],["these","those"],["here","there"],["hence","thence"],["thus","so / in that way"],["come","go (when the place changes)"]]},
 {k:"ex", src:"PYQ-type · CGL Tier 1 format", q:"Select the option that expresses the given sentence in indirect speech.<br><i>He said, “I will come here tomorrow.”</i>", steps:["will → would","here → there","tomorrow → the next day"], ans:"He said that he would come there the next day."},
 {k:"trap", h:"<i>ago</i> → <i>before</i> (not <i>back</i>), <i>yesterday</i> → <i>the previous day</i> (not <i>the last day</i>), and <i>this</i> → <i>that</i> only when it is a time/place pointer, not inside a fixed name."},
 {k:"trick", h:"If the reporting verb is <b>present</b> (<i>says</i>) or the speech is reported the same day and place, time words need not change. SSC almost always uses <i>said</i>, so change them."},
 {k:"q", q:"She said, “I met him two days ago.” Indirect:", o:["She said that she had met him two days before.","She said that she met him two days ago.","She said that she had met him two days ago.","She said that she has met him two days before."], e:"met → had met; ago → before."}
]},
{ id:"L6", heat:3, title:"Questions (interrogative)", hi:"प्रश्नवाचक वाक्य", sum:["Reporting verb becomes ‘asked’.", "Yes/no question → if / whether; wh-question → wh-word.", "Use statement order and drop do / does / did and the question mark."], blocks:[
 {k:"hot", h:"Questions come up very often. SSC tests three things: <b>asked</b> (not said/told), <b>if / whether</b> or the wh-word, and <b>statement word order</b> without a question mark."},
 {k:"formula", title:"Question patterns", rows:[
  ["Reporting verb","said / said to → asked / enquired of","He said to me → He asked me"],
  ["Yes/no question","asked + if / whether + statement order","“Are you ready?” → asked if I was ready"],
  ["Wh-question","asked + wh-word + statement order","“Where do you live?” → asked where I lived"],
  ["do / does / did","drop it and change the main verb","“Do you like tea?” → asked if I liked tea"],
  ["End","full stop, no question mark","… where I lived."]]},
 {k:"ex", src:"PYQ-type · CGL Tier 1 format", q:"Select the option that expresses the given sentence in indirect speech.<br><i>She said to me, “Where do you live?”</i>", steps:["said to → asked","Keep “where”, statement order: where + I + verb","do you live → I lived"], ans:"She asked me where I lived."},
 {k:"ex", src:"PYQ-type · CGL Tier 2 format", q:"Select the option that expresses the given sentence in indirect speech.<br><i>He said to her, “Have you seen my keys?”</i>", steps:["Yes/no → asked her <b>if</b>","have you seen → she had seen","my → his"], ans:"He asked her if she had seen his keys."},
 {k:"trap", h:"<i>He asked me where did I live</i> and <i>He asked me that where I lived</i> are the classic wrong options: no question order and no <i>that</i> before a wh-word."},
 {k:"trick", h:"Look at the end of each option: one that still ends with <b>?</b> is wrong in indirect speech."},
 {k:"q", q:"He said to me, “Are you coming with us?” Indirect:", o:["He asked me if I was coming with them.","He asked me if I was coming with us.","He asked me that was I coming with them.","He told me if I was coming with them."], e:"asked + if; you → I; us → them; are → was."}
]},
{ id:"L7", heat:3, title:"Commands, requests & suggestions", hi:"आज्ञा, अनुरोध और सुझाव", sum:["Orders: ordered / told + (not) to + V1.", "Requests: Please → requested + to + V1.", "Let’s → suggested that … should."], blocks:[
 {k:"hot", h:"Imperatives appear often. The key is choosing the reporting verb from the tone and using <b>to + V1</b> (or <b>not to + V1</b>)."},
 {k:"formula", title:"Imperative patterns", rows:[
  ["Order","ordered / commanded + person + to V1","“Stand up.” → The teacher ordered the boy to stand up"],
  ["Request (please)","requested + person + to V1 (drop please)","“Please help me.” → She requested me to help her"],
  ["Advice","advised + person + to V1","“Work hard.” → He advised me to work hard"],
  ["Negative","told / ordered + person + not to V1 (or forbade + to V1)","“Don’t shout.” → He told me not to shout"],
  ["Let’s (suggestion)","suggested / proposed that + we/they + should + V1","“Let’s go out.” → He suggested that they should go out"],
  ["Let (permission)","asked / requested + to let / allow","“Let me go.” → He requested to be allowed to go"],
  ["Sir / Madam","respectfully","“Sir, please listen.” → He respectfully requested his teacher to listen"]]},
 {k:"ex", src:"PYQ-type · CGL Tier 1 format", q:"Select the option that expresses the given sentence in indirect speech.<br><i>The teacher said to the students, “Do not make a noise.”</i>", steps:["Command → <b>told / ordered</b>","Negative → <b>not to</b> + V1","No tense change in a to-infinitive"], ans:"The teacher told the students not to make a noise."},
 {k:"ex", src:"PYQ-type · CHSL format", q:"Select the option that expresses the given sentence in indirect speech.<br><i>He said, “Let’s go for a picnic.”</i>", steps:["Let’s = suggestion → <b>suggested that</b>","we → they; add <b>should</b>"], ans:"He suggested that they should go for a picnic."},
 {k:"trap", h:"<i>He suggested them to go</i> is wrong — <i>suggest</i> does not take person + to. Use <i>suggested that they should go</i>. Also <i>requested me please to help</i> is wrong: drop <i>please</i>."},
 {k:"trick", h:"<b>Please → requested. Don’t → not to. Let’s → suggested that … should.</b> Three patterns cover almost all imperatives."},
 {k:"q", q:"She said to me, “Please close the door.” Indirect:", o:["She requested me to close the door.","She requested me that I close the door please.","She ordered me to close the door.","She said me to close the door."], e:"Please → requested + to V1."}
]},
{ id:"L8", heat:2, title:"Exclamations, wishes & greetings", hi:"विस्मयादिबोधक, शुभकामनाएँ", sum:["Exclamations: exclaimed (with joy / sorrow) that it was a very …", "Wishes and blessings: wished / prayed that … might.", "Greetings: wished good morning, thanked, bade goodbye."], blocks:[
 {k:"hot", h:"Asked regularly in Tier 1 and Tier 2. The trick is choosing the <b>reporting verb with an adverb</b> and turning the exclamation into a statement."},
 {k:"formula", title:"Exclamatory & optative patterns", rows:[
  ["What / How …!","exclaimed (with joy / wonder) that it was a very …","“What a lovely view!” → She exclaimed that it was a very lovely view"],
  ["Alas!","exclaimed with sorrow / sadly that","“Alas! I am ruined.” → He exclaimed sadly that he was ruined"],
  ["Hurrah!","exclaimed with joy that","“Hurrah! We have won.” → They exclaimed with joy that they had won"],
  ["Bravo! / Well done!","applauded / praised + person + saying that","“Well done!” → He applauded me"],
  ["May you …!","wished / prayed that + person + might","“May you live long!” → She prayed that I might live long"],
  ["Good morning / night","wished + person + good morning","“Good morning, sir.” → He wished his teacher good morning"],
  ["Thank you","thanked + person","“Thank you.” → She thanked me"],
  ["Goodbye","bade + person + goodbye","“Goodbye, friends.” → He bade his friends goodbye"]]},
 {k:"ex", src:"PYQ-type · CGL Tier 1 format", q:"Select the option that expresses the given sentence in indirect speech.<br><i>She said, “What a beautiful garden this is!”</i>", steps:["What a … ! → exclaimed that it was a very …","this → that; is → was"], ans:"She exclaimed that that was a very beautiful garden."},
 {k:"trap", h:"Keep the joining word <b>that</b> after <i>exclaimed</i>, and turn <i>What a / How</i> into <i>very</i>. Options that keep the exclamation mark are wrong."},
 {k:"trick", h:"<b>May you …</b> is always a wish or prayer → <i>wished / prayed that … might</i>."},
 {k:"q", q:"The old man said to me, “May God bless you!” Indirect:", o:["The old man prayed that God might bless me.","The old man prayed that God may bless you.","The old man told me that God bless me.","The old man ordered that God might bless me."], e:"May … ! → prayed that … might; you → me."}
]},
{ id:"L9", heat:2, title:"Mixed & multiple sentences", hi:"मिश्रित और अनेक वाक्य", sum:["Join two statements with ‘and added that’; a statement and a question with ‘and asked’.", "Yes / No → replied in the affirmative / negative.", "Sir / Madam → respectfully."], blocks:[
 {k:"hot", h:"Tier 2 likes longer speech: a statement plus a question, an answer with Yes/No, or two sentences. Each part gets its own reporting verb, joined by <b>and</b>."},
 {k:"formula", title:"Joining patterns", rows:[
  ["Statement + statement","said that … and added that …","“I am tired. I will rest.” → said that he was tired and added that he would rest"],
  ["Statement + question","said that … and asked …","“I am lost. Can you help me?” → said that he was lost and asked if I could help him"],
  ["Yes / No answer","replied in the affirmative / negative","“Yes,” he said → He replied in the affirmative"],
  ["Yes + clause","replied that + clause","“Yes, I will come.” → He replied that he would come"],
  ["Vocative (name / Sir)","becomes the object of the reporting verb","“Ravi, sit down.” → He told Ravi to sit down"],
  ["Order + reason","told … to … as / because …","“Hurry up, we are late.” → told me to hurry up as we were late"]]},
 {k:"ex", src:"PYQ-type · CGL Tier 2 format", q:"Select the option that expresses the given sentence in indirect speech.<br><i>He said to me, “I am new here. Can you show me the way?”</i>", steps:["First part: told me that he was new there","Second part: and asked if I could show him the way"], ans:"He told me that he was new there and asked if I could show him the way."},
 {k:"trap", h:"Do not use one reporting verb for two different kinds of sentence. <i>He told me that he was new there and that could I show him the way</i> is wrong."},
 {k:"trick", h:"Split the speech at each full stop or question mark. Convert each piece with its own pattern, then join with <i>and added / and asked / and told</i>."},
 {k:"q", q:"“Yes,” she said, “I can drive.” Indirect:", o:["She replied that she could drive.","She replied in the negative that she could drive.","She said yes that I can drive.","She replied that she can drove."], e:"Yes + clause → replied that + backshifted clause."}
]},
{ id:"L10", heat:2, title:"Indirect → direct", hi:"अप्रत्यक्ष से प्रत्यक्ष", sum:["Indirect → direct: told → said to, put the words in inverted commas.", "Move the tense forward and change then → now, that day → today.", "Restore question order and the question mark for questions."], blocks:[
 {k:"hot", h:"About one SSC narration question in four asks for the <b>direct</b> form. Reverse each step: put the words back in inverted commas and move tenses one step <b>forward</b>."},
 {k:"formula", title:"Reverse the steps", rows:[
  ["Reporting verb","told + person → said to + person; asked → said to + person","He told me → He said to me"],
  ["Remove that / if","add inverted commas and the right punctuation (. ? !)","asked if → said, “Are …?”"],
  ["Pronouns","the speaker becomes I; the listener becomes you","told me that he … → said to me, “I …”"],
  ["Tense forward","was → is, had → has/have (or simple past), would → will, could → can","he would come → “I will come”"],
  ["Time words","then → now, the next day → tomorrow, that → this, there → here","the previous day → yesterday"],
  ["Commands","ordered / requested + to V1 → imperative (add Please for requested)","requested me to sit → said to me, “Please sit.”"]]},
 {k:"ex", src:"PYQ-type · CGL Tier 1 format", q:"Select the option that expresses the given sentence in direct speech.<br><i>He told me that he was busy then.</i>", steps:["told me → said to me","he → I; was → am","then → now"], ans:"He said to me, “I am busy now.”"},
 {k:"trap", h:"<i>had + V3</i> in indirect may come from simple past <b>or</b> present perfect in direct. Check the time words: <i>the previous day</i> → yesterday (simple past); no time word → often <i>has / have</i>."},
 {k:"trick", h:"Check punctuation in the options: a question must end with <b>?</b> inside the commas, a command must start with a bare verb, an exclamation with <b>What / How / Alas</b> and end with <b>!</b>."},

]},
{ id:"L11", heat:2, title:"Tier 2 tricky sentences", hi:"टियर 2 के कठिन वाक्य", sum:["Shall I / we → asked if … should.", "Question tags are dropped in indirect speech.", "Conditional type 1 backshifts both parts; types 2 and 3 do not change."], blocks:[
 {k:"hot", h:"Tier 2 uses longer, formal sentences: reporting verbs in the present tense, <i>must</i>, conditionals, <i>let</i> for permission, and questions with <i>shall I</i>."},
 {k:"formula", title:"Tricky types", rows:[
  ["Present reporting verb","says / tells → no backshift","He says, “I am busy.” → He says that he is busy"],
  ["Shall I / Shall we (offer / advice)","asked + if / whether + he/they + should","“Shall I open the window?” → He asked if he should open the window"],
  ["Shall (pure future)","would","“I shall be late.” → He said that he would be late"],
  ["Conditional","if-clause: type 1 backshifts; types 2 and 3 stay","“If it rains, I will stay.” → … if it rained he would stay"],
  ["Question tag","drop the tag, report as a statement","“You are new, aren’t you?” → asked if I was new"],
  ["Let (permission)","asked to be allowed / requested … to let","“Let me go home.” → He asked to be allowed to go home"],
  ["Must (deduction)","stays must","“She must be at home.” → he said that she must be at home"]]},
 {k:"ex", src:"PYQ-type · CGL Tier 2 format", q:"Select the option that expresses the given sentence in indirect speech.<br><i>He said to me, “Shall I bring you a glass of water?”</i>", steps:["Shall I (offer) → asked if he <b>should</b>","you → me"], ans:"He asked me if he should bring me a glass of water."},
 {k:"trap", h:"With <i>says</i> or <i>will say</i> nothing backshifts. An option with <i>was</i> for “He says, ‘I am …’” is wrong."},
 {k:"trick", h:"Before converting, look at the <b>reporting verb’s tense</b>. Present → keep tenses; past → backshift. That one glance decides two options."},
 {k:"q", q:"She says, “I am going to the market.” Indirect:", o:["She says that she is going to the market.","She says that she was going to the market.","She said that she was going to the market.","She says that I am going to the market."], e:"Present reporting verb → no tense change."}
]},

  ["Reporting verb","said to → told / asked / ordered / requested / suggested"],
  ["Joining word","that · if / whether · wh-word · to · not to"],
  ["Pronouns","SON: 1st → subject, 2nd → object, 3rd → no change"],
  ["Tense","one step back after a past reporting verb; none after says"],
  ["Exceptions","universal truth, past perfect, would / could / might / should"],
  ["Time words","now → then, today → that day, tomorrow → the next day, ago → before"]]},

const LESSONS = [
{"id":"L1","heat":2,"title":"Texts and terms of classical dance","hi":"शास्त्रीय नृत्य के ग्रंथ और शब्द","blocks":[{"k":"hot","h":"Asked again and again: <b>who wrote the Natya Shastra<\/b> (Bharata Muni), the <b>Abhinaya Darpana<\/b> (Nandikeshvara), the meaning of <b>mudra<\/b>, <b>nritta / nritya / natya<\/b>, and <b>tandava vs lasya<\/b>."},{"k":"story","h":"<p>Every Indian classical dance traces itself to one book: the <b>Natya Shastra<\/b> of <b>Bharata Muni<\/b>, written roughly 2,000 years ago. It covers drama, dance and music, and was so respected it was called the <b>fifth Veda<\/b>. Later, <b>Nandikeshvara<\/b> wrote the <b>Abhinaya Darpana<\/b> ('mirror of gesture'), still the handbook of hand gestures for Bharatanatyam dancers.<\/p><p>These texts split dance into three: <b>nritta<\/b> (pure rhythm), <b>nritya<\/b> (expression with meaning) and <b>natya<\/b> (drama). Expression — <b>abhinaya<\/b> — comes through the body, voice, costume and inner feeling, and its goal is <b>rasa<\/b>, the mood the audience tastes. Dance itself has two moods: Shiva's vigorous <b>tandava<\/b> and Parvati's graceful <b>lasya<\/b>.<\/p>","key":"Natya Shastra — Bharata Muni; Abhinaya Darpana — Nandikeshvara; nritta pure, nritya expressive, natya drama; tandava Shiva, lasya Parvati."},{"k":"photos","title":"In pictures","items":[["Natya_Shastra","Natya Shastra","Bharata Muni's text on drama, dance and music"],["Mudra","Mudras","Hand gestures — the alphabet of abhinaya"],["Abhinaya","Abhinaya","Expression: angika, vachika, aharya, sattvika"]]},{"k":"facts","title":"Classical dance in numbers (as of 2026)","rows":[["Recognised by the Sangeet Natak Akademi","8 — Bharatanatyam, Kathak, Kathakali, Kuchipudi, Odissi, Manipuri, Mohiniyattam, Sattriya"],["Ministry of Culture's list","9 — the eight plus Chhau"],["Newest addition (SNA)","Sattriya, in 2000"],["Kinds of abhinaya","4 — angika, vachika, aharya, sattvika"],["Rasas","8 in the Natya Shastra; 9 (navarasa) with shanta added later"],["States with two classical dances","Kerala — Kathakali and Mohiniyattam"]]},{"k":"table","title":"Key terms","head":["Term","Meaning","Note"],"rows":[["Nritta","Pure dance — rhythm and steps with no story or meaning","Shown in items like the alarippu and jatiswaram of Bharatanatyam."],["Nritya","Expressive dance — steps with gestures and facial expression that carry meaning","Combines nritta with abhinaya."],["Natya","Dance-drama — a full story told with dance, speech and acting","Kathakali is the classic example."],["Tandava","Vigorous, masculine style of dance linked with Shiva","Shiva as Nataraja performs the cosmic tandava."],["Lasya","Graceful, feminine style of dance linked with Parvati","Mohiniyattam is almost wholly lasya."],["Mudra (hasta)","A symbolic hand gesture","Single-hand gestures are asamyukta; two-hand gestures are samyukta."],["Abhinaya","The art of expression — conveying meaning to the audience","Natya Shastra gives four kinds: angika, vachika, aharya and sattvika."],["Angika abhinaya","Expression through the body, limbs and gestures",""],["Vachika abhinaya","Expression through speech, song and recitation",""],["Aharya abhinaya","Expression through costume, make-up and jewellery","Kathakali's make-up is the best-known aharya."],["Sattvika abhinaya","Expression of inner feelings — tears, trembling, sweat",""],["Rasa","The emotional flavour the audience enjoys","The Natya Shastra lists eight; shanta (peace) was added later as the ninth."],["Bhava","The emotion or mood shown by the performer","Bhava produces rasa."],["Bols","Spoken rhythmic syllables recited before or during footwork","Typical of Kathak."]]},{"k":"table","title":"Texts and their authors","head":["Text","Author","Note"],"rows":[["Natya Shastra","Bharata Muni","The oldest Indian text on drama, dance and music; called the 'fifth Veda'."],["Abhinaya Darpana","Nandikeshvara","'The Mirror of Gesture' — the main handbook of mudras for Bharatanatyam."],["Sangita Ratnakara","Sarangadeva","13th-century text on music and dance."],["Gita Govinda","Jayadeva","12th-century poem of Radha and Krishna; its ashtapadis are danced in Odissi."],["Silappatikaram","Ilango Adigal","Tamil epic with early descriptions of dance (Madhavi, the dancer)."],["Abhinaya Chandrika","Maheshwar Mahapatra","An Odia text on Odissi technique."]]},{"k":"trick","h":"<b>“Pure → Expressive → Drama”<\/b> follows the alphabet of the endings: nri<b>tta<\/b> (just steps), nri<b>tya<\/b> (steps + feeling), na<b>tya<\/b> (full play). <b>T<\/b>andava = <b>T<\/b>hunder (Shiva); <b>L<\/b>asya = <b>L<\/b>ovely (Parvati)."},{"k":"trap","h":"The <b>Natya Shastra<\/b> is by <b>Bharata<\/b>, not Bharavi or Bhasa. The <b>Abhinaya Darpana<\/b> is by <b>Nandikeshvara<\/b>, not Bharata. A <b>mudra<\/b> is a hand gesture; <b>bhava<\/b> is the emotion shown and <b>rasa<\/b> the mood felt."}],"sum":["The Natya Shastra by Bharata Muni is the root text of Indian dance, drama and music — the 'fifth Veda'.","The Abhinaya Darpana by Nandikeshvara is the main handbook of mudras.","Nritta is pure dance, nritya is expressive dance, natya is dance-drama.","Tandava is vigorous (Shiva); lasya is graceful (Parvati).","The Sangeet Natak Akademi recognises 8 classical dances; the Ministry of Culture lists 9 with Chhau."],"part":["Part 1 · The dances","शास्त्रीय नृत्य शैलियाँ"],"g":"cd"},
{"id":"L2","heat":3,"title":"The eight classical dances and their states","hi":"आठ शास्त्रीय नृत्य और उनके राज्य","blocks":[{"k":"hot","h":"The single commonest question: <b>“X is a classical dance of which state?”<\/b> Also asked: which dance is the <b>newest<\/b> (Sattriya, 2000), which state has <b>two<\/b> (Kerala), and which dance grew out of <b>Sadir<\/b> or the <b>Gotipua<\/b> boys."},{"k":"story","h":"<p>Picture a map of India with eight lights. In the south, <b>Tamil Nadu<\/b> gives <b>Bharatanatyam<\/b>, <b>Andhra Pradesh<\/b> gives <b>Kuchipudi<\/b>, and <b>Kerala<\/b> gives two — the dance-drama <b>Kathakali<\/b> and the gentle <b>Mohiniyattam<\/b>. In the north, <b>Kathak<\/b> of <b>Uttar Pradesh<\/b> is the only classical dance, born from storytellers and polished in the Mughal and Lucknow courts.<\/p><p>In the east, <b>Odissi<\/b> (Odisha) is carved on the walls of Konark, <b>Manipuri<\/b> (Manipur) dances Krishna's Ras Lila, and <b>Sattriya<\/b> (Assam), created by the saint <b>Sankaradeva<\/b> in the 15th century, became the eighth in <b>2000<\/b>. The Ministry of Culture also counts <b>Chhau<\/b>, the masked martial dance of Odisha, Jharkhand and West Bengal.<\/p>","key":"Tamil Nadu — Bharatanatyam; AP — Kuchipudi; Kerala — Kathakali + Mohiniyattam; UP — Kathak; Odisha — Odissi; Manipur — Manipuri; Assam — Sattriya."},{"k":"photos","title":"The nine dances in pictures","items":[["Bharatanatyam","Bharatanatyam","Tamil Nadu"],["Kathak","Kathak","Uttar Pradesh"],["Kathakali","Kathakali","Kerala"],["Mohiniyattam","Mohiniyattam","Kerala"],["Kuchipudi","Kuchipudi","Andhra Pradesh"],["Odissi","Odissi","Odisha"],["Manipuri_dance","Manipuri","Manipur"],["Sattriya","Sattriya","Assam"],["Chhau_dance","Chhau","Odisha, Jharkhand, West Bengal"]]},{"k":"table","title":"Dance ↔ state","head":["Dance","State","Note"],"rows":[["Bharatanatyam","Tamil Nadu",""],["Kathak","Uttar Pradesh","The only classical dance of north India; grew in the courts of Lucknow and Jaipur."],["Kathakali","Kerala",""],["Mohiniyattam","Kerala","Kerala's second classical dance — the 'dance of the enchantress'."],["Kuchipudi","Andhra Pradesh","Named after Kuchipudi village in Krishna district."],["Odissi","Odisha",""],["Manipuri","Manipur",""],["Sattriya","Assam","Recognised by the Sangeet Natak Akademi in 2000 — the newest of the eight."],["Chhau","Odisha, Jharkhand and West Bengal","In the Ministry of Culture's list (making 9), not in the Sangeet Natak Akademi's eight."]]},{"k":"mapfig","title":"Where each classical dance grew up","pins":[["Bharatanatyam",79.14,10.79,"Tamil Nadu · Thanjavur"],["Kathak",80.95,26.85,"Uttar Pradesh · Lucknow"],["Kathakali",76.29,10.74,"Kerala","l"],["Mohiniyattam",76.95,8.52,"Kerala","l"],["Kuchipudi",80.95,16.27,"Andhra Pradesh"],["Odissi",85.82,20.29,"Odisha"],["Chhau",86,22.9,"Odisha · Jharkhand · WB"],["Manipuri",93.94,24.81,"Manipur","l"],["Sattriya",94.22,26.95,"Assam · Majuli","l"]],"facts":[["Sangeet Natak Akademi","8 classical dances"],["Ministry of Culture","9 — adds Chhau"],["Kerala","two: Kathakali, Mohiniyattam"],["North India","only Kathak"],["Newest","Sattriya (recognised 2000)"]],"cap":"Each pin marks the place a dance grew up in: a temple town, a court or a monastery."},{"k":"table","title":"Where each dance came from","head":["Dance","Grew out of","Note"],"rows":[["Bharatanatyam","Sadir (dasi attam) of the temple dancers","Renamed Bharatanatyam in the 1930s by E. Krishna Iyer and Rukmini Devi Arundale."],["Kathak","The kathakars — wandering storytellers of north India","'Katha kahe so kathak kahave' — the one who tells a story is a kathak."],["Kathakali","Ramanattam and Krishnanattam of Kerala's courts","Took shape in the 17th century."],["Odissi","The Mahari temple dancers and Gotipua boy dancers","Oldest evidence in the Udayagiri caves near Bhubaneswar."],["Manipuri","Lai Haraoba, the festival of the forest gods","Ras Lila was added under King Bhagyachandra (18th century)."],["Sattriya","The sattras (Vaishnava monasteries) founded by Sankaradeva","Sankaradeva created it in the 15th century with his Ankiya Naat plays."],["Kuchipudi","Bhagavata Mela dance-dramas performed by Brahmin men","Siddhendra Yogi gave it its form in the 17th century."],["Mohiniyattam","Devadasi dance revived at Kerala Kalamandalam","Patronised by Maharaja Swathi Thirunal; revived by the poet Vallathol in the 1930s."]]},{"k":"trick","h":"South to north-east in one line — <b>“Bharat Kuchh Kathakali Mohini; Kathak Odissi Manipuri Sattriya”<\/b>: TN, AP, Kerala, Kerala; UP, Odisha, Manipur, Assam. Kerala is the only state with <b>two<\/b>."},{"k":"trap","h":"<b>Kuchipudi<\/b> is from <b>Andhra Pradesh<\/b>, not Karnataka or Tamil Nadu. <b>Sattriya<\/b> is classical; <b>Bihu<\/b> (also Assam) is folk. <b>Chhau<\/b> is in the Ministry of Culture's list but <b>not<\/b> one of the Sangeet Natak Akademi's eight."}],"sum":["Bharatanatyam — Tamil Nadu; Kuchipudi — Andhra Pradesh.","Kathakali and Mohiniyattam — Kerala, the only state with two classical dances.","Kathak — Uttar Pradesh, the only classical dance of north India.","Odissi — Odisha; Manipuri — Manipur; Sattriya — Assam (recognised in 2000).","Chhau (Odisha, Jharkhand, West Bengal) is the ninth in the Ministry of Culture's list."],"part":["Part 1 · The dances","शास्त्रीय नृत्य शैलियाँ"],"g":"cd"},
{"id":"L3","heat":3,"title":"Features, costume and music","hi":"विशेषताएँ, वेशभूषा और संगीत","blocks":[{"k":"hot","h":"SSC loves a <b>feature → dance<\/b> question: tribhanga (Odissi), tarangam on a brass plate (Kuchipudi), chakkars (Kathak), green make-up (Kathakali), Ras Lila (Manipuri), monasteries of Majuli (Sattriya)."},{"k":"story","h":"<p>Each dance has a signature you can spot in a second. An <b>Odissi<\/b> dancer stands in the <b>tribhanga<\/b>, bent in three places like a temple statue. A <b>Bharatanatyam<\/b> dancer sinks into <b>araimandi<\/b>, knees out. A <b>Kuchipudi<\/b> dancer balances on the rim of a <b>brass plate<\/b>. A <b>Kathak<\/b> dancer whirls in <b>chakkars<\/b> while ankle bells ring out the <b>tatkar<\/b>.<\/p><p>Kerala's <b>Kathakali<\/b> actors wear <b>green faces<\/b> and giant crowns, and tell epics all night to the <b>chenda<\/b> drum. <b>Mohiniyattam<\/b> sways like palm trees in a white-and-gold saree. <b>Manipuri<\/b> dancers wear no ankle bells and a stiff round skirt, and <b>Sattriya<\/b> was danced for centuries only by monks in Assam's sattras.<\/p>","key":"Tribhanga — Odissi; araimandi — Bharatanatyam; brass plate — Kuchipudi; chakkar — Kathak; green face — Kathakali; no bells — Manipuri."},{"k":"facts","title":"Music behind each dance","rows":[["Carnatic music","Bharatanatyam, Kuchipudi, Mohiniyattam"],["Sopana style (Kerala)","Kathakali — with chenda, maddalam, chengila and elathalam"],["Hindustani music","Kathak — tabla, pakhawaj, sarangi"],["Odissi music","Odissi — mardala drum; Gita Govinda songs"],["Manipuri sankirtana","Manipuri — pung (drum) and kartal"],["Borgeet","Sattriya — khol drum, cymbals and flute; songs of Sankaradeva"],["Bharatanatyam's conductor","The nattuvanar, who keeps time with small cymbals"]]},{"k":"table","title":"Spot the dance","head":["Feature","Dance","Note"],"rows":[["Tribhanga — the body bent in three places","Odissi","Head, torso and hips bent in opposite directions."],["Chauka — the square, Jagannath stance","Odissi",""],["Mangalacharan opens; moksha closes the recital","Odissi",""],["Araimandi — the half-sitting stance","Bharatanatyam",""],["Margam — alarippu, jatiswaram, varnam, padam, tillana","Bharatanatyam","The varnam is the centrepiece."],["Adavus — basic units of steps","Bharatanatyam",""],["Tarangam — dancing on the rim of a brass plate","Kuchipudi","Often with a pot of water on the head."],["Bhama Kalapam — the story of Satyabhama","Kuchipudi","Composed by Siddhendra Yogi."],["Chakkar — fast spins","Kathak",""],["Tatkar — rhythmic footwork with ankle bells","Kathak",""],["Gharanas of Lucknow, Jaipur and Banaras","Kathak",""],["Thumri and tarana sung for the abhinaya","Kathak",""],["Green face make-up and huge headdresses; all-night performance","Kathakali",""],["Eye movements trained to show emotions; language Manipravalam","Kathakali","Manipravalam — Malayalam mixed with Sanskrit."],["Swaying, rocking movement (andolika) in a white-and-gold saree","Mohiniyattam","Hair tied in a bun on the left side."],["Ras Lila of Krishna and the gopis","Manipuri",""],["Pung cholom — dancers playing drums while leaping","Manipuri",""],["No ankle bells; soft, rounded movements and a stiff cylindrical skirt (potloi)","Manipuri",""],["Performed by monks (bhokots) in the sattras of Majuli island","Sattriya",""],["Mati akhora — basic body exercises","Sattriya",""],["Masks (in Seraikela and Purulia styles) and martial movements","Chhau","Mayurbhanj Chhau is danced without masks."]]},{"k":"table","title":"Kathakali make-up (vesham)","head":["Make-up","Character type","Note"],"rows":[["Pacha (green)","Noble heroes — kings and gods like Krishna and Arjuna",""],["Kathi (green with red marks)","Arrogant, villainous heroes like Ravana",""],["Thadi (bearded — red, white or black)","Wicked or superhuman characters (red beard: evil; white beard: Hanuman)",""],["Kari (black)","Demonesses and forest dwellers",""],["Minukku (soft yellow-orange)","Women and sages — gentle characters",""]]},{"k":"info","title":"Kathakali colour code at a glance","html":"<div class=\"fam\"><div><span class=\"ic\" aria-hidden=\"true\" style=\"display:flex;gap:4px\"><i style=\"display:inline-block;width:26px;height:26px;border-radius:50%;background:#2f8f4e;border:1px solid rgba(0,0,0,.2)\"><\/i><\/span><b>Pacha (green)<\/b><small>Noble heroes — kings and gods like Krishna and Arjuna<\/small><\/div><div><span class=\"ic\" aria-hidden=\"true\" style=\"display:flex;gap:4px\"><i style=\"display:inline-block;width:26px;height:26px;border-radius:50%;background:#2f8f4e;border:1px solid rgba(0,0,0,.2)\"><\/i><i style=\"display:inline-block;width:26px;height:26px;border-radius:50%;background:#c0392b;border:1px solid rgba(0,0,0,.2)\"><\/i><\/span><b>Kathi (green with red marks)<\/b><small>Arrogant, villainous heroes like Ravana<\/small><\/div><div><span class=\"ic\" aria-hidden=\"true\" style=\"display:flex;gap:4px\"><i style=\"display:inline-block;width:26px;height:26px;border-radius:50%;background:#c0392b;border:1px solid rgba(0,0,0,.2)\"><\/i><i style=\"display:inline-block;width:26px;height:26px;border-radius:50%;background:#f4f1ea;border:1px solid rgba(0,0,0,.2)\"><\/i><i style=\"display:inline-block;width:26px;height:26px;border-radius:50%;background:#222;border:1px solid rgba(0,0,0,.2)\"><\/i><\/span><b>Thadi (bearded — red, white or black)<\/b><small>Wicked or superhuman characters (red beard: evil; white beard: Hanuman)<\/small><\/div><div><span class=\"ic\" aria-hidden=\"true\" style=\"display:flex;gap:4px\"><i style=\"display:inline-block;width:26px;height:26px;border-radius:50%;background:#1d1d1d;border:1px solid rgba(0,0,0,.2)\"><\/i><\/span><b>Kari (black)<\/b><small>Demonesses and forest dwellers<\/small><\/div><div><span class=\"ic\" aria-hidden=\"true\" style=\"display:flex;gap:4px\"><i style=\"display:inline-block;width:26px;height:26px;border-radius:50%;background:#f2b45a;border:1px solid rgba(0,0,0,.2)\"><\/i><\/span><b>Minukku (soft yellow-orange)<\/b><small>Women and sages — gentle characters<\/small><\/div><\/div>","cap":"Green is noble, green with red is proud and villainous, red beard is evil, black is the forest and the demonic, soft yellow is women and sages."},{"k":"trick","h":"<b>“Three bends, square stand — Odissi”<\/b> (tribhanga, chauka). <b>“Plate and pot — Kuchipudi”<\/b>. <b>“Spin and stamp — Kathak”<\/b>. <b>“Green and grand — Kathakali”<\/b>. <b>“No bells, round skirt — Manipuri”<\/b>."},{"k":"trap","h":"<b>Kathakali<\/b> was traditionally danced only by <b>men<\/b> (women's roles too); <b>Mohiniyattam<\/b> by women. <b>Manipuri<\/b> uses <b>no<\/b> ghungroo. The <b>tribhanga<\/b> is Odissi, not Bharatanatyam. <b>Pacha<\/b> (green) means a <b>hero<\/b>, <b>kathi<\/b> a villain."}],"sum":["Odissi — tribhanga and chauka; Bharatanatyam — araimandi and the margam ending in tillana.","Kuchipudi — tarangam on a brass plate; Kathak — chakkars, tatkar and gharanas.","Kathakali — green make-up, chenda drum, Manipravalam songs, traditionally all men.","Mohiniyattam — swaying lasya in a white-and-gold saree; Manipuri — Ras Lila, no ankle bells.","Sattriya — monks of the Majuli sattras, borgeet songs; Chhau — masks and martial moves."],"part":["Part 1 · The dances","शास्त्रीय नृत्य शैलियाँ"],"g":"cd"},
{"id":"L4","heat":3,"title":"Dancers of Bharatanatyam, Kuchipudi, Kathakali, Mohiniyattam","hi":"दक्षिण के शास्त्रीय नृत्यों के नर्तक","blocks":[{"k":"hot","h":"Every SSC shift seems to have one: <b>“X is an exponent of which dance?”<\/b> The south's big names — <b>Rukmini Devi Arundale<\/b> and <b>Padma Subrahmanyam<\/b> (Bharatanatyam), <b>Vempati Chinna Satyam<\/b> and <b>Raja–Radha Reddy<\/b> (Kuchipudi), <b>Kalamandalam Kalyanikutty Amma<\/b> (Mohiniyattam)."},{"k":"story","h":"<p>In the 1930s <b>Sadir<\/b>, the dance of temple women, was looked down on. <b>Rukmini Devi Arundale<\/b>, from a respected Brahmin family, learned it, staged it in 1935 and founded <b>Kalakshetra<\/b> in Chennai in 1936 — Bharatanatyam became respectable across India. <b>T. Balasaraswati<\/b>, from the hereditary tradition, kept its older soul alive. Later stars include <b>Padma Subrahmanyam<\/b>, <b>Alarmel Valli<\/b>, <b>Leela Samson<\/b> and the actress <b>Vyjayanthimala<\/b>.<\/p><p>In Andhra, <b>Vempati Chinna Satyam<\/b> turned village Kuchipudi into a solo concert art, and <b>Raja and Radha Reddy<\/b> took it abroad. In Kerala, the poet <b>Vallathol<\/b>'s Kalamandalam trained Kathakali greats like <b>Kalamandalam Krishnan Nair<\/b>, <b>Ramankutty Nair<\/b> and <b>Gopi<\/b>, and <b>Kalyanikutty Amma<\/b> rebuilt Mohiniyattam.<\/p>","key":"Rukmini Devi, Balasaraswati, Padma Subrahmanyam — Bharatanatyam; Vempati, Raja–Radha Reddy — Kuchipudi; Kalamandalam Gopi — Kathakali; Kalyanikutty Amma — Mohiniyattam."},{"k":"photos","title":"Dancers in pictures","items":[["Rukmini_Devi_Arundale","Rukmini Devi Arundale","Bharatanatyam · Kalakshetra (1936)"],["T._Balasaraswati","T. Balasaraswati","Bharatanatyam"],["Yamini_Krishnamurthy","Yamini Krishnamurthy","Bharatanatyam and Kuchipudi"],["Padma_Subrahmanyam","Padma Subrahmanyam","Bharatanatyam · Padma Vibhushan 2024"],["Vempati_Chinna_Satyam","Vempati Chinna Satyam","Kuchipudi"],["Kalamandalam_Kalyanikutty_Amma","Kalamandalam Kalyanikutty Amma","Mohiniyattam"],["Mallika_Sarabhai","Mallika Sarabhai","Kuchipudi and Bharatanatyam"],["Vyjayanthimala","Vyjayanthimala","Bharatanatyam and films"]]},{"k":"table","title":"Dancer ↔ dance (south)","head":["Dancer","Dance","Note"],"rows":[["Rukmini Devi Arundale","Bharatanatyam","Founded Kalakshetra (1936); first woman nominated to the Rajya Sabha (1952)."],["T. Balasaraswati","Bharatanatyam","From a family of hereditary temple musicians and dancers; Padma Vibhushan 1977."],["Padma Subrahmanyam","Bharatanatyam","Created 'Bharata Nrityam' from the Natya Shastra's karanas; Padma Vibhushan 2024."],["Alarmel Valli","Bharatanatyam",""],["Leela Samson","Bharatanatyam","Former director of Kalakshetra and chairperson of the Sangeet Natak Akademi."],["Vyjayanthimala","Bharatanatyam","Film star and dancer; Padma Vibhushan 2024."],["Saroja Vaidyanathan","Bharatanatyam",""],["Geeta Chandran","Bharatanatyam",""],["C. V. Chandrasekhar","Bharatanatyam",""],["Malavika Sarukkai","Bharatanatyam",""],["Vempati Chinna Satyam","Kuchipudi","Took Kuchipudi from the village to the world; Padma Bhushan 1998."],["Vedantam Satyanarayana Sarma","Kuchipudi","Famous for playing women's roles like Satyabhama."],["Raja and Radha Reddy","Kuchipudi","Husband-and-wife pair; Padma Bhushan 2000."],["Shobha Naidu","Kuchipudi",""],["Swapna Sundari","Kuchipudi","Also revived Vilasini Natyam."],["Deepika Reddy","Kuchipudi",""],["Kalamandalam Krishnan Nair","Kathakali",""],["Kalamandalam Ramankutty Nair","Kathakali","Also a Padma Bhushan awardee."],["Kalamandalam Gopi","Kathakali",""],["Guru Kunchu Kurup","Kathakali",""],["Kottakkal Sivaraman","Kathakali","Known for women's roles."],["Kalamandalam Kalyanikutty Amma","Mohiniyattam","Called the 'mother of Mohiniyattam'."],["Bharati Shivaji","Mohiniyattam",""],["Kanak Rele","Mohiniyattam","Founded the Nalanda Dance Research Centre, Mumbai."],["Sunanda Nair","Mohiniyattam",""],["Gopika Varma","Mohiniyattam",""]]},{"k":"trick","h":"<b>“Kalamandalam”<\/b> in a name = a Kerala dancer: Kathakali, unless it's <b>Kalyanikutty Amma<\/b> (<b>K<\/b>alyani = <b>K<\/b>erala's <b>M<\/b>other of <b>M<\/b>ohiniyattam). <b>“Vempati, Vedantam — V for Village Kuchipudi”<\/b>."},{"k":"trap","h":"<b>Rukmini Devi<\/b> (Bharatanatyam) ≠ <b>Mrinalini Sarabhai<\/b> (Bharatanatyam and Kathakali; Darpana). <b>Raja and Radha Reddy<\/b> are Kuchipudi, not Bharatanatyam. <b>Padma Subrahmanyam<\/b> is Bharatanatyam, not Kuchipudi."}],"sum":["Rukmini Devi Arundale — Bharatanatyam; founded Kalakshetra, Chennai (1936).","T. Balasaraswati, Padma Subrahmanyam, Alarmel Valli, Leela Samson, Vyjayanthimala — Bharatanatyam.","Vempati Chinna Satyam, Vedantam Satyanarayana Sarma, Raja and Radha Reddy, Shobha Naidu — Kuchipudi.","Kalamandalam Krishnan Nair, Ramankutty Nair, Gopi — Kathakali.","Kalamandalam Kalyanikutty Amma, Bharati Shivaji, Kanak Rele — Mohiniyattam."],"part":["Part 2 · Dancers, gurus and schools","नर्तक, गुरु और संस्थान"],"g":"cd"},
{"id":"L5","heat":3,"title":"Dancers of Kathak, Odissi, Manipuri, Sattriya, Chhau","hi":"कथक, ओडिसी, मणिपुरी, सत्त्रिया और छऊ के नर्तक","blocks":[{"k":"hot","h":"The most-asked names in the whole topic: <b>Birju Maharaj<\/b> and <b>Sitara Devi<\/b> (Kathak), <b>Kelucharan Mohapatra<\/b> (Odissi), <b>Guru Bipin Singh<\/b> (Manipuri). Sattriya names like <b>Jatin Goswami<\/b> now appear often too."},{"k":"story","h":"<p><b>Pandit Birju Maharaj<\/b> was born into the Lucknow Kathak family of Kalka-Bindadin; his uncles <b>Shambhu<\/b> and <b>Lachhu Maharaj<\/b> were masters too. He choreographed for films like Devdas and Bajirao Mastani and won the Padma Vibhushan in 1986. <b>Sitara Devi<\/b> danced with such energy that Tagore called her <b>'Nritya Samragini'<\/b>. Later came <b>Kumudini Lakhia<\/b>, <b>Shovana Narayan<\/b> and <b>Uma Sharma<\/b>.<\/p><p>In Odisha, <b>Kelucharan Mohapatra<\/b>, a former Gotipua boy, rebuilt Odissi in the 1950s with <b>Pankaj Charan Das<\/b> and <b>Deba Prasad Das<\/b>; his students include <b>Sanjukta Panigrahi<\/b>, <b>Kumkum Mohanty<\/b> and <b>Protima Bedi<\/b>. <b>Guru Bipin Singh<\/b> shaped modern <b>Manipuri<\/b> with the <b>Jhaveri sisters<\/b>, and Assam's <b>Jatin Goswami<\/b> carried <b>Sattriya<\/b> out of the monasteries.<\/p>","key":"Birju Maharaj, Sitara Devi — Kathak; Kelucharan Mohapatra, Pankaj Charan Das — Odissi; Guru Bipin Singh — Manipuri; Jatin Goswami — Sattriya."},{"k":"photos","title":"Dancers in pictures","items":[["Birju_Maharaj","Pandit Birju Maharaj","Kathak · Lucknow gharana"],["Sitara_Devi","Sitara Devi","Kathak · 'Nritya Samragini'"],["Kumudini_Lakhia","Kumudini Lakhia","Kathak · Kadamb"],["Shovana_Narayan","Shovana Narayan","Kathak"],["Kelucharan_Mohapatra","Kelucharan Mohapatra","Odissi"],["Sanjukta_Panigrahi","Sanjukta Panigrahi","Odissi"],["Sonal_Mansingh","Sonal Mansingh","Bharatanatyam and Odissi"],["Guru_Bipin_Singh","Guru Bipin Singh","Manipuri"]]},{"k":"table","title":"Dancer ↔ dance (north and east)","head":["Dancer","Dance","Note"],"rows":[["Pandit Birju Maharaj","Kathak","Lucknow (Kalka-Bindadin) gharana; Padma Vibhushan 1986; died January 2022."],["Sitara Devi","Kathak","Called 'Nritya Samragini' by Rabindranath Tagore."],["Shambhu Maharaj","Kathak","Birju Maharaj's uncle, Lucknow gharana."],["Lachhu Maharaj","Kathak","Birju Maharaj's uncle; choreographed for films like Mughal-e-Azam."],["Gopi Krishna","Kathak","Danced in the film Jhanak Jhanak Payal Baaje."],["Shovana Narayan","Kathak","Padma Shri 1992."],["Kumudini Lakhia","Kathak","Founded Kadamb, Ahmedabad; Padma Vibhushan 2025."],["Uma Sharma","Kathak",""],["Roshan Kumari","Kathak","Jaipur gharana."],["Saswati Sen","Kathak","Senior disciple of Birju Maharaj."],["Aditi Mangaldas","Kathak",""],["Kelucharan Mohapatra","Odissi","The guru who revived Odissi; first person from Odisha to get the Padma Vibhushan (2000)."],["Pankaj Charan Das","Odissi","Called the 'adi guru' of Odissi; came from a Mahari family."],["Deba Prasad Das","Odissi",""],["Sanjukta Panigrahi","Odissi",""],["Protima Bedi","Odissi","Founded Nrityagram near Bengaluru (1990)."],["Madhavi Mudgal","Odissi",""],["Kumkum Mohanty","Odissi",""],["Sujata Mohapatra","Odissi",""],["Ileana Citaristi","Odissi","Italian-born dancer; Padma Shri 2006."],["Guru Bipin Singh","Manipuri","Called the father of modern Manipuri dance."],["Darshana Jhaveri","Manipuri","One of the four Jhaveri sisters."],["Rajkumar Singhajit Singh","Manipuri",""],["Guru Amubi Singh","Manipuri",""],["Bimbavati Devi","Manipuri",""],["Jatin Goswami","Sattriya",""],["Ghanakanta Bora","Sattriya",""],["Sarodi Saikia","Sattriya",""],["Ramkrishna Talukdar","Sattriya",""],["Gambhir Singh Mura","Chhau","Purulia Chhau, West Bengal."],["Shashadhar Acharya","Chhau","Seraikela Chhau, Jharkhand."],["Gopal Prasad Dubey","Chhau","Seraikela Chhau."]]},{"k":"trick","h":"<b>“Maharaj = Kathak”<\/b> — Birju, Shambhu, Lachhu, Achhan Maharaj are all one Lucknow family. <b>“Kelu, Pankaj, Deba — the three Odissi gurus”<\/b>. <b>Bipin = Manipuri<\/b> (both end in the same 'i' sound)."},{"k":"trap","h":"<b>Sitara Devi<\/b> is Kathak — not Odissi. <b>Protima Bedi<\/b> (Odissi, Nrityagram) is often confused with Kathak. <b>Kelucharan Mohapatra<\/b> is Odissi, not Chhau. <b>Jatin Goswami<\/b> is Sattriya, not Manipuri."}],"sum":["Pandit Birju Maharaj (Lucknow gharana), Sitara Devi, Shambhu and Lachhu Maharaj — Kathak.","Kumudini Lakhia, Shovana Narayan, Uma Sharma, Gopi Krishna — Kathak.","Kelucharan Mohapatra, Pankaj Charan Das, Deba Prasad Das, Sanjukta Panigrahi, Protima Bedi — Odissi.","Guru Bipin Singh, Darshana Jhaveri, Rajkumar Singhajit Singh — Manipuri.","Jatin Goswami, Ghanakanta Bora — Sattriya; Gambhir Singh Mura, Shashadhar Acharya — Chhau."],"part":["Part 2 · Dancers, gurus and schools","नर्तक, गुरु और संस्थान"],"g":"cd"},
{"id":"L6","heat":2,"title":"Gurus, schools and dancers of many styles","hi":"गुरु, संस्थान और बहु-शैली नर्तक","blocks":[{"k":"hot","h":"Asked often: <b>Kalakshetra<\/b> (Chennai, Rukmini Devi), <b>Kerala Kalamandalam<\/b> (Vallathol), <b>Darpana<\/b> (Mrinalini Sarabhai, Ahmedabad), <b>Nrityagram<\/b> (Protima Bedi). Also the dancers known for <b>two<\/b> styles — Sonal Mansingh, Yamini Krishnamurthy, Mallika Sarabhai."},{"k":"story","h":"<p>Modern classical dance was saved by schools. The poet <b>Vallathol Narayana Menon<\/b> founded <b>Kerala Kalamandalam<\/b> in <b>1930<\/b> to rescue Kathakali and Mohiniyattam. <b>Rukmini Devi Arundale<\/b> started <b>Kalakshetra<\/b> in Chennai in <b>1936<\/b>. <b>Mrinalini Sarabhai<\/b> opened <b>Darpana<\/b> in Ahmedabad in 1949, and the government's <b>Sangeet Natak Akademi<\/b> (1952) set up the <b>Kathak Kendra<\/b> in Delhi and the <b>Manipuri Dance Academy<\/b> in Imphal. <b>Protima Bedi<\/b> built <b>Nrityagram<\/b>, a dance village near Bengaluru, in 1990.<\/p><p>Some stars mastered more than one style: <b>Sonal Mansingh<\/b> (Bharatanatyam and Odissi), <b>Yamini Krishnamurthy<\/b> (Bharatanatyam and Kuchipudi), <b>Mallika Sarabhai<\/b> (Kuchipudi and Bharatanatyam), and <b>Mrinalini Sarabhai<\/b> (Bharatanatyam and Kathakali). <b>Uday Shankar<\/b> blended Indian styles into a new creative dance and is called the father of modern Indian dance.<\/p>","key":"Kalamandalam 1930 Vallathol; Kalakshetra 1936 Rukmini Devi; Darpana 1949 Mrinalini Sarabhai; Nrityagram 1990 Protima Bedi."},{"k":"photos","title":"In pictures","items":[["Uday_Shankar","Uday Shankar","Modern Indian dance; Almora centre"],["Mrinalini_Sarabhai","Mrinalini Sarabhai","Darpana Academy, Ahmedabad"],["Protima_Bedi","Protima Bedi","Nrityagram (1990)"],["Kerala_Kalamandalam","Kerala Kalamandalam","Cheruthuruthy, 1930"]]},{"k":"facts","title":"Dancers of more than one style","rows":[["Sonal Mansingh","Bharatanatyam and Odissi — Padma Vibhushan 2003; nominated to the Rajya Sabha in 2018"],["Yamini Krishnamurthy","Bharatanatyam and Kuchipudi — Padma Vibhushan 2016; died 2024"],["Mallika Sarabhai","Kuchipudi and Bharatanatyam — daughter of Mrinalini and Vikram Sarabhai"],["Mrinalini Sarabhai","Bharatanatyam and Kathakali — founded Darpana"],["Uday Shankar","Creative dance mixing Indian styles — 'father of modern Indian dance'; film Kalpana (1948)"],["Astad Deboo","Contemporary dance blending Kathak and Kathakali"]]},{"k":"table","title":"Institutions and where they are","head":["Institution","Place","Note"],"rows":[["Kalakshetra","Chennai","Founded 1936 by Rukmini Devi Arundale; Bharatanatyam."],["Kerala Kalamandalam","Cheruthuruthy (Thrissur)","Founded 1930 by the poet Vallathol Narayana Menon; Kathakali and Mohiniyattam."],["Darpana Academy of Performing Arts","Ahmedabad","Founded 1949 by Mrinalini Sarabhai."],["Kadamb Centre for Dance","Ahmedabad","Founded 1967 by Kumudini Lakhia; Kathak."],["Kathak Kendra","New Delhi","Set up in 1964; a unit of the Sangeet Natak Akademi."],["Sangeet Natak Akademi","New Delhi","India's national academy of music, dance and drama (1952)."],["Nrityagram","Hesaraghatta, near Bengaluru","Dance village founded 1990 by Protima Bedi; Odissi."],["Jawaharlal Nehru Manipuri Dance Academy","Imphal","Set up 1954; a unit of the Sangeet Natak Akademi."],["Srjan","Bhubaneswar","Odissi school founded 1993 by Kelucharan Mohapatra."],["Uday Shankar India Cultural Centre","Almora","Founded by Uday Shankar in the late 1930s."],["Kuchipudi Art Academy","Chennai","Founded 1963 by Vempati Chinna Satyam."],["Visva-Bharati (Santiniketan)","West Bengal","Tagore brought Manipuri teachers here and made the dance known across India."]]},{"k":"mapfig","title":"Dance schools on the map","pins":[["Kalakshetra · Kuchipudi Art Academy",80.27,13,"Chennai"],["Kerala Kalamandalam",76.29,10.74,"Cheruthuruthy","l"],["Nrityagram",77.48,13.13,"near Bengaluru","l"],["Darpana · Kadamb",72.57,23.02,"Ahmedabad"],["Kathak Kendra · SNA",77.21,28.61,"New Delhi","l"],["Uday Shankar centre",79.66,29.6,"Almora"],["Srjan",85.82,20.29,"Bhubaneswar"],["Visva-Bharati",87.68,23.68,"Santiniketan"],["JN Manipuri Dance Academy",93.94,24.81,"Imphal","l"]],"cap":"Founders to remember: Rukmini Devi (Kalakshetra), Vallathol (Kalamandalam), Mrinalini Sarabhai (Darpana), Kumudini Lakhia (Kadamb), Protima Bedi (Nrityagram)."},{"k":"table","title":"Founders","head":["Founder","Institution","Note"],"rows":[["Rukmini Devi Arundale","Kalakshetra",""],["Vallathol Narayana Menon","Kerala Kalamandalam","With Manakkulam Mukunda Raja."],["Mrinalini Sarabhai","Darpana Academy",""],["Kumudini Lakhia","Kadamb",""],["Protima Bedi","Nrityagram",""],["Kelucharan Mohapatra","Srjan",""],["Uday Shankar","Uday Shankar India Cultural Centre, Almora",""],["Vempati Chinna Satyam","Kuchipudi Art Academy",""],["Kanak Rele","Nalanda Dance Research Centre",""]]},{"k":"trick","h":"<b>“K-K-C”<\/b>: <b>K<\/b>alakshetra — <b>C<\/b>hennai; <b>K<\/b>alamandalam — <b>K<\/b>erala. Darpana = mirror, and <b>Mrinalini<\/b> = the mirror of Ahmedabad. <b>Sonal = S + O<\/b> — <b>S<\/b>outh (Bharatanatyam) + <b>O<\/b>dissi."},{"k":"trap","h":"<b>Kalakshetra<\/b> is in <b>Chennai<\/b>, not Kerala; <b>Kalamandalam<\/b> is in <b>Kerala<\/b>. <b>Darpana<\/b> and <b>Kadamb<\/b> are both in <b>Ahmedabad<\/b> (Mrinalini Sarabhai and Kumudini Lakhia). <b>Nrityagram<\/b> is near <b>Bengaluru<\/b>, though it teaches Odissi."}],"sum":["Kerala Kalamandalam — Cheruthuruthy, 1930, founded by Vallathol Narayana Menon.","Kalakshetra — Chennai, 1936, founded by Rukmini Devi Arundale.","Darpana — Ahmedabad, 1949, Mrinalini Sarabhai; Kadamb — Ahmedabad, Kumudini Lakhia; Nrityagram — near Bengaluru, Protima Bedi.","Sonal Mansingh — Bharatanatyam and Odissi; Yamini Krishnamurthy — Bharatanatyam and Kuchipudi.","Uday Shankar is called the father of modern Indian dance."],"part":["Part 2 · Dancers, gurus and schools","नर्तक, गुरु और संस्थान"],"g":"cd"},
{"id":"L7","heat":2,"title":"Dance festivals","hi":"नृत्य महोत्सव","blocks":[{"k":"hot","h":"Asked as <b>“The X Dance Festival is held in which state?”<\/b> The big four: <b>Khajuraho<\/b> (MP), <b>Konark<\/b> (Odisha), <b>Mamallapuram<\/b> (Tamil Nadu), <b>Elephanta<\/b> (Maharashtra). Modhera (Gujarat) is the usual trap."},{"k":"story","h":"<p>India loves to set its classical dancers against old stone. Every February the <b>Khajuraho Dance Festival<\/b> (since 1975) lights up the Chandela temples of <b>Madhya Pradesh<\/b>. In early December, the <b>Konark Dance Festival<\/b> fills the open-air stage beside Odisha's Sun Temple. In <b>Tamil Nadu<\/b>, <b>Mamallapuram<\/b> dancers perform before the giant rock carving of Arjuna's Penance, and at <b>Chidambaram<\/b> the <b>Natyanjali<\/b> festival honours Nataraja on Maha Shivaratri.<\/p><p>On the west coast, the <b>Elephanta Festival<\/b> is held near Mumbai's cave temples, and <b>Gujarat<\/b> holds the <b>Modhera Dance Festival<\/b> at its own Sun Temple each January. <b>Karnataka<\/b> has <b>Pattadakal<\/b> and <b>Hampi Utsav<\/b>; <b>Kerala<\/b> has <b>Nishagandhi<\/b> in Thiruvananthapuram.<\/p>","key":"Khajuraho — MP; Konark, Mukteswar — Odisha; Mamallapuram, Natyanjali — Tamil Nadu; Elephanta — Maharashtra; Modhera — Gujarat."},{"k":"photos","title":"The stages","items":[["Khajuraho_Group_of_Monuments","Khajuraho temples","Khajuraho Dance Festival"],["Konark_Sun_Temple","Konark Sun Temple","Konark Dance Festival"],["Shore_Temple","Shore Temple, Mamallapuram","Mamallapuram Dance Festival"],["Thillai_Nataraja_Temple,_Chidambaram","Nataraja temple, Chidambaram","Natyanjali"],["Sun_Temple,_Modhera","Modhera Sun Temple","Uttarardh Mahotsav"],["Elephanta_Caves","Elephanta Caves","Elephanta Festival"]]},{"k":"table","title":"Festival ↔ state","head":["Festival","State","Note"],"rows":[["Khajuraho Dance Festival","Madhya Pradesh","Every February since 1975, against the Chandela temples."],["Konark Dance Festival","Odisha","1–5 December, in the open-air theatre by the Sun Temple."],["Mukteswar Dance Festival","Odisha","Odissi at the Mukteswar temple, Bhubaneswar (January)."],["Mamallapuram Dance Festival","Tamil Nadu","December–January, with Arjuna's Penance as the backdrop."],["Natyanjali Festival","Tamil Nadu","At the Nataraja temple, Chidambaram, around Maha Shivaratri."],["Elephanta Festival","Maharashtra","February, at the Elephanta Caves near Mumbai."],["Ellora–Ajanta Festival","Maharashtra","Near Chhatrapati Sambhajinagar (Aurangabad)."],["Modhera Dance Festival (Uttarardh Mahotsav)","Gujarat","January, at the Sun Temple of Modhera."],["Nishagandhi Dance Festival","Kerala","January, Thiruvananthapuram."],["Pattadakal Dance Festival","Karnataka","At the Chalukya temples of Pattadakal."],["Hampi Utsav","Karnataka","Also called the Vijaya Utsav."],["Rajgir Mahotsav","Bihar",""],["Bhoramdeo Mahotsav","Chhattisgarh",""],["Taj Mahotsav","Uttar Pradesh","February, in Agra — arts, crafts and dance."],["Sangai Festival","Manipur","November — named after the state animal, the sangai deer."]]},{"k":"mapfig","title":"Dance festivals on the map","pins":[["Khajuraho",79.93,24.85,"MP · February"],["Konark · Mukteswar",86,20,"Odisha"],["Mamallapuram",80.19,12.62,"Tamil Nadu"],["Natyanjali",79.69,11.4,"Chidambaram","l"],["Elephanta",72.93,18.96,"Mumbai","l"],["Ellora–Ajanta",75.18,20.03,"Maharashtra"],["Modhera",72.13,23.58,"Gujarat","l"],["Nishagandhi",76.95,8.52,"Thiruvananthapuram","l"],["Pattadakal · Hampi",76,15.6,"Karnataka","l"],["Rajgir",85.42,25.03,"Bihar"],["Bhoramdeo",81.12,22.13,"Chhattisgarh"],["Taj Mahotsav",78.01,27.18,"Agra","l"],["Sangai",93.94,24.81,"Manipur","l"]],"cap":"Most festivals are held against a famous monument: the Khajuraho temples, the Sun Temples of Konark and Modhera, Arjuna's Penance at Mamallapuram."},{"k":"trick","h":"<b>Two Sun Temples, two festivals<\/b>: Konark (Odisha, December) and Modhera (Gujarat, January). <b>“K for Khajuraho, K for Kendra (central) — Madhya Pradesh.”<\/b>"},{"k":"trap","h":"<b>Mamallapuram<\/b> is in <b>Tamil Nadu<\/b>, not Kerala or Karnataka. <b>Elephanta<\/b> is in <b>Maharashtra<\/b>. <b>Konark<\/b> (Odisha) ≠ <b>Modhera<\/b> (Gujarat), though both are Sun Temples. <b>Sangai<\/b> is Manipur's tourism festival, not a classical dance."}],"sum":["Khajuraho Dance Festival — Madhya Pradesh, every February since 1975.","Konark Dance Festival — Odisha, 1–5 December; Mukteswar — Bhubaneswar.","Mamallapuram Dance Festival and Natyanjali (Chidambaram) — Tamil Nadu.","Elephanta Festival — Maharashtra; Modhera Dance Festival — Gujarat.","Pattadakal and Hampi — Karnataka; Nishagandhi — Kerala."],"part":["Part 3 · Festivals, awards and folk vs classical","महोत्सव, पुरस्कार और लोक बनाम शास्त्रीय"],"g":"cd"},
{"id":"L8","heat":2,"title":"Awards to dancers","hi":"नर्तकों को पुरस्कार","blocks":[{"k":"hot","h":"Questions ask <b>which dancer got the Padma Vibhushan<\/b> in a year (Birju Maharaj 1986, Sonal Mansingh 2003, Yamini Krishnamurthy 2016, Padma Subrahmanyam 2024, Kumudini Lakhia 2025) and <b>who gives<\/b> the Sangeet Natak Akademi Award and the Kalidas Samman."},{"k":"story","h":"<p>The <b>Sangeet Natak Akademi<\/b>, India's national academy for music, dance and drama, was set up in <b>1952<\/b> and works under the <b>Ministry of Culture<\/b> from Rabindra Bhavan, New Delhi. It gives the yearly <b>Akademi Award<\/b> (Puraskar), its highest honour the <b>Fellowship<\/b> (Akademi Ratna), and since 2006 the <b>Ustad Bismillah Khan Yuva Puraskar<\/b> for artists up to 40.<\/p><p>The <b>Padma awards<\/b> also honour dancers. <b>T. Balasaraswati<\/b> got the Padma Vibhushan in 1977, <b>Birju Maharaj<\/b> in 1986, <b>Kelucharan Mohapatra<\/b> in 2000 and <b>Sonal Mansingh<\/b> in 2003. More recently came <b>Yamini Krishnamurthy<\/b> (2016), <b>Padma Subrahmanyam<\/b> and <b>Vyjayanthimala<\/b> (2024) and <b>Kumudini Lakhia<\/b> (2025). Madhya Pradesh's <b>Kalidas Samman<\/b> (since 1980) is another top arts prize.<\/p>","key":"SNA 1952 under the Ministry of Culture; Fellowship = Akademi Ratna; Yuva Puraskar up to 40; PV — Birju 1986, Kelucharan 2000, Sonal 2003, Yamini 2016."},{"k":"facts","title":"Sangeet Natak Akademi at a glance","rows":[["Set up","1952 (by a government resolution); inaugurated in January 1953"],["Headquarters","Rabindra Bhavan, New Delhi"],["Under","Ministry of Culture"],["First chairman","Justice P. V. Rajamannar"],["Its dance units","Kathak Kendra (New Delhi), Jawaharlal Nehru Manipuri Dance Academy (Imphal), Sattriya Kendra (Guwahati)"],["Other national academies","Sahitya Akademi (letters, 1954) and Lalit Kala Akademi (fine arts, 1954)"]]},{"k":"table","title":"Padma Vibhushan to dancers","head":["Dancer","Year","Dance"],"rows":[["T. Balasaraswati","1977","Bharatanatyam."],["Pandit Birju Maharaj","1986","Kathak."],["Kelucharan Mohapatra","2000","Odissi."],["Sonal Mansingh","2003","Bharatanatyam and Odissi."],["Yamini Krishnamurthy","2016","Bharatanatyam and Kuchipudi."],["Padma Subrahmanyam","2024","Bharatanatyam."],["Vyjayanthimala","2024","Bharatanatyam and films."],["Kumudini Lakhia","2025","Kathak."]]},{"k":"tlfig","title":"Padma Vibhushan to dancers, year by year","rows":[[1977,"T. Balasaraswati","Bharatanatyam"],[1986,"Birju Maharaj","Kathak"],[2000,"Kelucharan Mohapatra","Odissi"],[2003,"Sonal Mansingh","Bharatanatyam and Odissi"],[2016,"Yamini Krishnamurthy","Bharatanatyam and Kuchipudi"],[2024,"Padma Subrahmanyam","Bharatanatyam"],[2024,"Vyjayanthimala","Bharatanatyam and films"],[2025,"Kumudini Lakhia","Kathak"]],"cap":"The first dancer to receive it was T. Balasaraswati (1977); 2024 had two, Padma Subrahmanyam and Vyjayanthimala."},{"k":"table","title":"Awards and who gives them","head":["Award","Given by","Note"],"rows":[["Sangeet Natak Akademi Fellowship (Akademi Ratna)","Sangeet Natak Akademi","The Akademi's highest honour, for a few artists at a time."],["Sangeet Natak Akademi Award (Akademi Puraskar)","Sangeet Natak Akademi","Given every year since 1952 to performing artists."],["Ustad Bismillah Khan Yuva Puraskar","Sangeet Natak Akademi","For young artists up to 40 years old; started 2006."],["Padma Vibhushan, Padma Bhushan, Padma Shri","Government of India","Announced on the eve of Republic Day."],["Kalidas Samman","Government of Madhya Pradesh","Started in 1980; covers classical music, dance, theatre and fine arts."],["Nritya Choodamani","Sri Krishna Gana Sabha, Chennai","A title for Bharatanatyam and other dancers."]]},{"k":"trick","h":"Padma Vibhushan dancers in order — <b>“Bala Birju Kelu Sonal Yamini Padma Kumudini”<\/b>: 77, 86, 2000, 03, 16, 24, 25. The gaps grow, then two in a row."},{"k":"trap","h":"The <b>Kalidas Samman<\/b> is given by the <b>Madhya Pradesh<\/b> government, not the Sangeet Natak Akademi. <b>Sangeet Natak<\/b> = music, dance, drama; <b>Lalit Kala<\/b> = fine arts; <b>Sahitya<\/b> = literature. The SNA's <b>Fellowship<\/b>, not its Award, is the higher honour."}],"sum":["Sangeet Natak Akademi — set up 1952, Ministry of Culture, Rabindra Bhavan, New Delhi.","SNA gives the Akademi Award, the Fellowship (Akademi Ratna, highest) and the Yuva Puraskar (up to 40, since 2006).","Padma Vibhushan: Balasaraswati 1977, Birju Maharaj 1986, Kelucharan Mohapatra 2000, Sonal Mansingh 2003.","Padma Vibhushan: Yamini Krishnamurthy 2016, Padma Subrahmanyam and Vyjayanthimala 2024, Kumudini Lakhia 2025.","Kalidas Samman — Madhya Pradesh government, since 1980."],"part":["Part 3 · Festivals, awards and folk vs classical","महोत्सव, पुरस्कार और लोक बनाम शास्त्रीय"],"g":"cd"},
{"id":"L9","heat":2,"title":"Classical vs folk and tribal dances","hi":"शास्त्रीय बनाम लोक और जनजातीय नृत्य","blocks":[{"k":"hot","h":"A favourite trick question: <b>“Which of these is NOT a classical dance?”<\/b> — Bihu, Yakshagana, Garba, Lavani, Kalbelia are folk. Also: Yakshagana vs Kathakali, Bihu vs Sattriya, Gotipua vs Odissi."},{"k":"story","h":"<p>A <b>classical<\/b> dance follows a written grammar going back to the <b>Natya Shastra<\/b>, needs years of training under a guru, and is recognised by the <b>Sangeet Natak Akademi<\/b>. A <b>folk<\/b> dance belongs to a community — danced at harvests, weddings and festivals by ordinary people, with no textbook. A <b>tribal<\/b> dance belongs to a tribe's own life and rituals.<\/p><p>Many pairs share a state and fool students. Assam has classical <b>Sattriya<\/b> and folk <b>Bihu<\/b>. Kerala's <b>Kathakali<\/b> is classical, but <b>Theyyam<\/b> is ritual and Karnataka's look-alike <b>Yakshagana<\/b> is folk theatre. Odisha's boy dancers, the <b>Gotipua<\/b>, are folk — yet they fed into classical <b>Odissi<\/b>. Garba, Bhangra, Lavani and Ghoomar are all folk. (Folk dances get a full app of their own.)<\/p>","key":"Classical = Natya Shastra grammar + SNA recognition; folk = community dance. Bihu, Yakshagana, Garba, Lavani, Theyyam are NOT classical."},{"k":"indiamap","title":"Classical, folk and festival map","cap":"Tap a state: its classical dance, folk dances and dance festivals in this app."},{"k":"table","title":"Famous folk and ritual dances","head":["Dance","State","Note"],"rows":[["Bihu","Assam","Folk — Assam's classical dance is Sattriya."],["Yakshagana","Karnataka","Folk dance-drama with huge headdresses — often confused with Kathakali."],["Theyyam","Kerala","Ritual dance where the performer becomes a god."],["Ottan Thullal","Kerala","Solo dance-recitation created by Kunchan Nambiar."],["Gotipua","Odisha","Boys dressed as girls — a forerunner of Odissi."],["Lavani","Maharashtra",""],["Garba","Gujarat","On UNESCO's intangible heritage list (2023)."],["Bhangra","Punjab",""],["Ghoomar","Rajasthan",""],["Kalbelia","Rajasthan","Snake-charmer community's dance; UNESCO list 2010."],["Raut Nacha","Chhattisgarh",""],["Cheraw","Mizoram","The bamboo dance."],["Dollu Kunitha","Karnataka",""],["Karakattam","Tamil Nadu","Pot balanced on the head."],["Kolattam","Andhra Pradesh","Stick dance."],["Jhumar","Jharkhand",""],["Chholiya","Uttarakhand","Sword dance."],["Rouf","Jammu and Kashmir",""],["Nati","Himachal Pradesh","Kullu Nati is in Guinness World Records as the largest folk dance."]]},{"k":"table","title":"Classical or not?","head":["Name","What it is","Note"],"rows":[["Sattriya","Classical dance","One of the Sangeet Natak Akademi's eight."],["Mohiniyattam","Classical dance",""],["Kuchipudi","Classical dance",""],["Bihu","Folk dance",""],["Garba","Folk dance",""],["Ghoomar","Folk dance",""],["Yakshagana","Theatre form","Folk dance-drama of Karnataka."],["Kutiyattam","Theatre form","Sanskrit theatre of Kerala; UNESCO list 2008."],["Tamasha","Theatre form","Folk theatre of Maharashtra."],["Kalaripayattu","Martial art","Kerala's martial art — it shaped Kathakali's body training."],["Thang-ta","Martial art","Manipur's martial art."],["Theyyam","Ritual dance",""],["Lai Haraoba","Ritual dance","Manipur's festival of the forest gods — the root of Manipuri."]]},{"k":"trick","h":"Remember the eight with <b>“BK3 MOMS”<\/b>: <b>B<\/b>haratanatyam, <b>K<\/b>athak, <b>K<\/b>athakali, <b>K<\/b>uchipudi; <b>M<\/b>anipuri, <b>O<\/b>dissi, <b>M<\/b>ohiniyattam, <b>S<\/b>attriya. Anything outside this list is not SNA-classical."},{"k":"trap","h":"<b>Yakshagana<\/b> looks like Kathakali but is <b>Karnataka's folk theatre<\/b>. <b>Bihu<\/b> is folk; <b>Sattriya<\/b> is classical — both Assam. <b>Kalaripayattu<\/b> and <b>Thang-ta<\/b> are martial arts, not dances. <b>Chhau<\/b> is in the Ministry of Culture's list, so read the question's wording."}],"sum":["Classical dances follow the Natya Shastra and are recognised by the Sangeet Natak Akademi; folk dances belong to communities.","Assam: Sattriya (classical) vs Bihu (folk); Kerala: Kathakali (classical) vs Theyyam (ritual).","Yakshagana is Karnataka's folk dance-drama, not classical.","Gotipua (Odisha) boy dancers fed into Odissi.","Garba (UNESCO 2023) and Kalbelia (UNESCO 2010) are folk dances."],"part":["Part 3 · Festivals, awards and folk vs classical","महोत्सव, पुरस्कार और लोक बनाम शास्त्रीय"],"g":"cd"}
];

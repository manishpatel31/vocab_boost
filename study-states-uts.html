<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>

<title>States &amp; UTs at a Glance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Shared by every History page (built by tools/history/build.js).
   Layout: a manuscript folio — parchment paper, maroon ink, gold figures; one-column app with a bottom tab bar. */
:root{
  --paper:#f3efe4; --sheet:#fffdf6; --sunk:#e8e1cf;
  --ink:#241c14; --ink2:#5d5141; --rule:#d8cdb4;
  --blue:#7a2230; --on-blue:#ffffff; --blue-bg:#f4e2e1;
  --accent:#9a6a12; --accent-bg:#f8ecc9;
  --good:#1b6b4a; --good-bg:#ddefe4; --bad:#a8291f; --bad-bg:#f8e0dc;
  --warn-bg:#fcf0cf;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* era groups on the Learn screen */
.eras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.erac{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:grid;gap:6px}
.erac b{font-family:var(--f-display);font-size:15px;font-weight:700;line-height:1.25}
.erac .hi{font-size:12px;color:var(--ink2)}
.erac .mt{font-family:var(--f-num);font-size:11px;color:var(--ink2)}
.erac .meter{height:6px}
.erac[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.grph{display:flex;align-items:baseline;gap:8px;padding:14px 2px 4px;border-top:2px solid var(--ink);margin-top:4px}
.grph h2{font-size:17px}
.grph span{font-size:12px;color:var(--ink2);margin-left:auto;font-family:var(--f-num)}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}
.dots{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--rule);display:block}
.dots i.on{background:var(--accent)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.hot{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px;font-size:15px}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.facts.prose dd{font-weight:400;line-height:1.55}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap,.link{border-radius:var(--r);padding:12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.link{background:var(--sunk);border-color:transparent}
.trick .lab,.trap .lab,.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.link .lab{color:var(--ink2)}
.mn{font-family:var(--f-num);font-weight:600;background:var(--sheet);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.tag.src{background:var(--good-bg);color:var(--good)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:22px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
/* one-line revision rows (last week / last moment) */
.lines{display:grid;gap:0}
.lines div{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px dashed var(--rule);font-size:15px}
.lines div:first-child{border-top:0}
.lines b{font-weight:700}
.lines span{color:var(--ink2)}
.callout{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;font-size:15px}

/* plan maker */
.plancfg{display:grid;gap:12px}
.pday{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.pday > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pday > summary::-webkit-details-marker{display:none}
.pday .dno{font-family:var(--f-num);font-weight:700;font-size:13px;background:var(--sunk);border-radius:99px;padding:2px 10px;white-space:nowrap}
.pday.cur .dno{background:var(--blue);color:var(--on-blue)}
.pday.allgood .dno{background:var(--good-bg);color:var(--good)}
.pday .dt{min-width:0;font-weight:600;font-size:15px}
.pday .dt small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
.pday .dp{font-family:var(--f-num);font-size:12px;color:var(--ink2);white-space:nowrap}
.pday .body{padding:0 14px 12px;display:grid;gap:8px;border-top:1px dashed var(--rule);margin-top:2px;padding-top:10px}
.ptask{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;width:100%;font-size:15px}
.ptask .box{width:22px;height:22px;border-radius:6px;border:1.6px solid var(--rule);display:grid;place-items:center;font-size:14px;color:var(--on-blue);margin-top:1px}
.ptask[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.ptask[aria-pressed="true"] .lbl{text-decoration:line-through;color:var(--ink2)}
.ptask .lbl small{display:block;font-size:12px;color:var(--ink2);text-decoration:none}
/* the story first: plain-language opener for beginners */
.story{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;font-size:16.5px;line-height:1.65}
.story .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.story p{margin:0}
.story .key{background:var(--blue-bg);border-radius:8px;padding:8px 12px;font-size:15px;line-height:1.5}
.story .key b{color:var(--blue)}
/* hub: app cards and the beginner path */
.appcs{display:grid;gap:12px}
.appc{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;text-align:left;width:100%;cursor:pointer}
.appc:hover{border-color:var(--blue)}
.appc .hd{display:flex;align-items:center;gap:10px}
.appc .ic{font-size:26px;line-height:1}
.appc .hd b{font-family:var(--f-display);font-size:17px;font-weight:700;display:block}
.appc .hd small{font-size:12px;color:var(--ink2)}

{"id":"S1","heat":3,"title":"How the map was made","hi":"राज्यों का पुनर्गठन — नक्शा कैसे बना","blocks":[{"k":"hot","h":"Asked again and again: the <b>Fazl Ali Commission<\/b> and the <b>States Reorganisation Act, 1956<\/b>; the <b>year each new state was born<\/b> (Nagaland 1963, Haryana 1966, Sikkim 1975, the three of 2000, Telangana 2014); <b>which state it was carved from<\/b>; and the <b>2019 and 2020 changes<\/b> that left India with <b>28 states and 8 UTs<\/b>."},{"k":"story","h":"<p>In 1947 India was a patchwork of British provinces and more than 500 princely states. People wanted states drawn by <b>language<\/b>. When <b>Potti Sriramulu<\/b> died fasting in December 1952, the government gave in: <b>Andhra State<\/b> was born on 1 October 1953 — the first linguistic state. The <b>States Reorganisation Commission<\/b> (chair <b>Fazl Ali<\/b>, members <b>K. M. Panikkar<\/b> and <b>H. N. Kunzru<\/b>) then redrew the whole map. The <b>States Reorganisation Act<\/b> came into force on <b>1 November 1956<\/b> with <b>14 states and 6 UTs<\/b>, and the <b>7th Amendment<\/b> ended the old Part A/B/C/D classes.<\/p><p>The map kept changing: Bombay State split into <b>Gujarat and Maharashtra<\/b> (1960), <b>Nagaland<\/b> (1963), <b>Haryana<\/b> (1966), <b>Himachal<\/b> (1971), <b>Manipur, Tripura, Meghalaya<\/b> (1972), <b>Sikkim<\/b> (1975), <b>Mizoram, Arunachal, Goa<\/b> (1987), <b>Chhattisgarh, Uttarakhand, Jharkhand<\/b> (2000) and <b>Telangana<\/b> (2014). In 2019 the state of <b>Jammu and Kashmir<\/b> became two UTs, and in 2020 <b>Dadra and Nagar Haveli<\/b> merged with <b>Daman and Diu<\/b>. The same 1956 Act set up <b>five zonal councils<\/b>, chaired by the Union Home Minister.<\/p>","key":"1953 Andhra → 1956 SRC Act (14 states, 6 UTs) → 1960 Gujarat/Maharashtra → 1963 Nagaland → 1966 Haryana → 1971 HP → 1972 three NE states → 1975 Sikkim → 1987 Mizoram, Arunachal, Goa → 2000 three → 2014 Telangana → today 28 states and 8 UTs."},{"k":"facts","title":"India today (as of October 2026)","rows":[["States","28 — the youngest is Telangana (2 June 2014)"],["Union Territories","8 — Delhi, Chandigarh, J&K, Ladakh, Puducherry, Lakshadweep, Andaman and Nicobar Islands, Dadra and Nagar Haveli and Daman and Diu"],["UTs with an elected legislature","3 — Delhi, Puducherry, Jammu and Kashmir"],["States Reorganisation Commission","Fazl Ali (chair), K. M. Panikkar, H. N. Kunzru — set up 1953, report 1955"],["Earlier committees (1948)","Dhar Commission and the JVP Committee (Jawaharlal Nehru, Vallabhbhai Patel, Pattabhi Sitaramayya) — both against language as the basis"],["Zonal councils","5 — Northern, Central, Eastern, Western, Southern (States Reorganisation Act, 1956); chaired by the Union Home Minister"],["North Eastern Council","Set up by an Act of 1971, HQ Shillong; Sikkim added in 2002"]]},{"k":"tl","title":"The changing map","rows":[["1953","Andhra State — the first linguistic state"],["1956","States Reorganisation Act: 14 states, 6 UTs"],["1960","Gujarat and Maharashtra"],["1963","Nagaland"],["1966","Haryana"],["1971","Himachal Pradesh"],["1972","Manipur, Tripura, Meghalaya"],["1975","Sikkim"],["1987","Mizoram, Arunachal Pradesh, Goa"],["2000","Chhattisgarh, Uttarakhand, Jharkhand"],["2014","Telangana"],["2019","J&K becomes two UTs"],["2020","DNH and DD merged"]]},{"k":"table","title":"Milestones by year","head":["Event","Year","Note"],"rows":[["Andhra State formed — the first state made on the basis of language","1953","1 October 1953, after Potti Sriramulu died fasting in December 1952; capital Kurnool."],["States Reorganisation Commission (Fazl Ali Commission) set up","1953","December 1953; it reported in 1955."],["States Reorganisation Act comes into force","1956","1 November 1956 — 14 states and 6 Union Territories."],["Bombay State split into Gujarat and Maharashtra","1960","1 May 1960, by the Bombay Reorganisation Act."],["Goa, Daman and Diu freed from Portuguese rule","1961","19 December 1961 — Operation Vijay."],["Nagaland becomes a state","1963","1 December 1963 — the 16th state."],["Haryana carved out of Punjab","1966","1 November 1966; Chandigarh became a UT and the shared capital."],["Madras State renamed Tamil Nadu","1969","14 January 1969."],["Himachal Pradesh becomes a full state","1971","25 January 1971 — the 18th state."],["Manipur, Tripura and Meghalaya become states","1972","21 January 1972."],["Mysore State renamed Karnataka","1973","1 November 1973."],["Sikkim becomes the 22nd state","1975","16 May 1975, by the 36th Amendment."],["Mizoram and Arunachal Pradesh become states","1987","20 February 1987; Goa followed on 30 May 1987 as the 25th state."],["Chhattisgarh, Uttarakhand and Jharkhand formed","2000","On 1, 9 and 15 November 2000."],["Pondicherry renamed Puducherry","2006",""],["Uttaranchal renamed Uttarakhand","2007","1 January 2007."],["Orissa renamed Odisha","2011","And the language Oriya became Odia."],["Telangana becomes the 29th state","2014","2 June 2014."],["Jammu and Kashmir state split into two UTs","2019","31 October 2019 — the UTs of Jammu and Kashmir, and Ladakh."],["Dadra and Nagar Haveli merged with Daman and Diu","2020","26 January 2020 — India now has 8 UTs."],["Port Blair renamed Sri Vijaya Puram","2024","September 2024 — capital of the Andaman and Nicobar Islands."]]},{"k":"table","title":"Carved out of","head":["New state","Carved out of","Note"],"rows":[["Andhra State (1953)","Madras State","The Telugu-speaking north of Madras State."],["Gujarat (1960)","Bombay State","Bombay State was split in two."],["Maharashtra (1960)","Bombay State",""],["Nagaland (1963)","Assam",""],["Haryana (1966)","Punjab","The Hindi-speaking part of Punjab."],["Meghalaya (1972)","Assam","An autonomous state inside Assam from 1970, a full state in 1972."],["Mizoram (UT 1972, state 1987)","Assam","Once the Mizo Hills district of Assam."],["Chhattisgarh (2000)","Madhya Pradesh",""],["Uttarakhand (2000)","Uttar Pradesh",""],["Jharkhand (2000)","Bihar",""],["Telangana (2014)","Andhra Pradesh",""],["Ladakh UT (2019)","Jammu and Kashmir state",""]]},{"k":"table","title":"Zonal councils","head":["State / UT","Council","Note"],"rows":[["Punjab","Northern Zonal Council",""],["Rajasthan","Northern Zonal Council",""],["Himachal Pradesh","Northern Zonal Council",""],["Uttarakhand","Central Zonal Council","Not the Northern council — a common trap."],["Uttar Pradesh","Central Zonal Council",""],["Chhattisgarh","Central Zonal Council",""],["Madhya Pradesh","Central Zonal Council",""],["Jharkhand","Eastern Zonal Council",""],["Odisha","Eastern Zonal Council",""],["West Bengal","Eastern Zonal Council",""],["Goa","Western Zonal Council",""],["Gujarat","Western Zonal Council",""],["Telangana","Southern Zonal Council",""],["Kerala","Southern Zonal Council",""],["Puducherry","Southern Zonal Council","The only UT in the Southern council."],["Sikkim","North Eastern Council","Joined the NEC in 2002; the NEC (1971) is not one of the five zonal councils."]]},{"k":"trick","h":"The 2000 trio in date order — <b>“C-U-J”<\/b> (1, 9, 15 November): <b>C<\/b>hhattisgarh from MP, <b>U<\/b>ttarakhand from UP, <b>J<\/b>harkhand from Bihar. Parents in the same order: <b>“MUB”<\/b> — <b>M<\/b>P, <b>U<\/b>P, <b>B<\/b>ihar. And <b>Assam is the mother of the North-East<\/b>: Nagaland, Meghalaya and Mizoram all came out of it."},{"k":"trap","h":"<b>Odisha (1936)<\/b> was the first <i>province<\/i> made on language — but the first <i>state after independence<\/i> on language is <b>Andhra (1953)<\/b>. <b>Uttarakhand<\/b> sits in the <b>Central<\/b> zonal council, not the Northern. The North-East has the <b>North Eastern Council<\/b>, which is not one of the five zonal councils."}],"sum":["Andhra State (1 October 1953) was the first state formed on language after independence.","The Fazl Ali Commission (1953–55) led to the States Reorganisation Act, 1956: 14 states and 6 UTs.","New states: Gujarat and Maharashtra 1960, Nagaland 1963, Haryana 1966, HP 1971, Sikkim 1975, Goa {"id":"S2","heat":2,"title":"The north: Punjab, Haryana, Himachal, Rajasthan","hi":"उत्तर भारत: पंजाब, हरियाणा, हिमाचल, राजस्थान","blocks":[{"k":"hot","h":"Most asked: <b>Chandigarh<\/b> as the shared capital of Punjab and Haryana, <b>Shimla and Dharamshala<\/b> (Himachal’s two capitals), <b>Rajasthan<\/b> as the largest state by area, and <b>Punjab<\/b> as the ‘Land of Five Rivers’. (Delhi, Chandigarh, J&K and Ladakh — the other members of the Northern council — are in the UT lesson.)"},{"k":"story","h":"<p><b>Punjab<\/b> takes its name from five rivers — Sutlej, Beas, Ravi, Chenab and Jhelum. In 1966 its Hindi-speaking south became <b>Haryana<\/b>, and the new city of <b>Chandigarh<\/b>, designed by <b>Le Corbusier<\/b>, became a UT and the capital of both. <b>Himachal Pradesh<\/b> rose from a UT to a full state on 25 January 1971; it governs from <b>Shimla<\/b> in summer and declared <b>Dharamshala<\/b> its winter capital in 2017.<\/p><p><b>Rajasthan<\/b>, the old Rajputana, is India’s <b>largest state by area<\/b> (about 10.4% of India). Its capital is the Pink City, <b>Jaipur<\/b>, but its high court sits at <b>Jodhpur<\/b>. The <b>Thar Desert<\/b> fills its west and the <b>Aravallis<\/b> run through it, peaking at <b>Guru Shikhar<\/b> on Mount Abu.<\/p>","key":"Punjab + Haryana → Chandigarh; HP → Shimla (summer), Dharamshala (winter); Rajasthan → Jaipur, the largest state."},{"k":"table","title":"Capitals","head":["State","Capital","Note"],"rows":[["Punjab","Chandigarh","Shared with Haryana; Chandigarh itself is a UT."],["Haryana","Chandigarh","Shared with Punjab."],["Himachal Pradesh","Shimla","Summer capital; Dharamshala is the winter (second) capital since 2017."],["Himachal Pradesh (winter)","Dharamshala","Declared the second capital in 2017; the Assembly’s winter session meets at Tapovan near Dharamshala."],["Rajasthan","Jaipur","The Pink City — but the high court sits at Jodhpur."]]},{"k":"table","title":"Which state is it?","head":["Which state …","State","Note"],"rows":[["is known as the ‘Land of Five Rivers’","Punjab","Panj (five) + aab (water): Sutlej, Beas, Ravi, Chenab and Jhelum."],["is home to the Golden Temple and Jallianwala Bagh","Punjab","Both in Amritsar."],["is known for Bhangra and Giddha, and the Baisakhi harvest festival","Punjab",""],["was carved out of Punjab on 1 November 1966","Haryana","India’s 17th state."],["is home to Kurukshetra and Panipat","Haryana","Panipat saw three great battles: 1526, 1556 and 1761."],["became a full state on 25 January 1971","Himachal Pradesh","India’s 18th state."],["is called India’s ‘Apple State’","Himachal Pradesh","Most apples come from Shimla and Kullu."],["made Sanskrit its second official language in 2019","Himachal Pradesh","Uttarakhand did it first, in 2010."],["has the Kalka–Shimla railway, a UNESCO World Heritage site","Himachal Pradesh","Part of the Mountain Railways of India."],["was once called Rajputana, the ‘Land of Kings’","Rajasthan",""],["has the Thar Desert and Mount Abu","Rajasthan","Guru Shikhar on Mount Abu is the highest point of the Aravallis."],["is known for the Ghoomar and Kalbelia dances","Rajasthan","Kalbelia is on UNESCO’s intangible heritage list."],["celebrates its foundation day on 30 March","Rajasthan","Greater Rajasthan was formed on 30 March 1949."]]},{"k":"trick","h":"<b>“Two states, one Chandigarh”<\/b> — Punjab and Haryana share it; Chandigarh itself is a UT. For Himachal remember <b>“Summer Shimla, Dharamshala December”<\/b>."},{"k":"trap","h":"Both Himachal and Uttarakhand are sometimes called Devbhoomi — but in SSC options <b>‘Devbhoomi’ = Uttarakhand<\/b>. Rajasthan’s high court is at <b>Jodhpur<\/b>, not Jaipur (Jaipur has a bench)."}],"sum":["Punjab and Haryana share Chandigarh as capital; Chandigarh is a UT.","Haryana was carved from Punjab on 1 November 1966.","Himachal: Shimla (summer) and Dharamshala (winter, 2017); full state on 25 January 1971.","Punjab is the Land of Five Rivers: Sutlej, Beas, Ravi, Chenab, Jhelum.","Rajasthan (capital Jaipur, high court Jodhpur) is India's largest state by area."],"part":["Part 1 · The map, the north and the centre","नक्शा, उत्तर और मध्य भारत"],"g":"su"},
{"id":"S3","heat":2,"title":"The centre: UP, Uttarakhand, MP, Chhattisgarh","hi":"मध्य भारत: उत्तर प्रदेश, उत्तराखंड, मध्य प्रदेश, छत्तीसगढ़","blocks":[{"k":"hot","h":"Most asked: <b>UP<\/b> borders the most states and has the most people and Lok Sabha seats; <b>Uttarakhand<\/b> (from UP) and <b>Chhattisgarh<\/b> (from MP) were born in November 2000; the capitals <b>Dehradun / Gairsain<\/b>, <b>Bhopal<\/b>, <b>Raipur<\/b>; and high courts away from capitals (Prayagraj, Nainital, Jabalpur, Bilaspur)."},{"k":"story","h":"<p>These four states make up the <b>Central Zonal Council<\/b>. <b>Uttar Pradesh<\/b> (capital <b>Lucknow<\/b>) is India’s most populous state (Census 2011), sends <b>80<\/b> MPs to the Lok Sabha and touches <b>eight<\/b> states plus Delhi. In 2000 its hill districts became <b>Uttarakhand<\/b> — ‘Devbhoomi’, home of the Char Dham and the sources of the Ganga and Yamuna. It runs from <b>Dehradun<\/b> and named <b>Gairsain<\/b> its summer capital in 2020.<\/p><p><b>Madhya Pradesh<\/b> (capital <b>Bhopal<\/b>) is the ‘Heart of India’ and the ‘Tiger State’. It was the biggest state until 1 November 2000, when <b>Chhattisgarh<\/b> — ‘36 forts’, the rice bowl of central India — was carved out, with its capital at <b>Raipur<\/b>. MP now touches five states: Rajasthan, UP, Chhattisgarh, Maharashtra and Gujarat.<\/p>","key":"UP → Lucknow (80 seats, 8 neighbours); Uttarakhand → Dehradun + Gairsain; MP → Bhopal; Chhattisgarh → Raipur."},{"k":"table","title":"Capitals","head":["State","Capital","Note"],"rows":[["Uttar Pradesh","Lucknow","The high court is at Prayagraj (Allahabad), with a bench at Lucknow."],["Uttarakhand","Dehradun","Winter capital and seat of government."],["Uttarakhand (summer)","Gairsain (Bhararisain)","Declared the summer capital in 2020."],["Madhya Pradesh","Bhopal","The City of Lakes — the high court is at Jabalpur."],["Chhattisgarh","Raipur","Nava Raipur (Atal Nagar) is the new planned capital; the high court is at Bilaspur."]]},{"k":"table","title":"Which state is it?","head":["Which state …","State","Note"],"rows":[["has the most Lok Sabha seats (80)","Uttar Pradesh","Also the most Rajya Sabha seats (31)."],["is home to Varanasi, Prayagraj and Ayodhya","Uttar Pradesh",""],["celebrates its foundation day on 24 January","Uttar Pradesh","The United Provinces were renamed Uttar Pradesh on 24 January 1950."],["is called ‘Devbhoomi’ (Land of the Gods)","Uttarakhand","Char Dham: Yamunotri, Gangotri, Kedarnath, Badrinath."],["was carved out of Uttar Pradesh on 9 November 2000","Uttarakhand","The 27th state, first named Uttaranchal."],["has the sources of the Ganga and the Yamuna","Uttarakhand","Gangotri and Yamunotri glaciers."],["brought in a Uniform Civil Code in January 2025","Uttarakhand","The first state to pass a UCC law after independence."],["is called the ‘Heart of India’","Madhya Pradesh","It lies at the centre of the country."],["is called the ‘Tiger State’","Madhya Pradesh","Most tigers in the 2022 census."],["is home to Khajuraho, Sanchi and Bhimbetka","Madhya Pradesh","All three are UNESCO sites."],["was carved out of Madhya Pradesh on 1 November 2000","Chhattisgarh","The 26th state."],["has a name meaning ‘36 forts’","Chhattisgarh",""],["is called the ‘Rice Bowl of Central India’","Chhattisgarh",""]]},{"k":"trick","h":"UP’s eight neighbours, clockwise from the north — <b>“U H H R M C J B”<\/b>: <b>U<\/b>ttarakhand, <b>H<\/b>imachal, <b>H<\/b>aryana, <b>R<\/b>ajasthan, <b>M<\/b>P, <b>C<\/b>hhattisgarh, <b>J<\/b>harkhand, <b>B<\/b>ihar (plus Delhi, a UT, and Nepal abroad)."},{"k":"trap","h":"Uttarakhand’s <b>high court<\/b> is at <b>Nainital<\/b>; its <b>summer capital<\/b> is <b>Gairsain<\/b>. MP’s high court is at <b>Jabalpur<\/b>, Chhattisgarh’s at <b>Bilaspur<\/b>, UP’s at <b>Prayagraj<\/b> — none in the capital."}],"sum":["UP (Lucknow): most populous state, 80 Lok Sabha seats, borders 8 states.","Uttarakhand (Dehradun; Gairsain in summer) was carved from UP on 9 November 2000.","Madhya Pradesh (Bhopal) is the Heart of India and the Tiger State; it borders 5 states.","Chhattisgarh (Raipur) was carved from MP on 1 November 2000.","All four form the Central Zonal Council."],"part":["Part 1 · The map, the north and the centre","नक्शा, उत्तर और मध्य भारत"],"g":"su"},
{"id":"S4","heat":2,"title":"The east: Bihar, Jharkhand, Odisha, West Bengal","hi":"पूर्वी भारत: बिहार, झारखंड, ओडिशा, पश्चिम बंगाल","blocks":[{"k":"hot","h":"Most asked: the capitals (<b>Patna, Ranchi, Bhubaneswar, Kolkata<\/b>), <b>Jharkhand from Bihar (15 November 2000)<\/b>, Odisha as the first language-based province (<b>1936<\/b>), and <b>West Bengal<\/b> bordering three countries."},{"k":"story","h":"<p>The four states of the <b>Eastern Zonal Council<\/b> share one history. Bengal Presidency once ruled them all; <b>Bihar and Orissa<\/b> were split off in 1912 (Bihar Diwas, 22 March), and <b>Orissa<\/b> became its own province on <b>1 April 1936<\/b> — the first drawn by language. In 2011 it became <b>Odisha<\/b>. <b>Jharkhand<\/b>, the ‘land of forests’ and coal, was carved from Bihar on <b>15 November 2000<\/b>, Birsa Munda’s birthday, with <b>Ranchi<\/b> as capital.<\/p><p><b>Kolkata<\/b>, capital of <b>West Bengal<\/b>, was the capital of British India until <b>1911<\/b>. West Bengal touches <b>Bangladesh, Nepal and Bhutan<\/b>, and its <b>Siliguri Corridor<\/b> — the ‘Chicken’s Neck’ — is the only land link to the North-East. <b>Bihar<\/b> (capital <b>Patna<\/b>) has the highest population density of any state (Census 2011).<\/p>","key":"Bihar → Patna; Jharkhand → Ranchi (2000, from Bihar); Odisha → Bhubaneswar (province 1936); West Bengal → Kolkata (3 foreign neighbours)."},{"k":"table","title":"Capitals","head":["State","Capital","Note"],"rows":[["Bihar","Patna","The ancient Pataliputra."],["Jharkhand","Ranchi","The ‘City of Waterfalls’."],["Odisha","Bhubaneswar","The ‘Temple City’; the high court is at Cuttack."],["West Bengal","Kolkata","Capital of British India until 1911."]]},{"k":"table","title":"Which state is it?","head":["Which state …","State","Note"],"rows":[["celebrates its foundation day on 22 March (separated from Bengal in 1912)","Bihar","Bihar Diwas."],["is home to Nalanda, Bodh Gaya and Vaishali","Bihar",""],["was carved out of Bihar on Birsa Munda’s birth anniversary, 15 November 2000","Jharkhand","The 28th state."],["has a name meaning ‘land of forests’ and is rich in coal and minerals","Jharkhand",""],["celebrates the Sarhul festival of the tribes","Jharkhand",""],["became a separate province on 1 April 1936 — Utkal Divas","Odisha","The first province formed on the basis of language."],["is home to the Konark Sun Temple and the Jagannath Rath Yatra of Puri","Odisha",""],["is the home of the Odissi dance","Odisha",""],["borders three countries — Bangladesh, Nepal and Bhutan","West Bengal","It also has the longest border with Bangladesh."],["has the Siliguri Corridor, the ‘Chicken’s Neck’","West Bengal","The narrow strip that links the North-East to the rest of India."],["is famous for Durga Puja, on UNESCO’s intangible heritage list since 2021","West Bengal",""]]},{"k":"trick","h":"<b>“Patna Rides Bhubaneswar’s Kolkata bus”<\/b> — P-R-B-K: Patna (Bihar), Ranchi (Jharkhand), Bhubaneswar (Odisha), Kolkata (WB) — the east, west to east."},{"k":"trap","h":"<b>Chhau<\/b> dance belongs to three states (Seraikela in Jharkhand, Mayurbhanj in Odisha, Purulia in WB) — don’t tie it to one. Odisha’s high court is at <b>Cuttack<\/b>, not Bhubaneswar."}],"sum":["Bihar (Patna) — highest population density; Bihar Diwas 22 March.","Jharkhand (Ranchi) was carved from Bihar on 15 November 2000.","Odisha (Bhubaneswar) became a province on 1 April 1936 — the first by language; renamed in 2011.","West Bengal (Kolkata) borders Bangladesh, Nepal and Bhutan and has the Siliguri Corridor.","All four form the Eastern Zonal Council."],"part":["Part 2 · East, North-East, West and South","पूर्व, पूर्वोत्तर, पश्चिम और दक्षिण"],"g":"su"},
{"id":"S5","heat":3,"title":"The North-East: eight states","hi":"पूर्वोत्तर के आठ राज्य","blocks":[{"k":"hot","h":"A favourite: <b>capital of each North-Eastern state<\/b> (Dispur, Itanagar, Imphal, Shillong, Aizawl, Kohima, Agartala, Gangtok), the <b>nicknames<\/b> (Abode of Clouds, Land of the Rising Sun), the <b>Seven Sisters<\/b> and Sikkim, and the <b>years<\/b> (1963, 1972, 1975, 1987)."},{"k":"story","h":"<p>Almost the whole North-East was once <b>Assam<\/b>. Out of it came <b>Nagaland<\/b> (1963), <b>Meghalaya<\/b> (1972), and <b>Mizoram<\/b> and <b>Arunachal Pradesh<\/b> (UTs in 1972, states in 1987). <b>Manipur<\/b> and <b>Tripura<\/b>, former princely states, became states in 1972. When Shillong went to Meghalaya, Assam moved its capital to <b>Dispur<\/b>. These seven are the <b>‘Seven Sisters’<\/b>.<\/p><p><b>Sikkim<\/b>, a kingdom under the Chogyal, joined India as the <b>22nd state<\/b> in 1975 — the ‘brother’ of the sisters, linked to them through the North Eastern Council since 2002. Sikkim has the smallest population of any state and became the first fully <b>organic<\/b> state in 2016. <b>Arunachal<\/b>, India’s easternmost and largest north-eastern state, greets the sunrise first.<\/p>","key":"Assam–Dispur, Arunachal–Itanagar, Manipur–Imphal, Meghalaya–Shillong, Mizoram–Aizawl, Nagaland–Kohima, Tripura–Agartala, Sikkim–Gangtok."},{"k":"table","title":"Capitals","head":["State","Capital","Note"],"rows":[["Assam","Dispur","A part of Guwahati; Shillong was Assam’s capital until 1972."],["Arunachal Pradesh","Itanagar",""],["Manipur","Imphal",""],["Meghalaya","Shillong","The ‘Scotland of the East’."],["Mizoram","Aizawl",""],["Nagaland","Kohima",""],["Tripura","Agartala",""],["Sikkim","Gangtok",""]]},{"k":"table","title":"Which state is it?","head":["Which state …","State","Note"],"rows":[["is called the ‘Land of the Rising Sun’ (Land of the Dawn-lit Mountains)","Arunachal Pradesh","India’s easternmost state."],["borders China, Bhutan and Myanmar","Arunachal Pradesh",""],["is called the ‘Abode of Clouds’","Meghalaya","From Sanskrit megha (cloud) + alaya (home)."],["has Mawsynram and Sohra (Cherrapunji), among the wettest places on Earth","Meghalaya",""],["was called the ‘Jewel of India’ by Nehru and has Loktak Lake","Manipur",""],["is the home of the Manipuri dance and the sport of polo (sagol kangjei)","Manipur",""],["is called the ‘Land of Festivals’ and holds the Hornbill Festival every December","Nagaland","1–10 December, Kisama village near Kohima."],["became a state on 1 December 1963, the first in the North-East after Assam","Nagaland","The 16th state."],["became the first fully organic state of India in 2016","Sikkim",""],["is the only North-Eastern state that is not one of the ‘Seven Sisters’","Sikkim","It joined the North Eastern Council in 2002."],["is surrounded by Bangladesh on three sides","Tripura",""],["became a state after the Mizo Accord of 1986","Mizoram","Statehood on 20 February 1987."],["is the home of the Bihu festival and the Sattriya dance","Assam",""],["has Majuli, a large inhabited river island on the Brahmaputra","Assam",""]]},{"k":"facts","title":"North-East quick facts","rows":[["Border Myanmar","Arunachal Pradesh, Nagaland, Manipur, Mizoram"],["Border Bangladesh","Assam, Meghalaya, Tripura, Mizoram (and West Bengal)"],["Border Bhutan","Sikkim, Assam, Arunachal Pradesh (and West Bengal)"],["Border China","Sikkim, Arunachal Pradesh"],["Gauhati High Court","Covers Assam, Nagaland, Mizoram and Arunachal Pradesh"],["North Eastern Council","Statutory body (1971), HQ Shillong; Sikkim added 2002"]]},{"k":"trick","h":"Capitals of the sisters — <b>“DIIS AKA”<\/b>: <b>D<\/b>ispur, <b>I<\/b>tanagar, <b>I<\/b>mphal, <b>S<\/b>hillong, <b>A<\/b>izawl, <b>K<\/b>ohima, <b>A<\/b>gartala — and brother Sikkim’s <b>G<\/b>angtok."},{"k":"trap","h":"<b>Shillong<\/b> is Meghalaya’s capital now, not Assam’s. <b>Sikkim<\/b> is in the North-East but is <b>not<\/b> a ‘sister’. Nagaland (1963) came long before Mizoram and Arunachal (1987)."}],"sum":["Seven Sisters: Assam, Arunachal, Manipur, Meghalaya, Mizoram, Nagaland, Tripura; Sikkim is the 'brother'.","Capitals: Dispur, Itanagar, Imphal, Shillong, Aizawl, Kohima, Agartala, Gangtok.","Nagaland 1963; Manipur, Tripura, Meghalaya 1972; Sikkim 1975; Mizoram and Arunachal 1987.","Meghalaya is the Abode of Clouds; Arunachal the Land of the Rising Sun; Nagaland the Land of Festivals.","Sikkim: smallest population and first fully organic state (2016)."],"part":["Part 2 · East, North-East, West and South","पूर्व, पूर्वोत्तर, पश्चिम और दक्षिण"],"g":"su"},
{"id":"S6","heat":2,"title":"The west: Gujarat, Maharashtra, Goa","hi":"पश्चिमी भारत: गुजरात, महाराष्ट्र, गोवा","blocks":[{"k":"hot","h":"Most asked: <b>Gandhinagar<\/b> (not Ahmedabad), <b>Mumbai and Nagpur<\/b>, <b>Goa<\/b> as the smallest state and its <b>1961 liberation<\/b>, and <b>1 May 1960<\/b> when Bombay State split into Gujarat and Maharashtra."},{"k":"story","h":"<p>After 1956, <b>Bombay State<\/b> held both Marathi and Gujarati speakers. The Samyukta Maharashtra and Mahagujarat movements split it on <b>1 May 1960<\/b> — so both states celebrate their birthday on the same day. <b>Gujarat<\/b> moved its capital from Ahmedabad to the planned city of <b>Gandhinagar<\/b> in 1970; it has India’s <b>longest coastline<\/b>. <b>Maharashtra<\/b> rules from <b>Mumbai<\/b> and holds its winter session in <b>Nagpur<\/b>.<\/p><p><b>Goa<\/b> stayed Portuguese until Indian troops freed it in <b>Operation Vijay<\/b> on <b>19 December 1961<\/b>. It was a UT with Daman and Diu until it became the <b>25th state<\/b> on <b>30 May 1987<\/b>, with <b>Panaji<\/b> as capital. It is India’s <b>smallest state by area<\/b>. These three, with DNH and DD, form the <b>Western Zonal Council<\/b>.<\/p>","key":"Gujarat → Gandhinagar; Maharashtra → Mumbai (Nagpur in winter); Goa → Panaji. Gujarat and Maharashtra: 1 May 1960; Goa freed 1961, state 1987."},{"k":"table","title":"Capitals","head":["State","Capital","Note"],"rows":[["Gujarat","Gandhinagar","Capital since 1970; the high court is at Ahmedabad."],["Maharashtra","Mumbai","The legislature’s winter session meets at Nagpur."],["Maharashtra (second / winter)","Nagpur","The ‘Orange City’, at the centre of India."],["Goa","Panaji","The Assembly sits at Porvorim, across the Mandovi river."]]},{"k":"table","title":"Which state is it?","head":["Which state …","State","Note"],"rows":[["has the Rann of Kutch and the Statue of Unity","Gujarat","The Statue of Unity (Sardar Patel) is the world’s tallest statue."],["has the Harappan sites Lothal and Dholavira","Gujarat",""],["is the home of Garba and Dandiya at Navratri","Gujarat","Garba entered UNESCO’s intangible heritage list in 2023."],["has the Ajanta and Ellora caves","Maharashtra","Both UNESCO sites since 1983."],["is the home of the Lavani dance and Ganesh Chaturthi celebrations","Maharashtra",""],["was freed from Portuguese rule on 19 December 1961","Goa","Operation Vijay."],["became India’s 25th state on 30 May 1987","Goa",""],["has followed a common civil code since Portuguese times","Goa",""]]},{"k":"trick","h":"<b>“May Day twins”<\/b> — Gujarat and Maharashtra were born together on <b>1 May 1960<\/b>. <b>Goa<\/b>: <b>“61 free, 87 state”<\/b>."},{"k":"trap","h":"Gujarat’s capital is <b>Gandhinagar<\/b>; its high court is in <b>Ahmedabad<\/b>. Goa has no high court of its own — a bench of the <b>Bombay High Court<\/b> sits in Goa."}],"sum":["Bombay State split into Gujarat and Maharashtra on 1 May 1960.","Gujarat (Gandhinagar, since 1970) has the longest coastline.","Maharashtra: Mumbai, with Nagpur as the winter capital.","Goa (Panaji) was freed on 19 December 1961 and became the 25th state on 30 May 1987.","Goa is the smallest state by area."],"part":["Part 2 · East, North-East, West and South","पूर्व, पूर्वोत्तर, पश्चिम और दक्षिण"],"g":"su"},
{"id":"S7","heat":3,"title":"The south: Andhra, Telangana, Karnataka, Kerala, Tamil Nadu","hi":"दक्षिण भारत: आंध्र, तेलंगाना, कर्नाटक, केरल, तमिलनाडु","blocks":[{"k":"hot","h":"Most asked: <b>Telangana<\/b> — the youngest state (2 June 2014); <b>Andhra State (1953)<\/b> — the first linguistic state; <b>old names<\/b> (Mysore → Karnataka 1973, Madras → Tamil Nadu 1969); and Kerala’s records (literacy, sex ratio)."},{"k":"story","h":"<p>The story of linguistic states begins here. <b>Andhra State<\/b> (capital <b>Kurnool<\/b>) came in 1953; in 1956 it joined the Telugu districts of Hyderabad State to form <b>Andhra Pradesh<\/b>, with Hyderabad as capital. In <b>2014<\/b> those Telangana districts became <b>India’s 29th and youngest state<\/b>; Hyderabad stayed the shared capital until 2 June 2024, and Andhra Pradesh builds its capital at <b>Amaravati<\/b>.<\/p><p><b>Kerala<\/b> was formed in 1956 from Travancore-Cochin and Malabar — ‘God’s Own Country’, with the highest literacy and best sex ratio (Census 2011). <b>Mysore State<\/b> became <b>Karnataka<\/b> in 1973 (capital <b>Bengaluru<\/b>), and <b>Madras State<\/b> became <b>Tamil Nadu<\/b> in 1969 (capital <b>Chennai<\/b>). With Puducherry these five form the <b>Southern Zonal Council<\/b>.<\/p>","key":"AP → Amaravati; Telangana → Hyderabad (2014); Karnataka → Bengaluru (Mysore until 1973); Kerala → Thiruvananthapuram; TN → Chennai (Madras until 1969)."},{"k":"table","title":"Capitals","head":["State","Capital","Note"],"rows":[["Andhra Pradesh","Amaravati","Hyderabad was the shared capital of AP and Telangana until 2 June 2024."],["Andhra State (1953–56)","Kurnool","The first linguistic state’s capital."],["Telangana","Hyderabad",""],["Karnataka","Bengaluru","The ‘Silicon Valley of India’."],["Kerala","Thiruvananthapuram","The high court is at Kochi (Ernakulam)."],["Tamil Nadu","Chennai",""]]},{"k":"table","title":"Which state is it?","head":["Which state …","State","Note"],"rows":[["is called ‘God’s Own Country’","Kerala",""],["is the home of Kathakali and Mohiniyattam, and the Onam festival","Kerala",""],["was formed on 1 November 1956 by joining Travancore-Cochin with Malabar","Kerala","Kerala Piravi day."],["is India’s youngest state, formed on 2 June 2014","Telangana","The 29th state."],["has the Charminar and the Ramappa (Kakatiya) temple","Telangana","Ramappa became a UNESCO site in 2021."],["is the home of the Kuchipudi dance","Andhra Pradesh","Named after a village in Krishna district."],["was formed in 1956 by joining Andhra State with the Telugu areas of Hyderabad State","Andhra Pradesh",""],["was called Mysore State until 1973","Karnataka",""],["has Hampi and the Yakshagana folk theatre","Karnataka",""],["was called Madras State until 1969","Tamil Nadu",""],["is the home of Bharatanatyam and the Pongal festival","Tamil Nadu",""],["has Kanyakumari, the southern tip of mainland India","Tamil Nadu",""]]},{"k":"facts","title":"Classical dances of the south (briefly)","rows":[["Bharatanatyam","Tamil Nadu"],["Kathakali, Mohiniyattam","Kerala"],["Kuchipudi","Andhra Pradesh"],["Yakshagana (folk theatre)","Karnataka"]]},{"k":"trick","h":"Renamings in order — <b>“M-M, 69-73”<\/b>: <b>M<\/b>adras → Tamil Nadu (<b>1969<\/b>), <b>M<\/b>ysore → Karnataka (<b>1973<\/b>)."},{"k":"trap","h":"Kerala’s capital is <b>Thiruvananthapuram<\/b>, but its high court is at <b>Kochi<\/b>. The first linguistic state is <b>Andhra (1953)<\/b>, not Andhra Pradesh (1956)."}],"sum":["Andhra State (1953, Kurnool) was the first linguistic state; Andhra Pradesh followed in 1956.","Telangana (Hyderabad) became the 29th and youngest state on 2 June 2014.","Andhra Pradesh's capital is Amaravati; Hyderabad was shared until 2 June 2024.","Mysore became Karnataka in 1973; Madras State became Tamil Nadu in 1969.","Kerala: highest literacy and best sex ratio (Census 2011)."],"part":["Part 2 · East, North-East, West and South","पूर्व, पूर्वोत्तर, पश्चिम और दक्षिण"],"g":"su"},
{"id":"S8","heat":3,"title":"The eight Union Territories","hi":"आठ केंद्रशासित प्रदेश","blocks":[{"k":"hot","h":"Asked every year: the <b>number of UTs (8)<\/b>, which ones have a <b>legislature<\/b> (Delhi, Puducherry, J&K), the <b>largest (Ladakh)<\/b> and <b>smallest (Lakshadweep)<\/b>, the capitals (<b>Kavaratti<\/b>, <b>Sri Vijaya Puram<\/b>, <b>Daman<\/b>, <b>Leh<\/b>), and the 2019 and 2020 changes."},{"k":"story","h":"<p>Union Territories are run by the Centre through an Administrator or Lieutenant Governor (Article 239). Three of the eight also elect a legislature: <b>Delhi<\/b> (the National Capital Territory, by the <b>69th Amendment, 1991<\/b>, Article 239AA), <b>Puducherry<\/b> (Article 239A) and, since <b>31 October 2019<\/b>, <b>Jammu and Kashmir<\/b>, which uses <b>Srinagar<\/b> in summer and <b>Jammu<\/b> in winter. <b>Ladakh<\/b> (capital <b>Leh<\/b>), split from J&K the same day, is the <b>largest UT<\/b> and has no legislature.<\/p><p>The islands: <b>Lakshadweep<\/b> (capital <b>Kavaratti<\/b>), the <b>smallest UT<\/b>, and the <b>Andaman and Nicobar Islands<\/b>, whose capital Port Blair was renamed <b>Sri Vijaya Puram<\/b> in 2024 and whose Indira Point is India’s southernmost tip. <b>Puducherry<\/b> was French; its pieces lie in three states. <b>Chandigarh<\/b> (1966) is the shared capital of Punjab and Haryana, and on <b>26 January 2020<\/b> <b>Dadra and Nagar Haveli<\/b> joined <b>Daman and Diu<\/b> as one UT with capital <b>Daman<\/b>.<\/p>","key":"8 UTs; 3 with legislatures (Delhi, Puducherry, J&K); largest Ladakh, smallest Lakshadweep; A&N capital Sri Vijaya Puram; DNH & DD capital Daman."},{"k":"table","title":"UT capitals","head":["Union Territory","Capital","Note"],"rows":[["Delhi","New Delhi","The National Capital Territory."],["Jammu and Kashmir (summer)","Srinagar",""],["Jammu and Kashmir (winter)","Jammu",""],["Ladakh","Leh","Kargil is the other district headquarters."],["Lakshadweep","Kavaratti",""],["Andaman and Nicobar Islands","Sri Vijaya Puram","Renamed from Port Blair in September 2024."],["Dadra and Nagar Haveli and Daman and Diu","Daman","Silvassa was the capital of the old DNH UT."]]},{"k":"table","title":"Which UT is it?","head":["Which UT …","Union Territory","Note"],"rows":[["is the largest by area","Ladakh","About 59,000 sq km of Indian-administered area."],["is the smallest by area and by population","Lakshadweep","About 32 sq km."],["is the most populous","Delhi",""],["became the National Capital Territory by the 69th Amendment (1991)","Delhi","Article 239AA."],["is the capital of two states but has no legislature of its own","Chandigarh",""],["has enclaves in three states — Karaikal, Mahe and Yanam","Puducherry","Karaikal in Tamil Nadu, Mahe in Kerala, Yanam in Andhra Pradesh."],["was handed over by France (de facto 1954, de jure 1962)","Puducherry",""],["has Indira Point, the southernmost point of India","Andaman and Nicobar Islands","On Great Nicobar."],["has Barren Island, India’s only active volcano","Andaman and Nicobar Islands",""],["was formed by merging two UTs on 26 January 2020","Dadra and Nagar Haveli and Daman and Diu",""],["is the UT with an elected legislature created on 31 October 2019","Jammu and Kashmir",""],["borders both China and Pakistan and has the Siachen Glacier","Ladakh",""],["is a group of coral islands once called Laccadive, Minicoy and Amindivi","Lakshadweep","Renamed in 1973."]]},{"k":"facts","title":"UTs: legislature and high court (as of October 2026)","rows":[["Delhi","Legislature — yes · Delhi High Court"],["Puducherry","Legislature — yes · Madras High Court"],["Jammu and Kashmir","Legislature — yes · High Court of J&K and Ladakh"],["Ladakh","No legislature · High Court of J&K and Ladakh"],["Chandigarh","No legislature · Punjab and Haryana High Court"],["Lakshadweep","No legislature · Kerala High Court"],["Andaman and Nicobar Islands","No legislature · Calcutta High Court"],["Dadra and Nagar Haveli and Daman and Diu","No legislature · Bombay High Court"]]},{"k":"trick","h":"The three UTs with a legislature — <b>“DJP”<\/b>: <b>D<\/b>elhi, <b>J<\/b>&K, <b>P<\/b>uducherry. Largest vs smallest — <b>“L to L”<\/b>: <b>L<\/b>adakh to <b>L<\/b>akshadweep."},{"k":"trap","h":"Port Blair is now <b>Sri Vijaya Puram<\/b>. The capital of DNH and DD is <b>Daman<\/b>, not Silvassa. <b>Chandigarh<\/b> is a capital of two states but is itself a UT without a legislature."}],"sum":["India has 8 UTs; Delhi, Puducherry and J&K have elected legislatures.","Ladakh (Leh) is the largest UT; Lakshadweep (Kavaratti) the smallest by area and population.","J&K: Srinagar (summer) and Jammu (winter); a UT since 31 October 2019.","Andaman and Nicobar capital: Sri Vijaya Puram (renamed 2024); DNH and DD capital: Daman (merged 2020).","Delhi became the National Capital Territory by the 69th Amendment, 1991."],"part":["Part 3 · UTs, high courts and records","केंद्रशासित प्रदेश, उच्च न्यायालय और रिकॉर्ड"],"g":"su"},
{"id":"S9","heat":2,"title":"High courts and official languages","hi":"उच्च न्यायालय और राजभाषाएँ","blocks":[{"k":"hot","h":"The favourite trap: <b>high courts that are NOT in the capital<\/b> — Prayagraj (UP), Jabalpur (MP), Jodhpur (Rajasthan), Bilaspur (Chhattisgarh), Nainital (Uttarakhand), Kochi (Kerala), Cuttack (Odisha), Ahmedabad (Gujarat). Also: <b>25 high courts<\/b>, the <b>oldest (Calcutta, 1862)<\/b>, <b>common high courts<\/b>, and states whose official language is <b>English<\/b>."},{"k":"story","h":"<p>Article 214 gives every state a high court, and Article 231 lets two or more states share one. India has <b>25 high courts<\/b>. The oldest three — <b>Calcutta, Bombay and Madras<\/b> — date from <b>1862<\/b>, Calcutta first. The newest are <b>Meghalaya, Manipur and Tripura<\/b> (2013) and the split of the Hyderabad court into <b>Andhra Pradesh<\/b> and <b>Telangana<\/b> high courts (1 January 2019). The <b>Gauhati High Court<\/b> serves four states — Assam, Nagaland, Mizoram and Arunachal — and the <b>Bombay High Court<\/b> serves Maharashtra, Goa and DNH & DD.<\/p><p>Each state picks its own <b>official language<\/b> (Article 345). Most choose their main language, but <b>Nagaland, Arunachal Pradesh and Meghalaya<\/b> use <b>English<\/b>. <b>Konkani<\/b> (Goa), <b>Manipuri<\/b> and <b>Nepali<\/b> entered the Eighth Schedule in <b>1992<\/b>. Uttarakhand (2010) and Himachal (2019) made <b>Sanskrit<\/b> their second official language, and J&K’s 2020 Act lists <b>five<\/b> (Kashmiri, Dogri, Urdu, Hindi, English). Tripura uses <b>Bengali and Kokborok<\/b>.<\/p>","key":"25 high courts; oldest Calcutta (1862); Gauhati HC = 4 states; HCs away from capitals: Prayagraj, Jabalpur, Jodhpur, Bilaspur, Nainital, Kochi, Cuttack, Ahmedabad."},{"k":"table","title":"Where each high court sits","head":["State / UT","High court seat","Note"],"rows":[["Uttar Pradesh","Prayagraj","The Allahabad High Court; bench at Lucknow."],["Madhya Pradesh","Jabalpur","Benches at Indore and Gwalior."],["Rajasthan","Jodhpur","Bench at Jaipur."],["Chhattisgarh","Bilaspur",""],["Uttarakhand","Nainital",""],["Kerala","Kochi","At Ernakulam; also serves Lakshadweep."],["Odisha","Cuttack",""],["Gujarat","Ahmedabad",""],["Assam","Guwahati","The Gauhati High Court also serves Nagaland, Mizoram and Arunachal Pradesh."],["Maharashtra","Mumbai","The Bombay High Court."],["Goa","Panaji","A bench of the Bombay High Court."],["Punjab and Haryana","Chandigarh","One common high court, which also serves Chandigarh UT."],["Himachal Pradesh","Shimla",""],["Jharkhand","Ranchi",""],["Bihar","Patna",""],["Andhra Pradesh","Amaravati","Its own high court since 1 January 2019."],["Telangana","Hyderabad","Its own high court since 1 January 2019."],["Karnataka","Bengaluru","Benches at Dharwad and Kalaburagi."],["Tamil Nadu","Chennai","The Madras High Court; bench at Madurai."],["West Bengal","Kolkata","The Calcutta High Court — India’s oldest (1862)."],["Sikkim","Gangtok","The smallest high court."],["Meghalaya","Shillong","Set up in 2013."],["Manipur","Imphal","Set up in 2013."],["Tripura","Agartala","Set up in 2013."],["Andaman and Nicobar Islands","Kolkata","Under the Calcutta High Court."],["Puducherry","Chennai","Under the Madras High Court."]]},{"k":"table","title":"Benches","head":["Bench at","High court","Note"],"rows":[["Lucknow","Allahabad High Court",""],["Indore","Madhya Pradesh High Court",""],["Gwalior","Madhya Pradesh High Court",""],["Jaipur","Rajasthan High Court",""],["Nagpur","Bombay High Court",""],["Aurangabad (Chhatrapati Sambhajinagar)","Bombay High Court",""],["Madurai","Madras High Court",""],["Dharwad","Karnataka High Court",""],["Kalaburagi","Karnataka High Court",""],["Jalpaiguri","Calcutta High Court","Circuit bench."],["Port Blair (Sri Vijaya Puram)","Calcutta High Court","Circuit bench."],["Kohima","Gauhati High Court",""],["Aizawl","Gauhati High Court",""],["Itanagar","Gauhati High Court",""]]},{"k":"table","title":"Official languages","head": ्च न्यायालय और रिकॉर्ड"],"g":"su"},
{"id":"S10","heat":3,"title":"Records, borders and state symbols","hi":"रिकॉर्ड, सीमाएँ और राजकीय प्रतीक","blocks":[{"k":"hot","h":"Every paper has one ‘record’ question: <b>largest<\/b> (Rajasthan) and <b>smallest<\/b> (Goa) state, <b>most<\/b> (UP) and <b>least<\/b> (Sikkim) populous, <b>densest<\/b> (Bihar), <b>literacy<\/b> (Kerala), <b>borders<\/b> (UP, Tropic of Cancer, neighbouring countries). State animals and birds come up in CHSL and MTS."},{"k":"story","h":"<p>Picture India as a family photo. The biggest member is <b>Rajasthan<\/b>, then <b>MP<\/b> and <b>Maharashtra<\/b>; the tiniest is <b>Goa<\/b>, then <b>Sikkim<\/b>. <b>UP<\/b> has the most people and touches the most states; <b>Sikkim<\/b> has the fewest people. <b>Bihar<\/b> is the most crowded and <b>Arunachal<\/b> the emptiest. <b>Kerala<\/b> tops literacy and sex ratio, while <b>Haryana<\/b> has the lowest sex ratio (Census 2011). <b>Gujarat<\/b> has the longest coastline of the <b>nine coastal states<\/b>.<\/p><p>The <b>Tropic of Cancer<\/b> crosses <b>eight<\/b> states: Gujarat, Rajasthan, MP, Chhattisgarh, Jharkhand, West Bengal, Tripura and Mizoram. Five states touch <b>Bangladesh<\/b> (WB, Assam, Meghalaya, Tripura, Mizoram), five touch <b>Nepal<\/b> (Uttarakhand, UP, Bihar, WB, Sikkim) and four touch <b>Bhutan<\/b> (Sikkim, WB, Assam, Arunachal). Every state also has its own animal, bird, flower and tree — Gujarat’s lion, Assam’s rhino, Rajasthan’s great Indian bustard.<\/p>","key":"Largest Rajasthan, smallest Goa; most people UP, fewest Sikkim; densest Bihar; literacy Kerala; Tropic of Cancer — 8 states."},{"k":"table","title":"Which state holds the record?","head":["Which state …","State","Note"],"rows":[["is the largest by area","Rajasthan","About 3.42 lakh sq km — 10.4% of India."],["is the second-largest by area","Madhya Pradesh",""],["is the third-largest by area","Maharashtra",""],["is the smallest by area","Goa","About 3,702 sq km."],["is the second-smallest by area","Sikkim",""],["is the second most populous (Census 2011)","Maharashtra",""],["has the smallest population (Census 2011)","Sikkim","About 6.1 lakh."],["has the highest population density (Census 2011)","Bihar","1,106 people per sq km."],["has the lowest population density (Census 2011)","Arunachal Pradesh","17 people per sq km."],["has the highest literacy rate (Census 2011)","Kerala","About 94%; Mizoram is second."],["has the lowest literacy rate (Census 2011)","Bihar","About 61.8%."],["has the highest sex ratio (Census 2011)","Kerala","1,084 women per 1,000 men."],["has the lowest sex ratio (Census 2011)","Haryana","879 women per 1,000 men."],["has the longest coastline","Gujarat",""],["is the largest in the North-East","Arunachal Pradesh",""]]},{"k":"table","title":"State animals","head":["State / UT","State animal","Note"],"rows":[["Assam","One-horned rhinoceros",""],["Gujarat","Asiatic lion",""],["Madhya Pradesh","Barasingha (swamp deer)","Also Uttar Pradesh’s state animal."],["Uttar Pradesh","Barasingha (swamp deer)",""],["Maharashtra","Indian giant squirrel (shekru)",""],["Manipur","Sangai (brow-antlered deer)",""],["Sikkim","Red panda",""],["Tamil Nadu","Nilgiri tahr",""],["Uttarakhand","Alpine musk deer",""],["Chhattisgarh","Wild water buffalo",""],["Kerala","Indian elephant","Also Karnataka and Jharkhand."],["Karnataka","Indian elephant",""],["Arunachal Pradesh","Mithun (gayal)","Also Nagaland."],["Meghalaya","Clouded leopard",""],["West Bengal","Fishing cat",""],["Bihar","Gaur (Indian bison)","Also Goa."],["Andhra Pradesh","Blackbuck","Also Punjab and Haryana."],["Himachal Pradesh","Snow leopard","Also Ladakh."],["Jammu and Kashmir","Hangul (Kashmir stag)",""],["Rajasthan","Camel","Chinkara is the state animal in the wild-animal category."],["Odisha","Sambar",""],["Telangana","Spotted deer (chital)",""]]},{"k":"table","title":"State birds","head":["State / UT","State bird","Note"],"rows":[["Rajasthan","Great Indian bustard (godawan)",""],["Uttar Pradesh","Sarus crane","" est literacy<\/b> (2011). The largest <b>UT<\/b> is Ladakh, but the largest <b>state<\/b> is Rajasthan. The Tropic of Cancer does <b>not<\/b> cross Odisha, Bihar or UP."}],"sum":["Largest states: Rajasthan, MP, Maharashtra; smallest: Goa, then Sikkim.","Most populous: UP; least populous: Sikkim; densest: Bihar; emptiest: Arunachal (Census 2011).","Kerala tops literacy and sex ratio; Haryana has the lowest sex ratio.","The Tropic of Cancer crosses 8 states; 9 states have a coastline, Gujarat the longest.","State animals: lion Gujarat, rhino Assam, sangai Manipur, red panda Sikkim, barasingha MP."],"part":["Part 3 · UTs, high courts and records","केंद्रशासित प्रदेश, उच्च न्यायालय और रिकॉर्ड"],"g":"su"}

/* ---------- quiz games (60 seconds) ---------- */
function labDeck(id){
  const d = LAB_CONF.decks.find(x => x.id === id);
  const ask = (pre, t) => pre ? `${pre} ${t}${/[?:]$/.test(pre) ? "" : "?"}` : t;
  let items = d.make ? d.make() : d.pairs.map(p => ({ p: ask(d.q, p[0]), a: p[1], note: p[2] || "", raw: p[0], pool: "a" }));
  if (d.rq && !d.make) {   // also ask the other way round, where an answer belongs to one prompt only
    const n = {}; d.pairs.forEach(p => { n[p[1]] = (n[p[1]] || 0) + 1; });
    items = items.concat(d.pairs.filter(p => n[p[1]] === 1).map(p => ({ p: ask(d.rq, p[1]), a: p[0], note: p[2] || "", raw: p[1], pool: "p" })));
  }
  return { d, items };
}

  labBindHome();
  $("#labgo").onclick = () => labRun(id);
  $("#labpairs").onclick = () => { $("#labpairlist").innerHTML = `<div class="block"><h3>${list.length} pairs to know</h3><div class="lab-pairs">${list.map(p => `<div><span>${esc(p[0])}</span><b>${esc(p[1])}</b></div>`).join("")}</div></div>`; };
  const lb = $("#lablesson"); if (lb) lb.onclick = () => openLesson(d.lesson, "learn");
}
let LG = null;
function labRun(id){
  labStop();
  const { d, items } = labDeck(id);
  LG = { d, items: shuffle(items), i: 0, score: 0, right: 0, tried: 0, combo: 0, maxc: 0, left: 60, miss: [], lock: false };
  $("#app").innerHTML = `<section class="view stack lab-play">
    <div class="lab-hud"><button class="back" type="button" id="labquit">✕ Stop</button><span class="lab-combo" id="labcombo"></span><span class="sc" id="labscore">0</span></div>
    <div class="lab-time" id="labtime"><i style="width:100%"></i></div>
    <div class="lab-q" id="labq" aria-live="polite"></div>
    <div class="lab-opts" id="labopts"></div>
    <div class="lab-flash" id="labflash"></div></section>`;
  $("#labquit").onclick = () => { labStop(); labOver(); };
  labNext();
  LAB.timer = setInterval(() => {
    LG.left--; const t = $("#labtime"); if (!t) { labStop(); return; }
    t.firstElementChild.style.width = (LG.left / 60 * 100) + "%"; t.classList.toggle("low", LG.left <= 10);
    if (LG.left <= 0) { labStop(); labOver(); }
  }, 1000);
}
function labOptions(it){
  const d = LG.d;
  if (d.opts) return d.opts.slice();
  if (d.options) return d.options(it);
  // wrong options come from the same side of the deck as the answer (names with names, dates with dates)
  const answers = [...new Set(it.all || LG.items.filter(x => x.pool === it.pool).map(x => x.a))].filter(a => a !== it.a);
  const pool = shuffle(answers).slice(0, 3);
  return shuffle([it.a].concat(pool));
}
function labNext(){
  if (LG.i >= LG.items.length) { LG.items = shuffle(LG.items); LG.i = 0; }
  const it = LG.items[LG.i], opts = labOptions(it);
  LG.cur = it; LG.lock = false;
  const q = $("#labq"); q.innerHTML = `<span class="lab-pop">${esc(it.p)}</span>`;
  const box = $("#labopts"); box.className = "lab-opts" + (opts.length === 3 ? " three" : "");
  box.innerHTML = opts.map(o => `<button type="button" data-o="${esc(o)}">${esc(o)}</button>`).join("");
  box.querySelectorAll("button").forEach(b => b.onclick = () => labPick(b));
}
function labPick(b){
  if (LG.lock) return; LG.lock = true;
  const it = LG.cur, ok = b.dataset.o === it.a;
  LG.tried++;
  if (ok) {
    LG.right++; LG.combo++; LG.maxc = Math.max(LG.maxc, LG.combo);
    const gain = 10 + Math.min(LG.combo - 1, 5) * 2;
    LG.score += gain; b.classList.add("ok");
    $("#labflash").textContent = it.note ? it.note : "+" + gain;
  } else {
    LG.combo = 0; b.classList.add("no");
    $("#labopts").querySelectorAll("button").forEach(x => { if (x.dataset.o === it.a) x.classList.add("ok"); });
    LG.miss.push(it); $("#labflash").textContent = (it.note ? it.note + " · " : "") + "Answer: " + it.a;
  }
  $("#labscore").textContent = LG.score;
  $("#labcombo").textContent = LG.combo >= 2 ? "🔥 ×" + LG.combo : "";
  LG.i++;
  setTimeout(() => { if (LAB.timer && $("#labopts")) labNext(); }, ok ? 450 : 1200);
}
function labOver(){
  const L = labS(), id = LG.d.id, best = !L.best[id] || LG.score > L.best[id];
  if (best && LG.score > 0) L.best[id] = LG.score;
  L.xp = (L.xp || 0) + LG.right; L.plays = (L.plays || 0) + 1; save();
  const acc = LG.tried ? Math.round(LG.right * 100 / LG.tried) : 0, seen = new Set();
  const miss = LG.miss.filter(m => { if (seen.has(m.p)) return false; seen.add(m.p); return true; });
  const { r } = labRank(L.xp);
  $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}
    <div class="block lab-res lab-pop"><span class="eyebrow">${esc(LG.d.title)}</span><div class="big">${LG.score}</div>
      <p>${best && LG.score > 0 ? "🎉 New best!" : "Best: " + (L.best[id] || 0)} · ${LG.right}/${LG.tried} right (${acc}%) · longest combo ${LG.maxc} · +${LG.right} XP</p>
      <p class="muted" style="margin:0">${r[2]} ${r[1]} · ${L.xp} XP</p>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn pri" type="button" id="again">Play again</button><button class="btn" type="button" data-lab-home>More games</button></div></div>
    ${miss.length ? `<div class="block"><h3>Fix these ${miss.length}</h3><div class="lab-miss">${miss.map(m => `<div><span>${esc(m.p)}</span><b>${esc(m.a)}</b></div>`).join("")}</div></div>` : (LG.tried ? `<div class="block"><p style="margin:0">💯 No mistakes — try to beat your score.</p></div>` : "")}
  </section>`;
  labBindHome();
  $("#again").onclick = () => labRun(id);
}

/* ---------- memory match ---------- */
function labMatch(){
  labStop();
  const all = LAB_CONF.decks.find(d => d.id === LAB_CONF.match.deck).pairs, n = {};
  all.forEach(p => { n[p[1]] = (n[p[1]] || 0) + 1; });
  const pairs = shuffle(all.filter(p => n[p[1]] === 1)).slice(0, 6);
  const cards = shuffle(pairs.flatMap((p, i) => [{ k: i, t: p[0] }, { k: i, t: p[1] }]));
  const M = { cards, up: [], done: new Set(), moves: 0, t0: Date.now() };
  const draw = () => {
    $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}
      <div class="lab-hud"><div><span class="eyebrow">Memory Match</span><h2 style="margin:4px 0 0">${esc(LAB_CONF.match.title)}</h2></div><span class="sc">${M.moves} moves</span></div>
      <div class="mm">${M.cards.map((c, i) => `<button type="button" data-i="${i}" class="${M.done.has(c.k) ? "done" : M.up.includes(i) ? "up" : ""}" aria-label="${M.done.has(c.k) || M.up.includes(i) ? esc(c.t) : "Hidden card " + (i + 1)}">${M.done.has(c.k) || M.up.includes(i) ? esc(c.t) : "?"}</button>`).join("")}</div></section>`;
    labBindHome();
    $("#app").querySelectorAll(".mm button").forEach(b => b.onclick = () => flip(+b.dataset.i));
  };
  const flip = i => {
    if (M.up.length === 2 || M.up.includes(i) || M.done.has(M.cards[i].k)) return;
    M.up.push(i); draw();
    if (M.up.length === 2) {
      M.moves++;
      const [a, b] = M.up;
      if (M.cards[a].k === M.cards[b].k) { M.done.add(M.cards[a].k); M.up = []; setTimeout(() => { draw(); if (M.done.size === 6) done(); }, 250); }
      else setTimeout(() => { M.up = []; draw(); }, 900);
    }
  };
  const done = () => {
    const L = labS(), best = !L.match || M.moves < L.match; if (best) L.match = M.moves;
    L.xp = (L.xp || 0) + 12; L.plays = (L.plays || 0) + 1; save();
    $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}<div class="block lab-res lab-pop"><span class="eyebrow">Memory Match</span><div class="big">${M.moves}</div>
      <p>moves · ${Math.round((Date.now() - M.t0) / 1000)} s · ${best ? "🎉 New best!" : "Best: " + L.match + " moves"} · +12 XP</p>
      <div class="lab-pairs" style="text-align:left">${pairs.map(p => `<div><span>${esc(p[0])}</span><b>${esc(p[1])}</b></div>`).join("")}</div>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn pri" type="button" id="again">New cards</button><button class="btn" type="button" data-lab-home>More games</button></div></div></section>`;
    labBindHome(); $("#again").onclick = labMatch;
  };
  draw(); window.scrollTo(0, 0);
}


/* ---------- decks from the lessons' own tables ---------- */
/** Rows of a lesson's n-th table as [prompt, answer, note] (tags stripped), so a deck never repeats the data. */
function labRows(lessonId, n){
  const strip = s => String(s == null ? "" : s).replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&minus;/g, "−").trim();
  const l = LESSONS.find(x => x.id === lessonId), t = l ? l.blocks.filter(b => b.k === "table")[n || 0] : null;
  return t ? t.rows.map(r => [strip(r[0]), strip(r[1]), strip(r[2])]) : [];
}
/** A "grand mix" deck: a few rows from every listed deck, with each deck's own question wording. */
function labMix(decks){
  // wrong options come from the whole deck (all), so a deck drawn only once or twice in the 80 still has enough
  return shuffle(decks.flatMap(d => { const all = [...new Set(d.pairs.map(p => p[1]))];
    return d.pairs.map(p => ({ p: d.q ? `${d.q} ${p[0]}${/[?:]$/.test(d.q) ? "" : "?"}` : p[0], a: p[1], note: p[2] || "", pool: d.id, all })); })).slice(0, 80);
}

{"id":"N1","heat":3,"title":"The Reserve Bank of India","hi":"भारतीय रिज़र्व बैंक","blocks":[{"k":"hot","h":"Asked again and again: RBI set up on <b>1 April 1935<\/b> under the <b>RBI Act, 1934<\/b>, on the <b>Hilton Young Commission<\/b>'s advice; <b>nationalised on 1 January 1949<\/b>; HQ <b>Mumbai<\/b> (first Calcutta); first governor <b>Osborne Smith<\/b>, first Indian governor <b>C. D. Deshmukh<\/b>; and its <b>functions<\/b>."},{"k":"story","h":"<p>In 1926 the <b>Hilton Young Commission<\/b> told the British government that India needed its own central bank. The <b>RBI Act<\/b> was passed in <b>1934<\/b>, and the Reserve Bank opened on <b>1 April 1935<\/b> in <b>Calcutta<\/b> — as a private bank owned by shareholders. Its head office moved to <b>Bombay<\/b> in 1937. After Independence it was <b>nationalised on 1 January 1949<\/b>, so it now belongs fully to the Government of India.<\/p><p>The RBI prints and issues our currency notes, keeps the government's accounts, acts as the <b>banker's bank<\/b> and the <b>lender of last resort<\/b>, guards the forex reserves and regulates banks. Its emblem shows a <b>tiger and a palm tree<\/b>. The first governor was <b>Sir Osborne Smith<\/b>; the first Indian governor was <b>C. D. Deshmukh<\/b> (1943).<\/p>","key":"RBI: Hilton Young 1926 → Act 1934 → opened 1 April 1935 → nationalised 1 Jan 1949; HQ Mumbai; first Indian governor C. D. Deshmukh."},{"k":"facts","title":"RBI at a glance","rows":[["Set up","1 April 1935, under the RBI Act, 1934"],["Nationalised","1 January 1949"],["Head office","Mumbai (Calcutta until 1937)"],["Emblem","Tiger and palm tree"],["Top body","Central Board of Directors — Governor, up to 4 deputy governors and directors named by the Centre"],["Appointed by","Central Government (Governor and deputy governors)"],["Accounting year","April–March (July–June until 2020)"],["Notes signed by","RBI Governor — except the ₹1 note, signed by the Finance Secretary"]]},{"k":"table","title":"RBI timeline","head":["Event","Year","Note"],"rows":[["Hilton Young Commission (Royal Commission on Indian Currency and Finance) report","1926","Recommended a central bank for India."],["Reserve Bank of India Act passed","1934","The RBI still works under this Act."],["RBI starts work (1 April)","1935","Began as a private shareholders' bank with ₹5 crore capital."],["RBI head office moves from Calcutta to Bombay","1937",""],["C. D. Deshmukh becomes the first Indian governor","1943",""],["RBI nationalised (1 January)","1949","Under the RBI (Transfer to Public Ownership) Act, 1948."],["Deposit Insurance Corporation starts","1962","Became the DICGC in 1978."],["RBI's accounting year changed to April–March","2020","Earlier it ran July–June; 2020–21 was the switch-over year."]]},{"k":"tlfig","title":"The RBI, year by year","rows":[[1926,"Hilton Young Commission (Royal Commission on Indian Currency and Finance) report",""],[1934,"Reserve Bank of India Act passed",""],[1935,"RBI starts work (1 April)",""],[1937,"RBI head office moves from Calcutta to Bombay",""],[1943,"C. D. Deshmukh becomes the first Indian governor",""],[1949,"RBI nationalised (1 January)",""],[1962,"Deposit Insurance Corporation starts",""],[2020,"RBI's accounting year changed to April–March",""]],"cap":"Set up on 1 April 1935 in Calcutta under the RBI Act, 1934; moved to Mumbai in 1937; nationalised on 1 January 1949."},{"k":"photos","title":"RBI people in pictures","items":[["Osborne_Smith","Sir Osborne Smith","First governor of the RBI"],["James_Braid_Taylor","Sir James Taylor","Second governor of the RBI"],["C._D._Deshmukh","C. D. Deshmukh","First Indian governor of the RBI"],["Manmohan_Singh","Manmohan Singh","Only RBI governor who later became Prime Minister"],["K._J._Udeshi","K. J. Udeshi","First woman deputy governor of the RBI"]]},{"k":"table","title":"People in RBI history","head":["Who","Name","Note"],"rows":[["First governor of the RBI","Sir Osborne Smith","1935–37."],["Second governor of the RBI","Sir James Taylor","1937–43."],["First Indian governor of the RBI","C. D. Deshmukh","1943–49; later India's Finance Minister."],["Only RBI governor who later became Prime Minister","Manmohan Singh","Governor 1982–85."],["First woman deputy governor of the RBI","K. J. Udeshi","Appointed in 2003."],["Author of 'The Problem of the Rupee', whose ideas are credited with shaping the RBI","B. R. Ambedkar",""],["Chairman of the 1926 commission that recommended the RBI","Edward Hilton Young",""]]},{"k":"table","title":"What the RBI does","head":["Work","Function","Note"],"rows":[["Only body that issues currency notes (except the ₹1 note)","Issuer of currency","The ₹1 note and all coins are issued by the Government of India."],["Keeps the accounts of the Centre and the states and manages their borrowing","Banker to the government",""],["Holds part of banks' cash and lends to them","Banker's bank",""],["Lends to a bank in crisis when no one else will","Lender of last resort",""],["Holds India's foreign exchange and gold reserves","Custodian of forex reserves",""],["Licenses and supervises banks under the Banking Regulation Act, 1949","Regulator of banks",""],["Manages foreign exchange under FEMA, 1999","Manager of foreign exchange",""],["Controls money supply and interest rates to keep prices stable","Monetary authority",""]]},{"k":"trick","h":"<b>“34 Act, 35 Open, 49 Owned”<\/b> — Act 1934, opened 1935, owned by the nation 1949. First governors: <b>“Smith, Taylor, then Deshmukh”<\/b> — two Britons, then the first Indian."},{"k":"trap","h":"The RBI was set up in <b>1935<\/b>, not 1934 (that is the Act) and not 1949 (that is nationalisation). The <b>₹1 note<\/b> is issued by the <b>Government of India<\/b>, not the RBI. The RBI's first home was <b>Calcutta<\/b>, not Bombay."}],"sum":["The RBI opened on 1 April 1935 under the RBI Act, 1934, on the Hilton Young Commission's advice.","It was nationalised on 1 January 1949; its head office is in Mumbai (Calcutta until 1937).","First governor: Sir Osborne Smith; first Indian governor: C. D. Deshmukh; Manmohan Singh was governor 1982–85.","Functions: issuer of notes, banker to government, banker's bank, lender of last resort, forex custodian, bank regulator.","Its emblem is a tiger and a palm tree; the ₹1 note is issued by the Government of India."],"part":["Part 1 · RBI, monetary policy and history","आरबीआई, मौद्रिक नीति और बैंकिंग इतिहास"],"g":"bf"},
{"id":"N2","heat":3,"title":"Monetary policy tools and the MPC","hi":"मौद्रिक नीति के उपकरण और एमपीसी","blocks":[{"k":"hot","h":"Definitions are the favourite: <b>repo vs reverse repo<\/b>, <b>CRR vs SLR<\/b>, <b>MSF<\/b>, <b>bank rate<\/b>, <b>OMO<\/b>, quantitative vs qualitative tools, and the <b>MPC<\/b> — 6 members, set up in 2016, chaired by the Governor, inflation target <b>4% ± 2%<\/b>."},{"k":"story","h":"<p>Think of the RBI as the tap that controls money in the economy. When prices rise too fast, it <b>raises the repo rate<\/b> — the rate at which it lends to banks — so loans become costly and spending slows. It can also raise the <b>CRR<\/b> (cash banks must keep with the RBI) or <b>sell bonds<\/b> through <b>open market operations<\/b>, sucking money out. To push growth, it does the opposite.<\/p><p>Banks park spare cash with the RBI at the <b>SDF<\/b> rate (the floor) and borrow in an emergency at the <b>MSF<\/b> rate (the ceiling); the repo rate sits in between. Since <b>2016<\/b> the repo rate is decided by a six-member <b>Monetary Policy Committee<\/b> — three from the RBI, including the Governor who chairs it, and three experts named by the Centre — with the aim of keeping CPI inflation at <b>4%, within 2–6%<\/b>.<\/p>","key":"Repo = RBI lends; SDF = floor, MSF = ceiling; CRR = cash with RBI, SLR = kept by the bank itself; MPC = 6 members, 2016, target 4% ± 2%."},{"k":"facts","title":"Policy rates (as of 7 October 2026 — check before your exam)","rows":[["Repo rate","5.50% — raised from 5.25% on 7 October 2026"],["Standing Deposit Facility (SDF)","5.25%"],["Marginal Standing Facility (MSF) and Bank rate","5.75%"],["CRR","3% of NDTL (cut in stages to 3% by late 2025)"],["SLR","18% of NDTL"],["Inflation target","4% CPI, with a band of 2–6%"]]},{"k":"facts","title":"The Monetary Policy Committee","rows":[["Set up","2016, under Section 45ZB of the RBI Act (added by the Finance Act, 2016)"],["Members","6 — the Governor (chair), a Deputy Governor, one RBI officer, and 3 outside experts named by the Centre"],["Term of outside members","4 years"],["Tie","The Governor has a casting (second) vote"],["Quorum","4 members"],["Meetings","At least 4 a year (usually 6)"],["Recommended by","Urjit Patel Committee (2014)"]]},{"k":"table","title":"The tools, defined","head":["What it is","Tool","Note"],"rows":[["Rate at which the RBI lends short-term money to banks against government securities","Repo rate","Raised to fight inflation; cut to boost growth."],["Rate at which the RBI absorbs money from banks against government securities","Reverse repo rate","No longer the floor of the corridor since the SDF came in 2022."],["Rate at which banks park extra money with the RBI without giving collateral — the floor of the corridor","Standing Deposit Facility (SDF)","Introduced in April 2022."],["Rate at which banks borrow overnight in an emergency by dipping into their SLR securities — the ceiling","Marginal Standing Facility (MSF)","Introduced in 2011."],["Rate for longer-term lending or rediscounting bills without a repo; kept equal to the MSF rate","Bank rate",""],["Share of deposits (NDTL) a bank must keep as cash with the RBI, earning no interest","Cash Reserve Ratio (CRR)",""],["Share of deposits (NDTL) a bank must keep itself in cash, gold or government securities","Statutory Liquidity Ratio (SLR)",""],["Buying and selling government securities in the market to change the money supply","Open Market Operations (OMO)","RBI buys → money flows in; RBI sells → money flows out."],["Persuading banks through advice and appeals rather than rules","Moral suasion","A qualitative tool."],["Changing the part of a secured loan the borrower must fund himself","Margin requirement","A qualitative (selective) tool."]]},{"k":"table","title":"When each came in","head":["Change","Year","Note"],"rows":[["Liquidity Adjustment Facility (LAF)","2000",""],["Base rate system for bank loans","2010","Replaced the BPLR."],["Marginal Standing Facility (MSF)","2011",""],["Urjit Patel Committee report on monetary policy","2014","Recommended inflation targeting and an MPC."],["Monetary Policy Committee (MPC)","2016","Through the Finance Act, 2016, which amended the RBI Act."],["External benchmark lending rate (EBLR) for retail loans","2019",""],["Standing Deposit Facility (SDF)","2022",""]]},{"k":"tlfig","title":"Monetary tools, year by year","rows":[[2000,"Liquidity Adjustment Facility (LAF)",""],[2010,"Base rate system for bank loans",""],[2011,"Marginal Standing Facility (MSF)",""],[2014,"Urjit Patel Committee report on monetary policy",""],[2016,"Monetary Policy Committee (MPC)",""],[2019,"External benchmark lending rate (EBLR) for retail loans",""],[2022,"Standing Deposit Facility (SDF)",""]],"cap":"From the Liquidity Adjustment Facility (2000) to the Monetary Policy Committee (2016) and the Standing Deposit Facility (2022)."},{"k":"trick","h":"<b>RE-po = RBI lends (RBI gives); REVERSE = Reserve takes.<\/b> <b>CRR = Cash with RBI, SLR = Self-kept Liquid assets.<\/b> The corridor, bottom to top: <b>“Some Rupees Move”<\/b> — SDF < Repo < MSF."},{"k":"trap","h":"<b>CRR<\/b> money sits with the RBI and earns nothing; <b>SLR<\/b> assets stay with the bank and can earn interest. <b>Moral suasion<\/b> and <b>margin requirement<\/b> are <i>qualitative<\/i> tools; repo, CRR, SLR and OMO are <i>quantitative<\/i>. The MPC sets <b>only the repo rate<\/b>, not CRR or SLR."}],"sum":["Repo rate: RBI lends to banks; reverse repo: RBI absorbs money from banks.","SDF (2022) is the floor and MSF (2011) the ceiling of the corridor; the bank rate equals the MSF rate.","CRR is cash kept with the RBI; SLR is cash, gold or government bonds kept by the bank itself.","OMO: the RBI buys bonds to add money and sells bonds to take money out.","The MPC (2016) has 6 members, is chaired by the Governor and targets 4% CPI inflation (2–6%)."],"part":["Part 1 · RBI, monetary policy and history","आरबीआई, मौद्रिक नीति और बैंकिंग इतिहास"],"g":"bf"},
{"id":"N3","heat":2,"title":"History of Indian banking","hi":"भारतीय बैंकिंग का इतिहास","blocks":[{"k":"hot","h":"Frequent: the <b>first bank<\/b> (Bank of Hindustan, 1770), <b>PNB<\/b> as the first bank started with Indian capital (Lahore, 1894), <b>Imperial Bank → SBI (1955)<\/b>, nationalisation of <b>14 banks in 1969<\/b> and <b>6 in 1980<\/b>, and the <b>2019–20 mergers<\/b>."},{"k":"story","h":"<p>Banking in British India began with the <b>Bank of Hindustan<\/b> in Calcutta (1770). The three <b>presidency banks<\/b> — Bengal (1806, as the Bank of Calcutta), Bombay (1840) and Madras (1843) — were merged in <b>1921<\/b> into the <b>Imperial Bank of India<\/b>. Indians soon started their own banks: <b>Punjab National Bank<\/b> was founded in <b>Lahore<\/b> in 1894 with Lala Lajpat Rai among its founders. In <b>1955<\/b> the Imperial Bank became the <b>State Bank of India<\/b>.<\/p><p>On <b>19 July 1969<\/b> PM <b>Indira Gandhi<\/b> nationalised <b>14<\/b> big banks so that credit would reach farmers and small traders; <b>6<\/b> more followed on <b>15 April 1980<\/b>. Fifty years later the government did the reverse — it merged banks: Vijaya and Dena into Bank of Baroda (2019), and ten banks into four on <b>1 April 2020<\/b>, leaving <b>12<\/b> public sector banks.<\/p>","key":"Bank of Hindustan 1770; Imperial Bank 1921 → SBI 1955; PNB 1894 Lahore; 14 banks 1969 + 6 in 1980; 12 PSBs after 2020."},{"k":"facts","title":"The nationalised banks","rows":[["1969 (14)","Central Bank of India, Bank of India, Punjab National Bank, Bank of Baroda, United Commercial (UCO) Bank, Canara Bank, Dena Bank, United Bank of India, Syndicate Bank, Allahabad Bank, Indian Bank, Bank of Maharashtra, Indian Overseas Bank, Union Bank of India"],["1980 (6)","Andhra Bank, Corporation Bank, New Bank of India, Oriental Bank of Commerce, Punjab & Sind Bank, Vijaya Bank"],["Public sector banks now","12 (since 1 April 2020)"],["Largest bank","State Bank of India"]]},{"k":"table","title":"Milestones","head":["Event","Year","Note"],"rows":[["Bank of Hindustan — the first bank in India (Calcutta)","1770","Set up by Alexander and Co.; later closed."],["General Bank of India","1786",""],["Bank of Calcutta (renamed Bank of Bengal in 1809)","1806","SBI traces its roots to it."],["Bank of Bombay","1840","A presidency bank."],["Bank of Madras","1843","A presidency bank."],["Allahabad Bank — oldest joint-stock bank","1865","Merged into Indian Bank in 2020."],["Oudh Commercial Bank — first bank managed by Indians (Faizabad)","1881",""],["Punjab National Bank founded in Lahore","1894","First bank started with Indian capital; began business in 1895."],["Imperial Bank of India (three presidency banks merged)","1921",""],["Imperial Bank becomes the State Bank of India (1 July)","1955","On the All India Rural Credit Survey (Gorwala) Committee's advice."],["First bank nationalisation — 14 banks (19 July)","1969","PM Indira Gandhi; banks with deposits over ₹50 crore."],["Second bank nationalisation — 6 banks (15 April)","1980","Banks with deposits over ₹200 crore."],["SBI's associate banks and Bharatiya Mahila Bank merge into SBI","2017",""],["Vijaya Bank and Dena Bank merge into Bank of Baroda","2019",""],["Ten public sector banks merged into four (1 April)","2020","Public sector banks fell to 12."]]},{"k":"tlfig","title":"Indian banking, year by year","rows":[[1770,"Bank of Hindustan",""],[1786,"General Bank of India",""],[1806,"Bank of Calcutta (renamed Bank of Bengal in 1809)",""],[1840,"Bank of Bombay",""],[1843,"Bank of Madras",""],[1865,"Allahabad Bank",""],[1881,"Oudh Commercial Bank",""],[1894,"Punjab National Bank founded in Lahore",""],[1921,"Imperial Bank of India (three presidency banks merged)",""],[1955,"Imperial Bank becomes the State Bank of India (1 July)",""],[1969,"First bank nationalisation",""],[1980,"Second bank nationalisation",""],[2017,"SBI's associate banks and Bharatiya Mahila Bank merge into SBI",""],[2019,"Vijaya Bank and Dena Bank merge into Bank of Baroda",""],[2020,"Ten public sector banks merged into four (1 April)",""]],"cap":"Bank of Hindustan (1770) was the first; the 1969 and 1980 nationalisations brought 20 banks under the state."},{"k":"table","title":"Mergers","head":["Bank","Merged into","When"],"rows":[["Vijaya Bank","Bank of Baroda","1 April 2019."],["Dena Bank","Bank of Baroda","1 April 2019."],["Oriental Bank of Commerce","Punjab National Bank","1 April 2020."],["United Bank of India","Punjab National Bank","1 April 2020."],["Syndicate Bank","Canara Bank","1 April 2020."],["Andhra Bank","Union Bank of India","1 April 2020."],["Corporation Bank","Union Bank of India","1 April 2020."],["Allahabad Bank","Indian Bank","1 April 2020."],["Bharatiya Mahila Bank","State Bank of India","1 April 2017."],["State Bank of Bikaner and Jaipur","State Bank of India","1 April 2017."],["New Bank of India","Punjab National Bank","1993."]]},{"k":"cards","title":"Who merged into whom","rows":[["Bank of Baroda","2 banks merged in","Vijaya Bank (1 April 2019) · Dena Bank (1 April 2019)","🏦"],["Punjab National Bank","3 banks merged in","Oriental Bank of Commerce (1 April 2020) · United Bank of India (1 April 2020) · New Bank of India (1993)","🏦"],["Canara Bank","1 bank merged in","Syndicate Bank (1 April 2020)","🏦"],["Union Bank of India","2 banks merged in","Andhra Bank (1 April 2020) · Corporation Bank (1 April 2020)","🏦"],["Indian Bank","1 bank merged in","Allahabad Bank (1 April 2020)","🏦"],["State Bank of India","2 banks merged in","Bharatiya Mahila Bank (1 April 2017) · State Bank of Bikaner and Jaipur (1 April 2017)","🏦"]]},{"k":"trick","h":"<b>“69 = 14, 80 = 6”<\/b> — and 14 + 6 = 20 nationalised banks. The 2020 mergers — <b>“OU to PNB, S to Canara, AC to Union, A to Indian”<\/b>: Oriental + United → PNB; Syndicate → Canara; Andhra + Corporation → Union; Allahabad → Indian Bank."},{"k":"trap","h":"<b>SBI<\/b> was created in <b>1955<\/b> by law, not by the 1969 nationalisation. <b>Allahabad Bank<\/b> went to <b>Indian Bank<\/b>, not to Union Bank. Some books call <b>Central Bank of India<\/b> (1911) the first bank wholly owned and managed by Indians — SSC usually answers <b>PNB<\/b> for the first bank started with Indian capital."}],"sum":["Bank of Hindustan (1770, Calcutta) was India's first bank.","The three presidency banks merged into the Imperial Bank of India in 1921, which became SBI on 1 July 1955.","Punjab National Bank was founded in Lahore in 1894 with Indian capital.","14 banks were nationalised on 19 July 1969 and 6 more on 15 April 1980.","After the 2019 and 2020 mergers India has 12 public sector banks."],"part":["Part 1 · RBI, monetary policy and history","आरबीआई, मौद्रिक नीति और बैंकिंग इतिहास"],"g":"bf"},
{"id":"N4","heat":2,"title":"Types of banks","hi":"बैंकों के प्रकार","blocks":[{"k":"hot","h":"Asked often: <b>RRBs<\/b> (2 October 1975, first Prathama Bank, share 50 : 35 : 15), <b>payment banks<\/b> (₹2 lakh limit, no loans, Nachiket Mor), <b>small finance banks<\/b> (75% priority sector) and what makes a bank <b>scheduled<\/b>."},{"k":"story","h":"<p>Not every bank is the same. A <b>scheduled bank<\/b> is one listed in the <b>Second Schedule of the RBI Act, 1934<\/b>; it can borrow from the RBI and must keep CRR with it. <b>Regional Rural Banks<\/b> began on <b>2 October 1975<\/b> — the first was <b>Prathama Bank<\/b> at Moradabad — to lend to small farmers and village workers. Each is owned 50% by the Centre, 35% by a sponsor bank and 15% by the state. <b>Cooperative banks<\/b> belong to their members.<\/p><p>In 2014 the RBI created two new kinds on the <b>Nachiket Mor Committee<\/b>'s ideas. <b>Payment banks<\/b> (like India Post Payments Bank) take small deposits — up to <b>₹2 lakh<\/b> a customer — and offer payments, but cannot lend. <b>Small finance banks<\/b> (like AU and Ujjivan) can lend, but must give <b>75%<\/b> of their loans to the priority sector.<\/p>","key":"Scheduled = in the 2nd Schedule of RBI Act; RRB 1975 (50:35:15); payment bank = ₹2 lakh, no loans; SFB = 75% priority sector."},{"k":"facts","title":"Numbers to know (as of 2025–26)","rows":[["RRBs","28 after the 'One State, One RRB' merger of 1 May 2025"],["RRB law","Regional Rural Banks Act, 1976"],["Payment bank deposit limit","₹2 lakh per customer"],["Small finance bank priority-sector share","75% of loans"],["Priority-sector target for commercial banks","40% of adjusted net bank credit"],["Minimum capital","Small finance bank ₹200 crore; payment bank ₹100 crore"]]},{"k":"table","title":"Which kind of bank?","head":["Feature","Type","Note"],"rows":[["Listed in the Second Schedule of the RBI Act, 1934","Scheduled bank",""],["Set up from 2 October 1975 to give credit in villages; owned by the Centre, a sponsor bank and the state","Regional Rural Bank","Shares 50 : 35 : 15."],["Registered under cooperative societies laws; owned by its members","Cooperative bank","Also supervised by the RBI."],["Takes deposits up to ₹2 lakh per customer but cannot give loans","Payment bank","Idea from the Nachiket Mor Committee."],["Must give 75% of its loans to the priority sector; serves small borrowers","Small finance bank",""],["Small private bank allowed to work in three neighbouring districts (scheme of 1996)","Local area bank",""],["More than 50% owned by the Government of India","Public sector bank",""],["Incorporated abroad, with branches in India","Foreign bank",""],["Gives long-term money for industry and infrastructure rather than taking public deposits","Development finance institution",""]]},{"k":"table","title":"Examples","head":["Bank","Type","Note"],"rows":[["Airtel Payments Bank","Payment bank","India's first payment bank to start work (2017)."],["India Post Payments Bank","Payment bank","Launched in 2018, run through post offices."],["Fino Payments Bank","Payment bank",""],["AU Small Finance Bank","Small finance bank","Jaipur."],["Ujjivan Small Finance Bank","Small finance bank",""],["Equitas Small Finance Bank","Small finance bank",""],["Prathama Bank","Regional Rural Bank","The first RRB (Moradabad, UP, 1975)."],["Saraswat Bank","Urban cooperative bank",""]]},{"k":"trick","h":"<b>RRB = 50-35-15<\/b>, read as <b>“Centre, Sponsor, State”<\/b> — biggest share to the biggest owner. <b>Payment bank = “Pay, don't lend”.<\/b>"},{"k":"trap","h":"A <b>payment bank<\/b> can issue debit cards but <b>not credit cards<\/b> and cannot lend. RRBs started in <b>1975<\/b> by ordinance — the <b>RRB Act<\/b> came in <b>1976<\/b>. Cooperative banks can be scheduled too."}],"sum":["A scheduled bank is listed in the Second Schedule of the RBI Act, 1934.","RRBs began on 2 October 1975 (first: Prathama Bank, Moradabad); owners Centre 50%, sponsor bank 35%, state 15%.","Payment banks take deposits up to ₹2 lakh a customer and cannot lend (Nachiket Mor Committee).","Small finance banks must give 75% of loans to the priority sector.","Commercial banks must give 40% of credit to the priority sector."],"part":["Part 2 · Banks, regulators and payments","बैंक, नियामक और भुगतान प्रणाली"],"g":"bf"},
{"id":"N5","heat":2,"title":"Bank headquarters and taglines","hi":"बैंकों के मुख्यालय और टैगलाइन","blocks":[{"k":"hot","h":"Two question types: <b>“Where is the HQ of X?”<\/b> (Bank of Baroda — Vadodara, Canara — Bengaluru, UCO — Kolkata, SIDBI — Lucknow, IRDAI — Hyderabad) and <b>“Whose tagline is this?”<\/b> (SBI — The Banker to Every Indian)."},{"k":"story","h":"<p>Most big banks sit in <b>Mumbai<\/b>, India's money capital — SBI, Union Bank, Bank of India, Central Bank, HDFC, and also NABARD, SEBI, EXIM Bank and NPCI. The exceptions are what exams ask: <b>PNB<\/b> and <b>Punjab & Sind Bank<\/b> in New Delhi, <b>Bank of Baroda<\/b> in Vadodara, <b>Canara<\/b> in Bengaluru, <b>Indian Bank<\/b> and <b>IOB<\/b> in Chennai, <b>UCO<\/b> and <b>Bandhan<\/b> in Kolkata and <b>Bank of Maharashtra<\/b> in Pune.<\/p><p>Taglines tell a bank's personality: SBI is <b>“The Banker to Every Indian”<\/b>, PNB <b>“The Name You Can Bank Upon”<\/b>, Bank of Baroda <b>“India's International Bank”<\/b> and Canara <b>“Together We Can”<\/b>. Abroad, the World Bank and IMF are in <b>Washington, D.C.<\/b>, the ADB in <b>Manila<\/b>, the AIIB in <b>Beijing<\/b> and the BRICS bank in <b>Shanghai<\/b>.<\/p>","key":"Mumbai = SBI, NABARD, SEBI, NPCI; PNB New Delhi; BoB Vadodara; Canara Bengaluru; SIDBI Lucknow; IRDAI Hyderabad."},{"k":"table","title":"Headquarters in India","head":["Bank / body","Headquarters","Note"],"rows":[["State Bank of India","Mumbai",""],["Punjab National Bank","New Delhi",""],["Bank of Baroda","Vadodara","Corporate office in Mumbai."],["Canara Bank","Bengaluru",""],["Union Bank of India","Mumbai",""],["Bank of India","Mumbai",""],["Central Bank of India","Mumbai",""],["Indian Bank","Chennai",""],["Indian Overseas Bank","Chennai",""],["UCO Bank","Kolkata",""],["Bank of Maharashtra","Pune",""],["Punjab & Sind Bank","New Delhi",""],["HDFC Bank","Mumbai",""],["Kotak Mahindra Bank","Mumbai",""],["IDBI Bank","Mumbai",""],["Federal Bank","Aluva (Kerala)",""],["South Indian Bank","Thrissur",""],["Karnataka Bank","Mangaluru",""],["Karur Vysya Bank","Karur",""],["Jammu & Kashmir Bank","Srinagar",""],["Bandhan Bank","Kolkata",""],["AU Small Finance Bank","Jaipur",""],["NABARD","Mumbai",""],["SIDBI","Lucknow",""],["EXIM Bank","Mumbai",""],["National Housing Bank","New Delhi",""],["SEBI","Mumbai",""],["IRDAI","Hyderabad",""],["PFRDA","New Delhi",""],["NPCI","Mumbai",""]]},{"k":"mapfig","title":"Where the banks are headquartered","pins":[["1",72.88,19.08,"Mumbai: State Bank of India, Union Bank of India, Bank of India, Central Bank of India, HDFC Bank, Kotak Mahindra Bank, IDBI Bank, NABARD, EXIM Bank, SEBI, NPCI","n"],["2",77.21,28.61,"New Delhi: Punjab National Bank, Punjab & Sind Bank, National Housing Bank, PFRDA","n"],["3",80.27,13.08,"Chennai: Indian Bank, Indian Overseas Bank","n"],["4",88.36,22.57,"Kolkata: UCO Bank, Bandhan Bank","n"],["5",73.18,22.31,"Vadodara: Bank of Baroda","n"],["6",77.59,12.97,"Bengaluru: Canara Bank","n"],["7",73.86,18.52,"Pune: Bank of Maharashtra","n"],["8",76.35,10.11,"Aluva: Federal Bank","n"],["9",76.21,10.53,"Thrissur: South Indian Bank","n"],["10",74.86,12.91,"Mangaluru: Karnataka Bank","n"],["11",78.08,10.96,"Karur: Karur Vysya Bank","n"],["12",74.8,34.08,"Srinagar: Jammu & Kashmir Bank","n"],["13",75.79,26.91,"Jaipur: AU Small Finance Bank","n"],["14",80.95,26.85,"Lucknow: SIDBI","n"],["15",78.49,17.39,"Hyderabad: IRDAI","n"]],"facts":[["1 · Mumbai","State Bank of India, Union Bank of India, Bank of India, Central Bank of India, HDFC Bank, Kotak Mahindra Bank, IDBI Bank, NABARD, EXIM Bank, SEBI, NPCI"],["2 · New Delhi","Punjab National Bank, Punjab & Sind Bank, National Housing Bank, PFRDA"],["3 · Chennai","Indian Bank, Indian Overseas Bank"],["4 · Kolkata","UCO Bank, Bandhan Bank"],["5 · Vadodara","Bank of Baroda"],["6 · Bengaluru","Canara Bank"],["7 · Pune","Bank of Maharashtra"],["8 · Aluva","Federal Bank"],["9 · Thrissur","South Indian Bank"],["10 · Mangaluru","Karnataka Bank"],["11 · Karur","Karur Vysya Bank"],["12 · Srinagar","Jammu & Kashmir Bank"],["13 · Jaipur","AU Small Finance Bank"],["14 · Lucknow","SIDBI"],["15 · Hyderabad","IRDAI"]],"cap":"Mumbai, the financial capital, hosts the RBI, SEBI, NPCI and most big banks. Use ＋ or ⛶ to separate the Kerala cluster."},{"k":"table","title":"Taglines","head":["Tagline","Bank","Note"],"rows":[["The Banker to Every Indian","State Bank of India",""],["The Name You Can Bank Upon","Punjab National Bank",""],["India's International Bank","Bank of Baroda",""],["Together We Can","Canara Bank",""],["Good people to bank with","Union Bank of India",""],["Relationship beyond banking","Bank of India",""],["Taking Banking Technology to Common Man","Indian Bank",""],["Central to You Since 1911","Central Bank of India",""],["Good people to grow with","Indian Overseas Bank",""],["Honours Your Trust","UCO Bank",""],["One Family One Bank","Bank of Maharashtra",""],["Where service is a way of life","Punjab & Sind Bank",""],["We understand your world","HDFC Bank",""],["Hum Hai Na","ICICI Bank",""],["Let's make money simple","Kotak Mahindra Bank",""],["Banking for all","IDBI Bank",""],["Your Perfect Banking Partner","Federal Bank",""],["Taking Rural India Forward","NABARD",""],["Yogakshemam Vahamyaham","LIC",""]]},{"k":"table","title":"World banks and their headquarters","head":["Bank","Headquarters","Note"],"rows":[["World Bank","Washington, D.C.","Shares the city with the IMF."],["Asian Development Bank (ADB)","Manila","Philippines."],["Asian Infrastructure Investment Bank (AIIB)","Beijing",""],["New Development Bank (BRICS)","Shanghai",""],["Bank for International Settlements (BIS)","Basel","Switzerland — Basel norms are named after it."],["African Development Bank","Abidjan","Côte d'Ivoire."],["European Bank for Reconstruction and Development","London",""],["Islamic Development Bank","Jeddah",""]]},{"k":"worldfig","title":"Where the world's banks sit","minw":640,"pins":[["1",-77.04,38.9,"World Bank","n"],["2",121,14.6,"Asian Development Bank (ADB)","n"],["3",116.4,39.9,"Asian Infrastructure Investment Bank (AIIB)","n"],["4",121.47,31.23,"New Development Bank (BRICS)","n"],["5",7.59,47.56,"Bank for International Settlements (BIS)","n"],["6",-4,5.36,"African Development Bank","n"],["7",-0.13,51.5,"European Bank for Reconstruction and Development","n"],["8",39.17,21.54,"Islamic Development Bank","n"]],"legend":[["1 World Bank","Washington, D.C."],["2 Asian Development Bank (ADB)","Manila"],["3 Asian Infrastructure Investment Bank (AIIB)","Beijing"],["4 New Development Bank (BRICS)","Shanghai"],["5 Bank for International Settlements (BIS)","Basel"],["6 African Development Bank","Abidjan"],["7 European Bank for Reconstruction and Development","London"],["8 Islamic Development Bank","Jeddah"]],"cap":"The World Bank and the IMF share Washington, D.C.; the BRICS bank (NDB) is in Shanghai and the AIIB in Beijing."},{"k":"trick","h":"<b>“Lucky SIDBI in Lucknow, Hi IRDAI in Hyderabad.”<\/b> <b>“Canara Can”<\/b> — Together We Can. <b>“BoB goes Abroad”<\/b> — India's International Bank."},{"k":"trap","h":"<b>Bank of Baroda<\/b>'s HQ is <b>Vadodara<\/b>, though it has a big office in Mumbai. <b>Indian Bank<\/b> (Chennai) and <b>Bank of India<\/b> (Mumbai) are different banks. The <b>AIIB<\/b> is in Beijing but the <b>BRICS New Development Bank<\/b> is in Shanghai."}],"sum":["SBI, Union Bank, Bank of India, Central Bank, HDFC, NABARD, SEBI and NPCI are in Mumbai.","PNB and Punjab & Sind Bank — New Delhi; Bank of Baroda — Vadodara; Canara — Bengaluru; UCO — Kolkata.","SIDBI — Lucknow; IRDAI — Hyderabad; PFRDA and NHB — New Delhi.","SBI: The Banker to Every Indian; PNB: The Name You Can Bank Upon; Canara: Together We Can.","World Bank and IMF — Washington, D.C.; ADB — Manila; AIIB — Beijing; NDB — Shanghai; BIS — Basel."],"part":["Part 2 · Banks, regulators and payments","बैंक, नियामक और भुगतान प्रणाली"],"g":"bf"},
{"id":"N6","heat":2,"title":"Regulators and development finance institutions","hi":"नियामक और विकास वित्त संस्थान","blocks":[{"k":"hot","h":"Know who regulates what — <b>SEBI<\/b> (markets), <b>IRDAI<\/b> (insurance), <b>PFRDA<\/b> (pensions), RBI (banks) — and the year of <b>NABARD (1982)<\/b>, <b>SIDBI (1990)<\/b>, <b>EXIM (1982)<\/b>, <b>NHB (1988)<\/b>, and which committee led to what."},{"k":"story","h":"<p>India's money world has several referees. The <b>RBI<\/b> watches banks and NBFCs; <b>SEBI<\/b> (set up 1988, given legal powers in <b>1992<\/b>) watches the stock market; <b>IRDAI<\/b> (Hyderabad) watches insurance; <b>PFRDA<\/b> watches pensions such as the NPS.<\/p><p>Beside them stand the <b>development banks<\/b> that lend for a purpose: <b>NABARD<\/b> (12 July 1982, on the Sivaraman Committee's advice) for farming and villages, <b>EXIM Bank<\/b> (1982) for trade, <b>NHB<\/b> (1988) for housing, <b>SIDBI<\/b> (1990, Lucknow) for small industry and <b>NaBFID<\/b> (2021) for infrastructure. India's first such institution was <b>IFCI<\/b> in 1948.<\/p>","key":"SEBI markets (1992 statutory), IRDAI insurance, PFRDA pensions; NABARD 1982, EXIM 1982, NHB 1988, SIDBI 1990, NaBFID 2021; first DFI IFCI 1948."},{"k":"table","title":"When they were set up","head":["Body","Year","Note"],"rows":[["IFCI (India's first development finance institution)","1948",""],["ICICI","1955",""],["LIC","1956","Life insurance was nationalised."],["IDBI","1964",""],["DICGC","1978","Deposit insurance and credit guarantee merged."],["NABARD","1982","12 July 1982."],["EXIM Bank","1982","1 January 1982."],["National Housing Bank","1988",""],["SIDBI","1990","2 April 1990."],["SEBI gets statutory powers (SEBI Act)","1992","First set up in 1988."],["IRDA Act passed","1999","IRDAI regulates insurance."],["PFRDA set up","2003","Statutory under the PFRDA Act, 2013."],["IBBI (Insolvency and Bankruptcy Board)","2016",""],["NaBFID (infrastructure lender)","2021",""]]},{"k":"tlfig","title":"Regulators and finance bodies, year by year","rows":[[1948,"IFCI (India's first development finance institution)",""],[1955,"ICICI",""],[1956,"LIC",""],[1964,"IDBI",""],[1978,"DICGC",""],[1982,"NABARD",""],[1982,"EXIM Bank",""],[1988,"National Housing Bank",""],[1990,"SIDBI",""],[1992,"SEBI gets statutory powers (SEBI Act)",""],[1999,"IRDA Act passed",""],[2003,"PFRDA set up",""],[2016,"IBBI (Insolvency and Bankruptcy Board)",""],[2021,"NaBFID (infrastructure lender)",""]],"cap":"IFCI (1948) was India's first development finance institution; SEBI got statutory powers in 1992."},{"k":"table","title":"Who looks after what","head":["Body","Field","Note"],"rows":[["SEBI","Securities and stock markets",""],["IRDAI","Insurance",""],["PFRDA","Pensions (the National Pension System)",""],["NABARD","Agriculture and rural development","Apex body for rural credit."],["SIDBI","Micro, small and medium enterprises (MSMEs)",""],["EXIM Bank","Exports and imports",""],["National Housing Bank","Housing finance",""],["IBBI","Insolvency professionals and processes",""],["NaBFID","Long-term infrastructure finance",""],["DICGC","Insurance of bank deposits","Up to ₹5 lakh per depositor per bank."]]},{"k":"table","title":"Committees and what they led to","head":["Committee","Led to","Note"],"rows":[["Hilton Young Commission (1926)","Setting up the RBI",""],["Gorwala Committee (All India Rural Credit Survey)","Creating the State Bank of India",""],["B. Sivaraman Committee (CRAFICARD)","Setting up NABARD",""],["Narasimham Committee (1991, 1998)","Banking sector reforms",""],["Nachiket Mor Committee (2014)","Payment banks and financial inclusion",""],["Urjit Patel Committee (2014)","Inflation targeting and the MPC",""],["P. J. Nayak Committee (2014)","Governance of bank boards",""]]},{"k":"trick","h":"Years in order — <b>“Not Every Need Sinks”<\/b>: <b>N<\/b>ABARD 82, <b>E<\/b>XIM 82, <b>N<\/b>HB 88, <b>S<\/b>IDBI 90."},{"k":"trap","h":"SEBI was <b>formed in 1988<\/b> but became a <b>statutory body in 1992<\/b> — read the question carefully. <b>SIDBI<\/b> is for small <i>industries<\/i>; <b>NABARD<\/b> is for <i>agriculture<\/i>. The <b>DICGC<\/b> is a subsidiary of the RBI."}],"sum":["RBI regulates banks; SEBI markets; IRDAI insurance; PFRDA pensions.","SEBI: set up 1988, statutory 1992; IRDA Act 1999; PFRDA 2003.","NABARD 1982 (Sivaraman Committee), EXIM 1982, NHB 1988, SIDBI 1990, NaBFID 2021.","IFCI (1948) was India's first development finance institution.","Narasimham Committee: banking reforms; Urjit Patel Committee: inflation targeting."],"part":["Part 2 · Banks, regulators and payments","बैंक, नियामक और भुगतान प्रणाली"],"g":"bf"},
{"id":"N7","heat":3,"title":"Payments: NPCI, UPI and more","hi":"भुगतान प्रणाली: एनपीसीआई, यूपीआई और अन्य","blocks":[{"k":"hot","h":"Hot in recent papers: <b>UPI (2016)<\/b> and <b>NPCI (2008)<\/b>, <b>RuPay<\/b>, <b>IMPS<\/b>, <b>NEFT vs RTGS<\/b> (RTGS minimum ₹2 lakh), <b>AePS<\/b>, <b>BHIM<\/b> and the <b>digital rupee (e₹, 2022)<\/b>."},{"k":"story","h":"<p>The RBI runs two big pipes for money: <b>RTGS<\/b> (2004) for large sums, settled one by one in real time, and <b>NEFT<\/b> (2005), settled in half-hourly batches. Both now work round the clock. In <b>2008<\/b> the RBI and the Indian Banks' Association set up the not-for-profit <b>National Payments Corporation of India (NPCI)<\/b> in Mumbai.<\/p><p>NPCI built <b>IMPS<\/b> (2010) for instant mobile transfers, the <b>RuPay<\/b> card (2012), <b>AePS<\/b> for Aadhaar-based cash at micro-ATMs, and in <b>2016<\/b> the <b>Unified Payments Interface (UPI)<\/b> — now the world's busiest real-time payment system — with the <b>BHIM<\/b> app. In <b>2022<\/b> the RBI began pilots of the <b>digital rupee (e₹)<\/b>, India's central bank digital currency.<\/p>","key":"RTGS 2004, NEFT 2005 (RBI); NPCI 2008 → IMPS 2010, RuPay 2012, UPI & BHIM 2016; e₹ pilots 2022."},{"k":"facts","title":"Payment facts","rows":[["NPCI","2008, Mumbai; promoted by the RBI and Indian Banks' Association; a not-for-profit (Section 8) company"],["UPI abroad","Works in several countries, including Bhutan, Nepal, Singapore, UAE, Mauritius, Sri Lanka and France"],["NEFT 24×7","Since December 2019"],["RTGS 24×7","Since December 2020"],["BHIM","Bharat Interface for Money"],["Digital rupee","Issued by the RBI; announced in the 2022 Budget"]]},{"k":"table","title":"Launch years","head":["System","Year","Note"],"rows":[["RTGS","2004",""],["NEFT","2005",""],["NPCI set up","2008",""],["IMPS","2010",""],["RuPay card network","2012",""],["UPI","2016","Launched in April 2016; live for the public from August 2016."],["BHIM app","2016","Launched on 30 December 2016."],["Digital rupee (e₹) pilots","2022","Wholesale from 1 November, retail from 1 December 2022."],["UPI 123PAY for feature phones","2022",""]]},{"k":"tlfig","title":"Payment systems, year by year","rows":[[2004,"RTGS",""],[2005,"NEFT",""],[2008,"NPCI set up",""],[2010,"IMPS",""],[2012,"RuPay card network",""],[2016,"UPI",""],[2016,"BHIM app",""],[2022,"Digital rupee (e₹) pilots",""],[2022,"UPI 123PAY for feature phones",""]],"cap":"RTGS (2004) → NEFT (2005) → NPCI (2008) → IMPS (2010) → RuPay (2012) → UPI (2016)."},{"k":"table","title":"Which system is it?","head":["Feature","System","Note"],"rows":[["Large-value transfers settled one by one in real time; minimum ₹2 lakh","RTGS",""],["Transfers settled in half-hourly batches; no minimum amount","NEFT",""],["Instant 24×7 interbank transfer by mobile, run by NPCI since 2010","IMPS",""],["Pay anyone instantly using a virtual payment address (VPA) or QR code","UPI",""],["India's own card network — 'Rupee' + 'Payment'","RuPay",""],["Withdraw cash at a micro-ATM using your Aadhaar number and fingerprint","AePS","Aadhaar Enabled Payment System."],["Currency issued by the RBI in digital form","e₹ (digital rupee)",""],["Pay highway tolls automatically with an RFID tag","FASTag",""],["UPI payments from a feature phone without the internet","UPI 123PAY",""],["Small UPI payments from an on-device wallet without a PIN","UPI Lite",""]]},{"k":"trick","h":"<b>“R before N”<\/b> — RTGS 2004, NEFT 2005. NPCI's babies in order — <b>“I Run Up”<\/b>: <b>I<\/b>MPS 2010, <b>R<\/b>uPay 2012, <b>U<\/b>PI 2016."},{"k":"trap","h":"<b>NEFT and RTGS<\/b> are run by the <b>RBI<\/b>; <b>UPI, IMPS, RuPay, AePS<\/b> by <b>NPCI<\/b>. RTGS has a <b>minimum<\/b> of ₹2 lakh; NEFT has none. <b>e₹<\/b> is issued by the RBI, not by NPCI."}],"sum":["RTGS (2004) and NEFT (2005) are run by the RBI; both work 24×7.","NPCI was set up in 2008 by the RBI and the IBA; HQ Mumbai.","NPCI runs IMPS (2010), RuPay (2012), UPI (2016), BHIM, AePS and FASTag's network.","RTGS minimum is ₹2 lakh; NEFT has no minimum.","The digital rupee (e₹) pilots began in 2022; it is issued by the RBI."],"part":["Part 2 · Banks, regulators and payments","बैंक, नियामक और भुगतान प्रणाली"],"g":"bf"},
{"id":"N8","heat":2,"title":"Stock exchanges and indices","hi":"शेयर बाज़ार और सूचकांक","blocks":[{"k":"hot","h":"Asked most: <b>BSE 1875<\/b> (Asia's oldest), <b>Sensex = 30<\/b> companies, <b>Nifty = 50<\/b>, NSE 1992, and <b>which country<\/b> an index belongs to — Nikkei (Japan), Hang Seng (Hong Kong), FTSE (UK), DAX (Germany), Dow Jones (USA)."},{"k":"story","h":"<p>Under a banyan tree near Mumbai's Town Hall, a few share brokers began trading in the 1850s. In <b>1875<\/b> they formed the <b>Native Share and Stock Brokers' Association<\/b> — today's <b>BSE<\/b> on Dalal Street, <b>Asia's oldest stock exchange<\/b>. Its index, the <b>Sensex<\/b> (Sensitive Index), tracks <b>30<\/b> big companies, with 1978–79 as the base year.<\/p><p>The <b>NSE<\/b> was set up in <b>1992<\/b> and began screen-based trading in 1994. Its index, the <b>Nifty 50<\/b>, tracks <b>50<\/b> companies. <b>SEBI<\/b> regulates both. Every big market has its own index: Dow Jones and Nasdaq in the USA, Nikkei in Japan, FTSE in London and DAX in Germany.<\/p>","key":"BSE 1875, Sensex 30 (base 1978–79 = 100); NSE 1992, Nifty 50 (base 1,000); regulator SEBI."},{"k":"facts","title":"Market words","rows":[["Sensex","Sensitive Index of BSE — 30 stocks"],["Nifty 50","National + Fifty — NSE's index of 50 stocks"],["Bull market","Prices rising"],["Bear market","Prices falling"],["IPO","Initial Public Offering — a company's first sale of shares to the public"],["Dalal Street","Home of the BSE in Mumbai"],["Depositories","NSDL (1996) and CDSL (1999) hold shares in electronic form"]]},{"k":"table","title":"Indian market milestones","head":["Event","Year","Note"],"rows":[["Bombay Stock Exchange (BSE) founded — Asia's oldest","1875","Began as the Native Share and Stock Brokers' Association."],["Sensex first published","1986","Base year 1978–79 = 100."],["National Stock Exchange (NSE) set up","1992","Began trading in 1994."],["Nifty 50 launched","1996","Base value 1,000 (November 1995)."],["NSDL, India's first depository","1996",""],["CDSL depository","1999",""],["India INX — first international exchange, GIFT City","2017",""]]},{"k":"table","title":"World stock indices","head":["Index","Country","Note"],"rows":[["Dow Jones","USA",""],["Nasdaq","USA",""],["Nikkei 225","Japan",""],["Hang Seng","Hong Kong",""],["FTSE 100","United Kingdom",""],["DAX","Germany",""],["CAC 40","France",""],["KOSPI","South Korea",""],["Straits Times Index","Singapore",""],["SSE Composite","China","Shanghai."],["TAIEX","Taiwan",""],["KSE-100","Pakistan",""],["S&P/ASX 200","Australia",""],["Bovespa (Ibovespa)","Brazil",""],["Jakarta Composite","Indonesia",""],["Tadawul All Share (TASI)","Saudi Arabia",""],["Sensex","India","BSE."]]},{"k":"worldfig","title":"Stock indices around the world","minw":640,"pins":[["1",-98,39,"USA","n"],["2",138,36.5,"Japan","n"],["3",114.17,22.3,"Hong Kong","n"],["4",-2,53,"United Kingdom","n"],["5",10.5,51,"Germany","n"],["6",2.5,46.5,"France","n"],["7",127.8,36.3,"South Korea","n"],["8",103.8,1.35,"Singapore","n"],["9",104,35,"China","n"],["10",121,23.7,"Taiwan","n"],["11",69,30,"Pakistan","n"],["12",134,-25,"Australia","n"],["13",-52,-10,"Brazil","n"],["14",117,-2,"Indonesia","n"],["15",45,24,"Saudi Arabia","n"],["16",78,22,"India","n"]],"legend":[["1 USA","Dow Jones, Nasdaq"],["2 Japan","Nikkei 225"],["3 Hong Kong","Hang Seng"],["4 United Kingdom","FTSE 100"],["5 Germany","DAX"],["6 France","CAC 40"],["7 South Korea","KOSPI"],["8 Singapore","Straits Times Index"],["9 China","SSE Composite"],["10 Taiwan","TAIEX"],["11 Pakistan","KSE-100"],["12 Australia","S&P/ASX 200"],["13 Brazil","Bovespa (Ibovespa)"],["14 Indonesia","Jakarta Composite"],["15 Saudi Arabia","Tadawul All Share (TASI)"],["16 India","Sensex"]],"cap":"India: Sensex (BSE, Mumbai, 1875 — Asia's oldest exchange) and Nifty 50 (NSE). The USA has two famous indices: the Dow Jones and the Nasdaq."},{"k":"trick","h":"<b>“Sensex Thirty, Nifty Fifty.”<\/b> World indices — <b>“Nikki from Japan, Hang in Hong Kong, DAX for Deutschland, CAC for Cafés of France.”<\/b>"},{"k":"trap","h":"The <b>Sensex<\/b> belongs to the <b>BSE<\/b>, the <b>Nifty<\/b> to the <b>NSE<\/b> — don't swap them. <b>Hang Seng<\/b> is Hong Kong, not mainland China (that is the SSE Composite). The <b>FTSE 100<\/b> is London, not Frankfurt."}],"sum":["BSE (1875) is Asia's oldest stock exchange; its Sensex tracks 30 companies (base 1978–79 = 100).","NSE was set up in 1992; its Nifty 50 tracks 50 companies.","SEBI regulates the stock markets.","Dow Jones and Nasdaq — USA; Nikkei — Japan; Hang Seng — Hong Kong; FTSE — UK; DAX — Germany; CAC 40 — France.","NSDL (1996) and CDSL (1999) are India's two depositories."],"part":["Part 3 · Markets, schemes, terms and currency","शेयर बाज़ार, योजनाएँ, शब्दावली और मुद्रा"],"g":"bf"},
{"id":"N9","heat":3,"title":"Financial inclusion schemes","hi":"वित्तीय समावेशन योजनाएँ","blocks":[{"k":"hot","h":"Always one question: <b>PMJDY (28 August 2014)<\/b>, the 2015 trio <b>PMSBY, PMJJBY, APY<\/b> (premiums and age limits), <b>MUDRA<\/b> (Shishu, Kishore, Tarun) and <b>Stand-Up India<\/b> (SC/ST and women)."},{"k":"story","h":"<p>In 2014 millions of Indians had no bank account. On <b>28 August 2014<\/b> the <b>Pradhan Mantri Jan Dhan Yojana<\/b> began, giving everyone a <b>zero-balance account<\/b>, a <b>RuPay<\/b> debit card, accident cover and a small overdraft. Its motto: <b>“Mera Khata, Bhagya Vidhata”<\/b>.<\/p><p>On <b>9 May 2015<\/b> came cheap safety nets for these accounts: <b>PMSBY<\/b> (₹2 lakh accident cover for ₹20 a year), <b>PMJJBY<\/b> (₹2 lakh life cover for ₹436 a year) and the <b>Atal Pension Yojana<\/b>. <b>MUDRA<\/b> (April 2015) lends to tiny businesses without collateral, in stages called <b>Shishu, Kishore, Tarun<\/b> and now <b>Tarun Plus<\/b>, and <b>Stand-Up India<\/b> (2016) helps SC/ST and women start enterprises.<\/p>","key":"PMJDY 28 Aug 2014; PMSBY ₹20 accident, PMJJBY ₹436 life, APY pension — all 2015; MUDRA 2015 (Shishu–Kishore–Tarun); Stand-Up India 2016."},{"k":"table","title":"Schemes by year","head":["Scheme","Year","Note"],"rows":[["Kisan Credit Card","1998",""],["National Pension System (for new central government staff)","2004",""],["Pradhan Mantri Jan Dhan Yojana (PMJDY)","2014","Launched on 28 August 2014."],["Sukanya Samriddhi Yojana","2015",""],["Pradhan Mantri MUDRA Yojana","2015","Launched on 8 April 2015."],["Pradhan Mantri Suraksha Bima Yojana (PMSBY)","2015","Launched on 9 May 2015 with PMJJBY and APY."],["Pradhan Mantri Jeevan Jyoti Bima Yojana (PMJJBY)","2015",""],["Atal Pension Yojana (APY)","2015","Replaced Swavalamban."],["Stand-Up India","2016","Launched on 5 April 2016."],["PM-KISAN","2019",""],["PM SVANidhi","2020",""],["Unified Pension Scheme (in force)","2025","From 1 April 2025."]]},{"k":"tlfig","title":"Inclusion schemes, year by year","rows":[[1998,"Kisan Credit Card",""],[2004,"National Pension System (for new central government staff)",""],[2014,"Pradhan Mantri Jan Dhan Yojana (PMJDY)",""],[2015,"Sukanya Samriddhi Yojana",""],[2015,"Pradhan Mantri MUDRA Yojana",""],[2015,"Pradhan Mantri Suraksha Bima Yojana (PMSBY)",""],[2015,"Pradhan Mantri Jeevan Jyoti Bima Yojana (PMJJBY)",""],[2015,"Atal Pension Yojana (APY)",""],[2016,"Stand-Up India",""],[2019,"PM-KISAN",""],[2020,"PM SVANidhi",""],[2025,"Unified Pension Scheme (in force)",""]],"cap":"Jan Dhan (2014) opened zero-balance accounts; MUDRA (2015) lends to small businesses."},{"k":"table","title":"What each scheme gives","head":["Benefit","Scheme","Note"],"rows":[["Zero-balance bank account with a RuPay card, accident cover and overdraft","PMJDY","Motto: 'Mera Khata, Bhagya Vidhata'."],["₹2 lakh accident insurance for ₹20 a year, age 18–70","PMSBY",""],["₹2 lakh life insurance for ₹436 a year, age 18–50","PMJJBY",""],["Pension of ₹1,000–5,000 a month after 60; join between 18 and 40","Atal Pension Yojana",""],["Collateral-free loans up to ₹20 lakh for small non-farm businesses","MUDRA",""],["Bank loans of ₹10 lakh to ₹1 crore for SC/ST and women entrepreneurs","Stand-Up India",""],["Savings account for a girl child below 10 years","Sukanya Samriddhi Yojana",""],["Small working-capital loans for street vendors","PM SVANidhi",""],["₹6,000 a year to farmer families in three instalments","PM-KISAN",""],["Short-term crop loans to farmers through a card","Kisan Credit Card",""]]},{"k":"table","title":"MUDRA loan categories","head":["Category","Loan size","Note"],"rows":[["Shishu","Up to ₹50,000",""],["Kishore","₹50,000 to ₹5 lakh",""],["Tarun","₹5 lakh to ₹10 lakh",""],["Tarun Plus","₹10 lakh to ₹20 lakh","For those who repaid a Tarun loan; added in 2024."]]},{"k":"bars","title":"MUDRA loans by size","unit":"₹ lakh (upper limit)","left":120,"hi":1,"sort":false,"rows":[["Shishu",0.5,"Up to ₹50,000"],["Kishore",5,"₹50,000 to ₹5 lakh"],["Tarun",10,"₹5 lakh to ₹10 lakh"],["Tarun Plus",20,"₹10 lakh to ₹20 lakh"]],"cap":"Shishu → Kishore → Tarun → Tarun Plus: the names follow a child growing up, as the business grows."},{"k":"trick","h":"MUDRA grows like a person: <b>Shishu<\/b> (child) → <b>Kishore<\/b> (teen) → <b>Tarun<\/b> (youth) → <b>Tarun Plus<\/b>. Insurance ages: <b>“Suraksha to Seventy, Jeevan to Fifty, Atal to Forty”<\/b> (last entry age for APY is 40)."},{"k":"trap","h":"<b>PMSBY<\/b> is <i>accident<\/i> cover (₹20); <b>PMJJBY<\/b> is <i>life<\/i> cover (₹436). PMJDY was <b>announced<\/b> on 15 August 2014 but <b>launched<\/b> on <b>28 August 2014<\/b>. Stand-Up India is for <b>SC/ST and women<\/b>; Start-up India is a different scheme."}],"sum":["PMJDY: launched 28 August 2014 — zero-balance account, RuPay card, accident cover, overdraft.","PMSBY: ₹2 lakh accident cover for ₹20 a year (18–70); PMJJBY: ₹2 lakh life cover for ₹436 a year (18–50).","APY (2015): pension of ₹1,000–5,000 a month after 60, join at 18–40.","MUDRA (8 April 2015): Shishu up to ₹50,000, Kishore to ₹5 lakh, Tarun to ₹10 lakh, Tarun Plus to ₹20 lakh.","Stand-Up India (2016): loans of ₹10 lakh–₹1 crore for SC/ST and women entrepreneurs."],"part":["Part 3 · Markets, schemes, terms and currency","शेयर बाज़ार, योजनाएँ, शब्दावली और मुद्रा"],"g":"bf"},
{"id":"N10","heat":3,"title":"Banking terms, laws and currency","hi":"बैंकिंग शब्दावली, क़ानून और मुद्रा","blocks":[{"k":"hot","h":"Expect: <b>full forms<\/b> (NPA, IFSC, MICR, RTGS, NEFT), <b>NPA = overdue 90 days<\/b>, <b>DICGC cover ₹5 lakh<\/b>, <b>Basel III<\/b>, <b>SARFAESI 2002<\/b>, <b>IBC 2016<\/b>, the <b>₹ symbol<\/b> (2010, D. Udaya Kumar) and the <b>motifs on new notes<\/b>."},{"k":"story","h":"<p>When a borrower stops paying interest or instalments for <b>90 days<\/b>, the loan becomes a <b>Non-Performing Asset (NPA)<\/b>. Banks can then use the <b>SARFAESI Act (2002)<\/b> to seize the security without a court, or take a company to the <b>Insolvency and Bankruptcy Code (2016)<\/b>. To make banks strong enough to bear such losses, the world follows the <b>Basel III<\/b> capital rules made at Basel, Switzerland. If a bank fails, the <b>DICGC<\/b> repays each depositor up to <b>₹5 lakh<\/b> (raised from ₹1 lakh in 2020).<\/p><p>Our money has its own story. The <b>₹ symbol<\/b>, designed by <b>D. Udaya Kumar<\/b>, was adopted on <b>15 July 2010<\/b> — a blend of Devanagari ‘र’ and Roman ‘R’. On <b>8 November 2016<\/b> the old ₹500 and ₹1000 notes were demonetised, and new notes with Indian heritage motifs followed. Notes are printed at Nashik, Dewas, Mysuru and Salboni; coins are minted at Mumbai, Kolkata, Hyderabad and Noida.<\/p>","key":"NPA = 90 days overdue; SARFAESI 2002, IBC 2016; DICGC ₹5 lakh; ₹ symbol 2010 by D. Udaya Kumar; demonetisation 8 Nov 2016."},{"k":"facts","title":"Key terms","rows":[["NPA","A loan whose interest or instalment is overdue for more than 90 days"],["CASA","Current + savings deposits — cheap money for a bank; a high CASA ratio is good"],["Basel III","Global capital rules for banks, made by the Basel Committee at the BIS"],["DICGC cover","₹5 lakh per depositor per bank (since 4 February 2020)"],["Repo-linked loans (EBLR)","Retail loan rates linked to an outside benchmark such as the repo rate"],["Demonetisation","8 November 2016 — old ₹500 and ₹1000 notes"],["₹ symbol","Adopted 15 July 2010; designed by D. Udaya Kumar"],["Coins and ₹1 note","Issued by the Government of India under the Coinage Act, 2011"]]},{"k":"table","title":"Full forms","head":["Short form","Full form","Note"],"rows":[["NPA","Non-Performing Asset",""],["CASA","Current Account Savings Account",""],["SARFAESI","Securitisation and Reconstruction of Financial Assets and Enforcement of Security Interest",""],["IBC","Insolvency and Bankruptcy Code",""],["DICGC","Deposit Insurance and Credit Guarantee Corporation",""],["NEFT","National Electronic Funds Transfer",""],["RTGS","Real Time Gross Settlement",""],["IMPS","Immediate Payment Service",""],["UPI","Unified Payments Interface",""],["NPCI","National Payments Corporation of India",""],["MCLR","Marginal Cost of Funds based Lending Rate",""],["NDTL","Net Demand and Time Liabilities",""],["KYC","Know Your Customer",""],["IFSC","Indian Financial System Code",""],["MICR","Magnetic Ink Character Recognition",""],["CRAR","Capital to Risk-weighted Assets Ratio",""],["NBFC","Non-Banking Financial Company",""],["CBDC","Central Bank Digital Currency",""],["MUDRA","Micro Units Development and Refinance Agency",""],["NABARD","National Bank for Agriculture and Rural Development",""],["SIDBI","Small Industries Development Bank of India",""]]},{"k":"table","title":"Banking and finance laws","head":["Law","Year","Note"],"rows":[["Negotiable Instruments Act (cheques; Section 138 — cheque bounce)","1881",""],["Banking Regulation Act","1949","Passed as the Banking Companies Act."],["DICGC Act","1961",""],["Foreign Exchange Management Act (FEMA)","1999","Replaced FERA (1973)."],["SARFAESI Act","2002","Lets banks seize secured assets without going to court."],["Payment and Settlement Systems Act","2007",""],["Coinage Act","2011",""],["Insolvency and Bankruptcy Code","2016",""],["Fugitive Economic Offenders Act","2018",""]]},{"k":"table","title":"Mahatma Gandhi New Series — back of the note","head":["Note","Motif","Note"],"rows":[["₹10 note","Sun Temple, Konark",""],["₹20 note","Ellora Caves",""],["₹50 note","Hampi with its stone chariot",""],["₹100 note","Rani ki Vav",""],["₹200 note","Sanchi Stupa",""],["₹500 note","Red Fort",""],["₹2000 note","Mangalyaan","Withdrawn from circulation in 2023 but still legal tender."]]},{"k":"photos","title":"What is on the back of the notes","items":[["Konark_Sun_Temple","Sun Temple, Konark","₹10 note"],["Ellora_Caves","Ellora Caves","₹20 note"],["Hampi_with_its_stone_chariot","Hampi with its stone chariot","₹50 note"],["Rani_ki_Vav","Rani ki Vav","₹100 note"],["Sanchi_Stupa","Sanchi Stupa","₹200 note"],["Red_Fort","Red Fort","₹500 note"],["Mangalyaan","Mangalyaan","₹2000 note"]]},{"k":"table","title":"Where money is made","head":["Facility","City","Note"],"rows":[["India Government Mint — the oldest","Kolkata","Coins carry no mint mark."],["India Government Mint — diamond (◆) mint mark","Mumbai",""],["India Government Mint — star (★) mint mark","Hyderabad",""],["India Government Mint — dot (●) mint mark, set up 1986","Noida",""],["Currency Note Press (SPMCIL)","Nashik",""],["Bank Note Press (SPMCIL)","Dewas",""],["Security Paper Mill","Narmadapuram (Hoshangabad)",""],["Note press of the RBI's BRBNMPL in Karnataka","Mysuru",""],["Note press of the RBI's BRBNMPL in West Bengal","Salboni",""]]},{"k":"mapfig","title":"Where coins and notes are made","pins":[["1",88.36,22.57,"India Government Mint — the oldest","n"],["2",72.88,19.08,"India Government Mint — diamond (◆) mint mark","n"],["3",78.49,17.39,"India Government Mint — star (★) mint mark","n"],["4",77.39,28.54,"India Government Mint — dot (●) mint mark, set up 1986","n"],["5",73.79,20,"Currency Note Press (SPMCIL)","n"],["6",76.05,22.97,"Bank Note Press (SPMCIL)","n"],["7",77.73,22.75,"Security Paper Mill","n"],["8",76.64,12.3,"Note press of the RBI's BRBNMPL in Karnataka","n"],["9",87.3,22.63,"Note press of the RBI's BRBNMPL in West Bengal","n"]],"facts":[["1 · India Government Mint — the oldest","Kolkata — Coins carry no mint mark"],["2 · India Government Mint — diamond (◆) mint mark","Mumbai"],["3 · India Government Mint — star (★) mint mark","Hyderabad"],["4 · India Government Mint — dot (●) mint mark, set up 1986","Noida"],["5 · Currency Note Press (SPMCIL)","Nashik"],["6 · Bank Note Press (SPMCIL)","Dewas"],["7 · Security Paper Mill","Narmadapuram (Hoshangabad)"],["8 · Note press of the RBI's BRBNMPL in Karnataka","Mysuru"],["9 · Note press of the RBI's BRBNMPL in West Bengal","Salboni"]],"cap":"Numbers match the list. Places are approximate. Use ＋ or ⛶ to zoom in."},{"k":"trick","h":"New-note motifs in rising order — <b>“Sun, Ellora, Hampi, Vav, Sanchi, Fort, Mars”<\/b>: ₹10 Konark Sun Temple, ₹20 Ellora, ₹50 Hampi, ₹100 Rani ki Vav, ₹200 Sanchi, ₹500 Red Fort, ₹2000 Mangalyaan. <b>NPA = 90<\/b> — “Nine-Zero, No Payment”."},{"k":"trap","h":"<b>₹100<\/b> has <b>Rani ki Vav<\/b> (Gujarat), not the Red Fort — that is <b>₹500<\/b>. <b>SARFAESI<\/b> is <b>2002<\/b>; <b>IBC<\/b> is <b>2016<\/b>. The DICGC limit is <b>₹5 lakh<\/b> per depositor <i>per bank<\/i>, covering principal and interest together."}],"sum":["A loan becomes an NPA when payments are overdue for more than 90 days.","SARFAESI Act 2002; Insolvency and Bankruptcy Code 2016; FEMA 1999; Banking Regulation Act 1949.","DICGC insures deposits up to ₹5 lakh per depositor per bank.","The ₹ symbol was adopted on 15 July 2010; designer D. Udaya Kumar.","New-note motifs: ₹10 Konark, ₹20 Ellora, ₹50 Hampi, ₹100 Rani ki Vav, ₹200 Sanchi, ₹500 Red Fort, ₹2000 Mangalyaan."],"part":["Part 3 · Markets, schemes, terms and currency","शेयर बाज़ार, योजनाएँ, शब्दावली और मुद्रा"],"g":"bf"}

/* Up to n rows of a deck for the Grand Mix, spread over different answers so every question gets real wrong options. */
function bfSpread(rows, n){
  const by = {}; shuffle(rows).forEach(r => { (by[r[1]] = by[r[1]] || []).push(r); });
  const groups = shuffle(Object.values(by)), out = [];
  for (let i = 0; out.length < n && groups.some(g => g.length); i++) { const g = groups[i % groups.length]; if (g.length) out.push(g.shift()); }
  return out;
}

:root[data-skin] body{background-color:var(--app-bg);background-image:var(--app-pattern);background-size:var(--app-psize);background-attachment:fixed}
:root[data-skin] h1,:root[data-skin] h2{letter-spacing:-.01em}

/* ===== Desktop layout (PC / tablet landscape) ===== */
@media (min-width: 1024px){
  :root{--side:236px}
  body{padding-left:var(--side);font-size:16.5px}
  .top{border-bottom:1px solid var(--rule)}
  .top-in{max-width:1320px;padding:16px 36px}
  .brand{font-size:21px}
  .brand small{font-size:13px}
  .stat{font-size:13px}
  .wrap{max-width:1320px;padding:0 36px 56px}
  .view{padding-top:28px}
  h1{font-size:34px} h2{font-size:22px} h3{font-size:17px}

  /* bottom tab bar becomes a left sidebar */
  .nav{top:0;bottom:0;left:0;right:auto;width:var(--side);height:auto;border-top:0;border-right:1px solid var(--rule);padding:84px 14px 20px;display:block;overflow:auto}
  .nav-in{display:flex;flex-direction:column;gap:4px;height:auto;max-width:none;margin:0}
  .nav-in::before{content:"Sections";display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:0 14px 8px}
  .nav button{flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-size:15px;min-height:0;height:auto;width:100%;text-align:left}
  .nav button svg{width:20px;height:20px;flex-shrink:0}
  .nav button:hover{background:var(--sunk)}
  .nav button[aria-current="page"]{background:var(--blue-bg)}
  .nav button[aria-current="page"] span{border-bottom:0!important}

  /* home: intro beside progress */
  .hero{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);column-gap:48px;align-items:end;padding-bottom:10px}
  .hero > .eyebrow,.hero > h1,.hero > p{grid-column:1}
  .hero > .meter{grid-column:2;grid-row:3;align-self:center}
  .hero > .row{grid-column:2;grid-row:2;align-self:end}

  /* lesson reader: facts, timelines, tricks sit side by side */
  .lhead{margin-bottom:0}
  .steps{max-width:640px}
  .steps + .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .steps + .stack > .plain,.steps + .stack > .row,.steps + .stack > p,.steps + .stack > .fig,.steps + .stack > h2,.steps + .stack > .tbl{grid-column:1/-1}
  .steps + .stack > .plain{max-width:86ch;font-size:17px}
  .steps + .stack > .hot,.steps + .stack > .story{grid-column:1/-1}
  .steps + .stack > .story{max-width:none;padding:20px 24px;font-size:17.5px}
  .steps + .stack > .story p{max-width:80ch}
  .steps + .stack:not(:has(> .block ~ .block)) > .block{grid-column:1/-1}
  .block,.qcard{padding:18px 20px;border-radius:14px}

  /* quizzes and question bank */
  #lq > .stack{display:grid;grid-template-columns:minmax(0,1fr);max-width:980px;gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qt{font-size:18px}
  #plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #plist .opts{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:wrap;overflow:visible}

  /* mock test: question with the answer grid alongside */
  .mbar{top:calc(env(safe-area-inset-top,0px) + 67px)}
  .view > .qcard{max-width:1000px}
  .view > .row.between{max-width:1000px}
  .view > #msub{max-width:1000px;width:100%}
  .view > .block.stack{max-width:760px}
  .pal{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .kpis{max-width:760px}

  /* revise: summary cards and sheets in columns */
  #rv > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #rv > .stack > .grph,#rv > .stack > p,#rv > .stack > .search,#rv > .stack > .callout{grid-column:1/-1}
  #dgl,#lml,#tll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #dgl > .grph,#dgl > p,#lml > p,#tll > .grph{grid-column:1/-1}
  #rv .search,#rv > #dgl ~ .search{max-width:520px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flash{min-height:300px;max-width:760px;margin:0 auto;padding:32px 36px}
  .flash .front{font-size:22px}

  /* learn: era cards across the top */
  .eras{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}
  .les{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}

</style>
<script id="shabd-deeplink">
(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();
</script>
</body>
</html>

igerators, air conditioners and aerosol sprays","They also destroy the ozone layer."],["Hydrofluorocarbons (HFCs)","Newer ACs and fridges that replaced CFCs","Safe for ozone but strong greenhouse gases — cut by the Kigali Amendment."],["Sulphur hexafluoride","Insulation in electrical switchgear","The most powerful greenhouse gas listed under Kyoto."],["Water vapour","Evaporation from oceans and lakes","The most abundant greenhouse gas."]]},{"k":"info","title":"The greenhouse effect","html":"<figure class=\"fig wide\" style=\"--minw:600px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 660 300\" role=\"img\" aria-label=\"The greenhouse effect\">\n  <defs><marker id=\"ghY\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#e0a040\"/><\/marker><marker id=\"ghR\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#c0392b\"/><\/marker><\/defs>\n  <circle cx=\"60\" cy=\"50\" r=\"34\" fill=\"#f6c343\"/><text x=\"60\" y=\"56\" text-anchor=\"middle\" font-size=\"12\" class=\"b\" style=\"fill:#5a3b00\">Sun<\/text>\n  <rect x=\"0\" y=\"110\" width=\"660\" height=\"34\" fill=\"#9fb8d8\" opacity=\".35\"/><text x=\"640\" y=\"132\" text-anchor=\"end\" font-size=\"12\" class=\"b\" style=\"fill:#2f6db5\">Greenhouse gases: CO₂, CH₄, N₂O, water vapour<\/text>\n  <path d=\"M0 250 Q330 220 660 250 L660 300 L0 300Z\" fill=\"#7fb36a\" opacity=\".55\"/><text x=\"330\" y=\"285\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Earth's surface warms<\/text>\n  <path d=\"M90 80 L258 234\" fill=\"none\" stroke=\"#e0a040\" stroke-width=\"4\" stroke-linecap=\"round\" marker-end=\"url(#ghY)\"/><path d=\"M90 80 L258 234\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.2\" stroke-dasharray=\"2 7\" class=\"rvf\" style=\"animation:rvflow 1.1s linear infinite\"/><text x=\"150\" y=\"190\" font-size=\"11\" class=\"b\" style=\"fill:#b07a10\">sunlight in<\/text>\n  <path d=\"M300 236 L379 72\" fill=\"none\" stroke=\"#c0392b\" stroke-width=\"3\" stroke-linecap=\"round\" marker-end=\"url(#ghR)\"/><path d=\"M300 236 L379 72\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.2\" stroke-dasharray=\"2 7\" class=\"rvf\" style=\"animation:rvflow 1.1s linear infinite\"/><text x=\"385\" y=\"64\" font-size=\"11\" class=\"b\" style=\"fill:#c0392b\">some heat (infrared) escapes<\/text>\n  <path d=\"M420 236 L470 130 L519 234\" fill=\"none\" stroke=\"#c0392b\" stroke-width=\"3\" stroke-linecap=\"round\" marker-end=\"url(#ghR)\"/><path d=\"M420 236 L470 130 L519 234\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.2\" stroke-dasharray=\"2 7\" class=\"rvf\" style=\"animation:rvflow 1.1s linear infinite\"/><text x=\"490\" y=\"190\" font-size=\"11\" class=\"b\" style=\"fill:#c0392b\">heat trapped and sent back<\/text>\n<\/svg><\/figure>","cap":"Sunlight warms the ground; the ground gives off heat (infrared); greenhouse gases absorb some of it and send it back down. More gas, more warming."},{"k":"table","title":"Layers of the atmosphere","head":["Layer","Known for","Note"],"rows":[["Troposphere","All weather happens here","Lowest layer; temperature falls with height."],["Stratosphere","Holds the ozone layer","About 15–35 km up the ozone is richest; jets fly in its lower part."],["Mesosphere","Meteors burn up here","The coldest layer."],["Thermosphere (ionosphere)","Reflects radio waves; auroras glow here",""],["Exosphere","The outermost layer, fading into space",""]]},{"k":"info","title":"Where the ozone layer sits","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 660 260\" role=\"img\" aria-label=\"Layers of the atmosphere with the ozone layer\">\n  <rect x=\"60\" y=\"10\" width=\"590\" height=\"58\" fill=\"#e8e0f5\"/><text x=\"72\" y=\"36\" font-size=\"14\" class=\"b\">Thermosphere<\/text><text x=\"72\" y=\"54\" font-size=\"11\" class=\"mut\">Auroras; the ISS orbits here<\/text><text x=\"52\" y=\"68\" text-anchor=\"end\" font-size=\"10\" class=\"mut\">80 km<\/text><rect x=\"60\" y=\"70\" width=\"590\" height=\"58\" fill=\"#dfe8f7\"/><text x=\"72\" y=\"96\" font-size=\"14\" class=\"b\">Mesosphere<\/text><text x=\"72\" y=\"114\" font-size=\"11\" class=\"mut\">Meteors burn up<\/text><text x=\"52\" y=\"128\" text-anchor=\"end\" font-size=\"10\" class=\"mut\">50 km<\/text><rect x=\"60\" y=\"130\" width=\"590\" height=\"58\" fill=\"#e3f1fb\"/><text x=\"72\" y=\"156\" font-size=\"14\" class=\"b\">Stratosphere<\/text><text x=\"72\" y=\"174\" font-size=\"11\" class=\"mut\">Ozone layer (15–35 km); jets fly low here<\/text><text x=\"52\" y=\"188\" text-anchor=\"end\" font-size=\"10\" class=\"mut\">12 km<\/text><rect x=\"60\" y=\"190\" width=\"590\" height=\"58\" fill=\"#e8f4e4\"/><text x=\"72\" y=\"216\" font-size=\"14\" class=\"b\">Troposphere<\/text><text x=\"72\" y=\"234\" font-size=\"11\" class=\"mut\">All weather<\/text><text x=\"52\" y=\"248\" text-anchor=\"end\" font-size=\"10\" class=\"mut\">0 km<\/text>\n  <rect x=\"300\" y=\"138\" width=\"340\" height=\"16\" rx=\"8\" fill=\"#2f6db5\" opacity=\".45\"><animate attributeName=\"opacity\" values=\".3;.65;.3\" dur=\"3s\" repeatCount=\"indefinite\"/><\/rect>\n  <text x=\"470\" y=\"150\" text-anchor=\"middle\" font-size=\"11\" class=\"b\" style=\"fill:#fff\">O₃ ozone layer — blocks UV-B<\/text><\/svg><\/figure>","cap":"Ozone (O₃) in the stratosphere absorbs harmful ultraviolet rays. CFCs thin it; the Montreal Protocol (1987) phases them out. Ozone is measured in Dobson units."},{"k":"facts","title":"Climate and ozone numbers","rows":[["Kyoto's six gases","CO₂, methane, nitrous oxide, HFCs, PFCs and SF₆ (NF₃ added in 2012)"],["CO₂ in air","About 280 ppm before 1850; over 420 ppm in the 2020s"],["Global warming potential","Measured against CO₂ = 1; methane is about 28 over 100 years"],["Hottest year on record","2024 — the first calendar year above 1.5 °C (WMO)"],["Ozone unit","Dobson unit (DU)"],["Ozone hole","Over Antarctica; reported in 1985 by the British Antarctic Survey"],["World Ozone Day","16 September (Montreal Protocol signed in 1987)"],["Ozone protects from","Ultraviolet (UV-B) rays — skin cancer and cataract"]]},{"k":"trick","h":"Greenhouse gases — <b>“Can Mother Nature Hold Heat?”<\/b>: <b>C<\/b>O₂, <b>M<\/b>ethane, <b>N<\/b>itrous oxide, <b>H<\/b>FCs / CFCs, <b>H<\/b>₂O (water vapour). Atmosphere upward — <b>“The Strong Man Throws Eggs”<\/b>: Troposphere, Stratosphere, Mesosphere, Thermosphere, Exosphere."},{"k":"trap","h":"<b>Nitrogen and oxygen are NOT greenhouse gases<\/b>. The ozone <b>layer<\/b> is in the <b>stratosphere<\/b>, not the troposphere. The ozone hole is worst over <b>Antarctica<\/b> (south), not the Arctic. <b>HFCs<\/b> don't harm ozone but do warm the planet."}],"sum":["Main greenhouse gases: carbon dioxide, methane, nitrous oxide, fluorinated gases and water vapour.","Methane comes mostly from paddy fields, cattle and wetlands; nitrous oxide from fertilisers.","The ozone layer lies in the stratosphere and is measured in Dobson units.","CFCs caused the Antarctic ozone hole, reported in 1985; World Ozone Day is 16 September.","2024 was the hottest year on record — the first calendar year above 1.5 °C."],"part":["Part 3 · Climate, treaties and India","जलवायु, संधियाँ और भारत"],"g":"en"},
{"id":"E8","heat":3,"title":"International conventions and protocols","hi":"अंतरराष्ट्रीय अभिसमय और प्रोटोकॉल","blocks":[{"k":"hot","h":"Every exam has one: <b>“The Montreal Protocol is related to?”<\/b> (ozone), <b>Kyoto<\/b> (greenhouse gases), <b>Basel<\/b> (hazardous waste), <b>Cartagena<\/b> (biosafety), <b>Nagoya<\/b> (benefit sharing), <b>Ramsar<\/b> (wetlands), <b>CITES<\/b> (wildlife trade) — and the <b>year<\/b> of each."},{"k":"story","h":"<p>Modern environmental diplomacy began at the <b>Stockholm Conference<\/b> in <b>1972<\/b>; the <b>UNEP<\/b> was born there, and its opening day, <b>5 June<\/b>, became World Environment Day. Twenty years later the <b>Earth Summit<\/b> at <b>Rio de Janeiro (1992)<\/b> produced three big treaties: the climate convention (<b>UNFCCC<\/b>), the biodiversity convention (<b>CBD<\/b>) and, two years later, the desertification convention (<b>UNCCD<\/b>, 1994).<\/p><p>Each convention grew protocols. Under the <b>UNFCCC<\/b> came <b>Kyoto (1997)<\/b> and <b>Paris (2015)<\/b>. Under the <b>CBD<\/b> came <b>Cartagena (2000)<\/b> on GM organisms and <b>Nagoya (2010)<\/b> on benefit sharing. Under the ozone <b>Vienna Convention (1985)<\/b> came the <b>Montreal Protocol (1987)<\/b> and its <b>Kigali Amendment (2016)<\/b>. Chemicals have their own trio — <b>Basel<\/b> (waste), <b>Rotterdam<\/b> (trade consent) and <b>Stockholm<\/b> (POPs) — plus <b>Minamata<\/b> for mercury.<\/p>","key":"Stockholm 1972 → UNEP; Rio 1992 → UNFCCC + CBD; Kyoto 1997 & Paris 2015 under UNFCCC; Cartagena 2000 & Nagoya 2010 under CBD; Montreal 1987 → ozone."},{"k":"table","title":"Treaties and summits by year","head":["Treaty / summit","Year","Note"],"rows":[["Ramsar Convention on wetlands","1971","Signed at Ramsar, Iran; India joined in 1982."],["Stockholm Conference on the Human Environment","1972","The first world environment conference; led to UNEP. Opened on 5 June — now World Environment Day."],["CITES","1973","Signed in Washington DC; in force 1975."],["Bonn Convention on Migratory Species (CMS)","1979",""],["Vienna Convention for the Protection of the Ozone Layer","1985","The framework treaty for the Montreal Protocol."],["Montreal Protocol","1987","Signed on 16 September 1987 — now World Ozone Day."],["Brundtland Report 'Our Common Future'","1987","Defined sustainable development."],["Basel Convention","1989",""],["Earth Summit, Rio de Janeiro","1992","UNFCCC and CBD opened for signature; Agenda 21 adopted."],["UN Convention to Combat Desertification (UNCCD)","1994","Adopted in Paris on 17 June 1994."],["Kyoto Protocol","1997","In force from 2005."],["Rotterdam Convention","1998",""],["Cartagena Protocol on Biosafety","2000","Under the CBD; in force 2003."],["Stockholm Convention on Persistent Organic Pollutants","2001","In force 2004."],["Nagoya Protocol","2010","Under the CBD; in force 2014."],["Minamata Convention on Mercury","2013","Adopted in Kumamoto, Japan; in force 2017."],["Paris Agreement","2015","Adopted at COP21 on 12 December 2015; in force 4 November 2016."],["Kigali Amendment to the Montreal Protocol","2016","Adopted in Kigali, Rwanda."],["Kunming-Montreal Global Biodiversity Framework","2022","Agreed at CBD COP15; the '30 by 30' target."]]},{"k":"tlfig","title":"Environment treaties, year by year","rows":[[1971,"Ramsar Convention on wetlands",""],[1972,"Stockholm Conference on the Human Environment",""],[1973,"CITES",""],[1979,"Bonn Convention on Migratory Species (CMS)",""],[1985,"Vienna Convention for the Protection of the Ozone Layer",""],[1987,"Montreal Protocol",""],[1987,"Brundtland Report 'Our Common Future'",""],[1989,"Basel Convention",""],[1992,"Earth Summit, Rio de Janeiro",""],[1994,"UN Convention to Combat Desertification (UNCCD)",""],[1997,"Kyoto Protocol",""],[1998,"Rotterdam Convention",""],[2000,"Cartagena Protocol on Biosafety",""],[2001,"Stockholm Convention on Persistent Organic Pollutants",""],[2010,"Nagoya Protocol",""],[2013,"Minamata Convention on Mercury",""],[2015,"Paris Agreement",""],[2016,"Kigali Amendment to the Montreal Protocol",""],[2022,"Kunming-Montreal Global Biodiversity Framework",""]],"cap":"From Ramsar (1971) and Stockholm (1972) to Paris (2015) and the Kunming-Montreal framework (2022)."},{"k":"worldfig","title":"Where the treaties are named after","minw":640,"pins":[["1",50.66,36.9,"Ramsar Convention on wetlands","n"],["2",17.2,59.8,"Stockholm Conference on the Human Environment","n"],["3",-77.04,38.9,"CITES","n"],["4",7.1,50.73,"Bonn Convention on Migratory Species (CMS)","n"],["5",16.37,48.21,"Vienna Convention for the Protection of the Ozone Layer","n"],["6",-73.57,45.5,"Montreal Protocol","n"],["7",7.59,47.56,"Basel Convention","n"],["8",-43.2,-22.9,"Earth Summit, Rio de Janeiro","n"],["9",1.6,49.3,"UN Convention to Combat Desertification (UNCCD)","n"],["10",135.77,35.01,"Kyoto Protocol","n"],["11",4.48,51.92,"Rotterdam Convention","n"],["12",-75.51,10.39,"Cartagena Protocol on Biosafety","n"],["13",19,58.8,"Stockholm Convention on Persistent Organic Pollutants","n"],["14",136.9,35.18,"Nagoya Protocol","n"],["15",130.4,32.2,"Minamata Convention on Mercury","n"],["16",2.9,48.2,"Paris Agreement","n"],["17",30.06,-1.94,"Kigali Amendment to the Montreal Protocol","n"],["18",102.7,25.04,"Kunming-Montreal Global Biodiversity Framework","n"]],"legend":[["1 Ramsar Convention on wetlands","1971"],["2 Stockholm Conference on the Human Environment","1972"],["3 CITES","1973"],["4 Bonn Convention on Migratory Species (CMS)","1979"],["5 Vienna Convention for the Protection of the Ozone Layer","1985"],["6 Montreal Protocol","1987"],["7 Basel Convention","1989"],["8 Earth Summit, Rio de Janeiro","1992"],["9 UN Convention to Combat Desertification (UNCCD)","1994"],["10 Kyoto Protocol","1997"],["11 Rotterdam Convention","1998"],["12 Cartagena Protocol on Biosafety","2000"],["13 Stockholm Convention on Persistent Organic Pollutants","2001"],["14 Nagoya Protocol","2010"],["15 Minamata Convention on Mercury","2013"],["16 Paris Agreement","2015"],["17 Kigali Amendment to the Montreal Protocol","2016"],["18 Kunming-Montreal Global Biodiversity Framework","2022"]],"cap":"Most treaties take the name of the city where they were signed. Cartagena's protocol was finally adopted in Montreal; Minamata is named after the Japanese bay poisoned by mercury."},{"k":"worldfig","title":"Europe, closer","vb":"425 50 145 85","minw":300,"maxw":620,"pins":[["2",17.2,59.8,"Stockholm Conference on the Human Environment","n"],["4",7.1,50.73,"Bonn Convention on Migratory Species (CMS)","n"],["5",16.37,48.21,"Vienna Convention for the Protection of the Ozone Layer","n"],["7",7.59,47.56,"Basel Convention","n"],["9",1.6,49.3,"UN Convention to Combat Desertification (UNCCD)","n"],["11",4.48,51.92,"Rotterdam Convention","n"],["13",19,58.8,"Stockholm Convention on Persistent Organic Pollutants","n"],["16",2.9,48.2,"Paris Agreement","n"]],"cap":"The same numbers, zoomed in on Europe: Stockholm (2, 13), Bonn (4), Vienna (5), Basel (7), Paris (9, 16) and Rotterdam (11)."},{"k":"table","title":"What each treaty deals with","head":["Treaty","Deals with","Note"],"rows":[["Montreal Protocol","Phasing out ozone-depleting substances","The most successful environmental treaty — every UN member has ratified it."],["Kigali Amendment","Phasing down hydrofluorocarbons (HFCs)",""],["Kyoto Protocol","Binding greenhouse-gas cuts for developed countries",""],["Paris Agreement","Keeping warming well below 2 °C and trying for 1.5 °C","Every country sets its own target (NDC)."],["Basel Convention","Movement of hazardous waste across borders",""],["Rotterdam Convention","Prior informed consent before trading hazardous chemicals and pesticides",""],["Stockholm Convention","Persistent organic pollutants (POPs)","DDT, dioxins and other 'dirty dozen' chemicals."],["Minamata Convention","Mercury",""],["Cartagena Protocol","Biosafety of living modified (GM) organisms",""],["Nagoya Protocol","Access to genetic resources and fair sharing of their benefits",""],["CITES","International trade in endangered wild animals and plants",""],["Ramsar Convention","Wetlands of international importance",""],["UNCCD","Desertification and land degradation",""],["Bonn Convention (CMS)","Migratory species of wild animals",""]]},{"k":"facts","title":"Which treaty sits under which","rows":[["UNFCCC (1992)","Kyoto Protocol (1997), Paris Agreement (2015)"],["CBD (1992)","Cartagena Protocol (2000), Nagoya Protocol (2010)"],["Vienna Convention (1985)","Montreal Protocol (1987), Kigali Amendment (2016)"],["Three goals of the CBD","Conservation, sustainable use, fair sharing of benefits"],["Paris temperature goal","Well below 2 °C, aiming for 1.5 °C above pre-industrial levels"],["India ratified Paris","2 October 2016 (Gandhi Jayanti)"],["CBD COPs","COP11 Hyderabad (2012); COP15 Kunming–Montreal (2022); COP16 Cali, Colombia (2024)"],["Other COPs in India","UNCCD COP14, Greater Noida (2019); CMS COP13, Gandhinagar (2020)"]]},{"k":"trick","h":"Chemical trio by year and letter — <b>“B-R-S, 89-98-01”<\/b>: <b>B<\/b>asel 1989 (waste), <b>R<\/b>otterdam 1998 (consent), <b>S<\/b>tockholm 2001 (POPs). <b>“Cartagena = Careful with GM”<\/b>, <b>“Nagoya = Now share the profit”<\/b>."},{"k":"trap","h":"There are <b>two Stockholms<\/b>: the <b>1972 Conference<\/b> (human environment) and the <b>2001 Convention<\/b> (POPs). The <b>Cartagena<\/b> Protocol was finally adopted in <b>Montreal<\/b> (2000). The <b>Earth Summit<\/b> (1992) is also called the <b>Rio Summit<\/b> or <b>Vasundhara Summit<\/b>; <b>Rio+20<\/b> was in 2012."}],"sum":["Stockholm Conference 1972 created UNEP; 5 June is World Environment Day.","The Earth Summit at Rio (1992) gave the UNFCCC and the CBD; the UNCCD followed in 1994.","Montreal Protocol 1987 (ozone); Kigali Amendment 2016 (HFCs).","Kyoto 1997 and Paris 2015 come under the UNFCCC; Cartagena 2000 and Nagoya 2010 under the CBD.","Basel — hazardous waste; Rotterdam — prior informed consent; Stockholm 2001 — POPs; Minamata — mercury."],"part":["Part 3 · Climate, treaties and India","जलवायु, संधियाँ और भारत"],"g":"en"},
{"id":"E9","heat":3,"title":"Climate COPs and world environment bodies","hi":"जलवायु सम्मेलन (COP) और विश्व पर्यावरण संस्थाएँ","blocks":[{"k":"hot","h":"Current-affairs favourites: <b>the latest COP and its venue<\/b> (COP29 Baku, COP30 Belém, COP31 Antalya), <b>what each COP agreed<\/b>, and the <b>headquarters<\/b> of UNEP (Nairobi), IPCC (Geneva), IUCN and WWF (Gland)."},{"k":"story","h":"<p>Every year the countries of the <b>UNFCCC<\/b> meet at a <b>Conference of the Parties (COP)<\/b>. The first was in <b>Berlin (1995)<\/b>; <b>Kyoto (COP3, 1997)<\/b> gave the Kyoto Protocol; <b>New Delhi<\/b> hosted <b>COP8 (2002)<\/b>. <b>Paris (COP21, 2015)<\/b> gave the Paris Agreement. At <b>Glasgow (COP26, 2021)<\/b> India promised <b>net zero by 2070<\/b>. <b>Sharm el-Sheikh (COP27)<\/b> agreed a <b>Loss and Damage Fund<\/b>; <b>Dubai (COP28)<\/b> held the first global stocktake; <b>Baku (COP29, 2024)<\/b> set a new climate-finance goal of <b>$300 billion a year by 2035<\/b>; and <b>Belém (COP30, 2025)<\/b> met on the edge of the Amazon.<\/p><p>As of October 2026, <b>COP31<\/b> is scheduled for <b>9–20 November 2026<\/b> in <b>Antalya, Türkiye<\/b>, with Australia leading the negotiations — the first COP whose presidency is split between two countries. Behind the talks stand the <b>UNEP<\/b> (Nairobi, 1972), the science panel <b>IPCC<\/b> (Geneva, 1988) and the money of the <b>GEF<\/b> and the <b>Green Climate Fund<\/b>.<\/p>","key":"COP1 Berlin 1995; COP3 Kyoto; COP8 New Delhi; COP21 Paris; COP26 Glasgow; COP27 Sharm el-Sheikh; COP28 Dubai; COP29 Baku; COP30 Belém; COP31 Antalya (Nov 2026)."},{"k":"table","title":"UN climate COPs","head":["COP","Venue","Remember"],"rows":[["COP1 (1995)","Berlin, Germany","The first UN climate COP."],["COP3 (1997)","Kyoto, Japan","Adopted the Kyoto Protocol."],["COP8 (2002)","New Delhi, India","The only climate COP held in India so far."],["COP15 (2009)","Copenhagen, Denmark",""],["COP21 (2015)","Paris, France","Adopted the Paris Agreement; India and France launched the International Solar Alliance."],["COP25 (2019)","Madrid, Spain","Held in Madrid under Chile's presidency."],["COP26 (2021)","Glasgow, UK","India announced net zero by 2070 (the 'Panchamrit')."],["COP27 (2022)","Sharm el-Sheikh, Egypt","Agreed a Loss and Damage Fund."],["COP28 (2023)","Dubai, UAE","First global stocktake; call to 'transition away from fossil fuels'."],["COP29 (2024)","Baku, Azerbaijan","The 'finance COP' — new goal of at least $300 billion a year by 2035."],["COP30 (2025)","Belém, Brazil","Held at the edge of the Amazon."]]},{"k":"worldfig","title":"Climate COPs on the map","minw":640,"pins":[["1",13.4,52.52,"COP1 (1995)","n"],["2",135.77,35.01,"COP3 (1997)","n"],["3",77.21,28.61,"COP8 (2002)","n"],["4",12.57,55.68,"COP15 (2009)","n"],["5",2.35,48.86,"COP21 (2015)","n"],["6",-3.7,40.42,"COP25 (2019)","n"],["7",-4.25,55.86,"COP26 (2021)","n"],["8",34.33,27.91,"COP27 (2022)","n"],["9",55.27,25.2,"COP28 (2023)","n"],["10",49.87,40.41,"COP29 (2024)","n"],["11",-48.5,-1.46,"COP30 (2025)","n"]],"legend":[["1 COP1 (1995)","Berlin, Germany"],["2 COP3 (1997)","Kyoto, Japan"],["3 COP8 (2002)","New Delhi, India"],["4 COP15 (2009)","Copenhagen, Denmark"],["5 COP21 (2015)","Paris, France"],["6 COP25 (2019)","Madrid, Spain"],["7 COP26 (2021)","Glasgow, UK"],["8 COP27 (2022)","Sharm el-Sheikh, Egypt"],["9 COP28 (2023)","Dubai, UAE"],["10 COP29 (2024)","Baku, Azerbaijan"],["11 COP30 (2025)","Belém, Brazil"]],"cap":"COP8 (2002) is the only climate COP India has hosted. COP31 (2026) goes to Antalya, Türkiye."},{"k":"table","title":"Where the world's environment bodies sit","head":["Body","Headquarters","Note"],"rows":[["UNEP (1972)","Nairobi, Kenya","Set up after the Stockholm Conference."],["IPCC (1988)","Geneva, Switzerland","Set up by the WMO and UNEP; shared the 2007 Nobel Peace Prize with Al Gore."],["IUCN (1948)","Gland, Switzerland","Keeps the Red List."],["WWF (1961)","Gland, Switzerland","Panda logo; runs Earth Hour."],["Greenpeace (1971)","Amsterdam, Netherlands","Founded in Vancouver, Canada."],["Global Environment Facility (1991)","Washington DC, USA","Funds projects for several environment treaties."],["Green Climate Fund","Incheon (Songdo), South Korea",""],["International Solar Alliance (2015)","Gurugram, India","The first treaty-based international body with its HQ in India."],["UNFCCC Secretariat","Bonn, Germany",""],["CBD Secretariat","Montreal, Canada",""]]},{"k":"worldfig","title":"Where the environment bodies sit","minw":640,"pins":[["1",36.82,-1.29,"UNEP (1972)","n"],["2",6.14,46.2,"IPCC (1988)","n"],["3",6.27,46.42,"IUCN (1948)","n"],["4",6.27,46.42,"WWF (1961)","n"],["5",4.9,52.37,"Greenpeace (1971)","n"],["6",-77.04,38.9,"Global Environment Facility (1991)","n"],["7",126.64,37.39,"Green Climate Fund","n"],["8",77.03,28.46,"International Solar Alliance (2015)","n"],["9",7.1,50.73,"UNFCCC Secretariat","n"],["10",-73.57,45.5,"CBD Secretariat","n"]],"legend":[["1 UNEP (1972)","Nairobi, Kenya"],["2 IPCC (1988)","Geneva, Switzerland"],["3 IUCN (1948)","Gland, Switzerland"],["4 WWF (1961)","Gland, Switzerland"],["5 Greenpeace (1971)","Amsterdam, Netherlands"],["6 Global Environment Facility (1991)","Washington DC, USA"],["7 Green Climate Fund","Incheon (Songdo), South Korea"],["8 International Solar Alliance (2015)","Gurugram, India"],["9 UNFCCC Secretariat","Bonn, Germany"],["10 CBD Secretariat","Montreal, Canada"]],"cap":"UNEP is the only big UN body headquartered in the Global South (Nairobi). The International Solar Alliance is the first treaty-based body headquartered in India."},{"k":"facts","title":"COP31 and after (as of October 2026)","rows":[["COP31 (2026)","Antalya, Türkiye, 9–20 November 2026; Australia's Chris Bowen is 'President of Negotiations'"],["India's offer","India has offered to host COP33 in 2028 (announced at COP28)"],["India's Panchamrit (COP26)","Net zero by 2070; 500 GW non-fossil capacity and 50% of energy needs from renewables by 2030"],["IPCC reports","Sixth Assessment Report completed in 2023"],["UNEP's award","Champions of the Earth"],["UNEP's flagship report","Emissions Gap Report (yearly)"]]},{"k":"trick","h":"Recent COPs in order — <b>“Get Some Dates By Boat”<\/b>: <b>G<\/b>lasgow (26), <b>S<\/b>harm el-Sheikh (27), <b>D<\/b>ubai (28), <b>B<\/b>aku (29), <b>B<\/b>elém (30). HQs — <b>“UNEP in Nairobi, IPCC in Geneva, Pandas in Gland”<\/b>."},{"k":"trap","h":"<b>UNEP<\/b> is in <b>Nairobi<\/b>, but the <b>UNFCCC secretariat<\/b> is in <b>Bonn<\/b> and the <b>CBD secretariat<\/b> in <b>Montreal<\/b>. <b>COP25<\/b> was held in <b>Madrid<\/b> though <b>Chile<\/b> presided. Climate COP numbers are not the same as biodiversity (CBD) COP numbers — CBD COP15 was Kunming–Montreal (2022)."}],"sum":["COP1 was in Berlin (1995); COP3 in Kyoto (1997); COP8 in New Delhi (2002); COP21 in Paris (2015).","COP26 Glasgow (2021): India announced net zero by 2070.","COP27 Sharm el-Sheikh — Loss and Damage Fund; COP28 Dubai — first global stocktake.","COP29 Baku (2024) — $300 billion a year by 2035; COP30 Belém, Brazil (2025); COP31 Antalya, Türkiye (Nov 2026, scheduled).","UNEP — Nairobi; IPCC — Geneva; IUCN and WWF — Gland; ISA — Gurugram."],"part":["Part 3 · Climate, treaties and India","जलवायु, संधियाँ और भारत"],"g":"en"},
{"id":"E10","heat":3,"title":"India: green laws, missions, movements and environmentalists","hi":"भारत: पर्यावरण क़ानून, मिशन, आंदोलन और पर्यावरणविद्","blocks":[{"k":"hot","h":"Asked very often: <b>Chipko (1973, Uttarakhand, Sunderlal Bahuguna)<\/b>, <b>Appiko (Karnataka)<\/b>, <b>Narmada Bachao (Medha Patkar)<\/b>, <b>NGT (2010)<\/b>, the <b>eight NAPCC missions<\/b> and <b>Mission LiFE<\/b>."},{"k":"story","h":"<p>India's green story is older than its laws. In <b>1730<\/b>, at <b>Khejarli<\/b> near Jodhpur, <b>Amrita Devi Bishnoi<\/b> and 363 Bishnois died hugging khejri trees to stop the king's axemen. Two and a half centuries later, in <b>1973<\/b>, villagers in <b>Chamoli<\/b> (now Uttarakhand) again hugged trees — the <b>Chipko movement<\/b>, organised by <b>Chandi Prasad Bhatt<\/b> and carried across India by <b>Sunderlal Bahuguna<\/b>. Karnataka's <b>Appiko<\/b> (1983) copied it, Kerala's scientists and poets saved <b>Silent Valley<\/b>, and <b>Medha Patkar<\/b> led the <b>Narmada Bachao Andolan<\/b> against big dams.<\/p><p>The law followed: the <b>Water Act (1974)<\/b> created the <b>Central Pollution Control Board<\/b>, the <b>Air Act<\/b> came in 1981 and the <b>Environment (Protection) Act<\/b> in 1986. In <b>2008<\/b> India released its <b>National Action Plan on Climate Change<\/b> with <b>eight missions<\/b>, and in <b>2010<\/b> set up the <b>National Green Tribunal<\/b> to hear green cases quickly. In <b>2022<\/b> India launched <b>Mission LiFE<\/b> — 'Lifestyle for Environment' — and in <b>2023<\/b> the <b>Green Credit Programme<\/b>.<\/p>","key":"Khejarli 1730; Chipko 1973 (Bahuguna, Bhatt); Appiko 1983 (Hegde); NBA (Medha Patkar); CPCB 1974; NAPCC 2008 (8 missions); NGT 2010; LiFE 2022; Green Credit 2023."},{"k":"table","title":"India's green milestones","head":["Law / step","Year","Note"],"rows":[["Water (Prevention and Control of Pollution) Act","1974","India's first pollution law; the Central Pollution Control Board was set up under it."],["Air (Prevention and Control of Pollution) Act","1981",""],["Ministry of Environment and Forests created","1985",""],["Environment (Protection) Act","1986","An 'umbrella' law passed after the Bhopal gas tragedy."],["National Action Plan on Climate Change (NAPCC)","2008","Released on 30 June 2008 with eight national missions."],["National Green Tribunal set up","2010","Under the NGT Act, 2010; began on 18 October 2010."],["Mission LiFE launched","2022","Launched at Ekta Nagar (Kevadia), Gujarat, on 20 October 2022 with the UN Secretary-General."],["Green Credit Programme rules notified","2023","Under the Environment (Protection) Act; run by ICFRE."],["'Ek Ped Maa Ke Naam' tree campaign","2024","Launched on World Environment Day, 5 June 2024."]]},{"k":"tlfig","title":"India's green laws and steps","rows":[[1974,"Water (Prevention and Control of Pollution) Act",""],[1981,"Air (Prevention and Control of Pollution) Act",""],[1985,"Ministry of Environment and Forests created",""],[1986,"Environment (Protection) Act",""],[2008,"National Action Plan on Climate Change (NAPCC)",""],[2010,"National Green Tribunal set up",""],[2022,"Mission LiFE launched",""],[2023,"Green Credit Programme rules notified",""],[2024,"'Ek Ped Maa Ke Naam' tree campaign",""]],"cap":"The Environment (Protection) Act of 1986 came after the Bhopal gas tragedy (1984)."},{"k":"table","title":"Environmental movements","head":["Movement","State","Note"],"rows":[["Bishnoi sacrifice at Khejarli (1730)","Rajasthan","Amrita Devi and 363 Bishnois gave their lives to save khejri trees."],["Chipko movement (1973)","Uttarakhand","Began in Chamoli district, then in Uttar Pradesh."],["Appiko movement (1983)","Karnataka","Began at Salkani village near Sirsi, Uttara Kannada."],["Save Silent Valley movement","Kerala","Stopped a hydroelectric dam; the area became a national park in 1984."],["Jungle Bachao Andolan (1982)","Jharkhand","Tribal protest against replacing sal forests with teak; then part of Bihar."],["Narmada Bachao Andolan","Narmada valley — Gujarat, Madhya Pradesh and Maharashtra","Against the Sardar Sarovar and other big dams."]]},{"k":"mapfig","title":"Where the movements began","marks":[["RJ","Bishnoi sacrifice at Khejarli"],["UT","Chipko movement"],["KA","Appiko movement"],["KL","Save Silent Valley movement"],["JH","Jungle Bachao Andolan"]],"cap":"Khejarli (Rajasthan, 1730), Chipko (Uttarakhand, 1973), Silent Valley (Kerala), Appiko (Karnataka, 1983), Jungle Bachao (Jharkhand, 1982). The Narmada Bachao Andolan spans three states."},{"k":"table","title":"Indian environmentalists","head":["Person","Known for","Note"],"rows":[["Sunderlal Bahuguna","Chipko movement and the fight against the Tehri dam","Gave the slogan 'Ecology is the permanent economy'."],["Chandi Prasad Bhatt","Started the Chipko protests through his village cooperative","Ramon Magsaysay Award, 1982."],["Gaura Devi","Led the women of Reni village who hugged the trees (1974)",""],["Panduranga Hegde","Led the Appiko movement in Karnataka",""],["Medha Patkar","Leader of the Narmada Bachao Andolan","Right Livelihood Award 1991, shared with Baba Amte."],["Vandana Shiva","Founded Navdanya, a seed-saving movement",""],["Salim Ali","The 'Birdman of India'","Wrote 'The Book of Indian Birds'."],["Rajendra Singh","The 'Waterman of India' — revived rivers in Alwar","Stockholm Water Prize, 2015."],["Jadav Payeng","The 'Forest Man of India' — planted a forest on Majuli island","Padma Shri, 2015."],["M. C. Mehta","Lawyer whose cases cleaned up the Taj, the Ganga and Delhi's air",""],["Sunita Narain","Leads the Centre for Science and Environment (CSE)",""],["Madhav Gadgil","Headed the Western Ghats Ecology Expert Panel (2011)","UNEP Champion of the Earth (lifetime achievement), 2024."]]},{"k":"photos","title":"Environmentalists in pictures","items":[["Sunderlal_Bahuguna","Sunderlal Bahuguna","Chipko movement and the fight against the Tehri dam"],["Chandi_Prasad_Bhatt","Chandi Prasad Bhatt","Started the Chipko protests through his village cooperative"],["Gaura_Devi","Gaura Devi","Led the women of Reni village who hugged the trees (1974)"],["Panduranga_Hegde","Panduranga Hegde","Led the Appiko movement in Karnataka"],["Medha_Patkar","Medha Patkar","Leader of the Narmada Bachao Andolan"],["Vandana_Shiva","Vandana Shiva","Founded Navdanya, a seed-saving movement"],["Salim_Ali","Salim Ali","The 'Birdman of India'"],["Rajendra_Singh","Rajendra Singh","The 'Waterman of India'"],["Jadav_Payeng","Jadav Payeng","The 'Forest Man of India'"],["M._C._Mehta","M. C. Mehta","Lawyer whose cases cleaned up the Taj, the Ganga and Delhi's air"],["Sunita_Narain","Sunita Narain","Leads the Centre for Science and Environment (CSE)"],["Madhav_Gadgil","Madhav Gadgil","Headed the Western Ghats Ecology Expert Panel (2011)"]]},{"k":"facts","title":"NAPCC (2008) — the eight national missions","rows":[["1","National Solar Mission (Jawaharlal Nehru National Solar Mission, 2010)"],["2","National Mission for Enhanced Energy Efficiency (runs the PAT scheme)"],["3","National Mission on Sustainable Habitat"],["4","National Water Mission"],["5","National Mission for Sustaining the Himalayan Ecosystem"],["6","National Mission for a Green India"],["7","National Mission for Sustainable Agriculture"],["8","National Mission on Strategic Knowledge for Climate Change"]]},{"k":"facts","title":"Institutions and schemes","rows":[["National Green Tribunal","Set up 18 October 2010; principal bench New Delhi; zonal benches Bhopal, Pune, Kolkata and Chennai"],["CPCB","Central Pollution Control Board, 1974 — under the Ministry of Environment, Forest and Climate Change"],["Mission LiFE","'Lifestyle for Environment' — idea given by the PM at COP26 (2021); launched 20 October 2022"],["Green Credit Programme","Market rewards for green actions such as tree planting; rules notified in October 2023"],["Updated NDC (2022)","Cut emissions intensity of GDP by 45% from 2005 levels and reach 50% non-fossil power capacity by 2030"],["Net zero target","2070"]]},{"k":"trick","h":"NAPCC missions — <b>“SEW-HAGS + K”<\/b>: <b>S<\/b>olar, <b>E<\/b>nergy efficiency, <b>W<\/b>ater, <b>H<\/b>imalaya, <b>A<\/b>griculture, <b>G<\/b>reen India, <b>S<\/b>ustainable habitat, and <b>K<\/b>nowledge. Movements north to south — <b>Chipko (UK) → Narmada (MP/Guj/Mah) → Appiko (Kar) → Silent Valley (Ker)<\/b>."},{"k":"trap","h":"<b>Appiko<\/b> means 'to hug' in Kannada — it is the <b>Chipko of Karnataka<\/b>, not Kerala. <b>Chipko<\/b> began in <b>1973<\/b> (Uttarakhand was then part of UP). <b>NGT<\/b> is a tribunal set up by an Act of <b>2010<\/b>, not a constitutional body. <b>Salim Ali<\/b> is the Birdman; <b>Rajendra Singh<\/b> the Waterman; <b>Jadav Payeng<\/b> the Forest Man."}],"sum":["Khejarli (1730, Rajasthan): Amrita Devi and 363 Bishnois died to save khejri trees.","Chipko (1973, Uttarakhand) — Chandi Prasad Bhatt and Sunderlal Bahuguna; Appiko (1983, Karnataka) — Panduranga Hegde.","Narmada Bachao Andolan — Medha Patkar; Silent Valley — Kerala.","Water Act 1974 (CPCB), Air Act 1981, Environment Act 1986, NAPCC 2008 with eight missions, NGT 2010.","Mission LiFE launched 2022; Green Credit Programme 2023; net zero target 2070."],"part":["Part 3 · Climate, treaties and India","जलवायु, संधियाँ और भारत"],"g":"en"}

/* ---------- home ---------- */
function renderLab(){
  labStyle(); labStop();
  const L = labS();
  const sp = (LAB_CONF.specials || []).find(x => x.id === LAB.view); if (sp) return sp.open();
  const { r, nx } = labRank(L.xp || 0);
  const pct = nx ? Math.round(((L.xp || 0) - r[0]) * 100 / (nx[0] - r[0])) : 100;
  const card = d => `<button type="button" class="lab-g" data-lab-play="${d.id}"><span class="t"><span aria-hidden="true">${d.ico}</span><b>${esc(d.title)}</b></span><small>${esc(d.sub)}</small><span class="best">${L.best[d.id] ? "Best: " + L.best[d.id] : "Not played yet"}</span></button>`;
  $("#app").innerHTML = `<section class="view stack">
    <div class="lab-hero"><div><span class="eyebrow">Learn by playing</span><h1>${esc(LAB_CONF.title || "Lab")}</h1><p class="muted" style="margin:0">${LAB_CONF.blurb || "Quick games for the facts that win marks. Every right answer earns XP."}</p></div>
      <div class="lab-rank"><span class="ic" aria-hidden="true">${r[2]}</span><div><b>${r[1]}</b><small>${L.xp || 0} XP${nx ? ` · ${nx[0] - (L.xp || 0)} to ${nx[1]}` : " · top rank!"}</small><div class="lab-xpbar"><i style="width:${pct}%"></i></div></div></div></div>
    <div class="lab-games">
      ${(LAB_CONF.specials || []).map(s => `<button type="button" class="lab-g${s.wide ? " wide" : ""}" data-lab-go="${s.id}"><span class="t"><span aria-hidden="true">${s.ico}</span><b>${esc(s.title)}</b></span><small>${s.sub}</small><span class="best">${s.best ? s.best(L) : ""}</span></button>`).join("")}
      ${LAB_CONF.decks.map(card).join("")}
      ${LAB_CONF.match ? `<button type="button" class="lab-g" data-lab-go="match"><span class="t"><span aria-hidden="true">🃏</span><b>Memory Match</b></span><small>${esc(LAB_CONF.match.sub)}</small><span class="best">${L.match ? "Best: " + L.match + " moves" : "Not played yet"}</span></button>` : ""}
    </div>
    <div class="block"><h3>How to use the Lab</h3><p class="muted" style="margin:0">Read a lesson first, then play its game until you can answer in about three seconds — that is the speed the exam needs. Each game lasts 60 seconds: right answers in a row build a combo for bonus points. Tap <b>See all pairs</b> on a game to revise its list.</p></div>
  </section>`;
  $("#app").querySelectorAll("[data-lab-play]").forEach(b => b.onclick = () => labIntro(b.dataset.labPlay));

  });
}
const labBack = () => `<div class="lhead"><button class="back" type="button" data-lab-home>‹ Lab</button></div>`;
function labBindHome(){ $("#app").querySelectorAll("[data-lab-home]").forEach(b => b.onclick = () => { labStop(); LAB.view = "home"; renderLab(); window.scrollTo(0,0); }); }

/* ---------- quiz games (60 seconds) ---------- */
function labDeck(id){
  const d = LAB_CONF.decks.find(x => x.id === id);
  const ask = (pre, t) => pre ? `${pre} ${t}${/[?:]$/.test(pre) ? "" : "?"}` : t;
  let items = d.make ? d.make() : d.pairs.map(p => ({ p: ask(d.q, p[0]), a: p[1], note: p[2] || "", raw: p[0], pool: "a" }));
  if (d.rq && !d.make) {   // also ask the other way round, where an answer belongs to one prompt only
    const n = {}; d.pairs.forEach(p => { n[p[1]] = (n[p[1]] || 0) + 1; });
    items = items.concat(d.pairs.filter(p => n[p[1]] === 1).map(p => ({ p: ask(d.rq, p[1]), a: p[0], note: p[2] || "", raw: p[1], pool: "p" })));
  }
  return { d, items };
}
function labIntro(id){
  const { d } = labDeck(id), L = labS();
  const list = d.list ? d.list() : d.pairs;
  $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}
    <div class="block stack lab-pop" style="text-align:center"><div style="font-size:46px" aria-hidden="true">${d.ico}</div><h1 style="margin:0">${esc(d.title)}</h1><p class="muted" style="margin:0">${esc(d.sub)} · 60 seconds · combos for answers in a row</p>
      <p style="margin:0">${L.best[d.id] ? "Your best: <b>" + L.best[d.id] + "</b>" : "First go — no pressure."}</p>
      <div class="row" style="justify-content:center"><button class="btn pri" type="button" id="labgo">▶ Start</button><button class="btn" type="button" id="labpairs">See all pairs</button>${d.lesson ? `<button class="btn ghost" type="button" id="lablesson">Read the lesson</button>` : ""}</div></div>
    <div id="labpairlist"></div></section>`;
  labBindHome();
  $("#labgo").onclick = () => labRun(id);
  $("#labpairs").onclick = () => { $("#labpairlist").innerHTML = `<div class="block"><h3>${list.length} pairs to know</h3><div class="lab-pairs">${list.map(p => `<div><span>${esc(p[0])}</span><b>${esc(p[1])}</b></div>`).join("")}</div></div>`; };
  const lb = $("#lablesson"); if (lb) lb.onclick = () => openLesson(d.lesson, "learn");
}
let LG = null;
function labRun(id){
  labStop();
  const { d, items } = labDeck(id);
  LG = { d, items: shuffle(items), i: 0, score: 0, right: 0, tried: 0, combo: 0, maxc: 0, left: 60, miss: [], lock: false };
  $("#app").innerHTML = `<section class="view stack lab-play">
    <div class="lab-hud"><button class="back" type="button" id="labquit">✕ Stop</button><span class="lab-combo" id="labcombo"></span><span class="sc" id="labscore">0</span></div>
    <div class="lab-time" id="labtime"><i style="width:100%"></i></div>
    <div class="lab-q" id="labq" aria-live="polite"></div>
    <div class="lab-opts" id="labopts"></div>
    <div class="lab-flash" id="labflash"></div></section>`;
  $("#labquit").onclick = () => { labStop(); labOver(); };
  labNext();
  LAB.timer = setInterval(() => {
    LG.left--; const t = $("#labtime"); if (!t) { labStop(); return; }
    t.firstElementChild.style.width = (LG.left / 60 * 100) + "%"; t.classList.toggle("low", LG.left <= 10);
    if (LG.left <= 0) { labStop(); labOver(); }
  }, 1000);
}
function labOptions(it){
  const d = LG.d;
  if (d.opts) return d.opts.slice();
  if (d.options) return d.options(it);
  // wrong options come from the same side of the deck as the answer (names with names, dates with dates)
  const answers = [...new Set(it.all || LG.items.filter(x => x.pool === it.pool).map(x => x.a))].filter(a => a !== it.a);
  const pool = shuffle(answers).slice(0, 3);
  return shuffle([it.a].concat(pool));
}
function labNext(){
  if (LG.i >= LG.items.length) { LG.items = shuffle(LG.items); LG.i = 0; }
  const it = LG.items[LG.i], opts = labOptions(it);
  LG.cur = it; LG.lock = false;
  const q = $("#labq"); q.innerHTML = `<span class="lab-pop">${esc(it.p)}</span>`;
  const box = $("#labopts"); box.className = "lab-opts" + (opts.length === 3 ? " three" : "");
  box.innerHTML = opts.map(o => `<button type="button" data-o="${esc(o)}">${esc(o)}</button>`).join("");
  box.querySelectorAll("button").forEach(b => b.onclick = () => labPick(b));
}
function labPick(b){
  if (LG.lock) return; LG.lock = true;
  const it = LG.cur, ok = b.dataset.o === it.a;
  LG.tried++;
  if (ok) {
    LG.right++; LG.combo++; LG.maxc = Math.max(LG.maxc, LG.combo);
    const gain = 10 + Math.min(LG.combo - 1, 5) * 2;
    LG.score += gain; b.classList.add("ok");
    $("#labflash").textContent = it.note ? it.note : "+" + gain;
  } else {
    LG.combo = 0; b.classList.add("no");
    $("#labopts").querySelectorAll("button").forEach(x => { if (x.dataset.o === it.a) x.classList.add("ok"); });
    LG.miss.push(it); $("#labflash").textContent = (it.note ? it.note + " · " : "") + "Answer: " + it.a;
  }
  $("#labscore").textContent = LG.score;
  $("#labcombo").textContent = LG.combo >= 2 ? "🔥 ×" + LG.combo : "";
  LG.i++;
  setTimeout(() => { if (LAB.timer && $("#labopts")) labNext(); }, ok ? 450 : 1200);
}
function labOver(){
  const L = labS(), id = LG.d.id, best = !L.best[id] || LG.score > L.best[id];
  if (best && LG.score > 0) L.best[id] = LG.score;
  L.xp = (L.xp || 0) + LG.right; L.plays = (L.plays || 0) + 1; save();
  const acc = LG.tried ? Math.round(LG.right * 100 / LG.tried) : 0, seen = new Set();
  const miss = LG.miss.filter(m => { if (seen.has(m.p)) return false; seen.add(m.p); return true; });
  const { r } = labRank(L.xp);
  $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}
    <div class="block lab-res lab-pop"><span class="eyebrow">${esc(LG.d.title)}</span><div class="big">${LG.score}</div>
      <p>${best && LG.score > 0 ? "🎉 New best!" : "Best: " + (L.best[id] || 0)} · ${LG.right}/${LG.tried} right (${acc}%) · longest combo ${LG.maxc} · +${LG.right} XP</p>
      <p class="muted" style="margin:0">${r[2]} ${r[1]} · ${L.xp} XP</p>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn pri" type="button" id="again">Play again</button><button class="btn" type="button" data-lab-home>More games</button></div></div>
    ${miss.length ? `<div class="block"><h3>Fix these ${miss.length}</h3><div class="lab-miss">${miss.map(m => `<div><span>${esc(m.p)}</span><b>${esc(m.a)}</b></div>`).join("")}</div></div>` : (LG.tried ? `<div class="block"><p style="margin:0">💯 No mistakes — try to beat your score.</p></div>` : "")}
  </section>`;
  labBindHome();
  $("#again").onclick = () => labRun(id);
}

/* ---------- memory match ---------- */
function labMatch(){
  labStop();
  const all = LAB_CONF.decks.find(d => d.id === LAB_CONF.match.deck).pairs, n = {};
  all.forEach(p => { n[p[1]] = (n[p[1]] || 0) + 1; });
  const pairs = shuffle(all.filter(p => n[p[1]] === 1)).slice(0, 6);
  const cards = shuffle(pairs.flatMap((p, i) => [{ k: i, t: p[0] }, { k: i, t: p[1] }]));
  const M = { cards, up: [], done: new Set(), moves: 0, t0: Date.now() };
  const draw = () => {
    $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}
      <div class="lab-hud"><div><span class="eyebrow">Memory Match</span><h2 style="margin:4px 0 0">${esc(LAB_CONF.match.title)}</h2></div><span class="sc">${M.moves} moves</span></div>
      <div class="mm">${M.cards.map((c, i) => `<button type="button" data-i="${i}" class="${M.done.has(c.k) ? "done" : M.up.includes(i) ? "up" : ""}" aria-label="${M.done.has(c.k) || M.up.includes(i) ? esc(c.t) : "Hidden card " + (i + 1)}">${M.done.has(c.k) || M.up.includes(i) ? esc(c.t) : "?"}</button>`).join("")}</div></section>`;
    labBindHome();
    $("#app").querySelectorAll(".mm button").forEach(b => b.onclick = () => flip(+b.dataset.i));
  };
  const flip = i => {
    if (M.up.length === 2 || M.up.includes(i) || M.done.has(M.cards[i].k)) return;
    M.up.push(i); draw();
    if (M.up.length === 2) {
      M.moves++;
      const [a, b] = M.up;
      if (M.cards[a].k === M.cards[b].k) { M.done.add(M.cards[a].k); M.up = []; setTimeout(() => { draw(); if (M.done.size === 6) done(); }, 250); }
      else setTimeout(() => { M.up = []; draw(); }, 900);
    }
  };
  const done = () => {
    const L = labS(), best = !L.match || M.moves < L.match; if (best) L.match = M.moves;
    L.xp = (L.xp || 0) + 12; L.plays = (L.plays || 0) + 1; save();
    $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}<div class="block lab-res lab-pop"><span class="eyebrow">Memory Match</span><div class="big">${M.moves}</div>
      <p>moves · ${Math.round((Date.now() - M.t0) / 1000)} s · ${best ? "🎉 New best!" : "Best: " + L.match + " moves"} · +12 XP</p>
      <div class="lab-pairs" style="text-align:left">${pairs.map(p => `<div><span>${esc(p[0])}</span><b>${esc(p[1])}</b></div>`).join("")}</div>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn pri" type="button" id="again">New cards</button><button class="btn" type="button" data-lab-home>More games</button></div></div></section>`;
    labBindHome(); $("#again").onclick = labMatch;
  };
  draw(); window.scrollTo(0, 0);
}


/* ---------- decks from the lessons' own tables ---------- */
/** Rows of a lesson's n-th table as [prompt, answer, note] (tags stripped), so a deck never repeats the data. */
function labRows(lessonId, n){
  const strip = s => String(s == null ? "" : s).replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&minus;/g, "−").trim();
  const l = LESSONS.find(x => x.id === lessonId), t = l ? l.blocks.filter(b => b.k === "table")[n || 0] : null;
  return t ? t.rows.map(r => [strip(r[0]), strip(r[1]), strip(r[2])]) : [];
}
/** A "grand mix" deck: a few rows from every listed deck, with each deck's own question wording. */
function labMix(decks){
  // wrong options come from the whole deck (all), so a deck drawn only once or twice in the 80 still has enough
  return shuffle(decks.flatMap(d => { const all = [...new Set(d.pairs.map(p => p[1]))];
    return d.pairs.map(p => ({ p: d.q ? `${d.q} ${p[0]}${/[?:]$/.test(d.q) ? "" : "?"}` : p[0], a: p[1], note: p[2] || "", pool: d.id, all })); })).slice(0, 80);
}

<script>
"use strict";
/* ============================================================
   Workbook engine — shared by the History and Computer Knowledge pages (tools/workbook/lib.js puts it in each one).
   APP.mode "era": a subject app with its own lessons and questions (Learn · Practice · Mock · Revise · Plan).
   APP.mode "hub": start here, a plan across a family of apps, and revision across all of them (no questions of its own).
   Optional data: APP.hub (a family hub to link to), HEATMAP (where the marks come from, by exam),
   a question's 8th field (the paper it was reported from), APP.tabs (the tabs, in order) — a tab the engine
   does not know (e.g. Chemistry's "lab") is drawn by the page's own script: render<Tab>() and, when you
   leave it, leave<Tab>().
   ============================================================ */
const HUB = APP.mode === "hub";
const EMBED = (() => { try { return window.parent !== window; } catch(e) { return true; } })();
const TABS = HUB ? ["start","plan","revise"] : (APP.tabs || ["learn","practice","mock","revise","plan"]);

/* ============================================================
   HELPERS & STATE
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hash = s => { let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5)+h + s.charCodeAt(i))|0; return "q"+(h>>>0).toString(36); };
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; };
const L = id => LESSONS.find(l => l.id === id);
const LNUM = id => LESSONS.findIndex(l => l.id === id) + 1;
const G = id => GROUPS.find(g => g.id === id) || GROUPS[0];
const A = id => APP.apps.find(a => a.id === id);
const appOf = id => (L(id) && L(id).app) || APP.id;       // in the hub, each lesson carries the app it lives in

const QS = QB.map(r => {
  const fixed = !!r[6];
  return { t:r[0], q:r[1], o:r[2], e:r[3], p:(r[4]||"").includes("p"), a: fixed ? (r[5]||0) : 0, fixed, id:hash(r[1]), src: r[7] || "" };
});
const byLesson = id => QS.filter(q => q.t === id);
const makePerm = q => q.fixed ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i));
const qCount = id => HUB ? null : byLesson(id).length;
const pCount = id => HUB ? ((APP.pcount||{})[id] || 0) : byLesson(id).filter(q=>q.p).length;

const KEY = APP.key;
let S = { ans:{}, bm:{}, les:{}, mocks:[], plan:null };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const record = (q, ok) => { S.ans[q.id] = ok ? 1 : 0; save(); renderTop(); };

/* Another History app's saved progress. Every page is on the same site, so the hub (and a
   plan) can see which lessons you have read and quizzed in the subject apps. */
function appState(a){ try { return JSON.parse(localStorage.getItem(a.key) || "{}") || {}; } catch(e) { return {}; } }
function lessonState(id){
  const owner = appOf(id);
  if (owner === APP.id) return S.les[id] || {};
  const a = A(owner); return a ? ((appState(a).les || {})[id] || {}) : {};
}
const lesDone = l => !!lessonState(l.id).done;
const heatDots = n => `<span class="dots" aria-label="Asked ${n===3?"almost every shift":n===2?"often":"now and then"}">${[1,2,3].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>`;

/* Open a lesson or a tab, here or in the History app it lives in. Inside पाठShala the
   app is asked to switch (so your session is tracked); on its own the page just navigates. */
function openApp(appId, lesson, tab){
  if (appId === APP.id) {
    if (lesson) openLesson(lesson, "learn"); else go(tab || TABS[0]);
    return;
  }
  const a = APP.hub && appId === APP.hub.id ? APP.hub : A(appId);
  if (!a) return;
  const here = () => { location.href = a.file + (lesson ? "?lesson=" + encodeURIComponent(lesson) : "") + (tab ? "#" + tab : ""); };
  if (!EMBED) return here();
  let ok = false;
  const onAck = e => { if (e.origin === location.origin && e.data && e.data.type === "shabd-open-ok") ok = true; };
  window.addEventListener("message", onAck);
  try { window.parent.postMessage({ type:"shabd-open", mod:a.id, lesson: lesson || null, tab: tab || null }, location.origin); } catch(e) {}
  setTimeout(() => { window.removeEventListener("message", onAck); if (!ok) here(); }, 700);
}
const hubLink = (before, label, tab, after) => APP.hub ? before + goLink(label, APP.hub.id, null, tab) + (after || "") : "";
const goLink = (label, appId, lesson, tab) => `<button type="button" class="golink" data-go="${esc(JSON.stringify([appId, lesson||null, tab||null]))}">${label}</button>`;
function bindGo(root){
  root.querySelectorAll("[data-go]").forEach(b => b.onclick = ev => { ev.stopPropagation(); const g = JSON.parse(b.dataset.go); openApp(g[0], g[1], g[2]); });
}

function renderTop(){
  if (HUB) {
    const done = LESSONS.filter(lesDone).length;
    $("#topstat").innerHTML = `<b>${done}</b>/${LESSONS.length} lessons<br>in ${APP.apps.length} apps`;

let TAB = TABS[0];
let timerId = null;
function go(tab){
  if (!TABS.includes(tab)) tab = TABS[0];
  const own = t => t.charAt(0).toUpperCase() + t.slice(1);
  if (TAB !== tab && typeof window["leave" + own(TAB)] === "function") window["leave" + own(TAB)]();
  TAB = tab;
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.tab===tab ? "page" : "false"));
  if (tab === "start") renderStart();
  if (tab === "learn") renderLearn();
  if (tab === "practice") renderPractice();
  if (tab === "mock") renderMock();
  if (tab === "revise") renderRevise();
  if (tab === "plan") renderPlan();
  if (!["start","learn","practice","mock","revise","plan"].includes(tab) && typeof window["render" + own(tab)] === "function") window["render" + own(tab)]();
  window.scrollTo(0,0);
  try { history.replaceState(null, "", location.pathname + location.search + "#" + tab); } catch(e) {}
}
document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => {
  if (TAB === "mock" && M && M.running && b.dataset.tab !== "mock") { go("mock"); showMockLeave(b.dataset.tab); return; }
  go(b.dataset.tab);
}));

function blockHTML(b){
  if (b.k==="p") return `<div class="plain"><p>${b.h}</p></div>`;
  if (b.k==="hot") return `<div class="hot"><span class="lab">Why it is asked</span>${b.h}</div>`;
  if (b.k==="story") return `<div class="story"><span class="lab">${esc(APP.storyLabel || "The story first \u00b7 two minutes")}</span>${b.h}${b.key?`<p class="key"><b>${esc(APP.keyLabel || "Carry this into the tables:")}</b> ${esc(b.key)}</p>`:""}</div>`;
  if (b.k==="trick") return `<div class="trick"><span class="lab">Trick</span>${b.h}</div>`;
  if (b.k==="trap") return `<div class="trap"><span class="lab">Trap · don't mix these up</span>${b.h}</div>`;
  if (b.k==="link") return `<div class="link"><span class="lab">Link it up</span>${b.h}</div>`;
  if (b.k==="ex") return `<div class="link"><span class="lab">Worked example</span>${b.h}</div>`;
  if (b.k==="facts") return `<div class="block"><h3>${b.title}</h3><dl class="facts">${b.rows.map(r=>`<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join("")}</dl></div>`;
  if (b.k==="tl") return `<div class="block"><h3>${b.title}</h3><ul class="tl">${b.rows.map(r=>`<li><span class="y">${r[0]}</span><span>${r[1]}</span></li>`).join("")}</ul></div>`;
  if (b.k==="table") return `<div class="block"><h3>${b.title}</h3><div class="tbl"><table><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  if (b.k==="fig") return `<div class="block${b.wide?" phblock":""}"><h3>${b.title}</h3><figure class="fig${b.wide?" wide":""}"${b.wide?` style="--minw:${b.wide}px"`:""}>${b.svg}<figcaption>${b.cap}</figcaption></figure></div>`;
  return typeof visBlock === "function" ? visBlock(b) : "";      // photos, maps, charts, timelines… from study-visual.js
}

let LQ = null;
function openLesson(id, step){
  if (HUB || !L(id) || appOf(id) !== APP.id) { openApp(appOf(id), id); return; }   // the hub shows lessons in their own app
  const l = L(id), i = LNUM(id);
  if (step === "quiz") { LQ = { id, list: shuffle(byLesson(id)).map(q => ({q, perm:makePerm(q)})), i:0, score:0, picked:null }; }
  const head = `<div class="lhead"><button class="back" type="button" id="lback">‹ Lessons</button></div>
    <span class="eyebrow">${esc(APP.title)} · Lesson ${i} of ${LESSONS.length} · ${l.hi}</span><h1>${esc(l.title)}</h1>
    <p class="muted" style="font-size:13px">Asked in CGL ${heatDots(l.heat)} ${l.heat===3?"— almost every shift":l.heat===2?"— often":"— now and then"}</p>
    <div class="steps" role="tablist">
      <button type="button" data-step="learn" aria-current="${step==="learn"?"step":"false"}">1 · Learn</button>
      <button type="button" data-step="quiz" aria-current="${step==="quiz"?"step":"false"}">2 · Quiz</button>
      <button type="button" data-step="sum" aria-current="${step==="sum"?"step":"false"}">3 · Summary</button>
    </div>`;
  let body = "";
  if (step === "learn") {
    body = `<div class="stack">${l.blocks.map(blockHTML).join("")}
      <div class="row end"><button class="btn pri" type="button" id="toquiz">Take the quiz · ${byLesson(id).length} questions</button></div></div>`;
  } else if (step === "quiz") {
    body = `<div id="lq"></div>`;
  } else {
    const nxt = LESSONS[i];
    body = `<div class="stack"><div class="block"><h3>Remember these</h3><ul class="sum">${l.sum.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
      <div class="row between"><button class="btn" type="button" id="relearn">Read again</button>
      ${nxt ? `<button class="btn pri" type="button" id="nextles">Next: ${esc(nxt.title)}</button>` : `<button class="btn pri" type="button" id="tomock">Take a mock test</button>`}</div></div>`;
    S.les[id] = Object.assign(S.les[id]||{}, {done:1}); save(); renderTop();
  }
  $("#app").innerHTML = `<section class="view stack">${head}${body}</section>`;
  $("#lback").onclick = () => go("learn");
  $("#app").querySelectorAll("[data-step]").forEach(b => b.onclick = () => openLesson(id, b.dataset.step));
  if (step==="learn") $("#toquiz").onclick = () => openLesson(id,"quiz");
  if (step==="quiz") renderLQ();
  if (step==="sum") {
    $("#relearn").onclick = () => openLesson(id,"learn");
    const n = $("#nextles"); if (n) n.onclick = () => openLesson(LESSONS[i].id,"learn");
    const m = $("#tomock"); if (m) m.onclick = () => go("mock");
  }
  window.scrollTo(0,0);
}

function optsHTML(q, perm, state){
  return perm.map((oi, k) => {
    let cls = "opt";
    if (state.reveal) { if (oi === q.a) cls += " ok"; else if (oi === state.picked) cls += " no"; }
    else if (state.sel === oi) cls += " sel";
    return `<button type="button" class="${cls}" data-oi="${oi}" ${state.reveal?"disabled":""}><span class="k">${"ABCD"[k]}</span><span>${esc(q.o[oi])}</span></button>`;
  }).join("");
}
function expHTML(q, picked){
  const ok = picked === q.a;
  return `<div class="exp">${ok ? `<b class="okl">Correct.</b>` : `<b class="nol">Answer: ${esc(q.o[q.a])}.</b>`} ${esc(q.e)}</div>`;
}
function metaHTML(q, no){
  return `<div class="qmeta"><span class="qno">${no}</span><span class="tag">L${LNUM(q.t)} \u00b7 ${esc(L(q.t).title)}</span>${q.src?`<span class="tag src" title="Reported by candidates after this paper (memory-based)">\ud83d\udcdc ${esc(q.src)}</span>`:""}${q.p?`<span class="tag pyq" title="This fact comes up again and again in SSC papers">Repeatedly asked</span>`:""}
  <button type="button" class="bm" data-bm="${q.id}" aria-pressed="${S.bm[q.id]?"true":"false"}" aria-label="Bookmark">${S.bm[q.id]?"★":"☆"}</button></div>`;
}

function renderLQ(){
  const box = $("#lq");
  if (LQ.i >= LQ.list.length) {
    const n = LQ.list.length;
    const st = S.les[LQ.id] || {}; st.best = Math.max(st.best||0, LQ.score); S.les[LQ.id] = st; save();
    box.innerHTML = `<div class="stack"><div class="block stack"><span class="eyebrow">Quiz done</span>
      <div class="scorebig"><span class="num">${LQ.score}</span><span class="muted">/ ${n} correct</span></div>
      <p class="muted">${LQ.score===n ? "Full marks." : LQ.score >= n*0.8 ? "Strong. Review the ones you missed under Practice → Mistakes." : "Read the story and the Trap boxes once more, then retry. Missed questions are saved under Practice → Mistakes."}</p></div>
      <div class="row between"><button class="btn" type="button" id="retry">Retry quiz</button><button class="btn pri" type="button" id="tosum">See summary</button></div></div>`;
    $("#retry").onclick = () => openLesson(LQ.id,"quiz");
    $("#tosum").onclick = () => openLesson(LQ.id,"sum");
    return;
  }
  const it = LQ.list[LQ.i], q = it.q;
  const reveal = LQ.picked !== null;
  box.innerHTML = `<div class="stack"><div class="meter"><i style="width:${LQ.i/LQ.list.length*100}%"></i></div>
    <article class="qcard">${metaHTML(q, `Q${LQ.i+1}/${LQ.list.length}`)}
    <p class="qt">${esc(q.q)}</p><div class="opts">${optsHTML(q, it.perm, {picked:LQ.picked, reveal})}</div>
    ${reveal ? expHTML(q, LQ.picked) : ""}</article>
    ${reveal ? `<div class="row end"><button class="btn pri" type="button" id="lqnext">${LQ.i+1 < LQ.list.length ? "Next question" : "Finish"}</button></div>` : `<p class="muted" style="font-size:13px">Score so far: <span class="num">${LQ.score}</span></p>`}</div>`;
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (LQ.picked !== null) return;
    LQ.picked = +b.dataset.oi; const ok = LQ.picked === q.a; if (ok) LQ.score++; record(q, ok); renderLQ();
  });
  bindBM(box);
  const nx = $("#lqnext"); if (nx) nx.onclick = () => { LQ.i++; LQ.picked = null; renderLQ(); window.scrollTo(0,0); };
}

function bindBM(root){
  root.querySelectorAll("[data-bm]").forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    const id = b.dataset.bm; if (S.bm[id]) delete S.bm[id]; else S.bm[id] = 1; save();
    b.setAttribute("aria-pressed", S.bm[id] ? "true":"false"); b.textContent = S.bm[id] ? "★" : "☆";
  });
}

/* ============================================================
   PRACTICE
   ============================================================ */
let PF = "all", PSHOW = 20, PORDER = null, PPERM = {}, PPICK = {};
const hasHot = () => LESSONS.some(l => l.heat === 3) && LESSONS.some(l => l.heat !== 3);
function practiceList(){
  let list = QS;
  if (PF === "pyq") list = QS.filter(q => q.p);
  else if (PF === "src") list = QS.filter(q => q.src);
  else if (PF === "hot") list = QS.filter(q => L(q.t).heat === 3);
  else if (PF === "wrong") list = QS.filter(q => S.ans[q.id] === 0);
  else if (PF === "new") list = QS.filter(q => S.ans[q.id] === undefined);
  else if (PF === "bm") list = QS.filter(q => S.bm[q.id]);
  else if (PF !== "all") list = QS.filter(q => q.t === PF);
  if (PORDER) { const pos = new Map(PORDER.map((id,i)=>[id,i])); list = list.slice().sort((a,b)=>(pos.get(a.id)??0)-(pos.get(b.id)??0)); }
  return list;
}
function renderPractice(){
  const wrongN = QS.filter(q => S.ans[q.id] === 0).length, bmN = QS.filter(q=>S.bm[q.id]).length;
  const pyqN = QS.filter(q=>q.p).length, hotN = QS.filter(q=>L(q.t).heat===3).length;
  const chips = [["all",`All ${QS.length}`],["new","Not tried"],["wrong",`Mistakes ${wrongN}`]]
    .concat(hasHot() ? [["hot",`Most-asked topics ${hotN}`]] : [])
    .concat(QS.some(q => q.src) ? [["src",`Reported in papers ${QS.filter(q=>q.src).length}`]] : [])
    .concat([["pyq",`Repeatedly asked ${pyqN}`],["bm",`Starred ${bmN}`]])
    .concat(LESSONS.map(l=>[l.id,`L${LNUM(l.id)} ${l.title}`]));
  const list = practiceList();
  $("#app").innerHTML = `<section class="view stack">
    <div class="stack" style="gap:6px"><span class="eyebrow">Question bank · ${QS.length} questions</span><h1>Practice</h1>
    <p class="muted">Tap an option to check it. Wrong answers go to <b>Mistakes</b> until you get them right. <b>Repeatedly asked</b> marks the facts that come up again and again in SSC papers${hasHot() ? "; <b>Most-asked topics</b> is every question from the three-dot lessons" : ""}.</p></div>
    <div class="chips" role="group" aria-label="Filter">${chips.map(c=>`<button type="button" class="chip" data-f="${c[0]}" aria-pressed="${PF===c[0]}">${esc(c[1])}</button>`).join("")}</div>
    <div class="row between"><span class="muted num" style="font-size:13px">${list.length} questions</span>
      <div class="row"><button class="btn sm ghost" type="button" id="pshuf">${PORDER?"In order":"Shuffle"}</button></div></div>
    <div class="stack" id="plist"></div>
  </section>`;
  $("#app").querySelectorAll("[data-f]").forEach(b => b.onclick = () => { PF = b.dataset.f; PSHOW = 20; PPICK = {}; renderPractice(); });
  $("#pshuf").onclick = () => { PORDER = PORDER ? null : shuffle(QS.map(q=>q.id)); PSHOW = 20; renderPractice(); };
  const chipOn = $(`.chip[aria-pressed="true"]`); if (chipOn) chipOn.scrollIntoView({block:"nearest", inline:"center"});
  drawPList();
}
function pCard(q, idx){
  if (!PPERM[q.id]) PPERM[q.id] = makePerm(q);
  const picked = PPICK[q.id]; const reveal = picked !== undefined;
  return `<article class="qcard" data-q="${q.id}">${metaHTML(q, "Q"+(idx+1))}<p class="qt">${esc(q.q)}</p>
    <div class="opts">${optsHTML(q, PPERM[q.id], {picked: reveal?picked:null, reveal})}</div>${reveal?expHTML(q,picked):""}</article>`;
}
function drawPList(){
  const list = practiceList(), box = $("#plist");
  if (!list.length) { box.innerHTML = `<p class="empty">${PF==="wrong"?"No mistakes saved. Answer some questions first, or you've cleared them all.":PF==="bm"?"Nothing starred yet. Tap ☆ on any question.":"Nothing here."}</p>`; return; }
  box.innerHTML = list.slice(0, PSHOW).map((q,i)=>pCard(q,i)).join("") + (list.length > PSHOW ? `<button class="btn" type="button" id="pmore">Show 20 more (${list.length-PSHOW} left)</button>` : "");
  box.querySelectorAll(".qcard").forEach(bindCard);
  const more = $("#pmore"); if (more) more.onclick = () => { PSHOW += 20; drawPList(); };
}
function bindCard(card){
  card.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const q = QS.find(x => x.id === card.dataset.q); if (PPICK[q.id] !== undefined) return;
    PPICK[q.id] = +b.dataset.oi; record(q, PPICK[q.id] === q.a);
    const idx = +card.querySelector(".qno").textContent.slice(1) - 1;
    const tmp = document.createElement("div"); tmp.innerHTML = pCard(q, idx); const nc = tmp.firstElementChild;
    card.replaceWith(nc); bindCard(nc);
  });
  bindBM(card);
}

let M = null, MCFG = {n:25, scope:"all", neg:1}, LEAVE_TO = null;
function mockPool(scope){
  if (scope === "all") return QS;
  if (scope === "pyq") return QS.filter(q=>q.p);
  if (scope === "src") return QS.filter(q=>q.src);
  if (scope === "hot") return QS.filter(q=>L(q.t).heat===3);
  if (scope === "wrong") return QS.filter(q=>S.ans[q.id]===0);
  return QS.filter(q=>q.t===scope);
}
function renderMock(){
  if (M && M.running) return drawMockRun();
  if (M && M.done) return drawMockResult();
  const hist = (S.mocks||[]).slice(-6).reverse();
  $("#app").innerHTML = `<section class="view stack">
    <div class="stack" style="gap:6px"><span class="eyebrow">Timed, SSC pattern</span><h1>Mock test</h1>

function showMockLeave(tab){ LEAVE_TO = tab; drawMockRun(); }
function submitMock(){
  if (!M || !M.running) return;
  clearInterval(timerId);
  M.running = false; M.done = true; M.confirm = false;
  let c=0,w=0,sk=0; const per = {};
  M.list.forEach((it,k) => {
    const a = M.ans[k], t = it.q.t; per[t] = per[t] || {c:0,n:0}; per[t].n++;
    if (a===null) sk++; else if (a===it.q.a) { c++; per[t].c++; S.ans[it.q.id]=1; } else { w++; S.ans[it.q.id]=0; }
  });
  const max = M.list.length*2, score = +(c*2 - (M.neg? w*0.5 : 0)).toFixed(1);
  const used = Math.min(M.secs, Math.round((Date.now()-M.start)/1000));
  M.res = {c,w,sk,score,max,used,per, acc: (c+w) ? Math.round(c*100/(c+w)) : 0};
  const d = new Date(); const ds = d.toLocaleDateString("en-IN",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
  S.mocks = (S.mocks||[]).concat([{d:ds, n:M.list.length, score, max, acc:M.res.acc}]).slice(-20); save(); renderTop();
  M.filter = "wrong";
  if (TAB==="mock") drawMockResult();
}
function drawMockResult(){
  const r = M.res;

  const rows = M.list.map((it,k)=>({it,k})).filter(({it,k}) => M.filter==="all" ? true : M.filter==="wrong" ? (M.ans[k]!==null && M.ans[k]!==it.q.a) : M.ans[k]===null);
  $("#app").innerHTML = `<section class="view stack">
    <div class="stack" style="gap:6px"><span class="eyebrow">Result</span>
    <div class="scorebig"><span class="num">${r.score}</span><span class="muted">/ ${r.max} marks</span></div></div>
    <div class="kpis"><div class="kpi g"><span class="num">${r.c}</span><span>right</span></div><div class="kpi b"><span class="num">${r.w}</span><span>wrong</span></div><div class="kpi"><span class="num">${r.sk}</span><span>skipped</span></div><div class="kpi"><span class="num">${r.acc}%</span><span>accuracy</span></div></div>
    <p class="muted num" style="font-size:13px">Time used ${fmt(r.used)} of ${fmt(M.secs)}</p>

    <div class="row between"><button class="btn" type="button" id="mnew">New test</button><button class="btn pri" type="button" id="mretry">Retake same questions</button></div>
    <h2>Review</h2>
    <div class="chips">${[["wrong",`Wrong ${r.w}`],["skip",`Skipped ${r.sk}`],["all",`All ${M.list.length}`]].map(c=>`<button class="chip" type="button" data-rf="${c[0]}" aria-pressed="${M.filter===c[0]}">${c[1]}</button>`).join("")}</div>
    <div class="stack">${rows.length ? rows.map(({it,k}) => `<article class="qcard">${metaHTML(it.q, "Q"+(k+1))}<p class="qt">${esc(it.q.q)}</p><div class="opts">${optsHTML(it.q, it.perm, {picked:M.ans[k], reveal:true})}</div>${M.ans[k]===null?`<div class="exp"><b class="nol">Skipped. Answer: ${esc(it.q.o[it.q.a])}.</b> ${esc(it.q.e)}</div>`:expHTML(it.q, M.ans[k])}</article>`).join("") : `<p class="empty">Nothing in this list.</p>`}</div>
  </section>`;
  bindBM($("#app"));
  $("#app").querySelectorAll("[data-rf]").forEach(b => b.onclick = () => { M.filter = b.dataset.rf; drawMockResult(); });
  $("#mnew").onclick = () => { M = null; renderMock(); };
  $("#mretry").onclick = () => {
    const list = M.list.map(it=>({q:it.q, perm:makePerm(it.q)}));
    M = { running:true, list, ans:list.map(()=>null), mark:list.map(()=>false), i:0, neg:MCFG.neg, secs:list.length*36, start:Date.now(), showPal:false, confirm:false };
    M.end = M.start + M.secs*1000; startTimer(); drawMockRun();
  };
}

function digestGroups(list){

}

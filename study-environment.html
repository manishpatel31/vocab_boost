<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>

<title>Environment &amp; Ecology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Shared by every History page (built by tools/history/build.js).
   Layout: a manuscript folio — parchment paper, maroon ink, gold figures; one-column app with a bottom tab bar. */
:root{
  --paper:#f3efe4; --sheet:#fffdf6; --sunk:#e8e1cf;
  --ink:#241c14; --ink2:#5d5141; --rule:#d8cdb4;
  --blue:#7a2230; --on-blue:#ffffff; --blue-bg:#f4e2e1;
  --accent:#9a6a12; --accent-bg:#f8ecc9;
  --good:#1b6b4a; --good-bg:#ddefe4; --bad:#a8291f; --bad-bg:#f8e0dc;
  --warn-bg:#fcf0cf;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* era groups on the Learn screen */
.eras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.erac{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:grid;gap:6px}
.erac b{font-family:var(--f-display);font-size:15px;font-weight:700;line-height:1.25}
.erac .hi{font-size:12px;color:var(--ink2)}
.erac .mt{font-family:var(--f-num);font-size:11px;color:var(--ink2)}
.erac .meter{height:6px}
.erac[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.grph{display:flex;align-items:baseline;gap:8px;padding:14px 2px 4px;border-top:2px solid var(--ink);margin-top:4px}
.grph h2{font-size:17px}
.grph span{font-size:12px;color:var(--ink2);margin-left:auto;font-family:var(--f-num)}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}
.dots{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--rule);display:block}
.dots i.on{background:var(--accent)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.hot{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px;font-size:15px}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.facts.prose dd{font-weight:400;line-height:1.55}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap,.link{border-radius:var(--r);padding:12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.link{background:var(--sunk);border-color:transparent}
.trick .lab,.trap .lab,.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.link .lab{color:var(--ink2)}
.mn{font-family:var(--f-num);font-weight:600;background:var(--sheet);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.tag.src{background:var(--good-bg);color:var(--good)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:22px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
/* one-line revision rows (last week / last moment) */
.lines{display:grid;gap:0}
.lines div{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px dashed var(--rule);font-size:15px}
.lines div:first-child{border-top:0}
.lines b{font-weight:700}
.lines span{color:var(--ink2)}
.callout{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;font-size:15px}

/* plan maker */
.plancfg{display:grid;gap:12px}
.pday{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.pday > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pday > summary::-webkit-details-marker{display:none}
.pday .dno{font-family:var(--f-num);font-weight:700;font-size:13px;background:var(--sunk);border-radius:99px;padding:2px 10px;white-space:nowrap}
.pday.cur .dno{background:var(--blue);color:var(--on-blue)}
.pday.allgood .dno{background:var(--good-bg);color:var(--good)}
.pday .dt{min-width:0;font-weight:600;font-size:15px}
.pday .dt small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
.pday .dp{font-family:var(--f-num);font-size:12px;color:var(--ink2);white-space:nowrap}
.pday .body{padding:0 14px 12px;display:grid;gap:8px;border-top:1px dashed var(--rule);margin-top:2px;padding-top:10px}
.ptask{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;width:100%;font-size:15px}
.ptask .box{width:22px;height:22px;border-radius:6px;border:1.6px solid var(--rule);display:grid;place-items:center;font-size:14px;color:var(--on-blue);margin-top:1px}
.ptask[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.ptask[aria-pressed="true"] .lbl{text-decoration:line-through;color:var(--ink2)}
.ptask .lbl small{display:block;font-size:12px;color:var(--ink2);text-decoration:none}
/* the story first: plain-language opener for beginners */
.story{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;font-size:16.5px;line-height:1.65}
.story .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.story p{margin:0}
.story .key{background:var(--blue-bg);border-radius:8px;padding:8px 12px;font-size:15px;line-height:1.5}
.story .key b{color:var(--blue)}
/* hub: app cards and the beginner path */
.appcs{display:grid;gap:12px}
.appc{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;text-align:left;width:100%;cursor:pointer}
.appc:hover{border-color:var(--blue)}
.appc .hd{display:flex;align-items:center;gap:10px}
.appc .ic{font-size:26px;line-height:1}

.appc .hd small{font-size:12px;color:var(--ink2)}

{"id":"E1","heat":2,"title":"Ecology: key terms and who coined them","hi":"पारिस्थितिकी: मुख्य शब्द और उनके जनक","blocks":[{"k":"hot","h":"SSC asks the <b>meaning of ecological terms<\/b> (niche, ecotone, biome, ecosystem), <b>who coined<\/b> them (Haeckel — ecology, Tansley — ecosystem) and the <b>type of interaction<\/b> in an example (lichen = mutualism, Cuscuta = parasitism)."},{"k":"story","h":"<p>In 1866 the German biologist <b>Ernst Haeckel<\/b> gave a name to the study of living things and their homes: <b>ecology<\/b>, from the Greek <i>oikos<\/i>, house. In 1935 <b>A. G. Tansley<\/b> joined the living and the non-living into one working unit and called it the <b>ecosystem<\/b>. Inside it, every species has an address — its <b>habitat<\/b> — and a job — its <b>niche<\/b>.<\/p><p>Living things also deal with each other. In a <b>lichen<\/b>, an alga and a fungus both gain (<b>mutualism<\/b>). An orchid sits on a mango tree without harming it (<b>commensalism<\/b>). <b>Cuscuta<\/b> sucks food from its host (<b>parasitism<\/b>). Where two ecosystems meet, as in a mangrove, we get an <b>ecotone<\/b>, often richer in species — the <b>edge effect<\/b>.<\/p>","key":"Ecology — Haeckel 1866; ecosystem — Tansley 1935; habitat = address, niche = job; lichen = mutualism; Cuscuta = parasitism."},{"k":"table","title":"Ecological terms","head":["Term","Meaning","Note"],"rows":[["Ecology","Study of living things and their surroundings","The word comes from Greek 'oikos' (house)."],["Habitat","The place where an organism naturally lives",""],["Ecological niche","The role a species plays in its community","Its 'profession', not its 'address'."],["Population","All the individuals of one species in an area",""],["Community","All the populations of different species living together in an area",""],["Ecosystem","Living things and their non-living surroundings working as one unit","The basic functional unit of ecology."],["Biome","A large region with its own typical climate, plants and animals","Tundra, taiga, desert, rainforest."],["Biosphere","The part of the Earth where life exists","Land, water and lower air together."],["Ecotone","A transition zone between two ecosystems","Example: a mangrove between land and sea."],["Edge effect","More kinds of species found in a transition zone",""],["Carrying capacity","The largest population an environment can support",""],["Ecological succession","The gradual change of a community over time to a stable climax","Starts with pioneer species such as lichens."]]},{"k":"table","title":"Who coined the term","head":["Term / idea","Given by","Note"],"rows":[["Ecology","Ernst Haeckel","German biologist, 1866."],["Ecosystem","A. G. Tansley","British ecologist, 1935."],["Biosphere","Eduard Suess","Austrian geologist, 1875."],["Biodiversity","Walter G. Rosen","Coined in 1985; made popular by E. O. Wilson."],["Biodiversity hotspot","Norman Myers","British ecologist, 1988."],["Ecological pyramid","Charles Elton","1927 — also called the Eltonian pyramid."],["Ten per cent law of energy transfer","Raymond Lindeman","1942."],["Ecological niche","Joseph Grinnell","American biologist, 1917."],["Gaia hypothesis","James Lovelock","The Earth behaves like one self-regulating system."]]},{"k":"table","title":"How species interact","head":["Example","Interaction","Note"],"rows":[["Lichen (an alga and a fungus living together)","Mutualism","Both partners gain."],["Bees visiting flowers for nectar","Mutualism","Bees get food; flowers get pollinated."],["Rhizobium bacteria in pea root nodules","Mutualism",""],["An orchid growing on a mango tree","Commensalism","The orchid gains a place in the light; the tree is unaffected."],["Barnacles riding on a whale","Commensalism",""],["Cuscuta (amarbel) on a host plant","Parasitism","Cuscuta has no leaves and sucks food from its host."],["A tiger hunting a deer","Predation",""],["Penicillium mould stopping the growth of bacteria","Amensalism","One is harmed, the other gains nothing."],["Two species fighting for the same food","Competition","Both lose."]]},{"k":"cards","title":"Interactions at a glance","rows":[["Mutualism","+ / +","Both gain — e.g. Lichen","🤝"],["Commensalism","+ / 0","One gains, the other is unaffected — e.g. An orchid growing on a mango tree","🌿"],["Parasitism","+ / −","The parasite gains, the host is harmed — e.g. Cuscuta (amarbel) on a host plant","🦠"],["Predation","+ / −","The predator eats the prey — e.g. A tiger hunting a deer","🐅"],["Amensalism","0 / −","One is harmed, the other is unaffected — e.g. Penicillium mould stopping the growth of bacteria","🍄"],["Competition","− / −","Both lose — e.g. Two species fighting for the same food","⚔️"]]},{"k":"facts","title":"Levels of organisation (small to large)","rows":[["1","Organism"],["2","Population — one species"],["3","Community — many species"],["4","Ecosystem — community + non-living surroundings"],["5","Biome — a large climate region"],["6","Biosphere — all life on Earth"]]},{"k":"info","title":"From one organism to the whole biosphere","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 640 300\" role=\"img\" aria-label=\"Levels of organisation from organism to biosphere\">\n  <circle cx=\"160\" cy=\"150\" r=\"144\" fill=\"#7d4fb5\" opacity=\"0.16\" stroke=\"#7d4fb5\" stroke-width=\"1.5\" class=\"anim-in\" style=\"animation-delay:0ms\"/><circle cx=\"160\" cy=\"150\" r=\"122\" fill=\"#2f6db5\" opacity=\"0.18\" stroke=\"#2f6db5\" stroke-width=\"1.5\" class=\"anim-in\" style=\"animation-delay:120ms\"/><circle cx=\"160\" cy=\"150\" r=\"100\" fill=\"#1f8a8a\" opacity=\"0.2\" stroke=\"#1f8a8a\" stroke-width=\"1.5\" class=\"anim-in\" style=\"animation-delay:240ms\"/><circle cx=\"160\" cy=\"150\" r=\"78\" fill=\"#2f8f4e\" opacity=\"0.22000000000000003\" stroke=\"#2f8f4e\" stroke-width=\"1.5\" class=\"anim-in\" style=\"animation-delay:360ms\"/><circle cx=\"160\" cy=\"150\" r=\"56\" fill=\"#d4a017\" opacity=\"0.24\" stroke=\"#d4a017\" stroke-width=\"1.5\" class=\"anim-in\" style=\"animation-delay:480ms\"/><circle cx=\"160\" cy=\"150\" r=\"34\" fill=\"#c0503a\" opacity=\"0.26\" stroke=\"#c0503a\" stroke-width=\"1.5\" class=\"anim-in\" style=\"animation-delay:600ms\"/>\n  <line x1=\"188\" y1=\"148\" x2=\"330\" y2=\"40\" stroke=\"#c0503a\" stroke-width=\"1.2\"/><circle cx=\"330\" cy=\"40\" r=\"4\" fill=\"#c0503a\"/>\n    <text x=\"342\" y=\"44\" font-size=\"15\" class=\"b\" style=\"fill:#c0503a\">1. Organism<\/text><line x1=\"210\" y1=\"148\" x2=\"330\" y2=\"84\" stroke=\"#d4a017\" stroke-width=\"1.2\"/><circle cx=\"330\" cy=\"84\" r=\"4\" fill=\"#d4a017\"/>\n    <text x=\"342\" y=\"88\" font-size=\"15\" class=\"b\" style=\"fill:#d4a017\">2. Population<\/text><line x1=\"232\" y1=\"148\" x2=\"330\" y2=\"128\" stroke=\"#2f8f4e\" stroke-width=\"1.2\"/><circle cx=\"330\" cy=\"128\" r=\"4\" fill=\"#2f8f4e\"/>\n    <text x=\"342\" y=\"132\" font-size=\"15\" class=\"b\" style=\"fill:#2f8f4e\">3. Community<\/text><line x1=\"254\" y1=\"148\" x2=\"330\" y2=\"172\" stroke=\"#1f8a8a\" stroke-width=\"1.2\"/><circle cx=\"330\" cy=\"172\" r=\"4\" fill=\"#1f8a8a\"/>\n    <text x=\"342\" y=\"176\" font-size=\"15\" class=\"b\" style=\"fill:#1f8a8a\">4. Ecosystem<\/text><line x1=\"276\" y1=\"148\" x2=\"330\" y2=\"216\" stroke=\"#2f6db5\" stroke-width=\"1.2\"/><circle cx=\"330\" cy=\"216\" r=\"4\" fill=\"#2f6db5\"/>\n    <text x=\"342\" y=\"220\" font-size=\"15\" class=\"b\" style=\"fill:#2f6db5\">5. Biome<\/text><line x1=\"298\" y1=\"148\" x2=\"330\" y2=\"260\" stroke=\"#7d4fb5\" stroke-width=\"1.2\"/><circle cx=\"330\" cy=\"260\" r=\"4\" fill=\"#7d4fb5\"/>\n    <text x=\"342\" y=\"264\" font-size=\"15\" class=\"b\" style=\"fill:#7d4fb5\">6. Biosphere<\/text>\n  <text x=\"160\" y=\"155\" text-anchor=\"middle\" font-size=\"12\" class=\"b\">you<\/text><\/svg><\/figure>","cap":"Each level holds the one inside it: a population is one species; a community is many species; add the non-living world and it is an ecosystem."},{"k":"trick","h":"Levels in order — <b>“Old People Create Every Big Song”<\/b>: <b>O<\/b>rganism, <b>P<\/b>opulation, <b>C<\/b>ommunity, <b>E<\/b>cosystem, <b>B<\/b>iome, <b>S<\/b>phere (biosphere). Interactions by signs: <b>++ mutualism, +0 commensalism, +− parasitism/predation, −0 amensalism, −− competition<\/b>."},{"k":"trap","h":"<b>Habitat ≠ niche<\/b>: habitat is where it lives, niche is what it does. <b>Ecosystem<\/b> was coined by <b>Tansley<\/b>, not Haeckel (Haeckel coined <b>ecology<\/b>). <b>Biosphere<\/b> is from <b>Eduard Suess<\/b>, a geologist."}],"sum":["Ecology was coined by Ernst Haeckel (1866); ecosystem by A. G. Tansley (1935).","Habitat is where a species lives; niche is the role it plays.","An ecotone is a transition zone between two ecosystems; it often shows the edge effect.","Lichen and Rhizobium-legume are mutualism; orchid on a tree is commensalism; Cuscuta is parasitism.","Biodiversity was coined by Walter Rosen (1985); biodiversity hotspot by Norman Myers (1988)."],"part":["Part 1 · Ecology and ecosystems","पारिस्थितिकी और पारितंत्र"],"g":"en"},
{"id":"E2","heat":3,"title":"Ecosystems, food chains and pyramids","hi":"पारितंत्र, खाद्य श्रृंखला और पिरामिड","blocks":[{"k":"hot","h":"Asked every year: the <b>10% law<\/b> (Lindeman), <b>producers vs consumers vs decomposers<\/b>, which <b>pyramid is always upright<\/b> (energy) and which can be <b>inverted<\/b> (biomass in the sea, numbers in a parasitic chain)."},{"k":"story","h":"<p>All energy in an ecosystem starts with the <b>Sun<\/b>. Green plants — the <b>producers<\/b> — catch it in photosynthesis. A grasshopper eats the grass (<b>primary consumer<\/b>), a frog eats the grasshopper (<b>secondary consumer<\/b>), a snake eats the frog, and an eagle eats the snake. Each step is a <b>trophic level<\/b>. When anything dies, <b>decomposers<\/b> — bacteria and fungi — return its nutrients to the soil.<\/p><p>At each step only about <b>10%<\/b> of the energy passes on; the rest is lost as heat. This is <b>Lindeman's ten per cent law<\/b> (1942). So food chains are short (usually 4–5 links) and the <b>pyramid of energy is always upright<\/b>. Energy flows <b>one way<\/b>; nutrients go round in <b>cycles<\/b>. Many food chains linked together make a <b>food web<\/b>.<\/p>","key":"Sun → producer → herbivore → carnivore; only 10% passes on (Lindeman); energy flows one way, nutrients cycle; pyramid of energy is always upright."},{"k":"table","title":"Who plays which role","head":["Organism","Role","Note"],"rows":[["grass","Producer (first trophic level)","Green plants make their own food — they are autotrophs."],["phytoplankton in a pond","Producer (first trophic level)",""],["a grasshopper eating grass","Primary consumer (herbivore)",""],["a deer","Primary consumer (herbivore)",""],["a frog that eats grasshoppers","Secondary consumer",""],["a snake that eats frogs","Tertiary consumer",""],["an eagle at the end of the chain","Top (apex) consumer",""],["bacteria and fungi","Decomposers","They break dead matter into simple nutrients."],["an earthworm feeding on dead leaves","Detritivore",""],["a vulture eating a dead animal","Scavenger",""]]},{"k":"info","title":"A grazing food chain","html":"<figure class=\"fig wide\" style=\"--minw:640px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 210\" role=\"img\" aria-label=\"Food chain from grass to eagle with energy falling ten times at each step\">\n  <defs><marker id=\"fcA\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#c69214\"/><\/marker><\/defs>\n  <g class=\"anim-in\" style=\"animation-delay:0ms\"><rect x=\"20\" y=\"40\" width=\"108\" height=\"96\" rx=\"14\" class=\"card\"/>\n    <text x=\"74\" y=\"82\" text-anchor=\"middle\" font-size=\"32\">🌾<\/text><text x=\"74\" y=\"106\" text-anchor=\"middle\" font-size=\"14\" class=\"b\">Grass<\/text>\n    <text x=\"74\" y=\"124\" text-anchor=\"middle\" font-size=\"10\" class=\"mut\">Producer<\/text>\n    <rect x=\"14\" y=\"150\" width=\"120\" height=\"14\" rx=\"4\" fill=\"#c69214\" opacity=\".8\"/>\n    <text x=\"74\" y=\"182\" text-anchor=\"middle\" font-size=\"12\" class=\"b acc-t\">10,000 J<\/text><\/g><path d=\"M130 88 L148 88\" fill=\"none\" stroke=\"#c69214\" stroke-width=\"3\" stroke-linecap=\"round\" marker-end=\"url(#fcA)\"/><path d=\"M130 88 L148 88\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.2\" stroke-dasharray=\"2 7\" class=\"rvf\" style=\"animation:rvflow 1.1s linear infinite\"/><g class=\"anim-in\" style=\"animation-delay:180ms\"><rect x=\"154\" y=\"40\" width=\"108\" height=\"96\" rx=\"14\" class=\"card\"/>\n    <text x=\"208\" y=\"82\" text-anchor=\"middle\" font-size=\"32\">🦗<\/text><text x=\"208\" y=\"106\" text-anchor=\"middle\" font-size=\"14\" class=\"b\">Grasshopper<\/text>\n    <text x=\"208\" y=\"124\" text-anchor=\"middle\" font-size=\"10\" class=\"mut\">Primary consumer<\/text>\n    <rect x=\"160\" y=\"150\" width=\"96\" height=\"14\" rx=\"4\" fill=\"#c69214\" opacity=\".8\"/>\n    <text x=\"208\" y=\"182\" text-anchor=\"middle\" font-size=\"12\" class=\"b acc-t\">1,000 J<\/text><\/g><path d=\"M264 88 L282 88\" fill=\"none\" stroke=\"#c69214\" stroke-width=\"3\" stroke-linecap=\"round\" marker-end=\"url(#fcA)\"/><path d=\"M264 88 L282 88\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.2\" stroke-dasharray=\"2 7\" class=\"rvf\" style=\"animation:rvflow 1.1s linear infinite\"/><g class=\"anim-in\" style=\"animation-delay:360ms\"><rect x=\"288\" y=\"40\" width=\"108\" height=\"96\" rx=\"14\" class=\"card\"/>\n    <text x=\"342\" y=\"82\" text-anchor=\"middle\" font-size=\"32\">🐸<\/text><text x=\"342\" y=\"106\" text-anchor=\"middle\" font-size=\"14\" class=\"b\">Frog<\/text>\n    <text x=\"342\" y=\"124\" text-anchor=\"middle\" font-size=\"10\" class=\"mut\">Secondary consumer<\/text>\n    <rect x=\"306\" y=\"150\" width=\"72\" height=\"14\" rx=\"4\" fill=\"#c69214\" opacity=\".8\"/>\n    <text x=\"342\" y=\"182\" text-anchor=\"middle\" font-size=\"12\" class=\"b acc-t\">100 J<\/text><\/g><path d=\"M398 88 L416 88\" fill=\"none\" stroke=\"#c69214\" stroke-width=\"3\" stroke-linecap=\"round\" marker-end=\"url(#fcA)\"/><path d=\"M398 88 L416 88\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.2\" stroke-dasharray=\"2 7\" class=\"rvf\" style=\"animation:rvflow 1.1s linear infinite\"/><g class=\"anim-in\" style=\"animation-delay:540ms\"><rect x=\"422\" y=\"40\" width=\"108\" height=\"96\" rx=\"14\" class=\"card\"/>\n    <text x=\"476\" y=\"82\" text-anchor=\"middle\" font-size=\"32\">🐍<\/text><text x=\"476\" y=\"106\" text-anchor=\"middle\" font-size=\"14\" class=\"b\">Snake<\/text>\n    <text x=\"476\" y=\"124\" text-anchor=\"middle\" font-size=\"10\" class=\"mut\">Tertiary consumer<\/text>\n    <rect x=\"452\" y=\"150\" width=\"48\" height=\"14\" rx=\"4\" fill=\"#c69214\" opacity=\".8\"/>\n    <text x=\"476\" y=\"182\" text-anchor=\"middle\" font-size=\"12\" class=\"b acc-t\">10 J<\/text><\/g><path d=\"M532 88 L550 88\" fill=\"none\" stroke=\"#c69214\" stroke-width=\"3\" stroke-linecap=\"round\" marker-end=\"url(#fcA)\"/><path d=\"M532 88 L550 88\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.2\" stroke-dasharray=\"2 7\" class=\"rvf\" style=\"animation:rvflow 1.1s linear infinite\"/><g class=\"anim-in\" style=\"animation-delay:720ms\"><rect x=\"556\" y=\"40\" width=\"108\" height=\"96\" rx=\"14\" class=\"card\"/>\n    <text x=\"610\" y=\"82\" text-anchor=\"middle\" font-size=\"32\">🦅<\/text><text x=\"610\" y=\"106\" text-anchor=\"middle\" font-size=\"14\" class=\"b\">Eagle<\/text>\n    <text x=\"610\" y=\"124\" text-anchor=\"middle\" font-size=\"10\" class=\"mut\">Top carnivore<\/text>\n    <rect x=\"598\" y=\"150\" width=\"24\" height=\"14\" rx=\"4\" fill=\"#c69214\" opacity=\".8\"/>\n    <text x=\"610\" y=\"182\" text-anchor=\"middle\" font-size=\"12\" class=\"b acc-t\">1 J<\/text><\/g>\n  <text x=\"20\" y=\"204\" font-size=\"11\" class=\"mut\">Energy at each trophic level<\/text><\/svg><\/figure>","cap":"Arrows show the flow of energy; only about 10% passes to the next level (Lindeman's 10% law). Most energy is lost as heat at each step, so food chains rarely have more than four or five links."},{"k":"table","title":"Shapes of ecological pyramids","head":["Pyramid","Shape","Why"],"rows":[["Pyramid of energy (any ecosystem)","Upright — it can never be inverted","Energy is lost at every step, so it always narrows upward."],["Pyramid of numbers in a grassland","Upright","Lots of grass, fewer grasshoppers, fewer frogs."],["Pyramid of biomass in a sea or pond","Inverted","A small mass of fast-growing phytoplankton feeds a larger mass of zooplankton and fish."],["Pyramid of numbers in a parasitic food chain","Inverted","One host carries many parasites."],["Pyramid of numbers for a tree, its insects and birds","Spindle-shaped","One tree, many insects, fewer birds."]]},{"k":"info","title":"Ecological pyramids","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 640 230\" role=\"img\" aria-label=\"Pyramids of energy, numbers in a tree and biomass in the sea\">\n  <g transform=\"translate(20,0)\"><text x=\"85\" y=\"22\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Energy<\/text><text x=\"85\" y=\"38\" text-anchor=\"middle\" font-size=\"11\" class=\"mut\">always upright<\/text><rect x=\"-3\" y=\"154\" width=\"176\" height=\"32\" rx=\"4\" fill=\"#2f8f4e\" opacity=\".85\" class=\"anim-in\" style=\"animation-delay:0ms\"/><text x=\"85\" y=\"175\" text-anchor=\"middle\" font-size=\"10.5\" class=\"b\" style=\"fill:#fff\">Producers<\/text><rect x=\"15\" y=\"118\" width=\"140\" height=\"32\" rx=\"4\" fill=\"#7fb36a\" opacity=\".85\" class=\"anim-in\" style=\"animation-delay:120ms\"/><text x=\"85\" y=\"139\" text-anchor=\"middle\" font-size=\"10.5\" class=\"b\" style=\"fill:#fff\">Herbivores<\/text><rect x=\"33\" y=\"82\" width=\"104\" height=\"32\" rx=\"4\" fill=\"#d4a017\" opacity=\".85\" class=\"anim-in\" style=\"animation-delay:240ms\"/><text x=\"85\" y=\"103\" text-anchor=\"middle\" font-size=\"10.5\" class=\"b\" style=\"fill:#fff\">Carnivores<\/text><rect x=\"46\" y=\"46\" width=\"78\" height=\"32\" rx=\"4\" fill=\"#c0503a\" opacity=\".85\" class=\"anim-in\" style=\"animation-delay:360ms\"/><text x=\"85\" y=\"67\" text-anchor=\"middle\" font-size=\"10.5\" class=\"b\" style=\"fill:#fff\">Top<\/text><\/g><g transform=\"translate(230,0)\"><text x=\"85\" y=\"22\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Numbers in a tree<\/text><text x=\"85\" y=\"38\" text-anchor=\"middle\" font-size=\"11\" class=\"mut\">inverted<\/text><rect x=\"46\" y=\"154\" width=\"78\" height=\"32\" rx=\"4\" fill=\"#2f8f4e\" opacity=\".85\" class=\"anim-in\" style=\"animation-delay:0ms\"/><text x=\"85\" y=\"175\" text-anchor=\"middle\" font-size=\"10.5\" class=\"b\" style=\"fill:#fff\">1 tree<\/text><rect x=\"33\" y=\"118\" width=\"104\" height=\"32\" rx=\"4\" fill=\"#7fb36a\" opacity=\".85\" class=\"anim-in\" style=\"animation-delay:120ms\"/><text x=\"85\" y=\"139\" text-anchor=\"middle\" font-size=\"10.5\" class=\"b\" style=\"fill:#fff\">Many insects<\/text><rect x=\"15\" y=\"82\" width=\"140\" height=\"32\" rx=\"4\" fill=\"#d4a017\" opacity=\".85\" class=\"anim-in\" style=\"animation-delay:240ms\"/><text x=\"85\" y=\"103\" text-anchor=\"middle\" font-size=\"10.5\" class=\"b\" style=\"fill:#fff\">More birds<\/text><rect x=\"-3\" y=\"46\" width=\"176\" height=\"32\" rx=\"4\" fill=\"#c0503a\" opacity=\".85\" class=\"anim-in\" style=\"animation-delay:360ms\"/><text x=\"85\" y=\"67\" text-anchor=\"middle\" font-size=\"10.5\" class=\"b\" style=\"fill:#fff\">Parasites<\/text><\/g>\n  <g transform=\"translate(430,0)\"><text x=\"85\" y=\"22\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Biomass in the sea<\/text><text x=\"85\" y=\"38\" text-anchor=\"middle\" font-size=\"11\" class=\"mut\">inverted<\/text><rect x=\"46\" y=\"154\" width=\"78\" height=\"32\" rx=\"4\" fill=\"#2f8f4e\" opacity=\".85\" class=\"anim-in\" style=\"animation-delay:0ms\"/><text x=\"85\" y=\"175\" text-anchor=\"middle\" font-size=\"10.5\" class=\"b\" style=\"fill:#fff\">Phytoplankton<\/text><rect x=\"33\" y=\"118\" width=\"104\" height=\"32\" rx=\"4\" fill=\"#7fb36a\" opacity=\".85\" class=\"anim-in\" style=\"animation-delay:120ms\"/><text x=\"85\" y=\"139\" text-anchor=\"middle\" font-size=\"10.5\" class=\"b\" style=\"fill:#fff\">Zooplankton<\/text><rect x=\"15\" y=\"82\" width=\"140\" height=\"32\" rx=\"4\" fill=\"#d4a017\" opacity=\".85\" class=\"anim-in\" style=\"animation-delay:240ms\"/><text x=\"85\" y=\"103\" text-anchor=\"middle\" font-size=\"10.5\" class=\"b\" style=\"fill:#fff\">Small fish<\/text><rect x=\"-3\" y=\"46\" width=\"176\" height=\"32\" rx=\"4\" fill=\"#c0503a\" opacity=\".85\" class=\"anim-in\" style=\"animation-delay:360ms\"/><text x=\"85\" y=\"67\" text-anchor=\"middle\" font-size=\"10.5\" class=\"b\" style=\"fill:#fff\">Big fish<\/text><\/g>\n  <text x=\"20\" y=\"220\" font-size=\"11\" class=\"mut\">The bottom block is always the producers. Energy can never be inverted; numbers and biomass can.<\/text><\/svg><\/figure>","cap":"A pyramid of energy is always upright. One tree feeding many insects inverts the pyramid of numbers; fast-breeding phytoplankton invert the pyramid of biomass in the sea."},{"k":"facts","title":"Food chain facts","rows":[["Grazing food chain","Starts with green plants: grass → grasshopper → frog → snake → eagle"],["Detritus food chain","Starts with dead matter: dead leaves → earthworm → bird"],["Energy flow","One way (unidirectional) — Sun → producers → consumers"],["Ten per cent law","About 10% of energy passes to the next level (Lindeman, 1942)"],["Most productive ecosystems","Tropical rainforests on land; estuaries and coral reefs in water"],["Gross vs net primary productivity","NPP = GPP minus what plants use in respiration"],["Standing crop","The living mass present at a trophic level at one time"]]},{"k":"trick","h":"<b>“Energy Never turns upside down”<\/b> — the pyramid of <b>E<\/b>nergy is never inverted. <b>“Sea Biomass Stands on its head”<\/b> — the biomass pyramid in the sea is inverted."},{"k":"trap","h":"Decomposers are <b>not<\/b> a trophic level in the pyramid; they work at every level. A <b>tree<\/b> pyramid of numbers is <b>spindle-shaped<\/b> (one tree, many insects), and a <b>parasitic<\/b> one is <b>inverted<\/b>. Energy is <b>not<\/b> recycled — only nutrients are."}],"sum":["Producers (green plants) are the first trophic level; herbivores are primary consumers.","Bacteria and fungi are decomposers; earthworms are detritivores.","Only about 10% of energy passes from one level to the next (Lindeman's law, 1942).","The pyramid of energy is always upright; biomass in the sea and numbers in a parasitic chain can be inverted.","Energy flows one way; nutrients move in cycles."],"part":["Part 1 · Ecology and ecosystems","पारिस्थितिकी और पारितंत्र"],"g":"en"},
{"id":"E3","heat":2,"title":"Cycles of matter and the world's biomes","hi":"जैव-भू-रासायनिक चक्र और विश्व के बायोम","blocks":[{"k":"hot","h":"Favourites: <b>which bacterium does what<\/b> in the nitrogen cycle (Rhizobium, Nitrosomonas, Nitrobacter, Pseudomonas), the <b>composition of air<\/b>, and the <b>names of grasslands<\/b> (Pampas — Argentina, Veld — South Africa, Downs — Australia)."},{"k":"story","h":"<p>Matter on Earth is never used up — it goes round in <b>biogeochemical cycles<\/b>. Air is <b>78% nitrogen<\/b>, but plants cannot use it directly. <b>Rhizobium<\/b> in the root nodules of peas and beans, <b>Azotobacter<\/b> in soil and <b>cyanobacteria<\/b> in paddy fields fix it into ammonia. <b>Nitrosomonas<\/b> turns ammonia into nitrite, <b>Nitrobacter<\/b> turns nitrite into nitrate, and <b>Pseudomonas<\/b> sends nitrogen back to the air. The <b>phosphorus cycle<\/b> has no gas stage — it is a <b>sedimentary<\/b> cycle.<\/p><p>Climate decides the great <b>biomes<\/b>. The <b>tropical rainforest<\/b> holds the most species; the <b>taiga<\/b> (coniferous forest) is the largest land biome; the <b>tundra<\/b> has frozen ground (permafrost) and mosses. Grasslands get local names: <b>Prairies<\/b> (North America), <b>Pampas<\/b> (Argentina), <b>Steppes<\/b> (Eurasia), <b>Veld<\/b> (South Africa), <b>Downs<\/b> (Australia).<\/p>","key":"N-fixers: Rhizobium, Azotobacter, cyanobacteria; NH3 → NO2 (Nitrosomonas) → NO3 (Nitrobacter); Pseudomonas denitrifies; phosphorus cycle has no gas phase."},{"k":"table","title":"Nitrogen cycle — who does what","head":["Process","Done by","Note"],"rows":[["Nitrogen fixation in the root nodules of legumes","Rhizobium","Lives with peas, beans and gram."],["Nitrogen fixation by free-living bacteria in soil","Azotobacter",""],["Nitrogen fixation in paddy fields","Cyanobacteria (Anabaena, Nostoc)","Anabaena also lives inside the water fern Azolla."],["Nitrogen fixation in the roots of alder (a non-legume)","Frankia",""],["Changing ammonia into nitrite","Nitrosomonas","First step of nitrification."],["Changing nitrite into nitrate","Nitrobacter","Second step of nitrification."],["Returning nitrate to the air as nitrogen gas (denitrification)","Pseudomonas",""]]},{"k":"info","title":"The nitrogen cycle","html":"<figure class=\"fig wide\" style=\"--minw:600px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 660 330\" role=\"img\" aria-label=\"The nitrogen cycle\">\n  <defs><marker id=\"ncA\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#2f6db5\"/><\/marker><marker id=\"ncB\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#2f8f4e\"/><\/marker><marker id=\"ncC\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#c0503a\"/><\/marker><\/defs>\n  <rect x=\"0\" y=\"0\" width=\"660\" height=\"120\" fill=\"var(--blue-bg)\" opacity=\".5\"/><rect x=\"0\" y=\"230\" width=\"660\" height=\"100\" fill=\"#a9805a\" opacity=\".22\"/>\n  <text x=\"330\" y=\"40\" text-anchor=\"middle\" font-size=\"16\" class=\"b\">N₂ in the air (78%)<\/text>\n  <text x=\"560\" y=\"34\" font-size=\"26\">⚡<\/text><text x=\"545\" y=\"58\" font-size=\"11\" class=\"mut\">lightning<\/text>\n  <text x=\"110\" y=\"214\" font-size=\"30\">🌱<\/text><text x=\"80\" y=\"232\" font-size=\"11\" class=\"b\">Legumes<\/text>\n  <text x=\"196\" y=\"186\" font-size=\"26\">🐄<\/text><text x=\"232\" y=\"180\" font-size=\"10\" class=\"mut\">animals eat plants<\/text>\n  <rect x=\"60\" y=\"270\" width=\"150\" height=\"34\" rx=\"10\" class=\"card\"/><text x=\"135\" y=\"292\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Ammonia (NH₃)<\/text><rect x=\"250\" y=\"290\" width=\"150\" height=\"34\" rx=\"10\" class=\"card\"/><text x=\"325\" y=\"312\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Nitrite (NO₂⁻)<\/text><rect x=\"450\" y=\"270\" width=\"150\" height=\"34\" rx=\"10\" class=\"card\"/><text x=\"525\" y=\"292\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Nitrate (NO₃⁻)<\/text>\n  <path d=\"M150 60 C120 110,110 160,120 188\" fill=\"none\" stroke=\"#2f6db5\" stroke-width=\"3\" stroke-linecap=\"round\" marker-end=\"url(#ncA)\"/><path d=\"M150 60 C120 110,110 160,120 188\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.2\" stroke-dasharray=\"2 7\" class=\"rvf\" style=\"animation:rvflow 1.1s linear infinite\"/>\n  <text x=\"20\" y=\"130\" font-size=\"11\" class=\"b\" style=\"fill:#2f6db5\">Fixation<\/text><text x=\"20\" y=\"144\" font-size=\"10\" class=\"mut\">Rhizobium · Azotobacter<\/text><text x=\"20\" y=\"157\" font-size=\"10\" class=\"mut\">Anabaena · Nostoc<\/text>\n  <path d=\"M210 287 L246 299\" fill=\"none\" stroke=\"#2f8f4e\" stroke-width=\"3\" stroke-linecap=\"round\" marker-end=\"url(#ncB)\"/><path d=\"M210 287 L246 299\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.2\" stroke-dasharray=\"2 7\" class=\"rvf\" style=\"animation:rvflow 1.1s linear infinite\"/><text x=\"196\" y=\"320\" font-size=\"10\" class=\"mut\">Nitrosomonas<\/text>\n  <path d=\"M400 300 L446 289\" fill=\"none\" stroke=\"#2f8f4e\" stroke-width=\"3\" stroke-linecap=\"round\" marker-end=\"url(#ncB)\"/><path d=\"M400 300 L446 289\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.2\" stroke-dasharray=\"2 7\" class=\"rvf\" style=\"animation:rvflow 1.1s linear infinite\"/><text x=\"398\" y=\"320\" font-size=\"10\" class=\"mut\">Nitrobacter<\/text>\n  <path d=\"M520 268 C540 200,520 120,470 62\" fill=\"none\" stroke=\"#c0503a\" stroke-width=\"3\" stroke-linecap=\"round\" marker-end=\"url(#ncC)\"/><path d=\"M520 268 C540 200,520 120,470 62\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.2\" stroke-dasharray=\"2 7\" class=\"rvf\" style=\"animation:rvflow 1.1s linear infinite\"/><text x=\"540\" y=\"160\" font-size=\"11\" class=\"b\" style=\"fill:#c0503a\">Denitrification<\/text><text x=\"540\" y=\"174\" font-size=\"10\" class=\"mut\">Pseudomonas<\/text>\n  <path d=\"M450 285 C400 240,200 240,146 226\" fill=\"none\" stroke=\"#2f8f4e\" stroke-width=\"3\" stroke-linecap=\"round\" marker-end=\"url(#ncB)\"/><path d=\"M450 285 C400 240,200 240,146 226\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.2\" stroke-dasharray=\"2 7\" class=\"rvf\" style=\"animation:rvflow 1.1s linear infinite\"/><text x=\"330\" y=\"222\" text-anchor=\"middle\" font-size=\"10\" class=\"mut\">plants take up nitrate<\/text>\n  <path d=\"M570 64 C590 150,580 220,562 266\" fill=\"none\" stroke=\"#2f6db5\" stroke-width=\"3\" stroke-linecap=\"round\" marker-end=\"url(#ncA)\"/><path d=\"M570 64 C590 150,580 220,562 266\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.2\" stroke-dasharray=\"2 7\" class=\"rvf\" style=\"animation:rvflow 1.1s linear infinite\"/>\n  <text x=\"20\" y=\"250\" font-size=\"11\" class=\"b\" style=\"fill:#2f8f4e\">Nitrification<\/text><\/svg><\/figure>","cap":"Bacteria fix N₂ into ammonia; Nitrosomonas turns ammonia into nitrite and Nitrobacter nitrite into nitrate, which plants absorb; Pseudomonas returns nitrogen to the air."},{"k":"table","title":"Grasslands of the world","head":["Grassland","Region","Note"],"rows":[["Prairies","North America","Temperate grassland of the USA and Canada."],["Pampas","Argentina",""],["Steppes","Central Asia and Eastern Europe",""],["Veld","South Africa",""],["Downs","Australia",""],["Canterbury","New Zealand",""],["Llanos","Venezuela and Colombia","Tropical grassland of the Orinoco basin."],["Campos","Brazil","Tropical grassland."],["Puszta","Hungary",""],["Savanna","East and Central Africa","Tropical grassland with scattered trees."]]},{"k":"worldfig","title":"Grasslands of the world","minw":640,"pins":[["1",-100,45,"Prairies","n"],["2",-62,-35,"Pampas","n"],["3",60,50,"Steppes","n"],["4",27,-27,"Veld","n"],["5",146,-27,"Downs","n"],["6",171.5,-43.6,"Canterbury","n"],["7",-68,7,"Llanos","n"],["8",-50,-20,"Campos","n"],["9",20,47,"Puszta","n"],["10",33,-3,"Savanna","n"]],"legend":[["1 Prairies","North America"],["2 Pampas","Argentina"],["3 Steppes","Central Asia and Eastern Europe"],["4 Veld","South Africa"],["5 Downs","Australia"],["6 Canterbury","New Zealand"],["7 Llanos","Venezuela and Colombia"],["8 Campos","Brazil"],["9 Puszta","Hungary"],["10 Savanna","East and Central Africa"]],"cap":"Temperate grasslands (prairies, pampas, steppes, veld, downs) lie in the middle latitudes; tropical grasslands (savanna, llanos, campos) near the tropics."},{"k":"photos","title":"Biomes in pictures","items":[["Tropical_rainforest","Tropical rainforest","Amazon, Congo"],["Savanna","Savanna","East Africa"],["Prairie","Prairie","North America"],["Taiga","Taiga","Siberia, Canada"],["Tundra","Tundra","The Arctic"],["Sahara","Sahara","Hot desert"]]},{"k":"facts","title":"Air and the cycles","rows":[["Nitrogen in air","About 78%"],["Oxygen in air","About 21%"],["Argon in air","About 0.93% — the most common noble gas"],["Carbon dioxide in air","About 0.04% (over 420 ppm in the 2020s)"],["Gaseous cycles","Carbon, nitrogen, oxygen, water"],["Sedimentary cycles","Phosphorus, sulphur — the reservoir is in rocks"],["Largest active carbon store","The oceans"],["Lightning","Also fixes some nitrogen into nitrogen oxides"]]},{"k":"bars","title":"What dry air is made of","unit":"%","left":150,"hi":1,"sort":false,"rows":[["Nitrogen",78.08,""],["Oxygen",20.95,""],["Argon",0.93,""],["Carbon dioxide",0.04,"over 420 ppm"]],"cap":"Nitrogen and oxygen make up 99% of dry air."},{"k":"facts","title":"Biomes in one line each","rows":[["Tropical rainforest","Most biodiversity; Amazon and Congo basins"],["Savanna","Tropical grassland with scattered trees"],["Hot desert","Under 25 cm of rain a year; Sahara, Thar"],["Temperate grassland","Prairies, Pampas, Steppes, Veld, Downs"],["Taiga (boreal forest)","Largest land biome — conifers such as pine and spruce"],["Tundra","Permafrost, mosses and lichens; no trees"]]},{"k":"trick","h":"Nitrification in alphabetical order: <b>Nitroso<\/b> before <b>Nitro-bacter<\/b> — <b>“S before B”<\/b>: Nitro<b>s<\/b>omonas makes nitrite, Nitro<b>b<\/b>acter makes nitrate. Grasslands: <b>“Pampas Argentina, Veld Africa, Downs Down-under”<\/b>."},{"k":"trap","h":"<b>Llanos<\/b> and <b>Campos<\/b> are <b>tropical<\/b> grasslands (South America), while <b>Pampas<\/b> is temperate. The <b>phosphorus<\/b> cycle has <b>no atmospheric<\/b> phase. <b>Denitrification<\/b> (Pseudomonas) loses nitrogen from soil — it is not fixation."}],"sum":["Air is about 78% nitrogen, 21% oxygen, 0.93% argon and 0.04% carbon dioxide.","Rhizobium (legumes), Azotobacter (soil) and cyanobacteria (paddy) fix nitrogen.","Nitrosomonas makes nitrite, Nitrobacter makes nitrate, Pseudomonas denitrifies.","The phosphorus cycle is sedimentary — it has no gas phase.","Prairies — North America, Pampas — Argentina, Steppes — Eurasia, Veld — South Africa, Downs — Australia."],"part":["Part 1 · Ecology and ecosystems","पारिस्थितिकी और पारितंत्र"],"g":"en"},
{"id":"E4","heat":3,"title":"Biodiversity, hotspots and the Red List","hi":"जैव विविधता, हॉटस्पॉट और रेड लिस्ट","blocks":[{"k":"hot","h":"Asked again and again: <b>India's four hotspots<\/b>, the <b>number of hotspots in the world (36)<\/b>, <b>in-situ vs ex-situ<\/b> conservation, the <b>IUCN Red List<\/b> categories and IUCN's headquarters (<b>Gland, Switzerland<\/b>)."},{"k":"story","h":"<p><b>Biodiversity<\/b> — the variety of life — works at three levels: <b>genetic<\/b>, <b>species<\/b> and <b>ecosystem<\/b> diversity. India has only about <b>2.4%<\/b> of the world's land but about <b>7–8%<\/b> of its recorded species, which makes it one of the <b>17 megadiverse countries<\/b>. In 1988 <b>Norman Myers<\/b> named the richest but most threatened regions <b>hotspots<\/b>: a hotspot needs at least <b>1,500 endemic plant species<\/b> and must have lost at least <b>70%<\/b> of its original habitat. The world has <b>36<\/b>; India touches <b>four<\/b> — the <b>Himalaya<\/b>, <b>Indo-Burma<\/b>, the <b>Western Ghats and Sri Lanka<\/b>, and <b>Sundaland<\/b> (Nicobar Islands).<\/p><p>We protect species in two ways. <b>In-situ<\/b> means in their home — national parks, sanctuaries, biosphere reserves and <b>sacred groves<\/b>. <b>Ex-situ<\/b> means outside it — zoos, botanical gardens, <b>seed banks<\/b> and cryopreservation. The <b>IUCN<\/b> (founded 1948, Gland) keeps the <b>Red List<\/b>, which ranks species from Least Concern to Extinct.<\/p>","key":"Hotspots: 36 in the world, 4 in India (Himalaya, Indo-Burma, Western Ghats–Sri Lanka, Sundaland); in-situ = in the home, ex-situ = outside it; IUCN Red List."},{"k":"table","title":"India's four biodiversity hotspots","head":["Hotspot","Part of India","Note"],"rows":[["Himalaya","The Himalayan belt of India","Shared with Nepal, Bhutan and others."],["Indo-Burma","North-east India and the Andaman Islands","The largest of the four by area."],["Western Ghats and Sri Lanka","The Western Ghats","Called the 'ecological hotspot of India'; very high endemism (frogs, plants)."],["Sundaland","The Nicobar Islands","Mostly Indonesia and Malaysia; India's share is the Nicobar Islands."]]},{"k":"mapfig","title":"India's four biodiversity hotspots","fill":{"JK":"#2f6db5","LA":"#2f6db5","HP":"#2f6db5","UT":"#2f6db5","SK":"#2f6db5","AR":"#2f8f4e","AS":"#2f8f4e","NL":"#2f8f4e","MN":"#2f8f4e","MZ":"#2f8f4e","TR":"#2f8f4e","ML":"#2f8f4e","KL":"#c69214","GA":"#c69214","AN":"#c0503a"},"legend":[["#2f6db5","Himalaya"],["#2f8f4e","Indo-Burma"],["#c69214","Western Ghats and Sri Lanka"],["#c0503a","Sundaland"]],"under":"<path d=\"M103.8,328L100.1,378L109.4,432L122.4,478L140.9,516L163.2,558L174.3,584\" fill=\"none\" stroke=\"#c69214\" stroke-width=\"12\" stroke-linecap=\"round\" opacity=\".55\"/>","cap":"States coloured roughly, by the hotspot that covers them. The Western Ghats band runs down the west coast from Gujarat to Kanyakumari; Sundaland reaches the Nicobar Islands."},{"k":"table","title":"IUCN Red List categories","head":["Code","Category","Note"],"rows":[["EX","Extinct","No individual left anywhere."],["EW","Extinct in the Wild","Survives only in captivity."],["CR","Critically Endangered","The highest risk category for living wild species."],["EN","Endangered",""],["VU","Vulnerable",""],["NT","Near Threatened",""],["LC","Least Concern",""],["DD","Data Deficient","Not enough information to judge."],["NE","Not Evaluated",""]]},{"k":"info","title":"The IUCN Red List scale","html":"<figure class=\"fig wide\" style=\"--minw:600px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 150\" role=\"img\" aria-label=\"IUCN Red List categories from extinct to least concern\">\n  <g class=\"anim-in\" style=\"animation-delay:0ms\"><circle cx=\"42\" cy=\"50\" r=\"28\" fill=\"#000\" stroke=\"var(--rule)\"/>\n    <text x=\"42\" y=\"56\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" style=\"fill:#fff\">EX<\/text>\n    <text x=\"42\" y=\"98\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">Extinct<\/text><\/g><g class=\"anim-in\" style=\"animation-delay:80ms\"><circle cx=\"116\" cy=\"50\" r=\"28\" fill=\"#542344\" stroke=\"var(--rule)\"/>\n    <text x=\"116\" y=\"56\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" style=\"fill:#fff\">EW<\/text>\n    <text x=\"116\" y=\"98\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">Extinct in<\/text><text x=\"116\" y=\"111\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">the Wild<\/text><\/g><g class=\"anim-in\" style=\"animation-delay:160ms\"><circle cx=\"190\" cy=\"50\" r=\"28\" fill=\"#d81e05\" stroke=\"var(--rule)\"/>\n    <text x=\"190\" y=\"56\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" style=\"fill:#fff\">CR<\/text>\n    <text x=\"190\" y=\"98\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">Critically<\/text><text x=\"190\" y=\"111\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">Endangered<\/text><\/g><g class=\"anim-in\" style=\"animation-delay:240ms\"><circle cx=\"264\" cy=\"50\" r=\"28\" fill=\"#fc7f3f\" stroke=\"var(--rule)\"/>\n    <text x=\"264\" y=\"56\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" style=\"fill:#222\">EN<\/text>\n    <text x=\"264\" y=\"98\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">Endangered<\/text><\/g><g class=\"anim-in\" style=\"animation-delay:320ms\"><circle cx=\"338\" cy=\"50\" r=\"28\" fill=\"#f9e814\" stroke=\"var(--rule)\"/>\n    <text x=\"338\" y=\"56\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" style=\"fill:#222\">VU<\/text>\n    <text x=\"338\" y=\"98\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">Vulnerable<\/text><\/g><g class=\"anim-in\" style=\"animation-delay:400ms\"><circle cx=\"412\" cy=\"50\" r=\"28\" fill=\"#cce226\" stroke=\"var(--rule)\"/>\n    <text x=\"412\" y=\"56\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" style=\"fill:#222\">NT<\/text>\n    <text x=\"412\" y=\"98\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">Near<\/text><text x=\"412\" y=\"111\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">Threatened<\/text><\/g><g class=\"anim-in\" style=\"animation-delay:480ms\"><circle cx=\"486\" cy=\"50\" r=\"28\" fill=\"#60c659\" stroke=\"var(--rule)\"/>\n    <text x=\"486\" y=\"56\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" style=\"fill:#222\">LC<\/text>\n    <text x=\"486\" y=\"98\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">Least<\/text><text x=\"486\" y=\"111\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">Concern<\/text><\/g><g class=\"anim-in\" style=\"animation-delay:560ms\"><circle cx=\"560\" cy=\"50\" r=\"28\" fill=\"#d1d1c6\" stroke=\"var(--rule)\"/>\n    <text x=\"560\" y=\"56\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" style=\"fill:#222\">DD<\/text>\n    <text x=\"560\" y=\"98\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">Data<\/text><text x=\"560\" y=\"111\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">Deficient<\/text><\/g><g class=\"anim-in\" style=\"animation-delay:640ms\"><circle cx=\"634\" cy=\"50\" r=\"28\" fill=\"#fff\" stroke=\"var(--rule)\"/>\n    <text x=\"634\" y=\"56\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"800\" style=\"fill:#222\">NE<\/text>\n    <text x=\"634\" y=\"98\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">Not<\/text><text x=\"634\" y=\"111\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">Evaluated<\/text><\/g>\n  <path d=\"M170 12 L380 12\" stroke=\"#d81e05\" stroke-width=\"2\"/><text x=\"275\" y=\"9\" text-anchor=\"middle\" font-size=\"10\" class=\"b\" style=\"fill:#d81e05\">THREATENED<\/text><\/svg><\/figure>","cap":"From Extinct to Least Concern. CR, EN and VU together are the 'threatened' categories. The Red Data Book's pink pages list critically endangered species."},{"k":"table","title":"Sacred groves (in-situ conservation by communities)","head":["Local name","State","Note"],"rows":[["Kavu (Sarpa Kavu)","Kerala","Groves often linked with snake worship."],["Devrai (Devrahati)","Maharashtra",""],["Law Kyntang","Meghalaya","Mawphlang is the best-known one."],["Orans","Rajasthan",""],["Sarna","Jharkhand","Worshipped by tribal communities."],["Devarakadu","Karnataka",""],["Kovil Kadu","Tamil Nadu",""],["Umanglai","Manipur",""]]},{"k":"mapfig","title":"Sacred groves by local name","marks":[["KL","Kavu"],["MH","Devrai"],["ML","Law Kyntang"],["RJ","Orans"],["JH","Sarna"],["KA","Devarakadu"],["TN","Kovil Kadu"],["MN","Umanglai"]],"cap":"Each state shows what it is known for here. Use ＋ or ⛶ to zoom in."},{"k":"facts","title":"In-situ vs ex-situ","rows":[["In-situ (on site)","National parks, sanctuaries, biosphere reserves, sacred groves"],["Ex-situ (off site)","Zoos, botanical gardens, seed banks, gene banks, cryopreservation"],["Cryopreservation","Storing seeds, sperm or tissue at −196 °C in liquid nitrogen"],["Svalbard Global Seed Vault","Norway — the world's 'doomsday' seed bank"],["India's national gene bank","National Bureau of Plant Genetic Resources (NBPGR), New Delhi"],["National Biodiversity Authority","Chennai — set up in 2003 under the Biological Diversity Act, 2002"]]},{"k":"facts","title":"Kinds of species","rows":[["Endemic","Found naturally in only one region — e.g. Nilgiri tahr, lion-tailed macaque, purple frog"],["Keystone","Has a much bigger effect on its ecosystem than its numbers suggest — e.g. fig trees, tigers"],["Flagship","A popular species used to rally support — e.g. tiger, giant panda"],["Umbrella","Saving it saves many others in its range — e.g. tiger, elephant"],["Indicator","Its health shows the health of the environment — e.g. lichens for air pollution"],["Invasive alien","A species from outside that spreads and harms — e.g. Lantana, water hyacinth"]]},{"k":"trick","h":"India's hotspots — <b>“HI, WEST SUN”<\/b>: <b>H<\/b>imalaya, <b>I<\/b>ndo-Burma, <b>West<\/b>ern Ghats, <b>Sun<\/b>daland. Red List from bad to safe: <b>“Every Elephant Can Easily Vanish Near Lakes”<\/b> — EX, EW, CR, EN, VU, NT, LC."},{"k":"trap","h":"The <b>Eastern Ghats<\/b> are <b>not<\/b> a hotspot. <b>Sundaland<\/b> covers only the <b>Nicobar<\/b> Islands; the <b>Andaman<\/b> Islands belong to <b>Indo-Burma<\/b>. <b>WWF<\/b> and <b>IUCN<\/b> are both in <b>Gland<\/b>, Switzerland. A <b>sacred grove<\/b> is <b>in-situ<\/b>, a <b>seed bank<\/b> is <b>ex-situ<\/b>."}],"sum":["Biodiversity has three levels: genetic, species and ecosystem.","India is one of 17 megadiverse countries, with about 7–8% of recorded species on 2.4% of the world's land.","The world has 36 hotspots; India has four — Himalaya, Indo-Burma, Western Ghats–Sri Lanka and Sundaland.","In-situ: parks, sanctuaries, biosphere reserves, sacred groves; ex-situ: zoos, gardens, seed banks.","The IUCN (Gland, 1948) keeps the Red List: EX, EW, CR, EN, VU, NT, LC."],"part":["Part 2 · Biodiversity and pollution","जैव विविधता और प्रदूषण"],"g":"en"},
{"id":"E5","heat":3,"title":"Air pollution and the Air Quality Index","hi":"वायु प्रदूषण और वायु गुणवत्ता सूचकांक","blocks":[{"k":"hot","h":"Often asked: the <b>AQI categories<\/b> and the <b>8 pollutants<\/b> it measures, <b>acid rain<\/b> (SO₂ and NOx), <b>carbon monoxide<\/b> and haemoglobin, the <b>Bhopal gas<\/b> (methyl isocyanate) and <b>photochemical smog<\/b>."},{"k":"story","h":"<p>On the night of <b>2–3 December 1984<\/b>, <b>methyl isocyanate<\/b> leaked from a pesticide plant in <b>Bhopal<\/b> and killed thousands — the world's worst industrial disaster, which led to the Environment (Protection) Act, 1986. Everyday air pollution is quieter but larger. Vehicles give out <b>carbon monoxide<\/b>, which grabs haemoglobin and starves the body of oxygen. Coal burning gives <b>sulphur dioxide<\/b>; with <b>nitrogen oxides<\/b> it makes <b>acid rain<\/b>, which corrodes marble — the 'marble cancer' of the Taj Mahal.<\/p><p>Smoke plus fog makes <b>smog<\/b>. The old <b>London smog<\/b> (1952) was sulphur smoke on cold mornings; the <b>photochemical smog<\/b> of Los Angeles forms when sunlight acts on exhaust gases and makes <b>ozone and PAN<\/b>. India launched its <b>National Air Quality Index<\/b> in <b>October 2014<\/b>; it rates air from <b>Good (0–50)<\/b> to <b>Severe (401–500)<\/b> using eight pollutants.<\/p>","key":"CO → carboxyhaemoglobin; SO₂ + NOx → acid rain (pH below 5.6); Bhopal 1984 → methyl isocyanate; AQI (2014) — 6 bands, 8 pollutants."},{"k":"table","title":"Pollutants and what they do","head":["Pollutant","Main effect","Note"],"rows":[["Carbon monoxide","Forms carboxyhaemoglobin and cuts the blood's oxygen supply","It binds haemoglobin about 200 times more strongly than oxygen."],["Sulphur dioxide and nitrogen oxides","Acid rain","Rain with pH below 5.6."],["PM2.5 (fine particles)","Goes deep into the lungs and even the blood","Particles under 2.5 micrometres across."],["Lead from old leaded petrol","Damages the brain and nerves, especially in children","Leaded petrol was phased out in India by 2000."],["Methyl isocyanate","The Bhopal gas tragedy (1984)","Leaked from the Union Carbide plant on the night of 2–3 December 1984."],["Peroxyacetyl nitrate (PAN)","Photochemical smog that irritates the eyes","Formed by sunlight acting on NOx and hydrocarbons."],["Radon gas from soil and rocks","Lung cancer from indoor air","A radioactive gas."]]},{"k":"table","title":"India's AQI bands","head":["Category","AQI value","Note"],"rows":[["Good","0–50","Minimal impact."],["Satisfactory","51–100","Minor breathing discomfort to sensitive people."],["Moderate","101–200","Also called 'moderately polluted'."],["Poor","201–300",""],["Very poor","301–400",""],["Severe","401–500","Affects healthy people too."]]},{"k":"info","title":"The Air Quality Index scale","html":"<figure class=\"fig wide\" style=\"--minw:600px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 130\" role=\"img\" aria-label=\"India's AQI colour bands\">\n  <rect x=\"10\" y=\"30\" width=\"108\" height=\"44\" rx=\"10\" fill=\"#2e9d4c\" class=\"anim-in\" style=\"animation-delay:0ms\"/>\n    <text x=\"64\" y=\"57\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" style=\"fill:#fff\">0–50<\/text>\n    <text x=\"64\" y=\"96\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Good<\/text><rect x=\"120\" y=\"30\" width=\"108\" height=\"44\"  fill=\"#9acd32\" class=\"anim-in\" style=\"animation-delay:90ms\"/>\n    <text x=\"174\" y=\"57\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" style=\"fill:#222\">51–100<\/text>\n    <text x=\"174\" y=\"96\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Satisfactory<\/text><rect x=\"230\" y=\"30\" width=\"108\" height=\"44\"  fill=\"#f2c14e\" class=\"anim-in\" style=\"animation-delay:180ms\"/>\n    <text x=\"284\" y=\"57\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" style=\"fill:#222\">101–200<\/text>\n    <text x=\"284\" y=\"96\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Moderate<\/text><rect x=\"340\" y=\"30\" width=\"108\" height=\"44\"  fill=\"#f28c28\" class=\"anim-in\" style=\"animation-delay:270ms\"/>\n    <text x=\"394\" y=\"57\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" style=\"fill:#222\">201–300<\/text>\n    <text x=\"394\" y=\"96\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Poor<\/text><rect x=\"450\" y=\"30\" width=\"108\" height=\"44\"  fill=\"#d7301f\" class=\"anim-in\" style=\"animation-delay:360ms\"/>\n    <text x=\"504\" y=\"57\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" style=\"fill:#fff\">301–400<\/text>\n    <text x=\"504\" y=\"96\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Very poor<\/text><rect x=\"560\" y=\"30\" width=\"108\" height=\"44\"  fill=\"#7e1416\" class=\"anim-in\" style=\"animation-delay:450ms\"/>\n    <text x=\"614\" y=\"57\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" style=\"fill:#fff\">401–500<\/text>\n    <text x=\"614\" y=\"96\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Severe<\/text>\n  <text x=\"10\" y=\"20\" font-size=\"11\" class=\"mut\">AQI value<\/text><text x=\"10\" y=\"122\" font-size=\"11\" class=\"mut\">One number, one colour, one description — launched October 2014<\/text><\/svg><\/figure>","cap":"Eight pollutants feed the AQI: PM10, PM2.5, NO₂, SO₂, CO, O₃, NH₃ and lead. Delhi's winter smog often reaches 'severe'."},{"k":"facts","title":"Air quality in India","rows":[["National AQI","Launched in October 2014 — 'One Number, One Colour, One Description'"],["Its 8 pollutants","PM10, PM2.5, NO₂, SO₂, CO, O₃, NH₃ and lead (Pb)"],["Air Act","Air (Prevention and Control of Pollution) Act, 1981"],["National Clean Air Programme (NCAP)","Launched January 2019 to cut particulate pollution in over 130 cities"],["Bharat Stage VI fuel norms","Nationwide from 1 April 2020 — India jumped straight from BS-IV"],["GRAP","Graded Response Action Plan for Delhi-NCR, applied by the Commission for Air Quality Management"],["Acid rain","Rain with pH below 5.6"],["Indoor air pollution","Smoke from wood and dung cooking fires — tackled by the Ujjwala LPG scheme (2016)"]]},{"k":"trick","h":"AQI bands — <b>“Good Students May Pass, Very Serious”<\/b>: <b>G<\/b>ood 0–50, <b>S<\/b>atisfactory 51–100, <b>M<\/b>oderate 101–200, <b>P<\/b>oor 201–300, <b>V<\/b>ery poor 301–400, <b>S<\/b>evere 401–500. Every band is 100 wide except the first two (50 each)."},{"k":"trap","h":"Ozone is <b>good up high<\/b> (stratosphere) but a <b>pollutant at ground level<\/b>. <b>London smog<\/b> is a reducing smog (sulphur, cold); <b>photochemical smog<\/b> is an oxidising smog (sunlight, ozone, PAN). Bhopal gas was <b>methyl isocyanate<\/b>, not methane or phosgene."}],"sum":["Carbon monoxide forms carboxyhaemoglobin and reduces the blood's oxygen.","Sulphur dioxide and nitrogen oxides cause acid rain (pH below 5.6).","The Bhopal gas tragedy (1984) was caused by methyl isocyanate.","India's AQI (October 2014) has six bands from Good (0–50) to Severe (401–500) and uses eight pollutants.","Photochemical smog forms from sunlight acting on exhaust gases; it contains ozone and PAN."],"part":["Part 2 · Biodiversity and pollution","जैव विविधता और प्रदूषण"],"g":"en"},
{"id":"E6","heat":3,"title":"Water, soil, noise and waste — and the diseases they cause","hi":"जल, मृदा, ध्वनि और अपशिष्ट प्रदूषण तथा उनसे होने वाले रोग","blocks":[{"k":"hot","h":"The commonest pollution questions: <b>Minamata → mercury<\/b>, <b>Itai-itai → cadmium<\/b>, <b>blue baby → nitrates<\/b>, <b>fluorosis → fluoride<\/b>, and the meaning of <b>BOD<\/b>, <b>eutrophication<\/b> and <b>biomagnification<\/b>. Noise is measured in <b>decibels<\/b>."},{"k":"story","h":"<p>In the 1950s, a factory at <b>Minamata<\/b> in Japan poured <b>mercury<\/b> waste into the bay. Fish soaked it up, people ate the fish, and a nerve disease spread — <b>Minamata disease<\/b>. Downstream from a mine on Japan's Jinzu river, <b>cadmium<\/b> made bones so brittle that patients cried 'itai-itai' — 'it hurts, it hurts'. Poisons like these and the pesticide <b>DDT<\/b> grow more concentrated at every step up the food chain: <b>biomagnification<\/b>.<\/p><p>When fertiliser and detergent run into a lake, the extra <b>nitrates and phosphates<\/b> feed huge <b>algal blooms<\/b>. When the algae die, bacteria use up the oxygen and fish die — <b>eutrophication<\/b>. The oxygen used by microbes to break down waste is the <b>BOD<\/b>: clean water has a BOD below about 5 ppm; sewage is far higher. Noise, too, is pollution, measured in <b>decibels<\/b>; India's rules set the lowest limit for <b>silence zones<\/b> around hospitals and schools.<\/p>","key":"Minamata — mercury; Itai-itai — cadmium; blue baby — nitrate; fluorosis — fluoride; high BOD = dirty water; eutrophication = nutrient overload."},{"k":"table","title":"Pollution diseases","head":["Disease","Caused by","Note"],"rows":[["Minamata disease","Mercury","First seen at Minamata Bay, Japan (1956), from fish eaten by people."],["Itai-itai disease","Cadmium","Japan; painful, weak bones — 'itai' means 'it hurts'."],["Blue baby syndrome (methaemoglobinaemia)","Nitrates in drinking water","Mostly from fertiliser run-off."],["Fluorosis","Excess fluoride in water","Mottled teeth and stiff bones."],["Black foot disease","Arsenic","Arsenic in groundwater is a big problem in West Bengal and Bihar."],["Plumbism","Lead",""],["Silicosis","Silica dust","Common among stone-cutting and mine workers."],["Asbestosis","Asbestos fibres",""],["Byssinosis (brown lung)","Cotton dust","Textile mill workers."],["Black lung disease","Coal dust","Coal miners."]]},{"k":"cards","title":"Pollutant → disease","rows":[["Minamata disease","Mercury","","☿"],["Itai-itai disease","Cadmium","","⚗️"],["Blue baby syndrome","Nitrates in drinking water","","⚠️"],["Fluorosis","Excess fluoride in water","","⚠️"],["Black foot disease","Arsenic","","☠️"],["Plumbism","Lead","","🔩"],["Silicosis","Silica dust","","⚠️"],["Asbestosis","Asbestos fibres","","⚠️"],["Byssinosis","Cotton dust","","⚠️"],["Black lung disease","Coal dust","","⚠️"]]},{"k":"table","title":"Pollution terms","head":["Term","Meaning","Note"],"rows":[["BOD (biochemical oxygen demand)","Oxygen used by microbes to break down organic matter in water","High BOD = heavily polluted water."],["COD (chemical oxygen demand)","Oxygen needed to chemically oxidise all the matter in water",""],["Eutrophication","Over-enrichment of a water body with nutrients, causing algal blooms","Caused by phosphates and nitrates from fertilisers and detergents."],["Biomagnification","Rise in a toxin's concentration at each higher trophic level","DDT in fish-eating birds thinned their eggshells."],["Bioaccumulation","Build-up of a toxin inside one organism over its life",""],["Dead zone","Water so low in oxygen that fish die","Often follows eutrophication."],["Leachate","Polluted liquid seeping out of a landfill",""],["Fly ash","Fine ash left after burning coal in thermal power plants","Used to make bricks and cement."]]},{"k":"table","title":"Noise limits — Noise Pollution (Regulation and Control) Rules, 2000","head":["Zone","Daytime limit","Day / night"],"rows":[["Industrial area","75 dB(A)","75 by day, 70 at night."],["Commercial area","65 dB(A)","65 by day, 55 at night."],["Residential area","55 dB(A)","55 by day, 45 at night."],["Silence zone","50 dB(A)","50 by day, 40 at night; at least 100 m around hospitals, schools and courts."]]},{"k":"bars","title":"Noise limits by day","unit":"dB(A)","left":150,"hi":1,"sort":false,"rows":[["Industrial area",75,"75 by day, 70 at night."],["Commercial area",65,"65 by day, 55 at night."],["Residential area",55,"55 by day, 45 at night."],["Silence zone",50,"50 by day, 40 at night; at least 100 m around hospitals, schools and courts."]],"cap":"Night limits are lower (70, 55, 45 and 40 dB). Silence zones: at least 100 m around hospitals, schools and courts."},{"k":"facts","title":"Waste and plastic rules in India","rows":[["Single-use plastic ban","Listed single-use plastic items banned from 1 July 2022"],["Plastic carry bags","At least 120 microns thick from 31 December 2022 (75 microns from September 2021)"],["Plastic Waste Management Rules","2016, amended several times; makers must take back waste (Extended Producer Responsibility)"],["E-Waste (Management) Rules","2022, in force from 1 April 2023"],["Namami Gange","Flagship Ganga clean-up programme, 2014 (the first Ganga Action Plan was 1985)"],["Water Act","Water (Prevention and Control of Pollution) Act, 1974 — India's first pollution law"],["Clean water BOD","Below about 5 ppm; highly polluted water can exceed 17 ppm"],["Safe noise","Long exposure above about 80–85 dB can damage hearing"]]},{"k":"trick","h":"<b>“Mad Hatter, Cad Bones”<\/b>: <b>M<\/b>inamata = <b>M<\/b>ercury (mad, nerves); <b>Cad<\/b>mium = brittle <b>bones<\/b> (Itai-itai). <b>Blue baby = Nitrate<\/b> — the baby turns blue because nitrate blocks oxygen in blood. <b>F<\/b>luorosis = <b>F<\/b>luoride."},{"k":"trap","h":"<b>High BOD<\/b> means <b>more<\/b> pollution, not cleaner water. <b>Biomagnification<\/b> is up the food chain; <b>bioaccumulation<\/b> is inside one body. <b>Arsenic<\/b> causes black foot disease; <b>coal dust<\/b> causes black lung — don't swap them. Itai-itai is <b>cadmium<\/b>, not chromium."}],"sum":["Minamata disease — mercury; Itai-itai — cadmium; blue baby syndrome — nitrates; fluorosis — fluoride.","Black foot disease — arsenic; silicosis — silica dust; byssinosis — cotton dust.","High BOD means heavily polluted water; clean water is below about 5 ppm.","Eutrophication: extra nitrates and phosphates → algal bloom → oxygen loss → fish die.","Noise limits by day: industrial 75, commercial 65, residential 55, silence zone 50 dB(A)."],"part":["Part 2 · Biodiversity and pollution","जैव विविधता और प्रदूषण"],"g":"en"},
{"id":"E7","heat":3,"title":"Climate change, greenhouse gases and the ozone layer","hi":"जलवायु परिवर्तन, ग्रीनहाउस गैसें और ओज़ोन परत","blocks":[{"k":"hot","h":"Most-asked: <b>which gases are greenhouse gases<\/b>, the <b>main source of methane<\/b> (paddy, cattle), <b>CFCs destroy ozone<\/b>, ozone is measured in <b>Dobson units<\/b>, the ozone layer is in the <b>stratosphere<\/b>, and <b>World Ozone Day is 16 September<\/b>."},{"k":"story","h":"<p>Sunlight warms the Earth, and the Earth sends heat back out. <b>Greenhouse gases<\/b> — water vapour, <b>carbon dioxide<\/b>, <b>methane<\/b>, <b>nitrous oxide<\/b> and fluorinated gases — trap part of that heat, like the glass of a greenhouse. Without them Earth would be frozen; with too much of them it overheats. Since 1850 burning fossil fuels has pushed CO₂ from about <b>280 ppm<\/b> to over <b>420 ppm<\/b>, and the world is now about <b>1.1–1.3 °C<\/b> warmer. <b>2024<\/b> was the hottest year on record and the first calendar year above 1.5 °C.<\/p><p>High above, in the <b>stratosphere<\/b>, a thin layer of <b>ozone<\/b> (O₃) blocks harmful <b>ultraviolet<\/b> rays. In <b>1985<\/b> British scientists found a <b>hole<\/b> in it over <b>Antarctica<\/b>, caused mainly by <b>CFCs<\/b>, whose chlorine destroys ozone. The world answered with the <b>Montreal Protocol<\/b> (1987), and the layer is now slowly healing.<\/p>","key":"Greenhouse gases: CO₂, CH₄, N₂O, fluorinated gases, water vapour; ozone layer in the stratosphere, measured in Dobson units; CFCs made the Antarctic hole (found 1985)."},{"k":"table","title":"Greenhouse gases and their sources","head":["Gas","Main source","Note"],"rows":[["Carbon dioxide","Burning coal, oil and gas, and cutting forests","The biggest human-made greenhouse gas."],["Methane","Paddy fields, cattle and wetlands","Also called marsh gas; traps far more heat than CO₂ per molecule."],["Nitrous oxide","Nitrogen fertilisers","Also the 'laughing gas'."],["Chlorofluorocarbons (CFCs)","Old refr

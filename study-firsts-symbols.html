{"id":"F1","heat":3,"title":"Symbols of the state: flag, emblem, anthem, song, calendar and ₹","hi":"राज्य के प्रतीक: ध्वज, प्रतीक, गान, गीत, पंचांग और ₹","blocks":[{"k":"hot","h":"Most asked: the flag's <b>adoption date (22 July 1947)<\/b>, <b>ratio (2:3)<\/b> and <b>24 spokes<\/b>; the emblem's source (<b>Sarnath<\/b>) and motto (<b>Satyameva Jayate<\/b>, from the <b>Mundaka Upanishad<\/b>); the anthem's author, <b>first singing (1911)<\/b>, <b>adoption (24 January 1950)<\/b> and <b>52 seconds<\/b>; <b>Vande Mataram<\/b> and <b>Anandamath<\/b>; the <b>Saka<\/b> calendar; and the <b>₹ designer<\/b>."},{"k":"story","h":"<p>A new country needs symbols everyone can recognise. India chose them in the months around freedom. On <b>22 July 1947<\/b> the Constituent Assembly adopted the <b>tricolour<\/b> — saffron, white and green, with the blue <b>Ashoka Chakra<\/b> of <b>24 spokes<\/b> in place of the spinning wheel of the 1931 Swaraj flag. On <b>24 January 1950<\/b>, its last sitting, the Assembly adopted <b>Jana Gana Mana<\/b> as the national anthem and gave <b>Vande Mataram<\/b> equal honour as the national song. Two days later, on <b>26 January 1950<\/b>, the <b>State Emblem<\/b> — the lions of Ashoka's pillar at <b>Sarnath<\/b> — came into use with the motto <b>Satyameva Jayate<\/b>.<\/p><p>Later came the <b>Saka calendar<\/b> (1957), drawn up after Meghnad Saha's committee, and the <b>₹ sign<\/b> (2010), designed by D. Udaya Kumar. In 2025–26 the national song was in the news again: its <b>150th year<\/b> was marked from 7 November 2025, and in January 2026 the Home Ministry set the full <b>six-stanza<\/b> version (about 3 minutes 10 seconds) for official use.<\/p>","key":"Flag 22 July 1947 · anthem and song 24 January 1950 · emblem 26 January 1950 · calendar 22 March 1957 · ₹ 2010."},{"k":"fig","title":"The tricolour, drawn to scale","svg":"<svg viewBox=\"0 0 300 200\" role=\"img\" aria-label=\"The national flag of India: saffron, white and green bands with a navy flag","rows":[["Adopted","22 July 1947, by the Constituent Assembly"],["Colours","Saffron on top (courage and sacrifice), white in the middle (truth and peace), green at the bottom (faith, fertility and growth)"],["Wheel","The navy-blue Ashoka Chakra (Dharma Chakra) with 24 spokes, on the white band — taken from the Sarnath Lion Capital"],["Ratio","Width to length 2:3"],["Based on","The flag designed by Pingali Venkayya; the 1931 Swaraj flag had a spinning wheel (charkha) where the Chakra now is"],["Rules","The Flag Code of India, 2002 (in force from 26 January 2002); amended in December 2021 (machine-made and polyester flags allowed) and July 2022 (flags in the open or on homes may fly day and night)"],["Law","The Prevention of Insults to National Honour Act, 1971; the Emblems and Names (Prevention of Improper Use) Act, 1950"],["Court","Union of India v. Naveen Jindal (2004): flying the flag with respect is part of freedom of expression, Article 19(1)(a)"]]},{"k":"tl","title":"How the flag grew","rows":[["1906","A flag with green, yellow and red bands is hoisted on 7 August at Parsee Bagan Square, Calcutta"],["1907","Bhikaiji Cama unfurls an Indian flag at the International Socialist Congress in Stuttgart"],["1921","Pingali Venkayya shows Gandhi a red-and-green flag at the Bezwada Congress session; white and the charkha are added"],["1931","The Congress adopts the Swaraj flag — saffron, white, green and a charkha"],["1947","22 July: the Constituent Assembly adopts the tricolour with the Ashoka Chakra"],["2002","The Flag Code of India lets citizens fly the flag on all days"]]},{"k":"facts","title":"The State Emblem","rows":[["Source","The Lion Capital of Ashoka at Sarnath (near Varanasi), about 250 BCE — now in the Sarnath Museum"],["Adopted","26 January 1950"],["What you see","Three of the four lions (the fourth is hidden behind); below them a wheel in the centre, a bull on the right and a horse on the left"],["Left out","The bell-shaped lotus under the abacus"],["Motto","Satyameva Jayate ('Truth alone triumphs'), from the Mundaka Upanishad, written in Devanagari below"],["Law","The State Emblem of India (Prohibition of Improper Use) Act, 2005"]]},{"k":"photos","title":"From Sarnath to the emblem","items":[["Lion_Capital_of_Ashoka","Lion Capital of Ashoka","Sarnath, about 250 BCE"],["State_Emblem_of_India","State Emblem of India","Adopted 26 January 1950"],["Pingali_Venkayya","Pingali Venkayya","His design led to the tricolour"],["Rabindranath_Tagore","Rabindranath Tagore","Jana Gana Mana"],["Bankim_Chandra_Chattopadhyay","Bankim Chandra Chattopadhyay","Vande Mataram"],["Meghnad_Saha","Meghnad Saha","Calendar Reform Committee"]]},{"k":"facts","title":"The national anthem and the national song","rows":[["Anthem","Jana Gana Mana, by Rabindranath Tagore, in Sanskritised Bengali — the first of the five stanzas of his song 'Bharoto Bhagyo Bidhata'"],["First sung","27 December 1911, at the Calcutta session of the Indian National Congress"],["Adopted","24 January 1950, by the Constituent Assembly"],["Playing time","Full version about 52 seconds; short version (first and last lines) about 20 seconds"],["Also by Tagore","Bangladesh's anthem, Amar Shonar Bangla; and the English version of Jana Gana Mana, 'The Morning Song of India' (1919)"],["National song","Vande Mataram, by Bankim Chandra Chattopadhyay — written around 7 November 1875, later part of the novel Anandamath (1882)"],["First sung at the Congress","By Rabindranath Tagore, at the 1896 Calcutta session"],["Equal honour","Announced by Rajendra Prasad in the Constituent Assembly, 24 January 1950"],["In the news (2025–26)","150 years marked from 7 November 2025; a Home Ministry order of 28 January 2026 made all six stanzas (about 3 min 10 s) the official version, sung before the anthem at official functions; in July 2026 Parliament passed a bill bringing the song under the 1971 Act"]]},{"k":"facts","title":"The calendar, the ₹ sign and the pledge","rows":[["National calendar","The Saka calendar, used officially from 22 March 1957 (1 Chaitra 1879 Saka), alongside the Gregorian calendar"],["Its year","Counts from the Saka era of 78 CE; 365 days; the first month is Chaitra, which begins on 22 March (21 March in a leap year)"],["Who planned it","The Calendar Reform Committee under Meghnad Saha (1952)"],["The ₹ sign","Adopted on 15 July 2010; designed by D. Udaya Kumar; joins the Devanagari 'र' (ra) with the Roman 'R', with two lines across the top"],["The pledge","'India is my country…' — written in Telugu by Pydimarri Venkata Subba Rao in 1962, first read in a school in Visakhapatnam in 1963"]]},{"k":"table","title":"Who wrote or designed it","head":["Symbol","Who","Note"],"rows":[["The national anthem, Jana Gana Mana","Rabindranath Tagore","Written in Bengali; first sung on 27 December 1911."],["The national song, Vande Mataram","Bankim Chandra Chattopadhyay","Part of the novel Anandamath (1882)."],["The flag on which the tricolour is based","Pingali Venkayya","He showed Gandhi a flag at the Bezwada (Vijayawada) Congress session, 1921."],["The rupee symbol ₹","D. Udaya Kumar","Chosen in 2010 from public entries."],["The National Pledge","Pydimarri Venkata Subba Rao","Written in Telugu in 1962."],["The report behind the national calendar","Meghnad Saha","He headed the Calendar Reform Committee (1952)."],["The English 'Morning Song of India'","Rabindranath Tagore","His own translation of Jana Gana Mana, made at Madanapalle in 1919."]]},{"k":"trick","h":"Dates in one line — <b>“Flag in July, Song and Anthem on the 24th, Emblem on the 26th”<\/b>: 22 July 1947 → 24 January 1950 → 26 January 1950. The anthem is <b>52<\/b> seconds — think of the <b>52<\/b> weeks of a year; the short version is <b>20<\/b>."},{"k":"trap","h":"<b>Satyameva Jayate<\/b> is from the <b>Mundaka<\/b> Upanishad — not the Mandukya or the Katha. The emblem shows <b>three<\/b> lions, though the capital has four. The flag's <b>ratio is 2:3<\/b> (width to length) — not 1:2 or 3:4. <b>Jana Gana Mana<\/b> is Tagore's, <b>Vande Mataram<\/b> Bankim's — and Tagore was the first to sing Vande Mataram at a Congress session (1896)."}],"sum":["Flag adopted 22 July 1947; ratio 2:3; Ashoka Chakra in navy blue with 24 spokes; based on Pingali Venkayya's design.","Flag Code of India, 2002; polyester allowed (2021); flags may fly day and night (2022).","State Emblem from the Sarnath Lion Capital, adopted 26 January 1950; motto Satyameva Jayate from the Mundaka Upanishad.","Jana Gana Mana by Tagore: first sung 27 December 1911, adopted 24 January 1950, 52 seconds (short version 20).","Vande Mataram by Bankim Chandra (Anandamath); equal honour 24 January 1950; six stanzas, about 3 min 10 s, under the 2026 order.","Saka calendar from 22 March 1957 (Meghnad Saha committee); ₹ sign 2010 by D. Udaya Kumar; pledge by P. V. Subba Rao (1962)."],"part":["Part 1 · National symbols","राष्ट्रीय प्रतीक"],"g":"fs"},
{"id":"F2","heat":2,"title":"Living symbols: animal, bird, flower, tree, fruit, river and more","hi":"जीवित प्रतीक: पशु, पक्षी, पुष्प, वृक्ष, फल, नदी और अन्य","blocks":[{"k":"hot","h":"Most asked: the national <b>animal (tiger)<\/b>, <b>bird (Indian peafowl)<\/b>, <b>flower (lotus)<\/b>, <b>tree (banyan)<\/b>, <b>fruit (mango)<\/b>, <b>river (Ganga)<\/b>, <b>aquatic animal (Ganges river dolphin)<\/b> and <b>heritage animal (elephant)<\/b> — with their scientific names — and the trick question: <b>India has no official national game<\/b>."},{"k":"story","h":"<p>Besides the symbols of the state, India has symbols from nature. The <b>tiger<\/b> replaced the lion as the national animal in the early 1970s, when tigers were vanishing and <b>Project Tiger<\/b> began (1973). The <b>Indian peafowl<\/b> became the national bird in <b>1963<\/b>; the <b>lotus<\/b>, the <b>banyan<\/b> and the <b>mango<\/b> stand for the flower, tree and fruit.<\/p><p>Newer ones followed. The <b>Ganga<\/b> was declared the national river in <b>2008<\/b>, and in <b>2009<\/b> the <b>Ganges river dolphin<\/b> — almost blind, finding its food by echo — became the national aquatic animal. In <b>2010<\/b> the <b>elephant<\/b> was named the national heritage animal. In <b>2012<\/b> schoolchildren voting on the Science Express train picked <b>Lactobacillus<\/b>, the bacterium that sets curd, as the national microbe. And some 'national' things were never declared at all — there is <b>no national game<\/b>, whatever many quiz books say about hockey.<\/p>","key":"Tiger, peafowl, lotus, banyan, mango, Ganga, dolphin (2009), elephant (2010), Lactobacillus (2012) — and no national game."},{"k":"table","title":"National symbols from nature","head":["Symbol","What it is","Note"],"rows":[["National animal","Tiger (<i>Panthera tigris<\/i>)","Took the lion's place in the early 1970s; Project Tiger began in 1973."],["National bird","Indian peafowl (<i>Pavo cristatus<\/i>)","Declared in 1963; protected under Schedule I of the Wildlife (Protection) Act, 1972."],["National flower","Lotus (<i>Nelumbo nucifera<\/i>)","A sacred flower that rises clean from muddy water."],["National tree","Banyan (<i>Ficus benghalensis<\/i>)","Its aerial roots grow into new trunks, so one tree can spread very wide."],["National fruit","Mango (<i>Mangifera indica<\/i>)","India grows more mangoes than any other country."],["National river","Ganga","Declared in November 2008, when the National Ganga River Basin Authority was set up."],["National aquatic animal","Ganges river dolphin (<i>Platanista gangetica<\/i>)","Declared on 5 October 2009 — now National Dolphin Day; locally the 'susu'."],["National heritage animal","Indian elephant","Named in 2010 to raise its protection; Project Elephant runs since 1992."],["National microbe","<i>Lactobacillus delbrueckii<\/i> subsp. <i>bulgaricus<\/i>","Chosen by children in 2012; it turns milk into curd and yogurt."]]},{"k":"photos","title":"The living symbols in pictures","items":[["Bengal_tiger","Tiger","National animal"],["Indian_peafowl","Indian peafowl","National bird (1963)"],["Nelumbo_nucifera","Lotus","National flower"],["Ficus_benghalensis","Banyan","National tree"],["Mango","Mango","National fruit"],["Ganges","Ganga","National river (2008)"],["South_Asian_river_dolphin","Ganges river dolphin","National aquatic animal (2009)"],["Indian_elephant","Indian elephant","National heritage animal (2010)"],["Lactobacillus_delbrueckii_subsp._bulgaricus","Lactobacillus","National microbe (2012)"]]},{"k":"facts","title":"Not declared — the trick questions","rows":[["National game","None. The Sports Ministry said in RTI replies (2012, 2020) that no game has been declared; hockey is only linked with India through its eight Olympic golds"],["National reptile","Not officially notified; guide books often give the king cobra"],["Others you may see","'National vegetable', 'national sweet' and the like have no official status"]]},{"k":"facts","title":"Laws that protect the living symbols","rows":[["Wildlife (Protection) Act, 1972","Tiger, peafowl, elephant and Ganges river dolphin are all in Schedule I — the highest protection"],["Project Tiger","1973 — run by the National Tiger Conservation Authority since 2006"],["Project Elephant","1992"],["National Dolphin Day","5 October (from 2022) — the day the dolphin was declared in 2009"]]},{"k":"trick","h":"In order — animal, bird, flower, tree, fruit: <b>“The Peacock Likes Big Mangoes”<\/b> = <b>T<\/b>iger, <b>P<\/b>eacock, <b>L<\/b>otus, <b>B<\/b>anyan, <b>M<\/b>ango. Then the 'water-and-heritage' trio in date order — <b>Ganga 2008, Dolphin 2009, Elephant 2010<\/b>."},{"k":"trap","h":"The <b>lion<\/b> was the national animal <b>before<\/b> the tiger. The <b>aquatic<\/b> animal is the <b>dolphin<\/b>, the <b>heritage<\/b> animal the <b>elephant<\/b> — don't swap them. <b>Hockey is not the official national game<\/b>: India has none. <b>Ficus religiosa<\/b> is the peepal — the national tree is <b>Ficus benghalensis<\/b>, the banyan."}],"sum":["Animal tiger (Panthera tigris); bird Indian peafowl (Pavo cristatus, 1963); flower lotus (Nelumbo nucifera).","Tree banyan (Ficus benghalensis); fruit mango (Mangifera indica).","River Ganga (2008); aquatic animal Ganges river dolphin (5 October 2009); heritage animal elephant (2010).","Microbe Lactobacillus delbrueckii subsp. bulgaricus (2012, chosen by children).","No official national game, and no notified national reptile."],"part":["Part 1 · National symbols","राष्ट्रीय प्रतीक"],"g":"fs"},
{"id":"F3","heat":2,"title":"Firsts in India: the people","hi":"भारत में प्रथम: व्यक्ति","blocks":[{"k":"hot","h":"Most asked: the first <b>President, Vice-President, Prime Minister<\/b> and <b>Governor-General<\/b>; the first <b>Speaker, Chief Justice, Chief Election Commissioner<\/b>; the first <b>Muslim, Sikh, Dalit and tribal<\/b> Presidents; and the first Indian <b>in space<\/b>, <b>on the ISS<\/b> and <b>to win a Nobel<\/b>."},{"k":"story","h":"<p>When the Constitution came into force on <b>26 January 1950<\/b>, India filled its new posts for the first time. <b>Rajendra Prasad<\/b> became the first President, and in 1952 <b>Sarvepalli Radhakrishnan<\/b> became the first Vice-President. <b>Jawaharlal Nehru<\/b> had been Prime Minister since 1947, with <b>Vallabhbhai Patel<\/b> as his deputy. The Governor-General's chair passed from <b>Lord Mountbatten<\/b> to <b>C. Rajagopalachari<\/b>, the first and last Indian to hold it. <b>H. J. Kania<\/b> became the first Chief Justice, and <b>Sukumar Sen<\/b>, the first Chief Election Commissioner, ran the first general elections of 1951–52.<\/p><p>Other 'firsts' came later: <b>Morarji Desai<\/b> led the first non-Congress government (1977); <b>Rakesh Sharma<\/b> went into space (1984); and in 2025 <b>Shubhanshu Shukla<\/b> became the first Indian to visit the International Space Station.<\/p>","key":"Prasad, Radhakrishnan, Nehru, Patel, Mountbatten → Rajaji, Mavalankar, Kania, Sukumar Sen."},{"k":"table","title":"First holders of India's posts","head":["First","Who","Note"],"rows":[["The first President of India","Rajendra Prasad","Rajendra Prasad was President from 1950 to 1962 — the only one elected twice."],["The first Vice-President of India","Sarvepalli Radhakrishnan","Radhakrishnan was Vice-President from 1952 to 1962 and then the second President."],["The first Prime Minister of India","Jawaharlal Nehru","Nehru was Prime Minister from 1947 until his death in 1964."],["The first Deputy Prime Minister of India","Vallabhbhai Patel","Patel was also the first Home Minister and joined the princely states to India."],["The first Governor-General of independent India","Lord Mountbatten","Mountbatten stayed on as Governor-General from August 1947 to June 1948."],["The first (and last) Indian Governor-General","C. Rajagopalachari","Rajaji held the post from 1948 until it ended on 26 January 1950."],["The first Speaker of the Lok Sabha","G. V. Mavalankar","Ganesh Vasudev Mavalankar was Speaker from 1952 to 1956."],["The first Chief Justice of India","H. J. Kania","Harilal Jekisundas Kania headed the Supreme Court from 1950 to 1951."],["The first Chief Election Commissioner","Sukumar Sen","Sukumar Sen ran the first general elections of 1951–52."],["The first Attorney General of India","M. C. Setalvad","Motilal Chimanlal Setalvad was Attorney General from 1950 to 1963."],["The first Comptroller and Auditor General","V. Narahari Rao","V. Narahari Rao was CAG from 1948 to 1954."],["The first Finance Minister of independent India","R. K. Shanmukham Chetty","Shanmukham Chetty presented independent India's first budget on 26 November 1947."],["The first Education Minister of India","Maulana Abul Kalam Azad","Azad's birthday, 11 November, is kept as National Education Day."],["The first Law Minister of India","B. R. Ambedkar","Ambedkar also chaired the Drafting Committee of the Constitution."],["The first Indian Governor of the Reserve Bank","C. D. Deshmukh","C. D. Deshmukh led the RBI from 1943 to 1949 and later became Finance Minister."],["The first non-Congress Prime Minister","Morarji Desai","Morarji Desai led the Janata Party government of 1977–79."],["The first Muslim President of India","Zakir Husain","Zakir Husain (1967–69) was also the first President to die in office."],["The first Sikh President of India","Giani Zail Singh","Zail Singh was President from 1982 to 1987."],["The first Dalit President of India","K. R. Narayanan","K. R. Narayanan was President from 1997 to 2002."],["The first President from a Scheduled Tribe","Droupadi Murmu","Droupadi Murmu took office in July 2022 — also the second woman President."],["The first acting President of India","V. V. Giri","V. V. Giri acted as President in 1969 after Zakir Husain died, and was then elected."],["The first Chief Justice to act as President","M. Hidayatullah","M. Hidayatullah acted as President in July–August 1969, when V. V. Giri resigned to stand for election."]]},{"k":"table","title":"Indians first on the world stage","head":["First","Who","Note"],"rows":[["The first Indian to go into space","Rakesh Sharma","Rakesh Sharma flew on Soyuz T-11 on 3 April 1984 with two Soviet cosmonauts."],["The first Indian to visit the International Space Station","Shubhanshu Shukla","Group Captain Shubhanshu Shukla piloted Axiom-4, which docked with the ISS on 26 June 2025."],["The first Indian to win a Nobel Prize","Rabindranath Tagore","Tagore won the Literature prize in 1913 for Gitanjali — the first Asian laureate too."],["The first Indian elected to the British House of Commons","Dadabhai Naoroji","Naoroji won Finsbury Central in 1892."],["The first President of the Indian National Congress","W. C. Bonnerjee","Womesh Chunder Bonnerjee presided over the first session at Bombay in 1885."],["The first Indian to join the Indian Civil Service","Satyendranath Tagore","Rabindranath's elder brother was selected in 1863."],["The first Indian to win an individual Olympic gold","Abhinav Bindra","Bindra won the 10 m air rifle at Beijing in 2008."],["The first Indian to win an individual Olympic medal","K. D. Jadhav","Khashaba Dadasaheb Jadhav won wrestling bronze at Helsinki in 1952."],["The first Indian to win an Olympic gold in athletics","Neeraj Chopra","Neeraj Chopra won the javelin at the Tokyo Games (held in 2021)."],["The first Indian to win an Oscar","Bhanu Athaiya","Bhanu Athaiya won for costume design for Gandhi in 1983."],["The first captain of India in Test cricket","C. K. Nayudu","C. K. Nayudu led India in its first Test, at Lord's in 1932."]]},{"k":"link","h":"More firsts elsewhere: the first <b>Bharat Ratna<\/b> awardees and the first woman, posthumous and foreign recipients — see <a href=\"study-awards.html?lesson=A1\">Awards &amp; Honours<\/a>; the first <b>Field Marshal<\/b>, Param Vir Chakra and CDS — see <a href=\"study-defence.html?lesson=F3\">Defence<\/a>; and the newest 'first' appointments — see <a href=\"study-appointments.html\">Appointments<\/a>."},{"k":"trick","h":"The first family of the Republic — <b>“Prasad Presides, Radha Assists, Nehru Navigates, Patel Protects”<\/b>: President, Vice-President, Prime Minister, Deputy PM and Home Minister."},{"k":"trap","h":"<b>Mountbatten<\/b> was the first Governor-General of <b>independent<\/b> India; <b>Rajagopalachari<\/b> was the first (and last) <b>Indian<\/b> Governor-General. <b>V. V. Giri<\/b> was the first <b>acting<\/b> President, but <b>M. Hidayatullah<\/b> was the first <b>Chief Justice<\/b> to act as President. <b>Rakesh Sharma<\/b> was the first Indian in space; <b>Shubhanshu Shukla<\/b> the first on the <b>ISS<\/b>."}],"sum":["President Rajendra Prasad; Vice-President S. Radhakrishnan; PM Jawaharlal Nehru; Deputy PM Vallabhbhai Patel.","Governor-General: Mountbatten (first of free India), then C. Rajagopalachari (first and last Indian).","Speaker G. V. Mavalankar; CJI H. J. Kania; CEC Sukumar Sen; AG M. C. Setalvad; CAG V. Narahari Rao.","First non-Congress PM: Morarji Desai (1977). Presidents: Zakir Husain (first Muslim), Zail Singh (Sikh), K. R. Narayanan (Dalit), Droupadi Murmu (Scheduled Tribe).","Rakesh Sharma — space (1984); Shubhanshu Shukla — ISS (2025); Tagore — Nobel (1913)."],"part":["Part 2 · Firsts — India and the world","प्रथम — भारत और विश्व"],"g":"fs"},
{"id":"F4","heat":3,"title":"Firsts in India: women","hi":"भारत में प्रथम: महिलाएँ","blocks":[{"k":"hot","h":"The most asked 'firsts' of all: the first woman <b>Prime Minister, President, Governor, Chief Minister, Union minister, Speaker<\/b>; the first woman <b>Supreme Court and High Court judges<\/b>; the first woman <b>IAS and IPS<\/b> officers; and the first women to <b>climb Everest<\/b>, go <b>into space<\/b> and win <b>Olympic medals<\/b>."},{"k":"story","h":"<p>Indian women broke one barrier after another. In 1947 <b>Sarojini Naidu<\/b> became the first woman Governor and <b>Rajkumari Amrit Kaur<\/b> the first woman in the Union Cabinet. <b>Anna Rajam Malhotra<\/b> joined the IAS in 1951; <b>Kiran Bedi<\/b> the IPS in 1972. In 1963 <b>Sucheta Kripalani<\/b> became Chief Minister of Uttar Pradesh, and in 1966 <b>Indira Gandhi<\/b> became Prime Minister. The courts followed: <b>Anna Chandy<\/b> (High Court, 1959), <b>Fathima Beevi<\/b> (Supreme Court, 1989) and <b>Leila Seth<\/b> (High Court Chief Justice, 1991).<\/p><p>Beyond the office: <b>Bachendri Pal<\/b> stood on Everest in 1984; <b>Kalpana Chawla<\/b> flew in space in 1997; <b>Karnam Malleswari<\/b> won India's first Olympic medal by a woman in 2000. In 2007 <b>Pratibha Patil<\/b> became the first woman President.<\/p>","key":"Governor Naidu, minister Amrit Kaur, IAS Anna Rajam Malhotra, CM Kripalani, PM Indira, IPS Bedi, President Patil."},{"k":"table","title":"First women","head":["First","Who","Note"],"rows":[["The first woman Prime Minister of India","Indira Gandhi","Indira Gandhi became Prime Minister in January 1966."],["The first woman President of India","Pratibha Patil","Pratibha Patil was President from 2007 to 2012."],["The first woman Governor of an Indian state","Sarojini Naidu","Sarojini Naidu became Governor of the United Provinces (now Uttar Pradesh) in 1947."],["The first woman Chief Minister in India","Sucheta Kripalani","Sucheta Kripalani became Chief Minister of Uttar Pradesh in 1963."],["The first woman Union Cabinet minister","Rajkumari Amrit Kaur","Rajkumari Amrit Kaur was Health Minister from 1947 to 1957 and founded AIIMS."],["The first woman President of the UN General Assembly","Vijaya Lakshmi Pandit","Vijaya Lakshmi Pandit presided over the General Assembly in 1953 — the first woman anywhere to do so."],["The first woman Speaker of the Lok Sabha","Meira Kumar","Meira Kumar was Speaker from 2009 to 2014."],["The first woman judge of the Supreme Court","M. Fathima Beevi","Fathima Beevi joined the Supreme Court in 1989 and was later Governor of Tamil Nadu."],["The first woman judge of a High Court","Anna Chandy","Anna Chandy became a judge of the Kerala High Court in 1959."],["The first woman Chief Justice of a High Court","Leila Seth","Leila Seth became Chief Justice of the Himachal Pradesh High Court in 1991."],["The first woman IAS officer","Anna Rajam Malhotra","Anna Rajam Malhotra joined the Indian Administrative Service in 1951."],["The first woman IPS officer","Kiran Bedi","Kiran Bedi joined the Indian Police Service in 1972."],["The first woman officer of the Indian Foreign Service","C. B. Muthamma","C. B. Muthamma joined in 1949 and later won a Supreme Court case against rules that held women back in the service."],["The first Indian woman to climb Mount Everest","Bachendri Pal","Bachendri Pal reached the summit on 23 May 1984."],["The first woman to climb Everest twice","Santosh Yadav","Santosh Yadav climbed it in 1992 and again in 1993."],["The first woman amputee to climb Everest","Arunima Sinha","Arunima Sinha, who lost a leg in a train attack, reached the top in May 2013."],["The first Indian-born woman in space","Kalpana Chawla","Kalpana Chawla flew on the space shuttle Columbia (STS-87) in 1997."],["The first Indian woman to win an Olympic medal","Karnam Malleswari","Karnam Malleswari won weightlifting bronze at Sydney in 2000."],["The first Indian woman to win an Olympic silver medal","P. V. Sindhu","P. V. Sindhu won badminton silver at Rio in 2016."],["The first Indian woman to fly an aircraft","Sarla Thakral","Sarla Thakral earned her flying licence in 1936, at the age of 21."],["The first woman Chief Election Commissioner","V. S. Ramadevi","V. S. Ramadevi held the post briefly in 1990."],["The first Indian woman to win Miss World","Reita Faria","Reita Faria won the title in 1966."],["The first woman to win the Jnanpith Award","Ashapurna Devi","The Bengali writer Ashapurna Devi received it in 1976."],["The first woman to win the Sahitya Akademi Award","Amrita Pritam","The Punjabi poet Amrita Pritam won it in 1956 for Sunehe."],["The first winner of the Dadasaheb Phalke Award","Devika Rani","The actress Devika Rani received the first award in 1969."],["The first Indian woman to win the Booker Prize","Arundhati Roy","Arundhati Roy won in 1997 for The God of Small Things."],["The first woman ruler of the Delhi Sultanate","Razia Sultan","Razia ruled from 1236 to 1240."]]},{"k":"photos","title":"First women in pictures","items":[["Indira_Gandhi","Indira Gandhi","First woman Prime Minister of India"],["Pratibha_Patil","Pratibha Patil","First woman President of India"],["Sarojini_Naidu","Sarojini Naidu","First woman Governor of an Indian state"],["Sucheta_Kripalani","Sucheta Kripalani","First woman Chief Minister in India"],["Rajkumari_Amrit_Kaur","Rajkumari Amrit Kaur","First woman Union Cabinet minister"],["Vijaya_Lakshmi_Pandit","Vijaya Lakshmi Pandit","First woman President of the UN General Assembly"],["Fathima_Beevi","M. Fathima Beevi","First woman judge of the Supreme Court"],["Kiran_Bedi","Kiran Bedi","First woman IPS officer"],["Bachendri_Pal","Bachendri Pal","First Indian woman to climb Mount Everest"],["Kalpana_Chawla","Kalpana Chawla","First Indian-born woman in space"],["Karnam_Malleswari","Karnam Malleswari","First Indian woman to win an Olympic medal"],["P._V._Sindhu","P. V. Sindhu","First Indian woman to win an Olympic silver medal"]]},{"k":"facts","title":"More first women","rows":[["First women graduates (1883)","Kadambini Ganguly and Chandramukhi Basu, University of Calcutta"],["First Indian woman with a degree in Western medicine","Anandibai Joshi — MD from Pennsylvania, 1886"],["First woman to practise law in India","Cornelia Sorabji"],["First woman teacher of modern India","Savitribai Phule — opened a girls' school in Pune in 1848"],["First woman Bharat Ratna","Indira Gandhi (1971)"],["First Indian woman Nobel laureate","Mother Teresa — Peace, 1979"],["First Asian woman to swim the English Channel","Arati Saha (1959)"],["First woman Chief Minister of Delhi","Sushma Swaraj (1998)"],["First woman to head the State Bank of India","Arundhati Bhattacharya (2013)"],["First woman to present a full Union Budget as Finance Minister","Nirmala Sitharaman (2019)"],["First Indian winner of the International Booker Prize","Geetanjali Shree, Tomb of Sand (2022); Banu Mushtaq's Heart Lamp (2025) was the first Kannada winner"]]},{"k":"link","h":"The first women <b>fighter pilots<\/b>, the first woman <b>Lieutenant General<\/b> and the first woman <b>Rafale pilot<\/b> are in <a href=\"study-defence.html?lesson=F3\">Defence<\/a>. Women leaders of the freedom struggle are in <a href=\"study-history-modern.html\">Modern History<\/a> (L32)."},{"k":"trick","h":"The 1947 pair — <b>“Sarojini Governs, Amrit Ministers”<\/b>. The 'ladder' of the courts — <b>“Anna climbs, Fathima reaches the top, Leila leads”<\/b>: Anna Chandy (HC judge 1959) → Fathima Beevi (SC judge 1989) → Leila Seth (HC Chief Justice 1991)."},{"k":"trap","h":"<b>Anna Rajam Malhotra<\/b> = IAS; <b>Kiran Bedi<\/b> = IPS — don't swap. <b>Bachendri Pal<\/b> climbed Everest first (1984); <b>Santosh Yadav<\/b> was first to do it <b>twice<\/b>. The first woman <b>Governor<\/b> is Sarojini Naidu, but the first woman <b>Chief Minister<\/b> is Sucheta Kripalani — both in Uttar Pradesh. India has <b>not yet had a woman Chief Justice of India<\/b> (as of October 2026); Justice B. V. Nagarathna is in line for 2027."}],"sum":["PM Indira Gandhi (1966); President Pratibha Patil (2007); Speaker Meira Kumar (2009).","Governor Sarojini Naidu (1947); CM Sucheta Kripalani (1963); Union minister Rajkumari Amrit Kaur (1947).","Judges: Anna Chandy (HC, 1959), Fathima Beevi (SC, 1989), Leila Seth (HC Chief Justice, 1991).","IAS Anna Rajam Malhotra (1951); IPS Kiran Bedi (1972); IFS C. B. Muthamma (1949).","Everest: Bachendri Pal (1984), Santosh Yadav twice, Arunima Sinha (amputee, 2013).","Space Kalpana Chawla (1997); Olympic medal Karnam Malleswari (2000); silver P. V. Sindhu (2016)."],"part":["Part 2 · Firsts — India and the world","प्रथम — भारत और विश्व"],"g":"fs"},
{"id":"F5","heat":2,"title":"Firsts in India: institutions, events and things","hi":"भारत में प्रथम: संस्थाएँ, घटनाएँ और वस्तुएँ","blocks":[{"k":"hot","h":"Most asked: the first <b>newspaper<\/b> (Hicky's Bengal Gazette, 1780), the first <b>film<\/b> and <b>talkie<\/b>, the first <b>universities<\/b> (1857), <b>IIT<\/b> and <b>AIIMS<\/b>, the first <b>nuclear reactor<\/b> (Apsara) and <b>power plant<\/b> (Tarapur), the first <b>Antarctic station<\/b>, the first <b>test-tube baby<\/b> and the first <b>general elections<\/b>."},{"k":"story","h":"<p>Modern India's 'firsts' tell its story. Printing brought <b>Hicky's Bengal Gazette<\/b> (1780), and in 1857 the British opened universities at <b>Calcutta, Bombay and Madras<\/b>. In 1913 <b>Dadasaheb Phalke<\/b> made the first Indian feature film, <b>Raja Harishchandra<\/b>; in 1931 <b>Alam Ara<\/b> brought sound.<\/p><p>After 1947 the young republic built: the first <b>IIT<\/b> at Kharagpur (1951), the first <b>AIIMS<\/b> (1956), and <b>Apsara<\/b> at Trombay (1956) — the first nuclear reactor in Asia. <b>Doordarshan<\/b> began in 1959; <b>Tarapur<\/b> became the first nuclear power station (1969); <b>Pokhran<\/b> saw the first nuclear test (1974); and in 1983–84 India set up its first base in Antarctica, <b>Dakshin Gangotri<\/b>.<\/p>","key":"Paper 1780 · universities 1857 · film 1913 · talkie 1931 · IIT 1951 · reactor 1956 · TV 1959 · Tarapur 1969 · Pokhran 1974."},{"k":"facts","title":"Print, film and broadcasting","rows":[["First newspaper","Hicky's Bengal Gazette, Calcutta, 1780 — started by James Augustus Hicky"],["First Hindi newspaper","Udant Martand, Calcutta, 1826 — its first day, 30 May, is Hindi Journalism Day"],["First feature film","Raja Harishchandra (1913), by Dadasaheb Phalke"],["First talkie","Alam Ara (1931), by Ardeshir Irani"],["First colour film made in India","Kisan Kanya (1937)"],["First radio broadcasts","The Radio Club of Bombay, 1923; the name All India Radio from 1936"],["First television","Doordarshan, Delhi, 15 September 1959; colour TV in 1982, for the Asian Games"]]},{"k":"facts","title":"Education, science and health","rows":[["First modern universities","Calcutta, Bombay and Madras, 1857"],["First IIT","Kharagpur, 1951"],["First IIM","Calcutta, 1961 (Ahmedabad followed weeks later)"],["First AIIMS","New Delhi, 1956"],["First nuclear reactor","Apsara, Trombay, 1956 — also Asia's first"],["First nuclear power station","Tarapur, Maharashtra, 1969"],["First nuclear test","'Smiling Buddha', Pokhran (Rajasthan), 18 May 1974"],["First satellite","Aryabhata, 19 April 1975, on a Soviet rocket"],["First expedition to Antarctica","1981–82, led by S. Z. Qasim"],["First station in Antarctica","Dakshin Gangotri (1983–84); then Maitri and Bharati"],["First station in the Arctic","Himadri, Svalbard (Norway), 2008"],["First test-tube baby","Durga (Kanupriya Agarwal), Kolkata, 3 October 1978 — Dr Subhas Mukhopadhyay's team"],["First heart transplant","AIIMS, 1994 — Dr P. Venugopal"]]},{"k":"facts","title":"Democracy, money and the map","rows":[["First general elections","1951–52; the first Lok Sabha met in 1952"],["First Five-Year Plan","1951–56"],["First Lok Adalat","Junagadh, Gujarat, 1982"],["Asia's oldest stock exchange","Bombay Stock Exchange, 1875"],["Asia's first postage stamp","The 'Scinde Dawk', Karachi (Sind), 1852"],["First telegraph line","Calcutta to Diamond Harbour, 1851"],["One of Asia's first hydro plants","Sidrapong, near Darjeeling, 1897"],["First Asian Games","New Delhi, 1951"],["First World Heritage sites","Ajanta, Ellora, Agra Fort and the Taj Mahal (1983)"],["First Ramsar sites","Chilika and Keoladeo (1981)"],["First biosphere reserve","Nilgiri (1986)"]]},{"k":"link","h":"The first <b>railway<\/b> (1853), <b>metro<\/b> (1984), <b>Vande Bharat<\/b> and India's first <b>airline<\/b> flight are in <a href=\"study-industries-transport.html?lesson=T6\">Industries &amp; Transport<\/a>, with the first <b>cotton and jute mills<\/b> and the first <b>steel plant<\/b>. The first <b>banks<\/b> are in <a href=\"study-banking.html?lesson=N3\">Banking<\/a>; the first <b>satellites and Moon missions<\/b> in <a href=\"study-space.html\">Space<\/a>."},{"k":"trick","h":"Film in three steps — <b>“Phalke Silent, Irani Talks, Kisan in Colour”<\/b>: 1913, 1931, 1937. Nuclear in three — <b>“Apsara 56, Tarapur 69, Pokhran 74”<\/b>."},{"k":"trap","h":"<b>Apsara<\/b> is a research <b>reactor<\/b> (Trombay); <b>Tarapur<\/b> is the first <b>power station<\/b> — different things. <b>Dakshin Gangotri<\/b> is in <b>Antarctica<\/b>, <b>Himadri<\/b> in the <b>Arctic<\/b>. The first universities (1857) were <b>Calcutta, Bombay and Madras<\/b> — not Delhi or Banaras."}],"sum":["Hicky's Bengal Gazette (1780); Udant Martand (1826, first Hindi paper).","Raja Harishchandra (1913), Alam Ara (1931), Kisan Kanya (1937); Doordarshan 1959.","Universities 1857 (Calcutta, Bombay, Madras); IIT Kharagpur 1951; AIIMS 1956; IIM Calcutta 1961.","Apsara reactor (1956), Tarapur power station (1969), Pokhran test (1974), Aryabhata (1975).","Dakshin Gangotri (Antarctica, 1983–84); Himadri (Arctic, 2008); first test-tube baby Durga (1978).","General elections 1951–52; first Lok Adalat Junagadh (1982); Asian Games New Delhi (1951)."],"part":["Part 2 · Firsts — India and the world","प्रथम — भारत और विश्व"],"g":"fs"},
{"id":"F6","heat":1,"title":"Firsts in the world","hi":"विश्व में प्रथम","blocks":[{"k":"hot","h":"Asked now and then: the world's first <b>woman Prime Minister<\/b> (Sirimavo Bandaranaike), the first woman <b>Nobel<\/b> laureate (Marie Curie), the first to <b>climb Everest<\/b> and reach the <b>South Pole<\/b>, the first <b>Nobel winners<\/b> of 1901, and the first <b>Olympics<\/b> and <b>World Cups<\/b>."},{"k":"story","h":"<p>The world's firsts are a story of explorers and pioneers. <b>Vasco da Gama<\/b> reached India by sea in 1498, and <b>Magellan<\/b>'s ships sailed right round the world (1519–22). <b>Roald Amundsen<\/b> reached the South Pole in 1911; <b>Tenzing Norgay<\/b> and <b>Edmund Hillary<\/b> stood on Everest on 29 May 1953; and in 1975 Japan's <b>Junko Tabei<\/b> became the first woman there.<\/p><p>Politics had its pioneers too. <b>Sirimavo Bandaranaike<\/b> of Sri Lanka became the world's first woman Prime Minister in 1960 — six years before Indira Gandhi — and Iceland's <b>Vigdís Finnbogadóttir<\/b> the first woman elected President (1980). The first <b>Nobel Prizes<\/b> were given in <b>1901<\/b>; <b>Marie Curie<\/b> was the first woman to win one, and the only person to win in two sciences.<\/p>","key":"Bandaranaike 1960 · Curie 1903 · Amundsen 1911 · Tenzing–Hillary 1953 · Tabei 1975 · Nobel 1901."},{"k":"table","title":"World firsts: people","head":["First","Who","Note"],"rows":[["The first woman Prime Minister in the world","Sirimavo Bandaranaike","Sirimavo Bandaranaike became Prime Minister of Ceylon (Sri Lanka) in 1960."],["The first woman elected President of a country","Vigdís Finnbogadóttir","Vigdís Finnbogadóttir was elected President of Iceland in 1980."],["The first woman Prime Minister of Britain","Margaret Thatcher","Margaret Thatcher led Britain from 1979 to 1990."],["The first woman Prime Minister of Pakistan","Benazir Bhutto","Benazir Bhutto took office in 1988 — the first woman elected to lead a Muslim-majority country."],["The first woman Chancellor of Germany","Angela Merkel","Angela Merkel was Chancellor from 2005 to 2021."],["The first woman Vice-President of the United States","Kamala Harris","Kamala Harris, whose mother came from Chennai, took office in January 2021."],["The first woman to win a Nobel Prize","Marie Curie","Marie Curie shared the 1903 Physics prize and won Chemistry alone in 1911."],["The first woman to win the Nobel Peace Prize","Bertha von Suttner","The Austrian writer Bertha von Suttner won it in 1905."],["The first woman to climb Mount Everest","Junko Tabei","Junko Tabei of Japan reached the top on 16 May 1975."],["The first person to reach the South Pole","Roald Amundsen","The Norwegian Roald Amundsen's team got there on 14 December 1911."],["The first person to fly solo non-stop across the Atlantic","Charles Lindbergh","Charles Lindbergh flew the Spirit of St. Louis from New York to Paris in 1927."],["The first woman to fly solo across the Atlantic","Amelia Earhart","Amelia Earhart crossed from Newfoundland to Northern Ireland in 1932."],["The first European to reach India by sea","Vasco da Gama","Vasco da Gama landed near Calicut in May 1498."],["The leader of the first voyage round the world","Ferdinand Magellan","Magellan's fleet sailed in 1519; he was killed on the way and Juan Sebastián Elcano finished the voyage in 1522."],["The first person to run a mile in under four minutes","Roger Bannister","Roger Bannister ran 3 minutes 59.4 seconds at Oxford in 1954."],["The first person to sail alone round the world","Joshua Slocum","Joshua Slocum sailed the sloop Spray round the world alone in 1895–98."]]},{"k":"table","title":"The first Nobel Prizes","head":["Prize","First winner","Note"],"rows":[["Physics","Wilhelm Röntgen","Wilhelm Röntgen won the first Physics prize (1901) for discovering X-rays."],["Chemistry","Jacobus van 't Hoff","Jacobus van 't Hoff won the first Chemistry prize (1901) for laws of chemical dynamics and osmotic pressure."],["Physiology or Medicine","Emil von Behring","Emil von Behring won the first Medicine prize (1901) for serum therapy against diphtheria."],["Literature","Sully Prudhomme","The French poet Sully Prudhomme won the first Literature prize (1901)."],["Peace","Henry Dunant and Frédéric Passy","The first Peace prize (1901) was shared by Henry Dunant, founder of the Red Cross, and Frédéric Passy."],["Economic Sciences","Ragnar Frisch and Jan Tinbergen","The Economics prize was first given in 1969, to Ragnar Frisch and Jan Tinbergen."]]},{"k":"facts","title":"World firsts: events","rows":[["First modern Olympics","Athens, 1896"],["First Winter Olympics","Chamonix (France), 1924"],["First Paralympics","Rome, 1960"],["First FIFA World Cup","Uruguay, 1930 — the hosts won"],["First Cricket World Cup","England, 1975 — won by the West Indies"],["First Commonwealth Games","Hamilton (Canada), 1930, as the British Empire Games"],["First country where all women could vote","New Zealand, 1893"],["First postage stamp","The Penny Black, Britain, 1840"],["First atomic bomb used in war","Hiroshima, 6 August 1945"],["First to the top of Everest","Tenzing Norgay and Edmund Hillary, 29 May 1953"],["First ascent of Everest without bottled oxygen","Reinhold Messner and Peter Habeler, 1978"]]},{"k":"facts","title":"Space firsts in one line","rows":[["First human in space","Yuri Gagarin, Vostok 1, 12 April 1961"],["First woman in space","Valentina Tereshkova, 1963"],["First people on the Moon","Neil Armstrong and Buzz Aldrin, Apollo 11, 20 July 1969"],["The full list","See <a href=\"study-space.html\">Space<\/a>, lesson 14 (World space firsts)"]]},{"k":"trick","h":"Women at the top, in order — <b>“Sri Lanka 60, India 66, Iceland 80, Britain 79”<\/b>: Bandaranaike (1960, PM), Indira Gandhi (1966), Thatcher (1979), Vigdís (1980, first elected President)."},{"k":"trap","h":"The world's first woman Prime Minister was <b>Sirimavo Bandaranaike<\/b>, not Indira Gandhi or Golda Meir. <b>Amundsen<\/b> reached the <b>South<\/b> Pole (1911); <b>Peary<\/b> claimed the <b>North<\/b> Pole (1909), a claim still doubted. <b>Magellan<\/b> died on the way — <b>Elcano<\/b> brought the ship home in 1522."}],"sum":["First woman PM: Sirimavo Bandaranaike (Sri Lanka, 1960); first woman elected President: Vigdís Finnbogadóttir (Iceland, 1980).","Marie Curie — first woman Nobel laureate (1903); Bertha von Suttner — first woman Peace laureate (1905).","First Nobels, 1901: Röntgen (Physics), van 't Hoff (Chemistry), von Behring (Medicine), Sully Prudhomme (Literature), Dunant and Passy (Peace).","Everest: Tenzing and Hillary (1953); Junko Tabei (first woman, 1975). South Pole: Amundsen (1911).","Olympics Athens 1896; FIFA World Cup Uruguay 1930; Cricket World Cup 1975 (West Indies)."],"part":["Part 2 · Firsts — India and the world","प्रथम — भारत और विश्व"],"g":"fs"},
{"id":"F7","heat":2,"title":"Superlatives of India: longest, highest, largest","hi":"भारत के सर्वोच्च: सबसे लंबा, ऊँचा, बड़ा","blocks":[{"k":"hot","h":"Most asked: India's <b>longest sea bridge<\/b> (Atal Setu), <b>river bridge<\/b> (Bhupen Hazarika Setu), <b>road and rail tunnels<\/b> (Chenani–Nashri, T-50), <b>longest national highway<\/b> (NH-44), the <b>Statue of Unity<\/b>, the <b>largest stadium<\/b>, the <b>largest and smallest districts<\/b> (Kachchh, Mahe) and the <b>highest waterfall<\/b> (Kunchikal)."},{"k":"story","h":"<p>India's record book keeps changing because India keeps building. In January 2024 <b>Atal Setu<\/b> — about 21.8 km across Mumbai's harbour — became the longest sea bridge. In February 2024 the 12.77-km <b>T-50<\/b> opened on the Kashmir rail line as the longest railway tunnel in use, and in June 2025 the <b>Chenab Bridge<\/b>, the world's highest railway arch, carried the first trains to the valley alongside <b>Anji Khad<\/b>, India's first cable-stayed rail bridge.<\/p><p>Bigger records are on the way. The 14.57-km <b>Tunnel 8<\/b> on the Rishikesh–Karnaprayag line broke through in April 2025; the 13-km <b>Zojila<\/b> road tunnel was dug through in June 2026; and the <b>Delhi–Mumbai Expressway<\/b>, about 1,386 km, is mostly open. Until they open in full, the older record-holders keep their titles — so in an exam, look for the words <b>'in use'<\/b> or <b>'being built'<\/b>.<\/p>","key":"Sea bridge Atal Setu · river bridge Bhupen Hazarika Setu · rail tunnel T-50 · road tunnel Chenani–Nashri · highway NH-44."},{"k":"table","title":"Bridges, tunnels and roads (as of October 2026)","head":["Record","Holder","Note"],"rows":[["India's longest sea bridge","Atal Setu (Mumbai Trans Harbour Link)","About 21.8 km from Sewri to Nhava Sheva, over Thane Creek; opened January 2024."],["India's longest river bridge open end to end","Bhupen Hazarika Setu (Dhola–Sadiya), Assam","About 9.15 km over the Lohit, opened 2017. The 9.76-km Kacchi Dargah–Bidupur bridge on the Ganga (Bihar), partly opened in June 2025, will pass it when finished."],["India's longest rail-cum-road bridge","Bogibeel Bridge, Assam","About 4.94 km over the Brahmaputra, 2018."],["India's longest rail-only bridge","Vembanad Rail Bridge, Kochi","About 4.62 km, across the backwaters to the Vallarpadam terminal."],["The world's highest railway arch bridge","Chenab Bridge, Jammu and Kashmir","About 359 m above the Chenab; opened June 2025."],["India's first cable-stayed railway bridge","Anji Khad Bridge, Jammu and Kashmir","Opened with the Chenab Bridge in June 2025."],["India's longest railway tunnel in use","T-50 (Sumber–Khari), Jammu and Kashmir","About 12.77 km, on the Udhampur–Srinagar–Baramulla line; opened February 2024."],["India's longest rail tunnel yet bored","Tunnel 8, Rishikesh–Karnaprayag line","About 14.57 km, Devprayag–Janasu; broken through April 2025; the line is due around 2028."],["India's longest road tunnel in use","Dr Syama Prasad Mookerjee (Chenani–Nashri) Tunnel, Jammu and Kashmir","About 9.28 km on NH-44; opened April 2017."],["The world's longest highway tunnel above 10,000 feet","Atal Tunnel, Himachal Pradesh","About 9.02 km under the Rohtang Pass; opened October 2020."],["India's longest road tunnel being built","Zojila Tunnel, Jammu and Kashmir–Ladakh","About 13 km; dug through in June 2026; due to open around 2028."],["India's longest national highway","NH-44","Srinagar to Kanyakumari."],["India's longest expressway (still being finished)","Delhi–Mumbai Expressway","About 1,386 km; most of it open; full completion targeted around 2028."],["India's longest fully open greenfield expressway","Samruddhi Mahamarg (Mumbai–Nagpur)","701 km; the last stretch opened in June 2025."]]},{"k":"mapfig","title":"India's record bridges, tunnels and roads","pins":[["1",72.95,18.95,"India's longest sea bridge — Atal Setu (Mumbai Trans Harbour Link)","n"],["2",95.62,27.78,"India's longest river bridge open end to end — Bhupen Hazarika Setu (Dhola–Sadiya), Assam","n"],["3",94.8,27.42,"India's longest rail-cum-road bridge — Bogibeel Bridge, Assam","n"],["4",76.25,9.99,"India's longest rail-only bridge — Vembanad Rail Bridge, Kochi","n"],["5",74.88,33.15,"The world's highest railway arch bridge — Chenab Bridge, Jammu and Kashmir","n"],["6",74.95,33.05,"India's first cable-stayed railway bridge — Anji Khad Bridge, Jammu and Kashmir","n"],["7",75.2,33.3,"India's longest railway tunnel in use — T-50 (Sumber–Khari), Jammu and Kashmir","n"],["8",78.6,30.15,"India's longest rail tunnel yet bored — Tunnel 8, Rishikesh–Karnaprayag line","n"],["9",75.27,33.03,"India's longest road tunnel in use — Dr Syama Prasad Mookerjee (Chenani–Nashri) Tunnel, Jammu and Kashmir","n"],["10",77.15,32.4,"The world's longest highway tunnel above 10,000 feet — Atal Tunnel, Himachal Pradesh","n"],["11",75.5,34.27,"India's longest road tunnel being built — Zojila Tunnel, Jammu and Kashmir–Ladakh","n"],["12",77.6,22.5,"India's longest national highway — NH-44","n"],["13",75,24.5,"India's longest expressway (still being finished) — Delhi–Mumbai Expressway","n"],["14",76.8,20,"India's longest fully open greenfield expressway — Samruddhi Mahamarg (Mumbai–Nagpur)","n"]],"facts":[["1 · India's longest sea bridge","Atal Setu (Mumbai Trans Harbour Link)"],["2 · India's longest river bridge open end to end","Bhupen Hazarika Setu (Dhola–Sadiya), Assam"],["3 · India's longest rail-cum-road bridge","Bogibeel Bridge, Assam"],["4 · India's longest rail-only bridge","Vembanad Rail Bridge, Kochi"],["5 · The world's highest railway arch bridge","Chenab Bridge, Jammu and Kashmir"],["6 · India's first cable-stayed railway bridge","Anji Khad Bridge, Jammu and Kashmir"],["7 · India's longest railway tunnel in use","T-50 (Sumber–Khari), Jammu and Kashmir"],["8 · India's longest rail tunnel yet bored","Tunnel 8, Rishikesh–Karnaprayag line"],["9 · India's longest road tunnel in use","Dr Syama Prasad Mookerjee (Chenani–Nashri) Tunnel, Jammu and Kashmir"],["10 · The world's longest highway tunnel above 10,000 feet","Atal Tunnel, Himachal Pradesh"],["11 · India's longest road tunnel being built","Zojila Tunnel, Jammu and Kashmir–Ladakh"],["12 · India's longest national highway","NH-44"],["13 · India's longest expressway (still being finished)","Delhi–Mumbai Expressway"],["14 · India's longest fully open greenfield expressway","Samruddhi Mahamarg (Mumbai–Nagpur)"]],"cap":"Numbers match the list. Pins for NH-44 and the expressways mark a point on the route. Kashmir's cluster is easier to read with ＋ or ⛶."},{"k":"table","title":"Buildings and places","head":["Record","Holder","Note"],"rows":[["the world's tallest statue","Statue of Unity, Ekta Nagar (Gujarat)","182 m — Sardar Patel, on an island in the Narmada; unveiled 2018."],["the world's largest cricket stadium","Narendra Modi Stadium, Ahmedabad","About 1,32,000 seats."],["the world's highest gateway","Buland Darwaza, Fatehpur Sikri","Built by Akbar after his conquest of Gujarat (1573)."],["India's largest dome","Gol Gumbaz, Vijayapura (Karnataka)","Tomb of Muhammad Adil Shah, with a 'whispering gallery'."],["the world's tallest brick minaret","Qutub Minar, Delhi","About 72.5 m; begun by Qutbuddin Aibak."],["India's oldest and largest museum","Indian Museum, Kolkata","Founded in 1814."],["India's largest library","National Library, Kolkata","By number of books."],["India's highest post office","Hikkim, Himachal Pradesh","In Spiti, about 4,400 m up."],["India's highest commercial airport","Kushok Bakula Rimpochee Airport, Leh","About 3,256 m above sea level."],["India's busiest airport","Indira Gandhi International Airport, Delhi","By passengers."]]},{"k":"mapfig","title":"Where the record buildings stand","pins":[["1",73.72,21.84,"Statue of Unity, Ekta Nagar (Gujarat)","n"],["2",72.6,23.09,"Narendra Modi Stadium, Ahmedabad","n"],["3",77.66,27.09,"Buland Darwaza, Fatehpur Sikri","n"],["4",75.74,16.83,"Gol Gumbaz, Vijayapura (Karnataka)","n"],["5",77.19,28.52,"Qutub Minar, Delhi","n"],["6",88.35,22.56,"Indian Museum, Kolkata","n"],["7",88.33,22.53,"National Library, Kolkata","n"],["8",78.07,32.25,"Hikkim, Himachal Pradesh","n"],["9",77.55,34.14,"Kushok Bakula Rimpochee Airport, Leh","n"],["10",77.1,28.56,"Indira Gandhi International Airport, Delhi","n"]],"facts":[["1 · Statue of Unity, Ekta Nagar (Gujarat)","the world's tallest statue"],["2 · Narendra Modi Stadium, Ahmedabad","the world's largest cricket stadium"],["3 · Buland Darwaza, Fatehpur Sikri","the world's highest gateway"],["4 · Gol Gumbaz, Vijayapura (Karnataka)","India's largest dome"],["5 · Qutub Minar, Delhi","the world's tallest brick minaret"],["6 · Indian Museum, Kolkata","India's oldest and largest museum"],["7 · National Library, Kolkata","India's largest library"],["8 · Hikkim, Himachal Pradesh","India's highest post office"],["9 · Kushok Bakula Rimpochee Airport, Leh","India's highest commercial airport"],["10 · Indira Gandhi International Airport, Delhi","India's busiest airport"]],"cap":"Numbers match the list; the two Kolkata records sit together."},{"k":"table","title":"Nature and the map","head":["Record","Holder","Note"],"rows":[["India's largest district by area","Kachchh (Gujarat)","About 45,600 sq km."],["India's smallest district by area","Mahe (Puducherry)","About 9 sq km, on the Kerala coast."],["India's highest waterfall","Kunchikal Falls, Karnataka","About 455 m, on the Varahi river."],["India's largest desert","Thar (Great Indian Desert)","Mostly in Rajasthan."],["India's longest glacier","Siachen","In the Karakoram, Ladakh."],["India's wettest place","Mawsynram, Meghalaya","Highest average yearly rainfall."],["India's coldest inhabited place","Dras, Ladakh","On the road from Srinagar to Kargil."],["India's largest state by area","Rajasthan","Goa is the smallest."],["India's longest river","Ganga","About 2,525 km."],["India's largest freshwater lake","Wular, Jammu and Kashmir","The Jhelum flows through it."]]},{"k":"link","h":"Rivers, lakes, peaks, dams and states have full lessons elsewhere — see <a href=\"study-indian-geography.html\">Indian Geography<\/a>, <a href=\"study-rivers-india.html\">Rivers of India<\/a> and <a href=\"study-states-uts.html?lesson=S10\">States &amp; UTs<\/a>. Railway records (longest platform, highest station) and road facts (Umling La, Sela Tunnel) are in <a href=\"study-industries-transport.html?lesson=T7\">Industries &amp; Transport<\/a>."},{"k":"trick","h":"Mumbai's sea, Assam's rivers, Kashmir's mountains: <b>“Atal over Sea, Bhupen over River, T-50 under Rock”<\/b>. For roads — <b>NH-44 runs Snow to Sea<\/b> (Srinagar to Kanyakumari)."},{"k":"trap","h":"<b>Atal Setu<\/b> (Mumbai sea bridge) and the <b>Atal Tunnel<\/b> (Himachal) are different. <b>Zojila<\/b> and <b>Tunnel 8<\/b> are longer than today's record-holders but are <b>not yet in use<\/b>. The Statue of Unity stands in the <b>Narmada<\/b>, not the Sabarmati. <b>Jog Falls<\/b> is famous, but <b>Kunchikal<\/b> is higher."}],"sum":["Sea bridge: Atal Setu (about 21.8 km, 2024). River bridge: Bhupen Hazarika Setu (9.15 km); Kacchi Dargah–Bidupur will pass it.","Rail-cum-road: Bogibeel; rail-only: Vembanad; highest rail arch: Chenab (2025); first cable-stayed rail bridge: Anji Khad.","Rail tunnel in use: T-50 (12.77 km); road tunnel in use: Chenani–Nashri (9.28 km); Atal Tunnel — longest above 10,000 ft.","Being built: Tunnel 8 (14.57 km), Zojila (13 km), Delhi–Mumbai Expressway (about 1,386 km).","Statue of Unity 182 m; Narendra Modi Stadium; Buland Darwaza; Gol Gumbaz; Qutub Minar.","Kachchh largest district, Mahe smallest; Kunchikal highest waterfall; Mawsynram wettest; Dras coldest."],"part":["Part 3 · Records, nicknames and revision","रिकॉर्ड, उपनाम और पुनरावृत्ति"],"g":"fs"},
{"id":"F8","heat":1,"title":"Superlatives of the world","hi":"विश्व के सर्वोच्च","blocks":[{"k":"hot","h":"Asked now and then: the world's <b>tallest building<\/b> (Burj Khalifa), <b>longest bridge<\/b> (Danyang–Kunshan), <b>highest bridge<\/b> (Huajiang Grand Canyon, 2025), <b>longest rail and road tunnels<\/b> (Gotthard, Lærdal), <b>longest railway<\/b> (Trans-Siberian), the <b>most populous country<\/b> (India) and the record animals and plants."},{"k":"story","h":"<p>People keep building higher and longer. Dubai's <b>Burj Khalifa<\/b> (828 m) has been the tallest building since 2010; Saudi Arabia's <b>Jeddah Tower<\/b>, planned to pass one kilometre, is due around 2028. China holds the bridge records: the 164.8-km <b>Danyang–Kunshan Grand Bridge<\/b> is the longest, and in September 2025 the <b>Huajiang Grand Canyon Bridge<\/b> opened about 625 m above the Beipan river — the highest in the world. Under the Alps, the 57-km <b>Gotthard Base Tunnel<\/b> is the longest railway tunnel; Norway's <b>Lærdal<\/b> (24.5 km) is the longest road tunnel.<\/p><p>Nature has its own champions. The <b>blue whale<\/b> is the largest animal that has ever lived; the <b>cheetah<\/b> is the fastest on land, the <b>peregrine falcon<\/b> the fastest of all in a dive. Among countries, <b>Russia<\/b> is the largest, <b>Vatican City<\/b> the smallest, and since 2023 <b>India<\/b> has the most people.<\/p>","key":"Burj Khalifa · Danyang–Kunshan · Huajiang (2025) · Gotthard · Lærdal · Trans-Siberian · blue whale · India most populous."},{"k":"table","title":"Built by people (as of October 2026)","head":["Record","Holder","Note"],"rows":[["the world's tallest building","Burj Khalifa, Dubai","828 m, since 2010; the Jeddah Tower, aiming past 1,000 m, is due around 2028."],["the world's longest bridge","Danyang–Kunshan Grand Bridge, China","About 164.8 km — a viaduct on the Beijing–Shanghai high-speed railway."],["the world's longest sea crossing","Hong Kong–Zhuhai–Macau Bridge, China","About 55 km of bridges, islands and an undersea tunnel; opened 2018."],["the world's highest bridge","Huajiang Grand Canyon Bridge, China","About 625 m above the Beipan river, in Guizhou; opened September 2025."],["the world's longest railway tunnel","Gotthard Base Tunnel, Switzerland","About 57 km under the Alps; opened 2016."],["the world's longest road tunnel","Lærdal Tunnel, Norway","About 24.5 km; opened 2000."],["the world's longest railway line","Trans-Siberian Railway, Russia","Moscow to Vladivostok, about 9,289 km."],["the world's longest man-made structure","Great Wall of China","Thousands of kilometres of walls built over many dynasties."],["the world's longest canal","Grand Canal, China","Beijing to Hangzhou, about 1,800 km."],["the world's largest religious monument","Angkor Wat, Cambodia","A 12th-century temple, first Hindu, later Buddhist."],["the world's busiest airport","Hartsfield–Jackson Atlanta International","About 106 million passengers in 2025."],["the railway station with the most platforms","Grand Central Terminal, New York","44 platforms."]]},{"k":"worldfig","title":"The world's record structures","minw":640,"pins":[["1",55.27,25.2,"Burj Khalifa, Dubai","n"],["2",120.5,31.8,"Danyang–Kunshan Grand Bridge, China","n"],["3",113.75,22.3,"Hong Kong–Zhuhai–Macau Bridge, China","n"],["4",105.6,25.7,"Huajiang Grand Canyon Bridge, China","n"],["5",8.8,46.6,"Gotthard Base Tunnel, Switzerland","n"],["6",7.4,61.05,"Lærdal Tunnel, Norway","n"],["7",104.3,52.3,"Trans-Siberian Railway, Russia","n"],["8",116.57,40.43,"Great Wall of China","n"],["9",118,34,"Grand Canal, China","n"],["10",103.87,13.41,"Angkor Wat, Cambodia","n"],["11",-84.43,33.64,"Hartsfield–Jackson Atlanta International","n"],["12",-73.98,40.75,"Grand Central Terminal, New York","n"]],"legend":[["1 Burj Khalifa, Dubai","world's tallest building"],["2 Danyang–Kunshan Grand Bridge, China","world's longest bridge"],["3 Hong Kong–Zhuhai–Macau Bridge, China","world's longest sea crossing"],["4 Huajiang Grand Canyon Bridge, China","world's highest bridge"],["5 Gotthard Base Tunnel, Switzerland","world's longest railway tunnel"],["6 Lærdal Tunnel, Norway","world's longest road tunnel"],["7 Trans-Siberian Railway, Russia","world's longest railway line"],["8 Great Wall of China","world's longest man-made structure"],["9 Grand Canal, China","world's longest canal"],["10 Angkor Wat, Cambodia","world's largest religious monument"],["11 Hartsfield–Jackson Atlanta International","world's busiest airport"],["12 Grand Central Terminal, New York","railway station with the most platforms"]],"cap":"China holds the bridge and canal records; the Alps and Norway the tunnel records."},{"k":"photos","title":"In pictures","items":[["Burj_Khalifa","Burj Khalifa","828 m"],["Danyang–Kunshan_Grand_Bridge","Danyang–Kunshan","164.8 km"],["Huajiang_Grand_Canyon_Bridge","Huajiang Grand Canyon Bridge","2025"],["Gotthard_Base_Tunnel","Gotthard Base Tunnel","57 km"],["Great_Wall_of_China","Great Wall of China","Longest structure"],["Angkor_Wat","Angkor Wat","Largest religious monument"]]},{"k":"table","title":"Countries","head":["Record","Holder","Note"],"rows":[["the world's most populous country","India","Passed China in 2023, by UN estimates."],["the largest country by area","Russia","About 17.1 million sq km."],["the smallest country by area and people","Vatican City","About 0.44 sq km, inside Rome."],["the largest landlocked country","Kazakhstan","Ninth largest country overall."],["the largest archipelago country","Indonesia","More than 17,000 islands."],["the country with the longest coastline","Canada","Its Arctic islands add a huge length."]]},{"k":"table","title":"Living things","head":["Record","Holder","Note"],"rows":[["the largest animal ever","Blue whale","Up to about 30 m long."],["the largest land animal","African bush elephant","The Asian elephant is smaller."],["the tallest animal","Giraffe","Up to about 5.5 m."],["the fastest land animal","Cheetah","About 100–110 km/h in short bursts."],["the fastest animal in a dive","Peregrine falcon","Over 300 km/h when it stoops on prey."],["the largest living bird","Ostrich","It cannot fly."],["the smallest bird","Bee hummingbird","Found in Cuba; about 5 cm long."],["the largest reptile","Saltwater crocodile","Also found in Bhitarkanika, Odisha."],["the longest venomous snake","King cobra","Up to about 5.5 m."],["the largest single flower","Rafflesia arnoldii","Up to about 1 m across, in the forests of Sumatra and Borneo."],["the tallest trees","Coast redwoods","California; the tallest, 'Hyperion', is about 116 m."]]},{"k":"photos","title":"Record-breakers of nature","items":[["Blue_whale","Blue whale","largest animal ever"],["African_bush_elephant","African bush elephant","largest land animal"],["Giraffe","Giraffe","tallest animal"],["Cheetah","Cheetah","fastest land animal"],["Peregrine_falcon","Peregrine falcon","fastest animal in a dive"],["Ostrich","Ostrich","largest living bird"],["Bee_hummingbird","Bee hummingbird","smallest bird"],["Saltwater_crocodile","Saltwater crocodile","largest reptile"],["King_cobra","King cobra","longest venomous snake"],["Rafflesia_arnoldii","Rafflesia arnoldii","largest single flower"],["Sequoia_sempervirens","Coast redwoods","tallest trees"]]},{"k":"facts","title":"Nature's world records in one line","rows":[["Ocean and point","Pacific — largest and deepest; Challenger Deep (Mariana Trench) — deepest point"],["River","Nile — longest; Amazon — most water"],["Peak","Everest (8,849 m)"],["Deserts","Antarctica — largest overall; Sahara — largest hot desert"],["Lakes","Caspian — largest; Superior — largest freshwater; Baikal — deepest"],["Island and reef","Greenland — largest island; Great Barrier Reef (Australia) — largest coral reef system"],["Waterfall","Angel Falls, Venezuela"],["The full lessons","See <a href=\"study-world-geography.html?lesson=W1\">World Geography<\/a> (W1, W5–W9) and <a href=\"study-physical-geography.html\">Physical Geography<\/a>"]]},{"k":"trick","h":"China's bridge pair — <b>“Long Danyang, High Huajiang”<\/b>. Tunnels by country — <b>“Swiss trains, Norwegian cars”<\/b>: Gotthard (rail), Lærdal (road)."},{"k":"trap","h":"The <b>Jeddah Tower<\/b> is <b>not finished<\/b> — Burj Khalifa is still the tallest (as of October 2026). The <b>Chenab<\/b> is the highest <b>railway<\/b> bridge; the <b>Huajiang Grand Canyon<\/b> bridge is the highest bridge of any kind. <b>Giant sequoias<\/b> are the largest trees by volume, but <b>coast redwoods<\/b> are the tallest. The <b>titan arum<\/b> has the largest flower <i>cluster<\/i>; <b>Rafflesia<\/b> the largest single flower."}],"sum":["Burj Khalifa (828 m) tallest building; Jeddah Tower due around 2028.","Danyang–Kunshan longest bridge; Hong Kong–Zhuhai–Macau longest sea crossing; Huajiang Grand Canyon highest bridge (2025).","Gotthard Base (57 km) longest rail tunnel; Lærdal (24.5 km) longest road tunnel; Trans-Siberian longest railway.","India most populous (2023); Russia largest; Vatican smallest; Kazakhstan largest landlocked; Indonesia largest archipelago.","Blue whale largest animal; cheetah fastest on land; peregrine falcon fastest in a dive; ostrich largest bird; bee hummingbird smallest."],"part":["Part 3 · Records, nicknames and revision","रिकॉर्ड, उपनाम और पुनरावृत्ति"],"g":"fs"},
{"id":"F9","heat":1,"title":"Nicknames of places","hi":"स्थानों के उपनाम","blocks":[{"k":"hot","h":"Asked now and then: <b>Pink City<\/b> (Jaipur), <b>Blue City<\/b> and <b>Sun City<\/b> (Jodhpur), <b>Golden City<\/b> (Jaisalmer), <b>City of Lakes<\/b> (Udaipur), <b>City of Joy<\/b> (Kolkata), <b>City of Nawabs<\/b> (Lucknow), <b>Queen of the Arabian Sea<\/b> (Kochi), <b>God's Own Country<\/b> (Kerala) — and a few world nicknames."},{"k":"story","h":"<p>A nickname usually hides a reason. <b>Jaipur<\/b> was painted pink to welcome the Prince of Wales in 1876. <b>Jodhpur<\/b>'s old town is washed in blue below Mehrangarh Fort, and the sun shines there almost all year. <b>Jaisalmer<\/b> rises in yellow sandstone from the Thar, so it glows like gold. <b>Udaipur<\/b> grew around the lakes Pichola and Fateh Sagar.<\/p><p>Elsewhere: <b>Kolkata<\/b> became the 'City of Joy' after a 1985 novel; <b>Lucknow<\/b> is the 'City of Nawabs'; <b>Hyderabad<\/b> traded pearls; <b>Kochi<\/b>'s harbour made it the 'Queen of the Arabian Sea'; and <b>Bhubaneswar<\/b>'s hundreds of temples made it the 'Temple City of India'.<\/p>","key":"Pink Jaipur · Blue and Sun Jodhpur · Golden Jaisalmer · Lakes Udaipur · Joy Kolkata · Nawabs Lucknow · Pearls Hyderabad."},{"k":"table","title":"Nicknames of Indian cities","head":["Nickname","City","Why"],"rows":[["Pink City","Jaipur","Painted pink for the Prince of Wales's visit in 1876."],["Blue City","Jodhpur","Blue houses crowd the old town below Mehrangarh Fort."],["Sun City","Jodhpur","Bright sunshine nearly all year."],["Golden City","Jaisalmer","Its fort and havelis are of yellow sandstone."],["City of Lakes","Udaipur","Lakes Pichola, Fateh Sagar and more; Bhopal is also called so."],["City of Joy","Kolkata","From Dominique Lapierre's novel of 1985."],["City of Nawabs","Lucknow","Seat of the Nawabs of Awadh."],["City of Pearls","Hyderabad","Long a centre of the pearl trade."],["Temple City of India","Bhubaneswar","Hundreds of temples, such as the Lingaraja."],["City of Seven Islands","Mumbai","Seven islands joined by land reclamation."],["Queen of the Arabian Sea","Kochi","A great natural harbour and spice port."],["Venice of the East","Alappuzha (Alleppey)","Canals and backwaters; Udaipur is sometimes called so too."],["Orange City","Nagpur","Famous for its oranges."],["Oxford of the East","Pune","Its many colleges and universities."],["City of Destiny","Visakhapatnam","A port city between hills and sea."],["Athens of the East","Madurai","An ancient seat of Tamil learning."],["Spiritual Capital of India","Varanasi","One of the oldest living cities, on the Ganga."],["Mini Switzerland of India","Khajjiar","A meadow town in Chamba, Himachal Pradesh."]]},{"k":"mapfig","title":"The nickname cities on the map","pins":[["1",75.79,26.91,"Pink City — Jaipur","n"],["2",73.02,26.24,"Blue City — Jodhpur","n"],["3",73.02,26.24,"Sun City — Jodhpur","n"],["4",70.91,26.92,"Golden City — Jaisalmer","n"],["5",73.71,24.58,"City of Lakes — Udaipur","n"],["6",88.36,22.57,"City of Joy — Kolkata","n"],["7",80.95,26.85,"City of Nawabs — Lucknow","n"],["8",78.48,17.39,"City of Pearls — Hyderabad","n"],["9",85.82,20.3,"Temple City of India — Bhubaneswar","n"],["10",72.88,19.08,"City of Seven Islands — Mumbai","n"],["11",76.27,9.93,"Queen of the Arabian Sea — Kochi","n"],["12",76.34,9.5,"Venice of the East — Alappuzha (Alleppey)","n"],["13",79.09,21.15,"Orange City — Nagpur","n"],["14",73.86,18.52,"Oxford of the East — Pune","n"],["15",83.22,17.69,"City of Destiny — Visakhapatnam","n"],["16",78.12,9.93,"Athens of the East — Madurai","n"],["17",83,25.32,"Spiritual Capital of India — Varanasi","n"],["18",76.06,32.55,"Mini Switzerland of India — Khajjiar","n"]],"facts":[["1 · Pink City","Jaipur"],["2 · Blue City","Jodhpur"],["3 · Sun City","Jodhpur"],["4 · Golden City","Jaisalmer"],["5 · City of Lakes","Udaipur"],["6 · City of Joy","Kolkata"],["7 · City of Nawabs","Lucknow"],["8 · City of Pearls","Hyderabad"],["9 · Temple City of India","Bhubaneswar"],["10 · City of Seven Islands","Mumbai"],["11 · Queen of the Arabian Sea","Kochi"],["12 · Venice of the East","Alappuzha (Alleppey)"],["13 · Orange City","Nagpur"],["14 · Oxford of the East","Pune"],["15 · City of Destiny","Visakhapatnam"],["16 · Athens of the East","Madurai"],["17 · Spiritual Capital of India","Varanasi"],["18 · Mini Switzerland of India","Khajjiar"]],"cap":"Numbers match the list. Rajasthan alone has the Pink, Blue, Sun, Golden and Lake cities."},{"k":"table","title":"States and regions","head":["Nickname","Place","Why"],"rows":[["God's Own Country","Kerala","The state's tourism slogan since the 1990s."],["Spice Garden of India","Kerala","Pepper, cardamom and other spices."],["Abode of Clouds","Meghalaya","The meaning of its Sanskrit name."],["Heaven on Earth","Kashmir Valley","Its lakes and gardens charmed the Mughals."],["Jewel of India","Manipur","A name Jawaharlal Nehru gave it."],["Land of the Red River and Blue Hills","Assam","The Brahmaputra and the hills around it."]]},{"k":"table","title":"Around the world","head":["Nickname","Place","Why"],"rows":[["Pearl of the Indian Ocean","Sri Lanka","An island of beauty off India's tip."],["Land of a Thousand Hills","Rwanda","Its hilly landscape."],["Land of Fire and Ice","Iceland","Volcanoes and glaciers side by side."],["Rainbow Nation","South Africa","Archbishop Desmond Tutu's name for its many peoples."],["Land of Tulips","Netherlands","Its tulip fields."],["Land of Smiles","Thailand","A tourism name for its friendly people."],["Land of the Eagles","Albania","Its own name, Shqipëria, is linked to the eagle."],["Hermit Kingdom","North Korea","Shut off from the world (first said of old Korea)."],["Graveyard of Empires","Afghanistan","Great powers have failed to hold it."],["City of Light","Paris","An early city of street lighting and a centre of ideas."],["City of Seven Hills","Rome","Built on seven hills by the Tiber."],["Queen of the Adriatic","Venice","A city of canals on the Adriatic Sea."],["City of Dreaming Spires","Oxford","The spires of its colleges."],["Granite City","Aberdeen","Built of local grey granite."],["Gate of Tears","Bab-el-Mandeb","A dangerous strait between Yemen and Djibouti."],["Ring of Fire","the rim of the Pacific Ocean","A belt of volcanoes and earthquakes."],["Third Pole","the Himalaya and Tibetan Plateau","More ice than anywhere outside the polar regions."]]},{"k":"link","h":"Industrial nicknames — <b>Manchester of India<\/b> (Ahmedabad), <b>Silicon Valley<\/b> (Bengaluru), <b>Detroit of Asia<\/b> (Chennai), <b>Steel City<\/b> (Jamshedpur), <b>Diamond City<\/b> (Surat) — are in <a href=\"study-industries-transport.html?lesson=T4\">Industries &amp; Transport<\/a>. 'Land of the Rising Sun', 'Land of the Midnight Sun', 'Dark Continent', 'Big Apple' and the other country nicknames are in <a href=\"study-world-geography.html?lesson=W10\">World Geography<\/a>, which also has the Pamir as the 'Roof of the World'. River nicknames ('Sorrow of Bihar', 'Sorrow of China') are in <a href=\"study-rivers-india.html\">Rivers of India<\/a>; 'Scotland of the East' (Shillong) and 'Land of Five Rivers' (Punjab) are in <a href=\"study-states-uts.html\">States &amp; UTs<\/a>."},{"k":"trick","h":"Rajasthan's colour wheel — <b>“Pink Jaipur, Blue Jodhpur, Gold Jaisalmer, White-and-Lakes Udaipur”<\/b>. Kerala's twins — <b>Kochi is the Queen, Alappuzha is Venice<\/b>."},{"k":"trap","h":"<b>Golden City<\/b> is <b>Jaisalmer<\/b> — Amritsar has the Golden <i>Temple<\/i>. <b>Sun City<\/b> and <b>Blue City<\/b> are both <b>Jodhpur<\/b>. <b>Temple City of India<\/b> is usually <b>Bhubaneswar<\/b>; <b>Madurai<\/b> is the <b>Athens of the East<\/b>. <b>City of Light<\/b> in world lists is <b>Paris<\/b>."}],"sum":["Jaipur Pink City; Jodhpur Blue City and Sun City; Jaisalmer Golden City; Udaipur City of Lakes.","Kolkata City of Joy; Lucknow City of Nawabs; Hyderabad City of Pearls; Bhubaneswar Temple City; Mumbai City of Seven Islands.","Kochi Queen of the Arabian Sea; Alappuzha Venice of the East; Nagpur Orange City; Pune Oxford of the East; Madurai Athens of the East.","Kerala God's Own Country and Spice Garden; Meghalaya Abode of Clouds; Kashmir Heaven on Earth; Manipur Jewel of India.","Sri Lanka Pearl of the Indian Ocean; Rwanda Thousand Hills; Iceland Fire and Ice; South Africa Rainbow Nation; Paris City of Light; Rome Seven Hills."],"part":["Part 3 · Records, nicknames and revision","रिकॉर्ड, उपनाम और पुनरावृत्ति"],"g":"fs"},
{"id":"F10","heat":2,"title":"Mixed revision: symbols, firsts, records and nicknames","hi":"मिश्रित पुनरावृत्ति: प्रतीक, प्रथम, रिकॉर्ड और उपनाम","blocks":[{"k":"hot","h":"Exams mix these topics in 'which pair is correctly matched' and 'arrange in order' questions. This lesson puts the dates in order and sets the look-alike pairs side by side."},{"k":"story","h":"<p>Revise this app in four sweeps. <b>Symbols<\/b>: say the dates aloud in order — 1947 flag, 1950 anthem, song and emblem, 1957 calendar, 1963 bird, 2008 river, 2009 dolphin, 2010 elephant and ₹, 2012 microbe. <b>Firsts<\/b>: picture each post with its first holder, then the first woman beside him. <b>Records<\/b>: remember that India's newest bridges and tunnels win only once they are open. <b>Nicknames<\/b>: tie each name to its reason.<\/p><p>Then work through the look-alike pairs below — almost every wrong answer in this topic comes from mixing two of them.<\/p>","key":"Order the dates, then separate the look-alikes: Atal Setu vs Atal Tunnel, IAS vs IPS, aquatic vs heritage, Mundaka vs Mandukya."},{"k":"tl","title":"Symbols in order of adoption","rows":[["1947","22 July — the national flag"],["1950","24 January — the anthem and the song; 26 January — the State Emblem"],["1957","22 March — the Saka calendar"],["1963","The Indian peafowl as national bird"],["1973","Project Tiger, for the national animal"],["2008","The Ganga as national river"],["2009","5 October — the Ganges river dolphin as national aquatic animal"],["2010","The elephant as national heritage animal; the ₹ sign (15 July)"],["2012","Lactobacillus as national microbe"],["2026","Six-stanza Vande Mataram order (January); bill to protect the song passed (July)"]]},{"k":"table","title":"Look-alike pairs","head":["This","is not this","Remember"],"rows":[["Atal Setu — Mumbai sea bridge","Atal Tunnel — Himachal road tunnel","Both opened 2020–24, both named after Atal Bihari Vajpayee."],["Anna Rajam Malhotra — first woman IAS","Kiran Bedi — first woman IPS","Administrative 1951; Police 1972."],["Sarojini Naidu — first woman Governor","Sucheta Kripalani — first woman Chief Minister","Both in Uttar Pradesh."],["Ganges river dolphin — aquatic animal","Elephant — heritage animal","2009 and 2010."],["Mundaka Upanishad — Satyameva Jayate","Mandukya Upanishad","Only the first is right."],["Mountbatten — first Governor-General of free India","Rajagopalachari — first Indian Governor-General","1947 and 1948."],["Rakesh Sharma — first Indian in space","Shubhanshu Shukla — first Indian on the ISS","1984 and 2025."],["Bachendri Pal — first Indian woman on Everest","Junko Tabei — first woman on Everest","1984 and 1975."],["Sirimavo Bandaranaike — world's first woman PM","Indira Gandhi — India's first woman PM","1960 and 1966."],["Chenab — world's highest railway bridge","Huajiang Grand Canyon — world's highest bridge","India 2025; China 2025."],["Gotthard Base — longest rail tunnel","Lærdal — longest road tunnel","Switzerland and Norway."],["Golden City — Jaisalmer","Golden Temple — Amritsar","Sandstone versus a shrine."]]},{"k":"trick","h":"Before you answer a 'first' question, ask <b>three words<\/b>: <b>first in India or the world?<\/b> <b>first woman or first person?<\/b> <b>first, or first in use?<\/b> Most traps hide in one of these."},{"k":"trap","h":"<b>Tagore<\/b> wrote the anthem but <b>sang<\/b> the song (1896). <b>Pratibha Patil<\/b> was the first woman President; <b>Droupadi Murmu<\/b> the first from a Scheduled Tribe. The <b>lion<\/b> was the national animal <b>before<\/b> the tiger. <b>India has no national game<\/b>."}],"sum":["Dates: flag 1947; anthem, song, emblem 1950; calendar 1957; peafowl 1963; Ganga 2008; dolphin 2009; elephant and ₹ 2010; microbe 2012.","Separate: Atal Setu / Atal Tunnel; IAS Malhotra / IPS Bedi; Governor Naidu / CM Kripalani; Mountbatten / Rajaji.","India vs world: Bachendri Pal / Junko Tabei; Indira Gandhi / Bandaranaike; Chenab / Huajiang.","Ask: India or world? woman or person? first or first in use?"],"part":["Part 3 · Records, nicknames and revision","रिकॉर्ड, उपनाम और पुनरावृत्ति"],"g":"fs"}

  .steps + .stack:not(:has(> .block ~ .block)) > .block{grid-column:1/-1}
  .block,.qcard{padding:18px 20px;border-radius:14px}

  /* quizzes and question bank */
  #lq > .stack{display:grid;grid-template-columns:minmax(0,1fr);max-width:980px;gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qt{font-size:18px}
  #plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #plist .opts{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:wrap;overflow:visible}

  /* mock test: question with the answer grid alongside */
  .mbar{top:calc(env(safe-area-inset-top,0px) + 67px)}
  .view > .qcard{max-width:1000px}
  .view > .row.between{max-width:1000px}
  .view > #msub{max-width:1000px;width:100%}
  .view > .block.stack{max-width:760px}
  .pal{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .kpis{max-width:760px}

  /* revise: summary cards and sheets in columns */
  #rv > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #rv > .stack > .grph,#rv > .stack > p,#rv > .stack > .search,#rv > .stack > .callout{grid-column:1/-1}
  #dgl,#lml,#tll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #dgl > .grph,#dgl > p,#lml > p,#tll > .grph{grid-column:1/-1}
  #rv .search,#rv > #dgl ~ .search{max-width:520px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flash{min-height:300px;max-width:760px;margin:0 auto;padding:32px 36px}
  .flash .front{font-size:22px}

  /* learn: era cards across the top */
  .eras{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}
  .les{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}

</style>
<script id="shabd-deeplink">
(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();
</script>

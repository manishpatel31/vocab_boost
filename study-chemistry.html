mina dissolved in molten cryolite is electrolysed","Aluminium"],["Electrolytic refining","Impure metal as anode, pure metal collects on cathode","Copper, zinc, silver, gold"],["Zone refining","A molten zone sweeps impurities along","Ultra-pure silicon and germanium for chips"],["Distillation / liquation","By low boiling or melting point","Zinc, mercury (distil); tin, lead (liquation)"]]},{"k":"facts","title":"Iron and steel","rows":[["Blast furnace charge","Haematite + coke + limestone (flux); limestone removes silica as slag (CaSiO₃)"],["Pig iron","About 4% carbon; brittle"],["Cast iron","About 2–4% carbon; hard, brittle — pipes, stoves"],["Wrought iron","Purest form, below about 0.2% carbon; soft — chains, wires"],["Steel","About 0.1–1.5% carbon (plus other elements)"],["Stainless steel","Iron + chromium (at least about 10.5%) + nickel + a little carbon — does not rust"]]},{"k":"table","title":"Alloys","head":["Alloy","Made of","Use"],"rows":[["Brass","Copper + zinc","Utensils, decorations, fittings"],["Bronze","Copper + tin","Statues, medals, bells"],["Bell metal","Copper + tin (more tin)","Bells"],["Gun metal","Copper + tin + zinc","Gears, bearings, old guns"],["German silver","Copper + zinc + nickel (no silver!)","Utensils, coins, ornaments"],["Solder","Lead + tin","Joining electrical wires (low melting point)"],["Type metal","Lead + antimony + tin","Printing type"],["Stainless steel","Iron + chromium + nickel + carbon","Utensils, surgical tools"],["Duralumin","Aluminium + copper + magnesium + manganese","Aircraft, pressure cookers"],["Magnalium","Aluminium + magnesium","Light instruments, aircraft parts"],["Nichrome","Nickel + chromium","Heating coils of irons and heaters (high resistance)"],["Alnico","Aluminium + nickel + cobalt (+ iron)","Strong permanent magnets"],["Invar","Iron + nickel","Clock pendulums, measuring tapes (hardly expands)"],["Amalgam","Mercury + any other metal","Dental fillings (silver-tin amalgam)"],["Constantan","Copper + nickel","Resistance wire, thermocouples"],["22-carat gold","22 parts gold + 2 parts copper or silver","Jewellery; 24 carat is pure gold (about 91.6% gold in 22 carat)"]]},{"k":"trick","h":"<b>Brass = Copper + Zinc<\/b> — <i>“BraZZ”<\/i> has a Z; <b>Bronze = Copper + Tin<\/b> — <i>“BronTe”<\/i>. Ores: <b>“Galena Leads, Cinnabar Mercury, Cassiterite Tin, Bauxite Aluminium, Haematite Iron”<\/b>. <b>Roast = Sulphide in air; Calcine = Carbonate<\/b> (C with C)."},{"k":"trap","h":"<b>German silver has no silver<\/b>. <b>Magnetite (Fe₃O₄)<\/b> is the richest iron ore but <b>haematite (Fe₂O₃)<\/b> is the main one mined. <b>Iron pyrites<\/b> is 'fool's gold', an iron ore — not a gold ore. Aluminium is made by <b>electrolysis<\/b>, not by carbon. <b>Wrought iron<\/b> is the purest iron, not cast iron."}],"sum":["An ore is a mineral from which a metal can be extracted profitably; every ore is a mineral but not every mineral is an ore.","Bauxite → aluminium, haematite and magnetite → iron, galena → lead, cinnabar → mercury, cassiterite → tin, zinc blende → zinc.","Froth flotation concentrates sulphide ores; roasting heats sulphides in air; calcination heats carbonates without much air.","Reactive metals (Na, Mg, Al) are made by electrolysis; iron by reducing haematite with coke in a blast furnace.","Brass = Cu + Zn, bronze = Cu + Sn, solder = Pb + Sn, stainless steel = Fe + Cr + Ni, German silver = Cu + Zn + Ni."],"part":["Part 2 · Reactions and compounds","अभिक्रियाएँ और यौगिक"]},
{"id":"K11","g":"chem","heat":3,"title":"Carbon and its compounds","hi":"कार्बन और उसके यौगिक","blocks":[{"k":"hot","h":"Always one or two questions: <b>allotropes of carbon<\/b> (diamond, graphite, fullerene, graphene), <b>alkane / alkene / alkyne<\/b> formulas, <b>functional groups<\/b> (formalin, acetone, ethanol), <b>which gas ripens fruit<\/b>, and <b>who made urea first<\/b>."},{"k":"story","h":"<p>Carbon is the <b>Lego brick<\/b> of life. It has four hands (valency 4) and loves holding hands with other carbon atoms in long chains, branches and rings — this is called <b>catenation<\/b>. That is why carbon forms more compounds than any other element: millions of them, from the sugar in your tea to the DNA in your cells.<\/p><p>Pure carbon itself comes in different outfits called <b>allotropes<\/b>. In <b>diamond<\/b> every carbon holds four others in a rigid 3-D net — the hardest natural substance. In <b>graphite<\/b> each carbon holds only three, forming flat sheets that slide over each other — soft, slippery, and it conducts electricity (your 'pencil lead'). In 1985 a football-shaped molecule of 60 carbons, <b>buckminsterfullerene<\/b>, was found, and in 2004 a single sheet of graphite, <b>graphene<\/b>, was peeled off with sticky tape.<\/p><p>Chemists once believed living things had a special 'vital force' needed to make organic compounds. In 1828 <b>Friedrich Wöhler<\/b> made <b>urea<\/b> in a flask from an inorganic salt — and modern organic chemistry was born.<\/p>","key":"Carbon: valency 4 + catenation = millions of compounds; allotropes diamond (hard, insulator), graphite (soft, conductor), fullerene (C₆₀), graphene (single sheet)."},{"k":"table","title":"Allotropes of carbon","head":["Allotrope","Structure","Properties","Uses"],"rows":[["Diamond","Each C bonded to 4 others in a 3-D tetrahedral network","Hardest natural substance; does not conduct electricity; high refractive index (2.42) makes it sparkle","Jewellery, cutting and drilling tools, glass cutting"],["Graphite","Each C bonded to 3 others in flat hexagonal layers","Soft, slippery, conducts electricity","Pencils, lubricant, electrodes, moderator in nuclear reactors"],["Fullerene (C₆₀)","60 carbons in a football-like cage","Discovered 1985 (Kroto, Curl, Smalley — Nobel 1996)","Research, nanotechnology"],["Graphene","A single layer of graphite, one atom thick","Very strong, light, excellent conductor","Electronics; Geim and Novoselov, Nobel Physics 2010"],["Carbon nanotubes","Graphene rolled into tubes","Very strong","Nanotechnology"],["Amorphous forms","No regular arrangement","Coal, charcoal, coke, lampblack (soot)","Fuel; lampblack in ink and shoe polish; activated charcoal in gas masks and water filters"]]},{"k":"photos","title":"Carbon's many forms","items":[["Diamond","Diamond","3-D network — hardest"],["Graphite","Graphite","Layers — conducts"],["Buckminsterfullerene","Fullerene","C₆₀ football"],["Graphene","Graphene","One atom thick"],["Carbon_nanotube","Carbon nanotube","Rolled graphene"],["Charcoal","Charcoal","Amorphous"]]},{"k":"table","title":"Hydrocarbons","head":["Family","General formula","Bonds","Examples"],"rows":[["Alkanes (saturated)","CₙH₂ₙ₊₂","Only single C–C bonds","Methane CH₄, ethane C₂H₆, propane C₃H₈, butane C₄H₁₀"],["Alkenes (unsaturated)","CₙH₂ₙ","At least one C=C double bond","Ethene (ethylene) C₂H₄ — ripens fruit; propene"],["Alkynes (unsaturated)","CₙH₂ₙ₋₂","At least one C≡C triple bond","Ethyne (acetylene) C₂H₂ — oxy-acetylene welding flame"],["Aromatic","Rings","Benzene ring","Benzene C₆H₆ (ring structure given by Kekulé)"]]},{"k":"table","title":"Functional groups","head":["Group","Formula","Ending","Example and use"],"rows":[["Alcohol","–OH","-ol","Ethanol (C₂H₅OH) — drinks, sanitisers, fuel; methanol (wood spirit) — poisonous"],["Aldehyde","–CHO","-al","Methanal (formaldehyde); 40% solution = formalin, preserves biological specimens"],["Ketone","C=O inside the chain","-one","Propanone (acetone) — nail-polish remover, solvent"],["Carboxylic acid","–COOH","-oic acid","Ethanoic acid (acetic acid) — vinegar"],["Halide","–Cl, –Br, –I","chloro-, bromo-","Chloromethane; chloroform CHCl₃"],["Ester","–COO–","-oate","Fruity smells and flavours; acid + alcohol → ester (esterification)"],["Amine","–NH₂","-amine","Methylamine; amino acids in proteins"]]},{"k":"facts","title":"Facts the papers pick","rows":[["Homologous series","Members differ by –CH₂– (14 u) and have similar chemical properties"],["Isomers","Same formula, different structure — butane and isobutane (C₄H₁₀)"],["Father of organic chemistry","Friedrich Wöhler — made urea from ammonium cyanate (1828), ending the vital force theory"],["Fermentation","Sugar → ethanol + CO₂, by yeast (enzyme zymase); molasses is the raw material in India"],["Rectified spirit","About 95% ethanol"],["Absolute alcohol","100% ethanol"],["Denatured alcohol","Ethanol made unfit to drink by adding methanol, pyridine or dyes"],["Hooch tragedy","Methanol in illicit liquor — causes blindness and death"],["Power alcohol / ethanol blending","Ethanol mixed with petrol (India: E20 — 20% ethanol)"],["Fruit ripening gas","Ethylene (ethene); calcium carbide (gives acetylene) is banned for ripening"],["Breath analyser","Detects ethanol in breath (old ones: potassium dichromate turns orange → green)"],["Glycerol (glycerine)","By-product of soap making; used in cosmetics and explosives (nitroglycerine)"],["Saturated vs unsaturated fats","Animal fats mostly saturated (solid); vegetable oils unsaturated (liquid); hydrogenation turns oil into vanaspati"]]},{"k":"trick","h":"Alkane → <b>-ane, single<\/b>; alkene → <b>-ene, double<\/b>; alkyne → <b>-yne, triple<\/b> — the more letters after 'n'… just remember <b>A-E-Y = 1-2-3 bonds<\/b>. Formulas: <b>2n+2, 2n, 2n−2<\/b> — subtract 2 each step. <b>Formalin preserves, acetone removes (nail polish), vinegar is acetic<\/b>."},{"k":"trap","h":"<b>Graphite<\/b> conducts but <b>diamond<\/b> does not, though both are pure carbon. <b>Methanol<\/b> is poisonous; <b>ethanol<\/b> is drinking alcohol. <b>Ethylene<\/b> (C₂H₄) ripens fruit; <b>acetylene<\/b> (C₂H₂) is the welding gas. Graphene's Nobel (2010) was in <b>Physics<\/b>; fullerene's (1996) in <b>Chemistry<\/b>."}],"sum":["Carbon's valency of 4 and catenation give it more compounds than any other element.","Diamond is the hardest natural substance and an insulator; graphite is soft, slippery and conducts; fullerene is C₆₀; graphene is a single layer.","Alkanes CₙH₂ₙ₊₂ (methane), alkenes CₙH₂ₙ (ethene ripens fruit), alkynes CₙH₂ₙ₋₂ (acetylene for welding).","Formalin (formaldehyde) preserves specimens, acetone removes nail polish, vinegar is acetic acid; methanol in hooch causes blindness.","Wöhler made urea in 1828; ethanol is made by fermenting molasses with yeast."],"part":["Part 3 · Carbon and everyday chemistry","कार्बन और दैनिक रसायन"]},
{"id":"K12","g":"chem","heat":2,"title":"Polymers, plastics, fibres and rubber","hi":"बहुलक, प्लास्टिक, रेशे और रबर","blocks":[{"k":"hot","h":"Expect: <b>monomer of PVC / Teflon / polythene<\/b>, <b>first fully synthetic fibre<\/b> (nylon), <b>artificial silk<\/b> (rayon), <b>thermoplastic vs thermosetting<\/b> (bakelite, melamine), and <b>vulcanisation<\/b> of rubber."},{"k":"story","h":"<p>Think of a <b>pearl necklace<\/b>. Each pearl is a small molecule, a <b>monomer<\/b>; string thousands of them together and you get one giant molecule — a <b>polymer<\/b> ('poly' = many, 'mer' = parts). Nature makes them all the time: cotton and wood are <b>cellulose<\/b>, rice and potato are <b>starch<\/b>, hair and silk are <b>proteins<\/b>, and rubber comes from the milky <b>latex<\/b> of the rubber tree.<\/p><p>In the 20th century chemists learned to make their own. In 1907 <b>Leo Baekeland<\/b> made <b>bakelite<\/b>, the first fully synthetic plastic. In 1935 <b>Wallace Carothers<\/b> at DuPont made <b>nylon<\/b>, the first fully synthetic fibre — strong enough for parachutes and ropes. Then came polythene bags, PVC pipes, Teflon pans and polyester shirts.<\/p><p>Plastics are of two kinds. <b>Thermoplastics<\/b> soften on heating and can be remoulded, like wax (polythene, PVC). <b>Thermosetting<\/b> plastics set hard once and never soften again, like a boiled egg (bakelite, melamine) — perfect for switches and plates. The catch: most plastics do not rot, which is why single-use plastic was banned in India in 2022.<\/p>","key":"Monomer + monomer + … = polymer; thermoplastics remould (polythene, PVC), thermosets don't (bakelite, melamine); nylon was the first fully synthetic fibre."},{"k":"table","title":"Common synthetic polymers","head":["Polymer","Monomer(s)","Uses"],"rows":[["Polythene (polyethylene)","Ethene (ethylene)","Carry bags, bottles, toys, pipes"],["PVC (polyvinyl chloride)","Vinyl chloride","Pipes, raincoats, wire insulation, flooring"],["Teflon (PTFE)","Tetrafluoroethylene","Non-stick cookware coating"],["Polystyrene","Styrene","Thermocol (packing, disposable cups)"],["Nylon-6,6","Hexamethylenediamine + adipic acid","Ropes, parachutes, tents, toothbrush bristles, stockings"],["Polyester (terylene, dacron, PET)","Ethylene glycol + terephthalic acid","Clothes (terrycot, terrywool blends), PET bottles"],["Acrylic (orlon, PAN)","Acrylonitrile","Artificial wool — sweaters, blankets"],["Bakelite","Phenol + formaldehyde","Electrical switches, handles of pans (thermosetting)"],["Melamine","Melamine + formaldehyde","Crockery, floor tiles; resists heat and fire"],["Kevlar","An aromatic polyamide","Bullet-proof vests, helmets"],["Neoprene","Chloroprene","Synthetic rubber — hoses, gaskets, wetsuits"],["Buna-S / Buna-N","Butadiene + styrene / + acrylonitrile","Tyres; oil-resistant hoses"],["Glyptal","Ethylene glycol + phthalic acid","Paints and lacquers"]]},{"k":"table","title":"Natural, semi-synthetic and synthetic","head":["Type","Examples"],"rows":[["Natural polymers","Cellulose (cotton, wood), starch, proteins (silk, wool, hair), natural rubber, DNA, RNA"],["Semi-synthetic","Rayon (artificial silk, from wood pulp cellulose), cellulose acetate, vulcanised rubber"],["Synthetic","Nylon, polyester, acrylic, polythene, PVC, Teflon, bakelite"]]},{"k":"facts","title":"Rubber, fibres and plastics","rows":[["Natural rubber","cis-Polyisoprene from the latex of Hevea brasiliensis; latex is coagulated with formic or acetic acid"],["Vulcanisation","Heating rubber with sulphur (Charles Goodyear, 1839) — makes it hard, elastic and tough for tyres"],["Rayon","Artificial silk made from wood pulp — cheaper than silk, can be dyed"],["Nylon","First fully synthetic fibre (Carothers, DuPont, 1935); strong, elastic, light"],["Bakelite","First fully synthetic plastic (Leo Baekeland, 1907)"],["Thermoplastics","Soften on heating, can be recycled — polythene, PVC, polystyrene, nylon"],["Thermosetting","Set permanently — bakelite, melamine, urea-formaldehyde"],["Biodegradable polymers","PHBV, nylon-2-nylon-6, polylactic acid (PLA)"],["Single-use plastic ban","India banned many single-use plastic items from 1 July 2022"],["Microplastics","Pieces smaller than 5 mm — found in seas, fish and drinking water"],["Burning plastics","Releases toxic gases such as dioxins; burning PVC releases HCl"],["Polymerisation types","Addition (polythene, PVC, Teflon) and condensation (nylon, polyester, bakelite — a small molecule like water is lost)"]]},{"k":"trick","h":"<b>“P-V-C = Pipes, Vinyl, Chloride”<\/b>. <b>Teflon = Tetra-Fluoro<\/b> — both start with T-F. <b>Bake-lite switches never bake soft<\/b> (thermosetting). <b>Rayon = Ray of silk from wood<\/b>."},{"k":"trap","h":"<b>Rayon<\/b> is <b>semi-synthetic<\/b> (from natural cellulose), not fully synthetic — <b>nylon<\/b> is the first fully synthetic fibre. <b>Melamine and bakelite<\/b> are thermosetting; <b>PVC and polythene<\/b> are thermoplastics. <b>Vulcanisation uses sulphur<\/b>, not carbon. Natural rubber is a polymer of <b>isoprene<\/b>."}],"sum":["Polymers are chains of monomers: polythene from ethene, PVC from vinyl chloride, Teflon from tetrafluoroethylene, polystyrene (thermocol) from styrene.","Nylon (Carothers, 1935) was the first fully synthetic fibre; rayon is artificial silk made from wood pulp.","Thermoplastics (polythene, PVC) can be remoulded; thermosetting plastics (bakelite, melamine) cannot.","Natural rubber is polyisoprene; vulcanisation with sulphur (Goodyear) makes it tough.","Bakelite (Baekeland, 1907) was the first synthetic plastic; Kevlar makes bullet-proof vests."],"part":["Part 3 · Carbon and everyday chemistry","कार्बन और दैनिक रसायन"]},
{"id":"K13","g":"chem","heat":3,"title":"Chemistry in everyday life","hi":"दैनिक जीवन में रसायन","blocks":[{"k":"hot","h":"A goldmine of one-liners: <b>analgesic vs antipyretic vs antibiotic vs antiseptic<\/b>, <b>Dettol, aspirin, penicillin<\/b>, <b>artificial sweeteners<\/b>, <b>food preservatives<\/b>, <b>urea's nitrogen<\/b>, <b>soap vs detergent<\/b>, <b>glass colours<\/b>, <b>cement<\/b> and <b>explosives<\/b> (TNT, RDX, dynamite)."},{"k":"story","h":"<p>Follow one day of your life and count the chemistry. You brush with a <b>basic<\/b> toothpaste that fights acid. You bathe with <b>soap<\/b> — the sodium salt of a fatty acid, with a head that loves water and a tail that grabs grease. Breakfast bread rose with <b>baking soda<\/b>; the jam keeps for months thanks to a <b>preservative<\/b> like sodium benzoate; the 'sugar-free' sweet in your tea is <b>sucralose<\/b> or <b>aspartame<\/b>.<\/p><p>A headache? An <b>analgesic<\/b> like paracetamol or aspirin. Fever? An <b>antipyretic<\/b>. A throat infection? The doctor gives an <b>antibiotic<\/b>, a descendant of the <b>penicillin<\/b> Alexander Fleming found growing on a mouldy dish in 1928. A cut knee gets an <b>antiseptic<\/b> like Dettol, while the floor is mopped with a stronger <b>disinfectant<\/b>.<\/p><p>Outside, the window is <b>soda-lime glass<\/b>, the walls are <b>cement<\/b> (limestone + clay, with a little gypsum), and the crops in the field grow on <b>urea<\/b>, made from the ammonia that Fritz Haber learned to pull out of the air.<\/p>","key":"Analgesic — pain, antipyretic — fever, antibiotic — bacteria, antiseptic — living tissue, disinfectant — non-living things."},{"k":"table","title":"Medicines by job","head":["Class","Job","Examples"],"rows":[["Analgesics","Relieve pain","Aspirin (acetylsalicylic acid), paracetamol, ibuprofen; narcotic: morphine, codeine"],["Antipyretics","Bring down fever","Paracetamol, aspirin"],["Antibiotics","Kill or stop bacteria (not viruses)","Penicillin (Fleming, 1928), streptomycin (tuberculosis), chloramphenicol (typhoid), tetracycline"],["Antiseptics","Kill germs on living tissue","Dettol (chloroxylenol + terpineol), Savlon, tincture of iodine, boric acid, hydrogen peroxide, 0.2% phenol"],["Disinfectants","Kill germs on non-living things","1% phenol, chlorine (0.2–0.4 ppm in water), bleaching powder, sulphur dioxide (low concentration)"],["Antacids","Neutralise excess stomach acid","Milk of magnesia, aluminium hydroxide, baking soda; ranitidine, omeprazole cut acid production"],["Antihistamines","Control allergy","Cetirizine, brompheniramine"],["Tranquillisers","Relieve stress and anxiety","Diazepam (Valium), barbiturates"],["Antimalarials","Treat malaria","Quinine (from cinchona bark), chloroquine, artemisinin"],["Anaesthetics","Cause loss of sensation","Chloroform, ether, nitrous oxide; local: lidocaine"],["Sulpha drugs","Synthetic antibacterials","Sulphanilamide, prontosil"],["Antifertility drugs","Prevent pregnancy","Norethindrone, ethinylestradiol"]]},{"k":"table","title":"Chemicals in food","head":["Type","Examples","Note"],"rows":[["Preservatives","Common salt, sugar, vinegar, edible oils, sodium benzoate, sodium / potassium metabisulphite","Stop the growth of microbes; sodium benzoate is used in squashes and jams"],["Artificial sweeteners","Saccharin (~550 × sugar), aspartame (~200 ×; breaks down on heating — only in cold drinks), sucralose (~600 ×; stable for cooking), alitame","For diabetics and diet foods"],["Antioxidants","BHA, BHT, vitamin C, vitamin E","Stop fats from going rancid"],["Flavour enhancer","Monosodium glutamate (MSG, 'Ajinomoto')","Gives the umami taste"],["Edible colours","Turmeric, saffron; approved synthetic dyes","Some unapproved dyes (e.g. metanil yellow) are adulterants"]]},{"k":"table","title":"Soaps and detergents","head":["Point","Soap","Detergent"],"rows":[["Chemically","Sodium or potassium salt of long-chain fatty acids","Sodium salts of long-chain sulphonic acids or ammonium salts"],["Made by","Saponification: oil or fat + NaOH (hard soap) or KOH (soft soap) → soap + glycerol","From petroleum products"],["In hard water","Forms scum with Ca²⁺ and Mg²⁺; lathers poorly","Works well — no scum"],["Biodegradable","Yes","Many are not (branched ones cause foam in rivers)"],["How it cleans","Micelles: water-loving head outside, oil-loving tail traps grease inside","Same idea"]]},{"k":"facts","title":"Fertilisers, glass, cement, explosives","rows":[["Urea","CO(NH₂)₂ — about 46% nitrogen, the most of the common solid fertilisers"],["Other fertilisers","Ammonium sulphate, CAN (calcium ammonium nitrate), DAP (diammonium phosphate), superphosphate of lime, potash (MOP — KCl), NPK"],["Haber process","N₂ + 3H₂ ⇌ 2NH₃, iron catalyst, about 450 °C and 200 atm (Fritz Haber)"],["Ordinary (soda-lime) glass","Silica (sand) + sodium carbonate + limestone; glass is amorphous (a supercooled liquid)"],["Borosilicate (Pyrex) glass","Expands little on heating — laboratory and oven ware"],["Flint (lead) glass","High refractive index — lenses, prisms, crystal ware"],["Photochromic glass","Darkens in sunlight — has silver halide"],["Glass colours","Cobalt oxide — blue; chromium oxide — green; manganese dioxide — purple; cuprous oxide or gold — ruby red; cadmium sulphide — yellow"],["Etching glass","Hydrofluoric acid (HF) — it dissolves glass"],["Portland cement","Limestone + clay (silica, alumina) heated in a kiln to clinker; Joseph Aspdin, 1824; gypsum added to slow setting"],["Concrete / RCC","Cement + sand + gravel + water; RCC has steel rods inside"],["Dynamite","Nitroglycerine soaked in kieselguhr (Alfred Nobel, 1867)"],["TNT","Trinitrotoluene"],["RDX (cyclonite)","One of the most powerful military explosives"],["Gunpowder","Potassium nitrate + charcoal + sulphur"],["Safety match","Head: potassium chlorate + antimony trisulphide; box side: red phosphorus + powdered glass"],["Firework colours","Strontium — crimson red; barium — green; sodium — yellow; copper — blue-green; potassium — lilac"]]},{"k":"trick","h":"<b>Anal-gesic = Ache<\/b>, <b>Anti-pyretic = Pyre (fire, fever)<\/b>, <b>Anti-septic on skin, Dis-infectant on Dishes and floors<\/b>. Glass colours: <b>Cobalt Blue, Chrome Green, Manganese Mauve (purple)<\/b>."},{"k":"trap","h":"<b>Antibiotics do not work against viruses<\/b> (cold, flu, COVID). <b>Paracetamol<\/b> is analgesic and antipyretic but <b>not anti-inflammatory<\/b> like aspirin. <b>Aspartame<\/b> breaks down on heating — <b>sucralose<\/b> is the one for cooking. Soap gives <b>scum<\/b> in hard water; detergents do not. Gypsum in cement <b>slows<\/b> setting."}],"sum":["Analgesics relieve pain (aspirin, paracetamol), antipyretics bring down fever, antibiotics fight bacteria (penicillin by Fleming, 1928).","Antiseptics like Dettol are used on living tissue; disinfectants like phenol and chlorine on non-living things.","Sodium benzoate preserves food; saccharin, aspartame and sucralose are artificial sweeteners; MSG enhances flavour.","Soaps are salts of fatty acids made by saponification and form scum in hard water; detergents do not.","Urea has about 46% nitrogen; ordinary glass is silica + soda + limestone; cement is limestone + clay with gypsum; dynamite was invented by Alfred Nobel."],"part":["Part 3 · Carbon and everyday chemistry","कार्बन और दैनिक रसायन"]},
{"id":"K14","g":"chem","heat":2,"title":"Fuels and combustion","hi":"ईंधन और दहन","blocks":[{"k":"hot","h":"Regular questions: <b>main gas in LPG / CNG / biogas<\/b>, the <b>smell in LPG<\/b>, <b>highest calorific value<\/b>, the <b>hottest zone of a flame<\/b>, <b>types of coal<\/b>, <b>octane number<\/b>, and <b>which fire extinguisher for an electrical fire<\/b>."},{"k":"story","h":"<p>A fire needs three friends at once — the <b>fire triangle<\/b>: <b>fuel<\/b> to burn, <b>oxygen<\/b> to help it burn, and enough <b>heat<\/b> to reach the fuel's <b>ignition temperature<\/b>. Take away any one and the fire dies. That is all a fire extinguisher does: water cools, a CO₂ blanket cuts off oxygen, and turning off the gas removes the fuel.<\/p><p>Fuels are judged by their <b>calorific value<\/b> — how much heat a kilogram gives. Hydrogen tops the list but is hard to store safely; LPG and CNG are clean and high; wood and cow-dung cakes are low and smoky. A good fuel burns at a steady rate, is cheap, easy to carry and leaves little pollution.<\/p><p>Look closely at a candle flame and you will see three zones: a dark inner zone of unburnt wax vapour, a bright yellow middle zone where burning is incomplete, and a faint <b>blue outer zone<\/b> where burning is complete — and that is the <b>hottest<\/b> part, the one a goldsmith blows on to melt gold.<\/p>","key":"Fire triangle = fuel + oxygen + ignition temperature; hydrogen has the highest calorific value; the outer blue zone of a flame is hottest."},{"k":"table","title":"Calorific values (approximate, kJ/kg)","head":["Fuel","Calorific value"],"rows":[["Hydrogen","About 150,000 (highest)"],["LPG","About 55,000"],["Methane / CNG","About 50,000"],["Petrol, kerosene, diesel","About 45,000"],["Biogas","About 35,000–40,000"],["Coal","About 25,000–33,000"],["Wood","About 17,000–22,000"],["Cow-dung cake","About 6,000–8,000"]]},{"k":"bars","title":"Heat from a kilogram of fuel","unit":"kJ/kg","left":170,"hi":1,"rows":[["Hydrogen",150000,""],["LPG",55000,""],["Methane / CNG",50000,""],["Petrol, kerosene, diesel",45000,""],["Biogas",35000,""],["Coal",25000,""],["Wood",17000,""],["Cow-dung cake",6000,""]],"cap":"Hydrogen gives the most heat per kilogram — and only water as exhaust — but is hard to store. Cow-dung cake gives the least."},{"k":"table","title":"Gaseous fuels","head":["Fuel","Main components","Note"],"rows":[["LPG (liquefied petroleum gas)","Butane (mainly) and propane","Odourless; ethyl mercaptan (ethanethiol) is added so leaks can be smelled"],["CNG (compressed natural gas)","Methane (mostly)","Stored at about 200 bar; cleaner for vehicles"],["PNG (piped natural gas)","Methane","Supplied through pipelines to kitchens"],["Biogas (gobar gas)","Methane (about 50–75%) + carbon dioxide","From anaerobic digestion of dung and waste; slurry is good manure"],["Water gas","CO + H₂","Steam over red-hot coke"],["Producer gas","CO + N₂","Air over red-hot coke"],["Coal gas","H₂ + CH₄ + CO","From destructive distillation of coal"],["Oxy-acetylene","Acetylene + oxygen","Welding flame (about 3000 °C)"]]},{"k":"facts","title":"Coal and petroleum","rows":[["Coal forms from","Plants buried for millions of years (carbonisation)"],["Coal by carbon content","Peat (lowest) < lignite (brown coal) < bituminous (most common) < anthracite (highest, best quality)"],["Destructive distillation of coal gives","Coke (nearly pure carbon), coal tar (naphthalene, dyes, medicines), coal gas, ammonia"],["Petroleum","'Black gold' — a mixture of hydrocarbons, refined by fractional distillation"],["Fractions (lower to higher boiling)","Petroleum gas (LPG) → petrol → kerosene → diesel → lubricating oil → paraffin wax → bitumen (asphalt)"],["Asia's oldest working refinery","Digboi, Assam (1901)"],["Octane number","Measures petrol's resistance to knocking; iso-octane = 100, n-heptane = 0"],["Cetane number","Quality rating of diesel"],["Anti-knock compound","Tetraethyl lead (TEL) was used — now banned because of lead pollution"],["Catalytic converter","Platinum, palladium, rhodium turn CO, NOx and unburnt fuel into CO₂, N₂ and water"],["Fuel cell","Hydrogen + oxygen → electricity + water (used in spacecraft)"]]},{"k":"table","title":"Combustion and fire safety","head":["Term","Meaning / example"],"rows":[["Rapid combustion","Burns fast with heat and light — LPG on a stove"],["Spontaneous combustion","Catches fire by itself — white phosphorus; coal mine fires"],["Explosion","Sudden reaction giving heat, light, sound and gas — fireworks"],["Incomplete combustion","Little oxygen → carbon monoxide (CO) and soot"],["Carbon monoxide poisoning","CO binds haemoglobin (carboxyhaemoglobin) and stops oxygen transport — never burn coal or an angithi in a closed room"],["Water extinguisher","Wood, paper, cloth fires — never on electrical or oil fires"],["CO₂ extinguisher","Best for electrical fires and burning oil or petrol — leaves no residue"],["Dry chemical powder","Sodium or potassium bicarbonate; oil and electrical fires"],["Foam","Burning oil and petrol"],["Inflammable substances","Low ignition temperature — petrol, alcohol, LPG"]]},{"k":"trick","h":"Coal ranks — <b>“Poor Little Boys Act”<\/b>: Peat, Lignite, Bituminous, Anthracite (carbon rises). Flame zones from inside — <b>“Dark, Yellow, Blue — the Blue is True heat”<\/b>."},{"k":"trap","h":"LPG is mainly <b>butane<\/b> (not methane); CNG and biogas are mainly <b>methane<\/b>. LPG has <b>no smell<\/b> of its own — the smell is <b>ethyl mercaptan<\/b>. The <b>outermost (blue, non-luminous)<\/b> zone is the hottest, not the bright yellow one. Never use <b>water<\/b> on electrical or oil fires. <b>Anthracite<\/b> is the best coal; <b>peat<\/b> the poorest."}],"sum":["Burning needs fuel, oxygen and the ignition temperature (fire triangle).","Hydrogen has the highest calorific value; LPG about 55,000 and CNG about 50,000 kJ/kg; cow-dung cakes the least.","LPG is mainly butane with ethyl mercaptan added for smell; CNG and biogas are mainly methane.","The outer blue zone of a flame is the hottest; anthracite is the best coal and peat the poorest.","Octane number rates petrol, cetane number diesel; CO₂ extinguishers are used for electrical and oil fires."],"part":["Part 3 · Carbon and everyday chemistry","कार्बन और दैनिक रसायन"]},
{"id":"K15","g":"chem","heat":1,"title":"Gas laws and solutions","hi":"गैस नियम और विलयन","blocks":[{"k":"hot","h":"Now and then: <b>Boyle's / Charles's law<\/b> in one line, <b>why soda fizzes<\/b> (Henry's law), <b>why fish struggle in warm water<\/b>, <b>osmosis<\/b> (raisins, pickles, RO filters) and <b>water as the universal solvent<\/b>."},{"k":"story","h":"<p>Squeeze a closed syringe and the trapped air pushes back harder — less space, more pressure. That is <b>Boyle's law<\/b>. Warm a balloon in the sun and it swells — more heat, more volume. That is <b>Charles's law<\/b>. Gases behave this simply because their particles are far apart and bounce around freely.<\/p><p>A <b>solution<\/b> is a mixture where one thing (the <b>solute<\/b>, like sugar) spreads evenly through another (the <b>solvent<\/b>, like water). Water dissolves so many things that it is called the <b>universal solvent<\/b>.<\/p><p>Gases dissolve too. A soft drink is bottled with CO₂ under high pressure; open it, the pressure drops, and the gas fizzes out — <b>Henry's law<\/b>. Warm water holds <b>less<\/b> dissolved oxygen than cold water, which is why fish gasp in warm ponds. And when a raisin soaks in water it swells, because water moves through its skin from the weaker to the stronger solution — <b>osmosis<\/b>.<\/p>","key":"Boyle: P × V constant (T fixed); Charles: V ∝ T (P fixed); gases dissolve more under pressure and less when warm; osmosis moves water toward the stronger solution."},{"k":"table","title":"Gas laws","head":["Law","Statement","Formula / everyday sign"],"rows":[["Boyle's law (1662)","At constant temperature, volume is inversely proportional to pressure","PV = constant; bubbles grow as they rise in water"],["Charles's law","At constant pressure, volume is directly proportional to absolute temperature","V ∝ T; a balloon swells in the sun; tyres burst in summer"],["Gay-Lussac's (pressure) law","At constant volume, pressure is proportional to absolute temperature","P ∝ T; never heat a spray can"],["Avogadro's law","Equal volumes of gases at the same T and P have equal numbers of molecules","V ∝ n"],["Ideal gas equation","Combines the above","PV = nRT; R = 8.314 J/(mol·K)"],["Graham's law of diffusion","Rate of diffusion is inversely proportional to the square root of molar mass","Lighter gases spread faster (hydrogen fastest)"],["Dalton's law of partial pressures","Total pressure = sum of the partial pressures of each gas","Air pressure = pN₂ + pO₂ + …"],["Henry's law","Solubility of a gas is proportional to its pressure above the liquid","Soda fizzes on opening; divers get the 'bends'"]]},{"k":"facts","title":"Solutions","rows":[["Solute / solvent","The part that dissolves / the part that does the dissolving"],["Universal solvent","Water (it is polar)"],["Saturated solution","Cannot dissolve any more solute at that temperature"],["Solids in water","Most dissolve more in hot water (sugar, salt slightly)"],["Gases in water","Dissolve less in warm water — fish die in warm, polluted ponds"],["Osmosis","Water moves through a semi-permeable membrane from a dilute to a concentrated solution — raisins swell in water; salted pickles and jam do not rot (microbes lose water)"],["Reverse osmosis (RO)","Pressure pushes water the other way, leaving salts behind — RO water purifiers, desalination"],["Colligative properties","Depend on the number of solute particles: lowering of vapour pressure, rise in boiling point, fall in freezing point, osmotic pressure"],["Anti-freeze","Ethylene glycol in car radiators lowers the freezing point of water"],["Concentration","Mass % = (mass of solute ÷ mass of solution) × 100; molarity = moles per litre of solution"],["STP","0 °C (273 K) and 1 atm"],["1 atmosphere","About 101.3 kPa = 760 mm of mercury"]]},{"k":"trick","h":"<b>Boyle = Both ways<\/b> (P up, V down); <b>Charles = Climbs together<\/b> (T up, V up). <b>Henry = Hissing soda<\/b>. Osmosis: water goes <b>where the salt is<\/b>."},{"k":"trap","h":"Gas laws use <b>kelvin<\/b>, not °C — doubling 10 °C to 20 °C does <b>not<\/b> double the volume. Gases dissolve <b>less<\/b> in hot water, though most solids dissolve <b>more<\/b>. In <b>reverse<\/b> osmosis water moves from the concentrated side to the dilute side under pressure."}],"sum":["Boyle's law: PV is constant at fixed temperature; Charles's law: V is proportional to absolute temperature at fixed pressure.","Ideal gas equation PV = nRT; lighter gases diffuse faster (Graham's law).","Henry's law explains the fizz of soft drinks and the bends in divers; warm water holds less oxygen.","Water is the universal solvent; osmosis moves water toward the more concentrated solution.","Reverse osmosis purifies water; ethylene glycol is an anti-freeze; STP is 0 °C and 1 atm."],"part":["Part 4 · Gases, environment and the nucleus","गैसें, पर्यावरण और नाभिक"]},
{"id":"K16","g":"chem","heat":2,"title":"Environmental chemistry","hi":"पर्यावरण रसायन","blocks":[{"k":"hot","h":"Popular in every exam: the <b>gas behind the Bhopal tragedy<\/b> (methyl isocyanate), <b>ozone-depleting CFCs<\/b> and the <b>Montreal Protocol<\/b>, <b>greenhouse gases<\/b>, <b>acid rain and the Taj Mahal<\/b>, <b>smog<\/b>, and diseases like <b>Minamata<\/b> (mercury) and <b>Itai-itai<\/b> (cadmium)."},{"k":"story","h":"<p>The air is a blanket. A little <b>carbon dioxide, methane and water vapour<\/b> in it trap the Earth's heat and keep us warm — the natural <b>greenhouse effect<\/b>. Burning coal and petrol has thickened that blanket, and the planet is warming.<\/p><p>High above, 15–35 km up in the <b>stratosphere<\/b>, a thin layer of <b>ozone<\/b> (O₃) acts as sunscreen, absorbing harmful ultraviolet rays. In the 1980s scientists found a 'hole' in it over Antarctica, punched by chlorine from <b>CFCs<\/b> — the gases in old fridges, ACs and spray cans. The world signed the <b>Montreal Protocol<\/b> (1987) to phase them out, and the ozone layer is slowly healing.<\/p><p>Smoke from factories carries <b>sulphur dioxide<\/b> and <b>nitrogen oxides<\/b>; in clouds they become sulphuric and nitric acid and fall as <b>acid rain<\/b>, eating into marble — the Taj Mahal's 'marble cancer'. And on the night of 2–3 December 1984, <b>methyl isocyanate<\/b> leaked from a pesticide plant in <b>Bhopal<\/b>, in one of the world's worst industrial disasters.<\/p>","key":"Greenhouse gases warm the Earth; CFCs destroy stratospheric ozone (Montreal Protocol 1987); SO₂ + NOx cause acid rain; Bhopal 1984 = methyl isocyanate."},{"k":"table","title":"Air pollution","head":["Problem","Caused by","Effect / fact"],"rows":[["Global warming","CO₂ (main), methane, nitrous oxide, CFCs, water vapour","Rising temperatures and sea levels; methane is far stronger per molecule than CO₂"],["Ozone depletion","CFCs (freons), halons, carbon tetrachloride","More UV-B → skin cancer, cataracts; ozone hole over Antarctica; measured in Dobson units"],["Acid rain","Sulphur dioxide and nitrogen oxides (→ H₂SO₄, HNO₃); pH below 5.6","Damages forests, lakes, buildings — 'marble cancer' of the Taj Mahal (Mathura refinery)"],["Classical (London) smog","Smoke + fog + sulphur dioxide; cool, damp weather","Reducing smog; London 1952"],["Photochemical (Los Angeles) smog","Nitrogen oxides + hydrocarbons + sunlight → ozone, PAN","Oxidising smog; eye irritation, brown haze"],["Carbon monoxide","Incomplete burning; vehicle exhaust","Binds haemoglobin 200+ times more strongly than oxygen"],["Particulate matter","Dust, smoke, soot (PM2.5, PM10)","PM2.5 enters deep into the lungs"],["Bhopal gas tragedy (1984)","Methyl isocyanate (MIC) leak from Union Carbide's plant","Thousands killed; one of the worst industrial disasters"]]},{"k":"table","title":"Water and soil pollution diseases","head":["Disease","Caused by"],"rows":[["Minamata disease","Mercury (methyl mercury in fish) — Japan, 1950s"],["Itai-itai disease","Cadmium — painful bones; Japan"],["Blue baby syndrome (methaemoglobinaemia)","Excess nitrates in drinking water"],["Black foot disease","Arsenic in groundwater (West Bengal, Bangladesh)"],["Fluorosis","Excess fluoride in water — mottled teeth, stiff bones"],["Plumbism","Lead poisoning"],["Eutrophication","Phosphates and nitrates (fertilisers, detergents) → algal bloom → oxygen loss → fish die"],["BOD (biological oxygen demand)","High BOD = heavily polluted water; clean water has BOD below 5 ppm"]]},{"k":"facts","title":"Agreements and fixes","rows":[["Montreal Protocol (1987)","Phases out ozone-depleting substances such as CFCs"],["Kigali Amendment (2016)","Adds HFCs (strong greenhouse gases that replaced CFCs) to the Montreal Protocol"],["Kyoto Protocol (1997)","Cut greenhouse gas emissions (developed countries)"],["Paris Agreement (2015)","Keep warming well below 2 °C, aim for 1.5 °C"],["World Ozone Day","16 September"],["Catalytic converter","Turns CO, NOx and hydrocarbons into CO₂, N₂, H₂O"],["Lead-free petrol","Lead in petrol phased out in India by 2000"],["Bharat Stage VI","Vehicle emission norms in force in India from April 2020"],["Green chemistry","Designing processes that cut or eliminate hazardous substances"],["Ozone near the ground","A pollutant (part of smog), though it protects us in the stratosphere"]]},{"k":"trick","h":"Japan's two metal diseases — <b>“Minamata = Mercury (M–M), Itai-itai = Cadmium (it-ai… 'ouch-ouch' bones)”<\/b>. Smog: <b>London = Sulphur + Smoke (classical), LA = Light (photochemical)<\/b>."},{"k":"trap","h":"Bhopal gas was <b>methyl isocyanate<\/b> — not phosgene, not hydrogen cyanide. <b>Montreal<\/b> is about ozone; <b>Kyoto<\/b> and <b>Paris<\/b> about greenhouse gases. Ozone is <b>good up high, bad nearby<\/b>. The ozone layer is in the <b>stratosphere<\/b>, not the troposphere. Blue baby syndrome is from <b>nitrates<\/b>, not nitrites in air."}],"sum":["CO₂, methane, nitrous oxide and CFCs are greenhouse gases; CO₂ contributes most to global warming.","CFCs destroy the ozone layer in the stratosphere; the Montreal Protocol (1987) phases them out; World Ozone Day is 16 September.","SO₂ and nitrogen oxides cause acid rain (pH below 5.6), which damages the Taj Mahal's marble.","The Bhopal gas tragedy of December 1984 was caused by methyl isocyanate.","Minamata disease is from mercury, Itai-itai from cadmium, blue baby syndrome from nitrates, black foot disease from arsenic."],"part":["Part 4 · Gases, environment and the nucleus","गैसें, पर्यावरण और नाभिक"]},
{"id":"K17","g":"chem","heat":2,"title":"Hydrogen, water and important gases","hi":"हाइड्रोजन, जल और महत्वपूर्ण गैसें","blocks":[{"k":"hot","h":"Expect: <b>who discovered hydrogen / oxygen / nitrogen<\/b>, <b>uses of noble gases<\/b> (argon in bulbs, neon in signs, helium in balloons), <b>hard and soft water<\/b>, <b>heavy water<\/b>, and the <b>colour and smell of gases<\/b>."},{"k":"story","h":"<p>In 1766 <b>Henry Cavendish<\/b> collected a gas that burned with a pop and called it 'inflammable air'; <b>Lavoisier<\/b> later named it <b>hydrogen<\/b> — 'water-maker' — because burning it gives water. A few years later <b>Joseph Priestley<\/b> (and Carl Scheele before him) made a gas in which a candle burned brilliantly: <b>oxygen<\/b>.<\/p><p>Water seems simple, but it is not always pure. Rainwater that trickles through rocks picks up calcium and magnesium salts and becomes <b>hard<\/b> — soap will not lather in it and kettles get scaly. If the salts are bicarbonates, <b>boiling<\/b> removes them (<b>temporary hardness<\/b>); if they are chlorides or sulphates, you need <b>washing soda<\/b> or an ion-exchange softener (<b>permanent hardness<\/b>).<\/p><p>Then there are the quiet <b>noble gases<\/b>. They hardly react, which is exactly why we use them: <b>argon<\/b> fills bulbs so the filament does not burn, <b>neon<\/b> glows red-orange in signs, and <b>helium<\/b> — light and non-flammable — lifts balloons and helps deep-sea divers breathe.<\/p>","key":"Cavendish found hydrogen, Priestley/Scheele oxygen, Daniel Rutherford nitrogen; temporary hardness (bicarbonates) goes by boiling, permanent (chlorides, sulphates) needs washing soda or ion exchange."},{"k":"table","title":"Gases and their discoverers","head":["Gas","Discovered by","Key uses / facts"],"rows":[["Hydrogen","Henry Cavendish, 1766 (named by Lavoisier)","Lightest gas; Haber process (ammonia), hydrogenation of oils, liquid hydrogen rocket fuel, fuel cells; National Green Hydrogen Mission (2023)"],["Oxygen","Carl Scheele (about 1772) and Joseph Priestley (1774); named by Lavoisier","Supports burning, breathing; liquid oxygen in rockets; welding; hospitals"],["Nitrogen","Daniel Rutherford, 1772","78% of air; liquid nitrogen (−196 °C) to freeze food and biological samples; packing chips; ammonia"],["Carbon dioxide","Joseph Black ('fixed air'), 1750s","Turns lime water milky; soft drinks; fire extinguishers; dry ice; photosynthesis"],["Chlorine","Carl Scheele, 1774","Greenish-yellow; disinfects water, bleaching, PVC; used as a poison gas in World War I"],["Noble gases","William Ramsay (with Lord Rayleigh for argon), 1894–98","Ramsay won the Nobel Prize in Chemistry, 1904"]]},{"k":"table","title":"Noble gases at work","head":["Gas","Use"],"rows":[["Helium","Balloons and airships (light, non-flammable); mixed with oxygen for deep-sea divers (avoids the bends); liquid helium cools MRI magnets"],["Neon","Advertisement sign lights (red-orange glow)"],["Argon","Filled in electric bulbs (stops the filament burning); shield gas in welding; most abundant noble gas in air (~0.93%)"],["Krypton","High-efficiency lamps, flash lamps"],["Xenon","Car headlamps, photographic flash, an anaesthetic"],["Radon","Radioactive; once used in cancer treatment; a health hazard in some basements"]]},{"k":"table","title":"Hard and soft water","head":["Type","Caused by","Removed by"],"rows":[["Temporary hardness","Bicarbonates of calcium and magnesium","Boiling; Clark's method (adding slaked lime)"],["Permanent hardness","Chlorides and sulphates of calcium and magnesium","Washing soda; ion exchange (permutit, zeolite resins); Calgon (sodium hexametaphosphate)"],["Soft water","Few dissolved Ca and Mg salts","Lathers easily with soap — rainwater is naturally soft"]]},{"k":"facts","title":"Water and gas facts","rows":[["Heavy water","D₂O — deuterium discovered by Harold Urey (1931); moderator in nuclear reactors; slightly denser than water"],["Hydrogen peroxide","H₂O₂ — antiseptic, bleach; stored in dark bottles"],["Chlorination","0.2–0.5 ppm chlorine kills germs in drinking water"],["Other purification","Boiling, UV light, ozonation, RO, alum for settling"],["Fluoride","Small amounts protect teeth; too much causes fluorosis"],["Ammonia","Pungent smell; very soluble in water; refrigerant; fertilisers"],["Hydrogen sulphide","Rotten-egg smell; poisonous"],["Sulphur dioxide","Choking smell; bleaches wool and silk; food preservative (as sulphites)"],["Nitrogen dioxide","Reddish-brown gas"],["Chlorine","Greenish-yellow, pungent"],["Phosgene (COCl₂)","Poison gas of World War I"],["Mustard gas","Blistering poison gas of World War I"],["Tear gas","Chloropicrin or CS gas — makes the eyes water"],["Liquid nitrogen","−196 °C — preserving semen, blood, cells and food"]]},{"k":"trick","h":"Discoverers — <b>“Cavendish Has Pop (Hydrogen), Priestley Ordered Oxygen, Rutherford Nabbed Nitrogen, Black Caught Carbon dioxide, Scheele Chose Chlorine”<\/b>. Hardness: <b>Temporary = boil it away; Permanent = soda it away<\/b>."},{"k":"trap","h":"<b>Daniel<\/b> Rutherford discovered nitrogen; <b>Ernest<\/b> Rutherford discovered the nucleus — different people. <b>Argon<\/b> (not neon) fills light bulbs. <b>Temporary<\/b> hardness is due to <b>bicarbonates<\/b>; permanent to <b>chlorides and sulphates<\/b>. Boiling does <b>not<\/b> remove permanent hardness."}],"sum":["Cavendish discovered hydrogen, Priestley and Scheele oxygen, Daniel Rutherford nitrogen, Joseph Black carbon dioxide, Scheele chlorine.","Helium fills balloons and helps divers, neon glows in signs, argon fills bulbs, xenon is used in headlamps; radon is radioactive.","Temporary hardness (bicarbonates) is removed by boiling; permanent hardness (chlorides, sulphates) by washing soda or ion exchange.","Heavy water D₂O (deuterium, Urey) is a moderator in nuclear reactors.","Liquid nitrogen at −196 °C preserves cells and food; chlorine and phosgene were World War I poison gases."],"part":["Part 4 · Gases, environment and the nucleus","गैसें, पर्यावरण और नाभिक"]},
{"id":"K18","g":"chem","heat":2,"title":"Radioactivity, nuclear energy and famous chemists","hi":"रेडियोधर्मिता, नाभिकीय ऊर्जा और प्रसिद्ध रसायनज्ञ","blocks":[{"k":"hot","h":"Regulars: <b>who discovered radioactivity<\/b> (Becquerel), <b>alpha, beta, gamma<\/b> — which is most penetrating, <b>half-life<\/b> sums, <b>fission vs fusion<\/b>, <b>parts of a reactor<\/b>, <b>India's nuclear firsts<\/b> (Apsara, Tarapur, Pokhran), and <b>Nobel prizes in chemistry<\/b>."},{"k":"story","h":"<p>In 1896 <b>Henri Becquerel<\/b> left uranium salt on a wrapped photographic plate in a drawer. When he developed it, the plate was fogged — the uranium was giving out invisible rays all by itself. <b>Marie and Pierre Curie<\/b> chased these rays, named the effect <b>radioactivity<\/b>, and discovered two new elements, <b>polonium<\/b> and <b>radium<\/b>. Marie Curie remains the only person to win Nobel Prizes in two different sciences — Physics (1903) and Chemistry (1911).<\/p><p>A radioactive nucleus is unstable, like an overloaded shelf. It throws out <b>alpha<\/b> particles (helium nuclei — stopped by paper), <b>beta<\/b> particles (fast electrons — stopped by aluminium), or <b>gamma<\/b> rays (light-like waves — need thick lead or concrete). The time for half of a sample to decay is its <b>half-life<\/b>.<\/p><p>Split a heavy nucleus like uranium-235 with a neutron and it releases huge energy plus more neutrons — <b>fission<\/b>, the chain reaction inside nuclear power plants and the atom bomb. Squeeze light nuclei like hydrogen together and they join — <b>fusion<\/b>, which powers the Sun and the hydrogen bomb. Both follow Einstein's <b>E = mc²<\/b>: a little mass becomes a lot of energy.<\/p>","key":"Becquerel found radioactivity (1896); alpha least penetrating, gamma most; fission splits heavy nuclei (reactors, atom bomb), fusion joins light ones (Sun, H-bomb)."},{"k":"table","title":"Alpha, beta and gamma","head":["Radiation","What it is","Charge","Penetration","Stopped by"],"rows":[["Alpha (α)","Helium nucleus (2 protons + 2 neutrons)","+2","Least (but ionises most)","A sheet of paper or skin"],["Beta (β)","Fast electron from the nucleus","−1","Medium","A few mm of aluminium"],["Gamma (γ)","High-energy electromagnetic wave","0","Most","Thick lead or concrete"]]},{"k":"info","title":"How far each radiation gets","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 660 220\" role=\"img\" aria-label=\"Penetrating power of alpha, beta and gamma radiation\">\n  <circle cx=\"40\" cy=\"110\" r=\"18\" fill=\"#f2c14e\"/><text x=\"40\" y=\"150\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink2)\">source<\/text>\n  <rect x=\"200\" y=\"30\" width=\"10\" height=\"160\" fill=\"#f4efe1\" stroke=\"var(--rule)\"/><rect x=\"340\" y=\"30\" width=\"22\" height=\"160\" fill=\"#b9c2cc\"/><rect x=\"500\" y=\"30\" width=\"44\" height=\"160\" fill=\"#6b6f78\"/>\n  <text x=\"205\" y=\"210\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">paper<\/text><text x=\"351\" y=\"210\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">aluminium<\/text><text x=\"522\" y=\"210\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">lead / concrete<\/text>\n  <path d=\"M60 60 H196\" stroke=\"#c0392b\" stroke-width=\"4\" stroke-dasharray=\"8 6\" style=\"animation:rvflow .8s linear infinite\"/><text x=\"70\" y=\"52\" font-size=\"16\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:#c0392b\">α<\/text><path d=\"M60 110 H336\" stroke=\"#2f6db5\" stroke-width=\"4\" stroke-dasharray=\"8 6\" style=\"animation:rvflow .8s linear infinite\"/><text x=\"70\" y=\"102\" font-size=\"16\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:#2f6db5\">β<\/text><path d=\"M60 160 H640\" stroke=\"#7d4fb5\" stroke-width=\"4\" stroke-dasharray=\"8 6\" style=\"animation:rvflow .8s linear infinite\"/><text x=\"70\" y=\"152\" font-size=\"16\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:#7d4fb5\">γ<\/text><\/svg><\/figure>","cap":"Alpha (helium nuclei) is stopped by paper; beta (electrons) by a few mm of aluminium; gamma (energy waves) needs thick lead or concrete. Alpha ionises most; gamma penetrates most."},{"k":"facts","title":"Decay and half-life","rows":[["Alpha decay","Atomic number falls by 2, mass number by 4"],["Beta decay","Atomic number rises by 1, mass number unchanged"],["Gamma emission","No change in atomic or mass number"],["Half-life","Time for half the nuclei to decay; after n half-lives, (1/2)ⁿ is left"],["Example","16 g with a half-life of 2 days → after 6 days (3 half-lives) 2 g remain"],["Units","Becquerel (SI) = one decay per second; curie = 3.7 × 10¹⁰ decays per second; dose in sievert"],["Detector","Geiger–Müller counter"],["Artificial radioactivity","Irène Joliot-Curie and Frédéric Joliot, 1934"]]},{"k":"table","title":"Fission and fusion","head":["Point","Nuclear fission","Nuclear fusion"],"rows":[["What happens","A heavy nucleus splits into lighter ones","Light nuclei join into a heavier one"],["Fuel","Uranium-235, plutonium-239","Isotopes of hydrogen (deuterium, tritium)"],["Found in","Nuclear power plants, the atom bomb","The Sun and stars, the hydrogen bomb"],["Discovered","Otto Hahn and Fritz Strassmann, 1938","Needs millions of degrees (thermonuclear)"],["Bombs of 1945","Hiroshima 'Little Boy' — uranium-235; Nagasaki 'Fat Man' — plutonium-239","—"]]},{"k":"info","title":"A fission chain reaction","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 660 266\" role=\"img\" aria-label=\"A nuclear fission chain reaction\">\n  <circle cx=\"130\" cy=\"120\" r=\"16\" fill=\"#c0503a\"/><text x=\"130\" y=\"124\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"800\" style=\"fill:#fff\">U-235<\/text><path d=\"M60 120 H112\" stroke=\"#2f6db5\" stroke-width=\"2\"/><circle cx=\"60\" cy=\"120\" r=\"4\" fill=\"#2f6db5\"/><path d=\"M146 120 L200 60\" stroke=\"#2f6db5\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/><path d=\"M146 120 L200 180\" stroke=\"#2f6db5\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/><circle cx=\"270\" cy=\"60\" r=\"16\" fill=\"#c0503a\"/><text x=\"270\" y=\"64\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"800\" style=\"fill:#fff\">U-235<\/text><path d=\"M200 60 H252\" stroke=\"#2f6db5\" stroke-width=\"2\"/><circle cx=\"200\" cy=\"60\" r=\"4\" fill=\"#2f6db5\"/><path d=\"M286 60 L340 30\" stroke=\"#2f6db5\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/><path d=\"M286 60 L340 90\" stroke=\"#2f6db5\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/><circle cx=\"270\" cy=\"180\" r=\"16\" fill=\"#c0503a\"/><text x=\"270\" y=\"184\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"800\" style=\"fill:#fff\">U-235<\/text><path d=\"M200 180 H252\" stroke=\"#2f6db5\" stroke-width=\"2\"/><circle cx=\"200\" cy=\"180\" r=\"4\" fill=\"#2f6db5\"/><path d=\"M286 180 L340 150\" stroke=\"#2f6db5\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/><path d=\"M286 180 L340 210\" stroke=\"#2f6db5\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/><circle cx=\"410\" cy=\"30\" r=\"16\" fill=\"#c0503a\"/><text x=\"410\" y=\"34\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"800\" style=\"fill:#fff\">U-235<\/text><path d=\"M340 30 H392\" stroke=\"#2f6db5\" stroke-width=\"2\"/><circle cx=\"340\" cy=\"30\" r=\"4\" fill=\"#2f6db5\"/><path d=\"M426 30 L480 10\" stroke=\"#2f6db5\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/><path d=\"M426 30 L480 50\" stroke=\"#2f6db5\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/><circle cx=\"410\" cy=\"90\" r=\"16\" fill=\"#c0503a\"/><text x=\"410\" y=\"94\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"800\" style=\"fill:#fff\">U-235<\/text><path d=\"M340 90 H392\" stroke=\"#2f6db5\" stroke-width=\"2\"/><circle cx=\"340\" cy=\"90\" r=\"4\" fill=\"#2f6db5\"/><path d=\"M426 90 L480 70\" stroke=\"#2f6db5\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/><path d=\"M426 90 L480 110\" stroke=\"#2f6db5\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/><circle cx=\"410\" cy=\"150\" r=\"16\" fill=\"#c0503a\"/><text x=\"410\" y=\"154\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"800\" style=\"fill:#fff\">U-235<\/text><path d=\"M340 150 H392\" stroke=\"#2f6db5\" stroke-width=\"2\"/><circle cx=\"340\" cy=\"150\" r=\"4\" fill=\"#2f6db5\"/><path d=\"M426 150 L480 130\" stroke=\"#2f6db5\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/><path d=\"M426 150 L480 170\" stroke=\"#2f6db5\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/><circle cx=\"410\" cy=\"210\" r=\"16\" fill=\"#c0503a\"/><text x=\"410\" y=\"214\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"800\" style=\"fill:#fff\">U-235<\/text><path d=\"M340 210 H392\" stroke=\"#2f6db5\" stroke-width=\"2\"/><circle cx=\"340\" cy=\"210\" r=\"4\" fill=\"#2f6db5\"/><path d=\"M426 210 L480 190\" stroke=\"#2f6db5\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/><path d=\"M426 210 L480 230\" stroke=\"#2f6db5\" stroke-width=\"1.5\" stroke-dasharray=\"3 3\"/>\n  <text x=\"30\" y=\"30\" font-size=\"12\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">1 neutron splits U-235 → 2–3 neutrons → more splits<\/text><text x=\"30\" y=\"258\" font-size=\"10.5\" class=\"mut\">Control rods (cadmium, boron) soak up neutrons; the moderator (heavy water, graphite) slows them down.<\/text><\/svg><\/figure>","cap":"Each split releases energy and more neutrons, which split more nuclei. A reactor keeps the chain steady; a bomb lets it run away. Fusion (the Sun) joins light nuclei instead."},{"k":"table","title":"Parts of a nuclear reactor","head":["Part","Job","Material"],"rows":[["Fuel","Undergoes fission","Uranium-235 (enriched uranium), plutonium-239"],["Moderator","Slows neutrons so they cause more fission","Heavy water, graphite"],["Control rods","Absorb extra neutrons to control the reaction","Cadmium, boron"],["Coolant","Carries heat away to make steam","Water, heavy water, liquid sodium"],["Shield","Stops radiation escaping","Thick concrete, lead"]]},{"k":"tl","title":"India's nuclear milestones","rows":[["1948","Atomic Energy Commission set up; Homi J. Bhabha its first chairman — father of India's nuclear programme"],["1954","Atomic Energy Establishment, Trombay (renamed BARC in 1967)"],["1956","Apsara — India's (and Asia's) first research reactor, at Trombay"],["1969","Tarapur, Maharashtra — India's first nuclear power station"],["1974","First nuclear test, Pokhran — 'Smiling Buddha'"],["1998","Pokhran-II tests — 'Operation Shakti'"],["Plan","Three-stage programme to use India's large thorium reserves (monazite sands)"],["Largest plant","Kudankulam, Tamil Nadu (built with Russia)"]]},{"k":"table","title":"Chemists and what they did","head":["Scientist","Remembered for"],"rows":[["Antoine Lavoisier","Father of modern chemistry; law of conservation of mass; named oxygen and hydrogen"],["Robert Boyle","Boyle's law; 'The Sceptical Chymist' (1661); often called the father of chemistry"],["John Dalton","Atomic theory (1808); law of partial pressures"],["Dmitri Mendeleev","Periodic table (1869)"],["Friedrich Wöhler","First organic compound (urea) made in a lab, 1828"],["Alfred Nobel","Dynamite; founded the Nobel Prizes"],["Fritz Haber","Haber process for ammonia (Nobel 1918)"],["Marie Curie","Polonium and radium; Nobel in Physics (1903) and Chemistry (1911)"],["Linus Pauling","Chemical bonding, electronegativity; two unshared Nobels — Chemistry 1954, Peace 1962"],["Acharya Prafulla Chandra Ray","Father of Indian chemistry; founded Bengal Chemicals (1901); made mercurous nitrite"],["C. N. R. Rao","Solid-state chemistry; Bharat Ratna 2014"],["Shanti Swarup Bhatnagar","First Director-General of CSIR; India's top science award is named after him"],["Asima Chatterjee","First Indian woman to earn a Doctor of Science (1944); anti-epileptic and anti-malarial drugs from plants"],["Venkatraman Ramakrishnan","Nobel Prize in Chemistry 2009 — structure of the ribosome"],["Nobel Chemistry 2024","David Baker; Demis Hassabis and John Jumper — protein design and AlphaFold structure prediction"],["Nobel Chemistry 2025","Susumu Kitagawa, Richard Robson and Omar Yaghi — metal–organic frameworks (MOFs)"]]},{"k":"photos","title":"Chemists in pictures","items":[["Antoine_Lavoisier","Antoine Lavoisier","Father of modern chemistry"],["Robert_Boyle","Robert Boyle","Boyle's law"],["John_Dalton","John Dalton","Atomic theory (1808)"],["Dmitri_Mendeleev","Dmitri Mendeleev","Periodic table (1869)"],["Friedrich_Wöhler","Friedrich Wöhler","First organic compound (urea) made in a lab, 1828"],["Alfred_Nobel","Alfred Nobel","Dynamite"],["Fritz_Haber","Fritz Haber","Haber process for ammonia (Nobel 1918)"],["Marie_Curie","Marie Curie","Polonium and radium"],["Linus_Pauling","Linus Pauling","Chemical bonding, electronegativity"],["Prafulla_Chandra_Ray","Acharya Prafulla Chandra Ray","Father of Indian chemistry"],["C._N._R._Rao","C. N. R. Rao","Solid-state chemistry"],["Shanti_Swarup_Bhatnagar","Shanti Swarup Bhatnagar","First Director-General of CSIR"]]},{"k":"trick","h":"Penetration order — <b>“Alpha is A-paper tiger, Beta Bends at aluminium, Gamma Goes through (needs lead)”<\/b>. Half-life sums: just keep halving — 16 → 8 → 4 → 2."},{"k":"trap","h":"<b>Becquerel<\/b> discovered radioactivity; the <b>Curies<\/b> named it and found polonium and radium. Alpha is the <b>least penetrating<\/b> but the <b>most ionising<\/b>. The <b>Sun<\/b> runs on <b>fusion<\/b>, nuclear power plants on <b>fission<\/b>. Control rods (cadmium, boron) <b>absorb<\/b> neutrons; the moderator only <b>slows<\/b> them. Hiroshima = <b>uranium<\/b>, Nagasaki = <b>plutonium<\/b>."}],"sum":["Becquerel discovered radioactivity in 1896; the Curies found polonium and radium; Marie Curie won Nobels in Physics and Chemistry.","Alpha particles are helium nuclei (least penetrating), beta are electrons, gamma rays are the most penetrating.","After each half-life, half of a radioactive sample remains.","Fission splits uranium-235 (reactors, atom bomb); fusion joins hydrogen nuclei (Sun, hydrogen bomb); moderators slow neutrons, control rods absorb them.","Homi J. Bhabha led India's nuclear programme; Apsara (1956) was Asia's first research reactor; P. C. Ray is the father of Indian chemistry."],"part":["Part 4 · Gases, environment and the nucleus","गैसें, पर्यावरण और नाभिक"]}

const QB = [
["K1","Which of these changes directly from solid to gas on heating?",["Camphor","Sodium chloride","Ice","Wax"],"Camphor sublimes. So do naphthalene, iodine, ammonium chloride and dry ice. Ice and wax melt first.","p"],
["K1","The process in which a solid turns into a gas without becoming a liquid is called:",["Sublimation","Evaporation","Condensation","Fusion"],"Sublimation: solid → gas directly. The reverse (gas → solid) is deposition.","p"],
["K1","Dry ice is the solid form of:",["Carbon dioxide","Water","Nitrogen","Ammonia"],"Dry ice is solid CO₂. It sublimes at about −78.5 °C, leaving no liquid behind — hence 'dry'.","p"],
["K1","In which state of matter is diffusion fastest?",["Gas","Liquid","Solid","It is the same in all"],"Gas particles move fastest and have the most space, so a smell spreads through a room quickly.",""],
["K1","Plasma is known as the ______ state of matter.",["Fourth","Third","Fifth","Second"],"Solid, liquid, gas are the first three; plasma (ionised gas, as in the Sun and lightning) is the fourth; BEC the fifth.","p"],
["K1","The Bose–Einstein Condensate is formed by cooling matter to:",["Near absolute zero","The boiling point of water","Room temperature","The melting point of ice"],"BEC forms at temperatures within a fraction of a degree of 0 K. It was predicted by S. N. Bose and Albert Einstein.","p"],
["K1","Why does an earthen pot (matka) keep water cool in summer?",["Water seeping through its pores evaporates and takes away heat","Clay absorbs heat from water","Clay is a good conductor of heat","Water reacts with clay"],"Evaporation takes latent heat from the remaining water, so it cools. Evaporation always causes cooling.","p"],
["K1","Steam at 100 °C causes more severe burns than boiling water at 100 °C because steam has:",["Extra latent heat of vaporisation","A higher temperature","Lower density","More oxygen"],"When steam condenses on skin it gives out its latent heat (about 2260 kJ/kg) as well as the heat of hot water.","p"],
["K1","The temperature 27 °C on the Kelvin scale is:",["300 K","273 K","246 K","327 K"],"K = °C + 273, so 27 + 273 = 300 K.",""],
["K1","Absolute zero on the Celsius scale is about:",["−273 °C","0 °C","−100 °C","−460 °C"],"0 K = −273.15 °C. Nothing can be colder.",""],
["K1","Food takes longer to cook at high altitudes because:",["Water boils at a lower temperature where air pressure is low","Water boils at a higher temperature","There is less oxygen to burn the fuel","The flame is colder"],"Lower air pressure lowers the boiling point of water, so the water is not hot enough to cook quickly. A pressure cooker raises the boiling point.","p"],
["K1","Adding common salt to water:",["Raises its boiling point and lowers its freezing point","Lowers both boiling and freezing points","Raises both","Has no effect on either"],"Dissolved impurities raise the boiling point and depress the freezing point — salt is spread on icy roads for this reason.",""],
["K1","The heat absorbed when a solid changes into a liquid at its melting point, without a rise in temperature, is called:",["Latent heat of fusion","Specific heat","Latent heat of vaporisation","Heat of combustion"],"Latent heat of fusion for ice is about 334 kJ/kg; during melting the temperature stays at 0 °C.",""],
["K1","Which of these does NOT increase the rate of evaporation?",["Higher humidity","Higher temperature","Larger surface area","Faster wind"],"Humid air already holds a lot of water vapour, so evaporation slows down.",""],
["K1","Gases are easy to compress because:",["The space between their particles is large","Their particles are very heavy","Their particles attract strongly","They have a fixed volume"],"Large gaps between gas particles let them be squeezed together — that is why LPG and CNG can be stored in cylinders.",""],
["K1","Which of these is NOT an example of sublimation?",["Melting of butter","Naphthalene balls disappearing","Iodine turning to violet vapour","Ammonium chloride on heating"],"Butter melts into a liquid. The other three go straight from solid to vapour.",""],

function labSymOptions(it){

function labShells(z){
  const caps = [2, 8, 8, 18], out = [];
  if (z <= 20) { let left = z; for (const c of caps.slice(0, 3)) { if (left <= 0) break; out.push(Math.min(c, left)); left -= c; } if (left > 0) out.push(left); return out.join(", "); }
  const map = { 21:"2, 8, 9, 2", 22:"2, 8, 10, 2", 23:"2, 8, 11, 2", 24:"2, 8, 13, 1", 25:"2, 8, 13, 2", 26:"2, 8, 14, 2", 27:"2, 8, 15, 2", 28:"2, 8, 16, 2", 29:"2, 8, 18, 1", 30:"2, 8, 18, 2" };
  return map[z] || ("2, 8, 18, " + (z - 28));
}
function labTap(z, btn){
  const F = LAB.find;
  if (!F) { LAB.sel = z; $("#app").querySelectorAll(".pt .el.sel").forEach(x => x.classList.remove("sel")); btn.classList.add("sel"); labCard(z); const c = $("#elcard"); if (c && window.innerWidth < 900) c.scrollIntoView({ behavior: "smooth", block: "nearest" }); return; }
  const want = F.list[F.i];
  if (z === want) {
    btn.classList.add("ok"); F.i++;
    if (F.i >= F.list.length) { labStop(); return setTimeout(labFindDone, 350); }
    setTimeout(labTable, 280);
  } else {
    F.pen += 3; btn.classList.remove("no"); void btn.offsetWidth; btn.classList.add("no");
    const right = $(`#app [data-z="${want}"]`); if (right) { right.classList.add("show"); setTimeout(() => right.classList.remove("show"), 700); }
  }
}
function labFindSecs(){ const F = LAB.find; return F ? Math.round((Date.now() - F.t0) / 1000) + F.pen : 0; }
function labFindStart(){
  // ten elements an exam might name — from the first 56 and the famous heavy ones
  const pool = LAB_EL.filter(e => e.z <= 56 || [74,78,79,80,82,86,88,92].includes(e.z)).map(e => e.z);
  LAB.find = { list: shuffle(pool).slice(0, 10), i: 0, pen: 0, t0: Date.now() };
  LAB.cat = null; LAB.sel = null; labTable(); window.scrollTo(0, 0);
}
function labFindDone(){
  const L = labS(), secs = labFindSecs(), best = !L.find || secs < L.find;
  if (best) L.find = secs; L.xp = (L.xp || 0) + 10; L.plays = (L.plays || 0) + 1; save();
  LAB.find = null;
  $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}<div class="block lab-res lab-pop"><span class="eyebrow">Find it!</span><div class="big">${secs} s</div>
    <p>${best ? "🎉 New best time!" : "Best time: " + L.find + " s"} · +10 XP</p><div class="row" style="justify-content:center"><button class="btn pri" type="button" id="again">Play again</button><button class="btn" type="button" id="totable">Explore the table</button></div></div></section>`;
  labBindHome();
  $("#again").onclick = labFindStart; $("#totable").onclick = () => { LAB.view = "table"; labTable(); };
}

{"id":"K1","g":"chem","heat":2,"title":"Matter and its states","hi":"पदार्थ और उसकी अवस्थाएँ","blocks":[{"k":"hot","h":"Easy marks that come round every year: <b>sublimation examples<\/b> (camphor, naphthalene, dry ice), <b>which state diffuses fastest<\/b>, <b>latent heat<\/b>, the <b>fourth and fifth states<\/b> (plasma, Bose–Einstein condensate) and <b>evaporation causes cooling<\/b>."},{"k":"story","h":"<p>Everything around you — the water you drink, the air you breathe, the chair you sit on — is <b>matter<\/b>: anything that has mass and takes up space. Matter is made of tiny particles that are always moving and that pull on each other.<\/p><p>Picture a crowded <b>school assembly<\/b>. When everyone stands in neat rows holding hands, that is a <b>solid<\/b>: fixed shape, particles only shiver in place. When the bell rings and children walk around the ground but stay close, that is a <b>liquid<\/b>: it flows and takes the shape of its container but keeps its volume. When school is over and everyone runs off in every direction, that is a <b>gas<\/b>: no fixed shape or volume, and particles far apart.<\/p><p>Heat gives particles energy to break free (melting, boiling); taking heat away lets them settle down again (condensing, freezing). Some solids skip the liquid stage and turn straight into gas — that is <b>sublimation<\/b>, which is why mothballs slowly vanish in your cupboard.<\/p>","key":"Solid → liquid → gas: particles get more energy, more space and weaker pull between them."},{"k":"table","title":"Three common states compared","head":["Property","Solid","Liquid","Gas"],"rows":[["Shape","Fixed","Takes the container's shape","No fixed shape"],["Volume","Fixed","Fixed","Fills the whole container"],["Space between particles","Least","More","Most"],["Force of attraction","Strongest","Weaker","Weakest"],["Compressibility","Almost none","Very little","Highly compressible (hence LPG, CNG cylinders)"],["Diffusion","Slowest","Faster","Fastest (smell of incense sprea \n  <text x=\"115\" y=\"222\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">packed, only vibrate<\/text><text x=\"330\" y=\"222\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">close, slide past<\/text><text x=\"545\" y=\"222\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">far apart, fly about<\/text><\/svg><\/figure>","cap":"Heating makes particles move faster and spread out: solid → liquid → gas. Plasma (the Sun) and Bose–Einstein condensate are the fourth and fifth states."},{"k":"table","title":"Changes of state","head":["Change","From → to","Name of the point / example"],"rows":[["Melting / fusion","Solid → liquid","Melting point; ice melts at 0 °C (273 K)"],["Boiling / vaporisation","Liquid → gas (throughout the liquid)","Boiling point; water boils at 100 °C (373 K) at sea level"],["Evaporation","Liquid → gas (at the surface, below boiling point)","Wet clothes dry; it causes cooling"],["Condensation","Gas → liquid","Water drops on a cold glass"],["Freezing / solidification","Liquid → solid","Water freezes at 0 °C"],["Sublimation","Solid → gas directly","Camphor, naphthalene (mothballs), iodine, ammonium chloride, dry ice (solid CO₂)"],["Deposition","Gas → solid directly","Frost forming on a cold night"]]},{"k":"info","title":"Changes of state","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 660 250\" role=\"img\" aria-label=\"Changes of state\">\n  <defs><marker id=\"cr\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#c0392b\"/><\/marker><marker id=\"cb\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#2f6db5\"/><\/marker><\/defs>\n  <circle cx=\"90\" cy=\"190\" r=\"44\" fill=\"#7a5a3a\"/><text x=\"90\" y=\"195\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">SOLID<\/text><circle cx=\"330\" cy=\"50\" r=\"44\" fill=\"#2f6db5\"/><text x=\"330\" y=\"55\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">LIQUID<\/text><circle cx=\"570\" cy=\"190\" r=\"44\" fill=\"#8a8a8a\"/><text x=\"570\" y=\"195\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">GAS<\/text>\n  <path d=\"M120 155 Q190 80 285 60\" stroke=\"#c0392b\" stroke-width=\"3\" fill=\"none\" marker-end=\"url(#cr)\"/><text x=\"160\" y=\"92\" font-size=\"12\" font-weight=\"700\" text-anchor=\"end\" style=\"fill:#c0392b\">melting<\/text>\n  <path d=\"M292 82 Q200 120 132 182\" stroke=\"#2f6db5\" stroke-width=\"3\" fill=\"none\" marker-end=\"url(#cb)\"/><text x=\"232\" y=\"146\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#2f6db5\">freezing<\/text>\n  <path d=\"M375 60 Q470 80 540 155\" stroke=\"#c0392b\" stroke-width=\"3\" fill=\"none\" marker-end=\"url(#cr)\"/><text x=\"500\" y=\"92\" font-size=\"12\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:#c0392b\">evaporation / boiling<\/text>\n  <path d=\"M528 182 Q460 120 368 82\" stroke=\"#2f6db5\" stroke-width=\"3\" fill=\"none\" marker-end=\"url(#cb)\"/><text x=\"428\" y=\"146\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#2f6db5\">condensation<\/text>\n  <path d=\"M135 200 H522\" stroke=\"#c0392b\" stroke-width=\"3\" marker-end=\"url(#cr)\"/><text x=\"330\" y=\"194\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#c0392b\">sublimation (camphor, naphthalene, dry ice)<\/text>\n  <path d=\"M525 220 H137\" stroke=\"#2f6db5\" stroke-width=\"3\" marker-end=\"url(#cb)\"/><text x=\"330\" y=\"240\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#2f6db5\">deposition<\/text><\/svg><\/figure>","cap":"Red arrows take heat in; blue arrows give heat out. Temperature stays fixed while the state changes — that heat is latent heat."},{"k":"facts","title":"Points the papers like","rows":[["Latent heat","Heat taken in to change state without any rise in temperature — that is why ice stays at 0 °C while melting"],["Latent heat of vaporisation of water","About 2260 kJ/kg — steam at 100 °C burns more than water at 100 °C"],["Evaporation increases with","Higher temperature, larger surface area, wind, lower humidity"],["Why a matka (earthen pot) cools water","Water seeps out through pores and evaporates, taking heat away"],["Pressure and boiling point","Low pressure lowers boiling point (hills: food cooks slowly); a pressure cooker raises it"],["Effect of impurities","Salt raises the boiling point and lowers the freezing point of water (salt on icy roads)"],["Fourth state of matter","Plasma — ionised gas; in the Sun, stars, lightning, neon signs"],["Fifth state","Bose–Einstein Condensate (BEC) — matter cooled close to absolute zero; predicted by S. N. Bose and Einstein"],["Absolute zero","0 K = −273.15 °C; K = °C + 273"],["Dry ice","Solid carbon dioxide; sublimes at −78.5 °C; used to keep things frozen and for stage fog"]]},{"k":"trick","h":"Kelvin from Celsius — just <b>add 273<\/b>. Room temperature 25 °C = 298 K. <span class='mn'>Mothball, Camphor, Iodine, Dry ice<\/span> — <b>“My Cat Ignores Dogs”<\/b> = the sublimation four."},{"k":"trap","h":"<b>Evaporation<\/b> happens at any temperature and only at the surface; <b>boiling<\/b> happens at a fixed temperature and throughout the liquid. <b>Plasma<\/b> is the 4th state, <b>BEC<\/b> the 5th — S. N. Bose is Indian. Steam burns are worse than boiling-water burns because of <b>latent heat<\/b>, not because steam is hotter."}],"sum":["Matter has mass and volume; solids keep shape and volume, liquids keep volume only, gases neither.","Diffusion and compressibility are greatest in gases and least in solids.","Sublimation turns a solid straight into gas: camphor, naphthalene, iodine, ammonium chloride, dry ice.","Evaporation causes cooling and happens at the surface below the boiling point; latent heat changes state without changing temperature.","Plasma is the fourth state of matter and the Bose–Einstein Condensate the fifth; K = °C + 273."],"part":["Part 1 · Basics: matter, atom, periodic table","मूल बातें"]},
{"id":"K2","g":"chem","heat":2,"title":"Elements, compounds and mixtures","hi":"तत्व, यौगिक और मिश्रण","blocks":[{"k":"hot","h":"Expect one question on <b>which separation method suits which mixture<\/b> (chromatography for dyes, fractional distillation for air or crude oil, centrifugation for cream), and one on <b>compound vs mixture<\/b> or <b>true solution, colloid, suspension<\/b>."},{"k":"story","h":"<p>Think of a <b>kitchen<\/b>. <b>Salt<\/b> and <b>sugar<\/b> each have a fixed make-up — they are <b>pure substances<\/b>. Mix salt into water and you get <b>salt water<\/b>: you can taste both, change how much salt you add, and get the salt back by boiling off the water. That is a <b>mixture<\/b>.<\/p><p>Now think of water itself. It is made of hydrogen and oxygen, but it is nothing like either — hydrogen burns, oxygen helps burning, yet water puts fire out. When elements join chemically in a <b>fixed ratio<\/b> and get brand-new properties, you have a <b>compound<\/b>.<\/p><p>An <b>element<\/b> is the simplest pure substance, made of only one kind of atom — like gold, oxygen or carbon. To pull mixtures apart, chemists use the difference between the parts: size (filtering), boiling point (distillation), weight (centrifuging), or how fast they travel on paper (chromatography).<\/p>","key":"Element = one kind of atom; compound = elements joined in a fixed ratio with new properties; mixture = parts just mixed, in any ratio, keeping their own properties."},{"k":"table","title":"Compound vs mixture","head":["Point","Compound","Mixture"],"rows":[["Ratio of parts","Fixed (water is always H : O = 1 : 8 by mass)","Any ratio"],["Properties","New — unlike its elements","Parts keep their own properties"],["Separation","Only by chemical means","By physical means (filtering, distilling, magnet…)"],["Energy change when formed","Usually heat given out or taken in","Usually none"],["Examples","Water, salt (NaCl), carbon dioxide, sugar","Air, brass, sea water, soil, milk, petrol"]]},{"k":"table","title":"True solution, colloid and suspension","head":["Point","True solution","Colloid","Suspension"],"rows":[["Particle size","Below 1 nm","1–1000 nm","Above 1000 nm"],["Looks","Clear, see-through","Looks uniform but is not","Cloudy; settles on standing"],["Tyndall effect (scatters a beam)","No","Yes","May show"],["Passes through filter paper","Yes","Yes","No"],["Examples","Salt or sugar in water, air","Milk, blood, ink, fog, smoke, butter, jelly, cheese","Chalk in water, muddy water, sand in water"]]},{"k":"info","title":"Solution, colloid, suspension","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 660 170\" role=\"img\" aria-label=\"Particle sizes of a true solution, a colloid and a suspension\">\n  <rect x=\"20\" y=\"50\" width=\"160\" height=\"40\" fill=\"#2f8f4e\"/><rect x=\"180\" y=\"50\" width=\"300\" height=\"40\" fill=\"#c69214\"/><rect x=\"480\" y=\"50\" width=\"160\" height=\"40\" fill=\"#a9805a\"/>\n  <text x=\"100\" y=\"76\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">True solution<\/text><text x=\"330\" y=\"76\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">Colloid<\/text><text x=\"560\" y=\"76\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">Suspension<\/text>\n  <text x=\"180\" y=\"110\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">1 nm<\/text><text x=\"480\" y=\"110\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">1000 nm<\/text>\n  <text x=\"100\" y=\"134\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">salt or sugar in water<\/text><text x=\"330\" y=\"134\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">milk, blood, fog, smoke, jelly — Tyndall effect<\/text>\n  <text x=\"560\" y=\"134\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">muddy water, chalk in water<\/text><text x=\"20\" y=\"30\" font-size=\"11\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink2)\">particle size →<\/text><\/svg><\/figure>","cap":"Only a suspension settles and is held back by filter paper. A colloid scatters a beam of light (Tyndall effect) — sunbeams in a dusty room, headlights in fog."},{"k":"table","title":"Separating mixtures","head":["Method","Works on","Example"],"rows":[["Filtration","Insoluble solid from a liquid","Tea leaves from tea, sand from water"],["Evaporation","Dissolved solid from a liquid","Salt from sea water"],["Crystallisation","Pure crystals from a solution (better than evaporation)","Purifying alum, copper sulphate; salt pans"],["Simple distillation","Two liquids with very different boiling points, or a liquid from a solid","Pure water from sea water"],["Fractional distillation","Liquids whose boiling points are close (less than 25 °C apart)","Crude oil into petrol, diesel…; gases of air (oxygen, nitrogen, argon)"],["Separating funnel","Two liquids that do not mix","Oil and water; kerosene and water"],["Centrifugation","Fine particles spun out by fast rotation","Cream from milk (butter), blood tests, washing-machine dryer"],["Chromatography","Different dissolved substances moving at different speeds","Colours in ink or dyes, drugs from blood, pigments of leaves"],["Sublimation","A solid that sublimes from one that does not","Ammonium chloride or camphor from salt"],["Magnetic separation","Magnetic from non-magnetic","Iron filings from sulphur or sand"],["Sedimentation and decantation","Heavy solid settles; liquid poured off","Muddy water left to settle"],["Loading","Alum added to make mud settle faster","Cleaning river water"],["Winnowing, threshing, sieving","Farm and kitchen methods","Husk from grain; stones from flour"]]},{"k":"facts","title":"Quick facts","rows":[["Homogeneous mixture","Same throughout — air, salt solution, brass, vinegar"],["Heterogeneous mixture","Parts can be seen — soil, sand in water, oil in water, fruit salad"],["Alloys","Mixtures, not compounds — e.g. brass (Cu + Zn), bronze (Cu + Sn)"],["Tyndall effect","Scattering of light by colloid particles — sunbeams in a dusty room, headlights in fog"],["Air","A mixture; nitrogen about 78%, oxygen about 21%, argon about 0.93%, CO₂ about 0.04%"],["Emulsion","Colloid of liquid in liquid — milk, mayonnaise, cold cream"],["Gel","Liquid in solid — jelly, cheese, butter"],["Aerosol","Liquid or solid in gas — fog, mist, cloud (liquid); smoke, dust (solid)"],["Foam","Gas in liquid — shaving cream, soap lather; gas in solid — sponge, pumice"]]},{"k":"trick","h":"Chromatography — <b>“Chroma” = colour<\/b>: whenever the question says <i>dye, ink, pigment, colour<\/i>, pick chromatography. Spinning milk for cream? <b>Centri<\/b>fugation goes round the <b>centre<\/b>."},{"k":"trap","h":"<b>Air, brass, steel and sea water are mixtures<\/b>, not compounds. <b>Milk is a colloid<\/b> (emulsion), not a true solution. Crude oil and air are separated by <b>fractional<\/b> distillation, not simple distillation. Butter is a gel; milk is an emulsion."}],"sum":["An element has one kind of atom; a compound has elements in a fixed ratio with new properties; a mixture keeps its parts' properties in any ratio.","True solutions are below 1 nm and clear; colloids (milk, blood, fog, smoke) show the Tyndall effect; suspensions settle.","Chromatography separates dyes and inks; centrifugation separates cream from milk.","Fractional distillation separates crude oil and the gases of air; a separating funnel separates oil and water.","Air, alloys and sea water are mixtures; water, salt and carbon dioxide are compounds."],"part":["Part 1 · Basics: matter, atom, periodic table","मूल बातें"]},
{"id":"K3","g":"chem","heat":3,"title":"Structure of the atom","hi":"परमाणु की संरचना","blocks":[{"k":"hot","h":"Almost every shift has one: <b>who discovered the electron / proton / neutron / nucleus<\/b>, <b>isotopes vs isobars<\/b>, <b>electronic configuration<\/b> (2, 8, 8…), <b>valency<\/b>, or the <b>charge and mass of sub-atomic particles<\/b>."},{"k":"story","h":"<p>About 2,500 years ago the Indian sage <b>Maharishi Kanad<\/b> said matter is made of tiny indivisible particles he called <i>parmanu<\/i>. In 1808 <b>John Dalton<\/b> made this a science: atoms are tiny, cannot be split, and atoms of one element are all alike.<\/p><p>Then the cracks appeared. In 1897 <b>J. J. Thomson<\/b> found tiny negative particles — <b>electrons<\/b> — and pictured the atom as a <b>plum pudding<\/b> (or a watermelon): a ball of positive charge with electrons stuck in it like seeds. In 1911 <b>Ernest Rutherford<\/b> fired alpha particles at a very thin gold foil. Most went straight through, but a few bounced right back — as if a bullet had hit a tiny steel ball hidden in cotton wool. The atom, he said, is mostly <b>empty space<\/b> with a tiny, heavy, positive <b>nucleus<\/b> at the centre.<\/p><p><b>Niels Bohr<\/b> (1913) then said electrons move in fixed <b>shells<\/b> or energy levels (K, L, M, N) and do not lose energy while there. Finally, <b>James Chadwick<\/b> (1932) found the <b>neutron<\/b>, the uncharged particle in the nucleus. That completed today's picture: protons and neutrons in the nucleus, electrons in shells around it.<\/p>","key":"Electron — Thomson; nucleus — Rutherford (gold foil); shells — Bohr; neutron — Chadwick; proton — Goldstein's canal rays / Rutherford."},{"k":"table","title":"The three sub-atomic particles","head":["Particle","Symbol","Charge","Relative mass","Where","Discovered by"],"rows":[["Electron","e⁻","−1 (−1.6 × 10⁻¹⁹ C)","1/1836 of a proton (about 9.1 × 10⁻³¹ kg)","Shells around the nucleus","J. J. Thomson, 1897 (cathode rays)"],["Proton","p⁺","+1","1 u (about 1.672 × 10⁻²⁷ kg)","Nucleus","E. Goldstein's canal (anode) rays, 1886; named by Rutherford"],["Neutron","n","0 (no charge)","About 1 u — slightly heavier than a proton","Nucleus (absent in ordinary hydrogen)","James Chadwick, 1932"]]},{"k":"info","title":"Bohr's atom","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 640 260\" role=\"img\" aria-label=\"Bohr model of a sodium atom\">\n  <circle cx=\"160\" cy=\"130\" r=\"26\" fill=\"#c0503a\"/><text x=\"160\" y=\"128\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">11 p<\/text><text x=\"160\" y=\"142\" font-size=\"11\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">12 n<\/text>\n  <circle cx=\"160\" cy=\"130\" r=\"50\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.5\"/><g><circle cx=\"210.0\" cy=\"130.0\" r=\"6\" fill=\"#2f6db5\"/><circle cx=\"110.0\" cy=\"130.0\" r=\"6\" fill=\"#2f6db5\"/><animateTransform attributeName=\"transform\" type=\"rotate\" from=\"0 160 130\" to=\"360 160 130\" dur=\"6s\" repeatCount=\"indefinite\"/><\/g><circle cx=\"160\" cy=\"130\" r=\"84\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.5\"/><g><circle cx=\"244.0\" cy=\"130.0\" r=\"6\" fill=\"#2f6db5\"/><circle cx=\"219.4\" cy=\"189.4\" r=\"6\" fill=\"#2f6db5\"/><circle cx=\"160.0\" cy=\"214.0\" r=\"6\" fill=\"#2f6db5\"/><circle cx=\"100.6\" cy=\"189.4\" r=\"6\" fill=\"#2f6db5\"/><circle cx=\"76.0\" cy=\"130.0\" r=\"6\" fill=\"#2f6db5\"/><circle cx=\"100.6\" cy=\"70.6\" r=\"6\" fill=\"#2f6db5\"/><circle cx=\"160.0\" cy=\"46.0\" r=\"6\" fill=\"#2f6db5\"/><circle cx=\"219.4\" cy=\"70.6\" r=\"6\" fill=\"#2f6db5\"/><animateTransform attributeName=\"transform\" type=\"rotate\" from=\"0 160 130\" to=\"-360 160 130\" dur=\"10s\" repeatCount=\"indefinite\"/><\/g><circle cx=\"160\" cy=\"130\" r=\"118\" fill=\"none\" stroke=\"var(--rule)\" stroke-width=\"1.5\"/><g><circle cx=\"278.0\" cy=\"130.0\" r=\"6\" fill=\"#2f6db5\"/><animateTransform attributeName=\"transform\" type=\"rotate\" from=\"0 160 130\" to=\"360 160 130\" dur=\"14s\" repeatCount=\"indefinite\"/><\/g>\n  <text x=\"330\" y=\"60\" font-size=\"14\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:var(--ink)\">Sodium (Na) — Z = 11, A = 23<\/text><text x=\"330\" y=\"84\" font-size=\"12\" class=\"mut\">electrons in shells: K 2 · L 8 · M 1<\/text>\n  <text x=\"330\" y=\"106\" font-size=\"12\" class=\"mut\">one valence electron → loses it easily (valency 1)<\/text><text x=\"330\" y=\"140\" font-size=\"12\" class=\"mut\">a shell holds at most 2n² electrons<\/text>\n  <text x=\"330\" y=\"160\" font-size=\"12\" class=\"mut\">nucleus: protons + neutrons (Rutherford, Chadwick)<\/text><\/svg><\/figure>","cap":"Electrons circle the nucleus in fixed shells (Bohr, 1913). The number of protons (atomic number) decides the element; the outer electrons decide how it reacts."},{"k":"photos","title":"Who opened up the atom","items":[["J._J._Thomson","J. J. Thomson","Electron, 1897"],["Ernest_Rutherford","Ernest Rutherford","Nucleus, 1911"],["Niels_Bohr","Niels Bohr","Shells, 1913"],["James_Chadwick","James Chadwick","Neutron, 1932"],["John_Dalton","John Dalton","Atomic theory, 1808"]]},{"k":"tl","title":"Atomic models, in order","rows":[["c. 600 BCE","Maharishi Kanad — parmanu, the smallest particle of matter"],["1808","John Dalton's atomic theory — atoms indivisible"],["1897","J. J. Thomson discovers the electron; 'plum pudding' model"],["1911","Rutherford's gold-foil (alpha scattering) experiment — nuclear model"],["1913","Niels Bohr — electrons in fixed orbits (shells)"],["1926","Schrödinger — quantum mechanical (orbital) model"],["1932","James Chadwick discovers the neutron"]]},{"k":"facts","title":"Numbers and terms","rows":[["Atomic number (Z)","Number of protons (= electrons in a neutral atom); it decides the element"],["Mass number (A)","Protons + neutrons; neutrons = A − Z"],["Electrons a shell can hold","2n²: K = 2, L = 8, M = 18, N = 32"],["Outermost shell","Holds at most 8 electrons (octet)"],["Valence electrons","Electrons in the outermost shell; they decide chemical behaviour"],["Valency","Combining capacity — electrons an atom gives, takes or shares to complete its octet"],["Sodium (Z = 11)","2, 8, 1 → valency 1"],["Chlorine (Z = 17)","2, 8, 7 → valency 1"],["Calcium (Z = 20)","2, 8, 8, 2 → valency 2"],["Size of the nucleus","About 10⁻¹⁵ m; the atom is about 10⁻¹⁰ m (100,000 times bigger)"],["Quantum numbers","Principal (n), azimuthal (l), magnetic (m), spin (s)"],["Rules of filling","Aufbau (lowest energy first), Pauli exclusion (no two electrons with the same four quantum numbers), Hund's rule (fill singly first)"]]},{"k":"table","title":"Isotopes, isobars and isotones","head":["Term","Same","Different","Example"],"rows":[["Isotopes","Atomic number (protons)","Mass number (neutrons)","Protium ¹H, deuterium ²H, tritium ³H; C-12, C-14; Cl-35, Cl-37"],["Isobars","Mass number","Atomic number","Argon-40 and calcium-40"],["Isotones","Number of neutrons","Protons and mass number","Carbon-14 and oxygen-16 (8 neutrons each)"],["Isoelectronic","Number of electrons","Element","Na⁺, Mg²⁺, Ne, F⁻, O²⁻ (10 electrons each)"]]},{"k":"facts","title":"Isotopes at work","rows":[["Tritium (³H)","The only radioactive isotope of hydrogen"],["Deuterium","Heavy hydrogen; D₂O is heavy water, used as a moderator in nuclear reactors"],["Carbon-14","Radiocarbon dating of fossils and old wood (half-life about 5730 years)"],["Cobalt-60","Cancer treatment (radiotherapy)"],["Iodine-131","Thyroid treatment and tests"],["Uranium-235","Fuel in nuclear reactors and the atom bomb"],["Sodium-24","Finding blood clots and blockages"],["Phosphorus-32","Leukaemia treatment, plant studies"]]},{"k":"trick","h":"Discoverers in one line — <b>“Tom Eats, Rutherford Nuts, Chadwick Nibbles, Goldstein Pops”<\/b>: Thomson–Electron, Rutherford–Nucleus, Chadwick–Neutron, Goldstein–Proton (canal rays). Shell capacity <b>2-8-18-32<\/b> = 2n²."},{"k":"trap","h":"<b>Isotopes<\/b> have the same <b>atomic<\/b> number; <b>isobars<\/b> have the same <b>mass<\/b> number (<i>bar = mass, like a barbell<\/i>). The <b>neutron<\/b> is slightly <i>heavier<\/i> than the proton. Ordinary hydrogen (protium) has <b>no neutron<\/b>. The gold-foil experiment proved the <b>nucleus<\/b>, not the electron."}],"sum":["Thomson found the electron (1897), Rutherford the nucleus by the gold-foil experiment (1911), Chadwick the neutron (1932); Bohr gave shells (1913).","Atomic number = protons; mass number = protons + neutrons.","Shells hold 2n² electrons: 2, 8, 18, 32; the outermost holds at most 8.","Isotopes share atomic number (C-12, C-14); isobars share mass number (Ar-40, Ca-40); isotones share neutrons.","Carbon-14 dates fossils, cobalt-60 treats cancer, iodine-131 treats the thyroid, tritium is radioactive hydrogen."],"part":["Part 1 · Basics: matter, atom, periodic table","मूल बातें"]},
{"id":"K4","g":"chem","heat":3,"title":"The periodic table","hi":"आवर्त सारणी","blocks":[{"k":"hot","h":"A sure topic: <b>who made which table<\/b> (Döbereiner's triads, Newlands' octaves, Mendeleev, Moseley), <b>periods and groups<\/b>, <b>trends<\/b> (atomic size, metallic character, electronegativity) and the <b>families<\/b> — alkali metals, halogens, noble gases."},{"k":"story","h":"<p>By the 1860s about 63 elements were known and chemists wanted to arrange them like books in a library. <b>Döbereiner<\/b> grouped them in threes (<b>triads<\/b>), <b>Newlands<\/b> noticed every eighth element was like the first, like the notes of music (<b>law of octaves<\/b>).<\/p><p>In 1869 the Russian chemist <b>Dmitri Mendeleev<\/b> arranged elements by <b>atomic mass<\/b> and boldly left <b>gaps<\/b> for elements not yet found — and even predicted their properties. When gallium and germanium were discovered and matched his guesses, the world was convinced. He is called the <b>father of the periodic table<\/b>.<\/p><p>One problem remained: a few elements sat in the wrong order by mass. In 1913 <b>Henry Moseley<\/b> showed the real key is the <b>atomic number<\/b>. Today's <b>modern periodic table<\/b> lists 118 elements by atomic number in <b>7 periods<\/b> (rows) and <b>18 groups<\/b> (columns). Elements in one group behave alike because they have the same number of outer electrons — like members of one family.<\/p>","key":"Mendeleev arranged by atomic mass; the modern table (Moseley) by atomic number — 7 periods, 18 groups, 118 elements."},{"k":"tl","title":"How the table grew","rows":[["1817–1829","Döbereiner's triads — e.g. Li, Na, K; the middle mass is about the average of the other two"],["1864","Newlands' law of octaves — every 8th element like the 1st (worked only up to calcium)"],["1869","Mendeleev's periodic law — properties repeat with atomic mass; left gaps for eka-aluminium (gallium) and eka-silicon (germanium)"],["1894–1898","Noble gases found (Ramsay, Rayleigh) — a whole new group added"],["1913","Moseley — atomic number is the basis (modern periodic law)"],["2016","Last four names confirmed: nihonium (113), moscovium (115), tennessine (117), oganesson (118)"]]},{"k":"facts","title":"Layout of the modern table","rows":[["Periods (rows)","7; period number = number of shells"],["Groups (columns)","18; for groups 1–2 the group number = valence electrons; for 13–18 it is valence electrons + 10"],["Shortest period","1st — only 2 elements (H, He)"],["Longest period","6th and 7th — 32 elements each"],["s-block","Groups 1–2 (and helium)"],["p-block","Groups 13–18"],["d-block","Groups 3–12 — transition metals"],["f-block","Lanthanides (57–71) and actinides (89–103), kept at the bottom"],["Metals","Left and centre (about 80% of all elements)"],["Metalloids","Along the zig-zag line — boron, silicon, germanium, arsenic, antimony, tellurium"],["Liquid elements at room temperature","Mercury (metal) and bromine (non-metal)"],["Elements that melt in your hand","Gallium (about 30 °C) and caesium (about 28 °C)"]]},{"k":"info","title":"The modern periodic table","html":"<figure class=\"fig wide\" style=\"--minw:640px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 690 340\" role=\"img\" aria-label=\"The periodic table coloured by family\">\n  <g><rect x=\"8\" y=\"18\" width=\"35\" height=\"31\" rx=\"4\" fill=\"#5aa85a\" opacity=\"0.95\"><title>1 H<\/title><\/rect><text x=\"11\" y=\"28\" font-size=\"7\" style=\"fill:#fff\">1<\/text><text x=\"25.5\" y=\"43\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" style=\"fill:#fff\" data-lq=\"H\">H<\/text><\/g><g><rect x=\"645.5\" y=\"18\" width=\"35\" height=\"31\" rx=\"4\" fill=\"#2f6db5\" opacity=\"0.95\"><title>2 He<\/title><\/rect><text x=\"648.5\" y=\"28\" font-size=\"7\" style=\"fill:#fff\">2<\/text><text x=\"663\" y=\"43\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"800\" style=\"fill:#fff\" data-lq=\"He\">He<\/text><\/g><g><rect x=\"8\" y=\"52\" width=\"35\" height=\"31\" rx \"3\" fill=\"#5aa85a\"/><text x=\"236\" y=\"46\" font-size=\"10.5\" class=\"b\">Other non-metals<\/text><rect x=\"350\" y=\"36\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#1f8a8a\"/><text x=\"366\" y=\"46\" font-size=\"10.5\" class=\"b\">Metalloids<\/text><rect x=\"480\" y=\"36\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#b55a8a\"/><text x=\"496\" y=\"46\" font-size=\"10.5\" class=\"b\">Lanthanides / actinides<\/text><\/svg><\/figure>","cap":"18 groups (columns) and 7 periods (rows), arranged by atomic number (Moseley). The two bottom rows are the lanthanides and actinides. Hover a box for its atomic number."},{"k":"table","title":"Trends you must know","head":["Property","Across a period (left → right)","Down a group (top → bottom)"],"rows":[["Atomic size (radius)","Decreases","Increases"],["Metallic character","Decreases","Increases"],["Non-metallic character","Increases","Decreases"],["Ionisation energy","Increases","Decreases"],["Electronegativity","Increases","Decreases"],["Valency","Rises 1 → 4, then falls to 0","Stays the same"]]},{"k":"table","title":"Famous families","head":["Group","Family","Members","What to remember"],"rows":[["1","Alkali metals","Li, Na, K, Rb, Cs, Fr","Soft, very reactive, kept in kerosene; form strong alkalis with water"],["2","Alkaline earth metals","Be, Mg, Ca, Sr, Ba, Ra","Valency 2; found in the earth's crust as compounds"],["15","Pnictogens (nitrogen family)","N, P, As, Sb, Bi","Valency 3 or 5"],["16","Chalcogens (oxygen family)","O, S, Se, Te, Po","'Ore-formers'"],["17","Halogens","F, Cl, Br, I, At","'Salt-formers'; 7 valence electrons; fluorine is the most reactive and most electronegative element"],["18","Noble (inert) gases","He, Ne, Ar, Kr, Xe, Rn","Full outer shell, hardly react, valency 0; radon is radioactive"]]},{"k":"facts","title":"Record holders","rows":[["Lightest element","Hydrogen"],["Most abundant element in the universe","Hydrogen; then helium"],["Most abundant in the earth's crust","Oxygen; then silicon, then aluminium (most abundant metal)"],["Most abundant in the atmosphere","Nitrogen"],["Most abundant in the human body","Oxygen (by mass); then carbon"],["Most electronegative","Fluorine"],["Most electropositive (stable)","Caesium"],["Largest atom (common lists)","Caesium / francium"],["Hardest natural substance","Diamond (carbon)"],["Densest element","Osmium"],["Highest melting point metal","Tungsten (about 3422 °C) — used in bulb filaments"],["Best conductor of electricity","Silver; then copper"],["Lightest metal","Lithium"],["Element with the most compounds","Carbon"]]},{"k":"trick","h":"Alkali metals: <b>“Little Naughty Kids Rub Cat's Fur”<\/b> = Li Na K Rb Cs Fr. Halogens: <b>“Fat Cats Bring Itchy Attitude”<\/b> = F Cl Br I At. Noble gases: <b>“He Never Arrived; Kriti eXpected Rahul”<\/b> = He Ne Ar Kr Xe Rn."},{"k":"trap","h":"<b>Mendeleev<\/b> used atomic <b>mass<\/b>; <b>Moseley<\/b> (modern law) used atomic <b>number<\/b>. Size <b>decreases<\/b> across a period (more protons pull harder) but <b>increases<\/b> down a group. Hydrogen is placed in group 1 but is a <b>non-metal<\/b>. The most abundant element in the crust is <b>oxygen<\/b>; the most abundant <b>metal<\/b> is <b>aluminium<\/b>, not iron."}],"sum":["Döbereiner made triads, Newlands the law of octaves, Mendeleev (father of the periodic table) arranged by atomic mass, Moseley by atomic number.","The modern table has 118 elements, 7 periods and 18 groups; period number = number of shells.","Across a period atomic size falls and electronegativity rises; down a group size and metallic character rise.","Group 1 alkali metals, group 17 halogens (fluorine most electronegative), group 18 noble gases.","Mercury and bromine are liquid at room temperature; oxygen is the most abundant element in the crust and aluminium the most abundant metal."],"part":["Part 1 · Basics: matter, atom, periodic table","मूल बातें"]},
{"id":"K5","g":"chem","heat":2,"title":"Chemical bonding and the mole","hi":"रासायनिक बंधन और मोल","blocks":[{"k":"hot","h":"Look for <b>ionic vs covalent<\/b> examples, the <b>hydrogen bond<\/b> (why ice floats, why water boils high), <b>Avogadro's number<\/b>, <b>molar mass<\/b>, <b>22.4 L at STP<\/b>, and simple <b>number of atoms / molecules<\/b> calculations."},{"k":"story","h":"<p>Atoms want what noble gases already have: a full outer shell of eight electrons (the <b>octet<\/b>). They get it in two main ways.<\/p><p><b>Giving and taking<\/b>: sodium has one spare electron and chlorine needs one. Sodium hands it over, becomes Na⁺, chlorine becomes Cl⁻, and the opposite charges hold them tight — an <b>ionic (electrovalent) bond<\/b>, like a shopkeeper and a buyer exchanging money. Ionic compounds are hard crystals with high melting points that conduct electricity when melted or dissolved.<\/p><p><b>Sharing<\/b>: two chlorine atoms each need one electron, so they share a pair — a <b>covalent bond<\/b>, like two friends sharing an umbrella. Covalent substances (water, methane, sugar) usually melt and boil low and do not conduct.<\/p><p>Chemists count atoms in <b>moles<\/b>, just as a shop counts bananas in dozens. One mole is <b>6.022 × 10²³<\/b> particles (<b>Avogadro's number<\/b>), and one mole of any gas fills <b>22.4 litres<\/b> at STP.<\/p>","key":"Ionic = transfer of electrons (metal + non-metal); covalent = sharing (non-metals); 1 mole = 6.022 × 10²³ particles = molar mass in grams = 22.4 L of gas at STP."},{"k":"table","title":"Ionic vs covalent compounds","head":["Point","Ionic","Covalent"],"rows":[["Formed by","Transfer of electrons","Sharing of electrons"],["Usually between","Metal and non-metal","Non-metals"],["State","Hard crystalline solids","Gases, liquids or soft solids"],["Melting / boiling point","High","Low"],["Electricity","Conduct when molten or dissolved in water","Usually do not conduct (graphite is an exception)"],["Dissolves in","Water","Organic solvents (kerosene, petrol)"],["Examples","NaCl, MgO, CaCl₂, KBr","H₂, Cl₂, H₂O, CH₄, NH₃, CO₂, sugar"]]},{"k":"info","title":"Two ways atoms bond","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 660 220\" role=\"img\" aria-label=\"Ionic bond in NaCl and covalent bonds in water\">\n  <defs><marker id=\"ea\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#c0392b\"/><\/marker><\/defs>\n  <circle cx=\"80\" cy=\"90\" r=\"34\" fill=\"#e07b39\"/><text x=\"80\" y=\"95\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">Na<\/text><circle cx=\"230\" cy=\"90\" r=\"40\" fill=\"#2f8f4e\"/><text x=\"230\" y=\"95\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">Cl<\/text>\n  <circle r=\"6\" fill=\"#2f6db5\"><animateMotion dur=\"2.4s\" repeatCount=\"indefinite\" path=\"M114 90 Q155 50 190 90\"/><\/circle><path d=\"M114 80 Q155 40 186 78\" fill=\"none\" stroke=\"#c0392b\" stroke-dasharray=\"4 3\" marker-end=\"url(#ea)\"/>\n  <text x=\"155\" y=\"160\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Ionic: Na gives 1 electron → Na⁺ Cl⁻<\/text><text x=\"155\" y=\"180\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">metal + non-metal · high melting point · conducts in water<\/text>\n  <circle cx=\"500\" cy=\"80\" r=\"34\" fill=\"#c0392b\"/><text x=\"500\" y=\"85\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">O<\/text><circle cx=\"435\" cy=\"125\" r=\"22\" fill=\"#2f6db5\"/><text x=\"435\" y=\"130\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">H<\/text><circle cx=\"565\" cy=\"125\" r=\"22\" fill=\"#2f6db5\"/><text x=\"565\" y=\"130\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#fff\">H<\/text>\n  <circle cx=\"460\" cy=\"103\" r=\"4\" fill=\"var(--ink)\"/><circle cx=\"470\" cy=\"110\" r=\"4\" fill=\"var(--ink)\"/><circle cx=\"530\" cy=\"110\" r=\"4\" fill=\"var(--ink)\"/><circle cx=\"540\" cy=\"103\" r=\"4\" fill=\"var(--ink)\"/>\n  <text x=\"500\" y=\"175\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--ink)\">Covalent: shared electron pairs (H₂O)<\/text><text x=\"500\" y=\"195\" text-anchor=\"middle\" font-size=\"10.5\" class=\"mut\">non-metals · low melting point · usually no conduction<\/text><\/svg><\/figure>","cap":"Ionic bonds transfer electrons; covalent bonds share them. Both aim for a full outer shell (the octet rule)."},{"k":"facts","title":"Other bonds and molecule shapes","rows":[["Single, double, triple bond","H–H, O=O, N≡N (the triple bond makes N₂ very stable)"],["Coordinate (dative) bond","Both shared electrons come from one atom — e.g. in NH₄⁺, H₃O⁺"],["Metallic bond","Positive ions in a 'sea' of free electrons — why metals conduct and can be drawn into wires"],["Hydrogen bond","Weak pull between H and F, O or N of another molecule — high boiling point of water, ice floats (open structure), DNA's two strands"],["Van der Waals forces","Weakest attraction between molecules"],["Shapes","CO₂ linear (180°); H₂O bent (104.5°); NH₃ pyramidal (107°); CH₄ tetrahedral (109.5°)"],["Polar molecule","Uneven sharing — water, ammonia, HCl"],["Non-polar","Even sharing — H₂, O₂, CH₄, CO₂"]]},{"k":"facts","title":"The mole and the gas laws of combination","rows":[["Avogadro's number (Nₐ)","6.022 × 10²³ per mole"],["1 mole","Molar mass in grams — 18 g water, 44 g CO₂, 58.5 g NaCl, 12 g carbon-12"],["Molar volume","22.4 L for 1 mole of any gas at STP (0 °C, 1 atm)"],["Atomic mass unit (u)","1/12 of the mass of one carbon-12 atom"],["Molar masses to remember","H₂O 18, CO₂ 44, NH₃ 17, CH₄ 16, O₂ 32, N₂ 28, NaCl 58.5, CaCO₃ 100, H₂SO₄ 98, glucose 180"],["Law of conservation of mass","Lavoisier — mass is neither created nor destroyed in a reaction"],["Law of definite (constant) proportions","Proust — a compound always has elements in the same mass ratio"],["Law of multiple proportions","Dalton — e.g. CO and CO₂"],["Avogadro's law","Equal volumes of gases at the same temperature and pressure hold equal numbers of molecules"],["Gay-Lussac's law of gaseous volumes","Gases react in simple whole-number ratios by volume"]]},{"k":"ex","h":"How many molecules in 36 g of water? Molar mass of H₂O = 18 g, so 36 g = 2 moles = 2 × 6.022 × 10²³ = <b>1.2044 × 10²⁴ molecules<\/b>. And 2 moles of oxygen gas at STP fill 2 × 22.4 = <b>44.8 L<\/b>."},{"k":"trick","h":"<b>“Ionic = I Own it”<\/b> — one atom takes the electron for itself; <b>“Co-valent = Co-operate”<\/b> — they share. Molar volume <b>22.4<\/b> — think of <b>22.4 carat<\/b> gold."},{"k":"trap","h":"Ice floats because hydrogen bonds hold molecules in an <b>open cage<\/b>, making ice <b>less dense<\/b> than water — it is not because of air in it. Water is densest at <b>4 °C<\/b>. Ionic solids do <b>not<\/b> conduct when solid, only when molten or dissolved. Graphite is covalent but <b>conducts<\/b>."}],"sum":["Ionic bonds form by transfer of electrons (NaCl, MgO); covalent bonds by sharing (H₂O, CH₄, NH₃).","Ionic compounds melt high and conduct when molten or dissolved; covalent ones melt low and usually do not conduct.","Hydrogen bonding makes water boil high and ice float; water is densest at 4 °C.","One mole = 6.022 × 10²³ particles = molar mass in grams = 22.4 L of gas at STP.","Lavoisier gave conservation of mass, Proust definite proportions, Dalton multiple proportions."],"part":["Part 1 · Basics: matter, atom, periodic table","मूल बातें"]},
{"id":"K6","g":"chem","heat":2,"title":"Chemical reactions and equations","hi":"रासायनिक अभिक्रियाएँ और समीकरण","blocks":[{"k":"hot","h":"Papers like to name a reaction and ask its <b>type<\/b> (combination, decomposition, displacement, double displacement, redox), ask whether it is <b>exothermic or endothermic<\/b>, or ask about <b>rusting, rancidity and catalysts<\/b>."},{"k":"story","h":"<p>Light a matchstick, leave a cut apple out, put an iron nail in the rain, or let milk turn to curd — in each case <b>new substances<\/b> form. That is a <b>chemical change<\/b>. Melting ice or tearing paper only changes shape or state; that is a <b>physical change<\/b>, and nothing new is made.<\/p><p>You can usually spot a chemical reaction by a sign: a <b>colour change<\/b> (the cut apple goes brown), a <b>gas<\/b> bubbling out, a <b>solid (precipitate)<\/b> forming in a liquid, a <b>change in temperature<\/b>, or <b>light<\/b>.<\/p><p>Chemists write reactions as <b>equations<\/b>, like a recipe: what goes in (reactants) on the left, what comes out (products) on the right. Because atoms are never made or lost (Lavoisier's law), the number of each kind of atom must be the same on both sides — that is <b>balancing<\/b> the equation.<\/p>","key":"Chemical change makes new substances; signs are colour, gas, precipitate, heat or light; a balanced equation keeps every atom."},{"k":"table","title":"Types of reactions","head":["Type","Pattern","Example"],"rows":[["Combination","A + B → AB","CaO + H₂O → Ca(OH)₂ (quicklime + water = slaked lime, lots of heat); 2Mg + O₂ → 2MgO (dazzling white light)"],["Decomposition","AB → A + B","CaCO₃ → CaO + CO₂ (heat); 2H₂O → 2H₂ + O₂ (electricity); 2AgCl → 2Ag + Cl₂ (sunlight)"],["Displacement","A + BC → AC + B (a more reactive element pushes out a less reactive one)","Fe + CuSO₄ → FeSO₄ + Cu — blue solution turns green, iron nail gets a brown coat"],["Double displacement","AB + CD → AD + CB (ions swap)","Na₂SO₄ + BaCl₂ → BaSO₄↓ (white precipitate) + 2NaCl"],["Precipitation","A double displacement that gives an insoluble solid","Pb(NO₃)₂ + 2KI → PbI₂↓ (yellow) + 2KNO₃"],["Neutralisation","Acid + base → salt + water","HCl + NaOH → NaCl + H₂O"],["Redox","Oxidation and reduction together","CuO + H₂ → Cu + H₂O (CuO reduced, H₂ oxidised)"],["Combustion","Burning in oxygen, giving heat and light","CH₄ + 2O₂ → CO₂ + 2H₂O"]]},{"k":"facts","title":"Oxidation and reduction","rows":[["Oxidation","Gain of oxygen, loss of hydrogen, or loss of electrons"],["Reduction","Loss of oxygen, gain of hydrogen, or gain of electrons"],["Oxidising agent","Gives oxygen / takes electrons — gets reduced itself (e.g. KMnO₄, H₂O₂, O₂)"],["Reducing agent","Takes oxygen / gives electrons — gets oxidised itself (e.g. H₂, C, CO)"],["Memory line","OIL RIG — Oxidation Is Loss, Reduction Is Gain (of electrons)"]]},{"k":"table","title":"Heat in reactions","head":["Exothermic (heat given out)","Endothermic (heat taken in)"],"rows":[["Burning of fuels (combustion)","Photosynthesis"],["Respiration (glucose + oxygen)","Decomposition of limestone (CaCO₃) on heating"],["Quicklime + water","Dissolving ammonium chloride in water (the test tube feels cold)"],["Decomposition of vegetable matter into compost","Melting of ice, evaporation (physical changes that absorb heat)"],["Neutralisation of an acid by a base","Electrolysis of water"]]},{"k":"facts","title":"Everyday chemistry of reactions","rows":[["Rusting","Iron + oxygen + water → hydrated iron(III) oxide, Fe₂O₃·xH₂O (reddish brown); needs both air and moisture"],["Copper turns green","Basic copper carbonate forms (with CO₂ and moisture)"],["Silver turns black","Silver sulphide forms (with sulphur compounds in air)"],["Rancidity","Oxidation of fats and oils — bad smell and taste; prevented by antioxidants, airtight packing, refrigeration and filling chip packets with nitrogen"],["Whitewashing","Slaked lime reacts slowly with CO₂ of air to form a shiny coat of calcium carbonate"],["Black-and-white photography","Silver bromide / chloride decompose in light"],["Catalyst","Changes the speed of a reaction without being used up — e.g. iron in the Haber process (ammonia), V₂O₅ in the contact process (H₂SO₄), nickel in hydrogenation of oils (vanaspati ghee)"],["Enzymes","Biological catalysts — e.g. zymase turns sugar into alcohol (fermentation)"],["Rate goes up with","Higher temperature, higher concentration, smaller pieces (more surface), a catalyst"]]},{"k":"ex","h":"Balance Fe + H₂O → Fe₃O₄ + H₂. Iron: 3 on the right, so take 3Fe. Oxygen: 4 on the right, so take 4H₂O. Hydrogen: now 8 on the left, so 4H₂. <b>3Fe + 4H₂O → Fe₃O₄ + 4H₂<\/b>."},{"k":"trick","h":"<b>OIL RIG<\/b>: Oxidation Is Loss (of electrons), Reduction Is Gain. Displacement order — the 'bully' metal higher in the reactivity series pushes out the one below: <b>Iron beats Copper<\/b>, so the blue copper sulphate turns green."},{"k":"trap","h":"<b>Photosynthesis is endothermic<\/b>; <b>respiration is exothermic<\/b> — they are opposites. A catalyst <b>speeds up<\/b> a reaction but is <b>not consumed<\/b> and does not change the products. Rusting needs <b>both<\/b> air and water. Rust is <b>hydrated<\/b> iron(III) oxide, not Fe₃O₄."}],"sum":["Chemical changes make new substances; a balanced equation has the same atoms on both sides.","Types: combination (CaO + H₂O), decomposition (CaCO₃ on heating), displacement (Fe + CuSO₄), double displacement (BaSO₄ precipitate), redox.","Oxidation is gain of oxygen or loss of electrons; reduction is the reverse (OIL RIG).","Respiration and burning are exothermic; photosynthesis and decomposition of limestone are endothermic.","Rust is hydrated iron(III) oxide; rancidity is oxidation of fats, stopped by antioxidants and nitrogen; catalysts speed up reactions without being used up."],"part":["Part 2 · Reactions and compounds","अभिक्रियाएँ और यौगिक"]},
{"id":"K7","g":"chem","heat":3,"title":"Acids, bases and salts","hi":"अम्ल, क्षार और लवण","blocks":[{"k":"hot","h":"One of the most asked chapters: <b>which acid is in which food<\/b> (vinegar, lemon, tamarind, curd, ant sting), the <b>pH<\/b> of blood, stomach and common things, <b>indicator colours<\/b>, <b>aqua regia<\/b>, and <b>what to put on an ant or bee sting<\/b>."},{"k":"story","h":"<p>Taste a lemon: it is <b>sour<\/b> — that is an <b>acid<\/b>. Touch soap between wet fingers: it feels <b>slippery<\/b> and tastes bitter — that is a <b>base<\/b>. Bases that dissolve in water are called <b>alkalis<\/b>.<\/p><p>Acids and bases are like two teams. An acid gives <b>H⁺ ions<\/b> in water; a base gives <b>OH⁻ ions<\/b>. When they meet, H⁺ and OH⁻ join to make water, and the rest of the two teams makes a <b>salt<\/b>. That is <b>neutralisation<\/b> — and it is why an antacid (a base) calms a burning stomach (too much hydrochloric acid).<\/p><p>To measure how acidic something is we use the <b>pH scale<\/b>, from 0 to 14, given by the Danish chemist <b>S. P. L. Sørensen<\/b>. pH 7 is neutral (pure water). Below 7 is acidic — the lower, the stronger. Above 7 is basic. Each step is ten times stronger than the next. Your blood stays at about <b>7.4<\/b>, and your stomach at about <b>1.5–2<\/b>.<\/p>","key":"Acid = sour, H⁺, pH below 7, turns blue litmus red; base = bitter, soapy, OH⁻, pH above 7, turns red litmus blue; acid + base → salt + water."},{"k":"table","title":"Acids in nature","head":["Source","Acid"],"rows":[["Vinegar","Acetic acid (ethanoic acid)"],["Lemon, orange (citrus)","Citric acid"],["Tamarind, grapes","Tartaric acid"],["Tomato, spinach","Oxalic acid"],["Curd, sour milk","Lactic acid"],["Apple","Malic acid"],["Ant sting, nettle leaf sting","Formic acid (methanoic acid)"],["Amla, citrus","Ascorbic acid (vitamin C)"],["Tea, coffee","Tannic acid"],["Stomach (gastric juice)","Hydrochloric acid"],["Urine","Uric acid"],["Soft drinks (cold drinks)","Carbonic acid (and phosphoric acid)"],["Rancid butter","Butyric acid"],["Proteins","Amino acids"],["Fats","Fatty acids such as stearic acid"]]},{"k":"table","title":"Indicators and their colours","head":["Indicator","In acid","In base"],"rows":[["Litmus (from lichens)","Blue → red","Red → blue"],["Phenolphthalein","Colourless","Pink"],["Methyl orange","Red","Yellow"],["Turmeric (haldi)","Stays yellow","Reddish brown"],["China rose (hibiscus)","Dark pink / magenta","Green"],["Universal indicator","Red–orange–yellow","Blue–violet"],["Olfactory (smell) indicators","Onion, vanilla, clove keep their smell in acid","Smell disappears in base (vanilla, onion)"]]},{"k":"table","title":"pH of common things (approximate)","head":["Substance","pH","Nature"],"rows":[["Gastric juice","1.5–2","Strongly acidic"],["Lemon juice","About 2–2.5","Acidic"],["Vinegar","About 2.5–3","Acidic"],["Soft drinks","About 3","Acidic"],["Tomato juice","About 4","Acidic"],["Acid rain","Below 5.6","Acidic"],["Milk","About 6.5–6.8","Slightly acidic"],["Saliva","About 6.5–7.5 (tooth decay starts below 5.5)","Near neutral"],["Pure water","7","Neutral"],["Human blood","7.35–7.45 (about 7.4)","Slightly basic"],["Sea water","About 8","Slightly basic"],["Baking soda solution","About 8.3","Basic"],["Milk of magnesia","About 10","Basic"],["Household ammonia","About 11","Basic"],["Sodium hydroxide (caustic soda)","About 13–14","Strongly basic"]]},{"k":"info","title":"The pH scale","html":"<figure class=\"fig wide\" style=\"--minw:600px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 260\" role=\"img\" aria-label=\"The pH scale with everyday substances\">\n  <rect x=\"20\" y=\"110\" width=\"43\" height=\"36\" fill=\"hsl(0,70%,48%)\"/><text x=\"41\" y=\"133\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" style=\"fill:#fff\">0<\/text><rect x=\"63\" y=\"110\" width=\"43\" height=\"36\" fill=\"hsl(19,70%,48%)\"/><text x=\"84\" y=\"133\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" style=\"fill:#fff\">1<\/text><rect x=\"106\" y=\"110\" width=\"43\" height=\"36\" fill=\"hsl(37,70%,48%)\"/><text x=\"127\" y=\"133\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" style=\"fill:#fff\">2<\/text><rect x=\"149\" y=\"110\" width=\"43\" height=\"36\" fill=\"hsl(56,70%,48%)\"/><text x=\"170\" y=\"133\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" style=\"fill:#fff\">3<\/text><rect x=\"192\" y=\"110\" width=\"43\" height=\"36\" fill=\"hsl(74,70%,48%)\"/><text x=\"213\" y=\"133\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" style=\"fill:#fff\">4<\/text><rect x=\"235\" y=\"110\" width=\"43\" height=\"36\" fill=\"hsl(93,70%,48%)\"/><text x=\"256\" y=\"133\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" style=\"fill:#fff\">5<\/text><rect x=\"278\" y=\"110\" width=\"43\" height=\"36\" fill=\"hsl(111,70%,48%)\"/><text x=\"299\" y=\"133\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" style=\"fill:#fff\">6<\/text><rect x=\"321\" y=\"110\" width=\"43\" height=\"36\" fill=\"hsl(130,70%,48%)\"/><text x=\"342\" y=\"133\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" style=\"fill:#fff\">7<\/text><rect x=\"364\" y=\"110\" width=\"43\" height=\"36\" fill=\"hsl(149,70%,48%)\"/><text x=\"385\" y=\"133\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" style=\"fill:#fff\">8<\/text><rect x=\"407\" y=\"110\" width=\"43\" height=\"36\" fill=\"hsl(167,70%,48%)\"/><text x=\"428\" y=\"133\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" style=\"fill:#fff\">9<\/text><rect x=\"450\" y=\"110\" width=\"43\" height=\"36\" fill=\"hsl(186,70%,48%)\"/><text x=\"471\" y=\"133\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" style=\"fill:#fff\">10<\/text><rect x=\"493\" y=\"110\" width=\"43\" height=\"36\" fill=\"hsl(204,70%,48%)\"/><text x=\"514\" y=\"133\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" style=\"fill:#fff\">11<\/text><rect x=\"536\" y=\"110\" width=\"43\" height=\"36\" fill=\"hsl(223,70%,48%)\"/><text x=\"557\" y=\"133\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" style=\"fill:#fff\">12<\/text><rect x=\"579\" y=\"110\" width=\"43\" height=\"36\" fill=\"hsl(241,70%,48%)\"/><text x=\"600\" y=\"133\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" style=\"fill:#fff\">13<\/text><rect x=\"622\" y=\"110\" width=\"43\" height=\"36\" fill=\"hsl(260,70%,48%)\"/><text x=\"643\" y=\"133\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"800\" style=\"fill:#fff\">14<\/text>\n  <line x1=\"105.5\" y1=\"110\" x2=\"105.5\" y2=\"100\" stroke=\"hsl(28,70%,48%)\"/><text x=\"105.5\" y=\"96\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" style=\"fill:hsl(28,70%,48%)\">Gastric juice<\/text><line x1=\"127\" y1=\"146\" x2=\"127\" y2=\"159\" stroke=\"hsl(37,70%,48%)\"/><text x=\"127\" y=\"169\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" style=\"fill:hsl(37,70%,48%)\">Lemon juice<\/text><line x1=\"148.5\" y1=\"110\" x2=\"148.5\" y2=\"82\" stroke=\"hsl(46,70%,48%)\"/><text x=\"148.5\" y=\"78\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" style=\"fill:hsl(46,70%,48%)\">Vinegar<\/text><line x1=\"170\" y1=\"146\" x2=\"170\" y2=\"177\" stroke=\"hsl(56,70%,48%)\"/><text x=\"170\" y=\"187\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" style=\"fill:hsl(56,70%,48%)\">Soft drinks<\/text><line x1=\"213\" y1=\"110\" x2=\"213\" y2=\"100\" stroke=\"hsl(74,70%,48%)\"/><text x=\"213\" y=\"96\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" style=\"fill:hsl(74,70%,48%)\">Tomato juice<\/text><line x1=\"281.79999999999995\" y1=\"146\" x2=\"281.79999999999995\" y2=\"159\" stroke=\"hsl(104,70%,48%)\"/><text x=\"281.79999999999995\" y=\"169\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" style=\"fill:hsl(104,70%,48%)\">Acid rain<\/text><line x1=\"320.5\" y1=\"110\" x2=\"320.5\" y2=\"82\" stroke=\"hsl(121,70%,48%)\"/><text x=\"320.5\" y=\"78\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" style=\"fill:hsl(121,70%,48%)\">Milk<\/text><line x1=\"320.5\" y1=\"146\" x2=\"320.5\" y2=\"177\" stroke=\"hsl(121,70%,48%)\"/><text x=\"320.5\" y=\"187\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" style=\"fill:hsl(121,70%,48%)\">Saliva<\/text><line x1=\"342\" y1=\"110\" x2=\"342\" y2=\"100\" stroke=\"hsl(130,70%,48%)\"/><text x=\"342\" y=\"96\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" style=\"fill:hsl(130,70%,48%)\">Pure water<\/text><line x1=\"357.05\" y1=\"146\" x2=\"357.05\" y2=\"159\" stroke=\"hsl(137,70%,48%)\"/><text x=\"357.05\" y=\"169\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" style=\"fill:hsl(137,70%,48%)\">Human blood<\/text><line x1=\"385\" y1=\"110\" x2=\"385\" y2=\"82\" stroke=\"hsl(149,70%,48%)\"/><text x=\"385\" y=\"78\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" style=\"fill:hsl(149,70%,48%)\">Sea water<\/text><line x1=\"397.90000000000003\" y1=\"146\" x2=\"397.90000000000003\" y2=\"177\" stroke=\"hsl(154,70%,48%)\"/><text x=\"397.90000000000003\" y=\"187\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" style=\"fill:hsl(154,70%,48%)\">Baking soda solution<\/text><line x1=\"471\" y1=\"110\" x2=\"471\" y2=\"100\" stroke=\"hsl(186,70%,48%)\"/><text x=\"471\" y=\"96\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" style=\"fill:hsl(186,70%,48%)\">Milk of magnesia<\/text><line x1=\"514\" y1=\"146\" x2=\"514\" y2=\"159\" stroke=\"hsl(204,70%,48%)\"/><text x=\"514\" y=\"169\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" style=\"fill:hsl(204,70%,48%)\">Household ammonia<\/text><line x1=\"600\" y1=\"110\" x2=\"600\" y2=\"82\" stroke=\"hsl(241,70%,48%)\"/><text x=\"600\" y=\"78\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" style=\"fill:hsl(241,70%,48%)\">Sodium hydroxide<\/text>\n  <text x=\"20\" y=\"240\" font-size=\"13\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:#c0392b\">← acidic<\/text><text x=\"340\" y=\"240\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:#2f8f4e\">neutral<\/text><text x=\"660\" y=\"240\" font-size=\"13\" font-weight=\"700\" text-anchor=\"end\" style=\"fill:#7d4fb5\">basic →<\/text><\/svg><\/figure>","cap":"Below 7 is acidic, 7 is neutral, above 7 basic (alkaline). Each step is ten times stronger: pH 3 is ten times more acidic than pH 4. Rain below 5.6 is acid rain."},{"k":"facts","title":"Acids and bases at work","rows":[["Strong acids","Hydrochloric (HCl), sulphuric (H₂SO₄), nitric (HNO₃)"],["Weak acids","Acetic, citric, carbonic, formic"],["King of chemicals","Sulphuric acid (H₂SO₄); old name 'oil of vitriol'"],["Aqua regia","3 parts concentrated HCl + 1 part concentrated HNO₃; dissolves gold and platinum"],["Diluting an acid","Always add acid to water slowly, never water to acid — the heat can splash it"],["Acid + metal","Salt + hydrogen gas (burns with a pop)"],["Acid + carbonate / bicarbonate","Salt + water + CO₂ (turns lime water milky)"],["Common bases","NaOH (caustic soda), KOH (caustic potash), Ca(OH)₂ (slaked lime), Mg(OH)₂ (milk of magnesia), NH₄OH"],["Antacids","Milk of magnesia, baking soda, aluminium hydroxide — neutralise excess stomach acid"],["Ant or bee sting (acidic)","Rub baking soda (a mild base)"],["Wasp sting (alkaline)","Apply vinegar (a mild acid)"],["Acidic soil","Add lime (quicklime, slaked lime) or chalk"],["Basic soil","Add organic matter (compost) or gypsum"],["Tooth decay","Starts when mouth pH drops below 5.5; toothpaste is basic"]]},{"k":"trick","h":"Natural acids: <b>“Vinegar Acts, Lemon Cites, Tamarind Tarts, Tomato Oxes, Curd Lacks, Apple Mals, Ant Forms”<\/b> — Acetic, Citric, Tartaric, Oxalic, Lactic, Malic, Formic. Indicators: <b>Phenolphthalein turns Pink in base<\/b> (P-P-P)."},{"k":"trap","h":"Blood is <b>slightly basic<\/b> (about 7.4), not neutral. <b>Milk is slightly acidic<\/b>. An <b>ant sting<\/b> is acidic (formic acid) → baking soda; a <b>wasp sting<\/b> is basic → vinegar. Aqua regia is <b>3 HCl : 1 HNO₃<\/b> — not the other way round. All alkalis are bases, but not all bases are alkalis (only the soluble ones)."}],"sum":["Acids are sour, give H⁺ and have pH below 7; bases are bitter and soapy, give OH⁻ and have pH above 7.","Vinegar has acetic acid, lemon citric, tamarind tartaric, tomato oxalic, curd lactic, ant sting formic, stomach hydrochloric acid.","Litmus turns red in acid and blue in base; phenolphthalein is colourless in acid and pink in base; turmeric turns reddish brown in base.","pH: stomach about 2, pure water 7, blood about 7.4; the pH scale was given by Sørensen.","Aqua regia (3 HCl : 1 HNO₃) dissolves gold; antacids like milk of magnesia neutralise stomach acid."],"part":["Part 2 · Reactions and compounds","अभिक्रियाएँ और यौगिक"]},
{"id":"K8","g":"chem","heat":3,"title":"Metals and non-metals","hi":"धातुएँ और अधातुएँ","blocks":[{"k":"hot","h":"Asked often: the <b>reactivity series<\/b>, <b>exceptions<\/b> (mercury is liquid, sodium is soft, graphite conducts, iodine shines), <b>which metal is kept in kerosene<\/b>, <b>galvanisation<\/b>, <b>amphoteric oxides<\/b> and the <b>most malleable / best conducting<\/b> metal."},{"k":"story","h":"<p>Think of the jewellery shop and the gas station. <b>Metals<\/b> — gold, silver, copper, iron — are shiny, can be beaten into sheets (<b>malleable<\/b>), drawn into wires (<b>ductile<\/b>), ring when struck (<b>sonorous<\/b>) and carry heat and electricity. <b>Non-metals<\/b> — oxygen, carbon, sulphur, chlorine — are mostly dull, brittle if solid, and poor conductors.<\/p><p>But chemistry loves exceptions, and so do examiners: <b>mercury<\/b> is a liquid metal, <b>sodium<\/b> and <b>potassium<\/b> are so soft you can cut them with a knife, <b>diamond<\/b> (a non-metal) is the hardest natural substance, <b>graphite<\/b> (a non-metal) conducts electricity, and <b>iodine<\/b> is a non-metal with a shine.<\/p><p>Metals also differ in how eagerly they react. Potassium and sodium catch fire in water, so they are stored under <b>kerosene<\/b>; gold and platinum hardly react at all, which is why old gold coins still shine. Ranking them gives the <b>reactivity series<\/b> — the key to which metal pushes out which.<\/p>","key":"Metals: shiny, malleable, ductile, conductors, form basic oxides; non-metals: dull, brittle, poor conductors, form acidic oxides — remember the exceptions."},{"k":"table","title":"Metals vs non-metals","head":["Property","Metals","Non-metals"],"rows":[["State","Solid (except mercury)","Solid, liquid (bromine) or gas"],["Lustre","Shiny","Dull (except iodine, graphite, diamond)"],["Malleability / ductility","Yes — gold is the most malleable and ductile","No — brittle"],["Conductivity","Good conductors (silver best, then copper); lead and mercury are poor","Poor (except graphite)"],["Hardness","Mostly hard (sodium, potassium soft)","Varies (diamond hardest)"],["Oxides","Basic (e.g. Na₂O, MgO); some amphoteric (Al₂O₃, ZnO)","Acidic (CO₂, SO₂) or neutral (CO, N₂O, H₂O)"],["Ions formed","Positive (cations), by losing electrons","Negative (anions), by gaining electrons"],["With dilute acids","Many give hydrogen","Do not give hydrogen"]]},{"k":"facts","title":"The reactivity series (most → least reactive)","rows":[["Order","K > Na > Ca > Mg > Al > Zn > Fe > Pb > [H] > Cu > Hg > Ag > Au > Pt"],["Above hydrogen","Give hydrogen gas with dilute acids"],["Below hydrogen","Copper, mercury, silver, gold, platinum do not give hydrogen with dilute acids"],["With cold water","K, Na react violently (hydrogen catches fire); Ca reacts less violently"],["With hot water / steam","Mg with hot water; Al, Zn, Fe with steam"],["Kept in kerosene","Sodium and potassium (they react with air and moisture)"],["Kept in water","White phosphorus (catches fire in air)"],["Noble metals","Gold, silver, platinum — resist corrosion"],["Amphoteric oxides","Aluminium oxide and zinc oxide react with both acids and bases"],["Thermite reaction","Fe₂O₃ + 2Al → 2Fe + Al₂O₃ + great heat; used to weld railway tracks"],["Nitric acid and metals","Usually gives no hydrogen (it oxidises the hydrogen to water) — except Mg and Mn with very dilute HNO₃"]]},{"k":"info","title":"The reactivity series","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 150\" role=\"img\" aria-label=\"The reactivity series\">\n  <rect x=\"12\" y=\"30\" width=\"43\" height=\"80\" rx=\"6\" fill=\"hsl(8,70%,45%)\"/><text x=\"33\" y=\"70\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" style=\"fill:#fff\">K<\/text><rect x=\"59\" y=\"34\" width=\"43\" height=\"76\" rx=\"6\" fill=\"hsl(24,70%,46%)\"/><text x=\"80\" y=\"72\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" style=\"fill:#fff\">Na<\/text><rect x=\"106\" y=\"38\" width=\"43\" height=\"72\" rx=\"6\" fill=\"hsl(40,70%,47%)\"/><text x=\"127\" y=\"74\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" style=\"fill:#fff\">Ca<\/text><rect x=\"153\" y=\"42\" width=\"43\" height=\"68\" rx=\"6\" fill=\"hsl(56,70%,48%)\"/><text x=\"174\" y=\"76\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" style=\"fill:#fff\">Mg<\/text><rect x=\"200\" y=\"46\" width=\"43\" height=\"64\" rx=\"6\" fill=\"hsl(72,70%,49%)\"/><text x=\"221\" y=\"78\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" style=\"fill:#fff\">Al<\/text><rect x=\"247\" y=\"50\" width=\"43\" height=\"60\" rx=\"6\" fill=\"hsl(88,70%,50%)\"/><text x=\"268\" y=\"80\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" style=\"fill:#fff\">Zn<\/text><rect x=\"294\" y=\"54\" width=\"43\" height=\"56\" rx=\"6\" fill=\"hsl(104,70%,51%)\"/><text x=\"315\" y=\"82\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" style=\"fill:#fff\">Fe<\/text><rect x=\"341\" y=\"58\" width=\"43\" height=\"52\" rx=\"6\" fill=\"hsl(120,70%,52%)\"/><text x=\"362\" y=\"84\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" style=\"fill:#fff\">Pb<\/text><rect x=\"388\" y=\"62\" width=\"43\" height=\"48\" rx=\"6\" fill=\"#7a7a7a\"/><text x=\"409\" y=\"86\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" style=\"fill:#fff\">H<\/text><rect x=\"435\" y=\"66\" width=\"43\" height=\"44\" rx=\"6\" fill=\"hsl(152,70%,54%)\"/><text x=\"456\" y=\"88\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" style=\"fill:#fff\">Cu<\/text><rect x=\"482\" y=\"70\" width=\"43\" height=\"40\" rx=\"6\" fill=\"hsl(168,70%,55%)\"/><text x=\"503\" y=\"90\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" style=\"fill:#fff\">Hg<\/text><rect x=\"529\" y=\"74\" width=\"43\" height=\"36\" rx=\"6\" fill=\"hsl(184,70%,56%)\"/><text x=\"550\" y=\"92\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" style=\"fill:#fff\">Ag<\/text><rect x=\"576\" y=\"78\" width=\"43\" height=\"32\" rx=\"6\" fill=\"hsl(200,70%,57%)\"/><text x=\"597\" y=\"94\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" style=\"fill:#fff\">Au<\/text><rect x=\"623\" y=\"82\" width=\"43\" height=\"28\" rx=\"6\" fill=\"hsl(216,70%,58%)\"/><text x=\"644\" y=\"96\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"800\" style=\"fill:#fff\">Pt<\/text>\n  <text x=\"12\" y=\"20\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"start\" style=\"fill:#c0392b\">most reactive ←<\/text><text x=\"668\" y=\"20\" font-size=\"11.5\" font-weight=\"700\" text-anchor=\"end\" style=\"fill:#7d4fb5\">→ least reactive (noble)<\/text>\n  <text x=\"12\" y=\"140\" font-size=\"10.5\" class=\"mut\">Metals above hydrogen push it out of dilute acids; a metal displaces any metal below it from its salt.<\/text><\/svg><\/figure>","cap":"Potassium and sodium are so reactive they are kept under kerosene. Gold and platinum hardly react at all."},{"k":"table","title":"Preventing corrosion","head":["Method","How","Example"],"rows":[["Galvanisation","Coating iron with zinc","Iron sheets, buckets, pipes — zinc protects even if scratched"],["Tinning","Coating with tin","Tin cans for food"],["Electroplating","Thin layer of a metal by electrolysis","Chromium on bike parts, silver on jewellery"],["Alloying","Mixing with other metals","Stainless steel = iron + chromium + nickel"],["Painting, oiling, greasing","Keeps out air and water","Bridges, machine parts"],["Anodising","Thick oxide layer on aluminium","Aluminium utensils and window frames"],["Sacrificial protection","A more reactive metal (Mg, Zn) corrodes instead","Ship hulls, underground pipes"]]},{"k":"facts","title":"Uses and records","rows":[["Best conductor","Silver; copper is used in wires because it is cheaper"],["Most malleable and ductile","Gold (then silver); 1 g of gold can be drawn into a wire about 2 km long"],["Lightest metal","Lithium"],["Hardest metal","Chromium"],["Aluminium foil","Wrapping food; aluminium is light and resists corrosion"],["Tungsten","Filaments of bulbs (very high melting point)"],["Mercury","Thermometers, barometers"],["Lead","Storage batteries, radiation shields"],["Sulphur","Vulcanising rubber, gunpowder, making sulphuric acid"],["Phosphorus","Matchsticks (red phosphorus on the box), fertilisers"],["Chlorine","Disinfecting water, bleaching, PVC"],["Iodine","Antiseptic (tincture of iodine), iodised salt against goitre"],["Silicon","Computer chips, solar cells"],["Helium","Balloons, deep-sea diving gas mixtures"]]},{"k":"trick","h":"Reactivity series — <b>“Please Stop Calling Me A Zebra, I Like Her Calling Me A Smart Goat Pal”<\/b>: K, Na, Ca, Mg, Al, Zn, Fe, Pb, H, Cu, Hg, Ag, Au, Pt."},{"k":"trap","h":"<b>Galvanisation<\/b> = zinc coating; <b>tinning<\/b> = tin coating — do not swap. <b>Copper does not give hydrogen<\/b> with dilute acids. Silver is the <b>best<\/b> conductor, copper is the <b>most used<\/b>. Sodium is stored in <b>kerosene<\/b>, white phosphorus in <b>water<\/b>. Lead and mercury are <b>poor<\/b> conductors for metals."}],"sum":["Metals are shiny, malleable, ductile and good conductors; non-metals are dull, brittle and poor conductors.","Exceptions: mercury is a liquid metal, sodium and potassium are soft, graphite conducts, diamond is hardest, iodine is lustrous.","Reactivity series: K Na Ca Mg Al Zn Fe Pb H Cu Hg Ag Au Pt; metals above hydrogen give H₂ with dilute acids.","Sodium and potassium are kept in kerosene; white phosphorus in water.","Galvanisation is a zinc coating on iron; Al₂O₃ and ZnO are amphoteric; the thermite reaction welds railway tracks."],"part":["Part 2 · Reactions and compounds","अभिक्रियाएँ और यौगिक"]},
{"id":"K9","g":"chem","heat":3,"title":"Common names and formulas of compounds","hi":"यौगिकों के सामान्य नाम और सूत्र","blocks":[{"k":"hot","h":"Pure recall and very frequent: <b>baking soda, washing soda, bleaching powder, plaster of Paris, gypsum<\/b> — their formulas and uses — plus the <b>vitriols<\/b>, <b>laughing gas<\/b>, <b>marsh gas<\/b>, <b>lunar caustic<\/b> and <b>quicklime vs slaked lime<\/b>."},{"k":"story","h":"<p>Every kitchen and hospital in India uses a few chemicals by their everyday names. The <b>baking soda<\/b> in dhokla and the <b>washing soda<\/b> in the dhobi's tub are both sodium compounds, but they are not the same. The <b>plaster<\/b> on a broken arm and the <b>chalk<\/b> on a blackboard both come from calcium.<\/p><p>Many of these come from one simple starting point: <b>common salt<\/b>. Pass electricity through salty water (brine) — the <b>chlor-alkali process<\/b> — and you get <b>caustic soda<\/b>, <b>chlorine<\/b> and <b>hydrogen<\/b>. Chlorine plus slaked lime gives <b>bleaching powder<\/b>. Salt with ammonia and CO₂ gives <b>baking soda<\/b>, and heating that gives <b>washing soda<\/b>.<\/p><p>Learn this lesson as a table of pairs — common name ↔ formula ↔ one use — and you have some of the easiest marks in the paper. The Lab tab has a game for exactly this.<\/p>","key":"Baking soda NaHCO₃, washing soda Na₂CO₃·10H₂O, bleaching powder CaOCl₂, plaster of Paris CaSO₄·½H₂O, gypsum CaSO₄·2H₂O."},{"k":"table","title":"The big five from common salt and lime","head":["Common name","Chemical name","Formula","Main uses"],"rows":[["Baking soda","Sodium hydrogen carbonate (sodium bicarbonate)","NaHCO₃","Making cakes and dhokla rise (releases CO₂), antacid, soda-acid fire extinguishers"],["Washing soda","Sodium carbonate decahydrate","Na₂CO₃·10H₂O","Cleaning, removing permanent hardness of water, making glass, soap and paper"],["Bleaching powder","Calcium oxychloride (calcium hypochlorite)","CaOCl₂","Disinfecting drinking water, bleaching cotton and linen, oxidising agent"],["Plaster of Paris","Calcium sulphate hemihydrate","CaSO₄·½H₂O","Plaster for fractures, toys, statues, smooth walls; sets hard with water (turns back into gypsum)"],["Gypsum","Calcium sulphate dihydrate","CaSO₄·2H₂O","Making plaster of Paris and cement (slows its setting), fertiliser for alkaline soil"]]},{"k":"table","title":"More common names","head":["Common name","Formula","Chemical name / note"],"rows":[["Common salt / rock salt","NaCl","Sodium chloride"],["Caustic soda","NaOH","Sodium hydroxide"],["Caustic potash","KOH","Potassium hydroxide"],["Quicklime","CaO","Calcium oxide"],["Slaked lime / lime water","Ca(OH)₂","Calcium hydroxide (whitewash)"],["Limestone, marble, chalk","CaCO₃","Calcium carbonate"],["Blue vitriol","CuSO₄·5H₂O","Copper sulphate (fungicide, Bordeaux mixture)"],["Green vitriol","FeSO₄·7H₂O","Ferrous sulphate"],["White vitriol","ZnSO₄·7H₂O","Zinc sulphate"],["Oil of vitriol","H₂SO₄","Sulphuric acid"],["Epsom salt","MgSO₄·7H₂O","Magnesium sulphate (laxative)"],["Glauber's salt","Na₂SO₄·10H₂O","Sodium sulphate"],["Potash alum (phitkari)","K₂SO₄·Al₂(SO₄)₃·24H₂O","Potassium aluminium sulphate — purifies water, stops bleeding after shaving"],["Laughing gas","N₂O","Nitrous oxide (mild anaesthetic)"],["Marsh gas","CH₄","Methane (main part of natural gas, CNG and biogas)"],["Dry ice","CO₂ (solid)","Carbon dioxide"],["Heavy water","D₂O","Deuterium oxide"],["Lunar caustic","AgNO₃","Silver nitrate — the indelible ink on your finger at elections"],["Sal ammoniac","NH₄Cl","Ammonium chloride (dry cells)"],["Saltpetre (nitre)","KNO₃","Potassium nitrate (gunpowder)"],["Chile saltpetre","NaNO₃","Sodium nitrate"],["Hypo","Na₂S₂O₃·5H₂O","Sodium thiosulphate (photography fixer)"],["Borax","Na₂B₄O₇·10H₂O","Sodium tetraborate"],["Muriatic acid","HCl","Hydrochloric acid"],["Aqua fortis","HNO₃","Nitric acid"],["Milk of magnesia","Mg(OH)₂","Magnesium hydroxide (antacid)"],["Calomel","Hg₂Cl₂","Mercurous chloride"],["Corrosive sublimate","HgCl₂","Mercuric chloride"],["Red lead (sindoor)","Pb₃O₄","Lead tetroxide"],["Philosopher's wool","ZnO","Zinc oxide"],["Potassium permanganate","KMnO₄","Pink; disinfects water and wells"],["Hydrogen peroxide","H₂O₂","Bleach for hair, antiseptic"],["Silver iodide","AgI","Artificial rain (cloud seeding)"],["Chloroform","CHCl₃","Old anaesthetic; stored in dark bottles"],["Washing powder base","Sodium alkylbenzene sulphonate","A detergent"]]},{"k":"facts","title":"How they are made","rows":[["Chlor-alkali process","Electrolysis of brine → NaOH (near cathode), Cl₂ at the anode, H₂ at the cathode"],["Bleaching powder","Chlorine passed over dry slaked lime: Ca(OH)₂ + Cl₂ → CaOCl₂ + H₂O"],["Baking soda","Solvay (ammonia-soda) process: NaCl + H₂O + CO₂ + NH₃ → NH₄Cl + NaHCO₃"],["Washing soda","Heat baking soda → Na₂CO₃, then crystallise with water"],["Plaster of Paris","Heat gypsum at about 373 K (100 °C): it loses 1½ molecules of water"],["Baking powder","Baking soda + a mild acid such as tartaric acid (so no bitter taste is left)"],["Water of crystallisation","Fixed water molecules in a crystal — 5 in blue vitriol, 10 in washing soda, 2 in gypsum, ½ in PoP"]]},{"k":"trick","h":"<b>Baking soda has H<\/b> (NaHCO₃ — <i>H for 'Halwai'<\/i>); <b>washing soda has 10 waters<\/b> (it washes, so it is wet). <b>Plaster is half-hydrated, gypsum is two-hydrated<\/b>: PoP ½, Gypsum 2. Vitriols by colour: <b>Blue = Copper, Green = Iron (ferrous), White = Zinc<\/b>."},{"k":"trap","h":"Baking soda is <b>NaHCO₃<\/b>; washing soda is <b>Na₂CO₃·10H₂O<\/b> — the most swapped pair. Bleaching powder is <b>CaOCl₂<\/b> (calcium, not sodium). <b>Quicklime CaO<\/b>, <b>slaked lime Ca(OH)₂<\/b>, <b>limestone CaCO₃<\/b>. Laughing gas is <b>N₂O<\/b>, not NO₂. Election ink is <b>silver nitrate<\/b>."}],"sum":["Baking soda NaHCO₃ (cakes, antacid, fire extinguisher); washing soda Na₂CO₃·10H₂O (removes permanent hardness).","Bleaching powder CaOCl₂ disinfects water; plaster of Paris CaSO₄·½H₂O comes from gypsum CaSO₄·2H₂O.","Blue vitriol is copper sulphate, green vitriol ferrous sulphate, white vitriol zinc sulphate; oil of vitriol is sulphuric acid.","Laughing gas N₂O, marsh gas CH₄, lunar caustic AgNO₃ (election ink), dry ice solid CO₂.","Quicklime CaO, slaked lime Ca(OH)₂, limestone CaCO₃; the chlor-alkali process gives NaOH, Cl₂ and H₂ from brine."],"part":["Part 2 · Reactions and compounds","अभिक्रियाएँ और यौगिक"]},
{"id":"K10","g":"chem","heat":2,"title":"Ores, metallurgy and alloys","hi":"अयस्क, धातुकर्म और मिश्रधातुएँ","blocks":[{"k":"hot","h":"Steady favourites: <b>ore ↔ metal<\/b> pairs (bauxite, haematite, galena, cinnabar, cassiterite, zinc blende), <b>froth flotation<\/b>, <b>roasting vs calcination<\/b>, <b>blast furnace<\/b>, and the <b>composition of alloys<\/b> (brass, bronze, German silver, solder, stainless steel)."},{"k":"story","h":"<p>Metals rarely lie around pure. Most are locked in rocks as compounds — oxides, sulphides, carbonates. A rock that holds a metal is a <b>mineral<\/b>; a mineral from which the metal can be taken out <b>cheaply<\/b> is an <b>ore<\/b>. So every ore is a mineral, but not every mineral is an ore.<\/p><p>Getting the metal out is <b>metallurgy<\/b>, and it runs like a factory line. First <b>concentrate<\/b> the ore — wash away earth and rock (gangue), or froth it up with pine oil so sulphide particles float. Then <b>roast<\/b> sulphide ores in air, or <b>calcine<\/b> carbonate ores with little air, to get an oxide. Then <b>reduce<\/b> the oxide: with carbon (coke) for middle metals like iron and zinc, or with electricity for very reactive ones like sodium and aluminium. Finally <b>refine<\/b> it to make it pure.<\/p><p>Pure metals are often too soft or rust too easily, so we mix them into <b>alloys<\/b>: copper plus zinc gives golden <b>brass<\/b>, iron plus chromium and nickel gives rust-free <b>stainless steel<\/b>, and 22-carat jewellery is gold hardened with a little copper or silver.<\/p>","key":"Ore = mineral worth mining; concentrate → roast/calcine → reduce → refine; alloys make metals stronger or rust-proof."},{"k":"table","title":"Metals and their ores","head":["Metal","Main ores","Formula / note"],"rows":[["Aluminium","Bauxite; cryolite; corundum","Al₂O₃·2H₂O; Na₃AlF₆; Al₂O₃"],["Iron","Haematite; magnetite (richest); limonite; siderite; iron pyrites","Fe₂O₃; Fe₃O₄; 2Fe₂O₃·3H₂O; FeCO₃; FeS₂ ('fool's gold')"],["Copper","Copper pyrites (chalcopyrite); copper glance; cuprite; malachite","CuFeS₂; Cu₂S; Cu₂O; CuCO₃·Cu(OH)₂"],["Zinc","Zinc blende; calamine; zincite","ZnS; ZnCO₃; ZnO"],["Lead","Galena","PbS"],["Mercury","Cinnabar","HgS"],["Tin","Cassiterite (tinstone)","SnO₂"],["Silver","Argentite; horn silver","Ag₂S; AgCl"],["Sodium","Rock salt; Chile saltpetre; borax","NaCl; NaNO₃; Na₂B₄O₇·10H₂O"],["Potassium","Carnallite; sylvite; saltpetre","KCl·MgCl₂·6H₂O; KCl; KNO₃"],["Magnesium","Magnesite; dolomite; carnallite","MgCO₃; CaCO₃·MgCO₃"],["Calcium","Limestone; dolomite; gypsum; fluorspar","CaCO₃; CaSO₄·2H₂O; CaF₂"],["Manganese","Pyrolusite","MnO₂"],["Chromium","Chromite","FeCr₂O₄"],["Titanium","Ilmenite; rutile","FeTiO₃; TiO₂"],["Uranium","Pitchblende (uraninite)","U₃O₈"],["Thorium","Monazite sand (Kerala coast)","A phosphate mineral"],["Gold, platinum","Found free (native) in nature","Unreactive"]]},{"k":"photos","title":"Ores in pictures","items":[["Bauxite","Bauxite","Aluminium"],["Hematite","Hematite","Iron"],["Magnetite","Magnetite","Iron"],["Galena","Galena","Lead"],["Cinnabar","Cinnabar","Mercury"],["Chalcopyrite","Chalcopyrite","Copper"],["Sphalerite","Sphalerite","Zinc (zinc blende)"],["Cassiterite","Cassiterite","Tin"]]},{"k":"table","title":"Steps of metallurgy","head":["Step","What happens","Example"],"rows":[["Concentration (ore dressing)","Remove gangue (earthy impurities)","Gravity separation (washing), magnetic separation, leaching (bauxite, gold)"],["Froth flotation","Ore particles stick to pine-oil froth and float; gangue sinks","Sulphide ores — galena, zinc blende, copper pyrites"],["Roasting","Heat strongly in excess air","Sulphide ores: 2ZnS + 3O₂ → 2ZnO + 2SO₂"],["Calcination","Heat in limited or no air","Carbonate ores: ZnCO₃ → ZnO + CO₂"],["Reduction by carbon (smelting)","Oxide heated with coke","Iron in the blast furnace; zinc"],["Electrolytic reduction","Molten compound split by electricity","Na, K, Ca, Mg, Al — too reactive for carbon"],["Hall–Héroult process","Alu

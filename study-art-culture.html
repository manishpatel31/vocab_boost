{"id":"L26","g":"art","heat":3,"title":"Classical dance & music","hi":"शास्त्रीय नृत्य एवं संगीत","blocks":[{"k":"hot","h":"A guaranteed 1–2 marks. Only two things matter: <b>dance ↔ state<\/b> and <b>exponent ↔ dance<\/b>; then gharanas and instruments."},{"k":"story","h":"<p>Indian classical dance and music grew over many centuries in temples and royal courts. The oldest guide to both is the <b>Natyashastra<\/b> of Bharata Muni, which describes the nine rasas (moods) a performance should create. Today eight dances are officially classical. What the exam really asks is which dance belongs to which state, and who its famous dancers are.<\/p><p>So build a mental map of India. Start in the south: Tamil Nadu has <b>Bharatanatyam<\/b>, the oldest; Kerala has two, Kathakali (men, heavy make-up) and Mohiniyattam (women); Andhra Pradesh has Kuchipudi. Move up the east coast to Odisha for Odissi, then to the north-east: Manipur for Manipuri, and Assam for Sattriya, the newest, added in 2000. Finally go to Uttar Pradesh for <b>Kathak<\/b>, the only one shaped by the Mughal court. Three dances carry their place in their name: Odissi, Manipuri and Kuchipudi.<\/p><p>Music splits north and south in the same way. <b>Hindustani<\/b> music in the north grew with Persian contact, with forms like khayal and instruments like sitar and tabla. <b>Carnatic<\/b> music in the south stayed closer to the old Sanskrit tradition, with its trinity of composers led by Tyagaraja. For musicians, learn one instrument per famous name.<\/p>","key":"Picture the map: four dances in the south, three in the east and north-east, and Kathak in the north, then split music into Hindustani and Carnatic."},{"k":"photos","title":"In pictures","items":[["Bharatanatyam","Bharatanatyam","Tamil Nadu"],["Kathak","Kathak","Uttar Pradesh"],["Kathakali","Kathakali","Kerala"],["Odissi","Odissi","Odisha"],["Manipuri_dance","Manipuri","Manipur"],["Sattriya","Sattriya","Assam"],["Tansen","Tansen","Akbar's court"],["M._S._Subbulakshmi","M. S. Subbulakshmi","Carnatic"]]},{"k":"table","title":"Eight classical dances","head":["Dance","State","Famous exponents · note"],"rows":[["<b>Bharatanatyam<\/b>","Tamil Nadu","Rukmini Devi Arundale, Balasaraswati, Yamini Krishnamurthy, Padma Subrahmanyam. Oldest; from the Devadasi tradition; \"fire dance\""],["<b>Kathak<\/b>","Uttar Pradesh","Birju Maharaj, Sitara Devi, Shambhu Maharaj, Lachhu Maharaj. The only classical dance with a <b>Muslim/Mughal influence<\/b>; gharanas <b>Lucknow, Jaipur, Banaras<\/b>"],["<b>Kathakali<\/b>","Kerala","Kalamandalam Gopi, Kavungal Chathunni Panicker, Guru Kunchu Kurup. All-male, elaborate make-up (<i>chutti<\/i>); \"story-play\""],["<b>Kuchipudi<\/b>","Andhra Pradesh","Raja &amp; Radha Reddy, Yamini Krishnamurthy, Vempati Chinna Satyam. Dancing on the rim of a brass plate (<i>Tarangam<\/i>)"],["<b>Odissi<\/b>","Odisha","Kelucharan Mohapatra, Sonal Mansingh, Sanjukta Panigrahi. <b>Tribhanga<\/b> posture; linked to the Jagannath temple and the <i>Maharis<\/i>"],["<b>Manipuri<\/b>","Manipur","Jhaveri sisters, Guru Bipin Singh, Nirmala Mehta. <b>Ras Leela<\/b>; gentle, no sharp foot-strikes; <b>Sankirtana &amp; Pung Cholom<\/b>"],["<b>Mohiniyattam<\/b>","Kerala","Sunanda Nair, Kalamandalam Kalyanikutty Amma, Bharati Shivaji. Solo, by women; \"dance of the enchantress\""],["<b>Sattriya<\/b>","Assam","Began with <b>Shankaradeva<\/b>; performed in <i>sattras<\/i> (monasteries); recognised as classical in <b>2000<\/b>"]]},{"k":"mapfig","title":"The classical dances on the map","pins":[["Bharatanatyam",79.14,10.79,"Tamil Nadu"],["Kathak",80.95,26.85,"Uttar Pradesh"],["Kathakali",76.29,10.74,"Kerala","l"],["Mohiniyattam",76.95,8.52,"Kerala","l"],["Kuchipudi",80.95,16.27,"Andhra Pradesh"],["Odissi",85.82,20.29,"Odisha"],["Manipuri",93.94,24.81,"Manipur","l"],["Sattriya",94.22,26.95,"Assam","l"]],"cap":"Two from Kerala, one each from six other states; only Kathak is from the north."},{"k":"trick","h":"<b>Two from Kerala<\/b>: <b>Ka<\/b>thakali (men) and <b>Mo<\/b>hiniyattam (women) — <span class=\"mn\">Kerala = Ka + Mo<\/span>.<br><b>Dance ↔ state<\/b> by first letters: <b>Bh<\/b>aratanatyam–Tamil Nadu, <b>Kath<\/b>ak–UP, <b>Kuch<\/b>ipudi–Andhra, <b>O<\/b>dissi–<b>O<\/b>disha, <b>Mani<\/b>puri–<b>Mani<\/b>pur, <b>Satt<\/b>riya–Assam. Three are self-naming (Odissi, Manipuri, and Kuchipudi is a village in Andhra)."},{"k":"facts","title":"Dance theory","rows":[["<b>Natyashastra<\/b>","By <b>Bharata Muni<\/b> — the oldest text on dance/drama; called the <b>fifth Veda<\/b>"],["<b>Abhinaya Darpana<\/b>","By <b>Nandikeshvara<\/b>"],["Nine rasas (Navarasa)","Shringara, Hasya, Karuna, Raudra, Veera, Bhayanaka, Vibhatsa, Adbhuta, Shanta"],["<b>Nritta / Nritya / Natya<\/b>","Pure rhythm / expressive dance / dance-drama"],["<b>Tandava / Lasya<\/b>","Vigorous (masculine) / graceful (feminine)"],["Three elements","<b>Bhava, Raga, Tala<\/b> — hence \"<b>Bharata<\/b>\" natyam"]]},{"k":"table","title":"Hindustani vs Carnatic music","head":["Point","Hindustani (north)","Carnatic (south)"],"rows":[["Origin","Grew with Persian/Central Asian contact","Stayed closer to the Natyashastra and Sanskrit tradition"],["Founder figure","<b>Amir Khusrau<\/b> credited with the Khayal and the sitar","<b>Purandara Dasa<\/b> — \"father of Carnatic music\""],["Forms","<b>Dhrupad, Khayal, Thumri, Tappa, Tarana, Ghazal, Dadra<\/b>","<b>Kriti, Varnam, Ragam-Tanam-Pallavi, Kirtanam<\/b>"],["Ragas","About 6 main ragas, many <i>raginis<\/i>","72 <b>melakartas<\/b>; emphasis on the composition"],["Trinity","—","<b>Tyagaraja, Muthuswami Dikshitar, Shyama Shastri<\/b>"],["Main instrument pair","Sitar/sarod + tabla","Veena + mridangam, violin, ghatam"]]},{"k":"facts","title":"Gharanas and famous musicians","rows":[["<b>Gwalior gharana<\/b>","Oldest Khayal gharana — Haddu &amp; Hassu Khan"],["<b>Kirana gharana<\/b>","Abdul Karim Khan, <b>Bhimsen Joshi<\/b>, Gangubai Hangal"],["<b>Jaipur-Atrauli<\/b>","Alladiya Khan, Kishori Amonkar"],["<b>Agra, Patiala, Rampur-Sahaswan<\/b>","Faiyaz Khan / Bade Ghulam Ali Khan / Rashid Khan"],["Sitar","<b>Ravi Shankar<\/b>, Vilayat Khan, Nikhil Banerjee, Anoushka Shankar"],["Sarod","<b>Ali Akbar Khan<\/b>, <b>Amjad Ali Khan<\/b>"],["Shehnai","<b>Bismillah Khan<\/b> (Bharat Ratna)"],["Flute (bansuri)","<b>Hariprasad Chaurasia<\/b>, Pannalal Ghosh"],["Santoor","<b>Shivkumar Sharma<\/b>"],["Tabla","<b>Zakir Hussain<\/b>, Alla Rakha, Kishan Maharaj"],["Sarangi","Ram Narayan"],["Violin (Carnatic)","<b>L. Subramaniam<\/b>, T. N. Krishnan"],["Mandolin","U. Shrinivas"],["Rudra Veena","Asad Ali Khan"],["Vocal (Carnatic)","<b>M. S. Subbulakshmi<\/b> (first musician to get the Bharat Ratna), Semmangudi Srinivasa Iyer"],["Mohan Veena","Vishwa Mohan Bhatt"]]},{"k":"trap","h":"<b>Sattriya was added in 2000<\/b> — before that there were seven classical dances; a favourite \"how many\" question. <b>Kathak<\/b> is the only one with Mughal court influence; <b>Kathakali ≠ Kathak<\/b>. <b>Mohiniyattam<\/b> is from Kerala, not Karnataka — Karnataka's famous forms (<b>Yakshagana<\/b>, <b>Bayalata<\/b>) are <i>folk<\/i>, not classical."}],"sum":["Eight classical dances: Bharatanatyam–TN, Kathak–UP, Kathakali & Mohiniyattam–Kerala, Kuchipudi–AP, Odissi–Odisha, Manipuri–Manipur, Sattriya–Assam (added 2000).","Natyashastra by Bharata Muni (the fifth Veda); Abhinaya Darpana by Nandikeshvara; nine rasas; Tandava vs Lasya.","Hindustani forms: Dhrupad, Khayal, Thumri, Tappa, Tarana. Carnatic: Kriti, Varnam; trinity Tyagaraja, Muthuswami Dikshitar, Shyama Shastri; Purandara Dasa the father of Carnatic music.","Instruments: sitar–Ravi Shankar, sarod–Amjad Ali Khan, shehnai–Bismillah Khan, flute–Hariprasad Chaurasia, santoor–Shivkumar Sharma, tabla–Zakir Hussain, sarangi–Ram Narayan.","M. S. Subbulakshmi was the first musician to receive the Bharat Ratna."]},
{"id":"L27","g":"art","heat":2,"title":"Architecture — stupas, caves & temples","hi":"स्थापत्य कला","blocks":[{"k":"hot","h":"Standard questions: the three temple styles with examples, which caves are where and whose, and \"who built the Taj/Qutub/Charminar\". The style table is the whole chapter."},{"k":"story","h":"<p>India's buildings tell the story of its religions and rulers. The earliest great monuments were Buddhist. Ashoka began the stupa at <b>Sanchi<\/b>, a solid dome built over relics. Monks also cut prayer halls and living rooms out of hillsides. These caves run from Barabar in Bihar, the oldest, to <b>Ajanta<\/b>, famous for its paintings, and <b>Ellora<\/b>, where Buddhist, Hindu and Jain caves stand side by side.<\/p><p>Later, Hindu temples were built in stone, and three regional styles grew. The north built <b>Nagara<\/b> temples with a curved tower, like Khajuraho and Konark. The south built <b>Dravida<\/b> temples with a pyramid-shaped tower, tall gateways and walls, like Brihadeshwara at Thanjavur. The Deccan, in between, mixed the two in the Vesara style, seen at Pattadakal and Belur.<\/p><p>From the Delhi Sultanate on, Islamic builders brought the true arch and dome, along with stone inlay, jali screens and garden tombs. This tradition runs from the Qutub Minar to its peak in the Taj Mahal. Finally the British built in Gothic and Indo-Saracenic styles, and Lutyens and Baker designed New Delhi. The tables give the styles, the caves and the builders.<\/p>","key":"Learn Indian architecture in layers: Buddhist stupas and caves, three temple styles by region, Indo-Islamic arches and domes, then colonial buildings."},{"k":"photos","title":"In pictures","items":[["Kandariya_Mahadeva_Temple","Kandariya Mahadeva","Nagara · Khajuraho"],["Lingaraja_Temple","Lingaraja","Nagara · Bhubaneswar"],["Brihadisvara_Temple,_Thanjavur","Brihadeeswarar","Dravida · Thanjavur"],["Meenakshi_Temple","Meenakshi temple","Dravida · Madurai (gopurams)"],["Chennakeshava_Temple,_Belur","Chennakeshava, Belur","Vesara · Hoysala"],["Sanchi","Great Stupa, Sanchi","Begun by Ashoka"],["Kailasa_temple,_Ellora","Kailasa, Ellora","Cave 16 · one rock"],["Elephanta_Caves","Elephanta","Trimurti"],["Qutb_Minar","Qutub Minar","Delhi Sultanate"],["Humayun's_Tomb","Humayun's Tomb","First garden tomb"],["Gol_Gumbaz","Gol Gumbaz","Bijapur"],["Victoria_Memorial,_Kolkata","Victoria Memorial","Colonial"]]},{"k":"table","title":"Three temple styles","head":["Style","Where","Marks of the style","Examples"],"rows":[["<b>Nagara<\/b>","North India","Curvilinear <b>shikhara<\/b>; no boundary wall or gateway; square sanctum with projections; <b>amalaka<\/b> &amp; <b>kalasha<\/b> on top","Khajuraho (Kandariya Mahadeva), Konark Sun temple, Lingaraja (Bhubaneswar), Dashavatara (Deogarh), Somnath"],["<b>Dravida<\/b>","South India","Pyramidal <b>vimana<\/b>; tall <b>gopuram<\/b> gateways; boundary wall; temple tank; <b>stupika/shikhara<\/b> is the crowning element","Brihadeshwara (Thanjavur), Shore temple &amp; rathas (Mahabalipuram), Meenakshi (Madurai), Kailasanatha (Kanchipuram)"],["<b>Vesara<\/b>","Deccan — a mix","Nagara shikhara on a Dravida plan; star-shaped plans in the Hoysala version","Pattadakal, Aihole, Badami; Hoysaleshwara (Halebid), Chennakeshava (Belur)"]]},{"k":"info","title":"The three temple styles, side by side","html":"<figure class=\"fig wide\" style=\"--minw:600px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 710 300\" role=\"img\" aria-label=\"Nagara, Dravida and Vesara temples compared\">\n  <line x1=\"6\" y1=\"250\" x2=\"704\" y2=\"250\" class=\"grid\"/>\n  <rect x=\"22\" y=\"238\" width=\"176\" height=\"12\" class=\"abg\"/><rect x=\"30\" y=\"204\" width=\"56\" height=\"34\" class=\"abg\"/><path d=\"M26 204 L58 182 L90 204 Z\" class=\"abg\"/>\n  <rect x=\"92\" y=\"190\" width=\"80\" height=\"48\" class=\"abg\"/><path d=\"M92 190 C92 122 112 82 125 74 L139 74 C152 82 172 122 172 190 Z\" class=\"abg\"/>\n  <path d=\"M102 180 C104 130 116 96 128 84 M1  x=\"655\" y=\"178\" text-anchor=\"middle\" font-size=\"11\" class=\"mut\">Star plan<\/text>\n  <text x=\"560\" y=\"276\" text-anchor=\"middle\" font-size=\"15\" class=\"b\">Vesara<\/text><text x=\"560\" y=\"292\" text-anchor=\"middle\" font-size=\"11\" class=\"mut\">Deccan · a mix (Chalukya, Hoysala)<\/text><\/svg><\/figure>","cap":"Nagara: a curved tower crowned by an amalaka. Dravida: a stepped pyramid (vimana), tall gopurams and a wall. Vesara: the curve of the north on the tiers of the south, often on a star-shaped plan."},{"k":"trick","h":"<b>Style ↔ region<\/b>: <b>Na<\/b>gara = <b>No<\/b>rth, <b>Dra<\/b>vida = <b>D<\/b>own south, <b>Ve<\/b>sara = <b>Ve<\/b>ech (between) — the Deccan.<br><b>Gopuram only in the south<\/b>; a <b>curved shikhara only in the north<\/b>."},{"k":"facts","title":"Stupas and Buddhist architecture","rows":[["<b>Sanchi<\/b> (MP)","Begun by <b>Ashoka<\/b>; railings and gateways (<i>toranas<\/i>) added by the <b>Sungas &amp; Satavahanas<\/b>; UNESCO site; the <b>largest stupa<\/b> and the best preserved"],["<b>Bharhut<\/b> (MP)","Sunga-period railings with Jataka scenes"],["<b>Amaravati<\/b> (AP)","Satavahana; white marble narrative panels"],["<b>Dhamek Stupa, Sarnath<\/b>","Marks Buddha's first sermon"],["<b>Nalanda &amp; Ratnagiri / Lalitgiri / Udayagiri<\/b> (Odisha)","Monastic complexes — the \"Diamond Triangle\""],["Parts of a stupa","<b>Medhi<\/b> (base), <b>Anda<\/b> (dome), <b>Harmika<\/b> (square railing), <b>Yashti<\/b> (mast), <b>Chhatra<\/b> (umbrella), <b>Pradakshina Patha<\/b> (circumambulation), <b>Torana<\/b> (gateway)"]]},{"k":"info","title":"The parts of a stupa (Sanchi)","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 280\" role=\"img\" aria-label=\"The parts of a stupa\">\n  <line x1=\"40\" y1=\"250\" x2=\"660\" y2=\"250\" class=\"grid\"/>\n  <rect x=\"112\" y=\"222\" width=\"5\" height=\"28\" class=\"bbg\"/><rect x=\"488\" y=\"222\" width=\"5\" height=\"28\" class=\"bbg\"/><rect x=\"123\" y=\"222\" width=\"5\" height=\"28\" class=\"bbg\"/><rect x=\"499\" y=\"222\" width=\"5\" height=\"28\" class=\"bbg\"/><rect x=\"134\" y=\"222\" width=\"5\" height=\"28\" class=\"bbg\"/><rect x=\"510\" y=\"222\" width=\"5\" height=\"28\" class=\"bbg\"/><rect x=\"145\" y=\"222\" width=\"5\" height=\"28\" class=\"bbg\"/><rect x=\"521\" y=\"222\" width=\"5\" height=\"28\" class=\"bbg\"/><rect x=\"156\" y=\"222\" width=\"5\" height=\"28\" class=\"bbg\"/><rect x=\"532\" y=\"222\" width=\"5\" height=\"28\" class=\"bbg\"/><rect x=\"167\" y=\"222\" width=\"5\" height=\"28\" class=\"bbg\"/><rect x=\"543\" y=\"222\" width=\"5\" height=\"28\" class=\"bbg\"/><rect x=\"178\" y=\"222\" width=\"5\" height=\"28\" class=\"bbg\"/><rect x=\"554\" y=\"222\" width=\"5\" height=\"28\" class=\"bbg\"/><rect x=\"189\" y=\"222\" width=\"5\" height=\"28\" class=\"bbg\"/><rect x=\"565\" y=\"222\" width=\"5\" height=\"28\" class=\"bbg\"/>\n  <path d=\"M108 228 H200 M108 238 H200 M480 228 H572 M480 238 H572\" class=\"acs\" stroke-width=\"2\"/>\n  <rect x=\"200\" y=\"205\" width=\"280\" height=\"45\" class=\"abg\"/><path d=\"M200 205 H480\" class=\"acs\" stroke-width=\"2.5\"/>\n  <path d=\"M215 205 A125 120 0 0 1 465 205 Z\" class=\"abg\"/>\n  <rect x=\"320\" y=\"70\" width=\"40\" height=\"18\" class=\"bbg\"/><line x1=\"340\" y1=\"70\" x2=\"340\" y2=\"20\" class=\"acs\" stroke-width=\"2.5\"/>\n  <ellipse cx=\"340\" cy=\"52\" rx=\"24\" ry=\"4\" class=\"acc\"/><ellipse cx=\"340\" cy=\"38\" rx=\"17\" ry=\"3.5\" class=\"acc\"/><ellipse cx=\"340\" cy=\"26\" rx=\"10\" ry=\"3\" class=\"acc\"/>\n  <rect x=\"586\" y=\"150\" width=\"9\" height=\"100\" class=\"bbg\"/><rect x=\"626\" y=\"150\" width=\"9\" height=\"100\" class=\"bbg\"/>\n  <rect x=\"574\" y=\"146\" width=\"74\" height=\"7\" class=\"acc\"/><rect x=\"578\" y=\"162\" width=\"66\" height=\"7\" class=\"acc\"/><rect x=\"582\" y=\"178\" width=\"58\" height=\"7\" class=\"acc\"/>\n  <line x1=\"318\" y1=\"38\" x2=\"220\" y2=\"34\" class=\"grid\"/><text x=\"217\" y=\"38\" text-anchor=\"end\" font-size=\"11\" class=\"mut\" data-lq=\"Chhatra\">Chhatra (umbrellas)<\/text><line x1=\"340\" y1=\"62\" x2=\"220\" y2=\"58\" class=\"grid\"/><text x=\"217\" y=\"62\" text-anchor=\"end\" font-size=\"11\" class=\"mut\" data-lq=\"Yashti\">Yashti (mast)<\/text><line x1=\"320\" y1=\"80\" x2=\"220\" y2=\"82\" class=\"grid\"/><text x=\"217\" y=\"86\" text-anchor=\"end\" font-size=\"11\" class=\"mut\" data-lq=\"Harmika\">Harmika (railed box)<\/text>\n  <line x1=\"260\" y1=\"140\" x2=\"160\" y2=\"130\" class=\"grid\"/><text x=\"157\" y=\"134\" text-anchor=\"end\" font-size=\"11\" class=\"mut\" data-lq=\"Anda\">Anda (the dome)<\/text><line x1=\"220\" y1=\"205\" x2=\"160\" y2=\"180\" class=\"grid\"/><text x=\"157\" y=\"184\" text-anchor=\"end\" font-size=\"11\" class=\"mut\" data-lq=\"Pradakshina patha\">Pradakshina patha<\/text><text x=\"340\" y=\"232\" text-anchor=\"middle\" font-size=\"11\" class=\"mut\">Medhi (drum)<\/text>\n  <line x1=\"530\" y1=\"228\" x2=\"520\" y2=\"196\" class=\"grid\"/><text x=\"520\" y=\"200\" text-anchor=\"middle\" font-size=\"11\" class=\"mut\" data-lq=\"Vedika\">Vedika (railing)<\/text><line x1=\"610\" y1=\"146\" x2=\"610\" y2=\"116\" class=\"grid\"/><text x=\"610\" y=\"120\" text-anchor=\"middle\" font-size=\"11\" class=\"mut\" data-lq=\"Torana\">Torana (gateway)<\/text><\/svg><\/figure>","cap":"Bottom to top: medhi, anda, harmika, yashti, chhatra. The vedika (railing) and the four toranas (gateways) at Sanchi were added by the Sungas and Satavahanas."},{"k":"table","title":"Cave architecture","head":["Caves","State","Whose / what"],"rows":[["<b>Ajanta<\/b>","Maharashtra","<b>Buddhist only<\/b>, 29 caves; <b>paintings<\/b> (fresco/tempera) of Jataka tales; 2nd c. BCE–6th c. CE; UNESCO"],["<b>Ellora<\/b>","Maharashtra","<b>All three — Buddhist, Hindu, Jain<\/b>, 34 caves; <b>Kailasa temple (Cave 16)<\/b> cut from one rock by <b>Krishna I (Rashtrakuta)<\/b>; UNESCO"],["<b>Elephanta<\/b>","Maharashtra","Shaivite; the <b>Trimurti<\/b> / Maheshmurti; Rashtrakuta period; UNESCO"],["<b>Bagh<\/b>","Madhya Pradesh","Buddhist paintings, like Ajanta's"],["<b>Udayagiri &amp; Khandagiri<\/b>","Odisha","<b>Jain<\/b>; Kharavela's <b>Hathigumpha inscription<\/b>"],["<b>Karla, Bhaja, Bedsa, Nasik, Kanheri<\/b>","Maharashtra","Buddhist <b>chaityas<\/b> &amp; <b>viharas<\/b>; Karla has the largest chaitya hall"],["<b>Barabar<\/b>","Bihar","<b>Oldest<\/b> rock-cut caves, Mauryan period (Lomas Rishi)"],["<b>Sittanavasal<\/b>","Tamil Nadu","Jain paintings"],["<b>Badami<\/b>","Karnataka","Chalukyan, Hindu &amp; Jain"]]},{"k":"mapfig","title":"The caves on the map","pins":[["Ajanta",75.7,20.55,"Buddhist · paintings"],["Ellora",75.18,20.03,"Buddhist · Hindu · Jain","l"],["Elephanta",72.93,18.96,"Shaivite · Trimurti","l"],["Karla · Bhaja · Kanheri",73.48,18.78,"Buddhist chaityas"],["Bagh",74.83,22.33,"MP · paintings","l"],["Udayagiri–Khandagiri",85.78,20.26,"Jain · Kharavela"],["Barabar",85.06,25,"Mauryan · the oldest"],["Badami",75.68,15.92,"Chalukyan","l"],["Sittanavasal",78.72,10.45,"Jain paintings"]],"cap":"Most of the rock-cut caves are in Maharashtra, cut into the Deccan basalt of the Western Ghats. The oldest, Barabar, are Mauryan."},{"k":"trick","h":"<b>Ajanta vs Ellora<\/b> — \"<b>A<\/b>janta is <b>A<\/b>ll Buddhist and has the <b>A<\/b>rt (paintings); <b>E<\/b>llora is <b>E<\/b>verybody's (three religions) and has the <b>E<\/b>normous Kailasa.\"<br><b>Elephanta<\/b> → <b>Trimurti<\/b> of Shiva."},{"k":"facts","title":"Indo-Islamic and colonial","rows":[["<b>Delhi Sultanate style<\/b>","<b>Quwwat-ul-Islam mosque<\/b> &amp; <b>Qutub Minar<\/b> (Aibak–Iltutmish), <b>Alai Darwaza<\/b> (Alauddin Khalji), <b>Tughlaqabad<\/b>, <b>Lodi tombs<\/b>"],["<b>Mughal peak<\/b>","<b>Humayun's tomb<\/b> (first garden tomb), <b>Fatehpur Sikri &amp; Buland Darwaza<\/b> (Akbar), <b>Itimad-ud-Daulah<\/b> (first full marble, <i>pietra dura<\/i>), <b>Taj Mahal<\/b> (Shah Jahan; Ustad Ahmad Lahauri), <b>Red Fort &amp; Jama Masjid<\/b>"],["<b>Provincial<\/b>","<b>Gol Gumbaz<\/b> (Bijapur), <b>Charminar<\/b> (Hyderabad, 1591), Atala Masjid (Jaunpur), Jama Masjid of Ahmedabad"],["<b>Features<\/b>","<b>True arch &amp; dome<\/b> (as against the Indian corbelled arch), <b>pietra dura<\/b> (stone inlay), <b>jali<\/b> screens, <b>charbagh<\/b> garden, <b>chhatri<\/b>, <b>pishtaq<\/b> (arched portal), <b>iwan<\/b>"],["<b>Colonial<\/b>","Victoria Memorial &amp; Writers' Building (Kolkata), Gateway of India &amp; CST (Mumbai — <b>Indo-Saracenic/Gothic<\/b>), Rashtrapati Bhavan &amp; India Gate (New Delhi, by <b>Edwin Lutyens<\/b> and <b>Herbert Baker<\/b>)"],["<b>Temple cities / UNESCO<\/b>","Hampi, Pattadakal, Mahabalipuram, Khajuraho, Konark, Great Living Chola Temples, Ajanta, Ellora, Elephanta, Sanchi, Bodh Gaya, Qutub Minar, Humayun's tomb, Red Fort, Taj Mahal, Fatehpur Sikri, Rani ki Vav, Dholavira, Jaipur city, Ahmedabad city, Victorian &amp; Art Deco Mumbai, Santiniketan, Hoysala temples"]]},{"k":"trap","h":"The <b>Kailasa temple at Ellora is rock-cut<\/b> (carved out of a hill, top-down) — <b>Brihadeshwara<\/b> is built up from stone blocks. <b>Konark<\/b> is Nagara, not Dravida. The <b>Taj Mahal's architect<\/b> is <b>Ustad Ahmad Lahauri<\/b>, and it was built for <b>Mumtaz Mahal<\/b> (Arjumand Banu)."}],"sum":["Nagara (north): curved shikhara, no gopuram — Khajuraho, Konark, Lingaraja. Dravida (south): vimana + gopuram + tank — Brihadeshwara, Meenakshi, Mahabalipuram. Vesara (Deccan): Pattadakal, Halebid, Belur.","Ajanta = Buddhist only + paintings; Ellora = Buddhist + Hindu + Jain, with the rock-cut Kailasa temple (Krishna I); Elephanta = Shaivite Trimurti; Barabar = oldest rock-cut caves.","Sanchi stupa begun by Ashoka, gateways by Sungas/Satavahanas. Stupa parts: medhi, anda, harmika, yashti, chhatra, torana.","Indo-Islamic features: true arch and dome, pietra dura, jali, charbagh, chhatri. Humayun's tomb = first garden tomb; Itimad-ud-Daulah = first full marble.","New Delhi was designed by Edwin Lutyens and Herbert Baker."]},
{"id":"L35","g":"art","heat":3,"title":"UNESCO world heritage of India","hi":"भारत की यूनेस्को विश्व धरोहर","blocks":[{"k":"hot","h":"Asked every year, usually as <b>site ↔ state<\/b>, <b>which year<\/b>, <b>the first four<\/b> or <b>the only mixed site<\/b>, plus whichever site was added most recently. The intangible list (Garba, Durga Puja, Kumbh, Yoga) is asked just as often."},{"k":"story","h":"<p>UNESCO keeps a <b>World Heritage List<\/b> of places so valuable that they belong to all humanity. Each place is put in one of three boxes: <b>cultural<\/b> (made by people — temples, forts, cities), <b>natural<\/b> (forests, mountains, wildlife) or <b>mixed<\/b> (both at once).<\/p><p>As of the <b>2025<\/b> session, India has <b>44 sites<\/b>: <b>36 cultural, 7 natural and 1 mixed<\/b>. The story starts in <b>1983<\/b> with four: two cave sites in Maharashtra (<b>Ajanta, Ellora<\/b>) and two Mughal monuments in Agra (<b>Agra Fort, Taj Mahal<\/b>). The seven natural sites are easy to picture as a journey — rhinos and wild buffalo in <b>Assam<\/b> (Kaziranga, Manas), birds in <b>Rajasthan<\/b> (Keoladeo), tigers in the mangroves of <b>Bengal<\/b> (Sundarbans), the high <b>Himalaya<\/b> (Nanda Devi, Great Himalayan NP) and the long <b>Western Ghats<\/b>. The one mixed site is <b>Khangchendzonga<\/b> in Sikkim.<\/p><p>There is a second list for things you cannot touch — songs, dances, festivals and crafts. This is the <b>intangible cultural heritage<\/b> list. India has <b>15 elements<\/b> on it up to <b>Garba of Gujarat (2023)<\/b>. Anything added after the 2025 site session, or after 2023 on the intangible list, is not counted in this lesson.<\/p>"},{"k":"photos","title":"In pictures","items":[["Taj_Mahal","Taj Mahal","Uttar Pradesh · 1983"],["Ajanta_Caves","Ajanta Caves","Maharashtra · 1983"],["Konark_Sun_Temple","Sun Temple, Konark","Odisha · 1984"],["Kaziranga_National_Park","Kaziranga","Assam · 1985 · natural"],["Hampi","Hampi","Karnataka · 1986"],["Rani_ki_vav","Rani ki Vav","Gujarat · 2014"],["Dholavira","Dholavira","Gujarat · 2021"],["Ramappa_Temple","Ramappa Temple","Telangana · 2021"],["Moidams","Moidams, Charaideo","Assam · 2024"],["Khangchendzonga_National_Park","Khangchendzonga","Sikkim · the mixed site"],["Jantar_Mantar,_Jaipur","Jantar Mantar","Jaipur · 2010"],["Santiniketan","Santiniketan","West Bengal · 2023"]]},{"k":"facts","title":"Key numbers and firsts","rows":[["Total sites (as of 2025)","<b>44<\/b> — 36 cultural, 7 natural, 1 mixed"],["First sites (1983)","<b>Ajanta, Ellora, Agra Fort, Taj Mahal<\/b>"],["Only mixed site","<b>Khangchendzonga National Park<\/b>, Sikkim (2016)"],["First Indian city","<b>Ahmedabad<\/b> (2017); Jaipur followed in 2019"],["First Harappan site in India","<b>Dholavira<\/b>, Gujarat (2021)"],["Temple named after its sculptor","<b>Ramappa<\/b> (Kakatiya Rudreshwara) temple, Telangana (2021)"],["First cultural site of the North-East","<b>Moidams<\/b> — Ahom mound burials at Charaideo, Assam (2024)"],["Latest (2025)","<b>Maratha Military Landscapes<\/b> — 12 forts: 11 in Maharashtra and <b>Gingee<\/b> in Tamil Nadu"],["India hosted the committee","46th World Heritage Committee session, <b>New Delhi, July 2024<\/b>"],["On currency notes","₹10 Konark wheel, ₹20 Ellora, ₹50 Hampi stone chariot, ₹100 <b>Rani ki Vav<\/b>, ₹200 Sanchi, ₹500 Red Fort"],["World Heritage Day","<b>18 April<\/b>"]]},{"k":"bars","title":"Sites inscribed, by decade","sort":false,"rows":[["1980s",19,""],["1990s",3,""],["2000s",5,""],["2010s",11,""],["2020s",6,""]],"hi":1,"cap":"The 1980s gave the most: the Ajanta, Ellora, Agra Fort and Taj Mahal batch of 1983 and the national parks of 1985."},{"k":"info","title":"Cultural, natural, mixed","html":"<div class=\"fam\"><div><span class=\"ic\" aria-hidden=\"true\">🏛️<\/span><b>Cultural<\/b><span class=\"n\" style=\"font-size:22px\">36<\/span><small>Ajanta Caves · Ellora Caves · Agra Fort · Taj Mahal …<\/small><\/div><div><span class=\"ic\" aria-hidden=\"true\">🌿<\/span><b>Natural<\/b><span class=\"n\" style=\"font-size:22px\">7<\/span><small>Kaziranga National Park · Manas Wildlife Sanctuary · Keoladeo National Park · Sundarbans National Park · Nanda Devi and Valley of Flowers · Western Ghats · Great Himalayan National Park<\/small><\/div><div><span class=\"ic\" aria-hidden=\"true\">🏔️<\/span><b>Mixed<\/b><span class=\"n\" style=\"font-size:22px\">1<\/span><small>Khangchendzonga National Park<\/small><\/div><\/div>","cap":"The only mixed site is Khangchendzonga (Sikkim, 2016); the newest are the Moidams of Assam (2024) and the Maratha Military Landscapes (2025)."},{"k":"table","title":"India's 44 World Heritage Sites (as of 2025)","head":["Site","State","Year","Type"],"rows":[["<b>Ajanta Caves<\/b>","Maharashtra","1983","Cultural"],["<b>Ellora Caves<\/b>","Maharashtra","1983","Cultural"],["<b>Agra Fort<\/b>","Uttar Pradesh","1983","Cultural"],["<b>Taj Mahal<\/b>","Uttar Pradesh","1983","Cultural"],["Group of Monuments at <b>Mahabalipuram<\/b>","Tamil Nadu","1984","Cultural"],["<b>Sun Temple, Konark<\/b>","Odisha","1984","Cultural"],["<b>Kaziranga<\/b> National Park","Assam","1985","Natural"],["<b>Manas<\/b> Wildlife Sanctuary","Assam","1985","Natural"],["<b>Keoladeo<\/b> National Park (Bharatpur)","Rajasthan","1985","Natural"],["Churches and Convents of <b>Goa<\/b>","Goa","1986","Cultural"],["<b>Khajuraho<\/b> Group of Monuments","Madhya Pradesh","1986","Cultural"],["Group of Monuments at <b>Hampi<\/b>","Karnataka","1986","Cultural"],["<b>Fatehpur Sikri<\/b>","Uttar Pradesh","1986","Cultural"],["Group of Monuments at <b>Pattadakal<\/b>","Karnataka","1987","Cultural"],["<b>Elephanta Caves<\/b>","Maharashtra","1987","Cultural"],["<b>Great Living Chola Temples<\/b> (Thanjavur, Gangaikondacholapuram, Darasuram)","Tamil Nadu","1987 (extended 2004)","Cultural"],["<b>Sundarbans<\/b> National Park","West Bengal","1987","Natural"],["<b>Nanda Devi<\/b> and Valley of Flowers","Uttarakhand","1988 (extended 2005)","Natural"],["Buddhist Monuments at <b>Sanchi<\/b>","Madhya Pradesh","1989","Cultural"],["<b>Humayun's Tomb<\/b>","Delhi","1993","Cultural"],["<b>Qutb Minar<\/b> and its Monuments","Delhi","1993","Cultural"],["<b>Mountain Railways of India<\/b> (Darjeeling 1999, Nilgiri 2005, Kalka–Shimla 2008)","West Bengal, Tamil Nadu, Himachal Pradesh","1999","Cultural"],["<b>Mahabodhi<\/b> Temple Complex, Bodh Gaya","Bihar","2002","Cultural"],["Rock Shelters of <b>Bhimbetka<\/b>","Madhya Pradesh","2003","Cultural"],["<b>Champaner-Pavagadh<\/b> Archaeological Park","Gujarat","2004","Cultural"],["<b>Chhatrapati Shivaji Terminus<\/b>","Maharashtra","2004","Cultural"],["<b>Red Fort<\/b> Complex","Delhi","2007","Cultural"],["<b>Jantar Mantar<\/b>, Jaipur","Rajasthan","2010","Cultural"],["<b>Western Ghats<\/b>","Kerala, Karnataka, Tamil Nadu, Maharashtra","2012","Natural"],["<b>Hill Forts of Rajasthan<\/b> (Chittorgarh, Kumbhalgarh, Ranthambore, Gagron, Amber, Jaisalmer)","Rajasthan","2013","Cultural"],["<b>Rani ki Vav<\/b>, Patan","Gujarat","2014","Cultural"],["<b>Great Himalayan National Park<\/b>","Himachal Pradesh","2014","Natural"],["<b>Nalanda Mahavihara<\/b>","Bihar","2016","Cultural"],["<b>Khangchendzonga<\/b> National Park","Sikkim","2016","<b>Mixed<\/b>"],["<b>Capitol Complex<\/b>, Chandigarh (Le Corbusier)","Chandigarh","2016","Cultural"],["Historic City of <b>Ahmedabad<\/b>","Gujarat","2017","Cultural"],["<b>Victorian Gothic and Art Deco<\/b> Ensembles of Mumbai","Maharashtra","2018","Cultural"],["<b>Jaipur<\/b> City","Rajasthan","2019","Cultural"],["<b>Ramappa<\/b> (Kakatiya Rudreshwara) Temple","Telangana","2021","Cultural"],["<b>Dholavira<\/b>, a Harappan city","Gujarat","2021","Cultural"],["<b>Santiniketan<\/b>","West Bengal","2023","Cultural"],["Sacred Ensembles of the <b>Hoysalas<\/b> (Belur, Halebidu, Somanathapura)","Karnataka","2023","Cultural"],["<b>Moidams<\/b> of the Ahom dynasty, Charaideo","Assam","2024","Cultural"],["<b>Maratha Military Landscapes<\/b> of India","Maharashtra, Tamil Nadu","2025","Cultural"]]},{"k":"indiamap","title":"World Heritage Sites on the map","cap":"Tap a state to see its World Heritage Sites. A site that spans states (the Western Ghats, the mountain railways, the Maratha forts) is listed in each."},{"k":"statechart","title":"Sites per state","cap":"Maharashtra leads, then Rajasthan, Gujarat, Karnataka, Madhya Pradesh and Uttar Pradesh. Sites that span states count once for each."},{"k":"tl","title":"Intangible cultural heritage of India (15 elements, up to 2023)","rows":[["2008","<b>Koodiyattam<\/b> (Sanskrit theatre, Kerala), <b>Ramlila<\/b>, <b>Vedic chanting<\/b> — first proclaimed 2001–05, inscribed 2008"],["2009","<b>Ramman<\/b> — religious festival and ritual theatre of the Garhwal Himalayas, Uttarakhand"],["2010","<b>Mudiyettu<\/b> (ritual dance-drama, Kerala), <b>Kalbelia<\/b> (folk songs and dances, Rajasthan), <b>Chhau<\/b> (Odisha, Jharkhand, West Bengal)"],["2012","<b>Buddhist chanting of Ladakh<\/b>"],["2013","<b>Sankirtana<\/b> — ritual singing, drumming and dancing of Manipur"],["2014","Brass and copper utensil craft of the <b>Thatheras of Jandiala Guru<\/b>, Punjab"],["2016","<b>Navroz<\/b> (shared with other countries) and <b>Yoga<\/b>"],["2017","<b>Kumbh Mela<\/b>"],["2021","<b>Durga Puja in Kolkata<\/b>"],["2023","<b>Garba of Gujarat<\/b>"]]},{"k":"trick","h":"<b>First four (1983)<\/b>: <span class=\"mn\">A-E + A-T<\/span> — two caves (<b>A<\/b>janta, <b>E<\/b>llora) and two Agra monuments (<b>A<\/b>gra Fort, <b>T<\/b>aj).<br><b>Seven natural sites<\/b>: <span class=\"mn\">K-K-M-S-N-W-G<\/span> — 'Kind King Manas Saw Nanda's White Goat' = Kaziranga, Keoladeo, Manas, Sundarbans, Nanda Devi, Western Ghats, Great Himalayan NP. Everything else is cultural, except the one mixed site, Khangchendzonga."},{"k":"trick","h":"<b>Intangible years<\/b>: <span class=\"mn\">K-R-V = 2008<\/span> (Koodiyattam, Ramlila, Vedic chanting); <span class=\"mn\">M-K-C = 2010<\/span> (Mudiyettu, Kalbelia, Chhau). The rest come one or two at a time: Ramman 09, Ladakh 12, Sankirtana 13, Thatheras 14, Navroz and Yoga 16, Kumbh 17, Durga Puja 21, Garba 23."},{"k":"trap","h":"The only <b>mixed<\/b> site is <b>Khangchendzonga<\/b>, not Nanda Devi. <b>Keoladeo is in Rajasthan<\/b>, not Gujarat; <b>Ramappa is in Telangana<\/b>, not Andhra; <b>Rani ki Vav is in Gujarat<\/b>, not Rajasthan. <b>Matheran's railway is not part of the Mountain Railways site<\/b>. <b>Kumbh Mela and Yoga<\/b> are <i>intangible<\/i> heritage, not World Heritage Sites. <b>Ahmedabad<\/b> was the first Indian city, not Jaipur."}],"sum":["As of the 2025 session India has 44 World Heritage Sites: 36 cultural, 7 natural and 1 mixed.","The first four, in 1983, were Ajanta, Ellora, Agra Fort and the Taj Mahal; the only mixed site is Khangchendzonga in Sikkim (2016).","Natural sites: Kaziranga and Manas (Assam), Keoladeo (Rajasthan), Sundarbans (West Bengal), Nanda Devi and Valley of Flowers (Uttarakhand), Western Ghats and Great Himalayan NP (Himachal).","Recent sites: Ramappa and Dholavira 2021, Santiniketan and Hoysala temples 2023, Moidams of Assam 2024, Maratha Military Landscapes 2025.","Intangible heritage: Koodiyattam, Ramlila and Vedic chanting 2008; Ramman 2009; Mudiyettu, Kalbelia and Chhau 2010; Yoga 2016; Kumbh Mela 2017; Durga Puja 2021; Garba 2023."]},
{"id":"L28","g":"art","heat":2,"title":"Painting, crafts, theatre & puppetry","hi":"चित्रकला · शिल्प · रंगमंच","blocks":[{"k":"hot","h":"Asked as \"which painting style belongs to which state\" and \"which craft has a GI tag from where\". The folk-painting table below is the money table."},{"k":"story","h":"<p>Long before galleries existed, Indians painted on walls, cloth and paper to tell stories of gods and heroes and to mark festivals. Each region kept its own style, made with local materials. That is why exam questions ask which painting belongs to which state. This lesson also covers court painting, folk theatre, puppets and crafts, so do not read it as one long list. Sort it into four boxes.<\/p><p><b>Box 1: folk paintings, by region.<\/b> East: Madhubani (Bihar), Pattachitra (Odisha), Kalighat (Bengal). West: Warli (Maharashtra), Phad (Rajasthan). Centre: Gond (Madhya Pradesh). South: Kalamkari (Andhra Pradesh), Cheriyal (Telangana). Mountains: Thangka (Sikkim and Ladakh). <b>Box 2: court painting, by ruler.<\/b> The Mughal school began under Humayun, grew under Akbar and peaked under <b>Jahangir<\/b>. Rajasthani and Pahari schools grew in the courts of Rajasthan and the hills, and the Bengal School of Abanindranath Tagore brought a national style.<\/p><p><b>Box 3: theatre and puppets, by state<\/b>: Nautanki in Uttar Pradesh, Tamasha in Maharashtra, Yakshagana in Karnataka, Kathputli string puppets in Rajasthan. <b>Box 4: crafts and textiles, by town<\/b>: Banarasi silk, Chikankari from Lucknow, Patola from Patan. Learn one box at a time.<\/p>","key":"Sort this lesson into four boxes: folk paintings by region, court painting by ruler, theatre and puppets by state, and crafts by town."},{"k":"photos","title":"Paintings in pictures","items":[["Madhubani_art","Madhubani","Bihar"],["Warli_painting","Warli","Maharashtra"],["Pattachitra","Pattachitra","Odisha"],["Kalamkari","Kalamkari","Andhra Pradesh"],["Phad_painting","Phad","Rajasthan"],["Gond_art","Gond","Madhya Pradesh"],["Thangka","Thangka","Sikkim · Ladakh"],["Kalighat_painting","Kalighat","West Bengal"],["Cheriyal_scrolls","Cheriyal scroll","Telangana"],["Pithora_painting","Pithora","Gujarat · MP"],["Bani_Thani","Bani Thani","Kishangarh school"],["Kathputli_(puppetry)","Kathputli","Rajasthan puppets"]]},{"k":"table","title":"Folk & tribal paintings","head":["Painting","State","Marks"],"rows":[["<b>Madhubani / Mithila<\/b>","Bihar","Done by women on walls and paper; no space left blank; natural dyes; Sita Devi, Mahasundari Devi"],["<b>Warli<\/b>","Maharashtra","White geometric figures (circle–triangle–square) on a mud-red ground; Jivya Soma Mashe"],["<b>Pattachitra<\/b>","Odisha &amp; West Bengal","Cloth scroll painting; Jagannath themes"],["<b>Kalamkari<\/b>","Andhra Pradesh","Pen (<i>kalam<\/i>) work on cloth; Srikalahasti &amp; Machilipatnam schools"],["<b>Phad<\/b>","Rajasthan","Long cloth scrolls of Pabuji &amp; Devnarayan"],["<b>Pithora<\/b>","Gujarat &amp; MP (Rathwa/Bhil)","Ritual horse figures on walls"],["<b>Gond<\/b>","Madhya Pradesh","Dots and dashes; Jangarh Singh Shyam"],["<b>Saura<\/b>","Odisha","Tribal wall art (<i>ikons<\/i>)"],["<b>Thangka<\/b>","Sikkim · Ladakh","Buddhist scroll paintings"],["<b>Cheriyal scroll<\/b>","Telangana","Narrative scrolls, bright red backgrounds"],["<b>Kalighat<\/b>","West Bengal","19th-century Kolkata watercolour style"],["<b>Aipan<\/b> / <b>Likhnu<\/b>","Uttarakhand / Himachal","Ritual floor and wall designs"],["<b>Manjusha<\/b>","Bihar (Bhagalpur)","\"Snake painting\"; Bihula-Bishahari story"],["<b>Bhil (Pithora/dot art)<\/b>","Madhya Pradesh","Dotted fill; Bhuri Bai"]]},{"k":"mapfig","title":"Folk paintings on the map","marks":[["BR","Madhubani · Manjusha"],["MH","Warli"],["OD","Pattachitra · Saura",6,6],["AP","Kalamkari",0,8],["RJ","Phad"],["GJ","Pithora",6,0],["MP","Gond · Bhil"],["SK","Thangka",0,-8],["LA","Thangka"],["TG","Cheriyal"],["WB","Kalighat",8,12],["UT","Aipan",6,0]],"cap":"Madhubani (Bihar), Warli (Maharashtra), Pattachitra (Odisha), Kalamkari (Andhra Pradesh), Phad (Rajasthan) and Gond (MP) are the six asked most."},{"k":"facts","title":"Court painting schools","rows":[["<b>Mughal school<\/b>","Began under <b>Humayun<\/b> (Mir Sayyid Ali, Abdus Samad), flowered under <b>Akbar<\/b>, <b>peaked under Jahangir<\/b> (Ustad Mansur — birds &amp; animals; Abul Hasan, Bishandas), declined under Aurangzeb"],["<b>Rajasthani / Rajput<\/b>","Sub-schools: <b>Mewar, Bundi, Kishangarh (Bani-Thani)<\/b>, Kota, Marwar, Amber-Jaipur"],["<b>Pahari<\/b>","<b>Basohli<\/b> (bold, Devi Mahatmya), <b>Kangra<\/b> (lyrical, Gita Govinda; under Sansar Chand), Guler, Chamba"],["<b>Deccani<\/b>","Ahmadnagar, Bijapur, Golconda"],["<b>Bengal School<\/b>","<b>Abanindranath Tagore<\/b> (\"Bharat Mata\"), Nandalal Bose (illustrated the Constitution), Asit Kumar Haldar"],["<b>Modern<\/b>","Raja Ravi Varma (oil, Kerala), Amrita Sher-Gil, Jamini Roy, M. F. Husain, Tyeb Mehta"]]},{"k":"facts","title":"Folk theatre & puppetry","rows":[["<b>Nautanki<\/b>","Uttar Pradesh"],["<b>Ramlila / Raslila<\/b>","Uttar Pradesh"],["<b>Tamasha<\/b>","Maharashtra"],["<b>Bhavai<\/b>","Gujarat &amp; Rajasthan"],["<b>Jatra<\/b>","West Bengal &amp; Odisha"],["<b>Bhaona / Ankia Nat<\/b>","Assam (Shankaradeva)"],["<b>Yakshagana<\/b>","Karnataka"],["<b>Therukoothu<\/b>","Tamil Nadu"],["<b>Burrakatha<\/b>","Andhra Pradesh"],["<b>Swang<\/b>","Haryana"],["<b>Khyal<\/b>","Rajasthan"],["<b>Maach<\/b>","Madhya Pradesh"],["<b>Dashavatar<\/b>","Goa &amp; Konkan"],["<b>Krishnattam / Koodiyattam<\/b>","Kerala (Koodiyattam is UNESCO-listed)"],["<b>Kathputli<\/b> — string puppets","Rajasthan"],["<b>Togalu Gombeyatta<\/b> — shadow puppets","Karnataka"],["<b>Tholu Bommalata<\/b> — shadow","Andhra Pradesh"],["<b>Putul Nautch<\/b> — rod puppets","West Bengal"],["<b>Pavakoothu<\/b> — glove puppets","Kerala"],["<b>Ravanachhaya<\/b> — shadow","Odisha"]]},{"k":"facts","title":"Crafts & textiles (common GI questions)","rows":[["Pashmina / Kani shawl","Jammu &amp; Kashmir"],["<b>Banarasi silk<\/b>","Uttar Pradesh"],["<b>Chikankari<\/b>","Lucknow, UP"],["<b>Bandhani<\/b>","Gujarat &amp; Rajasthan"],["<b>Patola<\/b>","Patan, Gujarat"],["<b>Pochampally Ikat<\/b>","Telangana"],["<b>Kanjeevaram silk<\/b>","Tamil Nadu"],["<b>Baluchari<\/b>","West Bengal"],["<b>Chanderi &amp; Maheshwari<\/b>","Madhya Pradesh"],["<b>Phulkari<\/b>","Punjab"],["<b>Kalamkari<\/b>","Andhra Pradesh"],["<b>Muga silk<\/b>","Assam"],["<b>Bidriware<\/b>","Bidar, Karnataka"],["<b>Dhokra<\/b> metal craft","Chhattisgarh &amp; West Bengal"],["<b>Blue pottery<\/b>","Jaipur, Rajasthan"],["<b>Channapatna toys<\/b>","Karnataka"],["<b>Zardozi<\/b>","Lucknow &amp; Bhopal"],["<b>Pattachitra<\/b>","Odisha"]]},{"k":"trick","h":"<span class='mn'>W flipped is M<\/span>: <b>Warli<\/b> = Maharashtra. <b>Thanda<\/b> (cold) Thangka = icy Sikkim &amp; Ladakh. <b>Gond<\/b> sits in the middle = Madhya Pradesh. <b>Kalam<\/b> (pen) writes Andhra's Kalamkari; next door, <b>Cheriyal<\/b> is Telangana's. <b>Patta<\/b> goes to Puri = Odisha. <b>Madhu<\/b> (honey) from Mithila = Bihar. <b>Phad<\/b> sings of Pabuji in the desert = Rajasthan."},{"k":"trap","h":"<b>Madhubani = Bihar<\/b>, <b>Warli = Maharashtra<\/b>, <b>Pattachitra = Odisha<\/b>, <b>Kalamkari = Andhra<\/b> — these four are the ones SSC rotates. Mughal painting <b>peaked under Jahangir<\/b> (not Shah Jahan or Akbar). <b>Yakshagana is folk theatre<\/b> from Karnataka, not a classical dance."}],"sum":["Madhubani–Bihar, Warli–Maharashtra, Pattachitra–Odisha/WB, Kalamkari–AP, Phad–Rajasthan, Gond–MP, Cheriyal–Telangana, Thangka–Sikkim/Ladakh, Manjusha–Bihar.","Mughal painting began under Humayun, flowered under Akbar, peaked under Jahangir (Ustad Mansur). Pahari: Basohli & Kangra. Rajasthani: Mewar, Bundi, Kishangarh (Bani-Thani).","Bengal School: Abanindranath Tagore (Bharat Mata), Nandalal Bose (illustrated the Constitution).","Theatre: Nautanki–UP, Tamasha–Maharashtra, Jatra–WB, Bhavai–Gujarat, Yakshagana–Karnataka, Bhaona–Assam, Swang–Haryana, Maach–MP, Koodiyattam–Kerala (UNESCO).","Puppets: Kathputli (string)–Rajasthan, Tholu Bommalata (shadow)–AP, Togalu Gombeyatta–Karnataka, Putul Nautch (rod)–WB, Pavakoothu (glove)–Kerala, Ravanachhaya–Odisha."]},
{"id":"L34","g":"art","heat":2,"title":"Literature, languages & scripts","hi":"साहित्य, भाषाएँ एवं लिपियाँ","blocks":[{"k":"hot","h":"SSC asks <b>book ↔ author<\/b> almost every shift, and since 2024 the <b>classical languages<\/b> count (now <b>11<\/b>) is a favourite. Add the <b>Eighth Schedule<\/b> number (<b>22<\/b>) and the <b>first Jnanpith<\/b>, and this lesson is pure recall marks."},{"k":"story","h":"<p>Think of Indian literature as <b>three shelves<\/b> in a library. The <b>top shelf is Sanskrit<\/b>. It begins with the grammarians — <b>Panini<\/b> wrote the rules, <b>Patanjali<\/b> explained them. Then come the playwrights: <b>Bhasa<\/b> (the oldest), <b>Shudraka<\/b>, <b>Kalidasa<\/b>, <b>Vishakhadatta<\/b> and <b>Bhavabhuti<\/b>. Next to them sit the long poems: <b>Bharavi<\/b> and <b>Magha<\/b> both took their stories from the Mahabharata. At the end are <b>Jayadeva<\/b>, the singer of Radha and Krishna, and <b>Kalhana<\/b>, the historian of Kashmir.<\/p><p>The <b>middle shelf is Persian and Urdu<\/b>. <b>Amir Khusrau<\/b> wrote for the Delhi Sultans, <b>Mirza Ghalib<\/b> for the last Mughal, and <b>Muhammad Iqbal<\/b> gave us <i>Saare Jahan Se Achha<\/i>.<\/p><p>The <b>bottom shelf is modern<\/b>: <b>Bankim Chandra<\/b> (Vande Mataram), <b>Tagore<\/b> (two national anthems — India's and Bangladesh's), <b>Premchand<\/b> (Godaan) and the Tamil poet <b>Subramania Bharati<\/b>. Beside the shelves is a box of <b>scripts<\/b>: <b>Brahmi<\/b>, the mother script, runs left to right; <b>Kharosthi<\/b> alone runs <b>right to left<\/b>. Finally, the government keeps two lists: the <b>Eighth Schedule<\/b> (22 languages) and the much shorter <b>classical languages<\/b> list (11).<\/p>"},{"k":"photos","title":"In pictures","items":[["Kalidasa","Kalidasa","Abhijnanashakuntalam"],["Rabindranath_Tagore","Rabindranath Tagore","Gitanjali · Nobel 1913"],["Bankim_Chandra_Chattopadhyay","Bankim Chandra","Anandamath"],["Premchand","Premchand","Godaan"],["Edicts_of_Ashoka","Ashoka's edicts","Brahmi script"],["Brahmi_script","Brahmi script","Read by James Prinsep"]]},{"k":"table","title":"Sanskrit authors and their works","head":["Author","Work","Remember it by"],"rows":[["<b>Bhasa<\/b>","<i>Swapnavasavadatta<\/i>, <i>Pratijnayaugandharayana<\/i>","The oldest known playwright; his 13 plays were found in Kerala by T. Ganapati Shastri in 1912"],["<b>Shudraka<\/b>","<i>Mrichchhakatika<\/i> (The Little Clay Cart)","Love of the poor Brahmin <b>Charudatta<\/b> and the courtesan <b>Vasantasena<\/b>"],["<b>Kalidasa<\/b> (recap)","Plays: <i>Abhijnanashakuntalam<\/i>, <i>Malavikagnimitram<\/i>, <i>Vikramorvashiyam<\/i>; poems: <i>Meghaduta<\/i>, <i>Raghuvamsha<\/i>, <i>Kumarasambhava<\/i>, <i>Ritusamhara<\/i>","Linked by tradition to Chandragupta II's court"],["<b>Bharavi<\/b>","<i>Kiratarjuniya<\/i>","Arjuna fights Shiva, who comes as a <i>kirata<\/i> (hunter)"],["<b>Magha<\/b>","<i>Shishupalavadha<\/i>","Krishna kills Shishupala"],["<b>Sriharsha<\/b>","<i>Naishadhiyacharita<\/i>","Story of Nala and Damayanti"],["<b>Dandin<\/b>","<i>Dashakumaracharita<\/i>, <i>Kavyadarsha<\/i>","Prose tales of ten princes"],["<b>Bhavabhuti<\/b>","<i>Uttararamacharita<\/i>, <i>Malatimadhava<\/i>, <i>Mahaviracharita<\/i>","Court of <b>Yashovarman of Kannauj<\/b>"],["<b>Vishakhadatta<\/b>","<i>Mudrarakshasa<\/i>, <i>Devichandraguptam<\/i>","Chanakya's plots for Chandragupta Maurya"],["<b>Harshavardhana<\/b>","<i>Ratnavali<\/i>, <i>Priyadarshika<\/i>, <i>Nagananda<\/i>","A king who was also a playwright"],["<b>Banabhatta<\/b>","<i>Harshacharita<\/i>, <i>Kadambari<\/i>","Harsha's court poet"],["<b>Jayadeva<\/b>","<i>Gita Govinda<\/i>","Court of <b>Lakshmana Sena<\/b> of Bengal, 12th century"],["<b>Kalhana<\/b>","<i>Rajatarangini<\/i> (1148–49 CE)","History of Kashmir in eight books (<i>tarangas<\/i>)"],["<b>Bilhana<\/b>","<i>Vikramankadevacharita<\/i>","Life of the Chalukya king Vikramaditya VI"]]},{"k":"facts","title":"Grammar, and the Persian–Urdu shelf","rows":[["<b>Panini<\/b>","<i>Ashtadhyayi<\/i> — the oldest surviving Sanskrit grammar"],["<b>Katyayana<\/b>","<i>Vartika<\/i> — notes on Panini"],["<b>Patanjali<\/b>","<i>Mahabhashya<\/i> — the 'great commentary' on Panini; the grammar trio is Panini–Katyayana–Patanjali"],["<b>Amir Khusrau<\/b>","'Tuti-i-Hind'; disciple of Nizamuddin Auliya; <i>Khazain-ul-Futuh<\/i> (Alauddin Khalji's conquests), <i>Nuh Sipihr<\/i>, <i>Qiran-us-Sadain<\/i>; wrote in Persian and Hindavi"],["<b>Mirza Ghalib<\/b> (1797–1869)","Great Urdu and Persian poet in the time of <b>Bahadur Shah Zafar<\/b>; <i>Dastanbuy<\/i> is his diary of 1857 in Delhi"],["<b>Muhammad Iqbal<\/b>","<i>Saare Jahan Se Achha<\/i> (Tarana-e-Hind, 1904); <i>Asrar-i-Khudi<\/i>; Rakesh Sharma quoted the line from space in 1984"]]},{"k":"facts","title":"Modern writers","rows":[["<b>Bankim Chandra Chattopadhyay<\/b>","<i>Durgeshnandini<\/i> (1865), <i>Kapalkundala<\/i>, <i>Anandamath<\/i> (1882) — which carries <b>Vande Mataram<\/b>, the national song"],["<b>Rabindranath Tagore<\/b>","Wrote <b>Jana Gana Mana<\/b> (first sung at the Calcutta Congress, <b>27 Dec 1911<\/b>; adopted <b>24 Jan 1950<\/b>) and <b>Amar Shonar Bangla<\/b> (1905, now Bangladesh's anthem)"],["<b>Premchand<\/b>","Real name <b>Dhanpat Rai Srivastava<\/b>; 'Upanyas Samrat'; novels <i>Godaan<\/i> (1936), <i>Gaban<\/i>, <i>Nirmala<\/i>, <i>Rangbhoomi<\/i>; stories <i>Kafan<\/i>, <i>Idgah<\/i>; early Urdu collection <i>Soz-e-Watan<\/i> was seized by the British"],["<b>Subramania Bharati<\/b>","Tamil 'Mahakavi'; <i>Panchali Sabatham<\/i>, <i>Kuyil Pattu<\/i>, <i>Kannan Pattu<\/i>"],["<b>Bharatendu Harishchandra<\/b>","Father of modern Hindi literature"],["<b>Jaishankar Prasad<\/b> / <b>Maithili Sharan Gupt<\/b>","<i>Kamayani<\/i> / <i>Bharat-Bharati<\/i> (Gupt is called 'Rashtrakavi')"]]},{"k":"table","title":"Scripts","head":["Script","Direction · region","Note"],"rows":[["<b>Indus script<\/b>","Harappan seals","Still <b>undeciphered<\/b>"],["<b>Brahmi<\/b>","<b>Left to right<\/b>; all over India","Mother of most Indian scripts; most Ashokan edicts; read by James Prinsep, 1837"],["<b>Kharosthi<\/b>","<b>Right to left<\/b>; north-west (Gandhara)","Grew from Aramaic; used in Ashoka's Shahbazgarhi and Mansehra edicts"],["<b>Sharada<\/b>","Left to right; <b>Kashmir<\/b>","Grew out of Gupta-period Brahmi; used for Kashmiri and Sanskrit"],["<b>Grantha<\/b>","Left to right; <b>Tamil country<\/b>","Used to write <b>Sanskrit<\/b> in the south; the Malayalam script grew from it"],["<b>Devanagari<\/b>","Left to right; north and west India","Hindi, Sanskrit, Marathi, Nepali, Konkani; Article 343 — Hindi in Devanagari is the Union's official language"],["<b>Ol Chiki<\/b>","Left to right; east India","Script for <b>Santhali<\/b>, created by Raghunath Murmu (1925)"]]},{"k":"info","title":"Scripts at a glance","html":"<div class=\"fam\"><div><span class=\"ic\" aria-hidden=\"true\">❓<\/span><b>Indus script<\/b><span class=\"n\">Harappan seals<\/span><small>Still undeciphered<\/small><\/div><div><span class=\"ic\" aria-hidden=\"true\">➡️<\/span><b>Brahmi<\/b><span class=\"n\">Left to right · all over India<\/span><small>Mother of most Indian scripts; most Ashokan edicts; read by James Prinsep, 1837<\/small><\/div><div><span class=\"ic\" aria-hidden=\"true\">⬅️<\/span><b>Kharosthi<\/b><span class=\"n\">Right to left · north-west (Gandhara)<\/span><small>Grew from Aramaic; used in Ashoka's Shahbazgarhi and Mansehra edicts<\/small><\/div><div><span class=\"ic\" aria-hidden=\"true\">➡️<\/span><b>Sharada<\/b><span class=\"n\">Left to right · Kashmir<\/span><small>Grew out of Gupta-period Brahmi; used for Kashmiri and Sanskrit<\/small><\/div><div><span class=\"ic\" aria-hidden=\"true\">➡️<\/span><b>Grantha<\/b><span class=\"n\">Left to right · Tamil country<\/span><small>Used to write Sanskrit in the south; the Malayalam script grew from it<\/small><\/div><div><span class=\"ic\" aria-hidden=\"true\">➡️<\/span><b>Devanagari<\/b><span class=\"n\">Left to right · north and west India<\/span><small>Hindi, Sanskrit, Marathi, Nepali, Konkani; Article 343 — Hindi in Devanagari is the Union's official language<\/small><\/div><div><span class=\"ic\" aria-hidden=\"true\">➡️<\/span><b>Ol Chiki<\/b><span class=\"n\">Left to right · east India<\/span><small>Script for Santhali, created by Raghunath Murmu (1925)<\/small><\/div><\/div>","cap":"Only Kharosthi runs right to left (it grew from Aramaic). Brahmi is the mother of most Indian scripts; James Prinsep read it in 1837."},{"k":"tl","title":"Languages and awards — the dates","rows":[["1950","Eighth Schedule begins with <b>14<\/b> languages"],["1954","<b>Sahitya Akademi<\/b> set up (12 March)"],["1965","First <b>Jnanpith Award<\/b> — <b>G. Sankara Kurup<\/b> (Malayalam) for <i>Odakkuzhal<\/i>"],["1967","<b>Sindhi<\/b> added (21st Amendment) → 15"],["1992","<b>Konkani, Manipuri, Nepali<\/b> added (71st Amendment) → 18"],["2003","<b>Bodo, Dogri, Maithili, Santhali<\/b> added (92nd Amendment) → <b>22<\/b>"],["2004","<b>Tamil<\/b> — the first classical language"],["2005","<b>Sanskrit<\/b>"],["2008","<b>Telugu<\/b> and <b>Kannada<\/b>"],["2013","<b>Malayalam<\/b>"],["2014","<b>Odia<\/b> — the sixth"],["Oct 2024","<b>Marathi, Pali, Prakrit, Assamese, Bengali<\/b> — total <b>11<\/b>"]]},{"k":"trick","h":"<b>Classical languages in order<\/b>: <span class=\"mn\">T-S-TK-M-O<\/span> — 'Tea, Sugar, Two Kettles, More Oranges' = Tamil 2004, Sanskrit 2005, Telugu + Kannada 2008, Malayalam 2013, Odia 2014. The 2024 five: <span class=\"mn\">MAP-PB<\/span> — Marathi, Assamese, Pali, Prakrit, Bengali.<br><b>92nd Amendment four<\/b>: <span class=\"mn\">B-D-M-S<\/span> — 'Big Dogs Make Sounds' = Bodo, Dogri, Maithili, Santhali."},{"k":"trick","h":"<b>Mahabharata poems<\/b>: <b>Bha<\/b>ravi → Arjuna (<b>Bha<\/b>rat's hero); <b>Ma<\/b>gha → <b>Ma<\/b>dhava (Krishna) kills Shishupala.<br><b>Ra<\/b>ma plays go to <b>Bha<\/b>vabhuti — <span class=\"mn\">Uttara-RAMA = BhavabhUti<\/span>."},{"k":"trap","h":"<b>Swapnavasavadatta = Bhasa<\/b>, <b>Mrichchhakatika = Shudraka<\/b> — SSC swaps them. <b>Kiratarjuniya (Bharavi)<\/b> and <b>Shishupalavadha (Magha)<\/b> are both Mahabharata epics — don't flip them. <b>Saare Jahan Se Achha is Iqbal<\/b>, not Ghalib. <b>22 languages<\/b> are in the Eighth Schedule, but only <b>11 are classical<\/b>; <b>Odia (2014)<\/b> was already classical before the 2024 batch. <b>Kharosthi<\/b> is the one script that runs right to left."}],"sum":["Bhasa wrote Swapnavasavadatta; Shudraka wrote Mrichchhakatika; Bharavi wrote Kiratarjuniya; Magha wrote Shishupalavadha; Dandin wrote Dashakumaracharita; Bhavabhuti wrote Uttararamacharita.","Panini wrote the Ashtadhyayi and Patanjali the Mahabhashya; Jayadeva wrote the Gita Govinda and Kalhana the Rajatarangini.","Amir Khusrau served the Delhi Sultans, Ghalib lived under Bahadur Shah Zafar, and Iqbal wrote Saare Jahan Se Achha; Tagore wrote both Jana Gana Mana and Amar Shonar Bangla.","Brahmi runs left to right and Kharosthi right to left; Sharada belongs to Kashmir and Grantha was used for Sanskrit in the Tamil country.","The Eighth Schedule has 22 languages (Bodo, Dogri, Maithili, Santhali added in 2003); there are 11 classical languages, Tamil first in 2004; the first Jnanpith went to G. Sankara Kurup in 1965."]}
];

["L28","Channapatna, famous for wooden toys, is in:",["Karnataka","Tamil Nadu","Andhra Pradesh","Kerala"],"Channapatna toys, with their lacquer finish, hold a GI tag.",""],
["L26","Kathakali is traditionally performed by:",["Male dancers only","Female dancers only","Mixed couples only","Children only"],"Kathakali is an all-male dance-drama of Kerala with elaborate chutti make-up; Mohiniyattam is the women's solo form.",""],
["L26","Which is the oldest gharana of Khayal singing?",["Gwalior","Kirana","Agra","Jaipur-Atrauli"],"The Gwalior gharana of Haddu and Hassu Khan is the oldest Khayal gharana.",""],
["L26","How many melakartas or parent scales are recognised in Carnatic music?",["72","36","108","64"],"Carnatic theory arranges ragas under 72 melakartas, while Hindustani music works with main ragas and their raginis.",""],
["L26","Zakir Hussain is a celebrated exponent of the:",["Tabla","Sarangi","Sitar","Mridangam"],"Zakir Hussain, son of Alla Rakha, is a tabla maestro; Ram Narayan is the great sarangi player.",""],
["L26","In Indian dance theory, 'Nritta' means:",["Pure rhythmic movement without expression","Expressive dance conveying meaning","Dance-drama with a story","Vigorous masculine dance"],"Nritta is pure rhythm, Nritya is expressive dance and Natya is dance-drama; Tandava is the vigorous mode.",""],
["L27","The Kandariya Mahadeva temple, the finest Nagara temple of its group, is at:",["Khajuraho","Konark","Bhubaneswar","Deogarh"],"It stands at Khajuraho, built by the Chandelas. Konark has the Sun temple and Bhubaneswar the Lingaraja.",""],
["L27","The Kailasanatha temple at Kanchipuram belongs to which style?",["Dravida","Nagara","Vesara","Hoysala"],"It is a Pallava temple in the southern Dravida style; the rock-cut Kailasa temple at Ellora is a different monument.",""],
["L27","Which caves in Madhya Pradesh have Buddhist paintings very similar to those at Ajanta?",["Bagh","Barabar","Badami","Sittanavasal"],"The Bagh caves carry Buddhist murals of the Ajanta type. Barabar in Bihar holds the oldest rock-cut caves.",""],
["L27","The Jain paintings at Sittanavasal are in:",["Tamil Nadu","Karnataka","Odisha","Maharashtra"],"Sittanavasal in Tamil Nadu has Jain murals; Udayagiri and Khandagiri in Odisha are Jain caves without such paintings.",""],
["L27","The umbrella-shaped element crowning a stupa is called the:",["Chhatra","Torana","Medhi","Pradakshina Patha"],"Above the anda sit the harmika, the yashti and the chhatra; the torana is the gateway and the medhi the base.",""],
["L27","The Victoria Memorial and the Writers' Building are landmarks of:",["Kolkata","Mumbai","Chennai","New Delhi"],"Both are in Kolkata. The Gateway of India and CST are in Mumbai, and Rashtrapati Bhavan in New Delhi.",""],
["L28","Pithora painting is a ritual wall art of which communities?",["The Rathwa and Bhil of Gujarat and Madhya Pradesh","The Santhals of Jharkhand","The Gonds of Chhattisgarh","The Warlis of Maharashtra"],"Pithora paintings of ritual horses are made by Rathwa and Bhil households; Warli art is white geometric figures.",""],
["L28","Cheriyal scroll painting belongs to:",["Telangana","Andhra Pradesh","Karnataka","Odisha"],"Cheriyal scrolls, with their bright red backgrounds, come from Telangana; Kalamkari belongs to Andhra Pradesh.",""],
["L28","Dhokra, a traditional metal-casting craft, is associated with:",["Chhattisgarh and West Bengal","Karnataka","Rajasthan","Kerala"],"Dhokra uses the lost-wax method. Bidriware is the metal inlay craft of Bidar in Karnataka.",""],
["L28","Therukoothu is a folk theatre form of:",["Tamil Nadu","Kerala","Karnataka","Andhra Pradesh"],"Therukoothu is Tamil street theatre; Yakshagana belongs to Karnataka and Burrakatha to Andhra Pradesh.",""],
["L28","Raja Ravi Varma, famous for his oil paintings on Indian themes, belonged to:",["Kerala","Bengal","Maharashtra","Tamil Nadu"],"Ravi Varma was from Kerala. The Bengal School was led by Abanindranath Tagore.",""],
["L34","'Swapnavasavadatta' is a Sanskrit play by:",["Bhasa","Shudraka","Bhavabhuti","Dandin"],"Bhasa, the oldest known Sanskrit playwright, wrote Swapnavasavadatta. Shudraka wrote Mrichchhakatika, a frequent swap.","p"],
["L34","The Sanskrit play 'Mrichchhakatika' (The Little Clay Cart) was written by:",["Shudraka","Bhasa","Kalidasa","Harshavardhana"],"Shudraka's play tells of Charudatta and Vasantasena. Do not confuse it with Bhasa's Swapnavasavadatta.","p"],
["L34","'Kiratarjuniya', in which Arjuna fights Shiva disguised as a hunter, was composed by:",["Bharavi","Magha","Sriharsha","Kalidasa"],"Bharavi wrote Kiratarjuniya; Magha wrote the other Mahabharata epic, Shishupalavadha.","p"],
["L34","'Shishupalavadha' is the work of:",["Magha","Bharavi","Banabhatta","Bilhana"],"Magha's epic tells of Krishna killing Shishupala. Bharavi's Kiratarjuniya is the poem it is usually swapped with.",""],
["L34","'Dashakumaracharita', the prose tales of ten princes, was written by:",["Dandin","Bhavabhuti","Shudraka","Bilhana"],"Dandin wrote Dashakumaracharita and the poetics text Kavyadarsha.",""],
["L34","Which play about the later life of Rama was written by Bhavabhuti?",["Uttararamacharita","Raghuvamsha","Mudrarakshasa","Ratnavali"],"Bhavabhuti, at Yashovarman's court in Kannauj, wrote Uttararamacharita. Raghuvamsha is Kalidasa's poem.",""],
["L34","Jayadeva, the author of the Gita Govinda, was a poet at the court of:",["Lakshmana Sena of Bengal","Harshavardhana","Krishnadeva Raya","Chandragupta II"],"Jayadeva lived in 12th-century Bengal under the Sena king Lakshmana Sena.",""],
["L34","Which of these is NOT one of the five great Sanskrit epics (Mahakavyas)?",["Mrichchhakatika","Raghuvamsha","Kiratarjuniya","Naishadhiyacharita"],"The five Mahakavyas are Raghuvamsha, Kumarasambhava, Kiratarjuniya, Shishupalavadha and Naishadhiyacharita. Mrichchhakatika is a play.",""],
["L34","Which pair of play and author is correctly matched?",["Ratnavali – Harshavardhana","Malatimadhava – Kalidasa","Meghaduta – Bhasa","Dashakumaracharita – Magha"],"Harsha wrote Ratnavali, Priyadarshika and Nagananda. Malatimadhava is Bhavabhuti's, Meghaduta Kalidasa's and Dashakumaracharita Dandin's.",""],
["L34","'Saare Jahan Se Achha' was written by:",["Muhammad Iqbal","Mirza Ghalib","Amir Khusrau","Faiz Ahmad Faiz"],"Iqbal wrote it in 1904 as Tarana-e-Hind. Ghalib is the usual wrong answer.","p"],
["L34","'Dastanbuy', an eyewitness diary of Delhi during the revolt of 1857, was written by:",["Mirza Ghalib","Muhammad Iqbal","Sir Syed Ahmad Khan","Bahadur Shah Zafar"],"Ghalib kept this Persian diary of 1857; Sir Syed wrote a separate essay on the causes of the revolt.",""],
["L34","Amir Khusrau's 'Khazain-ul-Futuh' describes the conquests of:",["Alauddin Khalji","Balban","Muhammad bin Tughlaq","Iltutmish"],"Khazain-ul-Futuh records Alauddin Khalji's campaigns, including those in the south.",""],
["L34","'Jana Gana Mana' was first sung in 1911 at the Congress session held at:",["Calcutta","Bombay","Lahore","Lucknow"],"It was first sung at the Calcutta session on 27 December 1911 and adopted as the anthem on 24 January 1950.","p"],
["L34","Besides India's national anthem, Rabindranath Tagore also wrote the national anthem of:",["Bangladesh","Nepal","Myanmar","Bhutan"],"Tagore wrote Amar Shonar Bangla in 1905; it became Bangladesh's national anthem.",""],
["L34","The Hindi novel 'Godaan' was written by:",["Premchand","Jaishankar Prasad","Maithili Sharan Gupt","Bharatendu Harishchandra"],"Premchand (Dhanpat Rai Srivastava) wrote Godaan in 1936. Jaishankar Prasad wrote Kamayani.","p"],
["L34","The poet Subramania Bharati, author of 'Panchali Sabatham', wrote in:",["Tamil","Telugu","Malayalam","Kannada"],"Bharati is the Tamil 'Mahakavi'; Panchali Sabatham retells the Draupadi story.",""],
["L34","Which ancient Indian script was written from right to left?",["Kharosthi","Brahmi","Sharada","Grantha"],"Kharosthi, derived from Aramaic, ran right to left. Brahmi and the scripts that grew from it run left to right.",""],
["L34","The Sharada script was used mainly in:",["Kashmir","Tamil Nadu","Assam","Gujarat"],"Sharada developed in Kashmir for Kashmiri and Sanskrit; Grantha was the southern script used for Sanskrit.",""],
["L34","How many languages are there in the Eighth Schedule of the Constitution?",["22","18","14","24"],"There were 14 in 1950; three amendments raised the number to 22. The figure of 11 is the classical languages list.","p"],
["L34","Which language was NOT added to the Eighth Schedule by the 92nd Amendment (2003)?",["Nepali","Bodo","Dogri","Santhali"],"The 92nd Amendment added Bodo, Dogri, Maithili and Santhali. Nepali came in 1992 with Konkani and Manipuri.",""],
["L34","Which was the first language to be declared a classical language of India, in 2004?",["Tamil","Sanskrit","Telugu","Kannada"],"Tamil came first in 2004, followed by Sanskrit in 2005 and Telugu and Kannada in 2008.","p"],
["L34","Arrange these classical languages in the order in which they were recognised.",["Tamil, Sanskrit, Malayalam, Odia","Sanskrit, Tamil, Odia, Malayalam","Tamil, Malayalam, Sanskrit, Odia","Sanskrit, Tamil, Malayalam, Odia"],"Tamil 2004, Sanskrit 2005, Malayalam 2013, Odia 2014. Sanskrit did not come first.",""],
["L34","The first Jnanpith Award (1965) went to:",["G. Sankara Kurup","Sumitranandan Pant","Ashapurna Devi","Kuvempu"],"G. Sankara Kurup won it for his Malayalam poems Odakkuzhal. Pant was the first Hindi winner, in 1968.","p"],
["L34","The Sahitya Akademi, India's national academy of letters, was set up in:",["1954","1961","1947","1965"],"It was set up on 12 March 1954. The Jnanpith was first given in 1965.",""],
["L35","Which group were India's first sites on the UNESCO World Heritage List, in 1983?",["Ajanta, Ellora, Agra Fort and Taj Mahal","Taj Mahal, Qutb Minar, Red Fort and Humayun's Tomb","Ajanta, Elephanta, Konark and Khajuraho","Kaziranga, Manas, Keoladeo and Sundarbans"],"Two caves of Maharashtra and two Agra monuments came first, in 1983. The natural sites came in 1985 and 1987.","p"],
["L35","India's only 'mixed' (cultural and natural) World Heritage Site is:",["Khangchendzonga National Park","Nanda Devi and Valley of Flowers","Great Himalayan National Park","Western Ghats"],"Khangchendzonga in Sikkim was inscribed in 2016 as a mixed site. The other three are natural sites.","p"],
["L35","Keoladeo National Park, a natural World Heritage Site, is in:",["Rajasthan","Gujarat","Madhya Pradesh","Haryana"],"Keoladeo, the old Bharatpur bird sanctuary, is in Rajasthan, not Gujarat.","p"],
["L35","The Sundarbans National Park, a World Heritage Site, is known for:",["The largest mangrove forest and the Royal Bengal tiger","The one-horned rhinoceros","Wintering Siberian cranes","Alpine flower meadows"],"The Sundarbans in West Bengal is a mangrove delta. Rhinos mean Kaziranga and cranes mean Keoladeo.",""],
["L35","Rani ki Vav, the stepwell inscribed in 2014, is in which state?",["Gujarat","Rajasthan","Madhya Pradesh","Maharashtra"],"Rani ki Vav at Patan, Gujarat, was built in the 11th century under the Solankis. It appears on the ₹100 note.","p"],
["L35","Which World Heritage Site appears on the back of the ₹100 note issued in 2018?",["Rani ki Vav","Hampi stone chariot","Konark Sun temple","Ellora Caves"],"Rani ki Vav is on ₹100. Hampi's chariot is on ₹50, Konark's wheel on ₹10 and Ellora on ₹20.",""],
["L35","The Ramappa temple, inscribed in 2021, is in:",["Telangana","Andhra Pradesh","Karnataka","Odisha"],"The Kakatiya Rudreshwara (Ramappa) temple is in Telangana and is named after its sculptor. Andhra Pradesh is the usual trap.","p"],
["L35","Which was the first Indian city to be inscribed as a World Heritage City?",["Ahmedabad","Jaipur","Mumbai","Chandigarh"],"Ahmedabad was inscribed in 2017. Jaipur followed in 2019.","p"],
["L35","In which year was Dholavira inscribed as a World Heritage Site?",["2021","2019","2023","2014"],"Dholavira became India's first Harappan site on the list in 2021, the same year as Ramappa.",""],
["L35","The Moidams, inscribed as a World Heritage Site in 2024, are mound burials of the:",["Ahom dynasty of Assam","Koch dynasty of Bengal","Kakatiyas of Warangal","Hoysalas of Karnataka"],"The Moidams of Charaideo, Assam, were inscribed at the 2024 session held in New Delhi.","p"],
["L35","Santiniketan, inscribed in 2023, is in which state?",["West Bengal","Odisha","Bihar","Jharkhand"],"Santiniketan, Tagore's university town, is in West Bengal. The Hoysala temples were inscribed in the same year.",""],
["L35","Which of these is NOT part of the 'Mountain Railways of India' World Heritage Site?",["Matheran Light Railway","Darjeeling Himalayan Railway","Nilgiri Mountain Railway","Kalka–Shimla Railway"],"The site covers Darjeeling (1999), Nilgiri (2005) and Kalka–Shimla (2008). Matheran is not part of it.",""],
["L35","The Capitol Complex at Chandigarh, a World Heritage Site, was designed by:",["Le Corbusier","Edwin Lutyens","Herbert Baker","Charles Correa"],"It was inscribed in 2016 as part of Le Corbusier's architectural work across several countries. Lutyens designed New Delhi.",""],
["L35","Arrange these World Heritage Sites by the year they were inscribed, earliest first.",["Taj Mahal, Sanchi, Red Fort, Rani ki Vav","Sanchi, Taj Mahal, Rani ki Vav, Red Fort","Taj Mahal, Red Fort, Sanchi, Rani ki Vav","Red Fort, Taj Mahal, Sanchi, Rani ki Vav"],"Taj Mahal 1983, Sanchi 1989, Red Fort 2007, Rani ki Vav 2014.",""],
["L35","Which site-state pair is correctly matched?",["Great Himalayan National Park – Himachal Pradesh","Manas Wildlife Sanctuary – West Bengal","Champaner-Pavagadh – Rajasthan","Bhimbetka – Chhattisgarh"],"The Great Himalayan NP is in Himachal. Manas is in Assam, Champaner-Pavagadh in Gujarat and Bhimbetka in Madhya Pradesh.",""],
["L35","Which fort in Tamil Nadu is part of the 'Maratha Military Landscapes' inscribed in 2025?",["Gingee","Vellore","Dindigul","Tiruchirappalli Rock Fort"],"The site has 12 forts: 11 in Maharashtra and Gingee in Tamil Nadu.",""],
["L35","Which element was added to UNESCO's intangible cultural heritage list from India in 2023?",["Garba of Gujarat","Durga Puja in Kolkata","Kumbh Mela","Yoga"],"Garba was inscribed in 2023. Durga Puja was added in 2021, Kumbh Mela in 2017 and Yoga in 2016.","p"],
["L35","Ramman, on UNESCO's intangible heritage list, is a religious festival and ritual theatre of:",["Uttarakhand","Himachal Pradesh","Sikkim","Kerala"],"Ramman belongs to the Garhwal Himalayas in Uttarakhand and was inscribed in 2009.","p"],
["L35","Kalbelia folk songs and dances, on UNESCO's intangible list, belong to:",["Rajasthan","Gujarat","Madhya Pradesh","Punjab"],"Kalbelia of Rajasthan was inscribed in 2010 along with Mudiyettu and Chhau.","p"],
["L35","The Thatheras of Jandiala Guru, on UNESCO's intangible list, are known for:",["Brass and copper utensil making","Phulkari embroidery","Clay idol making","Wood carving"],"This Punjab craft of beaten brass and copper vessels was inscribed in 2014.",""],
["L35","Mudiyettu, a ritual dance-drama on UNESCO's intangible list, comes from:",["Kerala","Karnataka","Tamil Nadu","Goa"],"Mudiyettu of Kerala was inscribed in 2010. Koodiyattam, also from Kerala, was inscribed in 2008.",""],
["L35","Which of these is NOT on UNESCO's intangible cultural heritage list for India?",["Kathakali","Koodiyattam","Chhau","Mudiyettu"],"Kerala's Koodiyattam and Mudiyettu are listed, and so is Chhau. Kathakali is not on the list.",""],
["L35","'Durga Puja in Kolkata' was added to UNESCO's intangible heritage list in:",["2021","2017","2019","2023"],"Durga Puja was inscribed in 2021. Kumbh Mela came in 2017 and Garba in 2023.",""]

:root[data-skin] body{background-color:var(--app-bg);background-image:var(--app-pattern);background-size:var(--app-psize);background-attachment:fixed}
:root[data-skin] h1,:root[data-skin] h2{letter-spacing:-.01em}

/* ===== Desktop layout (PC / tablet landscape) ===== */
@media (min-width: 1024px){
  :root{--side:236px}
  body{padding-left:var(--side);font-size:16.5px}
  .top{border-bottom:1px solid var(--rule)}
  .top-in{max-width:1320px;padding:16px 36px}
  .brand{font-size:21px}
  .brand small{font-size:13px}
  .stat{font-size:13px}
  .wrap{max-width:1320px;padding:0 36px 56px}
  .view{padding-top:28px}
  h1{font-size:34px} h2{font-size:22px} h3{font-size:17px}

  /* bottom tab bar becomes a left sidebar */
  .nav{top:0;bottom:0;left:0;right:auto;width:var(--side);height:auto;border-top:0;border-right:1px solid var(--rule);padding:84px 14px 20px;display:block;overflow:auto}
  .nav-in{display:flex;flex-direction:column;gap:4px;height:auto;max-width:none;margin:0}
  .nav-in::before{content:"Sections";display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:0 14px 8px}
  .nav button{flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-size:15px;min-height:0;height:auto;width:100%;text-align:left}
  .nav button svg{width:20px;height:20px;flex-shrink:0}
  .nav button:hover{background:var(--sunk)}
  .nav button[aria-current="page"]{background:var(--blue-bg)}
  .nav button[aria-current="page"] span{border-bottom:0!important}

  /* home: intro beside progress */
  .hero{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);column-gap:48px;align-items:end;padding-bottom:10px}
  .hero > .eyebrow,.hero > h1,.hero > p{grid-column:1}
  .hero > .meter{grid-column:2;grid-row:3;align-self:center}
  .hero > .row{grid-column:2;grid-row:2;align-self:end}

  /* lesson reader: facts, timelines, tricks sit side by side */
  .lhead{margin-bottom:0}
  .steps{max-width:640px}
  .steps + .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .steps + .stack > .plain,.steps + .stack > .row,.steps + .stack > p,.steps + .stack > .fig,.steps + .stack > h2,.steps + .stack > .tbl{grid-column:1/-1}
  .steps + .stack > .plain{max-width:86ch;font-size:17px}
  .steps + .stack > .hot,.steps + .stack > .story{grid-column:1/-1}
  .steps + .stack > .story{max-width:none;padding:20px 24px;font-size:17.5px}
  .steps + .stack > .story p{max-width:80ch}
  .steps + .stack:not(:has(> .block ~ .block)) > .block{grid-column:1/-1}
  .block,.qcard{padding:18px 20px;border-radius:14px}

  /* quizzes and question bank */
  #lq > .stack{display:grid;grid-template-columns:minmax(0,1fr);max-width:980px;gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qt{font-size:18px}
  #plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #plist .opts{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:wrap;overflow:visible}

  /* mock test: question with the answer grid alongside */
  .mbar{top:calc(env(safe-area-inset-top,0px) + 67px)}
  .view > .qcard{max-width:1000px}
  .view > .row.between{max-width:1000px}
  .view > #msub{max-width:1000px;width:100%}
  .view > .block.stack{max-width:760px}
  .pal{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .kpis{max-width:760px}

  /* revise: summary cards and sheets in columns */
  #rv > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #rv > .stack > .grph,#rv > .stack > p,#rv > .stack > .search,#rv > .stack > .callout{grid-column:1/-1}
  #dgl,#lml,#tll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #dgl > .grph,#dgl > p,#lml > p,#tll > .grph{grid-column:1/-1}
  #rv .search,#rv > #dgl ~ .search{max-width:520px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flash{min-height:300px;max-width:760px;margin:0 auto;padding:32px 36px}
  .flash .front{font-size:22px}

  /* learn: era cards across the top */
  .eras{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}
  .les{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}

(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();

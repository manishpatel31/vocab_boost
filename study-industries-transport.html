<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>

<title>Industries &amp; Transport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Shared by every History page (built by tools/history/build.js).
   Layout: a manuscript folio — parchment paper, maroon ink, gold figures; one-column app with a bottom tab bar. */
:root{
  --paper:#f3efe4; --sheet:#fffdf6; --sunk:#e8e1cf;
  --ink:#241c14; --ink2:#5d5141; --rule:#d8cdb4;
  --blue:#7a2230; --on-blue:#ffffff; --blue-bg:#f4e2e1;
  --accent:#9a6a12; --accent-bg:#f8ecc9;
  --good:#1b6b4a; --good-bg:#ddefe4; --bad:#a8291f; --bad-bg:#f8e0dc;
  --warn-bg:#fcf0cf;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* era groups on the Learn screen */
.eras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.erac{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:grid;gap:6px}
.erac b{font-family:var(--f-display);font-size:15px;font-weight:700;line-height:1.25}
.erac .hi{font-size:12px;color:var(--ink2)}
.erac .mt{font-family:var(--f-num);font-size:11px;color:var(--ink2)}
.erac .meter{height:6px}
.erac[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.grph{display:flex;align-items:baseline;gap:8px;padding:14px 2px 4px;border-top:2px solid var(--ink);margin-top:4px}
.grph h2{font-size:17px}
.grph span{font-size:12px;color:var(--ink2);margin-left:auto;font-family:var(--f-num)}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}
.dots{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--rule);display:block}
.dots i.on{background:var(--accent)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.hot{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px;font-size:15px}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.facts.prose dd{font-weight:400;line-height:1.55}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap,.link{border-radius:var(--r);padding:12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.link{background:var(--sunk);border-color:transparent}
.trick .lab,.trap .lab,.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.link .lab{color:var(--ink2)}
.mn{font-family:var(--f-num);font-weight:600;background:var(--sheet);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.tag.src{background:var(--good-bg);color:var(--good)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:22px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
/* one-line revision rows (last week / last moment) */
.lines{display:grid;gap:0}
.lines div{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px dashed var(--rule);font-size:15px}
.lines div:first-child{border-top:0}
.lines b{font-weight:700}
.lines span{color:var(--ink2)}
.callout{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;font-size:15px}

/* plan maker */
.plancfg{display:grid;gap:12px}
.pday{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.pday > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pday > summary::-webkit-details-marker{display:none}
.pday .dno{font-family:var(--f-num);font-weight:700;font-size:13px;background:var(--sunk);border-radius:99px;padding:2px 10px;white-space:nowrap}
.pday.cur .dno{background:var(--blue);color:var(--on-blue)}
.pday.allgood .dno{background:var(--good-bg);color:var(--good)}
.pday .dt{min-width:0;font-weight:600;font-size:15px}
.pday .dt small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
.pday .dp{font-family:var(--f-num);font-size:12px;color:var(--ink2);white-space:nowrap}
.pday .body{padding:0 14px 12px;display:grid;gap:8px;border-top:1px dashed var(--rule);margin-top:2px;padding-top:10px}
.ptask{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;width:100%;font-size:15px}
.ptask .box{width:22px;height:22px;border-radius:6px;border:1.6px solid var(--rule);display:grid;place-items:center;font-size:14px;color:var(--on-blue);margin-top:1px}
.ptask[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.ptask[aria-pressed="true"] .lbl{text-decoration:line-through;color:var(--ink2)}
.ptask .lbl small{display:block;font-size:12px;color:var(--ink2);text-decoration:none}
/* the story first: plain-language opener for beginners */
.story{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;font-size:16.5px;line-height:1.65}
.story .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.story p{margin:0}
.story .key{background:var(--blue-bg);border-radius:8px;padding:8px 12px;font-size:15px;line-height:1.5}
.story .key b{color:var(--blue)}
/* hub: app cards and the beginner path */
.appcs{display:grid;gap:12px}
.appc{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;text-align:left;width:100%;cursor:pointer}
.appc:hover{border-color:var(--blue)}
.appc .hd{display:flex;align-items:center;gap:10px}
.appc .ic{font-size:26px;line-height:1}
.appc .hd b{font-family:var(--f-display);font-size:17px;font-weight:700;display:block}
.appc .hd small{font-size:12px;color:var(--ink2)}

{"id":"T1","heat":3,"title":"Iron and steel","hi":"लोहा और इस्पात उद्योग","blocks":[{"k":"hot","h":"Asked again and again: <b>which plant is in which state<\/b>, and <b>which country helped build it<\/b> — <b>Bhilai<\/b> (USSR), <b>Rourkela<\/b> (West Germany), <b>Durgapur<\/b> (UK), <b>Bokaro<\/b> (USSR). Also <b>TISCO 1907<\/b> at Jamshedpur."},{"k":"story","h":"<p>India's modern steel story begins in <b>1907<\/b>, when the Tatas set up the <b>Tata Iron and Steel Company (TISCO)<\/b> at Sakchi — the town that became <b>Jamshedpur<\/b>. Steel flowed from 1912. In <b>1923<\/b> the Mysore state started the iron works at <b>Bhadravati<\/b>, named after M. Visvesvaraya.<\/p><p>After independence the <b>Second Five-Year Plan<\/b> (1956–61) built three big public-sector plants with foreign help: <b>Bhilai<\/b> (Chhattisgarh) with the <b>USSR<\/b>, <b>Rourkela<\/b> (Odisha) with <b>West Germany<\/b> and <b>Durgapur<\/b> (West Bengal) with the <b>UK<\/b>. <b>Bokaro<\/b> (Jharkhand) followed with Soviet help. In <b>1973<\/b> they were brought under the <b>Steel Authority of India Ltd (SAIL)<\/b>.<\/p>","key":"TISCO 1907 Jamshedpur; Bhilai–USSR, Rourkela–Germany, Durgapur–UK, Bokaro–USSR; SAIL 1973."},{"k":"facts","title":"Steel at a glance (as of 2025–26)","rows":[["First iron works","Bengal Iron Works, Kulti (West Bengal), 1870"],["First large integrated plant","TISCO, Jamshedpur, 1907 (private)"],["Steel Authority of India Ltd (SAIL)","Set up in 1973; headquarters New Delhi"],["Plants of the Second Plan","Bhilai, Rourkela, Durgapur"],["Raw materials","Iron ore, coking coal and limestone — so most plants sit in the Chota Nagpur plateau belt"],["India in the world","The second-largest crude steel producer (after China), as of 2024–25"],["National Steel Policy 2017","Target: 300 million tonnes of capacity by 2030–31"]]},{"k":"table","title":"Steel plants and their states","head":["Plant","State","Remember"],"rows":[["Tata Steel (TISCO), Jamshedpur","Jharkhand","India's first {"id":"T2","heat":2,"title":"Textiles and agro-based industries","hi":"वस्त्र और कृषि-आधारित उद्योग","blocks":[{"k":"hot","h":"Favourites: <b>first cotton mill<\/b> (Fort Gloster 1818, first successful Mumbai 1854), <b>first jute mill<\/b> (Rishra 1855), <b>Manchester of India<\/b> (Ahmedabad), and the <b>leading state<\/b> for sugarcane (UP), jute (West Bengal) and silk (Karnataka)."},{"k":"story","h":"<p>Cotton textiles are India's oldest modern industry. A first mill at <b>Fort Gloster<\/b> near Kolkata (1818) failed. The first <b>successful<\/b> one was the <b>Bombay Spinning and Weaving Company<\/b> in <b>Mumbai<\/b> (1854), started by <b>Cowasji Nanabhai Davar<\/b>. Ahmedabad got its first mill in 1861 and grew into the <b>“Manchester of India”<\/b>; Coimbatore became the Manchester of South India.<\/p><p><b>Jute<\/b>, the “golden fibre”, has its mills along the <b>Hooghly<\/b> in West Bengal — the first at <b>Rishra<\/b> in 1855. <b>Sugar<\/b> is the next biggest agro-industry; <b>Uttar Pradesh<\/b> grows the most sugarcane. <b>Karnataka<\/b> leads mulberry silk, <b>Jharkhand<\/b> tasar silk, and golden <b>muga<\/b> silk comes only from <b>Assam<\/b>.<\/p>","key":"Cotton: Mumbai 1854 (first success); jute: Rishra 1855; sugarcane — UP; mulberry silk — Karnataka; muga — Assam."},{"k":"table","title":"Firsts of Indian industry","head":["First","Place","Note"],"rows":[["First cotton mill (it failed)","Fort Gloster, near Kolkata","Set up in 1818."],["First successful modern cotton mill","Mumbai","Bombay Spinning and Weaving Company, 1854, by Cowasji Nanabhai Davar."],["First cotton mill of Ahmedabad","Ahmedabad","1861, by Ranchhodlal Chhotalal."],["First jute mill","Rishra, near Kolkata","1855, on the Hooghly river."],["First iron works (Bengal Iron Works)","Kulti, West Bengal","1870 — later part of IISCO."],["First large integrated steel plant","Jamshedpur","Tata Iron and Steel Company, 1907."]]},{"k":"table","title":"Which state leads?","head":["Crop / industry" and failed — the first <b>successful<\/b> one was in <b>Mumbai<\/b> (1854). <b>Ludhiana<\/b> is famous for woollen hosiery, <b>Tiruppur<\/b> for cotton knitwear."}],"sum":["First cotton mill: Fort Gloster near Kolkata (1818, failed); first successful: Mumbai (1854).","First jute mill: Rishra on the Hooghly (1855); West Bengal leads jute.","Uttar Pradesh grows the most sugarcane; sugar is the second biggest agro-industry.","Karnataka leads mulberry silk, Jharkhand tasar silk; muga silk comes only from Assam.","Textile towns: Tiruppur knitwear, Ludhiana hosiery, Surat synthetics, Bhagalpur silk, Panipat handloom."],"part":["Part 1 · Industries of India","भारत के उद्योग"],"g":"it"},
{"id":"T3","heat":3,"title":"Cement, fertiliser and petroleum","hi":"सीमेंट, उर्वरक और पेट्रोलियम","blocks":[{"k":"hot","h":"The star facts: <b>Digboi<\/b> (Assam, 1901) is India's <b>oldest<\/b> refinery; <b>Jamnagar<\/b> (Gujarat, Reliance) is the <b>world's largest<\/b> refining complex; <b>Mumbai High<\/b> is the biggest offshore oil field; <b>Sindri<\/b> is the old fertiliser giant."},{"k":"story","h":"<p>Oil was struck at <b>Digboi<\/b> in Assam in 1889, and its refinery opened in <b>1901<\/b> — India's oldest still working. That is why <b>Assam<\/b> has four refineries: Digboi, <b>Guwahati<\/b> (Noonmati, the first public-sector refinery, 1962), <b>Bongaigaon<\/b> and <b>Numaligarh<\/b>. Big new oil came from <b>Ankleshwar<\/b> (Gujarat) and, in 1974, from <b>Mumbai High<\/b> under the Arabian Sea.<\/p><p>Today the biggest refinery is <b>Reliance's Jamnagar<\/b> complex in Gujarat. The first <b>cement<\/b> factory came up at <b>Madras (Chennai)<\/b> in 1904, the first <b>fertiliser<\/b> plant at <b>Ranipet<\/b> in 1906, and the big public-sector fertiliser plant at <b>Sindri<\/b> (Jharkhand) in 1951. In 2021 IFFCO opened the world's first <b>nano urea<\/b> plant at <b>Kalol<\/b>, Gujarat.<\/p>","key":"Digboi oldest (1901); Jamnagar largest; Assam has 4 refineries; Mumbai High offshore; first cement Chennai 1904; Sindri 1951."},{"k":"table","title":"Oil refineries and their states","head":["Refinery","State","Remember"],"rows":[["Digboi","Assam","India's oldest operating refinery (1901)."],["Guwahati (Noonmati)","Assam","India's first public-sector refinery (1962)."],["Bongaigaon","Assam",""],["Numaligarh","Assam","Came out of the Assam Accord (1985)."],["Barauni","Bihar","Built with Soviet help (1964)."],["Koyali (Gujarat Refinery)","Gujarat","Near Vadodara."],["Jamnagar (Reliance)","Gujarat","The world's largest single-site refinery complex."],["Vadinar (Nayara)","Gujarat",""],["Mathura","Uttar Pradesh","Its smoke was blamed for harm to the Taj Mahal."],["Panipat","Haryana",""],["Bathinda (Guru Gobind Singh Refinery)","Punjab",""],["Bina","Madhya Pradesh",""],["Haldia","West Bengal",""],["Paradip","Odisha","Started in 2016."],["Kochi","Kerala",""],["Mangaluru (MRPL)","Karnataka",""],["Visakhapatnam","Andhra Pradesh",""],["Manali (Chennai)","Tamil Nadu",""]]},{"k":"table","title":"Oil and gas fields","head":["Field","Where","Note"],"rows":[["Mumbai High","Arabian Sea (off Maharashtra)","India's largest offshore oil field, found in 1974."],["Ankleshwar","Gujarat","Oil found in 1958–60."],["Naharkatiya","Assam",""],["Mangala (Barmer basin)","Rajasthan","India's biggest onshore find of recent times."],["Krishna-Godavari (KG) basin","Andhra Pradesh","Rich in natural gas."]]},{"k":"table","title":"Cement and fertiliser firsts","head":["First","Place","Note"],"rows":[["India's first cement factory (1904)","Chennai","Made by South India Industries Ltd at Madras."],["India's first fertiliser factory (1906)","Ranipet (Tamil Nadu)","A superphosphate plant."],["First big public-sector fertiliser plant (1951)","Sindri (Jharkhand)","Run by the Fertilizer Corporation of India."],["World's first nano urea plant (2021)","Kalol (Gujarat)","Run by IFFCO."]]},{"k":"facts","title":"Who runs what (as of 2026)","rows":[["Indian Oil Corporation (IOCL)","Runs Digboi, Guwahati, Barauni, Koyali, Haldia, Mathura, Panipat, Bongaigaon and Paradip"],["Reliance Industries","Jamnagar (private)"],["ONGC","Oil and Natural Gas Corporation, founded 1956; HQ New Delhi"],["Strategic petroleum reserves","Visakhapatnam, Mangaluru and Padur (Udupi)"],["Cement","India is the world's second-largest cement maker (after China)"]]},{"k":"trick","h":"<b>“Digboi = Daddy (oldest), Jamnagar = Jumbo (largest)”<\/b>. Assam's four refineries: <b>“Don't Go Beyond Numaligarh”<\/b> — Digboi, Guwahati, Bongaigaon, Numaligarh."},{"k":"trap","h":"<b>Digboi<\/b> is the oldest refinery, but the first <b>public-sector<\/b> refinery is <b>Guwahati<\/b>. <b>Mathura<\/b> refinery is in Uttar Pradesh (the Taj Mahal worry), <b>Panipat<\/b> in Haryana, <b>Bathinda<\/b> in Punjab. <b>Mumbai High<\/b> is offshore, not in Mumbai city."}],"sum":["Digboi (Assam, 1901) is India's oldest working refinery; Guwahati (1962) the first public-sector one.","Jamnagar (Gujarat, Reliance) is the world's largest single-site refinery complex.","Assam has four refineries: Digboi, Guwahati, Bongaigaon, Numaligarh.","Mumbai High (1974) is the largest offshore field; Ankleshwar is in Gujarat.","First cement factory: Chennai 1904; first fertiliser: Ranipet 1906; Sindri 1951; nano urea: Kalol 2021."],"part":["Part 1 · Industries of India","भारत के उद्योग"],"g":"it"},
{"id":"T4","heat":2,"title":"Aircraft, ships, cars, IT — and city nicknames","hi":"विमान, जहाज़, वाहन, आईटी और शहरों के उपनाम","blocks":[{"k":"hot","h":"Two question types: <b>“Where is X made?”<\/b> (HAL Bengaluru, Cochin Shipyard, Mazagon Dock Mumbai) and <b>“Which city is called …?”<\/b> — Manchester of India (Ahmedabad), Silicon Valley (Bengaluru), Detroit of Asia (Chennai), Steel City (Jamshedpur)."},{"k":"story","h":"<p>In 1940 the industrialist <b>Walchand Hirachand<\/b> started Hindustan Aircraft in <b>Bengaluru<\/b>; as <b>HAL<\/b> it now builds the <b>Tejas<\/b> fighter, with plants at Nashik, Koraput and a helicopter factory at <b>Tumakuru<\/b>. Warships come from <b>Mazagon Dock<\/b> (Mumbai), <b>Garden Reach<\/b> (Kolkata) and <b>Cochin Shipyard<\/b>, which built <b>INS Vikrant<\/b>. In 2024 a <b>Tata–Airbus<\/b> line at <b>Vadodara<\/b> began assembling C-295 transport planes.<\/p><p>Cars changed when the <b>Maruti 800<\/b> rolled out at <b>Gurugram<\/b> in 1983. Chennai's car plants earned it the name <b>“Detroit of Asia”<\/b>, and Bengaluru's software parks made it the <b>“Silicon Valley of India”<\/b>. Many towns are known by one craft: <b>Moradabad<\/b> brass, <b>Aligarh<\/b> locks, <b>Firozabad<\/b> glass bangles, <b>Bhadohi<\/b> carpets.<\/p>","key":"HAL — Bengaluru; Vikrant — Cochin Shipyard; Maruti 800 — Gurugram 1983; Detroit of Asia — Chennai; Silicon Valley — Bengaluru."},{"k":"table","title":"Where is it made?","head":["Factory / unit","City","Note"],"rows":[["Hindustan Aeronautics Ltd (HAL) headquarters","Bengaluru","Founded in 1940 as Hindustan Aircraft by Walchand Hirachand; HAL since 1964. Builds the Tejas."],["HAL's Sukhoi Su-30MKI plant","Nashik",""],["HAL's aero-engine factory","Koraput","In Odisha."],["HAL's helicopter factory (2023)","Tumakuru","India's biggest helicopter factory, in Karnataka."],["Tata–Airbus C-295 aircraft assembly line (2024)","Vadodara","India's first private-sector military aircraft assembly line."],["Cochin Shipyard","Kochi","Built INS Vikrant, India's first home-made aircraft carrier."],["Mazagon Dock Shipbuilders","Mumbai","Builds submarines and destroyers."],["Garden Reach Shipbuilders","Kolkata",""],["Hindustan Shipyard","Visakhapatnam","Started in 1941 as the Scindia shipyard."],["Goa Shipyard","Vasco da Gama",""],["Maruti Suzuki's first car plant (1983)","Gurugram","The Maruti 800 rolled out in December 1983."],["Tata Nano car plant","Sanand","In Gujarat — moved there from Singur (West Bengal) in 2008."],["Heavy Engineering Corporation","Ranchi",""],["Bharat Electronics Ltd (BEL) headquarters","Bengaluru",""]]},{"k":"table","title":"Industrial nicknames","head":["Nickname","City","Note"],"rows":[["Manchester of India","Ahmedabad","For its cotton mills."],["Manchester of South India","Coimbatore",""],["Manchester of North India","Kanpur","Also called the 'Manchester of the East'."],["Cottonopolis of India","Mumbai",""],["Steel City of India","Jamshedpur","Also called Tatanagar."],["Silicon Valley of India","Bengaluru","Also the 'Garden City'."],["Detroit of Asia","Chennai","For its car factories."],["Diamond City of India","Surat",""],["Coal Capital of India","Dhanbad",""],["Brass City","Moradabad","Also called 'Peetal Nagri'."],["Lock City","Aligarh",""],["Glass City (City of Bangles)","Firozabad",""],["Carpet City","Bhadohi",""],["Sandalwood City","Mysuru",""],["Knitwear Capital of India","Tiruppur",""],["Tea City of India","Dibrugarh",""]]},{"k":"facts","title":"Engineering and IT (as of 2026)","rows":[["Tejas","Light combat aircraft built by HAL, Bengaluru"],["INS Vikrant","Commissioned in 2022 — built at Cochin Shipyard"],["Big car hubs","Chennai, Pune (Chakan), Gurugram–Manesar, Sanand, Pithampur"],["Software Technology Parks of India (STPI)","Set up in 1991"],["Big IT hubs","Bengaluru, Hyderabad (HITEC City), Pune, Chennai, Noida–Gurugram"],["Electronic City","An IT park in Bengaluru"]]},{"k":"trick","h":"<b>Three Manchesters by compass<\/b>: West = <b>A<\/b>hmedabad, South = <b>C<\/b>oimbatore, North = <b>K<\/b>anpur — <b>“ACK!”<\/b>. Craft towns of UP: <b>“My Aunt Finds Bangles”<\/b> — Moradabad brass, Aligarh locks, Firozabad bangles, Bhadohi carpets."},{"k":"trap","h":"<b>Detroit of Asia<\/b> is <b>Chennai<\/b>, not Pune. <b>Kanpur<\/b> is the Manchester of North India — <b>Coimbatore<\/b> is the Manchester of South India. The Tata <b>Nano<\/b> plant moved from Singur (West Bengal) to <b>Sanand<\/b> (Gujarat)."}],"sum":["HAL (1940) is in Bengaluru; Su-30MKI at Nashik, engines at Koraput, helicopters at Tumakuru.","Cochin Shipyard built INS Vikrant; Mazagon Dock (Mumbai) builds submarines.","The Maruti 800 rolled out at Gurugram in 1983; the Tata–Airbus C-295 line is at Vadodara (2024).","Manchester of India — Ahmedabad; of South India — Coimbatore; of North India — Kanpur.","Silicon Valley — Bengaluru; Detroit of Asia — Chennai; Steel City — Jamshedpur; Brass City — Moradabad."],"part":["Part 1 · Industries of India","भारत के उद्योग"],"g":"it"},
{"id":"T5","heat":3,"title":"Indian Railways: zones and factories","hi":"भारतीय रेलवे: ज़ोन और कारख़ाने","blocks":[{"k":"hot","h":"The commonest railway question: <b>“The headquarters of X Railway is at …?”<\/b> — and its reverse. Learn the 17 zones, especially the tricky ones: <b>Hajipur<\/b> (East Central), <b>Hubballi<\/b> (South Western), <b>Bilaspur<\/b> (South East Central), <b>Gorakhpur<\/b> (North Eastern), <b>Maligaon<\/b> (NF)."},{"k":"story","h":"<p>Indian Railways is run by the <b>Railway Board<\/b> (1905) under the Ministry of Railways. In <b>1951<\/b> the old company railways were merged into zones — Southern, Central and Western came first. Today there are <b>17 zones<\/b>, counting the <b>Metro Railway, Kolkata<\/b>. Kolkata has three headquarters (Eastern, South Eastern, Metro); Mumbai has two (Central at CSMT, Western at Churchgate).<\/p><p>Engines and coaches come from its own factories: <b>Chittaranjan<\/b> (CLW, 1950) for electric engines, <b>Varanasi<\/b> (BLW, once the Diesel Locomotive Works), <b>ICF Chennai<\/b> for coaches and Vande Bharat trains, <b>Kapurthala<\/b> and <b>Raebareli<\/b> for coaches, and <b>Yelahanka<\/b> for wheels.<\/p>","key":"17 zones; tricky HQs: Hajipur, Hubballi, Bilaspur, Gorakhpur, Maligaon, Jabalpur, Prayagraj; ICF Chennai; CLW Chittaranjan; BLW Varanasi."},{"k":"table","title":"Railway zones and headquarters","head":["Zone","Headquarters","Note"],"rows":[["Northern Railway","New Delhi","At Baroda House."],["North Eastern Railway","Gorakhpur",""],["Northeast Frontier Railway","Maligaon (Guwahati)",""],["Eastern Railway","Kolkata","At Fairlie Place."],["South Eastern Railway","Kolkata","At Garden Reach."],["Metro Railway, Kolkata","Kolkata","The only metro run as a zone of Indian Railways."],["Central Railway","Mumbai","At Chhatrapati Shivaji Maharaj Terminus (CSMT)."],["Western Railway","Mumbai","At Churchgate."],["Southern Railway","Chennai",""],["South Central Railway","Secunderabad",""],["South Western Railway","Hubballi",""],["North Western Railway","Jaipur",""],["West Central Railway","Jabalpur",""],["North Central Railway","Prayagraj",""],["South East Central Railway","Bilaspur","In Chhattisgarh."],["East Coast Railway","Bhubaneswar",""],["East Central Railway","Hajipur","The only zonal headquarters in Bihar."]]},{"k":"table","title":"Railway factories","head":["Factory","Place","Note"],"rows":[["Integral Coach Factory (ICF)","Chennai","Set up in 1955; built the first Vande Bharat trains."],["Chittaranjan Locomotive Works (CLW)","Chittaranjan","West Bengal, 1950 — India's first locomotive factory."],["Banaras Locomotive Works (BLW)","Varanasi","Formerly the Diesel Locomotive Works; renamed in 2020."],["Rail Coach Factory (RCF)","Kapurthala","In Punjab."],["Modern Coach Factory (MCF)","Raebareli","In Uttar Pradesh."],["Patiala Locomotive Works (PLW)","Patiala","Formerly the Diesel Loco Modernisation Works."],["Rail Wheel Factory","Yelahanka (Bengaluru)",""],["Rail Wheel Plant","Bela (Bihar)",""],["Electric Locomotive Factory (with Alstom)","Madhepura (Bihar)","Makes 12,000-horsepower engines."]]},{"k":"facts","title":"Indian Railways at a glance (as of 2025–26)","rows":[["Ministry","Ministry of Railways; the Railway Board (1905) runs it"],["Zones","17, counting Metro Railway Kolkata"],["18th zone","South Coast Railway, Visakhapatnam — announced in 2019"],["Konkan Railway","A separate corporation; HQ at CBD Belapur, Navi Mumbai"],["Railway budget","Merged with the Union Budget in 2017"],["Network","About 68,000 route km — one of the world's largest under one management"],["National Rail Museum","New Delhi (1977)"]]},{"k":"trick","h":"Bihar has <b>H<\/b>ajipur — <b>“Hajipur Holds the East-Central Hub”<\/b>. South-West is <b>H<\/b>ubballi, South-East-Central is <b>B<\/b>ilaspur: <b>“SW-Hubli, SEC-Bilas”<\/b>. <b>North-East = Gorakhpur<\/b> (UP!), not the North-East states — those are <b>Northeast Frontier<\/b> (Maligaon)."},{"k":"trap","h":"<b>North Eastern Railway<\/b> is headquartered at <b>Gorakhpur<\/b>, while <b>Northeast Frontier Railway<\/b> is at <b>Maligaon (Guwahati)<\/b>. <b>East Coast<\/b> (Bhubaneswar) and <b>East Central<\/b> (Hajipur) are different zones. <b>South Central<\/b> is Secunderabad, not Hyderabad city."}],"sum":["Indian Railways has 17 zones, including Metro Railway Kolkata; zones began in 1951.","Kolkata: Eastern, South Eastern, Metro; Mumbai: Central (CSMT), Western (Churchgate).","Tricky HQs: North Eastern — Gorakhpur; NF — Maligaon; East Central — Hajipur; South Western — Hubballi.","Also: South East Central — Bilaspur; West Central — Jabalpur; North Central — Prayagraj; North Western — Jaipur.","Factories: ICF Chennai (coaches, Vande Bharat), CLW Chittaranjan, BLW Varanasi, RCF Kapurthala, MCF Raebareli."],"part":["Part 2 · Railways","रेलवे"],"g":"it"},
{"id":"T6","heat":3,"title":"Railway milestones and records","hi":"रेलवे के ऐतिहासिक पड़ाव और रिकॉर्ड","blocks":[{"k":"hot","h":"Always asked: <b>first passenger train — 16 April 1853<\/b>, Bori Bunder to Thane (34 km). Then the <b>first electric train (1925)<\/b>, <b>Kolkata Metro (1984)<\/b>, <b>Vande Bharat (2019)<\/b>, the <b>longest platform<\/b> (Hubballi) and the <b>UNESCO mountain railways<\/b>."},{"k":"story","h":"<p>On <b>16 April 1853<\/b> a train pulled by three engines — Sahib, Sultan and Sindh — ran <b>34 km<\/b> from <b>Bori Bunder (Mumbai) to Thane<\/b>. The east followed in 1854 (Howrah–Hooghly) and the south in 1856. The first <b>electric<\/b> train ran from Bombay VT to Kurla in <b>1925<\/b>. Kolkata opened India's first <b>metro<\/b> in <b>1984<\/b>, and in 2024 it ran the first metro <b>under a river<\/b>, the Hooghly.<\/p><p>New trains came fast: the <b>Rajdhani<\/b> (1969), the <b>Shatabdi<\/b> (1988), and in <b>2019<\/b> the home-made <b>Vande Bharat Express<\/b> (New Delhi–Varanasi), built at ICF Chennai. Freight now moves on <b>Dedicated Freight Corridors<\/b>, the <b>Chenab Bridge<\/b> carries trains to the Kashmir valley, and India's first <b>bullet train<\/b> is being built between <b>Mumbai and Ahmedabad<\/b> with Japanese help.<\/p>","key":"1853 Bombay–Thane; 1925 first electric; 1984 Kolkata Metro; 2019 Vande Bharat; bullet train Mumbai–Ahmedabad (Japan)."},{"k":"table","title":"Railway milestones","head":["Milestone","Year","Note"],"rows":[["First goods train, Roorkee to Piran Kaliyar","1851","Carried earth for the Ganga Canal works."],["First passenger train, Bori Bunder (Mumbai) to Thane","1853","16 April 1853 — 34 km, three engines named Sahib, Sultan and Sindh."],["First train in eastern India, Howrah to Hooghly","1854",""],["First train in south India, Royapuram to Wallajah Road","1856",""],["Setting up of the Railway Board","1905",""],["First electric train, Bombay VT to Kurla","1925","3 February 1925."],["Start of the zonal system (Southern, Central, Western)","1951",""],["First Rajdhani Express, New Delhi to Howrah","1969",""],["India's first metro, Kolkata","1984","24 October 1984."],["First Shatabdi Express, New Delhi to Jhansi","1988",""],["Full opening of the Konkan Railway","1998","Roha to Thokur along the west coast."],["Delhi Metro's first line","2002",""],["Merger of the railway budget with the Union Budget","2017",""],["First Vande Bharat Express, New Delhi to Varanasi","2019","15 February 2019."],["First Namo Bharat (RRTS) section, Sahibabad to Duhai","2023",""],["First underwater metro, under the Hooghly in Kolkata","2024","Esplanade to Howrah Maidan."]]},{"k":"table","title":"Railway records","head":["Record","Where / what","Note"],"rows":[["India's longest railway platform","Hubballi (Karnataka)","Shree Siddharoodha Swamiji station, about 1,507 m (2023)."],["World's highest railway arch bridge","Chenab Bridge (Jammu and Kashmir)","About 359 m above the river; opened in June 2025."],["India's first vertical-lift sea bridge","New Pamban Bridge (Tamil Nadu)","Opened in April 2025, to Rameswaram."],["India's highest railway station","Ghum (West Bengal)","On the Darjeeling Himalayan Railway."],["India's longest rail-cum-road bridge","Bogibeel Bridge (Assam)","Over the Brahmaputra, 2018."],["India's first water metro","Kochi (Kerala)","Started in April 2023."],["World's oldest working steam engine","Fairy Queen","Built in 1855."],["India's first bullet train route (under construction)","Mumbai–Ahmedabad","508 km, with Japan's Shinkansen technology."]]},{"k":"table","title":"Mountain railways","head":["Railway","State","Note"],"rows":[["Darjeeling Himalayan Railway","West Bengal","UNESCO World Heritage, 1999 — the 'Toy Train'."],["Nilgiri Mountain Railway","Tamil Nadu","UNESCO, 2005 — Mettupalayam to Udhagamandalam (Ooty)."],["Kalka–Shimla Railway","Himachal Pradesh","UNESCO, 2008."],["Matheran Hill Railway","Maharashtra","On UNESCO's tentative list."],["Kangra Valley Railway","Himachal Pradesh","Pathankot to Joginder Nagar."]]},{"k":"facts","title":"New corridors and trains (as of October 2026)","rows":[["Eastern Dedicated Freight Corridor","Ludhiana (Sahnewal) to Sonnagar (Bihar), about 1,337 km — fully running"],["Western Dedicated Freight Corridor","Dadri (UP) to JNPT (Navi Mumbai), about 1,506 km"],["DFCs are built by","DFCCIL (Dedicated Freight Corridor Corporation of India Ltd), set up in 2006"],["Bullet train (MAHSR)","Mumbai–Ahmedabad, 508 km; foundation stone 2017 (Modi and Shinzo Abe); run by NHSRCL; under construction"],["Namo Bharat","Delhi–Meerut regional rapid rail (RRTS) — India's first, run by NCRTC"],["Udhampur–Srinagar–Baramulla line","Completed in 2025 with the Chenab and Anji Khad bridges"],["Mission Raftaar / Kavach","Kavach is India's home-made train-collision safety system"]]},{"k":"trick","h":"<b>“53 Thane, 54 Howrah, 56 Madras”<\/b> — west, east, south in four years. Metro chain: <b>“84 Kolkata, 02 Delhi, 24 under the river”<\/b>. UNESCO hill trains in order: <b>“D-N-K” = Darjeeling 99, Nilgiri 05, Kalka 08<\/b>."},{"k":"trap","h":"The first <b>goods<\/b> train ran at <b>Roorkee<\/b> in 1851, but the first <b>passenger<\/b> train was Bombay–Thane in <b>1853<\/b>. The first Vande Bharat ran <b>New Delhi–Varanasi<\/b>, not Delhi–Katra (that was the second). The <b>Matheran<\/b> railway is not yet a UNESCO site."}],"sum":["First passenger train: 16 April 1853, Bori Bunder (Mumbai) to Thane, 34 km.","First electric train 1925 (Bombay VT–Kurla); first metro Kolkata 1984; Delhi Metro 2002; underwater metro Kolkata 2024.","Vande Bharat began in 2019 (New Delhi–Varanasi), built at ICF Chennai.","Longest platform Hubballi; highest rail arch bridge Chenab (J&K); first vertical-lift sea bridge New Pamban.","UNESCO railways: Darjeeling (1999), Nilgiri (2005), Kalka–Shimla (2008); bullet train: Mumbai–Ahmedabad."],"part":["Part 2 · Railways","रेलवे"],"g":"it"},
{"id":"T7","heat":3,"title":"Roads, tunnels and bridges","hi":"सड़कें, सुरंगें और पुल","blocks":[{"k":"hot","h":"Asked often: <b>NH-44 is the longest highway<\/b> (Srinagar–Kanyakumari); the <b>Golden Quadrilateral<\/b> joins Delhi–Mumbai–Chennai–Kolkata; the <b>Atal Tunnel<\/b> joins Manali to Lahaul-Spiti; <b>Atal Setu<\/b> is the longest sea bridge; <b>Bharatmala<\/b> (2017) is the big highway plan."},{"k":"story","h":"<p>In 1999–2001 the <b>National Highways Development Project<\/b> began with the <b>Golden Quadrilateral<\/b> — about 5,800 km of four- and six-lane highways joining <b>Delhi, Mumbai, Chennai and Kolkata<\/b> — and the <b>North–South<\/b> (Srinagar–Kanyakumari) and <b>East–West<\/b> (Porbandar–Silchar) corridors. The longest highway today is <b>NH-44<\/b>, from <b>Srinagar to Kanyakumari<\/b>. In 2017 came <b>Bharatmala Pariyojana<\/b> for economic corridors and border roads.<\/p><p>The <b>Border Roads Organisation<\/b> (BRO) cut roads through the mountains: the <b>Atal Tunnel<\/b> under Rohtang (2020) joins <b>Manali to Lahaul-Spiti<\/b>, the <b>Sela Tunnel<\/b> (2024) leads to Tawang, and <b>Umling La<\/b> in Ladakh is the world's highest motorable road. Big bridges include <b>Bhupen Hazarika Setu<\/b> and <b>Bogibeel<\/b> in Assam, and <b>Atal Setu<\/b>, India's longest sea bridge, in Mumbai.<\/p>","key":"NH-44 Srinagar–Kanyakumari; GQ Delhi–Mumbai–Chennai–Kolkata; Atal Tunnel Manali–Lahaul-Spiti (HP); Atal Setu Mumbai; Bharatmala 2017."},{"k":"table","title":"Tunnels, bridges and expressways — which state?","head":["Road / tunnel / bridge","State / UT","Remember"],"rows":[["Atal Tunnel (Rohtang)","Himachal Pradesh","9.02 km; opened October 2020 — the world's longest highway tunnel above 10,000 feet."],["Dr Syama Prasad Mookerjee Tunnel (Chenani–Nashri)","Jammu and Kashmir","About 9.3 km; opened 2017."],["Sonamarg (Z-Morh) Tunnel","Jammu and Kashmir","Opened January 2025 — keeps Sonamarg open all year."],["Sela Tunnel","Arunachal Pradesh","Opened March 2024 — on the road to Tawang."],["Bhupen Hazarika Setu (Dhola–Sadiya Bridge)","Assam","Over the Lohit, about 9.15 km, opened 2017."],["Bogibeel Bridge","Assam","Rail-cum-road bridge over the Brahmaputra, 2018."],["Atal Setu (Mumbai Trans Harbour Link)","Maharashtra","About 21.8 km — India's longest sea bridge, opened January 2024."],["Mahatma Gandhi Setu","Bihar","Over the Ganga between Patna and Hajipur (1982)."],["Sudarshan Setu (Okha–Beyt Dwarka)","Gujarat","India's longest cable-stayed bridge, opened February 2024."],["Samruddhi Mahamarg (Mumbai–Nagpur Expressway)","Maharashtra",""],["Purvanchal Expressway","Uttar Pradesh","Lucknow to Ghazipur."],["Umling La road (world's highest motorable road)","Ladakh","Built by the BRO at about 19,000 feet."]]},{"k":"table","title":"From where to where?","head":["Road","Runs","Note"],"rows":[["NH-44 (India's longest national highway)","Srinagar to Kanyakumari","Runs north–south through 11 states and UTs; it was old NH-7 in the south."],["East–West Corridor","Porbandar to Silchar","Part of the NHDP."],["Yamuna Expressway","Greater Noida to Agra",""],["Bundelkhand Expressway","Chitrakoot to Etawah",""],["Atal Tunnel route","Manali to Lahaul-Spiti",""],["Atal Setu route","Sewri to Nhava Sheva",""]]},{"k":"facts","title":"Road facts (as of 2025–26)","rows":[["Golden Quadrilateral","Delhi–Mumbai–Chennai–Kolkata, about 5,846 km; phase 1 of the NHDP"],["NHAI","National Highways Authority of India — Act of 1988, working since 1995"],["Bharatmala Pariyojana","Approved in 2017; economic corridors, border and coastal roads"],["PMGSY","Pradhan Mantri Gram Sadak Yojana, started 25 December 2000 — village roads"],["Border Roads Organisation","Set up in 1960; built the Atal and Sela tunnels and Umling La road"],["FASTag","Made compulsory at toll plazas in February 2021"],["Road network","India has the world's second-largest road network (after the USA)"]]},{"k":"trick","h":"<b>“44 goes from Snow to Sea”<\/b> — Srinagar (snow) to Kanyakumari (sea). Golden Quadrilateral = the four old metros: <b>“D-M-C-K”<\/b>, <b>“Do Make Chai, Kaka”<\/b>. <b>Atal<\/b> has two: <b>Atal Tunnel<\/b> (Himachal) and <b>Atal Setu<\/b> (Mumbai)."},{"k":"trap","h":"<b>Atal Tunnel<\/b> is in Himachal Pradesh, not J&K — <b>Chenani–Nashri<\/b> and <b>Sonamarg<\/b> are the J&K tunnels. <b>Bhupen Hazarika Setu<\/b> is over the <b>Lohit<\/b>; <b>Bogibeel<\/b> is over the <b>Brahmaputra<\/b>. <b>Mahatma Gandhi Setu<\/b> is in Patna, Bihar."}],"sum":["NH-44 (Srinagar–Kanyakumari) is India's longest national highway.","Golden Quadrilateral joins Delhi, Mumbai, Chennai and Kolkata; East–West corridor Porbandar to Silchar.","Atal Tunnel (HP, 2020) joins Manali and Lahaul-Spiti; Sela Tunnel (Arunachal, 2024); Chenani–Nashri (J&K, 2017).","Atal Setu (Mumbai, 2024) is India's longest sea bridge; Sudarshan Setu (Gujarat) its longest cable-stayed bridge.","Bharatmala 2017; PMGSY 2000; BRO 1960; Umling La (Ladakh) is the world's highest motorable road."],"part":["Part 3 · Roads, ports, air and waterways","सड़क, बंदरगाह, वायु और जलमार्ग"],"g":"it"},
{"id":"T8","heat":3,"title":"Seaports","hi":"बंदरगाह","blocks":[{"k":"hot","h":"India has <b>13 major ports<\/b> (as of 2026). Questions ask the <b>state<\/b> of a port and its special feature: <b>Kandla/Deendayal<\/b> (tidal), <b>Kolkata<\/b> (only riverine), <b>Visakhapatnam<\/b> (deepest land-locked), <b>Mumbai<\/b> (natural harbour), and the new <b>Vizhinjam<\/b> (Kerala) transshipment port."},{"k":"story","h":"<p>India's coast is about 7,500 km long. On the <b>east<\/b> coast stand <b>Kolkata–Haldia<\/b> (on the Hooghly, the only river port), <b>Paradip<\/b>, <b>Visakhapatnam<\/b>, <b>Kamarajar (Ennore)<\/b>, <b>Chennai<\/b> and <b>V. O. Chidambaranar (Tuticorin)<\/b>. On the <b>west<\/b> coast are <b>Cochin<\/b>, <b>New Mangalore<\/b>, <b>Mormugao<\/b>, <b>Mumbai<\/b>, <b>Jawaharlal Nehru Port (Nhava Sheva)<\/b> and <b>Deendayal (Kandla)<\/b>. <b>Port Blair<\/b> became the 13th major port in 2010.<\/p><p><b>Kandla<\/b> was built after Partition to replace Karachi; it is a <b>tidal port<\/b>, renamed <b>Deendayal Port<\/b> in 2017. In May 2025 <b>Vizhinjam<\/b> near Thiruvananthapuram opened as India's first deep-water <b>transshipment<\/b> port, and a new major port at <b>Vadhavan<\/b> (Maharashtra) is being built.<\/p>","key":"13 major ports: 6 east + 6 west + Port Blair; Kandla = Deendayal (tidal); Kolkata only riverine; Vizhinjam 2025 transshipment."},{"k":"table","title":"Ports and their states","head":["Port","State / UT","Remember"],"rows":[["Syama Prasad Mookerjee Port (Kolkata, with Haldia)","West Bengal","India's only riverine major port, on the Hooghly."],["Paradip Port","Odisha",""],["Visakhapatnam Port","Andhra Pradesh","India's deepest land-locked, protected harbour."],["Kamarajar Port (Ennore)","Tamil Nadu","India's first corporatised major port."],["V. O. Chidambaranar Port (Tuticorin)","Tamil Nadu",""],["Cochin Port","Kerala","On Willingdon Island."],["New Mangalore Port","Karnataka","Exports Kudremukh iron ore."],["Mormugao Port","Goa","Mainly iron-ore exports."],["Mumbai Port","Maharashtra","A natural harbour."],["Deendayal Port (Kandla)","Gujarat","A tidal port in the Gulf of Kutch."],["Port Blair Port (Sri Vijaya Puram)","Andaman and Nicobar Islands","Became a major port in 2010."],["Vizhinjam International Seaport","Kerala","India's first deep-water container transshipment port, opened May 2025."],["Mundra Port","Gujarat","India's largest private port (Adani)."],["Vadhavan Port (under construction)","Maharashtra","Approved in 2024 as a new major port."],["Dhamra Port","Odisha",""],["Krishnapatnam Port","Andhra Pradesh",""]]},{"k":"table","title":"Which port is it?","head":["Clue","Port","Note"],"rows":[["India's only riverine major port","Kolkata","On the Hooghly, about 200 km from the sea."],["A tidal port in the Gulf of Kutch","Deendayal (Kandla)","Built after Partition, when Karachi went to Pakistan."],["Deepest land-locked and protected harbour","Visakhapatnam",""],["First corporatised major port","Kamarajar (Ennore)",""],["Called the 'Queen of the Arabian Sea'","Kochi",""],["Exports iron ore from Kudremukh","New Mangalore",""],["Largest container port among the major ports","Jawaharlal Nehru Port (Nhava Sheva)","Navi Mumbai."]]},{"k":"facts","title":"Port facts (as of 2026)","rows":[["Major ports","13 — under the Major Port Authorities Act, 2021"],["East coast major ports","Kolkata, Paradip, Visakhapatnam, Kamarajar, Chennai, V. O. Chidambaranar"],["West coast major ports","Cochin, New Mangalore, Mormugao, Mumbai, Jawaharlal Nehru, Deendayal"],["Renamed","Kandla → Deendayal (2017); Kolkata → Syama Prasad Mookerjee (2020); Tuticorin → V. O. Chidambaranar (2011)"],["Port Blair","Renamed Sri Vijaya Puram in 2024"],["Sagarmala","Port-led development plan, approved in 2015"],["Maritime India Vision","Plan for ports to 2030 (2021)"]]},{"k":"trick","h":"West coast top to bottom: <b>“Kids Must Join Mom's Nice Cake”<\/b> — Kandla, Mumbai, JNPT, Mormugao, New Mangalore, Cochin. East coast bottom to top: <b>“Tea, Coffee, Kamarajar's Vada Pao Kolkata”<\/b> — Tuticorin, Chennai, Kamarajar, Vizag, Paradip, Kolkata."},{"k":"trap","h":"<b>Vizhinjam<\/b> is in <b>Kerala<\/b> (near Thiruvananthapuram), not Andhra. <b>Mundra<\/b> is a big private port, not a major port. <b>Kamarajar<\/b> (Ennore) and <b>Chennai<\/b> are two different major ports in the same city region."}],"sum":["India has 13 major ports: six on each coast plus Port Blair.","Deendayal (Kandla), Gujarat, is a tidal port; Kolkata is the only riverine major port.","Visakhapatnam has the deepest land-locked harbour; Mumbai is a natural harbour; Kamarajar was the first corporatised port.","Mormugao (Goa) and New Mangalore export iron ore; Paradip is in Odisha.","Vizhinjam (Kerala, 2025) is India's first deep-water transshipment port; Vadhavan (Maharashtra) is coming up."],"part":["Part 3 · Roads, ports, air and waterways","सड़क, बंदरगाह, वायु और जलमार्ग"],"g":"it"},
{"id":"T9","heat":2,"title":"Airports and aviation","hi":"हवाई अड्डे और विमानन","blocks":[{"k":"hot","h":"Airport names are a favourite: <b>“Lokpriya Gopinath Bordoloi Airport is in …?”<\/b> (Guwahati), <b>Biju Patnaik<\/b> (Bhubaneswar), <b>Birsa Munda<\/b> (Ranchi). Also firsts: <b>J. R. D. Tata's first flight (1932)<\/b>, <b>Cochin's solar airport<\/b>, <b>UDAN<\/b>."},{"k":"story","h":"<p>Indian civil aviation began on <b>15 October 1932<\/b>, when <b>J. R. D. Tata<\/b> flew mail from <b>Karachi to Bombay<\/b> — the start of Tata Airlines, later <b>Air India<\/b>. Today the <b>Airports Authority of India<\/b> (1995) runs most airports, and <b>Indira Gandhi International (Delhi)<\/b> is the busiest.<\/p><p>Most airports are named after great Indians of their state: <b>Kempegowda<\/b> (Bengaluru's founder), <b>Lokpriya Gopinath Bordoloi<\/b> (Assam's first chief minister), <b>Biju Patnaik<\/b>, <b>Birsa Munda<\/b>, <b>Raja Bhoj<\/b>, <b>Devi Ahilyabai Holkar<\/b>. <b>Cochin<\/b> became the world's first fully <b>solar-powered<\/b> airport in 2015, and the <b>UDAN<\/b> scheme (first flight 2017, Shimla–Delhi) brought flights to small towns.<\/p>","key":"JRD Tata 1932 Karachi–Bombay; AAI 1995; Delhi IGI busiest; Cochin first solar airport; UDAN 2017."},{"k":"table","title":"Airports and their cities","head":["Airport","City","Remember"],"rows":[["Indira Gandhi International Airport","Delhi","India's busiest airport."],["Chhatrapati Shivaji Maharaj International Airport","Mumbai",""],["Kempegowda International Airport","Bengaluru",""],["Rajiv Gandhi International Airport","Hyderabad",""],["Netaji Subhas Chandra Bose International Airport","Kolkata",""],["Sardar Vallabhbhai Patel International Airport","Ahmedabad",""],["Chaudhary Charan Singh International Airport","Lucknow",""],["Lokpriya Gopinath Bordoloi International Airport","Guwahati",""],["Biju Patnaik International Airport","Bhubaneswar",""],["Sri Guru Ram Dass Jee International Airport","Amritsar",""],["Devi Ahilyabai Holkar Airport","Indore",""],["Raja Bhoj Airport","Bhopal",""],["Jay Prakash Narayan Airport","Patna",""],["Birsa Munda Airport","Ranchi",""],["Dr Babasaheb Ambedkar International Airport","Nagpur",""],["Swami Vivekananda Airport","Raipur",""],["Veer Savarkar International Airport","Sri Vijaya Puram (Port Blair)",""],["Maharishi Valmiki International Airport","Ayodhya","Opened December 2023."],["Manohar International Airport (Mopa)","North Goa","Opened December 2022."],["Kushok Bakula Rimpochee Airport","Leh","One of the world's highest commercial airports."],["Cochin International Airport","Kochi","World's first fully solar-powered airport (2015)."]]},{"k":"facts","title":"Aviation facts (as of 2026)","rows":[["First commercial flight","J. R. D. Tata, Karachi to Bombay (Juhu), 15 October 1932"],["Air India","Nationalised 1953; returned to the Tata group in January 2022"],["Airports Authority of India","Set up in 1995; HQ New Delhi"],["DGCA","Directorate General of Civil Aviation — the safety regulator"],["UDAN","Ude Desh ka Aam Nagrik — regional flights; first flight Shimla–Delhi, April 2017"],["Highest airfield","Daulat Beg Oldie (Ladakh) — an Air Force landing ground"],["New airports","Mopa (Goa, 2022), Ayodhya (2023), Navi Mumbai (inaugurated October 2025)"]]},{"k":"trick","h":"<b>“Gopinath Guards Guwahati, Biju Builds Bhubaneswar, Birsa Rules Ranchi”<\/b>. Two Rajas: <b>Raja Bhoj — Bhopal<\/b>, <b>Devi Ahilyabai — Indore<\/b> (both MP)."},{"k":"trap","h":"<b>Chaudhary Charan Singh<\/b> airport is in <b>Lucknow<\/b>, not Meerut. <b>Jay Prakash Narayan<\/b> airport is Patna; <b>Birsa Munda<\/b> is Ranchi. Goa has two airports — <b>Dabolim<\/b> and <b>Mopa (Manohar)<\/b>."}],"sum":["J. R. D. Tata flew India's first commercial flight, Karachi–Bombay, on 15 October 1932.","Indira Gandhi International (Delhi) is India's busiest airport; AAI was set up in 1995.","Lokpriya Gopinath Bordoloi — Guwahati; Biju Patnaik — Bhubaneswar; Birsa Munda — Ranchi; Jay Prakash Narayan — Patna.","Raja Bhoj — Bhopal; Devi Ahilyabai Holkar — Indore; Chaudhary Charan Singh — Lucknow; Kempegowda — Bengaluru.","Cochin is the world's first fully solar-powered airport (2015); UDAN's first flight was Shimla–Delhi (2017)."],"part":["Part 3 · Roads, ports, air and waterways","सड़क, बंदरगाह, वायु और जलमार्ग"],"g":"it"},
{"id":"T10","heat":2,"title":"Inland waterways and pipelines","hi":"अंतर्देशीय जलमार्ग और पाइपलाइन","blocks":[{"k":"hot","h":"Learn the five old National Waterways: <b>NW-1<\/b> Ganga (Prayagraj–Haldia, longest), <b>NW-2<\/b> Brahmaputra (Sadiya–Dhubri), <b>NW-3<\/b> West Coast Canal (Kerala), <b>NW-4<\/b> Krishna–Godavari, <b>NW-5<\/b> Brahmani–Mahanadi. For pipelines: <b>HBJ<\/b> carries <b>gas<\/b>."},{"k":"story","h":"<p>The <b>Inland Waterways Authority of India<\/b> (IWAI, 1986, HQ <b>Noida<\/b>) looks after river transport. <b>NW-1<\/b> on the Ganga–Bhagirathi–Hooghly, from <b>Prayagraj to Haldia<\/b> (about 1,620 km), is the longest; <b>NW-2<\/b> runs on the Brahmaputra from <b>Sadiya to Dhubri<\/b>. The <b>National Waterways Act, 2016<\/b> added 106 new waterways, making <b>111<\/b> in all.<\/p><p>Oil and gas also travel by <b>pipeline<\/b>. The <b>Hazira–Bijaipur–Jagdishpur (HBJ)<\/b> line, run by <b>GAIL<\/b>, carries natural gas from Gujarat to Uttar Pradesh. India's first long crude-oil pipeline joined <b>Naharkatiya<\/b> (Assam) to <b>Barauni<\/b> (Bihar). Across borders, the <b>Motihari–Amlekhganj<\/b> pipeline (2019) feeds Nepal and the <b>Friendship Pipeline<\/b> (2023) feeds Bangladesh.<\/p>","key":"NW-1 Prayagraj–Haldia (longest); NW-2 Sadiya–Dhubri; 111 NWs (2016 Act); IWAI Noida; HBJ = gas (GAIL)."},{"k":"table","title":"The first five National Waterways","head":["Waterway","Route","Note"],"rows":[["National Waterway 1 (NW-1)","Prayagraj to Haldia","Ganga–Bhagirathi–Hooghly, about 1,620 km — India's longest; declared 1986."],["National Waterway 2 (NW-2)","Sadiya to Dhubri","Brahmaputra, about 891 km; declared 1988."],["National Waterway 3 (NW-3)","Kollam to Kottapuram","West Coast Canal in Kerala; declared 1993 (later extended to Kozhikode)."],["National Waterway 4 (NW-4)","Kakinada to Puducherry","Krishna and Godavari rivers with canals; declared 2008."],["National Waterway 5 (NW-5)","East Coast Canal with the Brahmani and Mahanadi delta","Odisha and West Bengal; declared 2008."]]},{"k":"table","title":"Pipelines and what they carry","head":["Pipeline","Carries","Note"],"rows":[["Hazira–Bijaipur–Jagdishpur (HBJ / HVJ) pipeline","Natural gas","Gujarat to Uttar Pradesh, run by GAIL — India's first big cross-country gas pipeline."],["Naharkatiya–Nunmati–Barauni pipeline","Crude oil","India's first long crude-oil pipeline, Assam to Bihar (Oil India)."],["Salaya–Mathura pipeline","Crude oil","Gujarat coast to Mathura refinery (IOCL)."],["Jamnagar–Loni pipeline","LPG","A long LPG pipeline run by GAIL."],["Motihari–Amlekhganj pipeline","Diesel and petrol","India–Nepal, 2019 — South Asia's first cross-border petroleum pipeline."],["India–Bangladesh Friendship Pipeline","Diesel (high-speed diesel)","Siliguri to Parbatipur, opened March 2023."],["Mumbai High–Uran pipeline","Crude oil and natural gas","Undersea, from the offshore field to the coast."]]},{"k":"facts","title":"Waterway facts (as of 2026)","rows":[["IWAI","Inland Waterways Authority of India, set up 1986; HQ Noida"],["National Waterways","111 under the National Waterways Act, 2016 (5 old + 106 new)"],["First multimodal terminal on NW-1","Varanasi (2018); others at Sahibganj and Haldia"],["Jal Marg Vikas Project","Upgrading NW-1 with World Bank help"],["Ganga Vilas","River cruise from Varanasi to Dibrugarh, flagged off January 2023"],["Kochi Water Metro","India's first water metro (2023)"]]},{"k":"trick","h":"<b>1-2-3-4-5 = Ganga, Brahmaputra, Kerala canal, Krishna–Godavari, Odisha canal<\/b> — <b>“Good Boys Keep Knowledge Open”<\/b>. <b>HBJ = Hot Breath of Jas (gas)<\/b>."},{"k":"trap","h":"<b>NW-1<\/b> ends at <b>Haldia<\/b>, not Kolkata or Farakka. <b>NW-2<\/b> is the Brahmaputra (Sadiya–Dhubri), not the Barak. The <b>HBJ<\/b> pipeline carries <b>natural gas<\/b>, not crude oil."}],"sum":["NW-1: Ganga–Bhagirathi–Hooghly, Prayagraj to Haldia, about 1,620 km — the longest.","NW-2: Brahmaputra, Sadiya to Dhubri; NW-3: West Coast Canal, Kerala.","NW-4: Krishna–Godavari (Kakinada–Puducherry); NW-5: Brahmani, Mahanadi delta and East Coast Canal.","The 2016 Act made 111 National Waterways; IWAI (1986) is at Noida.","HBJ pipeline (GAIL) carries natural gas; Naharkatiya–Barauni was the first long crude pipeline."],"part":["Part 3 · Roads, ports, air and waterways","सड़क, बंदरगाह, वायु और जलमार्ग"],"g":"it"}
];

/* ---------- quiz games (60 seconds) ---------- */
function labDeck(id){
  const d = LAB_CONF.decks.find(x => x.id === id);
  const ask = (pre, t) => pre ? `${pre} ${t}${/[?:]$/.test(pre) ? "" : "?"}` : t;
  let items = d.make ? d.make() : d.pairs.map(p => ({ p: ask(d.q, p[0]), a: p[1], note: p[2] || "", raw: p[0], pool: "a" }));
  if (d.rq && !d.make) {   // also ask the other way round, where an answer belongs to one prompt only
    const n = {}; d.pairs.forEach(p => { n[p[1]] = (n[p[1]] || 0) + 1; });
    items = items.concat(d.pairs.filter(p => n[p[1]] === 1).map(p => ({ p: ask(d.rq, p[1]), a: p[0], note: p[2] || "", raw: p[1], pool: "p" })));
  }
  return { d, items };
}

    <div id="labpairlist"></div></section>`;
  labBindHome();
  $("#labgo").onclick = () => labRun(id);
  $("#labpairs").onclick = () => { $("#labpairlist").innerHTML = `<div class="block"><h3>${list.length} pairs to know</h3><div class="lab-pairs">${list.map(p => `<div><span>${esc(p[0])}</span><b>${esc(p[1])}</b></div>`).join("")}</div></div>`; };
  const lb = $("#lablesson"); if (lb) lb.onclick = () => openLesson(d.lesson, "learn");
}
let LG = null;
function labRun(id){
  labStop();
  const { d, items } = labDeck(id);
  LG = { d, items: shuffle(items), i: 0, score: 0, right: 0, tried: 0, combo: 0, maxc: 0, left: 60, miss: [], lock: false };
  $("#app").innerHTML = `<section class="view stack lab-play">
    <div class="lab-hud"><button class="back" type="button" id="labquit">✕ Stop</button><span class="lab-combo" id="labcombo"></span><span class="sc" id="labscore">0</span></div>
    <div class="lab-time" id="labtime"><i style="width:100%"></i></div>
    <div class="lab-q" id="labq" aria-live="polite"></div>
    <div class="lab-opts" id="labopts"></div>
    <div class="lab-flash" id="labflash"></div></section>`;
  $("#labquit").onclick = () => { labStop(); labOver(); };
  labNext();
  LAB.timer = setInterval(() => {
    LG.left--; const t = $("#labtime"); if (!t) { labStop(); return; }
    t.firstElementChild.style.width = (LG.left / 60 * 100) + "%"; t.classList.toggle("low", LG.left <= 10);
    if (LG.left <= 0) { labStop(); labOver(); }
  }, 1000);
}
function labOptions(it){
  const d = LG.d;
  if (d.opts) return d.opts.slice();
  if (d.options) return d.options(it);
  // wrong options come from the same side of the deck as the answer (names with names, dates with dates)
  const answers = [...new Set(it.all || LG.items.filter(x => x.pool === it.pool).map(x => x.a))].filter(a => a !== it.a);
  const pool = shuffle(answers).slice(0, 3);
  return shuffle([it.a].concat(pool));
}
function labNext(){
  if (LG.i >= LG.items.length) { LG.items = shuffle(LG.items); LG.i = 0; }
  const it = LG.items[LG.i], opts = labOptions(it);
  LG.cur = it; LG.lock = false;
  const q = $("#labq"); q.innerHTML = `<span class="lab-pop">${esc(it.p)}</span>`;
  const box = $("#labopts"); box.className = "lab-opts" + (opts.length === 3 ? " three" : "");
  box.innerHTML = opts.map(o => `<button type="button" data-o="${esc(o)}">${esc(o)}</button>`).join("");
  box.querySelectorAll("button").forEach(b => b.onclick = () => labPick(b));
}
function labPick(b){
  if (LG.lock) return; LG.lock = true;
  const it = LG.cur, ok = b.dataset.o === it.a;
  LG.tried++;
  if (ok) {
    LG.right++; LG.combo++; LG.maxc = Math.max(LG.maxc, LG.combo);
    const gain = 10 + Math.min(LG.combo - 1, 5) * 2;
    LG.score += gain; b.classList.add("ok");
    $("#labflash").textContent = it.note ? it.note : "+" + gain;
  } else {
    LG.combo = 0; b.classList.add("no");
    $("#labopts").querySelectorAll("button").forEach(x => { if (x.dataset.o === it.a) x.classList.add("ok"); });
    LG.miss.push(it); $("#labflash").textContent = (it.note ? it.note + " · " : "") + "Answer: " + it.a;
  }
  $("#labscore").textContent = LG.score;
  $("#labcombo").textContent = LG.combo >= 2 ? "🔥 ×" + LG.combo : "";
  LG.i++;
  setTimeout(() => { if (LAB.timer && $("#labopts")) labNext(); }, ok ? 450 : 1200);
}
function labOver(){
  const L = labS(), id = LG.d.id, best = !L.best[id] || LG.score > L.best[id];
  if (best && LG.score > 0) L.best[id] = LG.score;
  L.xp = (L.xp || 0) + LG.right; L.plays = (L.plays || 0) + 1; save();
  const acc = LG.tried ? Math.round(LG.right * 100 / LG.tried) : 0, seen = new Set();
  const miss = LG.miss.filter(m => { if (seen.has(m.p)) return false; seen.add(m.p); return true; });
  const { r } = labRank(L.xp);
  $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}
    <div class="block lab-res lab-pop"><span class="eyebrow">${esc(LG.d.title)}</span><div class="big">${LG.score}</div>
      <p>${best && LG.score > 0 ? "🎉 New best!" : "Best: " + (L.best[id] || 0)} · ${LG.right}/${LG.tried} right (${acc}%) · longest combo ${LG.maxc} · +${LG.right} XP</p>
      <p class="muted" style="margin:0">${r[2]} ${r[1]} · ${L.xp} XP</p>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn pri" type="button" id="again">Play again</button><button class="btn" type="button" data-lab-home>More games</button></div></div>
    ${miss.length ? `<div class="block"><h3>Fix these ${miss.length}</h3><div class="lab-miss">${miss.map(m => `<div><span>${esc(m.p)}</span><b>${esc(m.a)}</b></div>`).join("")}</div></div>` : (LG.tried ? `<div class="block"><p style="margin:0">💯 No mistakes — try to beat your score.</p></div>` : "")}
  </section>`;
  labBindHome();
  $("#again").onclick = () => labRun(id);
}

/* ---------- memory match ---------- */
function labMatch(){
  labStop();
  const all = LAB_CONF.decks.find(d => d.id === LAB_CONF.match.deck).pairs, n = {};
  all.forEach(p => { n[p[1]] = (n[p[1]] || 0) + 1; });
  const pairs = shuffle(all.filter(p => n[p[1]] === 1)).slice(0, 6);
  const cards = shuffle(pairs.flatMap((p, i) => [{ k: i, t: p[0] }, { k: i, t: p[1] }]));
  const M = { cards, up: [], done: new Set(), moves: 0, t0: Date.now() };
  const draw = () => {
    $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}
      <div class="lab-hud"><div><span class="eyebrow">Memory Match</span><h2 style="margin:4px 0 0">${esc(LAB_CONF.match.title)}</h2></div><span class="sc">${M.moves} moves</span></div>
      <div class="mm">${M.cards.map((c, i) => `<button type="button" data-i="${i}" class="${M.done.has(c.k) ? "done" : M.up.includes(i) ? "up" : ""}" aria-label="${M.done.has(c.k) || M.up.includes(i) ? esc(c.t) : "Hidden card " + (i + 1)}">${M.done.has(c.k) || M.up.includes(i) ? esc(c.t) : "?"}</button>`).join("")}</div></section>`;
    labBindHome();
    $("#app").querySelectorAll(".mm button").forEach(b => b.onclick = () => flip(+b.dataset.i));
  };
  const flip = i => {
    if (M.up.length === 2 || M.up.includes(i) || M.done.has(M.cards[i].k)) return;
    M.up.push(i); draw();
    if (M.up.length === 2) {
      M.moves++;
      const [a, b] = M.up;
      if (M.cards[a].k === M.cards[b].k) { M.done.add(M.cards[a].k); M.up = []; setTimeout(() => { draw(); if (M.done.size === 6) done(); }, 250); }
      else setTimeout(() => { M.up = []; draw(); }, 900);
    }
  };
  const done = () => {
    const L = labS(), best = !L.match || M.moves < L.match; if (best) L.match = M.moves;
    L.xp = (L.xp || 0) + 12; L.plays = (L.plays || 0) + 1; save();
    $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}<div class="block lab-res lab-pop"><span class="eyebrow">Memory Match</span><div class="big">${M.moves}</div>
      <p>moves · ${Math.round((Date.now() - M.t0) / 1000)} s · ${best ? "🎉 New best!" : "Best: " + L.match + " moves"} · +12 XP</p>
      <div class="lab-pairs" style="text-align:left">${pairs.map(p => `<div><span>${esc(p[0])}</span><b>${esc(p[1])}</b></div>`).join("")}</div>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn pri" type="button" id="again">New cards</button><button class="btn" type="button" data-lab-home>More games</button></div></div></section>`;
    labBindHome(); $("#again").onclick = labMatch;
  };
  draw(); window.scrollTo(0, 0);
}


/* ---------- decks from the lessons' own tables ---------- */
/** Rows of a lesson's n-th table as [prompt, answer, note] (tags stripped), so a deck never repeats the data. */
function labRows(lessonId, n){
  const strip = s => String(s == null ? "" : s).replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&minus;/g, "−").trim();
  const l = LESSONS.find(x => x.id === lessonId), t = l ? l.blocks.filter(b => b.k === "table")[n || 0] : null;
  return t ? t.rows.map(r => [strip(r[0]), strip(r[1]), strip(r[2])]) : [];
}
/** A "grand mix" deck: a few rows from every listed deck, with each deck's own question wording. */
function labMix(decks){
  // wrong options come from the whole deck (all), so a deck drawn only once or twice in the 80 still has enough
  return shuffle(decks.flatMap(d => { const all = [...new Set(d.pairs.map(p => p[1]))];
    return d.pairs.map(p => ({ p: d.q ? `${d.q} ${p[0]}${/[?:]$/.test(d.q) ? "" : "?"}` : p[0], a: p[1], note: p[2] || "", pool: d.id, all })); })).slice(0, 80);
}

<script>
"use strict";
/* ============================================================
   Workbook engine — shared by the History and Computer Knowledge pages (tools/workbook/lib.js puts it in each one).
   APP.mode "era": a subject app with its own lessons and questions (Learn · Practice · Mock · Revise · Plan).
   APP.mode "hub": start here, a plan across a family of apps, and revision across all of them (no questions of its own).
   Optional data: APP.hub (a family hub to link to), HEATMAP (where the marks come from, by exam),
   a question's 8th field (the paper it was reported from), APP.tabs (the tabs, in order) — a tab the engine
   does not know (e.g. Chemistry's "lab") is drawn by the page's own script: render<Tab>() and, when you
   leave it, leave<Tab>().
   ============================================================ */
const HUB = APP.mode === "hub";
const EMBED = (() => { try { return window.parent !== window; } catch(e) { return true; } })();
const TABS = HUB ? ["start","plan","revise"] : (APP.tabs || ["learn","practice","mock","revise","plan"]);

/* ============================================================
   HELPERS & STATE
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hash = s => { let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5)+h + s.charCodeAt(i))|0; return "q"+(h>>>0).toString(36); };
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; };
const L = id => LESSONS.find(l => l.id === id);
const LNUM = id => LESSONS.findIndex(l => l.id === id) + 1;
const G = id => GROUPS.find(g => g.id === id) || GROUPS[0];
const A = id => APP.apps.find(a => a.id === id);
const appOf = id => (L(id) && L(id).app) || APP.id;       // in the hub, each lesson carries the app it lives in

const QS = QB.map(r => {
  const fixed = !!r[6];
  return { t:r[0], q:r[1], o:r[2], e:r[3], p:(r[4]||"").includes("p"), a: fixed ? (r[5]||0) : 0, fixed, id:hash(r[1]), src: r[7] || "" };
});
const byLesson = id => QS.filter(q => q.t === id);
const makePerm = q => q.fixed ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i));
const qCount = id => HUB ? null : byLesson(id).length;
const pCount = id => HUB ? ((APP.pcount||{})[id] || 0) : byLesson(id).filter(q=>q.p).length;

const KEY = APP.key;
let S = { ans:{}, bm:{}, les:{}, mocks:[], plan:null };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const record = (q, ok) => { S.ans[q.id] = ok ? 1 : 0; save(); renderTop(); };

/* Another History app's saved progress. Every page is on the same site, so the hub (and a
   plan) can see which lessons you have read and quizzed in the subject apps. */
function appState(a){ try { return JSON.parse(localStorage.getItem(a.key) || "{}") || {}; } catch(e) { return {}; } }
function lessonState(id){
  const owner = appOf(id);
  if (owner === APP.id) return S.les[id] || {};
  const a = A(owner); return a ? ((appState(a).les || {})[id] || {}) : {};
}
const lesDone = l => !!lessonState(l.id).done;
const heatDots = n => `<span class="dots" aria-label="Asked ${n===3?"almost every shift":n===2?"often":"now and then"}">${[1,2,3].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>`;

/* Open a lesson or a tab, here or in the History app it lives in. Inside पाठShala the
   app is asked to switch (so your session is tracked); on its own the page just navigates. */
function openApp(appId, lesson, tab){
  if (appId === APP.id) {
    if (lesson) openLesson(lesson, "learn"); else go(tab || TABS[0]);
    return;
  }
  const a = APP.hub && appId === APP.hub.id ? APP.hub : A(appId);
  if (!a) return;
  const here = () => { location.href = a.file + (lesson ? "?lesson=" + encodeURIComponent(lesson) : "") + (tab ? "#" + tab : ""); };
  if (!EMBED) return here();
  let ok = false;
  const onAck = e => { if (e.origin === location.origin && e.data && e.data.type === "shabd-open-ok") ok = true; };
  window.addEventListener("message", onAck);
  try { window.parent.postMessage({ type:"shabd-open", mod:a.id, lesson: lesson || null, tab: tab || null }, location.origin); } catch(e) {}
  setTimeout(() => { window.removeEventListener("message", onAck); if (!ok) here(); }, 700);
}
const hubLink = (before, label, tab, after) => APP.hub ? before + goLink(label, APP.hub.id, null, tab) + (after || "") : "";
const goLink = (label, appId, lesson, tab) => `<button type="button" class="golink" data-go="${esc(JSON.stringify([appId, lesson||null, tab||null]))}">${label}</button>`;
function bindGo(root){
  root.querySelectorAll("[data-go]").forEach(b => b.onclick = ev => { ev.stopPropagation(); const g = JSON.parse(b.dataset.go); openApp(g[0], g[1], g[2]); });
}

function renderTop(){
  if (HUB) {
    const done = LESSONS.filter(lesDone).length;
    $("#topstat").innerHTML = `<b>${done}</b>/${LESSONS.length} lessons<br>in ${APP.apps.length} apps`;
    return;
  }
  const ids = Object.keys(S.ans).filter(k => QS.some(q => q.id === k));
  const right = ids.filter(k => S.ans[k] === 1).length;
  const pct = ids.length ? Math.round(right*100/ids.length) : 0;
  $("#topstat").innerHTML = `<b>${ids.length}</b>/${QS.length} tried<br><b>${pct}%</b> right now`;
}

/* ============================================================
   ROUTING
   ============================================================ */
let TAB = TABS[0];
let timerId = null;
function go(tab){
  if (!TABS.includes(tab)) tab = TABS[0];
  const own = t => t.charAt(0).toUpperCase() + t.slice(1);
  if (TAB !== tab && typeof window["leave" + own(TAB)] === "function") window["leave" + own(TAB)]();
  TAB = tab;
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.tab===tab ? "page" : "false"));
  if (tab === "start") renderStart();
  if (tab === "learn") renderLearn();
  if (tab === "practice") renderPractice();
  if (tab === "mock") renderMock();
  if (tab === "revise") renderRevise();
  if (tab === "plan") renderPlan();
  if (!["start","learn","practice","mock","revise","plan"].includes(tab) && typeof window["render" + own(tab)] === "function") window["render" + own(tab)]();
  window.scrollTo(0,0);
  try { history.replaceState(null, "", location.pathname + location.search + "#" + tab); } catch(e) {}
}
document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => {
  if (TAB === "mock" && M && M.running && b.dataset.tab !== "mock") { go("mock"); showMockLeave(b.dataset.tab); return; }
  go(b.dataset.tab);
}));

/* ============================================================
   START HERE (hub)
   ============================================================ */
function renderStart(){
  const done = LESSONS.filter(lesDone).length;
  const cards = APP.apps.map(a => {
    const ls = LESSONS.filter(l => l.app === a.id), d = ls.filter(lesDone).length, it = INTROS[a.id] || {};

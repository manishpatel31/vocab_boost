{"id":"T3","heat":3,"title":"Cement, fertiliser and petroleum","hi":"सीमेंट, उर्वरक और पेट्रोलियम","blocks":[{"k":"hot","h":"The star facts: <b>Digboi<\/b> (Assam, 1901) is India's <b>oldest<\/b> refinery; <b>Jamnagar<\/b> (Gujarat, Reliance) is the <b>world's largest<\/b> refining complex; <b>Mumbai High<\/b> is the biggest offshore oil field; <b>Sindri<\/b> is the old fertiliser giant."},{"k":"story","h":"<p>Oil was struck at <b>Digboi<\/b> in Assam in 1889, and its refinery opened in <b>1901<\/b> — India's oldest still working. That is why <b>Assam<\/b> has four refineries: Digboi, <b>Guwahati<\/b> (Noonmati, the first public-sector refinery, 1962), <b>Bongaigaon<\/b> and <b>Numaligarh<\/b>. Big new oil came from <b>Ankleshwar<\/b> (Gujarat) and, in 1974, from <b>Mumbai High<\/b> under the Arabian Sea.<\/p><p>Today the biggest refinery is <b>Reliance's Jamnagar<\/b> complex in Gujarat. The first <b>cement<\/b> factory came up at <b>Madras (Chennai)<\/b> in 1904, the first <b>fertiliser<\/b> plant at <b>Ranipet<\/b> in 1906, and the big public-sector fertiliser plant at <b>Sindri<\/b> (Jharkhand) in 1951. In 2021 IFFCO opened the world's first <b>nano urea<\/b> plant at <b>Kalol<\/b>, Gujarat.<\/p>","key":"Digboi oldest (1901); Jamnagar largest; Assam has 4 refineries; Mumbai High offshore; first cement Chennai 1904; Sindri 1951."},{"k":"table","title":"Oil refineries and their states","head":["Refinery","State","Remember"],"rows":[["Digboi","Assam","India's oldest operating refinery (1901)."],["Guwahati (Noonmati)","Assam","India's first public-sector refinery (1962)."],["Bongaigaon","Assam",""],["Numaligarh","Assam","Came out of the Assam Accord (1985)."],["Barauni","Bihar","Built with Soviet help (1964)."],["Koyali (Gujarat Refinery)","Gujarat","Near Vadodara."],["Jamnagar (Reliance)","Gujarat","The world's largest single-site refinery complex."],["Vadinar (Nayara)","Gujarat",""],["Mathura","Uttar Pradesh","Its smoke was blamed for harm to the Taj Mahal."],["Pa oil fields; the giant coastal ones (Jamnagar, Vadinar) work on imported crude."},{"k":"table","title":"Oil and gas fields","head":["Field","Where","Note"],"rows":[["Mumbai High","Arabian Sea (off Maharashtra)","India's largest offshore oil field, found in 1974."],["Ankleshwar","Gujarat","Oil found in 1958–60."],["Naharkatiya","Assam",""],["Mangala (Barmer basin)","Rajasthan","India's biggest onshore find of recent times."],["Krishna-Godavari (KG) basin","Andhra Pradesh","Rich in natural gas."]]},{"k":"mapfig","title":"Oil and gas fields","pins":[["1",71.3,19.4,"Mumbai High","n"],["2",73,21.6,"Ankleshwar","n"],["3",95.33,27.28,"Naharkatiya","n"],["4",71.4,25.9,"Mangala (Barmer basin)","n"],["5",82.3,16.3,"Krishna-Godavari (KG) basin","n"]],"facts":[["1 · Mumbai High","Arabian Sea (off Maharashtra) — India's largest offshore oil field, found in 1974."],["2 · Ankleshwar","Gujarat — Oil found in 1958–60."],["3 · Naharkatiya","Assam"],["4 · Mangala (Barmer basin)","Rajasthan — India's biggest onshore find of recent times."],["5 · Krishna-Godavari (KG) basin","Andhra Pradesh — Rich in natural gas."]],"cap":"Numbers match the list. Places are approximate. Use ＋ or ⛶ to zoom in."},{"k":"table","title":"Cement and fertiliser firsts","head":["First","Place","Note"],"rows":[["India's first cement factory (1904)","Chennai","Made by South India Industries Ltd at Madras."],["India's first fertiliser factory (1906)","Ranipet (Tamil Nadu)","A superphosphate plant."],["First big public-sector fertiliser plant (1951)","Sindri (Jharkhand)","Run by the Fertilizer Corporation of India."],["World's first nano urea plant (2021)","Kalol (Gujarat)","Run by IFFCO."]]},{"k":"facts","title":"Who runs what (as of 2026)","rows":[["Indian Oil Corporation (IOCL)","Runs Digboi, Guwahati, Barauni, Koyali, Haldia, Mathura, Panipat, Bongaigaon and Paradip"],["Reliance Industries","Jamnagar (private)"],["ONGC","Oil and Natural Gas Corporation, founded 1956; HQ New Delhi"],["Strategic petroleum reserves","Visakhapatnam, Mangaluru and Padur (Udupi)"],["Cement","India is the world's second-largest cement maker (after China)"]]},{"k":"trick","h":"<b>“Digboi = Daddy (oldest), Jamnagar = Jumbo (largest)”<\/b>. Assam's four refineries: <b>“Don't Go Beyond Numaligarh”<\/b> — Digboi, Guwahati, Bongaigaon, Numaligarh."},{"k":"trap","h":"<b>Digboi<\/b> is the oldest refinery, but the first <b>public-sector<\/b> refinery is <b>Guwahati<\/b>. <b>Mathura<\/b> refinery is in Uttar Pradesh (the Taj Mahal worry), <b>Panipat<\/b> in Haryana, <b>Bathinda<\/b> in Punjab. <b>Mumbai High<\/b> is offshore, not in Mumbai city."}],"sum":["Digboi (Assam, 1901) is India's oldest working refinery; Guwahati (1962) the first public-sector one.","Jamnagar (Gujarat, Reliance) is the world's largest single-site refinery complex.","Assam has four refineries: Digboi, Guwahati, Bongaigaon, Numaligarh.","Mumbai High (1974) is the largest offshore field; Ankleshwar is in Gujarat.","First cement factory: Chennai 1904; first fertiliser: Ranipet 1906; Sindri 1951; nano urea: Kalol 2021."],"part":["Part 1 · Industries of India","भारत के उद्योग"],"g":"it"},
{"id":"T4","heat":2,"title":"Aircraft, ships, cars, IT — and city nicknames","hi":"विमान, जहाज़, वाहन, आईटी और शहरों के उपनाम","blocks":[{"k":"hot","h":"Two question types: <b>“Where is X made?”<\/b> (HAL Bengaluru, Cochin Shipyard, Mazagon Dock Mumbai) and <b>“Which city is called …?”<\/b> — Manchester of India (Ahmedabad), Silicon Valley (Bengaluru), Detroit of Asia (Chennai), Steel City (Jamshedpur)."},{"k":"story","h":"<p>In 1940 the industrialist <b>Walchand Hirachand<\/b> started Hindustan Aircraft in <b>Bengaluru<\/b>; as <b>HAL<\/b> it now builds the <b>Tejas<\/b> fighter, with plants at Nashik, Koraput and a helicopter factory at <b>Tumakuru<\/b>. Warships come from <b>Mazagon Dock<\/b> (Mumbai), <b>Garden Reach<\/b> (Kolkata) and <b>Cochin Shipyard<\/b>, which built <b>INS Vikrant<\/b>. In 2024 a <b>Tata–Airbus<\/b> line at <b>Vadodara<\/b> began assembling C-295 transport planes.<\/p><p>Cars changed when the <b>Maruti 800<\/b> rolled out at <b>Gurugram<\/b> in 1983. Chennai's car plants earned it the name <b>“Detroit of Asia”<\/b>, and Bengaluru's software parks made it the <b>“Silicon Valley of India”<\/b>. Many towns are known by one craft: <b>Moradabad<\/b> brass, <b>Aligarh<\/b> locks, <b>Firozabad<\/b> glass bangles, <b>Bhadohi<\/b> carpets.<\/p>","key":"HAL — Bengaluru; Vikrant — Cochin Shipyard; Maruti 800 — Gurugram 1983; Detroit of Asia — Chennai; Silicon Valley — Bengaluru."},{"k":"table","title":"Where is it made?","head":["Factory / unit","City","Note"],"rows":[["Hindustan Aeronautics Ltd (HAL) headquarters","Bengaluru","Founded in 1940 as Hindustan Aircraft by Walchand Hirachand; HAL since 1964. Builds the Tejas."],["HAL's Sukhoi Su-30MKI plant","Nashik",""],["HAL's aero-engine factory","Koraput","In Odisha."],["HAL's helicopter factory (2023)","Tumakuru","India's biggest helicopter factory, in Karnataka."],["Tata–Airbus C-295 aircraft assembly line (2024)","Vadodara","India's first private-sector military aircraft assembly line."],["Cochin Shipyard","Kochi","Built INS Vikrant, India's first home-made aircraft carrier."],["Mazagon Dock Shipbuilders","Mumbai","Builds submarines and destroyers."],["Garden Reach Shipbuilders","Kolkata",""],["Hindustan Shipyard","Visakhapatnam","Started in 1941 as the Scindia shipyard."],["Goa Shipyard","Vasco da Gama",""],["Maruti Suzuki's first car plant (1983)","Gurugram","The Maruti 800 rolled out in December 1983."],["Tata Nano car plant","Sanand","In Gujarat — moved there from Singur (West Bengal) in 2008."],["Heavy Engineering Corporation","Ranchi",""],["Bharat Electronics Ltd (BEL) headquarters","Bengaluru",""]]},{"k":"mapfig","title":"Where it is made","pins":[["1",77.59,12.97,"Hindustan Aeronautics Ltd (HAL) headquarters","n"],["2",73.79,20,"HAL's Sukhoi Su-30MKI plant","n"],["3",82.71,18.81,"HAL's aero-engine factory","n"],["4",77.1,13.34,"HAL's helicopter factory (2023)","n"],["5",73.18,22.31,"Tata–Airbus C-295 aircraft assembly line (2024)","n"],["6",76.27,9.93,"Cochin Shipyard","n"],["7",72.88,19.08,"Mazagon Dock Shipbuilders","n"],["8",88.36,22.57,"Garden Reach Shipbuilders","n"],["9",83.22,17.69,"Hindustan Shipyard","n"],["10",73.82,15.4,"Goa Shipyard","n"],["11",77.03,28.46,"Maruti Suzuki's first car plant (1983)","n"],["12",72.38,22.99,"Tata Nano car plant","n"],["13",85.31,23.34,"Heavy Engineering Corporation","n"],["14",77.59,12.97,"Bharat Electronics Ltd (BEL) headquarters","n"]],"facts":[["1 · Hindustan Aeronautics Ltd (HAL) headquarters","Bengaluru"],["2 · HAL's Sukhoi Su-30MKI plant","Nashik"],["3 · HAL's aero-engine factory","Koraput"],["4 · HAL's helicopter factory (2023)","Tumakuru"],["5 · Tata–Airbus C-295 aircraft assembly line (2024)","Vadodara"],["6 · Cochin Shipyard","Kochi"],["7 · Mazagon Dock Shipbuilders","Mumbai"],["8 · Garden Reach Shipbuilders","Kolkata"],["9 · Hindustan Shipyard","Visakhapatnam"],["10 · Goa Shipyard","Vasco da Gama"],["11 · Maruti Suzuki's first car plant (1983)","Gurugram"],["12 · Tata Nano car plant","Sanand"],["13 · a","Jamshedpur"],["6 · Silicon Valley of India","Bengaluru"],["7 · Detroit of Asia","Chennai"],["8 · Diamond City of India","Surat"],["9 · Coal Capital of India","Dhanbad"],["10 · Brass City","Moradabad"],["11 · Lock City","Aligarh"],["12 · Glass City (City of Bangles)","Firozabad"],["13 · Carpet City","Bhadohi"],["14 · Sandalwood City","Mysuru"],["15 · Knitwear Capital of India","Tiruppur"],["16 · Tea City of India","Dibrugarh"]],"cap":"The nickname's number sits on its city. Kanpur and Ahmedabad both earned 'Manchester' for their cotton mills."},{"k":"facts","title":"Engineering and IT (as of 2026)","rows":[["Tejas","Light combat aircraft built by HAL, Bengaluru"],["INS Vikrant","Commissioned in 2022 — built at Cochin Shipyard"],["Big car hubs","Chennai, Pune (Chakan), Gurugram–Manesar, Sanand, Pithampur"],["Software Technology Parks of India (STPI)","Set up in 1991"],["Big IT hubs","Bengaluru, Hyderabad (HITEC City), Pune, Chennai, Noida–Gurugram"],["Electronic City","An IT park in Bengaluru"]]},{"k":"trick","h":"<b>Three Manchesters by compass<\/b>: West = <b>A<\/b>hmedabad, South = <b>C<\/b>oimbatore, North = <b>K<\/b>anpur — <b>“ACK!”<\/b>. Craft towns of UP: <b>“My Aunt Finds Bangles”<\/b> — Moradabad brass, Aligarh locks, Firozabad bangles, Bhadohi carpets."},{"k":"trap","h":"<b>Detroit of Asia<\/b> is <b>Chennai<\/b>, not Pune. <b>Kanpur<\/b> is the Manchester of North India — <b>Coimbatore<\/b> is the Manchester of South India. The Tata <b>Nano<\/b> plant moved from Singur (West Bengal) to <b>Sanand<\/b> (Gujarat)."}],"sum":["HAL (1940) is in Bengaluru; Su-30MKI at Nashik, engines at Koraput, helicopters at Tumakuru.","Cochin Shipyard built INS Vikrant; Mazagon Dock (Mumbai) builds submarines.","The Maruti 800 rolled out at Gurugram in 1983; the Tata–Airbus C-295 line is at Vadodara (2024).","Manchester of India — Ahmedabad; of South India — Coimbatore; of North India — Kanpur.","Silicon Valley — Bengaluru; Detroit of Asia — Chennai; Steel City — Jamshedpur; Brass City — Moradabad."],"part":["Part 1 · Industries of India","भारत के उद्योग"],"g":"it"},
{"id":"T5","heat":3,"title":"Indian Railways: zones and factories","hi":"भारतीय रेलवे: ज़ोन और कारख़ाने","blocks":[{"k":"hot","h":"The commonest railway question: <b>“The headquarters of X Railway is at …?”<\/b> — and its reverse. Learn the 17 zones, especially the tricky ones: <b>Hajipur<\/b> (East Central), <b>Hubballi<\/b> (South Western), <b>Bilaspur<\/b> (South East Central), <b>Gorakhpur<\/b> (North Eastern), <b>Maligaon<\/b> (NF)."},{"k":"story","h":"<p>Indian Railways is run by the <b>Railway Board<\/b> (1905) under the Ministry of Railways. In <b>1951<\/b> the old company railways were merged into zones — Southern, Central and Western came first. Today there are <b>17 zones<\/b>, counting the <b>Metro Railway, Kolkata<\/b>. Kolkata has three headquarters (Eastern, South Eastern, Metro); Mumbai has two (Central at CSMT, Western at Churchgate).<\/p><p>Engines and coaches come from its own factories: <b>Chittaranjan<\/b> (CLW, 1950) for electric engines, <b>Varanasi<\/b> (BLW, once the Diesel Locomotive Works), <b>ICF Chennai<\/b> for coaches and Vande Bharat trains, <b>Kapurthala<\/b> and <b>Raebareli<\/b> for coaches, and <b>Yelahanka<\/b> for wheels.<\/p>","key":"17 zones; tricky HQs: Hajipur, Hubballi, Bilaspur, Gorakhpur, Maligaon, Jabalpur, Prayagraj; ICF Chennai; CLW Chittaranjan; BLW Varanasi."},{"k":"table","title":"Railway zones and headquarters","head":["Zone","Headquarters","Note"],"rows":[["Northern Railway","New Delhi","At Baroda House."],["North Eastern Railway","Gorakhpur",""],["Northeast Frontier Railway","Maligaon (Guwahati)",""],["Eastern Railway","Kolkata","At Fairlie Place."],["South Eastern Railway","Kolkata","At Garden Reach."],["Metro Railway, Kolkata","Kolkata","The only metro run as a zone of Indian Railways."],["Central Railway","Mumbai","At Chhatrapati Shivaji Maharaj Terminus (CSMT)."],["Western Railway","Mumbai","At Churchgate."],["Southern Railway","Chennai",""],["South Central Railway","Secunderabad",""],["South Western Railway","Hubballi",""],["North Western Railway","Jaipur",""],["West Central Railway","Jabalpur",""],["North Central Railway","Prayagraj",""],["South East Central Railway","Bilaspur","In Chhattisgarh."],["East Coast Railway","Bhubaneswar",""],["East Central Railway","Hajipur","The only zonal headquarters in Bihar."]]},{"k":"mapfig","title":"Zonal headquarters","pins":[["1",77.21,28.64,"Northern Railway","n"],["2",83.37,26.76,"North Eastern Railway","n"],["3",91.69,26.16,"Northeast Frontier Railway","n"],["4",88.36,22.57,"Eastern Railway","n"],["5",88.36,22.57,"South Eastern Railway","n"],["6",88.36,22.57,"Metro Railway, Kolkata","n"],["7",72.84,18.94,"Central Railway","n"],["8",72.84,18.94,"Western Railway","n"],["9",80.27,13.08,"Southern Railway","n"],["10",78.5,17.44,"South Central Railway","n"],["11",75.12,15.36,"South Western Railway","n"],["12",75.79,26.91,"North Western Railway","n"],["13",79.94,23.18,"West Central Railway","n"],["14",81.85,25.44,"North Central Railway","n"],["15",82.14,22.08,"South East Central Railway","n"],["16",85.82,20.3,"East Coast Railway","n"],["17",85.21,25.69,"East Central Railway","n"]],"facts":[["1 · Northern Railway","New Delhi"],["2 · North Eastern Railway","Gorakhpur"],["3 · Northeast Frontier Railway","Maligaon (Guwahati)"],["4 · Eastern Railway","Kolkata"],["5 · South Eastern Railway","Kolkata"],["6 · Metro Railway, Kolkata","Kolkata"],["7 · Central Railway","Mumbai"],["8 · Western Railway","Mumbai"],["9 · Southern Railway","Chennai"],["10 · South Central Railway","Secunderabad"],["11 · South Western Railway","Hubballi"],["12 · North Western Railway","Jaipur"],["13 · West Central Railway","Jabalpur"],["14 · North Central Railway","Prayagraj"],["15 · South East Central Railway","Bilaspur"],["16 · East Coast Railway","Bhubaneswar"],["17 · East Central Railway","Hajipur"]],"cap":"Kolkata hosts three zones (Eastern, South Eastern and Metro) and Mumbai two (Central and Western)."},{"k":"table","title":"Railway factories","head":["Factory","Place","Note"],"rows":[["Integral Coach Factory (ICF)","Chennai","Set up in 1955; built the first Vande Bharat trains."],["Chittaranjan Locomotive Works (CLW)","Chittaranjan","West Bengal, 1950 — India's first locomotive factory."],["Banaras Locomotive Works (BLW)","Varanasi","Formerly the Diesel Locomotive Works; renamed in 2020."],["Rail Coach Factory (RCF)","Kapurthala","In Punjab."],["Modern Coach Factory (MCF)","Raebareli","In Uttar Pradesh."],["Patiala Locomotive Works (PLW)","Patiala","Formerly the Diesel Loco Modernisation Works."],["Rail Wheel Factory","Yelahanka (Bengaluru)",""],["Rail Wheel Plant","Bela (Bihar)",""],["Electric Locomotive Factory (with Alstom)","Madhepura (Bihar)","Makes 12,000-horsepower engines."]]},{"k":"mapfig","title":"Railway factories","pins":[["1",80.22,13.1,"Integral Coach Factory (ICF)","n"],["2",86.87,23.87,"Chittaranjan Locomotive Works (CLW)","n"],["3",83,25.32,"Banaras Locomotive Works (BLW)","n"],["4",75.38,31.38,"Rail Coach Factory (RCF)","n"],["5",81.24,26.23,"Modern Coach Factory (MCF)","n"],["6",76.39,30.34,"Patiala Locomotive Works (PLW)","n"],["7",77.6,13.1,"Rail Wheel Factory","n"],["8",84.97,25.95,"Rail Wheel Plant","n"],["9",86.79,25.92,"Electric Locomotive Factory (with Alstom)","n"]],"facts":[["1 · Integral Coach Factory (ICF)","Chennai"],["2 · Chittaranjan Locomotive Works (CLW)","Chittaranjan"],["3 · Banaras Locomotive Works (BLW)","Varanasi"],["4 · Rail Coach Factory (RCF)","Kapurthala"],["5 · Modern Coach Factory (MCF)","Raebareli"],["6 · Patiala Locomotive Works (PLW)","Patiala"],["7 · Rail Wheel Factory","Yelahanka (Bengaluru)"],["8 · Rail Wheel Plant","Bela (Bihar)"],["9 · Electric Locomotive Factory (with Alstom)","Madhepura (Bihar)"]],"cap":"Numbers match the list. Places are approximate. Use ＋ or ⛶ to zoom in."},{"k":"photos","title":"Trains in pictures","items":[["Vande_Bharat_Express","Vande Bharat Express","Built at ICF, Chennai"],["WAG-12","WAG-12","Madhepura · 12,000 hp"],["Rajdhani_Express","Rajdhani Express","1969"],["Shatabdi_Express","Shatabdi Express","1988"]]},{"k":"facts","title":"Indian Railways at a glance (as of 2025–26)","rows":[["Ministry","Ministry of Railways; the Railway Board (1905) runs it"],["Zones","17, counting Metro Railway Kolkata"],["18th zone","South Coast Railway, Visakhapatnam — announced in 2019"],["Konkan Railway","A separate corporation; HQ at CBD Belapur, Navi Mumbai"],["Railway budget","Merged with the Union Budget in 2017"],["Network","About 68,000 route km — one of the world's largest under one management"],["National Rail Museum","New Delhi (1977)"]]},{"k":"trick","h":"Bihar has <b>H<\/b>ajipur — <b>“Hajipur Holds the East-Central Hub”<\/b>. South-West is <b>H<\/b>ubballi, South-East-Central is <b>B<\/b>ilaspur: <b>“SW-Hubli, SEC-Bilas”<\/b>. <b>North-East = Gorakhpur<\/b> (UP!), not the North-East states — those are <b>Northeast Frontier<\/b> (Maligaon)."},{"k":"trap","h":"<b>North Eastern Railway<\/b> is headquartered at <b>Gorakhpur<\/b>, while <b>Northeast Frontier Railway<\/b> is at <b>Maligaon (Guwahati)<\/b>. <b>East Coast<\/b> (Bhubaneswar) and <b>East Central<\/b> (Hajipur) are different zones. <b>South Central<\/b> is Secunderabad, not Hyderabad city."}],"sum":["Indian Railways has 17 zones, including Metro Railway Kolkata; zones began in 1951.","Kolkata: Eastern, South Eastern, Metro; Mumbai: Central (CSMT), Western (Churchgate).","Tricky HQs: North Eastern — Gorakhpur; NF — Maligaon; East Central — Hajipur; South Western — Hubballi.","Also: South East Central — Bilaspur; West Central — Jabalpur; North Central — Prayagraj; North Western — Jaipur.","Factories: ICF Chennai (coaches, Vande Bharat), CLW Chittaranjan, BLW Varanasi, RCF Kapurthala, MCF Raebareli."],"part":["Part 2 · Railways","रेलवे"],"g":"it"},
{"id":"T6","heat":3,"title":"Railway milestones and records","hi":"रेलवे के ऐतिहासिक पड़ाव और रिकॉर्ड","blocks":[{"k":"hot","h":"Always asked: <b>first passenger train — 16 April 1853<\/b>, Bori Bunder to Thane (34 km). Then the <b>first electric train (1925)<\/b>, <b>Kolkata Metro (1984)<\/b>, <b>Vande Bharat (2019)<\/b>, the <b>longest platform<\/b> (Hubballi) and the <b>UNESCO mountain railways<\/b>."},{"k":"story","h":"<p>On <b>16 April 1853<\/b> a train pulled by three engines — Sahib, Sultan and Sindh — ran <b>34 km<\/b> from <b>Bori Bunder (Mumbai) to Thane<\/b>. The east followed in 1854 (Howrah–Hooghly) and the south in 1856. The first <b>electric<\/b> train ran from Bombay VT to Kurla in <b>1925<\/b>. Kolkata opened India's first <b>metro<\/b> in <b>1984<\/b>, and in 2024 it ran the first metro <b>under a river<\/b>, the Hooghly.<\/p><p>New trains came fast: the <b>Rajdhani<\/b> (1969), the <b>Shatabdi<\/b> (1988), and in <b>2019<\/b> the home-made <b>Vande Bharat Express<\/b> (New Delhi–Varanasi), built at ICF Chennai. Freight now moves on <b>Dedicated Freight Corridors<\/b>, the <b>Chenab Bridge<\/b> carries trains to the Kashmir valley, and India's first <b>bullet train<\/b> is being built between <b>Mumbai and Ahmedabad<\/b> with Japanese help.<\/p>","key":"1853 Bombay–Thane; 1925 first electric; 1984 Kolkata Metro; 2019 Vande Bharat; bullet train Mumbai–Ahmedabad (Japan)."},{"k":"table","title":"Railway milestones","head":["Milestone","Year","Note"],"rows":[["First goods train, Roorkee to Piran Kaliyar","1851","Carried earth for the Ganga Canal works."],["First passenger train, Bori Bunder (Mumbai) to Thane","1853","16 April 1853 — 34 km, three engines named Sahib, Sultan and Sindh."],["First train in eastern India, Howrah to Hooghly","1854",""],["First train in south India, Royapuram to Wallajah Road","1856",""],["Setting up of the Railway Board","1905",""],["First electric train, Bombay VT to Kurla","1925","3 February 1925."],["Start of the zonal system (Southern, Central, Western)","1951",""],["First Rajdhani Express, New Delhi to Howrah","1969",""],["India's first metro, Kolkata","1984","24 October 1984."],["First Shatabdi Express, New Delhi to Jhansi","1988",""],["Full opening of the Konkan Railway","1998","Roha to Thokur along the west coast."],["Delhi Metro's first line","2002",""],["Merger of the railway budget with the Union Budget","2017",""],["First Vande Bharat Express, New Delhi to Varanasi","2019","15 February 2019."],["First Namo Bharat (RRTS) section, Sahibabad to Duhai","2023",""],["First underwater metro, under the Hooghly in Kolkata","2024","Esplanade to Howrah Maidan."]]},{"k":"tlfig","title":"Railway milestones","rows":[[1851,"First goods train, Roorkee to Piran Kaliyar",""],[1853,"First passenger train, Bori Bunder (Mumbai) to Thane",""],[1854,"First train in eastern India, Howrah to Hooghly",""],[1856,"First train in south India, Royapuram to Wallajah Road",""],[1905,"Setting up of the Railway Board",""],[1925,"First electric train, Bombay VT to Kurla",""],[1951,"Start of the zonal system (Southern, Central, Western)",""],[1969,"First Rajdhani Express, New Delhi to Howrah",""],[1984,"India's first metro, Kolkata",""],[1988,"First Shatabdi Express, New Delhi to Jhansi",""],[1998,"Full opening of the Konkan Railway",""],[2002,"Delhi Metro's first line",""],[2017,"Merger of the railway budget with the Union Budget",""],[2019,"First Vande Bharat Express, New Delhi to Varanasi",""],[2023,"First Namo Bharat (RRTS) section, Sahibabad to Duhai",""],[2024,"First underwater metro, under the Hooghly in Kolkata",""]],"cap":"From the first goods train (1851) and the first passenger train (16 April 1853) to the underwater metro in Kolkata."},{"k":"table","title":"Railway records","head":["Record","Where / what","Note"],"rows":[["India's longest railway platform","Hubballi (Karnataka)","Shree Siddharoodha Swamiji station, about 1,507 m (2023)."],["World's highest railway arch bridge","Chenab Bridge (Jammu and Kashmir)","About 359 m above the river; opened in June 2025."],["India's first vertical-lift sea bridge","New Pamban Bridge (Tamil Nadu)","Opened in April 2025, to Rameswaram."],["India's highest railway station","Ghum (West Bengal)","On the Darjeeling Himalayan Railway."],["India's longest rail-cum-road bridge","Bogibeel Bridge (Assam)","Over the Brahmaputra, 2018."],["India's first water metro","Kochi (Kerala)","Started in April 2023."],["World's oldest working steam engine","Fairy Queen","Built in 1855."],["India's first bullet train route (under construction)","Mumbai–Ahmedabad","508 km, with Japan's Shinkansen technology."]]},{"k":"photos","title":"Records in pictures","items":[["Chenab_Rail_Bridge","Chenab Rail Bridge","World's highest railway arch bridge"],["New_Pamban_Bridge","New Pamban Bridge","First vertical-lift sea bridge"],["Bogibeel_Bridge","Bogibeel Bridge","Longest rail-cum-road bridge"],["Ghum_railway_station","Ghum railway station","Highest station"],["Fairy_Queen","Fairy Queen","Oldest working steam engine"],["Kochi_Water_Metro","Kochi Water Metro","First water metro"]]},{"k":"table","title":"Mountain railways","head":["Railway","State","Note"],"rows":[["Darjeeling Himalayan Railway","West Bengal","UNESCO World Heritage, 1999 — the 'Toy Train'."],["Nilgiri Mountain Railway","Tamil Nadu","UNESCO, 2005 — Mettupalayam to Udhagamandalam (Ooty)."],["Kalka–Shimla Railway","Himachal Pradesh","UNESCO, 2008."],["Matheran Hill Railway","Maharashtra","On UNESCO's tentative list."],["Kangra Valley Railway","Himachal Pradesh","Pathankot to Joginder Nagar."]]},{"k":"photos","title":"Mountain railways in pictures","items":[["Darjeeling_Himalayan_Railway","Darjeeling Himalayan Railway","West Bengal"],["Nilgiri_Mountain_Railway","Nilgiri Mountain Railway","Tamil Nadu"],["Kalka–Shimla_Railway","Kalka–Shimla Railway","Himachal Pradesh"],["Matheran_Hill_Railway","Matheran Hill Railway","Maharashtra"],["Kangra_Valley_Railway","Kangra Valley Railway","Himachal Pradesh"]]},{"k":"mapfig","title":"Where the mountain railways run","pins":[["Darjeeling",88.26,27.04,"DHR · UNESCO 1999"],["Ooty",76.7,11.41,"Nilgiri · UNESCO 2005"],["Shimla",77.17,31.1,"Kalka–Shimla · UNESCO 2008","l"],["Matheran",73.27,18.99,"","l"],["Kangra",76.27,32.1,""]],"cap":"The first three are one UNESCO World Heritage site: the Mountain Railways of India."},{"k":"facts","title":"New corridors and trains (as of October 2026)","rows":[["Eastern Dedicated Freight Corridor","Ludhiana (Sahnewal) to Sonnagar (Bihar), about 1,337 km — fully running"],["Western Dedicated Freight Corridor","Dadri (UP) to JNPT (Navi Mumbai), about 1,506 km"],["DFCs are built by","DFCCIL (Dedicated Freight Corridor Corporation of India Ltd), set up in 2006"],["Bullet train (MAHSR)","Mumbai–Ahmedabad, 508 km; foundation stone 2017 (Modi and Shinzo Abe); run by NHSRCL; under construction"],["Namo Bharat","Delhi–Meerut regional rapid rail (RRTS) — India's first, run by NCRTC"],["Udhampur–Srinagar–Baramulla line","Completed in 2025 with the Chenab and Anji Khad bridges"],["Mission Raftaar / Kavach","Kavach is India's home-made train-collision safety system"]]},{"k":"trick","h":"<b>“53 Thane, 54 Howrah, 56 Madras”<\/b> — west, east, south in four years. Metro chain: <b>“84 Kolkata, 02 Delhi, 24 under the river”<\/b>. UNESCO hill trains in order: <b>“D-N-K” = Darjeeling 99, Nilgiri 05, Kalka 08<\/b>."},{"k":"trap","h":"The first <b>goods<\/b> train ran at <b>Roorkee<\/b> in 1851, but the first <b>passenger<\/b> train was Bombay–Thane in <b>1853<\/b>. The first Vande Bharat ran <b>New Delhi–Varanasi<\/b>, not Delhi–Katra (that was the second). The <b>Matheran<\/b> railway is not yet a UNESCO site."}],"sum":["First passenger train: 16 April 1853, Bori Bunder (Mumbai) to Thane, 34 km.","First electric train 1925 (Bombay VT–Kurla); first metro Kolkata 1984; Delhi Metro 2002; underwater metro Kolkata 2024.","Vande Bharat began in 2019 (New Delhi–Varanasi), built at ICF Chennai.","Longest platform Hubballi; highest rail arch bridge Chenab (J&K); first vertical-lift sea bridge New Pamban.","UNESCO railways: Darjeeling (1999), Nilgiri (2005), Kalka–Shimla (2008); bullet train: Mumbai–Ahmedabad."],"part":["Part 2 · Railways","रेलवे"],"g":"it"},
{"id":"T7","heat":3,"title":"Roads, tunnels and bridges","hi":"सड़कें, सुरंगें और पुल","blocks":[{"k":"hot","h":"Asked often: <b>NH-44 is the longest highway<\/b> (Srinagar–Kanyakumari); the <b>Golden Quadrilateral<\/b> joins Delhi–Mumbai–Chennai–Kolkata; the <b>Atal Tunnel<\/b> joins Manali to Lahaul-Spiti; <b>Atal Setu<\/b> is the longest sea bridge; <b>Bharatmala<\/b> (2017) is the big highway plan."},{"k":"story","h":"<p>In 1999–2001 the <b>National Highways Development Project<\/b> began with the <b>Golden Quadrilateral<\/b> — about 5,800 km of four- and six-lane highways joining <b>Delhi, Mumbai, Chennai and Kolkata<\/b> — and the <b>North–South<\/b> (Srinagar–Kanyakumari) and <b>East–West<\/b> (Porbandar–Silchar) corridors. The longest highway today is <b>NH-44<\/b>, from <b>Srinagar to Kanyakumari<\/b>. In 2017 came <b>Bharatmala Pariyojana<\/b> for economic corridors and border roads.<\/p><p>The <b>Border Roads Organisation<\/b> (BRO) cut roads through the mountains: the <b>Atal Tunnel<\/b> under Rohtang (2020) joins <b>Manali to Lahaul-Spiti<\/b>, the <b>Sela Tunnel<\/b> (2024) leads to Tawang, and <b>Umling La<\/b> in Ladakh is the world's highest motorable road. Big bridges include <b>Bhupen Hazarika Setu<\/b> and <b>Bogibeel<\/b> in Assam, and <b>Atal Setu<\/b>, India's longest sea bridge, in Mumbai.<\/p>","key":"NH-44 Srinagar–Kanyakumari; GQ Delhi–Mumbai–Chennai–Kolkata; Atal Tunnel Manali–Lahaul-Spiti (HP); Atal Setu Mumbai; Bharatmala 2017."},{"k":"table","title":"Tunnels, bridges and expressways — which state?","head":["Road / tunnel / bridge","State / UT","Remember"],"rows":[["Atal Tunnel (Rohtang)","Himachal Pradesh","9.02 km; opened October 2020 — the world's longest highway tunnel above 10,000 feet."],["Dr Syama Prasad Mookerjee Tunnel (Chenani–Nashri)","Jammu and Kashmir","About 9.3 km; opened 2017."],["Sonamarg (Z-Morh) Tunnel","Jammu and Kashmir","Opened January 2025 — keeps Sonamarg open all year."],["Sela Tunnel","Arunachal Pradesh","Opened March 2024 — on the road to Tawang."],["Bhupen Hazarika Setu (Dhola–Sadiya Bridge)","Assam","Over the Lohit, about 9.15 km, opened 2017."],["Bogibeel Bridge","Assam","Rail-cum-road bridge over the Brahmaputra, 2018."],["Atal Setu (Mumbai Trans Harbour Link)","Maharashtra","About 21.8 km — India's longest sea bridge, opened January 2024."],["Mahatma Gandhi Setu","Bihar","Over the Ganga between Patna and Hajipur (1982)."],["Sudarshan Setu (Okha–Beyt Dwarka)","Gujarat","India's longest cable-stayed bridge, opened February 2024."],["Samruddhi Mahamarg (Mumbai–Nagpur Expressway)","Maharashtra",""],["Purvanchal Expressway","Uttar Pradesh","Lucknow to Ghazipur."],["Umling La road (world's highest motorable road)","Ladakh","Built by the BRO at about 19,000 feet."]]},{"k":"photos","title":"Tunnels and bridges in pictures","items":[["Atal_Tunnel","Atal Tunnel","Himachal · 9.02 km"],["Bogibeel_Bridge","Bogibeel Bridge","Assam"],["Bhupen_Hazarika_Setu","Bhupen Hazarika Setu","Assam"],["Atal_Setu","Atal Setu","Mumbai Trans Harbour Link"],["Mahatma_Gandhi_Setu","Mahatma Gandhi Setu","Patna, Bihar"],["Sudarshan_Setu","Sudarshan Setu","Gujarat"],["Sela_Tunnel","Sela Tunnel","Arunachal Pradesh"],["Umling_La","Umling La","Ladakh · highest motorable road"]]},{"k":"table","title":"From where to where?","head":["Road","Runs","Note"],"rows":[["NH-44 (India's longest national highway)","Srinagar to Kanyakumari","Runs north–south through 11 states and UTs; it was old NH-7 in the south."],["East–West Corridor","Porbandar to Silchar","Part of the NHDP."],["Yamuna Expressway","Greater Noida to Agra",""],["Bundelkhand Expressway","Chitrakoot to Etawah",""],["Atal Tunnel route","Manali to Lahaul-Spiti",""],["Atal Setu route","Sewri to Nhava Sheva",""]]},{"k":"mapfig","title":"India's great road corridors","under":"<path d=\"M170.8,175.2L90.5,366.4L177.8,488.6L227.5,486.4L330.4,342L377.5,296.6L170.8,175.2\" fill=\"none\" stroke=\"#d4a017\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"7 4\" style=\"vector-effect:non-scaling-stroke\"/><path d=\"M170.8,175.2L90.5,366.4L177.8,488.6L227.5,486.4L330.4,342L377.5,296.6L170.8,175.2\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.1\" stroke-dasharray=\"2 8\" style=\"animation:rvflow 1.4s linear infinite;vector-effect:non-scaling-stroke\"/><text x=\"213.3\" y=\"278\" font-size=\"11\" font-weight=\"700\" style=\"fill:#d4a017;paint-order:stroke;stroke:var(--sheet);stroke-width:3px\">Golden Quadrilateral<\/text><path d=\"M126.1,66.4L129.8,94L145.8,130L170.6,176L179.9,204L189.1,224L205.8,325L194.7,400L178,454L177.8,488.6L188.2,515L179.9,550L176.9,586.4\" fill=\"none\" stroke=\"#c0392b\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"  style=\"vector-effect:non-scaling-stroke\"/><path d=\"M126.1,66.4L129.8,94L145.8,130L170.6,176L179.9,204L189.1,224L205.8,325L194.7,400L178,454L177.8,488.6L188.2,515L179.9,550L176.9,586.4\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.1\" stroke-dasharray=\"2 8\" style=\"animation:rvflow 1.4s linear infinite;vector-effect:non-scaling-stroke\"/><text x=\"148.3\" y=\"338\" font-size=\"11\" font-weight=\"700\" style=\"fill:#c0392b;paint-order:stroke;stroke:var(--sheet);stroke-width:3px\">NH-44<\/text><path d=\"M29.7,315.2L96.4,302L144.6,244L189.1,239L228.6,219L285,212.8L333.8,224L378.8,213.8L440.4,224.4L459.9,251.4\" fill=\"none\" stroke=\"#2f6db5\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"  style=\"vector-effect:non-scaling-stroke\"/><path d=\"M29.7,315.2L96.4,302L144.6,244L189.1,239L228.6,219L285,212.8L333.8,224L378.8,213.8L440.4,224.4L459.9,251.4\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.1\" stroke-dasharray=\"2 8\" style=\"animation:rvflow 1.4s linear infinite;vector-effect:non-scaling-stroke\"/><text x=\"231.8\" y=\"192\" font-size=\"11\" font-weight=\"700\" style=\"fill:#2f6db5;paint-order:stroke;stroke:var(--sheet);stroke-width:3px\">East–West Corridor<\/text>","pins":[["Srinagar",74.8,34.08,"NH-44 starts"],["Kanyakumari",77.54,8.08,"NH-44 ends","l"],["Porbandar",69.6,21.64,"","l"],["Silchar",92.8,24.83,""]],"cap":"Red: NH-44, the longest highway (Srinagar–Kanyakumari). Blue: the East–West Corridor (Porbandar–Silchar). Gold dashes: the Golden Quadrilateral joining Delhi, Mumbai, Chennai and Kolkata. Routes simplified."},{"k":"facts","title":"Road facts (as of 2025–26)","rows":[["Golden Quadrilateral","Delhi–Mumbai–Chennai–Kolkata, about 5,846 km; phase 1 of the NHDP"],["NHAI","National Highways Authority of India — Act of 1988, working since 1995"],["Bharatmala Pariyojana","Approved in 2017; economic corridors, border and coastal roads"],["PMGSY","Pradhan Mantri Gram Sadak Yojana, started 25 December 2000 — village roads"],["Border Roads Organisation","Set up in 1960; built the Atal and Sela tunnels and Umling La road"],["FASTag","Made compulsory at toll plazas in February 2021"],["Road network","India has the world's second-largest road network (after the USA)"]]},{"k":"trick","h":"<b>“44 goes from Snow to Sea”<\/b> — Srinagar (snow) to Kanyakumari (sea). Golden Quadrilateral = the four old metros: <b>“D-M-C-K”<\/b>, <b>“Do Make Chai, Kaka”<\/b>. <b>Atal<\/b> has two: <b>Atal Tunnel<\/b> (Himachal) and <b>Atal Setu<\/b> (Mumbai)."},{"k":"trap","h":"<b>Atal Tunnel<\/b> is in Himachal Pradesh, not J&K — <b>Chenani–Nashri<\/b> and <b>Sonamarg<\/b> are the J&K tunnels. <b>Bhupen Hazarika Setu<\/b> is over the <b>Lohit<\/b>; <b>Bogibeel<\/b> is over the <b>Brahmaputra<\/b>. <b>Mahatma Gandhi Setu<\/b> is in Patna, Bihar."}],"sum":["NH-44 (Srinagar–Kanyakumari) is India's longest national highway.","Golden Quadrilateral joins Delhi, Mumbai, Chennai and Kolkata; East–West corridor Porbandar to Silchar.","Atal Tunnel (HP, 2020) joins Manali and Lahaul-Spiti; Sela Tunnel (Arunachal, 2024); Chenani–Nashri (J&K, 2017).","Atal Setu (Mumbai, 2024) is India's longest sea bridge; Sudarshan Setu (Gujarat) its longest cable-stayed bridge.","Bharatmala 2017; PMGSY 2000; BRO 1960; Umling La (Ladakh) is the world's highest motorable road."],"part":["Part 3 · Roads, ports, air and waterways","सड़क, बंदरगाह, वायु और जलमार्ग"],"g":"it"},
{"id":"T8","heat":3,"title":"Seaports","hi":"बंदरगाह","blocks":[{"k":"hot","h":"India has <b>13 major ports<\/b> (as of 2026). Questions ask the <b>state<\/b> of a port and its special feature: <b>Kandla/Deendayal<\/b> (tidal), <b>Kolkata<\/b> (only riverine), <b>Visakhapatnam<\/b> (deepest land-locked), <b>Mumbai<\/b> (natural harbour), and the new <b>Vizhinjam<\/b> (Kerala) transshipment port."},{"k":"story","h":"<p>India's coast is about 7,500 km long. On the <b>east<\/b> coast stand <b>Kolkata–Haldia<\/b> (on the Hooghly, the only river port), <b>Paradip<\/b>, <b>Visakhapatnam<\/b>, <b>Kamarajar (Ennore)<\/b>, <b>Chennai<\/b> and <b>V. O. Chidambaranar (Tuticorin)<\/b>. On the <b>west<\/b> coast are <b>Cochin<\/b>, <b>New Mangalore<\/b>, <b>Mormugao<\/b>, <b>Mumbai<\/b>, <b>Jawaharlal Nehru Port (Nhava Sheva)<\/b> and <b>Deendayal (Kandla)<\/b>. <b>Port Blair<\/b> became the 13th major port in 2010.<\/p><p><b>Kandla<\/b> was built after Partition to replace Karachi; it is a <b>tidal port<\/b>, renamed <b>Deendayal Port<\/b> in 2017. In May 2025 <b>Vizhinjam<\/b> near Thiruvananthapuram opened as India's first deep-water <b>transshipment<\/b> port, and a new major port at <b>Vadhavan<\/b> (Maharashtra) is being built.<\/p>","key":"13 major ports: 6 east + 6 west + Port Blair; Kandla = Deendayal (tidal); Kolkata only riverine; Vizhinjam 2025 transshipment."},{"k":"table","title":"Ports and their states","head":["Port","State / UT","Remember"],"rows":[["Syama Prasad Mookerjee Port (Kolkata, with Haldia)","West Bengal","India's only riverine major port, on the Hooghly."],["Paradip Port","Odisha",""],["Visakhapatnam Port","Andhra Pradesh","India's deepest land-locked, protected harbour."],["Kamarajar Port (Ennore)","Tamil Nadu","India's first corporatised major port."],["V. O. Chidambaranar Port (Tuticorin)","Tamil Nadu",""],["Cochin Port","Kerala","On Willingdon Island."],["New Mangalore Port","Karnataka","Exports Kudremukh iron ore."],["Mormugao Port","Goa","Mainly iron-ore exports."],["Mumbai Port","Maharashtra","A natural harbour."],["Deendayal Port (Kandla)","Gujarat","A tidal port in the Gulf of Kutch."],["Port Blair Port (Sri Vijaya Puram)","Andaman and Nicobar Islands","Became a major port in 2010."],["Vizhinjam International Seaport","Kerala","India's first deep-water container transshipment port, opened May 2025."],["Mundra Port","Gujarat","India's largest private port (Adani)."],["Vadhavan Port (under construction)","Maharashtra","Approved in 2024 as a new major port."],["Dhamra Port","Odisha",""],["Krishnapatnam Port","Andhra Pradesh",""]]},{"k":"mapfig","title":"Seaports on the coast","pins":[["1",88.3,22.55,"Syama Prasad Mookerjee Port (Kolkata, with Haldia)","n"],["2",86.67,20.27,"Paradip Port","n"],["3",83.29,17.69,"Visakhapatnam Port","n"],["4",80.33,13.26,"Kamarajar Port (Ennore)","n"],["5",78.18,8.76,"V. O. Chidambaranar Port (Tuticorin)","n"],["6",76.27,9.96,"Cochin Port","n"],["7",74.81,12.92,"New Mangalore Port","n"],["8",73.8,15.41,"Mormugao Port","n"],["9",72.84,18.94,"Mumbai Port","n"],["10",70.22,23.03,"Deendayal Port (Kandla)","n"],["11",92.73,11.67,"Port Blair Port (Sri Vijaya Puram)","n"],["12",76.99,8.38,"Vizhinjam International Seaport","n"],["13",69.72,22.74,"Mundra Port","n"],["14",72.68,19.95,"Vadhavan Port (under construction)","n"],["15",86.97,20.8,"Dhamra Port","n"],["16",80.12,14.25,"Krishnapatnam Port","n"]],"facts":[["1 · Syama Prasad Mookerjee Port (Kolkata, with Haldia)","West Bengal"],["2 · Paradip Port","Odisha"],["3 · Visakhapatnam Port","Andhra Pradesh"],["4 · Kamarajar Port (Ennore)","Tamil Nadu"],["5 · V. O. Chidambaranar Port (Tuticorin)","Tamil Nadu"],["6 · Cochin Port","Kerala"],["7 · New Mangalore Port","Karnataka"],["8 · Mormugao Port","Goa"],["9 · Mumbai Port","Maharashtra"],["10 · Deendayal Port (Kandla)","Gujarat"],["11 · Port Blair Port (Sri Vijaya Puram)","Andaman and Nicobar Islands"],["12 · Vizhinjam International Seaport","Kerala"],["13 · Mundra Port","Gujarat"],["14 · Vadhavan Port (under construction)","Maharashtra"],["15 · Dhamra Port","Odisha"],["16 · Krishnapatnam Port","Andhra Pradesh"]],"cap":"Kolkata is the only riverine major port; Kandla (Deendayal) is a tidal port; Vizhinjam is India's first deep-water transshipment port."},{"k":"table","title":"Which port is it?","head":["Clue","Port","Note"],"rows":[["India's only riverine major port","Kolkata","On the Hooghly, about 200 km from the sea."],["A tidal port in the Gulf of Kutch","Deendayal (Kandla)","Built after Partition, when Karachi went to Pakistan."],["Deepest land-locked and protected harbour","Visakhapatnam",""],["First corporatised major port","Kamarajar (Ennore)",""],["Called the 'Queen of the Arabian Sea'","Kochi",""],["Exports iron ore from Kudremukh","New Mangalore",""],["Largest container port among the major ports","Jawaharlal Nehru Port (Nhava Sheva)","Navi Mumbai."]]},{"k":"facts","title":"Port facts (as of 2026)","rows":[["Major ports","13 — under the Major Port Authorities Act, 2021"],["East coast major ports","Kolkata, Paradip, Visakhapatnam, Kamarajar, Chennai, V. O. Chidambaranar"],["West coast major ports","Cochin, New Mangalore, Mormugao, Mumbai, Jawaharlal Nehru, Deendayal"],["Renamed","Kandla → Deendayal (2017); Kolkata → Syama Prasad Mookerjee (2020); Tuticorin → V. O. Chidambaranar (2011)"],["Port Blair","Renamed Sri Vijaya Puram in 2024"],["Sagarmala","Port-led development plan, approved in 2015"],["Maritime India Vision","Plan for ports to 2030 (2021)"]]},{"k":"trick","h":"West coast top to bottom: <b>“Kids Must Join Mom's Nice Cake”<\/b> — Kandla, Mumbai, JNPT, Mormugao, New Mangalore, Cochin. East coast bottom to top: <b>“Tea, Coffee, Kamarajar's Vada Pao Kolkata”<\/b> — Tuticorin, Chennai, Kamarajar, Vizag, Paradip, Kolkata."},{"k":"trap","h":"<b>Vizhinjam<\/b> is in <b>Kerala<\/b> (near Thiruvananthapuram), not Andhra. <b>Mundra<\/b> is a big private port, not a major port. <b>Kamarajar<\/b> (Ennore) and <b>Chennai<\/b> are two different major ports in the same city region."}],"sum":["India has 13 major ports: six on each coast plus Port Blair.","Deendayal (Kandla), Gujarat, is a tidal port; Kolkata is the only riverine major port.","Visakhapatnam has the deepest land-locked harbour; Mumbai is a natural harbour; Kamarajar was the first corporatised port.","Mormugao (Goa) and New Mangalore export iron ore; Paradip is in Odisha.","Vizhinjam (Kerala, 2025) is India's first deep-water transshipment port; Vadhavan (Maharashtra) is coming up."],"part":["Part 3 · Roads, ports, air and waterways","सड़क, बंदरगाह, वायु और जलमार्ग"],"g":"it"},
{"id":"T9","heat":2,"title":"Airports and aviation","hi":"हवाई अड्डे और विमानन","blocks":[{"k":"hot","h":"Airport names are a favourite: <b>“Lokpriya Gopinath Bordoloi Airport is in …?”<\/b> (Guwahati), <b>Biju Patnaik<\/b> (Bhubaneswar), <b>Birsa Munda<\/b> (Ranchi). Also firsts: <b>J. R. D. Tata's first flight (1932)<\/b>, <b>Cochin's solar airport<\/b>, <b>UDAN<\/b>."},{"k":"story","h":"<p>Indian civil aviation began on <b>15 October 1932<\/b>, when <b>J. R. D. Tata<\/b> flew mail from <b>Karachi to Bombay<\/b> — the start of Tata Airlines, later <b>Air India<\/b>. Today the <b>Airports Authority of India<\/b> (1995) runs most airports, and <b>Indira Gandhi International (Delhi)<\/b> is the busiest.<\/p><p>Most airports are named after great Indians of their state: <b>Kempegowda<\/b> (Bengaluru's founder), <b>Lokpriya Gopinath Bordoloi<\/b> (Assam's first chief minister), <b>Biju Patnaik<\/b>, <b>Birsa Munda<\/b>, <b>Raja Bhoj<\/b>, <b>Devi Ahilyabai Holkar<\/b>. <b>Cochin<\/b> became the world's first fully <b>solar-powered<\/b> airport in 2015, and the <b>UDAN<\/b> scheme (first flight 2017, Shimla–Delhi) brought flights to small towns.<\/p>","key":"JRD Tata 1932 Karachi–Bombay; AAI 1995; Delhi IGI busiest; Cochin first solar airport; UDAN 2017."},{"k":"table","title":"Airports and their cities","head":["Airport","City","Remember"],"rows":[["Indira Gandhi International Airport","Delhi","India's busiest airport."],["Chhatrapati Shivaji Maharaj International Airport","Mumbai",""],["Kempegowda International Airport","Bengaluru",""],["Rajiv Gandhi International Airport","Hyderabad",""],["Netaji Subhas Chandra Bose International Airport","Kolkata",""],["Sardar Vallabhbhai Patel International Airport","Ahmedabad",""],["Chaudhary Charan Singh International Airport","Lucknow",""],["Lokpriya Gopinath Bordoloi International Airport","Guwahati",""],["Biju Patnaik International Airport","Bhubaneswar",""],["Sri Guru Ram Dass Jee International Airport","Amritsar",""],["Devi Ahilyabai Holkar Airport","Indore",""],["Raja Bhoj Airport","Bhopal",""],["Jay Prakash Narayan Airport","Patna",""],["Birsa Munda Airport","Ranchi",""],["Dr Babasaheb Ambedkar International Airport","Nagpur",""],["Swami Vivekananda Airport","Raipur",""],["Veer Savarkar International Airport","Sri Vijaya Puram (Port Blair)",""],["Maharishi Valmiki International Airport","Ayodhya","Opened December 2023."],["Manohar International Airport (Mopa)","North Goa","Opened December 2022."],["Kushok Bakula Rimpochee Airport","Leh","One of the world's highest commercial airports."],["Cochin International Airport","Kochi","World's first fully solar-powered airport (2015)."]]},{"k":"mapfig","title":"Airports and their cities","pins":[["1",77.1,28.56,"Indira Gandhi International Airport","n"],["2",72.87,19.09,"Chhatrapati Shivaji Maharaj International Airport","n"],["3",77.71,13.2,"Kempegowda International Airport","n"],["4",78.43,17.24,"Rajiv Gandhi International Airport","n"],["5",88.45,22.65,"Netaji Subhas Chandra Bose International Airport","n"],["6",72.63,23.07,"Sardar Vallabhbhai Patel International Airport","n"],["7",80.89,26.76,"Chaudhary Charan Singh International Airport","n"],["8",91.59,26.11,"Lokpriya Gopinath Bordoloi International Airport","n"],["9",85.82,20.25,"Biju Patnaik International Airport","n"],["10",74.8,31.71,"Sri Guru Ram Dass Jee International Airport","n"],["11",75.8,22.72,"Devi Ahilyabai Holkar Airport","n"],["12",77.34,23.29,"Raja Bhoj Airport","n"],["13",85.09,25.59,"Jay Prakash Narayan Airport","n"],["14",85.32,23.31,"Birsa Munda Airport","n"],["15",79.05,21.09,"Dr Babasaheb Ambedkar International Airport","n"],["16",81.74,21.18,"Swami Vivekananda Airport","n"],["17",92.73,11.64,"Veer Savarkar International Airport","n"],["18",82.2,26.8,"Maharishi Valmiki International Airport","n"],["19",73.87,15.74,"Manohar International Airport (Mopa)","n"],["20",77.55,34.14,"Kushok Bakula Rimpochee Airport","n"],["21",76.39,10.15,"Cochin International Airport","n"]],"facts":[["1 · Indira Gandhi International Airport","Delhi — Indira Gandhi"],["2 · Chhatrapati Shivaji Maharaj International Airport","Mumbai — Chhatrapati Shivaji Maharaj"],["3 · Kempegowda International Airport","Bengaluru — Kempegowda"],["4 · Rajiv Gandhi International Airport","Hyderabad — Rajiv Gandhi"],["5 · Netaji Subhas Chandra Bose International Airport","Kolkata — Netaji Subhas Chandra Bose"],["6 · Sardar Vallabhbhai Patel International Airport","Ahmedabad — Sardar Vallabhbhai Patel"],["7 · Chaudhary Charan Singh International Airport","Lucknow — Chaudhary Charan Singh"],["8 · Lokpriya Gopinath Bordoloi International Airport","Guwahati — Lokpriya Gopinath Bordoloi"],["9 · Biju Patnaik International Airport","Bhubaneswar — Biju Patnaik"],["10 · Sri Guru Ram Dass Jee International Airport","Amritsar — Sri Guru Ram Dass Jee"],["11 · Devi Ahilyabai Holkar Airport","Indore — Devi Ahilyabai Holkar"],["12 · Raja Bhoj Airport","Bhopal — Raja Bhoj"],["13 · Jay Prakash Narayan Airport","Patna — Jay Prakash Narayan"],["14 · Birsa Munda Airport","Ranchi — Birsa Munda"],["15 · Dr Babasaheb Ambedkar International Airport","Nagpur — Dr Babasaheb Ambedkar"],["16 · Swami Vivekananda Airport","Raipur — Swami Vivekananda"],["17 · Veer Savarkar International Airport","Sri Vijaya Puram (Port Blair) — Veer Savarkar"],["18 · Maharishi Valmiki International Airport","Ayodhya — Maharishi Valmiki"],["19 · Manohar International Airport (Mopa)","North Goa — Manohar International Airport (Mopa)"],["20 · Kushok Bakula Rimpochee Airport","Leh — Kushok Bakula Rimpochee"],["21 · Cochin International Airport","Kochi — Cochin"]],"cap":"Each number is a city's airport, named after a leader or a local figure."},{"k":"facts","title":"Aviation facts (as of 2026)","rows":[["First commercial flight","J. R. D. Tata, Karachi to Bombay (Juhu), 15 October 1932"],["Air India","Nationalised 1953; returned to the Tata group in January 2022"],["Airports Authority of India","Set up in 1995; HQ New Delhi"],["DGCA","Directorate General of Civil Aviation — the safety regulator"],["UDAN","Ude Desh ka Aam Nagrik — regional flights; first flight Shimla–Delhi, April 2017"],["Highest airfield","Daulat Beg Oldie (Ladakh) — an Air Force landing ground"],["New airports","Mopa (Goa, 2022), Ayodhya (2023), Navi Mumbai (inaugurated October 2025)"]]},{"k":"trick","h":"<b>“Gopinath Guards Guwahati, Biju Builds Bhubaneswar, Birsa Rules Ranchi”<\/b>. Two Rajas: <b>Raja Bhoj — Bhopal<\/b>, <b>Devi Ahilyabai — Indore<\/b> (both MP)."},{"k":"trap","h":"<b>Chaudhary Charan Singh<\/b> airport is in <b>Lucknow<\/b>, not Meerut. <b>Jay Prakash Narayan<\/b> airport is Patna; <b>Birsa Munda<\/b> is Ranchi. Goa has two airports — <b>Dabolim<\/b> and <b>Mopa (Manohar)<\/b>."}],"sum":["J. R. D. Tata flew India's first commercial flight, Karachi–Bombay, on 15 October 1932.","Indira Gandhi International (Delhi) is India's busiest airport; AAI was set up in 1995.","Lokpriya Gopinath Bordoloi — Guwahati; Biju Patnaik — Bhubaneswar; Birsa Munda — Ranchi; Jay Prakash Narayan — Patna.","Raja Bhoj — Bhopal; Devi Ahilyabai Holkar — Indore; Chaudhary Charan Singh — Lucknow; Kempegowda — Bengaluru.","Cochin is the world's first fully solar-powered airport (2015); UDAN's first flight was Shimla–Delhi (2017)."],"part":["Part 3 · Roads, ports, air and waterways","सड़क, बंदरगाह, वायु और जलमार्ग"],"g":"it"},
{"id":"T10","heat":2,"title":"Inland waterways and pipelines","hi":"अंतर्देशीय जलमार्ग और पाइपलाइन","blocks":[{"k":"hot","h":"Learn the five old National Waterways: <b>NW-1<\/b> Ganga (Prayagraj–Haldia, longest), <b>NW-2<\/b> Brahmaputra (Sadiya–Dhubri), <b>NW-3<\/b> West Coast Canal (Kerala), <b>NW-4<\/b> Krishna–Godavari, <b>NW-5<\/b> Brahmani–Mahanadi. For pipelines: <b>HBJ<\/b> carries <b>gas<\/b>."},{"k":"story","h":"<p>The <b>Inland Waterways Authority of India<\/b> (IWAI, 1986, HQ <b>Noida<\/b>) looks after river transport. <b>NW-1<\/b> on the Ganga–Bhagirathi–Hooghly, from <b>Prayagraj to Haldia<\/b> (about 1,620 km), is the longest; <b>NW-2<\/b> runs on the Brahmaputra from <b>Sadiya to Dhubri<\/b>. The <b>National Waterways Act, 2016<\/b> added 106 new waterways, making <b>111<\/b> in all.<\/p><p>Oil and gas also travel by <b>pipeline<\/b>. The <b>Hazira–Bijaipur–Jagdishpur (HBJ)<\/b> line, run by <b>GAIL<\/b>, carries natural gas from Gujarat to Uttar Pradesh. India's first long crude-oil pipeline joined <b>Naharkatiya<\/b> (Assam) to <b>Barauni<\/b> (Bihar). Across borders, the <b>Motihari–Amlekhganj<\/b> pipeline (2019) feeds Nepal and the <b>Friendship Pipeline<\/b> (2023) feeds Bangladesh.<\/p>","key":"NW-1 Prayagraj–Haldia (longest); NW-2 Sadiya–Dhubri; 111 NWs (2016 Act); IWAI Noida; HBJ = gas (GAIL)."},{"k":"table","title":"The first five National Waterways","head":["Waterway","Route","Note"],"rows":[["National Waterway 1 (NW-1)","Prayagraj to Haldia","Ganga–Bhagirathi–Hooghly, about 1,620 km — India's longest; declared 1986."],["National Waterway 2 (NW-2)","Sadiya to Dhubri","Brahmaputra, about 891 km; declared 1988."],["National Waterway 3 (NW-3)","Kollam to Kottapuram","West Coast Canal in Kerala; declared 1993 (later extended to Kozhikode)."],["National Waterway 4 (NW-4)","Kakinada to Puducherry","Krishna and Godavari rivers with canals; declared 2008."],["National Waterway 5 (NW-5)","East Coast Canal with the Brahmani and Mahanadi delta","Odisha and West Bengal; declared 2008."]]},{"k":"mapfig","title":"The first five National Waterways","under":"<path d=\"M256.8,239.2L278.2,242L317.1,236L352.3,243L369,252L376.4,296L372,307.4\" fill=\"none\" stroke=\"#2f6db5\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"  style=\"vector-effect:non-scaling-stroke\"/><path d=\"M256.8,239.2L278.2,242L317.1,236L352.3,243L369,252L376.4,296L372,307.4\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.1\" stroke-dasharray=\"2 8\" style=\"animation:rvflow 1.4s linear infinite;vector-effect:non-scaling-stroke\"/><text x=\"262.4\" y=\"221.2\" font-size=\"11\" font-weight=\"700\" style=\"fill:#2f6db5;paint-order:stroke;stroke:var(--sheet);stroke-width:3px\">NW-1<\/text><path d=\"M513.1,191.4L498.8,198.4L485.8,212L459.9,216L440.4,224.4L407.6,227.6\" fill=\"none\" stroke=\"#2f6db5\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"  style=\"vector-effect:non-scaling-stroke\"/><path d=\"M513.1,191.4L498.8,198.4L485.8,212L459.9,216L440.4,224.4L407.6,227.6\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.1\" stroke-dasharray=\"2 8\" style=\"animation:rvflow 1.4s linear infinite;vector-effect:non-scaling-stroke\"/><text x=\"466.7\" y=\"179.4\" font-size=\"11\" font-weight=\"700\" style=\"fill:#2f6db5;paint-order:stroke;stroke:var(--sheet);stroke-width:3px\">NW-2<\/text><path d=\"M159.5,570.2L154.5,558L153.4,548.6L152.1,544\" fill=\"none\" stroke=\"#2f6db5\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"  style=\"vector-effect:non-scaling-stroke\"/><path d=\"M159.5,570.2L154.5,558L153.4,548.6L152.1,544\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.1\" stroke-dasharray=\"2 8\" style=\"animation:rvflow 1.4s linear infinite;vector-effect:non-scaling-stroke\"/><text x=\"165\" y=\"586.2\" font-size=\"11\" font-weight=\"700\" style=\"fill:#2f6db5;paint-order:stroke;stroke:var(--sheet);stroke-width:3px\">NW-3<\/text><path d=\"M264.1,409.4L242.9,422L228.1,444L227.5,486.4L2

const LESSONS = [
{"id":"H1","heat":3,"title":"UNESCO and the World Heritage list","hi":"यूनेस्को और विश्व धरोहर सूची","blocks":[{"k":"hot","h":"Most asked: <b>India's total<\/b> and the split (cultural, natural, mixed), the <b>latest site<\/b>, the <b>first four<\/b> (1983), the year of the <b>Convention (1972)<\/b>, the bodies that judge sites (<b>ICOMOS<\/b>, <b>IUCN<\/b>) and <b>World Heritage Day (18 April)<\/b>."},{"k":"story","h":"<p>In the 1960s Egypt began the Aswan High Dam, and the rising Nile threatened the temples of Abu Simbel. UNESCO raised money from many countries, and the temples were cut into blocks and moved uphill. The lesson was clear: some places are too precious to be left to one country alone.<\/p><p>So in <b>1972<\/b> UNESCO's General Conference in <b>Paris<\/b> adopted the <b>World Heritage Convention<\/b>. A country that signs it promises to protect its great places, and may put them forward for the <b>World Heritage List<\/b>. A committee of <b>21 member countries<\/b> meets once a year and decides, after experts have checked each site: <b>ICOMOS<\/b> for cultural sites and <b>IUCN<\/b> for natural ones.<\/p><p>India signed in <b>1977<\/b>, and its first four sites — <b>Ajanta, Ellora, Agra Fort and the Taj Mahal<\/b> — were listed in <b>1983<\/b>. As of October 2026 India has <b>45 sites<\/b>: 37 cultural, 7 natural and 1 mixed. The latest is <b>Sarnath<\/b> (July 2026).<\/p>","key":"1972 Convention · India joined 1977 · first sites 1983 · 45 sites (37 + 7 + 1) as of October 2026 · latest Sarnath."},{"k":"facts","title":"The World Heritage system in one look","rows":[["UNESCO","United Nations Educational, Scientific and Cultural Organization — founded 1945, headquarters in <b>Paris<\/b>"],["The Convention","Convention concerning the Protection of the World Cultural and Natural Heritage — adopted <b>16 November 1972<\/b> in Paris; in force from 1975"],["India joins","Ratified in <b>1977<\/b>; first Indian sites inscribed in <b>1983<\/b>"],["First World Heritage list","<b>1978<\/b> — 12 sites worldwide (the Galápagos Islands among them)"],["World Heritage Committee","<b>21<\/b> member countries, elected from those that have signed; meets once a year and decides which sites are inscribed"],["Advisory bodies","<b>ICOMOS<\/b> (cultural sites), <b>IUCN<\/b> (natural sites), <b>ICCROM<\/b> (conservation and training)"],["In India","The <b>Archaeological Survey of India<\/b> (Ministry of Culture) prepares and looks after cultural sites; natural sites go through the Environment Ministry and the Wildlife Institute of India"],["World Heritage in Danger","A separate list of sites under threat — Manas (1992–2011) and Hampi (1999–2006) were once on it; no Indian site is on it now"],["World Heritage Day","<b>18 April<\/b> — the International Day for Monuments and Sites"]]},{"k":"table","title":"The ten selection criteria","head":["Criterion","What it recognises","Type"],"rows":[["(i)","A masterpiece of human creative genius — the Taj Mahal is listed on this criterion alone","Cultural"],["(ii)","An exchange of ideas over time in architecture, technology, town planning or art","Cultural"],["(iii)","A unique or rare testimony to a culture or civilisation, living or lost","Cultural"],["(iv)","An outstanding example of a type of building, ensemble or landscape from a stage of history","Cultural"],["(v)","A traditional human settlement or use of land or sea","Cultural"],["(vi)","A direct link with events, living traditions, ideas, beliefs or great works of art and literature","Cultural"],["(vii)","Superlative natural phenomena or exceptional natural beauty","Natural"],["(viii)","Major stages of the Earth's history — rocks, fossils, landforms","Natural"],["(ix)","Ongoing ecological and biological processes in ecosystems","Natural"],["(x)","The most important habitats for conserving biological diversity and threatened species","Natural"]]},{"k":"p","h":"A site must also show <b>Outstanding Universal Value<\/b>, be authentic and whole (integrity), and have legal protection and a management plan. A <b>cultural<\/b> site meets at least one of (i)–(vi), a <b>natural<\/b> site at least one of (vii)–(x), and a <b>mixed<\/b> site at least one of each."},{"k":"table","title":"India's additions, year by year from 2014","head":["Year","Added","Committee session","India's total"],"rows":[["2014","Rani ki Vav (Patan, Gujarat); Great Himalayan National Park (Himachal Pradesh)","38th session, Doha","32"],["2015","Nothing added","39th session, Bonn","32"],["2016","Nalanda Mahavihara (Bihar); Khangchendzonga National Park (Sikkim, mixed); Capitol Complex, Chandigarh (in Le Corbusier's work)","40th session, Istanbul","35"],["2017","Historic City of Ahmedabad (Gujarat)","41st session, Kraków","36"],["2018","Victorian Gothic and Art Deco Ensembles of Mumbai","42nd session, Manama","37"],["2019","Jaipur City (Rajasthan)","43rd session, Baku","38"],["2020","Nothing added — the Committee did not meet (COVID-19)","—","38"],["2021","Ramappa Temple (Telangana); Dholavira (Gujarat)","44th session, Fuzhou (online)","40"],["2022","Nothing added — the session was postponed","—","40"],["2023","Santiniketan (West Bengal); Sacred Ensembles of the Hoysalas (Karnataka)","45th session, Riyadh","42"],["2024","Moidams of the Ahom dynasty, Charaideo (Assam)","46th session, New Delhi","43"],["2025","Maratha Military Landscapes of India (Maharashtra and Tamil Nadu)","47th session, Paris","44"],["2026","Ancient Buddhist Site of Sarnath (Uttar Pradesh)","48th session, Busan","45"]]},{"k":"facts","title":"Counts and firsts (as of October 2026)","rows":[["Total","<b>45<\/b> — 37 cultural, 7 natural, 1 mixed"],["First four (1983)","Ajanta Caves, Ellora Caves, Agra Fort, Taj Mahal"],["First natural sites (1985)","Kaziranga, Manas, Keoladeo"],["Only mixed site","Khangchendzonga National Park, Sikkim (2016)"],["First Indian city","Ahmedabad (2017); Jaipur followed (2019)"],["First Harappan site in India","Dholavira (2021)"],["First cultural site of the North-East","Moidams, Charaideo (2024)"],["Latest","Ancient Buddhist Site of Sarnath, the 45th (25 July 2026, Busan)"],["State with the most sites","Maharashtra"],["India hosted the Committee","46th session, Bharat Mandapam, New Delhi, July 2024 — the first time in India"]]},{"k":"facts","title":"The Tentative List","rows":[["What it is","A country's list of places it means to nominate. A site must be on it before it can be nominated; being on it is <b>not<\/b> World Heritage status"],["India's list","About 80 entries (October 2026) — the number grows as new places are added"],["Waited longest","Sarnath was on the Tentative List from 1998 until it was inscribed in 2026"],["Added in 2026","Bagh Caves (MP), Udaigiri Caves (MP), Group of Temples of the Chambal Valley, Painted Haveli Towns of Shekhawati (Rajasthan); in October, the Sirpur landscape (Chhattisgarh) and two volcanic sites of the Andaman Islands"],["Added in 2025","Seven natural sites, among them the Deccan Traps at Panchgani, St Mary's Island (Udupi), the Varkala cliffs and the Meghalayan Age caves"]]},{"k":"trick","h":"Count the split as <b>“37–7–1”<\/b>: 37 cultural, 7 natural, 1 mixed = 45. The years since 2014 run <b>2-0-3-1-1-1, gap, 2, gap, 2-1-1-1<\/b> — 2014 two sites, 2015 none, 2016 three, then one a year to 2019, no meeting in 2020, two in 2021, no session in 2022, two in 2023, then one each in 2024, 2025 and 2026."},{"k":"trap","h":"The Convention is of <b>1972<\/b>, but India's first sites came in <b>1983<\/b>; the first world list was in <b>1978<\/b>. <b>ICOMOS<\/b> judges cultural sites and <b>IUCN<\/b> natural ones — not UNEP or WWF. A place on the <b>Tentative List<\/b> (Sirpur, Shekhawati) is <b>not<\/b> yet a World Heritage site. Maratha Military Landscapes (2025) was the 44th; <b>Sarnath (2026)<\/b> is the 45th."},{"k":"link","h":"For the full table of all sites with their states, see the UNESCO lesson in <a href=\"study-art-culture.html\">Art &amp; Culture<\/a>. The next five lessons here go through every site group by group, in more depth."}],"sum":["The World Heritage Convention was adopted in Paris on 16 November 1972; India ratified it in 1977.","India's first four sites (1983): Ajanta, Ellora, Agra Fort and the Taj Mahal.","As of October 2026 India has 45 sites: 37 cultural, 7 natural and 1 mixed (Khangchendzonga).","Latest: Sarnath, the 45th, at the 48th session in Busan (July 2026); before it Maratha Military Landscapes (2025) and Moidams (2024).","Ten criteria: (i)–(vi) cultural, (vii)–(x) natural. ICOMOS checks cultural sites, IUCN natural ones.","The Committee has 21 members; India hosted its 46th session in New Delhi in July 2024.","World Heritage Day is 18 April. A Tentative List place is not yet a World Heritage site."],"part":["Part 1 · The list, ancient sites and temples","विश्व धरोहर सूची, प्राचीन स्थल और मंदिर"],"g":"hm"},
{"id":"H2","heat":3,"title":"Cultural sites I: Buddhist and ancient sites","hi":"सांस्कृतिक स्थल I: बौद्ध और प्राचीन स्थल","blocks":[{"k":"hot","h":"Most asked: <b>Ajanta vs Ellora vs Elephanta<\/b> (which faith, which king, which feature), <b>Bhimbetka<\/b> (rock paintings), <b>Dholavira<\/b> (the Harappan site, 2021), <b>Sanchi<\/b> and <b>Ashoka<\/b>, <b>Bodh Gaya<\/b> and <b>Nalanda<\/b> in Bihar, and the newest site, <b>Sarnath<\/b> (2026)."},{"k":"story","h":"<p>Walk through Indian time in nine stops. First, the <b>rock shelters of Bhimbetka<\/b>, where Stone Age people painted hunters and animals on the walls more than ten thousand years ago. Then <b>Dholavira<\/b>, a Harappan city on an island in the Rann of Kutch, which stored rainwater in huge stone reservoirs.<\/p><p>Next come the places of the <b>Buddha<\/b>: <b>Bodh Gaya<\/b>, where he became enlightened under the Bodhi tree; <b>Sarnath<\/b>, where he gave his first sermon; and the stupas of <b>Sanchi<\/b>, begun by Ashoka. Later, <b>Nalanda<\/b> became a great university where students came from as far as China.<\/p><p>Last, the cave sites of Maharashtra: <b>Ajanta<\/b> with its paintings, <b>Ellora<\/b> where three faiths carved side by side, and <b>Elephanta<\/b> with its giant Shiva.<\/p>","key":"Bhimbetka and Sanchi — MP · Dholavira — Gujarat · Bodh Gaya and Nalanda — Bihar · Sarnath — UP · Ajanta, Ellora, Elephanta — Maharashtra."},{"k":"table","title":"Ancient and Buddhist World Heritage sites","head":["Site","State","Year","Remember"],"rows":[["<b>Rock Shelters of Bhimbetka<\/b>","Madhya Pradesh","2003","Raisen district, in the Vindhya hills; Stone Age paintings; found in 1957 by V. S. Wakankar."],["<b>Dholavira: a Harappan City<\/b>","Gujarat","2021","On Khadir Bet in the Rann of Kutch; great water reservoirs and a 'signboard' of Indus signs."],["<b>Buddhist Monuments at Sanchi<\/b>","Madhya Pradesh","1989","Raisen district; the Great Stupa begun by Ashoka, with four carved gateways."],["<b>Mahabodhi Temple Complex, Bodh Gaya<\/b>","Bihar","2002","Where the Buddha attained enlightenment; one of the earliest brick temples, of the Gupta age."],["<b>Nalanda Mahavihara<\/b>","Bihar","2016","A monastic university founded under Kumaragupta I in the 5th century."],["<b>Ancient Buddhist Site of Sarnath<\/b>","Uttar Pradesh","2026","Near Varanasi, where the Buddha gave his first sermon; Dhamek and Chaukhandi stupas, the Ashokan pillar."],["<b>Ajanta Caves<\/b>","Maharashtra","1983","Buddhist only; famous for wall paintings; cut into a horseshoe bend of the Waghora."],["<b>Ellora Caves<\/b>","Maharashtra","1983","Buddhist, Hindu and Jain caves side by side; the Kailasa temple (Cave 16)."],["<b>Elephanta Caves<\/b>","Maharashtra","1987","On Gharapuri island in Mumbai harbour; the great three-headed Shiva (Sadashiva)."]]},{"k":"table","title":"Ajanta, Ellora and Elephanta compared","head":["","Ajanta","Ellora","Elephanta"],"rows":[["Faith","Buddhist only","Buddhist (Caves 1–12), Hindu (13–29), Jain (30–34)","Mainly Hindu (Shaiva), with two Buddhist caves"],["Number of caves","About 30","34 main caves","7"],["Age","2nd–1st century BCE, and a second phase in the 5th–6th century CE (under the Vakatakas)","About 600–1000 CE","About 5th–6th century CE"],["Famous for","Paintings — the Padmapani, Jataka stories","Kailasa temple (Cave 16), cut from one rock under the Rashtrakuta king Krishna I","The Sadashiva — a 6-metre three-headed Shiva"],["Where","Chhatrapati Sambhajinagar (Aurangabad) district, on the Waghora","Chhatrapati Sambhajinagar district","Gharapuri island, Mumbai harbour"],["Note","Rediscovered in 1819 by a British officer, John Smith","Cave 10 (Vishvakarma) is a Buddhist chaitya hall","Named Elephanta by the Portuguese after a stone elephant there"]]},{"k":"facts","title":"The Buddhist sites in detail","rows":[["Sanchi","The Great Stupa (Stupa 1) was begun by <b>Ashoka<\/b> in brick; the Shungas enlarged it in stone, and its four carved gateways (<b>toranas<\/b>) came in the Satavahana period"],["Bodh Gaya","The Mahabodhi temple stands beside the Bodhi tree and the <b>Vajrasana<\/b> (diamond throne); Ashoka built the first shrine, and the present brick temple dates from the 5th–6th century"],["Nalanda","Founded under <b>Kumaragupta I<\/b>; the Chinese pilgrim <b>Xuanzang<\/b> studied here in Harsha's time; destroyed by <b>Bakhtiyar Khalji<\/b> about 1193. A new Nalanda University opened at Rajgir in 2014"],["Sarnath","The Deer Park (Rishipatana) of the <b>first sermon<\/b>; the site includes the <b>Dhamek Stupa<\/b>, the <b>Chaukhandi Stupa<\/b>, the Dharmarajika Stupa, the Mulagandhakuti Vihara and the Ashokan pillar. Its <b>Lion Capital<\/b> is India's National Emblem"],["Four great places","Lumbini (birth, in Nepal — a World Heritage site of Nepal), Bodh Gaya (enlightenment), Sarnath (first sermon), Kushinagar (death — not a World Heritage site)"]]},{"k":"facts","title":"The two oldest sites","rows":[["Bhimbetka","More than 700 rock shelters, about 400 of them painted, from the Stone Age onward; in the Vindhya hills south of Bhopal; the name is linked to Bhima of the Mahabharata"],["Dholavira","One of the five largest Harappan cities; a city of three parts (citadel, middle town, lower town), built of stone; found by J. P. Joshi (1967–68) and excavated by R. S. Bisht from 1990"],["Not on the list","<b>Lothal<\/b> (the Harappan dockyard), <b>Rakhigarhi<\/b> and <b>Kalibangan<\/b> are not World Heritage sites — Dholavira is India's only Harappan site on the list"]]},{"k":"trick","h":"<b>Ajanta = Art<\/b> (paintings, Buddhist only); <b>Ellora = Everyone<\/b> (three faiths, and the enormous Kailasa); <b>Elephanta = Eshwara<\/b> (Shiva on an island). And <b>“Raisen holds two”<\/b>: Bhimbetka and Sanchi are both in Raisen district of Madhya Pradesh."},{"k":"trap","h":"<b>Sarnath<\/b> is the first sermon, <b>Bodh Gaya<\/b> is enlightenment — do not swap them. Sarnath is in <b>Uttar Pradesh<\/b>, Bodh Gaya and Nalanda in <b>Bihar<\/b>. <b>Lothal<\/b> is not a World Heritage site; <b>Dholavira<\/b> is. The Ellora Kailasa is <b>rock-cut<\/b>; Elephanta's great image is the <b>Sadashiva<\/b>, often called the Trimurti."},{"k":"link","h":"Stupa parts, chaityas and the other cave sites (Karla, Bhaja, Barabar, Udayagiri) are in the architecture lesson of <a href=\"study-art-culture.html\">Art &amp; Culture<\/a>."}],"sum":["Bhimbetka (2003) and Sanchi (1989) are both in Raisen district, Madhya Pradesh.","Dholavira (2021), on Khadir Bet in Kutch, is India's only Harappan World Heritage site.","Bodh Gaya (2002) and Nalanda (2016) are in Bihar; Sarnath (2026) is in Uttar Pradesh.","Ajanta: Buddhist, paintings. Ellora: Buddhist, Hindu and Jain; Kailasa temple of Krishna I. Elephanta: Shiva, on Gharapuri island.","Sanchi's Great Stupa was begun by Ashoka; its gateways are toranas.","Sarnath's Lion Capital is the National Emblem; the Dhamek Stupa marks the first sermon."],"part":["Part 1 · The list, ancient sites and temples","विश्व धरोहर सूची, प्राचीन स्थल और मंदिर"],"g":"hm"},
{"id":"H3","heat":3,"title":"Cultural sites II: temples","hi":"सांस्कृतिक स्थल II: मंदिर","blocks":[{"k":"hot","h":"Most asked: <b>which dynasty<\/b> built each temple site (Pallava, Chola, Chandela, Chalukya, Hoysala, Kakatiya), <b>Konark<\/b> as Surya's chariot, <b>Hampi<\/b> as the Vijayanagara capital, <b>Rani ki Vav<\/b> (₹100 note) and the recent pair — <b>Ramappa<\/b> (2021) and the <b>Hoysala<\/b> temples (2023)."},{"k":"story","h":"<p>Picture a road trip down the east coast and across the Deccan. At <b>Mahabalipuram<\/b> the Pallavas cut whole temples out of boulders and built the Shore Temple facing the Bay of Bengal. Up north in Odisha, the Eastern Ganga king Narasimhadeva I turned the <b>Sun Temple at Konark<\/b> into a giant stone chariot with 24 wheels and seven horses.<\/p><p>In the Tamil country the Cholas raised the towering <b>Brihadisvara<\/b> of Thanjavur. In Karnataka, the Chalukyas tried out northern and southern styles side by side at <b>Pattadakal<\/b>; centuries later the Hoysalas carved star-shaped soapstone temples at <b>Belur, Halebidu and Somanathapura<\/b>, and the Vijayanagara kings built their capital at <b>Hampi<\/b>.<\/p><p>In central India the Chandelas built <b>Khajuraho<\/b>; in Telangana the Kakatiyas built the <b>Ramappa<\/b> temple; and in Gujarat Queen Udayamati built <b>Rani ki Vav<\/b>, a stepwell carved like an upside-down temple.<\/p>","key":"Pallava — Mahabalipuram · Eastern Ganga — Konark · Chandela — Khajuraho · Vijayanagara — Hampi · Chalukya — Pattadakal · Chola — Thanjavur · Solanki — Rani ki Vav · Kakatiya — Ramappa · Hoysala — Belur."},{"k":"table","title":"The temple sites","head":["Site","State","Year","Dynasty","Remember"],"rows":[["<b>Group of Monuments at Mahabalipuram<\/b>","Tamil Nadu","1984","Pallavas","Rathas, Arjuna's Penance and the Shore Temple, by the sea south of Chennai."],["<b>Sun Temple, Konark<\/b>","Odisha","1984","Eastern Gangas","Surya's chariot in stone, built by Narasimhadeva I in the 13th century."],["<b>Khajuraho Group of Monuments<\/b>","Madhya Pradesh","1986","Chandelas","Hindu and Jain temples of about 950–1050; Kandariya Mahadeva is the largest."],["<b>Group of Monuments at Hampi<\/b>","Karnataka","1986","Vijayanagara kings","The last great Hindu capital of the south, on the Tungabhadra; the Vitthala temple's stone chariot."],["<b>Group of Monuments at Pattadakal<\/b>","Karnataka","1987","Chalukyas of Badami","Nagara and Dravida temples side by side on the Malaprabha; the Virupaksha temple."],["<b>Great Living Chola Temples<\/b>","Tamil Nadu","1987","Cholas","Brihadisvara at Thanjavur (1987); Gangaikondacholapuram and Darasuram added in 2004."],["<b>Rani ki Vav, Patan<\/b>","Gujarat","2014","Chaulukyas (Solankis)","A stepwell built in memory of Bhima I by Queen Udayamati, on the Saraswati."],["<b>Kakatiya Rudreshwara (Ramappa) Temple<\/b>","Telangana","2021","Kakatiyas","Built in 1213 at Palampet; named after its sculptor Ramappa."],["<b>Sacred Ensembles of the Hoysalas<\/b>","Karnataka","2023","Hoysalas","Belur, Halebidu and Somanathapura — star-shaped temples of soapstone."]]},{"k":"facts","title":"Inside each site","rows":[["Mahabalipuram (Mamallapuram)","<b>Pancha Rathas<\/b> — five monolithic shrines named after the Pandavas and Draupadi — and the open-air relief of <b>Arjuna's Penance<\/b> (Descent of the Ganga), from the time of <b>Narasimhavarman I Mamalla<\/b> (7th century); the <b>Shore Temple<\/b> is of <b>Narasimhavarman II (Rajasimha)<\/b>, about 700 CE"],["Konark","Called the <b>Black Pagoda<\/b> by sailors; about 1250 CE; Kalinga style; the stone wheel is on the ₹10 note"],["Khajuraho","Chhatarpur district; of about 85 temples, some 25 survive in western, eastern and southern groups; Hindu (Kandariya Mahadeva, Lakshmana) and Jain (Parsvanatha); the Khajuraho Dance Festival is held each February"],["Hampi","Founded about 1336 by Harihara and Bukka; the living <b>Virupaksha<\/b> temple, the <b>Vitthala<\/b> temple with its stone chariot (₹50 note) and musical pillars, the Lotus Mahal; sacked after the <b>Battle of Talikota (1565)<\/b>"],["Pattadakal","Bagalkot district; the Chalukya coronation town; the <b>Virupaksha<\/b> temple was built by Queen <b>Lokamahadevi<\/b> to mark Vikramaditya II's victory over the Pallavas of Kanchi"],["Great Living Chola Temples","<b>Brihadisvara, Thanjavur<\/b> — Rajaraja I, completed about 1010; <b>Gangaikondacholapuram<\/b> — Rajendra I; <b>Airavatesvara, Darasuram<\/b> — Rajaraja II. 'Living' because worship still goes on"],["Rani ki Vav","Seven levels, hundreds of sculptures, mostly of Vishnu's avatars; silted up for centuries and dug out by the ASI; on the ₹100 note"],["Ramappa","Palampet, Mulugu district; built by Recharla Rudra, general of the Kakatiya king Ganapati Deva; light 'floating' bricks in its tower and a sand-box foundation against earthquakes"],["Hoysala temples","<b>Chennakeshava, Belur<\/b> (Vishnuvardhana, 1117); <b>Hoysaleswara, Halebidu<\/b> (12th century, at the old capital Dwarasamudra); <b>Keshava, Somanathapura<\/b> (1268); star-shaped plans on a raised platform (<b>jagati<\/b>), of soapstone"]]},{"k":"trick","h":"<b>Two by sea in '84<\/b> — Mahabalipuram and Konark, both on the east coast, both 1984. <b>Karnataka's three temple sites, oldest listed first<\/b> — <b>H<\/b>ampi '86, <b>P<\/b>attadakal '87, <b>H<\/b>oysala '23: “Hampi, Pattadakal, Hoysala — HPH”."},{"k":"trap","h":"<b>Konark<\/b> is the Black Pagoda; the <b>White Pagoda<\/b> is the Jagannath temple at Puri, which is <b>not<\/b> a World Heritage site. <b>Brihadisvara of Thanjavur<\/b> was built by <b>Rajaraja I<\/b>; <b>Gangaikondacholapuram<\/b> by his son <b>Rajendra I<\/b>. <b>Aihole<\/b>, <b>Badami<\/b> and the <b>Modhera<\/b> Sun Temple are on the Tentative List only. <b>Ramappa<\/b> is in <b>Telangana<\/b>, not Andhra Pradesh."},{"k":"link","h":"The temple styles (Nagara, Dravida, Vesara) and famous temples that are not World Heritage sites come in lesson H8."}],"sum":["Mahabalipuram (Pallavas) and Konark (Eastern Gangas) were inscribed in 1984.","Khajuraho (Chandelas, MP) and Hampi (Vijayanagara, Karnataka) in 1986; Pattadakal (Chalukyas) and the Chola temples in 1987.","Brihadisvara, Thanjavur — Rajaraja I; Gangaikondacholapuram — Rajendra I; Darasuram — Rajaraja II (added 2004).","Rani ki Vav (Patan, 2014) is a stepwell built by Queen Udayamati; it is on the ₹100 note.","Ramappa (Telangana, 2021) is named after its sculptor; Hoysala temples of Belur, Halebidu and Somanathapura (2023).","Konark is the Black Pagoda; Hampi's stone chariot is on the ₹50 note, Konark's wheel on the ₹10 note."],"part":["Part 1 · The list, ancient sites and temples","विश्व धरोहर सूची, प्राचीन स्थल और मंदिर"],"g":"hm"},
{"id":"H4","heat":3,"title":"Cultural sites III: Mughal, Sultanate and forts","hi":"सांस्कृतिक स्थल III: मुगल, सल्तनत और किले","blocks":[{"k":"hot","h":"Most asked: the <b>Taj Mahal<\/b> (builder, architect, marble), <b>Agra Fort vs Red Fort<\/b>, <b>Fatehpur Sikri<\/b> and the <b>Buland Darwaza<\/b>, <b>Qutb Minar<\/b> (Aibak → Iltutmish), <b>Humayun's Tomb<\/b> (first garden-tomb), the six <b>Hill Forts of Rajasthan<\/b>, and the newer sites — <b>Moidams<\/b> (2024) and the <b>Maratha Military Landscapes<\/b> (2025)."},{"k":"story","h":"<p>Delhi's story is told in stone. Qutb-ud-din Aibak began the <b>Qutb Minar<\/b> as a tower of victory; Iltutmish finished it. Three centuries later Humayun's widow raised the first great Mughal garden-tomb, <b>Humayun's Tomb<\/b>, which later inspired the Taj.<\/p><p>Akbar rebuilt <b>Agra Fort<\/b> in red sandstone and founded a new city, <b>Fatehpur Sikri<\/b>, in honour of the Sufi saint Salim Chishti. His grandson Shah Jahan built the <b>Taj Mahal<\/b> for his wife Mumtaz Mahal, then moved the capital to Delhi and built the <b>Red Fort<\/b>.<\/p><p>Away from the Mughals, Rajput kings crowned the Aravalli hills with forts, Mahmud Begada built his capital at <b>Champaner<\/b>, the Ahom kings of Assam buried their dead in great mounds at <b>Charaideo<\/b>, and Shivaji and his successors held the Sahyadri with a chain of hill and sea forts — the <b>Maratha Military Landscapes<\/b>.<\/p>","key":"Agra: Fort (Akbar) + Taj (Shah Jahan) + Fatehpur Sikri (Akbar) · Delhi: Humayun's Tomb, Qutb Minar, Red Fort · forts: Rajasthan's six (2013), the Marathas' twelve (2025)."},{"k":"table","title":"Sultanate, Mughal and fort sites","head":["Site","State / UT","Year","Remember"],"rows":[["<b>Agra Fort<\/b>","Uttar Pradesh","1983","Akbar rebuilt it in red sandstone from 1565; Jahangir and Shah Jahan added palaces."],["<b>Taj Mahal<\/b>","Uttar Pradesh","1983","Shah Jahan's tomb for Mumtaz Mahal on the Yamuna, built 1632–1653."],["<b>Fatehpur Sikri<\/b>","Uttar Pradesh","1986","Akbar's 'City of Victory' (1571–1585), with the Buland Darwaza."],["<b>Humayun's Tomb, Delhi<\/b>","Delhi","1993","The first garden-tomb of the subcontinent, built 1565–1572."],["<b>Qutb Minar and its Monuments, Delhi<\/b>","Delhi","1993","Begun by Qutb-ud-din Aibak and finished by Iltutmish; the Iron Pillar stands in the complex."],["<b>Red Fort Complex<\/b>","Delhi","2007","Shah Jahan's palace-fort of Shahjahanabad, built 1639–1648, with Salimgarh Fort."],["<b>Champaner-Pavagadh Archaeological Park<\/b>","Gujarat","2004","Mahmud Begada's capital below Pavagadh hill, with the Kalika Mata temple on top."],["<b>Hill Forts of Rajasthan<\/b>","Rajasthan","2013","Six Rajput forts: Chittorgarh, Kumbhalgarh, Ranthambore, Gagron, Amber, Jaisalmer."],["<b>Moidams – the Mound-Burial System of the Ahom Dynasty<\/b>","Assam","2024","Royal burial mounds at Charaideo, the first Ahom capital."],["<b>Maratha Military Landscapes of India<\/b>","Maharashtra and Tamil Nadu","2025","Twelve forts of the 17th–19th centuries — eleven in Maharashtra and Gingee in Tamil Nadu."]]},{"k":"facts","title":"The Mughal sites in detail","rows":[["Taj Mahal","Architect <b>Ustad Ahmad Lahauri<\/b>; white marble from <b>Makrana<\/b> (Rajasthan) inlaid with semi-precious stones (<b>pietra dura<\/b>); a charbagh garden in front; listed on criterion (i) alone"],["Agra Fort","Akbar's red sandstone fort; Shah Jahan added white marble palaces and the Moti Masjid; Aurangzeb kept Shah Jahan prisoner here, in the Musamman Burj, until he died (1666)"],["Fatehpur Sikri","Built for Akbar's capital (1571–1585) in honour of <b>Shaikh Salim Chishti<\/b>; the Jama Masjid, the <b>Buland Darwaza<\/b> (for the Gujarat victory), the Panch Mahal, the Diwan-i-Khas with its single central pillar; left soon after, partly for want of water"],["Humayun's Tomb","Commissioned by Humayun's widow <b>Bega Begum<\/b>; Persian architect <b>Mirak Mirza Ghiyas<\/b>; red sandstone and white marble; so many Mughals are buried here that it is called the 'dormitory of the Mughals'"],["Qutb complex","Qutb Minar (about 73 m, five storeys) — begun by <b>Aibak<\/b>, finished by <b>Iltutmish<\/b>, top storeys repaired by <b>Firoz Shah Tughlaq<\/b>; Quwwat-ul-Islam mosque; the rust-free <b>Iron Pillar<\/b> of the Gupta age; Alai Darwaza and the unfinished Alai Minar of Alauddin Khalji; Iltutmish's tomb"],["Red Fort","Built 1639–1648 when Shah Jahan moved his capital to <b>Shahjahanabad<\/b>; Diwan-i-Am, Diwan-i-Khas, Rang Mahal; the Prime Minister speaks from the <b>Lahori Gate<\/b> on Independence Day; on the ₹500 note"]]},{"k":"facts","title":"Forts and other sites","rows":[["Hill Forts of Rajasthan (2013)","<b>Chittorgarh<\/b> (largest; Mewar), <b>Kumbhalgarh<\/b> (Rana Kumbha; a wall about 36 km long), <b>Ranthambore<\/b> (Sawai Madhopur), <b>Gagron<\/b> (Jhalawar; a water fort between two rivers), <b>Amber<\/b> (Jaipur), <b>Jaisalmer<\/b> (a living fort of yellow sandstone)"],["Maratha Military Landscapes (2025)","Twelve forts in five types — hill, hill-forest, hill-plateau, coastal and island — built, adapted or expanded by the Marathas from the late 17th to the early 19th century; listed on criteria (iv) and (vi)"],["Champaner-Pavagadh (2004)","Mahmud Begada took it in 1484 and made it his capital; the Jami Masjid; the only complete, unchanged pre-Mughal Islamic city; the Kalika Mata temple on Pavagadh hill"],["Moidams (2024)","Earth-and-brick burial mounds of Ahom royalty at <b>Charaideo<\/b>, the capital founded by <b>Sukaphaa<\/b> in 1253; called the 'pyramids of Assam'; the Ahoms ruled for about 600 years (1228–1826)"]]},{"k":"table","title":"The twelve Maratha forts","head":["Fort","Type and place","Remember"],"rows":[["Shivneri","Hill fort, Pune district","Birthplace of Shivaji (1630)"],["Lohagad","Hill fort, Pune district","Guarded the trade route over the Western Ghats"],["Raigad","Hill fort, Raigad district","Capital; Shivaji's coronation (1674)"],["Rajgad","Hill fort, Pune district","Shivaji's first capital"],["Salher","Hill fort, Nashik district","One of the highest forts of the Sahyadri; Maratha victory of 1672"],["Pratapgad","Hill-forest fort, Satara district","Where Shivaji killed Afzal Khan (1659)"],["Panhala","Hill-plateau fort, Kolhapur district","A large plateau fort; Shivaji's escape of 1660"],["Vijaydurg","Coastal fort, Sindhudurg district","An old sea-facing fort strengthened by the Marathas"],["Sindhudurg","Island fort off Malvan","Built by Shivaji in the sea"],["Suvarnadurg","Island fort, Ratnagiri district","A naval base of the Maratha fleet"],["Khanderi","Island fort off Alibag","Built by Shivaji near the mouth of Mumbai harbour"],["Gingee","Hill fort, Tamil Nadu","The 'Troy of the East'; Rajaram held out here against the Mughals"]]},{"k":"trick","h":"<b>Agra's three<\/b> — “<b>F<\/b>ort, <b>T<\/b>aj, <b>F<\/b>atehpur” — Akbar, Shah Jahan, Akbar. <b>Delhi's three<\/b> — “<b>Q<\/b>uick <b>H<\/b>umble <b>R<\/b>ed”: Qutb (1993), Humayun (1993), Red Fort (2007). Rajasthan's six forts — “<b>C<\/b>an <b>K<\/b>ing <b>R<\/b>ana <b>G<\/b>et <b>A<\/b>ll <b>J<\/b>ewels”: Chittorgarh, Kumbhalgarh, Ranthambore, Gagron, Amber, Jaisalmer."},{"k":"trap","h":"<b>Mehrangarh<\/b> (Jodhpur), <b>Junagarh<\/b> (Bikaner) and <b>Golconda<\/b> are <b>not<\/b> World Heritage sites. <b>Sinhagad<\/b> is not among the twelve Maratha forts. <b>Gingee<\/b>, the twelfth, is in <b>Tamil Nadu<\/b>. The <b>Buland Darwaza<\/b> is at Fatehpur Sikri, not Agra Fort. <b>Itimad-ud-Daulah<\/b>, <b>Akbar's tomb at Sikandra<\/b> and <b>Bibi ka Maqbara<\/b> are not on the list."},{"k":"link","h":"Mughal architecture (pietra dura, charbagh, the true arch) is explained in <a href=\"study-art-culture.html\">Art &amp; Culture<\/a>; the reigns behind these buildings are in Medieval India. Who built the other Sultanate and Mughal monuments is in lesson H7."}],"sum":["Agra Fort and Taj Mahal (1983), Fatehpur Sikri (1986) — all in Uttar Pradesh.","Humayun's Tomb and Qutb Minar (1993), Red Fort (2007) — all in Delhi.","Taj Mahal: Shah Jahan for Mumtaz Mahal; architect Ustad Ahmad Lahauri; Makrana marble.","Humayun's Tomb was the first garden-tomb; Qutb Minar was begun by Aibak and finished by Iltutmish.","Hill Forts of Rajasthan (2013): Chittorgarh, Kumbhalgarh, Ranthambore, Gagron, Amber, Jaisalmer.","Champaner-Pavagadh (Gujarat, 2004) was Mahmud Begada's capital.","Moidams of Charaideo (Assam, 2024); Maratha Military Landscapes — twelve forts, Gingee in Tamil Nadu (2025)."],"part":["Part 2 · Forts, cities and nature","किले, नगर और प्रकृति"],"g":"hm"},
{"id":"H5","heat":2,"title":"Cultural sites IV: colonial, modern and city sites","hi":"सांस्कृतिक स्थल IV: औपनिवेशिक, आधुनिक और नगर स्थल","blocks":[{"k":"hot","h":"Most asked: <b>Ahmedabad<\/b> as India's first World Heritage city, <b>Jaipur City<\/b> (2019) and its founder, the <b>Mountain Railways<\/b> (three lines, three years), <b>CST<\/b> and its architect, <b>Le Corbusier<\/b> and Chandigarh, and <b>Santiniketan<\/b> (2023)."},{"k":"story","h":"<p>Not every World Heritage site is ancient. The Portuguese built the great churches of <b>Old Goa<\/b> in the 16th and 17th centuries. In the 19th century the British gave Bombay its Gothic railway station, <b>Victoria Terminus<\/b> — now Chhatrapati Shivaji Terminus — and a row of Gothic courts and colleges along the <b>Oval Maidan<\/b>; across the same ground, in the 1930s, came a row of Art Deco flats and cinemas.<\/p><p>Meanwhile engineers pushed little railways up the hills to <b>Darjeeling<\/b>, <b>Ooty<\/b> and <b>Shimla<\/b>. After Independence, Nehru invited the Swiss-French architect <b>Le Corbusier<\/b> to design Punjab's new capital, Chandigarh.<\/p><p>Whole cities are on the list too. <b>Ahmedabad<\/b>, founded in 1411, was the first Indian city inscribed (2017); <b>Jaipur<\/b>, laid out in 1727 by Sawai Jai Singh II, followed in 2019. And in 2023 came <b>Santiniketan<\/b>, where Rabindranath Tagore taught under the trees.<\/p>","key":"Goa churches 1986 · CST 2004 · Jantar Mantar 2010 · Chandigarh 2016 · Ahmedabad 2017 · Mumbai ensembles 2018 · Jaipur 2019 · Santiniketan 2023 · railways 1999/2005/2008."},{"k":"table","title":"Colonial, modern and city sites","head":["Site","State / UT","Year","Remember"],"rows":[["<b>Churches and Convents of Goa<\/b>","Goa","1986","Old Goa, the Portuguese capital; the Basilica of Bom Jesus holds the body of St Francis Xavier."],["<b>Chhatrapati Shivaji Terminus<\/b>","Maharashtra","2004","Mumbai's Victorian Gothic railway station by F. W. Stevens, opened as Victoria Terminus (1887–88)."],["<b>Jantar Mantar, Jaipur<\/b>","Rajasthan","2010","Sawai Jai Singh II's stone observatory of the 1720s–30s; the Samrat Yantra sundial."],["<b>Capitol Complex, Chandigarh<\/b>","Chandigarh","2016","Le Corbusier's Assembly, Secretariat and High Court, part of his work in seven countries."],["<b>Historic City of Ahmedabad<\/b>","Gujarat","2017","Walled city founded by Sultan Ahmad Shah in 1411; pols and the Sidi Saiyyed jali; India's first World Heritage city."],["<b>Victorian Gothic and Art Deco Ensembles of Mumbai<\/b>","Maharashtra","2018","19th-century Gothic public buildings and 20th-century Art Deco buildings facing each other across the Oval Maidan."],["<b>Jaipur City<\/b>","Rajasthan","2019","The Pink City, founded in 1727 by Sawai Jai Singh II on a grid plan."],["<b>Santiniketan<\/b>","West Bengal","2023","Rabindranath Tagore's ashram-school, which grew into Visva-Bharati University."]]},{"k":"table","title":"The Mountain Railways of India (one site, three lines)","head":["Railway","State","Year added","Remember"],"rows":[["<b>Darjeeling Himalayan Railway<\/b>","West Bengal","1999","The 'Toy Train' from New Jalpaiguri, opened in 1881; loops and zigzags, and Ghum, its highest station."],["<b>Nilgiri Mountain Railway<\/b>","Tamil Nadu","2005","Mettupalayam to Udhagamandalam (Ooty), opened in 1908; a rack-and-pinion line on its steepest part."],["<b>Kalka–Shimla Railway<\/b>","Himachal Pradesh","2008","Opened in 1903; about 96 km with more than 100 tunnels; it starts at Kalka in Haryana."]]},{"k":"facts","title":"More on each site","rows":[["Old Goa","The <b>Basilica of Bom Jesus<\/b> (St Francis Xavier's remains), the <b>Se Cathedral<\/b>, the Church of St Francis of Assisi; the city was called the 'Rome of the East'"],["CST, Mumbai","Designed by <b>Frederick William Stevens<\/b>; built 1878–1888 and named after Queen Victoria in her Golden Jubilee year; Victorian Gothic Revival with Indian touches; headquarters of the Central Railway; renamed in 1996"],["Mumbai ensembles","Gothic side: the <b>Bombay High Court<\/b> and the <b>University of Mumbai<\/b> with the <b>Rajabai Clock Tower<\/b>; Art Deco side: buildings of the Backbay reclamation and <b>Marine Drive<\/b>, such as the Eros cinema"],["Capitol Complex","Planned by <b>Le Corbusier<\/b> in the 1950s with the Palace of Assembly, the Secretariat, the High Court and the <b>Open Hand Monument<\/b>; one of 17 sites of 'The Architectural Work of Le Corbusier' across seven countries — India's first transnational site"],["Ahmedabad","Founded by <b>Sultan Ahmad Shah I<\/b> on the Sabarmati; Bhadra fort, Teen Darwaza, Jama Masjid, the <b>Sidi Saiyyed<\/b> mosque's tree jali, and the <b>pols<\/b> — gated lanes of wooden houses"],["Jaipur","Founded in 1727 by <b>Sawai Jai Singh II<\/b> and planned by <b>Vidyadhar Bhattacharya<\/b> on a grid; painted pink in 1876 to welcome the Prince of Wales; Hawa Mahal and City Palace are inside"],["Jantar Mantar","Sawai Jai Singh II built five observatories — Delhi, Jaipur, Ujjain, Varanasi and Mathura; only <b>Jaipur's<\/b> is a World Heritage site. Its <b>Samrat Yantra<\/b> is one of the largest stone sundials in the world"],["Santiniketan","Birbhum district; <b>Debendranath Tagore<\/b> set up an ashram here in 1863; <b>Rabindranath<\/b> began a school in 1901 and founded <b>Visva-Bharati<\/b> in 1921; it became a central university in 1951"]]},{"k":"trick","h":"Railways in the order they joined — “<b>D-N-K<\/b>, '99-'05-'08”: <b>D<\/b>arjeeling 1999, <b>N<\/b>ilgiri 2005, <b>K<\/b>alka–Shimla 2008. Cities in order — “<b>A<\/b>hmedabad <b>J<\/b>umps first, <b>J<\/b>aipur follows”: Ahmedabad 2017, Jaipur 2019."},{"k":"trap","h":"<b>Matheran Hill Railway<\/b> and the <b>Kangra Valley Railway<\/b> are on the Tentative List, not inscribed. Only <b>Jaipur's<\/b> Jantar Mantar is a World Heritage site, not Delhi's. Chandigarh's <b>Rock Garden<\/b> (Nek Chand) is not part of the site. Jaipur City (2019) and Jantar Mantar (2010) are <b>two separate<\/b> sites. <b>Ahmedabad<\/b>, not Jaipur, was the first Indian city."}],"sum":["Churches and Convents of Goa (1986): Bom Jesus holds St Francis Xavier's remains.","CST (2004) by F. W. Stevens — once Victoria Terminus; the Victorian Gothic and Art Deco ensembles of Mumbai (2018) face each other across the Oval Maidan.","Jantar Mantar, Jaipur (2010) — Sawai Jai Singh II; Jaipur City (2019) — founded 1727, planned by Vidyadhar Bhattacharya.","Capitol Complex, Chandigarh (2016) — Le Corbusier; India's first transnational site.","Ahmedabad (2017) was India's first World Heritage city.","Mountain Railways: Darjeeling 1999, Nilgiri 2005, Kalka–Shimla 2008.","Santiniketan (2023): Debendranath Tagore's ashram, Rabindranath's Visva-Bharati."],"part":["Part 2 · Forts, cities and nature","किले, नगर और प्रकृति"],"g":"hm"},
{"id":"H6","heat":2,"title":"Natural and mixed sites","hi":"प्राकृतिक और मिश्रित स्थल","blocks":[{"k":"hot","h":"Most asked: the <b>seven natural sites<\/b> and their states, the <b>only mixed site<\/b> (Khangchendzonga), the <b>Western Ghats<\/b> (four states), and <b>Manas<\/b> on the danger list."},{"k":"story","h":"<p>India's natural sites trace a line across the country: rhinos and wild buffalo in <b>Assam<\/b> (Kaziranga, Manas, both 1985), birds in a Rajasthan wetland (<b>Keoladeo<\/b>, 1985), tigers in the mangroves of <b>Bengal<\/b> (Sundarbans, 1987), the high peaks and meadows of <b>Uttarakhand<\/b> (Nanda Devi 1988, Valley of Flowers 2005) and <b>Himachal<\/b> (Great Himalayan, 2014), and the long green wall of the <b>Western Ghats<\/b> (2012).<\/p><p>One site is valued for both nature and culture: <b>Khangchendzonga<\/b> in Sikkim (2016), where the mountain is a god for the Lepcha people and its valleys are sacred hidden lands for Buddhists.<\/p>","key":"Seven natural sites + one mixed (Khangchendzonga) · Western Ghats in four states · Manas once in danger."},{"k":"table","title":"Natural sites and the mixed site","head":["Site","State","Year","Remember"],"rows":[["<b>Kaziranga National Park<\/b>","Assam","1985","Two-thirds of the world's one-horned rhinoceroses; on the Brahmaputra floodplain."],["<b>Manas Wildlife Sanctuary<\/b>","Assam","1985","On the Bhutan border; pygmy hog and golden langur; on the danger list 1992–2011."],["<b>Keoladeo National Park<\/b>","Rajasthan","1985","The Bharatpur wetland, once a maharaja's duck-shooting reserve; once the winter home of the Siberian crane."],["<b>Sundarbans National Park<\/b>","West Bengal","1987","The largest mangrove forest; tigers that swim; Bangladesh's part is a separate site."],["<b>Nanda Devi and Valley of Flowers National Parks<\/b>","Uttarakhand","1988","Chamoli district; Valley of Flowers added in 2005."],["<b>Great Himalayan National Park Conservation Area<\/b>","Himachal Pradesh","2014","Kullu district; the western Himalaya's high forests and meadows."],["<b>Khangchendzonga National Park<\/b>","Sikkim","2016","India's only mixed site; sacred to the Lepcha and to Buddhists."],["<b>Western Ghats<\/b>","Kerala, Karnataka, Tamil Nadu, Maharashtra","2012","39 component parts — national parks, sanctuaries and reserve forests; a biodiversity hotspot."]]},{"k":"facts","title":"Points the National Parks app does not stress","rows":[["Western Ghats","Older than the Himalayas; 39 parts in <b>four<\/b> states (Goa is not one of them); listed for biodiversity (criteria ix and x)"],["Manas","UNESCO lists it as a <b>Wildlife Sanctuary<\/b>; it was on the List of World Heritage in Danger from 1992 to 2011, after damage during unrest"],["Sundarbans","India's site is the Sundarbans National Park (1987); <b>Bangladesh's<\/b> Sundarbans is a separate site (1997)"],["Khangchendzonga","Mixed site — natural (criteria vii and x) and cultural (iii and vi); the world's third-highest peak"],["Other UNESCO lists","India has <b>13<\/b> biosphere reserves in UNESCO's World Network of Biosphere Reserves (Man and the Biosphere); the latest is the <b>Cold Desert<\/b> reserve, Himachal Pradesh (September 2025). Ramsar wetlands come under a separate treaty, the Ramsar Convention"]]},{"k":"trick","h":"The 1985 trio is <b>“K-M-K”<\/b> — Kaziranga, Manas, Keoladeo. Everything natural ends with the <b>Himalaya<\/b> (Great Himalayan 2014) and the one <b>mixed<\/b> site in Sikkim (2016)."},{"k":"trap","h":"The only mixed site is <b>Khangchendzonga<\/b>, not Nanda Devi. <b>Keoladeo<\/b> is in <b>Rajasthan<\/b>, not Gujarat. The <b>Valley of Flowers<\/b> joined in <b>2005<\/b>, not 1988. A biosphere reserve on UNESCO's network is <b>not<\/b> a World Heritage site."},{"k":"link","h":"Each of these parks — its animals, its records and its map — is covered in the World Heritage lesson (N10) of <a href=\"study-national-parks.html\">National Parks of India<\/a>."}],"sum":["Seven natural sites: Kaziranga, Manas, Keoladeo (1985); Sundarbans (1987); Nanda Devi and Valley of Flowers (1988, 2005); Western Ghats (2012); Great Himalayan NP (2014).","One mixed site: Khangchendzonga, Sikkim (2016).","The Western Ghats site has 39 parts in Kerala, Karnataka, Tamil Nadu and Maharashtra.","Manas was on the danger list from 1992 to 2011.","India has 13 UNESCO biosphere reserves; the latest is the Cold Desert (2025)."],"part":["Part 2 · Forts, cities and nature","किले, नगर और प्रकृति"],"g":"hm"}

const QB = [
["H1","The World Heritage Convention was adopted by UNESCO's General Conference in which year?",["1972","1945","1978","2003"],"It was adopted on 16 November 1972 in Paris. UNESCO itself dates from 1945, the first list from 1978, and the intangible heritage convention from 2003.",""],

["H1","In which year were India's first World Heritage sites inscribed?",["1983","1977","1985","1972"],"Ajanta, Ellora, Agra Fort and the Taj Mahal were inscribed in 1983. The first natural sites followed in 1985.",""],
["H1","Which four sites were India's first on the World Heritage list?",["Ajanta, Ellora, Agra Fort and Taj Mahal","Taj Mahal, Red Fort, Qutb Minar and Humayun's Tomb","Ajanta, Ellora, Elephanta and Sanchi","Konark, Mahabalipuram, Khajuraho and Hampi"],"The 1983 four were two cave sites of Maharashtra and two Mughal monuments of Agra.",""],

:root[data-skin] body{background-color:var(--app-bg);background-image:var(--app-pattern);background-size:var(--app-psize);background-attachment:fixed}
:root[data-skin] h1,:root[data-skin] h2{letter-spacing:-.01em}

/* ===== Desktop layout (PC / tablet landscape) ===== */
@media (min-width: 1024px){
  :root{--side:236px}
  body{padding-left:var(--side);font-size:16.5px}
  .top{border-bottom:1px solid var(--rule)}
  .top-in{max-width:1320px;padding:16px 36px}
  .brand{font-size:21px}
  .brand small{font-size:13px}
  .stat{font-size:13px}
  .wrap{max-width:1320px;padding:0 36px 56px}
  .view{padding-top:28px}
  h1{font-size:34px} h2{font-size:22px} h3{font-size:17px}

  /* bottom tab bar becomes a left sidebar */
  .nav{top:0;bottom:0;left:0;right:auto;width:var(--side);height:auto;border-top:0;border-right:1px solid var(--rule);padding:84px 14px 20px;display:block;overflow:auto}
  .nav-in{display:flex;flex-direction:column;gap:4px;height:auto;max-width:none;margin:0}
  .nav-in::before{content:"Sections";display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:0 14px 8px}
  .nav button{flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-size:15px;min-height:0;height:auto;width:100%;text-align:left}
  .nav button svg{width:20px;height:20px;flex-shrink:0}
  .nav button:hover{background:var(--sunk)}
  .nav button[aria-current="page"]{background:var(--blue-bg)}
  .nav button[aria-current="page"] span{border-bottom:0!important}

  /* home: intro beside progress */
  .hero{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);column-gap:48px;align-items:end;padding-bottom:10px}
  .hero > .eyebrow,.hero > h1,.hero > p{grid-column:1}
  .hero > .meter{grid-column:2;grid-row:3;align-self:center}
  .hero > .row{grid-column:2;grid-row:2;align-self:end}

  /* lesson reader: facts, timelines, tricks sit side by side */
  .lhead{margin-bottom:0}
  .steps{max-width:640px}
  .steps + .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .steps + .stack > .plain,.steps + .stack > .row,.steps + .stack > p,.steps + .stack > .fig,.steps + .stack > h2,.steps + .stack > .tbl{grid-column:1/-1}
  .steps + .stack > .plain{max-width:86ch;font-size:17px}
  .steps + .stack > .hot,.steps + .stack > .story{grid-column:1/-1}
  .steps + .stack > .story{max-width:none;padding:20px 24px;font-size:17.5px}
  .steps + .stack > .story p{max-width:80ch}
  .steps + .stack:not(:has(> .block ~ .block)) > .block{grid-column:1/-1}
  .block,.qcard{padding:18px 20px;border-radius:14px}

  /* quizzes and question bank */
  #lq > .stack{display:grid;grid-template-columns:minmax(0,1fr);max-width:980px;gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qt{font-size:18px}
  #plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #plist .opts{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:wrap;overflow:visible}

  /* mock test: question with the answer grid alongside */
  .mbar{top:calc(env(safe-area-inset-top,0px) + 67px)}
  .view > .qcard{max-width:1000px}
  .view > .row.between{max-width:1000px}
  .view > #msub{max-width:1000px;width:100%}
  .view > .block.stack{max-width:760px}
  .pal{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .kpis{max-width:760px}

  /* revise: summary cards and sheets in columns */
  #rv > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #rv > .stack > .grph,#rv > .stack > p,#rv > .stack > .search,#rv > .stack > .callout{grid-column:1/-1}
  #dgl,#lml,#tll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #dgl > .grph,#dgl > p,#lml > p,#tll > .grph{grid-column:1/-1}
  #rv .search,#rv > #dgl ~ .search{max-width:520px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flash{min-height:300px;max-width:760px;margin:0 auto;padding:32px 36px}
  .flash .front{font-size:22px}

  /* learn: era cards across the top */
  .eras{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}
  .les{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}

</style>
<script id="shabd-deeplink">
(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();
</script>
</body>
</html>

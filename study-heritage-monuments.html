{"id":"H10","heat":2,"title":"Mixed revision: notes, nicknames and look-alikes","hi":"मिश्रित पुनरावृत्ति: नोट, उपनाम और भ्रम","blocks":[{"k":"hot","h":"Revision of the whole app, plus three things SSC likes to slip in: <b>which heritage site is on which banknote<\/b>, <b>nicknames<\/b> (Black Pagoda, Baby Taj, Taj of the Deccan) and <b>famous places that are not World Heritage sites<\/b>."},{"k":"story","h":"<p>Take a ₹10, ₹20, ₹50, ₹100, ₹200 and ₹500 note out of your wallet and turn them over: Konark, Ellora, Hampi, Rani ki Vav, Sanchi and the Red Fort — six World Heritage sites in your pocket. That is the first table of this lesson.<\/p><p>The second is a list of nicknames, which exams use to disguise a monument. The third is a warning list: famous, beautiful, often visited — and still not World Heritage sites. Then come mixed questions from every lesson.<\/p>","key":"₹10 Konark · ₹20 Ellora · ₹50 Hampi · ₹100 Rani ki Vav · ₹200 Sanchi · ₹500 Red Fort."},{"k":"table","title":"Heritage on the new banknotes (Mahatma Gandhi New Series)","head":["Note","Heritage site on the back","Remember"],"rows":[["₹10","Sun Temple, Konark","The chocolate-brown note shows a wheel of the Konark chariot."],["₹20","Ellora Caves","The greenish-yellow note shows the Ellora caves."],["₹50","Hampi with its stone chariot","The fluorescent-blue note shows the stone chariot of Hampi."],["₹100","Rani ki Vav","The lavender note shows the stepwell of Patan."],["₹200","Sanchi Stupa","The bright-yellow note shows the Great Stupa of Sanchi."],["₹500","Red Fort","The stone-grey note shows the Red Fort."]]},{"k":"table","title":"Nicknames","head":["Nickname","Monument or place","Why"],"rows":[["Black Pagoda","Sun Temple, Konark","Its dark tower guided sailors."],["White Pagoda","Jagannath Temple, Puri","Its whitewashed tower was a landmark from the sea."],["Baby Taj","Tomb of Itimad-ud-Daulah, Agra","Nur Jahan's marble tomb for her father, older than the Taj."],["Taj of the Deccan","Bibi ka Maqbara, Aurangabad","A smaller copy of the Taj Mahal's plan."],["Great Wall of India","Kumbhalgarh Fort","Its wall runs for about 36 km."],["Troy of the East","Gingee Fort","The British called it so for its strength."],["Pyramids of Assam","Moidams of Charaideo","Royal mound burials of the Ahoms."],["Queen of Stepwells","Rani ki Vav, Patan","The finest stepwell of Gujarat."],["Dormitory of the Mughals","Humayun's Tomb","More than a hundred Mughal graves lie in it."],["Golden Fort (Sonar Qila)","Jaisalmer Fort","Built of yellow sandstone that glows at sunset."],["Palace of Winds","Hawa Mahal, Jaipur","Its 953 windows let the breeze through."],["Rome of the East","Old Goa","For its many great churches."]]},{"k":"facts","title":"Famous, but not World Heritage sites (as of October 2026)","rows":[["Temples","Jagannath (Puri), Meenakshi (Madurai), Somnath, Kamakhya, Golden Temple, Modhera, Aihole and Badami"],["Islamic monuments","Charminar, Gol Gumbaz, Itimad-ud-Daulah, Akbar's tomb at Sikandra, Bibi ka Maqbara, Golconda Fort"],["Rajput and colonial","Mehrangarh, Hawa Mahal, City Palace of Udaipur, India Gate, Gateway of India, Victoria Memorial, Mysore Palace"],["Ancient sites","Lothal, Rakhigarhi, Kushinagar, Bagh Caves (on the Tentative List since 2026)"],["Railways","Matheran Hill Railway and Kangra Valley Railway (Tentative List)"]]},{"k":"trick","h":"Notes in rising order spell a tour: <b>“Konark's Ellora Hampi — Rani's Sanchi Red”<\/b> — 10, 20, 50, 100, 200, 500. The ₹2000 note showed <b>Mangalyaan<\/b>, not a monument."},{"k":"trap","h":"<b>Black Pagoda<\/b> = Konark; <b>White Pagoda<\/b> = Jagannath. <b>Baby Taj<\/b> = Itimad-ud-Daulah (Agra); <b>Taj of the Deccan<\/b> = Bibi ka Maqbara (Aurangabad). The ₹100 note shows <b>Rani ki Vav<\/b>, not Hampi; the ₹50 note shows <b>Hampi<\/b>."}],"sum":["Banknotes: ₹10 Konark, ₹20 Ellora, ₹50 Hampi, ₹100 Rani ki Vav, ₹200 Sanchi, ₹500 Red Fort.","Black Pagoda — Konark; White Pagoda — Jagannath; Baby Taj — Itimad-ud-Daulah; Taj of the Deccan — Bibi ka Maqbara.","Great Wall of India — Kumbhalgarh; Troy of the East — Gingee; Pyramids of Assam — Moidams.","Charminar, Gol Gumbaz, Hawa Mahal, India Gate, Gateway of India, Golden Temple, Meenakshi and Jagannath are not World Heritage sites."],"part":["Part 3 · Builders, temples, intangible heritage and revision","निर्माता, मंदिर, अमूर्त धरोहर और पुनरावृत्ति"],"g":"hm"}
];
const QB = [
["H1","The World Heritage Convention was adopted by UNESCO's General Conference in which year?",["1972","1945","1978","2003"],"It was adopted on 16 November 1972 in Paris. UNESCO itself dates from 1945, the first list from 1978, and the intangible heritage convention from 2003.",""],
["H1","In which city was the World Heritage Convention adopted?",["Paris","Geneva","New York","Rome"],"It was adopted at UNESCO's General Conference in Paris, where UNESCO has its headquarters.",""],
["H1","India ratified the World Heritage Convention in:",["1977","1972","1983","1952"],"India ratified it in 1977. Its first sites were inscribed six years later, in 1983.",""],
["H1","In which year were India's first World Heritage sites inscribed?",["1983","1977","1985","1972"],"Ajanta, Ellora, Agra Fort and the Taj Mahal were inscribed in 1983. The first natural sites followed in 1985.",""],
["H1","Which four sites were India's first on the World Heritage list?",["Ajanta, Ellora, Agra Fort and Taj Mahal","Taj Mahal, Red Fort, Qutb Minar and Humayun's Tomb","Ajanta, Ellora, Elephanta and Sanchi","Konark, Mahabalipuram, Khajuraho and Hampi"],"The 1983 four were two cave sites of Maharashtra and two Mughal monuments of Agra.",""],
["H1","How many selection criteria does UNESCO use for World Heritage sites?",["Ten","Six","Four","Twelve"],"There are ten: (i) to (vi) for cultural value and (vii) to (x) for natural value.",""],
["H1","Criteria (i) to (vi) of the World Heritage list are used for which kind of site?",["Cultural","Natural","Intangible","Underwater only"],"Criteria (i)–(vi) are cultural; (vii)–(x) are natural.",""],
["H1","A 'mixed' World Heritage site is one that:",["Meets at least one cultural and one natural criterion","Lies in two or more countries","Has both a temple and a fort","Is on both the World Heritage and the Ramsar lists"],"A mixed site is valued for both nature and culture. India's only one is Khangchendzonga.",""],
["H1","Which body advises UNESCO on whether a cultural site should be listed?",["ICOMOS","IUCN","UNEP","WWF"],"The International Council on Monuments and Sites (ICOMOS) evaluates cultural nominations.",""],
["H1","Which body evaluates natural sites for the World Heritage list?",["IUCN","ICOMOS","UNEP","FAO"],"The International Union for Conservation of Nature (IUCN) evaluates natural nominations.",""],
["H1","How many member countries sit on the World Heritage Committee?",["21","15","54","193"],"The Committee has 21 members, elected by the countries that have signed the Convention.",""],
["H1","Before a site can be nominated for the World Heritage list, it must be on the country's:",["Tentative List","List of World Heritage in Danger","Memory of the World Register","Ramsar List"],"A country must first place a site on its Tentative List; only then can it send a full nomination.",""],
["H1","As of October 2026, how many World Heritage sites does India have?",["45","44","42","40"],"Sarnath, inscribed in July 2026, made it 45. The Maratha Military Landscapes (2025) had been the 44th.",""],
["H1","India's 45 World Heritage sites (as of October 2026) are made up of:",["37 cultural, 7 natural and 1 mixed","36 cultural, 8 natural and 1 mixed","38 cultural, 6 natural and 1 mixed","35 cultural, 8 natural and 2 mixed"],"37 + 7 + 1 = 45. Khangchendzonga is the one mixed site.",""],
["H1","Which became India's 45th World Heritage site in July 2026?",["Ancient Buddhist Site of Sarnath","Maratha Military Landscapes of India","Moidams of Charaideo","Sacred Ensembles of the Hoysalas"],"Sarnath was inscribed on 25 July 2026 at the 48th session in Busan, South Korea.",""],
["H1","Sarnath was inscribed at the 48th session of the World Heritage Committee held in:",["Busan","Paris","New Delhi","Riyadh"],"The 48th session met in Busan, South Korea, in July 2026.",""],

["H1","Which Indian site was inscribed at the 46th session, held in New Delhi in 2024?",["Moidams of the Ahom dynasty","Santiniketan","Ramappa Temple","Maratha Military Landscapes"],"The Moidams of Charaideo, Assam, became India's 43rd site in New Delhi in July 2024.",""],
["H1","At which session were the Maratha Military Landscapes inscribed in July 2025?",["47th session, Paris","46th session, New Delhi","45th session, Riyadh","48th session, Busan"],"The 47th session at UNESCO's headquarters in Paris inscribed them as India's 44th site.",""],

["H5","The World Heritage site “Chhatrapati Shivaji Terminus” is in which state or UT?",["Maharashtra","Karnataka","Gujarat","Delhi"],"“Chhatrapati Shivaji Terminus” is in Maharashtra. Mumbai's Victorian Gothic railway station by F. W. Stevens, opened as Victoria Terminus (1887–88).","","","",""],
["H5","The World Heritage site “Jantar Mantar, Jaipur” is in which state or UT?",["Rajasthan","Gujarat","Karnataka","West Bengal"],"“Jantar Mantar, Jaipur” is in Rajasthan. Sawai Jai Singh II's stone observatory of the 1720s–30s; the Samrat Yantra sundial.","","","",""],
["H5","The World Heritage site “Historic City of Ahmedabad” is in which state or UT?",["Gujarat","Karnataka","West Bengal","Maharashtra"],"“Historic City of Ahmedabad” is in Gujarat. Walled city founded by Sultan Ahmad Shah in 1411; pols and the Sidi Saiyyed jali; India's first World Heritage city.","","","",""],
["H5","The World Heritage site “Victorian Gothic and Art Deco Ensembles of Mumbai” is in which state or UT?",["Maharashtra","Rajasthan","West Bengal","Karnataka"],"“Victorian Gothic and Art Deco Ensembles of Mumbai” is in Maharashtra. 19th-century Gothic public buildings and 20th-century Art Deco buildings facing each other across the Oval Maidan.","","","",""],
["H5","The World Heritage site “Jaipur City” is in which state or UT?",["Rajasthan","Karnataka","West Bengal","Delhi"],"“Jaipur City” is in Rajasthan. The Pink City, founded in 1727 by Sawai Jai Singh II on a grid plan.","","","",""],
["H5","The World Heritage site “Santiniketan” is in which state or UT?",["West Bengal","Gujarat","Karnataka","Delhi"],"“Santiniketan” is in West Bengal. Rabindranath Tagore's ashram-school, which grew into Visva-Bharati University.","","","",""],
["H5","Which of these colonial, modern or city sites on the World Heritage list is in Gujarat?",["Historic City of Ahmedabad","Chhatrapati Shivaji Terminus","Jantar Mantar, Jaipur","Jaipur City"],"“Historic City of Ahmedabad” is in Gujarat. Walled city founded by Sultan Ahmad Shah in 1411; pols and the Sidi Saiyyed jali; India's first World Heritage city.","","","",""],
["H5","Which of these colonial, modern or city sites on the World Heritage list is in West Bengal?",["Santiniketan","Victorian Gothic and Art Deco Ensembles of Mumbai","Jantar Mantar, Jaipur","Chhatrapati Shivaji Terminus"],"“Santiniketan” is in West Bengal. Rabindranath Tagore's ashram-school, which grew into Visva-Bharati University.","","","",""],
["H5","The Darjeeling Himalayan Railway runs in which state?",["West Bengal","Tamil Nadu","Uttarakhand","Himachal Pradesh"],"The Darjeeling Himalayan Railway is in West Bengal. The 'Toy Train' from New Jalpaiguri, opened in 1881; loops and zigzags, and Ghum, its highest station.","","","",""],
["H5","The Nilgiri Mountain Railway runs in which state?",["Tamil Nadu","West Bengal","Uttarakhand","Maharashtra"],"The Nilgiri Mountain Railway is in Tamil Nadu. Mettupalayam to Udhagamandalam (Ooty), opened in 1908; a rack-and-pinion line on its steepest part.","","","",""],
["H5","The Kalka–Shimla Railway runs in which state?",["Himachal Pradesh","Tamil Nadu","West Bengal","Uttarakhand"],"The Kalka–Shimla Railway is in Himachal Pradesh. Opened in 1903; about 96 km with more than 100 tunnels; it starts at Kalka in Haryana.","","","",""],
["H5","In which year was the Darjeeling Himalayan Railway added to the World Heritage list?",["1999","2005","2008","2010"],"The Darjeeling Himalayan Railway joined in 1999. Darjeeling 1999, Nilgiri 2005, Kalka–Shimla 2008.","","","",""],
["H5","In which year was the Nilgiri Mountain Railway added to the World Heritage list?",["2005","1999","2008","2010"],"The Nilgiri Mountain Railway joined in 2005. Darjeeling 1999, Nilgiri 2005, Kalka–Shimla 2008.","","","",""],
["H5","In which year was the Kalka–Shimla Railway added to the World Heritage list?",["2008","1999","2005","2010"],"The Kalka–Shimla Railway joined in 2008. Darjeeling 1999, Nilgiri 2005, Kalka–Shimla 2008.","","","",""],
["H5","The Basilica of Bom Jesus in Old Goa holds the remains of:",["St Francis Xavier","St Thomas","Vasco da Gama","St Ignatius Loyola"],"St Francis Xavier's body lies in a silver casket in the basilica.",""],
["H5","Who designed Chhatrapati Shivaji Terminus in Mumbai?",["Frederick William Stevens","George Wittet","Edwin Lutyens","William Emerson"],"F. W. Stevens designed it; George Wittet designed the Gateway of India.",""],
["H5","Chhatrapati Shivaji Terminus was first named after:",["Queen Victoria","King George V","Lord Dalhousie","the Prince of Wales"],"It opened as Victoria Terminus in the year of Queen Victoria's Golden Jubilee and was renamed in 1996.",""],
["H5","In which style is Chhatrapati Shivaji Terminus built?",["Victorian Gothic Revival with Indian elements","Art Deco","Indo-Islamic","Classical Palladian"],"Its pointed arches, turrets and stained glass are Gothic Revival, mixed with Indian carving.",""],
["H5","The Victorian Gothic and Art Deco buildings of Mumbai's World Heritage site face each other across the:",["Oval Maidan","Azad Maidan","Shivaji Park","Cross Maidan"],"Gothic buildings stand on the east side of the Oval Maidan and Art Deco buildings on the west.",""],
["H5","Which clock tower is part of the Victorian Gothic ensemble of Mumbai?",["Rajabai Tower","Husainabad Clock Tower","Ghanta Ghar, Jodhpur","Lal Chowk Clock Tower"],"The Rajabai Tower stands in the University of Mumbai's Fort campus.",""],
["H5","The Capitol Complex of Chandigarh is part of a World Heritage site spread over how many countries?",["Seven","Two","Four","Ten"],"'The Architectural Work of Le Corbusier' (2016) has 17 sites in seven countries, including India.",""],
["H5","Which monument, a symbol of Chandigarh, stands in the Capitol Complex?",["Open Hand Monument","Rock Garden","Sukhna Lake","Rose Garden"],"Le Corbusier's Open Hand stands for 'open to give, open to receive'. The Rock Garden is not part of the site.",""],
["H5","Ahmedabad was founded in 1411 by:",["Sultan Ahmad Shah I","Mahmud Begada","Akbar","Qutb-ud-din Aibak"],"Ahmad Shah I of the Gujarat Sultanate founded it on the east bank of the Sabarmati.",""],
["H5","The traditional gated neighbourhoods of old Ahmedabad are called:",["Pols","Katras","Agraharams","Peths"],"A pol is a lane of houses with a single gateway; katras are found in Delhi and Amritsar.",""],
["H5","Which mosque of Ahmedabad is famous for its stone jali of an intertwined tree?",["Sidi Saiyyed Mosque","Jama Masjid","Rani Sipri Mosque","Sarkhej Roza"],"The Sidi Saiyyed jali has become a symbol of the city.",""],
["H5","Jaipur was founded in 1727 by:",["Sawai Jai Singh II","Raja Man Singh I","Sawai Pratap Singh","Sawai Ram Singh II"],"Sawai Jai Singh II moved his capital from Amber to the new planned city.",""],
["H5","Who planned the city of Jaipur?",["Vidyadhar Bhattacharya","Lal Chand Ustad","Edwin Lutyens","Le Corbusier"],"Vidyadhar Bhattacharya laid it out on a grid, following old Hindu texts on town planning.",""],
["H5","Why is Jaipur called the Pink City?",["It was painted pink in 1876 to welcome the Prince of Wales","Its sandstone is naturally pink","It is named after a pink lotus","Its founder's flag was pink"],"Maharaja Ram Singh II had the old city painted pink — the colour of welcome — for the royal visit.",""],
["H5","Which of Sawai Jai Singh II's observatories is a World Heritage site?",["Jaipur","Delhi","Ujjain","Varanasi"],"Only the Jantar Mantar of Jaipur (2010) is inscribed.",""],
["H5","The Samrat Yantra at Jaipur's Jantar Mantar is a:",["Giant sundial","Telescope","Star globe","Water clock"],"The Samrat Yantra tells the time from the shadow of its huge triangular wall.",""],
["H5","Which railway of the World Heritage site uses a rack-and-pinion system on its steep section?",["Nilgiri Mountain Railway","Darjeeling Himalayan Railway","Kalka–Shimla Railway","Kangra Valley Railway"],"The Nilgiri line climbs with a toothed rack between Kallar and Coonoor.",""],
["H5","Which hill railway is NOT part of the Mountain Railways of India World Heritage site?",["Matheran Hill Railway","Darjeeling Himalayan Railway","Nilgiri Mountain Railway","Kalka–Shimla Railway"],"Matheran's line in Maharashtra is on the Tentative List only.",""],
["H5","Santiniketan is in which district of West Bengal?",["Birbhum","Bankura","Nadia","Hooghly"],"Santiniketan, near Bolpur, is in Birbhum district.",""],
["H5","Santiniketan began in 1863 as an ashram set up by:",["Debendranath Tagore","Rabindranath Tagore","Dwarkanath Tagore","Abanindranath Tagore"],"Debendranath, Rabindranath's father, set up the ashram; Rabindranath later built the school and university.",""],
["H5","In which year did Rabindranath Tagore found Visva-Bharati?",["1921","1901","1913","1951"],"He began a school in 1901, won the Nobel Prize in 1913, founded Visva-Bharati in 1921; it became a central university in 1951.",""],
["H5","Old Goa, with its World Heritage churches, was the capital of which colonial power in India?",["Portuguese","Dutch","French","British"],"Old Goa was the capital of Portuguese India until the capital moved to Panaji in the 19th century.",""],
["H6","In which state is the natural or mixed World Heritage site “Kaziranga National Park”?",["Assam","West Bengal","Uttarakhand","Rajasthan"],"“Kaziranga National Park” is in Assam. Two-thirds of the world's one-horned rhinoceroses; on the Brahmaputra floodplain.","","","",""],
["H6","In which state is the natural or mixed World Heritage site “Manas Wildlife Sanctuary”?",["Assam","Rajasthan","Gujarat","Himachal Pradesh"],"“Manas Wildlife Sanctuary” is in Assam. On the Bhutan border; pygmy hog and golden langur; on the danger list 1992–2011.","","","",""],
["H6","In which state is the natural or mixed World Heritage site “Keoladeo National Park”?",["Rajasthan","Kerala","Himachal Pradesh","Assam"],"“Keoladeo National Park” is in Rajasthan. The Bharatpur wetland, once a maharaja's duck-shooting reserve; once the winter home of the Siberian crane.","","","",""],
["H6","In which state is the natural or mixed World Heritage site “Sundarbans National Park”?",["West Bengal","Kerala","Sikkim","Uttarakhand"],"“Sundarbans National Park” is in West Bengal. The largest mangrove forest; tigers that swim; Bangladesh's part is a separate site.","","","",""],
["H6","In which state is the natural or mixed World Heritage site “Nanda Devi and Valley of Flowers National Parks”?",["Uttarakhand","Gujarat","Kerala","West Bengal"],"“Nanda Devi and Valley of Flowers National Parks” is in Uttarakhand. Chamoli district; Valley of Flowers added in 2005.","","","",""],
["H6","In which state is the natural or mixed World Heritage site “Great Himalayan National Park Conservation Area”?",["Himachal Pradesh","Kerala","Sikkim","Assam"],"“Great Himalayan National Park Conservation Area” is in Himachal Pradesh. Kullu district; the western Himalaya's high forests and meadows.","","","",""],
["H6","In which state is the natural or mixed World Heritage site “Khangchendzonga National Park”?",["Sikkim","West Bengal","Uttarakhand","Rajasthan"],"“Khangchendzonga National Park” is in Sikkim. India's only mixed site; sacred to the Lepcha and to Buddhists.","","","",""],
["H6","Which Indian natural site was on the List of World Heritage in Danger from 1992 to 2011?",["Manas","Kaziranga","Keoladeo","Sundarbans"],"Manas was put on the danger list after damage during unrest, and taken off in 2011 after recovery.",""],
["H6","The Western Ghats World Heritage site is spread over how many states?",["Four","Three","Five","Six"],"Kerala, Karnataka, Tamil Nadu and Maharashtra.",""],
["H6","Which state is NOT part of the Western Ghats World Heritage site?",["Goa","Kerala","Karnataka","Maharashtra"],"Goa lies on the Ghats, but none of the 39 listed parts is in Goa.",""],
["H6","About how many component parts make up the Western Ghats World Heritage site?",["39","7","12","100"],"Thirty-nine parks, sanctuaries and forests were listed together in 2012.",""],
["H6","In which year was the Western Ghats inscribed on the World Heritage list?",["2012","2014","2008","1988"],"It was inscribed in 2012 for its biodiversity; the Great Himalayan NP followed in 2014.",""],
["H6","Khangchendzonga is a mixed site because:",["It has great natural value and is sacred to the local peoples","It lies in two countries","It has both forts and temples","It has both forest and desert"],"It meets natural criteria and cultural ones, for the Lepcha and Buddhist beliefs tied to the mountain.",""],
["H6","How does the Bangladesh part of the Sundarbans stand on the World Heritage list?",["It is a separate site, listed by Bangladesh in 1997","It is part of India's 1987 site","It is not on the list","It was joined to India's site in 2016"],"India's Sundarbans National Park (1987) and Bangladesh's Sundarbans (1997) are two separate sites.",""],
["H6","The Great Himalayan National Park lies in which district of Himachal Pradesh?",["Kullu","Kinnaur","Chamba","Lahaul and Spiti"],"It is in Kullu district, around the Tirthan, Sainj and Parvati valleys.",""],
["H6","Nanda Devi National Park and the Valley of Flowers are both in which district of Uttarakhand?",["Chamoli","Pithoragarh","Uttarkashi","Tehri Garhwal"],"Both parks lie in Chamoli district.",""],
["H6","In which year was the Valley of Flowers added to the Nanda Devi World Heritage site?",["2005","1988","2012","1999"],"Nanda Devi was listed in 1988; the extension came in 2005.",""],
["H6","UNESCO's World Network of Biosphere Reserves added which Indian reserve in September 2025?",["Cold Desert, Himachal Pradesh","Panna, Madhya Pradesh","Great Rann of Kutch, Gujarat","Nilgiri, Tamil Nadu"],"The Cold Desert reserve in Lahaul and Spiti became India's 13th on the network. Nilgiri was the first (2000) and Panna joined in 2020.",""],
["H6","The UNESCO programme under which biosphere reserves are listed is:",["Man and the Biosphere","World Heritage Convention","Ramsar Convention","Memory of the World"],"Biosphere reserves belong to the Man and the Biosphere (MAB) programme, not the World Heritage list.",""],
["H6","Which bird, once Keoladeo's most famous winter visitor, no longer reaches the park?",["Siberian crane","Sarus crane","Great Indian bustard","Greater flamingo"],"The western flock of Siberian cranes stopped arriving after the early 2000s.",""],
["H6","How many of India's World Heritage sites are natural (not counting the mixed one)?",["7","8","6","9"],"Seven natural sites, plus Khangchendzonga, which is mixed.",""],
["H6","UNESCO lists which Assam site as a 'Wildlife Sanctuary' rather than a national park?",["Manas","Kaziranga","Orang","Nameri"],"The site's name is Manas Wildlife Sanctuary, though Manas is also a national park and tiger reserve.",""],
["H6","Which was India's most recent natural World Heritage site, inscribed in 2014?",["Great Himalayan National Park","Western Ghats","Khangchendzonga National Park","Valley of Flowers"],"The Great Himalayan NP (2014) is the latest purely natural site; Khangchendzonga (2016) is mixed.",""],
["H7","Who built the Quwwat-ul-Islam Mosque, Delhi's first mosque?",["Qutb-ud-din Aibak","Aurangzeb","Muhammad Adil Shah","Sher Shah Suri"],"Qutb-ud-din Aibak built the Quwwat-ul-Islam Mosque, Delhi's first mosque. Delhi, 1190s; later enlarged by Iltutmish and Alauddin Khalji.","","","",""],
["H7","Who built the Alai Darwaza?",["Alauddin Khalji","Firoz Shah Tughlaq","Nur Jahan","Sher Shah Suri"],"Alauddin Khalji built the Alai Darwaza. The southern gate of the Qutb complex, 1311.","","","",""],
["H7","Who built Tughlaqabad Fort?",["Ghiyasuddin Tughlaq","Asaf-ud-Daula","Muhammad Quli Qutb Shah","Nur Jahan"],"Ghiyasuddin Tughlaq built Tughlaqabad Fort. Delhi, 1321 — the third city of Delhi.","","","",""],
["H7","Who built Firoz Shah Kotla?",["Firoz Shah Tughlaq","Akbar","Aurangzeb","Qutb-ud-din Aibak"],"Firoz Shah Tughlaq built Firoz Shah Kotla. Delhi, 1354; an Ashokan pillar brought from Topra stands on top.","","","",""],
["H7","Who built the Purana Qila?",["Sher Shah Suri","Alauddin Khalji","Shah Jahan","Muhammad Adil Shah"],"Sher Shah Suri built the Purana Qila. Delhi, 1540s, on the site of Humayun's Dinpanah.","","","",""],
["H7","Who built the Buland Darwaza?",["Akbar","Muhammad Adil Shah","Asaf-ud-Daula","Firoz Shah Tughlaq"],"Akbar built the Buland Darwaza. Fatehpur Sikri, about 1575, after the conquest of Gujarat.","","","",""],
["H7","Who built the tomb of Itimad-ud-Daulah?",["Nur Jahan","Akbar","Firoz Shah Tughlaq","Ghiyasuddin Tughlaq"],"Nur Jahan built the tomb of Itimad-ud-Daulah. Agra, 1622–28, for her father Mirza Ghiyas Beg; the first Mughal tomb faced wholly in white marble.","","","",""],
["H7","Who built the Jama Masjid of Delhi?",["Shah Jahan","Nur Jahan","Akbar","Muhammad Quli Qutb Shah"],"Shah Jahan built the Jama Masjid of Delhi. 1650–1656; one of the largest mosques in India.","","","",""],
["H7","Who built the Moti Masjid in the Red Fort?",["Aurangzeb","Ahmad Shah I","Qutb-ud-din Aibak","Nur Jahan"],"Aurangzeb built the Moti Masjid in the Red Fort. Delhi, 1659–60, a small private mosque of white marble.","","","",""],
["H7","Who built the Charminar?",["Muhammad Quli Qutb Shah","Muhammad Adil Shah","Ahmad Shah I","Akbar"],"Muhammad Quli Qutb Shah built the Charminar. Hyderabad, 1591 — four minarets over a crossroads of the new city.","","","",""],
["H7","Who built the Gol Gumbaz?",["Muhammad Adil Shah","Qutb-ud-din Aibak","Aurangzeb","Akbar"],"Muhammad Adil Shah built the Gol Gumbaz. Vijayapura (Bijapur), completed 1656; his own tomb, with a whispering gallery.","","","",""],
["H7","Who built the Bara Imambara and the Rumi Darwaza?",["Asaf-ud-Daula","Ghiyasuddin Tughlaq","Aurangzeb","Qutb-ud-din Aibak"],"Asaf-ud-Daula built the Bara Imambara and the Rumi Darwaza. Lucknow, 1784, built partly as famine relief work.","","","",""],
["H7","Who built the Jama Masjid of Ahmedabad?",["Ahmad Shah I","Aurangzeb","Qutb-ud-din Aibak","Akbar"],"Ahmad Shah I built the Jama Masjid of Ahmedabad. 1424, by the founder of Ahmedabad.","","","",""],
["H7","Who built or designed the Vijay Stambha at Chittorgarh?",["Rana Kumbha","Edwin Lutyens","Raja Man Singh I","Bimal Patel"],"The Vijay Stambha at Chittorgarh — Rana Kumbha. 1440s, to mark his victory over Mahmud Khalji of Malwa.","","","",""],
["H7","Who built or designed Mehrangarh Fort?",["Rao Jodha","Sawai Jai Singh II","George Wittet","Ram V. Sutar"],"Mehrangarh Fort — Rao Jodha. Jodhpur, 1459 — he founded the city too.","","","",""],
["H7","Who built or designed Jaisalmer Fort (Sonar Qila)?",["Rawal Jaisal","Sawai Jai Singh II","William Emerson","Fariborz Sahba"],"Jaisalmer Fort (Sonar Qila) — Rawal Jaisal. 1156, on Trikuta hill.","","","",""],
["H7","Who built or designed Amber Fort?",["Raja Man Singh I","Bimal Patel","Henry Irwin","Ram V. Sutar"],"Amber Fort — Raja Man Singh I. Begun 1592, near Jaipur; enlarged by later rulers.","","","",""],
["H7","Who built or designed the Hawa Mahal?",["Sawai Pratap Singh","Raja Man Singh I","Sawai Jai Singh II","Rawal Jaisal"],"The Hawa Mahal — Sawai Pratap Singh. Jaipur, 1799; designed by Lal Chand Ustad.","","","",""],
["H7","Who built or designed the Jantar Mantar of Delhi?",["Sawai Jai Singh II","Fariborz Sahba","Sawai Pratap Singh","Ram V. Sutar"],"The Jantar Mantar of Delhi — Sawai Jai Singh II. 1724 — the first of his five observatories.","","","",""],
["H7","Who built or designed the City Palace of Udaipur?",["Maharana Udai Singh II","George Wittet","Sawai Pratap Singh","Bimal Patel"],"The City Palace of Udaipur — Maharana Udai Singh II. Begun 1559, when he founded Udaipur; added to by later Maharanas.","","","",""],
["H7","Who built or designed the Gateway of India?",["George Wittet","Ram V. Sutar","Edwin Lutyens","Raja Man Singh I"],"The Gateway of India — George Wittet. Mumbai, completed 1924, for the 1911 visit of King George V and Queen Mary.","","","",""],
["H7","Who built or designed India Gate?",["Edwin Lutyens","Ram V. Sutar","Maharana Udai Singh II","Henry Irwin"],"India Gate — Edwin Lutyens. New Delhi, completed 1931 — the All India War Memorial.","","","",""],
["H7","Who built or designed the Victoria Memorial?",["William Emerson","Sawai Pratap Singh","Rawal Jaisal","Fariborz Sahba"],"The Victoria Memorial — William Emerson. Kolkata, 1906–1921, of Makrana marble.","","","",""],
["H7","Who built or designed the present Mysore Palace?",["Henry Irwin","Edwin Lutyens","Raja Man Singh I","Rao Jodha"],"The present Mysore Palace — Henry Irwin. Mysuru, completed 1912 for the Wodeyars, after a fire destroyed the old palace.","","","",""],
["H7","Who built or designed the Lotus Temple?",["Fariborz Sahba","Raja Man Singh I","William Emerson","Ram V. Sutar"],"The Lotus Temple — Fariborz Sahba. Delhi, 1986 — a Bahá'í house of worship.","","","",""],
["H7","Who built or designed the new Parliament House?",["Bimal Patel","Fariborz Sahba","Sawai Pratap Singh","George Wittet"],"The new Parliament House — Bimal Patel. New Delhi, opened 28 May 2023 — a triangular building.","","","",""],
["H7","Who built or designed the Statue of Unity?",["Ram V. Sutar","Raja Man Singh I","Maharana Udai Singh II","Sawai Jai Singh II"],"The Statue of Unity — Ram V. Sutar. Ekta Nagar (Kevadia), Gujarat, 2018 — Sardar Patel, 182 m tall.","","","",""],
["H7","Akbar's tomb at Sikandra, begun by Akbar himself, was completed by:",["Jahangir","Shah Jahan","Humayun","Aurangzeb"],"Jahangir completed it in 1613 and changed the design of its upper storeys.",""],
["H7","Bibi ka Maqbara at Aurangabad is the tomb of:",["Dilras Banu Begum","Mumtaz Mahal","Nur Jahan","Jahanara Begum"],"It holds Dilras Banu Begum, Aurangzeb's chief wife; raised in the 1660s, it is often called the 'Taj of the Deccan'.",""],
["H7","Who designed Rashtrapati Bhavan (the former Viceroy's House)?",["Edwin Lutyens","Herbert Baker","Robert Tor Russell","Charles Correa"],"Lutyens designed it; Herbert Baker designed the North and South Blocks beside it.",""],
["H7","India Gate was built as a memorial to Indian soldiers who died in:",["The First World War and the Third Anglo-Afghan War","The Revolt of 1857","The Second World War","The 1971 war"],"Their names are carved on its walls; the Amar Jawan Jyoti for 1971 was added later, in 1972.",""],
["H7","The Gateway of India was built to remember the visit of:",["King George V and Queen Mary (1911)","Queen Victoria (1877)","the Prince of Wales (1921)","Lord Curzon (1905)"],"They landed at Bombay in December 1911 on their way to the Delhi Durbar.",""],
["H7","The Victoria Memorial in Kolkata was the idea of which Viceroy?",["Lord Curzon","Lord Minto","Lord Dalhousie","Lord Canning"],"Curzon proposed it after Queen Victoria died in 1901.",""],
["H7","The Gol Gumbaz is famous for its:",["Whispering gallery","Hanging pillar","Musical pillars","Floating bricks"],"A whisper in its gallery can be heard across the dome. The hanging pillar is at Lepakshi, the musical pillars at Hampi.",""],
["H7","Who designed the Hawa Mahal of Jaipur?",["Lal Chand Ustad","Vidyadhar Bhattacharya","Mirak Mirza Ghiyas","George Wittet"],"Lal Chand Ustad designed it for Sawai Pratap Singh in 1799.",""],
["H7","About how many small windows (jharokhas) does the Hawa Mahal have?",["953","365","108","1,444"],"953 windows let cool air through — hence 'Palace of Winds'. 1,444 is the number of pillars at Ranakpur.",""],
["H7","In 2023 the old Parliament House of New Delhi was renamed:",["Samvidhan Sadan","Kartavya Bhavan","Bharat Mandapam","Yashobhoomi"],"It was renamed Samvidhan Sadan when Parliament moved to the new building in September 2023.",""],
["H7","Rajpath in New Delhi, from Rashtrapati Bhavan to India Gate, was renamed in 2022 as:",["Kartavya Path","Janpath","Rajmarg","Seva Path"],"It was renamed Kartavya Path in September 2022.",""],
["H7","The Statue of Unity at Ekta Nagar, Gujarat, is a statue of:",["Sardar Vallabhbhai Patel","Mahatma Gandhi","B. R. Ambedkar","Subhas Chandra Bose"],"It is 182 m tall and was unveiled on 31 October 2018, Patel's birth anniversary.",""],
["H7","The Ashokan pillar on top of Firoz Shah Kotla was brought to Delhi from:",["Topra","Meerut","Sarnath","Kausambi"],"Firoz Shah Tughlaq had it moved from Topra (now in Haryana); a second pillar, from Meerut, stands on the Delhi Ridge.",""],
["H8","In which state or UT is the famous Somnath Temple?",["Gujarat","Assam","Bihar","Tamil Nadu"],"The Somnath Temple is in Gujarat. First of the 12 jyotirlingas, at Prabhas Patan; the present temple opened in 1951.","","","",""],
["H8","In which state or UT is the famous Sun Temple, Modhera?",["Gujarat","Andhra Pradesh","Assam","Bihar"],"The Sun Temple, Modhera is in Gujarat. Built under the Solanki king Bhima I (1026–27); a great stepped tank, the Surya Kund.","","","",""],
["H8","In which state or UT is the famous Dilwara temple complex?",["Rajasthan","Karnataka","Jammu and Kashmir","Uttar Pradesh"],"The Dilwara temple complex is in Rajasthan. Jain temples of white marble at Mount Abu, from the 11th to the 13th century.","","","",""],
["H8","In which state or UT is the famous Ranakpur Jain Temple?",["Rajasthan","Uttar Pradesh","Uttarakhand","Tamil Nadu"],"The Ranakpur Jain Temple is in Rajasthan. 1,444 carved pillars; built in Rana Kumbha's time by the merchant Dharna Shah.","","","",""],
["H8","In which state or UT is the famous Jagannath Temple?",["Odisha","Tamil Nadu","Uttar Pradesh","Arunachal Pradesh"],"The Jagannath Temple is in Odisha. Puri; the Rath Yatra; sailors called it the White Pagoda.","","","",""],
["H8","In which state or UT is the famous Lingaraja Temple?",["Odisha","Gujarat","Rajasthan","Arunachal Pradesh"],"The Lingaraja Temple is in Odisha. Bhubaneswar, 11th century; the finest of the Odisha (Kalinga) style.","","","",""],
["H8","In which state or UT is the famous Kamakhya Temple?",["Assam","Madhya Pradesh","Uttar Pradesh","Andhra Pradesh"],"The Kamakhya Temple is in Assam. On Nilachal hill, Guwahati; a Shakti peetha; the Ambubachi Mela.","","","",""],
["H8","In which state or UT is the famous Meenakshi Temple?",["Tamil Nadu","Gujarat","Assam","Bihar"],"The Meenakshi Temple is in Tamil Nadu. Madurai; 14 gopurams, mostly of the Nayak period.","","","",""],

:root[data-skin] body{background-color:var(--app-bg);background-image:var(--app-pattern);background-size:var(--app-psize);background-attachment:fixed}
:root[data-skin] h1,:root[data-skin] h2{letter-spacing:-.01em}

/* ===== Desktop layout (PC / tablet landscape) ===== */
@media (min-width: 1024px){
  :root{--side:236px}
  body{padding-left:var(--side);font-size:16.5px}
  .top{border-bottom:1px solid var(--rule)}
  .top-in{max-width:1320px;padding:16px 36px}
  .brand{font-size:21px}
  .brand small{font-size:13px}
  .stat{font-size:13px}
  .wrap{max-width:1320px;padding:0 36px 56px}
  .view{padding-top:28px}
  h1{font-size:34px} h2{font-size:22px} h3{font-size:17px}

  /* bottom tab bar becomes a left sidebar */
  .nav{top:0;bottom:0;left:0;right:auto;width:var(--side);height:auto;border-top:0;border-right:1px solid var(--rule);padding:84px 14px 20px;display:block;overflow:auto}
  .nav-in{display:flex;flex-direction:column;gap:4px;height:auto;max-width:none;margin:0}
  .nav-in::before{content:"Sections";display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:0 14px 8px}
  .nav button{flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-size:15px;min-height:0;height:auto;width:100%;text-align:left}
  .nav button svg{width:20px;height:20px;flex-shrink:0}
  .nav button:hover{background:var(--sunk)}
  .nav button[aria-current="page"]{background:var(--blue-bg)}
  .nav button[aria-current="page"] span{border-bottom:0!important}

  /* home: intro beside progress */
  .hero{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);column-gap:48px;align-items:end;padding-bottom:10px}
  .hero > .eyebrow,.hero > h1,.hero > p{grid-column:1}
  .hero > .meter{grid-column:2;grid-row:3;align-self:center}
  .hero > .row{grid-column:2;grid-row:2;align-self:end}

  /* lesson reader: facts, timelines, tricks sit side by side */
  .lhead{margin-bottom:0}
  .steps{max-width:640px}
  .steps + .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .steps + .stack > .plain,.steps + .stack > .row,.steps + .stack > p,.steps + .stack > .fig,.steps + .stack > h2,.steps + .stack > .tbl{grid-column:1/-1}
  .steps + .stack > .plain{max-width:86ch;font-size:17px}
  .steps + .stack > .hot,.steps + .stack > .story{grid-column:1/-1}
  .steps + .stack > .story{max-width:none;padding:20px 24px;font-size:17.5px}
  .steps + .stack > .story p{max-width:80ch}
  .steps + .stack:not(:has(> .block ~ .block)) > .block{grid-column:1/-1}
  .block,.qcard{padding:18px 20px;border-radius:14px}

  /* quizzes and question bank */
  #lq > .stack{display:grid;grid-template-columns:minmax(0,1fr);max-width:980px;gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qt{font-size:18px}
  #plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #plist .opts{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:wrap;overflow:visible}

  /* mock test: question with the answer grid alongside */
  .mbar{top:calc(env(safe-area-inset-top,0px) + 67px)}
  .view > .qcard{max-width:1000px}
  .view > .row.between{max-width:1000px}
  .view > #msub{max-width:1000px;width:100%}
  .view > .block.stack{max-width:760px}
  .pal{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .kpis{max-width:760px}

  /* revise: summary cards and sheets in columns */
  #rv > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #rv > .stack > .grph,#rv > .stack > p,#rv > .stack > .search,#rv > .stack > .callout{grid-column:1/-1}
  #dgl,#lml,#tll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #dgl > .grph,#dgl > p,#lml > p,#tll > .grph{grid-column:1/-1}
  #rv .search,#rv > #dgl ~ .search{max-width:520px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flash{min-height:300px;max-width:760px;margin:0 auto;padding:32px 36px}
  .flash .front{font-size:22px}

  /* learn: era cards across the top */
  .eras{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}
  .les{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}

(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();

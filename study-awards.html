{"id":"A1","heat":3,"title":"Bharat Ratna","hi":"भारत रत्न","blocks":[{"k":"hot","h":"Very frequent: the <b>first three<\/b> recipients (1954), <b>firsts<\/b> (first woman, first posthumous, first foreigner, youngest), the <b>2024 five<\/b>, and facts about the award itself (peepal leaf, no money, at most three a year)."},{"k":"story","h":"<p>The <b>Bharat Ratna<\/b>, India's highest civilian honour, was instituted on <b>2 January 1954<\/b>. The first three went that year to <b>C. Rajagopalachari<\/b>, <b>S. Radhakrishnan<\/b> and <b>C. V. Raman<\/b>. It is shaped like a <b>peepal leaf<\/b> with a sun on it, carries <b>no money<\/b>, and is normally limited to <b>three a year<\/b> — though five were announced in 2024.<\/p><p>Its 'firsts' are favourites: <b>Lal Bahadur Shastri<\/b> (first posthumous, 1966), <b>Indira Gandhi<\/b> (first woman, 1971), <b>Mother Teresa<\/b> (first naturalised citizen, 1980), <b>Khan Abdul Ghaffar Khan<\/b> (first non-Indian, 1987), <b>Sachin Tendulkar<\/b> (youngest and first sportsperson, 2014). As of 2026 there are <b>53<\/b> recipients; none were named in 2025.<\/p>","key":"1954 first three: Rajaji, Radhakrishnan, Raman. 2024 five: Karpoori Thakur, Advani, Narasimha Rao, Charan Singh, Swaminathan."},{"k":"photos","title":"Recipients in pictures","items":[["C._Rajagopalachari","C. Rajagopalachari","1954 · among the first three"],["Sarvepalli_Radhakrishnan","S. Radhakrishnan","1954"],["C._V._Raman","C. V. Raman","1954"],["Indira_Gandhi","Indira Gandhi","1971 · first woman"],["Mother_Teresa","Mother Teresa","1980"],["Abdul_Ghaffar_Khan","Khan Abdul Ghaffar Khan","1987 · first non-Indian"],["Nelson_Mandela","Nelson Mandela","1990"],["J._R._D._Tata","J. R. D. Tata","1992 · first industrialist"],["Sachin_Tendulkar","Sachin Tendulkar","2014 · youngest"],["Karpoori_Thakur","Karpoori Thakur","2024"],["M._S._Swaminathan","M. S. Swaminathan","2024"],["L._K._Advani","L. K. Advani","2024"]]},{"k":"facts","title":"About the award","rows":[["Instit {"id":"A2","heat":3,"title":"Padma awards","hi":"पद्म पुरस्कार","blocks":[{"k":"hot","h":"Asked in current affairs every year: the <b>Padma Vibhushan<\/b> recipients of the year, the <b>total number<\/b> of awards, and basic facts — three tiers, announced on the <b>eve of Republic Day<\/b>."},{"k":"story","h":"<p>Below the Bharat Ratna come the three <b>Padma<\/b> awards, also started in 1954: <b>Padma Vibhushan<\/b> (exceptional service), <b>Padma Bhushan<\/b> (high order) and <b>Padma Shri<\/b> (distinguished service). They are announced every year on the <b>eve of Republic Day<\/b> and presented by the President at Rashtrapati Bhavan in March–April.<\/p><p>For <b>2026<\/b> the President approved <b>131<\/b> awards — 5 Padma Vibhushan, 13 Padma Bhushan and 113 Padma Shri. The five Vibhushans went to actor <b>Dharmendra<\/b> (posthumous), jurist <b>K. T. Thomas<\/b>, violinist <b>N. Rajam<\/b>, writer <b>P. Narayanan<\/b> and former Kerala CM <b>V. S. Achuthanandan<\/b> (posthumous).<\/p>","key":"Padma Vibhushan > Padma Bhushan > Padma Shri; 2026: 131 awards (5 + 13 + 113)."},{"k":"facts","title":"About the Padma awards","rows":[["Started","1954 (renamed to today's names in 1955)"],["Order","Padma Vibhushan > Padma Bhushan > Padma Shri"],["Announced","On the eve of Republic Day (25 January)"],["Presented by","The President, at Rashtrapati Bhavan"],["Selected by","The Padma Awards Committee, set up by the Prime Minister each year"],["2026","131 awards: 5 Padma Vibhushan, 13 Padma Bhushan, 113 Padma Shri"],["Padma Bhushan 2026 (some)","Alka Yagnik, Mammootty, Bhagat Singh Koshyari, Uday Kotak, Vijay Amritraj"],["2025","139 awards: 7 Padma Vibhushan, 19 Padma Bhushan, 113 Padma Shri"]]},{"k":"info","title":"The order, top to bottom","html":"<figure class=\"fig wide\" style=\"--minw:520px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 250\" role=\"img\" aria-label=\"The order of India's civilian awards\"><path d=\"M280 10 L400 10 L460 64 L220 64 Z\" class=\"s2\" stroke {"id":"A3","heat":3,"title":"Literary awards — India and the world","hi":"साहित्यिक पुरस्कार","blocks":[{"k":"hot","h":"Regulars: <b>Jnanpith<\/b> (first winner, first woman, latest winners), <b>Sahitya Akademi<\/b> (24 languages), <b>Saraswati Samman<\/b> and <b>Vyas Samman<\/b> (K. K. Birla Foundation), the <b>Booker<\/b> and <b>Pulitzer<\/b> with their Indian winners."},{"k":"story","h":"<p>India's top literary prize, the <b>Jnanpith<\/b>, is given by the Bharatiya Jnanpith trust. The first went to Malayalam poet <b>G. Sankara Kurup<\/b> in 1965; the first woman was Bengali novelist <b>Ashapoorna Devi<\/b>; <b>Amitav Ghosh<\/b> became the first English writer to win it in 2018. Recent winners: <b>Gulzar<\/b> and <b>Jagadguru Rambhadracharya<\/b> (2023), and Hindi writer <b>Vinod Kumar Shukla<\/b> (2024).<\/p><p>The <b>Sahitya Akademi<\/b> honours one book a year in each of 24 languages. The <b>K. K. Birla Foundation<\/b> gives the Saraswati Samman (any Indian language) and the Vyas Samman (Hindi). Abroad, Indians have won the <b>Booker<\/b> (Rushdie, Roy, Kiran Desai, Adiga), the <b>International Booker<\/b> (Geetanjali Shree, Banu Mushtaq) and the <b>Pulitzer<\/b> (Jhumpa Lahiri).<\/p>","key":"Jnanpith first: G. Sankara Kurup (1965); first woman: Ashapoorna Devi (1976); first English: Amitav Ghosh (2018)."},{"k":"photos","title":"Writers in pictures","items":[["G._Sankara_Kurup","G. Sankara Kurup","First Jnanpith, 1965"],["Ashapoorna_Devi","Ashapoorna Devi","First woman, Jnanpith"],["Sumitranandan_Pant","Sumitranandan Pant","First Hindi Jnanpith"],["Amitav_Ghosh","Amitav Ghosh","First English Jnanpith"],["Gulzar","Gulzar","58th Jnanpith"],["Vinod_Kumar_Shukla","Vinod Kumar Shukla","59th Jnanpith"],["Amrita_Pritam","Amrita Pritam","First woman, Sahitya Akademi"],["Jhumpa_Lahiri","Jhumpa Lahiri","Pulitzer 2000"]]},{"k":"table","title":"The awards","head":["Award","What it is","Note"],"rows":[["Jnanpith Award","India's highest literary award","Instituted 1961 by the Bharatiya Jnanpith; first given in 1965."],["Sahitya Akademi Award","Given by India's National Academy of Letters in 24 languages","The Akademi was set up in 1954."],["Saraswati Samman","K. K. Birla Foundation award for literature in any Indian language","Started 1991; first winner Harivansh Rai Bachchan."],["Vyas Samman","K. K. Birla Foundation award for Hindi literature","Started 1991."],["Moortidevi Award","Bharatiya Jnanpith award for Indian philosophy and culture in literature",""],["Booker Prize","For the best novel written in English (UK)","Started 1969."],["International Booker Prize","For a book translated into English, shared by author and translator",""],["Pulitzer Prize","USA — journalism, literature and music","Started 1917."]]},{"k":"table","title":"Winners to remember","head":["Winner","Award","Note"],"rows":[["G. Sankara Kurup","First Jnanpith (1965)","Malayalam — Odakkuzhal."],["Ashapoorna Devi","First woman to win the Jnanpith (1976)","Bengali."],["Sumitranandan Pant","First Hindi writer to win the Jnanpith (1968)",""],["Amitav Ghosh","First English-language writer to win the Jnanpith (2018)",""],["Damodar Mauzo","57th Jnanpith (2022)","Konkani."],["Gulzar","58th Jnanpith (2023), shared","Urdu — shared with Jagadguru Rambhadracharya (Sanskrit)."],["Vinod Kumar Shukla","59th Jnanpith (2024)","Hindi — the first from Chhattisgarh."],["Amrita Pritam","First woman to win the Sahitya Akademi Award (1956)","Punjabi."],["Navtej Sarna","Sahitya Akademi Award 2025 (English)","For Crimson Spring; announced March 2026."],["Mamta Kalia","Sahitya Akademi Award 2025 (Hindi)","For the memoir Jeete Jee Allahabad."],["Jhumpa Lahiri","Pulitzer Prize for Fiction (2000)","For Interpreter of Maladies."],["Siddhartha Mukherjee","Pulitzer Prize for General Non-Fiction (2011)","For The Emperor of All Maladies."],["Danish Siddiqui","Pulitzer Prize for Feature Photography (2018 and 2022)","The 2022 prize was posthumous."],["Gobind Behari Lal","First person of Indian origin to win a Pulitzer (1937)","Journalism."]]},{"k":"tlfig","title":"Literary firsts and milestones","rows":[[1965,"G. Sankara Kurup","First Jnanpith"],[1976,"Ashapoorna Devi","First woman to win the Jnanpith"],[1968,"Sumitranandan Pant","First Hindi writer to win the Jnanpith"],[2018,"Amitav Ghosh","First English-language writer to win the Jnanpith"],[2022,"Damodar Mauzo","57th Jnanpith"],[2023,"Gulzar","58th Jnanpith, shared"],[2024,"Vinod Kumar Shukla","59th Jnanpith"],[1956,"Amrita Pritam","First woman to win the Sahitya Akademi Award"],[2000,"Jhumpa Lahiri","Pulitzer Prize for Fiction"],[2011,"Siddhartha Mukherjee","Pulitzer Prize for General Non-Fiction"],[2018,"Danish Siddiqui","Pulitzer Prize for Feature Photography"],[1937,"Gobind Behari Lal","First person of Indian origin to win a Pulitzer"]],"cap":"The first Jnanpith went to G. Sankara Kurup (Malayalam, 1965); Ashapoorna Devi was the first woman (1976); Amitav Ghosh the first in English (2018)."},{"k":"trick","h":"<b>Birla gives two<\/b>: Saraswati (all languages) and Vyas (Hindi). <b>Jnanpith 2023 was shared<\/b> — Gulzar (Urdu) and Rambhadracharya (Sanskrit)."},{"k":"trap","h":"The <b>Jnanpith<\/b> is given by a private trust (Bharatiya Jnanpith), not the government. The <b>Sahitya Akademi<\/b> recognises <b>24 languages<\/b> (the 22 scheduled ones plus English and Rajasthani). The 60th Jnanpith (2025) was reported for Tamil poet R. Vairamuthu — check the official announcement."}],"sum":["Jnanpith — India's highest literary award (Bharatiya Jnanpith); first winner G. Sankara Kurup (1965).","First woman Jnanpith winner: Ashapoorna Devi (1976); first English: Amitav Ghosh (2018); 2024: Vinod Kumar Shukla.","Sahitya Akademi Award covers 24 languages; 2025 English — Navtej Sarna, Hindi — Mamta Kalia.","Saraswati Samman and Vyas Samman are given by the K. K. Birla Foundation (from 1991).","Booker (1969) for English novels; International Booker for translations; Pulitzer (1917) — Jhumpa Lahiri won for fiction in 2000."],"part":["Part 1 · India’s national honours","भारत के राष्ट्रीय सम्मान"],"g":"aw"},
{"id":"A4","heat":3,"title":"Film, music and arts awards","hi":"फ़िल्म, संगीत और कला पुरस्कार","blocks":[{"k":"hot","h":"Asked often: <b>Dadasaheb Phalke Award<\/b> (first: Devika Rani; latest: Anant Nag, 2024 award, given Sep 2026), <b>Indian Oscar winners<\/b> (Bhanu Athaiya, A. R. Rahman, Naatu Naatu, The Elephant Whisperers), and the <b>top prizes of film festivals<\/b>."},{"k":"story","h":"<p>The <b>Dadasaheb Phalke Award<\/b>, named after the father of Indian cinema (who made Raja Harishchandra, 1913), is India's highest film honour. It began in 1969 and its first recipient was <b>Devika Rani<\/b>. Recent winners: Rajinikanth, Asha Parekh, Waheeda Rehman, Mithun Chakraborty and <b>Mohanlal<\/b> (presented in 2025).<\/p><p>India's first Oscar went to costume designer <b>Bhanu Athaiya<\/b> for Gandhi (1983). <b>A. R. Rahman<\/b> won two for Slumdog Millionaire (2009), and in 2023 India won twice — <b>'Naatu Naatu'<\/b> from RRR and the documentary short <b>The Elephant Whisperers<\/b>. In 2024 <b>Payal Kapadia<\/b> won the Grand Prix at Cannes.<\/p>","key":"Phalke first: Devika Rani (1969); latest: Mohanlal (55th). First Indian Oscar: Bhanu Athaiya (1983)."},{"k":"table","title":"The awards","head":["Award","What it is","Note"],"rows":[["Dadasaheb Phalke Award","India's highest award in cinema","Instituted 1969, the centenary year of Dadasaheb Phalke."],["National Film Awards","Government of India's annual film awards","Started 1954; the top prize is the Golden Lotus (Swarna Kamal)."],["Academy Awards (Oscars)","USA's top film awards","First held in 1929."],["Grammy Awards","USA's top music awards",""],["Golden Globe Awards","Film and TV awards voted by international press",""],["Palme d'Or","Top prize of the Cannes Film Festival (France)",""],["Golden Bear","Top prize of the Berlin Film Festival",""],["Golden Lion","Top prize of the Venice Film Festival",""],["Sangeet Natak Akademi Award","India's national academy award for music, dance and drama","The Akademi was set up in 1952 — the first of the three national academies."],["Kalidas Samman","Arts award of the Madhya Pradesh government",""]]},{"k":"table","title":"Dadasaheb Phalke Award winners","head":["Winner","Year","Note"],"rows":[["Devika Rani","1969 — the first Dadasaheb Phalke Award","'First Lady of Indian cinema'."],["Prithviraj Kapoor","1971 (posthumous)",""],["Satyajit Ray","1984",""],["Raj Kapoor","1987",""],["Lata Mangeshkar","1989",""],["Dilip Kumar","1994",""],["Amitabh Bachchan","2018 award",""],["Rajinikanth","2019 award (51st)",""],["Asha Parekh","2020 award (52nd)",""],["Waheeda Rehman","2021 award (53rd)",""],["Mithun Chakraborty","2022 award (54th)","Presented in October 2024."],["Mohanlal","2023 award (55th)","Presented at the 71st National Film Awards, September 2025."],["Anant Nag","2024 award (56th)","Presented by President Murmu at the 72nd National Film Awards, Ekta Nagar (Gujarat), 22 Sep 2026; second Kannada actor after Dr. Rajkumar (1995)."]]},{"k":"tlfig","title":"Dadasaheb Phalke Award, from Devika Rani to Mohanlal","rows":[[1969,"Devika Rani",""],[1971,"Prithviraj Kapoor","posthumous"],[1984,"Satyajit Ray",""],[1987,"Raj Kapoor",""],[1989,"Lata Mangeshkar",""],[1994,"Dilip Kumar",""],[2018,"Amitabh Bachchan",""],[2019,"Rajinikanth","51st"],[2020,"Asha Parekh","52nd"],[2021,"Waheeda Rehman","53rd"],[2022,"Mithun Chakraborty","54th"],[2023,"Mohanlal","55th"],[2024,"Anant Nag","56th"]],"cap":"Devika Rani was the first (1969, the centenary of Phalke's birth). The years are the award years, often presented later."},{"k":"photos","title":"Phalke winners in pictures","items":[["Devika_Rani","Devika Rani","1969"],["Prithviraj_Kapoor","Prithviraj Kapoor","1971"],["Satyajit_Ray","Satyajit Ray","1984"],["Raj_Kapoor","Raj Kapoor","1987"],["Lata_Mangeshkar","Lata Mangeshkar","1989"],["Dilip_Kumar","Dilip Kumar","1994"],["Amitabh_Bachchan","Amitabh Bachchan","2018"],["Rajinikanth","Rajinikanth","2019"],["Asha_Parekh","Asha Parekh","2020"],["Waheeda_Rehman","Waheeda Rehman","2021"],["Mithun_Chakraborty","Mithun Chakraborty","2022"],["Mohanlal","Mohanlal","2023"],["Anant_Nag","Anant Nag","2024"]]},{"k":"table","title":"Indians at the Oscars, Grammys and Cannes","head":["Winner","Award","Note"],"rows":[["Bhanu Athaiya","Oscar for Costume Design, 1983 (Gandhi)","The first Indian to win an Oscar."],["Satyajit Ray","Honorary Oscar, 1992","For lifetime achievement."],["A. R. Rahman","Two Oscars, 2009 (Slumdog Millionaire)","Original score and original song (Jai Ho)."],["Resul Pookutty","Oscar for Sound Mixing, 2009 (Slumdog Millionaire)",""],["Gulzar","Oscar for Original Song, 2009 (Jai Ho)","Shared with A. R. Rahman."],["M. M. Keeravani and Chandrabose","Oscar for Original Song, 2023 ('Naatu Naatu', RRR)","The first Indian film song to win."],["Kartiki Gonsalves and Guneet Monga","Oscar for Documentary Short, 2023 (The Elephant Whisperers)",""],["Ravi Shankar","The first Indian Grammy winner (1968)","With Yehudi Menuhin, 'West Meets East'."],["Ricky Kej","Three Grammy Awards","Environmentalist composer."],["Zakir Hussain","Three Grammys in one night, 2024","Tabla maestro."],["Payal Kapadia","Grand Prix at Cannes, 2024 (All We Imagine as Light)","The first Indian film to win the Grand Prix."],["Anasuya Sengupta","Best Actress, Un Certain Regard, Cannes 2024","The first Indian to win an acting prize at Cannes."]]},{"k":"trick","h":"Festival animals — <b>Cannes palm, Berlin bear, Venice lion<\/b>: Palme d'Or, Golden Bear, Golden Lion."},{"k":"trap","h":"<b>Satyajit Ray<\/b> got an <b>honorary<\/b> Oscar — the first Indian to <b>win<\/b> one was <b>Bhanu Athaiya<\/b>. <b>Naatu Naatu<\/b>'s Oscar went to <b>M. M. Keeravani<\/b> (music) and <b>Chandrabose<\/b> (lyrics), not to the director Rajamouli."}],"sum":["The Dadasaheb Phalke Award (1969) is India's highest film award; first winner Devika Rani.","Recent Phalke winners: Rajinikanth, Asha Parekh, Waheeda Rehman, Mithun Chakraborty, Mohanlal (55th), Anant Nag (56th, 2024 award).","First Indian Oscar: Bhanu Athaiya (1983, Gandhi); A. R. Rahman won two in 2009.","2023 Oscars: 'Naatu Naatu' (RRR) and The Elephant Whisperers.","Cannes 2024: Payal Kapadia's All We Imagine as Light won the Grand Prix."],"part":["Part 2 · Literature, film, sport","साहित्य, फ़िल्म, खेल"],"g":"aw"},
{"id":"A5","heat":3,"title":"Sports awards","hi":"खेल पुरस्कार","blocks":[{"k":"hot","h":"Annual favourite: the <b>Khel Ratna<\/b> winners — and the 2025 surprise that <b>no one<\/b> got it. Also the <b>first Khel Ratna<\/b> (Anand), what the <b>Dronacharya<\/b> and <b>Arjuna<\/b> awards are for, and the <b>Ballon d'Or<\/b>."},{"k":"story","h":"<p>India's <b>National Sports Awards<\/b> are given by the Ministry of Youth Affairs and Sports. The highest is the <b>Major Dhyan Chand Khel Ratna<\/b> — started in 1991–92 as the Rajiv Gandhi Khel Ratna and renamed after the hockey legend in 2021. Chess star <b>Viswanathan Anand<\/b> was the first winner.<\/p><p>The <b>Arjuna Award<\/b> (1961) is for athletes, the <b>Dronacharya<\/b> (1985) for coaches — named, fittingly, after the great archer and his teacher. For 2024 four got the Khel Ratna — <b>Manu Bhaker, D. Gukesh, Harmanpreet Singh<\/b> and para-athlete <b>Praveen Kumar<\/b>. For 2025, announced in August 2026, the Khel Ratna was <b>not given to anyone<\/b> — the first such year since 2014.<\/p>","key":"Khel Ratna (1991–92, renamed 2021) — first Anand; Arjuna — athletes; Dronacharya — coaches."},{"k":"table","title":"The awards","head":["Award","What it is","Note"],"rows":[["Major Dhyan Chand Khel Ratna","India's highest sporting honour","Started 1991–92 as the Rajiv Gandhi Khel Ratna; renamed in 2021. First winner: Viswanathan Anand."],["Arjuna Award","For outstanding performance by sportspersons","Started 1961; a bronze statuette of Arjuna."],["Dronacharya Award","For coaches","Started 1985."],["Arjuna Award (Lifetime)","For lifetime contribution to sport","Earlier the Major Dhyan Chand Award (from 2002)."],["Maulana Abul Kalam Azad Trophy","For the best university in sports",""],["Rashtriya Khel Protsahan Puraskar","For organisations that promote sport",""],["Tenzing Norgay National Adventure Award","For adventure on land, water and air",""],["Laureus World Sports Award","International — called the 'Oscars of sport'","Sachin won the Laureus Sporting Moment award in 2020."],["Ballon d'Or","Best footballer of the year (France Football)","Started 1956."]]},{"k":"cards","title":"Who gets which sports award","rows":[["Major Dhyan Chand Khel Ratna","India's highest sporting honour","Started 1991–92 as the Rajiv Gandhi Khel Ratna","🏆"],["Arjuna Award","For outstanding performance by sportspersons","Started 1961","🏹"],["Dronacharya Award","For coaches","Started 1985","🧑‍🏫"],["Arjuna Award (Lifetime)","For lifetime contribution to sport","Earlier the Major Dhyan Chand Award (from 2002)","🏹"],["Maulana Abul Kalam Azad Trophy","For the best university in sports","","🎓"],["Rashtriya Khel Protsahan Puraskar","For organisations that promote sport","","🏅"],["Tenzing Norgay National Adventure Award","For adventure on land, water and air","","🏔️"]]},{"k":"table","title":"Recent winners","head":["Winner","Award","Note"],"rows":[["Viswanathan Anand","First Khel Ratna (1991–92)","Chess."],["Neeraj Chopra","Khel Ratna 2021","Tokyo Olympic javelin gold."],["Sharath Kamal","Khel Ratna 2022","Table tennis."],["Satwiksairaj Rankireddy and Chirag Shetty","Khel Ratna 2023","Badminton doubles."],["Manu Bhaker","Khel Ratna 2024","Shooting — two bronzes at Paris 2024."],["D. Gukesh","Khel Ratna 2024","Chess — world champion."],["Harmanpreet Singh","Khel Ratna 2024","Hockey captain."],["Praveen Kumar","Khel Ratna 2024","Para high jump — Paralympic gold."],["Divya Deshmukh","Arjuna Award 2025","Chess."],["Tejaswin Shankar","Arjuna Award 2025","High jump / decathlon."],["Ousmane Dembélé","Ballon d'Or 2025","France — Paris Saint-Germain."]]},{"k":"photos","title":"Winners in pictures","items":[["Viswanathan_Anand","Viswanathan Anand","First Khel Ratna"],["Neeraj_Chopra","Neeraj Chopra","Khel Ratna 2021"],["Manu_Bhaker","Manu Bhaker","Khel Ratna 2024"],["Gukesh_Dommaraju","D. Gukesh","Khel Ratna 2024"],["Harmanpreet_Singh","Harmanpreet Singh","Khel Ratna 2024"],["Sharath_Kamal","Sharath Kamal","Khel Ratna 2022"]]},{"k":"trick","h":"Mahabharata logic — <b>Arjuna the pupil, Dronacharya the teacher<\/b>: Arjuna Award for players, Dronacharya for coaches."},{"k":"trap","h":"The Khel Ratna was renamed after <b>Dhyan Chand<\/b> in 2021 — it was earlier named after Rajiv Gandhi. The <b>Arjuna<\/b> statuette is of Arjuna; the award is <b>not<\/b> for coaches. For <b>2025<\/b> there was <b>no<\/b> Khel Ratna."}],"sum":["Major Dhyan Chand Khel Ratna — India's highest sports award; started 1991–92, renamed 2021; first winner Viswanathan Anand.","Arjuna Award (1961) for sportspersons; Dronacharya Award (1985) for coaches.","Khel Ratna 2024: Manu Bhaker, D. Gukesh, Harmanpreet Singh, Praveen Kumar.","No Khel Ratna was given for 2025; Arjuna 2025 went to 17 athletes including Divya Deshmukh.","Ballon d'Or (1956) — 2025 winner Ousmane Dembélé; Laureus — the 'Oscars of sport'."],"part":["Part 2 · Literature, film, sport","साहित्य, फ़िल्म, खेल"],"g":"aw"},
{"id":"A6","heat":3,"title":"The Nobel Prize and Indian laureates","hi":"नोबेल पुरस्कार और भारतीय विजेता","blocks":[{"k":"hot","h":"Always asked: <b>Indian Nobel laureates<\/b> with field and year (Tagore 1913, Raman 1930, Khorana 1968, Mother Teresa 1979, Chandrasekhar 1983, Sen 1998, Satyarthi 2014, Banerjee 2019) and basic Nobel facts (1901, Alfred Nobel, Oslo for Peace)."},{"k":"story","h":"<p>Alfred Nobel, the inventor of dynamite, left his fortune to reward those who did the most good for humanity. The first prizes were given in <b>1901<\/b> in five fields — Physics, Chemistry, Medicine, Literature and Peace; <b>Economics<\/b> was added in <b>1969<\/b>. All are handed out on <b>10 December<\/b>, Nobel's death anniversary — Peace in <b>Oslo<\/b>, the rest in <b>Stockholm<\/b>.<\/p><p>India's story begins with <b>Rabindranath Tagore<\/b>, the first Asian laureate, in 1913, and <b>C. V. Raman<\/b>, the first Asian scientist to win, in 1930. Since then: Khorana, Mother Teresa, Chandrasekhar, Amartya Sen, Kailash Satyarthi and Abhijit Banerjee — plus Indian-origin and India-born laureates like Naipaul, Ramakrishnan, Ronald Ross and Kipling.<\/p>","key":"Nobel started 1901; Economics from 1969; Peace given in Oslo; Tagore (1913) the first Asian; Raman (1930) the first Asian scientist."},{"k":"photos","title":"Laureates in pictures","items":[["Rabindranath_Tagore","Rabindranath Tagore","Literature, 1913"],["C._V._Raman","C. V. Raman","Physics, 1930"],["Har_Gobind_Khorana","Har Gobind Khorana","Medicine, 1968"],["Mother_Teresa","Mother Teresa","Peace, 1979"],["Subrahmanyan_Chandrasekhar","Subrahmanyan Chandrasekhar","Physics, 1983"],["Amartya_Sen","Amartya Sen","Economics, 1998"],["V._S._Naipaul","V. S. Naipaul","Literature, 2001"],["Venkatraman_Ramakrishnan","Venkatraman Ramakrishnan","Chemistry, 2009"],["Kailash_Satyarthi","Kailash Satyarthi","Peace, 2014"],["Abhijit_Banerjee","Abhijit Banerjee","Economics, 2019"],["Ronald_Ross","Ronald Ross","Medicine, 1902"],["Rudyard_Kipling","Rudyard Kipling","Literature, 1907"],["Dalai_Lama","Dalai Lama","Peace, 1989"]]},{"k":"facts","title":"Nobel facts","rows":[["Founded by","The will of Alfred Nobel (inventor of dynamite)"],["First awarded","1901"],["Economics prize","Added in 1969 (Sveriges Riksbank Prize)"],["Ceremony","10 December — Peace in Oslo (Norway), the others in Stockholm (Sweden)"],["Youngest laureate","Malala Yousafzai — Peace, 2014, at 17"],["Won in two sciences","Marie Curie — Physics 1903, Chemistry 1911"],["Two unshared Nobels","Linus Pauling — Chemistry 1954, Peace 1962"],["Most Peace prizes","The International Committee of the Red Cross (three)"]]},{"k":"table","title":"Indians and India-linked laureates","head":["Laureate","Field and year","Note"],"rows":[["Rabindranath Tagore","Literature, 1913","The first Asian Nobel laureate — for Gitanjali."],["C. V. Raman","Physics, 1930","For the Raman effect — the first Asian Nobel in science."],["Har Gobind Khorana","Medicine, 1968","For decoding the genetic code."],["Mother Teresa","Peace, 1979",""],["Subrahmanyan Chandrasekhar","Physics, 1983","The Chandrasekhar limit for stars."],["Amartya Sen","Economics, 1998","Welfare economics."],["V. S. Naipaul","Literature, 2001","Trinidad-born, of Indian origin."],["Venkatraman Ramakrishnan","Chemistry, 2009","Structure of the ribosome."],["Kailash Satyarthi","Peace, 2014","Shared with Malala Yousafzai — against child labour."],["Abhijit Banerjee","Economics, 2019","Shared with Esther Duflo and Michael Kremer — fighting poverty."],["Ronald Ross","Medicine, 1902","Born in Almora; showed that mosquitoes carry malaria."],["Rudyard Kipling","Literature, 1907","Born in Bombay; youngest Literature laureate."],["Dalai Lama","Peace, 1989","Lives in India (Dharamshala)."]]},{"k":"tlfig","title":"Indian and India-linked Nobel laureates","rows":[[1913,"Rabindranath Tagore","Literature"],[1930,"C. V. Raman","Physics"],[1968,"Har Gobind Khorana","Medicine"],[1979,"Mother Teresa","Peace"],[1983,"Subrahmanyan Chandrasekhar","Physics"],[1998,"Amartya Sen","Economics"],[2001,"V. S. Naipaul","Literature"],[2009,"Venkatraman Ramakrishnan","Chemistry"],[2014,"Kailash Satyarthi","Peace"],[2019,"Abhijit Banerjee","Economics"],[1902,"Ronald Ross","Medicine"],[1907,"Rudyard Kipling","Literature"],[1989,"Dalai Lama","Peace"]],"cap":"Ronald Ross (1902) and Kipling (1907) were born in India; Tagore (1913) was the first Indian and the first Asian laureate; Raman (1930) the first Asian in science."},{"k":"bars","title":"By field","left":110,"hi":2,"rows":[["Literature",3,"Tagore, Naipaul, Kipling"],["Physics",2,"Raman, Chandrasekhar"],["Medicine",2,"Khorana, Ross"],["Peace",3,"Teresa, Satyarthi, Lama"],["Economics",2,"Sen, Banerjee"],["Chemistry",1,"Ramakrishnan"]]},{"k":"trick","h":"Indian Nobels in order — <b>“Tagore Raised Kids, Mother Cared, Sen Sat Bravely”<\/b>: Tagore 1913, Raman 1930, Khorana 1968, Mother Teresa 1979, Chandrasekhar 1983, Sen 1998, Satyarthi 2014, Banerjee 2019."},{"k":"trap","h":"<b>Khorana<\/b> won for <b>Medicine<\/b>, not Chemistry. <b>Ramakrishnan<\/b> (2009) won for <b>Chemistry<\/b>. The <b>Peace<\/b> prize is given in <b>Oslo<\/b>, not Stockholm. <b>Kailash Satyarthi<\/b> shared his prize with <b>Malala<\/b>."}],"sum":["The Nobel Prize was first given in 1901; Economics was added in 1969; Peace is given in Oslo.","Tagore (Literature 1913) was the first Asian laureate; C. V. Raman (Physics 1930) the first Asian in science.","Khorana — Medicine 1968; Mother Teresa — Peace 1979; Chandrasekhar — Physics 1983; Amartya Sen — Economics 1998.","Kailash Satyarthi — Peace 2014 (with Malala); Abhijit Banerjee — Economics 2019.","Malala is the youngest laureate; Marie Curie won in two sciences; Linus Pauling won two unshared prizes."],"part":["Part 2 · Literature, film, sport","साहित्य, फ़िल्म, खेल"],"g":"aw"},
{"id":"A7","heat":2,"title":"World awards and what they are called","hi":"विश्व पुरस्कार और उनके उपनाम","blocks":[{"k":"hot","h":"Papers love the nicknames: <b>Asia's Nobel<\/b> (Magsaysay), <b>Green Nobel<\/b> (Goldman), <b>Nobel of architecture<\/b> (Pritzker), <b>Nobel of computing<\/b> (Turing), <b>Alternative Nobel<\/b> (Right Livelihood), <b>Nobel of water<\/b> (Stockholm Water Prize) — plus Indian winners of each."},{"k":"story","h":"<p>Many fields have a prize so famous it is called 'the Nobel of' that field. The <b>Pritzker<\/b> for architecture (B. V. Doshi, 2018), the <b>Turing Award<\/b> for computing (Raj Reddy, 1994), the <b>Abel Prize<\/b> and <b>Fields Medal<\/b> for mathematics, the <b>World Food Prize<\/b> for agriculture (M. S. Swaminathan, the very first, 1987), and the <b>Stockholm Water Prize<\/b> (Rajendra Singh, 2015).<\/p><p>Asia's own is the <b>Ramon Magsaysay Award<\/b> from the Philippines: <b>Vinoba Bhave<\/b> was the first Indian (1958), and in 2025 <b>Educate Girls<\/b> became the first Indian organisation to win. India's government gives the <b>Gandhi Peace Prize<\/b>, started in 1995.<\/p>","key":"Magsaysay = Asia's Nobel; Pritzker = architecture; Turing = computing; Goldman = Green Nobel; Right Livelihood = Alternative Nobel."},{"k":"table","title":"Awards and their nicknames","head":["Award","Called / given for","Note"],"rows":[["Ramon Magsaysay Award","Asia's Nobel Prize","Philippines, since 1957."],["Pritzker Prize","The Nobel of architecture","B. V. Doshi (2018) was the first Indian winner."],["Abel Prize","A Nobel-level prize for mathematics (Norway)","S. R. Srinivasa Varadhan won in 2007."],["Fields Medal","Mathematics, for those under 40, every four years","Manjul Bhargava (2014) and Akshay Venkatesh (2018) are of Indian origin."],["Turing Award","The Nobel of computing","Raj Reddy (1994) was the first Asian winner."],["Templeton Prize","For spiritual and religious contributions","The Dalai Lama won in 2012."],["Kalinga Prize","UNESCO prize for popularising science","Instituted in 1952 with a gift from Biju Patnaik."],["Goldman Environmental Prize","The Green Nobel",""],["Stockholm Water Prize","The Nobel Prize of water","Rajendra Singh, 'Waterman of India', won in 2015."],["Right Livelihood Award","The Alternative Nobel Prize","Sweden."],["World Food Prize","The Nobel of food and agriculture","M. S. Swaminathan was the first winner (1987)."],["Champions of the Earth","The UN Environment Programme's top environmental honour","Narendra Modi received it in 2018 (with Emmanuel Macron)."],["Gandhi Peace Prize","Government of India's international peace award","Started 1995; first winner Julius Nyerere; latest (2021) Gita Press, Gorakhpur."],["Indira Gandhi Peace Prize","Indira Gandhi Memorial Trust's award for peace, disarmament and development","Started 1986."],["Lasker Award","Medical research — 'America's Nobel'",""],["Sakharov Prize","European Parliament's prize for freedom of thought",""],["Nansen Refugee Award","UNHCR's award for helping refugees",""],["Holberg Prize","Humanities and social sciences (Norway)",""]]},{"k":"cards","title":"Know the award by its nickname","rows":[["Asia's Nobel Prize","Ramon Magsaysay Award","Philippines, since 1957.","🏅"],["The Nobel of architecture","Pritzker Prize","B. V. Doshi (2018) was the first Indian winner.","🏅"],["A Nobel-level prize for mathematics (Norway)","Abel Prize","S. R. Srinivasa Varadhan won in 2007.","🏅"],["The Nobel of computing","Turing Award","Raj Reddy (1994) was the first Asian winner.","🏅"],["The Green Nobel","Goldman Environmental Prize","","🏅"],["The Nobel Prize of water","Stockholm Water Prize","Rajendra Singh, 'Waterman of India', won in 2015.","🏅"],["The Alternative Nobel Prize","Right Livelihood Award","Sweden.","🏅"],["The Nobel of food and agriculture","World Food Prize","M. S. Swaminathan was the first winner (1987).","🏅"],["Medical research — 'America's Nobel'","Lasker Award","","🏅"]]},{"k":"table","title":"Indians and the Magsaysay Award","head":["Winner","Year","Note"],"rows":[["Vinoba Bhave","Ramon Magsaysay Award, 1958","The first Indian to receive it."],["Kiran Bedi","Ramon Magsaysay Award, 1994",""],["T. N. Seshan","Ramon Magsaysay Award, 1996","Election reforms."],["Arvind Kejriwal","Ramon Magsaysay Award, 2006",""],["Ravish Kumar","Ramon Magsaysay Award, 2019","Journalism."],["Educate Girls","Ramon Magsaysay Award, 2025","The first Indian organisation to receive it (founded by Safeena Husain)."]]},{"k":"tlfig","title":"Indians and the Magsaysay Award","rows":[[1958,"Vinoba Bhave","The first Indian to receive it"],[1994,"Kiran Bedi",""],[1996,"T. N. Seshan","Election reforms"],[2006,"Arvind Kejriwal",""],[2019,"Ravish Kumar","Journalism"],[2025,"Educate Girls","The first Indian organisation to r"]],"cap":"Vinoba Bhave (1958) was the first Indian winner."},{"k":"trick","h":"<b>Pritzker = Plans<\/b> (architects draw plans). <b>Turing = Tech<\/b>. <b>Goldman = Green<\/b> (G-G). <b>Kalinga = Knowledge for all<\/b> (popular science)."},{"k":"trap","h":"The <b>Fields Medal<\/b> is only for mathematicians <b>under 40<\/b>; the <b>Abel Prize<\/b> has no age limit. The <b>Gandhi Peace Prize<\/b> is given by the Indian government; the <b>Indira Gandhi Peace Prize<\/b> by a trust. <b>Magsaysay<\/b> is Philippine, not Indian."}],"sum":["Ramon Magsaysay Award (Philippines, 1957) is called Asia's Nobel; Vinoba Bhave was the first Indian winner.","Pritzker — architecture (B. V. Doshi 2018); Turing — computing (Raj Reddy 1994); Abel and Fields — mathematics.","World Food Prize — first winner M. S. Swaminathan (1987); Stockholm Water Prize — Rajendra Singh (2015).","Goldman — the Green Nobel; Right Livelihood — the Alternative Nobel; Kalinga — UNESCO science popularisation (1952).","Gandhi Peace Prize (1995) — first Julius Nyerere, latest Gita Press (2021); Educate Girls won the Magsaysay in 2025."],"part":["Part 3 · World awards and the latest winners","विश्व पुरस्कार और नवीनतम विजेता"],"g":"aw"},
{"id":"A8","heat":3,"title":"Latest winners, 2025–2026","hi":"नवीनतम विजेता 2025–26","blocks":[{"k":"hot","h":"Current-affairs sections ask about the <b>most recent<\/b> winners: Nobel 2025 and 2026, the International Booker, the Booker, the Oscars, the Magsaysay Award and India's own honours. This lesson is dated <b>October 2026<\/b>."},{"k":"story","h":"<p>The <b>2026 Nobels<\/b> (announced 5–12 October 2026) went to: Francis Halzen (Physics), Henri Kagan and Kenso Soai (Chemistry), Deisseroth, Hegemann and Nagel (Medicine, for optogenetics), Canadian poet <b>Anne Carson<\/b> (Literature), South African jurist <b>Navi Pillay<\/b> (Peace), and Robert Hall and Michael Woodford (Economics).<\/p><p>In books, <b>Taiwan Travelogue<\/b> won the International Booker 2026 and <b>Flesh<\/b> by David Szalay the Booker 2025. At the 2026 Oscars <b>One Battle After Another<\/b> was Best Picture. No Indian won the Magsaysay in 2026, and no Bharat Ratna has been announced since 2024.<\/p>","key":"Nobel Peace 2026 — Navi Pillay; Literature 2026 — Anne Carson; 2025 Peace — María Corina Machado."},{"k":"table","title":"Nobel Prizes 2025 and 2026","head":["Prize","Winners","For"],"rows":[["Physics 2026","Francis Halzen","For discovering high-energy neutrinos from space."],["Chemistry 2026","Henri B. Kagan and Kenso Soai","How homochirality can arise by itself."],["Medicine 2026","Karl Deisseroth, Peter Hegemann and Georg Nagel","Optogenetics."],["Literature 2026","Anne Carson","Canadian poet."],["Peace 2026","Navi Pillay","South African jurist, former UN human rights chief."],["Economics 2026","Robert E. Hall and Michael Woodford","New macroeconomic models for stabilisation policy."],["Physics 2025","John Clarke, Michel Devoret and John Martinis","Quantum effects in electric circuits."],["Chemistry 2025","Susumu Kitagawa, Richard Robson and Omar Yaghi","Metal–organic frameworks."],["Medicine 2025","Mary Brunkow, Fred Ramsdell and Shimon Sakaguchi","Peripheral immune tolerance."],["Literature 2025","László Krasznahorkai","Hungarian novelist."],["Peace 2025","María Corina Machado","Venezuelan democracy campaigner."],["Economics 2025","Joel Mokyr, Philippe Aghion and Peter Howitt","Innovation-driven growth."]]},{"k":"cards","title":"The Nobel Prizes of 2026","rows":[["Francis Halzen","Physics 2026","For discovering high-energy neutrinos from space.","⚛️"],["Henri B. Kagan and Kenso Soai","Chemistry 2026","How homochirality can arise by itself.","🧪"],["Karl Deisseroth, Peter Hegemann and Georg Nagel","Medicine 2026","Optogenetics.","🩺"],["Anne Carson","Literature 2026","Canadian poet.","📖"],["Navi Pillay","Peace 2026","South African jurist, former UN human rights chief.","🕊️"],["Robert E. Hall and Michael Woodford","Economics 2026","New macroeconomic models for stabilisation policy.","📈"]],"cap":"Announced in October; presented on 10 December — Peace in Oslo, the rest in Stockholm."},{"k":"table","title":"Other recent winners","head":["Award","Winner","Note"],"rows":[["International Booker Prize 2026","Taiwan Travelogue — Yáng Shuāng-zǐ (tr. Lin King)","The first winner translated from Mandarin."],["International Booker Prize 2025","Heart Lamp — Banu Mushtaq (tr. Deepa Bhasthi)","The first Kannada winner."],["Booker Prize 2025","Flesh — David Szalay",""],["Oscar for Best Picture 2026","One Battle After Another","Directed by Paul Thomas Anderson, who also won Best Director."],["Oscar for Best Actor 2026","Michael B. Jordan","For Sinners."],["Oscar for Best Actress 2026","Jessie Buckley","For Hamnet."],["Ramon Magsaysay Award 2026","Tommy Koh, Runa Khan and Bo Kyi","From Singapore, Bangladesh and Myanmar — no Indian winner."],["Padma Vibhushan 2026 (art)","Dharmendra and N. Rajam",""],["Jnanpith (59th, 2024)","Vinod Kumar Shukla","Hindi."],["Bharat Ratna (latest, 2024)","Karpoori Thakur, L. K. Advani, P. V. Narasimha Rao, Charan Singh and M. S. Swaminathan","None announced in 2025 or 2026 (to date)."]]},{"k":"trick","h":"Read the year in the question carefully — <b>Peace 2025 Machado, Peace 2026 Pillay<\/b>; <b>Literature 2025 Krasznahorkai, 2026 Carson<\/b>."},{"k":"trap","h":"This lesson goes out of date every year. Before your exam, check the latest Nobel, Booker, Oscar, Padma and sports award winners in the news."},{"k":"p","h":"<b>Checked 23 October 2026<\/b> against NobelPrize.org and Britannica (Nobel 2026), the Ramon Magsaysay Award Foundation's 2026 information kit (announced 31 Aug; presented 15 Nov in Manila) and the Booker Prizes site. <b>Booker Prize 2026<\/b>: the winner is due on <b>9 November 2026<\/b>; the shortlist (22 Sept) is M. John Harrison, Marlon James, Luke Kennard, Rebecca Perry, Elizabeth Strout and Douglas Stuart — until then, Flesh (David Szalay, 2025) is the latest winner."}],"sum":["Nobel 2026: Physics Halzen; Chemistry Kagan and Soai; Medicine Deisseroth, Hegemann, Nagel; Literature Anne Carson; Peace Navi Pillay; Economics Hall and Woodford.","Nobel 2025: Peace María Corina Machado; Literature László Krasznahorkai; Chemistry Kitagawa, Robson, Yaghi (MOFs).","International Booker 2026: Taiwan Travelogue; 2025: Heart Lamp (Banu Mushtaq). Booker 2025: Flesh (David Szalay).","Oscars 2026: Best Picture One Battle After Another; Best Actor Michael B. Jordan; Best Actress Jessie Buckley.","Magsaysay 2026: Tommy Koh, Runa Khan, Bo Kyi; the latest Bharat Ratna awards are those of 2024."],"part":["Part 3 · World awards and the latest winners","विश्व पुरस्कार और नवीनतम विजेता"],"g":"aw"}
];

  .steps + .stack:not(:has(> .block ~ .block)) > .block{grid-column:1/-1}
  .block,.qcard{padding:18px 20px;border-radius:14px}

  /* quizzes and question bank */
  #lq > .stack{display:grid;grid-template-columns:minmax(0,1fr);max-width:980px;gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qt{font-size:18px}
  #plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #plist .opts{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:wrap;overflow:visible}

  /* mock test: question with the answer grid alongside */
  .mbar{top:calc(env(safe-area-inset-top,0px) + 67px)}
  .view > .qcard{max-width:1000px}
  .view > .row.between{max-width:1000px}
  .view > #msub{max-width:1000px;width:100%}
  .view > .block.stack{max-width:760px}
  .pal{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .kpis{max-width:760px}

  /* revise: summary cards and sheets in columns */
  #rv > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #rv > .stack > .grph,#rv > .stack > p,#rv > .stack > .search,#rv > .stack > .callout{grid-column:1/-1}
  #dgl,#lml,#tll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #dgl > .grph,#dgl > p,#lml > p,#tll > .grph{grid-column:1/-1}
  #rv .search,#rv > #dgl ~ .search{max-width:520px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flash{min-height:300px;max-width:760px;margin:0 auto;padding:32px 36px}
  .flash .front{font-size:22px}

  /* learn: era cards across the top */
  .eras{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}
  .les{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}

</style>
<script id="shabd-deeplink">
(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();
</script>

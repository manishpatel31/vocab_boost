<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>

<title>Awards &amp; Honours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Shared by every History page (built by tools/history/build.js).
   Layout: a manuscript folio — parchment paper, maroon ink, gold figures; one-column app with a bottom tab bar. */
:root{
  --paper:#f3efe4; --sheet:#fffdf6; --sunk:#e8e1cf;
  --ink:#241c14; --ink2:#5d5141; --rule:#d8cdb4;
  --blue:#7a2230; --on-blue:#ffffff; --blue-bg:#f4e2e1;
  --accent:#9a6a12; --accent-bg:#f8ecc9;
  --good:#1b6b4a; --good-bg:#ddefe4; --bad:#a8291f; --bad-bg:#f8e0dc;
  --warn-bg:#fcf0cf;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* era groups on the Learn screen */
.eras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.erac{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:grid;gap:6px}
.erac b{font-family:var(--f-display);font-size:15px;font-weight:700;line-height:1.25}
.erac .hi{font-size:12px;color:var(--ink2)}
.erac .mt{font-family:var(--f-num);font-size:11px;color:var(--ink2)}
.erac .meter{height:6px}
.erac[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.grph{display:flex;align-items:baseline;gap:8px;padding:14px 2px 4px;border-top:2px solid var(--ink);margin-top:4px}
.grph h2{font-size:17px}
.grph span{font-size:12px;color:var(--ink2);margin-left:auto;font-family:var(--f-num)}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}
.dots{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--rule);display:block}
.dots i.on{background:var(--accent)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.hot{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px;font-size:15px}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.facts.prose dd{font-weight:400;line-height:1.55}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap,.link{border-radius:var(--r);padding:12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.link{background:var(--sunk);border-color:transparent}
.trick .lab,.trap .lab,.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.link .lab{color:var(--ink2)}
.mn{font-family:var(--f-num);font-weight:600;background:var(--sheet);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.tag.src{background:var(--good-bg);color:var(--good)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:22px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
/* one-line revision rows (last week / last moment) */
.lines{display:grid;gap:0}
.lines div{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px dashed var(--rule);font-size:15px}
.lines div:first-child{border-top:0}
.lines b{font-weight:700}
.lines span{color:var(--ink2)}
.callout{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;font-size:15px}

/* plan maker */
.plancfg{display:grid;gap:12px}
.pday{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.pday > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pday > summary::-webkit-details-marker{display:none}
.pday .dno{font-family:var(--f-num);font-weight:700;font-size:13px;background:var(--sunk);border-radius:99px;padding:2px 10px;white-space:nowrap}
.pday.cur .dno{background:var(--blue);color:var(--on-blue)}
.pday.allgood .dno{background:var(--good-bg);color:var(--good)}
.pday .dt{min-width:0;font-weight:600;font-size:15px}
.pday .dt small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
.pday .dp{font-family:var(--f-num);font-size:12px;color:var(--ink2);white-space:nowrap}
.pday .body{padding:0 14px 12px;display:grid;gap:8px;border-top:1px dashed var(--rule);margin-top:2px;padding-top:10px}
.ptask{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;width:100%;font-size:15px}
.ptask .box{width:22px;height:22px;border-radius:6px;border:1.6px solid var(--rule);display:grid;place-items:center;font-size:14px;color:var(--on-blue);margin-top:1px}
.ptask[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.ptask[aria-pressed="true"] .lbl{text-decoration:line-through;color:var(--ink2)}
.ptask .lbl small{display:block;font-size:12px;color:var(--ink2);text-decoration:none}
/* the story first: plain-language opener for beginners */
.story{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;font-size:16.5px;line-height:1.65}
.story .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.story p{margin:0}
.story .key{background:var(--blue-bg);border-radius:8px;padding:8px 12px;font-size:15px;line-height:1.5}
.story .key b{color:var(--blue)}
/* hub: app cards and the beginner path */
.appcs{display:grid;gap:12px}
.appc{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;text-align:left;width:100%;cursor:pointer}
.appc:hover{border-color:var(--blue)}
.appc .hd{display:flex;align-items:center;gap:10px}
.appc .ic{font-size:26px;line-height:1}
.appc .hd b{font-family:var(--f-display);font-size:17px;font-weight:700;display:block}
.appc .hd small{font-size:12px;color:var(--ink2)}

.hmwrap > summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}

.hm{text-align:center;font-size:12px;letter-spacing:1px;white-space:nowrap}

.hm.h3 span{background:var(--bad);color:#fff}

.hmkey{font-size:12.5px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.hmkey .hm span{min-width:0}
@media (prefers-reduced-motion: no-preference){ .opt,.chip,.btn{transition:background-color .15s, border-color .15s} }

{"id":"A1","heat":3,"title":"Bharat Ratna","hi":"भारत रत्न","blocks":[{"k":"hot","h":"Very frequent: the <b>first three<\/b> recipients (1954), <b>firsts<\/b> (first woman, first posthumous, first foreigner, youngest), the <b>2024 five<\/b>, and facts about the award itself (peepal leaf, no money, at most three a year)."},{"k":"story","h":"<p>The <b>Bharat Ratna<\/b>, India's highest civilian honour, was instituted on <b>2 January 1954<\/b>. The first three went that year to <b>C. Rajagopalachari<\/b>, <b>S. Radhakrishnan<\/b> and <b>C. V. Raman<\/b>. It is shaped like a <b>peepal leaf<\/b> with a sun on it, carries <b>no money<\/b>, and is normally limited to <b>three a year<\/b> — though five were announced in 2024.<\/p><p>Its 'firsts' are favourites: <b>Lal Bahadur Shastri<\/b> (first posthumous, 1966), <b>Indira Gandhi<\/b> (first woman, 1971), <b>Mother Teresa<\/b> (first naturalised citizen, 1980), <b>Khan Abdul Ghaffar Khan<\/b> (first non-Indian, 1987), <b>Sachin Tendulkar<\/b> (youngest and first sportsperson, 2014). As of 2026 there are <b>53<\/b> recipients; none were named in 2025.<\/p>","key":"1954 first three: Rajaji, Radhakrishnan, Raman. 2024 five: Karpoori Thakur, Advani, Narasimha Rao, Charan Singh, Swaminathan."},{"k":"photos","title":"Recipients in pictures","items":[["C._Rajagopalachari","C. Rajagopalachari","1954 · among the first three"],["Sarvepalli_Radhakrishnan","S. Radhakrishnan","1954"],["C._V._Raman","C. V. Raman","1954"],["Indira_Gandhi","Indira Gandhi","1971 · first woman"],["Mother_Teresa","Mother Teresa","1980"],["Abdul_Ghaffar_Khan","Khan Abdul Ghaffar Khan","1987 · first non-Indian"],["Nelson_Mandela","Nelson Mandela","1990"],["J._R._D._Tata","J. R. D. Tata","1992 · first industrialist"],["Sachin_Tendulkar","Sachin Tendulkar","2014 · youngest"],["Karpoori_Thakur","Karpoori Thakur","2024"],["M._S._Swaminathan","M. S. Swaminathan","2024"],["L._K._Advani","L. K. Advani","2024"]]},{"k":"facts","title":"About the award","rows":[["Instit turalised citizen to receive it."],["Khan Abdul Ghaffar Khan","1987","The first non-Indian recipient ('Frontier Gandhi')."],["M. G. Ramachandran","1988","The first film actor to receive it (posthumous)."],["B. R. Ambedkar","1990","Posthumous."],["Nelson Mandela","1990","Second non-Indian recipient."],["Sardar Vallabhbhai Patel","1991","Posthumous."],["J. R. D. Tata","1992","The first industrialist to receive it."],["Satyajit Ray","1992",""],["A. P. J. Abdul Kalam","1997","Received it before becoming President."],["M. S. Subbulakshmi","1998","The first musician to receive it."],["Amartya Sen","1999",""],["Lata Mangeshkar","2001",""],["Bismillah Khan","2001","Shehnai maestro."],["Bhimsen Joshi","2009",""],["Sachin Tendulkar","2014","Youngest recipient and the first sportsperson."],["C. N. R. Rao","2014","Chemist — received it with Sachin."],["Atal Bihari Vajpayee","2015",""],["Madan Mohan Malaviya","2015","Posthumous; founder of BHU."],["Pranab Mukherjee","2019",""],["Bhupen Hazarika","2019","Posthumous."],["Nanaji Deshmukh","2019","Posthumous."],["Karpoori Thakur","2024","Posthumous; former Bihar CM."],["L. K. Advani","2024",""],["P. V. Narasimha Rao","2024","Posthumous."],["Chaudhary Charan Singh","2024","Posthumous."],["M. S. Swaminathan","2024","Posthumous; father of India's Green Revolution."]]},{"k":"cards","title":"Firsts of the Bharat Ratna","rows":[["Dhondo Keshav Karve","1958","Received it at 100 — the oldest recipient","🎂"],["Lal Bahadur Shastri","1966","The first posthumous award","🕯️"],["Indira Gandhi","1971","The first woman to receive it","👩"],["Mother Teresa","1980","The first naturalised citizen to receive it","🌍"],["Khan Abdul Ghaffar Khan","1987","The first non-Indian recipient ('Frontier Gandhi')","🌍"],["M. G. Ramachandran","1988","The first film actor to receive it (posthumous)","🕯️"],["J. R. D. Tata","1992","The first industrialist to receive it","🏭"],["M. S. Subbulakshmi","1998","The first musician to receive it","🎵"],["Sachin Tendulkar","2014", {"id":"A2","heat":3,"title":"Padma awards","hi":"पद्म पुरस्कार","blocks":[{"k":"hot","h":"Asked in current affairs every year: the <b>Padma Vibhushan<\/b> recipients of the year, the <b>total number<\/b> of awards, and basic facts — three tiers, announced on the <b>eve of Republic Day<\/b>."},{"k":"story","h":"<p>Below the Bharat Ratna come the three <b>Padma<\/b> awards, also started in 1954: <b>Padma Vibhushan<\/b> (exceptional service), <b>Padma Bhushan<\/b> (high order) and <b>Padma Shri<\/b> (distinguished service). They are announced every year on the <b>eve of Republic Day<\/b> and presented by the President at Rashtrapati Bhavan in March–April.<\/p><p>For <b>2026<\/b> the President approved <b>131<\/b> awards — 5 Padma Vibhushan, 13 Padma Bhushan and 113 Padma Shri. The five Vibhushans went to actor <b>Dharmendra<\/b> (posthumous), jurist <b>K. T. Thomas<\/b>, violinist <b>N. Rajam<\/b>, writer <b>P. Narayanan<\/b> and former Kerala CM <b>V. S. Achuthanandan<\/b> (posthumous).<\/p>","key":"Padma Vibhushan > Padma Bhushan > Padma Shri; 2026: 131 awards (5 + 13 + 113)."},{"k":"facts","title":"About the Padma awards","rows":[["Started","1954 (renamed to today's names in 1955)"],["Order","Padma Vibhushan > Padma Bhushan > Padma Shri"],["Announced","On the eve of Republic Day (25 January)"],["Presented by","The President, at Rashtrapati Bhavan"],["Selected by","The Padma Awards Committee, set up by the Prime Minister each year"],["2026","131 awards: 5 Padma Vibhushan, 13 Padma Bhushan, 113 Padma Shri"],["Padma Bhushan 2026 (some)","Alka Yagnik, Mammootty, Bhagat Singh Koshyari, Uday Kotak, Vijay Amritraj"],["2025","139 awards: 7 Padma Vibhushan, 19 Padma Bhushan, 113 Padma Shri"]]},{"k":"info","title":"The order, top to bottom","html":"<figure class=\"fig wide\" style=\"--minw:520px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 250\" role=\"img\" aria-label=\"The order of India's civilian awards\"><path d=\"M280 10 L400 10 L460 64 L220 64 Z\" class=\"s2\" stroke=\"var(--rule)\"/><text x=\"340\" y=\"34\" text-anchor=\"middle\" font-size=\"15\" class=\"b\">Bharat Ratna<\/text><text x=\"340\" y=\"52\" text-anchor=\"middle\" font-size=\"11\" class=\"mut\">highest civilian award · at most 3 a year<\/text><path d=\"M220 68 L460 68 L520 122 L160 122 Z\" class=\"s4\" stroke=\"var(--rule)\"/><text x=\"340\" y=\"92\" text-anchor=\"middle\" font-size=\"15\" class=\"b\">Padma Vibhushan<\/text><text x=\"340\" y=\"110\" text-anchor=\"middle\" font-size=\"11\" class=\"mut\">exceptional and distinguished service · 5 in 2026<\/text><path d=\"M160 126 L520 126 L580 180 L100 180 Z\" class=\"s3\" stroke=\"var(--rule)\"/><text x=\"340\" y=\"150\" text-anchor=\"middle\" font-size=\"15\" class=\"b\">Padma Bhushan<\/text><text x=\"340\" y=\"168\" text-anchor=\"middle\" font-size=\"11\" class=\"mut\">distinguished service of a high order · 13 in 2026<\/text><path d=\"M100 184 L580 184 L640 238 L40 238 Z\" class=\"s1\" stroke=\"var(--rule)\"/><text x=\"340\" y=\"208\" text-anchor=\"middle\" font-size=\"15\" class=\"b\">Padma Shri<\/text><text x=\"340\" y=\"226\" text-anchor=\"middle\" font-size=\"11\" class=\"mut\">distinguished service · 113 in 2026<\/text><\/svg><\/figure>","cap":"Bharat Ratna, then Padma Vibhushan > Padma Bhushan > Padma Shri. All are announced on the eve of Republic Day and presented by the President."},{"k":"table","title":"Padma Vibhushan recipients (recent years)","head":["Recipient","Year","Field / note"],"rows":[["Dharmendra","2026","Actor — posthumous."],["K. T. Thomas","2026","Jurist, former Supreme Court judge."],["N. Rajam","2026","Violinist."],["P. Narayanan","2026","Literature and education."],["V. S. Achuthanandan","2026","Former Kerala CM — posthumous."],["M. T. Vasudevan Nair","2025","Malayalam writer — posthumous."],["Osamu Suzuki","2025","Japanese industrialist (Suzuki Motor) — posthumous."],["Sharda Sinha","2025","Bhojpuri folk singer — posthumous."],["Kumudini Lakhia","2025","Kathak dancer."],["L. Subramaniam","2025","Violinist."],["Vyjayanthimala","2024","Actor and dancer."],["Chiranjeevi","2024","Telugu actor."],["M. Venkaiah Naidu","2024","Former Vice-President."],["Bindeshwar Pathak","2024","Founder of Sulabh International — posthumous."],["Padma Subrahmanyam","2024","Bharatanatyam dancer."]]},{"k":"photos","title":"Padma Vibhushan, recent years","items":[["Dharmendra","Dharmendra","2026 · Actor — posthumous"],["K._T._Thomas","K. T. Thomas","2026 · Jurist, former Supreme Court judge"],["N._Rajam","N. Rajam","2026 · Violinist"],["P._Narayanan","P. Narayanan","2026 · Literature and education"],["V._S._Achuthanandan","V. S. Achuthanandan","2026 · Former Kerala CM — posthumous"],["M._T._Vasudevan_Nair","M. T. Vasudevan Nair","2025 · Malayalam writer — posthumous"],["Osamu_Suzuki","Osamu Suzuki","2025 · Japanese industrialist (Suzuki Motor) — posthumous"],["Sharda_Sinha","Sharda Sinha","2025 · Bhojpuri folk singer — posthumous"],["Kumudini_Lakhia","Kumudini Lakhia","2025 · Kathak dancer"],["L._Subramaniam","L. Subramaniam","2025 · Violinist"],["Vyjayanthimala","Vyjayanthimala","2024 · Actor and dancer"],["Chiranjeevi","Chiranjeevi","2024 · Telugu actor"]]},{"k":"trick","h":"Order by length — <b>Vibhushan (longest) > Bhushan > Shri (shortest)<\/b>: the longer the name, the higher the honour."},{"k":"trap","h":"Padma awards are <b>not<\/b> titles — the Supreme Court said they cannot be used as prefixes or suffixes to a name (Article 18). They are announced on <b>25 January<\/b>, not 26 January."}],"sum":["Padma Vibhushan, Padma Bhushan and Padma Shri began in 1954 and are announced on the eve of Republic Day.","2026: 131 awards — 5 Padma Vibhushan, 13 Padma Bhushan, 113 Padma Shri.","Padma Vibhushan 2026: Dharmendra (posthumous), K. T. Thomas, N. Rajam, P. Narayanan, V. S. Achuthanandan (posthumous).","Padma Vibhushan 2025 included M. T. Vasudevan Nair, Osamu Suzuki and Sharda Sinha (all posthumous).","Padma Vibhushan 2024 included Vyjayanthimala, Chiranjeevi, M. Venkaiah Naidu, Bindeshwar Pathak and Padma Subrahmanyam."],"part":["Part 1 · India’s national honours","भारत के राष्ट्रीय सम्मान"],"g":"aw"},
{"id":"A3","heat":3,"title":"Literary awards — India and the world","hi":"साहित्यिक पुरस्कार","blocks":[{"k":"hot","h":"Regulars: <b>Jnanpith<\/b> (first winner, first woman, latest winners), <b>Sahitya Akademi<\/b> (24 languages), <b>Saraswati Samman<\/b> and <b>Vyas Samman<\/b> (K. K. Birla Foundation), the <b>Booker<\/b> and <b>Pulitzer<\/b> with their Indian winners."},{"k":"story","h":"<p>India's top literary prize, the <b>Jnanpith<\/b>, is given by the Bharatiya Jnanpith trust. The first went to Malayalam poet <b>G. Sankara Kurup<\/b> in 1965; the first woman was Bengali novelist <b>Ashapoorna Devi<\/b>; <b>Amitav Ghosh<\/b> became the first English writer to win it in 2018. Recent winners: <b>Gulzar<\/b> and <b>Jagadguru Rambhadracharya<\/b> (2023), and Hindi writer <b>Vinod Kumar Shukla<\/b> (2024).<\/p><p>The <b>Sahitya Akademi<\/b> honours one book a year in each of 24 languages. The <b>K. K. Birla Foundation<\/b> gives the Saraswati Samman (any Indian language) and the Vyas Samman (Hindi). Abroad, Indians have won the <b>Booker<\/b> (Rushdie, Roy, Kiran Desai, Adiga), the <b>International Booker<\/b> (Geetanjali Shree, Banu Mushtaq) and the <b>Pulitzer<\/b> (Jhumpa Lahiri).<\/p>","key":"Jnanpith first: G. Sankara Kurup (1965); first woman: Ashapoorna Devi (1976); first English: Amitav Ghosh (2018)."},{"k":"photos","title":"Writers in pictures","items":[["G._Sankara_Kurup","G. Sankara Kurup","First Jnanpith, 1965"],["Ashapoorna_Devi","Ashapoorna Devi","First woman, Jnanpith"],["Sumitranandan_Pant","Sumitranandan Pant","First Hindi Jnanpith"],["Amitav_Ghosh","Amitav Ghosh","First English Jnanpith"],["Gulzar","Gulzar","58th Jnanpith"],["Vinod_Kumar_Shukla","Vinod Kumar Shukla","59th Jnanpith"],["Amrita_Pritam","Amrita Pritam","First woman, Sahitya Akademi"],["Jhumpa_Lahiri","Jhumpa Lahiri","Pulitzer 2000"]]},{"k":"table","title":"The awards","head":["Award","What it is","Note"],"rows":[["Jnanpith Award","India's highest literary award","Instituted 1961 by the Bharatiya Jnanpith; first given in 1965."],["Sahitya Akademi Award","Given by India's National Academy of Letters in 24 languages","The Akademi was set up in 1954."],["Saraswati Samman","K. K. Birla Foundation award for literature in any Indian language","Started 1991; first winner Harivansh Rai Bachchan."],["Vyas Samman","K. K. Birla Foundation award for Hindi literature","Started 1991."],["Moortidevi Award","Bharatiya Jnanpith award for Indian philosophy and culture in literature",""],["Booker Prize","For the best novel written in English (UK)","Started 1969."],["International Booker Prize","For a book translated into English, shared by author and translator",""],["Pulitzer Prize","USA — journalism, literature and music","Started 1917."]]},{"k":"table","title":"Winners to remember","head":["Winner","Award","Note"],"rows":[["G. Sankara Kurup","First Jnanpith (1965)","Malayalam — Odakkuzhal."],["Ashapoorna Devi","First woman to win the Jnanpith (1976)","Bengali."],["Sumitranandan Pant","First Hindi writer to win the Jnanpith (1968)",""],["Amitav Ghosh","First English-language writer to win the Jnanpith (2018)",""],["Damodar Mauzo","57th Jnanpith (2022)","Konkani."],["Gulzar","58th Jnanpith (2023), shared","Urdu — shared with Jagadguru Rambhadracharya (Sanskrit)."],["Vinod Kumar Shukla","59th Jnanpith (2024)","Hindi — the first from Chhattisgarh."],["Amrita Pritam","First woman to win the Sahitya Akademi Award (1956)","Punjabi."],["Navtej Sarna","Sahitya Akademi Award 2025 (English)","For Crimson Spring; announced March 2026."],["Mamta Kalia","Sahitya Akademi Award 2025 (Hindi)","For the memoir Jeete Jee Allahabad."],["Jhumpa Lahiri","Pulitzer Prize for Fiction (2000)","For Interpreter of Maladies."],["Siddhartha Mukherjee","Pulitzer Prize for General Non-Fiction (2011)","For The Emperor of All Maladies."],["Danish Siddiqui","Pulitzer Prize for Feature Photography (2018 and 2022)","The 2022 prize was posthumous."],["Gobind Behari Lal","First person of Indian origin to win a Pulitzer (1937)","Journalism."]]},{"k":"tlfig","title":"Literary firsts and milestones","rows":[[1965,"G. Sankara Kurup","First Jnanpith"],[1976,"Ashapoorna Devi","First woman to win the Jnanpith"],[1968,"Sumitranandan Pant","First Hindi writer to win the Jnanpith"],[2018,"Amitav Ghosh","First English-language writer to win the Jnanpith"],[2022,"Damodar Mauzo","57th Jnanpith"],[2023,"Gulzar","58th Jnanpith, shared"],[2024,"Vinod Kumar Shukla","59th Jnanpith"],[1956,"Amrita Pritam","First woman to win the Sahitya Akademi Award"],[2000,"Jhumpa Lahiri","Pulitzer Prize for Fiction"],[2011,"Siddhartha Mukherjee","Pulitzer Prize for General Non-Fiction"],[2018,"Danish Siddiqui","Pulitzer Prize for Feature Photography"],[1937,"Gobind Behari Lal","First person of Indian origin to win a Pulitzer"]],"cap":"The first Jnanpith went to G. Sankara Kurup (Malayalam, 1965); Ashapoorna Devi was the first woman (1976); Amitav Ghosh the first in English (2018)."},{"k":"trick","h":"<b>Birla gives two<\/b>: Saraswati (all languages) and Vyas (Hindi). <b>Jnanpith 2023 was shared<\/b> — Gulzar (Urdu) and Rambhadracharya (Sanskrit)."},{"k":"trap","h":"The <b>Jnanpith<\/b> is given by a private trust (Bharatiya Jnanpith), not the government. The <b>Sahitya Akademi<\/b> recognises <b>24 languages<\/b> (the 22 scheduled ones plus English and Rajasthani). The 60th Jnanpith (2025) was reported for Tamil poet R. Vairamuthu — check the official announcement."}],"sum":["Jnanpith — India's highest literary award (Bharatiya Jnanpith); first winner G. Sankara Kurup (1965).","First woman Jnanpith winner: Ashapoorna Devi (1976); first English: Amitav Ghosh (2018); 2024: Vinod Kumar Shukla.","Sahitya Akademi Award covers 24 languages; 2025 English — Navtej Sarna, Hindi — Mamta Kalia.","Saraswati Samman and Vyas Samman are given by the K. K. Birla Foundation (from 1991).","Booker (1969) for English novels; International Booker for translations; Pulitzer (1917) — Jhumpa Lahiri won for fiction in 2000."],"part":["Part 1 · India’s national honours","भारत के राष्ट्रीय सम्मान"],"g":"aw"},
{"id":"A4","heat":3,"title":"Film, music and arts awards","hi":"फ़िल्म, संगीत और कला पुरस्कार","blocks":[{"k":"hot","h":"Asked often: <b>Dadasaheb Phalke Award<\/b> (first: Devika Rani; latest: Mohanlal), <b>Indian Oscar winners<\/b> (Bhanu Athaiya, A. R. Rahman, Naatu Naatu, The Elephant Whisperers), and the <b>top prizes of film festivals<\/b>."},{"k":"story","h":"<p>The <b>Dadasaheb Phalke Award<\/b>, named after the father of Indian cinema (who made Raja Harishchandra, 1913), is India's highest film honour. It began in 1969 and its first recipient was <b>Devika Rani<\/b>. Recent winners: Rajinikanth, Asha Parekh, Waheeda Rehman, Mithun Chakraborty and <b>Mohanlal<\/b> (presented in 2025).<\/p><p>India's first Oscar went to costume designer <b>Bhanu Athaiya<\/b> for Gandhi (1983). <b>A. R. Rahman<\/b> won two for Slumdog Millionaire (2009), and in 2023 India won twice — <b>'Naatu Naatu'<\/b> from RRR and the documentary short <b>The Elephant Whisperers<\/b>. In 2024 <b>Payal Kapadia<\/b> won the Grand Prix at Cannes.<\/p>","key":"Phalke first: Devika Rani (1969); latest: Mohanlal (55th). First Indian Oscar: Bhanu Athaiya (1983)."},{"k":"table","title":"The awards","head":["Award","What it is","Note"],"rows":[["Dadasaheb Phalke Award","India's highest award in cinema","Instituted 1969, the centenary year of Dadasaheb Phalke."],["National Film Awards","Government of India's annual film awards","Started 1954; the top prize is the Golden Lotus (Swarna Kamal)."],["Academy Awards (Oscars)","USA's top film awards","First held in 1929."],["Grammy Awards","USA's top music awards",""],["Golden Globe Awards","Film and TV awards voted by international press",""],["Palme d'Or","Top prize of the Cannes Film Festival (France)",""],["Golden Bear","Top prize of the Berlin Film Festival",""],["Golden Lion","Top prize of the Venice Film Festival",""],["Sangeet Natak Akademi Award","India's national academy award for music, dance and drama","The Akademi was set up in 1952 — the first of the three national academies."],["Kalidas Samman","Arts award of the Madhya Pradesh government",""]]},{"k":"table","title":"Dadasaheb Phalke Award winners","head":["Winner","Year","Note"],"rows":[["Devika Rani","1969 — the first Dadasaheb Phalke Award","'First Lady of Indian cinema'."],["Prithviraj Kapoor","1971 (posthumous)",""],["Satyajit Ray","1984",""],["Raj Kapoor","1987",""],["Lata Mangeshkar","1989",""],["Dilip Kumar","1994",""],["Amitabh Bachchan","2018 award",""],["Rajinikanth","2019 award (51st)",""],["Asha Parekh","2020 award (52nd)",""],["Waheeda Rehman","2021 award (53rd)",""],["Mithun Chakraborty","2022 award (54th)","Presented in October 2024."],["Mohanlal","2023 award (55th)","Presented at the 71st National Film Awards, September 2025."]]},{"k":"tlfig","title":"Dadasaheb Phalke Award, from Devika Rani to Mohanlal","rows":[[1969,"Devika Rani",""],[1971,"Prithviraj Kapoor","posthumous"],[1984,"Satyajit Ray",""],[1987,"Raj Kapoor",""],[1989,"Lata Mangeshkar",""],[1994,"Dilip Kumar",""],[2018,"Amitabh Bachchan",""],[2019,"Rajinikanth","51st"],[2020,"Asha Parekh","52nd"],[2021,"Waheeda Rehman","53rd"],[2022,"Mithun Chakraborty","54th"],[2023,"Mohanlal","55th"]],"cap":"Devika Rani was the first (1969, the centenary of Phalke's birth). The years are the award years, often presented later."},{"k":"photos","title":"Phalke winners in pictures","items":[["Devika_Rani","Devika Rani","1969"],["Prithviraj_Kapoor","Prithviraj Kapoor","1971"],["Satyajit_Ray","Satyajit Ray","1984"],["Raj_Kapoor","Raj Kapoor","1987"],["Lata_Mangeshkar","Lata Mangeshkar","1989"],["Dilip_Kumar","Dilip Kumar","1994"],["Amitabh_Bachchan","Amitabh Bachchan","2018"],["Rajinikanth","Rajinikanth","2019"],["Asha_Parekh","Asha Parekh","2020"],["Waheeda_Rehman","Waheeda Rehman","2021"],["Mithun_Chakraborty","Mithun Chakraborty","2022"],["Mohanlal","Mohanlal","2023"]]},{"k":"table","title":"Indians at the Oscars, Grammys and Cannes","head":["Winner","Award","Note"],"rows":[["Bhanu Athaiya","Oscar for Costume Design, 1983 (Gandhi)","The first Indian to win an Oscar."],["Satyajit Ray","Honorary Oscar, 1992","For lifetime achievement."],["A. R. Rahman","Two Oscars, 2009 (Slumdog Millionaire)","Original score and original song (Jai Ho)."],["Resul Pookutty","Oscar for Sound Mixing, 2009 (Slumdog Millionaire)",""],["Gulzar","Oscar for Original Song, 2009 (Jai Ho)","Shared with A. R. Rahman."],["M. M. Keeravani and Chandrabose","Oscar for Original Song, 2023 ('Naatu Naatu', RRR)","The first Indian film song to win."],["Kartiki Gonsalves and Guneet Monga","Oscar for Documentary Short, 2023 (The Elephant Whisperers)",""],["Ravi Shankar","The first Indian Grammy winner (1968)","With Yehudi Menuhin, 'West Meets East'."],["Ricky Kej","Three Grammy Awards","Environmentalist composer."],["Zakir Hussain","Three Grammys in one night, 2024","Tabla maestro."],["Payal Kapadia","Grand Prix at Cannes, 2024 (All We Imagine as Light)","The first Indian film to win the Grand Prix."],["Anasuya Sengupta","Best Actress, Un Certain Regard, Cannes 2024","The first Indian to win an acting prize at Cannes."]]},{"k":"trick","h":"Festival animals — <b>Cannes palm, Berlin bear, Venice lion<\/b>: Palme d'Or, Golden Bear, Golden Lion."},{"k":"trap","h":"<b>Satyajit Ray<\/b> got an <b>honorary<\/b> Oscar — the first Indian to <b>win<\/b> one was <b>Bhanu Athaiya<\/b>. <b>Naatu Naatu<\/b>'s Oscar went to <b>M. M. Keeravani<\/b> (music) and <b>Chandrabose<\/b> (lyrics), not to the director Rajamouli."}],"sum":["The Dadasaheb Phalke Award (1969) is India's highest film award; first winner Devika Rani.","Recent Phalke winners: Rajinikanth, Asha Parekh, Waheeda Rehman, Mithun Chakraborty, Mohanlal (55th).","First Indian Oscar: Bhanu Athaiya (1983, Gandhi); A. R. Rahman won two in 2009.","2023 Oscars: 'Naatu Naatu' (RRR) and The Elephant Whisperers.","Cannes 2024: Payal Kapadia's All We Imagine as Light won the Grand Prix."],"part":["Part 2 · Literature, film, sport","साहित्य, फ़िल्म, खेल"],"g":"aw"},
{"id":"A5","heat":3,"title":"Sports awards","hi":"खेल पुरस्कार","blocks":[{"k":"hot","h":"Annual favourite: the <b>Khel Ratna<\/b> winners — and the 2025 surprise that <b>no one<\/b> got it. Also the <b>first Khel Ratna<\/b> (Anand), what the <b>Dronacharya<\/b> and <b>Arjuna<\/b> awards are for, and the <b>Ballon d'Or<\/b>."},{"k":"story","h":"<p>India's <b>National Sports Awards<\/b> are given by the Ministry of Youth Affairs and Sports. The highest is the <b>Major Dhyan Chand Khel Ratna<\/b> — started in 1991–92 as the Rajiv Gandhi Khel Ratna and renamed after the hockey legend in 2021. Chess star <b>Viswanathan Anand<\/b> was the first winner.<\/p><p>The <b>Arjuna Award<\/b> (1961) is for athletes, the <b>Dronacharya<\/b> (1985) for coaches — named, fittingly, after the great archer and his teacher. For 2024 four got the Khel Ratna — <b>Manu Bhaker, D. Gukesh, Harmanpreet Singh<\/b> and para-athlete <b>Praveen Kumar<\/b>. For 2025, announced in August 2026, the Khel Ratna was <b>not given to anyone<\/b> — the first such year since 2014.<\/p>","key":"Khel Ratna (1991–92, renamed 2021) — first Anand; Arjuna — athletes; Dronacharya — coaches."},{"k":"table","title":"The awards","head":["Award","What it is","Note"],"rows":[["Major Dhyan Chand Khel Ratna","India's highest sporting honour","Started 1991–92 as the Rajiv Gandhi Khel Ratna; renamed in 2021. First winner: Viswanathan Anand."],["Arjuna Award","For outstanding performance by sportspersons","Started 1961; a bronze statuette of Arjuna."],["Dronacharya Award","For coaches","Started 1985."],["Arjuna Award (Lifetime)","For lifetime contribution to sport","Earlier the Major Dhyan Chand Award (from 2002)."],["Maulana Abul Kalam Azad Trophy","For the best university in sports",""],["Rashtriya Khel Protsahan Puraskar","For organisations that promote sport",""],["Tenzing Norgay National Adventure Award","For adventure on land, water and air",""],["Laureus World Sports Award","International — called the 'Oscars of sport'","Sachin won the Laureus Sporting Moment award in 2020."],["Ballon d'Or","Best footballer of the year (France Football)","Started 1956."]]},{"k":"cards","title":"Who gets which sports award","rows":[["Major Dhyan Chand Khel Ratna","India's highest sporting honour","Started 1991–92 as the Rajiv Gandhi Khel Ratna","🏆"],["Arjuna Award","For outstanding performance by sportspersons","Started 1961","🏹"],["Dronacharya Award","For coaches","Started 1985","🧑‍🏫"],["Arjuna Award (Lifetime)","For lifetime contribution to sport","Earlier the Major Dhyan Chand Award (from 2002)","🏹"],["Maulana Abul Kalam Azad Trophy","For the best university in sports","","🎓"],["Rashtriya Khel Protsahan Puraskar","For organisations that promote sport","","🏅"],["Tenzing Norgay National Adventure Award","For adventure on land, water and air","","🏔️"]]},{"k":"table","title":"Recent winners","head":["Winner","Award","Note"],"rows":[["Viswanathan Anand","First Khel Ratna (1991–92)","Chess."],["Neeraj Chopra","Khel Ratna 2021","Tokyo Olympic javelin gold."],["Sharath Kamal","Khel Ratna 2022","Table tennis."],["Satwiksairaj Rankireddy and Chirag Shetty","Khel Ratna 2023","Badminton doubles."],["Manu Bhaker","Khel Ratna 2024","Shooting — two bronzes at Paris 2024."],["D. Gukesh","Khel Ratna 2024","Chess — world champion."],["Harmanpreet Singh","Khel Ratna 2024","Hockey captain."],["Praveen Kumar","Khel Ratna 2024","Para high jump — Paralympic gold."],["Divya Deshmukh","Arjuna Award 2025","Chess."],["Tejaswin Shankar","Arjuna Award 2025","High jump / decathlon."],["Ousmane Dembélé","Ballon d'Or 2025","France — Paris Saint-Germain."]]},{"k":"photos","title":"Winners in pictures","items":[["Viswanathan_Anand","Viswanathan Anand","First Khel Ratna"],["Neeraj_Chopra","Neeraj Chopra","Khel Ratna 2021"],["Manu_Bhaker","Manu Bhaker","Khel Ratna 2024"],["Gukesh_Dommaraju","D. Gukesh","Khel Ratna 2024"],["Harmanpreet_Singh","Harmanpreet Singh","Khel Ratna 2024"],["Sharath_Kamal","Sharath Kamal","Khel Ratna 2022"]]},{"k":"trick","h":"Mahabharata logic — <b>Arjuna the pupil, Dronacharya the teacher<\/b>: Arjuna Award for players, Dronacharya for coaches."},{"k":"trap","h":"The Khel Ratna was renamed after <b>Dhyan Chand<\/b> in 2021 — it was earlier named after Rajiv Gandhi. The <b>Arjuna<\/b> statuette is of Arjuna; the award is <b>not<\/b> for coaches. For <b>2025<\/b> there was <b>no<\/b> Khel Ratna."}],"sum":["Major Dhyan Chand Khel Ratna — India's highest sports award; started 1991–92, renamed 2021; first winner Viswanathan Anand.","Arjuna Award (1961) for sportspersons; Dronacharya Award (1985) for coaches.","Khel Ratna 2024: Manu Bhaker, D. Gukesh, Harmanpreet Singh, Praveen Kumar.","No Khel Ratna was given for 2025; Arjuna 2025 went to 17 athletes including Divya Deshmukh.","Ballon d'Or (1956) — 2025 winner Ousmane Dembélé; Laureus — the 'Oscars of sport'."],"part":["Part 2 · Literature, film, sport","साहित्य, फ़िल्म, खेल"],"g":"aw"},
{"id":"A6","heat":3,"title":"The Nobel Prize and Indian laureates","hi":"नोबेल पुरस्कार और भारतीय विजेता","blocks":[{"k":"hot","h":"Always asked: <b>Indian Nobel laureates<\/b> with field and year (Tagore 1913, Raman 1930, Khorana 1968, Mother Teresa 1979, Chandrasekhar 1983, Sen 1998, Satyarthi 2014, Banerjee 2019) and basic Nobel facts (1901, Alfred Nobel, Oslo for Peace)."},{"k":"story","h":"<p>Alfred Nobel, the inventor of dynamite, left his fortune to reward those who did the most good for humanity. The first prizes were given in <b>1901<\/b> in five fields — Physics, Chemistry, Medicine, Literature and Peace; <b>Economics<\/b> was added in <b>1969<\/b>. All are handed out on <b>10 December<\/b>, Nobel's death anniversary — Peace in <b>Oslo<\/b>, the rest in <b>Stockholm<\/b>.<\/p><p>India's story begins with <b>Rabindranath Tagore<\/b>, the first Asian laureate, in 1913, and <b>C. V. Raman<\/b>, the first Asian scientist to win, in 1930. Since then: Khorana, Mother Teresa, Chandrasekhar, Amartya Sen, Kailash Satyarthi and Abhijit Banerjee — plus Indian-origin and India-born laureates like Naipaul, Ramakrishnan, Ronald Ross and Kipling.<\/p>","key":"Nobel started 1901; Economics from 1969; Peace given in Oslo; Tagore (1913) the first Asian; Raman (1930) the first Asian scientist."},{"k":"photos","title":"Laureates in pictures","items":[["Rabindranath_Tagore","Rabindranath Tagore","Literature, 1913"],["C._V._Raman","C. V. Raman","Physics, 1930"],["Har_Gobind_Khorana","Har Gobind Khorana","Medicine, 1968"],["Mother_Teresa","Mother Teresa","Peace, 1979"],["Subrahmanyan_Chandrasekhar","Subrahmanyan Chandrasekhar","Physics, 1983"],["Amartya_Sen","Amartya Sen","Economics, 1998"],["V._S._Naipaul","V. S. Naipaul","Literature, 2001"],["Venkatraman_Ramakrishnan","Venkatraman Ramakrishnan","Chemistry, 2009"],["Kailash_Satyarthi","Kailash Satyarthi","Peace, 2014"],["Abhijit_Banerjee","Abhijit Banerjee","Economics, 2019"],["Ronald_Ross","Ronald Ross","Medicine, 1902"],["Rudyard_Kipling","Rudyard Kipling","Literature, 1907"],["Dalai_Lama","Dalai Lama","Peace, 1989"]]},{"k":"facts","title":"Nobel facts","rows":[["Founded by","The will of Alfred Nobel (inventor of dynamite)"],["First awarded","1901"],["Economics prize","Added in 1969 (Sveriges Riksbank Prize)"],["Ceremony","10 December — Peace in Oslo (Norway), the others in Stockholm (Sweden)"],["Youngest laureate","Malala Yousafzai — Peace, 2014, at 17"],["Won in two sciences","Marie Curie — Physics 1903, Chemistry 1911"],["Two unshared Nobels","Linus Pauling — Chemistry 1954, Peace 1962"],["Most Peace prizes","The International Committee of the Red Cross (three)"]]},{"k":"table","title":"Indians and India-linked laureates","head":["Laureate","Field and year","Note"],"rows":[["Rabindranath Tagore","Literature, 1913","The first Asian Nobel laureate — for Gitanjali."],["C. V. Raman","Physics, 1930","For the Raman effect — the first Asian Nobel in science."],["Har Gobind Khorana","Medicine, 1968","For decoding the genetic code."],["Mother Teresa","Peace, 1979",""],["Subrahmanyan Chandrasekhar","Physics, 1983","The Chandrasekhar limit for stars."],["Amartya Sen","Economics, 1998","Welfare economics."],["V. S. Naipaul","Literature, 2001","Trinidad-born, of Indian origin."],["Venkatraman Ramakrishnan","Chemistry, 2009","Structure of the ribosome."],["Kailash Satyarthi","Peace, 2014","Shared with Malala Yousafzai — against child labour."],["Abhijit Banerjee","Economics, 2019","Shared with Esther Duflo and Michael Kremer — fighting poverty."],["Ronald Ross","Medicine, 1902","Born in Almora; showed that mosquitoes carry malaria."],["Rudyard Kipling","Literature, 1907","Born in Bombay; youngest Literature laureate."],["Dalai Lama","Peace, 1989","Lives in India (Dharamshala)."]]},{"k":"tlfig","title":"Indian and India-linked Nobel laureates","rows":[[1913,"Rabindranath Tagore","Literature"],[1930,"C. V. Raman","Physics"],[1968,"Har Gobind Khorana","Medicine"],[1979,"Mother Teresa","Peace"],[1983,"Subrahmanyan Chandrasekhar","Physics"],[1998,"Amartya Sen","Economics"],[2001,"V. S. Naipaul","Literature"],[2009,"Venkatraman Ramakrishnan","Chemistry"],[2014,"Kailash Satyarthi","Peace"],[2019,"Abhijit Banerjee","Economics"],[1902,"Ronald Ross","Medicine"],[1907,"Rudyard Kipling","Literature"],[1989,"Dalai Lama","Peace"]],"cap":"Ronald Ross (1902) and Kipling (1907) were born in India; Tagore (1913) was the first Indian and the first Asian laureate; Raman (1930) the first Asian in science."},{"k":"bars","title":"By field","left":110,"hi":2,"rows":[["Literature",3,"Tagore, Naipaul, Kipling"],["Physics",2,"Raman, Chandrasekhar"],["Medicine",2,"Khorana, Ross"],["Peace",3,"Teresa, Satyarthi, Lama"],["Economics",2,"Sen, Banerjee"],["Chemistry",1,"Ramakrishnan"]]},{"k":"trick","h":"Indian Nobels in order — <b>“Tagore Raised Kids, Mother Cared, Sen Sat Bravely”<\/b>: Tagore 1913, Raman 1930, Khorana 1968, Mother Teresa 1979, Chandrasekhar 1983, Sen 1998, Satyarthi 2014, Banerjee 2019."},{"k":"trap","h":"<b>Khorana<\/b> won for <b>Medicine<\/b>, not Chemistry. <b>Ramakrishnan<\/b> (2009) won for <b>Chemistry<\/b>. The <b>Peace<\/b> prize is given in <b>Oslo<\/b>, not Stockholm. <b>Kailash Satyarthi<\/b> shared his prize with <b>Malala<\/b>."}],"sum":["The Nobel Prize was first given in 1901; Economics was added in 1969; Peace is given in Oslo.","Tagore (Literature 1913) was the first Asian laureate; C. V. Raman (Physics 1930) the first Asian in science.","Khorana — Medicine 1968; Mother Teresa — Peace 1979; Chandrasekhar — Physics 1983; Amartya Sen — Economics 1998.","Kailash Satyarthi — Peace 2014 (with Malala); Abhijit Banerjee — Economics 2019.","Malala is the youngest laureate; Marie Curie won in two sciences; Linus Pauling won two unshared prizes."],"part":["Part 2 · Literature, film, sport","साहित्य, फ़िल्म, खेल"],"g":"aw"},
{"id":"A7","heat":2,"title":"World awards and what they are called","hi":"विश्व पुरस्कार और उनके उपनाम","blocks":[{"k":"hot","h":"Papers love the nicknames: <b>Asia's Nobel<\/b> (Magsaysay), <b>Green Nobel<\/b> (Goldman), <b>Nobel of architecture<\/b> (Pritzker), <b>Nobel of computing<\/b> (Turing), <b>Alternative Nobel<\/b> (Right Livelihood), <b>Nobel of water<\/b> (Stockholm Water Prize) — plus Indian winners of each."},{"k":"story","h":"<p>Many fields have a prize so famous it is called 'the Nobel of' that field. The <b>Pritzker<\/b> for architecture (B. V. Doshi, 2018), the <b>Turing Award<\/b> for computing (Raj Reddy, 1994), the <b>Abel Prize<\/b> and <b>Fields Medal<\/b> for mathematics, the <b>World Food Prize<\/b> for agriculture (M. S. Swaminathan, the very first, 1987), and the <b>Stockholm Water Prize<\/b> (Rajendra Singh, 2015).<\/p><p>Asia's own is the <b>Ramon Magsaysay Award<\/b> from the Philippines: <b>Vinoba Bhave<\/b> was the first Indian (1958), and in 2025 <b>Educate Girls<\/b> became the first Indian organisation to win. India's government gives the <b>Gandhi Peace Prize<\/b>, started in 1995.<\/p>","key":"Magsaysay = Asia's Nobel; Pritzker = architecture; Turing = computing; Goldman = Green Nobel; Right Livelihood = Alternative Nobel."},{"k":"table","title":"Awards and their nicknames","head":["Award","Called / given for","Note"],"rows":[["Ramon Magsaysay Award","Asia's Nobel Prize","Philippines, since 1957."],["Pritzker Prize","The Nobel of architecture","B. V. Doshi (2018) was the first Indian winner."],["Abel Prize","A Nobel-level prize for mathematics (Norway)","S. R. Srinivasa Varadhan won in 2007."],["Fields Medal","Mathematics, for those under 40, every four years","Manjul Bhargava (2014) and Akshay Venkatesh (2018) are of Indian origin."],["Turing Award","The Nobel of computing","Raj Reddy (1994) was the first Asian winner."],["Templeton Prize","For spiritual and religious contributions","The Dalai Lama won in 2012."],["Kalinga Prize","UNESCO prize for popularising science","Instituted in 1952 with a gift from Biju Patnaik."],["Goldman Environmental Prize","The Green Nobel",""],["Stockholm Water Prize","The Nobel Prize of water","Rajendra Singh, 'Waterman of India', won in 2015."],["Right Livelihood Award","The Alternative Nobel Prize","Sweden."],["World Food Prize","The Nobel of food and agriculture","M. S. Swaminathan was the first winner (1987)."],["Champions of the Earth","The UN Environment Programme's top environmental honour","Narendra Modi received it in 2018 (with Emmanuel Macron)."],["Gandhi Peace Prize","Government of India's international peace award","Started 1995; first winner Julius Nyerere; latest (2021) Gita Press, Gorakhpur."],["Indira Gandhi Peace Prize","Indira Gandhi Memorial Trust's award for peace, disarmament and development","Started 1986."],["Lasker Award","Medical research — 'America's Nobel'",""],["Sakharov Prize","European Parliament's prize for freedom of thought",""],["Nansen Refugee Award","UNHCR's award for helping refugees",""],["Holberg Prize","Humanities and social sciences (Norway)",""]]},{"k":"cards","title":"Know the award by its nickname","rows":[["Asia's Nobel Prize","Ramon Magsaysay Award","Philippines, since 1957.","🏅"],["The Nobel of architecture","Pritzker Prize","B. V. Doshi (2018) was the first Indian winner.","🏅"],["A Nobel-level prize for mathematics (Norway)","Abel Prize","S. R. Srinivasa Varadhan won in 2007.","🏅"],["The Nobel of computing","Turing Award","Raj Reddy (1994) was the first Asian winner.","🏅"],["The Green Nobel","Goldman Environmental Prize","","🏅"],["The Nobel Prize of water","Stockholm Water Prize","Rajendra Singh, 'Waterman of India', won in 2015.","🏅"],["The Alternative Nobel Prize","Right Livelihood Award","Sweden.","🏅"],["The Nobel of food and agriculture","World Food Prize","M. S. Swaminathan was the first winner (1987).","🏅"],["Medical research — 'America's Nobel'","Lasker Award","","🏅"]]},{"k":"table","title":"Indians and the Magsaysay Award","head":["Winner","Year","Note"],"rows":[["Vinoba Bhave","Ramon Magsaysay Award, 1958","The first Indian to receive it."],["Kiran Bedi","Ramon Magsaysay Award, 1994",""],["T. N. Seshan","Ramon Magsaysay Award, 1996","Election reforms."],["Arvind Kejriwal","Ramon Magsaysay Award, 2006",""],["Ravish Kumar","Ramon Magsaysay Award, 2019","Journalism."],["Educate Girls","Ramon Magsaysay Award, 2025","The first Indian organisation to receive it (founded by Safeena Husain)."]]},{"k":"tlfig","title":"Indians and the Magsaysay Award","rows":[[1958,"Vinoba Bhave","The first Indian to receive it"],[1994,"Kiran Bedi",""],[1996,"T. N. Seshan","Election reforms"],[2006,"Arvind Kejriwal",""],[2019,"Ravish Kumar","Journalism"],[2025,"Educate Girls","The first Indian organisation to r"]],"cap":"Vinoba Bhave (1958) was the first Indian winner."},{"k":"trick","h":"<b>Pritzker = Plans<\/b> (architects draw plans). <b>Turing = Tech<\/b>. <b>Goldman = Green<\/b> (G-G). <b>Kalinga = Knowledge for all<\/b> (popular science)."},{"k":"trap","h":"The <b>Fields Medal<\/b> is only for mathematicians <b>under 40<\/b>; the <b>Abel Prize<\/b> has no age limit. The <b>Gandhi Peace Prize<\/b> is given by the Indian government; the <b>Indira Gandhi Peace Prize<\/b> by a trust. <b>Magsaysay<\/b> is Philippine, not Indian."}],"sum":["Ramon Magsaysay Award (Philippines, 1957) is called Asia's Nobel; Vinoba Bhave was the first Indian winner.","Pritzker — architecture (B. V. Doshi 2018); Turing — computing (Raj Reddy 1994); Abel and Fields — mathematics.","World Food Prize — first winner M. S. Swaminathan (1987); Stockholm Water Prize — Rajendra Singh (2015).","Goldman — the Green Nobel; Right Livelihood — the Alternative Nobel; Kalinga — UNESCO science popularisation (1952).","Gandhi Peace Prize (1995) — first Julius Nyerere, latest Gita Press (2021); Educate Girls won the Magsaysay in 2025."],"part":["Part 3 · World awards and the latest winners","विश्व पुरस्कार और नवीनतम विजेता"],"g":"aw"},
{"id":"A8","heat":3,"title":"Latest winners, 2025–2026","hi":"नवीनतम विजेता 2025–26","blocks":[{"k":"hot","h":"Current-affairs sections ask about the <b>most recent<\/b> winners: Nobel 2025 and 2026, the International Booker, the Booker, the Oscars, the Magsaysay Award and India's own honours. This lesson is dated <b>October 2026<\/b>."},{"k":"story","h":"<p>The <b>2026 Nobels<\/b> (announced 5–12 October 2026) went to: Francis Halzen (Physics), Henri Kagan and Kenso Soai (Chemistry), Deisseroth, Hegemann and Nagel (Medicine, for optogenetics), Canadian poet <b>Anne Carson<\/b> (Literature), South African jurist <b>Navi Pillay<\/b> (Peace), and Robert Hall and Michael Woodford (Economics).<\/p><p>In books, <b>Taiwan Travelogue<\/b> won the International Booker 2026 and <b>Flesh<\/b> by David Szalay the Booker 2025. At the 2026 Oscars <b>One Battle After Another<\/b> was Best Picture. No Indian won the Magsaysay in 2026, and no Bharat Ratna has been announced since 2024.<\/p>","key":"Nobel Peace 2026 — Navi Pillay; Literature 2026 — Anne Carson; 2025 Peace — María Corina Machado."},{"k":"table","title":"Nobel Prizes 2025 and 2026","head":["Prize","Winners","For"],"rows":[["Physics 2026","Francis Halzen","For discovering high-energy neutrinos from space."],["Chemistry 2026","Henri B. Kagan and Kenso Soai","How homochirality can arise by itself."],["Medicine 2026","Karl Deisseroth, Peter Hegemann and Georg Nagel","Optogenetics."],["Literature 2026","Anne Carson","Canadian poet."],["Peace 2026","Navi Pillay","South African jurist, former UN human rights chief."],["Economics 2026","Robert E. Hall and Michael Woodford","New macroeconomic models for stabilisation policy."],["Physics 2025","John Clarke, Michel Devoret and John Martinis","Quantum effects in electric circuits."],["Chemistry 2025","Susumu Kitagawa, Richard Robson and Omar Yaghi","Metal–organic frameworks."],["Medicine 2025","Mary Brunkow, Fred Ramsdell and Shimon Sakaguchi","Peripheral immune tolerance."],["Literature 2025","László Krasznahorkai","Hungarian novelist."],["Peace 2025","María Corina Machado","Venezuelan democracy campaigner."],["Economics 2025","Joel Mokyr, Philippe Aghion and Peter Howitt","Innovation-driven growth."]]},{"k":"cards","title":"The Nobel Prizes of 2026","rows":[["Francis Halzen","Physics 2026","For discovering high-energy neutrinos from space.","⚛️"],["Henri B. Kagan and Kenso Soai","Chemistry 2026","How homochirality can arise by itself.","🧪"],["Karl Deisseroth, Peter Hegemann and Georg Nagel","Medicine 2026","Optogenetics.","🩺"],["Anne Carson","Literature 2026","Canadian poet.","📖"],["Navi Pillay","Peace 2026","South African jurist, former UN human rights chief.","🕊️"],["Robert E. Hall and Michael Woodford","Economics 2026","New macroeconomic models for stabilisation policy.","📈"]],"cap":"Announced in October; presented on 10 December — Peace in Oslo, the rest in Stockholm."},{"k":"table","title":"Other recent winners","head":["Award","Winner","Note"],"rows":[["International Booker Prize 2026","Taiwan Travelogue — Yáng Shuāng-zǐ (tr. Lin King)","The first winner translated from Mandarin."],["International Booker Prize 2025","Heart Lamp — Banu Mushtaq (tr. Deepa Bhasthi)","The first Kannada winner."],["Booker Prize 2025","Flesh — David Szalay",""],["Oscar for Best Picture 2026","One Battle After Another","Directed by Paul Thomas Anderson, who also won Best Director."],["Oscar for Best Actor 2026","Michael B. Jordan","For Sinners."],["Oscar for Best Actress 2026","Jessie Buckley","For Hamnet."],["Ramon Magsaysay Award 2026","Tommy Koh, Runa Khan and Bo Kyi","From Singapore, Bangladesh and Myanmar — no Indian winner."],["Padma Vibhushan 2026 (art)","Dharmendra and N. Rajam",""],["Jnanpith (59th, 2024)","Vinod Kumar Shukla","Hindi."],["Bharat Ratna (latest, 2024)","Karpoori Thakur, L. K. Advani, P. V. Narasimha Rao, Charan Singh and M. S. Swaminathan","None announced in 2025 or 2026 (to date)."]]},{"k":"trick","h":"Read the year in the question carefully — <b>Peace 2025 Machado, Peace 2026 Pillay<\/b>; <b>Literature 2025 Krasznahorkai, 2026 Carson<\/b>."},{"k":"trap","h":"This lesson goes out of date every year. Before your exam, check the latest Nobel, Booker, Oscar, Padma and sports award winners in the news."}],"sum":["Nobel 2026: Physics Halzen; Chemistry Kagan and Soai; Medicine Deisseroth, Hegemann, Nagel; Literature Anne Carson; Peace Navi Pillay; Economics Hall and Woodford.","Nobel 2025: Peace María Corina Machado; Literature László Krasznahorkai; Chemistry Kitagawa, Robson, Yaghi (MOFs).","International Booker 2026: Taiwan Travelogue; 2025: Heart Lamp (Banu Mushtaq). Booker 2025: Flesh (David Szalay).","Oscars 2026: Best Picture One Battle After Another; Best Actor Michael B. Jordan; Best Actress Jessie Buckley.","Magsaysay 2026: Tommy Koh, Runa Khan, Bo Kyi; the latest Bharat Ratna awards are those of 2024."],"part":["Part 3 · World awards and the latest winners","विश्व पुरस्कार और नवीनतम विजेता"],"g":"aw"}
];

  const card = d => `<button type="button" class="lab-g" data-lab-play="${d.id}"><span class="t"><span aria-hidden="true">${d.ico}</span><b>${esc(d.title)}</b></span><small>${esc(d.sub)}</small><span class="best">${L.best[d.id] ? "Best: " + L.best[d.id] : "Not played yet"}</span></button>`;
  $("#app").innerHTML = `<section class="view stack">
    <div class="lab-hero"><div><span class="eyebrow">Learn by playing</span><h1>${esc(LAB_CONF.title || "Lab")}</h1><p class="muted" style="margin:0">${LAB_CONF.blurb || "Quick games for the facts that win marks. Every right answer earns XP."}</p></div>
      <div class="lab-rank"><span class="ic" aria-hidden="true">${r[2]}</span><div><b>${r[1]}</b><small>${L.xp || 0} XP${nx ? ` · ${nx[0] - (L.xp || 0)} to ${nx[1]}` : " · top rank!"}</small><div class="lab-xpbar"><i style="width:${pct}%"></i></div></div></div></div>

      ${LAB_CONF.decks.map(card).join("")}

    </div>
    <div class="block"><h3>How to use the Lab</h3><p class="muted" style="margin:0">Read a lesson first, then play its game until you can answer in about three seconds — that is the speed the exam needs. Each game lasts 60 seconds: right answers in a row build a combo for bonus points. Tap <b>See all pairs</b> on a game to revise its list.</p></div>
  </section>`;
  $("#app").querySelectorAll("[data-lab-play]").forEach(b => b.onclick = () => labIntro(b.dataset.labPlay));

}
const labBack = () => `<div class="lhead"><button class="back" type="button" data-lab-home>‹ Lab</button></div>`;
function labBindHome(){ $("#app").querySelectorAll("[data-lab-home]").forEach(b => b.onclick = () => { labStop(); LAB.view = "home"; renderLab(); window.scrollTo(0,0); }); }

/* ---------- quiz games (60 seconds) ---------- */
function labDeck(id){
  const d = LAB_CONF.decks.find(x => x.id === id);
  const ask = (pre, t) => pre ? `${pre} ${t}${/[?:]$/.test(pre) ? "" : "?"}` : t;
  let items = d.make ? d.make() : d.pairs.map(p => ({ p: ask(d.q, p[0]), a: p[1], note: p[2] || "", raw: p[0], pool: "a" }));
  if (d.rq && !d.make) {   // also ask the other way round, where an answer belongs to one prompt only
    const n = {}; d.pairs.forEach(p => { n[p[1]] = (n[p[1]] || 0) + 1; });
    items = items.concat(d.pairs.filter(p => n[p[1]] === 1).map(p => ({ p: ask(d.rq, p[1]), a: p[0], note: p[2] || "", raw: p[1], pool: "p" })));
  }
  return { d, items };
}
function labIntro(id){
  const { d } = labDeck(id), L = labS();
  const list = d.list ? d.list() : d.pairs;
  $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}
    <div class="block stack lab-pop" style="text-align:center"><div style="font-size:46px" aria-hidden="true">${d.ico}</div><h1 style="margin:0">${esc(d.title)}</h1><p class="muted" style="margin:0">${esc(d.sub)} · 60 seconds · combos for answers in a row</p>
      <p style="margin:0">${L.best[d.id] ? "Your best: <b>" + L.best[d.id] + "</b>" : "First go — no pressure."}</p>
      <div class="row" style="justify-content:center"><button class="btn pri" type="button" id="labgo">▶ Start</button><button class="btn" type="button" id="labpairs">See all pairs</button>${d.lesson ? `<button class="btn ghost" type="button" id="lablesson">Read the lesson</button>` : ""}</div></div>
    <div id="labpairlist"></div></section>`;
  labBindHome();
  $("#labgo").onclick = () => labRun(id);
  $("#labpairs").onclick = () => { $("#labpairlist").innerHTML = `<div class="block"><h3>${list.length} pairs to know</h3><div class="lab-pairs">${list.map(p => `<div><span>${esc(p[0])}</span><b>${esc(p[1])}</b></div>`).join("")}</div></div>`; };
  const lb = $("#lablesson"); if (lb) lb.onclick = () => openLesson(d.lesson, "learn");
}
let LG = null;
function labRun(id){
  labStop();
  const { d, items } = labDeck(id);
  LG = { d, items: shuffle(items), i: 0, score: 0, right: 0, tried: 0, combo: 0, maxc: 0, left: 60, miss: [], lock: false };
  $("#app").innerHTML = `<section class="view stack lab-play">
    <div class="lab-hud"><button class="back" type="button" id="labquit">✕ Stop</button><span class="lab-combo" id="labcombo"></span><span class="sc" id="labscore">0</span></div>
    <div class="lab-time" id="labtime"><i style="width:100%"></i></div>
    <div class="lab-q" id="labq" aria-live="polite"></div>
    <div class="lab-opts" id="labopts"></div>
    <div class="lab-flash" id="labflash"></div></section>`;
  $("#labquit").onclick = () => { labStop(); labOver(); };
  labNext();
  LAB.timer = setInterval(() => {
    LG.left--; const t = $("#labtime"); if (!t) { labStop(); return; }
    t.firstElementChild.style.width = (LG.left / 60 * 100) + "%"; t.classList.toggle("low", LG.left <= 10);
    if (LG.left <= 0) { labStop(); labOver(); }
  }, 1000);
}
function labOptions(it){
  const d = LG.d;
  if (d.opts) return d.opts.slice();
  if (d.options) return d.options(it);
  // wrong options come from the same side of the deck as the answer (names with names, dates with dates)
  const answers = [...new Set(it.all || LG.items.filter(x => x.pool === it.pool).map(x => x.a))].filter(a => a !== it.a);
  const pool = shuffle(answers).slice(0, 3);
  return shuffle([it.a].concat(pool));
}
function labNext(){
  if (LG.i >= LG.items.length) { LG.items = shuffle(LG.items); LG.i = 0; }
  const it = LG.items[LG.i], opts = labOptions(it);
  LG.cur = it; LG.lock = false;
  const q = $("#labq"); q.innerHTML = `<span class="lab-pop">${esc(it.p)}</span>`;
  const box = $("#labopts"); box.className = "lab-opts" + (opts.length === 3 ? " three" : "");
  box.innerHTML = opts.map(o => `<button type="button" data-o="${esc(o)}">${esc(o)}</button>`).join("");
  box.querySelectorAll("button").forEach(b => b.onclick = () => labPick(b));
}
function labPick(b){
  if (LG.lock) return; LG.lock = true;
  const it = LG.cur, ok = b.dataset.o === it.a;
  LG.tried++;
  if (ok) {
    LG.right++; LG.combo++; LG.maxc = Math.max(LG.maxc, LG.combo);
    const gain = 10 + Math.min(LG.combo - 1, 5) * 2;
    LG.score += gain; b.classList.add("ok");
    $("#labflash").textContent = it.note ? it.note : "+" + gain;
  } else {
    LG.combo = 0; b.classList.add("no");
    $("#labopts").querySelectorAll("button").forEach(x => { if (x.dataset.o === it.a) x.classList.add("ok"); });
    LG.miss.push(it); $("#labflash").textContent = (it.note ? it.note + " · " : "") + "Answer: " + it.a;
  }
  $("#labscore").textContent = LG.score;
  $("#labcombo").textContent = LG.combo >= 2 ? "🔥 ×" + LG.combo : "";
  LG.i++;
  setTimeout(() => { if (LAB.timer && $("#labopts")) labNext(); }, ok ? 450 : 1200);
}
function labOver(){
  const L = labS(), id = LG.d.id, best = !L.best[id] || LG.score > L.best[id];
  if (best && LG.score > 0) L.best[id] = LG.score;
  L.xp = (L.xp || 0) + LG.right; L.plays = (L.plays || 0) + 1; save();
  const acc = LG.tried ? Math.round(LG.right * 100 / LG.tried) : 0, seen = new Set();
  const miss = LG.miss.filter(m => { if (seen.has(m.p)) return false; seen.add(m.p); return true; });
  const { r } = labRank(L.xp);
  $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}
    <div class="block lab-res lab-pop"><span class="eyebrow">${esc(LG.d.title)}</span><div class="big">${LG.score}</div>
      <p>${best && LG.score > 0 ? "🎉 New best!" : "Best: " + (L.best[id] || 0)} · ${LG.right}/${LG.tried} right (${acc}%) · longest combo ${LG.maxc} · +${LG.right} XP</p>
      <p class="muted" style="margin:0">${r[2]} ${r[1]} · ${L.xp} XP</p>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn pri" type="button" id="again">Play again</button><button class="btn" type="button" data-lab-home>More games</button></div></div>
    ${miss.length ? `<div class="block"><h3>Fix these ${miss.length}</h3><div class="lab-miss">${miss.map(m => `<div><span>${esc(m.p)}</span><b>${esc(m.a)}</b></div>`).join("")}</div></div>` : (LG.tried ? `<div class="block"><p style="margin:0">💯 No mistakes — try to beat your score.</p></div>` : "")}
  </section>`;
  labBindHome();
  $("#again").onclick = () => labRun(id);
}

/* ---------- memory match ---------- */
function labMatch(){
  labStop();
  const all = LAB_CONF.decks.find(d => d.id === LAB_CONF.match.deck).pairs, n = {};
  all.forEach(p => { n[p[1]] = (n[p[1]] || 0) + 1; });
  const pairs = shuffle(all.filter(p => n[p[1]] === 1)).slice(0, 6);
  const cards = shuffle(pairs.flatMap((p, i) => [{ k: i, t: p[0] }, { k: i, t: p[1] }]));
  const M = { cards, up: [], done: new Set(), moves: 0, t0: Date.now() };
  const draw = () => {
    $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}
      <div class="lab-hud"><div><span class="eyebrow">Memory Match</span><h2 style="margin:4px 0 0">${esc(LAB_CONF.match.title)}</h2></div><span class="sc">${M.moves} moves</span></div>
      <div class="mm">${M.cards.map((c, i) => `<button type="button" data-i="${i}" class="${M.done.has(c.k) ? "done" : M.up.includes(i) ? "up" : ""}" aria-label="${M.done.has(c.k) || M.up.includes(i) ? esc(c.t) : "Hidden card " + (i + 1)}">${M.done.has(c.k) || M.up.includes(i) ? esc(c.t) : "?"}</button>`).join("")}</div></section>`;
    labBindHome();
    $("#app").querySelectorAll(".mm button").forEach(b => b.onclick = () => flip(+b.dataset.i));
  };
  const flip = i => {
    if (M.up.length === 2 || M.up.includes(i) || M.done.has(M.cards[i].k)) return;
    M.up.push(i); draw();
    if (M.up.length === 2) {
      M.moves++;
      const [a, b] = M.up;
      if (M.cards[a].k === M.cards[b].k) { M.done.add(M.cards[a].k); M.up = []; setTimeout(() => { draw(); if (M.done.size === 6) done(); }, 250); }
      else setTimeout(() => { M.up = []; draw(); }, 900);
    }
  };
  const done = () => {
    const L = labS(), best = !L.match || M.moves < L.match; if (best) L.match = M.moves;
    L.xp = (L.xp || 0) + 12; L.plays = (L.plays || 0) + 1; save();
    $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}<div class="block lab-res lab-pop"><span class="eyebrow">Memory Match</span><div class="big">${M.moves}</div>
      <p>moves · ${Math.round((Date.now() - M.t0) / 1000)} s · ${best ? "🎉 New best!" : "Best: " + L.match + " moves"} · +12 XP</p>
      <div class="lab-pairs" style="text-align:left">${pairs.map(p => `<div><span>${esc(p[0])}</span><b>${esc(p[1])}</b></div>`).join("")}</div>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn pri" type="button" id="again">New cards</button><button class="btn" type="button" data-lab-home>More games</button></div></div></section>`;
    labBindHome(); $("#again").onclick = labMatch;
  };
  draw(); window.scrollTo(0, 0);
}


/* ---------- decks from the lessons' own tables ---------- */
/** Rows of a lesson's n-th table as [prompt, answer, note] (tags stripped), so a deck never repeats the data. */
function labRows(lessonId, n){
  const strip = s => String(s == null ? "" : s).replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&minus;/g, "−").trim();
  const l = LESSONS.find(x => x.id === lessonId), t = l ? l.blocks.filter(b => b.k === "table")[n || 0] : null;
  return t ? t.rows.map(r => [strip(r[0]), strip(r[1]), strip(r[2])]) : [];
}
/** A "grand mix" deck: a few rows from every listed deck, with each deck's own question wording. */
function labMix(decks){
  // wrong options come from the whole deck (all), so a deck drawn only once or twice in the 80 still has enough
  return shuffle(decks.flatMap(d => { const all = [...new Set(d.pairs.map(p => p[1]))];
    return d.pairs.map(p => ({ p: d.q ? `${d.q} ${p[0]}${/[?:]$/.test(d.q) ? "" : "?"}` : p[0], a: p[1], note: p[2] || "", pool: d.id, all })); })).slice(0, 80);
}

<script>

/* ============================================================
   Workbook engine — shared by the History and Computer Knowledge pages (tools/workbook/lib.js puts it in each one).
   APP.mode "era": a subject app with its own lessons and questions (Learn · Practice · Mock · Revise · Plan).
   APP.mode "hub": start here, a plan across a family of apps, and revision across all of them (no questions of its own).
   Optional data: APP.hub (a family hub to link to), HEATMAP (where the marks come from, by exam),
   a question's 8th field (the paper it was reported from), APP.tabs (the tabs, in order) — a tab the engine
   does not know (e.g. Chemistry's "lab") is drawn by the page's own script: render<Tab>() and, when you

const HUB = APP.mode === "hub";

const hash = s => { let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5)+h + s.charCodeAt(i))|0; return "q"+(h>>>0).toString(36); };
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; };
const L = id => LESSONS.find(l => l.id === id);

const QS = QB.map(r => {

/* Another History app's saved progress. Every page is on the same site, so the hub (and a

const hubLink = (before, label, tab, after) => APP.hub ? before + goLink(label, APP.hub.id, null, tab) + (after || "") : "";

/* ============================================================

      <p>SSC splits history into five subjects, so these are five apps &mdash; Ancient, Medieval, Modern, Art &amp; Culture, and World &mdash; with ${LESSONS.length} lessons between them. You do not need to know anything before you begin: every lesson opens with a two-minute story that explains what happened and why, and only then gives you the tables, tricks and traps the exam asks about.</p>

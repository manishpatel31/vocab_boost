<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>

<title>Geometry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: Physics PYQ Workbook — follows the शब्दRegister Paper / Indigo look; one column + bottom tabs on phones, sidebar on PC. */
:root{
  --paper:#f6f3ea; --sheet:#fffdf7; --sunk:#ebe6d8;
  --ink:#1d2a22; --ink2:#56625a; --rule:#dcd5c3;
  --blue:#1f5c3d; --on-blue:#ffffff; --blue-bg:#dcebdf;
  --accent:#b4530f; --accent-bg:#fbe7d3;
  --good:#1b7547; --good-bg:#dff1e6; --bad:#b0271f; --bad-bg:#f8e1de;
  --warn-bg:#fff2d2;
  --f-display:"Fraunces", "Tiro Devanagari Hindi", Georgia, serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap{border-radius:var(--r);padding:12px 14px 12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.trick .lab,.trap .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.rk div{grid-template-columns:minmax(0,48%) minmax(0,1fr)}
.rk dd{min-width:0;overflow-wrap:anywhere}
.hot{border-radius:var(--r);padding:12px 14px;background:var(--warn-bg,var(--accent-bg));border-left:4px solid var(--warn,var(--accent))}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--warn,var(--accent))}
.heatb{display:inline-block;font-size:11px;letter-spacing:-.1em;margin-left:6px;vertical-align:1px}
.heat{display:flex;flex-direction:column;gap:2px}
.hrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(60px,1fr) 44px;gap:10px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:9px 2px;color:inherit;font:inherit;cursor:pointer}
.hrow:last-child{border-bottom:0}
.hrow .ht{display:flex;flex-direction:column;min-width:0}
.hrow .ht .muted{font-size:12px}
.hbar{height:10px;border-radius:5px;background:var(--rule);overflow:hidden}
.hbar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hp{text-align:right;font-weight:700}

.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.pyr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pyr div{text-align:center;font-size:13px}
.pyr b{display:block;font-size:14px}
.pm{fill:var(--blue)} .pf{fill:var(--accent)}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.pal button.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.pal button.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.rk{display:grid;gap:0}
.rk div{display:grid;grid-template-columns:minmax(0,48%) 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:15px}
.rk div:first-child{border-top:0}
.rk dt{font-size:13px;color:var(--ink2);margin:0}
.rk dt.up{color:var(--good)} .rk dt.dn{color:var(--bad)}
.rk dd{margin:0;font-weight:600;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:24px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.gbar{display:grid;grid-template-columns:78px 1fr 52px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.gbar .tr{height:12px;background:var(--sunk);border-radius:3px;position:relative;overflow:hidden}
.gbar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:3px}
.gbar .tr i.neg{background:var(--bad)}
.gbar .v{font-family:var(--f-num);text-align:right}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
@media (prefers-reduced-motion: no-preference){ .opt,.chip,.btn{transition:background-color .15s, border-color .15s} }
.link{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px}
.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.icheck{background:var(--sheet);border:1.5px dashed var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.icheck .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.cat{font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;white-space:nowrap}
.cat.CS{background:var(--blue-bg);color:var(--blue)} .cat.CSS{background:var(--accent-bg);color:var(--accent)} .cat.ST{background:var(--sunk);color:var(--ink)} .cat.OT{background:var(--sunk);color:var(--ink2)}

/* ---- workbook additions ---- */
table.cover td:nth-child(4){min-width:180px}
.plist .dl{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.plist .dl em{font-style:normal;font-weight:700;color:var(--blue);text-align:right}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--rule)}
.ladder li{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--rule)}
.ladder .rk-n{font-size:22px;font-weight:600;color:var(--blue);text-align:right}
.ladder .rk-t{min-width:0}
.ladder .rk-t b{display:block;line-height:1.3}
.ladder .rk-t span{font-size:13px;color:var(--ink2)}
.ladder .rk-d{font-weight:700;font-size:14px;white-space:nowrap}
.ladder li.up .rk-d{color:var(--good)} .ladder li.dn .rk-d{color:var(--bad)}
.ladder small{font-weight:600;color:var(--ink2)}
table.cover td{min-width:90px}
.peek{border:1.5px dashed var(--blue);background:var(--blue-bg);color:var(--blue);border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer;min-height:36px;width:100%}
.pubs{display:grid;gap:12px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.plist li{padding:7px 0;border-top:1px dashed var(--rule);display:grid;gap:1px}
.plist li:first-child{border-top:0}
.plist li span{font-size:13px;color:var(--ink2)}
.seg{scroll-snap-type:x proximity}
@media (max-width: 700px){
  table.cover thead{display:none}
  table.cover tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--rule)}
  table.cover td{border:0;padding:0;min-width:0;font-size:14px}
  table.cover td:first-child{grid-column:1/-1;font-size:15px}
  table.cover td:nth-child(4){grid-column:1/-1;min-width:0}
  table.cover td[data-l]::before{content:attr(data-l);display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
}
/* ---- maths blocks ---- */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:10px}
.fcard{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:var(--r);padding:10px 12px;display:grid;gap:4px;min-width:0}
.fcard .fn{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.fcard .fx{font-family:var(--f-num);font-size:16px;color:var(--ink);overflow-wrap:anywhere;line-height:1.45}
.fcard .fnote{font-size:13px;color:var(--ink2)}
.ex{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.ex .exhead .lab{display:inline;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:700}
.ex .src{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:700;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:0 8px}
.ex .exq{font-weight:600}
.ex details summary{cursor:pointer;font-weight:700;color:var(--blue);list-style:none}
.ex details summary::-webkit-details-marker{display:none}
.ex details summary::before{content:'▸ '}
.ex details[open] summary::before{content:'▾ '}
.ex ol{margin:8px 0 0;padding-left:20px;display:grid;gap:4px}
.ex .exans{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--good-bg);color:var(--good);font-weight:700}
.figwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:12px}
.figwrap figure{margin:0;display:grid;gap:6px;justify-items:center;text-align:center}
.fig svg,.figwrap svg{width:100%;max-width:340px;height:auto;color:var(--ink)}
.fig figcaption,.figwrap figcaption{font-size:13px;color:var(--ink2)}
sup,sub{font-size:.72em;line-height:0}

const LESSONS = [
{ id:"L1", heat:1, title:"Lines, angles & parallel lines", hi:"रेखाएँ, कोण और समांतर रेखाएँ", blocks:[
 {k:"hot", h:"<b>Tier 1:</b> rarely a stand-alone question (0–1 per shift) — usually a one-liner on complement/supplement or corresponding angles. <b>Tier 2:</b> appears inside triangle, polygon and circle figures, where you must spot the alternate or co-interior pair to start the chain."},
 {k:"p", h:"Two angles are <b>complementary</b> if they add to 90°, <b>supplementary</b> if they add to 180°. Angles on a straight line (linear pair) add to 180°; angles round a point add to 360°; vertically opposite angles are equal."},
 {k:"formula", title:"Angle pairs", rows:[["Complement of θ","90° − θ","Only for θ < 90°"],["Supplement of θ","180° − θ","Linear pair"],["Reflex of θ","360° − θ","The 'outside' angle"],["Vertically opposite","equal","Two straight lines crossing"],["Bisectors of a linear pair","meet at 90°","½(180°) = 90°"]]},
 {k:"formula", title:"Parallel lines cut by a transversal", rows:[["Corresponding (F)","∠1 = ∠5","Same position at each crossing"],["Alternate interior (Z)","∠3 = ∠5, ∠4 = ∠6","Opposite sides, inside"],["Co-interior (C / U)","∠4 + ∠5 = 180°","Same side, inside — supplementary"],["Alternate exterior","∠1 = ∠7","Opposite sides, outside"],["Bend rule","x = a + b","Point between two parallel lines, angles opening towards it"],["Bisectors of co-interior angles","meet at 90°","½(180°) = 90°"]]},
 {k:"fig", title:"Transversal on two parallel lines", svg:'<svg viewBox="0 0 300 180" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M20 50 H270 M20 130 H270"/><path d="M90 170 L230 10"/><path d="M209 50 A14 14 0 0 0 204.2 39.5" style="stroke:var(--accent)" stroke-width="2.2"/><path d="M139 130 A14 14 0 0 0 134.2 119.5" style="stroke:var(--accent)" stroke-width="2.2"/><g fill="currentColor" stroke="none"><text x="216" y="44">1</text><text x="184" y="36">2</text><text x="172" y="64">3</text><text x="199" y="72">4</text><text x="146" y="124">5</text><text x="114" y="116">6</text><text x="102" y="144">7</text><text x="129" y="152">8</text><text x="276" y="54">l</text><text x="276" y="134">m</text><text x="236" y="16">t</text></g><text x="20" y="40" fill="currentColor" stroke="none" font-size="11">l ∥ m</text></svg>', cap:"Corresponding: 1=5, 2=6, 3=7, 4=8. Alternate interior: 3=5, 4=6. Co-interior: 4+5 = 3+6 = 180°."},
 {k:"fig", title:"Bend rule (point between parallels)", svg:'<svg viewBox="0 0 300 180" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M30 40 H270 M30 140 H270"/><path d="M60 40 L160 90 L60 140"/><path d="M40 90 H270" stroke-dasharray="4 3" stroke-width="1.1"/><path d="M76 40 A16 16 0 0 1 74.3 47.2" style="stroke:var(--accent)" stroke-width="2"/><path d="M76 140 A16 16 0 0 0 74.3 132.8" style="stroke:var(--blue)" stroke-width="2"/><path d="M145.7 82.8 A16 16 0 0 0 144 90" style="stroke:var(--accent)" stroke-width="2"/><path d="M144 90 A16 16 0 0 0 145.7 97.2" style="stroke:var(--blue)" stroke-width="2"/><g fill="currentColor" stroke="none"><text x="54" y="32">B</text><text x="260" y="32">A</text><text x="54" y="158">D</text><text x="260" y="158">C</text><text x="166" y="86">E</text><text x="86" y="52">a</text><text x="86" y="136">b</text><text x="124" y="86">a</text><text x="124" y="104">b</text></g></svg>', cap:"Draw a dashed line through E parallel to AB. Alternate angles give ∠BED = a + b."},
 {k:"ex", src:"SSC CGL 2025 · 20 Sep S3", q:"Two parallel lines are intersected by a transversal. If a pair of corresponding angles is formed and one of the angles measures 130°, what is the measure of the other angle?", steps:["Corresponding angles on parallel lines are equal.","So the other angle = 130°."], ans:"130°", tip:"F-shape → equal. Only the C/U-shape (co-interior) adds to 180°."},
 {k:"ex", q:"The complement of an angle is one-fourth of its supplement. Find the angle.", steps:["Let the angle be x. Complement = 90 − x, supplement = 180 − x.","90 − x = (180 − x)/4 ⇒ 360 − 4x = 180 − x","3x = 180 ⇒ x = 60°"], ans:"60°", tip:"Supplement − complement is always 90°. Here S − S/4 = 90 ⇒ S = 120 ⇒ angle = 60°."},
 {k:"ex", q:"AB ∥ CD and E is a point between them. ∠ABE = 45° and ∠CDE = 30°, both opening towards E. Find ∠BED.", fig:'<svg viewBox="0 0 260 140" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M20 30 H240 M20 110 H240"/><path d="M50 30 L101 81 L50 110"/><path d="M20 81 H240" stroke-dasharray="4 3" stroke-width="1.1"/><g fill="currentColor" stroke="none"><text x="44" y="22">B</text><text x="228" y="22">A</text><text x="44" y="128">D</text><text x="228" y="128">C</text><text x="106" y="75">E</text><text x="72" y="46">45°</text><text x="84" y="107">30°</text></g></svg>', steps:["Draw EF ∥ AB through E (so EF ∥ CD too).","Upper part of ∠BED = ∠ABE = 45° (alternate).","Lower part = ∠CDE = 30° (alternate).","∠BED = 45° + 30° = 75°."], ans:"75°", tip:"Bend rule: angle at the bend = sum of the angles at the two parallels (when they open towards the bend)."},
 {k:"trick", h:"<b>Letters:</b> F = corresponding (equal), Z = alternate (equal), C/U = co-interior (sum 180°). <b>Supplement − complement = 90°</b> for every acute angle — many 'ratio of supplement to complement' questions die in one line."},
 {k:"trap", h:"Co-interior angles are <b>supplementary, not equal</b>. Equating (2x + 10) and (3x − 5) gives the wrong x; use (2x + 10) + (3x − 5) = 180."},
 {k:"link", h:"The bend rule and alternate angles prove the triangle angle sum (L2) and the exterior-angle rule. Co-interior angles reappear in parallelograms and trapeziums (L7)."},
 {k:"q", q:"Two co-interior angles are (2x + 10)° and (3x − 5)°. Find x.", o:["35","15","17","70"], e:"2x + 10 + 3x − 5 = 180 ⇒ 5x = 175 ⇒ x = 35."},
 {k:"q", q:"The bisectors of two angles forming a linear pair meet at…", o:["90°","180°","45°","60°"], e:"½ × 180° = 90°."}
], sum:["Complement 90 − θ, supplement 180 − θ; supplement − complement = 90°","Corresponding and alternate angles are equal; co-interior angles add to 180°","Bend rule: angle at a point between parallels = sum of the two angles at the lines"]},
{ id:"L2", heat:2, title:"Triangle basics", hi:"त्रिभुज की मूल बातें", blocks:[
 {k:"hot", h:"<b>Tier 1:</b> about one question in every 2–3 shifts — angles in a ratio, exterior angles, or 'how many integer triangles'. <b>Tier 2:</b> the altitude–bisector angle ∠DAE = ½(B − C) and exterior-angle chains are favourites."},
 {k:"formula", title:"Angle rules", rows:[["Angle sum","A + B + C = 180°","Every triangle"],["Exterior angle","∠ACD = A + B","= sum of the two interior OPPOSITE angles"],["Sum of exterior angles","360°","One at each vertex"],["Altitude vs bisector from A","∠DAE = ½|B − C|","AD bisects ∠A, AE ⊥ BC"],["Angles in ratio p : q : r","angle = p × 180/(p+q+r)","Divide 180 in the ratio"]]},
 {k:"formula", title:"Side rules", rows:[["Triangle inequality","|b − c| < a < b + c","Strict: equal means a straight line"],["Sides vs angles","bigger side ↔ bigger opposite angle","Smallest side faces the smallest angle"],["Type by sides (c largest)","c² &lt; a² + b² acute, = right, &gt; obtuse","Pythagoras test"],["Integer triangles, perimeter p","nearest integer to p²/48 (p even), (p+3)²/48 (p odd)","Tier-1 counting shortcut; check by listing"]]},
 {k:"figs", title:"Two key pictures", items:[
  {svg:'<svg viewBox="0 0 300 175" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M30 140 L190 140 L90 30 Z"/><path d="M190 140 H275" stroke-dasharray="4 3"/><path d="M82.3 44 A16 16 0 0 0 100.8 41.8" style="stroke:var(--accent)" stroke-width="2"/><path d="M48 140 A18 18 0 0 0 38.6 124.2" style="stroke:var(--blue)" stroke-width="2"/><path d="M208 140 A18 18 0 0 0 177.9 126.7" style="stroke:var(--accent)" stroke-width="2"/><g fill="currentColor" stroke="none"><text x="86" y="22">A</text><text x="16" y="154">B</text><text x="184" y="158">C</text><text x="270" y="158">D</text><text x="87" y="64">x</text><text x="52" y="134">y</text><text x="204" y="122">x + y</text></g></svg>', cap:"Exterior angle ∠ACD = x + y (the two interior opposite angles)."},
  {svg:'<svg viewBox="0 0 300 175" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M20 150 L280 150 L110 30 Z"/><path d="M110 30 V150" style="stroke:var(--blue)"/><path d="M110 30 L128.9 150" style="stroke:var(--accent)"/><path d="M101 150 v-9 h9" stroke-width="1.2"/><g fill="currentColor" stroke="none"><text x="106" y="22">A</text><text x="8" y="164">B</text><text x="280" y="164">C</text><text x="100" y="166">E</text><text x="126" y="166">D</text></g></svg>', cap:"AE ⊥ BC, AD bisects ∠A. ∠DAE = ½(∠B − ∠C)."}]},
 {k:"ex", src:"SSC CGL 2024 · 12 Sep S1", q:"The measures of the three angles of a triangle are in the ratio 17 : 13 : 15. Find the positive difference between the greatest and the smallest of these angles.", steps:["17 + 13 + 15 = 45 parts = 180° ⇒ 1 part = 4°.","Greatest − smallest = (17 − 13) parts = 4 × 4°."], ans:"16°", tip:"Work only with the difference of parts: (17 − 13) × 180/45."},
 {k:"ex", src:"SSC CGL Tier 2 · 29 Jan 2022", q:"In △ABC, ∠B = 78°, AD bisects ∠A meeting BC at D, and AE ⊥ BC at E. If ∠DAE = 24°, find ∠ACB.", steps:["∠DAE = ½(∠B − ∠C).","24 = ½(78 − C) ⇒ 78 − C = 48.","C = 30°."], ans:"30°", tip:"Double ∠DAE and subtract from the bigger base angle."},
 {k:"ex", src:"SSC CGL 2022 · 05 Dec S3", q:"The perimeter of a triangle with integer sides is 13. How many such triangles are possible?", steps:["Largest side c < 13/2 ⇒ c ≤ 6.","c = 6: (1,6,6), (2,5,6), (3,4,6); c = 5: (3,5,5), (4,4,5).","c = 4 would need a + b = 9 with a, b ≤ 4 — impossible."], ans:"5", tip:"Odd p: (p + 3)²/48 = 256/48 ≈ 5.3 → 5."},
 {k:"ex", src:"SSC CGL Tier 2 · 18 Nov 2020", q:"The exterior angles obtained on producing the base of a triangle both ways are 121° and 104°. What is the largest angle of the triangle?", steps:["Base angles = 180 − 121 = 59° and 180 − 104 = 76°.","Third angle = 180 − 59 − 76 = 45°.","Largest = 76°."], ans:"76°", tip:"Third angle = (sum of the two exterior angles) − 180 = 45°."},
 {k:"trick", h:"<b>Ratio angles:</b> one part = 180 ÷ (sum of ratio). <b>Two exterior angles at the base:</b> apex angle = (e₁ + e₂) − 180°. <b>Integer sides:</b> largest side must be less than half the perimeter."},
 {k:"trap", h:"The exterior angle equals the sum of the two interior <b>opposite</b> angles — not the adjacent one (they are supplementary). And the triangle inequality is strict: 3, 4, 7 is <b>not</b> a triangle."},
 {k:"link", h:"∠DAE and the exterior-angle rule feed straight into incentre / excentre angles (L5) and polygon exterior angles (L8)."},
 {k:"q", q:"The base BC of △ABC is produced both ways. The exterior angles at B and C are 110° and 125°. ∠A = ?", o:["55°","70°","125°","45°"], e:"Interior B = 70°, C = 55° ⇒ A = 55°. Or 110 + 125 − 180."},
 {k:"q", q:"Which set can be the sides of a triangle?", o:["5, 7, 11","3, 4, 7","2, 5, 8","4, 6, 11"], e:"5 + 7 = 12 > 11. Others fail a + b > c."}
], sum:["A + B + C = 180°; exterior angle = sum of interior opposite angles","|b − c| < a < b + c; bigger side faces bigger angle","∠ between altitude and bisector from A = ½(B − C)"]},
{ id:"L3", heat:3, title:"Congruence & similarity", hi:"सर्वांगसमता और समरूपता", blocks:[
 {k:"hot", h:"<b>Tier 1:</b> roughly one question per shift — BPT (DE ∥ BC) lengths, or 'ratio of areas of similar triangles'. <b>Tier 2:</b> 2–3 step chains: BPT → area of trapezium, common-angle similarity (AC² = CD·CB), a line that halves the area."},
 {k:"formula", title:"Tests", rows:[["Congruence (≅)","SSS, SAS, ASA, AAS, RHS","Same shape AND size"],["Not tests","SSA, AAA","AAA proves only similarity"],["Similarity (∼)","AA, SSS (in proportion), SAS (ratio + included angle)","Same shape, any size"],["Common-angle similarity","∠ADC = ∠BAC ⇒ △ADC ∼ △BAC ⇒ AC² = CD × CB","D on BC; angle C is shared"]]},
 {k:"formula", title:"Ratios in similar triangles (k = side ratio)", rows:[["BPT / Thales","DE ∥ BC ⇒ AD/DB = AE/EC","Line parallel to a side cuts the other two in the same ratio"],["Full-side form","AD/AB = AE/AC = DE/BC","Use AB, not DB, when DE is asked"],["Sides, heights, medians, perimeters","all in ratio k","Every length scales by k"],["Areas","k²","Area ratio = (side ratio)²"],["Trapezium cut off by DE ∥ BC","ar(ADE) : ar(BCED) = AD² : (AB² − AD²)","Subtract the small square"],["Mid-point theorem","DE ∥ BC, DE = ½BC","D, E midpoints of AB, AC"],["Medial triangle","area ¼, perimeter ½","Join all three midpoints"]]},
 {k:"figs", title:"BPT and the mid-point theorem", items:[
  {svg:'<svg viewBox="0 0 280 170" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M120 20 L30 150 L250 150 Z"/><path d="M84 72 L172 72" style="stroke:var(--accent)" stroke-width="2.2"/><g fill="currentColor" stroke="none"><text x="116" y="14">A</text><text x="18" y="164">B</text><text x="250" y="164">C</text><text x="68" y="74">D</text><text x="178" y="74">E</text></g></svg>', cap:"DE ∥ BC ⇒ AD/DB = AE/EC and DE/BC = AD/AB."},
  {svg:'<svg viewBox="0 0 280 170" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M85 85 L205 85 L150 150 Z" style="fill:var(--accent-bg);stroke:var(--accent)"/><path d="M140 20 L30 150 L270 150 Z"/><path d="M54 117 l6 5 M110 50 l6 5 M167 48 l6 -5 M171 52 l6 -5 M232 115 l6 -5 M236 119 l6 -5 M86 146 v8 M90 146 v8 M94 146 v8 M206 146 v8 M210 146 v8 M214 146 v8" stroke-width="1.3"/><g fill="currentColor" stroke="none"><text x="136" y="14">A</text><text x="18" y="164">B</text><text x="270" y="164">C</text><text x="70" y="86">D</text><text x="210" y="86">E</text><text x="146" y="166">F</text></g></svg>', cap:"D, E, F are midpoints: DE = ½BC and △DEF has ¼ of the area."}]},
 {k:"ex", src:"SSC CGL 2023 · 26 Jul S1", q:"In △ABC, DE ∥ BC and AD/DB = 4/5. If DE = 12 cm, find BC.", steps:["AD/AB = 4/(4 + 5) = 4/9.","DE/BC = AD/AB ⇒ 12/BC = 4/9.","BC = 12 × 9/4 = 27 cm."], ans:"27 cm", tip:"Convert AD : DB into AD : AB before using DE/BC. (Some websites print 48 here — re-solve: it is 27.)"},
 {k:"ex", src:"SSC CGL 2023 · 27 Jul S2", q:"D is a point on side BC of △ABC. BC = 16 cm, BD = 11 cm and ∠ADC = ∠BAC. Find AC.", fig:'<svg viewBox="0 0 280 150" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M20 130 L260 130 L165.1 35.1 Z"/><path d="M165.1 35.1 L185 130"/><path d="M199 130 A14 14 0 0 0 182.1 116.3" style="stroke:var(--accent)" stroke-width="2"/><path d="M151.7 43.9 A16 16 0 0 0 176.4 46.4" style="stroke:var(--accent)" stroke-width="2"/><g fill="currentColor" stroke="none"><text x="160" y="28">A</text><text x="8" y="144">B</text><text x="258" y="144">C</text><text x="180" y="144">D</text></g></svg>', steps:["△ADC and △BAC share ∠C and ∠ADC = ∠BAC ⇒ similar (AA).","AC/BC = DC/AC ⇒ AC² = DC × BC.","DC = 16 − 11 = 5 ⇒ AC² = 5 × 16 = 80 ⇒ AC = 4√5 cm."], ans:"4√5 cm", tip:"Shared-angle pattern: (common side)² = (part) × (whole) — always the segment touching the shared vertex."},
 {k:"ex", src:"SSC CGL Tier 2 · 16 Nov 2020", q:"In △ABC, DE ∥ BC with D on AB and E on AC. AD = 5 cm, DB = 9 cm, AE = 4 cm and BC = 15.4 cm. Find DE + EC.", steps:["DE = BC × AD/AB = 15.4 × 5/14 = 5.5 cm.","AD/DB = AE/EC ⇒ EC = 4 × 9/5 = 7.2 cm.","DE + EC = 12.7 cm."], ans:"12.7 cm", tip:"Two different ratios: DE uses AD/AB; EC uses AD/DB."},
 {k:"ex", src:"SSC CGL 2025 · 17 Sep S3", q:"The perimeters of two similar triangles are in the ratio 3 : 5 and their areas total 34 cm². Find the area of the larger triangle.", steps:["Area ratio = 3² : 5² = 9 : 25 (34 parts).","34 parts = 34 cm² ⇒ 1 part = 1 cm².","Larger = 25 cm²."], ans:"25 cm²"},
 {k:"trick", h:"<b>Square to go to area, root to come back.</b> Sides 2 : 3 → areas 4 : 9. A line ∥ base that halves the area sits at AD/AB = 1/√2. A line ∥ base at AD : DB = m : n leaves ar(ADE) : ar(BCED) = m² : (m + n)² − m²."},
 {k:"trap", h:"In BPT, DE/BC equals <b>AD/AB</b>, not AD/DB. And area ratios need the side ratio <b>squared</b> — perimeters, medians and altitudes stay in the plain ratio."},
 {k:"link", h:"Similarity powers Pythagoras proofs and the altitude-on-hypotenuse results (L4), the angle-bisector theorem (L4) and the chord / secant results PA·PB = PC·PD (L10)."},
 {k:"q", q:"D and E are midpoints of AB and AC of △ABC. ar(△ADE) : ar(trapezium BCED) = ?", o:["1 : 3","1 : 4","1 : 2","1 : 1"], e:"ADE is ¼ of ABC, so the trapezium is ¾: 1 : 3."},
 {k:"q", q:"Two similar triangles have sides in the ratio 3 : 5. Their areas are in the ratio…", o:["9 : 25","3 : 5","27 : 125","√3 : √5"], e:"Square the side ratio."}
], sum:["Congruence: SSS, SAS, ASA, AAS, RHS; similarity: AA, SSS, SAS","DE ∥ BC ⇒ AD/DB = AE/EC and DE/BC = AD/AB","Area ratio = (side ratio)²; mid-point triangle has ¼ area"]},
{ id:"L4", heat:3, title:"Pythagoras & right triangles", hi:"पाइथागोरस और समकोण त्रिभुज", blocks:[
 {k:"hot", h:"<b>Tier 1:</b> almost every shift has a right triangle hidden somewhere — triplets, altitude on the hypotenuse, median = half hypotenuse. <b>Tier 2:</b> Apollonius / medians, angle-bisector theorem (internal and external) and 'altitude to hypotenuse' combos (AB² + BD² type)."},
 {k:"formula", title:"Right triangle (∠A = 90°, AD ⊥ BC)", rows:[["Pythagoras","BC² = AB² + AC²","Hypotenuse faces the right angle"],["Altitude on hypotenuse","AD² = BD × DC","Geometric mean of the two pieces"],["Legs","AB² = BD × BC,  AC² = CD × CB","Each leg² = its own piece × whole"],["Altitude length","AD = AB × AC / BC","Two ways to write the area"],["Reciprocal form","1/AD² = 1/AB² + 1/AC²","Altitude from legs, no BC needed"],["Median to hypotenuse","= ½ BC = circumradius","Mid-point of hypotenuse is equidistant from A, B, C"]]},
 {k:"formula", title:"Medians & bisectors (any triangle)", rows:[["Apollonius","AB² + AC² = 2(AD² + BD²)","D = midpoint of BC"],["Median length","mₐ = ½√(2b² + 2c² − a²)","Same theorem, solved for AD"],["Sum of median squares","mₐ² + m_b² + m_c² = ¾(a² + b² + c²)","Tier-2 favourite"],["Right triangle, medians from acute vertices","m₁² + m₂² = (5/4) × hypotenuse²","Add the two Pythagoras equations"],["Internal bisector of ∠A","BD/DC = AB/AC","D on BC"],["External bisector of ∠A","BE/EC = AB/AC","E on BC produced (AB ≠ AC)"]]},
 {k:"table", title:"Triplets to know by heart", head:["Triplet","Multiples seen in SSC","Pattern"], rows:[["3, 4, 5","6-8-10, 9-12-15, 15-20-25","—"],["5, 12, 13","10-24-26","odd a: (a²−1)/2, (a²+1)/2"],["8, 15, 17","16-30-34","(m²−n², 2mn, m²+n²) with m=4, n=1"],["7, 24, 25","14-48-50","odd a = 7"],["20, 21, 29","—","legs differ by 1"],["9, 40, 41 · 11, 60, 61 · 12, 35, 37","—","less common"]]},
 {k:"figs", title:"Three key pictures", items:[
  {svg:'<svg viewBox="0 0 300 175" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M20 150 L280 150 L95 32.2 Z"/><path d="M95 32.2 V150" style="stroke:var(--accent)"/><path d="M89.6 40.6 L98.1 46 L103.4 37.6" stroke-width="1.2"/><path d="M85 150 v-10 h10" stroke-width="1.2"/><g fill="currentColor" stroke="none"><text x="90" y="24">A</text><text x="8" y="164">B</text><text x="280" y="164">C</text><text x="91" y="166">D</text></g></svg>', cap:"∠A = 90°, AD ⊥ BC: AD² = BD·DC, AB² = BD·BC, AC² = CD·CB."},

 {k:"ex", src:"SSC CGL 2021 Tier 1 · 20 Apr 2022 S1", q:"In right △ABC, right-angled at B, altitude BD is drawn to the hypotenuse AC. If AD = 6 cm and CD = 5 cm, find AB² + BD².", steps:["BD² = AD × DC = 6 × 5 = 30.","AB² = AD × AC = 6 × 11 = 66.","AB² + BD² = 96."], ans:"96", tip:"Or: AB² + BD² = (AD² + BD²) + BD² = 36 + 60 = 96."},
 {k:"ex", src:"SSC CGL 2021 Tier 1 · 19 Apr 2022 S3", q:"In a right-angled triangle, the medians from the vertices of the acute angles are 7 cm and 4√6 cm. Find the hypotenuse.", steps:["Legs p, q. Medians: p² + q²/4 = 49 and q² + p²/4 = 96.","Add: (5/4)(p² + q²) = 145 ⇒ p² + q² = 116.","Hypotenuse = √116 = 2√29 cm."], ans:"2√29 cm", tip:"Hypotenuse² = (4/5)(m₁² + m₂²)."},
 {k:"ex", q:"In △ABC, AB = 6 cm, AC = 4 cm, BC = 5 cm. The bisector of the exterior angle at A meets BC produced at E. Find CE.", steps:["External bisector: BE/CE = AB/AC = 3/2.","BE = BC + CE ⇒ (5 + CE)/CE = 3/2.","10 + 2CE = 3CE ⇒ CE = 10 cm."], ans:"10 cm", tip:"E falls beyond the shorter side's end (C, since AC < AB)."},
 {k:"ex", q:"A 25 m ladder stands with its foot 7 m from a wall. If its top slides down 4 m, how far does the foot slide out?", steps:["Top height = √(25² − 7²) = 24 m.","New height = 20 m ⇒ new foot distance = √(25² − 20²) = 15 m.","Foot slides 15 − 7 = 8 m."], ans:"8 m", tip:"Spot 7-24-25 and 15-20-25 (3-4-5 × 5)."},
 {k:"trick", h:"<b>Triplet first, Pythagoras later.</b> 6-8-10, 9-12-15, 7-24-25, 20-21-29 cover most SSC numbers. For an odd leg a, the triplet is a, (a² − 1)/2, (a² + 1)/2 (e.g. 13, 84, 85)."},
 {k:"trap", h:"Altitude on the hypotenuse uses the <b>two pieces</b> (AD² = BD·DC), but a leg uses <b>piece × whole</b> (AB² = BD·BC). Mixing these up is the commonest slip. Also, the median to the hypotenuse is half the hypotenuse — the altitude is not."},
 {k:"link", h:"Median = half hypotenuse is the circumradius of a right triangle (L5). Pythagoras gives every chord / tangent length in circles (L9–L10) and the distance formula (L12)."},
 {k:"q", q:"In right △ABC (∠B = 90°), BD ⊥ AC. If AD = 4 cm and DC = 9 cm, BD = ?", o:["6 cm","6.5 cm","5 cm","13 cm"], e:"BD² = 4 × 9 = 36."},
 {k:"q", q:"The legs of a right triangle are 9 cm and 12 cm. The median to the hypotenuse is…", o:["7.5 cm","15 cm","10.5 cm","7.2 cm"], e:"Hypotenuse 15; median = ½ × 15."}
], sum:["Altitude on hypotenuse: AD² = BD·DC; leg² = piece × whole","Apollonius: AB² + AC² = 2(AD² + BD²); median to hypotenuse = ½ hypotenuse","Bisector theorem: BD/DC = AB/AC (internal and external)"]},
{ id:"L5", heat:3, title:"Triangle centres", hi:"त्रिभुज के केंद्र", blocks:[
 {k:"hot", h:"<b>Tier 1:</b> one question in most shifts — ∠BIC, ∠BHC, ∠BOC, or AG = ⅔AD. <b>Tier 2:</b> combinations (∠BIC − ∠BHC = 90°), r = Δ/s and R = abc/4Δ with Heron, centroid area splits, and angles at excentres."},
 {k:"table", title:"The four centres", head:["Centre","Meeting point of","Key fact","Where"], rows:[["Centroid G","Medians","Divides each median 2 : 1 from the vertex","Always inside"],["Incentre I","Angle bisectors","Equidistant from the 3 sides (r)","Always inside"],["Circumcentre O","Perpendicular bisectors of sides","Equidistant from the 3 vertices (R)","Inside / on hypotenuse midpoint / outside"],["Orthocentre H","Altitudes","Reflection tricks, ∠BHC","Inside / at right-angle vertex / outside"]]},
 {k:"formula", title:"Angles at the centres", rows:[["Incentre","∠BIC = 90° + A/2","Half-angles: 180 − (B + C)/2"],["Orthocentre","∠BHC = 180° − A","Quadrilateral with two right angles"],["Circumcentre","∠BOC = 2A (A acute); 360° − 2A (A obtuse)","Angle at centre = 2 × angle at circumference"],["Excentre (external bisectors of B, C)","∠BEC = 90° − A/2","Sum with ∠BIC is 180°"],["Internal bisector of B, external of C","∠BDC = A/2","Exterior-angle rule on the halves"]]},
 {k:"formula", title:"Lengths and areas", rows:[["Centroid","AG = ⅔ AD, GD = ⅓ AD","Medians make 6 triangles of equal area"],["Inradius","r = Δ / s","s = (a + b + c)/2"],["Circumradius","R = abc / (4Δ) = a / (2 sin A)","Heron gives Δ"],["Right triangle","r = (a + b − c)/2, R = c/2","c = hypotenuse"],["Euler line","O, G, H collinear; HG : GO = 2 : 1","I lies on it only if isosceles"]]},
 {k:"figs", title:"Where each centre sits", items:[{svg:'<svg viewBox="0 0 280 180" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M110 25 L25 160 L255 160 Z"/><path d="M110 25 L140 160 M25 160 L182.5 92.5 M255 160 L67.5 92.5" style="stroke:var(--accent)" stroke-width="1.3"/><circle cx="130" cy="115" r="3" style="fill:var(--accent)" stroke="none"/><g fill="currentColor" stroke="none"><text x="106" y="17">A</text><text x="11" y="172">B</text><text x="258" y="172">C</text><text x="136" y="111">G</text><text x="136" y="173">D</text></g></svg>', cap:"Centroid G: medians, AG : GD = 2 : 1."},{svg:'<svg viewBox="0 0 280 180" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M110 25 L25 160 L255 160 Z"/><circle cx="120.7" cy="107.2" r="52.8" style="stroke:var(--accent)"/><path d="M110 25 L120.7 107.2 M25 160 L120.7 107.2 M255 160 L120.7 107.2" stroke-width="1" stroke-dasharray="3 3"/><path d="M120.7 107.2 V160" style="stroke:var(--blue)" stroke-width="1.3"/><circle cx="120.7" cy="107.2" r="2.5" style="fill:var(--accent)" stroke="none"/><g fill="currentColor" stroke="none"><text x="106" y="17">A</text><text x="11" y="172">B</text><text x="258" y="172">C</text><text x="125.7" y="102.2">I</text><text x="124.7" y="141.6">r</text></g></svg>', cap:"Incentre I: angle bisectors; incircle radius r."},{svg:'<svg viewBox="0 0 280 180" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><circle cx="140" cy="92" r="72" style="stroke:var(--accent)"/><path d="M121.4 22.5 L81 133.3 L199 133.3 Z"/><path d="M140 92 L121.4 22.5 M140 92 L81 133.3 M140 92 L199 133.3" stroke-width="1" stroke-dasharray="3 3"/><circle cx="140" cy="92" r="2.5" style="fill:var(--accent)" stroke="none"/><g fill="currentColor" stroke="none"><text x="117.4" y="16.5">A</text><text x="67" y="141.3">B</text><text x="203" y="141.3">C</text><text x="147" y="88">O</text><text x="171.5" y="108.6">R</text></g></svg>', cap:"Circumcentre O: OA = OB = OC = R."},{svg:'<svg viewBox="0 0 280 180" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M110 25 L25 160 L255 160 Z"/><path d="M110 25 L110 160 M25 160 L131.8 45.3 M255 160 L90.3 56.3" style="stroke:var(--blue)" stroke-width="1.3"/><path d="M102 160 v-8 h8" stroke-width="1.1"/><circle cx="110" cy="68.7" r="2.5" style="fill:var(--accent)" stroke="none"/><g fill="currentColor" stroke="none"><text x="106" y="17">A</text><text x="11" y="172">B</text><text x="258" y="172">C</text><text x="117" y="84">H</text></g></svg>', cap:"Orthocentre H: the three altitudes meet."}]},
 {k:"ex", src:"SSC CGL 2022 · 02 Dec S1", q:"In △ABC, H is the orthocentre and I is the incentre. If ∠BIC − ∠BHC = 90°, find ∠A.", steps:["∠BIC = 90° + A/2 and ∠BHC = 180° − A.","(90 + A/2) − (180 − A) = 90 ⇒ 3A/2 = 180.","A = 120°."], ans:"120°", tip:"Write both formulas in terms of A and solve one linear equation."},
 {k:"ex", src:"SSC CGL Tier 2 · 29 Jan 2022", q:"G is the centroid of △ABC with AB = 35 cm, BC = 12 cm and AC = 37 cm. Find BG (to one decimal).", steps:["35² + 12² = 1369 = 37² ⇒ right angle at B.","Median from B to hypotenuse AC = 37/2 = 18.5 cm.","BG = ⅔ × 18.5 = 12.33 ≈ 12.3 cm."], ans:"12.3 cm", tip:"Spot the 12-35-37 triplet first — no Apollonius needed."},
 {k:"ex", src:"SSC CGL Tier 2 · 12 Sep 2019", q:"In △ABC the medians AD, BE and CF meet at O. Find ar(△ABD) : ar(△AOE).", steps:["The three medians cut △ABC into 6 triangles of equal area.","△ABD is half the triangle = 3 small parts.","△AOE is 1 small part ⇒ 3 : 1."], ans:"3 : 1"},
 {k:"ex", q:"A triangle has sides 13, 14 and 15 cm. Find its inradius and circumradius.", steps:["s = 21, Δ = √(21 × 8 × 7 × 6) = 84 cm².","r = Δ/s = 84/21 = 4 cm.","R = abc/(4Δ) = (13 × 14 × 15)/336 = 8.125 cm."], ans:"r = 4 cm, R = 8.125 cm (65/8)", tip:"13-14-15 has area 84 — memorise it, SSC loves it."},
 {k:"trick", h:"<b>I → In → plus:</b> ∠BIC = 90 + A/2. <b>H → minus:</b> ∠BHC = 180 − A. <b>O → double:</b> ∠BOC = 2A. Excentre is the mirror of incentre: 90 − A/2."},
 {k:"trap", h:"∠BOC = 2A only when A is acute. If A = 110°, ∠BOC = 360 − 220 = 140°, not 220°. Also: the centroid divides a median 2 : 1 from the <b>vertex</b> — GD is the short part."},
 {k:"link", h:"Equilateral-triangle values r = a/(2√3), R = a/√3 (L6); incircle tangent lengths s − a (L11); the centroid formula ((x₁+x₂+x₃)/3, …) in coordinates (L12)."},

{ id:"L6", heat:2, title:"Special triangles", hi:"विशेष त्रिभुज", blocks:[
 {k:"hot", h:"<b>Tier 1 / CHSL:</b> about one question in every 2 shifts — equilateral inradius ↔ side ↔ circumradius, height ↔ area, or an isosceles median. <b>Tier 2:</b> the same values hide inside circle and mensuration questions (triangle inscribed in a circle, 30-60-90 pieces of a figure)."},
 {k:"formula", title:"Equilateral triangle (side a)", rows:[["Height","h = (√3/2) a","Half of it is a 30-60-90 triangle"],["Area","(√3/4) a² = h²/√3","Both forms are asked"],["Inradius","r = a/(2√3) = h/3","Centroid sits ⅓ of the way up"],["Circumradius","R = a/√3 = 2h/3 = 2r","Centroid = circumcentre, AG = ⅔ median"],["r : R : h","1 : 2 : 3","Incircle : circumcircle area = 1 : 4"],["Any interior point (Viviani)","sum of ⊥ distances to the sides = h","Split into three triangles of base a"]]},
 {k:"formula", title:"30-60-90, 45-45-90 and isosceles", rows:[["30° : 60° : 90°","sides x : x√3 : 2x","Shortest side faces 30°; hypotenuse = 2 × shortest"],["45° : 45° : 90°","sides a : a : a√2","Half a square cut on its diagonal"],["Isosceles right, leg a","area a²/2, hypotenuse a√2","Hypotenuse h ⇒ area h²/4"],["Isosceles (equal sides b, base a)","height = √(b² − a²/4)","Altitude from apex bisects the base and the apex angle"],["Isosceles area","(a/4)√(4b² − a²)","Same as ½ × base × height"],["Isosceles angles","base angles equal; apex = 180° − 2 × base","Equal sides face equal angles"]]},

 {k:"ex", src:"SSC CHSL 2022 · 16 Mar 2023 S2", q:"In an equilateral triangle STU, the inradius is 5√3 cm. What is the length of the side of this triangle?", steps:["r = a/(2√3) ⇒ a = 2√3 × r.","a = 2√3 × 5√3 = 2 × 15 = 30 cm."], ans:"30 cm", tip:"a = 2√3 r and a = √3 R — the √3 always pairs with the radius."},
 {k:"ex", src:"SSC CHSL 2022 · 17 Mar 2023 S4", q:"In an equilateral triangle the inradius is 4 cm. What is the circumradius?", steps:["In an equilateral triangle R = 2r (r : R : h = 1 : 2 : 3).","R = 8 cm."], ans:"8 cm", tip:"No side needed: R = 2r, h = 3r."},
 {k:"ex", src:"SSC CHSL 2022 · 15 Mar 2023 S3", q:"In isosceles △ABC, BC is the unequal side and AD is the median from A. If AC = 5 cm and AD = 4 cm, find BC.", steps:["In an isosceles triangle the median to the base is also the altitude.","DC = √(5² − 4²) = 3 cm (3-4-5).","BC = 2 × 3 = 6 cm."], ans:"6 cm", tip:"Spot 3-4-5 and double the half-base."},
 {k:"ex", q:"P is a point inside an equilateral triangle. Its distances from the three sides are 3 cm, 4 cm and 5 cm. Find the side and the area of the triangle.", steps:["Sum of the distances = height ⇒ h = 12 cm.","a = 2h/√3 = 24/√3 = 8√3 cm.","Area = h²/√3 = 144/√3 = 48√3 cm²."], ans:"Side 8√3 cm, area 48√3 cm²", tip:"Area = ½ × a × (sum of distances) — three triangles with the same base."},
 {k:"trick", h:"<b>Equilateral ladder:</b> r : R : h = 1 : 2 : 3, and a = 2√3 r = √3 R = 2h/√3. Memorise <b>side 6 → h = 3√3, r = √3, R = 2√3</b> and scale. <b>Set squares:</b> 30-60-90 is half an equilateral triangle (x, x√3, 2x); 45-45-90 is half a square (a, a, a√2)."},
 {k:"trap", h:"Inradius is a/(2√3), <b>not</b> a/√3 (that is R). And r = h/3 (not h/2): the centre is ⅓ of the way up from the base. In 30-60-90 the side opposite 60° is x√3 — the hypotenuse is 2x, not x√3."},
 {k:"link", h:"These values give the trig ratios of 30°, 45°, 60° (Trigonometry app), the area of a hexagon = 6 equilateral triangles (L8, Mensuration 2D), and the incentre = centroid coincidence of L5."},
 {k:"q", q:"The side of an equilateral triangle is 10 cm. Its inradius is…", o:["5/√3 cm","10/√3 cm","5√3 cm","5 cm"], e:"r = a/(2√3) = 10/(2√3) = 5/√3 ≈ 2.89 cm."},
 {k:"q", q:"The hypotenuse of a 45-45-90 triangle is 8 cm. Each leg is…", o:["4√2 cm","4 cm","8√2 cm","2√2 cm"], e:"Leg = hypotenuse/√2 = 8/√2 = 4√2."}
], sum:["Equilateral: h = (√3/2)a, area (√3/4)a², r = a/(2√3), R = a/√3; r : R : h = 1 : 2 : 3","30-60-90 → x : x√3 : 2x; 45-45-90 → a : a : a√2","Isosceles: altitude to the base bisects it; height = √(b² − a²/4)"]},

 {k:"table", title:"Which property belongs to which shape", head:["Shape","Sides","Diagonals","Angles"], rows:[["Parallelogram","Opposite sides equal and ∥","Bisect each other","Opposite equal; adjacent add to 180°"],["Rectangle","Opposite sides equal","Equal, bisect each other","All 90°"],["Rhombus","All four equal","Bisect each other at 90°; bisect the angles","Opposite equal"],["Square","All four equal","Equal, ⊥, bisect each other and the angles","All 90°"],["Trapezium","One pair ∥","Cut each other in the ratio of the ∥ sides","Co-interior pairs on each leg add to 180°"],["Kite","Two pairs of adjacent sides equal","⊥; the main one bisects the other","One pair of opposite angles equal"]]},
 {k:"formula", title:"Lengths and areas", rows:[["Angle sum","360°","Two triangles"],["Rhombus side","a² = (d₁/2)² + (d₂/2)²","Half-diagonals and a side form a right triangle"],["Rhombus / kite area","½ d₁ d₂","Also base × height for a rhombus"],["Parallelogram law","AC² + BD² = 2(AB² + BC²)","Apollonius twice"],["Rectangle / square diagonal","√(l² + b²); a√2","Square area = d²/2"],["Trapezium mid-line","(a + b)/2","Joins the midpoints of the legs; ∥ to both bases"],["Trapezium, diagonals meet at O","AO/OC = BO/OD = AB/CD","△AOB ∼ △COD"],["Trapezium areas","AOB : COD = a² : b²; AOD = BOC; ar(AOD)² = ar(AOB)·ar(COD)","a = AB, b = CD"],["Mid-point quadrilateral","parallelogram with ½ the area","Any quadrilateral (mid-point theorem)"]]},
 {k:"figs", title:"Parallelogram, rhombus, trapezium, mid-points", items:[

 {k:"ex", src:"SSC CHSL 2020 · 13 Apr 2021 S1", q:"The perimeter of a rhombus is 148 cm and one of its diagonals is 24 cm. Find the area of the rhombus.", steps:["Side = 148/4 = 37 cm; half-diagonal = 12 cm.","Other half-diagonal = √(37² − 12²) = √1225 = 35 ⇒ d₂ = 70 cm.","Area = ½ × 24 × 70 = 840 cm²."], ans:"840 cm²", tip:"12-35-37 is a triplet — no square roots needed."},
 {k:"ex", src:"SSC CHSL 2025 · 19 Nov 2025 S3", q:"A rhombus has diagonals in the ratio 7 : 24 and side 25 cm. Find the diagonals and the area.", steps:["Half-diagonals 3.5x and 12x: (3.5x)² + (12x)² = 25² ⇒ 12.5²x² = 625 ⇒ x = 2.","Diagonals 14 cm and 48 cm.","Area = ½ × 14 × 48 = 336 cm²."], ans:"14 cm and 48 cm; 336 cm²", tip:"7-24-25: the half-diagonals are 7 and 24 straight away, so the diagonals are 14 and 48."},
 {k:"ex", q:"The sides of a parallelogram are 5 cm and 7 cm and one diagonal is 8 cm. Find the other diagonal.", steps:["Parallelogram law: d₁² + d₂² = 2(5² + 7²) = 148.","d₂² = 148 − 64 = 84.","d₂ = 2√21 cm."], ans:"2√21 cm"},
 {k:"ex", q:"In trapezium ABCD, AB ∥ CD and AB = 2CD. The diagonals meet at O and ar(△COD) = 4 cm². Find ar(ABCD).", steps:["△AOB ∼ △COD with ratio 2 ⇒ ar(AOB) = 4 × 4 = 16.","ar(AOD) = ar(BOC) = √(16 × 4) = 8 each.","Total = 16 + 4 + 8 + 8 = 36 cm²."], ans:"36 cm²", tip:"Parts are a² : ab : ab : b² = 4 : 2 : 2 : 1 ⇒ total (a + b)² = 9 parts."},
 {k:"trick", h:"<b>Rhombus = four right triangles.</b> Half the diagonals and the side are a triplet: 10 & 24 → 13; 16 & 30 → 17; 14 & 48 → 25; 24 & 70 → 37. <b>Trapezium:</b> the four diagonal triangles are a² : ab : b² : ab, total (a + b)²."},
 {k:"trap", h:"Use <b>half</b> diagonals for the rhombus side, and <b>½</b>d₁d₂ for its area. The mid-point figure of ANY quadrilateral is a parallelogram; it becomes a rectangle only when the diagonals are ⊥ (e.g. rhombus), a rhombus when they are equal (e.g. rectangle)."},
 {k:"link", h:"Parallelogram law = Apollonius (L4) used twice. Polygon angle sums (L8) start from 360° for a quadrilateral. Cyclic quadrilaterals (L11) add the 'opposite angles = 180°' rule. Areas move on to Mensuration 2D."},
 {k:"q", q:"In parallelogram ABCD, ∠A = 65°. ∠C = ?", o:["65°","115°","25°","130°"], e:"Opposite angles of a parallelogram are equal."},
 {k:"q", q:"The diagonals of a rhombus are 10 cm and 24 cm. Its side is…", o:["13 cm","17 cm","26 cm","12 cm"], e:"√(5² + 12²) = 13."}
], sum:["Parallelogram: diagonals bisect; rectangle: equal; rhombus: ⊥ bisectors; square: all","Rhombus a² = (d₁/2)² + (d₂/2)², area ½d₁d₂; parallelogram d₁² + d₂² = 2(a² + b²)","Trapezium diagonal triangles a² : ab : b² : ab; mid-point quadrilateral = parallelogram, ½ area"]},
{ id:"L8", heat:2, title:"Polygons", hi:"बहुभुज", blocks:[
 {k:"hot", h:"<b>Tier 1:</b> about one question in every 2–3 shifts — sides from an interior/exterior angle, or number of diagonals. <b>Tier 2:</b> two-step versions (angle sum → n → diagonals, interior − exterior = k, ratio of two polygons) and the regular hexagon in mensuration."},
 {k:"p", h:"An n-sided polygon splits into <b>n − 2 triangles</b> from one vertex, so its angles add to (n − 2) × 180°. Walking round any convex polygon you turn once completely, so the <b>exterior angles always add to 360°</b> — this is the fastest route to n."},
 {k:"formula", title:"Angle and diagonal formulas", rows:[["Sum of interior angles","(n − 2) × 180°","n − 2 triangles"],["Sum of exterior angles","360°","Any convex polygon"],["Each exterior (regular)","360°/n","n = 360 ÷ exterior"],["Each interior (regular)","180° − 360°/n = (n − 2)180°/n","Interior + exterior = 180°"],["Interior = k × exterior","n = 2(k + 1)","180 = (k + 1) × ext"],["Diagonals","n(n − 3)/2","Each vertex joins n − 3 others; ÷ 2 for double count"],["From one vertex","n − 3 diagonals, n − 2 triangles",""],["Triangles using the vertices","ⁿC₃ = n(n − 1)(n − 2)/6","Choose any 3 vertices"],["Regular hexagon, side a","area 6 × (√3/4)a² = (3√3/2)a²; longest diagonal 2a; short diagonal a√3","Six equilateral triangles"],["Regular octagon, side a","area 2(1 + √2)a²","Less common"]]},
 {k:"table", title:"Regular polygons to know", head:["n","Name","Angle sum","Each interior","Each exterior","Diagonals"], rows:[["3","Triangle","180°","60°","120°","0"],["4","Square","360°","90°","90°","2"],["5","Pentagon","540°","108°","72°","5"],["6","Hexagon","720°","120°","60°","9"],["8","Octagon","1080°","135°","45°","20"],["9","Nonagon","1260°","140°","40°","27"],["10","Decagon","1440°","144°","36°","35"],["12","Dodecagon","1800°","150°","30°","54"]]},
 {k:"figs", title:"Why the formulas work", items:[

  {svg:'<svg viewBox="0 0 280 180" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M140 90 L175 29.4 L105 29.4 Z" style="fill:var(--accent-bg)" stroke="none"/><path d="M210 90 L175 29.4 L105 29.4 L70 90 L105 150.6 L175 150.6 Z"/><path d="M140 90 L175 29.4 M140 90 L105 29.4 M140 90 L105 150.6 M140 90 L175 150.6" stroke-width="1"/><path d="M70 90 H210" style="stroke:var(--accent)" stroke-dasharray="5 3"/><path d="M105 29.4 L105 150.6" style="stroke:var(--blue)" stroke-dasharray="5 3" stroke-width="1.3"/><g fill="currentColor" stroke="none"><text x="136" y="22">a</text><text x="180" y="86">2a</text><text x="62" y="142">a√3</text><text x="134" y="56">60°</text></g></svg>', cap:"Regular hexagon = 6 equilateral triangles: area (3√3/2)a², long diagonal 2a, short diagonal a√3."}]},
 {k:"ex", src:"SSC CGL 2025 · 19 Sep S3", q:"A regular polygon has each interior angle 150°. Find the number of its sides.", steps:["Exterior = 180 − 150 = 30°.","n = 360/30 = 12."], ans:"12", tip:"Always go through the exterior angle: n = 360 ÷ (180 − interior)."},
 {k:"ex", src:"SSC CGL Tier 2 · 18 Nov 2020", q:"The interior angle of a regular polygon exceeds its exterior angle by 90°. Find the number of sides.", steps:["I + E = 180 and I − E = 90 ⇒ E = 45°.","n = 360/45 = 8."], ans:"8", tip:"E = (180 − difference)/2."},
 {k:"ex", src:"SSC CGL 2022 Tier 2 · 06 Mar 2023", q:"Find the number of diagonals of a polygon whose interior angles add up to 2700°.", steps:["(n − 2) × 180 = 2700 ⇒ n − 2 = 15 ⇒ n = 17.","Diagonals = 17 × 14/2 = 119."], ans:"119"},
 {k:"ex", q:"The numbers of sides of two regular polygons are in the ratio 1 : 2 and their interior angles are in the ratio 3 : 4. Find the sides of the smaller polygon.", steps:["Sides n and 2n. Interior angles 180 − 360/n and 180 − 180/n.","4(180 − 360/n) = 3(180 − 180/n) ⇒ 180 = 900/n.","n = 5 (pentagon and decagon: 108° : 144° = 3 : 4)."], ans:"5", tip:"Option test: try the table — 5 & 10, 4 & 8, 6 & 12 — and check the angle ratio."},
 {k:"trick", h:"<b>Exterior first.</b> Interior 140 → exterior 40 → n = 9. Interior = k × exterior → n = 2(k + 1). A valid exterior angle must <b>divide 360 exactly</b>, so interior 130° (exterior 50°) is impossible for a regular polygon."},
 {k:"trap", h:"Diagonals = n(n − 3)/2 — not n(n − 1)/2 (that counts sides too) and do not forget the ÷ 2. Sum of exterior angles is 360° for <b>every</b> polygon; do not use (n − 2) × 180 for it."},
 {k:"link", h:"Exterior angle of a triangle (L2) is the n = 3 case. The regular hexagon is six equilateral triangles (L6) and appears in Mensuration 2D (area) and 3D (hexagonal prism)."},
 {k:"q", q:"Each exterior angle of a regular polygon is 40°. How many sides does it have?", o:["9","8","10","40"], e:"360 ÷ 40 = 9."},
 {k:"q", q:"How many diagonals does a hexagon have?", o:["9","15","6","12"], e:"6 × 3/2 = 9."}
], sum:["Interior sum (n − 2)180°; exterior sum always 360°","Regular: exterior = 360/n, interior = 180 − 360/n; n = 360 ÷ exterior","Diagonals n(n − 3)/2; regular hexagon = 6 equilateral triangles"]},
{ id:"L9", heat:3, title:"Circles: chords & arcs", hi:"वृत्त: जीवा और चाप", blocks:[
 {k:"hot", h:"<b>Tier 1:</b> about one question per shift — chord length from radius and distance, angle at centre vs circumference, parallel chords. <b>Tier 2:</b> two-step angle chases (isosceles △OAB + inscribed angle), common chord of two circles."},
 {k:"formula", title:"Chord rules", rows:[["Perpendicular from centre","bisects the chord","OM ⊥ AB ⇒ AM = MB"],["Chord length","AB = 2√(r² − d²)","d = distance from centre"],["Radius from chord","r² = (AB/2)² + d²","Right triangle OMB"],["Equal chords","equidistant from centre, equal angles at centre","Converse also true"],["Nearer the centre","longer chord","Diameter = longest chord (2r)"],["Two parallel chords","gap = d₁ − d₂ (same side) or d₁ + d₂ (opposite sides)","Find each d first"],["Chord subtending θ at centre","2r sin(θ/2)","60° → r, 90° → r√2, 120° → r√3"],["Common chord of two circles","⊥ bisected by the line of centres","Two right triangles share the half-chord"]]},
 {k:"formula", title:"Angle rules", rows:[["Centre vs circumference","∠AOB = 2∠ACB","C on the remaining (major) arc"],["Point on the minor arc","∠ADB = 180° − ½∠AOB","D and C are opposite: they add to 180°"],["Same segment","∠ACB = ∠ADB","C, D on the same side of AB"],["Semicircle","angle = 90°","AB a diameter ⇒ ∠ACB = 90°"],["Isosceles △OAB","∠OAB = 90° − ∠ACB","OA = OB = r"]]},
 {k:"figs", title:"Three pictures to remember", items:[
  {svg:'<svg viewBox="0 0 280 175" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><circle cx="140" cy="90" r="70"/><path d="M84 132 L196 132"/><path d="M140 90 V132" style="stroke:var(--accent)"/><path d="M140 90 L196 132" style="stroke:var(--blue)"/><path d="M140 124 h8 v8" stroke-width="1.1"/><circle cx="140" cy="90" r="2.5" style="fill:currentColor" stroke="none"/><g fill="currentColor" stroke="none"><text x="124" y="86">O</text><text x="70" y="146">A</text><text x="200" y="146">B</text><text x="136" y="148">M</text><text x="128" y="115">d</text><text x="170" y="104">r</text><text x="164" y="146">AB/2</text></g></svg>', cap:"OM ⊥ AB bisects it: (AB/2)² + d² = r²."},
  {svg:'<svg viewBox="0 0 280 175" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><circle cx="140" cy="95" r="70"/><path d="M79.4 130 L140 25 L200.6 130 M79.4 130 L140 95 L200.6 130"/><path d="M79.4 130 L193.6 50 L200.6 130" style="stroke:var(--blue)" stroke-dasharray="4 3" stroke-width="1.2"/><path d="M127.5 102.2 A14 14 0 0 0 152.5 102.2" style="stroke:var(--accent)" stroke-width="2"/><path d="M134 35.4 A12 12 0 0 0 146 35.4" style="stroke:var(--accent)" stroke-width="2"/><g fill="currentColor" stroke="none"><text x="136" y="18">C</text><text x="198" y="46">D</text><text x="64" y="144">A</text><text x="204" y="144">B</text><text x="122" y="86">O</text><text x="132" y="124">2θ</text><text x="136" y="52">θ</text></g></svg>', cap:"∠AOB = 2∠ACB; C and D in the same segment ⇒ ∠ACB = ∠ADB."},

 {k:"ex", src:"SSC CGL 2024 · 10 Sep S2", q:"In a circle of radius 5√13 cm, a chord is at a distance of 10 cm from the centre. Find the length of the chord.", steps:["Half-chord = √(r² − d²) = √(325 − 100) = √225 = 15 cm.","Chord = 2 × 15 = 30 cm."], ans:"30 cm", tip:"Never forget to double the half-chord."},
 {k:"ex", src:"SSC CHSL 2024 · 05 Jul S3", q:"Two parallel chords are drawn in a circle of radius 25 cm. The distance between them is 27 cm. If one chord is 48 cm, find the other.", steps:["48 cm chord: d₁ = √(625 − 576) = 7 cm.","27 > 25, so the chords lie on opposite sides: d₂ = 27 − 7 = 20 cm.","Other chord = 2√(625 − 400) = 2 × 15 = 30 cm."], ans:"30 cm", tip:"7-24-25 and 15-20-25 — both triplets of 25."},
 {k:"ex", src:"SSC CGL 2025 · 23 Sep S1", q:"In a circle, chord AB subtends 80° at the centre. Find ∠ACB, where C lies on the circle (on the major arc).", steps:["Angle at the circumference = ½ × angle at the centre.","∠ACB = 40°."], ans:"40°", tip:"If C were on the minor arc, the answer would be 180 − 40 = 140°."},
 {k:"ex", q:"AB is a chord of a circle with centre O and ∠OAB = 25°. Find ∠ACB, where C is on the major arc.", steps:["OA = OB ⇒ ∠OBA = 25° ⇒ ∠AOB = 180 − 50 = 130°.","∠ACB = ½ × 130 = 65°."], ans:"65°", tip:"∠OAB + ∠ACB = 90° — one line."},
 {k:"trick", h:"<b>Triplets of the radius:</b> r = 25 → chords 48 (d = 7), 40 (d = 15), 30 (d = 20), 14 (d = 24). r = 13 → 24 (d = 5), 10 (d = 12). r = 17 → 30 (d = 8), 16 (d = 15). <b>∠OAB + ∠ACB = 90°</b> for any chord AB and C on the major arc."},
 {k:"trap", h:"The inscribed angle is half the central angle only when the point is on the <b>major</b> arc (the other side from the centre angle). On the minor arc use 180° − half. For parallel chords, check whether they are on the same side (subtract distances) or opposite sides (add)."},
 {k:"link", h:"The perpendicular-from-centre right triangle is Pythagoras (L4). Inscribed angles lead to the alternate segment theorem (L10) and cyclic quadrilaterals (L11). Arc length and sector area are in Mensuration 2D."},
 {k:"q", q:"AB is a diameter of a circle and C is any other point on the circle. ∠ACB = ?", o:["90°","180°","60°","45°"], e:"Angle in a semicircle."},
 {k:"q", q:"Chord AB subtends 140° at the centre. The angle it subtends at a point on the major arc is…", o:["70°","140°","110°","40°"], e:"½ × 140 = 70°."}
], sum:["Perpendicular from centre bisects a chord: chord = 2√(r² − d²)","Angle at centre = 2 × angle at circumference; same segment angles equal; semicircle 90°","Equal chords ↔ equal distances ↔ equal central angles; parallel chords: add or subtract distances"]},
{ id:"L10", heat:3, title:"Circles: tangents", hi:"वृत्त: स्पर्श रेखाएँ", blocks:[
 {k:"hot", h:"<b>Tier 1 / CHSL:</b> about one question per shift — tangent length from an external point, direct / transverse common tangent, PT² = PA·PB. <b>Tier 2:</b> alternate-segment angle chases, 4r₁r₂ = DCT² − TCT², circles touching each other, circumscribed quadrilaterals."},
 {k:"formula", title:"One circle", rows:[["Tangent ⊥ radius","OT ⊥ PT","At the point of contact"],["Tangent length","PT² = OP² − r²","Right triangle OTP"],["Two tangents from P","PA = PB; OP bisects ∠APB","Congruent right triangles"],["Angle between tangents","∠APB + ∠AOB = 180°","Quadrilateral with two 90° angles"],["Tangent–secant","PT² = PA × PB","PA = outside part, PB = whole secant"],["Two secants from P","PA × PB = PC × PD","outside × whole"],["Chords crossing inside","AE × EB = CE × ED","part × part"],["Alternate segment","∠(tangent, chord) = angle in the alternate segment","Angle on the OTHER side of the chord"],["Circumscribed quadrilateral","AB + CD = AD + BC","Equal tangents from each corner"]]},
 {k:"formula", title:"Two circles (radii r₁, r₂, centres d apart)", rows:[["Direct common tangent","√(d² − (r₁ − r₂)²)","Both circles on the same side"],["Transverse common tangent","√(d² − (r₁ + r₂)²)","Crosses between the circles"],["DCT² − TCT²","4 r₁ r₂","Tier-1 favourite"],["Touching externally","d = r₁ + r₂, DCT = 2√(r₁ r₂)","TCT = 0"],["Touching internally","d = r₁ − r₂",""],["Number of common tangents","4 apart · 3 touch outside · 2 cut · 1 touch inside · 0 one inside","Apart → all four exist"]]},

 {k:"ex", src:"SSC CHSL 2022 · 10 Mar 2023 S3", q:"The direct common tangent of two circles of radii 16 cm and 6 cm is 24 cm. Find the distance between their centres.", steps:["d² = DCT² + (r₁ − r₂)² = 576 + 100 = 676.","d = 26 cm."], ans:"26 cm", tip:"Direct → difference of radii; transverse → sum."},

 {k:"ex", q:"PA and PB are tangents from P to a circle with centre O, and ∠APB = 50°. C is a point on the major arc AB. Find ∠ACB.", steps:["∠AOB = 180 − 50 = 130° (OAPB has two right angles).","∠ACB = ½ × 130 = 65°."], ans:"65°", tip:"∠ACB = 90° − ½∠APB."},
 {k:"ex", q:"Chords AB and CD of a circle intersect at E. AE = 5 cm, EB = 6 cm and CE = 3 cm. Find ED.", steps:["AE × EB = CE × ED.","30 = 3 × ED ⇒ ED = 10 cm."], ans:"10 cm"},
 {k:"trick", h:"<b>Outside × whole</b> for secants (PA·PB) and <b>part × part</b> for chords crossing inside. Tangents from P: ∠AOB = 180° − ∠APB and the angle in the major arc = 90° − ½∠APB. Common tangents: <b>D</b>irect ↔ <b>D</b>ifference of radii."},
 {k:"trap", h:"Tangent–secant uses the <b>whole</b> secant PB, not the chord AB. In the alternate segment theorem the equal angle lies in the segment on the <b>other side</b> of the chord from the tangent angle. Direct tangent uses r₁ − r₂; using r₁ + r₂ gives the transverse one."},
 {k:"link", h:"PT² = PA·PB comes from similar triangles (L3). Equal tangent lengths give the incircle lengths s − a (L11) and BP = PC in an isosceles triangle (L6)."},
 {k:"q", q:"The angle between a tangent to a circle and the radius at the point of contact is…", o:["90°","60°","45°","180°"], e:"Tangent ⊥ radius."},
 {k:"q", q:"Two circles touch externally. Their radii are 9 cm and 4 cm. The direct common tangent is…", o:["12 cm","13 cm","5 cm","6 cm"], e:"2√(9 × 4) = 12."}
], sum:["Tangent ⊥ radius; PT² = OP² − r²; tangents from a point are equal","PT² = PA·PB; chords: AE·EB = CE·ED; alternate segment angle = tangent–chord angle","DCT = √(d² − (r₁ − r₂)²), TCT = √(d² − (r₁ + r₂)²), DCT² − TCT² = 4r₁r₂"]},
{ id:"L11", heat:2, title:"Cyclic quadrilaterals & circle–triangle combos", hi:"चक्रीय चतुर्भुज और वृत्त–त्रिभुज", blocks:[
 {k:"hot", h:"<b>Tier 1:</b> about one question in every 2 shifts — opposite angles add to 180°, a diameter inside a cyclic quadrilateral, incircle tangent lengths. <b>Tier 2:</b> sides produced to meet at E and F (angle chases), tangents at two vertices, cyclic quadrilateral + alternate segment."},
 {k:"formula", title:"Cyclic quadrilateral ABCD", rows:[["Opposite angles","∠A + ∠C = ∠B + ∠D = 180°","Each pair stands on the whole circle"],["Exterior angle","= interior opposite angle","∠DCE = ∠A (BC produced to E)"],["Angles on one side","∠ADB = ∠ACB","Same segment (L9)"],["Converse","opposite angles add to 180° ⇒ concyclic","Proves points lie on a circle"],["Special cases","cyclic parallelogram = rectangle; cyclic trapezium is isosceles",""],["Sides produced","AB∩DC = E, AD∩BC = F ⇒ ∠E + ∠F = 180° − 2∠A","From triangles AED and AFB"],["Ptolemy (rare)","AC·BD = AB·CD + AD·BC","Tier-2 only"],["Brahmagupta area (rare)","√((s − a)(s − b)(s − c)(s − d))","s = half the perimeter"]]},
 {k:"formula", title:"Incircle and excircle lengths (a = BC, b = CA, c = AB, s = (a + b + c)/2)", rows:[["Tangent from A","AF = AE = s − a","Equal tangents from each vertex"],["Tangent from B","BF = BD = s − b",""],["Tangent from C","CD = CE = s − c",""],["Sum of one length per vertex","AF + BD + CE = s","Half the perimeter"],["Right triangle (C = 90°)","r = s − c = (a + b − c)/2","Tangent square at C has side r"],["Excircle opposite A","AQ = AR = s","Touches AB, AC produced"]]},

 {k:"ex", src:"SSC CPO 2020 · 24 Nov S1", q:"ABCD is a cyclic quadrilateral with AB a diameter of its circumcircle and ∠ADC = 118°. Find ∠BAC.", steps:["∠ABC = 180 − 118 = 62° (opposite angles).","∠ACB = 90° (angle in a semicircle).","∠BAC = 180 − 90 − 62 = 28°."], ans:"28°", tip:"With a diameter: ∠BAC = ∠ADC − 90°."},
 {k:"ex", src:"SSC CGL 2020 Tier 1 · 18 Aug 2021 S2", q:"ABCD is a cyclic quadrilateral. AB and DC produced meet at F; AD and BC produced meet at E. ∠BAD = 68° and ∠AEB = 27°. Find ∠BFC.", steps:["△ABE: ∠ABC = 180 − 68 − 27 = 85°.","∠ADC = 180 − 85 = 95° (opposite angles).","△AFD: ∠F = 180 − 68 − 95 = 17°."], ans:"17°", tip:"∠E + ∠F = 180 − 2A = 44 ⇒ F = 44 − 27 = 17°."},
 {k:"ex", src:"SSC CGL Tier 2 · 03 Feb 2022", q:"ABCD is a cyclic quadrilateral. AB and DC produced meet at E; AD and BC produced meet at F. ∠ADC = 76° and ∠AED = 55°. Find ∠AFB.", steps:["△AED: ∠A = 180 − 76 − 55 = 49°.","∠B = 180 − 76 = 104°.","△AFB: ∠F = 180 − 49 − 104 = 27°."], ans:"27°"},
 {k:"ex", src:"SSC CHSL 2020 · 26 Oct S3", q:"The incircle of △ABC touches AB, BC and AC at D, E and F. AB = 18 cm, BC = 15 cm and AC = 13 cm. Find AD + BE + CF.", steps:["AD = AF, BE = BD, CF = CE (equal tangents).","Perimeter = 2(AD + BE + CF) = 46.","AD + BE + CF = 23 cm."], ans:"23 cm", tip:"One tangent from each vertex always adds to s."},
 {k:"trick", h:"<b>Cyclic = 180 opposite.</b> Every chase starts by writing the opposite angle as 180 − x. <b>Sides produced:</b> ∠E + ∠F = 180° − 2∠A. <b>Incircle:</b> the tangent from a vertex = s − (opposite side)."},
 {k:"trap", h:"The exterior angle of a cyclic quadrilateral equals the <b>interior opposite</b> angle, not the adjacent one. In tangent lengths, the length from A is s − a (the side <b>opposite</b> A), not s − b or s − c."},
 {k:"link", h:"Uses inscribed angles and the semicircle (L9) and equal tangents (L10). The incircle radius r = Δ/s is in L5; Heron's formula is in Mensuration 2D."},
 {k:"q", q:"ABCD is a cyclic quadrilateral and ∠B = 104°. ∠D = ?", o:["76°","104°","86°","52°"], e:"180 − 104 = 76°."},
 {k:"q", q:"In △ABC, BC = 7 cm, CA = 8 cm, AB = 9 cm. The incircle touches BC at D. BD = ?", o:["4 cm","5 cm","3 cm","3.5 cm"], e:"s = 12; BD = s − CA = 4."}
], sum:["Cyclic quadrilateral: opposite angles add to 180°; exterior angle = interior opposite","Sides produced meet at E, F: ∠E + ∠F = 180° − 2∠A","Incircle tangent from A = s − a; one tangent per vertex adds to s; excircle tangent from A = s"]},
{ id:"L12", heat:2, title:"Coordinate geometry for SSC", hi:"निर्देशांक ज्यामिति", blocks:[
 {k:"hot", h:"<b>Tier 1:</b> rare (0–1 per shift) — a reflection, mid-point, slope or the area made by a line with the axes. <b>Tier 2:</b> about one question per paper, almost always 'area of the triangle formed by two lines and an axis', plus reflections in y = k and section ratios."},
 {k:"formula", title:"Points", rows:[["Distance","√((x₂ − x₁)² + (y₂ − y₁)²)","Pythagoras on the grid"],["Mid-point","((x₁ + x₂)/2, (y₁ + y₂)/2)",""],["Section, internal m : n","((mx₂ + nx₁)/(m + n), (my₂ + ny₁)/(m + n))","m goes with the FAR point"],["Section, external m : n","((mx₂ − nx₁)/(m − n), (my₂ − ny₁)/(m − n))","Point outside the segment"],["x-axis cuts the join in ratio","−y₁ : y₂","y-axis: −x₁ : x₂"],["Centroid","((x₁ + x₂ + x₃)/3, (y₁ + y₂ + y₃)/3)","2 : 1 point of each median"],["Area of triangle","½|x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂)|","= 0 ⇒ collinear"]]},
 {k:"formula", title:"Lines", rows:[["Slope","m = (y₂ − y₁)/(x₂ − x₁) = tan θ","θ with the +x axis"],["Slope of ax + by + c = 0","−a/b","Intercepts −c/a and −c/b"],["Parallel / perpendicular","m₁ = m₂;  m₁ m₂ = −1",""],["Slope–intercept / point–slope","y = mx + c;  y − y₁ = m(x − x₁)",""],["Intercept form","x/a + y/b = 1","Cuts the axes at (a, 0), (0, b)"],["Area with the axes","½|a·b|; for ax + by = c it is c²/(2|ab|)","Right triangle at O"],["Point to line","|ax₁ + by₁ + c| / √(a² + b²)",""],["Two parallel lines","|c₁ − c₂| / √(a² + b²)","Same a, b first"]]},
 {k:"table", title:"Reflections of P(x, y)", head:["Mirror","Image","Memory hook"], rows:[["x-axis","(x, −y)","y changes sign"],["y-axis","(−x, y)","x changes sign"],["Origin","(−x, −y)","both change"],["Line y = x","(y, x)","swap"],["Line y = −x","(−y, −x)","swap and change both"],["Line y = k","(x, 2k − y)","k is the mid-point of y and its image"],["Line x = h","(2h − x, y)",""]]},

 {k:"ex", src:"SSC CGL Tier 2 · 18 Nov 2020", q:"What is the reflection of the point (5, −3) in the line y = 3?", steps:["Image in y = k is (x, 2k − y).","(5, 2 × 3 − (−3)) = (5, 9)."], ans:"(5, 9)", tip:"The mirror line is the mid-point: (−3 + 9)/2 = 3 ✓."},
 {k:"ex", src:"SSC CGL Tier 2 · 15 Nov 2020", q:"Find the area of the triangle formed by the graphs of 8x + 3y = 24, 2x + 8 = y and the x-axis.", steps:["x-axis cuts: 8x = 24 ⇒ (3, 0); 2x + 8 = 0 ⇒ (−4, 0). Base = 7.","Lines meet: 8x + 3(2x + 8) = 24 ⇒ x = 0, y = 8 ⇒ height 8.","Area = ½ × 7 × 8 = 28 sq units."], ans:"28 sq units", tip:"Two lines + x-axis: base = gap between x-intercepts, height = |y| of their meeting point."},
 {k:"ex", src:"SSC CGL Tier 2 · 03 Feb 2022", q:"Find the area of the triangle enclosed by 2x + 5y = 12, x + y = 3 and the x-axis.", steps:["x-intercepts: 6 and 3 ⇒ base 3.","Meeting point: x = 3 − y ⇒ 6 − 2y + 5y = 12 ⇒ y = 2.","Area = ½ × 3 × 2 = 3 sq units."], ans:"3 sq units"},
 {k:"ex", q:"In what ratio does the x-axis divide the join of (2, −3) and (5, 6)? Find the point.", steps:["Ratio = −y₁ : y₂ = 3 : 6 = 1 : 2.","Point = ((1 × 5 + 2 × 2)/3, 0) = (3, 0)."], ans:"1 : 2 at (3, 0)", tip:"Check: y = (1 × 6 + 2 × (−3))/3 = 0 ✓."},
 {k:"trick", h:"<b>Value-check every option:</b> put the option point into the line or distance condition — faster than solving. <b>Area with axes:</b> for ax + by = c, area = c²/(2|ab|) (3x + 4y = 12 → 144/24 = 6). <b>y = k mirror:</b> 2k − y."},
 {k:"trap", h:"In the section formula, m multiplies the <b>second</b> point (x₂, y₂). Slope of ax + by + c = 0 is <b>−a/b</b>, not a/b or −b/a. Reflection in y = x swaps the coordinates; in y = −x it swaps <b>and</b> changes both signs."},
 {k:"link", h:"Distance formula = Pythagoras (L4); centroid = 2 : 1 point (L5); the right triangle at the origin uses L4 and L6 values; slope = tan θ links to the Trigonometry app."},

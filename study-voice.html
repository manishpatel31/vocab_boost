<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">

<title>Active &amp; Passive Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: Physics PYQ Workbook — follows the शब्दRegister Paper / Indigo look; one column + bottom tabs on phones, sidebar on PC. */
:root{
  --paper:#f6f3ea; --sheet:#fffdf7; --sunk:#ebe6d8;
  --ink:#1d2a22; --ink2:#56625a; --rule:#dcd5c3;
  --blue:#1f5c3d; --on-blue:#ffffff; --blue-bg:#dcebdf;
  --accent:#b4530f; --accent-bg:#fbe7d3;
  --good:#1b7547; --good-bg:#dff1e6; --bad:#b0271f; --bad-bg:#f8e1de;
  --warn-bg:#fff2d2;
  --f-display:"Fraunces", "Tiro Devanagari Hindi", Georgia, serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap{border-radius:var(--r);padding:12px 14px 12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.trick .lab,.trap .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.rk div{grid-template-columns:minmax(0,48%) minmax(0,1fr)}
.rk dd{min-width:0;overflow-wrap:anywhere}
.hot{border-radius:var(--r);padding:12px 14px;background:var(--warn-bg,var(--accent-bg));border-left:4px solid var(--warn,var(--accent))}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--warn,var(--accent))}
.heatb{display:inline-block;font-size:11px;letter-spacing:-.1em;margin-left:6px;vertical-align:1px}
.heat{display:flex;flex-direction:column;gap:2px}
.hrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(60px,1fr) 44px;gap:10px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:9px 2px;color:inherit;font:inherit;cursor:pointer}
.hrow:last-child{border-bottom:0}
.hrow .ht{display:flex;flex-direction:column;min-width:0}
.hrow .ht .muted{font-size:12px}
.hbar{height:10px;border-radius:5px;background:var(--rule);overflow:hidden}
.hbar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hp{text-align:right;font-weight:700}

.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.pyr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pyr div{text-align:center;font-size:13px}
.pyr b{display:block;font-size:14px}
.pm{fill:var(--blue)} .pf{fill:var(--accent)}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.pal button.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.pal button.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.rk{display:grid;gap:0}
.rk div{display:grid;grid-template-columns:minmax(0,48%) 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:15px}
.rk div:first-child{border-top:0}
.rk dt{font-size:13px;color:var(--ink2);margin:0}
.rk dt.up{color:var(--good)} .rk dt.dn{color:var(--bad)}
.rk dd{margin:0;font-weight:600;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:24px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.gbar{display:grid;grid-template-columns:78px 1fr 52px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.gbar .tr{height:12px;background:var(--sunk);border-radius:3px;position:relative;overflow:hidden}
.gbar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:3px}
.gbar .tr i.neg{background:var(--bad)}
.gbar .v{font-family:var(--f-num);text-align:right}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
@media (prefers-reduced-motion: no-preference){ .opt,.chip,.btn{transition:background-color .15s, border-color .15s} }
.link{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px}
.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.icheck{background:var(--sheet);border:1.5px dashed var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.icheck .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.cat{font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;white-space:nowrap}
.cat.CS{background:var(--blue-bg);color:var(--blue)} .cat.CSS{background:var(--accent-bg);color:var(--accent)} .cat.ST{background:var(--sunk);color:var(--ink)} .cat.OT{background:var(--sunk);color:var(--ink2)}

/* ---- workbook additions ---- */
table.cover td:nth-child(4){min-width:180px}
.plist .dl{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.plist .dl em{font-style:normal;font-weight:700;color:var(--blue);text-align:right}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--rule)}
.ladder li{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--rule)}
.ladder .rk-n{font-size:22px;font-weight:600;color:var(--blue);text-align:right}
.ladder .rk-t{min-width:0}
.ladder .rk-t b{display:block;line-height:1.3}
.ladder .rk-t span{font-size:13px;color:var(--ink2)}
.ladder .rk-d{font-weight:700;font-size:14px;white-space:nowrap}
.ladder li.up .rk-d{color:var(--good)} .ladder li.dn .rk-d{color:var(--bad)}
.ladder small{font-weight:600;color:var(--ink2)}
table.cover td{min-width:90px}
.peek{border:1.5px dashed var(--blue);background:var(--blue-bg);color:var(--blue);border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer;min-height:36px;width:100%}
.pubs{display:grid;gap:12px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.plist li{padding:7px 0;border-top:1px dashed var(--rule);display:grid;gap:1px}
.plist li:first-child{border-top:0}
.plist li span{font-size:13px;color:var(--ink2)}
.seg{scroll-snap-type:x proximity}
@media (max-width: 700px){
  table.cover thead{display:none}

<script>
"use strict";
const PV = "Select the option that expresses the given sentence in passive voice. ";
const AV = "Select the option that expresses the given sentence in active voice. ";
const LESSONS = [
{ id:"L1", heat:3, title:"SSC CGL pattern & exam strategy", hi:"परीक्षा पैटर्न और रणनीति", blocks:[
 {k:"hot", h:"<b>Active–passive voice is one of the most reliable marks in SSC English.</b> In CGL Tier 1 (25 English questions, +2 / −0.5) it usually appears as <b>one question in most shifts</b>. In CGL Tier 2 (Paper 1, Module II: 45 English questions, +3 / −1) expect <b>one to three</b>. CHSL, CPO and Selection Post ask it in the same format. Once the method is automatic, a voice question takes 20–30 seconds."},
 {k:"table", title:"Where voice is asked in SSC exams", head:["Exam","English section","Voice questions (usual)","Marking"], rows:[
  ["CGL Tier 1","25 questions","0–1 per shift, mostly 1","+2 / −0.5"],
  ["CGL Tier 2 (Paper 1, Module II)","45 questions","1–3","+3 / −1"],
  ["CHSL Tier 1","25 questions","0–1","+2 / −0.5"],
  ["CPO Paper 1","50 questions","1–2","+1 / −0.25"],
  ["Selection Post / Stenographer","25–200 (by level)","1–2","Varies"]]},
 {k:"p", h:"<b>The question is almost always worded the same way:</b> “Select the option that expresses the given sentence in passive voice” (or “in active voice”). Four full sentences are given. Usually only the helping verb, the pronoun or the word order differs between options, so you are really checking <b>four things</b>: tense, subject/object swap, the third form (V3) of the verb, and the pronoun case after “by”."},
 {k:"table", title:"Recent pattern (2023–2025 shifts): what the sentences test", head:["Type","How often","Typical sentence"], rows:[
  ["Simple present / past / future","Very often","The gardener waters the plants every morning."],
  ["Continuous (is being / was being)","Very often","The workers were repairing the road."],
  ["Perfect (has been / had been)","Very often","She has completed the project."],
  ["Modals (can be / must be / should have been)","Often, rising","You must submit the form by Monday."],
  ["Interrogative (By whom / Who)","Often","Who wrote this novel?"],
  ["Imperative (Let … be / You are requested)","Regular","Please close the window."],
  ["Passive → active","Regular (about 1 in 4)","The thief was caught by the police."],
  ["Two objects, ‘It is said that’, infinitives","Tier 2 favourite","People say that he is honest."]]},
 {k:"trick", h:"<b>The 30-second elimination.</b> (1) Find the tense from the helping verb and strike out options with the wrong tense — usually two go at once. (2) Check the new subject: the old object must come first, in subject form (him → he, them → they). (3) Check that the main verb is in V3. (4) Check “by + object form” at the end and that no word has been dropped or added (time words like <i>every day, yesterday</i> stay)."},
 {k:"trap", h:"SSC distractors are built from <b>tiny tense slips</b>: <i>is</i> vs <i>was</i>, <i>was</i> vs <i>was being</i>, <i>has been</i> vs <i>had been</i>, <i>will be</i> vs <i>would be</i>. Read the helping verb of each option before reading anything else."},
 {k:"trick", h:"<b>Meaning check.</b> Voice change never changes the meaning, the tense or the time words. If an option changes <i>yesterday</i> to <i>today</i>, drops <i>not</i>, or changes <i>can</i> to <i>could</i>, it is wrong — even if the grammar looks fine."},
 {k:"link", h:"Voice and narration (direct–indirect speech) are asked side by side in SSC papers and use the same skill: keeping tense under control. Revise them together on the last day."},
 {k:"q", q:"In CGL Tier 1, which step usually eliminates two options at once in a voice question?", o:["Checking the tense (helping verb)","Checking the spelling of the noun","Counting the words","Checking the full stop"], e:"Most distractors use the wrong tense form, so checking the helping verb removes them first."}
]},
{ id:"L2", heat:3, title:"The rules: object, V3 and pronouns", hi:"मूल नियम · कर्म, V3 और सर्वनाम", blocks:[
 {k:"hot", h:"Every voice question uses these rules. If you know them by heart, the tense lessons are just tables to remember."},
 {k:"p", h:"In the <b>active voice</b> the doer (agent) is the subject: <i>Ravi <b>wrote</b> a letter.</i> In the <b>passive voice</b> the receiver of the action becomes the subject: <i>A letter <b>was written</b> by Ravi.</i> Only sentences with an <b>object</b> (transitive verbs) can be changed. <i>She sleeps</i> has no object, so it has no passive."},
 {k:"formula", title:"Four steps of active → passive", rows:[
  ["1. Swap","Object → new subject; subject → after “by”","Ravi … a letter → A letter … by Ravi"],
  ["2. Helping verb","Add the correct form of “be” for the tense","is / was / will be / is being / has been …"],
  ["3. Verb","Main verb always in V3 (past participle)","write → written, sing → sung"],
  ["4. Agree","Helping verb agrees with the NEW subject","Letters were written; a letter was written"]]},
 {k:"table", title:"Pronoun change (subject ↔ object form)", head:["Subject form","Object form (after “by”)"], rows:[["I","me"],["we","us"],["you","you"],["he","him"],["she","her"],["it","it"],["they","them"],["who","whom"]]},
 {k:"table", title:"V3 forms SSC uses again and again", head:["V1","V2","V3"], rows:[["write","wrote","written"],["sing","sang","sung"],["teach","taught","taught"],["catch","caught","caught"],["steal","stole","stolen"],["break","broke","broken"],["speak","spoke","spoken"],["choose","chose","chosen"],["bite","bit","bitten"],["hide","hid","hidden"],["lay (put down)","laid","laid"],["tear","tore","torn"],["draw","drew","drawn"],["forgive","forgave","forgiven"],["sow","sowed","sown"],["shake","shook","shaken"]]},
 {k:"ex", src:"PYQ-type · CGL Tier 1 format", q:"Select the option that expresses the given sentence in passive voice.<br><i>She invited us to the party.</i>", steps:["Tense: simple past (invited) → was/were + V3","Object “us” becomes subject “we” → plural → <b>were</b>","Subject “she” goes after “by” in object form → by <b>her</b>"], ans:"We were invited to the party by her.", tip:"Change the pronoun first (us → we), then the helping verb agrees with it."},
 {k:"trap", h:"<b>Agreement with the new subject.</b> <i>The teacher praised the students</i> → <i>The students <b>were</b> praised</i>, not <i>was</i>. The helping verb follows the new subject, not the old one."},
 {k:"trap", h:"<b>Not every object makes a passive.</b> Verbs of state such as <i>have (own), resemble, lack, suit, fit</i> are not changed: <i>She has a car</i> → ✗ <i>A car is had by her</i>."},
 {k:"trick", h:"Write the V3 column on your rough sheet once a week: half the wrong options in SSC use V2 (<i>was wrote, is spoke</i>) or a misspelt V3 (<i>was teached</i>)."},
 {k:"q", q:"Which of these sentences cannot be changed into passive voice?", o:["The baby sleeps peacefully.","The baby drinks milk.","The baby broke the toy.","The baby likes music."], e:"“Sleeps” is intransitive — there is no object to become the subject."},
 {k:"q", q:"In passive voice, “by they” should be written as:", o:["by them","by their","by theirs","by they"], e:"After a preposition we use the object form: them."}
]},
{ id:"L3", heat:3, title:"Present tenses", hi:"वर्तमान काल", blocks:[
 {k:"hot", h:"Present tenses appear in roughly one voice question in six. The present continuous (<b>is being</b>) and the present perfect (<b>has been</b>) are the ones SSC likes most, because the distractors are easy to build."},
 {k:"formula", title:"Present tense table", rows:[
  ["Simple present","V1 / V5 → is / am / are + V3","He writes a letter → A letter is written by him"],
  ["Present continuous","is / am / are + Ving → is / am / are + being + V3","He is writing a letter → A letter is being written by him"],
  ["Present perfect","has / have + V3 → has / have + been + V3","He has written a letter → A letter has been written by him"],
  ["Present perfect continuous","has been + Ving → usually no passive","SSC rarely asks it"]]},
 {k:"ex", src:"PYQ-type · CGL Tier 1 format", q:"Select the option that expresses the given sentence in passive voice.<br><i>The gardener waters the plants every morning.</i>", steps:["Simple present (waters) → is/are + V3","Plants (plural) → <b>are watered</b>","“every morning” stays at the end"], ans:"The plants are watered by the gardener every morning."},
 {k:"ex", src:"PYQ-type · CGL Tier 2 format", q:"Select the option that expresses the given sentence in passive voice.<br><i>The committee is reviewing the new proposal.</i>", steps:["Present continuous (is reviewing) → is/are <b>being</b> + V3","Proposal (singular) → is being reviewed"], ans:"The new proposal is being reviewed by the committee.", tip:"If the active has “-ing”, the passive must have “being”."},
 {k:"trick", h:"<b>Continuous ↔ being, perfect ↔ been.</b> “-ing” in the active → “being” in the passive. “has/have” in the active → “has/have been” in the passive. Options that drop these words are wrong."},
 {k:"trap", h:"<i>Is being written</i> (present continuous) vs <i>has been written</i> (present perfect) vs <i>was being written</i> (past continuous): SSC puts all three in the options. Match the time of the active verb exactly."},
 {k:"q", q:"Passive of: “They have painted the walls.”", o:["The walls have been painted by them.","The walls had been painted by them.","The walls are being painted by them.","The walls has been painted by them."], e:"Present perfect → have been + V3; walls is plural → have."}
]},
{ id:"L4", heat:3, title:"Past tenses", hi:"भूतकाल", blocks:[
 {k:"hot", h:"Past tenses are the <b>single most common</b> voice type in recent SSC shifts — about one question in five. The simple past (<b>was/were + V3</b>) is the easiest mark in the English section."},
 {k:"formula", title:"Past tense table", rows:[
  ["Simple past","V2 → was / were + V3","She sang a song → A song was sung by her"],
  ["Past continuous","was / were + Ving → was / were + being + V3","She was singing a song → A song was being sung by her"],
  ["Past perfect","had + V3 → had + been + V3","She had sung a song → A song had been sung by her"],
  ["Past perfect continuous","had been + Ving → usually no passive","Not asked"]]},
 {k:"ex", src:"PYQ-type · CGL Tier 1 format", q:"Select the option that expresses the given sentence in passive voice.<br><i>The workers were repairing the road.</i>", steps:["Past continuous (were repairing) → was/were <b>being</b> + V3","Road (singular) → <b>was</b> being repaired"], ans:"The road was being repaired by the workers.", tip:"The verb agrees with “road”, not with “workers”."},
 {k:"ex", src:"PYQ-type · CGL Tier 1 format", q:"Select the option that expresses the given sentence in passive voice.<br><i>The police had arrested the thief before sunset.</i>", steps:["Past perfect (had arrested) → had been + V3","“before sunset” stays"], ans:"The thief had been arrested by the police before sunset."},
 {k:"trap", h:"<b>“had” never changes to “has”.</b> <i>had been</i> stays past perfect. Options with <i>has been</i> or <i>was</i> for a past perfect sentence are traps."},
 {k:"trick", h:"Simple past is one word in the active (V2). If the active has only one verb word in the past, the answer is just <b>was/were + V3</b> — no <i>being</i>, no <i>been</i>."},
 {k:"q", q:"Passive of: “The cat was chasing the mice.”", o:["The mice were being chased by the cat.","The mice was being chased by the cat.","The mice were chased by the cat.","The mice had been chased by the cat."], e:"Past continuous → were being + V3; mice is plural."}
]},
{ id:"L5", heat:3, title:"Future tenses & modals", hi:"भविष्य काल और मॉडल", blocks:[
 {k:"hot", h:"Modal verbs (<i>can, must, should, may, have to</i>) have become more frequent since 2023, and <b>modal + have + V3</b> (<i>should have been done</i>) is a Tier 2 favourite."},
 {k:"formula", title:"Future and modal table", rows:[
  ["Simple future","will / shall + V1 → will / shall + be + V3","He will help me → I will be helped by him"],
  ["Future perfect","will have + V3 → will have + been + V3","He will have finished it → It will have been finished by him"],
  ["Future continuous","will be + Ving → usually no passive","Rarely asked"],
  ["Modal + V1","can / could / may / might / must / should / would + V1 → modal + be + V3","You must obey the rules → The rules must be obeyed by you"],
  ["Modal perfect","modal + have + V3 → modal + have been + V3","She should have sent it → It should have been sent by her"],
  ["Going to","is going to + V1 → is going to be + V3","They are going to sell the house → The house is going to be sold by them"],
  ["Have to / used to / ought to","to + V1 → to be + V3","We have to finish it → It has to be finished by us"]]},
 {k:"ex", src:"PYQ-type · CGL Tier 2 format", q:"Select the option that expresses the given sentence in passive voice.<br><i>You should have informed the police.</i>", steps:["Modal perfect (should have informed) → should have <b>been</b> + V3","police → subject"], ans:"The police should have been informed by you."},
 {k:"ex", src:"PYQ-type · CGL Tier 1 format", q:"Select the option that expresses the given sentence in passive voice.<br><i>We have to finish this work today.</i>", steps:["have to + V1 → has/have to <b>be</b> + V3","“this work” is singular → <b>has</b> to be finished"], ans:"This work has to be finished by us today.", tip:"“have to” agrees with the new subject: it has to, they have to."},
 {k:"trap", h:"<b>Modals do not change.</b> <i>can</i> stays <i>can</i>, <i>may</i> stays <i>may</i>. An option with <i>could</i> for <i>can</i> or <i>would</i> for <i>will</i> changes the tense and is wrong."},
 {k:"trick", h:"<b>Modal + be + V3</b> is the whole rule. Never <i>can being</i>, never <i>must been</i> (without have)."},
 {k:"q", q:"Passive of: “Someone must clean the kitchen.”", o:["The kitchen must be cleaned.","The kitchen must been cleaned.","The kitchen must have been cleaned.","The kitchen must being cleaned."], e:"Modal + be + V3; “someone” is dropped as the agent."}
]},
{ id:"L6", heat:2, title:"Imperative sentences", hi:"आज्ञार्थक वाक्य", blocks:[
 {k:"hot", h:"Imperatives (orders, requests, advice) come up in about one question in eight. SSC accepts two forms: <b>Let + object + be + V3</b>, and <b>You are requested / ordered / advised + to + V1</b>."},
 {k:"formula", title:"Imperative patterns", rows:[
  ["Order with object","Let + object + be + V3","Shut the door → Let the door be shut"],
  ["Negative order","Let + object + not + be + V3","Don’t touch the wire → Let the wire not be touched"],
  ["Request (please / kindly)","You are requested to + V1","Please help me → You are requested to help me"],
  ["Order (no object / strong)","You are ordered to + V1","Get out → You are ordered to get out"],
  ["Advice","You are advised to + V1","Work hard → You are advised to work hard"],
  ["Warning","You are warned (not) to + V1","Don’t smoke here → You are warned not to smoke here"],
  ["Let + person + V1 + object","Let + object + be + V3 + by + person","Let him do the work → Let the work be done by him"]]},
 {k:"ex", src:"PYQ-type · CGL Tier 1 format", q:"Select the option that expresses the given sentence in passive voice.<br><i>Please lend me your pen.</i>", steps:["“Please” → request","Request → <b>You are requested to</b> + V1","Keep the rest of the sentence unchanged"], ans:"You are requested to lend me your pen."},
 {k:"ex", src:"PYQ-type · CHSL format", q:"Select the option that expresses the given sentence in passive voice.<br><i>Let her sing a song.</i>", steps:["Let + person + V1 + object → Let + object + be + V3 + by + person","song → Let a song be sung by her"], ans:"Let a song be sung by her."},
 {k:"trap", h:"<i>Let us play cricket</i> is a suggestion: its passive is <i>Let cricket be played by us</i> — not <i>We are requested to play cricket</i>."},
 {k:"trick", h:"Look at the first word. <b>Please / kindly</b> → requested. A bare verb with an object → <b>Let … be …</b>. <b>Don’t</b> → <i>Let … not be …</i> or <i>You are warned/forbidden …</i>."},
 {k:"q", q:"Passive of: “Do not waste your time.”", o:["Let your time not be wasted.","Let your time be not waste.","Your time is not wasted.","Let not waste your time."], e:"Negative imperative → Let + object + not be + V3."}
]},
{ id:"L7", heat:3, title:"Interrogative sentences", hi:"प्रश्नवाचक वाक्य", blocks:[
 {k:"hot", h:"Questions in the passive are asked often, and the options are designed to catch mistakes in word order. The <b>Who → By whom</b> rule appears in some form almost every month."},
 {k:"formula", title:"Question patterns", rows:[
  ["Do / does + V1","Is / am / are + subject + V3","Does he sing songs? → Are songs sung by him?"],
  ["Did + V1","Was / were + subject + V3","Did she write the letter? → Was the letter written by her?"],
  ["Has / have + V3","Has / have + subject + been + V3","Have you finished it? → Has it been finished by you?"],
  ["Is / are + Ving","Is / are + subject + being + V3","Is he writing a book? → Is a book being written by him?"],
  ["Modal question","Modal + subject + be + V3","Can you solve this? → Can this be solved by you?"],
  ["Who …?","By whom + helping verb + subject + V3","Who broke the vase? → By whom was the vase broken?"],
  ["Whom …?","Who + helping verb + subject + V3","Whom did you call? → Who was called by you?"],
  ["Why / when / where / how","Wh-word + helping verb + subject + V3 + by …","Why did he beat the dog? → Why was the dog beaten by him?"],
  ["What + V (what is object)","What + helping verb + V3 + by …","What are you doing? → What is being done by you?"]]},
 {k:"ex", src:"PYQ-type · CGL Tier 1 format", q:"Select the option that expresses the given sentence in passive voice.<br><i>Who wrote this novel?</i>", steps:["Who → <b>By whom</b> at the start","Simple past → was + V3","this novel → subject"], ans:"By whom was this novel written?"},
 {k:"ex", src:"PYQ-type · CGL Tier 2 format", q:"Select the option that expresses the given sentence in passive voice.<br><i>Why did they postpone the meeting?</i>", steps:["Wh-word stays first","did + V1 → was + V3","by them at the end"], ans:"Why was the meeting postponed by them?"},
 {k:"trap", h:"The passive of a question is still a <b>question</b>. Options that end with a full stop or have statement word order (<i>The letter was written by her?</i>) are wrong in SSC answers."},
 {k:"trick", h:"<b>Who and whom swap.</b> <i>Who</i> (doer) → <i>By whom</i>. <i>Whom</i> (receiver) → <i>Who</i>. Remember: by + whom, because after “by” we need the object form."},
 {k:"q", q:"Passive of: “Whom did the manager praise?”", o:["Who was praised by the manager?","By whom was the manager praised?","Whom was praised by the manager?","Who praised the manager?"], e:"Whom (receiver) becomes the subject “Who”; the manager goes after by."}
]},
{ id:"L8", heat:2, title:"Two objects, infinitives & ‘It is said’", hi:"दो कर्म, इन्फ़िनिटिव और 'It is said'", blocks:[
 {k:"hot", h:"These are <b>Tier 2 favourites</b>: sentences with two objects, sentences with <i>that</i>-clauses (<i>People say that …</i>) and infinitives (<i>to be + V3</i>). Expect one in Tier 2 and occasionally one in Tier 1."},
 {k:"formula", title:"Two objects (give, show, tell, teach, offer, send …)", rows:[
  ["Person as subject (preferred)","Person + was/were + V3 + thing + by …","He gave me a book → I was given a book by him"],
  ["Thing as subject","Thing + was + V3 + to + person + by …","He gave me a book → A book was given to me by him"]]},
 {k:"formula", title:"Saying and believing verbs (say, believe, know, think, report)", rows:[
  ["It-form","It + is/was + V3 + that + clause","People say that he is honest → It is said that he is honest"],
  ["Subject-form (same time)","Subject + is/was + V3 + to be …","→ He is said to be honest"],
  ["Subject-form (earlier time)","Subject + is + V3 + to have + V3","People believe that he stole it → He is believed to have stolen it"]]},
 {k:"formula", title:"Infinitives", rows:[
  ["to + V1 with object","to be + V3","It is time to close the shop → It is time for the shop to be closed"],
  ["want / ask + object + to V1","object + to be + V3","I want you to do this → I want this to be done by you"],
  ["Nothing / no time + to V1","to be + V3","There is no time to waste → There is no time to be wasted"]]},
 {k:"ex", src:"PYQ-type · CGL Tier 2 format", q:"Select the option that expresses the given sentence in passive voice.<br><i>People say that honesty is the best policy.</i>", steps:["“People say” → agent is general, so drop it","It + is + said + that + clause"], ans:"It is said that honesty is the best policy.", tip:"With say / believe / know, SSC usually wants the It-form."},
 {k:"ex", src:"PYQ-type · CGL Tier 1 format", q:"Select the option that expresses the given sentence in passive voice.<br><i>The teacher taught us grammar.</i>", steps:["Two objects: us (person), grammar (thing)","Person first: us → We were taught grammar by the teacher"], ans:"We were taught grammar by the teacher."},
 {k:"trap", h:"With the thing as subject, add <b>to</b> before the person: <i>A book was given <b>to</b> me</i>. <i>A book was given me</i> is old-fashioned and SSC treats it as wrong."},
 {k:"trick", h:"If both “person-first” and “thing-first” forms appear in the options, check the other parts (tense, pronoun). Only one option will be fully correct."},
 {k:"q", q:"Passive of: “They offered him a job.”", o:["He was offered a job by them.","He was offering a job by them.","A job was offered by him to them.","He is offered a job by them."], e:"Person as subject, simple past → was offered."}
]},
{ id:"L9", heat:2, title:"Prepositions other than ‘by’, phrasal verbs & gerunds", hi:"‘by’ के अलावा प्रीपोज़िशन, फ़्रेज़ल वर्ब", blocks:[
 {k:"hot", h:"About one question in sixteen, but these are the ones most students get wrong. The fixed prepositions below are tested both in voice and in error-spotting."},
 {k:"table", title:"Verbs that take a preposition other than “by”", head:["Active","Passive"], rows:[
  ["I know him.","He is known <b>to</b> me."],
  ["The news surprised us.","We were surprised <b>at</b> the news."],
  ["Smoke filled the room.","The room was filled <b>with</b> smoke."],
  ["Snow covered the hills.","The hills were covered <b>with</b> snow."],
  ["His work pleased the boss.","The boss was pleased <b>with</b> his work."],
  ["The result satisfied her.","She was satisfied <b>with</b> the result."],
  ["Music interests me.","I am interested <b>in</b> music."],
  ["The jar contains honey.","Honey is contained <b>in</b> the jar."],
  ["His rudeness annoyed me.","I was annoyed <b>at</b> his rudeness."],
  ["The accident shocked us.","We were shocked <b>at</b> the accident."]]},
 {k:"formula", title:"Phrasal verbs and gerunds", rows:[
  ["Phrasal verb","Keep the particle after V3","They looked after the child → The child was looked after by them"],
  ["Laugh at / send for / put off","V3 + particle + by","We sent for the doctor → The doctor was sent for"],
  ["Gerund (-ing) with object","being + V3","I remember my father taking me there → I remember being taken there by my father"],
  ["need / want + -ing","= need to be + V3","The room needs cleaning → The room needs to be cleaned"]]},
 {k:"ex", src:"PYQ-type · CGL Tier 1 format", q:"Select the option that expresses the given sentence in passive voice.<br><i>Everybody laughed at the joker.</i>", steps:["Phrasal verb “laugh at” – keep “at”","Simple past → was + V3","Everybody → by everybody"], ans:"The joker was laughed at by everybody.", tip:"Never drop the particle: “The joker was laughed by everybody” is wrong."},
 {k:"trap", h:"<i>The room was filled <b>by</b> smoke</i> and <i>I am known <b>by</b> him</i> are classic SSC distractors. Learn the table above."},
 {k:"q", q:"Passive of: “The answer surprised the teacher.”", o:["The teacher was surprised at the answer.","The teacher is surprised at the answer.","The teacher was surprised from the answer.","The answer was surprised by the teacher."], e:"surprise → surprised at; simple past → was."}
]},
{ id:"L10", heat:2, title:"Negatives, agent omission & no-passive sentences", hi:"नकारात्मक वाक्य, कर्ता का लोप", blocks:[
 {k:"hot", h:"Negative words and unknown agents appear in about one question in sixteen. They are quick marks once you know three rules."},
 {k:"formula", title:"Negatives", rows:[
  ["not","stays in the same place after the first helping verb","I did not see her → She was not seen by me"],
  ["Nobody / No one","→ not … by anybody / anyone","Nobody saw him → He was not seen by anybody"],
  ["Never","stays: was never + V3","She never tells lies → Lies are never told by her"],
  ["Nothing (as object)","→ Nothing … / not anything","He did nothing → Nothing was done by him"]]},
 {k:"formula", title:"When to drop “by …”", rows:[
  ["Unknown / general agent","someone, somebody, people, they (general), one","Someone has stolen my bag → My bag has been stolen"],
  ["Obvious agent","the police arrest, the court sentences","He was arrested (by the police) – may be dropped"],
  ["Keep it","when the agent is a named person or a pronoun like he, she, us","She cooked dinner → Dinner was cooked by her"]]},
 {k:"ex", src:"PYQ-type · CGL Tier 1 format", q:"Select the option that expresses the given sentence in passive voice.<br><i>Nobody can solve this puzzle.</i>", steps:["Nobody → not … by anybody","Modal → can not be + V3"], ans:"This puzzle cannot be solved by anybody."},
 {k:"trap", h:"<i>This puzzle can be solved by nobody</i> is grammatical but SSC keys <i>cannot be solved by anybody</i>. If both appear, choose the <b>not … anybody</b> form."},
 {k:"trick", h:"<b>No passive:</b> intransitive verbs (sleep, go, come, die), verbs of state (have, resemble, lack, fit, suit) and perfect continuous tenses. If the question asks for one, look for the option that keeps the meaning without inventing a strange verb."},
 {k:"q", q:"Passive of: “Someone has stolen my purse.”", o:["My purse has been stolen.","My purse had been stolen.","My purse has stolen by someone.","My purse was being stolen."], e:"Present perfect → has been + V3; drop the unknown agent “someone”."}
]},
{ id:"L11", heat:2, title:"Passive → active & Tier 2 tricky sentences", hi:"कर्मवाच्य से कर्तृवाच्य · कठिन वाक्य", blocks:[
 {k:"hot", h:"About one SSC voice question in four asks for the <b>active</b> voice. Tier 2 also uses longer sentences with two clauses, causatives and modal perfects."},
 {k:"formula", title:"Passive → active: reverse the steps", rows:[
  ["1. Agent first","The word after “by” becomes the subject (object → subject form)","by him → he"],
  ["2. Remove “be”","Drop the be-form and rebuild the tense on the main verb","was written → wrote; has been written → has written"],
  ["3. Object","The old subject becomes the object (subject → object form)","I → me, they → them"],
  ["4. No agent?","Use a general subject: someone, people, they","The shop was robbed → Someone robbed the shop"],
  ["Let … be …","Back to a bare imperative","Let the door be shut → Shut the door"],
  ["You are requested to …","Please + V1","You are requested to sit → Please sit"]]},
 {k:"ex", src:"PYQ-type · CGL Tier 1 format", q:"Select the option that expresses the given sentence in active voice.<br><i>The match was won by India.</i>", steps:["Agent India → subject","was won → simple past → won"], ans:"India won the match."},
 {k:"ex", src:"PYQ-type · CGL Tier 2 format", q:"Select the option that expresses the given sentence in active voice.<br><i>The documents are being checked by the clerk.</i>", steps:["Agent the clerk → subject (singular)","are being checked → present continuous → <b>is checking</b>"], ans:"The clerk is checking the documents.", tip:"The helping verb now agrees with the new subject (clerk → is)."},
 {k:"formula", title:"Tier 2 tricky types", rows:[
  ["Causative have/get","Already passive in meaning","I had my car repaired = Someone repaired my car for me"],
  ["Two clauses","Change the clause that has the object, keep the rest","He said that he would finish the task → He said that the task would be finished by him"],
  ["Modal perfect","must / might / could + have been + V3","They might have sold the house → The house might have been sold by them"],
  ["Question with tag","Change the main clause and the tag agrees with it","He cleaned it, didn’t he? → It was cleaned by him, wasn’t it?"]]},
 {k:"trap", h:"In passive → active, the commonest trap is <b>wrong tense</b>: <i>was being repaired</i> → <i>were repairing</i> (not <i>repaired</i>), <i>had been finished</i> → <i>had finished</i> (not <i>has finished</i>)."},
 {k:"q", q:"Active of: “A new bridge will be built by the government.”", o:["The government will build a new bridge.","The government would build a new bridge.","The government will be building a new bridge.","The government builds a new bridge."], e:"will be + V3 → will + V1."}
]},
{ id:"L12", heat:3, title:"Recent-pattern mixed set & last-day tips", hi:"नवीन पैटर्न अभ्यास · अंतिम दिन के सुझाव", blocks:[
 {k:"hot", h:"This lesson’s question bank is a <b>mixed set modelled on recent CGL, CHSL and CPO shifts (2023–2025)</b>: everyday sentences (office, school, government, sport, environment), all tense types, and both directions. Do it in one sitting with a 30-second limit per question."},
 {k:"p", h:"<b>What changed recently.</b> Sentences are longer and more formal (<i>The ministry has launched a new scheme for farmers</i>), modals and perfect tenses appear more often, and passive → active is asked more than before. The four steps from L2 still answer every one."},
 {k:"facts", title:"Last-day checklist", rows:[
  ["Tense first","is/was/will + being/been — match it exactly"],
  ["Pronoun case","subject form at the start, object form after “by”"],
  ["V3 spelling","written, chosen, stolen, taught, laid"],
  ["Agreement","helping verb agrees with the new subject"],
  ["Nothing lost","not, never, time words and modals stay"],
  ["Special","Who → By whom; Please → requested; Let … be …; known to; filled with"]]},
 {k:"trick", h:"<b>Time budget:</b> voice and narration should take under 30 seconds each in Tier 1. Use the saved time on reading comprehension and cloze, which take longer."},
 {k:"trick", h:"<b>If two options look correct</b>, compare them word by word. The difference is usually one helping verb or one pronoun — and only one of them matches the tense and case rules."},
 {k:"link", h:"Error-spotting questions sometimes hide a voice error: <i>The letter was wrote by him</i> (V2 for V3) or <i>The room was filled by smoke</i> (wrong preposition). The rules here earn marks there too."}
]}
];

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hash = s => { let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5)+h + s.charCodeAt(i))|0; return "q"+(h>>>0).toString(36); };
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; };
const L = id => LESSONS.find(l => l.id === id);
const LNUM = id => LESSONS.findIndex(l => l.id === id) + 1;

const QS = QB.map(r => {
  const fixed = !!r[6];
  return { t:r[0], q:r[1], o:r[2], e:r[3], p:(r[4]||"").includes("p"), a: fixed ? (r[5]||0) : 0, fixed, id:hash(r[1]) };
});
const byLesson = id => QS.filter(q => q.t === id);
// order of options to show: array of original indexes
const makePerm = q => q.fixed ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i));

const KEY = APP.key;

try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const record = (q, ok) => { S.ans[q.id] = ok ? 1 : 0; save(); renderTop(); };

function renderTop(){
  const ids = Object.keys(S.ans).filter(k => QS.some(q => q.id === k));
  const right = ids.filter(k => S.ans[k] === 1).length;
  const pct = ids.length ? Math.round(right*100/ids.length) : 0;
  $("#topstat").innerHTML = `<b>${ids.length}</b>/${QS.length} tried<br><b>${pct}%</b> right now`;
}

      <div class="row between"><span class="muted num" style="font-size:13px">${done}/${LESSONS.length} lessons done</span>
      ${nextIdx>=0 ? `<button class="btn pri sm" type="button" data-open="${LESSONS[nextIdx].id}">${done? "Continue" : "Start"}: Lesson ${nextIdx+1}</button>` : `<span class="muted" style="font-size:13px">All lessons done. Try a mock test.</span>`}</div>

        <span class="t"><b>${esc(l.title)}<span class="heatb" title="Exam frequency">${"🔥".repeat(l.heat||1)}</span></b><span>${l.hi} · ${n} questions</span></span>
        <span class="sc">${st.best!=null ? `best<br>${st.best}/${n}` : ""}</span></button>`;}).join("")}
    </div>

  </section>`;
  $("#app").querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openLesson(b.dataset.open, "learn")));

function blockHTML(b){

  if (b.k==="formula") return `<div class="block"><h3>${b.title}</h3><div class="fgrid">${b.rows.map(r=>`<div class="fcard"><span class="fn">${r[0]}</span><span class="fx">${r[1]}</span>${r[2]?`<span class="fnote">${r[2]}</span>`:""}</div>`).join("")}</div></div>`;
  if (b.k==="ex") return `<div class="ex"><div class="exhead"><span class="lab">${b.src ? "PYQ-type" : "Solved example"}</span>${b.src?`<span class="src">${b.src}</span>`:""}</div><div class="exq">${b.q}</div>${b.fig?`<figure class="fig">${b.fig}</figure>`:""}<details><summary>Show solution</summary><ol>${b.steps.map(x=>`<li>${x}</li>`).join("")}</ol><div class="exans">Answer: ${b.ans}</div>${b.tip?`<div class="trick" style="margin-top:8px"><span class="lab">Shortcut</span>${b.tip}</div>`:""}</details></div>`;
  if (b.k==="figs") return `<div class="block"><h3>${b.title}</h3><div class="figwrap">${b.items.map(it=>`<figure>${it.svg}<figcaption>${it.cap}</figcaption></figure>`).join("")}</div></div>`;
  if (b.k==="p") return `<div class="plain"><p>${b.h}</p></div>`;
  if (b.k==="trick") return `<div class="trick"><span class="lab">Trick</span>${b.h}</div>`;
  if (b.k==="link") return `<div class="link"><span class="lab">Link · connect the dots</span>${b.h}</div>`;
  if (b.k==="q") { const perm = shuffle(b.o.map((_,i)=>i)); return `<div class="icheck" data-ic><span class="lab">Quick check</span><p class="qt">${esc(b.q)}</p><div class="opts">${perm.map((oi,k)=>`<button type="button" class="opt" data-ioi="${oi}"><span class="k">${"ABCD"[k]}</span><span>${esc(b.o[oi])}</span></button>`).join("")}</div><div class="exp" hidden><b class="okl"></b> ${esc(b.e)}</div></div>`; }
  if (b.k==="hot") return `<div class="hot"><span class="lab">🔥 Exam radar · how often it's asked</span>${b.h}</div>`;
  if (b.k==="trap") return `<div class="trap"><span class="lab">Trap · correction</span>${b.h}</div>`;
  if (b.k==="facts") return `<div class="block"><h3>${b.title}</h3><dl class="facts">${b.rows.map(r=>`<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join("")}</dl></div>`;
  if (b.k==="tl") return `<div class="block"><h3>${b.title}</h3><ul class="tl">${b.rows.map(r=>`<li><span class="y">${r[0]}</span><span>${r[1]}</span></li>`).join("")}</ul></div>`;
  if (b.k==="table") {
    const isNum = (ci) => b.numcol==="all" ? ci>0 : (b.numcol===1 && ci===1) || (typeof b.numcol==="string" && b.numcol.includes(String(ci)));
    return `<div class="block"><h3>${b.title}</h3><div class="tbl"><table><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map((c,ci)=>`<td class="${isNum(ci)?"n":""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  }
  if (b.k==="fig") return `<div class="block"><h3>${b.title}</h3><figure class="fig">${b.svg}<figcaption>${b.cap}</figcaption></figure></div>`;
  if (b.k==="pyr") return `<div class="block"><h3>${b.title}</h3><div class="pyr">${b.items.map(it=>`<div>${PYR(it.rows)}<b>${it.name}</b><span class="muted">${it.note}</span></div>`).join("")}</div><p class="muted" style="font-size:13px;margin-top:8px"><span style="color:var(--blue)">■</span> males · <span style="color:var(--accent)">■</span> females · top = old, base = young</p></div>`;
  return "";
}

let LQ = null;
function openLesson(id, step){
  const l = L(id), i = LNUM(id);
  if (step === "quiz") { LQ = { id, list: shuffle(byLesson(id)).map(q => ({q, perm:makePerm(q)})), i:0, score:0, picked:null }; }
  const head = `<div class="lhead"><button class="back" type="button" id="lback">‹ Lessons</button></div>
    <span class="eyebrow">Lesson ${i} of ${LESSONS.length} · ${l.hi}</span><h1>${esc(l.title)}</h1>
    <div class="steps" role="tablist">
      <button type="button" data-step="learn" aria-current="${step==="learn"?"step":"false"}">1 · Learn</button>
      <button type="button" data-step="quiz" aria-current="${step==="quiz"?"step":"false"}">2 · Quiz</button>
      <button type="button" data-step="sum" aria-current="${step==="sum"?"step":"false"}">3 · Summary</button>
    </div>`;
  let body = "";
  if (step === "learn") {
    body = `<div class="stack">${l.blocks.map(blockHTML).join("")}
      <div class="row end"><button class="btn pri" type="button" id="toquiz">Take the lesson quiz · ${byLesson(id).length} questions</button></div></div>`;
  } else if (step === "quiz") {
    body = `<div id="lq"></div>`;
  } else {
    const nxt = LESSONS[i];
    body = `<div class="stack"><div class="block"><h3>Remember these</h3><ul class="sum">${l.sum.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
      <div class="row between"><button class="btn" type="button" id="relearn">Read again</button>
      ${nxt ? `<button class="btn pri" type="button" id="nextles">Next: ${esc(nxt.title)}</button>` : `<button class="btn pri" type="button" id="tomock">Take a mock test</button>`}</div></div>`;
    S.les[id] = Object.assign(S.les[id]||{}, {done:1}); save();
  }
  $("#app").innerHTML = `<section class="view stack">${head}${body}</section>`;
  $("#lback").onclick = () => renderLearn();
  $("#app").querySelectorAll("[data-step]").forEach(b => b.onclick = () => openLesson(id, b.dataset.step));
  if (step==="learn") { $("#toquiz").onclick = () => openLesson(id,"quiz");
    const ics = l.blocks.filter(b=>b.k==="q");
    $("#app").querySelectorAll("[data-ic]").forEach((box,n) => { const b = ics[n];
      box.querySelectorAll("[data-ioi]").forEach(btn => btn.onclick = () => {
        if (box.dataset.done) return; box.dataset.done = 1; const pick = +btn.dataset.ioi;
        box.querySelectorAll("[data-ioi]").forEach(x => { const oi=+x.dataset.ioi; x.disabled = true; if (oi===0) x.classList.add("ok"); else if (oi===pick) x.classList.add("no"); });
        const ex = box.querySelector(".exp"); ex.hidden = false; const lab = ex.querySelector("b");
        if (pick===0) { lab.textContent = "Correct."; } else { lab.className = "nol"; lab.textContent = "Answer: " + b.o[0] + "."; }
      }); }); }
  if (step==="quiz") renderLQ();
  if (step==="sum") {
    $("#relearn").onclick = () => openLesson(id,"learn");
    const n = $("#nextles"); if (n) n.onclick = () => openLesson(LESSONS[i].id,"learn");
    const m = $("#tomock"); if (m) m.onclick = () => go("mock");
  }
  window.scrollTo(0,0);
}

function optsHTML(q, perm, state){
  // state: {picked: originalIndex|null, reveal: bool, sel: originalIndex|null}
  return perm.map((oi, k) => {
    let cls = "opt";
    if (state.reveal) { if (oi === q.a) cls += " ok"; else if (oi === state.picked) cls += " no"; }
    else if (state.sel === oi) cls += " sel";
    return `<button type="button" class="${cls}" data-oi="${oi}" ${state.reveal?"disabled":""}><span class="k">${"ABCD"[k]}</span><span>${esc(q.o[oi])}</span></button>`;
  }).join("");
}
function expHTML(q, picked){
  const ok = picked === q.a;
  return `<div class="exp">${ok ? `<b class="okl">Correct.</b>` : `<b class="nol">Answer: ${esc(q.o[q.a])}.</b>`} ${esc(q.e)}</div>`;
}
function metaHTML(q, no){
  return `<div class="qmeta"><span class="qno">${no}</span><span class="tag">L${LNUM(q.t)} · ${esc(L(q.t).title)}</span>${q.p?`<span class="tag pyq">High-yield</span>`:""}
  <button type="button" class="bm" data-bm="${q.id}" aria-pressed="${S.bm[q.id]?"true":"false"}" aria-label="Bookmark">${S.bm[q.id]?"★":"☆"}</button></div>`;
}

function renderLQ(){
  const box = $("#lq");
  if (LQ.i >= LQ.list.length) {
    const n = LQ.list.length, l = L(LQ.id);
    const st = S.les[LQ.id] || {}; st.best = Math.max(st.best||0, LQ.score); S.les[LQ.id] = st; save();
    box.innerHTML = `<div class="stack"><div class="block stack"><span class="eyebrow">Quiz done</span>
      <div class="scorebig"><span class="num">${LQ.score}</span><span class="muted">/ ${n} correct</span></div>
      <p class="muted">${LQ.score===n ? "Full marks." : LQ.score >= n*0.8 ? "Strong. Review the ones you missed in Practice → Mistakes." : "Read the lesson once more, then retry. Missed questions are saved under Practice → Mistakes."}</p></div>
      <div class="row between"><button class="btn" type="button" id="retry">Retry quiz</button><button class="btn pri" type="button" id="tosum">See summary</button></div></div>`;
    $("#retry").onclick = () => openLesson(LQ.id,"quiz");
    $("#tosum").onclick = () => openLesson(LQ.id,"sum");
    return;
  }
  const it = LQ.list[LQ.i], q = it.q;
  const reveal = LQ.picked !== null;
  box.innerHTML = `<div class="stack"><div class="meter"><i style="width:${LQ.i/LQ.list.length*100}%"></i></div>
    <article class="qcard">${metaHTML(q, `Q${LQ.i+1}/${LQ.list.length}`)}
    <p class="qt">${esc(q.q)}</p><div class="opts">${optsHTML(q, it.perm, {picked:LQ.picked, reveal})}</div>
    ${reveal ? expHTML(q, LQ.picked) : ""}</article>
    ${reveal ? `<div class="row end"><button class="btn pri" type="button" id="lqnext">${LQ.i+1 < LQ.list.length ? "Next question" : "Finish"}</button></div>` : `<p class="muted" style="font-size:13px">Score so far: <span class="num">${LQ.score}</span></p>`}</div>`;
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (LQ.picked !== null) return;
    LQ.picked = +b.dataset.oi; const ok = LQ.picked === q.a; if (ok) LQ.score++; record(q, ok); renderLQ();
  });
  bindBM(box);
  const nx = $("#lqnext"); if (nx) nx.onclick = () => { LQ.i++; LQ.picked = null; renderLQ(); window.scrollTo(0,0); };
}

function bindBM(root){
  root.querySelectorAll("[data-bm]").forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    const id = b.dataset.bm; if (S.bm[id]) delete S.bm[id]; else S.bm[id] = 1; save();

let PF = "all", PSHOW = 20, PORDER = null, PPERM = {}, PPICK = {};
function practiceList(){
  let list = QS;

  else if (PF === "wrong") list = QS.filter(q => S.ans[q.id] === 0);
  else if (PF === "new") list = QS.filter(q => S.ans[q.id] === undefined);
  else if (PF === "bm") list = QS.filter(q => S.bm[q.id]);
  else if (PF !== "all") list = QS.filter(q => q.t === PF);
  if (PORDER) { const pos = new Map(PORDER.map((id,i)=>[id,i])); list = list.slice().sort((a,b)=>(pos.get(a.id)??0)-(pos.get(b.id)??0)); }

}
function renderPractice(){

    <div class="stack" style="gap:6px"><span class="eyebrow">Question bank</span><h1>Practice</h1>
    <p class="muted">Tap an option to check it. Wrong answers go to <b>Mistakes</b> until you get them right.</p></div>
    <div class="chips" role="group" aria-label="Filter">${chips.map(c=>`<button type="button" class="chip" data-f="${c[0]}" aria-pressed="${PF===c[0]}">${esc(c[1])}</button>`).join("")}</div>
    <div class="row between"><span class="muted num" style="font-size:13px">${list.length} questions</span>

    <div class="stack" id="plist"></div>

  $("#pshuf").onclick = () => { PORDER = PORDER ? null : shuffle(QS.map(q=>q.id)); PSHOW = 20; renderPractice(); };
  const chipOn = $(`.chip[aria-pressed="true"]`); if (chipOn) chipOn.scrollIntoView({block:"nearest", inline:"center"});

}
function pCard(q, idx){
  if (!PPERM[q.id]) PPERM[q.id] = makePerm(q);
  const picked = PPICK[q.id]; const reveal = picked !== undefined;
  return `<article class="qcard" data-q="${q.id}">${metaHTML(q, "Q"+(idx+1))}<p class="qt">${esc(q.q)}</p>
    <div class="opts">${optsHTML(q, PPERM[q.id], {picked: reveal?picked:null, reveal})}</div>${reveal?expHTML(q,picked):""}</article>`;
}
function drawPList(){
  const list = practiceList(), box = $("#plist");
  if (!list.length) { box.innerHTML = `<p class="empty">${PF==="wrong"?"No mistakes saved. Answer some questions first, or you've cleared them all.":PF==="bm"?"Nothing starred yet. Tap ☆ on any question.":"Nothing here."}</p>`; return; }
  box.innerHTML = list.slice(0, PSHOW).map((q,i)=>pCard(q,i)).join("") + (list.length > PSHOW ? `<button class="btn" type="button" id="pmore">Show 20 more (${list.length-PSHOW} left)</button>` : "");
  bindP(box);
  const more = $("#pmore"); if (more) more.onclick = () => { PSHOW += 20; drawPList(); };
}
function bindP(box){ box.querySelectorAll(".qcard").forEach(bindCard); }
function bindCard(card){
  card.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const q = QS.find(x => x.id === card.dataset.q); if (PPICK[q.id] !== undefined) return;
    PPICK[q.id] = +b.dataset.oi; record(q, PPICK[q.id] === q.a);
    const idx = +card.querySelector(".qno").textContent.slice(1) - 1;
    const tmp = document.createElement("div"); tmp.innerHTML = pCard(q, idx); const nc = tmp.firstElementChild;
    card.replaceWith(nc); bindCard(nc);
  });
  bindBM(card);
}

function submitMock(){

}


function drawFlash(box){
  if (!FC) { const pool = FCSCOPE==="all" ? QS : FCSCOPE==="wrong" ? QS.filter(q=>S.ans[q.id]===0) : QS.filter(q=>q.t===FCSCOPE); FC = {list: shuffle(pool), i:0, flip:false, known:0}; }
  const sel = `<select id="fcs" aria-label="Flashcard set"><option value="all">All questions</option><option value="wrong">My mistakes</option>${LESSONS.map((l,i)=>`<option value="${l.id}">L${i+1} · ${esc(l.title)}</option>`).join("")}</select>`;
  if (!FC.list.length || FC.i >= FC.list.length) {
    box.innerHTML = `<div class="row">${sel}</div><div class="block stack"><h3>${FC.list.length ? "Deck finished" : "No cards in this set"}</h3>${FC.list.length?`<p class="muted">You knew ${FC.known} of ${FC.list.length} on first look.</p>`:""}<div class="row"><button class="btn pri" type="button" id="fcr">Shuffle and restart</button></div></div>`;
    $("#fcs").value = FCSCOPE; $("#fcs").onchange = e => { FCSCOPE = e.target.value; FC = null; drawFlash(box); };
    $("#fcr").onclick = () => { FC = null; drawFlash(box); }; return;
  }
  const q = FC.list[FC.i];
  box.innerHTML = `<div class="row between">${sel}<span class="muted num" style="font-size:13px">${FC.i+1}/${FC.list.length}</span></div>
    <button type="button" class="flash" id="fcard" aria-label="Flip card">
      <span class="side">${FC.flip?"Answer":"Question · tap to flip"}</span>
      <span class="front">${esc(q.q)}</span>
      ${FC.flip ? `<span class="ans">${esc(q.o[q.a])}</span><span class="muted">${esc(q.e)}</span>` : ""}
    </button>
    <div class="row between"><button class="btn" type="button" id="fca" ${FC.flip?"":"disabled"}>Again later</button><button class="btn pri" type="button" id="fck" ${FC.flip?"":"disabled"}>Got it</button></div>`;
  $("#fcs").value = FCSCOPE; $("#fcs").onchange = e => { FCSCOPE = e.target.value; FC = null; drawFlash(box); };
  $("#fcard").onclick = () => { FC.flip = !FC.flip; drawFlash(box); };
  $("#fca").onclick = () => { FC.list.push(q); FC.list.splice(FC.i,1); FC.flip=false; drawFlash(box); };
  $("#fck").onclick = () => { FC.known++; FC.i++; FC.flip=false; drawFlash(box); };
}

/* boot */
renderTop();
const start = (location.hash||"").replace("#","");
go(["learn","practice","mock","revise"].includes(start) ? start : "learn");
</script>

  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();
</script>

<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>

<title>Indian Geography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Shared by every History page (built by tools/history/build.js).
   Layout: a manuscript folio — parchment paper, maroon ink, gold figures; one-column app with a bottom tab bar. */
:root{
  --paper:#f3efe4; --sheet:#fffdf6; --sunk:#e8e1cf;
  --ink:#241c14; --ink2:#5d5141; --rule:#d8cdb4;
  --blue:#7a2230; --on-blue:#ffffff; --blue-bg:#f4e2e1;
  --accent:#9a6a12; --accent-bg:#f8ecc9;
  --good:#1b6b4a; --good-bg:#ddefe4; --bad:#a8291f; --bad-bg:#f8e0dc;
  --warn-bg:#fcf0cf;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* era groups on the Learn screen */
.eras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.erac{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:grid;gap:6px}
.erac b{font-family:var(--f-display);font-size:15px;font-weight:700;line-height:1.25}
.erac .hi{font-size:12px;color:var(--ink2)}
.erac .mt{font-family:var(--f-num);font-size:11px;color:var(--ink2)}
.erac .meter{height:6px}
.erac[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.grph{display:flex;align-items:baseline;gap:8px;padding:14px 2px 4px;border-top:2px solid var(--ink);margin-top:4px}
.grph h2{font-size:17px}
.grph span{font-size:12px;color:var(--ink2);margin-left:auto;font-family:var(--f-num)}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}
.dots{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--rule);display:block}
.dots i.on{background:var(--accent)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.hot{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px;font-size:15px}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.facts.prose dd{font-weight:400;line-height:1.55}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap,.link{border-radius:var(--r);padding:12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.link{background:var(--sunk);border-color:transparent}
.trick .lab,.trap .lab,.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.link .lab{color:var(--ink2)}
.mn{font-family:var(--f-num);font-weight:600;background:var(--sheet);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.tag.src{background:var(--good-bg);color:var(--good)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:22px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
/* one-line revision rows (last week / last moment) */
.lines{display:grid;gap:0}
.lines div{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px dashed var(--rule);font-size:15px}
.lines div:first-child{border-top:0}
.lines b{font-weight:700}
.lines span{color:var(--ink2)}
.callout{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;font-size:15px}

/* plan maker */
.plancfg{display:grid;gap:12px}
.pday{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.pday > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pday > summary::-webkit-details-marker{display:none}
.pday .dno{font-family:var(--f-num);font-weight:700;font-size:13px;background:var(--sunk);border-radius:99px;padding:2px 10px;white-space:nowrap}
.pday.cur .dno{background:var(--blue);color:var(--on-blue)}
.pday.allgood .dno{background:var(--good-bg);color:var(--good)}
.pday .dt{min-width:0;font-weight:600;font-size:15px}
.pday .dt small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
.pday .dp{font-family:var(--f-num);font-size:12px;color:var(--ink2);white-space:nowrap}
.pday .body{padding:0 14px 12px;display:grid;gap:8px;border-top:1px dashed var(--rule);margin-top:2px;padding-top:10px}
.ptask{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;width:100%;font-size:15px}
.ptask .box{width:22px;height:22px;border-radius:6px;border:1.6px solid var(--rule);display:grid;place-items:center;font-size:14px;color:var(--on-blue);margin-top:1px}
.ptask[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.ptask[aria-pressed="true"] .lbl{text-decoration:line-through;color:var(--ink2)}
.ptask .lbl small{display:block;font-size:12px;color:var(--ink2);text-decoration:none}
/* the story first: plain-language opener for beginners */
.story{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;font-size:16.5px;line-height:1.65}
.story .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.story p{margin:0}
.story .key{background:var(--blue-bg);border-radius:8px;padding:8px 12px;font-size:15px;line-height:1.5}
.story .key b{color:var(--blue)}
/* hub: app cards and the beginner path */
.appcs{display:grid;gap:12px}
.appc{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;text-align:left;width:100%;cursor:pointer}
.appc:hover{border-color:var(--blue)}
.appc .hd{display:flex;align-items:center;gap:10px}
.appc .ic{font-size:26px;line-height:1}
.appc .hd b{font-family:var(--f-display);font-size:17px;font-weight:700;display:block}
.appc .hd small{font-size:12px;color:var(--ink2)}

{"id":"G1","heat":3,"title":"India: location, size and borders","hi":"भारत: स्थिति, विस्तार और सीमाएँ","blocks":[{"k":"hot","h":"Asked again and again: the <b>Tropic of Cancer's 8 states<\/b>, the <b>Standard Meridian (82°30′E, Mirzapur)<\/b>, the <b>longest border (Bangladesh)<\/b> and shortest (Afghanistan), and the <b>Radcliffe, McMahon and Durand lines<\/b>."},{"k":"story","h":"<p>India lies wholly in the <b>northern and eastern hemispheres<\/b>, between latitudes <b>8°4′N and 37°6′N<\/b> and longitudes <b>68°7′E and 97°25′E<\/b>. The <b>Tropic of Cancer<\/b> (23°30′N) cuts it almost in half and crosses eight states. With <b>32.87 lakh km²<\/b> it is the <b>7th largest<\/b> country (2.4% of the world's land) — 3,214 km from north to south and 2,933 km from east to west.<\/p><p>The sun rises in Arunachal about <b>two hours<\/b> before it does in Gujarat, so India keeps one time, set by the <b>82°30′E<\/b> meridian through <b>Mirzapur<\/b> (UP) — 5½ hours ahead of GMT. Seven countries touch India by land; <b>Bangladesh<\/b> has the longest border and <b>Afghanistan<\/b> the shortest. Across the sea lie <b>Sri Lanka<\/b> and the <b>Maldives<\/b>.<\/p>","key":"8°4′N–37°6′N, 68°7′E–97°25′E; 7th largest, 2.4%; IST 82°30′E (Mirzapur); longest border Bangladesh, shortest Afghanistan."},{"k":"facts","title":"India at a glance (as of October 2026)","rows":[["Area","32,87,263 km² — 7th largest (after Russia, Canada, USA, China, Brazil, Australia)"],["Tropic of Cancer states (8)","Gujarat, Rajasthan, Madhya Pradesh, Chhattisgarh, Jharkhand, West Bengal, Tripura, Mizoram"],["Standard Meridian 82°30′E crosses","Uttar Pradesh, Madhya Pradesh, Chhattisgarh, Odisha, Andhra Pradesh"],["Land border","About 15,107 km with 7 countries"],["Coastline","7,516.6 km by the old count; re-measured at 11,098.81 km (published 2025)"],["Coastal states","9 — Gujarat (longest coast), Maharashtra, Goa, Karnataka, Kerala, Tamil Nadu, Andhra Pradesh, Odisha, West Bengal"],["States and UTs","28 states, 8 Union Territories; largest state Rajasthan, smallest Goa; largest UT Ladakh"],["Census 2011 (basics)","121.09 crore people; density 382/km²; sex ratio 943; literacy 74.04%; most populous Uttar Pradesh"],["Next Census","Census 2027 — reference date 1 March 2027 (1 October 2026 for snow-bound areas)"]]},{"k":"table","title":"Land neighbours and border length","head":["Country","Border with India","States / UTs on that border"],"rows":[["Bangladesh","4,096.7 km","India's longest land border; touches West Bengal, Assam, Meghalaya, Tripura and Mizoram."],["China","3,488 km","Touches Ladakh, Himachal Pradesh, Uttarakhand, Sikkim and Arunachal Pradesh."],["Pakistan","3,323 km","Touches Gujarat, Rajasthan, Punjab, Jammu and Kashmir and Ladakh."],["Nepal","1,751 km","Touches Uttarakhand, Uttar Pradesh, Bihar, West Bengal and Sikkim."],["Myanmar","1,643 km","Touches Arunachal Pradesh, Nagaland, Manipur and Mizoram."],["Bhutan","699 km","Touches Sikkim, West Bengal, Assam and Arunachal Pradesh."],["Afghanistan","106 km","India's shortest land border — through Gilgit-Baltistan (PoK), shown in Ladakh on India's map."]]},{"k":"table","title":"Famous lines","head":["Line","Between","Note"],"rows":[["Radcliffe Line","India and Pakistan","Drawn by Cyril Radcliffe in 1947; the eastern part is now the India–Bangladesh border."],["McMahon Line","India and China","Drawn at the Simla Convention, 1914; runs along Arunachal Pradesh. China does not accept it."],["Durand Line","Pakistan and Afghanistan","Drawn in 1893 by Mortimer Durand between British India and Afghanistan."],["Line of Control (LoC)","India and Pakistan","The ceasefire line in Jammu and Kashmir (1972 Simla Agreement)."],["Line of Actual Control (LAC)","India and China","The working boundary in Ladakh and the east."],["Sir Creek","India and Pakistan","A disputed tidal estuary between Kutch (Gujarat) and Sindh."]]},{"k":"table","title":"Extreme points","head":["Point","Place","Where"],"rows":[["Northernmost point (as claimed)","Indira Col","On the Siachen glacier, Ladakh."],["Southernmost point","Indira Point","Great Nicobar Island, about 6°45′N; went under the sea in the 2004 tsunami."],["Southernmost point of the mainland","Kanyakumari","Cape Comorin, Tamil Nadu — where three seas meet."],["Easternmost point","Kibithu","In Arunachal Pradesh, on the Lohit river."],["Westernmost point","Guhar Moti","In Kutch, Gujarat, near Sir Creek."]]},{"k":"trick","h":"Tropic of Cancer states, west to east: <b>“Go Run Most Clever Journey With Tiger Mom”<\/b> — Gujarat, Rajasthan, MP, Chhattisgarh, Jharkhand, West Bengal, Tripura, Mizoram. Border lengths: <b>“Big China Pakistan Never Meet By Accident”<\/b> — Bangladesh > China > Pakistan > Nepal > Myanmar > Bhutan > Afghanistan."},{"k":"trap","h":"The Tropic of Cancer does <b>not<\/b> touch Odisha, Bihar, Assam or Uttar Pradesh. <b>McMahon<\/b> = India–China (Arunachal); <b>Durand<\/b> = Pakistan–Afghanistan, not India. <b>Indira Point<\/b> is the southernmost point of India; <b>Kanyakumari<\/b> only of the mainland."}],"sum":["India lies between 8°4′N–37°6′N and 68°7′E–97°25′E; it is the 7th largest country (2.4% of world land).","The Tropic of Cancer crosses 8 states, from Gujarat to Mizoram.","Indian Standard Time is set by 82°30′E, which passes through Mirzapur (UP).","Bangladesh has the longest land border, Afghanistan the shortest.","Radcliffe Line — India–Pakistan; McMahon Line — India–China; Durand Line — Pakistan–Afghanistan."],"part":["Part 1 · Location and landforms","स्थिति और भू-आकृतियाँ"],"g":"ig"},
{"id":"G2","heat":3,"title":"The Himalaya: ranges, peaks and passes","hi":"हिमालय: श्रेणियाँ, चोटियाँ और दर्रे","blocks":[{"k":"hot","h":"Most asked: <b>which state a pass is in<\/b> (Zoji La, Rohtang, Shipki La, Nathu La, Bomdi La), the <b>three parallel ranges<\/b> (Himadri, Himachal, Shiwalik), and the <b>highest peaks<\/b> (K2, Kangchenjunga, Nanda Devi)."},{"k":"story","h":"<p>The Himalaya are <b>young fold mountains<\/b>, pushed up when the Indian plate ran into Asia. They curve for about <b>2,400 km<\/b> from the Indus to the Brahmaputra. From north to south there are three parallel ranges: the <b>Greater Himalaya (Himadri)<\/b> with the highest snowy peaks; the <b>Lesser Himalaya (Himachal)<\/b> with ranges like Pir Panjal and Dhauladhar and hill towns like Shimla; and the low <b>Shiwaliks<\/b>, with flat valleys called <b>duns<\/b> behind them.<\/p><p>North of the Himadri lie the <b>Trans-Himalaya<\/b> — Karakoram, Ladakh and Zaskar ranges — where <b>K2<\/b> stands. In the east the mountains turn south as the <b>Purvanchal<\/b>: Patkai Bum, Naga hills and Mizo hills. The few gaps through the wall are the <b>passes<\/b> — Zoji La, Rohtang, Shipki La, Nathu La and Bomdi La.<\/p>","key":"Himadri (highest) → Himachal (middle) → Shiwalik (lowest); Trans-Himalaya to the north; Purvanchal in the east."},{"k":"table","title":"Peaks","head":["Peak","Where","Remember"],"rows":[["Mount Everest","Nepal","8,849 m — the world's highest; Sagarmatha in Nepal."],["K2 (Godwin Austen)","Gilgit-Baltistan (PoK)","8,611 m — India's highest peak as per India's map."],["Kangchenjunga","Sikkim","8,586 m — highest peak in Indian-administered territory; third in the world."],["Nanda Devi","Uttarakhand","7,816 m — highest peak lying wholly inside India."],["Kamet","Uttarakhand","7,756 m."],["Trisul","Uttarakhand",""],["Saltoro Kangri","Ladakh","Near the Siachen glacier."],["Saser Kangri","Ladakh",""],["Nun","Ladakh","Highest peak of the Nun Kun massif in the Zanskar range."],["Reo Purgyil","Himachal Pradesh","Highest peak of Himachal Pradesh."],["Kangto","Arunachal Pradesh","Highest peak of Arunachal Pradesh."],["Saramati","Nagaland","Highest peak of Nagaland (Patkai–Naga hills)."],["Phawngpui (Blue Mountain)","Mizoram","Highest peak of Mizoram."],["Makalu","Nepal",""],["Dhaulagiri","Nepal",""],["Namcha Barwa","Tibet (China)","The Brahmaputra takes its great U-turn round it."]]},{"k":"table","title":"Passes","head":["Pass","State / UT","Remember"],"rows":[["Zoji La","Ladakh","Links Srinagar with Leh (Kargil district); Zojila tunnel being built."],["Khardung La","Ladakh","On the road from Leh to the Nubra valley."],["Chang La","Ladakh","On the road from Leh to Pangong Tso."],["Karakoram Pass","Ladakh","On the old trade route to Xinjiang."],["Banihal Pass","Jammu and Kashmir","Jammu–Srinagar road; Jawahar tunnel."],["Pir Panjal Pass","Jammu and Kashmir","On the Mughal Road."],["Rohtang Pass","Himachal Pradesh","Links Kullu with Lahaul–Spiti; Atal Tunnel runs under it."],["Shipki La","Himachal Pradesh","The Sutlej enters India here from Tibet."],["Baralacha La","Himachal Pradesh","On the Manali–Leh road."],["Lipulekh","Uttarakhand","Route to Kailash–Mansarovar."],["Mana Pass","Uttarakhand","Near Badrinath."],["Niti Pass","Uttarakhand",""],["Nathu La","Sikkim","On the old silk route to Tibet; border trade with China."],["Jelep La","Sikkim","Links Sikkim with the Chumbi valley of Tibet."],["Bomdi La","Arunachal Pradesh","On the way to Tawang."],["Bum La","Arunachal Pradesh","Near Tawang."],["Diphu Pass","Arunachal Pradesh","Near the India–China–Myanmar tri-junction."],["Pangsau Pass","Arunachal Pradesh","To Myanmar — on the old Stilwell Road."]]},{"k":"table","title":"Ranges","head":["Range","Part of","Remember"],"rows":[["Karakoram","Trans-Himalaya","Home of K2 and the Siachen glacier."],["Ladakh range","Trans-Himalaya",""],["Zaskar range","Trans-Himalaya",""],["Himadri","Greater Himalaya","The highest, snow-covered inner range."],["Pir Panjal","Lesser Himalaya (Himachal)","Longest range of the Lesser Himalaya, in Jammu and Kashmir."],["Dhauladhar","Lesser Himalaya (Himachal)","Above Dharamshala, Himachal Pradesh."],["Mahabharat range","Lesser Himalaya (Himachal)","In Nepal."],["Shiwalik","Outer Himalaya","The lowest, youngest range; duns lie behind it."],["Patkai Bum","Purvanchal","Arunachal–Myanmar border."],["Naga hills","Purvanchal",""],["Mizo (Lushai) hills","Purvanchal",""]]},{"k":"facts","title":"Sections of the Himalaya from west to east (by rivers)","rows":[["Punjab (Kashmir) Himalaya","Between the Indus and Sutlej"],["Kumaon Himalaya","Between the Sutlej and Kali"],["Nepal Himalaya","Between the Kali and Teesta"],["Assam Himalaya","Between the Teesta and Dihang (Brahmaputra)"]]},{"k":"trick","h":"Passes by state: <b>“Zoji-Khardung-Chang in Ladakh; Rohtang-Shipki-Baralacha in Himachal; Lipu-Mana-Niti in Uttarakhand; Nathu-Jelep in Sikkim; Bomdi-Bum in Arunachal.”<\/b> Sections: <b>“I Saw Kali Teesta Dancing”<\/b> — Indus, Sutlej, Kali, Teesta, Dihang."},{"k":"trap","h":"<b>Shipki La<\/b> is in Himachal (Sutlej enters India) — not Sikkim. <b>Nanda Devi<\/b> is the highest peak <b>wholly in India<\/b>; <b>Kangchenjunga<\/b> is shared with Nepal; <b>K2<\/b> lies in PoK. <b>Pir Panjal<\/b> and <b>Dhauladhar<\/b> belong to the <b>Lesser<\/b> Himalaya."}],"sum":["The Himalaya are young fold mountains about 2,400 km long.","Three ranges: Himadri (Greater), Himachal (Lesser), Shiwalik (Outer); duns lie between Himachal and Shiwalik.","K2 (8,611 m) is India's highest peak as per India's map; Kangchenjunga (8,586 m) is in Sikkim; Nanda Devi is the highest wholly in India.","Passes: Zoji La, Khardung La (Ladakh); Rohtang, Shipki La (Himachal); Lipulekh (Uttarakhand); Nathu La (Sikkim); Bomdi La (Arunachal).","Purvanchal = Patkai Bum, Naga hills, Mizo hills in the north-east."],"part":["Part 1 · Location and landforms","स्थिति और भू-आकृतियाँ"],"g":"ig"},
{"id":"G3","heat":2,"title":"Northern plains, plateaus and hills","hi":"उत्तरी मैदान, पठार और पहाड़ियाँ","blocks":[{"k":"hot","h":"Favourites: <b>Bhabar, Terai, Bhangar, Khadar<\/b>; the <b>highest peaks<\/b> of the south (Anamudi, Doddabetta, Guru Shikhar); <b>Western vs Eastern Ghats<\/b>; and which state a plateau is in (Chotanagpur — Jharkhand)."},{"k":"story","h":"<p>The <b>Northern Plains<\/b> were built by the Indus, Ganga and Brahmaputra from silt. Coming down from the hills you cross four belts: <b>Bhabar<\/b> (pebbles, streams vanish), <b>Terai<\/b> (marshy, streams re-appear), then <b>Bhangar<\/b> (old alluvium with kankar) and <b>Khadar<\/b> (fresh alluvium of flood plains).<\/p><p>South of the plains is the <b>Peninsular Plateau<\/b>, made of the oldest rocks. The <b>Central Highlands<\/b> (Malwa, Bundelkhand, Chotanagpur) lie north of the Narmada; the <b>Deccan Plateau<\/b> lies south. It is edged by the <b>Western Ghats<\/b> — high and unbroken, with <b>Anamudi<\/b> (2,695 m) the highest peak of the south — and the low, broken <b>Eastern Ghats<\/b>. The <b>Aravallis<\/b>, among the oldest fold mountains in the world, rise to <b>Guru Shikhar<\/b> at Mount Abu.<\/p>","key":"Bhabar → Terai → Bhangar → Khadar; Anamudi highest in south; Guru Shikhar highest of Aravallis; Chotanagpur = mineral heartland."},{"k":"table","title":"Words of the Northern Plains","head":["Word","Meaning","Note"],"rows":[["Bhabar","Belt of pebbles at the foot of the Shiwaliks where streams disappear","8–16 km wide."],["Terai","Wet, marshy belt south of the Bhabar where streams re-appear","Thick forest and wildlife."],["Bhangar","Older alluvium, above flood level, with kankar",""],["Khadar","Newer alluvium on the flood plains, renewed every year","Very fertile."],["Doab","Land between two rivers","Ganga–Yamuna doab is the best known."],["Dun","Long valley between the Lesser Himalaya and the Shiwaliks","Dehradun, Kotli Dun, Patli Dun."]]},{"k":"table","title":"Plateaus","head":["Plateau","State","Note"],"rows":[["Chotanagpur plateau","Jharkhand","India's 'mineral heartland'."],["Malwa plateau","Madhya Pradesh","Black soil lava plateau."],["Baghelkhand","Madhya Pradesh",""],["Meghalaya (Shillong) plateau","Meghalaya","Cut off from the main plateau by the Garo–Rajmahal gap."],["Karbi Anglong plateau","Assam",""],["Deccan lava (trap) plateau","Maharashtra",""],["Telangana plateau","Telangana",""],["Mysore plateau","Karnataka",""],["Dandakaranya","Chhattisgarh and Odisha",""],["Marwar upland","Rajasthan",""]]},{"k":"table","title":"Peaks and hills of the peninsula and the north-east","head":["Peak / hills","State","Remember"],"rows":[["Anamudi","Kerala","2,695 m — highest peak of South India (Anaimalai hills)."],["Doddabetta","Tamil Nadu","2,637 m — highest peak of the Nilgiris."],["Guru Shikhar","Rajasthan","1,722 m — highest point of the Aravallis (Mount Abu)."],["Dhupgarh","Madhya Pradesh","Highest peak of the Satpuras (Pachmarhi)."],["Kalsubai","Maharashtra","Highest peak of Maharashtra."],["Mullayanagiri","Karnataka","Highest peak of Karnataka."],["Jindhagada (Arma Konda)","Andhra Pradesh","Highest peak of the Eastern Ghats."],["Deomali","Odisha","Highest peak of Odisha."],["Parasnath","Jharkhand","Highest peak of Jharkhand; a Jain pilgrimage."],["Shillong Peak","Meghalaya",""],["Girnar","Gujarat",""],["Saddle Peak","Andaman and Nicobar Islands","Highest point of the Andamans."],["Cardamom hills","Kerala",""],["Palani hills","Tamil Nadu","Kodaikanal."],["Shevaroy hills","Tamil Nadu","Yercaud."],["Nallamala hills","Andhra Pradesh",""],["Garo, Khasi and Jaintia hills","Meghalaya",""],["Mikir (Karbi) hills","Assam",""],["Rajmahal hills","Jharkhand",""],["Mahadeo hills","Madhya Pradesh",""]]},{"k":"facts","title":"Western Ghats vs Eastern Ghats","rows":[["Western Ghats (Sahyadri)","Continuous, higher (900–1,600 m); Tapi mouth to Kanyakumari; highest Anamudi"],["Eastern Ghats","Broken by rivers, lower (about 600 m); highest Jindhagada (Arma Konda)"],["Where they meet","Nilgiri hills — Doddabetta"],["Gaps in the Western Ghats","Thal Ghat and Bhor Ghat (Maharashtra), Palghat gap (Kerala)"],["Oldest fold mountains","Aravallis — Gujarat to Delhi"]]},{"k":"trick","h":"Coming down from the hills: <b>“Boys Throw Big Kites”<\/b> — Bhabar, Terai, Bhangar, Khadar. <b>Khadar = new<\/b> (think ‘khadi is fresh cloth’)."},{"k":"trap","h":"<b>Bhangar<\/b> is old, <b>Khadar<\/b> is new — students swap them. <b>Anamudi<\/b> (Kerala) is higher than <b>Doddabetta<\/b> (Tamil Nadu). The <b>Meghalaya plateau<\/b> is part of the Peninsular Plateau, not the Himalaya."}],"sum":["The Northern Plains are made of river silt: Bhabar, Terai, Bhangar (old) and Khadar (new).","The Peninsular Plateau has the Central Highlands (Malwa, Chotanagpur) and the Deccan Plateau.","Western Ghats are higher and continuous; Eastern Ghats are low and broken; they meet in the Nilgiris.","Anamudi (Kerala) is the highest peak of the south; Guru Shikhar the highest of the Aravallis.","Chotanagpur plateau (Jharkhand) is India's mineral heartland."],"part":["Part 1 · Location and landforms","स्थिति और भू-आकृतियाँ"],"g":"ig"},
{"id":"G4","heat":2,"title":"Coasts and islands","hi":"तट और द्वीप","blocks":[{"k":"hot","h":"Asked often: <b>which coast is in which state<\/b> (Konkan, Malabar, Coromandel, Northern Circars), <b>Barren Island<\/b> (only active volcano), <b>Majuli<\/b> (largest river island), and the <b>channels<\/b> — Ten Degree, Nine Degree, Eight Degree and Palk Strait."},{"k":"story","h":"<p>The <b>western coastal plain<\/b> is narrow and lies between the Western Ghats and the Arabian Sea: Kachchh–Kathiawar (Gujarat), <b>Konkan<\/b> (Maharashtra–Goa), <b>Kanara<\/b> (Karnataka) and <b>Malabar<\/b> (Kerala, with its backwaters). The <b>eastern coastal plain<\/b> is wide, with big deltas: <b>Utkal<\/b> (Odisha), <b>Northern Circars<\/b> (Andhra) and <b>Coromandel<\/b> (Tamil Nadu).<\/p><p>India has two island groups. The <b>Andaman and Nicobar Islands<\/b> in the Bay of Bengal are the tops of drowned mountains; <b>Barren Island<\/b> is India's only active volcano, and the <b>Ten Degree Channel<\/b> separates the Andamans from the Nicobars. <b>Lakshadweep<\/b> in the Arabian Sea is made of <b>coral<\/b>; its capital is <b>Kavaratti<\/b>. Port Blair was renamed <b>Sri Vijaya Puram<\/b> in 2024.<\/p>","key":"West coast: Konkan, Kanara, Malabar; east coast: Utkal, Northern Circars, Coromandel; Barren Island = active volcano; Lakshadweep = coral."},{"k":"table","title":"Coastal plains","head":["Coast","State","Note"],"rows":[["Kachchh and Kathiawar coast","Gujarat",""],["Konkan coast","Maharashtra","From Mumbai down to Goa."],["Kanara coast","Karnataka",""],["Malabar coast","Kerala","Backwaters (kayals)."],["Coromandel coast","Tamil Nadu",""],["Northern Circars","Andhra Pradesh",""],["Utkal coast","Odisha",""]]},{"k":"table","title":"Islands","head":["Island","State / UT","Remember"],"rows":[["Majuli","Assam","World's largest river island (Brahmaputra); India's first island district, 2016."],["Umananda","Assam","Tiny river island in the Brahmaputra at Guwahati."],["Sriharikota","Andhra Pradesh","ISRO's Satish Dhawan Space Centre."],["Wheeler Island (A. P. J. Abdul Kalam Island)","Odisha","Missile test range."],["Pamban (Rameswaram)","Tamil Nadu","Joined to the mainland by the Pamban bridges."],["Srirangam","Tamil Nadu","River island in the Kaveri."],["Elephanta","Maharashtra","Rock-cut caves near Mumbai."],["Salsette","Maharashtra","Mumbai stands on it."],["Divar","Goa",""],["Willingdon Island","Kerala","Man-made island at Kochi port."],["Barren Island","Andaman and Nicobar Islands","India's only active volcano."],["Narcondam","Andaman and Nicobar Islands","A dormant volcano."],["Minicoy","Lakshadweep","Southernmost island of Lakshadweep."],["Kavaratti","Lakshadweep","Capital of Lakshadweep."],["Diu","Dadra and Nagar Haveli and Daman and Diu",""]]},{"k":"table","title":"Straits and channels","head":["Water body","Separates","Note"],"rows":[["Palk Strait","India and Sri Lanka","Between Tamil Nadu and Sri Lanka."],["Ten Degree Channel","Andaman and Nicobar groups","Between Little Andaman and Car Nicobar."],["Nine Degree Channel","Minicoy and the main Lakshadweep group",""],["Eight Degree Channel","Minicoy and the Maldives",""],["Duncan Passage","South Andaman and Little Andaman",""],["Coco Channel","North Andaman and the Coco Islands (Myanmar)",""],["Six Degree (Great) Channel","Great Nicobar and Sumatra (Indonesia)",""]]},{"k":"trick","h":"Channels count down as you go south-west: <b>Ten<\/b> (Andaman | Nicobar), <b>Nine<\/b> (Lakshadweep | Minicoy), <b>Eight<\/b> (Minicoy | Maldives). West coast top to bottom: <b>“Kids Know Karate Moves”<\/b> — Kachchh, Konkan, Kanara, Malabar."},{"k":"trap","h":"<b>Coromandel<\/b> is Tamil Nadu, not Andhra (that is the <b>Northern Circars<\/b>). <b>Sriharikota<\/b> is in Andhra Pradesh; <b>Wheeler (Abdul Kalam) Island<\/b> is in Odisha. <b>Narcondam<\/b> is dormant; only <b>Barren Island<\/b> is active."}],"sum":["West coast plains: Kachchh–Kathiawar, Konkan, Kanara, Malabar — narrow.","East coast plains: Utkal, Northern Circars, Coromandel — wide, with deltas.","Andaman and Nicobar: Barren Island is India's only active volcano; Ten Degree Channel divides the two groups.","Lakshadweep is coral; capital Kavaratti; Eight Degree Channel separates Minicoy from the Maldives.","Majuli (Assam) is the largest river island; Palk Strait separates India and Sri Lanka."],"part":["Part 1 · Location and landforms","स्थिति और भू-आकृतियाँ"],"g":"ig"},
{"id":"G5","heat":3,"title":"Himalayan rivers: Indus, Ganga, Brahmaputra","hi":"हिमालयी नदियाँ: सिंधु, गंगा, ब्रह्मपुत्र","blocks":[{"k":"hot","h":"Most asked: <b>where a river rises<\/b> (Gangotri, Yamunotri, Mansarovar), <b>which river a tributary joins<\/b> (Chambal → Yamuna, Son → Ganga, Beas → Sutlej), the <b>Panch Prayag<\/b> and the <b>Indus Waters Treaty (1960)<\/b>."},{"k":"story","h":"<p>Three great rivers rise behind the Himalaya near <b>Lake Mansarovar<\/b> in Tibet: the <b>Indus<\/b>, the <b>Sutlej<\/b> and the <b>Brahmaputra (Tsangpo)<\/b>. The Indus flows west through Ladakh to Pakistan, picking up the five rivers of Punjab — <b>Jhelum, Chenab, Ravi, Beas and Sutlej<\/b>. Under the <b>Indus Waters Treaty (1960)<\/b> India got the eastern rivers (Ravi, Beas, Sutlej) and Pakistan the western ones (Indus, Jhelum, Chenab); India put the treaty in abeyance in April 2025.<\/p><p>The <b>Ganga<\/b> begins as the <b>Bhagirathi<\/b> at Gangotri (Gaumukh). The <b>Alaknanda<\/b> collects four rivers at four prayags and meets the Bhagirathi at <b>Devprayag<\/b>, where the Ganga is born. The <b>Yamuna<\/b> joins at <b>Prayagraj<\/b>; Ghaghara, Gandak and Kosi join from the north; <b>Son<\/b> from the south. In Bangladesh the Ganga is the <b>Padma<\/b> and meets the Brahmaputra; together they form the world's largest delta, the <b>Sundarbans<\/b>.<\/p>","key":"Indus, Sutlej, Brahmaputra rise near Mansarovar; Ganga = Bhagirathi + Alaknanda at Devprayag; Yamuna joins at Prayagraj."},{"k":"table","title":"Where Himalayan rivers rise","head":["River","Source","Note"],"rows":[["Indus","Bokhar Chu glacier, near Mansarovar (Tibet)","Enters India in Ladakh; flows to the Arabian Sea through Pakistan."],["Sutlej","Rakas Tal, near Mansarovar (Tibet)","Enters India at Shipki La."],["Brahmaputra","Chemayungdung glacier (Tibet)","Called the Tsangpo in Tibet."],["Bhagirathi (Ganga)","Gangotri glacier (Gaumukh)","Becomes the Ganga at Devprayag after meeting the Alaknanda."],["Alaknanda","Satopanth glacier","Flows past Badrinath."],["Yamuna","Yamunotri glacier","Longest tributary of the Ganga."],["Beas","Beas Kund, near Rohtang Pass","Joins the Sutlej at Harike."],["Ravi","Kullu hills, west of Rohtang Pass",""],["Chenab","Chandra and Bhaga meet at Tandi (Himachal Pradesh)","Largest of the Indus tributaries in India."],["Jhelum","Verinag spring (Kashmir)","Flows through Wular lake and Srinagar."],["Mandakini","Chorabari glacier, near Kedarnath","Joins the Alaknanda at Rudraprayag."],["Ghaghara","Mapchachungo glacier (Tibet)",""]]},{"k":"table","title":"Tributaries","head":["Tributary","Joins","Note"],"rows":[["Son","Ganga","Largest right-bank (southern) tributary of the Ganga."],["Gomti","Ganga",""],["Ghaghara","Ganga",""],["Gandak","Ganga","Joins near Patna."],["Kosi","Ganga","'Sorrow of Bihar'."],["Ramganga","Ganga",""],["Chambal","Yamuna","Flows through badlands (ravines)."],["Betwa","Yamuna",""],["Ken","Yamuna",""],["Hindon","Yamuna",""],["Damodar","Hooghly","'Sorrow of Bengal'."],["Teesta","Brahmaputra",""],["Subansiri","Brahmaputra",""],["Manas","Brahmaputra",""],["Lohit","Brahmaputra",""],["Zaskar","Indus","Joins near Leh."],["Shyok","Indus",""],["Jhelum","Chenab","Joins in Pakistan."],["Ravi","Chenab",""],["Beas","Sutlej","At Harike (Punjab)."]]},{"k":"table","title":"Panch Prayag — rivers that meet the Alaknanda","head":["Prayag","River that joins","Note"],"rows":[["Vishnuprayag","Dhauliganga",""],["Nandprayag","Nandakini",""],["Karnaprayag","Pindar",""],["Rudraprayag","Mandakini",""],["Devprayag","Bhagirathi","Here the river takes the name Ganga."]]},{"k":"facts","title":"Key numbers","rows":[["Ganga","About 2,525 km — India's longest river; national river (2008)"],["Largest river basin in India","Ganga basin"],["Indus Waters Treaty","1960, signed by Nehru and Ayub Khan; World Bank brokered; in abeyance since April 2025"],["Brahmaputra's U-turn","Around Namcha Barwa; enters India in Arunachal as the Siang (Dihang)"],["Largest delta","Ganga–Brahmaputra (Sundarbans)"]]},{"k":"trick","h":"Panch Prayag from top to bottom: <b>“Very Nice Kids Read Daily”<\/b> — Vishnu (Dhauliganga), Nand (Nandakini), Karna (Pindar), Rudra (Mandakini), Dev (Bhagirathi). Indus rivers west to east: <b>“Jhelum Chenab Ravi Beas Sutlej” = “Just Call Raju Before Sunday”<\/b>."},{"k":"trap","h":"<b>Chambal, Betwa and Ken<\/b> join the <b>Yamuna<\/b>, not the Ganga. <b>Beas<\/b> joins the <b>Sutlej<\/b> (Harike), not the Ravi. The Ganga gets its name at <b>Devprayag<\/b>, not at Gangotri."}],"sum":["Indus, Sutlej and Brahmaputra rise near Mansarovar in Tibet.","Bhagirathi (Gangotri) and Alaknanda (Satopanth) meet at Devprayag to form the Ganga.","Yamuna rises at Yamunotri and joins the Ganga at Prayagraj; Chambal, Betwa and Ken join the Yamuna.","Indus Waters Treaty 1960: eastern rivers (Ravi, Beas, Sutlej) to India.","The Brahmaputra is the Tsangpo in Tibet and the Siang/Dihang in Arunachal."],"part":["Part 2 · Rivers, dams and lakes","नदियाँ, बाँध और झीलें"],"g":"ig"},
{"id":"G6","heat":3,"title":"Peninsular rivers","hi":"प्रायद्वीपीय नदियाँ","blocks":[{"k":"hot","h":"Asked every year: the <b>source<\/b> of Narmada (Amarkantak), Godavari (Trimbakeshwar), Krishna (Mahabaleshwar), Kaveri (Talakaveri); <b>west-flowing<\/b> Narmada and Tapi; <b>Godavari = longest peninsular river<\/b>; and the <b>Vedic names<\/b> of the Punjab rivers."},{"k":"story","h":"<p>Peninsular rivers are older and fed by rain, so many shrink in summer. Most rise in the <b>Western Ghats<\/b> and flow <b>east<\/b> to the Bay of Bengal, building <b>deltas<\/b>: the <b>Mahanadi<\/b>, <b>Godavari<\/b> (the longest, about 1,465 km — 'Dakshin Ganga'), <b>Krishna<\/b> and <b>Kaveri<\/b>.<\/p><p>Two big rivers flow <b>west<\/b> through <b>rift valleys<\/b> into the Arabian Sea and form <b>estuaries<\/b>, not deltas: the <b>Narmada<\/b> (from Amarkantak, between the Vindhyas and Satpuras) and the <b>Tapi<\/b> (from Multai). In the dry west, the <b>Luni<\/b> rises near Pushkar and dies in the Rann of Kutch, and the <b>Mahi<\/b> crosses the Tropic of Cancer twice.<\/p>","key":"East-flowing with deltas: Mahanadi, Godavari, Krishna, Kaveri. West-flowing in rift valleys with estuaries: Narmada, Tapi."},{"k":"table","title":"Where peninsular rivers rise","head":["River","Source","Note"],"rows":[["Narmada","Amarkantak (Madhya Pradesh)","Longest west-flowing river; flows in a rift valley."],["Mahanadi","Sihawa (Chhattisgarh)",""],["Godavari","Trimbakeshwar, Nashik (Maharashtra)","Longest peninsular river (about 1,465 km)."],["Krishna","Mahabaleshwar (Maharashtra)",""],["Kaveri","Talakaveri, Brahmagiri hills (Karnataka)",""],["Tapi","Multai, Betul (Madhya Pradesh)","West-flowing, in a rift valley."],["Chambal","Janapav hills, near Mhow (Madhya Pradesh)",""],["Luni","Near Pushkar (Rajasthan)","Ends in the Rann of Kutch; salty after Balotra."],["Sabarmati","Aravalli hills (Rajasthan)","Flows past Ahmedabad."],["Mahi","Vindhya range (Madhya Pradesh)","Crosses the Tropic of Cancer twice."],["Damodar","Chotanagpur plateau (Jharkhand)",""],["Subarnarekha","Near Ranchi (Jharkhand)",""],["Pennar","Nandi hills (Karnataka)",""],["Tungabhadra","Koodli, where the Tunga and Bhadra meet (Karnataka)",""]]},{"k":"table","title":"Tributaries","head":["Tributary","Joins","Note"],"rows":[["Indravati","Godavari","Chitrakote falls is on it."],["Manjira","Godavari",""],["Pranhita","Godavari","Brings the waters of the Wainganga and Wardha."],["Sabari","Godavari",""],["Tungabhadra","Krishna","Largest tributary of the Krishna."],["Bhima","Krishna",""],["Koyna","Krishna",""],["Musi","Krishna","Hyderabad stands on it."],["Ghataprabha","Krishna",""],["Kabini","Kaveri",""],["Bhavani","Kaveri",""],["Hemavati","Kaveri",""],["Amaravati","Kaveri",""],["Hasdeo","Mahanadi",""],["Ib","Mahanadi",""],["Seonath","Mahanadi",""],["Tel","Mahanadi",""],["Barakar","Damodar",""]]},{"k":"table","title":"Other names of rivers","head":["Name","River","Note"],"rows":[["Vitasta","Jhelum","Vedic name."],["Asikni","Chenab","Vedic name."],["Parushni","Ravi","Vedic name."],["Vipasha","Beas","Vedic name."],["Shutudri","Sutlej","Vedic name."],["Sindhu","Indus",""],["Tsangpo","Brahmaputra","Name in Tibet."],["Dihang (Siang)","Brahmaputra","Name in Arunachal Pradesh."],["Jamuna (in Bangladesh)","Brahmaputra",""],["Padma","Ganga","Name in Bangladesh."],["Dakshin Ganga (Vriddha Ganga)","Godavari",""],["Sorrow of Bihar","Kosi","Changes its course often."],["Sorrow of Bengal","Damodar","Floods; tamed by the DVC."]]},{"k":"trick","h":"Vedic names: <b>“Vitasta-Asikni-Parushni-Vipasha-Shutudri”<\/b> run in the same order as <b>Jhelum-Chenab-Ravi-Beas-Sutlej<\/b> — west to east. Learn the pairs by first letters: <b>V<\/b>itasta–Jhelum, <b>A<\/b>sikni–Chenab, <b>P<\/b>arushni–Ravi, <b>V<\/b>ipasha–Beas, <b>S<\/b>hutudri–Sutlej."},{"k":"trap","h":"<b>Narmada and Son<\/b> both rise at <b>Amarkantak<\/b> but flow in opposite directions (west and north-east). <b>Tungabhadra<\/b> joins the <b>Krishna<\/b>, not the Kaveri. <b>Kaveri<\/b> rises in Karnataka (Talakaveri), but most of its delta is in Tamil Nadu."}],"sum":["Godavari is the longest peninsular river (Trimbakeshwar to the Bay of Bengal).","Mahanadi (Sihawa), Krishna (Mahabaleshwar) and Kaveri (Talakaveri) also flow east and form deltas.","Narmada (Amarkantak) and Tapi (Multai) flow west through rift valleys and form estuaries.","Tungabhadra, Bhima and Koyna join the Krishna; Indravati and Manjira join the Godavari.","Vedic names: Vitasta (Jhelum), Asikni (Chenab), Parushni (Ravi), Vipasha (Beas), Shutudri (Sutlej)."],"part":["Part 2 · Rivers, dams and lakes","नदियाँ, बाँध और झीलें"],"g":"ig"},
{"id":"G7","heat":3,"title":"Cities on rivers, dams and projects","hi":"नदी तट के नगर, बाँध और परियोजनाएँ","blocks":[{"k":"hot","h":"Two question types never stop: <b>“City X stands on which river?”<\/b> and <b>“Dam X is on which river?”<\/b> Also: <b>Tehri (highest dam)<\/b>, <b>Hirakud (longest)<\/b>, <b>Bhakra Nangal<\/b>, <b>DVC (1948)<\/b> and the <b>Ken–Betwa link<\/b>."},{"k":"story","h":"<p>Old cities grew beside rivers: <b>Srinagar<\/b> on the Jhelum, <b>Delhi and Agra<\/b> on the Yamuna, <b>Varanasi and Patna<\/b> on the Ganga, <b>Lucknow<\/b> on the Gomti, <b>Ayodhya<\/b> on the Sarayu, <b>Jabalpur<\/b> on the Narmada, <b>Surat<\/b> on the Tapi, <b>Hyderabad<\/b> on the Musi.<\/p><p>After independence, Nehru called the big dams the <b>“temples of modern India”<\/b>. The <b>Damodar Valley Corporation (1948)<\/b> was the first multipurpose project. <b>Bhakra<\/b> on the Sutlej holds back the <b>Gobind Sagar<\/b>; <b>Hirakud<\/b> on the Mahanadi is the <b>longest<\/b> dam; <b>Tehri<\/b> on the Bhagirathi is the <b>highest<\/b>. The <b>Ken–Betwa link<\/b> (foundation stone December 2024) is the first project of the national river-linking plan.<\/p>","key":"Tehri — highest (Bhagirathi); Hirakud — longest (Mahanadi); Bhakra — Sutlej; Sardar Sarovar — Narmada; DVC 1948 — first multipurpose project."},{"k":"table","title":"Cities on rivers","head":["City","River","Note"],"rows":[["Srinagar","Jhelum",""],["Leh","Indus",""],["Jammu","Tawi",""],["Ludhiana","Sutlej",""],["Delhi","Yamuna",""],["Agra","Yamuna",""],["Mathura","Yamuna",""],["Haridwar","Ganga",""],["Kanpur","Ganga",""],["Varanasi","Ganga",""],["Patna","Ganga",""],["Lucknow","Gomti",""],["Ayodhya","Sarayu (Ghaghara)",""],["Kolkata","Hooghly",""],["Guwahati","Brahmaputra",""],["Jabalpur","Narmada",""],["Bharuch","Narmada",""],["Surat","Tapi",""],["Ahmedabad","Sabarmati",""],["Vadodara","Vishwamitri",""],["Kota","Chambal",""],["Ujjain","Kshipra",""],["Nashik","Godavari",""],["Vijayawada","Krishna",""],["Hyderabad","Musi",""],["Kurnool","Tungabhadra",""],["Tiruchirappalli","Kaveri",""],["Cuttack","Mahanadi",""],["Jamshedpur","Subarnarekha",""],["Madurai","Vaigai",""],["Pune","Mula–Mutha",""],["Panaji","Mandovi",""]]},{"k":"table","title":"Dams and barrages","head":["Dam","River","State"],"rows":[["Bhakra","Sutlej","Himachal Pradesh"],["Nathpa Jhakri","Sutlej","Himachal Pradesh"],["Pong","Beas","Himachal Pradesh"],["Ranjit Sagar (Thein)","Ravi","Punjab"],["Salal","Chenab","Jammu and Kashmir"],["Uri","Jhelum","Jammu and Kashmir"],["Tehri","Bhagirathi","Uttarakhand"],["Farakka (barrage)","Ganga","West Bengal"],["Bansagar","Son","Madhya Pradesh"],["Matatila","Betwa","Uttar Pradesh"],["Gandhi Sagar","Chambal","Madhya Pradesh"],["Rana Pratap Sagar","Chambal","Rajasthan"],["Mahi Bajaj Sagar","Mahi","Rajasthan"],["Panchet","Damodar","Jharkhand"],["Maithon","Barakar","Jharkhand"],["Sardar Sarovar","Narmada","Gujarat"],["Indira Sagar","Narmada","Madhya Pradesh"],["Ukai","Tapi","Gujarat"],["Hirakud","Mahanadi","Odisha"],["Polavaram","Godavari","Andhra Pradesh"],["Kaleshwaram","Godavari","Telangana"],["Nagarjuna Sagar","Krishna","Telangana"],["Srisailam","Krishna","Andhra Pradesh"],["Almatti","Krishna","Karnataka"],["Krishna Raja Sagar","Kaveri","Karnataka"],["Mettur (Stanley Reservoir)","Kaveri","Tamil Nadu"],["Kallanai (Grand Anicut)","Kaveri","Tamil Nadu"],["Idukki","Periyar","Kerala"],["Mullaperiyar","Periyar","Kerala"]]},{"k":"facts","title":"Records and projects","rows":[["Highest dam","Tehri (about 260 m), Uttarakhand"],["Longest dam","Hirakud, Odisha (about 25.8 km with dykes)"],["Oldest working dam","Kallanai (Grand Anicut) on the Kaveri — built by the Cholas"],["First multipurpose project","Damodar Valley Corporation, 1948 (modelled on the Tennessee Valley Authority)"],["Longest canal","Indira Gandhi Canal — from the Harike barrage (Sutlej–Beas), Rajasthan"],["First river-linking project","Ken–Betwa link (Madhya Pradesh and Uttar Pradesh)"],["Statue of Unity","Near the Sardar Sarovar dam, Gujarat"]]},{"k":"trick","h":"Chambal's three dams, upstream to downstream: <b>“Gandhi Ran to Jawahar”<\/b> — Gandhi Sagar (MP), Rana Pratap Sagar, Jawahar Sagar (Rajasthan), then the Kota barrage. Narmada dams: <b>“I Saw”<\/b> — Indira Sagar (MP) upstream, Sardar Sarovar (Gujarat) downstream."},{"k":"trap","h":"<b>Tehri<\/b> is the highest, <b>Hirakud<\/b> the longest — don't swap. <b>Nagarjuna Sagar<\/b> and <b>Srisailam<\/b> are on the <b>Krishna<\/b>; <b>Krishna Raja Sagar<\/b> is on the <b>Kaveri<\/b>. <b>Ahmedabad<\/b> is on the Sabarmati, <b>Vadodara<\/b> on the Vishwamitri, <b>Surat<\/b> on the Tapi."}],"sum":["Srinagar–Jhelum, Delhi/Agra–Yamuna, Varanasi/Patna–Ganga, Lucknow–Gomti, Ayodhya–Sarayu.","Jabalpur–Narmada, Surat–Tapi, Ahmedabad–Sabarmati, Hyderabad–Musi, Cuttack–Mahanadi.","Tehri (Bhagirathi) is the highest dam; Hirakud (Mahanadi) the longest.","Bhakra–Sutlej, Sardar Sarovar–Narmada, Nagarjuna Sagar–Krishna, Mettur–Kaveri, Idukki–Periyar.","DVC (1948) was the first multipurpose project; Ken–Betwa is the first river-link project."],"part":["Part 2 · Rivers, dams and lakes","नदियाँ, बाँध और झीलें"],"g":"ig"},
{"id":"G8","heat":2,"title":"Lakes and waterfalls","hi":"झीलें और जलप्रपात","blocks":[{"k":"hot","h":"Asked often: <b>largest freshwater lake (Wular)<\/b>, <b>largest salt lake (Sambhar)<\/b>, <b>largest lagoon (Chilika)<\/b>, <b>crater lake (Lonar)<\/b>, and <b>which river makes a waterfall<\/b> — Jog (Sharavati), Chitrakote (Indravati), Dhuandhar (Narmada), Hundru (Subarnarekha)."},{"k":"story","h":"<p>India's lakes come in many kinds. <b>Wular<\/b> in Kashmir is the largest <b>freshwater<\/b> lake; <b>Sambhar<\/b> in Rajasthan is the largest <b>inland salt<\/b> lake; <b>Chilika<\/b> in Odisha is the largest <b>brackish lagoon<\/b>. <b>Lonar<\/b> in Maharashtra was blasted out by a <b>meteorite<\/b>; <b>Kanwar<\/b> in Bihar is a cut-off river bend — an <b>oxbow<\/b>; <b>Loktak<\/b> in Manipur has floating islands called <b>phumdis<\/b>.<\/p><p>Waterfalls form where rivers leap off the plateau edge. <b>Jog<\/b> on the Sharavati plunges down the Western Ghats in Karnataka; <b>Chitrakote<\/b> on the Indravati is the 'Niagara of India'; the Narmada roars through the marble rocks at <b>Dhuandhar<\/b>; and <b>Hundru<\/b> on the Subarnarekha lies near Ranchi.<\/p>","key":"Wular — freshwater; Sambhar — salt; Chilika — lagoon; Lonar — crater; Kanwar — oxbow; Jog — Sharavati; Chitrakote — Indravati."},{"k":"table","title":"Lakes","head":["Lake","State / UT","Type"],"rows":[["Wular","Jammu and Kashmir","Freshwater lake"],["Dal","Jammu and Kashmir","Freshwater lake"],["Sambhar","Rajasthan","Salt lake"],["Didwana","Rajasthan","Salt lake"],["Pangong Tso","Ladakh","Salt lake"],["Chilika","Odisha","Brackish lagoon"],["Pulicat","Andhra Pradesh","Brackish lagoon"],["Vembanad","Kerala","Brackish lagoon"],["Kolleru","Andhra Pradesh","Freshwater lake"],["Loktak","Manipur","Freshwater lake"],["Lonar","Maharashtra","Crater lake"],["Kanwar (Kabar Taal)","Bihar","Oxbow lake"],["Roopkund","Uttarakhand","Glacial lake"],["Gurudongmar","Sikkim","Glacial lake"],["Hussain Sagar","Telangana","Artificial lake"],["Bhojtal (Upper Lake)","Madhya Pradesh","Artificial lake"],["Gobind Sagar","Himachal Pradesh","Artificial lake"],["Pichola","Rajasthan","Artificial lake"],["Naini","Uttarakhand","Freshwater lake"],["Pushkar","Rajasthan","Freshwater lake"]]},{"k":"table","title":"Waterfalls","head":["Waterfall","State","River"],"rows":[["Jog (Gersoppa)","Karnataka","Sharavati"],["Shivanasamudra","Karnataka","Kaveri"],["Kunchikal","Karnataka","Varahi"],["Hogenakkal","Tamil Nadu","Kaveri"],["Courtallam","Tamil Nadu","Chittar"],["Athirappilly","Kerala","Chalakudy"],["Dudhsagar","Goa","Mandovi"],["Dhuandhar","Madhya Pradesh","Narmada"],["Kapildhara","Madhya Pradesh","Narmada"],["Chachai","Madhya Pradesh","Bihad"],["Chitrakote","Chhattisgarh","Indravati"],["Tirathgarh","Chhattisgarh","Kanger"],["Hundru","Jharkhand","Subarnarekha"],["Dassam","Jharkhand","Kanchi"],["Lodh","Jharkhand","Burha"],["Duduma","Odisha","Machkund"],["Barehipani","Odisha","Budhabalanga"],["Nohkalikai","Meghalaya","—"],["Elephant Falls","Meghalaya","—"],["Nuranang (Jang)","Arunachal Pradesh","—"],["Kempty","Uttarakhand","—"],["Vasudhara","Uttarakhand","—"],["Kakolat","Bihar","—"],["Talakona","Andhra Pradesh","—"]]},{"k":"trick","h":"<b>“Wular Wins Water, Sambhar Serves Salt, Chilika Collects Crabs”<\/b> — freshwater, salt, brackish lagoon. Jharkhand's falls ride Ranchi's river: <b>Hundru on the Subarnarekha<\/b>."},{"k":"trap","h":"<b>Dal<\/b> is famous, but <b>Wular<\/b> is the largest. <b>Chitrakote<\/b> (Chhattisgarh) is on the <b>Indravati<\/b>, not the Mahanadi. <b>Jog<\/b> is on the <b>Sharavati<\/b>, while <b>Shivanasamudra<\/b> and <b>Hogenakkal<\/b> are on the <b>Kaveri<\/b>."}],"sum":["Wular (J&K) is the largest freshwater lake; Sambhar (Rajasthan) the largest inland salt lake.","Chilika (Odisha) is the largest brackish lagoon; Pulicat is second; Vembanad (Kerala) the longest lake.","Lonar (Maharashtra) is a crater lake; Kanwar (Bihar) an oxbow lake; Loktak (Manipur) has phumdis.","Jog — Sharavati (Karnataka); Shivanasamudra and Hogenakkal — Kaveri.","Chitrakote — Indravati (Chhattisgarh); Dhuandhar — Narmada (MP); Hundru — Subarnarekha (Jharkhand)."],"part":["Part 2 · Rivers, dams and lakes","नदियाँ, बाँध और झीलें"],"g":"ig"},
{"id":"G9","heat":3,"title":"Climate and the monsoon","hi":"जलवायु और मानसून","blocks":[{"k":"hot","h":"Most asked: <b>Mawsynram<\/b> (highest rainfall), the <b>local winds<\/b> — Loo, Mango showers, Kalbaisakhi — <b>western disturbances<\/b>, the <b>retreating monsoon<\/b> that waters Tamil Nadu, and <b>El Niño<\/b>."},{"k":"story","h":"<p>India has a <b>tropical monsoon<\/b> climate. In summer the land heats up and a low-pressure belt (the <b>ITCZ<\/b>) moves north; moist winds from the south-west rush in. The <b>south-west monsoon<\/b> reaches <b>Kerala around 1 June<\/b> and covers the whole country by about <b>8 July<\/b>. Its <b>Arabian Sea branch<\/b> soaks the Western Ghats; its <b>Bay of Bengal branch<\/b> is funnelled into the Khasi hills, where <b>Mawsynram<\/b> gets the most rain on Earth.<\/p><p>From mid-September the monsoon <b>retreats<\/b>. Winds now blow from the north-east and pick up moisture over the Bay of Bengal, so the <b>Tamil Nadu coast<\/b> gets its main rain in <b>October–December<\/b>. In winter, <b>western disturbances<\/b> from the Mediterranean bring rain to Punjab and Haryana — a gift for wheat. Before the monsoon come the <b>Loo<\/b>, <b>mango showers<\/b> and the <b>Kalbaisakhi<\/b>.<\/p>","key":"SW monsoon: Kerala 1 June → all India 8 July; Mawsynram wettest; NE monsoon waters Tamil Nadu; western disturbances bring winter rain to the north-west."},{"k":"facts","title":"Seasons of India (IMD)","rows":[["Winter","December – February"],["Summer (hot weather)","March – May"],["South-west monsoon","June – September (about three-quarters of the year's rain)"],["Post-monsoon (retreating)","October – November"],["Rainfall range","Over 400 cm in Meghalaya to under 10 cm in Ladakh and western Rajasthan"],["India Meteorological Department","Set up 1875; headquarters New Delhi"]]},{"k":"table","title":"Local winds and showers","head":["Wind / shower","Where","Remember"],"rows":[["Loo","Northern plains (Punjab to Bihar)","Hot, dry, dusty afternoon winds of May–June."],["Mango showers","Kerala and coastal Karnataka","Pre-monsoon showers that help mangoes ripen."],["Blossom (coffee) showers","Kerala and nearby coffee areas","Coffee flowers bloom after them."],["Kalbaisakhi (Nor'westers)","West Bengal","Violent evening thunderstorms of the hot season."],["Bardoli Chheerha (tea showers)","Assam","Assam's name for the Nor'westers; good for tea."],["Western disturbances","North-west India (Punjab, Haryana)","Winter rain from the Mediterranean; good for wheat."],["North-east (retreating) monsoon","Tamil Nadu coast","Most of Tamil Nadu's rain falls in October–December."]]},{"k":"table","title":"Monsoon words","head":["Term","Meaning","Note"],"rows":[["Burst of the monsoon","Sudden onset of the rains with thunder and heavy showers",""],["Break in the monsoon","Dry spells of a week or more within the rainy season",""],["October heat","Hot, humid weather after the monsoon retreats",""],["El Niño","A warm Pacific current that tends to weaken the Indian monsoon",""],["ITCZ","The low-pressure belt that moves north over the Ganga plain in summer","Inter Tropical Convergence Zone."],["Jet stream","Fast, high-altitude westerly winds that shift north before the monsoon",""]]},{"k":"table","title":"Weather records","head":["Place","Known for","Note"],"rows":[["Mawsynram (Meghalaya)","Highest average rainfall in the world","On the southern slopes of the Khasi hills."],["Cherrapunji (Sohra)","Most rain in a single year (1860–61)","Also in the Khasi hills, Meghalaya."],["Phalodi (Rajasthan)","Highest temperature recorded in India — 51 °C (2016)",""],["Dras (Ladakh)","Coldest inhabited place in India","Called the 'Gateway to Ladakh'."],["Leh (Ladakh)","Cold desert with very little rain","Rain shadow of the Himalaya."],["Agumbe (Karnataka)","'Cherrapunji of the South'","Wettest place of the Western Ghats in Karnataka."]]},{"k":"trick","h":"Pre-monsoon storms by state: <b>“Mango in Kerala, Coffee next door, Kalbaisakhi in Bengal, Tea in Assam, Loo in the plains.”<\/b> Monsoon dates: <b>“1 June in, 8 July all in.”<\/b>"},{"k":"trap","h":"<b>Mawsynram<\/b> beats <b>Cherrapunji<\/b> for average rainfall, but Cherrapunji holds the single-year record. <b>Tamil Nadu<\/b> gets most rain from the <b>north-east<\/b> (retreating) monsoon, not the south-west one. <b>Western disturbances<\/b> come in <b>winter<\/b>, not summer."}],"sum":["India has a tropical monsoon climate with four IMD seasons.","The south-west monsoon reaches Kerala about 1 June and covers India by about 8 July.","Mawsynram (Meghalaya) has the highest average rainfall in the world.","Tamil Nadu gets most of its rain from the north-east monsoon in October–December.","Loo — hot winds of the plains; mango showers — Kerala; Kalbaisakhi — West Bengal; western disturbances — winter rain in the north-west."],"part":["Part 3 · Climate, soils and forests","जलवायु, मृदा और वन"],"g":"ig"},
{"id":"G10","heat":2,"title":"Soils and forests","hi":"मृदा और वन","blocks":[{"k":"hot","h":"Asked every year: <b>black soil = regur = cotton<\/b>, <b>alluvial = most widespread<\/b>, <b>laterite = leached<\/b>, the <b>forest types<\/b> and their trees, and the <b>ISFR<\/b> numbers — forest cover %, MP largest, Mizoram highest share."},{"k":"story","h":"<p>India's most widespread soil is <b>alluvial<\/b>, laid down by rivers across the Northern Plains. On the Deccan lava lies sticky <b>black soil (regur)<\/b>, which cracks in summer and 'ploughs itself' — perfect for <b>cotton<\/b>. <b>Red soil<\/b> gets its colour from iron oxide. Where heavy rain washes out the minerals, <b>laterite<\/b> forms — good for cashew and tea. The Thar has <b>arid<\/b> soil, and dry irrigated land can turn <b>saline<\/b> (reh, kallar, usar).<\/p><p>Forests follow rainfall. Over 200 cm gives <b>tropical evergreen<\/b> forest (ebony, mahogany, rosewood) in the Western Ghats, the north-east and the Andamans. The most common type is <b>tropical deciduous (monsoon)<\/b> forest of <b>teak and sal<\/b>. Below 70 cm come <b>thorn forests<\/b> of babool and khejri. Mountains carry <b>montane<\/b> forests of deodar and pine, and tidal coasts carry <b>mangroves<\/b> — the Sundarbans is named after the sundari tree.<\/p>","key":"Alluvial most widespread; black = regur = cotton; laterite = leached; deciduous forest most widespread; mangrove — sundari."},{"k":"table","title":"Soils and where they are found","head":["Soil","Found in","Remember"],"rows":[["Alluvial soil","Northern plains and river deltas","India's most widespread soil — wheat, rice, sugarcane."],["Black (regur) soil","Deccan lava plateau — Maharashtra, Gujarat, Madhya Pradesh","Best for cotton; holds water."],["Red and yellow soil","Eastern and southern Deccan — Tamil Nadu, Karnataka, Odisha, Chhattisgarh","Red from iron oxide."],["Laterite soil","Heavy-rain areas — Kerala, Karnataka, Meghalaya hills","Leached; good for cashew and tea."],["Arid (desert) soil","Western Rajasthan","Sandy; kankar layer below."],["Saline and alkaline soil","Dry parts of Gujarat, Punjab and Haryana","White salt crust; called reh, kallar or usar."],["Peaty (marshy) soil","Kuttanad (Kerala), Sundarbans and the Odisha coast","Rich in organic matter."],["Mountain (forest) soil","Himalayan slopes",""]]},{"k":"table","title":"Soils: the one thing to remember","head":["Soil","Key feature","Note"],"rows":[["Black (regur) soil","Self-ploughing; best for cotton","Cracks when dry, swells when wet; poor in nitrogen and phosphorus."],["Laterite soil","Leached by heavy rain; good for cashew","Used for bricks."],["Red soil","Red colour from iron oxide","Turns yellow when hydrated."],["Alluvial soil","Made of khadar and bhangar","River-laid silt."],["Saline soil","White salt crust (reh, kallar, usar)","Gypsum helps cure it."],["Peaty soil","Very rich in organic matter (humus)",""]]},{"k":"table","title":"Trees and forest types","head":["Tree","Forest type","Note"],"rows":[["Sundari","Mangrove (tidal) forest","Gives the Sundarbans its name."],["Teak","Tropical deciduous forest",""],["Sal","Tropical deciduous forest",""],["Ebony","Tropical evergreen forest",""],["Mahogany","Tropical evergreen forest",""],["Rosewood","Tropical evergreen forest",""],["Babool (acacia)","Thorn and scrub forest",""],["Khejri","Thorn and scrub forest","Rajasthan's state tree."],["Deodar","Montane (temperate) forest",""],["Chir pine","Montane (temperate) forest",""],["Juniper and birch","Alpine forest",""]]},{"k":"facts","title":"India State of Forest Report 2023 (released December 2024, as of ISFR 2023)","rows":[["Published by","Forest Survey of India, Dehradun — every two years (ISFR 2023 is the 18th)"],["Forest and tree cover","25.17% of India's area (forest 21.76% + tree cover 3.41%)"],["Largest forest cover (area)","Madhya Pradesh, then Arunachal Pradesh and Chhattisgarh"],["Highest forest share (state)","Mizoram (about 85%); Lakshadweep highest of all (about 91%)"],["Mangrove cover","About 4,992 km² — West Bengal has the most"],["Target","33% of the area under forest (National Forest Policy, 1988)"]]},{"k":"trick","h":"Soils by rain: <b>“Little rain — Arid; some — Black and Red; heavy — Laterite.”<\/b> Forests by rain: <b>200+ Evergreen, 70–200 Deciduous, under 70 Thorn<\/b> — <b>“E-D-T”<\/b>, going down like a staircase."},{"k":"trap","h":"<b>Black soil<\/b> is <b>poor<\/b> in nitrogen and phosphorus but rich in lime, iron and potash. <b>Teak and sal<\/b> are <b>deciduous<\/b>, not evergreen. In ISFR, <b>Madhya Pradesh<\/b> has the largest forest <b>area<\/b>, but <b>Mizoram<\/b> has the highest forest <b>percentage<\/b>."}],"sum":["Alluvial soil is the most widespread; black soil (regur) of the Deccan is best for cotton.","Red soil gets its colour from iron oxide; laterite forms where heavy rain leaches the soil.","Tropical deciduous (teak, sal) is the most widespread forest; evergreen needs over 200 cm of rain.","Mangroves line tidal coasts — the Sundarbans is named after the sundari tree.","ISFR 2023: forest and tree cover 25.17%; Madhya Pradesh has the largest forest area, Mizoram the highest share."],"part":["Part 3 · Climate, soils and forests","जलवायु, मृदा और वन"],"g":"ig"},
{"id":"G11","heat":2,"title":"Minerals and mines","hi":"खनिज और खदानें","blocks":[{"k":"hot","h":"Most asked: the <b>leading state<\/b> for a mineral (iron ore, bauxite, chromite — Odisha; gold — Karnataka; zinc, silver — Rajasthan; diamond — MP) and <b>where a mine is<\/b> (Jharia, Khetri, Malanjkhand, Kudremukh, Bailadila, Jaduguda, Digboi)."},{"k":"story","h":"<p>Most of India's minerals lie in the old rocks of the <b>Peninsular Plateau<\/b>, above all the <b>Chotanagpur belt<\/b> of Jharkhand, Odisha and Chhattisgarh. <b>Odisha<\/b> leads in iron ore, bauxite and chromite; <b>Jharkhand<\/b> holds the coking coal of <b>Jharia<\/b> and the uranium of <b>Jaduguda<\/b>. <b>Rajasthan<\/b> is the 'museum of minerals' — zinc, lead and silver at <b>Zawar<\/b>, copper at <b>Khetri<\/b>, marble at <b>Makrana<\/b>, gypsum.<\/p><p><b>Karnataka<\/b> mines gold at <b>Hutti<\/b> (Kolar closed in 2001); <b>Madhya Pradesh<\/b> has India's only working diamond mine at <b>Panna<\/b> and the big copper mine at <b>Malanjkhand<\/b>. Oil was first struck at <b>Digboi<\/b> in Assam; <b>Mumbai High<\/b> offshore is the largest field. In 2023 India announced its first large <b>lithium<\/b> find in <b>Reasi, Jammu and Kashmir<\/b>.<\/p>","key":"Odisha — iron ore, bauxite, chromite; Karnataka — gold; Rajasthan — zinc, lead, silver, gypsum; MP — diamond; Jharia — coking coal; Jaduguda — uranium; Digboi — oldest oil."},{"k":"table","title":"Leading producing state","head":["Mineral","Leading state","Note"],"rows":[["Iron ore","Odisha","Over half of India's output; Keonjhar, Sundargarh."],["Bauxite","Odisha","Panchpatmali (NALCO), Koraput."],["Chromite","Odisha","Almost all of it, from the Sukinda valley."],["Gold","Karnataka","Hutti mines; Kolar Gold Fields closed in 2001."],["Silver","Rajasthan","From the zinc–lead ores of Zawar and Rampura Agucha."],["Lead and zinc","Rajasthan","Hindustan Zinc; Rampura Agucha is one of the world's biggest zinc mines."],["Gypsum","Rajasthan",""],["Diamond","Madhya Pradesh","India's only producing diamond mine — Majhgawan, Panna."]]},{"k":"table","title":"Famous mines","head":["Mine / field","Mineral","State"],"rows":[["Jharia","Coal","Jharkhand"],["Bokaro","Coal","Jharkhand"],["Raniganj","Coal","West Bengal"],["Korba","Coal","Chhattisgarh"],["Talcher","Coal","Odisha"],["Singareni","Coal","Telangana"],["Makum","Coal","Assam"],["Neyveli","Lignite","Tamil Nadu"],["Bailadila","Iron ore","Chhattisgarh"],["Kudremukh","Iron ore","Karnataka"],["Bellary","Iron ore","Karnataka"],["Noamundi","Iron ore","Jharkhand"],["Keonjhar (Joda–Barbil)","Iron ore","Odisha"],["Balaghat","Manganese","Madhya Pradesh"],["Malanjkhand","Copper","Madhya Pradesh"],["Khetri","Copper","Rajasthan"],["Mosabani (Singhbhum)","Copper","Jharkhand"],["Hutti","Gold","Karnataka"],["Kolar","Gold","Karnataka"],["Zawar","Zinc and lead","Rajasthan"],["Rampura Agucha","Zinc and lead","Rajasthan"],["Majhgawan (Panna)","Diamond","Madhya Pradesh"],["Jaduguda","Uranium","Jharkhand"],["Tummalapalle","Uranium","Andhra Pradesh"],["Sukinda","Chromite","Odisha"],["Panchpatmali","Bauxite","Odisha"],["Lohardaga","Bauxite","Jharkhand"],["Koderma","Mica","Jharkhand"],["Makrana","Marble","Rajasthan"],["Digboi","Petroleum","Assam"],["Ankleshwar","Petroleum","Gujarat"],["Mumbai High","Petroleum","Offshore Maharashtra"],["Barmer (Mangala)","Petroleum","Rajasthan"],["Salal-Haimana (Reasi)","Lithium","Jammu and Kashmir"]]},{"k":"facts","title":"Good to know","rows":[["Oldest coalfield","Raniganj, West Bengal (1774)"],["Oldest oil field and refinery","Digboi, Assam (refinery 1901)"],["Largest oil field","Mumbai High (offshore)"],["Coal types by quality","Anthracite > Bituminous > Lignite > Peat"],["Mineral heartland","Chotanagpur plateau (Jharkhand–Odisha–Chhattisgarh belt)"]]},{"k":"trick","h":"<b>“Odisha's IBC”<\/b> — Iron, Bauxite, Chromite. <b>“Rajasthan ZiLS-G”<\/b> — Zinc, Lead, Silver, Gypsum. <b>“K for Karat”<\/b> — Karnataka for gold."},{"k":"trap","h":"<b>Kolar<\/b> gold fields are closed; <b>Hutti<\/b> works now. <b>Khetri<\/b> (copper) is in Rajasthan, <b>Malanjkhand<\/b> (copper) in MP. <b>Neyveli<\/b> is lignite, not coal. <b>Kudremukh<\/b> (iron) is in Karnataka, <b>Bailadila<\/b> (iron) in Chhattisgarh."}],"sum":["Odisha leads in iron ore, bauxite and chromite.","Rajasthan leads in zinc, lead, silver and gypsum; Khetri (copper), Zawar (zinc), Makrana (marble).","Karnataka leads in gold (Hutti); Madhya Pradesh has the only diamond mine (Panna) and Malanjkhand copper.","Jharia — coking coal; Jaduguda — uranium (both Jharkhand); Neyveli — lignite (Tamil Nadu).","Digboi (Assam) is the oldest oil field; lithium was found at Reasi, J&K, in 2023."],"part":["Part 4 · Minerals and energy","खनिज और ऊर्जा"],"g":"ig"},
{"id":"G12","heat":2,"title":"Energy and power plants","hi":"ऊर्जा और बिजली संयंत्र","blocks":[{"k":"hot","h":"Asked often: <b>which state a power plant is in<\/b> — Tarapur, Kudankulam, Narora, Kaiga, Rawatbhata (nuclear); Vindhyachal, Korba (thermal); Bhadla, Pavagada, Rewa (solar); Muppandal (wind)."},{"k":"story","h":"<p>Coal still gives India most of its electricity, from giant plants like <b>Vindhyachal<\/b> (MP), the country's largest. Water came first, though: India's first hydro station ran at <b>Sidrapong<\/b> near Darjeeling in <b>1897<\/b>, and <b>Shivanasamudra<\/b> on the Kaveri followed in 1902.<\/p><p>India's nuclear story began at <b>Tarapur<\/b> (Maharashtra) in <b>1969<\/b>; today there are plants at Rawatbhata, Kalpakkam, Narora, Kakrapar, Kaiga and <b>Kudankulam<\/b> — the largest. The new power is the sun and wind: <b>Bhadla<\/b> in Rajasthan, <b>Pavagada<\/b> in Karnataka and <b>Rewa<\/b> in MP are huge solar parks, <b>Khavda<\/b> in Kutch is the world's largest renewable park, and <b>Muppandal<\/b> in Tamil Nadu is a giant wind farm. In mid-2025 India reached <b>half its installed power capacity from non-fossil sources<\/b>.<\/p>","key":"First nuclear Tarapur (1969); largest nuclear Kudankulam; largest thermal Vindhyachal; first hydro Sidrapong (1897); solar Bhadla, Pavagada, Rewa; wind Muppandal."},{"k":"table","title":"Power plants","head":["Plant","State / UT","Type"],"rows":[["Tarapur","Maharashtra","Nuclear"],["Rawatbhata","Rajasthan","Nuclear"],["Kalpakkam","Tamil Nadu","Nuclear"],["Narora","Uttar Pradesh","Nuclear"],["Kakrapar","Gujarat","Nuclear"],["Kaiga","Karnataka","Nuclear"],["Kudankulam","Tamil Nadu","Nuclear"],["Gorakhpur (Fatehabad)","Haryana","Nuclear"],["Jaitapur","Maharashtra","Nuclear"],["Vindhyachal","Madhya Pradesh","Thermal (coal)"],["Mundra","Gujarat","Thermal (coal)"],["Sasan","Madhya Pradesh","Thermal (coal)"],["Korba","Chhattisgarh","Thermal (coal)"],["Talcher (Kaniha)","Odisha","Thermal (coal)"],["Ramagundam","Telangana","Thermal (coal)"],["Singrauli (Shaktinagar)","Uttar Pradesh","Thermal (coal)"],["Farakka","West Bengal","Thermal (coal)"],["Kahalgaon","Bihar","Thermal (coal)"],["Neyveli","Tamil Nadu","Thermal (coal)"],["Sidrapong","West Bengal","Hydro"],["Shivanasamudra","Karnataka","Hydro"],["Nathpa Jhakri","Himachal Pradesh","Hydro"],["Tehri","Uttarakhand","Hydro"],["Koyna","Maharashtra","Hydro"],["Salal","Jammu and Kashmir","Hydro"],["Dibang","Arunachal Pradesh","Hydro"],["Bhadla","Rajasthan","Solar"],["Pavagada (Shakti Sthala)","Karnataka","Solar"],["Kurnool","Andhra Pradesh","Solar"],["Rewa","Madhya Pradesh","Solar"],["Kamuthi","Tamil Nadu","Solar"],["Charanka","Gujarat","Solar"],["Khavda","Gujarat","Solar–wind hybrid"],["Muppandal","Tamil Nadu","Wind"],["Puga valley","Ladakh","Geothermal"]]},{"k":"facts","title":"Energy facts (as of 2025–26)","rows":[["Main source of electricity","Coal (thermal) — still the largest share of generation"],["Non-fossil share of installed capacity","About 50%, reached in mid-2025"],["Target","500 GW of non-fossil capacity by 2030"],["Three-stage nuclear programme","Planned by Homi J. Bhabha — ends with thorium"],["International Solar Alliance","Launched 2015; headquarters Gurugram"],["Largest power company","NTPC (set up 1975)"]]},{"k":"trick","h":"Nuclear plants, in a ring round India: <b>“Ta-Ra-Ka-Na-Ka-Ka-Ku”<\/b> — Tarapur, Rawatbhata, Kalpakkam, Narora, Kakrapar, Kaiga, Kudankulam. Two in Tamil Nadu (<b>K<\/b>alpakkam, <b>K<\/b>udankulam)."},{"k":"trap","h":"<b>Narora<\/b> is in UP, <b>Kakrapar<\/b> in Gujarat, <b>Kaiga<\/b> in Karnataka — they sound alike. <b>Rawatbhata<\/b> is the Rajasthan atomic plant (Kota). <b>Bhadla<\/b> (solar) is in Rajasthan, <b>Pavagada<\/b> in Karnataka."}],"sum":["Tarapur (Maharashtra, 1969) was India's first nuclear power station; Kudankulam (Tamil Nadu) is the largest.","Other nuclear plants: Rawatbhata (Rajasthan), Kalpakkam (TN), Narora (UP), Kakrapar (Gujarat), Kaiga (Karnataka).","Vindhyachal (MP) is the largest thermal power station; Korba is Chhattisgarh's power hub.","Sidrapong (1897, Darjeeling) was India's first hydro station.","Solar: Bhadla (Rajasthan), Pavagada (Karnataka), Rewa (MP); wind: Muppandal (TN); Khavda (Gujarat) is the largest renewable park."],"part":["Part 4 · Minerals and energy","खनिज और ऊर्जा"],"g":"ig"}
];

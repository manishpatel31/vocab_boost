{"id":"G1","heat":3,"title":"India: location, size and borders","hi":"भारत: स्थिति, विस्तार और सीमाएँ","blocks":[{"k":"hot","h":"Asked again and again: the <b>Tropic of Cancer's 8 states<\/b>, the <b>Standard Meridian (82°30′E, Mirzapur)<\/b>, the <b>longest border (Bangladesh)<\/b> and shortest (Afghanistan), and the <b>Radcliffe, McMahon and Durand lines<\/b>."},{"k":"story","h":"<p>India lies wholly in the <b>northern and eastern hemispheres<\/b>, between latitudes <b>8°4′N and 37°6′N<\/b> and longitudes <b>68°7′E and 97°25′E<\/b>. The <b>Tropic of Cancer<\/b> (23°30′N) cuts it almost in half and crosses eight states. With <b>32.87 lakh km²<\/b> it is the <b>7th largest<\/b> country (2.4% of the world's land) — 3,214 km from north to south and 2,933 km from east to west.<\/p><p>The sun rises in Arunachal about <b>two hours<\/b> before it does in Gujarat, so India keeps one time, set by the <b>82°30′E<\/b> meridian through <b>Mirzapur<\/b> (UP) — 5½ hours ahead of GMT. Seven countries touch India by land; <b>Bangladesh<\/b> has the longest border and <b>Afghanistan<\/b> the shortest. Across the sea lie <b>Sri Lanka<\/b> and the <b>Maldives<\/b>.<\/p>","key":"8°4′N–37°6′N, 68°7′E–97°25′E; 7th largest, 2.4%; IST 82°30′E (Mirzapur); longest border Bangladesh, shortest Afghanistan."},{"k":"facts","title":"India at a glance (as of October 2026)","rows":[["Area","32,87,263 km² — 7th largest (after Russia, Canada, USA, China, Brazil, Australia)"],["Tropic of Cancer states (8)","Gujarat, Rajasthan, Madhya Pradesh, Chhattisgarh, Jharkhand, West Bengal, Tripura, Mizoram"],["Standard Meridian 82°30′E crosses","Uttar Pradesh, Madhya Pradesh, Chhattisgarh, Odisha, Andhra Pradesh"],["Land border","About 15,107 km with 7 countries"],["Coastline","7,516.6 km by the old count; re-measured at 11,098.81 km (published 2025)"],["Coastal states","9 — Gujarat (longest coast), Maharashtra, Goa, Karnataka, Kerala, Tamil Nadu, Andhra Pradesh, Odisha, West Bengal"],["States and UTs","28 sta "],["Mizo (Lushai) hills","Purvanchal",""]]},{"k":"facts","title":"Sections of the Himalaya from west to east (by rivers)","rows":[["Punjab (Kashmir) Himalaya","Between the Indus and Sutlej"],["Kumaon Himalaya","Between the Sutlej and Kali"],["Nepal Himalaya","Between the Kali and Teesta"],["Assam Himalaya","Between the Teesta and Dihang (Brahmaputra)"]]},{"k":"trick","h":"Passes by state: <b>“Zoji-Khardung-Chang in Ladakh; Rohtang-Shipki-Baralacha in Himachal; Lipu-Mana-Niti in Uttarakhand; Nathu-Jelep in Sikkim; Bomdi-Bum in Arunachal.”<\/b> Sections: <b>“I Saw Kali Teesta Dancing”<\/b> — Indus, Sutlej, Kali, Teesta, Dihang."},{"k":"trap","h":"<b>Shipki La<\/b> is in Himachal (Sutlej enters India) — not Sikkim. <b>Nanda Devi<\/b> is the highest peak <b>wholly in India<\/b>; <b>Kangchenjunga<\/b> is shared with Nepal; <b>K2<\/b> lies in PoK. <b>Pir Panjal<\/b> and <b>Dhauladhar<\/b> belong to the <b>Lesser<\/b> Himalaya."}],"sum":["The Himalaya are young fold mountains about 2,400 km long.","Three ranges: Himadri (Greater), Himachal (Lesser), Shiwalik (Outer); duns lie between Himachal and Shiwalik.","K2 (8,611 m) is India's highest peak as per India's map; Kangchenjunga (8,586 m) is in Sikkim; Nanda Devi is the highest wholly in India.","Passes: Zoji La, Khardung La (Ladakh); Rohtang, Shipki La (Himachal); Lipulekh (Uttarakhand); Nathu La (Sikkim); Bomdi La (Arunachal).","Purvanchal = Patkai Bum, Naga hills, Mizo hills in the north-east."],"part":["Part 1 · Location and landforms","स्थिति और भू-आकृतियाँ"],"g":"ig"},
{"id":"G3","heat":2,"title":"Northern plains, plateaus and hills","hi":"उत्तरी मैदान, पठार और पहाड़ियाँ","blocks":[{"k":"hot","h":"Favourites: <b>Bhabar, Terai, Bhangar, Khadar<\/b>; the <b>highest peaks<\/b> of the south (Anamudi, Doddabetta, Guru Shikhar); <b>Western vs Eastern Ghats<\/b>; and which state a plateau is in (Chotanagpur — Jharkhand)."},{"k":"story","h":"<p>The <b>Northern Plains<\/b> were built by the Indus, Ganga and Brahmaputra from silt. Coming down from the hills you cross four belts: <b>Bhabar<\/b> (pebbles, streams vanish), <b>Terai<\/b> (marshy, streams re-appear), then <b>Bhangar<\/b> (old alluvium with kankar) and <b>Khadar<\/b> (fresh alluvium of flood plains).<\/p><p>South of the plains is the <b>Peninsular Plateau<\/b>, made of the oldest rocks. The <b>Central Highlands<\/b> (Malwa, Bundelkhand, Chotanagpur) lie north of the Narmada; the <b>Deccan Plateau<\/b> lies south. It is edged by the <b>Western Ghats<\/b> — high and unbroken, with <b>Anamudi<\/b> (2,695 m) the highest peak of the south — and the low, broken <b>Eastern Ghats<\/b>. The <b>Aravallis<\/b>, among the oldest fold mountains in the world, rise to <b>Guru Shikhar<\/b> at Mount Abu.<\/p>","key":"Bhabar → Terai → Bhangar → Khadar; Anamudi highest in south; Guru Shikhar highest of Aravallis; Chotanagpur = mineral heartland."},{"k":"table","title":"Words of the Northern Plains","head":["Word","Meaning","Note"],"rows":[["Bhabar","Belt of pebbles at the foot of the Shiwaliks where streams disappear","8–16 km wide."],["Terai","Wet, marshy belt south of the Bhabar where streams re-appear","Thick forest and wildlife."],["Bhangar","Older alluvium, above flood level, with kankar",""],["Khadar","Newer alluvium on the flood plains, renewed every year","Very fertile."],["Doab","Land between two rivers","Ganga–Yamuna doab is the best known."],["Dun","Long valley between the Lesser Himalaya and the Shiwaliks","Dehradun, Kotli Dun, Patli Dun."]]},{"k":"table","title":"Plateaus","head":["Plateau","State","Note"],"rows":[["Chotanagpur plateau","Jharkhand","India's 'mineral heartland'."],["Malwa plateau","Madhya Pradesh","Black soil lava plateau."],["Baghelkhand","Madhya Pradesh",""],["Meghalaya (Shillong) plateau","Meghalaya","Cut off from the main plateau by the Garo–Rajmahal gap."],["Karbi Anglong plateau","Assam",""],["Deccan lava (trap) plateau","Maharashtra",""],["Telangana plateau","Telangana",""],["Mysore plateau","Karnataka",""],["Dandakaranya","Chhattisgarh and Odisha",""],["Marwar upland","Rajasthan",""]]},{"k":"mapfig","title":"Plateaus of India","marks":[["JH","Chotanagpur"],["MP","Malwa · Baghelkhand"],["ML","Meghalaya",0,-4],["AS","Karbi Anglong",6,6],["MH","Deccan trap"],["TG","Telangana"],["KA","Mysore"],["CT","Dandakaranya",0,30],["RJ","Marwar"]],"cap":"The Deccan trap is a lava plateau of black soil; Chotanagpur is the mineral heartland; the Meghalaya plateau was cut off by the Garo–Rajmahal gap."},{"k":"table","title":"Peaks and hills of the peninsula and the north-east","head":["Peak / hills","State","Remember"],"rows":[["Anamudi","Kerala","2,695 m — highest peak of South India (Anaimalai hills)."],["Doddabetta","Tamil Nadu","2,637 m — highest peak of the Nilgiris."],["Guru Shikhar","Rajasthan","1,722 m — highest point of the Aravallis (Mount Abu)."],["Dhupgarh","Madhya Pradesh","Highest peak of the Satpuras (Pachmarhi)."],["Kalsubai","Maharashtra","Highest peak of Maharashtra."],["Mullayanagiri","Karnataka","Highest peak of Karnataka."],["Jindhagada (Arma Konda)","Andhra Pradesh","Highest peak of the Eastern Ghats."],["Deomali","Odisha","Highest peak of Odisha."],["Parasnath","Jharkhand","Highest peak of Jharkhand; a Jain pilgrimage."],["Shillong Peak","Meghalaya",""],["Girnar","Gujarat",""],["Saddle Peak","Andaman and Nicobar Islands","Highest point of the Andamans."],["Cardamom hills","Kerala",""],["Palani hills","Tamil Nadu","Kodaikanal."],["Shevaroy hills","Tamil Nadu","Yercaud."],["Nallamala hills","Andhra Pradesh",""],["Garo, Khasi and Jaintia hills","Meghalaya",""],["Mikir (Karbi) hills","Assam",""],["Rajmahal hills","Jharkhand",""],["Mahadeo hills","Madhya Pradesh",""]]},{"k":"facts","title":"Western Ghats vs Eastern Ghats","rows":[["Western Ghats (Sahyadri)","Continuous, higher (900–1,600 m); Tapi mouth to Kanyakumari; highest Anamudi"],["Eastern Ghats","Broken by rivers, lower (about 600 m); highest Jindhagada (Arma Konda)"],["Where they meet","Nilgiri hills — Doddabetta"],["Gaps in the Western Ghats","Thal Ghat and Bhor Ghat (Maharashtra), Palghat gap (Kerala)"],["Oldest fold mountains","Aravallis — Gujarat to Delhi"]]},{"k":"trick","h":"Coming down from the hills: <b>“Boys Throw Big Kites”<\/b> — Bhabar, Terai, Bhangar, Khadar. <b>Khadar = new<\/b> (think ‘khadi is fresh cloth’)."},{"k":"trap","h":"<b>Bhangar<\/b> is old, <b>Khadar<\/b> is new — students swap them. <b>Anamudi<\/b> (Kerala) is higher than <b>Doddabetta<\/b> (Tamil Nadu). The <b>Meghalaya plateau<\/b> is part of the Peninsular Plateau, not the Himalaya."}],"sum":["The Northern Plains are made of river silt: Bhabar, Terai, Bhangar (old) and Khadar (new).","The Peninsular Plateau has the Central Highlands (Malwa, Chotanagpur) and the Deccan Plateau.","Western Ghats are higher and continuous; Eastern Ghats are low and broken; they meet in the Nilgiris.","Anamudi (Kerala) is the highest peak of the south; Guru Shikhar the highest of the Aravallis.","Chotanagpur plateau (Jharkhand) is India's mineral heartland."],"part":["Part 1 · Location and landforms","स्थिति और भू-आकृतियाँ"],"g":"ig"},
{"id":"G4","heat":2,"title":"Coasts and islands","hi":"तट और द्वीप","blocks":[{"k":"hot","h":"Asked often: <b>which coast is in which state<\/b> (Konkan, Malabar, Coromandel, Northern Circars), <b>Barren Island<\/b> (only active volcano), <b>Majuli<\/b> (largest river island), and the <b>channels<\/b> — Ten Degree, Nine Degree, Eight Degree and Palk Strait."},{"k":"story","h":"<p>The <b>western coastal plain<\/b> is narrow and lies between the Western Ghats and the Arabian Sea: Kachchh–Kathiawar (Gujarat), <b>Konkan<\/b> (Maharashtra–Goa), <b>Kanara<\/b> (Karnataka) and <b>Malabar<\/b> (Kerala, with its backwaters). The <b>eastern coastal plain<\/b> is wide, with big deltas: <b>Utkal<\/b> (Odisha), <b>Northern Circars<\/b> (Andhra) and <b>Coromandel<\/b> (Tamil Nadu).<\/p><p>India has two island groups. The <b>Andaman and Nicobar Islands<\/b> in the Bay of Bengal are the tops of drowned mountains; <b>Barren Island<\/b> is India's only active volcano, and the <b>Ten Degree Channel<\/b> separates the Andamans from the Nicobars. <b>Lakshadweep<\/b> in the Arabian Sea is made of <b>coral<\/b>; its capital is <b>Kavaratti<\/b>. Port Blair was renamed <b>Sri Vijaya Puram<\/b> in 2024.<\/p>","key":"West coast: Konkan, Kanara, Malabar; east coast: Utkal, Northern Circars, Coromandel; Barren Island = active volcano; Lakshadweep = coral."},{"k":"table","title":"Coastal plains","head":["Coast","State","Note"],"rows":[["Kachchh and Kathiawar coast","Gujarat",""],["Konkan coast","Maharashtra","From Mumbai down to Goa."],["Kanara coast","Karnataka",""],["Malabar coast","Kerala","Backwaters (kayals)."],["Coromandel coast","Tamil Nadu",""],["Northern Circars","Andhra Pradesh",""],["Utkal coast","Odisha",""]]},{"k":"mapfig","title":"The coasts, west and east","marks":[["GJ","Kachchh · Kathiawar"],["MH","Konkan",-40,20],["KA","Kanara",-30,10],["KL","Malabar",-14,0],["TN","Coromandel",18,0],["AP","Northern Circars",34,0],["OD","Utkal",24,10]],"cap":"West coast north to south: Kachchh–Kathiawar, Konkan, Kanara, Malabar. East coast south to north: Coromandel, Northern Circars, Utkal."},{"k":"table","title":"Islands","head":["Island","State / UT","Remember"],"rows":[["Majuli","Assam","World's largest river island (Brahmaputra); India's first island district, 2016."],["Umananda","Assam","Tiny river island in the Brahmaputra at Guwahati."],["Sriharikota","Andhra Pradesh","ISRO's Satish Dhawan Space Centre."],["Wheeler Island (A. P. J. Abdul Kalam Island)","Odisha","Missile test range."],["Pamban (Rameswaram)","Tamil Nadu","Joined to the mainland by the Pamban bridges."],["Srirangam","Tamil Nadu","River island in the Kaveri."],["Elephanta","Maharashtra","Rock-cut caves near Mumbai."],["Salsette","Maharashtra","Mumbai stands on it."],["Divar","Goa",""],["Willingdon Island","Kerala","Man-made island at Kochi port."],["Barren Island","Andaman and Nicobar Islands","India's only active volcano."],["Narcondam","Andaman and Nicobar Islands","A dormant volcano."],["Minicoy","Lakshadweep","Southernmost island of Lakshadweep."],["Kavaratti","Lakshadweep","Capital of Lakshadweep."],["Diu","Dadra and Nagar Haveli and Daman and Diu",""]]},{"k":"mapfig","title":"Islands on the map","pins":[["1",94.2,26.95,"Majuli","n"],["2",91.75,26.2,"Umananda","n"],["3",80.23,13.72,"Sriharikota","n"],["4",87.05,20.76,"Wheeler Island (A. P. J. Abdul Kalam Island)","n"],["5",79.3,9.28,"Pamban (Rameswaram)","n"],["6",78.69,10.86,"Srirangam","n"],["7",72.93,18.96,"Elephanta","n"],["8",72.88,19.1,"Salsette","n"],["9",73.9,15.52,"Divar","n"],["10",76.27,9.95,"Willingdon Island","n"],["11",93.86,12.28,"Barren Island","n"],["12",94.27,13.45,"Narcondam","n"],["13",73.05,8.28,"Minicoy","n"],["14",72.64,10.56,"Kavaratti","n"],["15",70.98,20.71,"Diu","n"]],"facts":[["1 · Majuli","Assam — World's largest river island (Brahmaputra); India's first island district, 2016."],["2 · Umananda","Assam — Tiny river island in the Brahmaputra at Guwahati."],["3 · Sriharikota","Andhra Pradesh — ISRO's Satish Dhawan Space Centre."],["4 · Wheeler Island (A. P. J. Abdul Kalam Island)","Odisha — Missile test range."],["5 · Pamban (Rameswaram)","Tamil Nadu — Joined to the mainland by the Pamban bridges."],["6 · Srirangam","Tamil Nadu — River island in the Kaveri."],["7 · Elephanta","Maharashtra — Rock-cut caves near Mumbai."],["8 · Salsette","Maharashtra — Mumbai stands on it."],["9 · Divar","Goa"],["10 · Willingdon Island","Kerala — Man-made island at Kochi port."],["11 · Barren Island","Andaman and Nicobar Islands — India's only active volcano."],["12 · Narcondam","Andaman and Nicobar Islands — A dormant volcano."],["13 · Minicoy","Lakshadweep — Southernmost island of Lakshadweep."],["14 · Kavaratti","Lakshadweep — Capital of Lakshadweep."],["15 · Diu","Dadra and Nagar Haveli and Daman and Diu"]],"cap":"Numbers match the list. Places are approximate. Use ＋ or ⛶ to zoom in."},{"k":"table","title":"Straits and channels","head":["Water body","Separates","Note"],"rows":[["Palk Strait","India and Sri Lanka","Between Tamil Nadu and Sri Lanka."],["Ten Degree Channel","Andaman and Nicobar groups","Between Little Andaman and Car Nicobar."],["Nine Degree Channel","Minicoy and the main Lakshadweep group",""],["Eight Degree Channel","Minicoy and the Maldives",""],["Duncan Passage","South Andaman and Little Andaman",""],["Coco Channel","North Andaman and the Coco Islands (Myanmar)",""],["Six Degree (Great) Channel","Great Nicobar and Sumatra (Indonesia)",""]]},{"k":"trick","h":"Channels count down as you go south-west: <b>Ten<\/b> (Andaman | Nicobar), <b>Nine<\/b> (Lakshadweep | Minicoy), <b>Eight<\/b> (Minicoy | Maldives). West coast top to bottom: <b>“Kids Know Karate Moves”<\/b> — Kachchh, Konkan, Kanara, Malabar."},{"k":"trap","h":"<b>Coromandel<\/b> is Tamil Nadu, not Andhra (that is the <b>Northern Circars<\/b>). <b>Sriharikota<\/b> is in Andhra Pradesh; <b>Wheeler (Abdul Kalam) Island<\/b> is in Odisha. <b>Narcondam<\/b> is dormant; only <b>Barren Island<\/b> is active."}],"sum":["West coast plains: Kachchh–Kathiawar, Konkan, Kanara, Malabar — narrow.","East coast plains: Utkal, Northern Circars, Coromandel — wide, with deltas.","Andaman and Nicobar: Barren Island is India's only active volcano; Ten Degree Channel divides the two groups.","Lakshadweep is coral; capital Kavaratti; Eight Degree Channel separates Minicoy from the Maldives.","Majuli (Assam) is the largest river island; Palk Strait separates India and Sri Lanka."],"part":["Part 1 · Location and landforms","स्थिति और भू-आकृतियाँ"],"g":"ig"},
{"id":"G5","heat":3,"title":"Himalayan rivers: Indus, Ganga, Brahmaputra","hi":"हिमालयी नदियाँ: सिंधु, गंगा, ब्रह्मपुत्र","blocks":[{"k":"hot","h":"Most asked: <b>where a river rises<\/b> (Gangotri, Yamunotri, Mansarovar), <b>which river a tributary joins<\/b> (Chambal → Yamuna, Son → Ganga, Beas → Sutlej), the <b>Panch Prayag<\/b> and the <b>Indus Waters Treaty (1960)<\/b>."},{"k":"story","h":"<p>Three great rivers rise behind the Himalaya near <b>Lake Mansarovar<\/b> in Tibet: the <b>Indus<\/b>, the <b>Sutlej<\/b> and the <b>Brahmaputra (Tsangpo)<\/b>. The Indus flows west through Ladakh to Pakistan, picking up the five rivers of Punjab — <b>Jhelum, Chenab, Ravi, Beas and Sutlej<\/b>. Under the <b>Indus Waters Treaty (1960)<\/b> India got the eastern rivers (Ravi, Beas, Sutlej) and Pakistan the western ones (Indus, Jhelum, Chenab); India put the treaty in abeyance in April 2025.<\/p><p>The <b>Ganga<\/b> begins as the <b>Bhagirathi<\/b> at Gangotri (Gaumukh). The <b>Alaknanda<\/b> collects four rivers at four prayags and meets the Bhagirathi at <b>Devprayag<\/b>, where the Ganga is born. The <b>Yamuna<\/b> joins at <b>Prayagraj<\/b>; Ghaghara, Gandak and Kosi join from the north; <b>Son<\/b> from the south. In Bangladesh the Ganga is the <b>Padma<\/b> and meets the Brahmaputra; together they form the world's largest delta, the <b>Sundarbans<\/b>.<\/p>","key":"Indus, Sutlej, Brahmaputra rise near Mansarovar; Ganga = Bhagirathi + Alaknanda at Devprayag; Yamuna joins at Prayagraj."},{"k":"rivermap","title":"The Himalayan rivers — tap one","chips":true,"show":["Indus","Jhelum","Chenab","Ravi","Beas","Sutlej","Ganga","Yamuna","Ramganga","Gomti","Ghaghara","Gandak","Kosi","Son","Chambal","Brahmaputra","Teesta","Subansiri","Manas","Lohit","Bhagirathi","Alaknanda","Hooghly"],"hl":["Indus","Ganga","Brahmaputra","Yamuna"],"label":["Indus","Ganga","Brahmaputra","Yamuna","Sutlej","Ghaghara","Kosi","Son","Chambal"],"cap":"White dashes show the water flowing downstream. Tap a system to show it alone; ＋ or ⛶ to zoom."},{"k":"table","title":"Where Himalayan rivers rise","head":["River","Source","Note"],"rows":[["Indus","Bokhar Chu glacier, near Mansarovar (Tibet)","Enters India in Ladakh; flows to the Arabian Sea through Pakistan."],["Sutlej","Rakas Tal, near Mansarovar (Tibet)","Enters India at Shipki La."],["Brahmaputra","Chemayungdung glacier (Tibet)","Called the Tsangpo in Tibet."],["Bhagirathi (Ganga)","Gangotri glacier (Gaumukh)","Becomes the Ganga at Devprayag after meeting the Alaknanda."],["Alaknanda","Satopanth glacier","Flows past Badrinath."],["Yamuna","Yamunotri glacier","Longest tributary of the Ganga."],["Beas","Beas Kund, near Rohtang Pass","Joins the Sutlej at Harike."],["Ravi","Kullu hills, west of Rohtang Pass",""],["Chenab","Chandra and Bhaga meet at Tandi (Himachal Pradesh)","Largest of the Indus tributaries in India."],["Jhelum","Verinag spring (Kashmir)","Flows through Wular lake and Srinagar."],["Mandakini","Chorabari glacier, near Kedarnath","Joins the Alaknanda at Rudraprayag."],["Ghaghara","Mapchachungo glacier (Tibet)",""]]},{"k":"table","title":"Tributaries","head":["Tributary","Joins","Note"],"rows":[["Son","Ganga","Largest right-bank (southern) tributary of the Ganga."],["Gomti","Ganga",""],["Ghaghara","Ganga",""],["Gandak","Ganga","Joins near Patna."],["Kosi","Ganga","'Sorrow of Bihar'."],["Ramganga","Ganga",""],["Chambal","Yamuna","Flows through badlands (ravines)."],["Betwa","Yamuna",""],["Ken","Yamuna",""],["Hindon","Yamuna",""],["Damodar","Hooghly","'Sorrow of Bengal'."],["Teesta","Brahmaputra",""],["Subansiri","Brahmaputra",""],["Manas","Brahmaputra",""],["Lohit","Brahmaputra",""],["Zaskar","Indus","Joins near Leh."],["Shyok","Indus",""],["Jhelum","Chenab","Joins in Pakistan."],["Ravi","Chenab",""],["Beas","Sutlej","At Harike (Punjab)."]]},{"k":"table","title":"Panch Prayag — rivers that meet the Alaknanda","head":["Prayag","River that joins","Note"],"rows":[["Vishnuprayag","Dhauliganga",""],["Nandprayag","Nandakini",""],["Karnaprayag","Pindar",""],["Rudraprayag","Mandakini",""],["Devprayag","Bhagirathi","Here the river takes the name Ganga."]]},{"k":"facts","title":"Key numbers","rows":[["Ganga","About 2,525 km — India's longest river; national river (2008)"],["Largest river basin in India","Ganga basin"],["Indus Waters Treaty","1960, signed by Nehru and Ayub Khan; World Bank brokered; in abeyance since April 2025"],["Brahmaputra's U-turn","Around Namcha Barwa; enters India in Arunachal as the Siang (Dihang)"],["Largest delta","Ganga–Brahmaputra (Sundarbans)"]]},{"k":"trick","h":"Panch Prayag from top to bottom: <b>“Very Nice Kids Read Daily”<\/b> — Vishnu (Dhauliganga), Nand (Nandakini), Karna (Pindar), Rudra (Mandakini), Dev (Bhagirathi). Indus rivers west to east: <b>“Jhelum Chenab Ravi Beas Sutlej” = “Just Call Raju Before Sunday”<\/b>."},{"k":"trap","h":"<b>Chambal, Betwa and Ken<\/b> join the <b>Yamuna<\/b>, not the Ganga. <b>Beas<\/b> joins the <b>Sutlej<\/b> (Harike), not the Ravi. The Ganga gets its name at <b>Devprayag<\/b>, not at Gangotri."}],"sum":["Indus, Sutlej and Brahmaputra rise near Mansarovar in Tibet.","Bhagirathi (Gangotri) and Alaknanda (Satopanth) meet at Devprayag to form the Ganga.","Yamuna rises at Yamunotri and joins the Ganga at Prayagraj; Chambal, Betwa and Ken join the Yamuna.","Indus Waters Treaty 1960: eastern rivers (Ravi, Beas, Sutlej) to India.","The Brahmaputra is the Tsangpo in Tibet and the Siang/Dihang in Arunachal."],"part":["Part 2 · Rivers, dams and lakes","नदियाँ, बाँध और झीलें"],"g":"ig"},
{"id":"G6","heat":3,"title":"Peninsular rivers","hi":"प्रायद्वीपीय नदियाँ","blocks":[{"k":"hot","h":"Asked every year: the <b>source<\/b> of Narmada (Amarkantak), Godavari (Trimbakeshwar), Krishna (Mahabaleshwar), Kaveri (Talakaveri); <b>west-flowing<\/b> Narmada and Tapi; <b>Godavari = longest peninsular river<\/b>; and the <b>Vedic names<\/b> of the Punjab rivers."},{"k":"story","h":"<p>Peninsular rivers are older and fed by rain, so many shrink in summer. Most rise in the <b>Western Ghats<\/b> and flow <b>east<\/b> to the Bay of Bengal, building <b>deltas<\/b>: the <b>Mahanadi<\/b>, <b>Godavari<\/b> (the longest, about 1,465 km — 'Dakshin Ganga'), <b>Krishna<\/b> and <b>Kaveri<\/b>.<\/p><p>Two big rivers flow <b>west<\/b> through <b>rift valleys<\/b> into the Arabian Sea and form <b>estuaries<\/b>, not deltas: the <b>Narmada<\/b> (from Amarkantak, between the Vindhyas and Satpuras) and the <b>Tapi<\/b> (from Multai). In the dry west, the <b>Luni<\/b> rises near Pushkar and dies in the Rann of Kutch, and the <b>Mahi<\/b> crosses the Tropic of Cancer twice.<\/p>","key":"East-flowing with deltas: Mahanadi, Godavari, Krishna, Kaveri. West-flowing in rift valleys with estuaries: Narmada, Tapi."},{"k":"rivermap","title":"The peninsular rivers — east and west","chips":true,"show":["Mahanadi","Godavari","Krishna","Kaveri","Tungabhadra","Bhima","Indravati","Wainganga","Pennar","Subarnarekha","Brahmani","Narmada","Tapi","Mahi","Sabarmati","Luni","Periyar","Sharavathi","Vaigai","Kabini"],"hl":["Mahanadi","Godavari","Krishna","Kaveri","Narmada","Tapi"],"label":["Mahanadi","Godavari","Krishna","Kaveri","Narmada","Tapi","Mahi","Luni"],"cap":"Most flow east into the Bay of Bengal and make deltas; the Narmada and Tapi flow west through rift valleys into estuaries."},{"k":"table","title":"Where peninsular rivers rise","head":["River","Source","Note"],"rows":[["Narmada","Amarkantak (Madhya Pradesh)","Longest west-flowing river; flows in a rift valley."],["Mahanadi","Sihawa (Chhattisgarh)",""],["Godavari","Trimbakeshwar, Nashik (Maharashtra)","Longest peninsular river (about 1,465 km)."],["Krishna","Mahabaleshwar (Maharashtra)",""],["Kaveri","Talakaveri, Brahmagiri hills (Karnataka)",""],["Tapi","Multai, Betul (Madhya Pradesh)","West-flowing, in a rift valley."],["Chambal","Janapav hills, near Mhow (Madhya Pradesh)",""],["Luni","Near Pushkar (Rajasthan)","Ends in the Rann of Kutch; salty after Balotra."],["Sabarmati","Aravalli hills (Rajasthan)","Flows past Ahmedabad."],["Mahi","Vindhya range (Madhya Pradesh)","Crosses the Tropic of Cancer twice."],["Damodar","Chotanagpur plateau (Jharkhand)",""],["Subarnarekha","Near Ranchi (Jharkhand)",""],["Pennar","Nandi hills (Karnataka)",""],["Tungabhadra","Koodli, where the Tunga and Bhadra meet (Karnataka)",""]]},{"k":"table","title":"Tributaries","head":["Tributary","Joins","Note"],"rows":[["Indravati","Godavari","Chitrakote falls is on it."],["Manjira","Godavari",""],["Pranhita","Godavari","Brings the waters of the Wainganga and Wardha."],["Sabari","Godavari",""],["Tungabhadra","Krishna","Largest tributary of the Krishna."],["Bhima","Krishna",""],["Koyna","Krishna",""],["Musi","Krishna","Hyderabad stands on it."],["Ghataprabha","Krishna",""],["Kabini","Kaveri",""],["Bhavani","Kaveri",""],["Hemavati","Kaveri",""],["Amaravati","Kaveri",""],["Hasdeo","Mahanadi",""],["Ib","Mahanadi",""],["Seonath","Mahanadi",""],["Tel","Mahanadi",""],["Barakar","Damodar",""]]},{"k":"table","title":"Other names of rivers","head":["Name","River","Note"],"rows":[["Vitasta","Jhelum","Vedic name."],["Asikni","Chenab","Vedic name."],["Parushni","Ravi","Vedic name."],["Vipasha","Beas","Vedic name."],["Shutudri","Sutlej","Vedic name."],["Sindhu","Indus",""],["Tsangpo","Brahmaputra","Name in Tibet."],["Dihang (Siang)","Brahmaputra","Name in Arunachal Pradesh."],["Jamuna (in Bangladesh)","Brahmaputra",""],["Padma","Ganga","Name in Bangladesh."],["Dakshin Ganga (Vriddha Ganga)","Godavari",""],["Sorrow of Bihar","Kosi","Changes its course often."],["Sorrow of Bengal","Damodar","Floods; tamed by the DVC."]]},{"k":"trick","h":"Vedic names: <b>“Vitasta-Asikni-Parushni-Vipasha-Shutudri”<\/b> run in the same order as <b>Jhelum-Chenab-Ravi-Beas-Sutlej<\/b> — west to east. Learn the pairs by first letters: <b>V<\/b>itasta–Jhelum, <b>A<\/b>sikni–Chenab, <b>P<\/b>arushni–Ravi, <b>V<\/b>ipasha–Beas, <b>S<\/b>hutudri–Sutlej."},{"k":"trap","h":"<b>Narmada and Son<\/b> both rise at <b>Amarkantak<\/b> but flow in opposite directions (west and north-east). <b>Tungabhadra<\/b> joins the <b>Krishna<\/b>, not the Kaveri. <b>Kaveri<\/b> rises in Karnataka (Talakaveri), but most of its delta is in Tamil Nadu."}],"sum":["Godavari is the longest peninsular river (Trimbakeshwar to the Bay of Bengal).","Mahanadi (Sihawa), Krishna (Mahabaleshwar) and Kaveri (Talakaveri) also flow east and form deltas.","Narmada (Amarkantak) and Tapi (Multai) flow west through rift valleys and form estuaries.","Tungabhadra, Bhima and Koyna join the Krishna; Indravati and Manjira join the Godavari.","Vedic names: Vitasta (Jhelum), Asikni (Chenab), Parushni (Ravi), Vipasha (Beas), Shutudri (Sutlej)."],"part":["Part 2 · Rivers, dams and lakes","नदियाँ, बाँध और झीलें"],"g":"ig"},
{"id":"G7","heat":3,"title":"Cities on rivers, dams and projects","hi":"नदी तट के नगर, बाँध और परियोजनाएँ","blocks":[{"k":"hot","h":"Two question types never stop: <b>“City X stands on which river?”<\/b> and <b>“Dam X is on which river?”<\/b> Also: <b>Tehri (highest dam)<\/b>, <b>Hirakud (longest)<\/b>, <b>Bhakra Nangal<\/b>, <b>DVC (1948)<\/b> and the <b>Ken–Betwa link<\/b>."},{"k":"story","h":"<p>Old cities grew beside rivers: <b>Srinagar<\/b> on the Jhelum, <b>Delhi and Agra<\/b> on the Yamuna, <b>Varanasi and Patna<\/b> on the Ganga, <b>Lucknow<\/b> on the Gomti, <b>Ayodhya<\/b> on the Sarayu, <b>Jabalpur<\/b> on the Narmada, <b>Surat<\/b> on the Tapi, <b>Hyderabad<\/b> on the Musi.<\/p><p>After independence, Nehru called the big dams the <b>“temples of modern India”<\/b>. The <b>Damodar Valley Corporation (1948)<\/b> was the first multipurpose project. <b>Bhakra<\/b> on the Sutlej holds back the <b>Gobind Sagar<\/b>; <b>Hirakud<\/b> on the Mahanadi is the <b>longest<\/b> dam; <b>Tehri<\/b> on the Bhagirathi is the <b>highest<\/b>. The <b>Ken–Betwa link<\/b> (foundation stone December 2024) is the first project of the national river-linking plan.<\/p>","key":"Tehri — highest (Bhagirathi); Hirakud — longest (Mahanadi); Bhakra — Sutlej; Sardar Sarovar — Narmada; DVC 1948 — first multipurpose project."},{"k":"table","title":"Cities on rivers","head":["City","River","Note"],"rows":[["Srinagar","Jhelum",""],["Leh","Indus",""],["Jammu","Tawi",""],["Ludhiana","Sutlej",""],["Delhi","Yamuna",""],["Agra","Yamuna",""],["Mathura","Yamuna",""],["Haridwar","Ganga",""],["Kanpur","Ganga",""],["Varanasi","Ganga",""],["Patna","Ganga",""],["Lucknow","Gomti",""],["Ayodhya","Sarayu (Ghaghara)",""],["Kolkata","Hooghly",""],["Guwahati","Brahmaputra",""],["Jabalpur","Narmada",""],["Bharuch","Narmada",""],["Surat","Tapi",""],["Ahmedabad","Sabarmati",""],["Vadodara","Vishwamitri",""],["Kota","Chambal",""],["Ujjain","Kshipra",""],["Nashik","Godavari",""],["Vijayawada","Krishna",""],["Hyderabad","Musi",""],["Kurnool","Tungabhadra",""],["Tiruchirappalli","Kaveri",""],["Cuttack","Mahanadi",""],["Jamshedpur","Subarnarekha",""],["Madurai","Vaigai",""],["Pune","Mula–Mutha",""],["Panaji","Mandovi",""]]},{"k":"table","title":"Dams and barrages","head":["Dam","River","State"],"rows":[["Bhakra","Sutlej","Himachal Pradesh"],["Nathpa Jhakri","Sutlej","Himachal Pradesh"],["Pong","Beas","Himachal Pradesh"],["Ranjit Sagar (Thein)","Ravi","Punjab"],["Salal","Chenab","Jammu and Kashmir"],["Uri","Jhelum","Jammu and Kashmir"],["Tehri","Bhagirathi","Uttarakhand"],["Farakka (barrage)","Ganga","West Bengal"],["Bansagar","Son","Madhya Pradesh"],["Matatila","Betwa","Uttar Pradesh"],["Gandhi Sagar","Chambal","Madhya Pradesh"],["Rana Pratap Sagar","Chambal","Rajasthan"],["Mahi Bajaj Sagar","Mahi","Rajasthan"],["Panchet","Damodar","Jharkhand"],["Maithon","Barakar","Jharkhand"],["Sardar Sarovar","Narmada","Gujarat"],["Indira Sagar","Narmada","Madhya Pradesh"],["Ukai","Tapi","Gujarat"],["Hirakud","Mahanadi","Odisha"],["Polavaram","Godavari","Andhra Pradesh"],["Kaleshwaram","Godavari","Telangana"],["Nagarjuna Sagar","Krishna","Telangana"],["Srisailam","Krishna","Andhra Pradesh"],["Almatti","Krishna","Karnataka"],["Krishna Raja Sagar","Kaveri","Karnataka"],["Mettur (Stanley Reservoir)","Kaveri","Tamil Nadu"],["Kallanai (Grand Anicut)","Kaveri","Tamil Nadu"],["Idukki","Periyar","Kerala"],["Mullaperiyar","Periyar","Kerala"]]},{"k":"rivermap","title":"Dams on the rivers","hl":["Bhagirathi","Sutlej","Mahanadi","Krishna","Narmada","Tapi","Kaveri","Godavari"],"pins":[["Tehri",78.48,30.38,""],["Bhakra",76.43,31.41,"","l"],["Hirakud",83.87,21.52,""],["Nagarjuna Sagar",79.31,16.57,""],["Sardar Sarovar",73.75,21.83,"","l"],["Ukai",73.59,21.25,"","l"],["KRS",76.57,12.42,"","l"],["Mettur",77.8,11.8,""],["Farakka",87.92,24.8,""],["Polavaram",81.65,17.25,""]],"cap":"The big dams on their rivers. Tap a river to see it highlighted."},{"k":"facts","title":"Records and projects","rows":[["Highest dam","Tehri (about 260 m), Uttarakhand"],["Longest dam","Hirakud, Odisha (about 25.8 km with dykes)"],["Oldest working dam","Kallanai (Grand Anicut) on the Kaveri — built by the Cholas"],["First multipurpose project","Damodar Valley Corporation, 1948 (modelled on the Tennessee Valley Authority)"],["Longest canal","Indira Gandhi Canal — from the Harike barrage (Sutlej–Beas), Rajasthan"],["First river-linking project","Ken–Betwa link (Madhya Pradesh and Uttar Pradesh)"],["Statue of Unity","Near the Sardar Sarovar dam, Gujarat"]]},{"k":"trick","h":"Chambal's three dams, upstream to downstream: <b>“Gandhi Ran to Jawahar”<\/b> — Gandhi Sagar (MP), Rana Pratap Sagar, Jawahar Sagar (Rajasthan), then the Kota barrage. Narmada dams: <b>“I Saw”<\/b> — Indira Sagar (MP) upstream, Sardar Sarovar (Gujarat) downstream."},{"k":"trap","h":"<b>Tehri<\/b> is the highest, <b>Hirakud<\/b> the longest — don't swap. <b>Nagarjuna Sagar<\/b> and <b>Srisailam<\/b> are on the <b>Krishna<\/b>; <b>Krishna Raja Sagar<\/b> is on the <b>Kaveri<\/b>. <b>Ahmedabad<\/b> is on the Sabarmati, <b>Vadodara<\/b> on the Vishwamitri, <b>Surat<\/b> on the Tapi."}],"sum":["Srinagar–Jhelum, Delhi/Agra–Yamuna, Varanasi/Patna–Ganga, Lucknow–Gomti, Ayodhya–Sarayu.","Jabalpur–Narmada, Surat–Tapi, Ahmedabad–Sabarmati, Hyderabad–Musi, Cuttack–Mahanadi.","Tehri (Bhagirathi) is the highest dam; Hirakud (Mahanadi) the longest.","Bhakra–Sutlej, Sardar Sarovar–Narmada, Nagarjuna Sagar–Krishna, Mettur–Kaveri, Idukki–Periyar.","DVC (1948) was the first multipurpose project; Ken–Betwa is the first river-link project."],"part":["Part 2 · Rivers, dams and lakes","नदियाँ, बाँध और झीलें"],"g":"ig"},
{"id":"G8","heat":2,"title":"Lakes and waterfalls","hi":"झीलें और जलप्रपात","blocks":[{"k":"hot","h":"Asked often: <b>largest freshwater lake (Wular)<\/b>, <b>largest salt lake (Sambhar)<\/b>, <b>largest lagoon (Chilika)<\/b>, <b>crater lake (Lonar)<\/b>, and <b>which river makes a waterfall<\/b> — Jog (Sharavati), Chitrakote (Indravati), Dhuandhar (Narmada), Hundru (Subarnarekha)."},{"k":"story","h":"<p>India's lakes come in many kinds. <b>Wular<\/b> in Kashmir is the largest <b>freshwater<\/b> lake; <b>Sambhar<\/b> in Rajasthan is the largest <b>inland salt<\/b> lake; <b>Chilika<\/b> in Odisha is the largest <b>brackish lagoon<\/b>. <b>Lonar<\/b> in Maharashtra was blasted out by a <b>meteorite<\/b>; <b>Kanwar<\/b> in Bihar is a cut-off river bend — an <b>oxbow<\/b>; <b>Loktak<\/b> in Manipur has floating islands called <b>phumdis<\/b>.<\/p><p>Waterfalls form where rivers leap off the plateau edge. <b>Jog<\/b> on the Sharavati plunges down the Western Ghats in Karnataka; <b>Chitrakote<\/b> on the Indravati is the 'Niagara of India'; the Narmada roars through the marble rocks at <b>Dhuandhar<\/b>; and <b>Hundru<\/b> on the Subarnarekha lies near Ranchi.<\/p>","key":"Wular — freshwater; Sambhar — salt; Chilika — lagoon; Lonar — crater; Kanwar — oxbow; Jog — Sharavati; Chitrakote — Indravati."},{"k":"table","title":"Lakes","head":["Lake","State / UT","Type"],"rows":[["Wular","Jammu and Kashmir","Freshwater lake"],["Dal","Jammu and Kashmir","Freshwater lake"],["Sambhar","Rajasthan","Salt lake"],["Didwana","Rajasthan","Salt lake"],["Pangong Tso","Ladakh","Salt lake"],["Chilika","Odisha","Brackish lagoon"],["Pulicat","Andhra Pradesh","Brackish lagoon"],["Vembanad","Kerala","Brackish lagoon"],["Kolleru","Andhra Pradesh","Freshwater lake"],["Loktak","Manipur","Freshwater lake"],["Lonar","Maharashtra","Crater lake"],["Kanwar (Kabar Taal)","Bihar","Oxbow lake"],["Roopkund","Uttarakhand","Glacial lake"],["Gurudongmar","Sikkim","Glacial lake"],["Hussain Sagar","Telangana","Artificial lake"],["Bhojtal (Upper Lake)","Madhya Pradesh","Artificial lake"],["Gobind Sagar","Himachal Pradesh","Artificial lake"],["Pichola","Rajasthan","Artificial lake"],["Naini","Uttarakhand","Freshwater lake"],["Pushkar","Rajasthan","Freshwater lake"]]},{"k":"mapfig","title":"Lakes on the map","pins":[["1",74.6,34.37,"Wular","n"],["2",74.87,34.11,"Dal","n"],["3",75.08,26.96,"Sambhar","n"],["4",74.57,27.4,"Didwana","n"],["5",78.7,33.75,"Pangong Tso","n"],["6",85.33,19.72,"Chilika","n"],["7",80.23,13.6,"Pulicat","n"],["8",76.38,9.6,"Vembanad","n"],["9",81.2,16.65,"Kolleru","n"],["10",93.8,24.55,"Loktak","n"],["11",76.51,19.98,"Lonar","n"],["12",86.14,25.6,"Kanwar (Kabar Taal)","n"],["13",79.73,30.26,"Roopkund","n"],["14",88.71,28.03,"Gurudongmar","n"],["15",78.47,17.42,"Hussain Sagar","n"],["16",77.37,23.25,"Bhojtal (Upper Lake)","n"],["17",76.5,31.4,"Gobind Sagar","n"],["18",73.68,24.57,"Pichola","n"],["19",79.46,29.39,"Naini","n"],["20",74.55,26.49,"Pushkar","n"]],"facts":[["1 · Wular","Jammu and Kashmir — Freshwater lake"],["2 · Dal","Jammu and Kashmir — Freshwater lake"],["3 · Sambhar","Rajasthan — Salt lake"],["4 · Didwana","Rajasthan — Salt lake"],["5 · Pangong Tso","Ladakh — Salt lake"],["6 · Chilika","Odisha — Brackish lagoon"],["7 · Pulicat","Andhra Pradesh — Brackish lagoon"],["8 · Vembanad","Kerala — Brackish lagoon"],["9 · Kolleru","Andhra Pradesh — Freshwater lake"],["10 · Loktak","Manipur — Freshwater lake"],["11 · Lonar","Maharashtra — Crater lake"],["12 · Kanwar (Kabar Taal)","Bihar — Oxbow lake"],["13 · Roopkund","Uttarakhand — Glacial lake"],["14 · Gurudongmar","Sikkim — Glacial lake"],["15 · Hussain Sagar","Telangana — Artificial lake"],["16 · Bhojtal (Upper Lake)","Madhya Pradesh — Artificial lake"],["17 · Gobind Sagar","Himachal Pradesh — Artificial lake"],["18 · Pichola","Rajasthan — Artificial lake"],["19 · Naini","Uttarakhand — Freshwater lake"],["20 · Pushkar","Rajasthan — Freshwater lake"]],"cap":"Numbers match the list. Places are approximate. Use ＋ or ⛶ to zoom in."},{"k":"cards","title":"Lakes by kind","rows":[["Salt","Sambhar, Didwana, Pangong Tso","Sambhar is India's largest inland salt lake","🧂"],["Lagoon (brackish)","Chilika, Pulicat, Vembanad","Chilika is the largest coastal lagoon","🌊"],["Crater","Lonar","Made by a meteorite in the Deccan basalt","☄️"],["Oxbow","Kanwar (Kabar Taal)","A cut-off meander of the Gandak system","↩️"],["Glacial","Roopkund, Gurudongmar","","🧊"],["Artificial","Hussain Sagar, Bhojtal, Gobind Sagar","","🏗️"]]},{"k":"table","title":"Waterfalls","head":["Waterfall","State","River"],"rows":[["Jog (Gersoppa)","Karnataka","Sharavati"],["Shivanasamudra","Karnataka","Kaveri"],["Kunchikal","Karnataka","Varahi"],["Hogenakkal","Tamil Nadu","Kaveri"],["Courtallam","Tamil Nadu","Chittar"],["Athirappilly","Kerala","Chalakudy"],["Dudhsagar","Goa","Mandovi"],["Dhuandhar","Madhya Pradesh","Narmada"],["Kapildhara","Madhya Pradesh","Narmada"],["Chachai","Madhya Pradesh","Bihad"],["Chitrakote","Chhattisgarh","Indravati"],["Tirathgarh","Chhattisgarh","Kanger"],["Hundru","Jharkhand","Subarnarekha"],["Dassam","Jharkhand","Kanchi"],["Lodh","Jharkhand","Burha"],["Duduma","Odisha","Machkund"],["Barehipani","Odisha","Budhabalanga"],["Nohkalikai","Meghalaya","—"],["Elephant Falls","Meghalaya","—"],["Nuranang (Jang)","Arunachal Pradesh","—"],["Kempty","Uttarakhand","—"],["Vasudhara","Uttarakhand","—"],["Kakolat","Bihar","—"],["Talakona","Andhra Pradesh","—"]]},{"k":"trick","h":"<b>“Wular Wins Water, Sambhar Serves Salt, Chilika Collects Crabs”<\/b> — freshwater, salt, brackish lagoon. Jharkhand's falls ride Ranchi's river: <b>Hundru on the Subarnarekha<\/b>."},{"k":"trap","h":"<b>Dal<\/b> is famous, but <b>Wular<\/b> is the largest. <b>Chitrakote<\/b> (Chhattisgarh) is on the <b>Indravati<\/b>, not the Mahanadi. <b>Jog<\/b> is on the <b>Sharavati<\/b>, while <b>Shivanasamudra<\/b> and <b>Hogenakkal<\/b> are on the <b>Kaveri<\/b>."}],"sum":["Wular (J&K) is the largest freshwater lake; Sambhar (Rajasthan) the largest inland salt lake.","Chilika (Odisha) is the largest brackish lagoon; Pulicat is second; Vembanad (Kerala) the longest lake.","Lonar (Maharashtra) is a crater lake; Kanwar (Bihar) an oxbow lake; Loktak (Manipur) has phumdis.","Jog — Sharavati (Karnataka); Shivanasamudra and Hogenakkal — Kaveri.","Chitrakote — Indravati (Chhattisgarh); Dhuandhar — Narmada (MP); Hundru — Subarnarekha (Jharkhand)."],"part":["Part 2 · Rivers, dams and lakes","नदियाँ, बाँध और झीलें"],"g":"ig"},
{"id":"G9","heat":3,"title":"Climate and the monsoon","hi":"जलवायु और मानसून","blocks":[{"k":"hot","h":"Most asked: <b>Mawsynram<\/b> (highest rainfall), the <b>local winds<\/b> — Loo, Mango showers, Kalbaisakhi — <b>western disturbances<\/b>, the <b>retreating monsoon<\/b> that waters Tamil Nadu, and <b>El Niño<\/b>."},{"k":"story","h":"<p>India has a <b>tropical monsoon<\/b> climate. In summer the land heats up and a low-pressure belt (the <b>ITCZ<\/b>) moves north; moist winds from the south-west rush in. The <b>south-west monsoon<\/b> reaches <b>Kerala around 1 June<\/b> and covers the whole country by about <b>8 July<\/b>. Its <b>Arabian Sea branch<\/b> soaks the Western Ghats; its <b>Bay of Bengal branch<\/b> is funnelled into the Khasi hills, where <b>Mawsynram<\/b> gets the most rain on Earth.<\/p><p>From mid-September the monsoon <b>retreats<\/b>. Winds now blow from the north-east and pick up moisture over the Bay of Bengal, so the <b>Tamil Nadu coast<\/b> gets its main rain in <b>October–December<\/b>. In winter, <b>western disturbances<\/b> from the Mediterranean bring rain to Punjab and Haryana — a gift for wheat. Before the monsoon come the <b>Loo<\/b>, <b>mango showers<\/b> and the <b>Kalbaisakhi<\/b>.<\/p>","key":"SW monsoon: Kerala 1 June → all India 8 July; Mawsynram wettest; NE monsoon waters Tamil Nadu; western disturbances bring winter rain to the north-west."},{"k":"facts","title":"Seasons of India (IMD)","rows":[["Winter","December – February"],["Summer (hot weather)","March – May"],["South-west monsoon","June – September (about three-quarters of the year's rain)"],["Post-monsoon (retreating)","October – November"],["Rainfall range","Over 400 cm in Meghalaya to under 10 cm in Ladakh and western Rajasthan"],["India Meteorological Department","Set up 1875; headquarters New Delhi"]]},{"k":"mapfig","title":"How the south-west monsoon arrives","under":"<defs><marker id=\"ahrvf8ug\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"#2f6db5\"/><\/marker><\/defs><path d=\"M-37.1,568L37.1,488L102,408L148.3,328L185.4,248\" fill=\"none\" stroke=\"#2f6db5\" stroke-width=\"4\" stroke-linecap=\"round\" opacity=\".75\" marker-end=\"url(#ahrvf8ug)\" style=\"vector-effect:non-scaling-stroke\"/><path d=\"M-37.1,568L37.1,488L102,408L148.3,328L185.4,248\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.4\" stroke-dasharray=\"2 8\" class=\"rvf\" style=\"animation:rvflow 1.2s linear infinite;vector-effect:non-scaling-stroke\"/><text x=\"22.3\" y=\"504\" font-size=\"12\" font-weight=\"700\" style=\"fill:#2f6db5;paint-order:stroke;stroke:var(--sheet);stroke-width:3px\">Arabian Sea branch<\/text><defs><marker id=\"ahb5eob2\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"#1c8aa6\"/><\/marker><\/defs><path d=\"M315.2,508L389.4,388L435.8,278L408,224L315.2,212L204,182\" fill=\"none\" stroke=\"#1c8aa6\" stroke-width=\"4\" stroke-linecap=\"round\" opacity=\".75\" marker-end=\"url(#ahb5eob2)\" style=\"vector-effect:non-scaling-stroke\"/><path d=\"M315.2,508L389.4,388L435.8,278L408,224L315.2,212L204,182\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.4\" stroke-dasharray=\"2 8\" class=\"rvf\" style=\"animation:rvflow 1.2s linear infinite;vector-effect:non-scaling-stroke\"/><text x=\"343.1\" y=\"448\" font-size=\"12\" font-weight=\"700\" style=\"fill:#1c8aa6;paint-order:stroke;stroke:var(--sheet);stroke-width:3px\">Bay of Bengal branch<\/text><line x1=\"0\" y1=\"279.2\" x2=\"560\" y2=\"279.2\" stroke=\"#c0392b\" stroke-width=\"1.4\" stroke-dasharray=\"6 4\" style=\"vector-effect:non-scaling-stroke\"/><text x=\"6\" y=\"275.2\" font-size=\"11\" font-weight=\"700\" style=\"fill:#c0392b;paint-order:stroke;stroke:var(--sheet);stroke-width:3px\">Tropic of Cancer 23½°N<\/text>","pins":[["Kerala onset ~1 June",76.3,9.9,"","l"],["Mawsynram — wettest",91.58,25.3,""]],"cap":"The monsoon reaches Kerala around 1 June. The Arabian Sea branch climbs the Western Ghats; the Bay of Bengal branch hits the north-east and turns west along the Himalaya. It covers all of India by about 8 July."},{"k":"mapfig","title":"Local winds and showers","marks":[["UP","Loo"],["KL","Mango and coffee showers",-10,0],["WB","Kalbaisakhi",6,10],["AS","Bardoli Chheerha",0,0],["PB","Western disturbances",-8,-6],["TN","North-east monsoon",14,8]],"cap":"Loo — hot dry wind of the northern plains; mango showers — Kerala; Kalbaisakhi — West Bengal (Bardoli Chheerha in Assam); western disturbances bring winter rain to the north-west; the north-east monsoon waters Tamil Nadu."},{"k":"table","title":"Local winds and showers","head":["Wind / shower","Where","Remember"],"rows":[["Loo","Northern plains (Punjab to Bihar)","Hot, dry, dusty afternoon winds of May–June."],["Mango showers","Kerala and coastal Karnataka","Pre-monsoon showers that help mangoes ripen."],["Blossom (coffee) showers","Kerala and nearby coffee areas","Coffee flowers bloom after them."],["Kalbaisakhi (Nor'westers)","West Bengal","Violent evening thunderstorms of the hot season."],["Bardoli Chheerha (tea showers)","Assam","Assam's name for the Nor'westers; good for tea."],["Western disturbances","North-west India (Punjab, Haryana)","Winter rain from the Mediterranean; good for wheat."],["North-east (retreating) monsoon","Tamil Nadu coast","Most of Tamil Nadu's rain falls in October–December."]]},{"k":"table","title":"Monsoon words","head":["Term","Meaning","Note"],"rows":[["Burst of the monsoon","Sudden onset of the rains with thunder and heavy showers",""],["Break in the monsoon","Dry spells of a week or more within the rainy season",""],["October heat","Hot, humid weather after the monsoon retreats",""],["El Niño","A warm Pacific current that tends to weaken the Indian monsoon",""],["ITCZ","The low-pressure belt that moves north over the Ganga plain in summer","Inter Tropical Convergence Zone."],["Jet stream","Fast, high-altitude westerly winds that shift north before the monsoon",""]]},{"k":"table","title":"Weather records","head":["Place","Known for","Note"],"rows":[["Mawsynram (Meghalaya)","Highest average rainfall in the world","On the southern slopes of the Khasi hills."],["Cherrapunji (Sohra)","Most rain in a single year (1860–61)","Also in the Khasi hills, Meghalaya."],["Phalodi (Rajasthan)","Highest temperature recorded in India — 51 °C (2016)",""],["Dras (Ladakh)","Coldest inhabited place in India","Called the 'Gateway to Ladakh'."],["Leh (Ladakh)","Cold desert with very little rain","Rain shadow of the Himalaya."],["Agumbe (Karnataka)","'Cherrapunji of the South'","Wettest place of the Western Ghats in Karnataka."]]},{"k":"trick","h":"Pre-monsoon storms by state: <b>“Mango in Kerala, Coffee next door, Kalbaisakhi in Bengal, Tea in Assam, Loo in the plains.”<\/b> Monsoon dates: <b>“1 June in, 8 July all in.”<\/b>"},{"k":"trap","h":"<b>Mawsynram<\/b> beats <b>Cherrapunji<\/b> for average rainfall, but Cherrapunji holds the single-year record. <b>Tamil Nadu<\/b> gets most rain from the <b>north-east<\/b> (retreating) monsoon, not the south-west one. <b>Western disturbances<\/b> come in <b>winter<\/b>, not summer."}],"sum":["India has a tropical monsoon climate with four IMD seasons.","The south-west monsoon reaches Kerala about 1 June and covers India by about 8 July.","Mawsynram (Meghalaya) has the highest average rainfall in the world.","Tamil Nadu gets most of its rain from the north-east monsoon in October–December.","Loo — hot winds of the plains; mango showers — Kerala; Kalbaisakhi — West Bengal; western disturbances — winter rain in the north-west."],"part":["Part 3 · Climate, soils and forests","जलवायु, मृदा और वन"],"g":"ig"},
{"id":"G10","heat":2,"title":"Soils and forests","hi":"मृदा और वन","blocks":[{"k":"hot","h":"Asked every year: <b>black soil = regur = cotton<\/b>, <b>alluvial = most widespread<\/b>, <b>laterite = leached<\/b>, the <b>forest types<\/b> and their trees, and the <b>ISFR<\/b> numbers — forest cover %, MP largest, Mizoram highest share."},{"k":"story","h":"<p>India's most widespread soil is <b>alluvial<\/b>, laid down by rivers across the Northern Plains. On the Deccan lava lies sticky <b>black soil (regur)<\/b>, which cracks in summer and 'ploughs itself' — perfect for <b>cotton<\/b>. <b>Red soil<\/b> gets its colour from iron oxide. Where heavy rain washes out the minerals, <b>laterite<\/b> forms — good for cashew and tea. The Thar has <b>arid<\/b> soil, and dry irrigated land can turn <b>saline<\/b> (reh, kallar, usar).<\/p><p>Forests follow rainfall. Over 200 cm gives <b>tropical evergreen<\/b> forest (ebony, mahogany, rosewood) in the Western Ghats, the north-east and the Andamans. The most common type is <b>tropical deciduous (monsoon)<\/b> forest of <b>teak and sal<\/b>. Below 70 cm come <b>thorn forests<\/b> of babool and khejri. Mountains carry <b>montane<\/b> forests of deodar and pine, and tidal coasts carry <b>mangroves<\/b> — the Sundarbans is named after the sundari tree.<\/p>","key":"Alluvial most widespread; black = regur = cotton; laterite = leached; deciduous forest most widespread; mangrove — sundari."},{"k":"table","title":"Soils and where they are found","head":["Soil","Found in","Remember"],"rows":[["Alluvial soil","Northern plains and river deltas","India's most widespread soil — wheat, rice, sugarcane."],["Black (regur) soil","Deccan lava plateau — Maharashtra, Gujarat, Madhya Pradesh","Best for cotton; holds water."],["Red and yellow soil","Eastern and southern Deccan — Tamil Nadu, Karnataka, Odisha, Chhattisgarh","Red from iron oxide."],["Laterite soil","Heavy-rain areas — Kerala, Karnataka, Meghalaya hills","Leached; good for cashew and tea."],["Arid (desert) soil","Western Rajasthan","Sandy; kankar layer below."],["Saline and alkaline soil","Dry parts of Gujarat, Punjab and Haryana","White salt crust; called reh, kallar or usar."],["Peaty (marshy) soil","Kuttanad (Kerala), Sundarbans and the Odisha coast","Rich in organic matter."],["Mountain (forest) soil","Himalayan slopes",""]]},{"k":"info","title":"India's soils at a glance","html":"<div class=\"fam\"><div><span aria-hidden=\"true\" style=\"display:block;height:26px;border-radius:6px;background:#d8c49a;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Alluvial soil<\/b><span class=\"n\">Northern plains and river deltas<\/span><small>India's most widespread soil — wheat, rice, sugarcane.<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:26px;border-radius:6px;background:#3b3533;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Black (regur) soil<\/b><span class=\"n\">Deccan lava plateau — Maharashtra, Gujarat, Madhya Pradesh<\/span><small>Best for cotton; holds water.<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:26px;border-radius:6px;background:#b94a32;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Red and yellow soil<\/b><span class=\"n\">Eastern and southern Deccan — Tamil Nadu, Karnataka, Odisha, Chhattisgarh<\/span><small>Red from iron oxide.<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:26px;border-radius:6px;background:#a35a2c;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Laterite soil<\/b><span class=\"n\">Heavy-rain areas — Kerala, Karnataka, Meghalaya hills<\/span><small>Leached; good for cashew and tea.<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:26px;border-radius:6px;background:#e9d6a6;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Arid (desert) soil<\/b><span class=\"n\">Western Rajasthan<\/span><small>Sandy; kankar layer below.<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:26px;border-radius:6px;background:#e8e6df;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Saline and alkaline soil<\/b><span class=\"n\">Dry parts of Gujarat, Punjab and Haryana<\/span><small>White salt crust; called reh, kallar or usar.<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:26px;border-radius:6px;background:#4b4a32;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Peaty (marshy) soil<\/b><span class=\"n\">Kuttanad (Kerala), Sundarbans and the Odisha coast<\/span><small>Rich in organic matter.<\/small><\/div><div><span aria-hidden=\"true\" style=\"display:block;height:26px;border-radius:6px;background:#6f8a5a;border:1px solid rgba(0,0,0,.15)\"><\/span><b>Mountain (forest) soil<\/b><span class=\"n\">Himalayan slopes<\/span><small><\/small><\/div><\/div>","cap":"Alluvial is the most widespread; black (regur) soil of the Deccan trap holds water and suits cotton; laterite forms where heavy rain washes the soil out."},{"k":"table","title":"Soils: the one thing to remember","head":["Soil","Key feature","Note"],"rows":[["Black (regur) soil","Self-ploughing; best for cotton","Cracks when dry, swells when wet; poor in nitrogen and phosphorus."],["Laterite soil","Leached by heavy rain; good for cashew","Used for bricks."],["Red soil","Red colour from iron oxide","Turns yellow when hydrated."],["Alluvial soil","Made of khadar and bhangar","River-laid silt."],["Saline soil","White salt crust (reh, kallar, usar)","Gypsum helps cure it."],["Peaty soil","Very rich in organic matter (humus)",""]]},{"k":"table","title":"Trees and forest types","head":["Tree","Forest type","Note"],"rows":[["Sundari","Mangrove (tidal) forest","Gives the Sundarbans its name."],["Teak","Tropical deciduous forest",""],["Sal","Tropical deciduous forest",""],["Ebony","Tropical evergreen forest",""],["Mahogany","Tropical evergreen forest",""],["Rosewood","Tropical evergreen forest",""],["Babool (acacia)","Thorn and scrub forest",""],["Khejri","Thorn and scrub forest","Rajasthan's state tree."],["Deodar","Montane (temperate) forest",""],["Chir pine","Montane (temperate) forest",""],["Juniper and birch","Alpine forest",""]]},{"k":"facts","title":"India State of Forest Report 2023 (released December 2024, as of ISFR 2023)","rows":[["Published by","Forest Survey of India, Dehradun — every two years (ISFR 2023 is the 18th)"],["Forest and tree cover","25.17% of India's area (forest 21.76% + tree cover 3.41%)"],["Largest forest cover (area)","Madhya Pradesh, then Arunachal Pradesh and Chhattisgarh"],["Highest forest share (state)","Mizoram (about 85%); Lakshadweep highest of all (about 91%)"],["Mangrove cover","About 4,992 km² — West Bengal has the most"],["Target","33% of the area under forest (National Forest Policy, 1988)"]]},{"k":"trick","h":"Soils by rain: <b>“Little rain — Arid; some — Black and Red; heavy — Laterite.”<\/b> Forests by rain: <b>200+ Evergreen, 70–200 Deciduous, under 70 Thorn<\/b> — <b>“E-D-T”<\/b>, going down like a staircase."},{"k":"trap","h":"<b>Black soil<\/b> is <b>poor<\/b> in nitrogen and phosphorus but rich in lime, iron and potash. <b>Teak and sal<\/b> are <b>deciduous<\/b>, not evergreen. In ISFR, <b>Madhya Pradesh<\/b> has the largest forest <b>area<\/b>, but <b>Mizoram<\/b> has the highest forest <b>percentage<\/b>."}],"sum":["Alluvial soil is the most widespread; black soil (regur) of the Deccan is best for cotton.","Red soil gets its colour from iron oxide; laterite forms where heavy rain leaches the soil.","Tropical deciduous (teak, sal) is the most widespread forest; evergreen needs over 200 cm of rain.","Mangroves line tidal coasts — the Sundarbans is named after the sundari tree.","ISFR 2023: forest and tree cover 25.17%; Madhya Pradesh has the largest forest area, Mizoram the highest share."],"part":["Part 3 · Climate, soils and forests","जलवायु, मृदा और वन"],"g":"ig"},
{"id":"G11","heat":2,"title":"Minerals and mines","hi":"खनिज और खदानें","blocks":[{"k":"hot","h":"Most asked: the <b>leading state<\/b> for a mineral (iron ore, bauxite, chromite — Odisha; gold — Karnataka; zinc, silver — Rajasthan; diamond — MP) and <b>where a mine is<\/b> (Jharia, Khetri, Malanjkhand, Kudremukh, Bailadila, Jaduguda, Digboi)."},{"k":"story","h":"<p>Most of India's minerals lie in the old rocks of the <b>Peninsular Plateau<\/b>, above all the <b>Chotanagpur belt<\/b> of Jharkhand, Odisha and Chhattisgarh. <b>Odisha<\/b> leads in iron ore, bauxite and chromite; <b>Jharkhand<\/b> holds the coking coal of <b>Jharia<\/b> and the uranium of <b>Jaduguda<\/b>. <b>Rajasthan<\/b> is the 'museum of minerals' — zinc, lead and silver at <b>Zawar<\/b>, copper at <b>Khetri<\/b>, marble at <b>Makrana<\/b>, gypsum.<\/p><p><b>Karnataka<\/b> mines gold at <b>Hutti<\/b> (Kolar closed in 2001); <b>Madhya Pradesh<\/b> has India's only working diamond mine at <b>Panna<\/b> and the big copper mine at <b>Malanjkhand<\/b>. Oil was first struck at <b>Digboi<\/b> in Assam; <b>Mumbai High<\/b> offshore is the largest field. In 2023 India announced its first large <b>lithium<\/b> find in <b>Reasi, Jammu and Kashmir<\/b>.<\/p>","key":"Odisha — iron ore, bauxite, chromite; Karnataka — gold; Rajasthan — zinc, lead, silver, gypsum; MP — diamond; Jharia — coking coal; Jaduguda — uranium; Digboi — oldest oil."},{"k":"table","title":"Leading producing state","head":["Mineral","Leading state","Note"],"rows":[["Iron ore","Odisha","Over half of India's output; Keonjhar, Sundargarh."],["Bauxite","Odisha","Panchpatmali (NALCO), Koraput."],["Chromite","Odisha","Almost all of it, from the Sukinda valley."],["Gold","Karnataka","Hutti mines; Kolar Gold Fields closed in 2001."],["Silver","Rajasthan","From the zinc–lead ores of Zawar and Rampura Agucha."],["Lead and zinc","Rajasthan","Hindustan Zinc; Rampura Agucha is one of the world's biggest zinc mines."],["Gypsum","Rajasthan",""],["Diamond","Madhya Pradesh","India's only producing diamond mine — Majhgawan, Panna."]]},{"k":"table","title":"Famous mines","head":["Mine / field","Mineral","State"],"rows":[["Jharia","Coal","Jharkhand"],["Bokaro","Coal","Jharkhand"],["Raniganj","Coal","West Bengal"],["Korba","Coal","Chhattisgarh"],["Talcher","Coal","Odisha"],["Singareni","Coal","Telangana"],["Makum","Coal","Assam"],["Neyveli","Lignite","Tamil Nadu"],["Bailadila","Iron ore","Chhattisgarh"],["Kudremukh","Iron ore","Karnataka"],["Bellary","Iron ore","Karnataka"],["Noamundi","Iron ore","Jharkhand"],["Keonjhar (Joda–Barbil)","Iron ore","Odisha"],["Balaghat","Manganese","Madhya Pradesh"],["Malanjkhand","Copper","Madhya Pradesh"],["Khetri","Copper","Rajasthan"],["Mosabani (Singhbhum)","Copper","Jharkhand"],["Hutti","Gold","Karnataka"],["Kolar","Gold","Karnataka"],["Zawar","Zinc and lead","Rajasthan"],["Rampura Agucha","Zinc and lead","Rajasthan"],["Majhgawan (Panna)","Diamond","Madhya Pradesh"],["Jaduguda","Uranium","Jharkhand"],["Tummalapalle","Uranium","Andhra Pradesh"],["Sukinda","Chromite","Odisha"],["Panchpatmali","Bauxite","Odisha"],["Lohardaga","Bauxite","Jharkhand"],["Koderma","Mica","Jharkhand"],["Makrana","Marble","Rajasthan"],["Digboi","Petroleum","Assam"],["Ankleshwar","Petroleum","Gujarat"],["Mumbai High","Petroleum","Offshore Maharashtra"],["Barmer (Mangala)","Petroleum","Rajasthan"],["Salal-Haimana (Reasi)","Lithium","Jammu and Kashmir"]]},{"k":"mapfig","title":"Mines and oilfields on the map","pins":[["1",86.4,23.75,"Jharia","n"],["2",85.6,23.78,"Bokaro","n"],["3",87.1,23.6,"Raniganj","n"],["4",82.7,22.35,"Korba","n"],["5",85.23,20.95,"Talcher","n"],["6",80.6,17.55,"Singareni","n"],["7",95.7,27.3,"Makum","n"],["8",79.48,11.6,"Neyveli","n"],["9",81.2,18.7,"Bailadila","n"],["10",75.25,13.2,"Kudremukh","n"],["11",76.92,15.14,"Bellary","n"],["12",85.47,22.15,"Noamundi","n"],["13",85.42,22.02,"Keonjhar (Joda–Barbil)","n"],["14",80.18,21.8,"Balaghat","n"],["15",80.7,22,"Malanjkhand","n"],["16",75.78,28,"K a)","Petroleum — Rajasthan"],["34 · Salal-Haimana (Reasi)","Lithium — Jammu and Kashmir"]],"cap":"Most metal mines cluster on the Chotanagpur plateau and in Odisha; the oilfields are in Assam, Gujarat, Rajasthan and off Mumbai."},{"k":"mapfig","title":"Leading producers","marks":[["OD","Iron ore · bauxite · chromite"],["KA","Gold",0,0],["RJ","Silver · lead · zinc · gypsum"],["MP","Diamond"]],"cap":"Odisha leads in iron ore, bauxite and chromite; Rajasthan in zinc, lead, silver and gypsum; Karnataka in gold; Madhya Pradesh in diamonds."},{"k":"facts","title":"Good to know","rows":[["Oldest coalfield","Raniganj, West Bengal (1774)"],["Oldest oil field and refinery","Digboi, Assam (refinery 1901)"],["Largest oil field","Mumbai High (offshore)"],["Coal types by quality","Anthracite > Bituminous > Lignite > Peat"],["Mineral heartland","Chotanagpur plateau (Jharkhand–Odisha–Chhattisgarh belt)"]]},{"k":"trick","h":"<b>“Odisha's IBC”<\/b> — Iron, Bauxite, Chromite. <b>“Rajasthan ZiLS-G”<\/b> — Zinc, Lead, Silver, Gypsum. <b>“K for Karat”<\/b> — Karnataka for gold."},{"k":"trap","h":"<b>Kolar<\/b> gold fields are closed; <b>Hutti<\/b> works now. <b>Khetri<\/b> (copper) is in Rajasthan, <b>Malanjkhand<\/b> (copper) in MP. <b>Neyveli<\/b> is lignite, not coal. <b>Kudremukh<\/b> (iron) is in Karnataka, <b>Bailadila<\/b> (iron) in Chhattisgarh."}],"sum":["Odisha leads in iron ore, bauxite and chromite.","Rajasthan leads in zinc, lead, silver and gypsum; Khetri (copper), Zawar (zinc), Makrana (marble).","Karnataka leads in gold (Hutti); Madhya Pradesh has the only diamond mine (Panna) and Malanjkhand copper.","Jharia — coking coal; Jaduguda — uranium (both Jharkhand); Neyveli — lignite (Tamil Nadu).","Digboi (Assam) is the oldest oil field; lithium was found at Reasi, J&K, in 2023."],"part":["Part 4 · Minerals and energy","खनिज और ऊर्जा"],"g":"ig"},
{"id":"G12","heat":2,"title":"Energy and power plants","hi":"ऊर्जा और बिजली संयंत्र","blocks":[{"k":"hot","h":"Asked often: <b>which state a power plant is in<\/b> — Tarapur, Kudankulam, Narora, Kaiga, Rawatbhata (nuclear); Vindhyachal, Korba (thermal); Bhadla, Pavagada, Rewa (solar); Muppandal (wind)."},{"k":"story","h":"<p>Coal still gives India most of its electricity, from giant plants like <b>Vindhyachal<\/b> (MP), the country's largest. Water came first, though: India's first hydro station ran at <b>Sidrapong<\/b> near Darjeeling in <b>1897<\/b>, and <b>Shivanasamudra<\/b> on the Kaveri followed in 1902.<\/p><p>India's nuclear story began at <b>Tarapur<\/b> (Maharashtra) in <b>1969<\/b>; today there are plants at Rawatbhata, Kalpakkam, Narora, Kakrapar, Kaiga and <b>Kudankulam<\/b> — the largest. The new power is the sun and wind: <b>Bhadla<\/b> in Rajasthan, <b>Pavagada<\/b> in Karnataka and <b>Rewa<\/b> in MP are huge solar parks, <b>Khavda<\/b> in Kutch is the world's largest renewable park, and <b>Muppandal<\/b> in Tamil Nadu is a giant wind farm. In mid-2025 India reached <b>half its installed power capacity from non-fossil sources<\/b>.<\/p>","key":"First nuclear Tarapur (1969); largest nuclear Kudankulam; largest thermal Vindhyachal; first hydro Sidrapong (1897); solar Bhadla, Pavagada, Rewa; wind Muppandal."},{"k":"table","title":"Power plants","head":["Plant","State / UT","Type"],"rows":[["Tarapur","Maharashtra","Nuclear"],["Rawatbhata","Rajasthan","Nuclear"],["Kalpakkam","Tamil Nadu","Nuclear"],["Narora","Uttar Pradesh","Nuclear"],["Kakrapar","Gujarat","Nuclear"],["Kaiga","Karnataka","Nuclear"],["Kudankulam","Tamil Nadu","Nuclear"],["Gorakhpur (Fatehabad)","Haryana","Nuclear"],["Jaitapur","Maharashtra","Nuclear"],["Vindhyachal","Madhya Pradesh","Thermal (coal)"],["Mundra","Gujarat","Thermal (coal)"],["Sasan","Madhya Pradesh","Thermal (coal)"],["Korba","Chhattisgarh","Thermal (coal)"],["Talcher (Kaniha)","Odisha","Thermal (coal)"],["Ramagundam","Telangana","Thermal (coal)"],["Singrauli (Shaktinagar)","Uttar Pradesh","Thermal (coal)"],["Farakka","West Bengal","Thermal (coal)"],["Kahalgaon","Bihar","Thermal (coal)"],["Neyveli","Tamil Nadu","Thermal (coal)"],["Sidrapong","West Bengal","Hydro"],["Shivanasamudra","Karnataka","Hydro"],["Nathpa Jhakri","Himachal Pradesh","Hydro"],["Tehri","Uttarakhand","Hydro"],["Koyna","Maharashtra","Hydro"],["Salal","Jammu and Kashmir","Hydro"],["Dibang","Arunachal Pradesh","Hydro"],["Bhadla","Rajasthan","Solar"],["Pavagada (Shakti Sthala)","Karnataka","Solar"],["Kurnool","Andhra Pradesh","Solar"],["Rewa","Madhya Pradesh","Solar"],["Kamuthi","Tamil Nadu","Solar"],["Charanka","Gujarat","Solar"],["Khavda","Gujarat","Solar–wind hybrid"],["Muppandal","Tamil Nadu","Wind"],["Puga valley","Ladakh","Geothermal"]]},{"k":"mapfig","title":"Power plants on the map","pins":[["1",72.68,19.83,"Tarapur","n"],["2",75.6,24.88,"Rawatbhata","n"],["3",80.16,12.53,"Kalpakkam","n"],["4",78.4,28.16,"Narora","n"],["5",73.35,21.23,"Kakrapar","n"],["6",74.44,14.86,"Kaiga","n"],["7",77.71,8.17,"Kudankulam","n"],["8",75.62,29.43,"Gorakhpur (Fatehabad)","n"],["9",73.33,16.6,"Jaitapur","n"],["10",82.67,24.1,"Vindhyachal","n"],["11",69.55,22.82,"Mundra","n"],["12",82.6,24.08,"Sasan","n"],["13",82.7,22.35,"Korba","n"],["14",85.07,21.1,"Talcher (Kaniha)","n"],["15",79.47,18.76,"Ramagundam","n"],["16",82.8,24.2,"Singrauli (Shaktinagar)","n"],["17",87.92,24.8,"Farakka","n"],["18",87.25,25.25,"Kahalgaon","n"],["19",79.48,11.6,"Neyveli","n"],["20",88.25,27,"Sidrapong","n"],["21",77.18,12.27,"Shivanasamudra","n"],["22",77.7,31.55,"Nathpa Jhakri","n"],["23",78.48,30.38,"Tehri","n"],["24",73.75,17.4,"Koyna","n"],["25",74.83,33.15,"Salal","n"],["26",95.75,28.15,"Dibang","n"],["27",71.9,27.53,"Bhadla","n"],["28",77.3,14.1,"Pavagada (Shakti Sthala)","n"],["29",78.05,15.7,"Kurnool","n"],["30",81.3,24.53,"Rewa","n"],["31",78.38,9.4,"Kamuthi","n"],["32",71.2,23.9,"Charanka","n"],["33",69.6,23.85,"Khavda","n"],["34",77.55,8.25,"Mu ig solar parks are in the sunny west and south."},{"k":"facts","title":"Energy facts (as of 2025–26)","rows":[["Main source of electricity","Coal (thermal) — still the largest share of generation"],["Non-fossil share of installed capacity","About 50%, reached in mid-2025"],["Target","500 GW of non-fossil capacity by 2030"],["Three-stage nuclear programme","Planned by Homi J. Bhabha — ends with thorium"],["International Solar Alliance","Launched 2015; headquarters Gurugram"],["Largest power company","NTPC (set up 1975)"]]},{"k":"trick","h":"Nuclear plants, in a ring round India: <b>“Ta-Ra-Ka-Na-Ka-Ka-Ku”<\/b> — Tarapur, Rawatbhata, Kalpakkam, Narora, Kakrapar, Kaiga, Kudankulam. Two in Tamil Nadu (<b>K<\/b>alpakkam, <b>K<\/b>udankulam)."},{"k":"trap","h":"<b>Narora<\/b> is in UP, <b>Kakrapar<\/b> in Gujarat, <b>Kaiga<\/b> in Karnataka — they sound alike. <b>Rawatbhata<\/b> is the Rajasthan atomic plant (Kota). <b>Bhadla<\/b> (solar) is in Rajasthan, <b>Pavagada<\/b> in Karnataka."}],"sum":["Tarapur (Maharashtra, 1969) was India's first nuclear power station; Kudankulam (Tamil Nadu) is the largest.","Other nuclear plants: Rawatbhata (Rajasthan), Kalpakkam (TN), Narora (UP), Kakrapar (Gujarat), Kaiga (Karnataka).","Vindhyachal (MP) is the largest thermal power station; Korba is Chhattisgarh's power hub.","Sidrapong (1897, Darjeeling) was India's first hydro station.","Solar: Bhadla (Rajasthan), Pavagada (Karnataka), Rewa (MP); wind: Muppandal (TN); Khavda (Gujarat) is the largest renewable park."],"part":["Part 4 · Minerals and energy","खनिज और ऊर्जा"],"g":"ig"}

<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>

<title>Musical Instruments &amp; Musicians</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Shared by every History page (built by tools/history/build.js).
   Layout: a manuscript folio — parchment paper, maroon ink, gold figures; one-column app with a bottom tab bar. */
:root{
  --paper:#f3efe4; --sheet:#fffdf6; --sunk:#e8e1cf;
  --ink:#241c14; --ink2:#5d5141; --rule:#d8cdb4;
  --blue:#7a2230; --on-blue:#ffffff; --blue-bg:#f4e2e1;
  --accent:#9a6a12; --accent-bg:#f8ecc9;
  --good:#1b6b4a; --good-bg:#ddefe4; --bad:#a8291f; --bad-bg:#f8e0dc;
  --warn-bg:#fcf0cf;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* era groups on the Learn screen */
.eras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.erac{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:grid;gap:6px}
.erac b{font-family:var(--f-display);font-size:15px;font-weight:700;line-height:1.25}
.erac .hi{font-size:12px;color:var(--ink2)}
.erac .mt{font-family:var(--f-num);font-size:11px;color:var(--ink2)}
.erac .meter{height:6px}
.erac[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.grph{display:flex;align-items:baseline;gap:8px;padding:14px 2px 4px;border-top:2px solid var(--ink);margin-top:4px}
.grph h2{font-size:17px}
.grph span{font-size:12px;color:var(--ink2);margin-left:auto;font-family:var(--f-num)}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}
.dots{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--rule);display:block}
.dots i.on{background:var(--accent)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.hot{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px;font-size:15px}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.facts.prose dd{font-weight:400;line-height:1.55}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap,.link{border-radius:var(--r);padding:12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.link{background:var(--sunk);border-color:transparent}
.trick .lab,.trap .lab,.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.link .lab{color:var(--ink2)}
.mn{font-family:var(--f-num);font-weight:600;background:var(--sheet);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.tag.src{background:var(--good-bg);color:var(--good)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:22px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
/* one-line revision rows (last week / last moment) */
.lines{display:grid;gap:0}
.lines div{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px dashed var(--rule);font-size:15px}
.lines div:first-child{border-top:0}
.lines b{font-weight:700}
.lines span{color:var(--ink2)}
.callout{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;font-size:15px}

/* plan maker */
.plancfg{display:grid;gap:12px}
.pday{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.pday > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pday > summary::-webkit-details-marker{display:none}
.pday .dno{font-family:var(--f-num);font-weight:700;font-size:13px;background:var(--sunk);border-radius:99px;padding:2px 10px;white-space:nowrap}
.pday.cur .dno{background:var(--blue);color:var(--on-blue)}
.pday.allgood .dno{background:var(--good-bg);color:var(--good)}
.pday .dt{min-width:0;font-weight:600;font-size:15px}
.pday .dt small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
.pday .dp{font-family:var(--f-num);font-size:12px;color:var(--ink2);white-space:nowrap}
.pday .body{padding:0 14px 12px;display:grid;gap:8px;border-top:1px dashed var(--rule);margin-top:2px;padding-top:10px}
.ptask{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;width:100%;font-size:15px}
.ptask .box{width:22px;height:22px;border-radius:6px;border:1.6px solid var(--rule);display:grid;place-items:center;font-size:14px;color:var(--on-blue);margin-top:1px}
.ptask[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.ptask[aria-pressed="true"] .lbl{text-decoration:line-through;color:var(--ink2)}
.ptask .lbl small{display:block;font-size:12px;color:var(--ink2);text-decoration:none}
/* the story first: plain-language opener for beginners */
.story{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;font-size:16.5px;line-height:1.65}
.story .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.story p{margin:0}
.story .key{background:var(--blue-bg);border-radius:8px;padding:8px 12px;font-size:15px;line-height:1.5}
.story .key b{color:var(--blue)}
/* hub: app cards and the beginner path */
.appcs{display:grid;gap:12px}
.appc{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;text-align:left;width:100%;cursor:pointer}
.appc:hover{border-color:var(--blue)}
.appc .hd{display:flex;align-items:center;gap:10px}
.appc .ic{font-size:26px;line-height:1}
.appc .hd b{font-family:var(--f-display);font-size:17px;font-weight:700;display:block}
.appc .hd small{font-size:12px;color:var(--ink2)}

const LESSONS = [
{"id":"M1","heat":2,"title":"How instruments are classified","hi":"वाद्य यंत्रों का वर्गीकरण","blocks":[{"k":"hot","h":"Asked often: <b>“Tabla / ghatam / shehnai belongs to which category?”<\/b> — the four classes of the <b>Natya Shastra<\/b>: <b>Tata<\/b> (string), <b>Sushira<\/b> (wind), <b>Avanaddha<\/b> (skin drum) and <b>Ghana<\/b> (solid)."},{"k":"story","h":"<p>About two thousand years ago <b>Bharata Muni<\/b> wrote the <b>Natya Shastra<\/b>, a book on drama, dance and music. It sorts every instrument by <b>what vibrates<\/b>. If a <b>string<\/b> vibrates, it is <b>tata vadya<\/b> — sitar, veena, sarod, violin, even the santoor. If <b>air<\/b> vibrates, it is <b>sushira vadya<\/b> — flute, shehnai, nadaswaram.<\/p><p>If a <b>stretched skin<\/b> vibrates, it is <b>avanaddha vadya<\/b> — tabla, mridangam, dholak. If the <b>solid body itself<\/b> rings when struck, it is <b>ghana vadya<\/b> — ghatam, manjira, jaltarang. The modern Western system (Hornbostel–Sachs) uses the same four ideas: chordophone, aerophone, membranophone, idiophone.<\/p>","key":"String = tata; wind = sushira; skin drum = avanaddha; solid = ghana. Ask: what vibrates?"},{"k":"photos","title":"Instruments in pictures","items":[["Sitar","Sitar","Tata · plucked"],["Sarod","Sarod","Tata · fretless"],["Santoor","Santoor","Tata · struck with mallets"],["Sarangi","Sarangi","Tata · bowed"],["Saraswati_veena","Saraswati veena","Tata · Carnatic"],["Bansuri","Bansuri","Sushira · bamboo flute"],["Shehnai","Shehnai","Sushira · double reed"],["Nadaswaram","Nadaswaram","Sushira · temple pipe"],["Tabla","Tabla","Avanaddha · dayan and bayan"],["Mridangam","Mridangam","Avanaddha · Carnatic drum"],["Pakhawaj","Pakhawaj","Avanaddha · Dhrupad"],["Ghatam","Ghatam","Ghana · clay pot"],["Jal_tarang","Jaltarang","Ghana · bowls of water"],["Manjira","Manjira","Ghana · cymbals"]]},{"k":"table","title":"Instrument → class","head":["Instrument","Class","Note"],"rows":[["Sitar","Tata (string)","Plucked; long neck with movable frets."],["Sarod","Tata (string)","Plucked; fretless metal fingerboard."],["Veena","Tata (string)","The Saraswati veena of Carnatic music."],["Santoor","Tata (string)","About 100 strings struck with light wooden mallets."],["Violin","Tata (string)","Bowed; a key accompanying instrument in Carnatic music."],["Sarangi","Tata (string)","Bowed; said to have the sound of a hundred colours (sau rang)."],["Tanpura","Tata (string)","Gives the steady drone behind a singer."],["Ektara","Tata (string)","A one-string instrument of wandering singers like the Bauls."],["Rabab","Tata (string)","Plucked; an ancestor of the sarod."],["Bansuri (flute)","Sushira (wind)","A bamboo flute — Krishna's instrument."],["Shehnai","Sushira (wind)","Double-reed pipe played at weddings and temples."],["Nadaswaram","Sushira (wind)","The big temple pipe of Tamil Nadu."],["Harmonium","Sushira (wind)","Free-reed keyboard pumped by hand; came from Europe in the 19th century."],["Shankh (conch)","Sushira (wind)",""],["Pungi (been)","Sushira (wind)","The snake charmer's gourd pipe."],["Tabla","Avanaddha (membrane drum)","A pair: the dayan (right) and bayan (left)."],["Mridangam","Avanaddha (membrane drum)","The main drum of Carnatic music."],["Pakhawaj","Avanaddha (membrane drum)","Barrel drum that accompanies Dhrupad."],["Dholak","Avanaddha (membrane drum)",""],["Damaru","Avanaddha (membrane drum)","Small hourglass drum linked with Shiva."],["Chenda","Avanaddha (membrane drum)","Loud cylinder drum of Kerala."],["Kanjira","Avanaddha (membrane drum)","A small frame drum with one jingle; Carnatic."],["Nagara","Avanaddha (membrane drum)","Big kettledrum played with sticks."],["Ghatam","Ghana (solid)","A clay pot played in Carnatic concerts."],["Jaltarang","Ghana (solid)","Porcelain bowls filled with water and struck."],["Manjira","Ghana (solid)","Small hand cymbals."],["Kartal","Ghana (solid)","Wooden clappers with jingles."],["Ghungroo","Ghana (solid)","Ankle bells worn by dancers."],["Morchang","Ghana (solid)","A metal jaw harp of Rajasthan."]]},{"k":"info","title":"The four classes at a glance","html":"<div class=\"fam\"><div><span class=\"ic\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 40\" width=\"40\" height=\"40\" fill=\"var(--accent)\" stroke=\"var(--accent)\" stroke-linecap=\"round\"><path d=\"M6 30 L34 10\" stroke-width=\"3\"/><path d=\"M8 33 L37 13 M4 27 L32 7\" stroke-width=\"1.2\"/><circle cx=\"9\" cy=\"31\" r=\"6\" fill=\"none\" stroke-width=\"2\"/><\/svg><\/span><b>Tata<\/b><span class=\"n\">9 in this lesson · Chordophone<\/span><small>Sound from a vibrating string.<\/small><small><b style=\"font-size:12.5px\">Sitar · Sarod · Veena · Santoor · Violin · Sarangi · Tanpura · Ektara · Rabab<\/b><\/small><\/div><div><span class=\"ic\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 40\" width=\"40\" height=\"40\" fill=\"var(--accent)\" stroke=\"var(--accent)\" stroke-linecap=\"round\"><rect x=\"4\" y=\"17\" width=\"32\" height=\"7\" rx=\"3.5\" fill=\"none\" stroke-width=\"2.4\"/><circle cx=\"14\" cy=\"20.5\" r=\"1.6\"/><circle cx=\"20\" cy=\"20.5\" r=\"1.6\"/><circle cx=\"26\" cy=\"20.5\" r=\"1.6\"/><path d=\"M36 14 q4 6 0 13\" fill=\"none\" stroke-width=\"1.6\"/><\/svg><\/span><b>Sushira<\/b><span class=\"n\">6 in this lesson · Aerophone<\/span><small>Sound from vibrating air.<\/small><small><b style=\"font-size:12.5px\">Bansuri · Shehnai · Nadaswaram · Harmonium · Shankh · Pungi<\/b><\/small><\/div><div><span class=\"ic\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 40\" width=\"40\" height=\"40\" fill=\"var(--accent)\" stroke=\"var(--accent)\" stroke-linecap=\"round\"><ellipse cx=\"20\" cy=\"12\" rx=\"13\" ry=\"4.5\" fill=\"none\" stroke-width=\"2.4\"/><path d=\"M7 12 v16 q13 8 26 0 v-16\" fill=\"none\" stroke-width=\"2.4\"/><path d=\"M12 15 l4 13 M28 15 l-4 13\" stroke-width=\"1.2\"/><\/svg><\/span><b>Avanaddha<\/b><span class=\"n\">8 in this lesson · Membranophone<\/span><small>Sound from a stretched skin.<\/small><small><b style=\"font-size:12.5px\">Tabla · Mridangam · Pakhawaj · Dholak · Damaru · Chenda · Kanjira · Nagara<\/b><\/small><\/div><div><span class=\"ic\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 40\" width=\"40\" height=\"40\" fill=\"var(--accent)\" stroke=\"var(--accent)\" stroke-linecap=\"round\"><ellipse cx=\"13\" cy=\"22\" rx=\"9\" ry=\"3.5\" fill=\"none\" stroke-width=\"2.4\"/><ellipse cx=\"27\" cy=\"16\" rx=\"9\" ry=\"3.5\" fill=\"none\" stroke-width=\"2.4\"/><path d=\"M13 18.5 v-4 M27 12.5 v-4\" stroke-width=\"2\"/><path d=\"M33 26 l4 3 M30 29 l2 4\" stroke-width=\"1.4\"/><\/svg><\/span><b>Ghana<\/b><span class=\"n\">6 in this lesson · Idiophone<\/span><small>Sound from the solid body itself.<\/small><small><b style=\"font-size:12.5px\">Ghatam · Jaltarang · Manjira · Kartal · Ghungroo · Morchang<\/b><\/small><\/div><\/div>","cap":"From the Natya Shastra: Tata is string, Sushira is breath, Avanaddha is a covered (skin) drum and Ghana is a solid body that is struck."},{"k":"table","title":"The four classes in Western terms","head":["Indian class","Western name","How it sounds"],"rows":[["Tata (string)","Chordophone","Sound from a vibrating string."],["Sushira (wind)","Aerophone","Sound from vibrating air."],["Avanaddha (membrane drum)","Membranophone","Sound from a stretched skin."],["Ghana (solid)","Idiophone","Sound from the solid body itself."]]},{"k":"trick","h":"<b>“TSAG — Tie, Sing, Add, Gong”<\/b>: <b>T<\/b>ata = tied strings, <b>S<\/b>ushira = sing with breath, <b>A<\/b>vanaddha = add a skin, <b>G<\/b>hana = gong (solid)."},{"k":"trap","h":"The <b>santoor<\/b> is struck with mallets but is <b>tata<\/b> (its strings vibrate). The <b>ghatam<\/b> is a pot drum but is <b>ghana<\/b> (no skin), while the <b>kanjira<\/b> has a skin, so it is <b>avanaddha<\/b>. The <b>jaltarang<\/b> uses water but is <b>ghana<\/b>, not wind."}],"sum":["The Natya Shastra of Bharata Muni sorts instruments into four classes.","Tata = string (sitar, veena, sarod, santoor, violin).","Sushira = wind (flute, shehnai, nadaswaram, harmonium).","Avanaddha = skin drum (tabla, mridangam, pakhawaj, dholak).","Ghana = solid (ghatam, jaltarang, manjira, kartal)."],"part":["Part 1 · Instruments and their maestros","वाद्य यंत्र और उनके उस्ताद"],"g":"mu"},
{"id":"M2","heat":3,"title":"String maestros: sitar, sarod, santoor, violin","hi":"तंतु वाद्य के उस्ताद","blocks":[{"k":"hot","h":"Among the commonest GK questions in SSC: <b>“X is associated with which instrument?”<\/b> Ravi Shankar–sitar, Amjad Ali Khan–sarod, Shivkumar Sharma–santoor and L. Subramaniam–violin come up again and again."},{"k":"story","h":"<p>In 1918 <b>Allauddin Khan<\/b> settled in the little town of <b>Maihar<\/b> (Madhya Pradesh). His pupils changed Indian music: his son <b>Ali Akbar Khan<\/b> (sarod), his daughter <b>Annapurna Devi<\/b> (surbahar) and <b>Ravi Shankar<\/b> (sitar), who later taught the Beatle George Harrison and made the sitar famous worldwide. Ravi Shankar's great rival on the sitar was <b>Vilayat Khan<\/b>.<\/p><p>Other strings have their own heroes. <b>Amjad Ali Khan<\/b> is the 'Sarod Samrat'. <b>Shivkumar Sharma<\/b> took the Kashmiri <b>santoor<\/b> to concert halls. <b>Ram Narayan<\/b> made the <b>sarangi<\/b> a solo instrument. <b>L. Subramaniam<\/b> and <b>N. Rajam<\/b> play the <b>violin<\/b>, and <b>Vishwa Mohan Bhatt<\/b> invented the <b>Mohan veena<\/b>.<\/p>","key":"Sitar — Ravi Shankar, Vilayat Khan; sarod — Amjad Ali Khan, Ali Akbar Khan; santoor — Shivkumar Sharma; violin — L. Subramaniam, N. Rajam; sarangi — Ram Narayan."},{"k":"photos","title":"String maestros in pictures","items":[["Ravi_Shankar","Ravi Shankar","Sitar · Bharat Ratna 1999"],["Vilayat_Khan","Vilayat Khan","Sitar · Imdadkhani"],["Amjad_Ali_Khan","Amjad Ali Khan","Sarod · 'Sarod Samrat'"],["Ali_Akbar_Khan","Ali Akbar Khan","Sarod · Maihar"],["Allauddin_Khan","Allauddin Khan","Sarod · founder of Maihar"],["Shivkumar_Sharma","Shivkumar Sharma","Santoor"],["L._Subramaniam","L. Subramaniam","Violin"],["N._Rajam","N. Rajam","Hindustani violin"],["Ram_Narayan","Ram Narayan","Sarangi"],["Vishwa_Mohan_Bhatt","Vishwa Mohan Bhatt","Mohan veena · Grammy 1994"],["Annapurna_Devi","Annapurna Devi","Surbahar"],["U._Srinivas","U. Srinivas","Mandolin"]]},{"k":"table","title":"String maestros","head":["Maestro","Instrument","Remember"],"rows":[["Ravi Shankar","Sitar","Taught George Harrison; Bharat Ratna 1999."],["Vilayat Khan","Sitar","Imdadkhani (Etawah) gharana."],["Nikhil Banerjee","Sitar","Maihar gharana."],["Anoushka Shankar","Sitar","Daughter of Ravi Shankar."],["Shahid Parvez","Sitar",""],["Amjad Ali Khan","Sarod","Called 'Sarod Samrat'; Senia-Bangash gharana."],["Ali Akbar Khan","Sarod","Son of Allauddin Khan; Maihar gharana."],["Allauddin Khan","Sarod","Founder of the Maihar gharana; guru of Ravi Shankar."],["Buddhadev Dasgupta","Sarod",""],["Shivkumar Sharma","Santoor","Brought the Kashmiri santoor to the classical stage."],["Bhajan Sopori","Santoor","From Kashmir — the 'Saint of the Santoor'."],["Rahul Sharma","Santoor","Son of Shivkumar Sharma."],["Tarun Bhattacharya","Santoor",""],["L. Subramaniam","Violin","Carnatic and Western; Padma Vibhushan 2025."],["N. Rajam","Violin","Hindustani violinist; Padma Vibhushan 2026."],["Lalgudi Jayaraman","Violin","Carnatic."],["M. S. Gopalakrishnan","Violin",""],["Kunnakudi Vaidyanathan","Violin",""],["Ram Narayan","Sarangi","Made the sarangi a solo concert instrument."],["Sultan Khan","Sarangi",""],["Asad Ali Khan","Rudra veena","A rare Dhrupad master of the rudra veena."],["Zia Mohiuddin Dagar","Rudra veena",""],["S. Balachander","Veena","Carnatic veena."],["E. Gayathri","Veena",""],["Chitti Babu","Veena",""],["Vishwa Mohan Bhatt","Mohan veena","Invented it from a guitar; Grammy 1994."],["Annapurna Devi","Surbahar","Daughter of Allauddin Khan; bass sitar."],["U. Srinivas","Mandolin","Brought the mandolin into Carnatic music."],["Brij Bhushan Kabra","Guitar","Slide guitar in Hindustani music; 'Call of the Valley' (1967)."]]},{"k":"trick","h":"<b>“Ravi's Sitar, Amjad's Sarod, Shiv's Santoor”<\/b> — three S-instruments. <b>“Ram's Sarangi”<\/b> and <b>“Subramaniam's Strings”<\/b> (violin)."},{"k":"trap","h":"<b>Amjad Ali Khan<\/b> plays the <b>sarod<\/b>, <b>Asad Ali Khan<\/b> the <b>rudra veena<\/b> — similar names. <b>N. Rajam<\/b> plays violin in the <b>Hindustani<\/b> style, though she is from the south. <b>Rahul Sharma<\/b> (santoor) is Shivkumar's son; <b>Rakesh Chaurasia<\/b> (flute) is Hariprasad's nephew."}],"sum":["Sitar: Ravi Shankar, Vilayat Khan, Nikhil Banerjee, Anoushka Shankar.","Sarod: Amjad Ali Khan, Ali Akbar Khan, Allauddin Khan.","Santoor: Shivkumar Sharma, Bhajan Sopori, Rahul Sharma.","Violin: L. Subramaniam, N. Rajam, Lalgudi Jayaraman; sarangi: Ram Narayan, Sultan Khan.","Mohan veena: Vishwa Mohan Bhatt; mandolin: U. Srinivas; rudra veena: Asad Ali Khan."],"part":["Part 1 · Instruments and their maestros","वाद्य यंत्र और उनके उस्ताद"],"g":"mu"},
{"id":"M3","heat":3,"title":"Wind and percussion maestros","hi":"सुषिर और ताल वाद्य के उस्ताद","blocks":[{"k":"hot","h":"Equally common: <b>Bismillah Khan–shehnai<\/b>, <b>Hariprasad Chaurasia–flute<\/b>, <b>Zakir Hussain–tabla<\/b>. Carnatic names also appear: Palghat Mani Iyer (mridangam), Vikku Vinayakram (ghatam), Kadri Gopalnath (saxophone)."},{"k":"story","h":"<p>On the night of <b>15 August 1947<\/b>, <b>Bismillah Khan<\/b> of Varanasi played the <b>shehnai<\/b> at the Red Fort to welcome freedom. He took a wedding instrument to the concert stage and got the <b>Bharat Ratna in 2001<\/b>. <b>Pannalal Ghosh<\/b> did the same for the bamboo <b>flute<\/b>, and <b>Hariprasad Chaurasia<\/b> made it loved everywhere.<\/p><p>For rhythm, <b>Alla Rakha<\/b> and his son <b>Zakir Hussain<\/b> made the <b>tabla<\/b> a world instrument; Zakir won <b>three Grammys in one night in 2024<\/b> and died in December 2024. In the south, <b>Palghat Mani Iyer<\/b> ruled the <b>mridangam<\/b> and <b>Vikku Vinayakram<\/b> the <b>ghatam<\/b>, while <b>Kadri Gopalnath<\/b> played Carnatic music on a Western <b>saxophone<\/b>.<\/p>","key":"Shehnai — Bismillah Khan; flute — Hariprasad Chaurasia, Pannalal Ghosh; tabla — Zakir Hussain, Alla Rakha; mridangam — Palghat Mani Iyer; ghatam — Vikku Vinayakram."},{"k":"photos","title":"Wind and percussion maestros in pictures","items":[["Bismillah_Khan","Bismillah Khan","Shehnai · Bharat Ratna 2001"],["Hariprasad_Chaurasia","Hariprasad Chaurasia","Flute"],["Pannalal_Ghosh","Pannalal Ghosh","Flute"],["Zakir_Hussain_(musician)","Zakir Hussain","Tabla"],["Alla_Rakha","Alla Rakha","Tabla · Punjab gharana"],["Kishan_Maharaj","Kishan Maharaj","Tabla · Benares"],["Palghat_Mani_Iyer","Palghat Mani Iyer","Mridangam"],["Vikku_Vinayakram","Vikku Vinayakram","Ghatam"],["Kadri_Gopalnath","Kadri Gopalnath","Saxophone"]]},{"k":"bars","title":"Maestros in this app, by instrument","unit":"","rows":[["Sitar",5,""],["Sarod",4,""],["Santoor",4,""],["Violin",5,""],["Sarangi",2,""],["Rudra veena",2,""],["Veena",3,""],["Shehnai",2,""],["Flute",6,""],["Tabla",5,""],["Mridangam",3,""],["Nadaswaram",2,""]],"hi":4,"cap":"The sitar, the violin, the tabla and the flute have the most names to learn — start revision with them."},{"k":"table","title":"Wind and percussion maestros","head":["Maestro","Instrument","Remember"],"rows":[["Bismillah Khan","Shehnai","Played at the Red Fort on 15 August 1947; Bharat Ratna 2001."],["Ali Ahmad Hussain Khan","Shehnai",""],["Hariprasad Chaurasia","Flute","With Shivkumar Sharma he made the film-music duo Shiv–Hari."],["Pannalal Ghosh","Flute","Made the bansuri a classical concert instrument."],["T. R. Mahalingam","Flute","Carnatic flute ('Mali')."],["N. Ramani","Flute","Carnatic."],["Ronu Majumdar","Flute",""],["Rakesh Chaurasia","Flute","Nephew of Hariprasad Chaurasia; Grammy 2024."],["Zakir Hussain","Tabla","Three Grammys in one night (2024); died December 2024."],["Alla Rakha","Tabla","Father of Zakir Hussain; Punjab gharana."],["Kishan Maharaj","Tabla","Benares gharana."],["Samta Prasad","Tabla","Benares gharana."],["Anindo Chatterjee","Tabla",""],["Palghat Mani Iyer","Mridangam","A legend of the Carnatic mridangam."],["Umayalpuram K. Sivaraman","Mridangam",""],["Karaikudi Mani","Mridangam",""],["Vikku Vinayakram","Ghatam","Took the ghatam to the world with Shakti."],["V. Selvaganesh","Kanjira","Son of Vikku Vinayakram; Grammy 2024 with Shakti."],["Pagal Das","Pakhawaj",""],["Kadri Gopalnath","Saxophone","Played Carnatic music on the saxophone."],["T. N. Rajarathnam Pillai","Nadaswaram",""],["Sheikh Chinna Moulana","Nadaswaram",""],["Tulsidas Borkar","Harmonium",""]]},{"k":"trick","h":"<b>“Bismillah blows, Hari whistles, Zakir taps”<\/b> — shehnai, flute, tabla. <b>“Vikku's pot”<\/b> = ghatam; <b>“Kadri's sax”<\/b>."},{"k":"trap","h":"<b>Zakir Hussain<\/b> the tabla player is not the former President <b>Zakir Husain<\/b>. <b>Alla Rakha<\/b> is the tabla player; <b>A. R. Rahman<\/b> is a composer. The <b>nadaswaram<\/b> (Tamil Nadu) is a wind instrument like the shehnai, played with the <b>thavil<\/b> drum."}],"sum":["Shehnai: Bismillah Khan (Bharat Ratna 2001), Ali Ahmad Hussain Khan.","Flute: Hariprasad Chaurasia, Pannalal Ghosh, T. R. Mahalingam, N. Ramani.","Tabla: Zakir Hussain, Alla Rakha, Kishan Maharaj, Samta Prasad.","Mridangam: Palghat Mani Iyer, Umayalpuram K. Sivaraman; ghatam: Vikku Vinayakram.","Saxophone: Kadri Gopalnath; nadaswaram: T. N. Rajarathnam Pillai; pakhawaj: Pagal Das."],"part":["Part 1 · Instruments and their maestros","वाद्य यंत्र और उनके उस्ताद"],"g":"mu"},
{"id":"M4","heat":3,"title":"Hindustani and Carnatic: the great names","hi":"हिंदुस्तानी और कर्नाटक संगीत: महान नाम","blocks":[{"k":"hot","h":"Regular questions: the <b>Carnatic trinity<\/b> (Tyagaraja, Muthuswami Dikshitar, Syama Sastri), the <b>father of Carnatic music<\/b> (Purandara Dasa), <b>Tansen<\/b> and his guru <b>Swami Haridas<\/b>, and <b>Amir Khusrau<\/b> (Tuti-e-Hind)."},{"k":"story","h":"<p>Indian classical music grew from one root but split into two branches. In the north, <b>Hindustani<\/b> music met Persian and Sufi ideas at the Sultanate and Mughal courts. <b>Amir Khusrau<\/b> (13th–14th century) created the <b>qawwali<\/b> and <b>tarana<\/b>; <b>Tansen<\/b>, pupil of <b>Swami Haridas<\/b>, sang Dhrupad at <b>Akbar's<\/b> court. Much later <b>V. N. Bhatkhande<\/b> sorted the ragas into <b>ten thaats<\/b>, and <b>V. D. Paluskar<\/b> opened a music school for ordinary people in <b>1901<\/b>.<\/p><p>In the south, <b>Carnatic<\/b> music stayed close to temples and devotion. <b>Purandara Dasa<\/b> is its father. Around 1800 three composers, all born in <b>Tiruvarur<\/b>, gave it its classic songs: <b>Tyagaraja<\/b>, <b>Muthuswami Dikshitar<\/b> and <b>Syama Sastri<\/b> — the <b>Trinity<\/b>.<\/p>","key":"Carnatic: father Purandara Dasa; Trinity Tyagaraja–Dikshitar–Syama Sastri. Hindustani: Amir Khusrau, Tansen (guru Swami Haridas), Bhatkhande (10 thaats), Paluskar (1901)."},{"k":"photos","title":"In pictures","items":[["Tansen","Tansen","Akbar's court"],["Amir_Khusrau","Amir Khusrau","Tuti-e-Hind"],["Tyagaraja","Tyagaraja","Carnatic Trinity · Telugu"],["Purandara_Dasa","Purandara Dasa","Father of Carnatic music"],["Vishnu_Narayan_Bhatkhande","V. N. Bhatkhande","Ten thaats"],["Swathi_Thirunal_Rama_Varma","Swathi Thirunal","Travancore"]]},{"k":"table","title":"Who's who of classical music","head":["Known as / for","Person","Note"],"rows":[["Father of Carnatic music","Purandara Dasa","16th century, Vijayanagara; set the basic lessons every Carnatic student still learns."],["Trinity member who composed mostly in Telugu; Aradhana festival at Thiruvaiyaru","Tyagaraja","The Tyagaraja Aradhana is held every January at his samadhi on the Kaveri."],["Trinity member who composed mostly in Sanskrit","Muthuswami Dikshitar","Youngest of the three."],["Eldest member of the Carnatic trinity","Syama Sastri","Known for kritis to the goddess Kamakshi."],["Court musician of Akbar, one of his 'nine gems'","Tansen","Buried in Gwalior; the Tansen Samaroh is held there every December."],["Guru of Tansen","Swami Haridas","A saint-musician of Vrindavan."],["Called 'Tuti-e-Hind' (Parrot of India); father of qawwali","Amir Khusrau","Poet at the Delhi Sultanate court; tradition credits him with the sitar and tabla."],["Founded the Gandharva Mahavidyalaya at Lahore (1901)","Vishnu Digambar Paluskar","Set 'Raghupati Raghava Raja Ram' to music."],["Sorted Hindustani ragas into ten thaats","Vishnu Narayan Bhatkhande","Also wrote a widely used notation system."],["Wrote the Sangita Ratnakara (13th century)","Sarngadeva","A key text for both Hindustani and Carnatic music."],["Set out the 72 melakarta scheme of Carnatic music","Venkatamakhin","In the Chaturdandi Prakasika (17th century)."],["Raja of Gwalior who promoted Dhrupad","Man Singh Tomar","15th–16th century."],["Wrote the Gita Govinda, sung in temples of Odisha","Jayadeva","12th-century poet."],["Legendary singer-rival of Tansen","Baiju Bawra",""],["Pen-name 'Sadarang'; made the khayal popular at Muhammad Shah's court","Niyamat Khan","18th century, Delhi."],["Maharaja of Travancore who composed in both Carnatic and Hindustani styles","Swathi Thirunal",""]]},{"k":"tlfig","title":"From Jayadeva to Bhatkhande","rows":[[1170,"Jayadeva","Gita Govinda"],[1230,"Sarngadeva","Sangita Ratnakara"],[1300,"Amir Khusrau","father of qawwali"],[1500,"Man Singh Tomar","Dhrupad, Gwalior"],[1530,"Purandara Dasa","father of Carnatic"],[1570,"Tansen","Akbar's court"],[1660,"Venkatamakhin","72 melakartas"],[1730,"Sadarang","the khayal"],[1790,"Carnatic Trinity","Tyagaraja · Dikshitar · Syama Sastri"],[1835,"Swathi Thirunal","Travancore"],[1901,"Paluskar","Gandharva Mahavidyalaya"],[1930,"Bhatkhande","10 thaats"]],"cap":"Years are approximate (the century is what exams ask). Medieval texts first, then Tansen in the Mughal court, the Trinity around 1800, and the modern teachers."},{"k":"table","title":"Hindustani vs Carnatic","head":["","Hindustani","Carnatic"],"rows":[["Region","North India","South India"],["Parent scales","10 thaats (Bhatkhande)","72 melakartas (Venkatamakhin)"],["Main vocal forms","Dhrupad, khayal, thumri, tarana","Kriti, varnam, tillana"],["Main drums","Tabla, pakhawaj","Mridangam, ghatam, kanjira"],["Other typical instruments","Sitar, sarod, sarangi, shehnai, santoor","Veena, violin, nadaswaram"],["Influences","Persian and Sufi ideas at royal courts","Mostly temple and devotional"],["Great names","Amir Khusrau, Tansen, Bhatkhande, Paluskar","Purandara Dasa, the Trinity, Swathi Thirunal"]]},{"k":"trick","h":"Trinity = <b>“TDS”<\/b> — <b>T<\/b>yagaraja (Telugu), <b>D<\/b>ikshitar (Sanskrit, the youngest), <b>S<\/b>yama Sastri (the eldest). All three were born in <b>Tiruvarur<\/b>, Tamil Nadu."},{"k":"trap","h":"<b>Bhatkhande<\/b> and <b>Paluskar<\/b> are both called Vishnu and both worked for Hindustani music — Bhatkhande = <b>thaats<\/b>, Paluskar = <b>Gandharva Mahavidyalaya<\/b>. <b>Purandara Dasa<\/b> is the father of Carnatic music but is <b>not<\/b> part of the Trinity."}],"sum":["Purandara Dasa is the father of Carnatic music.","The Carnatic trinity: Tyagaraja, Muthuswami Dikshitar and Syama Sastri — all born in Tiruvarur.","Tansen sang at Akbar's court; his guru was Swami Haridas.","Amir Khusrau (Tuti-e-Hind) gave us qawwali and tarana.","Bhatkhande made the 10-thaat system; Paluskar founded the Gandharva Mahavidyalaya (1901)."],"part":["Part 2 · Classical music: traditions, gharanas, ragas","शास्त्रीय संगीत: परंपराएँ, घराने, राग"],"g":"mu"},
{"id":"M5","heat":2,"title":"Gharanas of Hindustani music","hi":"हिंदुस्तानी संगीत के घराने","blocks":[{"k":"hot","h":"Asked as <b>“Pandit Jasraj / Bhimsen Joshi / Kishori Amonkar belonged to which gharana?”<\/b> Remember Kirana (Bhimsen Joshi, Gangubai Hangal), Mewati (Jasraj), Jaipur-Atrauli (Kishori Amonkar), Patiala (Bade Ghulam Ali Khan) and Gwalior (the oldest khayal gharana)."},{"k":"story","h":"<p>A <b>gharana<\/b> ('household') is a family or school of music. Its style passes from guru to shishya, often from father to son, and carries the name of a town. The <b>Gwalior<\/b> gharana is the oldest khayal school. The <b>Kirana<\/b> gharana, from Kairana in Uttar Pradesh, gave us <b>Bhimsen Joshi<\/b> and <b>Gangubai Hangal<\/b>.<\/p><p><b>Kishori Amonkar<\/b> sang in the <b>Jaipur-Atrauli<\/b> style founded by Alladiya Khan; <b>Pandit Jasraj<\/b> led the <b>Mewati<\/b> gharana; <b>Bade Ghulam Ali Khan<\/b> was the star of <b>Patiala<\/b>. Instrumentalists have gharanas too: <b>Maihar<\/b> (Ravi Shankar), <b>Imdadkhani<\/b> (Vilayat Khan), and the tabla gharanas of <b>Punjab<\/b> and <b>Benares<\/b>.<\/p>","key":"Kirana — Bhimsen Joshi, Gangubai Hangal; Mewati — Jasraj; Jaipur-Atrauli — Kishori Amonkar; Patiala — Bade Ghulam Ali Khan; Gwalior — oldest."},{"k":"table","title":"Musicians and their gharanas","head":["Musician","Gharana","Note"],"rows":[["Bhimsen Joshi","Kirana","Bharat Ratna; famous for 'Mile Sur Mera Tumhara'."],["Gangubai Hangal","Kirana","From Hubballi-Dharwad, Karnataka."],["Abdul Karim Khan","Kirana","Founder of the Kirana gharana."],["Prabha Atre","Kirana",""],["Kishori Amonkar","Jaipur-Atrauli","Daughter of Mogubai Kurdikar."],["Alladiya Khan","Jaipur-Atrauli","Founder of the Jaipur-Atrauli gharana."],["Mallikarjun Mansur","Jaipur-Atrauli",""],["Pandit Jasraj","Mewati","A minor planet is named after him."],["Bade Ghulam Ali Khan","Patiala",""],["Faiyaz Khan","Agra",""],["Rashid Khan","Rampur-Sahaswan",""],["Amir Khan","Indore","Founder of the Indore gharana."],["Haddu Khan and Hassu Khan","Gwalior","Gwalior is the oldest khayal gharana."],["Girija Devi","Benares","'Queen of thumri'."],["Ravi Shankar, Ali Akbar Khan, Annapurna Devi","Maihar","All pupils of Allauddin Khan."],["Vilayat Khan","Imdadkhani (Etawah)",""],["Alla Rakha (tabla)","Punjab",""],["The Dagar family (Dhrupad)","Dagar vani",""]]},{"k":"mapfig","title":"Where the gharanas are named from","pins":[["1",77.2,29.4,"Kirana — Kairana, UP · Abdul Karim Khan, Bhimsen Joshi","n"],["2",76.4,30.34,"Patiala — Punjab · Bade Ghulam Ali Khan","n"],["3",79.03,28.8,"Rampur-Sahaswan — UP · Rashid Khan","n"],["4",77,28,"Mewati — Mewat · Pandit Jasraj","n"],["5",75.8,26.9,"Jaipur-Atrauli — Rajasthan · Alladiya Khan, Kishori Amonkar","n"],["6",78,27.2,"Agra — UP · Faiyaz Khan","n"],["7",79.02,26.78,"Imdadkhani (Etawah) — UP · Vilayat Khan","n"],["8",78.18,26.22,"Gwalior — MP · the oldest khayal gharana","n"],["9",82.97,25.32,"Benares — UP · Girija Devi, Kishan Maharaj","n"],["10",80.76,24.27,"Maihar — MP · Allauddin Khan, Ravi Shankar","n"],["11",75.86,22.72,"Indore — MP · Amir Khan","n"]],"vb":"60 90 320 240","facts":[["1 · Kirana","Kairana, UP · Abdul Karim Khan, Bhimsen Joshi"],["2 · Patiala","Punjab · Bade Ghulam Ali Khan"],["3 · Rampur-Sahaswan","UP · Rashid Khan"],["4 · Mewati","Mewat · Pandit Jasraj"],["5 · Jaipur-Atrauli","Rajasthan · Alladiya Khan, Kishori Amonkar"],["6 · Agra","UP · Faiyaz Khan"],["7 · Imdadkhani (Etawah)","UP · Vilayat Khan"],["8 · Gwalior","MP · the oldest khayal gharana"],["9 · Benares","UP · Girija Devi, Kishan Maharaj"],["10 · Maihar","MP · Allauddin Khan, Ravi Shankar"],["11 · Indore","MP · Amir Khan"]],"cap":"A gharana is named after the town its founder came from. Most cluster between Delhi, Agra and Gwalior — the old Mughal and Gwalior courts."},{"k":"trick","h":"<b>“Bhim and Ganga live in Kirana”<\/b> (Bhimsen Joshi, Gangubai Hangal). <b>“Jas–Mew”<\/b>: Jasraj–Mewati. <b>“Kishori goes to Jaipur”<\/b>."},{"k":"trap","h":"The <b>Kirana<\/b> gharana is named after <b>Kairana<\/b> in UP, though its stars came from Karnataka and Maharashtra. <b>Gwalior<\/b> is the oldest <b>khayal<\/b> gharana; Dhrupad is older still and is kept alive by the <b>Dagar<\/b> family."}],"sum":["A gharana is a family or school of music named after a town.","Kirana: Abdul Karim Khan (founder), Bhimsen Joshi, Gangubai Hangal, Prabha Atre.","Jaipur-Atrauli: Alladiya Khan (founder), Kishori Amonkar, Mallikarjun Mansur.","Mewati: Pandit Jasraj; Patiala: Bade Ghulam Ali Khan; Agra: Faiyaz Khan.","Gwalior is the oldest khayal gharana; Maihar is Allauddin Khan's school."],"part":["Part 2 · Classical music: traditions, gharanas, ragas","शास्त्रीय संगीत: परंपराएँ, घराने, राग"],"g":"mu"},
{"id":"M6","heat":2,"title":"Ragas, their times, and musical terms","hi":"राग, उनका समय और संगीत शब्दावली","blocks":[{"k":"hot","h":"Asked: the <b>time or season<\/b> of a raga (Bhairav — morning, Yaman — evening, Malhar — rain, Deepak — fire), and the meaning of <b>terms<\/b> — raga, tala, alap, thaat, melakarta, shruti — and of forms like <b>Dhrupad, khayal, thumri, qawwali<\/b>."},{"k":"story","h":"<p>A <b>raga<\/b> is not just a tune; it is a set of notes with rules and a mood. Hindustani tradition gives each raga a <b>time of day<\/b>: <b>Bhairav<\/b> greets the dawn, <b>Bhimpalasi<\/b> fills the afternoon, <b>Marwa<\/b> belongs to sunset, <b>Yaman<\/b> to the evening and <b>Darbari Kanada<\/b> to late night. Some belong to <b>seasons<\/b>: <b>Malhar<\/b> to the monsoon, <b>Basant<\/b> to spring.<\/p><p>Legends grew around them: <b>Tansen<\/b> is said to have lit lamps by singing <b>Raga Deepak<\/b> and brought rain with <b>Megh Malhar<\/b>. Rhythm is counted in a <b>tala<\/b> — a cycle of beats whose first beat is <b>sam<\/b>. A recital opens slowly with the <b>alap<\/b> and ends fast with the <b>jhala<\/b>.<\/p>","key":"Bhairav — dawn; Yaman — evening; Darbari — late night; Malhar — rain; Basant — spring; Deepak — fire (legend)."},{"k":"photos","title":"In pictures","items":[["Tanpura","Tanpura","The drone behind every raga"],["Harmonium","Harmonium","Free-reed keyboard"],["Tala_(music)","Tala","The cycle of beats"]]},{"k":"table","title":"Ragas and their time","head":["Raga","Time / season","Note"],"rows":[["Bhairav","Early morning (dawn)","Sung at sunrise."],["Ahir Bhairav","Early morning (dawn)",""],["Todi","Late morning",""],["Bhimpalasi","Afternoon",""],["Multani","Afternoon",""],["Marwa","Sunset (dusk)",""],["Puriya Dhanashri","Sunset (dusk)",""],["Yaman","Evening (early night)","One of the first ragas a student learns."],["Bhupali","Evening (early night)",""],["Darbari Kanada","Late night","Credited to Tansen."],["Malkauns","Late night",""],["Miyan ki Malhar","Monsoon (rain)","Credited to Tansen; said to bring rain."],["Megh","Monsoon (rain)",""],["Basant","Spring",""],["Bahar","Spring",""]]},{"k":"info","title":"Ragas round the clock","html":"<div class=\"map-wrap\" style=\"align-items:center\"><div style=\"max-width:460px;margin:0 auto;width:100%\"><svg class=\"dg\" viewBox=\"0 0 460 320\" role=\"img\" aria-label=\"Ragas round the clock\"><circle cx=\"230\" cy=\"160\" r=\"108\" class=\"card\"/><path d=\"M230 52 A108 108 0 0 1 230 268 Z\" class=\"s2\" transform=\"rotate(-90 230 160)\" opacity=\".7\"/><path d=\"M230 52 A108 108 0 0 1 230 268 Z\" class=\"s3\" transform=\"rotate(90 230 160)\" opacity=\".7\"/><line x1=\"230.0\" y1=\"262.0\" x2=\"230.0\" y2=\"268.0\" class=\"grid\"/><text x=\"230.0\" y=\"254.0\" text-anchor=\"middle\" font-size=\"10\" class=\"mut\">12am<\/text><line x1=\"157.9\" y1=\"232.1\" x2=\"153.6\" y2=\"236.4\" class=\"grid\"/><text x=\"166.4\" y=\"227.6\" text-anchor=\"middle\" font-size=\"10\" class=\"mut\">3am<\/text><line x1=\"128.0\" y1=\"160.0\" x2=\"122.0\" y2=\"160.0\" class=\"grid\"/><text x=\"140.0\" y=\"164.0\" text-anchor=\"middle\" font-size=\"10\" class=\"mut\">6am<\/text><line x1=\"157.9\" y1=\"87.9\" x2=\"153.6\" y2=\"83.6\" class=\"grid\"/><text x=\"166.4\" y=\"100.4\" text-anchor=\"middle\" font-size=\"10\" class=\"mut\">9am<\/text><line x1=\"230.0\" y1=\"58.0\" x2=\"230.0\" y2=\"52.0\" class=\"grid\"/><text x=\"230.0\" y=\"74.0\" text-anchor=\"middle\" font-size=\"10\" class=\"mut\">noon<\/text><line x1=\"302.1\" y1=\"87.9\" x2=\"306.4\" y2=\"83.6\" class=\"grid\"/><text x=\"293.6\" y=\"100.4\" text-anchor=\"middle\" font-size=\"10\" class=\"mut\">3pm<\/text><line x1=\"332.0\" y1=\"160.0\" x2=\"338.0\" y2=\"160.0\" class=\"grid\"/><text x=\"320.0\" y=\"164.0\" text-anchor=\"middle\" font-size=\"10\" class=\"mut\">6pm<\/text><line x1=\"302.1\" y1=\"232.1\" x2=\"306.4\" y2=\"236.4\" class=\"grid\"/><text x=\"293.6\" y=\"227.6\" text-anchor=\"middle\" font-size=\"10\" class=\"mut\">9pm<\/text><text x=\"230\" y=\"130\" text-anchor=\"middle\" font-size=\"12\" class=\"mut\">☀ day<\/text><text x=\"230\" y=\"200\" text-anchor=\"middle\" font-size=\"12\" class=\"mut\">☾ night<\/text><circle cx=\"122.0\" cy=\"160.0\" r=\"5\" class=\"acc\"/><text x=\"106.0\" y=\"164.0\" text-anchor=\"end\" font-size=\"11.5\" class=\"b\">Bhairav<\/text><text x=\"106.0\" y=\"176.0\" text-anchor=\"end\" font-size=\"11.5\" class=\"b\">Ahir Bhairav<\/text><circle cx=\"176.0\" cy=\"66.5\" r=\"5\" class=\"acc\"/><text x=\"168.0\" y=\"56.6\" text-anchor=\"end\" font-size=\"11.5\" class=\"b\">Todi<\/text><circle cx=\"284.0\" cy=\"66.5\" r=\"5\" class=\"acc\"/><text x=\"292.0\" y=\"44.6\" text-anchor=\"start\" font-size=\"11.5\" class=\"b\">Bhimpalasi<\/text><text x=\"292.0\" y=\"56.6\" text-anchor=\"start\" font-size=\"11.5\" class=\"b\">Multani<\/text><circle cx=\"338.0\" cy=\"160.0\" r=\"5\" class=\"acc\"/><text x=\"354.0\" y=\"164.0\" text-anchor=\"start\" font-size=\"11.5\" class=\"b\">Marwa<\/text><text x=\"354.0\" y=\"176.0\" text-anchor=\"start\" font-size=\"11.5\" class=\"b\">Puriya Dhanashri<\/text><circle cx=\"306.4\" cy=\"236.4\" r=\"5\" class=\"acc\"/><text x=\"317.7\" y=\"251.7\" text-anchor=\"start\" font-size=\"11.5\" class=\"b\">Yaman<\/text><text x=\"317.7\" y=\"263.7\" text-anchor=\"start\" font-size=\"11.5\" class=\"b\">Bhupali<\/text><circle cx=\"230.0\" cy=\"268.0\" r=\"5\" class=\"acc\"/><text x=\"230.0\" y=\"288.0\" text-anchor=\"middle\" font-size=\"11.5\" class=\"b\">Darbari Kanada<\/text><text x=\"230.0\" y=\"300.0\" text-anchor=\"middle\" font-size=\"11.5\" class=\"b\">Malkauns<\/text><\/svg><\/div><div class=\"fam\" style=\"grid-template-columns:1fr\"><div><span class=\"ic\" aria-hidden=\"true\">🌧️<\/span><b>Monsoon (rain)<\/b><small>Miyan ki Malhar — Credited to Tansen; said to bring rain.<br>Megh<\/small><\/div><div><span class=\"ic\" aria-hidden=\"true\">🌸<\/span><b>Spring<\/b><small>Basant<br>Bahar<\/small><\/div><\/div><\/div>","cap":"Hindustani ragas have a time of day (the samay). Dawn: Bhairav. Evening: Yaman. Late night: Darbari and Malkauns. The Malhar ragas are for the rains."},{"k":"table","title":"Musical terms and forms","head":["Term","Meaning","Note"],"rows":[["Raga","A melodic framework of notes with set rules",""],["Tala","A repeating cycle of beats (rhythm)","Teentaal has 16 beats."],["Sam","The first beat of a tala cycle",""],["Khali","The 'empty' beat shown by a wave of the hand",""],["Alap","The slow opening of a raga, without rhythm",""],["Taan","A fast run of notes in a raga",""],["Jhala","The fast closing part of an instrumental recital",""],["Thaat","A parent scale in Hindustani music (there are 10)",""],["Melakarta","A parent scale in Carnatic music (there are 72)",""],["Saptak","The octave — the seven notes Sa Re Ga Ma Pa Dha Ni",""],["Shruti","A microtone — the smallest step of pitch (22 in an octave)",""],["Bandish","A fixed composition in Hindustani vocal music",""],["Kriti","The main composition form of Carnatic music",""],["Dhrupad","The oldest surviving Hindustani vocal form, slow and grand","Sung by the Dagar family; Tansen was a Dhrupad singer."],["Khayal","The most popular Hindustani vocal form; the word means 'imagination'",""],["Thumri","A light-classical, romantic form linked with Lucknow and Banaras",""],["Tarana","A fast vocal form sung with syllables like 'tana dere na'","Credited to Amir Khusrau; the Carnatic version is the tillana."],["Qawwali","Sufi devotional singing, often at dargahs","Credited to Amir Khusrau."]]},{"k":"facts","title":"The seven notes (sapta swara)","rows":[["Sa","Shadja"],["Re","Rishabh"],["Ga","Gandhar"],["Ma","Madhyam"],["Pa","Pancham"],["Dha","Dhaivat"],["Ni","Nishad"]]},{"k":"info","title":"The sapta swara as a staircase","html":"<svg class=\"dg\" viewBox=\"0 0 680 210\" role=\"img\" aria-label=\"The seven notes rising\"><rect x=\"14\" y=\"90\" width=\"84\" height=\"114\" rx=\"8\" class=\"abg\"/><text x=\"56\" y=\"120\" text-anchor=\"middle\" font-size=\"22\" class=\"b\">Sa<\/text><text x=\"56\" y=\"140\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">Shadja<\/text><rect x=\"108\" y=\"75\" width=\"84\" height=\"129\" rx=\"8\" class=\"bbg\"/><text x=\"150\" y=\"105\" text-anchor=\"middle\" font-size=\"22\" class=\"b\">Re<\/text><text x=\"150\" y=\"125\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">Rishabh<\/text><rect x=\"202\" y=\"60\" width=\"84\" height=\"144\" rx=\"8\" class=\"abg\"/><text x=\"244\" y=\"90\" text-anchor=\"middle\" font-size=\"22\" class=\"b\">Ga<\/text><text x=\"244\" y=\"110\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">Gandhar<\/text><rect x=\"296\" y=\"45\" width=\"84\" height=\"159\" rx=\"8\" class=\"bbg\"/><text x=\"338\" y=\"75\" text-anchor=\"middle\" font-size=\"22\" class=\"b\">Ma<\/text><text x=\"338\" y=\"95\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">Madhyam<\/text><rect x=\"390\" y=\"30\" width=\"84\" height=\"174\" rx=\"8\" class=\"abg\"/><text x=\"432\" y=\"60\" text-anchor=\"middle\" font-size=\"22\" class=\"b\">Pa<\/text><text x=\"432\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">Pancham<\/text><rect x=\"484\" y=\"15\" width=\"84\" height=\"189\" rx=\"8\" class=\"bbg\"/><text x=\"526\" y=\"45\" text-anchor=\"middle\" font-size=\"22\" class=\"b\">Dha<\/text><text x=\"526\" y=\"65\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">Dhaivat<\/text><rect x=\"578\" y=\"0\" width=\"84\" height=\"204\" rx=\"8\" class=\"abg\"/><text x=\"620\" y=\"30\" text-anchor=\"middle\" font-size=\"22\" class=\"b\">Ni<\/text><text x=\"620\" y=\"50\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">Nishad<\/text><\/svg>","cap":"Sa Re Ga Ma Pa Dha Ni — Sa and Pa are the fixed notes (achal swara); the other five can be flat or sharp."},{"k":"trick","h":"A day of ragas: <b>“Bhairav wakes, Todi works, Bhimpalasi rests, Marwa sets, Yaman lights, Darbari sleeps.”<\/b> Seasons: <b>Malhar = monsoon<\/b>, <b>Basant = spring<\/b>."},{"k":"trap","h":"<b>Thaat<\/b> = 10 parent scales (Hindustani); <b>melakarta<\/b> = 72 (Carnatic). <b>Tarana<\/b> is Hindustani; its Carnatic cousin is the <b>tillana<\/b>. <b>Raga Deepak<\/b> is linked with fire, <b>Malhar<\/b> with rain — don't swap them."}],"sum":["Each Hindustani raga has a time or season: Bhairav dawn, Yaman evening, Darbari late night.","Malhar ragas belong to the monsoon; Basant and Bahar to spring; Deepak to fire (legend).","Tala is the rhythm cycle; sam is its first beat; alap is the slow opening.","10 thaats in Hindustani music, 72 melakartas in Carnatic music; 22 shrutis in an octave.","Dhrupad is the oldest vocal form; khayal the most popular; qawwali and tarana are credited to Amir Khusrau."],"part":["Part 2 · Classical music: traditions, gharanas, ragas","शास्त्रीय संगीत: परंपराएँ, घराने, राग"],"g":"mu"},
{"id":"M7","heat":3,"title":"Great singers","hi":"महान गायक","blocks":[{"k":"hot","h":"Asked: the <b>style<\/b> of a singer (Hindustani, Carnatic, ghazal, folk), their <b>nicknames<\/b> ('Nightingale of India', 'Mallika-e-Ghazal') and their <b>firsts<\/b> — M. S. Subbulakshmi first musician with the Bharat Ratna, first Indian musician to sing at the <b>UN<\/b> (1966)."},{"k":"story","h":"<p>Indian singing has many voices. In the Hindustani world, <b>Bhimsen Joshi<\/b> and <b>Gangubai Hangal<\/b> carried the Kirana style, <b>Kishori Amonkar<\/b> the Jaipur-Atrauli style and <b>Pandit Jasraj<\/b> the Mewati style. In the south, <b>M. S. Subbulakshmi<\/b> sang at the <b>United Nations in 1966<\/b>, won the <b>Ramon Magsaysay Award (1974)<\/b> and became the first musician to get the <b>Bharat Ratna (1998)<\/b>.<\/p><p>Beyond classical music, <b>Begum Akhtar<\/b> became the queen of <b>ghazal<\/b>, <b>Lata Mangeshkar<\/b> sang for Indian films for seven decades, <b>Bhupen Hazarika<\/b> carried Assamese folk songs to the world, and <b>Teejan Bai<\/b> sings the Mahabharata in the <b>Pandavani<\/b> style of Chhattisgarh.<\/p>","key":"Hindustani — Bhimsen Joshi, Kishori Amonkar, Jasraj; Carnatic — M. S. Subbulakshmi; ghazal — Begum Akhtar, Jagjit Singh; Pandavani — Teejan Bai."},{"k":"photos","title":"Singers in pictures","items":[["M._S._Subbulakshmi","M. S. Subbulakshmi","Carnatic · Bharat Ratna 1998"],["Bhimsen_Joshi","Bhimsen Joshi","Kirana gharana"],["Kishori_Amonkar","Kishori Amonkar","Jaipur-Atrauli"],["Pandit_Jasraj","Pandit Jasraj","Mewati"],["Girija_Devi","Girija Devi","Queen of thumri"],["Kumar_Gandharva","Kumar Gandharva","Dewas, MP"],["M._Balamuralikrishna","M. Balamuralikrishna","Carnatic"],["Begum_Akhtar","Begum Akhtar","Mallika-e-Ghazal"],["Lata_Mangeshkar","Lata Mangeshkar","Nightingale of India"],["Bhupen_Hazarika","Bhupen Hazarika","Sudhakantha"],["Teejan_Bai","Teejan Bai","Pandavani"],["Sharda_Sinha","Sharda Sinha","Chhath songs"]]},{"k":"table","title":"Singers and their style","head":["Singer","Style","Remember"],"rows":[["Bhimsen Joshi","Hindustani classical","Kirana gharana; Bharat Ratna (announced 2008, given 2009)."],["Kishori Amonkar","Hindustani classical","Jaipur-Atrauli gharana."],["Pandit Jasraj","Hindustani classical","Mewati gharana."],["Gangubai Hangal","Hindustani classical","Kirana gharana."],["Kumar Gandharva","Hindustani classical","Lived in Dewas, MP; mixed folk tunes into classical music."],["Girija Devi","Hindustani classical","'Queen of thumri', Benares gharana."],["Bade Ghulam Ali Khan","Hindustani classical","Patiala gharana."],["M. S. Subbulakshmi","Carnatic classical","First musician to get the Bharat Ratna (1998)."],["M. Balamuralikrishna","Carnatic classical","Created new ragas; also sang in films."],["D. K. Pattammal","Carnatic classical",""],["Semmangudi Srinivasa Iyer","Carnatic classical",""],["M. L. Vasanthakumari","Carnatic classical",""],["Begum Akhtar","Ghazal","Called 'Mallika-e-Ghazal' (Queen of Ghazal)."],["Jagjit Singh","Ghazal","Called the 'Ghazal King'."],["Lata Mangeshkar","Film playback","'Nightingale of India'; Bharat Ratna 2001."],["Mohammed Rafi","Film playback",""],["Kishore Kumar","Film playback",""],["Asha Bhosle","Film playback","Lata Mangeshkar's younger sister."],["Bhupen Hazarika","Folk and film (Assamese)","'Sudhakantha'; Bharat Ratna 2019 (posthumous)."],["Sharda Sinha","Folk (Bhojpuri and Maithili)","Famous for Chhath songs; Padma Vibhushan 2025 (posthumous)."],["Teejan Bai","Pandavani (folk ballad)","Sings the Mahabharata in the Pandavani style of Chhattisgarh."],["Nusrat Fateh Ali Khan","Qawwali","Pakistani qawwal, famous across the world."]]},{"k":"trick","h":"<b>“MS = Mighty South”<\/b> — M. S. Subbulakshmi, Carnatic, first musician Bharat Ratna. <b>“Begum of Ghazal”<\/b> — Begum Akhtar. <b>“Teejan tells the Pandavas”<\/b> — Pandavani."},{"k":"trap","h":"<b>'Nightingale of India'<\/b> means <b>Sarojini Naidu<\/b> in history questions and <b>Lata Mangeshkar<\/b> in music questions — read the question. <b>Sharda Sinha<\/b> sang <b>Bhojpuri and Maithili<\/b> folk songs (Chhath), not Assamese."}],"sum":["Hindustani vocalists: Bhimsen Joshi, Gangubai Hangal, Kishori Amonkar, Pandit Jasraj, Kumar Gandharva.","Carnatic vocalists: M. S. Subbulakshmi, M. Balamuralikrishna, D. K. Pattammal.","M. S. Subbulakshmi: UN concert 1966, Magsaysay 1974, Bharat Ratna 1998.","Ghazal: Begum Akhtar (Mallika-e-Ghazal), Jagjit Singh.","Lata Mangeshkar (films), Bhupen Hazarika (Assam), Teejan Bai (Pandavani, Chhattisgarh)."],"part":["Part 3 · Singers, honours and folk instruments","गायक, सम्मान और लोक वाद्य"],"g":"mu"},
{"id":"M8","heat":3,"title":"Bharat Ratna musicians, music awards and Grammys","hi":"भारत रत्न संगीतकार, संगीत पुरस्कार और ग्रैमी","blocks":[{"k":"hot","h":"Asked: the <b>six Bharat Ratna musicians<\/b> and their years, who gives the <b>Sangeet Natak Akademi<\/b>, <b>Kalidas<\/b> and <b>Tansen<\/b> awards, and <b>Indian Grammy winners<\/b> (Ravi Shankar, Zakir Hussain, A. R. Rahman, Ricky Kej, Shankar Mahadevan)."},{"k":"story","h":"<p>Up to 2024, six musicians had received the <b>Bharat Ratna<\/b>: <b>M. S. Subbulakshmi<\/b> (1998) was the first, then <b>Ravi Shankar<\/b> (1999), <b>Lata Mangeshkar<\/b> and <b>Bismillah Khan<\/b> (both 2001), <b>Bhimsen Joshi<\/b> (2009) and <b>Bhupen Hazarika<\/b> (2019, posthumous). The national academy for music, dance and drama, the <b>Sangeet Natak Akademi<\/b>, was set up in 1952; its highest honour is the <b>Fellowship (Akademi Ratna)<\/b>.<\/p><p>Indian music also shines at the <b>Grammys<\/b>. <b>Ravi Shankar<\/b> won first, for <i>West Meets East<\/i> with violinist Yehudi Menuhin. <b>Zakir Hussain<\/b> won for <i>Planet Drum<\/i> (1992) and then <b>three in one night in 2024<\/b>. <b>A. R. Rahman<\/b> won two for <i>Slumdog Millionaire<\/i> (2010), and <b>Ricky Kej<\/b> has won three.<\/p>","key":"Bharat Ratna musicians: MS (1998), Ravi Shankar (1999), Lata and Bismillah (2001), Bhimsen Joshi (2009), Bhupen Hazarika (2019)."},{"k":"table","title":"Bharat Ratna musicians","head":["Musician","Year","Note"],"rows":[["M. S. Subbulakshmi","1998","The first musician to receive it."],["Ravi Shankar","1999","Sitar."],["Lata Mangeshkar","2001","Playback singer."],["Bismillah Khan","2001","Shehnai."],["Bhimsen Joshi","2009","Announced in November 2008."],["Bhupen Hazarika","2019","Posthumous."]]},{"k":"tlfig","title":"Bharat Ratna to musicians","rows":[[1998,"M. S. Subbulakshmi","The first musician to receive it"],[1999,"Ravi Shankar","Sitar"],[2001,"Lata Mangeshkar","Playback singer"],[2001,"Bismillah Khan","Shehnai"],[2009,"Bhimsen Joshi","Announced in November 2008"],[2019,"Bhupen Hazarika","Posthumous"]],"cap":"Six musicians: M. S. Subbulakshmi was the first (1998); 2001 had two, Lata Mangeshkar and Bismillah Khan."},{"k":"table","title":"Indian Grammy winners","head":["Musician","Won for","Note"],"rows":[["Ravi Shankar","West Meets East (with Yehudi Menuhin)","The first Grammy for an Indian (1968 ceremony)."],["Zakir Hussain","Planet Drum (with Mickey Hart)","1992 — the first Grammy for world music."],["Vishwa Mohan Bhatt","A Meeting by the River (with Ry Cooder)","1994."],["A. R. Rahman","Slumdog Millionaire, incl. 'Jai Ho'","Two Grammys in 2010."],["Ricky Kej","Winds of Samsara","2015 — he has won three Grammys in all."],["Falguni Shah","A Colorful World","2022 — best children's album."],["Shankar Mahadevan","This Moment (with Shakti)","2024 — best global music album."],["Rakesh Chaurasia","Pashto (with Béla Fleck, Edgar Meyer, Zakir Hussain)","2024."],["Chandrika Tandon","Triveni","2025 — best new age album."]]},{"k":"tlfig","title":"Indian Grammy winners, year by year","rows":[[1968,"Ravi Shankar","West Meets East"],[1992,"Zakir Hussain","Planet Drum"],[1994,"Vishwa Mohan Bhatt","A Meeting by the River"],[2010,"A. R. Rahman","Slumdog Millionaire"],[2015,"Ricky Kej","Winds of Samsara"],[2022,"Falguni Shah","A Colorful World"],[2024,"Shankar Mahadevan","This Moment"],[2024,"Rakesh Chaurasia","Pashto"],[2025,"Chandrika Tandon","Triveni"]],"cap":"Ravi Shankar's 'West Meets East' won the first, at the 1968 ceremony; 2024 brought Grammys for Shakti (Shankar Mahadevan, Zakir Hussain) and for 'Pashto'."},{"k":"facts","title":"Music awards to know","rows":[["Sangeet Natak Akademi","India's national academy of music, dance and drama, New Delhi; set up 1952"],["Sangeet Natak Akademi Fellowship","Its highest honour, also called Akademi Ratna"],["Kalidas Samman","Madhya Pradesh government, since 1980 — for classical music, dance, theatre and art"],["Tansen Samman","Madhya Pradesh government — given at the Tansen Samaroh in Gwalior"],["Lata Mangeshkar Award","Given by the Madhya Pradesh government (and separately by Maharashtra) for light music"],["Sangita Kalanidhi","Highest Carnatic music title, given by the Music Academy, Chennai"],["Grammy","Given by the Recording Academy, USA"],["Magsaysay to musicians","M. S. Subbulakshmi (1974) and Ravi Shankar (1992)"]]},{"k":"trick","h":"Bharat Ratna musicians in order — <b>“My Rhythm Lifts Body’s Breath, Harmony”<\/b>: <b>M<\/b>S 98, <b>R<\/b>avi 99, <b>L<\/b>ata and <b>B<\/b>ismillah 2001, <b>B<\/b>himsen 2009, <b>H<\/b>azarika 2019."},{"k":"trap","h":"<b>Kalidas Samman<\/b> and <b>Tansen Samman<\/b> are given by the <b>Madhya Pradesh<\/b> government, not the Centre. <b>Bhimsen Joshi<\/b>'s Bharat Ratna was announced in 2008 but presented in 2009. <b>Zakir Hussain<\/b>, not Ravi Shankar, won three Grammys in one night (2024)."}],"sum":["Bharat Ratna musicians: M. S. Subbulakshmi 1998 (first), Ravi Shankar 1999, Lata Mangeshkar and Bismillah Khan 2001.","Then Bhimsen Joshi 2009 and Bhupen Hazarika 2019 (posthumous).","Sangeet Natak Akademi (1952) — its highest honour is the Fellowship (Akademi Ratna).","Kalidas Samman and Tansen Samman are given by the Madhya Pradesh government.","Grammys: Ravi Shankar (first), Zakir Hussain (1992, three in 2024), A. R. Rahman (2010), Ricky Kej (three)."],"part":["Part 3 · Singers, honours and folk instruments","गायक, सम्मान और लोक वाद्य"],"g":"mu"},
{"id":"M9","heat":2,"title":"Folk instruments by state","hi":"राज्यों के लोक वाद्य","blocks":[{"k":"hot","h":"Asked: <b>“Pena / Ravanahatha / Tumbi / Pepa is a folk instrument of which state?”<\/b> Learn the pairs — Pena–Manipur, Ravanahatha–Rajasthan, Tumbi–Punjab, Pepa–Assam, Chenda–Kerala, Thavil–Tamil Nadu."},{"k":"story","h":"<p>Every region has its own sound. In the Thar desert of <b>Rajasthan<\/b>, Manganiyar singers play the <b>kamaicha<\/b> and the ancient <b>ravanahatha<\/b>, with the twang of the <b>morchang<\/b>. In <b>Punjab<\/b>, the one-string <b>tumbi<\/b> and the jingling <b>chimta<\/b> drive bhangra songs. In <b>Assam<\/b>, the buffalo-horn <b>pepa<\/b> and bamboo <b>gogona<\/b> announce Bihu; in <b>Manipur<\/b>, the bowed <b>pena<\/b> and the <b>pung<\/b> drum lead the dance.<\/p><p>In <b>Kerala<\/b>, temple festivals thunder with the <b>chenda<\/b>, <b>edakka<\/b> and <b>timila<\/b>; <b>Tamil Nadu<\/b> temples ring with the <b>nadaswaram<\/b> and <b>thavil<\/b>. <b>Goa<\/b> made the clay-pot <b>ghumot<\/b> its heritage instrument, and the <b>Bauls<\/b> of Bengal wander with their <b>ektara<\/b>.<\/p>","key":"Ravanahatha, kamaicha — Rajasthan; tumbi — Punjab; pena, pung — Manipur; pepa — Assam; chenda — Kerala; thavil — Tamil Nadu; ghumot — Goa."},{"k":"photos","title":"Folk instruments in pictures","items":[["Ravanahatha","Ravanahatha","Rajasthan"],["Kamaicha","Kamaicha","Rajasthan"],["Tumbi","Tumbi","Punjab"],["Pena_(musical_instrument)","Pena","Manipur"],["Chenda","Chenda","Kerala"],["Edakka","Edakka","Kerala"],["Thavil","Thavil","Tamil Nadu"],["Pepa_(musical_instrument)","Pepa","Assam"],["Gogona","Gogona","Assam"],["Ghumot","Ghumot","Goa"],["Ektara","Ektara","West Bengal"]]},{"k":"indiamap","title":"Folk instruments on the map","cap":"Tap a state to see its folk instruments. Rajasthan and Kerala have the most."},{"k":"table","title":"Folk instruments and their states","head":["Instrument","State / UT","Remember"],"rows":[["Ravanahatha","Rajasthan","An ancient bowed fiddle, linked in legend with Ravana."],["Kamaicha","Rajasthan","Bowed; played by the Manganiyars of the Thar."],["Morchang","Rajasthan","Metal jaw harp."],["Bhapang","Rajasthan","Plucked drum-string of the Mewat (Alwar) region."],["Tumbi","Punjab","One-string instrument of bhangra songs."],["Chimta","Punjab","Long tongs with jingles."],["Pena","Manipur","A one-string bowed fiddle."],["Pung","Manipur","Drum played in the Pung Cholom dance."],["Chenda","Kerala","Played in temple festivals and Kathakali."],["Edakka","Kerala","Hourglass drum of temple music."],["Mizhavu","Kerala","Big copper drum of Koodiyattam."],["Timila","Kerala","Hourglass drum of the Panchavadyam."],["Thavil","Tamil Nadu","Barrel drum played with the nadaswaram."],["Nadaswaram","Tamil Nadu","Temple wind instrument."],["Yazh","Tamil Nadu","Ancient Tamil harp of the Sangam age."],["Pepa","Assam","Buffalo-horn pipe of Bihu."],["Gogona","Assam","Bamboo jaw harp of Bihu."],["Rabab","Jammu and Kashmir","Plucked; used in Kashmiri folk and Sufiana music."],["Tumbaknari","Jammu and Kashmir","Clay goblet drum."],["Hudka","Uttarakhand","Hourglass drum of Jagar songs."],["Dhol-Damau","Uttarakhand","Pair of drums of the Garhwal and Kumaon hills."],["Tuntuna","Maharashtra","One-string instrument of devotional and folk singers."],["Sundari","Maharashtra","A small shehnai-like pipe from Solapur."],["Ghumot","Goa","Earthen pot drum; declared Goa's heritage instrument."],["Mardala","Odisha","Barrel drum of Odissi music and dance."],["Ektara (Baul singers)","West Bengal","Baul singers carry it."]]},{"k":"trick","h":"<b>“Pena–Pung–Manipur”<\/b> (three Ps and an M). <b>“Pepa Plays at Bihu”<\/b> — Assam. <b>“Tumbi Thumps in Punjab”<\/b>. <b>“Ravana's fiddle in Rajasthan”<\/b>."},{"k":"trap","h":"The <b>ravanahatha<\/b> is named after Ravana but is a <b>Rajasthani<\/b> folk fiddle, not from Sri Lanka in the exam sense. The <b>pena<\/b> is from <b>Manipur<\/b>, the <b>pepa<\/b> from <b>Assam<\/b> — similar names."}],"sum":["Rajasthan: ravanahatha, kamaicha, morchang, bhapang.","Punjab: tumbi, chimta; Manipur: pena, pung.","Assam: pepa, gogona; Jammu and Kashmir: rabab, tumbaknari.","Kerala: chenda, edakka, mizhavu, timila; Tamil Nadu: nadaswaram, thavil, yazh.","Goa: ghumot; Odisha: mardala; Uttarakhand: hudka, dhol-damau; Maharashtra: tuntuna."],"part":["Part 3 · Singers, honours and folk instruments","गायक, सम्मान और लोक वाद्य"],"g":"mu"}
];

  if (d.rq && !d.make) {   // also ask the other way round, where an answer belongs to one prompt only
    const n = {}; d.pairs.forEach(p => { n[p[1]] = (n[p[1]] || 0) + 1; });
    items = items.concat(d.pairs.filter(p => n[p[1]] === 1).map(p => ({ p: ask(d.rq, p[1]), a: p[0], note: p[2] || "", raw: p[1], pool: "p" })));
  }

}
function labIntro(id){

    <div id="labpairlist"></div></section>`;

}
let LG = null;
function labRun(id){
  labStop();
  const { d, items } = labDeck(id);
  LG = { d, items: shuffle(items), i: 0, score: 0, right: 0, tried: 0, combo: 0, maxc: 0, left: 60, miss: [], lock: false };
  $("#app").innerHTML = `<section class="view stack lab-play">
    <div class="lab-hud"><button class="back" type="button" id="labquit">✕ Stop</button><span class="lab-combo" id="labcombo"></span><span class="sc" id="labscore">0</span></div>
    <div class="lab-time" id="labtime"><i style="width:100%"></i></div>
    <div class="lab-q" id="labq" aria-live="polite"></div>
    <div class="lab-opts" id="labopts"></div>
    <div class="lab-flash" id="labflash"></div></section>`;
  $("#labquit").onclick = () => { labStop(); labOver(); };
  labNext();

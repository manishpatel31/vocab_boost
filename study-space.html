<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">

<title>Space &amp; ISRO Missions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: Space Missions — follows the शब्दRegister Paper / Indigo look; one column + bottom tabs on phones, sidebar on PC. */
:root{
  --paper:#f6f3ea; --sheet:#fffdf7; --sunk:#ebe6d8;
  --ink:#1d2a22; --ink2:#56625a; --rule:#dcd5c3;
  --blue:#1f5c3d; --on-blue:#ffffff; --blue-bg:#dcebdf;
  --accent:#b4530f; --accent-bg:#fbe7d3;
  --good:#1b7547; --good-bg:#dff1e6; --bad:#b0271f; --bad-bg:#f8e1de;
  --warn-bg:#fff2d2;
  --f-display:"Fraunces", "Tiro Devanagari Hindi", Georgia, serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap{border-radius:var(--r);padding:12px 14px 12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.trick .lab,.trap .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.pyr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pyr div{text-align:center;font-size:13px}
.pyr b{display:block;font-size:14px}
.pm{fill:var(--blue)} .pf{fill:var(--accent)}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.pal button.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.pal button.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.rk{display:grid;gap:0}
.rk div{display:grid;grid-template-columns:minmax(0,48%) 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:15px}
.rk div:first-child{border-top:0}
.rk dt{font-size:13px;color:var(--ink2);margin:0}
.rk dt.up{color:var(--good)} .rk dt.dn{color:var(--bad)}
.rk dd{margin:0;font-weight:600;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:24px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.gbar{display:grid;grid-template-columns:78px 1fr 52px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.gbar .tr{height:12px;background:var(--sunk);border-radius:3px;position:relative;overflow:hidden}
.gbar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:3px}
.gbar .tr i.neg{background:var(--bad)}
.gbar .v{font-family:var(--f-num);text-align:right}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
@media (prefers-reduced-motion: no-preference){ .opt,.chip,.btn{transition:background-color .15s, border-color .15s} }
.link{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px}
.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.icheck{background:var(--sheet);border:1.5px dashed var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.icheck .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.cat{font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;white-space:nowrap}
.cat.CS{background:var(--blue-bg);color:var(--blue)} .cat.CSS{background:var(--accent-bg);color:var(--accent)} .cat.ST{background:var(--sunk);color:var(--ink)} .cat.OT{background:var(--sunk);color:var(--ink2)}

/* ---- workbook additions ---- */
table.cover td:nth-child(4){min-width:180px}
.plist .dl{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.plist .dl em{font-style:normal;font-weight:700;color:var(--blue);text-align:right}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--rule)}
.ladder li{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--rule)}
.ladder .rk-n{font-size:22px;font-weight:600;color:var(--blue);text-align:right}
.ladder .rk-t{min-width:0}
.ladder .rk-t b{display:block;line-height:1.3}
.ladder .rk-t span{font-size:13px;color:var(--ink2)}
.ladder .rk-d{font-weight:700;font-size:14px;white-space:nowrap}
.ladder li.up .rk-d{color:var(--good)} .ladder li.dn .rk-d{color:var(--bad)}
.ladder small{font-weight:600;color:var(--ink2)}
table.cover td{min-width:90px}
.peek{border:1.5px dashed var(--blue);background:var(--blue-bg);color:var(--blue);border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer;min-height:36px;width:100%}
.pubs{display:grid;gap:12px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.plist li{padding:7px 0;border-top:1px dashed var(--rule);display:grid;gap:1px}
.plist li:first-child{border-top:0}
.plist li span{font-size:13px;color:var(--ink2)}
.seg{scroll-snap-type:x proximity}
@media (max-width: 700px){
  table.cover thead{display:none}
  table.cover tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--rule)}
  table.cover td{border:0;padding:0;min-width:0;font-size:14px}
  table.cover td:first-child{grid-column:1/-1;font-size:15px}
  table.cover td:nth-child(4){grid-column:1/-1;min-width:0}
  table.cover td[data-l]::before{content:attr(data-l);display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
}
</style>

</header>

<script>
"use strict";
const LESSONS = [
{ id:"L1", title:"Space words: payload, bus, spacecraft", hi:"अंतरिक्ष की भाषा — पेलोड से रोवर तक", blocks:[
 {k:"p", h:"Every space question uses a small set of words. Learn them once and the long Steno/CGL statement questions become easy to read. A <b>space mission</b> is a complete plan to solve one problem from space — e.g. 'photograph flooded Delhi every hour'. The lecture called its example <b>Mission Aankh</b>: put a camera in the sky."},
 {k:"table", title:"The building blocks of a mission", head:["Word","What it is","Mission Aankh example"], rows:[["<b>Payload</b>","The main item the mission exists for","The camera / sensor"],["<b>Satellite bus</b>","Support platform: solar panels, battery, antenna, thermal control, small thrusters, computer","Keeps the camera powered, cool and pointed at Delhi"],["<b>Spacecraft</b>","Payload + satellite bus together","The whole flying machine"],["<b>Launch vehicle / rocket</b>","Carries the spacecraft to the right height and path — a 'space taxi'","PSLV, GSLV, LVM3"],["<b>Ground segment</b>","Control centre, big antennas and computers on Earth","ISRO's control room that commands and receives images"]]},
 {k:"trick", h:"<b>P + B = S.</b> <b>P</b>ayload + <b>B</b>us = <b>S</b>pacecraft. The rocket is only the bus-to-school; the student (spacecraft) writes the exam. Rocket ≠ satellite."},
 {k:"table", title:"Spacecraft by job — the spy-movie analogy", head:["Type","What it does","Indian / world example"], rows:[["<b>Orbiter</b>","Circles the body and watches from outside","Chandrayaan-2 orbiter, Mangalyaan"],["<b>Lander</b>","Lands and works from one spot (soil, temperature, surroundings)","Vikram (Chandrayaan-3)"],["<b>Rover</b>","Comes out of the lander and moves around","Pragyan; NASA's Curiosity, Perseverance"],["<b>Flyby</b>","Passes close at high speed, collects data, does not enter orbit","Voyager, Pioneer 10"],["<b>Atmospheric probe</b>","Plunges into an atmosphere to measure gases, pressure, temperature","Galileo probe at Jupiter"],["<b>Crew capsule / module</b>","Pressurised cabin with oxygen, temperature control, safety, re-entry system","Gaganyaan crew module, Orion"],["<b>Space observatory</b>","A telescope 'lab' placed above clouds and pollution","AstroSat, Hubble, JWST"]]},
 {k:"trap", h:"<b>A satellite is anything that keeps going round another body.</b> Once a spacecraft lands (Vikram on the Moon) it is no longer a satellite — it is just a spacecraft/lander. So: every artificial satellite is a spacecraft, but not every spacecraft is a satellite."},
 {k:"p", h:"<b>Why doesn't a satellite fall?</b> Not because there is no gravity — gravity is exactly what holds it. The satellite is thrown sideways so fast that while it falls, the round Earth curves away beneath it. It is in <b>continuous free fall</b>. Forward motion + gravity = orbit. No engine has to run; in space there is no friction to slow it (Newton's first law)."},
 {k:"facts", title:"Two speeds to remember", rows:[["Orbital velocity (LEO)","≈ <b>7.8 km/s</b> ≈ 28,000 km/h — goes round Earth in ~90 min"],["Escape velocity (Earth)","<b>11.2 km/s</b> — leave Earth's gravity for the Moon/Mars"],["GEO satellite speed","≈ <b>3.07 km/s</b> — slower because it is farther out"],["Rule","Lower orbit → higher speed → shorter period"]]},
 {k:"trick", h:"<b>पहलवान rule.</b> Near a strong wrestler (low orbit, strong gravity) you must run very fast; far away (high orbit) you can stroll past. So low orbit = fast, high orbit = slow."},
 {k:"q", q:"Payload plus satellite bus together are called the…", o:["Spacecraft","Launch vehicle","Ground segment","Orbiter"], e:"P + B = S."},
 {k:"q", q:"Which physical quantity keeps a satellite in orbit without continuous propulsion?", o:["Orbital velocity","Mass","Atmospheric pressure","Temperature"], e:"Sideways speed + gravity = continuous free fall (an SSC PYQ)."},
 {k:"link", h:"<b>Rover needs a lander.</b> Chandrayaan-3 = propulsion module (carrier) + Vikram (lander) + Pragyan (rover). Chandrayaan-2 had an orbiter instead of a propulsion module — the orbiter still works."}
], sum:["Payload + bus = spacecraft; rocket only carries it.","Orbiter watches, lander sits, rover moves, flyby passes, probe dives in.","Satellite stays up by continuous free fall; LEO 7.8 km/s, escape 11.2 km/s."]},

{ id:"L2", title:"Orbits: LEO, MEO, GEO, SSO & Lagrange points", hi:"कक्षाएँ — लियो, मियो, जियो", blocks:[
 {k:"table", title:"Orbits by height", head:["Orbit","Height","Used for"], rows:[["<b>LEO</b> — Low Earth Orbit","160–2,000 km","Earth observation (sharp images), ISS (~400 km), Gaganyaan (~400 km), Hubble (~540 km), Starlink-type constellations"],["<b>MEO</b> — Medium Earth Orbit","Between LEO and GEO (~20,000 km)","Navigation — GPS, GLONASS, Galileo, BeiDou"],["<b>GEO</b> — Geostationary","<b>35,786 km</b> above the equator","Communication, TV broadcast, weather (INSAT, GSAT)"]]},
 {k:"trick", h:"<b>Camera distance rule.</b> Want sharp detail (crop, flood, rooftop)? Stand close → LEO. Want a rough road map? Middle → MEO. Want the whole cloud system or a fixed relay mirror? Stand far → GEO."},
 {k:"table", title:"Orbits by shape, tilt and timing", head:["Orbit","Key idea"], rows:[["<b>Geosynchronous (GSO)</b>","Period = one sidereal day (~23 h 56 min). Can be tilted or elliptical, so it traces a figure-8 in the sky"],["<b>Geostationary (GEO)</b>","A special GSO: circular + zero inclination (over the equator) + same direction as Earth's spin → looks fixed"],["<b>GTO</b> — Geosynchronous Transfer Orbit","Elliptical 'parking-to-GEO' orbit; rockets drop satellites here, satellites raise themselves to GEO"],["<b>Polar orbit</b>","Passes over both poles; Earth turns beneath it, so it scans the whole globe strip by strip"],["<b>Sun-synchronous (SSO)</b>","Near-polar; crosses a given place at the same local solar time every day — same shadows, so images can be compared"],["<b>HEO</b> — Highly Elliptical","Very elongated; spends long time over one high-latitude region"],["<b>Equatorial orbit</b>","Orbit in the plane of the equator"]]},
 {k:"trap", h:"<b>Every geostationary orbit is geosynchronous, but not every geosynchronous orbit is geostationary.</b> A GSO that is tilted or elliptical repeats every 24 h but wanders north–south. Only circular + equatorial + prograde makes it 'stationary'."},
 {k:"facts", title:"Orbit vocabulary", rows:[["Apogee / Perigee","Farthest / nearest point of an orbit around <b>Earth</b> (P = Paas = Perigee)"],["Aphelion / Perihelion","Farthest / nearest point around the <b>Sun</b>"],["Prograde / Retrograde","Same / opposite direction as Earth's rotation (west→east is prograde)"],["Inclination","Tilt of the orbit plane from the equator"],["ISS","~400 km, 51.6° inclination, ~90 min per orbit, ~28,000 km/h, ~16 orbits a day"]]},
 {k:"p", h:"<b>Lagrange points</b> are five spots where the pull of two big bodies (Sun–Earth or Earth–Moon) plus orbital motion balance, so a small spacecraft can stay in step with them using very little fuel. Gravity is <b>not zero</b> there — net force just matches what the orbit needs. They are also called <b>libration points</b>."},
 {k:"table", title:"The Sun–Earth Lagrange points", head:["Point","Where","Use"], rows:[["<b>L1</b>","Between Sun and Earth, ~1.5 million km from Earth","Uninterrupted view of the Sun — <b>Aditya-L1</b>, SOHO"],["<b>L2</b>","Behind Earth, ~1.5 million km away","Deep-space viewing with Sun, Earth, Moon behind — <b>JWST</b>, Gaia"],["<b>L3</b>","Opposite side of the Sun","Not used"],["<b>L4, L5</b>","60° ahead / behind Earth on its orbit; form equilateral triangles with Sun and Earth","Only <b>stable</b> points; Trojan asteroids gather here"]]},
 {k:"trick", h:"<b>L1 looks at the Sun, L2 looks away.</b> L1–L2 distance ≈ 3 million km; L2–L3 ≈ 300 million km (asked in CHSL Mains). L1, L2, L3 are unstable — spacecraft keep doing small burns; L4 & L5 are stable."},
 {k:"q", q:"Aditya-L1 is placed in a halo orbit around which point?", o:["Sun–Earth L1","Sun–Earth L2","Earth–Moon L1","Sun–Earth L4"], e:"L1 lies between Sun and Earth, ~1.5 million km away."},
 {k:"q", q:"Navigation satellites like GPS usually work from…", o:["Medium Earth Orbit","Low Earth Orbit","Geostationary orbit","Sun-synchronous orbit"], e:"Middle height: wide coverage, not too much delay."},
 {k:"link", h:"<b>Orbit → job → satellite name.</b> GEO: INSAT, GSAT, CMS-03. SSO/polar: Cartosat, Resourcesat, EOS, NISAR (747 km). L1: Aditya. LEO: XPoSat, AstroSat (650 km), ISS, Gaganyaan."}
], sum:["LEO <2,000 km (imaging, ISS); MEO ~20,000 km (GPS); GEO 35,786 km (communication, weather).","GEO = GSO + circular + equatorial; SSO = same local time each pass.","L1 Aditya, L2 JWST; L4/L5 the only stable points."]},

{ id:"L3", title:"Rocket science & fuels", hi:"रॉकेट विज्ञान और ईंधन", blocks:[
 {k:"p", h:"A balloon flies forward when air rushes out behind. A rocket does the same with hot gas: momentum thrown backward pushes the rocket forward — <b>Newton's third law</b> (conservation of momentum). It does not need air to push against, so it works in vacuum. The push is called <b>thrust</b>."},
 {k:"p", h:"Burning needs oxygen, and space has none. So a rocket carries its own <b>oxidiser</b> along with the <b>fuel</b>; fuel + oxidiser = <b>propellant</b>."},
 {k:"table", title:"Propellant types", head:["Type","Fuel + oxidiser","Strength","Weakness"], rows:[["<b>Solid</b>","Pre-mixed grain","Huge thrust, simple, good for lift-off & strap-on boosters","Cannot throttle, stop or restart"],["<b>Liquid (storable)</b>","e.g. UDMH + N₂O₄ in separate tanks (Vikas engine)","Throttle, shut down, restart — good for manoeuvring","More complex"],["<b>Cryogenic</b>","Liquid hydrogen (−253 °C) + liquid oxygen (−183 °C)","Highest energy per kg","Super-cold storage; heat and cold side by side"],["<b>Semi-cryogenic</b>","Refined kerosene (RP-1) + liquid oxygen","Only LOX needs cooling; kerosene is dense and cheap","Kerosene leaves soot (coking) — bad for reuse"],["<b>Methalox</b>","Liquid methane + liquid oxygen","Clean burn — good for reusable engines","Methane also needs cooling (−162 °C)"]]},
 {k:"trap", h:"<b>'Semi-cryogenic' does NOT mean half solid, half liquid.</b> It means only the oxidiser (LOX) is cryogenic; the fuel is kerosene at room temperature. Cryogenic = LH₂ + LOX. Semi-cryo = kerosene + LOX. Methalox = methane + LOX."},
 {k:"trick", h:"<b>Fuel family ladder:</b> Hydrogen (cryo, cleanest, hardest) → Kerosene (semi-cryo, sooty like a lantern chimney) → Methane (methalox, clean and reusable). The oxidiser is LOX in all three — the fuel is what changes."},
 {k:"p", h:"<b>Staging.</b> Carrying empty tanks is like climbing a hill with empty steel tiffins. So a rocket drops each stage when its fuel is spent; the lighter rocket speeds up. Strap-on boosters give extra lift-off thrust. Dropping expensive stages is costly — hence reusable rockets."},
 {k:"facts", title:"Indian engines & stages", rows:[["Vikas","Liquid engine (UDMH + N₂O₄) — PSLV 2nd stage, GSLV/LVM3 core"],["CE-7.5","Indigenous cryogenic engine of GSLV Mk II upper stage (CUS); first success GSLV-D5, Jan 2014"],["CE-20 / C25 stage","LVM3's cryogenic upper stage (C25 ≈ 25 t propellant); C32 is the upgraded version"],["S200","Solid strap-on booster of LVM3"],["SCE-200","Semi-cryogenic (kerosene–LOX) engine under development"],["Scramjet","Air-breathing: no compressor fans; very high forward speed compresses incoming air, oxygen from air burns hydrogen. ISRO test 28 Aug 2016"],["Mach number","Speed ÷ speed of sound. <1 subsonic, ≈1 transonic, >1 supersonic, >5 hypersonic"]]},
 {k:"q", q:"Fuel used in a cryogenic rocket engine is…", o:["Liquid hydrogen","Kerosene","Liquid methane","Solid HTPB"], e:"Cryogenic = LH₂ + LOX."},
 {k:"q", q:"A semi-cryogenic engine burns…", o:["Kerosene with liquid oxygen","Hydrogen with liquid oxygen","Solid and liquid fuel together","Methane with nitrogen tetroxide"], e:"Only the oxidiser is cryogenic."},
 {k:"link", h:"<b>Fuel choice explains ISRO's roadmap.</b> GSLV/LVM3 use hydrogen-cryo upper stages; NGLV moves to methalox for reusable boosters (clean burn), with spark torch igniters for repeated restarts (Lesson 7)."}
], sum:["Rocket = Newton's third law; carries its own oxidiser.","Solid = thrust, no restart; liquid = control; cryo = LH₂+LOX; semi-cryo = kerosene+LOX; methalox = methane+LOX.","Stages are dropped to shed dead weight; Vikas liquid, CE-20 cryo, S200 solid."]},
{ id:"L4", title:"India's space story, 1962–1984", hi:"भारत की अंतरिक्ष यात्रा — इनकोस्पार से राकेश शर्मा तक", blocks:[
 {k:"p", h:"After the USSR launched <b>Sputnik-1 (4 Oct 1957)</b>, the USA answered by setting up <b>NASA (1958)</b>. In India, <b>Dr Vikram Sarabhai</b> — father of the Indian space programme — convinced Nehru that space technology could reach farmers, teachers and fishermen far away. India first had to <i>learn</i> what space was: hence a research committee before any agency."},
 {k:"tl", title:"Timeline", rows:[["1962","<b>INCOSPAR</b> (Indian National Committee for Space Research) under the <b>Department of Atomic Energy</b>; set up by Vikram Sarabhai with Homi Bhabha's support"],["21 Nov 1963","First sounding rocket <b>Nike-Apache</b> (US-made) from <b>Thumba (TERLS), Kerala</b> — near the magnetic equator"],["1967","Experimental Satellite Communication Earth Station, <b>Ahmedabad</b>, to train engineers"],["15 Aug 1969","<b>ISRO</b> formed, superseding INCOSPAR"],["1972","<b>Space Commission</b> and <b>Department of Space</b> set up; ISRO brought under DoS (Sept 1972). DoS reports directly to the Prime Minister"],["1975–76","<b>SITE</b> — Satellite Instructional Television Experiment using NASA's ATS-6, TV lessons to ~2,400 villages"],["19 Apr 1975","<b>Aryabhata</b>, first Indian satellite — built in India, launched from <b>Kapustin Yar (USSR)</b> on a Soviet rocket; project led by <b>U.R. Rao</b>"],["1977–79","<b>STEP</b> — Satellite Telecommunication Experiments Project with the P&T department using the Franco-German <b>Symphonie</b> satellite"],["1979 & 1981","<b>Bhaskara-I & II</b> — first Indian experimental remote-sensing satellites (launched by USSR)"],["10 Aug 1979","<b>SLV-3</b> first flight fails; Prof Satish Dhawan takes the blame publicly"],["18 Jul 1980","<b>SLV-3</b> puts <b>Rohini RS-1</b> in orbit from Sriharikota — first Indian satellite on an Indian rocket; project director <b>APJ Abdul Kalam</b>"],["1981","<b>APPLE</b> (Ariane Passenger PayLoad Experiment) — first indigenous experimental communication satellite, launched on Europe's Ariane"],["1983","<b>INSAT-1B</b> — first operational INSAT (1A of 1982 failed): communication + TV + weather on one satellite"],["1984","<b>Rakesh Sharma</b> (IAF) — first Indian in space, Soviet <b>Soyuz T-11</b>, to Salyut-7"]]},
 {k:"trap", h:"<b>The very first rocket from Thumba was American.</b> One lecture said the first two rockets came from Russia (M-100) and France (Centaure). Those came later; 21 Nov 1963 was the US-built <b>Nike-Apache</b>. Also: INCOSPAR (1962) is not ISRO — ISRO is 1969."},
 {k:"trick", h:"<b>62-63-69-72-75-80:</b> समिति (committee) → रॉकेट (Thumba) → ISRO → विभाग (DoS) → उपग्रह (Aryabhata) → अपना रॉकेट (SLV-3 + Rohini). 'Committee, rocket, organisation, department, satellite, own rocket.'"},
 {k:"trap", h:"<b>Aryabhata was Indian-made but not Indian-launched.</b> First Indian satellite on an Indian rocket = <b>Rohini RS-1 (1980, SLV-3)</b>. Rohini Technology Payload (RTP) flew on the failed 1979 SLV-3."},
 {k:"facts", title:"People to know", rows:[["Vikram Sarabhai","Father of Indian space programme; VSSC named after him; Space Applications Centre idea"],["Homi J. Bhabha","Father of the nuclear programme; INCOSPAR sat under his DAE"],["Satish Dhawan","ISRO chairman 1972–84; Sriharikota launch centre named after him"],["U.R. Rao","Led Aryabhata; URSC Bengaluru named after him"],["APJ Abdul Kalam","SLV-3 project director; 'Missile Man'"],["Rakesh Sharma","1984, Soyuz T-11; 'Saare Jahan Se Achha'"],["Shubhanshu Shukla","2025, first Indian on the ISS (Axiom-4)"],["V. Narayanan","Current ISRO Chairman (from 14 Jan 2025)"]]},
 {k:"q", q:"India's first satellite Aryabhata was launched on…", o:["19 April 1975","15 August 1969","18 July 1980","21 November 1963"], e:"From Kapustin Yar, USSR."},
 {k:"q", q:"INCOSPAR was formed in 1962 under the…", o:["Department of Atomic Energy","Department of Space","Ministry of Defence","Ministry of Science & Technology"], e:"DoS came only in 1972."},
 {k:"link", h:"<b>Failure → fix → retry</b> runs through the whole story: SLV-3 (1979 fail, 1980 success), INSAT-1A → 1B, PSLV-D1 (1993 fail) → D2 (1994 success), Chandrayaan-2 lander → Chandrayaan-3."}
], sum:["1962 INCOSPAR (DAE) → 1963 Nike-Apache, Thumba → 1969 ISRO → 1972 DoS & Space Commission.","Aryabhata 19 Apr 1975 (USSR launch); Rohini RS-1 on SLV-3, 18 Jul 1980.","SITE 1975 (ATS-6), STEP (Symphonie), APPLE 1981 (Ariane), INSAT-1B 1983, Rakesh Sharma 1984."]},

{ id:"L5", title:"ISRO centres & how space is governed", hi:"इसरो केंद्र और अंतरिक्ष शासन", blocks:[
 {k:"p", h:"Build a mission 'Kheti & Baadh' (farm and flood watch) and each ISRO centre does one job: the camera, the satellite around it, the rocket, the engine, the engine test, the launch, then the data."},
 {k:"table", title:"Which centre does what", head:["Centre","Place","Job"], rows:[["<b>SAC</b> — Space Applications Centre","Ahmedabad","Payloads (cameras, sensors, transponders)"],["<b>URSC</b> — U.R. Rao Satellite Centre","Bengaluru","Satellites: design, bus, assembly, testing"],["<b>VSSC</b> — Vikram Sarabhai Space Centre","Thiruvananthapuram","Launch vehicles (rockets)"],["<b>LPSC</b> — Liquid Propulsion Systems Centre","Valiamala (Thiruvananthapuram) & Bengaluru","Liquid & cryogenic stages/engines"],["<b>IPRC</b> — ISRO Propulsion Complex","Mahendragiri, Tamil Nadu","Engine and stage testing"],["<b>SDSC SHAR</b> — Satish Dhawan Space Centre","Sriharikota, Andhra Pradesh","Launch port — two pads, third being built"],["<b>NRSC</b> — National Remote Sensing Centre","Hyderabad","Receives, processes and distributes Earth-observation data; runs Bhuvan"],["<b>TERLS</b>","Thumba, Kerala","Sounding rockets since 1963"],["<b>PRL</b> — Physical Research Laboratory","Ahmedabad","Space science (PARAS-2 at Mount Abu)"]]},
 {k:"trick", h:"<b>“Ahmedabad aankh, Bengaluru badan, Thiruvananthapuram taxi.”</b> Ahmedabad makes the eye (payload), Bengaluru the body (satellite), Thiruvananthapuram the taxi (rocket); Mahendragiri tests the engine; Sriharikota launches; Hyderabad reads the data."},
 {k:"p", h:"<b>Why Sriharikota?</b> On the east coast, so rockets fly east over the Bay of Bengal (spent stages fall into the sea, not on towns) and get a free push from Earth's west-to-east spin; close to the equator, where that push is largest."},
 {k:"table", title:"Who decides, who sells, who permits", head:["Body","Year","Role"], rows:[["<b>Space Commission</b>","1972","Policy and priorities"],["<b>Department of Space</b>","1972","Implements; under the PM directly (no ministry)"],["<b>ISRO</b>","1969","Research & development, human spaceflight, frontier tech"],["<b>Antrix Corporation</b>","1992","First commercial arm"],["<b>NSIL</b> — NewSpace India Ltd","2019","PSU commercial arm: sells launches & services, transfers tech to industry"],["<b>IN-SPACe</b>","2020","Single-window autonomous regulator — authorises private and government space activities, levels the playing field"]]},
 {k:"trap", h:"<b>IN-SPACe was announced and set up in June 2020</b> (one lecture said 2022). Indian Space Policy came in <b>2023</b>; IN-SPACe Norms, Guidelines & Procedures (NGP) in 2024."},
 {k:"table", title:"FDI in space (2024 amendment)", head:["Activity","Automatic route up to"], rows:[["Satellite components, systems, sub-systems","<b>100%</b>"],["Satellite manufacturing & operations, data products, ground/user segment","<b>74%</b> (beyond: government approval)"],["Launch vehicles, spaceports","<b>49%</b> (beyond: government approval)"]]},
 {k:"trick", h:"<b>100-74-49 = parts-satellite-rocket.</b> The more strategic the item, the lower the automatic limit."},
 {k:"facts", title:"Other governance terms", rows:[["Indian Space Policy 2023","Institutionalises the 2020 reforms; ISRO moves to R&D, industry takes mature tech"],["Space Situational Awareness","Tracking objects and hazards in orbit — <b>Project NETRA</b>; ISSAR reports"],["DFSM","Debris-Free Space Missions — all Indian missions to leave no debris by 2030"],["SSLV tech transfer","To <b>HAL</b> — agreement 10 Sept 2025 (ISRO, NSIL, IN-SPACe)"]]},
 {k:"q", q:"Which ISRO centre designs and builds satellites?", o:["URSC, Bengaluru","VSSC, Thiruvananthapuram","SAC, Ahmedabad","IPRC, Mahendragiri"], e:"Badan in Bengaluru."},
 {k:"q", q:"FDI in launch vehicles is allowed through the automatic route up to…", o:["49%","74%","100%","26%"], e:"100 parts, 74 satellites, 49 rockets."},
 {k:"link", h:"<b>Commercial chain:</b> a foreign customer goes to <b>NSIL</b>, not ISRO directly — e.g. Proba-3 for ESA (PSLV-C59) and AST SpaceMobile's BlueBird (LVM3-M6). That earns India foreign exchange."}
], sum:["SAC payload, URSC satellite, VSSC rocket, LPSC liquid engine, IPRC tests, SHAR launches, NRSC data.","Space Commission & DoS 1972; Antrix 1992; NSIL 2019; IN-SPACe 2020; Space Policy 2023.","FDI automatic: 100% components, 74% satellites, 49% launch vehicles."]},

{ id:"L6", title:"India's rockets: SLV-3 to LVM3 and SSLV", hi:"भारत के प्रक्षेपण यान", blocks:[
 {k:"table", title:"The launch-vehicle family", head:["Vehicle","Stages","Lift-off mass","Payload","Notes"], rows:[["<b>SLV-3</b>","4, all solid","17 t","40 kg to LEO","First Indian rocket; Rohini 1980; retired 1983"],["<b>ASLV</b>","5, all solid (strap-ons counted)","~40 t","150 kg to 400 km LEO","First success ASLV-D3, 1992"],["<b>PSLV</b>","4: <b>Solid–Liquid–Solid–Liquid</b>","230 t (CA) – 320 t (XL)","~1,750 kg SSO; ~1,425 kg sub-GTO","'Workhorse'; first success PSLV-D2, 15 Oct 1994 (IRS-P2); variants CA, DL, QL, XL"],["<b>GSLV Mk II</b>","3: Solid–Liquid (Vikas)–Cryogenic","~420 t","~2,250 kg GTO","Indigenous cryo stage since GSLV-D5 (2014)"],["<b>LVM3</b> (GSLV Mk III)","3: S200 boosters, L110 core, C25 cryo","~640 t","4,000 kg GTO; 8,000 kg LEO","'Bahubali' / 'Fat Boy'; heaviest Indian rocket"],["<b>SSLV</b>","3 solid + liquid <b>VTM</b> (Velocity Trimming Module)","~120 t","500 kg to LEO; ~300 kg SSO","Launch-on-demand, low cost; 34 m tall, 2 m wide"],["<b>HLVM3</b>","Human-rated LVM3","—","Gaganyaan crew module to ~400 km","Crew escape system added"]]},
 {k:"trick", h:"<b>Stage count 4-5-4-3-3-3:</b> SLV-3 four, ASLV five, PSLV four, GSLV three, LVM3 three, SSLV three (+VTM). The 'Mk II' or 'Mk III' is a generation name, never the stage count."},
 {k:"trap", h:"<b>Lift-off mass ≠ payload.</b> Lift-off mass is the whole loaded rocket (PSLV-XL 320 t); payload is the satellite it can place in orbit (PSLV ~1,750 kg). SSC asks both."},
 {k:"tl", title:"Firsts and failures", rows:[["20 Sep 1993","PSLV-D1 fails (IRS-1E lost)"],["15 Oct 1994","PSLV-D2 succeeds — IRS-P2 in sun-synchronous orbit"],["18 Apr 2001","GSLV-D1 first flight (GSAT-1), partly successful"],["8 May 2003","GSLV-D2 — first successful GSLV flight (GSAT-2)"],["5 Jan 2014","GSLV-D5 — first success with India's own cryogenic stage"],["Dec 2014","LVM3-X/CARE suborbital test"],["15 Feb 2017","PSLV-C37 — <b>104 satellites</b> in one launch (96 from the USA; main satellite Cartosat-2D)"],["Oct 2022","LVM3 launches 36 OneWeb satellites"],["2025–26","PSLV-C61 (May 2025) and PSLV-C62 (Jan 2026) both fail in the third stage"]]},
 {k:"trap", h:"<b>GSLV-D2 flew in 2003, not 2004.</b> One lecture dated it 2004 to rhyme with PSLV-D2 of 1994. Also, the PSLV variants are CA, DL, QL and XL — there is no 'KL'."},
 {k:"facts", title:"Launch sites", rows:[["Sriharikota (SDSC SHAR)","Two pads; <b>Third Launch Pad</b> approved Jan 2025 (~₹3,985 crore, ~4 years) for NGLV & human flight"],["Kulasekarapattinam, Thoothukudi (TN)","Second spaceport, for <b>SSLV</b>; foundation 28 Feb 2024. Lets polar launches go straight south, avoiding the fuel-wasting 'dogleg' around Sri Lanka"],["Thumba (TERLS)","Sounding rockets"],["Dhanush","Agnikul's private launch pad inside SHAR"]]},
 {k:"q", q:"How many stages does PSLV have?", o:["Four","Three","Five","Two"], e:"Solid–Liquid–Solid–Liquid."},
 {k:"q", q:"Which Indian rocket is nicknamed 'Fat Boy' or 'Bahubali'?", o:["LVM3","PSLV-XL","SSLV","GSLV Mk II"], e:"GSLV Mk III, renamed LVM3."},
 {k:"link", h:"<b>Rocket ↔ mission pairs SSC loves:</b> PSLV-C25 → Mangalyaan; PSLV-C37 → 104 satellites; PSLV-C57 → Aditya-L1; PSLV-C58 → XPoSat; PSLV-C60 → SpaDeX; GSLV-F14 → INSAT-3DS; GSLV-F15 → NVS-02 (100th); GSLV-F16 → NISAR; LVM3-M4 → Chandrayaan-3; LVM3-M5 → CMS-03; LVM3-M6 → BlueBird Block-2."}
], sum:["SLV-3 4 solid/40 kg; ASLV 5 solid/150 kg; PSLV 4 (S-L-S-L); GSLV 3 with cryo; LVM3 640 t/4 t GTO; SSLV 3 solid + VTM/500 kg.","PSLV-D1 failed 1993, D2 succeeded 1994; GSLV-D5 2014 first own cryo; C37 104 satellites 2017.","Kulasekarapattinam = SSLV spaceport; third pad at Sriharikota."]},
{ id:"L7", title:"Reusable rockets, NGLV & private space", hi:"पुनः प्रयोज्य रॉकेट और निजी क्षेत्र", blocks:[
 {k:"p", h:"Throwing away a rocket after every flight is like buying a new bus for every Lucknow–Delhi trip. A <b>Reusable Launch Vehicle (RLV)</b> recovers parts to fly again and cut recurring cost. Two kinds of recovery: the <b>winged top stage</b> lands horizontally on a runway like a plane; the <b>booster</b> lands vertically on its tail like SpaceX's Falcon 9."},
 {k:"tl", title:"ISRO's reusable-tech trail", rows:[["23 May 2016","<b>RLV-TD</b> HEX — winged demonstrator flown to ~Mach 5 on an HS9 solid booster from Sriharikota, splashed into the Bay of Bengal"],["28 Aug 2016","First experimental <b>scramjet</b> engine test (Advanced Technology Vehicle), Sriharikota"],["2 Apr 2023","<b>RLV-LEX-01</b> — autonomous runway landing, Chitradurga (Karnataka); dropped from a Chinook helicopter"],["22 Mar 2024","<b>RLV-LEX-02</b> — 'Pushpak' released 4.5 km up, 4 km away; corrected cross-range and landed itself"],["23 Jun 2024","<b>RLV-LEX-03</b> — third and final landing test under tougher wind and dispersion"]]},
 {k:"trick", h:"<b>LEX = Landing EXperiment, Pushpak = the plane.</b> Ramayana's flying chariot lands on a runway. LEX tests the top stage; booster recovery comes with NGLV."},
 {k:"facts", title:"Next Generation Launch Vehicle (NGLV)", rows:[["Approved","Sept 2024, ₹8,240 crore"],["Payload","Up to ~30 t to LEO (expendable), ~10 t to GTO — about 3× LVM3"],["Cost","About 1.5× LVM3"],["Design","Three stages, partially reusable first stage; ISRO now plans LOX–methane engines"],["Timeline","First flight targeted early 2030s; needs Sriharikota's third launch pad"],["Spark torch igniter","Gives reliable ignition and many restarts — essential to bring a booster back"]]},
 {k:"trap", h:"<b>NGLV's fuel changed.</b> The older plan (in one lecture) used semi-cryogenic kerosene boosters; recent PYQs (CGL 2025) state LOX–methane was chosen for clean burn and reuse. If a question offers methalox for NGLV, pick it."},
 {k:"table", title:"Private rockets", head:["Company","What","Fact to remember"], rows:[["<b>Skyroot Aerospace</b> (Hyderabad)","<b>Vikram-S</b>, 18 Nov 2022, mission 'Prarambh'","India's first private rocket (suborbital)"],["Skyroot Aerospace","<b>Vikram-1</b>, 18 Jul 2026, mission '<b>Aagaman</b>'","India's first private <b>orbital</b> rocket; 500 km LEO; stages Kalam-1200, Kalam-250, Kalam-100 (solid) + Raman liquid stage. India = 3rd country with private orbital launch after USA & China"],["<b>Agnikul Cosmos</b> (IIT-Madras incubated)","<b>Agnibaan SOrTeD</b>, 30 May 2024","From Agnikul's own pad <b>Dhanush</b>; engine <b>Agnilet</b> — world's first single-piece 3D-printed <b>semi-cryogenic</b> engine"],["Space Zone India + Martin Group","<b>RHUMI-1</b>, Aug 2024","India's first reusable hybrid rocket (Tamil Nadu)"]]},
 {k:"trap", h:"<b>Vikram-S was Skyroot's, not Agnikul's.</b> The Steno lecture marked Agnikul for 'first private rocket Vikram-S'. The rocket is named after Vikram Sarabhai and built by <b>Skyroot</b>; Agnikul's rocket is <b>Agnibaan</b>. Also, Agnilet is <b>semi-cryogenic</b>, not cryogenic."},
 {k:"trick", h:"<b>Skyroot = Vikram + Kalam</b> (rocket named after Sarabhai, motors after Kalam). <b>Agnikul = Agni-everything</b>: Agnibaan rocket, Agnilet engine, Dhanush pad."},
 {k:"q", q:"Which company launched Vikram-S, India's first private rocket?", o:["Skyroot Aerospace","Agnikul Cosmos","Space Zone India","Pixxel"], e:"Prarambh mission, 18 Nov 2022."},
 {k:"q", q:"What was the name of the winged vehicle used in RLV-LEX-02 and 03?", o:["Pushpak","Vyommitra","Gaganyaan","Vikram"], e:"Pushpak landed autonomously at Chitradurga."},
 {k:"link", h:"<b>Reuse needs three things together:</b> clean fuel (methalox, no soot), restartable ignition (spark torch igniter) and autonomous landing (LEX series). That is why all three show up in recent PYQs."}
], sum:["RLV-TD 2016 → LEX-01 (2023) → LEX-02 & 03 (2024, Pushpak, Chitradurga).","NGLV: ₹8,240 cr, ~30 t LEO, 3× LVM3 at 1.5× cost, methalox, reusable.","Skyroot: Vikram-S (2022), Vikram-1 'Aagaman' (18 Jul 2026, first private orbital). Agnikul: Agnibaan, Agnilet, Dhanush."]},

{ id:"L8", title:"Satellites by job: communication, imaging, navigation", hi:"काम के अनुसार उपग्रह", blocks:[
 {k:"table", title:"Satellite families", head:["Family","Job","Orbit","Examples"], rows:[["<b>INSAT</b>","'Bahubali' — communication, TV, weather, disaster warning, search & rescue","GEO","INSAT-1B (1983); <b>INSAT-3D/3DR/3DS</b> = weather only"],["<b>GSAT / CMS</b>","Pure communication, high-throughput broadband","GEO","GSAT-7 'Rukmini' (Navy, 2013), GSAT-20/N2 (Ka-band), CMS-03"],["<b>IRS → EOS</b>","Remote sensing / Earth observation","SSO / polar","IRS-1A (1988), Cartosat (mapping), Resourcesat, Oceansat, RISAT (radar), EOS series"],["<b>NavIC</b> (IRNSS)","Regional navigation","GEO + inclined GSO","IRNSS-1A (2013) …, NVS-01 (2023), NVS-02 (2025)"],["<b>IDRSS</b>","Data relay — LEO spacecraft talk to ground in near real time via a high relay satellite","GEO","For Gaganyaan & LEO satellites"]]},
 {k:"trick", h:"<b>3D = Weather.</b> INSAT is the Bahubali that does everything; the moment you see '3D', '3DR' or '3DS' after it, that Bahubali has been given only weather duty."},
 {k:"p", h:"<b>Why does navigation need at least four satellites?</b> One satellite tells you only your distance (a circle of possible positions). Two circles cross at two points; three pin one point. The fourth corrects your phone clock against the satellites' atomic clocks — a tiny time error is a big position error. That is why <b>atomic-clock failures</b> crippled NavIC (by March 2026 only a few satellites gave full service) and why <b>NVS</b> replacements matter."},
 {k:"facts", title:"NavIC", rows:[["Full name","Navigation with Indian Constellation (earlier IRNSS)"],["Design","7 satellites: 3 GEO + 4 inclined geosynchronous"],["Coverage","India plus ~1,500 km beyond its boundary"],["Second generation","NVS-01 (May 2023, GSLV-F12, first Indian atomic clock); NVS-02 (29 Jan 2025, GSLV-F15) stuck in transfer orbit — oxidiser valve did not open; <b>NVS-03</b> on GSLV-F18 due Oct 2026"],["GAGAN","GPS-Aided GEO Augmented Navigation — ISRO + Airports Authority of India; for aircraft landing; operational 2015"]]},
 {k:"p", h:"<b>Remote sensing</b> = learning about the ground without touching it. <b>Passive</b> sensors read reflected sunlight (no data at night/clouds). <b>Active</b> sensors send their own signal — <b>Synthetic Aperture Radar (SAR)</b> works day, night and through clouds (RISAT, EOS-04, NISAR). Data goes to <b>NRSC, Hyderabad</b>; the public sees it on <b>Bhuvan</b>; weather data on <b>MOSDAC</b>; archives on <b>Bhoonidhi</b>."},
 {k:"table", title:"NISAR — NASA-ISRO Synthetic Aperture Radar", head:["Item","Fact"], rows:[["Launch","30 Jul 2025, <b>GSLV-F16</b>, Sriharikota (GSLV Mk II)"],["Mass","~2,393 kg"],["Orbit","Sun-synchronous, <b>747 km</b>, ~100 min period; revisits each spot every <b>12 days</b>"],["Radars","<b>L-band (NASA)</b> ~24 cm wavelength; <b>S-band (ISRO)</b> ~9–10 cm"],["Antenna","12 m mesh reflector on a 9 m boom"],["Firsts","First dual-frequency radar Earth-observation satellite; first ISRO–NASA hardware partnership"],["Phases","Commissioning ~90 days after launch; science phase from Nov 2025"]]},
 {k:"trap", h:"<b>NISAR's S-band is not 12 cm.</b> Higher frequency = shorter wavelength: L-band 1.25 GHz ≈ 24 cm, S-band 3.2 GHz ≈ 9.4 cm. What matters for the exam: <b>L from NASA, S from ISRO</b>."},
 {k:"q", q:"INSAT-3DS is mainly a…", o:["Meteorological satellite","Navigation satellite","Mapping satellite","Radar imaging satellite"], e:"3D = weather; launched 17 Feb 2024 on GSLV-F14."},
 {k:"q", q:"In NISAR, the S-band radar was provided by…", o:["ISRO","NASA","JAXA","ESA"], e:"L-band from NASA."},
 {k:"link", h:"<b>Name tells job:</b> Carto-sat = cartography (maps); Resource-sat = resources; Ocean-sat = ocean colour, fish zones; RI-SAT = Radar Imaging; EMISAT = electronic intelligence; HysIS = hyperspectral; Anvesha (EOS-N1) = hyperspectral surveillance."}
], sum:["INSAT = all-rounder; INSAT-3D/3DR/3DS = weather; GSAT/CMS = communication; IRS/EOS = imaging; NavIC = navigation; IDRSS = relay.","Navigation needs 3 satellites for position + 1 for clock; NavIC 7 satellites, 1,500 km beyond India.","NISAR: GSLV-F16, 30 Jul 2025, 747 km SSO, 12-day revisit, L-band NASA, S-band ISRO."]},

{ id:"L9", title:"Recent ISRO launches, 2024–2026", hi:"हाल के इसरो मिशन", blocks:[
 {k:"table", title:"Launch log (newest first)", head:["Date","Vehicle","Payload","Outcome / fact"], rows:[["18 Jul 2026","Vikram-1 (Skyroot)","Mission Aagaman","First private orbital launch"],["12 Jan 2026","<b>PSLV-C62</b>","<b>EOS-N1 'Anvesha'</b> (DRDO hyperspectral) + 15 others","<b>Failed</b> in 3rd stage; only Spain's KID capsule survived"],["24 Dec 2025","<b>LVM3-M6</b>","<b>BlueBird Block-2</b> (AST SpaceMobile, USA)","<b>~6,100 kg — heaviest ever launched from India</b>; direct-to-mobile broadband"],["2 Nov 2025","<b>LVM3-M5</b>","<b>CMS-03 (GSAT-7R)</b>","~4,410 kg to GTO; heaviest Indian communication satellite; multiband (C, Ext-C, Ku); mainly for the Navy, replaces GSAT-7 'Rukmini'"],["30 Jul 2025","<b>GSLV-F16</b>","<b>NISAR</b>","NASA–ISRO radar"],["18 May 2025","<b>PSLV-C61</b> (101st launch)","<b>EOS-09 (RISAT-1B)</b>","<b>Failed</b> — 3rd stage chamber-pressure drop"],["29 Jan 2025","<b>GSLV-F15</b> (100th launch from Sriharikota)","<b>NVS-02</b>","Reached GTO, but could not raise orbit (oxidiser valve)"],["30 Dec 2024","<b>PSLV-C60</b>","<b>SpaDeX</b> + POEM-4","Docking 16 Jan 2025"],["5 Dec 2024","<b>PSLV-C59</b> (XL)","<b>Proba-3</b> (ESA)","Two spacecraft make an artificial solar eclipse"],["19 Nov 2024","SpaceX Falcon 9","<b>GSAT-20 / GSAT-N2</b>","Ka-band broadband & in-flight internet, for NSIL; 14-year life"],["16 Aug 2024","<b>SSLV-D3</b>","<b>EOS-08</b> + SR-0 DEMOSAT (Space Kidz India)","Third and final developmental SSLV flight"],["17 Feb 2024","<b>GSLV-F14</b>","<b>INSAT-3DS</b>","Weather; in GTO ~19 min after lift-off"],["1 Jan 2024","<b>PSLV-C58</b>","<b>XPoSat</b> + POEM-3","X-ray polarimetry"]]},
 {k:"trick", h:"<b>M5 and M6 — heaviest pair.</b> M5 = CMS-03, heaviest Indian <i>communication</i> satellite (4,410 kg). M6 = BlueBird, heaviest <i>anything</i> from Indian soil (6,100 kg) — and it was a US customer's. Five-four-four-ten → M5, 4,410."},
 {k:"trap", h:"<b>Two PSLV failures in a row: C61 and C62.</b> Both failed in the third (solid) stage. After C62, the lecture says a few small satellites were lost except the Spanish 'KID' capsule. Don't confuse with NVS-02 (GSLV-F15), which reached orbit but got stuck."},
 {k:"facts", title:"Numbers SSC asked", rows:[["100th launch from Sriharikota","GSLV-F15 / NVS-02, 29 Jan 2025"],["101st","PSLV-C61 / EOS-09"],["EOS-09 orbit","Sun-synchronous polar (planned)"],["CMS-03","Placed in GTO ~16 min after lift-off"],["ISRO Chairman at these launches","V. Narayanan"]]},
 {k:"q", q:"Which rocket launched the CMS-03 communication satellite?", o:["LVM3-M5","GSLV-F16","PSLV-C61","LVM3-M6"], e:"2 Nov 2025."},
 {k:"q", q:"The heaviest satellite ever launched from Indian soil (~6,100 kg) was…", o:["BlueBird Block-2","CMS-03","NISAR","GSAT-20"], e:"LVM3-M6, 24 Dec 2025."},
 {k:"link", h:"<b>Commercial wins:</b> Proba-3 (ESA) and BlueBird (USA) flew on Indian rockets via NSIL; GSAT-20 went the other way — on a SpaceX Falcon 9 because LVM3 could not lift its 4,700 kg at the time."}
], sum:["C60 SpaDeX (Dec 2024) • F15 NVS-02 100th (Jan 2025) • C61 EOS-09 failed (May 2025) • F16 NISAR (Jul 2025).","M5 CMS-03 4,410 kg (Nov 2025) • M6 BlueBird 6,100 kg (Dec 2025) • C62 Anvesha failed (Jan 2026).","2024: C58 XPoSat, F14 INSAT-3DS, SSLV-D3 EOS-08, GSAT-20 on Falcon 9, C59 Proba-3."]},
{ id:"L10", title:"Moon missions: Chandrayaan 1 to 5", hi:"चंद्रयान श्रृंखला", blocks:[
 {k:"table", title:"The Chandrayaan series", head:["Mission","Launch","Type","Key facts"], rows:[["<b>Chandrayaan-1</b>","22 Oct 2008, <b>PSLV-C11</b>","Orbiter + Moon Impact Probe","Confirmed water/hydroxyl on the Moon (NASA's M3 instrument); contact lost Aug 2009"],["<b>Chandrayaan-2</b>","22 Jul 2019, <b>GSLV Mk III-M1</b>","Orbiter + Vikram lander + Pragyan rover","Lander crashed 7 Sept 2019; orbiter still working"],["<b>Chandrayaan-3</b>","14 Jul 2023, <b>LVM3-M4</b>","Propulsion module + Vikram + Pragyan","Soft landing near the south pole <b>23 Aug 2023</b> — site '<b>Shiv Shakti</b>'; 23 Aug = National Space Day"],["<b>Chandrayaan-4</b>","Planned ~2027–28","Sample return","Bring back ~3 kg of lunar soil and rock (regolith)"],["<b>Chandrayaan-5 / LUPEX</b>","Planned ~2028","Lunar Polar Exploration with <b>JAXA</b>","Japan's H3 rocket and ~350 kg rover; ISRO's lander; studies water-ice near the south pole"]]},
 {k:"trap", h:"<b>Chandrayaan-1 flew on PSLV-C11</b> (one lecture slide said C1). And India was the <b>4th</b> country to soft-land on the Moon (after USSR, USA, China) but the <b>1st</b> to land near the south pole — not '4th at the south pole'."},
 {k:"table", title:"Chandrayaan-3 payloads", head:["Module","Payload","Studies"], rows:[["Lander Vikram","<b>ChaSTE</b>","Surface thermal properties"],["Lander Vikram","<b>ILSA</b>","Moonquakes (seismic)"],["Lander Vikram","<b>RAMBHA-LP</b>","Plasma near the surface"],["Lander Vikram","<b>LRA</b> (from NASA)","Laser retro-reflector for distance measurement"],["Rover Pragyan","<b>LIBS</b>, <b>APXS</b>","Elements in the soil, analysed in situ"],["Propulsion module (2,148 kg)","<b>SHAPE</b>","Spectro-polarimetry of Habitable Planet Earth — looks back at Earth"]]},
 {k:"trick", h:"<b>RAMBHA = plasma, ILSA = quakes, ChaSTE = heat, SHAPE = Earth.</b> 'Rambha nachi plasma pe, ILSA ko aaya bhookamp, ChaSTE ne naapi garmi, SHAPE ne dekhi dharti.'"},
 {k:"facts", title:"Other Moon facts", rows:[["Far side first landing","<b>China — Chang'e-4 (2019)</b>; Chang'e-6 (2024) brought back far-side samples — the only country to do so"],["Why we never see the far side","Tidal locking — the Moon's rotation and revolution both take ~27.3 days"],["Shiv Shakti / Tiranga points","Chandrayaan-3 landing site / Chandrayaan-2 crash site"],["Indian on the Moon","Target 2040"],["Apollo 11","20 Jul 1969 — Armstrong & Aldrin walked; Michael Collins orbited"],["Apollo 17","1972 — last crewed landing"],["Artemis II","1–11 Apr 2026 — first crewed lunar flyby since 1972 (Lesson 13)"]]},
 {k:"q", q:"Chandrayaan-3 was launched by…", o:["LVM3-M4","GSLV Mk III-M1","PSLV-C11","GSLV-F15"], e:"14 July 2023; landed 23 Aug 2023."},
 {k:"q", q:"Which country first landed a rover on the far side of the Moon?", o:["China","India","USA","Japan"], e:"Chang'e-4, 2019."},
 {k:"link", h:"<b>Moon plan as a ladder:</b> Ch-1 orbit (2008) → Ch-2 try landing (2019) → Ch-3 land & rove (2023) → Ch-4 bring soil home → Ch-5/LUPEX ice with Japan → Indian on the Moon 2040."}
], sum:["Ch-1 PSLV-C11 2008 water; Ch-2 GSLV Mk III-M1 2019 lander crash; Ch-3 LVM3-M4 landed 23 Aug 2023 (Shiv Shakti).","Ch-3 payloads: ChaSTE heat, ILSA quakes, RAMBHA plasma, LRA (NASA), LIBS/APXS, SHAPE.","Ch-4 sample return; Ch-5 = LUPEX with JAXA (H3 rocket, JAXA rover, ISRO lander)."]},

{ id:"L11", title:"Sun & sky: Aditya-L1, AstroSat, XPoSat, telescopes", hi:"सूर्य मिशन और अंतरिक्ष वेधशालाएँ", blocks:[
 {k:"facts", title:"Aditya-L1 — India's first solar observatory", rows:[["Launch","<b>2 Sept 2023, PSLV-C57</b> (XL), Sriharikota"],["Mass","~1,475 kg"],["Orbit","Halo orbit around <b>Sun–Earth L1</b>, ~1.5 million km — reached <b>6 Jan 2024</b> (~127 days)"],["Studies","Photosphere, chromosphere, corona, solar wind, flares, coronal mass ejections (CMEs), space weather"],["Payloads","7 indigenous"]]},
 {k:"table", title:"Aditya-L1 payloads", head:["Payload","Full name / job"], rows:[["<b>VELC</b>","Visible Emission Line Coronagraph — images the corona, CMEs"],["<b>SUIT</b>","Solar Ultraviolet Imaging Telescope — UV images of photosphere & chromosphere"],["<b>SoLEXS</b>","Solar Low Energy X-ray Spectrometer — soft X-ray flares"],["<b>HEL1OS</b>","High Energy L1 Orbiting X-ray Spectrometer — hard X-rays"],["<b>ASPEX</b>","Aditya Solar wind Particle EXperiment (includes SWIS — solar wind ion spectrometer)"],["<b>PAPA</b>","Plasma Analyser Package for Aditya"],["<b>MAG</b>","Magnetometer — interplanetary magnetic field strength and direction"]]},
 {k:"trick", h:"<b>Read the letters:</b> C in VELC = Coronagraph; U in SUIT = Ultraviolet; X in SoLEXS & HEL1OS = X-ray; P in ASPEX = Particles (solar wind); PA in PAPA = Plasma Analyser; MAG = magnetic field."},
 {k:"trap", h:"<b>Solar flares vs CMEs.</b> Flares are sudden bursts of radiation from sunspot regions (cooler, strongly magnetic); CMEs are huge clouds of plasma thrown from the corona. Both disturb satellites, GPS, power grids and radio (not ocean currents)."},
 {k:"table", title:"Indian space observatories", head:["Mission","Launch","What it does"], rows:[["<b>AstroSat</b>","28 Sept 2015, <b>PSLV-C30</b>, ~650 km near-equatorial LEO, ~1,513 kg","India's first <b>multi-wavelength</b> observatory — UV, optical and X-ray at the same time; found far-UV light from distant galaxies"],["<b>XPoSat</b>","1 Jan 2024, <b>PSLV-C58</b>, ~650 km LEO","India's first (world's 2nd after NASA's IXPE) <b>X-ray polarimetry</b> mission. <b>POLIX</b> (8–30 keV, by Raman Research Institute) measures degree & angle of polarisation; <b>XSPECT</b> (0.8–15 keV, by URSC) does spectroscopy & timing"],["<b>MACE</b>","Inaugurated Oct 2024, <b>Hanle, Ladakh</b> (ground-based)","Major Atmospheric Cherenkov Experiment — Asia's largest imaging Cherenkov telescope; detects very-high-energy gamma rays <b>indirectly</b> through Cherenkov light in Earth's atmosphere"]]},
 {k:"trick", h:"<b>POLIX = POLarisation, XSPECT = X-ray SPECTroscopy + Timing.</b> 'Expect the time' — XSPECT gives timing."},
 {k:"table", title:"World telescopes and solar probes", head:["Mission","Agency","Fact"], rows:[["<b>Hubble</b>","NASA (with ESA), 1990","~540 km LEO; UV + visible; serviced by astronauts"],["<b>James Webb (JWST)</b>","NASA, ESA, CSA; 25 Dec 2021","At <b>L2</b>; mainly <b>infrared</b>; gold-coated beryllium segmented mirror unfolds after launch"],["<b>Event Horizon Telescope</b>","Global array","Earth-sized virtual radio telescope; first black-hole image M87* (2019), Sagittarius A* (2022)"],["<b>SPHEREx</b>","NASA, 11 Mar 2025, Falcon 9","Near-infrared all-sky survey, 3D map of the cosmos every 6 months; SSO ~650–700 km"],["<b>Parker Solar Probe</b>","NASA, 2018","First to 'touch' the Sun — flew through the corona; closest ~6.1 million km (Dec 2024); carbon-composite heat shield"],["<b>Proba-3</b>","ESA, PSLV-C59, 2024","Two spacecraft fly in formation — one blocks the Sun for the other (artificial eclipse)"]]},
 {k:"q", q:"Which Aditya-L1 payload measures the interplanetary magnetic field?", o:["Magnetometer (MAG)","VELC","SUIT","SoLEXS"], e:"Steno 2026 PYQ."},
 {k:"q", q:"MACE telescope is located at…", o:["Hanle, Ladakh","Mount Abu","Sriharikota","Ooty"], e:"Ground-based; Cherenkov light from gamma rays."},
 {k:"link", h:"<b>Wavelength map:</b> SUIT = UV; VELC = visible; SoLEXS/HEL1OS/XPoSat = X-ray; MACE = gamma; JWST = infrared; NISAR = microwave radar. AstroSat covers UV + optical + X-ray together."}
], sum:["Aditya-L1: PSLV-C57, 2 Sept 2023, L1 on 6 Jan 2024, 7 payloads (VELC, SUIT, SoLEXS, HEL1OS, ASPEX, PAPA, MAG).","AstroSat PSLV-C30 2015 multi-wavelength; XPoSat PSLV-C58 2024 (POLIX, XSPECT); MACE Hanle gamma rays.","JWST at L2 infrared; Hubble LEO UV-visible; Parker touched the corona."]},

{ id:"L12", title:"Mars, Venus & deep space", hi:"मंगल, शुक्र और गहन अंतरिक्ष", blocks:[

{ id:"L16", title:"Biotech & new tech (Steno 2026 set)", hi:"जैव-प्रौद्योगिकी और नई तकनीक", blocks:[
 {k:"p", h:"Steno 2026 paired space with biotech and new-tech statements. You don't need a full biology course — learn the core idea of each term and use elimination (extreme words, negative tone, 'only/solely/all') for the rest."},
 {k:"facts", title:"DNA basics", rows:[["Gene","Functional segment of DNA"],["Base pairs","A pairs with T (<b>2</b> hydrogen bonds); G pairs with C (<b>3</b> hydrogen bonds)"],["Chargaff's rule","A = T and G = C in amount. If A = 30%, then T = 30%, G = C = 20%"]]},
 {k:"table", title:"Biotech terms", head:["Term","Core idea"], rows:[["<b>CRISPR-Cas9</b>","Clustered Regularly Interspaced Short Palindromic Repeats. A guide RNA finds the faulty spot; the Cas9 enzyme cuts DNA like scissors; the fault can be removed or replaced (e.g. sickle-cell therapy)"],["<b>Genome sequencing</b>","Reading the full order of bases (A, T, G, C). Steps: DNA extraction → fragmentation → sequencing → assembly. Sanger = one fragment at a time; NGS = millions in parallel. Finds variants linked to disease risk"],["<b>IndiGen</b> (2019)","CSIR's sequencing of ~1,000 Indians' genomes; Genome India project later sequenced 10,000"],["<b>DNA barcoding</b>","Identify species from a short standard gene region — <b>COI</b> in animals, <b>rbcL / matK</b> in plants; limited by reference databases. Uses PCR to copy the DNA"],["<b>Recombinant vector vaccine</b>","A harmless virus/bacterium is engineered to carry the target pathogen's antigen gene → strong cell and antibody response; challenges: pre-existing vector immunity, stability"]]},
 {k:"table", title:"Tech terms", head:["Term","Core idea"], rows:[["<b>AR</b> — Augmented Reality","Overlays digital information on the real world in real time (digital → physical)"],["<b>VR</b> — Virtual Reality","Puts you fully inside a simulated world with a headset (physical → digital)"],["<b>VoLTE</b>","Voice over LTE — voice calls as data packets over 4G (IP); HD voice, faster call setup, voice + data together; needs compatible phone & network"],["<b>Carbon nanotubes</b>","Rolled-up graphene cylinders; single-walled ones can be metallic or semiconducting depending on chirality and diameter — nano-electronics, sensors; very strong, high thermal conductivity"],["<b>Space surveillance</b>","Satellites give wide-area, day-night, all-weather watch, early warning and missile tracking — but are vulnerable to anti-satellite weapons and need complex orbital coordination"]]},
 {k:"trick", h:"<b>AR adds, VR replaces.</b> AR = Add on Reality; VR = Very Replaced. And CRISPR = cut, sequencing = read, barcoding = identify."},
 {k:"trick", h:"<b>Elimination kit from the Steno lecture:</b> drop options with 'only, solely, exclusively, all, eliminates the need, 100%'; drop ones with a clearly negative tone about a new technology; prefer the option that explains itself (brackets, slashes, 'but faces…' — a real limitation)."},
 {k:"q", q:"In DNA, guanine pairs with cytosine through how many hydrogen bonds?", o:["Three","Two","One","Four"], e:"A–T two, G–C three."},
 {k:"q", q:"Augmented reality…", o:["Overlays digital information on the real world","Replaces the real world with a virtual one","Needs a brain implant","Works only with recorded video"], e:"VR replaces; AR overlays."},
 {k:"link", h:"<b>Read → edit:</b> genome sequencing finds the faulty gene; CRISPR-Cas9 fixes it. DNA barcoding is a short 'read' used to name a species."}
], sum:["A–T 2 bonds, G–C 3; Chargaff: A = T, G = C.","CRISPR-Cas9 = guide RNA + Cas9 scissors; sequencing = extraction, fragmentation, sequencing, assembly; barcoding COI / rbcL / matK.","AR overlays, VR immerses; VoLTE = voice as IP data on 4G; CNTs metallic or semiconducting by chirality."]}
];

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hash = s => { let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5)+h + s.charCodeAt(i))|0; return "q"+(h>>>0).toString(36); };
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; };

const LNUM = id => LESSONS.findIndex(l => l.id === id) + 1;

});
const byLesson = id => QS.filter(q => q.t === id);

function renderTop(){
  const ids = Object.keys(S.ans).filter(k => QS.some(q => q.id === k));

  $("#topstat").innerHTML = `<b>${ids.length}</b>/${QS.length} tried<br><b>${pct}%</b> right now`;
}

function blockHTML(b){
  if (b.k==="p") return `<div class="plain"><p>${b.h}</p></div>`;
  if (b.k==="trick") return `<div class="trick"><span class="lab">Trick</span>${b.h}</div>`;
  if (b.k==="link") return `<div class="link"><span class="lab">Link · connect the dots</span>${b.h}</div>`;
  if (b.k==="q") { const perm = shuffle(b.o.map((_,i)=>i)); return `<div class="icheck" data-ic><span class="lab">Quick check</span><p class="qt">${esc(b.q)}</p><div class="opts">${perm.map((oi,k)=>`<button type="button" class="opt" data-ioi="${oi}"><span class="k">${"ABCD"[k]}</span><span>${esc(b.o[oi])}</span></button>`).join("")}</div><div class="exp" hidden><b class="okl"></b> ${esc(b.e)}</div></div>`; }
  if (b.k==="trap") return `<div class="trap"><span class="lab">Trap · correction</span>${b.h}</div>`;
  if (b.k==="facts") return `<div class="block"><h3>${b.title}</h3><dl class="facts">${b.rows.map(r=>`<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join("")}</dl></div>`;
  if (b.k==="tl") return `<div class="block"><h3>${b.title}</h3><ul class="tl">${b.rows.map(r=>`<li><span class="y">${r[0]}</span><span>${r[1]}</span></li>`).join("")}</ul></div>`;
  if (b.k==="table") {
    const isNum = (ci) => b.numcol==="all" ? ci>0 : (b.numcol===1 && ci===1) || (typeof b.numcol==="string" && b.numcol.includes(String(ci)));
    return `<div class="block"><h3>${b.title}</h3><div class="tbl"><table><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map((c,ci)=>`<td class="${isNum(ci)?"n":""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  }
  if (b.k==="fig") return `<div class="block"><h3>${b.title}</h3><figure class="fig">${b.svg}<figcaption>${b.cap}</figcaption></figure></div>`;
  if (b.k==="pyr") return `<div class="block"><h3>${b.title}</h3><div class="pyr">${b.items.map(it=>`<div>${PYR(it.rows)}<b>${it.name}</b><span class="muted">${it.note}</span></div>`).join("")}</div><p class="muted" style="font-size:13px;margin-top:8px"><span style="color:var(--blue)">■</span> males · <span style="color:var(--accent)">■</span> females · top = old, base = young</p></div>`;
  return "";
}

  $("#lback").onclick = () => renderLearn();
  $("#app").querySelectorAll("[data-step]").forEach(b => b.onclick = () => openLesson(id, b.dataset.step));

function optsHTML(q, perm, state){

}
function expHTML(q, picked){

let PF = "all", PSHOW = 20, PORDER = null, PPERM = {}, PPICK = {};
function practiceList(){

}
function renderPractice(){

function pCard(q, idx){

function drawPList(){

  box.innerHTML = list.slice(0, PSHOW).map((q,i)=>pCard(q,i)).join("") + (list.length > PSHOW ? `<button class="btn" type="button" id="pmore">Show 20 more (${list.length-PSHOW} left)</button>` : "");

function bindP(box){ box.querySelectorAll(".qcard").forEach(bindCard); }
function bindCard(card){
  card.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const q = QS.find(x => x.id === card.dataset.q); if (PPICK[q.id] !== undefined) return;

function renderMock(){

function startTimer(){

}
const fmt = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
function drawMockRun(){
  const it = M.list[M.i], q = it.q, left = Math.max(0, Math.round((M.end-Date.now())/1000));

    ${M.showPal ? `<div class="block"><div class="pal">${M.list.map((_,k)=>`<button type="button" data-j="${k}" class="${M.ans[k]!==null?"a":""} ${M.mark[k]?"m":""} ${k===M.i?"cur":""}" aria-label="Question ${k+1}">${k+1}</button>`).join("")}</div>

  const lvn = $("#lvn"); if (lvn) lvn.onclick = () => { LEAVE_TO = null; drawMockRun(); };

function showMockLeave(tab){ LEAVE_TO = tab; drawMockRun(); }
function submitMock(){
  if (!M || !M.running) return;
  clearInterval(timerId);
  M.running = false; M.done = true; M.confirm = false;
  let c=0,w=0,sk=0; const per = {};
  M.list.forEach((it,k) => {
    const a = M.ans[k]; const t = it.q.t; per[t] = per[t] || {c:0,n:0}; per[t].n++;
    if (a===null) sk++; else if (a===it.q.a) { c++; per[t].c++; S.ans[it.q.id]=1; } else { w++; S.ans[it.q.id]=0; }
  });
  const max = M.list.length*2, score = +(c*2 - (M.neg? w*0.5 : 0)).toFixed(1);
  const used = Math.min(M.secs, Math.round((Date.now()-M.start)/1000));
  M.res = {c,w,sk,score,max,used,per, acc: (c+w) ? Math.round(c*100/(c+w)) : 0};

  S.mocks = (S.mocks||[]).concat([{d:ds, n:M.list.length, score, max, acc:M.res.acc}]).slice(-20); save(); renderTop();

  </section>`;
  bindBM($("#app"));
  $("#app").querySelectorAll("[data-rf]").forEach(b => b.onclick = () => { M.filter = b.dataset.rf; drawMockResult(); });

    M.end = M.start + M.secs*1000; startTimer(); drawMockRun();
  };
}

      <div class="block"><div class="tbl"><table><thead><tr><th>Mission</th><th>Rocket</th><th>Date</th><th>Agency</th><th>Remember</th></tr></thead><tbody id="fb"></tbody></table></div></div>`;
    const draw = () => { const q = $("#fs").value.trim().toLowerCase();
      const rows = MISSIONS.filter(f => !q || f.join(" ").toLowerCase().includes(q));
      $("#fb").innerHTML = rows.length ? rows.map(f=>`<tr><td><b>${esc(f[0])}</b><br><span class="muted" style="font-size:12px">L${LNUM(f[5])}</span></td><td>${esc(f[1])}</td><td class="n">${esc(f[2])}</td><td>${esc(f[3])}</td><td>${esc(f[4])}</td></tr>`).join("") : `<tr><td colspan="5" class="muted">No match.</td></tr>`; };
    $("#fs").oninput = draw; draw();
  }
  if (RV === "rockets") {
    const order = RORDER || ROCKETS.map((_,i)=>i);
    const LBL = {stages:"Stages", lift:"Lift-off", pay:"Payload", rem:"Remember"}, COL = {stages:1, lift:2, pay:3, rem:4};
    const cell = (k, col) => { const v = ROCKETS[k][COL[col]]; return (RHIDE[col] && !RREV[k+col]) ? `<td data-l="${LBL[col]}"><button type="button" class="peek" data-peek="${k+col}" aria-label="Show ${LBL[col]}">tap</button></td>` : `<td data-l="${LBL[col]}">${esc(v)}</td>`; };
    box.innerHTML = `<p class="muted">Cover drill for India's launch vehicles. Hide a column, say it aloud, tap to check. Stage counts and payloads are the favourite traps.</p>
      <div class="chips" role="group" aria-label="Hide columns">${Object.keys(LBL).map(c=>`<button type="button" class="chip" data-hide="${c}" aria-pressed="${!!RHIDE[c]}">Hide ${LBL[c].toLowerCase()}</button>`).join("")}
      <button type="button" class="chip" id="rshuf">${RORDER?"In order":"Shuffle rows"}</button><button type="button" class="chip" id="rreset">Cover all again</button></div>
      <div class="block"><div class="tbl"><table class="cover"><thead><tr><th>Vehicle</th><th>Stages</th><th>Lift-off</th><th>Payload</th><th>Remember</th></tr></thead><tbody>${order.map(k=>`<tr><td data-l="Vehicle"><b>${esc(ROCKETS[k][0])}</b></td>${cell(k,"stages")}${cell(k,"lift")}${cell(k,"pay")}${cell(k,"rem")}</tr>`).join("")}</tbody></table></div></div>`;
    box.querySelectorAll("[data-hide]").forEach(b => b.onclick = () => { const c=b.dataset.hide; RHIDE[c] = RHIDE[c]?0:1; renderRevise(); });
    box.querySelectorAll("[data-peek]").forEach(b => b.onclick = () => { RREV[b.dataset.peek] = 1; renderRevise(); });
    $("#rshuf").onclick = () => { RORDER = RORDER ? null : shuffle(ROCKETS.map((_,i)=>i)); renderRevise(); };
    $("#rreset").onclick = () => { RREV = {}; renderRevise(); };
  }
  if (RV === "centres") {
    box.innerHTML = `<p class="muted">Every place name SSC can pair with a job. ${CHIDE?"Tap to reveal the place.":""}</p>
      <div class="chips"><button type="button" class="chip" id="ch" aria-pressed="${!!CHIDE}">Hide place</button><button type="button" class="chip" id="cr">Cover all again</button></div>
      <div class="block"><ul class="plist">${CENTRES.map((c,i)=>`<li><b>${esc(c[0])}</b> <span class="muted">— ${esc(c[2])}</span><span>${CHIDE && !CREV[i] ? `<button type="button" class="peek" data-cp="${i}">tap</button>` : esc(c[1])}</span></li>`).join("")}</ul></div>`;
    $("#ch").onclick = () => { CHIDE = CHIDE?0:1; renderRevise(); };
    $("#cr").onclick = () => { CREV = {}; renderRevise(); };
    box.querySelectorAll("[data-cp]").forEach(b => b.onclick = () => { CREV[b.dataset.cp]=1; renderRevise(); });
  }
  if (RV === "firsts") {
    const tabs14 = L("L14").blocks.filter(b=>b.k==="table");
    const rows = tabs14.flatMap(t => t.rows);
    box.innerHTML = `<p class="muted">World space firsts — machines and people. ${FHIDE?"Cover the name, recall, tap.":""}</p>
      <div class="chips"><button type="button" class="chip" id="fh" aria-pressed="${!!FHIDE}">Hide name</button><button type="button" class="chip" id="fr">Cover all again</button></div>
      <div class="block"><dl class="rk">${rows.map((r,i)=>`<div><dt>${r[0]} <span class="muted" style="font-weight:400">· ${r[2]}</span></dt><dd>${FHIDE && !FREV[i] ? `<button type="button" class="peek" data-fp="${i}">tap</button>` : `<b style="color:var(--ink)">${r[1]}</b>`}</dd></div>`).join("")}</dl></div>`;
    $("#fh").onclick = () => { FHIDE = FHIDE?0:1; renderRevise(); };
    $("#fr").onclick = () => { FREV = {}; renderRevise(); };
    box.querySelectorAll("[data-fp]").forEach(b => b.onclick = () => { FREV[b.dataset.fp]=1; renderRevise(); });
  }
  if (RV === "links") {
    const items = LESSONS.flatMap((l,i) => l.blocks.filter(b=>b.k==="link").map(b=>({l:i+1, t:l.title, h:b.h})));
    box.innerHTML = items.map(x => `<div class="link"><span class="lab">L${x.l} · ${esc(x.t)}</span>${x.h}</div>`).join("");
  }
  if (RV === "nums") {
    box.innerHTML = `<div class="tiles">${TILES.map(t=>`<div class="tile"><span class="num">${t[0]}</span><span>${t[1]}</span></div>`).join("")}</div>
    <div class="block"><h3>Look-alike pairs</h3><dl class="rk">${PAIRS.map(p=>`<div><dt>${esc(p[0])}</dt><dd>${esc(p[1])}</dd></div>`).join("")}</dl></div>`;
  }
  if (RV === "tricks" || RV === "traps") {
    const kind = RV==="tricks" ? "trick" : "trap";
    const items = LESSONS.flatMap((l,i) => l.blocks.filter(b=>b.k===kind).map(b=>({l:i+1, t:l.title, h:b.h})));
    box.innerHTML = items.map(x => `<div class="${kind}"><span class="lab">L${x.l} · ${esc(x.t)}</span>${x.h}</div>`).join("");
  }
  if (RV === "flash") drawFlash(box);
}
function drawFlash(box){
  if (!FC) { const pool = FCSCOPE==="all" ? QS : FCSCOPE==="wrong" ? QS.filter(q=>S.ans[q.id]===0) : QS.filter(q=>q.t===FCSCOPE); FC = {list: shuffle(pool), i:0, flip:false, known:0}; }
  const sel = `<select id="fcs" aria-label="Flashcard set"><option value="all">All questions</option><option value="wrong">My mistakes</option>${LESSONS.map((l,i)=>`<option value="${l.id}">L${i+1} · ${esc(l.title)}</option>`).join("")}</select>`;
  if (!FC.list.length || FC.i >= FC.list.length) {
    box.innerHTML = `<div class="row">${sel}</div><div class="block stack"><h3>${FC.list.length ? "Deck finished" : "No cards in this set"}</h3>${FC.list.length?`<p class="muted">You knew ${FC.known} of ${FC.list.length} on first look.</p>`:""}<div class="row"><button class="btn pri" type="button" id="fcr">Shuffle and restart</button></div></div>`;
    $("#fcs").value = FCSCOPE; $("#fcs").onchange = e => { FCSCOPE = e.target.value; FC = null; drawFlash(box); };
    $("#fcr").onclick = () => { FC = null; drawFlash(box); }; return;
  }
  const q = FC.list[FC.i];
  box.innerHTML = `<div class="row between">${sel}<span class="muted num" style="font-size:13px">${FC.i+1}/${FC.list.length}</span></div>
    <button type="button" class="flash" id="fcard" aria-label="Flip card">
      <span class="side">${FC.flip?"Answer":"Question · tap to flip"}</span>
      <span class="front">${esc(q.q)}</span>
      ${FC.flip ? `<span class="ans">${esc(q.o[q.a])}</span><span class="muted">${esc(q.e)}</span>` : ""}
    </button>
    <div class="row between"><button class="btn" type="button" id="fca" ${FC.flip?"":"disabled"}>Again later</button><button class="btn pri" type="button" id="fck" ${FC.flip?"":"disabled"}>Got it</button></div>`;
  $("#fcs").value = FCSCOPE; $("#fcs").onchange = e => { FCSCOPE = e.target.value; FC = null; drawFlash(box); };
  $("#fcard").onclick = () => { FC.flip = !FC.flip; drawFlash(box); };
  $("#fca").onclick = () => { FC.list.push(q); FC.list.splice(FC.i,1); FC.flip=false; drawFlash(box); };
  $("#fck").onclick = () => { FC.known++; FC.i++; FC.flip=false; drawFlash(box); };
}

/* boot */
renderTop();
const start = (location.hash||"").replace("#","");
go(["learn","practice","mock","revise"].includes(start) ? start : "learn");
</script>

<script id="shabd-deeplink">
(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();
</script>

{"id":"I1","heat":3,"title":"Machines, transport and everyday objects","hi":"मशीनें, परिवहन और रोज़मर्रा की वस्तुएँ","blocks":[{"k":"hot","h":"SSC asks <b>“Who invented X?”<\/b> almost every shift. The favourites: <b>steam engine (Watt)<\/b>, <b>aeroplane (Wright brothers, 1903)<\/b>, <b>diesel engine (Rudolf Diesel)<\/b>, <b>printing press (Gutenberg)<\/b>, <b>dynamite (Nobel)<\/b>, <b>sewing machine (Elias Howe)<\/b>, <b>pneumatic tyre (Dunlop)<\/b> and <b>jet engine (Frank Whittle)<\/b>."},{"k":"story","h":"<p>The modern world began with power. In 1769 <b>James Watt<\/b> made the steam engine efficient; soon <b>George Stephenson<\/b> put it on rails and <b>Robert Fulton<\/b> on a boat. Then came engines that burn fuel inside: <b>Nikolaus Otto<\/b>'s four-stroke engine (1876), <b>Karl Benz<\/b>'s car (1886) and <b>Rudolf Diesel<\/b>'s engine (1892). <b>Dunlop<\/b>'s air-filled tyre made rides smooth. In 1903 the <b>Wright brothers<\/b> flew, and <b>Frank Whittle<\/b>'s jet engine and <b>Igor Sikorsky<\/b>'s helicopter followed.<\/p><p>Small things changed daily life too. <b>Gutenberg<\/b> printed books with movable type (about 1440). <b>Elias Howe<\/b> made the sewing machine, <b>Biro<\/b> the ballpoint pen, <b>Walter Hunt<\/b> the safety pin, <b>Gillette<\/b> the safety razor. <b>Alfred Nobel<\/b> invented dynamite — and left his fortune for the Nobel Prizes.<\/p>","key":"Watt — steam engine; Wright brothers — aeroplane 1903; Benz — car; Diesel — diesel engine; Dunlop — tyre; Gutenberg — printing press; Nobel — dynamite."},{"k":"table","title":"Machines and transport","head":["Invention","Inventor","Note"],"rows":[["steam engine (with a separate condenser)","James Watt","1769 patent. Thomas Newcomen built an earlier steam engine (1712); Watt made it efficient. The unit of power, the watt, is named after him."],["railway steam locomotive 'Rocket'","George Stephenson","1829, with his son Robert. Called the 'Father of Railways'. (Richard Trevithick ran an earlier locomotive in 1804.)"],["aeroplane","Wright brothers","Orville and Wilbur Wright made the first powered, controlled flight on 17 December 1903 at Kitty Hawk, USA."],["petrol motor car","Karl Benz","Patented in 1886 in Germany."],["diesel engine","Rudolf Diesel","Patented in 1892 (Germany); ignites fuel by compression, with no spark plug."],["four-stroke petrol engine","Nikolaus Otto","1876, Germany — the 'Otto cycle'."],["motorcycle","Gottlieb Daimler","1885, with Wilhelm Maybach."],["pedal bicycle","Kirkpatrick Macmillan","Around 1839, Scotland. (Karl Drais made a pedal-less 'running machine' in 1817.)"],["pneumatic (air-filled) tyre","John Boyd Dunlop","1888, Scotland."],["jet engine","Frank Whittle","Patented in 1930 in Britain."],["helicopter (practical, single rotor)","Igor Sikorsky","VS-300, flown in 1939 in the USA."],["hot-air balloon","Montgolfier brothers","1783, France."],["steamboat (first commercial)","Robert Fulton","The Clermont, 1807, USA."],["printing press with movable type","Johannes Gutenberg","About 1440, Germany; printed the Gutenberg Bible."],["spinning jenny","James Hargreaves","About 1764 — the Industrial Revolution in textiles."],["flying shuttle","John Kay","1733 — made weaving faster."],["safety lift (elevator brake)","Elisha Otis","1852–53, USA."]]},{"k":"tlfig","title":"Machines and transport in time","rows":[[1440,"Printing press with movable type — Johannes Gutenberg",""],[1733,"Flying shuttle — John Kay",""],[1764,"Spinning jenny — James Hargreaves",""],[1769,"Steam engine — James Watt",""],[1783,"Hot-air balloon — Montgolfier brothers",""],[1807,"Steamboat — Robert Fulton",""],[1829,"Railway steam locomotive 'Rocket' — George Stephenson",""],[1839,"Pedal bicycle — Kirkpatrick Macmillan",""],[1852,"Safety lift — Elisha Otis",""],[1876,"Four-stroke petrol engine — Nikolaus Otto",""],[1885,"Motorcycle — Gottlieb Daimler",""],[1886,"Petrol motor car — Karl Benz",""],[1888,"Pneumatic (air-filled) tyre — John Boyd Dunlop",""],[1892,"Diesel {"id":"I2","heat":3,"title":"Communication, electricity and computing","hi":"संचार, बिजली और कंप्यूटर","blocks":[{"k":"hot","h":"Very common: <b>telephone (Bell)<\/b>, <b>radio (Marconi)<\/b>, <b>television (Baird)<\/b>, <b>electric bulb and phonograph (Edison)<\/b>, <b>battery (Volta)<\/b>, <b>WWW (Tim Berners-Lee)<\/b>, <b>father of the computer (Babbage)<\/b>. Indian names asked often: <b>Sabeer Bhatia<\/b> (Hotmail), <b>Ajay Bhatt<\/b> (USB), <b>Vinod Dham<\/b> (Pentium), <b>N. S. Kapany<\/b> (fibre optics)."},{"k":"story","h":"<p>In 1800 <b>Volta<\/b> stacked metal discs to make the first battery; in 1831 <b>Faraday<\/b> turned motion into electricity with a dynamo. Wires soon carried words: <b>Morse<\/b>'s telegraph (1844), <b>Bell<\/b>'s telephone (1876). <b>Edison<\/b> gave us the phonograph (1877) and a long-lasting bulb (1879). <b>Marconi<\/b> sent signals with no wires at all, and <b>Baird<\/b> showed television in 1926.<\/p><p>The <b>transistor<\/b> (1947) and the <b>chip<\/b> (1958) made electronics small. <b>Babbage<\/b> had dreamed of a computer a century earlier. <b>Cerf and Kahn<\/b> wrote TCP/IP (1974), <b>Ray Tomlinson<\/b> sent the first network email with '@' (1971), and <b>Tim Berners-Lee<\/b> built the World Wide Web (1989). Indians in the story: <b>Sabeer Bhatia<\/b> (Hotmail), <b>Ajay Bhatt<\/b> (USB) and <b>Vinod Dham<\/b> (Pentium).<\/p>","key":"Bell — telephone; Marconi — radio; Baird — TV; Edison — bulb and phonograph; Volta — battery; Faraday — dynamo; Berners-Lee — WWW; Babbage — computer."},{"k":"table","title":"Communication, electricity and computing","head":["Invention","Inventor","Note"],"rows":[["telephone","Alexander Graham Bell","Patented in 1876, USA."],["electric telegraph and its code","Samuel Morse","First long-distance message in 1844: 'What hath God wrought'."],["radio (wireless telegraphy)","Guglielmo Marconi","1895–96, Italy; Nobel Prize 1909. J. C. Bose showed microwave signalling in Kolkata in 1895."],["television (first public demonstration)","John Logie Baird","1926, London, Scotland-born inventor."],["phonograph","Thomas Edison","1877. Edison also made the practical electric bulb (1879)."],["gramophone (flat disc record)","Emile Berliner","1887."],["cinematograph","Lumiere brothers","1895, Paris — the first public film show."],["electric battery (voltaic pile)","Alessandro Volta","1800, Italy. The volt is named after him."],["electric dynamo","Michael Faraday","1831, after he discovered electromagnetic induction."],["AC induction motor","Nikola Tesla","1888. The tesla (unit of magnetic flux density) is named after him."],["transistor","Bardeen, Brattain and Shockley","1947, Bell Labs, USA; Nobel Prize 1956."],["integrated circuit (chip)","Jack Kilby","1958, Texas Instruments (Robert Noyce made one independently); Nobel Prize 2000."],["laser (first working)","Theodore Maiman","1960, USA."],["radar (practical)","Robert Watson-Watt","1935, Britain."],["handheld mobile phone","Martin Cooper","1973, Motorola — the first call from a handheld mobile."],["Analytical Engine (mechanical computer)","Charles Babbage","Designed from 1837 — the 'Father of the Computer'."],["computer mouse","Douglas Engelbart","Made in 1964, shown in 1968."],["World Wide Web","Tim Berners-Lee","1989 at CERN, Geneva."],["network email with the @ sign","Ray Tomlinson","1971, on ARPANET."],["TCP/IP — the language of the Internet","Vint Cerf and Bob Kahn","1974 — both called 'Fathers of the Internet'."],["C programming language","Dennis Ritchie","1972, Bell Labs."],["Java programming language","James Gosling","1995, Sun Microsystems."],["Google search engine","Larry Page and Sergey Brin","1998, USA."],["Hotmail (free web email)","Sabeer Bhatia","Co-founded with Jack Smith in 1996; sold to Microsoft in 1997."],["USB (Universal Serial Bus)","Ajay Bhatt","Co-inventor at Intel in the 1990s."],["Pentium processor","Vinod Dham","Led the Intel team (1993) — the 'Father of the Pentium'."],["optical fibre (pioneering work)","Narinder Singh Kapany","Indian-born physicist, called the 'Father of Fibre Optics'."]]},{"k":"tlfig","title":"Communication, electricity and computing in time","rows":[[1800,"Electric battery — Alessandro Volta",""],[1831,"Electric dynamo — Michael Faraday",""],[1837,"Analytical Engine — Charles Babbage",""],[1844,"Electric telegraph and its code — Samuel Morse",""],[1876,"Telephone — Alexander Graham Bell",""],[1877,"Phonograph — Thomas Edison",""],[1887,"Gramophone — Emile Berliner",""],[1888,"AC induction motor — Nikola Tesla",""],[1895,"Radio — Guglielmo Marconi",""],[1895,"Cinematograph — Lumiere brothers",""],[1926,"Television — John Logie Baird",""],[1935,"Radar — Robert Watson-Watt",""],[1947,"Transistor — Bardeen, Brattain and Shockley",""],[1958,"Integrated circuit — Jack Kilby",""],[1960,"Laser — Theodore Maiman",""],[1964,"Computer mouse — Douglas Engelbart",""],[1971,"Network email with the @ sign — Ray Tomlinson",""],[1972,"C programming language — Dennis Ritchie",""],[1973,"Handheld mobile phone — Martin Cooper",""],[1974,"TCP/IP — the language of the Internet — Vint Cerf and Bob Kahn",""],[1989,"World Wide Web — Tim Berners-Lee",""],[1993,"Pentium processor — Vinod Dham",""],[1995,"Java programming language — James Gosling",""],[1996,"Hotmail — Sabeer Bhatia",""],[1998,"Google search engine — Larry Page and Sergey Brin",""]],"cap":"Morse's telegraph (1844), Bell's telephone (1876), Edison's bulb (1879), Marconi's radio (1895), Baird's television (1926)…"},{"k":"photos","title":"Who connected the world","items":[["Alexander_Graham_Bell","Alexander Graham Bell","Telephone"],["Samuel_Morse","Samuel Morse","Electric telegraph and its code"],["Guglielmo_Marconi","Guglielmo Marconi","Radio"],["John_Logie_Baird","John Logie Baird","Television"],["Thomas_Edison","Thomas Edison","Phonograph"],["Emile_Berliner","Emile Berliner","Gramophone"],["Auguste_and_Louis_Lumière","Lumiere brothers","Cinematograph"],["Alessandro_Volta","Alessandro Volta","Electric {"id":"I3","heat":3,"title":"Discoveries in physics, chemistry and space","hi":"भौतिकी, रसायन और अंतरिक्ष की खोजें","blocks":[{"k":"hot","h":"Top questions: who discovered the <b>electron (Thomson)<\/b>, <b>proton/nucleus (Rutherford)<\/b>, <b>neutron (Chadwick)<\/b>, <b>X-rays (Röntgen)<\/b>, <b>radioactivity (Becquerel)<\/b>, <b>radium (the Curies)<\/b>; who made the <b>periodic table (Mendeleev)<\/b>; who found <b>oxygen (Priestley)<\/b> and <b>hydrogen (Cavendish)<\/b>."},{"k":"story","h":"<p>In 1895 <b>Röntgen<\/b> saw a screen glow across his lab — <b>X-rays<\/b>. A year later <b>Becquerel<\/b> found uranium giving off rays by itself (<b>radioactivity<\/b>), and the <b>Curies<\/b> found radium and polonium. Then the atom was opened up: <b>Thomson<\/b> found the electron (1897), <b>Rutherford<\/b> the nucleus (1911) and the proton, <b>Chadwick<\/b> the neutron (1932). <b>Planck<\/b> and <b>Einstein<\/b> rebuilt physics with quantum theory and relativity.<\/p><p>Chemistry had its own hunters. <b>Cavendish<\/b> found hydrogen, <b>Daniel Rutherford<\/b> nitrogen, <b>Priestley<\/b> oxygen. <b>Dalton<\/b> said all matter is atoms, and <b>Mendeleev<\/b> arranged the elements in a table in 1869. Looking up, <b>Copernicus<\/b> put the Sun at the centre, <b>Galileo<\/b> saw Jupiter's moons and <b>Hubble<\/b> found the universe is expanding.<\/p>","key":"Electron — Thomson; nucleus, proton — Rutherford; neutron — Chadwick; X-rays — Röntgen; radioactivity — Becquerel; periodic table — Mendeleev."},{"k":"table","title":"Physics and space","head":["Discovery","Discovered by","Note"],"rows":[["electron","J. J. Thomson","1897, from cathode rays; Nobel Prize 1906."],["neutron","James Chadwick","1932; Nobel Prize 1935."],["atomic nucleus","Ernest Rutherford","1911, by the gold-foil experiment. He also identified the proton (1917–19)."],["positron (the first antiparticle)","Carl Anderson","1932, in cosmic rays."],["X-rays","Wilhelm Röntgen","1895, Germany; the first Nobel Prize in Physics (1901)."],["radioactivity","Henri Becquerel","1896, from uranium salts."],["radium and polonium","Marie and Pierre Curie","1898. Marie Curie won Nobels in both Physics (1903) and Chemistry (1911)."],["quantum theory","Max Planck","1900 — energy comes in packets (quanta)."],["theory of relativity","Albert Einstein","Special relativity 1905, general relativity 1915."],["nuclear fission","Otto Hahn and Fritz Strassmann","1938, Germany — the basis of nuclear power and the atom bomb."],["Higgs boson (predicted)","Peter Higgs","Predicted in 1964; found at CERN in 2012; Nobel Prize 2013."],["heliocentric (Sun-centred) model","Nicolaus Copernicus","Published in 1543."],["moons of Jupiter","Galileo Galilei","1610, with his telescope."],["planet Uranus","William Herschel","1781 — the first planet found with a telescope."],["expanding universe","Edwin Hubble","1929 — galaxies are moving away from us."]]},{"k":"tlfig","title":"Discoveries in physics and space","rows":[[1543,"Heliocentric (Sun-centred) model — Nicolaus Copernicus",""],[1610,"Moons of Jupiter — Galileo Galilei",""],[1781,"Planet Uranus — William Herschel",""],[1895,"X-rays — Wilhelm Röntgen",""],[1896,"Radioactivity — Henri Becquerel",""],[1897,"Electron — J. J. Thomson",""],[1898,"Radium and polonium — Marie and Pierre Curie",""],[1900,"Quantum theory — Max Planck",""],[1905,"Theory of relativity — Albert Einstein",""],[1911,"Atomic nucleus — Ernest Rutherford",""],[1929,"Expanding universe — Edwin Hubble",""],[1932,"Neutron — James Chadwick",""],[1932,"Positron — Carl Anderson",""],[1938,"Nuclear fission — Otto Hahn and Fritz Strassmann",""],[1964,"Higgs boson — Peter Higgs",""]]},{"k":"table","title":"Chemistry and the elements","head":["Discovery","Discovered by","Note"],"rows":[["hydrogen","Henry Cavendish","1766 — he called it 'inflammable air'."],["oxygen","Joseph Priestley","1774. Carl Scheele found it independently; Lavoisier named it."],["nitrogen","Daniel Rutherford","1772 — not Ernest Rutherford."],["chlorine","Carl Wilhelm Scheele","1774."],["atomic theory (modern)","John Dalton","1808 — matter is made of atoms."],["periodic table (by atomic mass)","Dmitri Mendeleev","1869; left gaps for elements not yet found."],["modern periodic law (by atomic number)","Henry Moseley","1913."],["ring structure of benzene","August Kekulé","1865."],["isotopes (the idea and the name)","Frederick Soddy","1913."],["law of conservation of mass","Antoine Lavoisier","1789 — the 'Father of Modern Chemistry'."]]},{"k":"tlfig","title":"Discoveries in chemistry","rows":[[1766,"Hydrogen — Henry Cavendish",""],[1772,"Nitrogen — Daniel Rutherford",""],[1774,"Oxygen — Joseph Priestley",""],[1774,"Chlorine — Carl Wilhelm Scheele",""],[1789,"Law of conservation of mass — Antoine Lavoisier",""],[1808,"Atomic theory — John Dalton",""],[1865,"Ring structure of benzene — August Kekulé",""],[1869,"Periodic table — Dmitri Mendeleev",""],[1913,"Modern periodic law — Henry Moseley",""],[1913,"Isotopes — Frederick Soddy",""]]},{"k":"trick","h":"Particles in order of discovery — <b>“E-P-N: Every Physicist Nods”<\/b>: <b>E<\/b>lectron (Thomson 1897) → <b>P<\/b>roton (Rutherford) → <b>N<\/b>eutron (Chadwick 1932). And <b>“Chadwick = Chargeless”<\/b>."},{"k":"trap","h":"<b>Nitrogen<\/b> was found by <b>Daniel<\/b> Rutherford; the nucleus by <b>Ernest<\/b> Rutherford. <b>Mendeleev<\/b> arranged by atomic <i>mass<\/i>; <b>Moseley<\/b>'s modern law uses atomic <i>number<\/i>. <b>Becquerel<\/b> found radioactivity; the <b>Curies<\/b> found radium."}],"sum":["J. J. Thomson — electron (1897); Rutherford — nucleus (1911) and proton; Chadwick — neutron (1932).","Röntgen — X-rays (1895); Becquerel — radioactivity (1896); the Curies — radium and polonium (1898).","Planck — quantum theory (1900); Einstein — relativity (1905, 1915).","Cavendish — hydrogen; Priestley — oxygen; Daniel Rutherford — nitrogen; Dalton — atomic theory.","Mendeleev — periodic table (1869); Moseley — modern periodic law by atomic number."],"part":["Part 2 · Discoveries and laws","खोजें और नियम"],"g":"iv"},
{"id":"I4","heat":3,"title":"Discoveries in biology: cells, blood and genes","hi":"जीव विज्ञान की खोजें: कोशिका, रक्त और जीन","blocks":[{"k":"hot","h":"Asked again and again: <b>cell (Robert Hooke, 1665)<\/b>, <b>nucleus (Robert Brown)<\/b>, <b>blood groups (Landsteiner)<\/b>, <b>blood circulation (Harvey)<\/b>, <b>DNA double helix (Watson and Crick)<\/b>, <b>laws of inheritance (Mendel)<\/b> and <b>evolution (Darwin)<\/b>."},{"k":"story","h":"<p>In 1665 <b>Robert Hooke<\/b> looked at a thin slice of cork and saw tiny boxes — he called them <b>cells<\/b>. <b>Leeuwenhoek<\/b> saw living bacteria in a drop of water, <b>Robert Brown<\/b> found the nucleus, and <b>Schleiden and Schwann<\/b> said every living thing is made of cells. Earlier, <b>William Harvey<\/b> had shown that the heart pumps blood round the body. In 1900–01 <b>Karl Landsteiner<\/b> found the A, B and O blood groups, which made safe transfusions possible.<\/p><p>How do children resemble parents? <b>Gregor Mendel<\/b>, a monk, found the answer with pea plants (1866). <b>Darwin<\/b> explained how species change by natural selection (1859). In 1953 <b>Watson and Crick<\/b>, using <b>Rosalind Franklin<\/b>'s X-ray photographs, showed DNA is a <b>double helix<\/b>.<\/p>","key":"Cell — Hooke; nucleus — Brown; circulation — Harvey; blood groups — Landsteiner; heredity — Mendel; evolution — Darwin; DNA helix — Watson and Crick."},{"k":"table","title":"Discoveries in biology","head":["Discovery","Discovered by","Note"],"rows":[["cell (in cork)","Robert Hooke","1665, in his book Micrographia."],["cell nucleus","Robert Brown","1831, in orchid cells."],["cell theory","Schleiden and Schwann","1838–39: all living things are made of cells."],["bacteria and protozoa (first seen)","Antonie van Leeuwenhoek","1670s, with his own microscopes."],["circulation of blood","William Harvey","1628, England."],["ABO blood groups","Karl Landsteiner","1900–01; Nobel Prize 1930."],["Rh factor in blood","Landsteiner and Wiener","1940, from studies on rhesus monkeys."],["AB blood group","Decastello and Sturli","1902."],["DNA double helix","Watson and Crick","1953, using Rosalind Franklin's X-ray photographs; Nobel Prize 1962."],["DNA (first isolated, as 'nuclein')","Friedrich Miescher","1869."],["laws of inheritance","Gregor Mendel","1866, with pea plants — the 'Father of Genetics'."],["evolution by natural selection","Charles Darwin","On the Origin of Species, 1859."],["inheritance of acquired characters","Jean-Baptiste Lamarck","1809 — 'use and disuse' (the giraffe's neck)."],["mutation theory","Hugo de Vries","1901, with evening primrose."],["binomial nomenclature (two-part names)","Carl Linnaeus","1753 — e.g. Homo sapiens."],["role of light in photosynthesis","Jan Ingenhousz","1779."],["Golgi apparatus","Camillo Golgi","1898."],["ribosome","George Palade","1955; Nobel Prize 1974."],["lysosome","Christian de Duve","1955."],["virus (tobacco mosaic)","Dmitri Ivanovsky","1892."],["the word 'gene'","Wilhelm Johannsen","1909."]]},{"k":"tlfig","title":"Discoveries in biology","rows":[[1628,"Circulation of blood — William Harvey",""],[1665,"Cell — Robert Hooke",""],[1753,"Binomial nomenclature — Carl Linnaeus",""],[1779,"Role of light in photosynthesis — Jan Ingenhousz",""],[1809,"Inheritance of acquired characters — Jean-Baptiste Lamarck",""],[1831,"Cell nucleus — Robert Brown",""],[1838,"Cell theory — Schleiden and Schwann",""],[1859,"Evolution by natural selection — Charles Darwin",""],[1866,"Laws of inheritance — Gregor Mendel",""],[1869,"DNA — Friedrich Miescher",""],[1892,"Virus — Dmitri Ivanovsky",""],[1898,"Golgi apparatus — Camillo Golgi",""],[1900,"ABO blood groups — Karl Landsteiner",""],[1901,"Mutation theory — Hugo de Vries",""],[1902,"AB blood group — Decastello and Sturli",""],[1909,"The word 'gene' — Wilhelm Johannsen",""],[1940,"Rh factor in blood — Landsteiner and Wiener",""],[1953,"DNA double helix — Watson and Crick",""],[1955,"Ribosome — George Palade",""],[1955,"Lysosome — Christian de Duve",""]],"cap":"From Hooke's cork cells (1665) to the double helix (1953) and Dolly the sheep (1996)."},{"k":"photos","title":"Discoverers in pictures","items":[["Robert_Hooke","Robert Hooke","Cells, 1665"],["Antonie_van_Leeuwenhoek","Antonie van Leeuwenhoek","Living cells, bacteria"],["Robert_Brown","Robert Brown","Nucleus, 1831"],["Gregor_Mendel","Gregor Mendel","Laws of heredity"],["Karl_Landsteiner","Karl Landsteiner","Blood groups"],["Rosalind_Franklin","Rosalind Franklin","DNA X-ray photo"]]},{"k":"facts","title":"Blood groups in brief","rows":[["Universal donor","O negative (O)"],["Universal recipient","AB positive (AB)"],["Rh factor named after","The rhesus monkey"],["Groups found by Landsteiner","A, B and O (1900–01); AB by Decastello and Sturli (1902)"],["World Blood Donor Day","14 June — Landsteiner's birthday"]]},{"k":"trick","h":"<b>“Hooke Hooked the Cell, Brown Browsed the Nucleus”<\/b>. <b>“Land-steiner gave blood its Land (groups)”<\/b>. <b>“Watson-Crick: Twisted Twins”<\/b> for the double helix."},{"k":"trap","h":"Hooke saw <b>dead<\/b> cork cells; <b>Leeuwenhoek<\/b> first saw <b>living<\/b> cells and bacteria. <b>Darwin<\/b> = natural selection; <b>Lamarck<\/b> = use and disuse. The <b>Rh<\/b> factor was found by Landsteiner <i>with Wiener<\/i> in 1940."}],"sum":["Robert Hooke — cell (1665); Robert Brown — nucleus (1831); Schleiden and Schwann — cell theory.","Leeuwenhoek — first to see bacteria; Harvey — circulation of blood (1628).","Landsteiner — ABO blood groups (1900–01) and Rh factor with Wiener (1940).","Mendel — laws of inheritance (1866); Darwin — natural selection (1859); Lamarck — use and disuse.","Watson and Crick — DNA double helix (1953); Linnaeus — binomial nomenclature."],"part":["Part 2 · Discoveries and laws","खोजें और नियम"],"g":"iv"},
{"id":"I5","heat":3,"title":"Medicine: vaccines, antibiotics and vitamins","hi":"चिकित्सा: टीके, एंटीबायोटिक और विटामिन","blocks":[{"k":"hot","h":"Favourites: <b>smallpox vaccine (Jenner)<\/b>, <b>rabies vaccine (Pasteur)<\/b>, <b>polio vaccines (Salk, Sabin)<\/b>, <b>penicillin (Fleming, 1928)<\/b>, <b>insulin (Banting and Best)<\/b>, <b>TB bacterium (Koch)<\/b>, <b>malaria in mosquitoes (Ronald Ross)<\/b> — and <b>which vitamin's lack causes which disease<\/b>."},{"k":"story","h":"<p>In 1796 <b>Edward Jenner<\/b> noticed milkmaids who caught cowpox never got smallpox — the first <b>vaccine<\/b>. <b>Louis Pasteur<\/b> proved germs cause disease and made the rabies vaccine (1885); <b>Robert Koch<\/b> found the germs of TB and cholera. In Secunderabad, <b>Ronald Ross<\/b> showed mosquitoes carry malaria (1897). In 1928 <b>Alexander Fleming<\/b> saw mould killing bacteria on a dish — <b>penicillin<\/b>, the first antibiotic. <b>Banting and Best<\/b> found insulin (1921), saving diabetics.<\/p><p><b>Casimir Funk<\/b> gave the name 'vitamine' (1912) to food factors whose lack causes disease: scurvy (C), rickets (D), night blindness (A), beriberi (B1). Medicine's firsts followed — a heart transplant (1967), a test-tube baby (1978), a cloned sheep (1996).<\/p>","key":"Jenner — smallpox vaccine; Pasteur — rabies; Salk/Sabin — polio; Fleming — penicillin; Banting and Best — insulin; Koch — TB; Ross — malaria."},{"k":"table","title":"Vaccines, medicines and germs","head":["Discovery","Discovered by","Note"],"rows":[["smallpox vaccine","Edward Jenner","1796, using cowpox — the first vaccine."],["rabies vaccine","Louis Pasteur","1885. Pasteur also gave pasteurisation and the germ theory."],["injected (killed) polio vaccine","Jonas Salk","Released in 1955."],["oral polio vaccine","Albert Sabin","1960s — the drops used in India's Pulse Polio drive."],["BCG vaccine against tuberculosis","Calmette and Guérin","1921, France."],["penicillin","Alexander Fleming","1928 — the first antibiotic."],["streptomycin (first drug for TB)","Selman Waksman","1943."],["insulin","Banting and Best","1921, Toronto — for diabetes."],["tuberculosis bacterium","Robert Koch","1882 (also the cholera bacterium, 1883)."],["malaria parasite in mosquitoes","Ronald Ross","1897, in Secunderabad; Nobel Prize 1902."],["malaria parasite in human blood","Alphonse Laveran","1880, Algeria."],["leprosy bacterium","Gerhard Hansen","1873 — leprosy is also called Hansen's disease."],["antiseptic surgery (carbolic acid)","Joseph Lister","1867."],["chloroform as an anaesthetic","James Young Simpson","1847."],["the word 'vitamine'","Casimir Funk","1912."],["aspirin (pure, stable form)","Felix Hoffmann","1897, at Bayer."],["homeopathy","Samuel Hahnemann","1796, Germany."],["CT scan","Godfrey Hounsfield","1971; Nobel Prize 1979."]]},{"k":"tlfig","title":"Medicine in time","rows":[[1796,"Smallpox vaccine — Edward Jenner",""],[1796,"Homeopathy — Samuel Hahnemann",""],[1847,"Chloroform as an anaesthetic — James Young Simpson",""],[1867,"Antiseptic surgery — Joseph Lister",""],[1873,"Leprosy bacterium — Gerhard Hansen",""],[1880,"Malaria parasite in human blood — Alphonse Laveran",""],[1882,"Tuberculosis bacterium — Robert Koch",""],[1885,"Rabies vaccine — Louis Pasteur",""],[1897,"Malaria parasite in mosquitoes — Ronald Ross",""],[1897,"Aspirin — Felix Hoffmann",""],[1912,"The word 'vitamine' — Casimir Funk",""],[1921,"BCG vaccine against tuberculosis — Calmette and Guérin",""],[1921,"Insulin — Banting and Best",""],[1928,"Penicillin — Alexander Fleming",""],[1943,"Streptomycin — Selman Waksman",""],[1955,"Injected (killed) polio vaccine — Jonas Salk",""],[1971,"CT scan — Godfrey Hounsfield",""]],"cap":"Jenner's smallpox vaccine (1796), Pasteur's rabies vaccine (1885), Fleming's penicillin (1928), Salk's polio vaccine (1955)."},{"k":"photos","title":"Medicine's pioneers","items":[["Edward_Jenner","Edward Jenner","Smallpox vaccine"],["Louis_Pasteur","Louis Pasteur","Rabies vaccine, pasteurisation"],["Alexander_Fleming","Alexander Fleming","Penicillin"],["Jonas_Salk","Jonas Salk","Polio vaccine (injected)"],["Robert_Koch","Robert Koch","TB and cholera germs"],["Ronald_Ross","Ronald Ross","Malaria and the mosquito"]]},{"k":"table","title":"Vitamins and deficiency diseases","head":["Vitamin","Lack causes","Note"],"rows":[["Vitamin A","Night blindness","Retinol; found in carrots, milk, fish oil."],["Vitamin B1 (thiamine)","Beriberi",""],["Vitamin B3 (niacin)","Pellagra",""],["Vitamin B12 (cobalamin)","Pernicious anaemia","Contains cobalt."],["Vitamin C (ascorbic acid)","Scurvy","Bleeding gums; citrus fruits and amla prevent it."],["Vitamin D (calciferol)","Rickets","Made in the skin by sunlight."],["Vitamin K","Blood does not clot properly","Needed for blood clotting."]]},{"k":"table","title":"Medical firsts","head":["First","Year","Note"],"rows":[["first human heart transplant (Christiaan Barnard, Cape Town)","1967",""],["first test-tube baby, Louise Brown (UK)","1978","India's first, Durga (Kanupriya Agarwal), was born in Kolkata the same year (Dr Subhash Mukhopadhyay)."],["WHO declares smallpox eradicated","1980",""],["India's first heart transplant (AIIMS, Dr P. Venugopal)","1994",""],["Dolly the sheep, first cloned mammal, born","1996","Roslin Institute, Scotland."],["Human Genome Project completed","2003",""],["India certified polio-free by WHO","2014","On 27 March 2014."]]},{"k":"trick","h":"<b>“Jenner's Cow, Pasteur's Dog”<\/b> — smallpox vaccine from cowpox, rabies vaccine (dog bite). Vitamins: <b>A<\/b> for <b>A<\/b>ankh (eyes), <b>C<\/b> for <b>C<\/b>itrus/scurvy, <b>D<\/b> for <b>D<\/b>aylight/rickets, <b>K<\/b> for <b>K<\/b>lotting."},{"k":"trap","h":"<b>Salk<\/b> = injected polio vaccine; <b>Sabin<\/b> = oral drops. <b>Ross<\/b> found malaria in <b>mosquitoes<\/b>; <b>Laveran<\/b> found the parasite in <b>human blood<\/b>. Fleming found penicillin; <b>Waksman<\/b> found streptomycin."}],"sum":["Jenner — smallpox vaccine (1796); Pasteur — rabies vaccine (1885); Salk and Sabin — polio vaccines.","Fleming — penicillin (1928); Waksman — streptomycin; Banting and Best — insulin (1921).","Koch — TB bacterium; Ross — malaria in mosquitoes (1897); Hansen — leprosy bacterium.","Lack of vitamin A — night blindness; B1 — beriberi; C — scurvy; D — rickets; K — poor clotting.","Heart transplant 1967; test-tube baby 1978; Dolly 1996; India polio-free 2014."],"part":["Part 2 · Discoveries and laws","खोजें और नियम"],"g":"iv"},
{"id":"I6","heat":3,"title":"Laws and principles, and who gave them","hi":"नियम और सिद्धांत तथा उनके प्रतिपादक","blocks":[{"k":"hot","h":"SSC often describes a law and asks who gave it: <b>Newton<\/b> (motion, gravitation), <b>Archimedes<\/b> (buoyancy), <b>Pascal<\/b> (fluid pressure), <b>Boyle<\/b> and <b>Charles<\/b> (gases), <b>Ohm<\/b> (current), <b>Faraday<\/b> (induction), <b>Bernoulli<\/b> (flow), <b>Heisenberg<\/b> (uncertainty)."},{"k":"story","h":"<p>Many laws came from one sharp idea. <b>Archimedes<\/b> saw the water rise in his bath and shouted 'Eureka!' — buoyancy. <b>Galileo<\/b> said all bodies fall alike; <b>Kepler<\/b> showed planets move in ellipses; <b>Newton<\/b> joined it all with three laws of motion and gravity (1687). <b>Pascal<\/b> explained hydraulic lifts, <b>Boyle<\/b> and <b>Charles<\/b> the behaviour of gases, and <b>Bernoulli<\/b> why a fast flow means low pressure.<\/p><p>Electricity got its rules from <b>Coulomb<\/b> (force between charges), <b>Ohm<\/b> (V = IR), <b>Faraday<\/b> (induction) and <b>Lenz<\/b>. In the 20th century, <b>Einstein<\/b> gave E = mc², <b>Heisenberg<\/b> the uncertainty principle and <b>Pauli<\/b> the exclusion principle.<\/p>","key":"Newton — motion; Kepler — planets; Archimedes — buoyancy; Pascal — fluid pressure; Boyle — P×V; Charles — V∝T; Ohm — V=IR; Faraday — induction."},{"k":"table","title":"Laws and principles","head":["Law / principle","Given by","Note"],"rows":[["Three laws of motion and universal gravitation","Isaac Newton","Principia, 1687."],["Planets move in ellipses with the Sun at one focus","Johannes Kepler","Three laws, 1609–1619."],["A body in a fluid loses weight equal to the fluid it displaces (buoyancy)","Archimedes","The 'Eureka' story."],["Pressure on an enclosed fluid is passed equally in all directions","Blaise Pascal","Basis of the hydraulic press and brakes."],["At constant temperature, a gas's pressure × volume is constant","Robert Boyle","1662."],["At constant pressure, a gas's volume is proportional to its temperature","Jacques Charles","1787."],["Equal volumes of gases at the same conditions hold equal numbers of molecules","Amedeo Avogadro","1811."],["Current is proportional to voltage (V = IR)","Georg Ohm","1827."],["Stress is proportional to strain, within the elastic limit","Robert Hooke","1678."],["A changing magnetic field produces a current (electromagnetic induction)","Michael Faraday","1831."],["The induced current opposes the change that causes it","Heinrich Lenz","1834."],["Force between two charges ∝ product of charges ÷ distance²","Charles-Augustin de Coulomb","1785."],["Where a fluid flows faster its pressure is lower","Daniel Bernoulli","1738 — explains the lift on aircraft wings."],["The pitch of a sound changes when the source moves (apparent frequency)","Christian Doppler","1842 — the Doppler effect."],["Position and momentum cannot both be known exactly (uncertainty principle)","Werner Heisenberg","1927."],["No two electrons in an atom have the same four quantum numbers","Wolfgang Pauli","1925 — the exclusion principle."],["Mass and energy are equivalent (E = mc²)","Albert Einstein","1905."],["Total pressure of a gas mixture = sum of partial pressures","John Dalton","1801."],["Rate of diffusion of a gas ∝ 1 ÷ √density","Thomas Graham","1848."],["Heat produced by a current H = I²Rt","James Prescott Joule","1841."],["A system in equilibrium shifts to undo a change put on it","Henry Le Chatelier","1884."],["Light is a wave; every point on a wavefront is a new source","Christiaan Huygens","1678."],["Light is an electromagnetic wave","James Clerk Maxwell","1865."],["All bodies fall with the same acceleration (ignoring air)","Galileo Galilei","Late 1500s."]]},{"k":"trick","h":"Gas laws — <b>“Boyle Presses, Charles Heats”<\/b>: Boyle keeps <b>temperature<\/b> fixed (P × V constant); Charles keeps <b>pressure<\/b> fixed (V ∝ T). <b>“Lenz Resists”<\/b> — the induced current opposes its cause."},{"k":"trap","h":"<b>Pascal<\/b> = pressure in enclosed fluids (hydraulic press); <b>Bernoulli<\/b> = flowing fluids (aircraft lift); <b>Archimedes<\/b> = floating. <b>Faraday<\/b> discovered induction; <b>Lenz<\/b> gave its direction."}],"sum":["Newton — laws of motion and gravitation (1687); Kepler — laws of planetary motion.","Archimedes — buoyancy; Pascal — pressure in enclosed fluids; Bernoulli — pressure in flowing fluids.","Boyle — P × V constant; Charles — V ∝ T; Avogadro — equal volumes, equal molecules.","Ohm — V = IR; Coulomb — force between charges; Faraday — electromagnetic induction; Lenz — its direction.","Einstein — E = mc²; Heisenberg — uncertainty principle; Pauli — exclusion principle; Doppler — apparent frequency."],"part":["Part 2 · Discoveries and laws","खोजें और नियम"],"g":"iv"},
{"id":"I7","heat":3,"title":"Units named after scientists","hi":"वैज्ञानिकों के नाम पर मात्रक","blocks":[{"k":"hot","h":"Two questions come every year: <b>“X is the SI unit of what?”<\/b> and <b>“What is the SI unit of Y?”<\/b>. Watch the electrical and magnetic ones — <b>tesla, weber, henry, farad, siemens<\/b> — and the radiation ones — <b>becquerel, gray, sievert<\/b>."},{"k":"story","h":"<p>Science honours its heroes by naming units after them. <b>Newton<\/b> gives force, <b>Joule<\/b> energy, <b>Watt<\/b> power and <b>Pascal<\/b> pressure. Electricity is a hall of fame: <b>Ampère<\/b> (current), <b>Volta<\/b> (voltage), <b>Ohm<\/b> (resistance), <b>Coulomb<\/b> (charge), <b>Faraday<\/b> (the farad, capacitance), <b>Henry<\/b> (inductance) and <b>Siemens<\/b> (conductance).<\/p><p>Magnetism has <b>Tesla<\/b> and <b>Weber<\/b>; waves have <b>Hertz<\/b>; temperature has <b>Kelvin<\/b>. Radiation has three: <b>Becquerel<\/b> (how radioactive a source is), <b>Gray<\/b> (dose absorbed) and <b>Sievert<\/b> (effect on the body). Note: unit names are written in small letters (newton), symbols in capitals (N).<\/p>","key":"newton — force; joule — energy; watt — power; pascal — pressure; ampere — current; volt — p.d.; ohm — resistance; tesla — flux density; weber — flux."},{"k":"table","title":"SI units named after scientists","head":["Unit","Measures","Named after"],"rows":[["newton","Force","Isaac Newton. 1 N = 1 kg·m/s²."],["joule","Work or energy","James Prescott Joule."],["watt","Power","James Watt. 1 W = 1 joule per second."],["pascal","Pressure","Blaise Pascal. 1 Pa = 1 N/m²."],["ampere","Electric current","André-Marie Ampère — one of the seven SI base units."],["volt","Potential difference","Alessandro Volta."],["ohm","Electrical resistance","Georg Ohm; symbol Ω."],["coulomb","Electric charge","Charles-Augustin de Coulomb."],["hertz","Frequency","Heinrich Hertz; 1 Hz = one cycle per second."],["kelvin","Thermodynamic temperature","Lord Kelvin — an SI base unit; 0 K is absolute zero (−273.15 °C)."],["tesla","Magnetic flux density","Nikola Tesla."],["weber","Magnetic flux","Wilhelm Weber."],["henry","Inductance","Joseph Henry."],["farad","Capacitance","Michael Faraday."],["siemens","Electrical conductance","Werner von Siemens — the old name was 'mho'."],["becquerel","Radioactivity (activity)","Henri Becquerel."],["gray","Absorbed dose of radiation","Louis Harold Gray."],["sievert","Equivalent dose of radiation","Rolf Sievert."]]},{"k":"cards","title":"Units and their namesakes","rows":[["newton","Force","Isaac Newton","📏"],["joule","Work or energy","James Prescott Joule","📏"],["watt","Power","James Watt","📏"],["pascal","Pressure","Blaise Pascal","📏"],["ampere","Electric current","André-Marie Ampère — one of the seven SI base units","📏"],["volt","Potential difference","Alessandro Volta","📏"],["ohm","Electrical resistance","Georg Ohm; symbol Ω","📏"],["coulomb","Electric charge","Charles-Augustin de Coulomb","📏"],["hertz","Frequency","Heinrich Hertz; 1 Hz = one cycle per second","📏"],["kelvin","Thermodynamic temperature","Lord Kelvin — an SI base unit; 0 K is absolute zero (−273.15 °C)","📏"],["tesla","Magnetic flux density","Nikola Tesla","📏"],["weber","Magnetic flux","Wilhelm Weber","📏"],["henry","Inductance","Joseph Henry","📏"],["farad","Capacitance","Michael Faraday","📏"],["siemens","Electrical conductance","Werner von Siemens — the old name was 'mho'","📏"],["becquerel","Radioactivity (activity)","Henri Becquerel","📏"],["gray","Absorbed dose of radiation","Louis Harold Gray","📏"],["sievert","Equivalent dose of radiation","Rolf Sievert","📏"]]},{"k":"facts","title":"The seven SI base units","rows":[["Length","metre (m)"],["Mass","kilogram (kg)"],["Time","second (s)"],["Electric current","ampere (A)"],["Temperature","kelvin (K)"],["Amount of substance","mole (mol)"],["Luminous intensity","candela (cd)"]]},{"k":"trick","h":"Magnetism pair — <b>“Weber is the Whole flux, Tesla is per square metre”<\/b> (1 T = 1 Wb/m²). Radiation trio — <b>“B-G-S: Bomb, Gulp, Sick”<\/b>: Becquerel (the source), Gray (dose gulped), Sievert (how sick it makes you)."},{"k":"trap","h":"<b>Kelvin<\/b> and <b>ampere<\/b> are <i>base<\/i> units; most others here are derived. <b>Farad<\/b> (capacitance) is named after Faraday. The <b>ångström<\/b> (10⁻¹⁰ m) and <b>curie<\/b> are named after scientists but are not SI units."}],"sum":["newton — force; joule — energy; watt — power; pascal — pressure.","ampere — current; volt — potential difference; ohm — resistance; coulomb — charge.","hertz — frequency; kelvin — temperature; tesla — magnetic flux density; weber — magnetic flux.","henry — inductance; farad — capacitance; siemens — conductance.","becquerel — radioactivity; gray — absorbed dose; sievert — equivalent dose."],"part":["Part 3 · Units, instruments and scientists","मात्रक, उपकरण और वैज्ञानिक"],"g":"iv"},
{"id":"I8","heat":3,"title":"Scientific instruments and what they measure","hi":"वैज्ञानिक उपकरण और उनका उपयोग","blocks":[{"k":"hot","h":"One of the commonest GK questions: <b>“A hygrometer measures …?”<\/b> Learn the pairs: <b>barometer–air pressure<\/b>, <b>hygrometer–humidity<\/b>, <b>seismograph–earthquakes<\/b>, <b>anemometer–wind speed<\/b>, <b>lactometer–milk<\/b>, <b>hydrometer–density of liquids<\/b>, <b>sphygmomanometer–blood pressure<\/b>, <b>fathometer–sea depth<\/b>."},{"k":"story","h":"<p>Think of a weather station: a <b>barometer<\/b> reads air pressure, a <b>hygrometer<\/b> humidity, an <b>anemometer<\/b> wind speed and a <b>rain gauge<\/b> rainfall. On a ship, a <b>fathometer<\/b> sends sound down to find the depth, and a <b>sextant<\/b> finds the Sun's angle. In a plane, the <b>altimeter<\/b> shows height; in a car, the <b>speedometer<\/b> shows speed and the <b>odometer<\/b> distance.<\/p><p>A doctor uses a <b>stethoscope<\/b>, a <b>sphygmomanometer<\/b> for blood pressure and an <b>audiometer<\/b> for hearing. A dairy checks milk with a <b>lactometer<\/b>; a steel plant reads furnace heat with a <b>pyrometer<\/b>; a seismic station records quakes on a <b>seismograph<\/b>. In a lab, the <b>ammeter<\/b> reads current and the <b>voltmeter<\/b> voltage.<\/p>","key":"Baro — pressure; hygro — humidity; seismo — quakes; anemo — wind; lacto — milk; hydro — liquid density; pyro — high heat; sphygmo — blood pressure."},{"k":"table","title":"Instruments and what they measure","head":["Instrument","Measures","Note"],"rows":[["Barometer","Atmospheric pressure","A sudden fall warns of a storm."],["Hygrometer","Relative humidity",""],["Seismograph","Earthquake waves","Its record is a seismogram."],["Anemometer","Wind speed",""],["Ammeter","Electric current","Connected in series."],["Voltmeter","Potential difference","Connected in parallel."],["Galvanometer","Presence and direction of a small current",""],["Lactometer","Purity (density) of milk",""],["Hydrometer","Relative density of liquids",""],["Odometer","Distance travelled by a vehicle",""],["Speedometer","Speed of a vehicle",""],["Altimeter","Height above sea level","Used in aircraft."],["Manometer","Pressure of gases",""],["Pyrometer","Very high temperatures","For furnaces — even from a distance."],["Sphygmomanometer","Blood pressure",""],["Tachometer","Rotational speed (rpm) of an engine",""],["Audiometer","Sharpness of hearing",""],["Fathometer (echo sounder)","Depth of the sea","Uses sound echoes (sonar)."],["Rain gauge (udometer)","Rainfall",""],["Calorimeter","Quantity of heat",""],["Geiger counter","Radioactive radiation",""],["Sextant","Angle of the Sun or a star above the horizon","Used in navigation."],["Crescograph","Growth of plants","Invented by J. C. Bose."]]},{"k":"photos","title":"Instruments in pictures","items":[["Barometer","Barometer","Atmospheric pressure"],["Hygrometer","Hygrometer","Relative humidity"],["Seismograph","Seismograph","Earthquake waves"],["Anemometer","Anemometer","Wind speed"],["Galvanometer","Galvanometer","Presence and direction of a small current"],["Lactometer","Lactometer","Purity (density) of milk"],["Hydrometer","Hydrometer","Relative density of liquids"],["Odometer","Odometer","Distance travelled by a vehicle"],["Altimeter","Altimeter","Height above sea level"],["Sphygmomanometer","Sphygmomanometer","Blood pressure"]]},{"k":"table","title":"Who invented the instrument","head":["Instrument","Inventor","Note"],"rows":[["mercury barometer","Evangelista Torricelli","1643, Italy."],["mercury thermometer","Daniel Gabriel Fahrenheit","1714; he also made the Fahrenheit scale."],["stethoscope","René Laennec","1816, France."],["sphygmomanometer (cuff type)","Scipione Riva-Rocci","1896, Italy."],["electrocardiograph (ECG)","Willem Einthoven","1903; Nobel Prize 1924."],["electron microscope","Ernst Ruska and Max Knoll","1931, Germany."],["Geiger counter","Hans Geiger","1908; improved with Walther Müller in 1928."],["cyclotron","Ernest Lawrence","1932, USA."],["modern seismograph","John Milne","1880, in Japan."],["Richter scale","Charles Richter","1935 — a scale, not an instrument."],["crescograph","Jagadish Chandra Bose","Early 1900s — measures tiny plant growth."],["pendulum clock","Christiaan Huygens","1656."],["astronomical telescope (first used on the sky)","Galileo Galilei","1609. Hans Lippershey had made a spyglass in 1608."]]},{"k":"trick","h":"Greek roots do the work: <b>baro<\/b> = weight/pressure, <b>hygro<\/b> = wet, <b>anemo<\/b> = wind, <b>seismo<\/b> = shake, <b>pyro<\/b> = fire, <b>lacto<\/b> = milk, <b>hydro<\/b> = water, <b>alti<\/b> = height, <b>sphygmo<\/b> = pulse, <b>fatho<\/b>m = depth."},{"k":"trap","h":"<b>Hydrometer<\/b> = density of any liquid; <b>hygrometer<\/b> = humidity of air. <b>Ammeter<\/b> in series, <b>voltmeter<\/b> in parallel. The <b>Richter scale<\/b> is a scale, not an instrument — the instrument is the <b>seismograph<\/b>. <b>Odometer<\/b> = distance, <b>speedometer<\/b> = speed."}],"sum":["Barometer — air pressure (Torricelli); hygrometer — humidity; anemometer — wind speed; rain gauge — rainfall.","Seismograph — earthquakes; fathometer — sea depth; altimeter — height; sextant — angle of the Sun.","Lactometer — milk; hydrometer — density of liquids; pyrometer — very high temperatures.","Sphygmomanometer — blood pressure; stethoscope — Laennec; ECG — Einthoven; audiometer — hearing.","Ammeter — current (series); voltmeter — potential difference (parallel); galvanometer — small currents."],"part":["Part 3 · Units, instruments and scientists","मात्रक, उपकरण और वैज्ञानिक"],"g":"iv"},
{"id":"I9","heat":3,"title":"Modern Indian scientists","hi":"आधुनिक भारतीय वैज्ञानिक","blocks":[{"k":"hot","h":"Asked in nearly every exam season: <b>Raman effect (1928, Nobel 1930)<\/b>, <b>J. C. Bose and the crescograph<\/b>, <b>S. N. Bose and bosons<\/b>, <b>Ramanujan and 1729<\/b>, <b>Bhabha (nuclear)<\/b>, <b>Sarabhai (space)<\/b>, <b>Kalam (missiles)<\/b>, <b>Khorana (genetic code)<\/b>, <b>Chandrasekhar limit<\/b>. Also the days named after them."},{"k":"story","h":"<p>In Kolkata in 1928, <b>C. V. Raman<\/b> showed that light changes colour slightly when scattered by molecules — the <b>Raman effect<\/b>, India's first science Nobel (1930). In the same city <b>J. C. Bose<\/b> proved plants respond to stimuli with his <b>crescograph<\/b>, and <b>S. N. Bose<\/b> wrote the statistics that gave the world the word '<b>boson<\/b>'. <b>Ramanujan<\/b>, with almost no formal training, filled notebooks with formulas that still amaze mathematicians. <b>Meghnad Saha<\/b> explained the light of stars.<\/p><p>After 1947, <b>Homi Bhabha<\/b> built India's atomic programme and <b>Vikram Sarabhai<\/b> its space programme; <b>Kalam<\/b> turned rockets into the SLV-3 and Agni. Abroad, <b>Khorana<\/b> cracked the genetic code, <b>Chandrasekhar<\/b> found the mass limit of white dwarfs, and <b>Venki Ramakrishnan<\/b> mapped the ribosome.<\/p>","key":"Raman — scattering of light (1928); J. C. Bose — plants and crescograph; S. N. Bose — bosons; Bhabha — nuclear; Sarabhai — space; Kalam — missiles."},{"k":"table","title":"Indian scientists and their work","head":["Scientist","Known for","Note"],"rows":[["C. V. Raman","Scattering of light (Raman effect)","Found on 28 February 1928 (National Science Day); Nobel Prize in Physics 1930."],["Jagadish Chandra Bose","Crescograph and response of plants to stimuli","Also a radio and microwave pioneer."],["Satyendra Nath Bose","Bose–Einstein statistics","Particles called bosons are named after him."],["Srinivasa Ramanujan","Number theory and infinite series","1729 is the Hardy–Ramanujan number; 22 December is National Mathematics Day."],["Homi J. Bhabha","India's nuclear programme","Founded TIFR (1945); first chairman of the Atomic Energy Commission (1948)."],["Vikram Sarabhai","India's space programme","Founded PRL (1947) and INCOSPAR (1962), which became ISRO in 1969."],["A. P. J. Abdul Kalam","SLV-3 rocket and the Agni and Prithvi missiles","'Missile Man of India'; 11th President (2002–07); Bharat Ratna 1997."],["Meghnad Saha","Thermal ionisation equation in astrophysics","The Saha equation (1920); founded the Saha Institute of Nuclear Physics."],["Har Gobind Khorana","Cracking the genetic code","Nobel Prize in Medicine 1968; made the first artificial gene."],["Subrahmanyan Chandrasekhar","Maximum mass of a white dwarf star","The Chandrasekhar limit, about 1.44 Suns; Nobel Prize in Physics 1983."],["Venkatraman Ramakrishnan","Structure of the ribosome","Nobel Prize in Chemistry 2009."],["Prafulla Chandra Ray","Mercurous nitrite and Bengal Chemicals","Found mercurous nitrite in 1896; founded Bengal Chemicals."],["P. C. Mahalanobis","Indian Statistical Institute and the Mahalanobis distance","His birthday, 29 June, is Statistics Day."],["M. S. Swaminathan","High-yielding wheat of the Green Revolution","Bharat Ratna 2024."],["Verghese Kurien","Operation Flood and Amul","His birthday, 26 November, is National Milk Day."],["Birbal Sahni","Palaeobotany (study of plant fossils)","Institute of Palaeosciences in Lucknow is named after him."],["Salim Ali","Ornithology (study of birds)","The 'Birdman of India'."],["M. Visvesvaraya","Krishna Raja Sagara dam","Engineer; his birthday, 15 September, is Engineers' Day; Bharat Ratna 1955."],["Shanti Swarup Bhatnagar","First Director-General of CSIR","India's top science prize is named after him."],["E. K. Janaki Ammal","Sugarcane hybrids and plant chromosomes","Co-wrote the Chromosome Atlas of Cultivated Plants (1945)."],["Anna Mani","Indian weather instruments","Called the 'Weather Woman of India'."],["Anandibai Joshi","First Indian woman with a degree in Western medicine","Graduated in 1886 in Pennsylvania, USA."]]},{"k":"photos","title":"Indian scientists in pictures","items":[["C._V._Raman","C. V. Raman","Scattering of light"],["Jagadish_Chandra_Bose","Jagadish Chandra Bose","Crescograph and response of plants to stimuli"],["Satyendra_Nath_Bose","Satyendra Nath Bose","Bose–Einstein statistics"],["Srinivasa_Ramanujan","Srinivasa Ramanujan","Number theory and infinite series"],["Homi_J._Bhabha","Homi J. Bhabha","India's nuclear programme"],["Vikram_Sarabhai","Vikram Sarabhai","India's space programme"],["A._P._J._Abdul_Kalam","A. P. J. Abdul Kalam","SLV-3 rocket and the Agni and Prithvi missiles"],["Meghnad_Saha","Meghnad Saha","Thermal ionisation equation in astrophysics"],["Har_Gobind_Khorana","Har Gobind Khorana","Cracking the genetic code"],["Subrahmanyan_Chandrasekhar","Subrahmanyan Chandrasekhar","Maximum mass of a white dwarf star"],["Venkatraman_Ramakrishnan","Venkatraman Ramakrishnan","Structure of the ribosome"],["Prafulla_Chandra_Ray","Prafulla Chandra Ray","Mercurous nitrite and Bengal Chemicals"],["P._C._Mahalanobis","P. C. Mahalanobis","Indian Statistical Institute and the Mahalanobis distance"],["M._S._Swaminathan","M. S. Swaminathan","High-yielding wheat of the Green Revolution"],["Verghese_Kurien","Verghese Kurien","Operation Flood and Amul"],["Birbal_Sahni","Birbal Sahni","Palaeobotany"]]},{"k":"facts","title":"Days and Nobels to remember","rows":[["National Science Day","28 February — Raman effect announced (1928)"],["National Technology Day","11 May — Pokhran-II tests (1998)"],["National Statistics Day","29 June — Mahalanobis's birthday"],["Engineers' Day","15 September — Visvesvaraya's birthday"],["National Mathematics Day","22 December — Ramanujan's birthday"],["Indian-origin science Nobels","Raman (Physics 1930), Khorana (Medicine 1968), Chandrasekhar (Physics 1983), Ramakrishnan (Chemistry 2009)"]]},{"k":"trick","h":"Two Boses: <b>J<\/b>. C. Bose — <b>J<\/b>ungle (plants); <b>S<\/b>. N. Bose — <b>S<\/b>tatistics (bosons). Two fathers: <b>Bh<\/b>abha — <b>B<\/b>omb/atom; <b>S<\/b>arabhai — <b>S<\/b>pace."},{"k":"trap","h":"Only <b>C. V. Raman<\/b> won his Nobel as an Indian citizen working in India; Khorana, Chandrasekhar and Ramakrishnan worked abroad. <b>Chandrasekhar<\/b> (white dwarfs) is not <b>Chandrashekhar Azad<\/b>. <b>Kalam<\/b> is the Missile Man, not the father of the space programme (Sarabhai)."}],"sum":["C. V. Raman — Raman effect, 28 February 1928; Nobel Prize in Physics 1930.","J. C. Bose — crescograph and plant response; S. N. Bose — Bose–Einstein statistics, bosons.","Ramanujan — number theory, 1729; Mahalanobis — ISI and statistics; Saha — ionisation equation.","Bhabha — nuclear programme; Sarabhai — space programme; Kalam — Missile Man (SLV-3, Agni).","Khorana — genetic code (1968); Chandrasekhar — white-dwarf limit (1983); Ramakrishnan — ribosome (2009)."],"part":["Part 3 · Units, instruments and scientists","मात्रक, उपकरण और वैज्ञानिक"],"g":"iv"},
{"id":"I10","heat":2,"title":"Ancient Indian science and 'father of' titles","hi":"प्राचीन भारतीय विज्ञान और 'जनक' उपाधियाँ","blocks":[{"k":"hot","h":"Two kinds of questions: <b>scholar → book<\/b> (Aryabhata – Aryabhatiya, Sushruta – Sushruta Samhita, Charaka – Charaka Samhita, Bhaskara – Lilavati) and <b>“Who is called the father of …?”<\/b> (medicine – Hippocrates, surgery – Sushruta, genetics – Mendel, computer – Babbage)."},{"k":"story","h":"<p>Long before modern labs, Indian scholars wrote science in Sanskrit verse. <b>Aryabhata<\/b> (born 476 CE) said in the <b>Aryabhatiya<\/b> that the Earth turns on its axis and gave π as 3.1416. <b>Brahmagupta<\/b> wrote rules for zero; <b>Bhaskaracharya<\/b>'s <b>Lilavati<\/b> taught arithmetic through puzzles. <b>Varahamihira<\/b> wrote on astronomy. In medicine, <b>Charaka<\/b> wrote the Charaka Samhita and <b>Sushruta<\/b> described over 300 operations, even nose repair, in the Sushruta Samhita. <b>Kanada<\/b> imagined the atom (paramanu).<\/p><p>Every field honours a founder with the title 'father'. Medicine has <b>Hippocrates<\/b>, biology <b>Aristotle<\/b>, genetics <b>Mendel<\/b>, chemistry <b>Lavoisier<\/b>, computers <b>Babbage<\/b>. India's own: <b>Bhabha<\/b> (nuclear), <b>Sarabhai<\/b> (space), <b>Swaminathan<\/b> (Green Revolution), <b>Kurien<\/b> (White Revolution).<\/p>","key":"Aryabhata — Aryabhatiya; Brahmagupta — zero; Bhaskara — Lilavati; Sushruta — surgery; Charaka — medicine; Kanada — atom."},{"k":"table","title":"Ancient Indian scholars and their works","head":["Scholar","Famous work","Note"],"rows":[["Aryabhata","Aryabhatiya","499 CE: the Earth turns on its axis; π ≈ 3.1416. India's first satellite (1975) is named after him."],["Brahmagupta","Brahmasphutasiddhanta","628 CE: first rules for working with zero."],["Bhaskaracharya (Bhaskara II)","Lilavati","1150 CE; part of his Siddhanta Shiromani."],["Varahamihira","Pancha Siddhantika","Also Brihat Samhita — one of the 'nine gems' at Ujjain."],["Sushruta","Sushruta Samhita","Surgery, including nose reconstruction (rhinoplasty)."],["Charaka","Charaka Samhita","The great text of Ayurvedic medicine."],["Kanada","Vaisheshika Sutra","The idea of 'paramanu' — the atom."],["Baudhayana","Baudhayana Sulba Sutra","States the rule we now call the Pythagoras theorem."],["Patanjali","Yoga Sutra",""],["Vagbhata","Ashtanga Hridaya","Ayurveda."],["Pingala","Chandahshastra","Prosody; uses a binary-like system."]]},{"k":"photos","title":"Ancient scholars in pictures","items":[["Aryabhata","Aryabhata","Aryabhatiya"],["Brahmagupta","Brahmagupta","Brahmasphutasiddhanta"],["Bhāskara_II","Bhaskaracharya","Lilavati"],["Varahamihira","Varahamihira","Pancha Siddhantika"],["Sushruta","Sushruta","Sushruta Samhita"],["Charaka","Charaka","Charaka Samhita"],["Kanada","Kanada","Vaisheshika Sutra"],["Baudhayana","Baudhayana","Baudhayana Sulba Sutra"],["Patanjali","Patanjali","Yoga Sutra"],["Vagbhata","Vagbhata","Ashtanga Hridaya"],["Pingala","Pingala","Chandahshastra"]]},{"k":"table","title":"'Father of …' and other titles","head":["Title","Person","Note"],"rows":[["Father of Medicine","Hippocrates","Ancient Greece."],["Father of Surgery","Sushruta",""],["Father of Biology","Aristotle","Also called the Father of Zoology."],["Father of Botany","Theophrastus",""],["Father of Genetics","Gregor Mendel",""],["Father of Taxonomy","Carl Linnaeus",""],["Father of Microbiology","Antonie van Leeuwenhoek",""],["Father of Modern Chemistry","Antoine Lavoisier",""],["Father of Nuclear Physics","Ernest Rutherford",""],["Father of the Computer","Charles Babbage",""],["Father of India's Nuclear Programme","Homi J. Bhabha",""],["Father of India's Space Programme","Vikram Sarabhai",""],["Father of the Green Revolution in India","M. S. Swaminathan","Norman Borlaug is the father of the world Green Revolution."],["Father of the White Revolution","Verghese Kurien",""],["Father of Indian Statistics","P. C. Mahalanobis",""],["Father of Modern Indian Chemistry","Prafulla

{"id":"R1","heat":3,"title":"India's rivers: the big picture","hi":"भारत की नदियाँ: एक नज़र में","blocks":[{"k":"hot","h":"Asked again and again: <b>where each river rises<\/b> (Gangotri, Yamunotri, Trimbakeshwar, Mahabaleshwar, Talakaveri, Amarkantak), the <b>longest rivers<\/b> (Ganga in India, Godavari in the peninsula, Narmada flowing west), and the difference between <b>Himalayan and peninsular<\/b> rivers."},{"k":"story","h":"<p>India's rivers come from two very different homes. The <b>Himalayan rivers<\/b> — the Indus, the Ganga and the Brahmaputra with their tributaries — are fed by snow and rain, so they flow all year. They are young: they cut deep gorges, carry huge loads of silt and keep changing course on the plains.<\/p><p>The <b>peninsular rivers<\/b> are far older and are fed only by the monsoon. Most rise in the <b>Western Ghats<\/b> and run <b>east<\/b> to the Bay of Bengal — the Mahanadi, Godavari, Krishna and Kaveri build big deltas. Two big ones, the <b>Narmada<\/b> and the <b>Tapi<\/b>, run <b>west<\/b> through rift valleys and end in estuaries. About three-quarters of India drains into the Bay of Bengal.<\/p>"},{"k":"rivermap","title":"India's rivers — tap one","chips":true,"info":{"Ganga":"Gangotri (as the Bhagirathi) → Bay of Bengal; the longest in India (about 2,525 km); National River.","Yamuna":"Yamunotri → Prayagraj; the Ganga's longest tributary; Delhi, Mathura, Agra.","Indus":"Near Mansarovar → Arabian Sea (Pakistan); flows past Leh; Indus Waters Treaty, 1960.","Jhelum":"Verinag → Srinagar, Wular Lake; Vedic Vitasta.","Chenab":"Chandra + Bhaga at Tandi; Vedic Asikni; Salal and Baglihar dams.","Ravi":"Near Rohtang; Vedic Parushni; Ranjit Sagar dam.","Beas":"Beas Kund → Harike (joins the Sutlej); Vedic Vipasha; Pong dam.","Sutlej":"Rakshastal (Tibet) → enters at Shipki La; Bhakra dam; Vedic Shutudri.","Brahmaputra":"Tsangpo in Tibet, Siang in Arunachal, Brahmaputra in Assam, Jamuna in Bangladesh; Majuli island.","Lohit":"Joins the Siang near Sadiya; Dhola–Sadiya bridge.","Subansiri":"The Brahmaputra's largest tributary.","Manas":"From Bhutan; Manas National Park.","Teesta":"From Sikkim; joins the Brahmaputra in Bangladesh.","Barak":"Manipur hills → Silchar → Meghna (Bangladesh).","Ghaghara":"Karnali in Nepal; Ayodhya on its Saryu stretch; joins near Chhapra.","Gandak":"Narayani in Nepal; joins at Hajipur.","Kosi":"Sapt Kosi from Nepal — the Sorrow of Bihar.","Son":"Amarkantak → joins the Ganga near Patna (right bank).","Gomti":"Lucknow and Jaunpur; joins near Ghazipur.","Ramganga":"From Kumaon; Corbett National Park; joins near Kannauj.","Chambal":"Janapav → Yamuna; ravines, gharials; Kota.","Betwa":"Vindhyas → Yamuna; Orchha.","Ken":"Kaimur hills → Yamuna; Ken–Betwa link.","Damodar":"Sorrow of Bengal; DVC (1948); joins the Hooghly.","Hooghly":"Distributary of the Ganga from Farakka; Kolkata, Haldia.","Bhagirathi":"Gaumukh → Devprayag; Tehri dam.","Alaknanda":"Near Badrinath → Devprayag; the Panch Prayag.","Sharda":"The Kali on the Nepal border; joins the Ghaghara.","Mahanadi":"Sihawa (Chhattisgarh) → Hirakud → Cuttack delta.","Godavari":"Trimbakeshwar → Bay of Bengal; Dakshin Ganga — longest peninsular river.","Krishna":"Mahabaleshwar → Bay of Bengal; Nagarjuna Sagar; Vijayawada.","Kaveri":"Talakaveri → Bay of Bengal; KRS, Mettur; Shivanasamudra.","Tungabhadra":"Tunga + Bhadra at Koodli → Krishna; Hampi.","Bhima":"Bhimashankar → Krishna; Pandharpur.","Indravati":"→ Godavari; Chitrakote Falls.","Wainganga":"→ Pranhita → Godavari.","Musi":"Hyderabad → Krishna.","Kabini":"Wayanad → Kaveri.","Pennar":"Nandi hills → Nellore → Bay of Bengal.","Vaigai":"Madurai → Palk Strait.","Subarnarekha":"Near Ranchi → Hundru Falls → Jamshedpur → Bay of Bengal.","Brahmani":"South Koel + Sankh near Rourkela → Bay of Bengal.","Narmada":"Amarkantak → Gulf of Khambhat (estuary); Vindhya–Satpura rift; Sardar Sarovar.","Tapi":"Multai → Surat; rift south of the Satpuras; Ukai dam.","Mahi":"Crosses the Tropic of Cancer twice → Gulf of Khambhat.","Sabarmati":"Aravallis → Ahmedabad → Gulf of Khambhat.","Luni":"Near Ajmer → Rann of Kutch (never reaches the sea).","Periyar":"Kerala's longest river; Idukki and Mullaperiyar dams.","Sharavathi":"Jog Falls → Arabian Sea at Honnavar."},"label":["Ganga","Yamuna","Indus","Brahmaputra","Godavari","Krishna","Kaveri","Narmada","Tapi","Mahanadi","Chambal","Son"],"hl":["Ganga","Indus","Brahmaputra","Godavari","Krishna","Kaveri","Narmada","Tapi","Mahanadi","Yamuna"],"cap":"The white dashes show which way the water flows. Tap a system above to see it alone; tap a river for what to remember. Use ＋ or ⛶ to zoom."},{"k":"table","title":"Where the rivers rise","head":["River","Source","Note"],"rows":[["Ganga","Gangotri glacier (Gaumukh), Uttarakhand","It rises as the Bhagirathi and takes the name Ganga at Devprayag."],["Yamuna","Yamunotri glacier, Uttarakhand","On the Bandarpunch range; it joins the Ganga at Prayagraj."],["Indus","Near Lake Mansarovar, Tibet","Called Singi Khamban (the Lion's Mouth) in Tibet; it enters India in Ladakh."],["Sutlej","Rakshastal lake, Tibet","It enters India at Shipki La in Himachal Pradesh."],["Brahmaputra","Chemayungdung glacier, Tibet","Close to Mansarovar; called the Yarlung Tsangpo in Tibet."],["Godavari","Trimbakeshwar, Nashik (Maharashtra)","India's longest peninsular river."],["Krishna","Mahabaleshwar, Maharashtra","In the Western Ghats."],["Kaveri","Talakaveri, Kodagu (Karnataka)","In the Brahmagiri hills of the Western Ghats."],["Narmada","Amarkantak plateau, Madhya Pradesh","The Son also rises at Amarkantak."],["Mahanadi","Sihawa, Dhamtari (Chhattisgarh)",""],["Tapi","Multai, Betul (Madhya Pradesh)","Multai comes from Mul-tapi, 'the source of the Tapi'."],["Luni","Naga hills near Ajmer (Rajasthan)","It never reaches the sea — it ends in the Rann of Kutch."],["Pennar","Nandi hills, Karnataka","It flows east through Andhra Pradesh to the Bay of Bengal."]]},{"k":"mapfig","title":"Where the rivers rise","pins":[["Gangotri (Ganga)",79.08,30.93,""],["Yamunotri",78.45,31,"","l"],["Trimbakeshwar (Godavari)",73.53,19.93,"","l"],["Mahabaleshwar (Krishna)",73.66,17.92,"","l"],["Talakaveri (Kaveri)",75.49,12.38,"","l"],["Amarkantak (Narmada, Son)",81.76,22.67,""],["Multai (Tapi)",78.25,21.77,"","l"],["Sihawa (Mahanadi)",81.9,20.2,""],["Nandi hills (Pennar)",77.68,13.37,""]],"cap":"Most peninsular rivers rise in the Western Ghats, close to the Arabian Sea, yet flow east. The Narmada and Son both start at Amarkantak."},{"k":"bars","title":"The longest rivers","unit":"km","left":110,"hi":1,"rows":[["Ganga",2525,"longest in India"],["Godavari",1465,"longest peninsular"],["Krishna",1400,""],["Yamuna",1376,""],["Narmada",1312,"longest west-flowing"],["Mahanadi",851,""],["Kaveri",800,""],["Tapi",724,""]],"cap":"Commonly quoted round figures; sources differ a little."},{"k":"table","title":"Himalayan and peninsular rivers","head":["","Himalayan rivers","Peninsular rivers"],"rows":[["Water","All year — snow and rain (perennial)","Mostly monsoon rain (seasonal)"],["Age","Young","Very old"],["Valleys","Deep gorges, V-shaped","Broad and shallow"],["Course","Meanders; shifts on the plains","Fixed courses"],["Mouth","Large deltas (Ganga–Brahmaputra)","Deltas on the east coast, estuaries on the west"],["Examples","Indus, Ganga, Brahmaputra","Godavari, Krishna, Kaveri, Narmada, Tapi"]]},{"k":"table","title":"The longest rivers","head":["River","Length","Note"],"rows":[["Ganga","About 2,525 km","The longest river in India."],["Godavari","About 1,465 km","The longest peninsular river — 'Dakshin Ganga'."],["Krishna","About 1,400 km",""],["Yamuna","About 1,376 km","The longest tributary of the Ganga."],["Narmada","About 1,312 km","The longest west-flowing river."],["Mahanadi","About 851 km",""],["Kaveri","About 800 km",""],["Tapi","About 724 km",""]]},{"k":"trick","h":"The big east-flowing four, north to south — <b>“Ma-Go-Kri-Ka”<\/b>: <b>Ma<\/b>hanadi, <b>Go<\/b>davari, <b>Kri<\/b>shna, <b>Ka<\/b>veri. The two west-flowers in rift valleys — <b>“NT”<\/b>, like a nickname: <b>N<\/b>armada and <b>T<\/b>api."},{"k":"trap","h":"<b>Godavari<\/b>, not Krishna, is the longest peninsular river. The <b>Brahmaputra<\/b> is longer than the Ganga in total, but most of it flows in Tibet — the longest river <i>within India<\/i> is the <b>Ganga<\/b>. The Narmada and Son both rise at <b>Amarkantak<\/b> but flow opposite ways."},{"k":"facts","title":"Drainage at a glance","rows":[["Largest basin","Ganga — about a quarter of India's area"],["Largest peninsular basin","Godavari — about a tenth of India"],["Bay of Bengal vs Arabian Sea","Roughly three-quarters of the land drains east into the Bay of Bengal"],["Inland drainage","The Luni (into the Rann of Kutch) and the Ghaggar (dies in the Thar)"],["Antecedent rivers","Indus, Sutlej, Brahmaputra — older than the Himalaya, they cut gorges as it rose"]]}],"sum":["Himalayan rivers flow all year; peninsular rivers depend on the monsoon.","Ganga (2,525 km) is the longest in India; Godavari (1,465 km) the longest peninsular river.","Ganga rises at Gangotri (Gaumukh), Yamuna at Yamunotri, Godavari at Trimbakeshwar, Krishna at Mahabaleshwar, Kaveri at Talakaveri.","Narmada and Son rise at Amarkantak; Narmada and Tapi flow west.","About three-quarters of India drains into the Bay of Bengal."],"part":["Part 1 · The big picture and the Himalayan rivers","बड़ी तस्वीर और हिमालयी नदियाँ"],"g":"rv"},
{"id":"R2","heat":3,"title":"The Indus system","hi":"सिंधु नदी तंत्र","blocks":[{"k":"hot","h":"Most asked: the <b>Vedic names<\/b> (Vitasta, Asikni, Parushni, Vipasha, Shutudri), the <b>Indus Waters Treaty (1960)<\/b> and who got which rivers, the <b>Wular Lake<\/b> on the Jhelum, and <b>Harike<\/b>, where the Beas meets the Sutlej."},{"k":"story","h":"<p>The <b>Indus<\/b> rises near Lake Mansarovar in Tibet, flows north-west through <b>Ladakh<\/b> (past Leh), cuts a deep gorge round the Nanga Parbat massif and then turns south through Pakistan to the Arabian Sea near Karachi. In Ladakh the <b>Zanskar<\/b> and the <b>Shyok<\/b> join it.<\/p><p>Five rivers give <b>Punjab<\/b> ('five waters') its name: the <b>Jhelum, Chenab, Ravi, Beas and Sutlej<\/b>. In 1960 the <b>Indus Waters Treaty<\/b>, brokered by the <b>World Bank<\/b>, gave India the three eastern rivers and Pakistan the three western ones. India put the treaty <b>in abeyance in April 2025<\/b>, after the Pahalgam attack.<\/p>"},{"k":"rivermap","title":"The Indus and the five rivers of Punjab","show":["Indus","Jhelum","Chenab","Ravi","Beas","Sutlej","Ganga","Yamuna"],"hl":["Indus","Jhelum","Chenab","Ravi","Beas","Sutlej"],"label":["Indus","Jhelum","Chenab","Ravi","Beas","Sutlej"],"info":{"Indus":"Near Mansarovar → Arabian Sea (Pakistan); flows past Leh; Indus Waters Treaty, 1960.","Jhelum":"Verinag → Srinagar, Wular Lake; Vedic Vitasta.","Chenab":"Chandra + Bhaga at Tandi; Vedic Asikni; Salal and Baglihar dams.","Ravi":"Near Rohtang; Vedic Parushni; Ranjit Sagar dam.","Beas":"Beas Kund → Harike (joins the Sutlej); Vedic Vipasha; Pong dam.","Sutlej":"Rakshastal (Tibet) → enters at Shipki La; Bhakra dam; Vedic Shutudri."},"vb":"60 0 260 230","pins":[["Srinagar",74.8,34.08,"",""],["Leh",77.58,34.16,""],["Harike",74.95,31.17,"","l"],["Bhakra",76.43,31.41,""],["Wular Lake",74.55,34.36,"","l"]],"cap":"West to east: Jhelum, Chenab, Ravi, Beas, Sutlej. India got the eastern three (Ravi, Beas, Sutlej) under the 1960 treaty."},{"k":"table","title":"The five rivers of Punjab and their Vedic names","head":["River","Vedic name","Note"],"rows":[["Indus","Sindhu","The river that gave India its name."],["Jhelum","Vitasta","It rises at Verinag and flows through Srinagar and Wular Lake."],["Chenab","Asikni","Formed where the Chandra and the Bhaga meet at Tandi (Himachal); also called Chandrabhaga."],["Ravi","Parushni","Also Iravati; it rises near the Rohtang Pass."],["Beas","Vipasha","It rises at Beas Kund near the Rohtang Pass and joins the Sutlej at Harike."],["Sutlej","Shutudri","Also Shatadru — the longest of Punjab's five rivers."]]},{"k":"table","title":"Places on the Indus rivers","head":["Place","River","Note"],"rows":[["Leh","Indus","The Zanskar joins the Indus nearby, at Nimmu."],["Srinagar","Jhelum",""],["Wular Lake","Jhelum","India's largest freshwater lake."],["Jammu","Tawi","The Tawi is a tributary of the Chenab."],["Akhnoor","Chenab",""],["Chamba","Ravi",""],["Kullu and Manali","Beas",""],["Bilaspur (Himachal) and Gobind Sagar","Sutlej",""],["Ludhiana and Rupnagar","Sutlej",""],["Harike","Sutlej","Where the Beas joins the Sutlej; the Indira Gandhi Canal starts here."]]},{"k":"facts","title":"The Indus Waters Treaty","rows":[["Signed","19 September 1960, Karachi — by Jawaharlal Nehru and Ayub Khan"],["Broker","The World Bank"],["Eastern rivers — India","Ravi, Beas, Sutlej"],["Western rivers — Pakistan","Indus, Jhelum, Chenab (India may build run-of-river power projects on them)"],["Body","Permanent Indus Commission"],["2025","India put the treaty in abeyance (April 2025) after the Pahalgam terror attack"]]},{"k":"trick","h":"West to east across Punjab — <b>“J C R B S”<\/b>, read as <b>“Just Call Ravi’s Big Sister”<\/b>: <b>J<\/b>helum, <b>C<\/b>henab, <b>R<\/b>avi, <b>B<\/b>eas, <b>S<\/b>utlej. India got the last three — the <b>R-B-S<\/b> (eastern) rivers."},{"k":"trap","h":"The <b>Chenab<\/b> is formed by the <b>Chandra and Bhaga<\/b> — not the Beas. The <b>Beas<\/b> lies wholly in India and joins the Sutlej at <b>Harike<\/b>. <b>Wular<\/b> (on the Jhelum) is the largest freshwater lake; <b>Dal<\/b> is the famous lake of Srinagar."}],"sum":["The Indus rises near Mansarovar and enters India in Ladakh; the Zanskar joins near Nimmu.","Vedic names: Jhelum–Vitasta, Chenab–Asikni, Ravi–Parushni, Beas–Vipasha, Sutlej–Shutudri.","The Chenab is formed by the Chandra and Bhaga; the Beas joins the Sutlej at Harike.","Indus Waters Treaty, 1960 (World Bank): eastern rivers to India, western to Pakistan; in abeyance since April 2025.","Wular Lake on the Jhelum is India's largest freshwater lake."],"part":["Part 1 · The big picture and the Himalayan rivers","बड़ी तस्वीर और हिमालयी नदियाँ"],"g":"rv"},
{"id":"R3","heat":3,"title":"The Ganga's source and the Yamuna","hi":"गंगा का उद्गम और यमुना","blocks":[{"k":"hot","h":"Most asked: the <b>Bhagirathi and Alaknanda meet at Devprayag<\/b>, the <b>Panch Prayag<\/b>, the <b>Triveni Sangam<\/b> at Prayagraj, the <b>Chambal<\/b> (ravines, gharials) and which city stands on which river."},{"k":"story","h":"<p>The Ganga is born as the <b>Bhagirathi<\/b> at <b>Gaumukh<\/b>, the snout of the Gangotri glacier. The <b>Alaknanda<\/b> comes down from near Badrinath, collecting four rivers at four 'prayags' (confluences). At the fifth, <b>Devprayag<\/b>, the Bhagirathi joins it and the river becomes the <b>Ganga<\/b>. It enters the plains at <b>Haridwar<\/b>.<\/p><p>The <b>Yamuna<\/b> rises at <b>Yamunotri<\/b>, flows past Delhi, Mathura and Agra, and joins the Ganga at the <b>Triveni Sangam<\/b> in Prayagraj. From the south it collects rivers of the Malwa plateau and Bundelkhand: the <b>Chambal<\/b>, <b>Sindh<\/b>, <b>Betwa<\/b> and <b>Ken<\/b>.<\/p>"},{"k":"rivermap","title":"From Gangotri to Prayagraj","show":["Bhagirathi","Alaknanda","Ganga","Yamuna","Ramganga","Chambal","Betwa","Ken","Banas","Parbati","Gomti","Ghaghara","Son","Sharda"],"hl":["Bhagirathi","Alaknanda","Ganga","Yamuna","Ramganga","Chambal","Betwa","Ken","Banas","Parbati"],"label":["Ganga","Yamuna","Chambal","Betwa","Ken","Bhagirathi","Alaknanda"],"info":{"Bhagirathi":"Gaumukh → Devprayag; Tehri dam.","Alaknanda":"Near Badrinath → Devprayag; the Panch Prayag.","Ganga":"Gangotri (as the Bhagirathi) → Bay of Bengal; the longest in India (about 2,525 km); National River.","Yamuna":"Yamunotri → Prayagraj; the Ganga's longest tributary; Delhi, Mathura, Agra.","Ramganga":"From Kumaon; Corbett National Park; joins near Kannauj.","Chambal":"Janapav → Yamuna; ravines, gharials; Kota.","Betwa":"Vindhyas → Yamuna; Orchha.","Ken":"Kaimur hills → Yamuna; Ken–Betwa link."},"vb":"150 60 260 240","pins":[["Devprayag",78.6,30.15,"","l"],["Haridwar",78.16,29.95,"",""],["Kanpur",80.33,26.45,"",""],["Prayagraj",81.85,25.43,"Sangam"],["Varanasi",82.97,25.32,"",""],["Delhi",77.21,28.61,"","l"],["Agra",78.01,27.18,"","l"],["Kota",75.86,25.18,"","l"]],"cap":"The Bhagirathi and Alaknanda meet at Devprayag; the Yamuna joins at Prayagraj after collecting the Chambal, Betwa and Ken."},{"k":"table","title":"The Panch Prayag","head":["Prayag","River that joins the Alaknanda","Note"],"rows":[["Vishnuprayag","Dhauliganga","The first prayag downstream from Badrinath."],["Nandprayag","Nandakini",""],["Karnaprayag","Pindar","The Pindar comes from the Pindari glacier."],["Rudraprayag","Mandakini","The Mandakini comes down from Kedarnath."],["Devprayag","Bhagirathi","From here the river is called the Ganga."]]},{"k":"info","title":"The Panch Prayag, as a diagram","html":"<svg class=\"dg\" viewBox=\"0 0 680 210\" role=\"img\" aria-label=\"The five confluences of the Alaknanda\"><defs><marker id=\"pa\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"#1c8aa6\"/><\/marker><\/defs>\n    <path d=\"M20 60 C140 60 180 80 300 90 S520 110 660 150\" fill=\"none\" stroke=\"#1c8aa6\" stroke-width=\"7\" stroke-linecap=\"round\"/>\n    <path d=\"M20 60 C140 60 180 80 300 90 S520 110 660 150\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.6\" stroke-dasharray=\"2 9\" class=\"rvf\" style=\"animation:rvflow 1.3s linear infinite\"/>\n    <text x=\"24\" y=\"44\" font-size=\"13\" class=\"b\" style=\"fill:#1c8aa6\">Alaknanda (from near Badrinath)<\/text>\n    <path d=\"M80 145 Q100 100 110 68\" fill=\"none\" stroke=\"#2f6db5\" stroke-width=\"3.5\" marker-end=\"url(#pa)\"/><circle cx=\"110\" cy=\"64\" r=\"7\" class=\"acc\"/><text x=\"110\" y=\"48\" text-anchor=\"middle\" font-size=\"12.5\" class=\"b\">Vishnuprayag<\/text><text x=\"78\" y=\"162\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">Dhauliganga<\/text><path d=\"M200 166 Q220 121 230 89\" fill=\"none\" stroke=\"#2f6db5\" stroke-width=\"3.5\" marker-end=\"url(#pa)\"/><circle cx=\"230\" cy=\"85\" r=\"7\" class=\"acc\"/><text x=\"230\" y=\"69\" text-anchor=\"middle\" font-size=\"12.5\" class=\"b\">Nandprayag<\/text><text x=\"198\" y=\"183\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">Nandakini<\/text><path d=\"M320 187 Q340 142 350 110\" fill=\"none\" stroke=\"#2f6db5\" stroke-width=\"3.5\" marker-end=\"url(#pa)\"/><circle cx=\"350\" cy=\"106\" r=\"7\" class=\"acc\"/><text x=\"350\" y=\"90\" text-anchor=\"middle\" font-size=\"12.5\" class=\"b\">Karnaprayag<\/text><text x=\"318\" y=\"204\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">Pindar<\/text><path d=\"M440 208 Q460 163 470 131\" fill=\"none\" stroke=\"#2f6db5\" stroke-width=\"3.5\" marker-end=\"url(#pa)\"/><circle cx=\"470\" cy=\"127\" r=\"7\" class=\"acc\"/><text x=\"470\" y=\"111\" text-anchor=\"middle\" font-size=\"12.5\" class=\"b\">Rudraprayag<\/text><text x=\"438\" y=\"225\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">Mandakini<\/text><path d=\"M570 229 Q590 184 600 152\" fill=\"none\" stroke=\"#2f6db5\" stroke-width=\"3.5\" marker-end=\"url(#pa)\"/><circle cx=\"600\" cy=\"148\" r=\"7\" class=\"acc\"/><text x=\"600\" y=\"132\" text-anchor=\"middle\" font-size=\"12.5\" class=\"b\">Devprayag<\/text><text x=\"568\" y=\"246\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">Bhagirathi<\/text>\n    <text x=\"664\" y=\"176\" text-anchor=\"end\" font-size=\"14\" class=\"b\" style=\"fill:#1c8aa6\">Ganga →<\/text><\/svg>","cap":"Downstream: Vishnuprayag, Nandprayag, Karnaprayag, Rudraprayag, Devprayag. After Devprayag the river is the Ganga."},{"k":"table","title":"Tributaries of the Yamuna","head":["Tributary","Rises in","Note"],"rows":[["Tons","Bandarpunch range (Uttarakhand)","The largest tributary of the Yamuna."],["Hindon","Upper Shivaliks near Saharanpur (Uttar Pradesh)",""],["Chambal","Janapav, near Mhow (Madhya Pradesh)","Famous for its ravines and gharials."],["Sindh","Malwa plateau, Vidisha (Madhya Pradesh)",""],["Betwa","Vindhyas, Raisen (Madhya Pradesh)","Ancient Vetravati; Orchha stands on it."],["Ken","Kaimur hills (Madhya Pradesh)","It flows past Panna; the Ken–Betwa link starts here."]]},{"k":"table","title":"Cities on the Ganga and Yamuna","head":["City","River","Note"],"rows":[["Rishikesh and Haridwar","Ganga","At Haridwar the Ganga leaves the hills for the plains."],["Kanpur","Ganga",""],["Varanasi","Ganga",""],["Patna","Ganga","The Gandak and the Son join nearby."],["Bhagalpur","Ganga","The Vikramshila Gangetic Dolphin Sanctuary is here."],["Delhi","Yamuna",""],["Mathura and Agra","Yamuna",""],["Prayagraj","Ganga and Yamuna (Sangam)","The Triveni Sangam — with the unseen Saraswati."],["Kota","Chambal",""],["Orchha","Betwa",""]]},{"k":"facts","title":"The Chambal","rows":[["Known for","Deep ravines (badlands) cut by gully erosion"],["Wildlife","National Chambal Sanctuary (Rajasthan, MP, UP) — gharials, Ganges river dolphins"],["Dams","Gandhi Sagar (MP), Rana Pratap Sagar (Rawatbhata), Jawahar Sagar, Kota Barrage (Rajasthan)"]]},{"k":"trick","h":"Panch Prayag downstream — <b>“Vishnu Nand Karna Rudra Dev”<\/b>: <b>V<\/b>ishnu-, <b>N<\/b>and-, <b>K<\/b>arna-, <b>R<\/b>udra-, <b>D<\/b>evprayag. Their rivers in the same order: <b>“Dhauli, Nanda, Pindar, Manda, Bhagi”<\/b>."},{"k":"trap","h":"The <b>Ganga<\/b> gets its name at <b>Devprayag<\/b>, not Gangotri or Haridwar. The <b>Tons<\/b> — not the Chambal — is the Yamuna's largest tributary. <b>Tehri<\/b> dam is on the <b>Bhagirathi<\/b>, not the Alaknanda."}],"sum":["Bhagirathi (from Gaumukh) + Alaknanda meet at Devprayag to form the Ganga.","Panch Prayag: Vishnu (Dhauliganga), Nand (Nandakini), Karna (Pindar), Rudra (Mandakini), Dev (Bhagirathi).","The Yamuna rises at Yamunotri and joins the Ganga at Prayagraj (Triveni Sangam).","Yamuna's tributaries: Tons (largest), Hindon, Chambal, Sindh, Betwa, Ken.","The Chambal is known for its ravines and the National Chambal Sanctuary."],"part":["Part 1 · The big picture and the Himalayan rivers","बड़ी तस्वीर और हिमालयी नदियाँ"],"g":"rv"},
{"id":"R4","heat":3,"title":"The Ganga's tributaries and delta","hi":"गंगा की सहायक नदियाँ और डेल्टा","blocks":[{"k":"hot","h":"Most asked: <b>left- and right-bank tributaries<\/b> (Gomti, Ghaghara, Gandak, Kosi vs Yamuna, Son), the <b>'sorrow' rivers<\/b> (Kosi — Bihar, Damodar — Bengal), <b>Farakka<\/b> and the Hooghly, and the <b>Ganga as the National River<\/b>."},{"k":"story","h":"<p>On the plains, rivers from the Himalaya join the Ganga from the <b>left (north)<\/b>: the Ramganga, <b>Gomti<\/b>, <b>Ghaghara<\/b>, <b>Gandak<\/b>, <b>Kosi<\/b> and Mahananda. From the <b>right (south)<\/b> come the <b>Yamuna<\/b> and the <b>Son<\/b> from the old plateau.<\/p><p>At <b>Farakka<\/b> (West Bengal) a barrage sends part of the water into the <b>Bhagirathi–Hooghly<\/b>, which flows past <b>Kolkata<\/b> to the sea and is joined by the <b>Damodar<\/b>. The main stream enters Bangladesh as the <b>Padma<\/b>, meets the Brahmaputra (Jamuna) and then the Meghna, building the <b>Ganga–Brahmaputra (Sundarbans) delta<\/b> — the largest delta in the world.<\/p>"},{"k":"rivermap","title":"The Ganga's left and right banks","show":["Ganga","Yamuna","Ramganga","Gomti","Ghaghara","Gandak","Kosi","Son","Damodar","Hooghly","Sharda","Chambal","Betwa","Ken","Teesta","Brahmaputra"],"hl":["Ganga","Yamuna","Ramganga","Gomti","Ghaghara","Gandak","Kosi","Son","Damodar","Hooghly","Sharda"],"label":["Ganga","Yamuna","Ramganga","Gomti","Ghaghara","Gandak","Kosi","Son","Damodar","Hooghly","Sharda"],"info":{"Ganga":"Gangotri (as the Bhagirathi) → Bay of Bengal; the longest in India (about 2,525 km); National River.","Yamuna":"Yamunotri → Prayagraj; the Ganga's longest tributary; Delhi, Mathura, Agra.","Ramganga":"From Kumaon; Corbett National Park; joins near Kannauj.","Gomti":"Lucknow and Jaunpur; joins near Ghazipur.","Ghaghara":"Karnali in Nepal; Ayodhya on its Saryu stretch; joins near Chhapra.","Gandak":"Narayani in Nepal; joins at Hajipur.","Kosi":"Sapt Kosi from Nepal — the Sorrow of Bihar.","Son":"Amarkantak → joins the Ganga near Patna (right bank).","Damodar":"Sorrow of Bengal; DVC (1948); joins the Hooghly.","Hooghly":"Distributary of the Ganga from Farakka; Kolkata, Haldia.","Sharda":"The Kali on the Nepal border; joins the Ghaghara."},"vb":"160 120 340 260","pins":[["Lucknow",80.95,26.85,"","l"],["Patna",85.14,25.6,"",""],["Farakka",87.92,24.8,""],["Kolkata",88.36,22.57,"",""],["Ayodhya",82.2,26.8,""]],"cap":"From the north (left bank): Ramganga, Gomti, Ghaghara, Gandak, Kosi. From the south (right bank): Yamuna and Son. The Hooghly leaves the Ganga at Farakka and takes the Damodar."},{"k":"table","title":"Where the tributaries join the Ganga","head":["Tributary","Joins the Ganga","Note"],"rows":[["Ramganga","Near Kannauj","A left-bank tributary from the Kumaon hills; Corbett National Park is on it."],["Gomti","Near Ghazipur","Left bank; Lucknow and Jaunpur stand on it."],["Ghaghara","Near Chhapra","Left bank; the Karnali in Nepal. Ayodhya stands on its Saryu stretch."],["Gandak","Hajipur (opposite Patna)","Left bank; the Narayani in Nepal."],["Kosi","Near Kursela, Katihar","Left bank; the 'Sorrow of Bihar'."],["Son","Near Patna","Right bank; it rises at Amarkantak."],["Yamuna","Prayagraj","Right bank; the longest tributary."],["Mahananda","In Bangladesh","The last left-bank tributary."]]},{"k":"table","title":"Nicknames of rivers","head":["Nickname","River","Note"],"rows":[["Sorrow of Bihar","Kosi","It keeps shifting its course and floods north Bihar."],["Sorrow of Bengal","Damodar","Tamed by the Damodar Valley Corporation (1948)."],["Sorrow of Assam","Brahmaputra","Floods every monsoon."],["Sorrow of Odisha (before Hirakud)","Mahanadi",""],["Dakshin Ganga (also Vriddha Ganga)","Godavari","The longest peninsular river."],["Biological desert (pollution)","Damodar","Coal mines and industry along it."],["Lifeline of Madhya Pradesh","Narmada",""],["Sorrow of China","Huang He","Not an Indian river — a common option."]]},{"k":"facts","title":"The delta and the National River","rows":[["Farakka Barrage","1975 — feeds the Bhagirathi–Hooghly to keep Kolkata port alive"],["Distributaries","Bhagirathi–Hooghly (India) and Padma (Bangladesh)"],["Delta","Ganga–Brahmaputra (Sundarbans) — the largest delta in the world"],["National River","Ganga — declared in 2008"],["National Aquatic Animal","Ganges river dolphin — 2009"],["National Waterway 1","Ganga–Bhagirathi–Hooghly, Prayagraj to Haldia — the longest national waterway"],["Clean-up","Namami Gange (2014), run by the National Mission for Clean Ganga"]]},{"k":"trick","h":"Left-bank tributaries west to east — <b>“Ram Gomti Ghar Gandak Kosi”<\/b>: <b>Ram<\/b>ganga, <b>Gomti<\/b>, <b>Ghag<\/b>hara, <b>Gandak<\/b>, <b>Kosi<\/b>. Right bank — just two big ones: <b>Yamuna and Son<\/b>."},{"k":"trap","h":"The <b>Damodar<\/b> joins the <b>Hooghly<\/b>, not the main Ganga. The <b>Son<\/b> is a <b>right<\/b>-bank tributary although it joins near Patna. 'Sorrow of Bihar' is the <b>Kosi<\/b>; 'Sorrow of Bengal' is the <b>Damodar<\/b>."}],"sum":["Left-bank: Ramganga, Gomti, Ghaghara, Gandak, Kosi, Mahananda; right-bank: Yamuna, Son.","Kosi — Sorrow of Bihar; Damodar — Sorrow of Bengal (Damodar Valley Corporation, 1948).","Farakka Barrage (1975) feeds the Bhagirathi–Hooghly; the main stream becomes the Padma in Bangladesh.","The Ganga–Brahmaputra (Sundarbans) delta is the world's largest.","Ganga: National River (2008); Ganges dolphin: National Aquatic Animal (2009); NW-1 Prayagraj–Haldia."],"part":["Part 1 · The big picture and the Himalayan rivers","बड़ी तस्वीर और हिमालयी नदियाँ"],"g":"rv"},
{"id":"R5","heat":2,"title":"The Brahmaputra and the Barak","hi":"ब्रह्मपुत्र और बराक","blocks":[{"k":"hot","h":"Most asked: the <b>names along the way<\/b> (Tsangpo → Siang/Dihang → Brahmaputra → Jamuna), <b>Majuli<\/b> (largest river island), its <b>tributaries<\/b> (Subansiri, Manas, Teesta), and the <b>Bogibeel<\/b> and <b>Dhola–Sadiya<\/b> bridges."},{"k":"story","h":"<p>The Brahmaputra rises near Mansarovar as the <b>Yarlung Tsangpo<\/b> and flows east across Tibet. Near <b>Namcha Barwa<\/b> it takes a sharp U-turn and plunges through one of the world's deepest gorges into Arunachal Pradesh as the <b>Siang (Dihang)<\/b>. Near Sadiya the <b>Dibang<\/b> and <b>Lohit<\/b> join it and it becomes the <b>Brahmaputra<\/b>.<\/p><p>In the Assam valley it is wide and <b>braided<\/b>, full of sandbars and islands like <b>Majuli<\/b>. It floods every monsoon. It enters Bangladesh as the <b>Jamuna<\/b>, joins the Padma and the Meghna, and reaches the Bay of Bengal. Further south, the <b>Barak<\/b> rises in the Manipur hills, flows past <b>Silchar<\/b> and also ends in the Meghna.<\/p>"},{"k":"rivermap","title":"The Brahmaputra and the Barak","show":["Brahmaputra","Lohit","Subansiri","Manas","Teesta","Barak","Ganga"],"hl":["Brahmaputra","Lohit","Subansiri","Manas","Teesta","Barak"],"label":["Brahmaputra","Lohit","Subansiri","Manas","Teesta","Barak"],"info":{"Brahmaputra":"Tsangpo in Tibet, Siang in Arunachal, Brahmaputra in Assam, Jamuna in Bangladesh; Majuli island.","Lohit":"Joins the Siang near Sadiya; Dhola–Sadiya bridge.","Subansiri":"The Brahmaputra's largest tributary.","Manas":"From Bhutan; Manas National Park.","Teesta":"From Sikkim; joins the Brahmaputra in Bangladesh.","Barak":"Manipur hills → Silchar → Meghna (Bangladesh)."},"vb":"380 140 180 130","pins":[["Majuli",94.2,26.95,"river island"],["Guwahati",91.74,26.14,"",""],["Dibrugarh",94.91,27.47,""],["Silchar",92.8,24.83,""],["Sadiya",95.65,27.83,""]],"cap":"The Tsangpo enters as the Siang, becomes the Brahmaputra near Sadiya and runs west through Assam, braided and full of islands like Majuli."},{"k":"table","title":"One river, many names","head":["Where","Name","Note"],"rows":[["Tibet","Yarlung Tsangpo","It flows east for about 1,600 km, then turns round Namcha Barwa."],["Arunachal Pradesh","Siang (Dihang)","It cuts a deep gorge into India."],["Assam, after the Dibang and Lohit join near Sadiya","Brahmaputra",""],["Bangladesh","Jamuna",""],["Bangladesh, after it meets the Ganga (Padma) at Goalundo","Padma",""],["The last stretch to the Bay of Bengal","Meghna",""]]},{"k":"table","title":"Tributaries of the Brahmaputra","head":["Tributary","Comes from","Note"],"rows":[["Subansiri","Arunachal Pradesh","The largest tributary; the Lower Subansiri project is on it."],["Kameng (Jia Bhareli)","Arunachal Pradesh",""],["Manas","Bhutan","Manas National Park is on it."],["Sankosh","Bhutan",""],["Teesta","Sikkim","It joins the Brahmaputra in Bangladesh."],["Dhansiri","Nagaland","A south-bank tributary."],["Kopili","Meghalaya","A south-bank tributary."]]},{"k":"table","title":"On the Brahmaputra","head":["Place","River","Note"],"rows":[["Majuli","Brahmaputra","The world's largest river island; a district since 2016."],["Umananda","Brahmaputra","Among the smallest inhabited river islands, at Guwahati."],["Guwahati, Tezpur and Dibrugarh","Brahmaputra",""],["Bogibeel Bridge","Brahmaputra","India's longest rail-cum-road bridge (2018), near Dibrugarh."],["Bhupen Hazarika Setu (Dhola–Sadiya)","Lohit","A long road bridge (2017) in Assam."],["Silchar","Barak",""],["Kaziranga National Park","Brahmaputra","On the south bank."]]},{"k":"facts","title":"Brahmaputra facts","rows":[["A 'male' river","Named as the son of Brahma"],["Channel in Assam","Braided — many channels and sandbars"],["National Waterway 2","Brahmaputra, Dhubri to Sadiya"],["Barak","Rises in the Manipur hills; flows past Silchar; in Bangladesh it splits into the Surma and Kushiyara and joins the Meghna"]]},{"k":"trick","h":"The name chain — <b>“Tsang-Siang-Brahma-Jamuna-Padma-Meghna”<\/b>: Tibet, Arunachal, Assam, then three names in Bangladesh."},{"k":"trap","h":"<b>Teesta<\/b> joins the Brahmaputra in <b>Bangladesh<\/b>, not in India. The <b>Dhola–Sadiya<\/b> (Bhupen Hazarika) bridge is over the <b>Lohit<\/b>; <b>Bogibeel<\/b> is over the Brahmaputra. In Bangladesh the Brahmaputra is the <b>Jamuna<\/b> — not the Yamuna of India."}],"sum":["Yarlung Tsangpo (Tibet) → Siang/Dihang (Arunachal) → Brahmaputra (Assam) → Jamuna (Bangladesh).","It turns round Namcha Barwa; the Dibang and Lohit join near Sadiya.","Majuli is the world's largest river island (district since 2016).","Tributaries: Subansiri (largest), Kameng, Manas, Sankosh, Teesta; Dhansiri and Kopili from the south.","Bogibeel (2018) — longest rail-cum-road bridge; Dhola–Sadiya over the Lohit (2017)."],"part":["Part 1 · The big picture and the Himalayan rivers","बड़ी तस्वीर और हिमालयी नदियाँ"],"g":"rv"},
{"id":"R6","heat":3,"title":"The east-flowing peninsular rivers","hi":"पूर्व की ओर बहने वाली प्रायद्वीपीय नदियाँ","blocks":[{"k":"hot","h":"Most asked: <b>which tributary goes to which river<\/b> (Indravati, Pranhita → Godavari; Bhima, Tungabhadra, Koyna → Krishna; Kabini → Kaveri), <b>cities<\/b> (Nashik, Vijayawada, Cuttack, Srirangapatna, Madurai), and <b>Godavari = Dakshin Ganga<\/b>."},{"k":"story","h":"<p>The Deccan tilts gently to the east, so most peninsular rivers rise in the <b>Western Ghats<\/b>, close to the Arabian Sea, and yet flow all the way across to the <b>Bay of Bengal<\/b>. Slow on the flat coastal plain, they drop their silt and build fertile <b>deltas<\/b> — the Mahanadi, the Krishna–Godavari and the Kaveri deltas are India's rice bowls.<\/p><p>The <b>Mahanadi<\/b> (Chhattisgarh and Odisha) is held back by the <b>Hirakud Dam<\/b>. The <b>Godavari<\/b>, the longest, gathers the Pranhita and Indravati. The <b>Krishna<\/b> takes the Bhima and Tungabhadra. The <b>Kaveri<\/b>, shared by Karnataka and Tamil Nadu, falls at <b>Shivanasamudra<\/b> — home of Asia's first hydroelectric plant (1902).<\/p>"},{"k":"rivermap","title":"The east-flowing rivers","show":["Mahanadi","Godavari","Wainganga","Indravati","Krishna","Bhima","Tungabhadra","Musi","Kaveri","Kabini","Pennar","Vaigai","Subarnarekha","Brahmani","Tel","Sankh","Kollidam","Palar","Ponnaiyar","Narmada","Tapi"],"hl":["Mahanadi","Godavari","Wainganga","Indravati","Krishna","Bhima","Tungabhadra","Musi","Kaveri","Kabini","Pennar","Vaigai","Subarnarekha","Brahmani"],"label":["Mahanadi","Godavari","Krishna","Kaveri","Indravati","Bhima","Tungabhadra","Pennar","Wainganga"],"info":{"Mahanadi":"Sihawa (Chhattisgarh) → Hirakud → Cuttack delta.","Godavari":"Trimbakeshwar → Bay of Bengal; Dakshin Ganga — longest peninsular river.","Wainganga":"→ Pranhita → Godavari.","Indravati":"→ Godavari; Chitrakote Falls.","Krishna":"Mahabaleshwar → Bay of Bengal; Nagarjuna Sagar; Vijayawada.","Bhima":"Bhimashankar → Krishna; Pandharpur.","Tungabhadra":"Tunga + Bhadra at Koodli → Krishna; Hampi.","Musi":"Hyderabad → Krishna.","Kaveri":"Talakaveri → Bay of Bengal; KRS, Mettur; Shivanasamudra.","Kabini":"Wayanad → Kaveri.","Pennar":"Nandi hills → Nellore → Bay of Bengal.","Vaigai":"Madurai → Palk Strait.","Subarnarekha":"Near Ranchi → Hundru Falls → Jamshedpur → Bay of Bengal.","Brahmani":"South Koel + Sankh near Rourkela → Bay of Bengal."},"vb":"60 220 380 400","pins":[["Nashik",73.79,20,"","l"],["Vijayawada",80.65,16.51,""],["Cuttack",85.88,20.46,"",""],["Hirakud",83.87,21.52,"","l"],["Srirangapatna",76.68,12.42,"","l"],["Hyderabad",78.49,17.39,"","l"]],"cap":"They rise in the Western Ghats or central India and cross the whole peninsula to the Bay of Bengal, ending in deltas."},{"k":"table","title":"Tributaries and their main river","head":["Tributary","Main river","Note"],"rows":[["Seonath","Mahanadi","The Mahanadi's longest tributary (Chhattisgarh)."],["Hasdeo","Mahanadi",""],["Ib","Mahanadi","It joins at the Hirakud reservoir."],["Tel","Mahanadi",""],["Manjira","Godavari",""],["Penganga","Godavari",""],["Wainganga","Godavari","With the Wardha it forms the Pranhita."],["Pranhita","Godavari","Its largest tributary — the Wardha, Wainganga and Penganga together."],["Indravati","Godavari","Chitrakote Falls is on it (Chhattisgarh)."],["Sabari","Godavari",""],["Koyna","Krishna","Koyna Dam; a known earthquake zone."],["Ghataprabha","Krishna","Gokak Falls is on it."],["Malaprabha","Krishna",""],["Bhima","Krishna","Pandharpur stands on it."],["Tungabhadra","Krishna","Formed where the Tunga and the Bhadra meet at Koodli; Hampi stands on it."],["Musi","Krishna","Hyderabad stands on it."],["Hemavati","Kaveri",""],["Kabini","Kaveri","From Wayanad (Kerala)."],["Bhavani","Kaveri",""],["Amaravati","Kaveri",""]]},{"k":"table","title":"Places on the east-flowing rivers","head":["Place","River","Note"],"rows":[["Sambalpur and Cuttack","Mahanadi","Cuttack stands where the Mahanadi divides into its delta."],["Nashik","Godavari","A Kumbh Mela city."],["Nanded","Godavari",""],["Rajamahendravaram (Rajahmundry)","Godavari","At the head of the Godavari delta."],["Vijayawada","Krishna","The Prakasam Barrage is here."],["Sangli","Krishna",""],["Srirangapatna","Kaveri","A river island; Tipu Sultan's capital."],["Tiruchirappalli and Srirangam","Kaveri",""],["Thanjavur (delta)","Kaveri","The 'rice bowl of Tamil Nadu'."],["Madurai","Vaigai",""],["Nellore","Pennar",""],["Jamshedpur","Subarnarekha",""],["Rourkela (Vedvyas)","Brahmani","The Brahmani forms here where the South Koel and Sankh meet."]]},{"k":"facts","title":"The big four in short","rows":[["Mahanadi","Sihawa (Chhattisgarh) → Odisha; Hirakud Dam; delta at Cuttack"],["Godavari","Trimbakeshwar → Andhra Pradesh; the longest (1,465 km) and the largest basin in the peninsula; Polavaram project"],["Krishna","Mahabaleshwar → Andhra Pradesh; Srisailam and Nagarjuna Sagar dams"],["Kaveri","Talakaveri → Tamil Nadu; Krishnaraja Sagar and Mettur dams; Shivanasamudra and Hogenakkal falls"],["Smaller ones","Subarnarekha, Brahmani, Pennar, Palar, Vaigai"]]},{"k":"trick","h":"Godavari's family — <b>“Pran-Indra-Sab”<\/b>: <b>Pran<\/b>hita (Wardha + Wainganga + Penganga), <b>Indra<\/b>vati, <b>Sab<\/b>ari. Krishna's — <b>“Bhima Tunga Koyna”<\/b>. Kaveri's — <b>“Kabini Bhavani Hemavati”<\/b>."},{"k":"trap","h":"The <b>Tungabhadra<\/b> joins the <b>Krishna<\/b>, not the Kaveri. <b>Hyderabad<\/b> is on the <b>Musi<\/b>, a Krishna tributary — not on the Godavari. The <b>Brahmani<\/b> is formed by the South Koel and Sankh near Rourkela."}],"sum":["Most peninsular rivers rise in the Western Ghats and flow east to the Bay of Bengal, building deltas.","Godavari: longest peninsular river; tributaries Pranhita, Indravati, Sabari, Manjira.","Krishna: tributaries Bhima, Tungabhadra, Koyna, Musi; Vijayawada (Prakasam Barrage).","Kaveri: Talakaveri; Kabini, Hemavati, Bhavani; Srirangapatna, Tiruchirappalli; Shivanasamudra (1902).","Mahanadi: Sihawa → Hirakud → Cuttack delta."],"part":["Part 2 · The peninsular rivers","प्रायद्वीपीय नदियाँ"],"g":"rv"},
{"id":"R7","heat":3,"title":"The west-flowing rivers","hi":"पश्चिम की ओर बहने वाली नदियाँ","blocks":[{"k":"hot","h":"Most asked: <b>Narmada and Tapi in rift valleys<\/b>, <b>estuaries not deltas<\/b>, <b>Mahi crosses the Tropic of Cancer twice<\/b>, the <b>Luni<\/b> ending in the Rann of Kutch, <b>Jog Falls<\/b> on the Sharavathi and <b>Periyar<\/b>, Kerala's longest river."},{"k":"story","h":"<p>The <b>Narmada<\/b> and the <b>Tapi<\/b> do not follow the tilt of the Deccan. They flow west along <b>rift valleys<\/b> — long troughs where the land sank between faults: the Narmada between the <b>Vindhyas and Satpuras<\/b>, the Tapi south of the Satpuras. They carry little silt and meet the sea in tidal <b>estuaries<\/b> at Bharuch and Surat instead of deltas.<\/p><p>From Gujarat come the <b>Sabarmati<\/b> and <b>Mahi<\/b>; from the Aravallis the <b>Luni<\/b>, which dies in the <b>Rann of Kutch<\/b>. The many short, swift rivers of the Western Ghats — the Mandovi, Sharavathi, Netravati, Periyar — race down to the Arabian Sea in a few dozen kilometres, making waterfalls like <b>Jog<\/b> and <b>Dudhsagar<\/b>.<\/p>"},{"k":"rivermap","title":"The west-flowing rivers","show":["Narmada","Tapi","Mahi","Sabarmati","Luni","Sharavathi","Periyar","Godavari","Krishna","Chambal","Son"],"hl":["Narmada","Tapi","Mahi","Sabarmati","Luni","Sharavathi","Periyar"],"label":["Narmada","Tapi","Mahi","Sabarmati","Luni","Sharavathi","Periyar"],"info":{"Narmada":"Amarkantak → Gulf of Khambhat (estuary); Vindhya–Satpura rift; Sardar Sarovar.","Tapi":"Multai → Surat; rift south of the Satpuras; Ukai dam.","Mahi":"Crosses the Tropic of Cancer twice → Gulf of Khambhat.","Sabarmati":"Aravallis → Ahmedabad → Gulf of Khambhat.","Luni":"Near Ajmer → Rann of Kutch (never reaches the sea).","Sharavathi":"Jog Falls → Arabian Sea at Honnavar.","Periyar":"Kerala's longest river; Idukki and Mullaperiyar dams."},"vb":"20 150 300 450","pins":[["Bharuch",72.98,21.7,"estuary","l"],["Surat",72.83,21.17,"","l"],["Ahmedabad",72.57,23.02,"","l"],["Jabalpur",79.93,23.18,"Bhedaghat"],["Amarkantak",81.76,22.67,""],["Jog Falls",74.81,14.23,"","l"]],"cap":"The Narmada and Tapi run west through rift valleys to estuaries in the Gulf of Khambhat; short Western Ghats rivers race to the Arabian Sea."},{"k":"table","title":"Where the west-flowing rivers end","head":["River","Ends in","Note"],"rows":[["Narmada","Gulf of Khambhat, at Bharuch","An estuary, not a delta."],["Tapi","Gulf of Khambhat, near Surat",""],["Sabarmati","Gulf of Khambhat","Ahmedabad and the Gandhi Ashram stand on it."],["Mahi","Gulf of Khambhat","It crosses the Tropic of Cancer twice."],["Luni","Rann of Kutch","It never reaches the sea; salty after Balotra."],["Mandovi","Arabian Sea at Panaji","Dudhsagar Falls is on it."],["Zuari","Arabian Sea near Mormugao",""],["Sharavathi","Arabian Sea at Honnavar","Jog Falls is on it."],["Netravati","Arabian Sea at Mangaluru",""],["Periyar","Arabian Sea near Kochi","The longest river of Kerala."],["Bharathapuzha","Arabian Sea at Ponnani","Also called the Nila — Kerala's second-longest river."]]},{"k":"table","title":"Narmada, Tapi and the west coast","head":["Feature","River","Note"],"rows":[["Flows through a rift valley between the Vindhyas and the Satpuras","Narmada",""],["Flows through a rift valley between the Satpuras and the Satmala–Ajanta hills","Tapi",""],["Dhuandhar Falls and the Marble Rocks of Bhedaghat (Jabalpur)","Narmada",""],["Omkareshwar and Maheshwar","Narmada",""],["Sardar Sarovar Dam and the Statue of Unity (Kevadia)","Narmada",""],["Surat and the Ukai Dam","Tapi",""],["Ahmedabad","Sabarmati",""],["Crosses the Tropic of Cancer twice","Mahi",""],["Jog Falls","Sharavathi",""],["Idukki Arch Dam","Periyar",""]]},{"k":"info","title":"The rift valleys, in cross-section","html":"<svg class=\"dg\" viewBox=\"0 0 680 220\" role=\"img\" aria-label=\"Cross-section: Vindhya, Narmada rift, Satpura, Tapi rift, Ajanta hills\">\n    <path d=\"M0 200 L0 90 L90 70 L160 80 L190 150 L250 150 L280 70 L350 50 L420 70 L450 150 L500 150 L530 90 L620 80 L680 95 L680 200 Z\" class=\"s5\" stroke=\"var(--rule)\"/>\n    <path d=\"M190 150 L250 150 L245 175 L195 175 Z\" fill=\"#1c8aa6\" opacity=\".85\"/><path d=\"M450 150 L500 150 L495 172 L455 172 Z\" fill=\"#1c8aa6\" opacity=\".85\"/>\n    <path d=\"M170 95 L200 185 M270 95 L240 185 M430 95 L460 185 M520 95 L490 185\" stroke=\"var(--ink2)\" stroke-dasharray=\"4 4\"/>\n    <text x=\"90\" y=\"60\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Vindhya<\/text><text x=\"350\" y=\"40\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Satpura<\/text><text x=\"600\" y=\"68\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Ajanta (Satmala)<\/text>\n    <text x=\"220\" y=\"140\" text-anchor=\"middle\" font-size=\"13\" class=\"b\" style=\"fill:#1c8aa6\">Narmada<\/text><text x=\"475\" y=\"140\" text-anchor=\"middle\" font-size=\"13\" class=\"b\" style=\"fill:#1c8aa6\">Tapi<\/text>\n    <text x=\"220\" y=\"200\" text-anchor=\"middle\" font-size=\"11\" class=\"mut\">rift (faults)<\/text><text x=\"475\" y=\"200\" text-anchor=\"middle\" font-size=\"11\" class=\"mut\">rift (faults)<\/text><\/svg>","cap":"Each river runs in a trough where the land sank between two faults — so they flow straight and west, unlike the rest of the peninsula."},{"k":"facts","title":"Narmada in short","rows":[["Length","About 1,312 km — the longest west-flowing river"],["Source → mouth","Amarkantak (MP) → Gulf of Khambhat at Bharuch (Gujarat)"],["Through","Madhya Pradesh, Maharashtra (border), Gujarat"],["Big dams","Indira Sagar (MP), Sardar Sarovar (Gujarat)"],["Movement","Narmada Bachao Andolan (Medha Patkar) against Sardar Sarovar's displacement"]]},{"k":"trick","h":"West-flowers into the Gulf of Khambhat — <b>“NT SaM”<\/b>: <b>N<\/b>armada, <b>T<\/b>api, <b>Sa<\/b>barmati, <b>M<\/b>ahi. Every one of them ends in an <b>estuary<\/b>."},{"k":"trap","h":"The <b>Narmada and Tapi<\/b> flow west but rise in central India — they are <b>not<\/b> Western Ghats rivers. The <b>Luni<\/b> does not reach the sea. <b>Jog Falls<\/b> is on the <b>Sharavathi<\/b>, not the Kaveri."}],"sum":["Narmada (Vindhya–Satpura rift) and Tapi (south of the Satpuras) flow west in rift valleys and end in estuaries.","Narmada, Tapi, Sabarmati and Mahi all reach the Gulf of Khambhat.","Mahi crosses the Tropic of Cancer twice; the Luni ends in the Rann of Kutch.","Short Western Ghats rivers: Mandovi (Dudhsagar), Sharavathi (Jog Falls), Netravati, Periyar (longest in Kerala).","Narmada: Dhuandhar Falls at Bhedaghat; Indira Sagar and Sardar Sarovar dams."],"part":["Part 2 · The peninsular rivers","प्रायद्वीपीय नदियाँ"],"g":"rv"},
{"id":"R8","heat":3,"title":"Dams, waterfalls and river islands","hi":"बाँध, जलप्रपात और नदी द्वीप","blocks":[{"k":"hot","h":"Most asked: <b>dam → river<\/b> (Tehri–Bhagirathi, Bhakra–Sutlej, Hirakud–Mahanadi, Nagarjuna Sagar–Krishna, Sardar Sarovar–Narmada) and <b>waterfall → river<\/b> (Jog–Sharavathi, Chitrakote–Indravati, Hundru–Subarnarekha, Dudhsagar–Mandovi)."},{"k":"story","h":"<p>After independence Nehru called the big dams the <b>'temples of modern India'<\/b>. Bhakra on the Sutlej, Hirakud on the Mahanadi and Nagarjuna Sagar on the Krishna brought irrigation and power; the <b>Damodar Valley Corporation<\/b> (1948) tamed the 'Sorrow of Bengal'. Later dams like <b>Tehri<\/b> and <b>Sardar Sarovar<\/b> sparked protests over the people and forests they flooded.<\/p><p>Waterfalls come where a river drops over hard rock — on the edge of the Western Ghats (Jog, Dudhsagar), the Chota Nagpur plateau (Hundru) or a rift (Dhuandhar).<\/p>"},{"k":"table","title":"Dams and barrages","head":["Dam","River","Note"],"rows":[["Tehri Dam","Bhagirathi","India's highest dam (about 260 m), Uttarakhand."],["Bhakra Dam (Gobind Sagar)","Sutlej","Himachal Pradesh; with Nangal downstream in Punjab."],["Pong Dam (Maharana Pratap Sagar)","Beas","Himachal Pradesh."],["Ranjit Sagar (Thein) Dam","Ravi","Punjab."],["Salal and Baglihar","Chenab","Jammu and Kashmir."],["Hirakud Dam","Mahanadi","Odisha; one of the longest earthen dams in the world (1957)."],["Nagarjuna Sagar Dam","Krishna","Telangana–Andhra Pradesh border."],["Srisailam Dam","Krishna",""],["Almatti Dam","Krishna","Karnataka."],["Tungabhadra Dam","Tungabhadra","At Hosapete, Karnataka."],["Sardar Sarovar Dam","Narmada","Gujarat; the Statue of Unity faces it."],["Indira Sagar Dam","Narmada","Madhya Pradesh — the largest reservoir in India by volume."],["Ukai Dam","Tapi","Gujarat."],["Krishnaraja Sagar Dam","Kaveri","Near Mysuru; Brindavan Gardens."],["Mettur Dam (Stanley Reservoir)","Kaveri","Tamil Nadu."],["Idukki Arch Dam","Periyar","Kerala."],["Rihand Dam (Govind Ballabh Pant Sagar)","Rihand","On the Rihand, a tributary of the Son (UP)."],["Gandhi Sagar Dam","Chambal","Madhya Pradesh."],["Farakka Barrage","Ganga","West Bengal (1975)."],["Polavaram Project","Godavari","Andhra Pradesh."],["Koyna Dam","Koyna","Maharashtra."]]},{"k":"rivermap","title":"The big dams on the map","hl":["Bhagirathi","Sutlej","Beas","Mahanadi","Krishna","Narmada","Tapi","Kaveri","Periyar","Chambal","Godavari","Ganga"],"pins":[["Tehri",78.48,30.38,""],["Bhakra",76.43,31.41,"","l"],["Pong",76,31.97,"","l"],["Hirakud",83.87,21.52,""],["Nagarjuna Sagar",79.31,16.57,""],["Srisailam",78.9,16.09,"","l"],["Sardar Sarovar",73.75,21.83,"","l"],["Indira Sagar",76.47,22.28,""],["Ukai",73.59,21.25,"","l"],["KRS",76.57,12.42,"","l"],["Mettur",77.8,11.8,""],["Idukki",76.97,9.84,"","l"],["Gandhi Sagar",75.55,24.7,"","l"],["Farakka",87.92,24.8,""],["Polavaram",81.65,17.25,""]],"cap":"Tap a river to see what to remember about it.","info":{"Ganga":"Gangotri (as the Bhagirathi) → Bay of Bengal; the longest in India (about 2,525 km); National River.","Yamuna":"Yamunotri → Prayagraj; the Ganga's longest tributary; Delhi, Mathura, Agra.","Indus":"Near Mansarovar → Arabian Sea (Pakistan); flows past Leh; Indus Waters Treaty, 1960.","Jhelum":"Verinag → Srinagar, Wular Lake; Vedic Vitasta.","Chenab":"Chandra + Bhaga at Tandi; Vedic Asikni; Salal and Baglihar dams.","Ravi":"Near Rohtang; Vedic Parushni; Ranjit Sagar dam.","Beas":"Beas Kund → Harike (joins the Sutlej); Vedic Vipasha; Pong dam.","Sutlej":"Rakshastal (Tibet) → enters at Shipki La; Bhakra dam; Vedic Shutudri.","Brahmaputra":"Tsangpo in Tibet, Siang in Arunachal, Brahmaputra in Assam, Jamuna in Bangladesh; Majuli island.","Lohit":"Joins the Siang near Sadiya; Dhola–Sadiya bridge.","Subansiri":"The Brahmaputra's largest tributary.","Manas":"From Bhutan; Manas National Park.","Teesta":"From Sikkim; joins the Brahmaputra in Bangladesh.","Barak":"Manipur hills → Silchar → Meghna (Bangladesh).","Ghaghara":"Karnali in Nepal; Ayodhya on its Saryu stretch; joins near Chhapra.","Gandak":"Narayani in Nepal; joins at Hajipur.","Kosi":"Sapt Kosi from Nepal — the Sorrow of Bihar.","Son":"Amarkantak → joins the Ganga near Patna (right bank).","Gomti":"Lucknow and Jaunpur; joins near Ghazipur.","Ramganga":"From Kumaon; Corbett National Park; joins near Kannauj.","Chambal":"Janapav → Yamuna; ravines, gharials; Kota.","Betwa":"Vindhyas → Yamuna; Orchha.","Ken":"Kaimur hills → Yamuna; Ken–Betwa link.","Damodar":"Sorrow of Bengal; DVC (1948); joins the Hooghly.","Hooghly":"Distributary of the Ganga from Farakka; Kolkata, Haldia.","Bhagirathi":"Gaumukh → Devprayag; Tehri dam.","Alaknanda":"Near Badrinath → Devprayag; the Panch Prayag.","Sharda":"The Kali on the Nepal border; joins the Ghaghara.","Mahanadi":"Sihawa (Chhattisgarh) → Hirakud → Cuttack delta.","Godavari":"Trimbakeshwar → Bay of Bengal; Dakshin Ganga — longest peninsular river.","Krishna":"Mahabaleshwar → Bay of Bengal; Nagarjuna Sagar; Vijayawada.","Kaveri":"Talakaveri → Bay of Bengal; KRS, Mettur; Shivanasamudra.","Tungabhadra":"Tunga + Bhadra at Koodli → Krishna; Hampi.","Bhima":"Bhimashankar → Krishna; Pandharpur.","Indravati":"→ Godavari; Chitrakote Falls.","Wainganga":"→ Pranhita → Godavari.","Musi":"Hyderabad → Krishna.","Kabini":"Wayanad → Kaveri.","Pennar":"Nandi hills → Nellore → Bay of Bengal.","Vaigai":"Madurai → Palk Strait.","Subarnarekha":"Near Ranchi → Hundru Falls → Jamshedpur → Bay of Bengal.","Brahmani":"South Koel + Sankh near Rourkela → Bay of Bengal.","Narmada":"Amarkantak → Gulf of Khambhat (estuary); Vindhya–Satpura rift; Sardar Sarovar.","Tapi":"Multai → Surat; rift south of the Satpuras; Ukai dam.","Mahi":"Crosses the Tropic of Cancer twice → Gulf of Khambhat.","Sabarmati":"Aravallis → Ahmedabad → Gulf of Khambhat.","Luni":"Near Ajmer → Rann of Kutch (never reaches the sea).","Periyar":"Kerala's longest river; Idukki and Mullaperiyar dams.","Sharavathi":"Jog Falls → Arabian Sea at Honnavar."}},{"k":"table","title":"Waterfalls","head":["Waterfall","River","Note"],"rows":[["Jog Falls","Sharavathi","Karnataka — among India's highest plunge waterfalls."],["Dhuandhar Falls","Narmada","Bhedaghat, near Jabalpur."],["Chitrakote Falls","Indravati","Chhattisgarh — the 'Niagara of India'."],["Hundru Falls","Subarnarekha","Near Ranchi, Jharkhand."],["Shivanasamudra Falls","Kaveri","Karnataka."],["Hogenakkal Falls","Kaveri","Tamil Nadu–Karnataka border."],["Athirappilly Falls","Chalakudy","Kerala."],["Dudhsagar Falls","Mandovi","Goa–Karnataka border."],["Gokak Falls","Ghataprabha","Karnataka."],["Kapildhara Falls","Narmada","Amarkantak."],["Duduma Falls","Machkund","Odisha–Andhra Pradesh border."]]},{"k":"photos","title":"Waterfalls in pictures","items":[["Jog_Falls","Jog Falls","Sharavathi"],["Dhuandhar_Falls","Dhuandhar","Narmada"],["Chitrakote_Falls","Chitrakote","Indravati"],["Hundru_Falls","Hundru","Subarnarekha"],["Shivanasamudra_Falls","Shivanasamudra","Kaveri"],["Dudhsagar_Falls","Dudhsagar","Mandovi"],["Athirappilly_Falls","Athirappilly","Chalakudy"],["Hogenakkal_Falls","Hogenakkal","Kaveri"]]},{"k":"photos","title":"Dams in pictures","items":[["Tehri_Dam","Tehri Dam","Bhagirathi"],["Bhakra_Dam","Bhakra Dam","Sutlej"],["Hirakud_Dam","Hirakud Dam","Mahanadi"],["Nagarjuna_Sagar_Dam","Nagarjuna Sagar","Krishna"],["Sardar_Sarovar_Dam","Sardar Sarovar","Narmada"],["Idukki_Dam","Idukki Dam","Periyar"]]},{"k":"trick","h":"The three record dams — <b>“Tall Tehri, Long Hirakud, Big Indira”<\/b>: Tehri the highest, Hirakud the longest (earthen), Indira Sagar the largest reservoir."},{"k":"trap","h":"<b>Bhakra<\/b> is on the <b>Sutlej<\/b> (not the Beas — that is Pong). <b>Rihand<\/b> is on the Rihand, a tributary of the Son. <b>Jog Falls<\/b> is on the <b>Sharavathi<\/b>; <b>Shivanasamudra<\/b> and <b>Hogenakkal<\/b> are on the <b>Kaveri<\/b>."}],"sum":["Tehri (Bhagirathi) — highest dam; Hirakud (Mahanadi) — long earthen dam; Indira Sagar (Narmada) — largest reservoir.","Bhakra–Sutlej, Pong–Beas, Ranjit Sagar–Ravi, Salal–Chenab.","Nagarjuna Sagar and Srisailam on the Krishna; KRS and Mettur on the Kaveri; Ukai on the Tapi.","Jog–Sharavathi, Dhuandhar–Narmada, Chitrakote–Indravati, Hundru–Subarnarekha, Dudhsagar–Mandovi.","Farakka Barrage on the Ganga (1975)."],"part":["Part 3 · Dams, landforms, disputes and links","बाँध, स्थलरूप, विवाद और नदी जोड़"],"g":"rv"},
{"id":"R9","heat":2,"title":"Landforms made by rivers","hi":"नदियों द्वारा बने स्थलरूप","blocks":[{"k":"hot","h":"Most asked: <b>which landform belongs to which stage<\/b> (V-valley and gorge — upper; meander and oxbow lake — middle; delta — mouth), <b>delta vs estuary<\/b>, and <b>drainage patterns<\/b> (dendritic, radial, centripetal, trellis)."},{"k":"story","h":"<p>A river does three jobs: it <b>erodes<\/b>, it <b>carries<\/b> and it <b>deposits<\/b>. In its <b>upper course<\/b>, steep and fast, it cuts down — making <b>V-shaped valleys, gorges, waterfalls and potholes<\/b>. In the <b>middle course<\/b> it swings from side to side in <b>meanders<\/b>; when the neck of a loop is cut through in a flood, the old loop is left as an <b>oxbow lake<\/b>.<\/p><p>In the <b>lower course<\/b>, slow and heavy with silt, it builds <b>floodplains and levees<\/b>, splits into <b>braided channels<\/b> and, at the sea, piles silt into a <b>delta<\/b> — unless strong tides wash it away and leave an <b>estuary<\/b>, as on India's west coast.<\/p>"},{"k":"info","title":"A river from source to sea","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 230\" role=\"img\" aria-label=\"A river from its source to the sea\">\n  <path d=\"M10 40 L120 40 L180 110 L330 150 L520 175 L670 180 L670 225 L10 225 Z\" class=\"s5\"/>\n  <path d=\"M15 45 C60 50 90 60 120 70 C150 85 160 110 190 120 C230 130 250 150 290 150 C320 150 330 135 360 145 C400 160 390 175 430 170 C470 165 480 180 520 180 C560 180 600 185 670 190\" fill=\"none\" stroke=\"#1c8aa6\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n  <path d=\"M15 45 C60 50 90 60 120 70 C150 85 160 110 190 120 C230 130 250 150 290 150 C320 150 330 135 360 145 C400 160 390 175 430 170 C470 165 480 180 520 180 C560 180 600 185 670 190\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.4\" stroke-dasharray=\"2 8\" class=\"rvf\" style=\"animation:rvflow 1.1s linear infinite\"/>\n  <path d=\"M600 190 L640 175 M600 190 L645 196 M600 190 L630 210\" stroke=\"#1c8aa6\" stroke-width=\"2.5\"/>\n  <line x1=\"200\" y1=\"10\" x2=\"200\" y2=\"225\" class=\"grid\" stroke-dasharray=\"4 4\"/><line x1=\"450\" y1=\"10\" x2=\"450\" y2=\"225\" class=\"grid\" stroke-dasharray=\"4 4\"/>\n  <text x=\"100\" y=\"22\" text-anchor=\"middle\" font-size=\"14\" class=\"b\">Upper course<\/text><text x=\"325\" y=\"22\" text-anchor=\"middle\" font-size=\"14\" class=\"b\">Middle course<\/text><text x=\"560\" y=\"22\" text-anchor=\"middle\" font-size=\"14\" class=\"b\">Lower course<\/text>\n  <text x=\"100\" y=\"205\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">steep · cuts down: V-valley, gorge, waterfall<\/text>\n  <text x=\"325\" y=\"205\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">gentler · swings: meanders, oxbow lakes<\/text>\n  <text x=\"560\" y=\"140\" text-anchor=\"middle\" font-size=\"11.5\" class=\"mut\">flat · drops silt: floodplain, delta<\/text><\/svg><\/figure>","cap":"The water (white dashes) runs downhill: it cuts in the upper course, swings in the middle and drops its load near the sea."},{"k":"table","title":"Landforms and where they form","head":["Landform","Where it forms","Note"],"rows":[["V-shaped valley","Upper course — the river cuts down",""],["Gorge","Upper course — the river cuts down","A very deep, narrow valley."],["Waterfall and rapids","Upper course — the river cuts down",""],["Pothole","Upper course — the river cuts down","Pebbles swirl and drill holes in the bed."],["Alluvial fan","Where a hill stream reaches the plain","The river slows and spreads its load like a fan."],["Meander","Middle course — the river swings side to side",""],["Oxbow lake","Middle course — the river swings side to side","A meander cut off from the river."],["Floodplain and levee","Lower course — the river drops its load",""],["Braided channel","Lower course — the river drops its load","Many channels among sandbars."],["Delta","At the mouth — silt builds new land",""],["Estuary","At the mouth — tides scour the silt away",""]]},{"k":"info","title":"How an oxbow lake forms","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 200\" role=\"img\" aria-label=\"How an oxbow lake forms, in three steps\">\n  <rect x=\"14\" y=\"0\" width=\"212\" height=\"160\" rx=\"10\" class=\"card\"/><path d=\"M20 100 C70 100 70 30 120 30 C170 30 170 100 220 100\" fill=\"none\" stroke=\"#1c8aa6\" stroke-width=\"10\" stroke-linecap=\"round\"/><path d=\"M20 100 C70 100 70 30 120 30 C170 30 170 100 220 100\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.5\" stroke-dasharray=\"2 8\" class=\"rvf\" style=\"animation:rvflow 1.1s linear infinite\"/><text x=\"120\" y=\"185\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">1 · A meander<\/text><rect x=\"239\" y=\"0\" width=\"212\" height=\"160\" rx=\"10\" class=\"card\"/><path d=\"M245 100 C295 100 290 20 345 20 C400 20 395 100 445 100\" fill=\"none\" stroke=\"#1c8aa6\" stroke-width=\"10\" stroke-linecap=\"round\"/><path d=\"M300 98 L390 98\" stroke=\"#1c8aa6\" stroke-width=\"3\" stroke-dasharray=\"5 5\"/><text x=\"345\" y=\"125\" text-anchor=\"middle\" font-size=\"11\" class=\"mut\">a flood cuts the neck<\/text><path d=\"M245 100 C295 100 290 20 345 20 C400 20 395 100 445 100\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.5\" stroke-dasharray=\"2 8\" class=\"rvf\" style=\"animation:rvflow 1.1s linear infinite\"/><text x=\"345\" y=\"185\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">2 · The neck narrows<\/text><rect x=\"464\" y=\"0\" width=\"212\" height=\"160\" rx=\"10\" class=\"card\"/><path d=\"M470 100 L670 100\" fill=\"none\" stroke=\"#1c8aa6\" stroke-width=\"10\" stroke-linecap=\"round\"/><path d=\"M530 80 C525 25 615 25 610 80\" fill=\"none\" stroke=\"#5aa7c4\" stroke-width=\"10\" stroke-linecap=\"round\" class=\"anim-in\"/><text x=\"570\" y=\"60\" text-anchor=\"middle\" font-size=\"12\" class=\"b\">oxbow lake<\/text><path d=\"M470 100 L670 100\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.5\" stroke-dasharray=\"2 8\" class=\"rvf\" style=\"animation:rvflow 1.1s linear infinite\"/><text x=\"570\" y=\"185\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">3 · Cut off<\/text><\/svg><\/figure>","cap":"A meander's loop grows until a flood breaks through the narrow neck; the abandoned loop becomes an oxbow lake (Kabartal in Bihar is one)."},{"k":"info","title":"Delta or estuary?","html":"<figure class=\"fig wide\" style=\"--minw:560px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 200\" role=\"img\" aria-label=\"A delta and an estuary\">\n  <rect x=\"10\" y=\"10\" width=\"320\" height=\"170\" rx=\"10\" class=\"s5\"/><rect x=\"10\" y=\"120\" width=\"320\" height=\"60\" fill=\"#5aa7c4\" opacity=\".5\"/>\n  <path d=\"M170 10 L170 80 M170 80 L120 150 M170 80 L170 160 M170 80 L220 150 M170 100 L140 160 M170 100 L200 160\" stroke=\"#1c8aa6\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n  <path d=\"M95 120 Q170 175 245 120 Z\" fill=\"#c9a86a\" opacity=\".85\"/><text x=\"170\" y=\"40\" text-anchor=\"middle\" font-size=\"11\" class=\"mut\">slow river, lots of silt<\/text>\n  <text x=\"170\" y=\"198\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Delta — east coast (Ganga, Godavari, Krishna)<\/text>\n  <rect x=\"350\" y=\"10\" width=\"320\" height=\"170\" rx=\"10\" class=\"s5\"/><rect x=\"350\" y=\"120\" width=\"320\" height=\"60\" fill=\"#5aa7c4\" opacity=\".5\"/>\n  <path d=\"M510 10 L510 60 Q500 95 470 125 L550 125 Q520 95 510 60\" fill=\"#1c8aa6\" opacity=\".9\"/><text x=\"510\" y=\"40\" text-anchor=\"middle\" font-size=\"11\" class=\"mut\">fast river, little silt<\/text>\n  <text x=\"510\" y=\"150\" text-anchor=\"middle\" font-size=\"11\" class=\"mut\">tides carry the silt away<\/text>\n  <text x=\"510\" y=\"198\" text-anchor=\"middle\" font-size=\"13\" class=\"b\">Estuary — west coast (Narmada, Tapi)<\/text><\/svg><\/figure>","cap":"East-coast rivers are slow and silty — they build deltas. West-coast rivers are fast, carry little silt and meet strong tides — they leave estuaries."},{"k":"table","title":"Indian examples","head":["Landform","River","Note"],"rows":[["Gorge of the Indus","Indus","Near Nanga Parbat — one of the deepest gorges."],["Marble Rocks gorge at Bhedaghat","Narmada",""],["Ravines (badlands)","Chambal","Made by gully erosion."],["World's largest river island","Brahmaputra","Majuli."],["World's largest delta","Ganga–Brahmaputra","The Sundarbans."],["Estuary at Bharuch","Narmada",""],["Gandikota canyon — the 'Grand Canyon of India'","Pennar","Andhra Pradesh."],["Kosi mega-fan","Kosi","A huge alluvial fan in north Bihar."],["Braided channel in Assam","Brahmaputra",""]]},{"k":"photos","title":"River landforms in pictures","items":[["Majuli","Majuli","Largest river island"],["Sundarbans","Sundarbans","Largest delta"],["Chambal_River","Chambal ravines","Badlands"],["Bhedaghat","Marble Rocks, Bhedaghat","Narmada gorge"],["Gandikota","Gandikota","Pennar canyon"],["Oxbow_lake","Oxbow lake","A cut-off meander"],["Alluvial_fan","Alluvial fan","Where a stream meets the plain"],["River_delta","Delta","Silt at the mouth"]]},{"k":"table","title":"Drainage patterns","head":["What it looks like","Pattern","Note"],"rows":[["Like the branches of a tree — the Ganga plain","Dendritic",""],["Tributaries meet at right angles in folded hills","Trellis",""],["Rivers run out in all directions from a high centre (Amarkantak)","Radial","Narmada, Son, Mahanadi tributaries."],["Rivers run into a central lake or basin (Loktak, Manipur)","Centripetal",""],["Short rivers run side by side down a slope (Western Ghats)","Parallel",""],["Streams follow joints in hard rock and bend at right angles","Rectangular",""]]},{"k":"info","title":"Drainage patterns","html":"<figure class=\"fig wide\" style=\"--minw:520px;margin:0\"><svg class=\"dg\" viewBox=\"0 0 680 160\" role=\"img\" aria-label=\"Drainage patterns\"><g transform=\"translate(0 0)\"><rect x=\"4\" y=\"4\" width=\"122\" height=\"122\" rx=\"10\" class=\"card\"/><path stroke=\"#1c8aa6\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" d=\"M65 120 L65 70 L40 40 M65 70 L95 35 M65 90 L35 75 M65 95 L100 80 M40 40 L25 22 M40 40 L50 18 M95 35 L110 18\"/><text x=\"65\" y=\"146\" text-anchor=\"middle\" font-size=\"12.5\" class=\"b\">Dendritic<\/text><\/g><g transform=\"translate(136 0)\"><rect x=\"4\" y=\"4\" width=\"122\" height=\"122\" rx=\"10\" class=\"card\"/><path stroke=\"#1c8aa6\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" d=\"M40 15 L40 120 M90 15 L90 120 M40 35 L20 35 M40 60 L20 60 M40 85 L20 85 M90 45 L110 45 M90 70 L110 70 M40 105 L90 105\"/><text x=\"65\" y=\"146\" text-anchor=\"middle\" font-size=\"12.5\" class=\"b\">Trellis<\/text><\/g><g transform=\"translate(272 0)\"><rect x=\"4\" y=\"4\" width=\"122\" height=\"122\" rx=\"10\" class=\"card\"/><circle cx=\"65\" cy=\"65\" r=\"12\" class=\"s2\"/><path stroke=\"#1c8aa6\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" d=\"M79 65 L117 65\"/><path stroke=\"#1c8aa6\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" d=\"M75 75 L102 102\"/><path stroke=\"#1c8aa6\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" d=\"M65 79 L65 117\"/><path stroke=\"#1c8aa6\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" d=\"M55 75 L28 102\"/><path stroke=\"#1c8aa6\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" d=\"M51 65 L13 65\"/><path stroke=\"#1c8aa6\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" d=\"M55 55 L28 28\"/><path stroke=\"#1c8aa6\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" d=\"M65 51 L65 13\"/><path stroke=\"#1c8aa6\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" d=\"M75 55 L102 28\"/><text x=\"65\" y=\"146\" text-anchor=\"middle\" font-size=\"12.5\" class=\"b\">Radial<\/text><\/g><g transform=\"translate(408 0)\"><rect x=\"4\" y=\"4\" width=\"122\" height=\"122\" rx=\"10\" class=\"card\"/><circle cx=\"65\" cy=\"65\" r=\"14\" fill=\"#5aa7c4\"/><path stroke=\"#1c8aa6\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" d=\"M114 83 L81 71\"/><path stroke=\"#1c8aa6\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" d=\"M74 116 L68 82\"/><path stroke=\"#1c8aa6\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" d=\"M25 98 L52 76\"/><path stroke=\"#1c8aa6\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" d=\"M16 47 L49 59\"/><path stroke=\"#1c8aa6\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" d=\"M56 14 L62 48\"/><path stroke=\"#1c8aa6\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" d=\"M105 32 L78 54\"/><text x=\"65\" y=\"146\" text-anchor=\"middle\" font-size=\"12.5\" class=\"b\">Centripetal<\/text><\/g><g transform=\"translate(544 0)\"><rect x=\"4\" y=\"4\" width=\"122\" height=\"122\" rx=\"10\" class=\"card\"/><path stroke=\"#1c8aa6\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" d=\"M20 20 L35 115 M45 20 L60 115 M70 20 L85 115 M95 20 L110 115\"/><text x=\"65\" y=\"146\" text-anchor=\"middle\" font-size=\"12.5\" class=\"b\">Parallel<\/text><\/g><\/svg><\/figure>","cap":"Dendritic — Ganga plain; trellis — folded hills; radial — Amarkantak; centripetal — Loktak; parallel — Western Ghats."},{"k":"trick","h":"Upper, middle, lower — <b>“Cut, Swing, Drop”<\/b>: the river <b>cuts<\/b> (gorge, waterfall), <b>swings<\/b> (meander, oxbow) and <b>drops<\/b> (floodplain, delta)."},{"k":"trap","h":"An <b>oxbow lake<\/b> is made by a river, not a glacier. A <b>U-shaped<\/b> valley is glacial — a river cuts a <b>V<\/b>. The west-coast rivers make <b>estuaries<\/b>, the east-coast rivers <b>deltas<\/b>."}],"sum":["Upper course: V-valley, gorge, waterfall, pothole — erosion.","Middle course: meanders and oxbow lakes.","Lower course: floodplain, levee, braided channel; at the mouth a delta (east coast) or an estuary (west coast).","Examples: Chambal ravines, Majuli island, Sundarbans delta, Gandikota canyon (Pennar), Kosi mega-fan.","Drainage: dendritic (Ganga plain), radial (Amarkantak), centripetal (Loktak), parallel (Western Ghats), trellis."],"part":["Part 3 · Dams, landforms, disputes and links","बाँध, स्थलरूप, विवाद और नदी जोड़"],"g":"rv"},
{"id":"R10","heat":2,"title":"Disputes, river links and waterways","hi":"जल विवाद, नदी जोड़ और जलमार्ग","blocks":[{"k":"hot","h":"Most asked: <b>which states share a dispute<\/b> (Kaveri, Krishna, Narmada, Mahadayi), <b>Article 262<\/b>, the <b>Ken–Betwa link<\/b>, <b>National Waterways 1, 2 and 3<\/b>, and <b>Namami Gange<\/b>."},{"k":"story","h":"<p>Rivers cross state borders, and in a dry year every state wants more water. <b>Article 262<\/b> of the Constitution lets Parliament make laws for inter-state river disputes and keep them away from the courts; under the <b>Inter-State River Water Disputes Act, 1956<\/b> the Centre sets up <b>tribunals<\/b>. The <b>Kaveri<\/b> fight between Karnataka and Tamil Nadu is the most famous.<\/p><p>To move water from surplus rivers to dry ones, India plans to <b>link rivers<\/b> (National Water Development Agency, 1982). The first, the <b>Ken–Betwa link<\/b> in Bundelkhand, began in December 2024. Rivers are also highways: <b>National Waterway 1<\/b> on the Ganga is the longest.<\/p>"},{"k":"table","title":"River disputes","head":["River","States","Note"],"rows":[["Kaveri","Karnataka, Tamil Nadu, Kerala, Puducherry","Tribunal 1990, award 2007, Supreme Court 2018; Cauvery Water Management Authority."],["Krishna","Maharashtra, Karnataka, Telangana, Andhra Pradesh","Krishna Water Disputes Tribunals (1969 and 2004)."],["Godavari","Maharashtra, Telangana, Andhra Pradesh, Karnataka, Madhya Pradesh, Chhattisgarh, Odisha","Tribunal 1969; settled by agreement."],["Narmada","Gujarat, Madhya Pradesh, Maharashtra, Rajasthan","Tribunal 1969, award 1979."],["Mahadayi (Mhadei)","Goa, Karnataka, Maharashtra","Tribunal 2010, award 2018."],["Ravi and Beas","Punjab, Haryana, Rajasthan","Eradi Tribunal, 1986."],["Vansadhara","Andhra Pradesh, Odisha","Tribunal 2010."],["Mahanadi","Odisha, Chhattisgarh","Tribunal 2018."]]},{"k":"table","title":"Links, canals, waterways and missions","head":["Name","What it is","Note"],"rows":[["Ken–Betwa Link","Ken to Betwa (MP and UP)","The first link under the National Perspective Plan; foundation stone December 2024; Daudhan Dam in Panna."],["Pattiseema lift","Godavari to Krishna (Andhra Pradesh)","Commissioned 2015."],["Par–Tapi–Narmada Link","Western Ghats rivers to the Narmada (Gujarat)",""],["Indira Gandhi Canal","From Harike (Sutlej–Beas) into Rajasthan","India's longest canal."],["National Waterway 1","Ganga: Prayagraj to Haldia",""],["National Waterway 2","Brahmaputra: Dhubri to Sadiya",""],["National Waterway 3","West Coast Canal, Kerala: Kollam to Kottapuram",""],["Namami Gange","Cleaning and protecting the Ganga (2014)","Run by the National Mission for Clean Ganga."]]},{"k":"rivermap","title":"River links and national waterways","hl":["Ganga","Hooghly","Brahmaputra","Ken","Betwa","Godavari","Krishna","Yamuna"],"label":["Ken","Betwa","Ganga","Brahmaputra"],"info":{"Ganga":"Gangotri (as the Bhagirathi) → Bay of Bengal; the longest in India (about 2,525 km); National River.","Yamuna":"Yamunotri → Prayagraj; the Ganga's longest tributary; Delhi, Mathura, Agra.","Indus":"Near Mansarovar → Arabian Sea (Pakistan); flows past Leh; Indus Waters Treaty, 1960.","Jhelum":"Verinag → Srinagar, Wular Lake; Vedic Vitasta.","Chenab":"Chandra + Bhaga at Tandi; Vedic Asikni; Salal and Baglihar dams.","Ravi":"Near Rohtang; Vedic Parushni; Ranjit Sagar dam.","Beas":"Beas Kund → Harike (joins the Sutlej); Vedic Vipasha; Pong dam.","Sutlej":"Rakshastal (Tibet) → enters at Shipki La; Bhakra dam; Vedic Shutudri.","Brahmaputra":"Tsangpo in Tibet, Siang in Arunachal, Brahmaputra in Assam, Jamuna in Bangladesh; Majuli island.","Lohit":"Joins the Siang near Sadiya; Dhola–Sadiya bridge.","Subansiri":"The Brahmaputra's largest tributary.","Manas":"From Bhutan; Manas National Park.","Teesta":"From Sikkim; joins the Brahmaputra in Bangladesh.","Barak":"Manipur hills → Silchar → Meghna (Bangladesh).","Ghaghara":"Karnali in Nepal; Ayodhya on its Saryu stretch; joins near Chhapra.","Gandak":"Narayan   const L = labS();

/* ---------- quiz games (60 seconds) ---------- */
function labDeck(id){
  const d = LAB_CONF.decks.find(x => x.id === id);
  const ask = (pre, t) => pre ? `${pre} ${t}${/[?:]$/.test(pre) ? "" : "?"}` : t;
  let items = d.make ? d.make() : d.pairs.map(p => ({ p: ask(d.q, p[0]), a: p[1], note: p[2] || "", raw: p[0], pool: "a" }));
  if (d.rq && !d.make) {   // also ask the other way round, where an answer belongs to one prompt only
    const n = {}; d.pairs.forEach(p => { n[p[1]] = (n[p[1]] || 0) + 1; });
    items = items.concat(d.pairs.filter(p => n[p[1]] === 1).map(p => ({ p: ask(d.rq, p[1]), a: p[0], note: p[2] || "", raw: p[1], pool: "p" })));
  }
  return { d, items };
}
function labIntro(id){

      <p style="margin:0">${L.best[d.id] ? "Your best: <b>" + L.best[d.id] + "</b>" : "First go — no pressure."}</p>

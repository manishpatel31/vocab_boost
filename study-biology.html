<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Biology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: Biology PYQ Workbook — follows the शब्दRegister Paper / Indigo look; one column + bottom tabs on phones, sidebar on PC. */
:root{
  --paper:#f6f3ea; --sheet:#fffdf7; --sunk:#ebe6d8;
  --ink:#1d2a22; --ink2:#56625a; --rule:#dcd5c3;
  --blue:#1f5c3d; --on-blue:#ffffff; --blue-bg:#dcebdf;
  --accent:#b4530f; --accent-bg:#fbe7d3;
  --good:#1b7547; --good-bg:#dff1e6; --bad:#b0271f; --bad-bg:#f8e1de;
  --warn-bg:#fff2d2;
  --f-display:"Fraunces", "Tiro Devanagari Hindi", Georgia, serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#111612; --sheet:#1a211c; --sunk:#222b25;
  --ink:#e8eee9; --ink2:#a3b0a7; --rule:#2f3a33;
  --blue:#86cfa2; --on-blue:#111612; --blue-bg:#1d3a29;
  --accent:#f3a764; --accent-bg:#3b2614;
  --good:#62d098; --good-bg:#15352a; --bad:#ff8f86; --bad-bg:#3d1d1b;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap{border-radius:var(--r);padding:12px 14px 12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.trick .lab,.trap .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.rk div{grid-template-columns:minmax(0,48%) minmax(0,1fr)}
.rk dd{min-width:0;overflow-wrap:anywhere}
.hot{border-radius:var(--r);padding:12px 14px;background:var(--warn-bg,var(--accent-bg));border-left:4px solid var(--warn,var(--accent))}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--warn,var(--accent))}
.heatb{display:inline-block;font-size:11px;letter-spacing:-.1em;margin-left:6px;vertical-align:1px}
.heat{display:flex;flex-direction:column;gap:2px}
.hrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(60px,1fr) 44px;gap:10px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:9px 2px;color:inherit;font:inherit;cursor:pointer}
.hrow:last-child{border-bottom:0}
.hrow .ht{display:flex;flex-direction:column;min-width:0}
.hrow .ht .muted{font-size:12px}
.hbar{height:10px;border-radius:5px;background:var(--rule);overflow:hidden}
.hbar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.hp{text-align:right;font-weight:700}

.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.pyr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pyr div{text-align:center;font-size:13px}
.pyr b{display:block;font-size:14px}
.pm{fill:var(--blue)} .pf{fill:var(--accent)}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.pal button.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.pal button.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.rk{display:grid;gap:0}
.rk div{display:grid;grid-template-columns:minmax(0,48%) 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:15px}
.rk div:first-child{border-top:0}
.rk dt{font-size:13px;color:var(--ink2);margin:0}
.rk dt.up{color:var(--good)} .rk dt.dn{color:var(--bad)}
.rk dd{margin:0;font-weight:600;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:24px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.gbar{display:grid;grid-template-columns:78px 1fr 52px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.gbar .tr{height:12px;background:var(--sunk);border-radius:3px;position:relative;overflow:hidden}
.gbar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:3px}
.gbar .tr i.neg{background:var(--bad)}
.gbar .v{font-family:var(--f-num);text-align:right}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
@media (prefers-reduced-motion: no-preference){ .opt,.chip,.btn{transition:background-color .15s, border-color .15s} }
.link{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px}
.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.icheck{background:var(--sheet);border:1.5px dashed var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.icheck .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.cat{font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px;white-space:nowrap}
.cat.CS{background:var(--blue-bg);color:var(--blue)} .cat.CSS{background:var(--accent-bg);color:var(--accent)} .cat.ST{background:var(--sunk);color:var(--ink)} .cat.OT{background:var(--sunk);color:var(--ink2)}

/* ---- workbook additions ---- */
table.cover td:nth-child(4){min-width:180px}
.plist .dl{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.plist .dl em{font-style:normal;font-weight:700;color:var(--blue);text-align:right}
.ladder{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--rule)}
.ladder li{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--rule)}
.ladder .rk-n{font-size:22px;font-weight:600;color:var(--blue);text-align:right}
.ladder .rk-t{min-width:0}
.ladder .rk-t b{display:block;line-height:1.3}
.ladder .rk-t span{font-size:13px;color:var(--ink2)}
.ladder .rk-d{font-weight:700;font-size:14px;white-space:nowrap}
.ladder li.up .rk-d{color:var(--good)} .ladder li.dn .rk-d{color:var(--bad)}
.ladder small{font-weight:600;color:var(--ink2)}
table.cover td{min-width:90px}
.peek{border:1.5px dashed var(--blue);background:var(--blue-bg);color:var(--blue);border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer;min-height:36px;width:100%}
.pubs{display:grid;gap:12px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.plist li{padding:7px 0;border-top:1px dashed var(--rule);display:grid;gap:1px}
.plist li:first-child{border-top:0}
.plist li span{font-size:13px;color:var(--ink2)}
.seg{scroll-snap-type:x proximity}

  table.cover thead{display:none}

<script>
"use strict";
const LESSONS = [
{ id:"L1", heat:3, title:"Cell: discovery & cell theory", hi:"कोशिका की खोज व कोशिका सिद्धांत", blocks:[
 {k:"hot", h:"<b>The lecturer's #1 topic.</b> “Cell + Plant & Animal Kingdom — these two must never be weak.” SSC asks <b>who discovered what and when</b>: dead cell (Hooke), living cell (Leeuwenhoek), nucleus (Brown), cell theory (Schleiden & Schwann), ‘cells come from cells’ (Virchow). The <b>year</b> often solves a question even when the name is unfamiliar."},
 {k:"tl", title:"Discovery ladder", rows:[["1665","<b>Robert Hooke</b> sees dead cork cells; book <b>Micrographia</b>; names them ‘cells’ (like monks' rooms)"],["1674","<b>Antonie van Leeuwenhoek</b> sees <b>living</b> cells (pond water, plaque) — ‘animalcules’; also described Spirogyra"],["1831","<b>Robert Brown</b> discovers the <b>nucleus</b>"],["1838–39","<b>Schleiden</b> (plants) & <b>Schwann</b> (animals) — <b>cell theory</b>"],["1855","<b>Rudolf Virchow</b> — <i>omnis cellula e cellula</i>: new cells arise from pre-existing cells"],["1931","<b>Knoll & Ruska</b> — electron microscope"]]},
 {k:"trick", h:"<b>“Hooke ne Cork kaata, Leeuwen ne Living dekha.”</b> Hooke = H for <i>Hollow/dead</i> cork; Leeuwenhoek = L for <i>Living</i>. Then <b>S+S</b> (Schleiden + Schwann) built the theory and <b>V</b>irchow added ‘<b>V</b>ansh’ — every cell has a parent cell."},
 {k:"facts", title:"What the cell theory says", rows:[["1","All living organisms are made of cells"],["2","The cell is the <b>basic structural & functional unit of life</b>"],["3 (Virchow)","All new cells arise from pre-existing cells"]]},
 {k:"table", title:"Record-holder cells", head:["Record","Cell"], rows:[["Largest cell (world)","<b>Ostrich egg</b>"],["Largest human cell","<b>Ovum</b> (egg) — visible to the eye"],["Smallest human cell","<b>Sperm</b>"],["Longest cell","<b>Neuron</b> (nerve cell)"],["Smallest cell overall","<b>Mycoplasma</b> (PPLO)"]]},
 {k:"p", h:"<b>Unicellular</b> organisms do everything with one cell — Amoeba, Paramecium, Chlamydomonas, bacteria. <b>Multicellular</b> organisms (plants, animals) divide work among many cells → tissues → organs → systems. <b>Biology</b> = bios (life) + logos (study); <b>Aristotle</b> is the father of biology and zoology, <b>Theophrastus</b> the father of botany."},
 {k:"trap", h:"<b>Hooke's law (springs, F ∝ −x) is physics</b> — same Robert Hooke, different chapter. Don't pick ‘Hooke's law’ for a cell question. And Hooke's cells were <b>dead</b>; only the cell walls were left, so he never saw a nucleus."},
 {k:"link", h:"Leeuwenhoek's ‘animalcules’ are the bacteria and protozoa of L9. Virchow's idea is what cell division (L6) actually does."},
 {k:"q", q:"Who first saw living cells?", o:["Antonie van Leeuwenhoek","Robert Hooke","Robert Brown","Rudolf Virchow"], e:"1674, with his own lenses — pond water, dental plaque."},
 {k:"q", q:"'Omnis cellula e cellula' was given by…", o:["Rudolf Virchow","Schleiden","Schwann","Robert Hooke"], e:"1855 — new cells come only from existing cells."}
], sum:["Hooke 1665 dead cork cells, Micrographia.","Leeuwenhoek 1674 living cells.","Brown 1831 nucleus.","Schleiden & Schwann 1838–39 cell theory.","Virchow 1855 cells from cells.","Largest cell ostrich egg; human largest ovum, smallest sperm; longest neuron."]},

{ id:"L2", heat:2, title:"Cell membrane, cell wall & osmosis", hi:"कोशिका झिल्ली, कोशिका भित्ति, परासरण", blocks:[
 {k:"hot", h:"Asked as <b>‘which is present only in plant cells’</b> (cell wall), <b>‘cell wall of fungi/bacteria is made of…’</b>, and the <b>hypotonic/hypertonic</b> swell-or-shrink question."},
 {k:"table", title:"Membrane vs wall", head:["","Cell (plasma) membrane","Cell wall"], rows:[["Found in","<b>Every</b> cell","Plants, fungi, bacteria (not animals)"],["Living?","Living","Dead"],["Permeability","<b>Selectively (semi-) permeable</b>","Fully permeable"],["Made of","Lipids (phospholipids) + proteins","Plants: <b>cellulose</b> · Fungi: <b>chitin</b> · Bacteria: <b>peptidoglycan</b>"],["Job","Gatekeeper — lets food in, waste out","Helmet — protection & rigidity"]]},
 {k:"trick", h:"<b>Cell wall = plant's helmet.</b> A plant can't dodge a kick, so it gets an extra wall. Animals can run away — no wall needed. Fungus wall: <b>chitin</b> — the same stuff as an insect's shell (‘<b>Ch</b>itin for <b>Ch</b>atri/mushroom’)."},
 {k:"facts", title:"Diffusion vs osmosis", rows:[["Diffusion","Particles move high → low concentration (incense smell, ink in water)"],["Osmosis","<b>Water</b> moves across a <b>semi-permeable membrane</b> from where water is more (dilute) to where it is less (concentrated)"],["Endocytosis","Taking in — phagocytosis (‘cell eating’), pinocytosis (‘cell drinking’)"],["Exocytosis","Throwing out waste"]]},
 {k:"table", title:"Put a cell in a solution", head:["Solution","Water moves","Cell"], rows:[["<b>Hypo</b>tonic (dilute outside)","Into the cell","<b>Swells</b> (may burst — RBC lysis)"],["<b>Hyper</b>tonic (concentrated outside)","Out of the cell","<b>Shrinks</b> (plasmolysis in plants)"],["<b>Iso</b>tonic","No net movement","No change"]]},
 {k:"trick", h:"<b>Hyp-O = Swell like an O</b>; hyp-E-R = sh-R-inks. Salt on raw mango or pickle draws water out — hypertonic. Raisins in water swell — hypotonic."},
 {k:"trap", h:"The lecture said bacterial walls are made of ‘peptin’. The exam word is <b>peptidoglycan (murein)</b>. <b>Pectin</b> is a plant cementing substance (middle lamella) — a planted wrong option."},
 {k:"link", h:"The selectively permeable idea returns in the kidney nephron (L18, ultrafiltration) and root hairs absorbing water (L7). Penicillin (L9) kills bacteria by blocking peptidoglycan wall formation — so it can't touch viruses."},
 {k:"q", q:"Fungal cell wall is made of…", o:["Chitin","Cellulose","Peptidoglycan","Lignin"], e:"Chitin — also the insect exoskeleton material."},
 {k:"q", q:"An RBC kept in a hypotonic solution will…", o:["Swell and may burst","Shrink","Stay the same","Turn blue"], e:"Water enters because the outside is more dilute."}
], sum:["Membrane in all cells; wall only in plants, fungi, bacteria.","Plant wall cellulose; fungi chitin; bacteria peptidoglycan.","Membrane = lipid + protein, selectively permeable.","Osmosis is water movement across a semi-permeable membrane.","Hypotonic swell, hypertonic shrink, isotonic no change."]},

{ id:"L3", heat:2, title:"Nucleus, DNA & chromosomes", hi:"केंद्रक, DNA, गुणसूत्र", blocks:[
 {k:"hot", h:"<b>Brain of the cell</b>, the 46 chromosomes, ATGC base pairing and <b>U replaces T in RNA</b> are the repeat questions. Discoverers: Brown (nucleus), Miescher (DNA), Watson & Crick (double helix)."},
 {k:"facts", title:"Inside the nucleus", rows:[["Nuclear membrane (envelope)","Double membrane with pores"],["Nucleoplasm","Fluid inside the nucleus"],["Nucleolus","Makes <b>ribosomes</b> (rRNA) — the ribosome factory"],["Chromatin","Thread-like DNA + <b>histone</b> proteins; coils into chromosomes when the cell divides"],["Chromosomes (human)","<b>46 = 23 pairs</b> · 22 pairs autosomes + 1 pair sex chromosomes (XX / XY)"]]},
 {k:"table", title:"DNA vs RNA", head:["","DNA","RNA"], rows:[["Sugar","Deoxyribose","Ribose"],["Bases","A, T, G, C","A, <b>U</b>, G, C"],["Strands","Double helix","Usually single"],["Pairing","<b>A=T (2 bonds), G≡C (3 bonds)</b>","A–U, G–C"]]},
 {k:"tl", title:"DNA milestones", rows:[["1869","Friedrich <b>Miescher</b> isolates DNA (‘nuclein’)"],["1882","Walther <b>Flemming</b> describes chromatin & mitosis"],["1944","Avery, MacLeod & McCarty — DNA is the genetic material"],["1953","<b>Watson & Crick</b> — double-helix model"],["1958","Meselson & Stahl — replication is semi-conservative"]]},
 {k:"trick", h:"<b>“AT Ghar Chalo”</b> — A pairs with T, G with C. In RNA <b>U</b>racil takes <b>T</b>hymine's seat: ‘<b>U</b> replaces <b>T</b>’."},
 {k:"trap", h:"The lecture says the nucleolus ‘makes protein’. Strictly, the nucleolus makes <b>ribosomes (rRNA)</b>; the <b>ribosomes</b> then make protein. If both appear as options for ‘site of protein synthesis’, pick <b>ribosome</b>."},
 {k:"link", h:"Replication enzymes (helicase unzips, primase starts, polymerase builds, ligase glues) run in the S-phase of L6. Chromosome errors give Down, Turner and Klinefelter syndromes (L24)."},
 {k:"q", q:"Which base is found in RNA but not in DNA?", o:["Uracil","Thymine","Adenine","Guanine"], e:"Uracil replaces thymine."},
 {k:"q", q:"Chromosomes are made of…", o:["DNA and histone proteins","RNA only","Lipids","Carbohydrates"], e:"Chromatin = DNA wound on histones."}
], sum:["Nucleus = brain of cell; Robert Brown 1831.","Nucleolus makes ribosomes.","Humans 46 chromosomes: 22 pairs autosomes + XX/XY.","DNA: A=T, G≡C; RNA has U.","Miescher DNA 1869; Watson–Crick helix 1953."]},

{ id:"L4", heat:3, title:"Cell organelles & their jobs", hi:"कोशिकांग और उनके कार्य", blocks:[
 {k:"hot", h:"<b>Nickname questions every year</b>: powerhouse, suicide bag, protein factory, post office/traffic police, kitchen. PYQs used exactly these: ‘which makes protein’, ‘suicidal bag’, ‘where is pyruvate made’, ‘packaging and delivery’, ‘which organelle has its own DNA’."},
 {k:"table", title:"Organelle → job → nickname", head:["Organelle","Job","Nickname"], rows:[["Mitochondria","Aerobic respiration; makes <b>ATP</b>; also apoptosis","<b>Powerhouse</b> of the cell"],["Ribosome","<b>Protein synthesis</b> (Palade)","Protein factory"],["Rough ER","Has ribosomes → proteins","—"],["Smooth ER","Fats & lipids, <b>detoxification</b> (cytochrome P450)","—"],["Golgi apparatus","Modifies, <b>packages & dispatches</b>; makes lysosomes (Camillo Golgi)","Post office / traffic police"],["Lysosome","Digests waste, worn-out parts; can burst and kill the cell","<b>Suicide bag</b>"],["Centrosome","Two centrioles; forms spindle in <b>animal</b> cell division","Microtubule-organising centre"],["Vacuole","Storage, turgidity (big in plants)","Storage sac"],["Peroxisome","Breaks fatty acids, detoxifies H₂O₂","—"],["Cytoskeleton","Shape, support, movement","Cell's skeleton"]]},
 {k:"trick", h:"<b>“Mitochondria = Main power, Lysosome = Lethal, Ribosome = Roti (protein) maker, Golgi = Gali ka postman.”</b> ER is the road network: <b>Rough</b> road has ribosome pebbles; <b>Smooth</b> road makes <b>S</b>moothening fats."},
 {k:"facts", title:"Must-know details", rows:[["Glucose → pyruvate","In the <b>cytoplasm</b> (glycolysis) · C₆H₁₂O₆ → 2 C₃H₄O₃"],["Pyruvate → ATP","In <b>mitochondria</b>; inner folds = <b>cristae</b>"],["Own DNA & ribosomes","<b>Mitochondria and chloroplasts</b> (semi-autonomous)"],["Ribosome discovered by","<b>George Palade</b> (1955)"],["Golgi discovered by","<b>Camillo Golgi</b> (1898)"],["Golgi faces","<b>Cis</b> (forming) faces ER/nucleus; <b>trans</b> (maturing) faces the membrane — ‘<b>trans</b> = <b>trans</b>port out’"],["Centriole structure","9 triplets of microtubules (9+0)"]]},
 {k:"trap", h:"The second lecture said the centrosome ‘sends food to the daughter cell through tubes’. That is <b>not</b> its job. The centrosome's centrioles organise the <b>spindle fibres</b> that pull chromosomes apart during cell division."},
 {k:"trap", h:"SSC accepted <b>“fat, lipid & detoxification”</b> for ‘function of endoplasmic reticulum’ when rough/smooth wasn't specified — the lecturer's tip. But if protein synthesis and ribosome are both options for ‘protein factory’, choose ribosome."},
 {k:"link", h:"The ATP of mitochondria is what respiration (L16) is all about. Cristae/Stroma/Grana are the three ‘inner folds’ words SSC mixes up — grana and stroma are in chloroplasts (L5, L21 photosynthesis)."},
 {k:"q", q:"Which organelle is called the suicidal bag of the cell?", o:["Lysosome","Ribosome","Golgi body","Mitochondria"], e:"Its hydrolytic enzymes can digest the cell itself."},
 {k:"q", q:"Which organelle packages and dispatches materials?", o:["Golgi apparatus","Mitochondria","Ribosome","Nucleolus"], e:"Post office / traffic police of the cell."},
 {k:"q", q:"Glucose is broken to pyruvate in the…", o:["Cytoplasm","Mitochondria","Nucleus","Golgi body"], e:"Glycolysis happens in the cytoplasm; pyruvate then enters mitochondria."}
], sum:["Mitochondria powerhouse, ATP, own DNA.","Ribosome protein factory (Palade).","RER protein; SER lipids & detox.","Golgi packaging (Camillo Golgi).","Lysosome suicide bag.","Centrosome spindle in animal cells.","Glycolysis in cytoplasm."]},

{ id:"L5", heat:3, title:"Plastids, plant vs animal, prokaryote vs eukaryote", hi:"लवक, पादप–जंतु कोशिका, प्रोकैरियोट–यूकैरियोट", blocks:[
 {k:"hot", h:"<b>“Present only in plant cell”</b> (cell wall, plastids, large vacuole) and <b>“which plastid stores starch/oil/protein”</b> are classic. Prokaryote examples: bacteria and <b>blue-green algae (cyanobacteria)</b>."},
 {k:"table", title:"Plastids — the plant's bags", head:["Plastid","Pigment / content","Job"], rows:[["<b>Chloro</b>plast","Chlorophyll (green, has <b>Mg</b>)","Photosynthesis — light → chemical energy (glucose)"],["<b>Chromo</b>plast","Carotenoids (red, yellow, orange)","Colour of tomato, carrot, papaya, petals"],["<b>Leuco</b>plast","Colourless","Storage"],["→ Amyloplast","Starch","Potato, rice"],["→ Elaioplast","Oil & fats","Oilseeds"],["→ Aleuroplast (proteinoplast)","Protein","Pulses"]]},
 {k:"trick", h:"<b>Chroma = colour</b> (Google Chrome's colours). <b>Leuco = white/colourless</b> (leucocyte = white blood cell). Leucoplast store-room: <b>A</b>mylo = <b>A</b>ata (starch), <b>E</b>laio = <b>E</b>l (oil), <b>A</b>leuro/<b>P</b>roteino = <b>P</b>rotein."},
 {k:"table", title:"Plant cell vs animal cell", head:["Feature","Plant","Animal"], rows:[["Cell wall","Present (cellulose)","Absent"],["Plastids","Present","Absent"],["Vacuole","One <b>large central</b> (50–90%)","Small, temporary, many"],["Centrosome","Absent (higher plants)","Present"],["Lysosome","Rare","Present"],["Shape & size","Fixed, larger","Irregular, smaller"]]},
 {k:"table", title:"Prokaryote vs eukaryote", head:["","Prokaryote","Eukaryote"], rows:[["Nucleus","<b>No true nucleus</b> (nucleoid)","True nucleus with membrane"],["Membrane-bound organelles","Absent","Present"],["Ribosomes","70S","80S (70S in mitochondria/chloroplast)"],["Common to both","Cell membrane, cytoplasm, ribosomes, DNA","—"],["Examples","Bacteria, <b>cyanobacteria (blue-green algae)</b>, Mycoplasma","Plants, animals, fungi, protists"]]},
 {k:"trick", h:"<b>Pro = ‘Pro max’ minimalist — no nucleus.</b> <b>Eu = true</b> nucleus. Karyon = nucleus. (Syncaryon = two nuclei fused into one.)"},
 {k:"trap", h:"The second lecture filed groundnut under the protein bag. Groundnut is an <b>oilseed</b> — its oil is stored in <b>elaioplasts</b>. For ‘which stores protein’, the answer is <b>aleuroplast (proteinoplast)</b>, not groundnut."},
 {k:"link", h:"Chlorophyll's Mg and the light/dark reactions of chloroplast are in L21. Blue-green algae fix nitrogen in paddy fields — they are Monera, not Plantae (L9)."},
 {k:"q", q:"Which plastid stores starch?", o:["Amyloplast","Chromoplast","Elaioplast","Chloroplast"], e:"Leucoplast type; potato is full of amyloplasts."},
 {k:"q", q:"Which is a prokaryote?", o:["Blue-green algae","Amoeba","Yeast","Spirogyra"], e:"Cyanobacteria have no true nucleus."}
], sum:["Chloroplast (chlorophyll, Mg) photosynthesis.","Chromoplast carotenoids = colour.","Leucoplast storage: amylo starch, elaio oil, aleuro protein.","Only plant: wall, plastids, big vacuole; only animal: centrosome.","Prokaryotes: bacteria & blue-green algae, no true nucleus."]},

{ id:"L6", heat:2, title:"Cell division & cell cycle", hi:"कोशिका विभाजन व कोशिका चक्र", blocks:[
 {k:"hot", h:"Mitosis vs meiosis (number of daughter cells, diploid vs haploid) and the <b>S-phase = DNA replication</b> question."},
 {k:"table", title:"Mitosis vs meiosis", head:["","Mitosis","Meiosis"], rows:[["Where","Somatic (body) cells","Germ cells (gamete formation)"],["Daughter cells","<b>2</b>","<b>4</b>"],["Chromosome number","Same — <b>diploid (2n)</b>","Halved — <b>haploid (n)</b>"],["Purpose","Growth, repair","Sexual reproduction, variation"]]},
 {k:"tl", title:"Cell cycle: G1 → S → G2 → M", rows:[["G1","Cell grows"],["S","<b>DNA synthesis / replication</b>"],["G2","Preparation for division"],["M","Mitosis (division)"]]},
 {k:"facts", title:"Replication enzymes", rows:[["Helicase","Unwinds/unzips the helix"],["Primase","Lays the primer — starts"],["DNA polymerase","Builds the new strand"],["Ligase","<b>Glue</b> — joins fragments (phosphodiester bonds)"]]},
 {k:"trick", h:"<b>Mi-T-osis = Two</b> cells; <b>Mei-osis = ‘Mei 4’</b> cells, half chromosomes. Ligase = ‘<b>L</b>ai glue’."},
 {k:"link", h:"Meiosis halves chromosomes so that fertilisation (L22) restores 46. Its pairing and separation is Mendel's law of segregation (L23)."},
 {k:"q", q:"Meiosis produces…", o:["Four haploid cells","Two diploid cells","Two haploid cells","Four diploid cells"], e:"Reduction division for gametes."}
], sum:["Mitosis 2 diploid, body cells.","Meiosis 4 haploid, gametes.","S phase = DNA replication.","Helicase unzips, ligase glues."]},

{ id:"L7", heat:2, title:"Plant tissues", hi:"पादप ऊतक", blocks:[
 {k:"hot", h:"Xylem vs phloem, which tissue is dead, <b>aerenchyma helps floating</b>, intercalary/lateral meristem, transpiration vs guttation."},
 {k:"table", title:"Meristem — dividing tissue (no vacuoles, dense cytoplasm, no intercellular spaces)", head:["Type","Where","Effect"], rows:[["Apical","Tips of root & shoot","<b>Length</b>"],["Intercalary","Base of leaves/internodes (grasses)","Regrowth of grazed grass"],["Lateral (cambium)","Sides","<b>Girth</b> (thickness)"]]},
 {k:"table", title:"Simple permanent tissues", head:["Tissue","Feature","Job"], rows:[["Parenchyma","Living, thin walls, intercellular spaces","Storage; <b>chlorenchyma</b> photosynthesis; <b>aerenchyma</b> buoyancy (lotus)"],["Collenchyma","Living, thickened at <b>corners</b>","<b>Flexibility</b> (leaf stalks, stems)"],["Sclerenchyma","<b>Dead</b>, lignin walls","Hardness — coconut husk, seed coats"]]},
 {k:"table", title:"Complex tissues: xylem vs phloem", head:["","Xylem","Phloem"], rows:[["Carries","Water & minerals","Food (sugar)"],["Direction","One way, <b>up</b> from roots","<b>Both ways</b>"],["Parts","Tracheids, vessels, xylem parenchyma, xylem fibres","<b>Sieve tubes</b>, companion cells, phloem parenchyma, phloem fibres"],["Living part","Only xylem parenchyma","All except phloem fibres"]]},
 {k:"trick", h:"<b>Parenchyma is always living, fibre is always dead</b> — in both xylem and phloem. If an option has the word <b>sieve</b>, it's phloem. <b>X</b>ylem = e<b>X</b>port water up; <b>Ph</b>loem = <b>F</b>ood."},
 {k:"facts", title:"Water loss", rows:[["Transpiration","Water vapour lost through <b>stomata</b> (guard cells), mainly by day"],["Guttation","Liquid drops lost through <b>hydathodes</b> at leaf margins, at night/early morning"],["Cuticle","Waxy layer; thick in desert plants to cut water loss"],["Root hairs","Increase surface for water absorption"]]},
 {k:"trap", h:"The lecture placed intercalary meristem in ‘tendrils’. Intercalary meristem sits at the <b>base of leaves and internodes</b> — that is why grass grows back after cutting."},
 {k:"link", h:"Lignin-hard sclerenchyma vs living parenchyma mirrors bone vs cartilage in animals (L8). Stomata close under stress through abscisic acid (L21)."},
 {k:"q", q:"Which tissue helps aquatic plants like lotus float?", o:["Aerenchyma","Sclerenchyma","Collenchyma","Xylem"], e:"Parenchyma with large air spaces."},
 {k:"q", q:"Food is transported in plants by…", o:["Phloem","Xylem","Sclerenchyma","Cambium"], e:"Phloem moves sugar both ways."}
], sum:["Apical = length, lateral = girth, intercalary = grass regrowth.","Parenchyma storage; aerenchyma floating; collenchyma flexibility; sclerenchyma dead & hard.","Xylem water up; phloem food both ways.","Transpiration stomata; guttation hydathodes."]},

{ id:"L8", heat:3, title:"Animal tissues, blood & neuron", hi:"जंतु ऊतक, रक्त, तंत्रिका कोशिका", blocks:[
 {k:"hot", h:"Very frequent: <b>tendon vs ligament</b>, <b>voluntary vs involuntary muscle</b>, blood components (RBC lifespan, platelets clot, haemoglobin = iron), <b>universal donor/recipient</b>, Landsteiner and Harvey, 206 bones."},
 {k:"table", title:"Epithelium — the lining tissue", head:["Type","Where"], rows:[["Squamous (flat)","Mouth lining, oesophagus, alveoli, blood vessels"],["Stratified squamous","<b>Skin</b> (layers)"],["Cuboidal","Kidney tubules, salivary & sweat ducts"],["Columnar","Stomach & intestine (absorption)"],["Ciliated","Respiratory tract (push mucus), <b>fallopian tube</b> (move the egg)"]]},
 {k:"table", title:"Three muscles", head:["","Skeletal (striated)","Smooth","Cardiac"], rows:[["Control","<b>Voluntary</b>","Involuntary","Involuntary"],["Stripes","Yes","No","Yes"],["Nuclei","<b>Multi</b>nucleate","One","One"],["Branched","No","No","<b>Yes</b>"],["Where","Biceps, limbs","Gut, iris, bladder","Heart"]]},
 {k:"trick", h:"<b>“Dil ke taar sab se jude”</b> — cardiac muscle is the only <b>branched</b> one. <b>MTV</b> → <b>M</b>uscle to <b>B</b>one = <b>T</b>endon (MTB); bone to bone = <b>L</b>igament. Muscle contraction–relaxation needs <b>Ca²⁺ and Mg²⁺</b>."},
 {k:"facts", title:"Connective tissue", rows:[["Adipose","Fat storage, insulation"],["Cartilage","Flexible — nose tip, ear <b>pinna</b>, rings of trachea, joints"],["Bone","Hard matrix of <b>calcium & phosphorus</b>; adult <b>206</b> bones, newborn ~300"],["Blood & lymph","Fluid connective tissues; lymph is colourless (no haemoglobin)"]]},

 {k:"trap", h:"<b>Gall bladder stores bile, the liver secretes it.</b> And herbivores have a <b>longer</b> small intestine than carnivores — cellulose needs time and gut bacteria."},
 {k:"link", h:"RBC breakdown gives bilirubin → yellow bile and yellow stool; urine yellow is urochrome (L18). Insulin and glucagon from the same pancreas are in L20."},
 {k:"q", q:"Bile is secreted by…", o:["Liver","Gall bladder","Pancreas","Stomach"], e:"Stored in the gall bladder, made in the liver."},
 {k:"q", q:"Which enzyme needs HCl to be active?", o:["Pepsin","Trypsin","Amylase","Lipase"], e:"Pepsinogen → pepsin in acid."},
 {k:"q", q:"Finger-like projections in the small intestine are called…", o:["Villi","Rugae","Cilia","Alveoli"], e:"Increase surface for absorption (CHSL 2020)."}
], sum:["Saliva amylase: starch → maltose.","Stomach HCl + pepsin (protein).","Bile emulsifies fat; trypsin, lipase from pancreas.","Villi absorb; colon absorbs water.","Liver largest gland; gall bladder stores bile; pancreas mixed gland.","32 teeth; enamel hardest."]}

 {k:"table", title:"Endocrine vs exocrine", head:["","Endocrine","Exocrine"], rows:[["Duct","<b>Ductless</b> — straight into blood","Through ducts"],["Examples","Pituitary, thyroid, adrenal, pineal","Sweat, tear, salivary, milk glands"],["Both (mixed)","<b>Pancreas</b> (also testes, ovaries)","—"]]},
 {k:"table", title:"Gland → hormone → job", head:["Gland","Hormone","Job / disorder"], rows:[["Hypothalamus","GnRH (release), somatostatin (stop)","Controls pituitary — the ‘godfather’"],["Pituitary (anterior)","<b>GH</b>","Growth · excess: gigantism/acromegaly · lack: dwarfism"],["","<b>Prolactin</b>","<b>Makes</b> milk"],["","TSH, ACTH","Order thyroid / adrenal cortex"],["","LH, FSH (gonadotropins)","Sperm & egg production"],["","MSH","Melanin → skin colour (tanning)"],["Pituitary (posterior)","<b>Oxytocin</b>","Milk <b>ejection</b>, labour contractions — ‘love hormone’"],["","<b>Vasopressin (ADH)</b>","Water reabsorption · lack: diabetes insipidus"],["Pineal","<b>Melatonin</b>","Sleep, body clock (dark → more)"],["Thyroid (largest endocrine, butterfly)","T3, T4 (thyroxine — needs <b>iodine</b>), calcitonin","Metabolism · iodine lack: goitre"],["Parathyroid","PTH","Raises blood <b>calcium</b>"],["Thymus","Thymosin","T-lymphocytes; shrinks after puberty"],["Adrenal cortex","Cortisol, aldosterone, sex steroids","Lack: <b>Addison's disease</b>"],["Adrenal medulla","<b>Adrenaline & noradrenaline</b>","<b>Fight or flight</b> — emergency hormone"],["Pancreas (islets of Langerhans)","α: <b>glucagon</b> · β: <b>insulin</b>","Glucagon raises sugar; insulin lowers it · lack: diabetes mellitus"],["Testes","Testosterone","Male traits"],["Ovaries","Oestrogen, progesterone","Female traits; progesterone = pregnancy hormone"],["Heart / kidney","ANF / erythropoietin","Lowers BP / more RBCs"],["Stomach & gut","Gastrin, secretin, CCK, GIP, <b>ghrelin</b>","Ghrelin = <b>hunger hormone</b>"]]},

 {k:"trap", h:"The second lecture filed serotonin under the adrenal cortex and called goitre ‘hyperthyroidism’. <b>Serotonin</b> is made mostly in the <b>gut and brain neurons</b> (pineal turns it into melatonin). <b>Simple goitre comes from iodine deficiency</b>, i.e. too little thyroxine; overactive thyroid is Graves' disease."},

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hash = s => { let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5)+h + s.charCodeAt(i))|0; return "q"+(h>>>0).toString(36); };
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; };
const L = id => LESSONS.find(l => l.id === id);
const LNUM = id => LESSONS.findIndex(l => l.id === id) + 1;

const QS = QB.map(r => {
  const fixed = !!r[6];
  return { t:r[0], q:r[1], o:r[2], e:r[3], p:(r[4]||"").includes("p"), a: fixed ? (r[5]||0) : 0, fixed, id:hash(r[1]) };
});
const byLesson = id => QS.filter(q => q.t === id);
// order of options to show: array of original indexes
const makePerm = q => q.fixed ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i));

const KEY = APP.key;
let S = { ans:{}, bm:{}, les:{}, mocks:[] };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const record = (q, ok) => { S.ans[q.id] = ok ? 1 : 0; save(); renderTop(); };

function renderTop(){
  const ids = Object.keys(S.ans).filter(k => QS.some(q => q.id === k));
  const right = ids.filter(k => S.ans[k] === 1).length;
  const pct = ids.length ? Math.round(right*100/ids.length) : 0;
  $("#topstat").innerHTML = `<b>${ids.length}</b>/${QS.length} tried<br><b>${pct}%</b> right now`;
}

      ${nextIdx>=0 ? `<button class="btn pri sm" type="button" data-open="${LESSONS[nextIdx].id}">${done? "Continue" : "Start"}: Lesson ${nextIdx+1}</button>` : `<span class="muted" style="font-size:13px">All lessons done. Try a mock test.</span>`}</div>

        <span class="t"><b>${esc(l.title)}<span class="heatb" title="Exam frequency">${"🔥".repeat(l.heat||1)}</span></b><span>${l.hi} · ${n} questions</span></span>
        <span class="sc">${st.best!=null ? `best<br>${st.best}/${n}` : ""}</span></button>`;}).join("")}
    </div>

function blockHTML(b){
  if (b.k==="p") return `<div class="plain"><p>${b.h}</p></div>`;
  if (b.k==="trick") return `<div class="trick"><span class="lab">Trick</span>${b.h}</div>`;
  if (b.k==="link") return `<div class="link"><span class="lab">Link · connect the dots</span>${b.h}</div>`;
  if (b.k==="q") { const perm = shuffle(b.o.map((_,i)=>i)); return `<div class="icheck" data-ic><span class="lab">Quick check</span><p class="qt">${esc(b.q)}</p><div class="opts">${perm.map((oi,k)=>`<button type="button" class="opt" data-ioi="${oi}"><span class="k">${"ABCD"[k]}</span><span>${esc(b.o[oi])}</span></button>`).join("")}</div><div class="exp" hidden><b class="okl"></b> ${esc(b.e)}</div></div>`; }
  if (b.k==="hot") return `<div class="hot"><span class="lab">🔥 Exam radar · how often it's asked</span>${b.h}</div>`;
  if (b.k==="trap") return `<div class="trap"><span class="lab">Trap · correction</span>${b.h}</div>`;
  if (b.k==="facts") return `<div class="block"><h3>${b.title}</h3><dl class="facts">${b.rows.map(r=>`<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join("")}</dl></div>`;
  if (b.k==="tl") return `<div class="block"><h3>${b.title}</h3><ul class="tl">${b.rows.map(r=>`<li><span class="y">${r[0]}</span><span>${r[1]}</span></li>`).join("")}</ul></div>`;
  if (b.k==="table") {
    const isNum = (ci) => b.numcol==="all" ? ci>0 : (b.numcol===1 && ci===1) || (typeof b.numcol==="string" && b.numcol.includes(String(ci)));
    return `<div class="block"><h3>${b.title}</h3><div class="tbl"><table><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map((c,ci)=>`<td class="${isNum(ci)?"n":""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  }
  if (b.k==="fig") return `<div class="block"><h3>${b.title}</h3><figure class="fig">${b.svg}<figcaption>${b.cap}</figcaption></figure></div>`;
  if (b.k==="pyr") return `<div class="block"><h3>${b.title}</h3><div class="pyr">${b.items.map(it=>`<div>${PYR(it.rows)}<b>${it.name}</b><span class="muted">${it.note}</span></div>`).join("")}</div><p class="muted" style="font-size:13px;margin-top:8px"><span style="color:var(--blue)">■</span> males · <span style="color:var(--accent)">■</span> females · top = old, base = young</p></div>`;
  return "";
}

let LQ = null;
function openLesson(id, step){
  const l = L(id), i = LNUM(id);
  if (step === "quiz") { LQ = { id, list: shuffle(byLesson(id)).map(q => ({q, perm:makePerm(q)})), i:0, score:0, picked:null }; }
  const head = `<div class="lhead"><button class="back" type="button" id="lback">‹ Lessons</button></div>
    <span class="eyebrow">Lesson ${i} of ${LESSONS.length} · ${l.hi}</span><h1>${esc(l.title)}</h1>
    <div class="steps" role="tablist">
      <button type="button" data-step="learn" aria-current="${step==="learn"?"step":"false"}">1 · Learn</button>
      <button type="button" data-step="quiz" aria-current="${step==="quiz"?"step":"false"}">2 · Quiz</button>
      <button type="button" data-step="sum" aria-current="${step==="sum"?"step":"false"}">3 · Summary</button>
    </div>`;
  let body = "";
  if (step === "learn") {
    body = `<div class="stack">${l.blocks.map(blockHTML).join("")}
      <div class="row end"><button class="btn pri" type="button" id="toquiz">Take the lesson quiz · ${byLesson(id).length} questions</button></div></div>`;
  } else if (step === "quiz") {
    body = `<div id="lq"></div>`;
  } else {
    const nxt = LESSONS[i];
    body = `<div class="stack"><div class="block"><h3>Remember these</h3><ul class="sum">${l.sum.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
      <div class="row between"><button class="btn" type="button" id="relearn">Read again</button>
      ${nxt ? `<button class="btn pri" type="button" id="nextles">Next: ${esc(nxt.title)}</button>` : `<button class="btn pri" type="button" id="tomock">Take a mock test</button>`}</div></div>`;
    S.les[id] = Object.assign(S.les[id]||{}, {done:1}); save();
  }
  $("#app").innerHTML = `<section class="view stack">${head}${body}</section>`;
  $("#lback").onclick = () => renderLearn();
  $("#app").querySelectorAll("[data-step]").forEach(b => b.onclick = () => openLesson(id, b.dataset.step));
  if (step==="learn") { $("#toquiz").onclick = () => openLesson(id,"quiz");
    const ics = l.blocks.filter(b=>b.k==="q");
    $("#app").querySelectorAll("[data-ic]").forEach((box,n) => { const b = ics[n];
      box.querySelectorAll("[data-ioi]").forEach(btn => btn.onclick = () => {
        if (box.dataset.done) return; box.dataset.done = 1; const pick = +btn.dataset.ioi;
        box.querySelectorAll("[data-ioi]").forEach(x => { const oi=+x.dataset.ioi; x.disabled = true; if (oi===0) x.classList.add("ok"); else if (oi===pick) x.classList.add("no"); });
        const ex = box.querySelector(".exp"); ex.hidden = false; const lab = ex.querySelector("b");
        if (pick===0) { lab.textContent = "Correct."; } else { lab.className = "nol"; lab.textContent = "Answer: " + b.o[0] + "."; }
      }); }); }
  if (step==="quiz") renderLQ();
  if (step==="sum") {
    $("#relearn").onclick = () => openLesson(id,"learn");
    const n = $("#nextles"); if (n) n.onclick = () => openLesson(LESSONS[i].id,"learn");
    const m = $("#tomock"); if (m) m.onclick = () => go("mock");
  }
  window.scrollTo(0,0);
}

function optsHTML(q, perm, state){
  // state: {picked: originalIndex|null, reveal: bool, sel: originalIndex|null}
  return perm.map((oi, k) => {
    let cls = "opt";
    if (state.reveal) { if (oi === q.a) cls += " ok"; else if (oi === state.picked) cls += " no"; }
    else if (state.sel === oi) cls += " sel";
    return `<button type="button" class="${cls}" data-oi="${oi}" ${state.reveal?"disabled":""}><span class="k">${"ABCD"[k]}</span><span>${esc(q.o[oi])}</span></button>`;
  }).join("");
}
function expHTML(q, picked){
  const ok = picked === q.a;
  return `<div class="exp">${ok ? `<b class="okl">Correct.</b>` : `<b class="nol">Answer: ${esc(q.o[q.a])}.</b>`} ${esc(q.e)}</div>`;
}
function metaHTML(q, no){
  return `<div class="qmeta"><span class="qno">${no}</span><span class="tag">L${LNUM(q.t)} · ${esc(L(q.t).title)}</span>${q.p?`<span class="tag pyq">High-yield</span>`:""}
  <button type="button" class="bm" data-bm="${q.id}" aria-pressed="${S.bm[q.id]?"true":"false"}" aria-label="Bookmark">${S.bm[q.id]?"★":"☆"}</button></div>`;
}

function renderLQ(){
  const box = $("#lq");
  if (LQ.i >= LQ.list.length) {
    const n = LQ.list.length, l = L(LQ.id);
    const st = S.les[LQ.id] || {}; st.best = Math.max(st.best||0, LQ.score); S.les[LQ.id] = st; save();
    box.innerHTML = `<div class="stack"><div class="block stack"><span class="eyebrow">Quiz done</span>
      <div class="scorebig"><span class="num">${LQ.score}</span><span class="muted">/ ${n} correct</span></div>
      <p class="muted">${LQ.score===n ? "Full marks." : LQ.score >= n*0.8 ? "Strong. Review the ones you missed in Practice → Mistakes." : "Read the lesson once more, then retry. Missed questions are saved under Practice → Mistakes."}</p></div>
      <div class="row between"><button class="btn" type="button" id="retry">Retry quiz</button><button class="btn pri" type="button" id="tosum">See summary</button></div></div>`;
    $("#retry").onclick = () => openLesson(LQ.id,"quiz");
    $("#tosum").onclick = () => openLesson(LQ.id,"sum");
    return;
  }
  const it = LQ.list[LQ.i], q = it.q;
  const reveal = LQ.picked !== null;
  box.innerHTML = `<div class="stack"><div class="meter"><i style="width:${LQ.i/LQ.list.length*100}%"></i></div>
    <article class="qcard">${metaHTML(q, `Q${LQ.i+1}/${LQ.list.length}`)}

    ${reveal ? expHTML(q, LQ.picked) : ""}</article>
    ${reveal ? `<div class="row end"><button class="btn pri" type="button" id="lqnext">${LQ.i+1 < LQ.list.length ? "Next question" : "Finish"}</button></div>` : `<p class="muted" style="font-size:13px">Score so far: <span class="num">${LQ.score}</span></p>`}</div>`;

    if (LQ.picked !== null) return;
    LQ.picked = +b.dataset.oi; const ok = LQ.picked === q.a; if (ok) LQ.score++; record(q, ok); renderLQ();
  });
  bindBM(box);
  const nx = $("#lqnext"); if (nx) nx.onclick = () => { LQ.i++; LQ.picked = null; renderLQ(); window.scrollTo(0,0); };
}

function bindBM(root){
  root.querySelectorAll("[data-bm]").forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    const id = b.dataset.bm; if (S.bm[id]) delete S.bm[id]; else S.bm[id] = 1; save();
    b.setAttribute("aria-pressed", S.bm[id] ? "true":"false"); b.textContent = S.bm[id] ? "★" : "☆";
  });
}

let PF = "all", PSHOW = 20, PORDER = null, PPERM = {}, PPICK = {};
function practiceList(){
  let list = QS;
  if (PF === "pyq") list = QS.filter(q => q.p);
  else if (PF === "hot") list = QS.filter(q => (L(q.t).heat||1) === 3);
  else if (PF === "wrong") list = QS.filter(q => S.ans[q.id] === 0);
  else if (PF === "new") list = QS.filter(q => S.ans[q.id] === undefined);
  else if (PF === "bm") list = QS.filter(q => S.bm[q.id]);
  else if (PF !== "all") list = QS.filter(q => q.t === PF);
  if (PORDER) { const pos = new Map(PORDER.map((id,i)=>[id,i])); list = list.slice().sort((a,b)=>(pos.get(a.id)??0)-(pos.get(b.id)??0)); }
  return list;
}

  const list = practiceList();

function pCard(q, idx){

function bindP(box){ box.querySelectorAll(".qcard").forEach(bindCard); }
function bindCard(card){
  card.querySelectorAll(".opt").forEach(b => b.onclick = () => {

    </button>
    <div class="row between"><button class="btn" type="button" id="fca" ${FC.flip?"":"disabled"}>Again later</button><button class="btn pri" type="button" id="fck" ${FC.flip?"":"disabled"}>Got it</button></div>`;
  $("#fcs").value = FCSCOPE; $("#fcs").onchange = e => { FCSCOPE = e.target.value; FC = null; drawFlash(box); };
  $("#fcard").onclick = () => { FC.flip = !FC.flip; drawFlash(box); };
  $("#fca").onclick = () => { FC.list.push(q); FC.list.splice(FC.i,1); FC.flip=false; drawFlash(box); };
  $("#fck").onclick = () => { FC.known++; FC.i++; FC.flip=false; drawFlash(box); };
}

/* boot */
renderTop();
const start = (location.hash||"").replace("#","");
go(["learn","practice","mock","revise"].includes(start) ? start : "learn");
</script>

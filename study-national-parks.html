<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>

<title>National Parks of India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Shared by every History page (built by tools/history/build.js).
   Layout: a manuscript folio — parchment paper, maroon ink, gold figures; one-column app with a bottom tab bar. */
:root{
  --paper:#f3efe4; --sheet:#fffdf6; --sunk:#e8e1cf;
  --ink:#241c14; --ink2:#5d5141; --rule:#d8cdb4;
  --blue:#7a2230; --on-blue:#ffffff; --blue-bg:#f4e2e1;
  --accent:#9a6a12; --accent-bg:#f8ecc9;
  --good:#1b6b4a; --good-bg:#ddefe4; --bad:#a8291f; --bad-bg:#f8e0dc;
  --warn-bg:#fcf0cf;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* era groups on the Learn screen */
.eras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.erac{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:grid;gap:6px}
.erac b{font-family:var(--f-display);font-size:15px;font-weight:700;line-height:1.25}
.erac .hi{font-size:12px;color:var(--ink2)}
.erac .mt{font-family:var(--f-num);font-size:11px;color:var(--ink2)}
.erac .meter{height:6px}
.erac[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.grph{display:flex;align-items:baseline;gap:8px;padding:14px 2px 4px;border-top:2px solid var(--ink);margin-top:4px}
.grph h2{font-size:17px}
.grph span{font-size:12px;color:var(--ink2);margin-left:auto;font-family:var(--f-num)}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}
.dots{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--rule);display:block}
.dots i.on{background:var(--accent)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.hot{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px;font-size:15px}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.facts.prose dd{font-weight:400;line-height:1.55}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap,.link{border-radius:var(--r);padding:12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.link{background:var(--sunk);border-color:transparent}
.trick .lab,.trap .lab,.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.link .lab{color:var(--ink2)}
.mn{font-family:var(--f-num);font-weight:600;background:var(--sheet);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.tag.src{background:var(--good-bg);color:var(--good)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:22px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
/* one-line revision rows (last week / last moment) */
.lines{display:grid;gap:0}
.lines div{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px dashed var(--rule);font-size:15px}
.lines div:first-child{border-top:0}
.lines b{font-weight:700}
.lines span{color:var(--ink2)}
.callout{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;font-size:15px}

/* plan maker */
.plancfg{display:grid;gap:12px}
.pday{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.pday > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pday > summary::-webkit-details-marker{display:none}
.pday .dno{font-family:var(--f-num);font-weight:700;font-size:13px;background:var(--sunk);border-radius:99px;padding:2px 10px;white-space:nowrap}
.pday.cur .dno{background:var(--blue);color:var(--on-blue)}
.pday.allgood .dno{background:var(--good-bg);color:var(--good)}
.pday .dt{min-width:0;font-weight:600;font-size:15px}
.pday .dt small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
.pday .dp{font-family:var(--f-num);font-size:12px;color:var(--ink2);white-space:nowrap}
.pday .body{padding:0 14px 12px;display:grid;gap:8px;border-top:1px dashed var(--rule);margin-top:2px;padding-top:10px}
.ptask{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;width:100%;font-size:15px}
.ptask .box{width:22px;height:22px;border-radius:6px;border:1.6px solid var(--rule);display:grid;place-items:center;font-size:14px;color:var(--on-blue);margin-top:1px}
.ptask[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.ptask[aria-pressed="true"] .lbl{text-decoration:line-through;color:var(--ink2)}
.ptask .lbl small{display:block;font-size:12px;color:var(--ink2);text-decoration:none}
/* the story first: plain-language opener for beginners */
.story{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;font-size:16.5px;line-height:1.65}
.story .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.story p{margin:0}
.story .key{background:var(--blue-bg);border-radius:8px;padding:8px 12px;font-size:15px;line-height:1.5}
.story .key b{color:var(--blue)}
/* hub: app cards and the beginner path */
.appcs{display:grid;gap:12px}
.appc{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;text-align:left;width:100%;cursor:pointer}
.appc:hover{border-color:var(--blue)}
.appc .hd{display:flex;align-items:center;gap:10px}
.appc .ic{font-size:26px;line-height:1}
.appc .hd b{font-family:var(--f-display);font-size:17px;font-weight:700;display:block}
.appc .hd small{font-size:12px;color:var(--ink2)}

{"id":"N1","heat":3,"title":"National parks: the basics and the records","hi":"राष्ट्रीय उद्यान: मूल बातें और रिकॉर्ड","blocks":[{"k":"hot","h":"Most asked: the <b>first<\/b> national park (Hailey, now Corbett, 1936), the <b>largest<\/b> (Hemis) and <b>smallest<\/b> (South Button Island), the state with the <b>most<\/b> (Madhya Pradesh), the <b>floating<\/b> park (Keibul Lamjao), and the difference between a <b>national park and a sanctuary<\/b>."},{"k":"story","h":"<p>A <b>national park<\/b> is the strictest kind of protected area under the <b>Wildlife (Protection) Act, 1972<\/b>. No grazing, no private rights, no human activity except tourism and research is allowed inside. A <b>wildlife sanctuary<\/b> is gentler: some local use goes on. A state government declares both; only the state legislature (with the National Board for Wildlife's advice) can change a national park's boundary.<\/p><p>India's first national park was <b>Hailey National Park<\/b> (1936), in the Kumaon hills — today's <b>Jim Corbett<\/b>. India now has about <b>106<\/b> national parks, covering a little over 1% of its land. <b>Madhya Pradesh<\/b> has the most.<\/p>"},{"k":"mapfig","title":"The record-holders","pins":[["Corbett — first (1936)",78.8,29.55,"","l"],["Hemis — largest",77.4,33.85,""],["South Button — smallest",93.02,12.22,"","l"],["Keibul Lamjao — floating",93.85,24.5,""],["Kuno — cheetahs (2022)",77.35,25.7,"","l"],["Gir — lions",70.8,21.15,""]],"cap":"First, largest, smallest, floating — and the two big-cat homes."},{"k":"table","title":"Records","head":["Record","Park","Note"],"rows":[["The first national park","Jim Corbett (Uttarakhand)","Set up in 1936 as Hailey National Park; renamed Ramganga, then Corbett (1957)."],["The largest national park","Hemis (Ladakh)","About 4,400 sq km — home of the snow leopard."],["The smallest national park","South Button Island (Andaman and Nicobar)","Less than 1 sq km."],["The state with the most national parks","Madhya Pradesh","Eleven — with the Andaman and Nicobar Islands (nine) close behind."],["The only floating national park","Keibul Lamjao (Manipur)","On the phumdis of Loktak Lake — home of the sangai deer."],["Where cheetahs came back to India","Kuno (Madhya Pradesh)","Project Cheetah, 17 September 2022 — cheetahs from Namibia."],["The only home of the wild Asiatic lion","Gir (Gujarat)",""],["The largest mangrove national park","Sundarban (West Bengal)","Also a tiger reserve and World Heritage site."]]},{"k":"indiamap","title":"Tap a state to see its national parks","cap":"Every national park in this app, by state. Punjab, Delhi and Lakshadweep have none."},{"k":"statechart","title":"National parks per state","cap":"Madhya Pradesh leads with 11, then the Andaman and Nicobar Islands (9)."},{"k":"table","title":"National park, sanctuary, tiger reserve","head":["","National park","Wildlife sanctuary"],"rows":[["Law","Wildlife (Protection) Act, 1972 (Section 35)","Wildlife (Protection) Act, 1972 (Section 18)"],["Human activity","None allowed — no grazing, no private rights","Some allowed if it does not harm wildlife"],["Boundaries","Changed only by the state legislature","Changed by the state government"],["About how many","About 106","About 570"],["Tiger reserve?","A tiger reserve is a separate label (NTCA) — its core is often a national park","Same"]]},{"k":"trick","h":"Records in one breath — <b>“First Corbett, Big Hemis, Tiny Button, Most MP, Floating Manipur”<\/b>."},{"k":"trap","h":"The <b>largest<\/b> national park is <b>Hemis<\/b>, but the largest <b>tiger reserve<\/b> is Nagarjunasagar-Srisailam and the largest <b>biosphere reserve<\/b> is the Great Rann of Kutch. Corbett was first called <b>Hailey<\/b>, then Ramganga."}],"sum":["National parks are declared under the Wildlife (Protection) Act, 1972 — no human activity inside.","First: Hailey (1936), now Jim Corbett. Largest: Hemis (Ladakh). Smallest: South Button Island.","Madhya Pradesh has the most national parks (11); the Andaman and Nicobar Islands have 9.","Keibul Lamjao (Manipur) floats on Loktak Lake; Kuno brought cheetahs back (2022).","India has about 106 national parks."],"part":["Part 1 · The basics and the north","मूल बातें और उत्तर भारत"],"g":"np"},
{"id":"N2","heat":3,"title":"The north: J&K, Ladakh, Himachal, Haryana, Uttarakhand, UP","hi":"उत्तर भारत के राष्ट्रीय उद्यान","blocks":[{"k":"hot","h":"Most asked: <b>Hemis<\/b> (Ladakh), <b>Dachigam<\/b> (hangul), <b>Great Himalayan<\/b> and <b>Pin Valley<\/b> (Himachal), <b>Corbett, Rajaji, Nanda Devi, Valley of Flowers<\/b> (Uttarakhand) and <b>Dudhwa<\/b> (UP)."},{"k":"story","h":"<p>The northern parks climb from the Terai grasslands to the high Himalaya. <b>Dudhwa<\/b> on the Nepal border has swamp deer and rhinos; <b>Corbett<\/b> and <b>Rajaji<\/b> in the Shivalik foothills have tigers and elephants. Higher up, <b>Nanda Devi<\/b> and the <b>Valley of Flowers<\/b> form a World Heritage site; <b>Great Himalayan<\/b> in Kullu is another.<\/p><p>Beyond the main range lie cold deserts: <b>Pin Valley<\/b> in Spiti and <b>Hemis<\/b> in Ladakh — India's largest national park and the best place to see the <b>snow leopard<\/b>. In the Kashmir valley, <b>Dachigam<\/b> protects the last <b>hangul<\/b>.<\/p>"},{"k":"mapfig","title":"The north: every national park","vb":"90 30 175 170","pins":[["1",77.4,33.85,"Hemis — Ladakh","n"],["2",75,34.13,"Dachigam — Jammu and Kashmir","n"],["3",75.9,33.4,"Kishtwar — Jammu and Kashmir","n"],["4",74.2,34.2,"Kazinag — Jammu and Kashmir","n"],["5",74.82,34.1,"City Forest (Salim Ali) — Jammu and Kashmir","n"],["6",77.6,31.75,"Great Himalayan — Himachal Pradesh","n"],["7",78,31.95,"Pin Valley — Himachal Pradesh","n"],["8",77.25,32,"Inderkilla — Himachal Pradesh","n"],["9",77.45,31.95,"Khirganga — Himachal Pradesh","n"],["10",77.45,30.45,"Simbalbara — Himachal Pradesh","n"],["11",77.5,30.35,"Kalesar — Haryana","n"],["12",76.89,28.46,"Sultanpur — Haryana","n"],["13",78.8,29.55,"Jim Corbett — Uttarakhand","n"],["14",78.15,30.05,"Rajaji — Uttarakhand","n"],["15",79.85,30.4,"Nanda Devi — Uttarakhand","n"],["16",79.6,30.72,"Valley of Flowers — Uttarakhand","n"],["17",79,31,"Gangotri — Uttarakhand","n"],["18",78.3,31.1,"Govind — Uttarakhand","n"],["19",80.6,28.5,"Dudhwa — Uttar Pradesh","n"]],"facts":[["1 · Hemis","Ladakh — The largest national park; snow leopard"],["2 · Dachigam","Jammu and Kashmir — Hangul (Kashmir stag)"],["3 · Kishtwar","Jammu and Kashmir — A high-altitude park"],["4 · Kazinag","Jammu and Kashmir — Markhor"],["5 · City Forest (Salim Ali)","Jammu and Kashmir — In Srinagar"],["6 · Great Himalayan","Himachal Pradesh — World Heritage site (2014); Kullu"],["7 · Pin Valley","Himachal Pradesh — Cold desert in Lahaul and Spiti; ibex, snow leopard"],["8 · Inderkilla","Himachal Pradesh — Kullu"],["9 · Khirganga","Himachal Pradesh — Kullu"],["10 · Simbalbara","Himachal Pradesh — Sirmaur; renamed Sher Jang National Park"],["11 · Kalesar","Haryana — Yamunanagar, in the Shivaliks"],["12 · Sultanpur","Haryana — A bird park near Gurugram; Ramsar site"],["13 · Jim Corbett","Uttarakhand — India's first national park; on the Ramganga"],["14 · Rajaji","Uttarakhand — Elephants; near Haridwar"],["15 · Nanda Devi","Uttarakhand — World Heritage site with the Valley of Flowers"],["16 · Valley of Flowers","Uttarakhand — Alpine meadows; World Heritage site"],["17 · Gangotri","Uttarakhand"],["18 · Govind","Uttarakhand — Uttarkashi"],["19 · Dudhwa","Uttar Pradesh — Swamp deer (barasingha), rhinos reintroduced; Lakhimpur Kheri"]],"cap":"Numbers match the list. Places are approximate park centres. Use ＋ or ⛶ to zoom in."},{"k":"table","title":"National parks of the north","head":["Park","State / UT","Remember"],"rows":[["Hemis","Ladakh","The largest national park; snow leopard."],["Dachigam","Jammu and Kashmir","Hangul (Kashmir stag)."],["Kishtwar","Jammu and Kashmir","A high-altitude park."],["Kazinag","Jammu and Kashmir","Markhor."],["City Forest (Salim Ali)","Jammu and Kashmir","In Srinagar."],["Great Himalayan","Himachal Pradesh","World Heritage site (2014); Kullu."],["Pin Valley","Himachal Pradesh","Cold desert in Lahaul and Spiti; ibex, snow leopard."],["Inderkilla","Himachal Pradesh","Kullu."],["Khirganga","Himachal Pradesh","Kullu."],["Simbalbara","Himachal Pradesh","Sirmaur; renamed Sher Jang National Park."],["Kalesar","Haryana","Yamunanagar, in the Shivaliks."],["Sultanpur","Haryana","A bird park near Gurugram; Ramsar site."],["Jim Corbett","Uttarakhand","India's first national park; on the Ramganga."],["Rajaji","Uttarakhand","Elephants; near Haridwar."],["Nanda Devi","Uttarakhand","World Heritage site with the Valley of Flowers."],["Valley of Flowers","Uttarakhand","Alpine meadows; World Heritage site."],["Gangotri","Uttarakhand",""],["Govind","Uttarakhand","Uttarkashi."],["Dudhwa","Uttar Pradesh","Swamp deer (barasingha), rhinos reintroduced; Lakhimpur Kheri."]]},{"k":"trick","h":"Uttarakhand's six — <b>“Corbett Raja Nanda Flowers Gango Govind”<\/b>: Corbett, Rajaji, Nanda Devi, Valley of Flowers, Gangotri, Govind."},{"k":"trap","h":"<b>Punjab<\/b> and <b>Delhi<\/b> have no national park. <b>Sultanpur<\/b> (a bird park) is in <b>Haryana<\/b>, not Uttar Pradesh. <b>Hemis<\/b> is now in the UT of <b>Ladakh<\/b>, not Jammu and Kashmir."}],"sum":["Hemis (Ladakh) is the largest national park — snow leopards.","Dachigam (J&K) protects the hangul.","Himachal: Great Himalayan (World Heritage 2014), Pin Valley (cold desert), Inderkilla, Khirganga, Simbalbara.","Uttarakhand: Corbett, Rajaji, Nanda Devi, Valley of Flowers, Gangotri, Govind.","Haryana: Sultanpur and Kalesar; Uttar Pradesh: Dudhwa."],"part":["Part 1 · The basics and the north","मूल बातें और उत्तर भारत"],"g":"np"},
{"id":"N3","heat":3,"title":"The west: Rajasthan, Gujarat, Goa, Maharashtra","hi":"पश्चिम भारत के राष्ट्रीय उद्यान","blocks":[{"k":"hot","h":"Most asked: <b>Ranthambore, Sariska, Keoladeo, Desert<\/b> (Rajasthan), <b>Gir<\/b> and the <b>Marine National Park<\/b> (Gujarat), <b>Sanjay Gandhi<\/b> in Mumbai and <b>Tadoba<\/b>."},{"k":"story","h":"<p>Rajasthan's parks range from dry forest to desert: <b>Ranthambore<\/b> and <b>Sariska<\/b> for tigers, <b>Keoladeo<\/b> at Bharatpur for birds, and the <b>Desert National Park<\/b> near Jaisalmer, the last stronghold of the <b>great Indian bustard<\/b>.<\/p><p>Gujarat has <b>Gir<\/b>, the only wild home of the <b>Asiatic lion<\/b>, <b>Velavadar<\/b> for blackbuck and India's first <b>marine national park<\/b> in the Gulf of Kutch. In Maharashtra, <b>Sanjay Gandhi National Park<\/b> sits inside Mumbai, and <b>Tadoba<\/b> is the state's best-known tiger reserve.<\/p>"},{"k":"mapfig","title":"The west: every national park","vb":"20 190 230 265","pins":[["1",76.45,26,"Ranthambore — Rajasthan","n"],["2",76.4,27.3,"Sariska — Rajasthan","n"],["3",77.52,27.17,"Keoladeo Ghana — Rajasthan","n"],["4",70.6,26.5,"Desert — Rajasthan","n"],["5",75.9,24.9,"Mukundra Hills — Rajasthan","n"],["6",70.8,21.15,"Gir — Gujarat","n"],["7",72.05,22.03,"Velavadar (Blackbuck) — Gujarat","n"],["8",69.9,22.5,"Gulf of Kutch Marine — Gujarat","n"],["9",73.4,20.75,"Vansda — Gujarat","n"],["10",74.25,15.35,"Bhagwan Mahavir (Mollem) — Goa","n"],["11",72.9,19.22,"Sanjay Gandhi (Borivali) — Maharashtra","n"],["12",79.35,20.25,"Tadoba — Maharashtra","n"],["13",79.2,21.6,"Pench (Jawaharlal Nehru) — Maharashtra","n"],["14",77.1,21.4,"Gugamal — Maharashtra","n"],["15",73.85,17.15,"Chandoli — Maharashtra","n"],["16",80.15,20.95,"Nawegaon — Maharashtra","n"]],"facts":[["1 · Ranthambore","Rajasthan — Tigers among old ruins; Sawai Madhopur"],["2 · Sariska","Rajasthan — Tigers relocated after they were wiped out (2004–05); Alwar"],["3 · Keoladeo Ghana","Rajasthan — Bharatpur bird sanctuary; World Heritage site and Ramsar site"],["4 · Desert","Rajasthan — Great Indian bustard; Jaisalmer and Barmer"],["5 · Mukundra Hills","Rajasthan — Kota"],["6 · Gir","Gujarat — Asiatic lions"],["7 · Velavadar (Blackbuck)","Gujarat — Blackbuck; Bhavnagar"],["8 · Gulf of Kutch Marine","Gujarat — India's first marine national park (1982), Jamnagar"],["9 · Vansda","Gujarat — Navsari"],["10 · Bhagwan Mahavir (Mollem)","Goa — On the Western Ghats; Dudhsagar Falls"],["11 · Sanjay Gandhi (Borivali)","Maharashtra — Inside Mumbai; the Kanheri Caves"],["12 · Tadoba","Maharashtra — Tadoba-Andhari Tiger Reserve; Chandrapur"],["13 · Pench (Jawaharlal Nehru)","Maharashtra — Nagpur — the Maharashtra side of Pench"],["14 · Gugamal","Maharashtra — Melghat Tiger Reserve"],["15 · Chandoli","Maharashtra — Sahyadri Tiger Reserve"],["16 · Nawegaon","Maharashtra — Gondia"]],"cap":"Numbers match the list. Places are approximate park centres. Use ＋ or ⛶ to zoom in."},{"k":"table","title":"National parks of the west","head":["Park","State / UT","Remember"],"rows":[["Ranthambore","Rajasthan","Tigers among old ruins; Sawai Madhopur."],["Sariska","Rajasthan","Tigers relocated after they were wiped out (2004–05); Alwar."],["Keoladeo Ghana","Rajasthan","Bharatpur bird sanctuary; World Heritage site and Ramsar site."],["Desert","Rajasthan","Great Indian bustard; Jaisalmer and Barmer."],["Mukundra Hills","Rajasthan","Kota."],["Gir","Gujarat","Asiatic lions."],["Velavadar (Blackbuck)","Gujarat","Blackbuck; Bhavnagar."],["Gulf of Kutch Marine","Gujarat","India's first marine national park (1982), Jamnagar."],["Vansda","Gujarat","Navsari."],["Bhagwan Mahavir (Mollem)","Goa","On the Western Ghats; Dudhsagar Falls."],["Sanjay Gandhi (Borivali)","Maharashtra","Inside Mumbai; the Kanheri Caves."],["Tadoba","Maharashtra","Tadoba-Andhari Tiger Reserve; Chandrapur."],["Pench (Jawaharlal Nehru)","Maharashtra","Nagpur — the Maharashtra side of Pench."],["Gugamal","Maharashtra","Melghat Tiger Reserve."],["Chandoli","Maharashtra","Sahyadri Tiger Reserve."],["Nawegaon","Maharashtra","Gondia."]]},{"k":"trick","h":"Rajasthan's five — <b>“Ran-Sar-Keo-Des-Muk”<\/b>: Ranthambore, Sariska, Keoladeo, Desert, Mukundra Hills."},{"k":"trap","h":"<b>Keoladeo<\/b> is a <b>national park<\/b> (and World Heritage site), though people call it the Bharatpur Bird Sanctuary. <b>Pench<\/b> is split between Madhya Pradesh and Maharashtra — each side is a separate national park."}],"sum":["Rajasthan: Ranthambore, Sariska, Keoladeo (Bharatpur), Desert (great Indian bustard), Mukundra Hills.","Gujarat: Gir (Asiatic lion), Velavadar (blackbuck), Gulf of Kutch Marine (first marine NP, 1982), Vansda.","Goa: Bhagwan Mahavir (Mollem).","Maharashtra: Sanjay Gandhi (Mumbai), Tadoba, Pench, Gugamal, Chandoli, Nawegaon."],"part":["Part 2 · West, centre, east and north-east","पश्चिम, मध्य, पूर्व और पूर्वोत्तर"],"g":"np"},
{"id":"N4","heat":3,"title":"The centre: Madhya Pradesh and Chhattisgarh","hi":"मध्य भारत के राष्ट्रीय उद्यान","blocks":[{"k":"hot","h":"Most asked: <b>Kanha<\/b> (barasingha), <b>Bandhavgarh<\/b>, <b>Panna<\/b>, <b>Pench<\/b>, <b>Kuno<\/b> (cheetahs) and <b>Madhya Pradesh having the most national parks<\/b>; in Chhattisgarh, <b>Indravati<\/b> (wild buffalo) and <b>Kanger Ghati<\/b> (caves)."},{"k":"story","h":"<p><b>Madhya Pradesh<\/b> is the 'Tiger State' and has the most national parks — eleven. <b>Kanha<\/b> saved the hard-ground <b>barasingha<\/b> from extinction; <b>Bandhavgarh<\/b> has one of the highest densities of tigers; <b>Panna<\/b> lost all its tigers and then brought them back. In 2022 <b>Kuno<\/b> became the home of India's reintroduced <b>cheetahs<\/b>.<\/p><p>MP also has two unusual parks: the <b>Fossil National Park<\/b> at Ghughua with plant fossils, and the <b>Dinosaur Fossil National Park<\/b> in Dhar with dinosaur eggs. <b>Chhattisgarh<\/b>'s <b>Indravati<\/b> protects the wild water buffalo.<\/p>"},{"k":"mapfig","title":"The centre: every national park","vb":"110 220 170 165","pins":[["1",80.6,22.3,"Kanha — Madhya Pradesh","n"],["2",81,23.7,"Bandhavgarh — Madhya Pradesh","n"],["3",80,24.7,"Panna — Madhya Pradesh","n"],["4",79.3,21.8,"Pench (Indira Priyadarshini) — Madhya Pradesh","n"],["5",78.2,22.5,"Satpura — Madhya Pradesh","n"],["6",77.35,25.7,"Kuno — Madhya Pradesh","n"],["7",77.85,25.45,"Madhav — Madhya Pradesh","n"],["8",82,23.85,"Sanjay — Madhya Pradesh","n"],["9",77.37,23.23,"Van Vihar — Madhya Pradesh","n"],["10",80.8,23,"Fossil (Ghughua) — Madhya Pradesh","n"],["11",74.8,22.4,"Dinosaur Fossil — Madhya Pradesh","n"],["12",80.7,19.2,"Indravati — Chhattisgarh","n"],["13",81.95,18.85,"Kanger Ghati (Kanger Valley) — Chhattisgarh","n"],["14",82.3,23.6,"Guru Ghasidas — Chhattisgarh","n"]],"facts":[["1 · Kanha","Madhya Pradesh — Hard-ground barasingha; the setting of The Jungle Book"],["2 · Bandhavgarh","Madhya Pradesh — A high density of tigers; Umaria"],["3 · Panna","Madhya Pradesh — Tigers brought back; on the Ken; biosphere reserve"],["4 · Pench (Indira Priyadarshini)","Madhya Pradesh — Seoni — The Jungle Book country"],["5 · Satpura","Madhya Pradesh — Pachmarhi"],["6 · Kuno","Madhya Pradesh — Project Cheetah (2022)"],["7 · Madhav","Madhya Pradesh — Shivpuri; became a tiger reserve in 2025"],["8 · Sanjay","Madhya Pradesh — Sidhi"],["9 · Van Vihar","Madhya Pradesh — In Bhopal"],["10 · Fossil (Ghughua)","Madhya Pradesh — Plant fossils; Dindori"],["11 · Dinosaur Fossil","Madhya Pradesh — Dinosaur eggs; Dhar"],["12 · Indravati","Chhattisgarh — Wild buffalo; Bijapur"],["13 · Kanger Ghati (Kanger Valley)","Chhattisgarh — Limestone caves; Bastar"],["14 · Guru Ghasidas","Chhattisgarh — Koriya; now in the Guru Ghasidas–Tamor Pingla Tiger Reserve"]],"cap":"Numbers match the list. Places are approximate park centres. Use ＋ or ⛶ to zoom in."},{"k":"table","title":"National parks of Madhya Pradesh and Chhattisgarh","head":["Park","State / UT","Remember"],"rows":[["Kanha","Madhya Pradesh","Hard-ground barasingha; the setting of The Jungle Book."],["Bandhavgarh","Madhya Pradesh","A high density of tigers; Umaria."],["Panna","Madhya Pradesh","Tigers brought back; on the Ken; biosphere reserve."],["Pench (Indira Priyadarshini)","Madhya Pradesh","Seoni — The Jungle Book country."],["Satpura","Madhya Pradesh","Pachmarhi."],["Kuno","Madhya Pradesh","Project Cheetah (2022)."],["Madhav","Madhya Pradesh","Shivpuri; became a tiger reserve in 2025."],["Sanjay","Madhya Pradesh","Sidhi."],["Van Vihar","Madhya Pradesh","In Bhopal."],["Fossil (Ghughua)","Madhya Pradesh","Plant fossils; Dindori."],["Dinosaur Fossil","Madhya Pradesh","Dinosaur eggs; Dhar."],["Indravati","Chhattisgarh","Wild buffalo; Bijapur."],["Kanger Ghati (Kanger Valley)","Chhattisgarh","Limestone caves; Bastar."],["Guru Ghasidas","Chhattisgarh","Koriya; now in the Guru Ghasidas–Tamor Pingla Tiger Reserve."]]},{"k":"trick","h":"MP's big tiger four — <b>“Kanha Bandh Panna Pench”<\/b>. Add <b>Kuno<\/b> for cheetahs and <b>Satpura<\/b> for Pachmarhi."},{"k":"trap","h":"<b>Kuno<\/b> is in <b>Madhya Pradesh<\/b>, not Rajasthan. The second cheetah home (2025) is <b>Gandhi Sagar<\/b> Wildlife Sanctuary, also in MP — a sanctuary, not a national park."}],"sum":["Madhya Pradesh has the most national parks: Kanha, Bandhavgarh, Panna, Pench, Satpura, Kuno, Madhav, Sanjay, Van Vihar, and two fossil parks.","Kanha — barasingha; Kuno — cheetahs (2022).","Chhattisgarh: Indravati (wild buffalo), Kanger Ghati (caves), Guru Ghasidas."],"part":["Part 2 · West, centre, east and north-east","पश्चिम, मध्य, पूर्व और पूर्वोत्तर"],"g":"np"},
{"id":"N5","heat":3,"title":"The east: Bihar, Jharkhand, Odisha, West Bengal, Sikkim","hi":"पूर्वी भारत के राष्ट्रीय उद्यान","blocks":[{"k":"hot","h":"Most asked: <b>Valmiki<\/b> (Bihar's only), <b>Betla<\/b> (Jharkhand's only), <b>Simlipal<\/b> and <b>Bhitarkanika<\/b> (Odisha), <b>Sundarban<\/b>, <b>Jaldapara<\/b> and <b>Singalila<\/b> (West Bengal), and <b>Khangchendzonga<\/b> (Sikkim)."},{"k":"story","h":"<p><b>West Bengal<\/b> runs from the mangroves of the <b>Sundarbans<\/b> to the snows of <b>Singalila<\/b>, where red pandas live on the Nepal border. In between, the Dooars parks — <b>Jaldapara<\/b> and <b>Gorumara<\/b> — have one-horned rhinos.<\/p><p><b>Odisha<\/b> has <b>Simlipal<\/b> (tigers, waterfalls) and <b>Bhitarkanika<\/b>, home of the saltwater crocodile. <b>Sikkim<\/b>'s <b>Khangchendzonga<\/b> is India's only <b>mixed<\/b> World Heritage site. Bihar and Jharkhand each have just one: <b>Valmiki<\/b> and <b>Betla<\/b>.<\/p>"},{"k":"mapfig","title":"The east: every national park","vb":"280 180 140 170","pins":[["1",84.1,27.3,"Valmiki — Bihar","n"],["2",84.2,23.9,"Betla — Jharkhand","n"],["3",86.4,21.8,"Simlipal — Odisha","n"],["4",86.95,20.7,"Bhitarkanika — Odisha","n"],["5",88.9,21.95,"Sundarban — West Bengal","n"],["6",89.3,26.65,"Jaldapara — West Bengal","n"],["7",88.8,26.7,"Gorumara — West Bengal","n"],["8",89.5,26.7,"Buxa — West Bengal","n"],["9",88.75,27.05,"Neora Valley — West Bengal","n"],["10",88,27.15,"Singalila — West Bengal","n"],["11",88.3,27.65,"Khangchendzonga — Sikkim","n"]],"facts":[["1 · Valmiki","Bihar — Bihar's only national park and tiger reserve; West Champaran"],["2 · Betla","Jharkhand — Jharkhand's only national park; Palamau"],["3 · Simlipal","Odisha — Tigers; Mayurbhanj; also a biosphere reserve"],["4 · Bhitarkanika","Odisha — Saltwater crocodiles and mangroves"],["5 · Sundarban","West Bengal — Mangroves and tigers; World Heritage site"],["6 · Jaldapara","West Bengal — One-horned rhinos; Alipurduar"],["7 · Gorumara","West Bengal — Rhinos; the Dooars"],["8 · Buxa","West Bengal — Tiger reserve; Alipurduar"],["9 · Neora Valley","West Bengal — Red panda; Kalimpong"],["10 · Singalila","West Bengal — Red panda; Darjeeling"],["11 · Khangchendzonga","Sikkim — India's only mixed World Heritage site (2016)"]],"cap":"Numbers match the list. Places are approximate park centres. Use ＋ or ⛶ to zoom in."},{"k":"table","title":"National parks of the east","head":["Park","State / UT","Remember"],"rows":[["Valmiki","Bihar","Bihar's only national park and tiger reserve; West Champaran."],["Betla","Jharkhand","Jharkhand's only national park; Palamau."],["Simlipal","Odisha","Tigers; Mayurbhanj; also a biosphere reserve."],["Bhitarkanika","Odisha","Saltwater crocodiles and mangroves."],["Sundarban","West Bengal","Mangroves and tigers; World Heritage site."],["Jaldapara","West Bengal","One-horned rhinos; Alipurduar."],["Gorumara","West Bengal","Rhinos; the Dooars."],["Buxa","West Bengal","Tiger reserve; Alipurduar."],["Neora Valley","West Bengal","Red panda; Kalimpong."],["Singalila","West Bengal","Red panda; Darjeeling."],["Khangchendzonga","Sikkim","India's only mixed World Heritage site (2016)."]]},{"k":"trick","h":"One-park states of the east — <b>“Valmiki Bihar, Betla Jharkhand”<\/b> — like a pair of rhymes."},{"k":"trap","h":"<b>Bhitarkanika<\/b> (Odisha) is for <b>saltwater crocodiles<\/b>; the <b>Sundarbans<\/b> (West Bengal) is for tigers in mangroves — both have mangroves. <b>Khangchendzonga<\/b> is a <b>mixed<\/b> site, not purely natural."}],"sum":["Bihar: Valmiki; Jharkhand: Betla — one each.","Odisha: Simlipal (tigers), Bhitarkanika (saltwater crocodiles).","West Bengal: Sundarban, Jaldapara, Gorumara, Buxa, Neora Valley, Singalila (red panda).","Sikkim: Khangchendzonga — India's only mixed World Heritage site (2016)."],"part":["Part 2 · West, centre, east and north-east","पश्चिम, मध्य, पूर्व और पूर्वोत्तर"],"g":"np"},
{"id":"N6","heat":3,"title":"The north-east","hi":"पूर्वोत्तर भारत के राष्ट्रीय उद्यान","blocks":[{"k":"hot","h":"Most asked: <b>Kaziranga<\/b> and <b>Manas<\/b> (Assam), <b>Keibul Lamjao<\/b> (floating, sangai), <b>Namdapha<\/b> (four big cats), <b>Nokrek<\/b> and <b>Balphakram<\/b> (Meghalaya), and Assam's two new parks of 2021."},{"k":"story","h":"<p><b>Assam<\/b> has seven national parks. <b>Kaziranga<\/b> holds about two-thirds of the world's <b>one-horned rhinos<\/b>; <b>Manas<\/b>, on the Bhutan border, has golden langurs and the tiny pygmy hog. <b>Dihing Patkai<\/b> and <b>Raimona<\/b> became national parks in 2021.<\/p><p>In Arunachal, <b>Namdapha<\/b> is the only park with <b>four big cats<\/b> — tiger, leopard, clouded leopard and snow leopard. Manipur's <b>Keibul Lamjao<\/b> floats on mats of vegetation (phumdis) on Loktak Lake and is the last home of the <b>sangai<\/b> deer.<\/p>"},{"k":"mapfig","title":"The north-east: every national park","vb":"395 165 150 145","pins":[["1",93.4,26.6,"Kaziranga — Assam","n"],["2",91,26.7,"Manas — Assam","n"],["3",92.8,26.95,"Nameri — Assam","n"],["4",92.3,26.55,"Orang (Rajiv Gandhi) — Assam","n"],["5",95.4,27.6,"Dibru-Saikhowa — Assam","n"],["6",95.5,27.3,"Dihing Patkai — Assam","n"],["7",89.95,26.6,"Raimona — Assam","n"],["8",96.4,27.5,"Namdapha — Arunachal Pradesh","n"],["9",94.9,28.6,"Mouling — Arunachal Pradesh","n"],["10",93.85,24.5,"Keibul Lamjao — Manipur","n"],["11",94.5,25.1,"Sirohi — Manipur","n"],["12",90.3,25.68,"Nokrek — Meghalaya","n"],["13",90.85,25.35,"Balphakram — Meghalaya","n"],["14",93,22.65,"Phawngpui (Blue Mountain) — Mizoram","n"],["15",93.3,23.6,"Murlen — Mizoram","n"],["16",93.5,25.6,"Ntangki (Intanki) — Nagaland","n"],["17",91.32,23.66,"Clouded Leopard — Tripura","n"],["18",91.75,23.4,"Bison (Rajbari) — Tripura","n"]],"facts":[["1 · Kaziranga","Assam — One-horned rhinos; World Heritage site"],["2 · Manas","Assam — World Heritage site; golden langur, pygmy hog"],["3 · Nameri","Assam — White-winged wood duck"],["4 · Orang (Rajiv Gandhi)","Assam — 'Mini Kaziranga'"],["5 · Dibru-Saikhowa","Assam — Feral horses; also a biosphere reserve"],["6 · Dihing Patkai","Assam — Notified 2021"],["7 · Raimona","Assam — Notified 2021"],["8 · Namdapha","Arunachal Pradesh — Four big cats: tiger, leopard, clouded and snow leopard"],["9 · Mouling","Arunachal Pradesh"],["10 · Keibul Lamjao","Manipur — The floating park; sangai deer"],["11 · Sirohi","Manipur — Shirui lily"],["12 · Nokrek","Meghalaya — Wild citrus; biosphere reserve"],["13 · Balphakram","Meghalaya — 'Land of perpetual winds'"],["14 · Phawngpui (Blue Mountain)","Mizoram"],["15 · Murlen","Mizoram"],["16 · Ntangki (Intanki)","Nagaland — Nagaland's only national park"],["17 · Clouded Leopard","Tripura — Inside Sepahijala"],["18 · Bison (Rajbari)","Tripura"]],"cap":"Numbers match the list. Places are approximate park centres. Use ＋ or ⛶ to zoom in."},{"k":"table","title":"National parks of the north-east","head":["Park","State / UT","Remember"],"rows":[["Kaziranga","Assam","One-horned rhinos; World Heritage site."],["Manas","Assam","World Heritage site; golden langur, pygmy hog."],["Nameri","Assam","White-winged wood duck."],["Orang (Rajiv Gandhi)","Assam","'Mini Kaziranga'."],["Dibru-Saikhowa","Assam","Feral horses; also a biosphere reserve."],["Dihing Patkai","Assam","Notified 2021."],["Raimona","Assam","Notified 2021."],["Namdapha","Arunachal Pradesh","Four big cats: tiger, leopard, clouded and snow leopard."],["Mouling","Arunachal Pradesh",""],["Keibul Lamjao","Manipur","The floating park; sangai deer."],["Sirohi","Manipur","Shirui lily."],["Nokrek","Meghalaya","Wild citrus; biosphere reserve."],["Balphakram","Meghalaya","'Land of perpetual winds'."],["Phawngpui (Blue Mountain)","Mizoram",""],["Murlen","Mizoram",""],["Ntangki (Intanki)","Nagaland","Nagaland's only national park."],["Clouded Leopard","Tripura","Inside Sepahijala."],["Bison (Rajbari)","Tripura",""]]},{"k":"trick","h":"Assam's seven — <b>“Kazi Manas Nameri Orang Dibru Dihing Raimona”<\/b>."},{"k":"trap","h":"<b>Keibul Lamjao<\/b> is in <b>Manipur<\/b> (on Loktak Lake), not Assam. <b>Nokrek<\/b> is a national park <i>and<\/i> a biosphere reserve in Meghalaya. <b>Ntangki<\/b> is Nagaland's only national park."}],"sum":["Assam: Kaziranga (rhino), Manas (World Heritage), Nameri, Orang, Dibru-Saikhowa, Dihing Patkai and Raimona (2021).","Arunachal: Namdapha (four big cats), Mouling.","Manipur: Keibul Lamjao (floating, sangai), Sirohi.","Meghalaya: Nokrek, Balphakram; Mizoram: Phawngpui, Murlen; Nagaland: Ntangki; Tripura: Clouded Leopard, Bison."],"part":["Part 2 · West, centre, east and north-east","पश्चिम, मध्य, पूर्व और पूर्वोत्तर"],"g":"np"},
{"id":"N7","heat":3,"title":"The south: Karnataka, Kerala, Tamil Nadu","hi":"दक्षिण भारत के राष्ट्रीय उद्यान","blocks":[{"k":"hot","h":"Most asked: <b>Bandipur, Nagarhole<\/b> (Karnataka), <b>Periyar, Eravikulam, Silent Valley<\/b> (Kerala), <b>Mudumalai<\/b> and the <b>Gulf of Mannar<\/b> (Tamil Nadu) — and which animal each protects."},{"k":"story","h":"<p>Where Karnataka, Kerala and Tamil Nadu meet, <b>Bandipur<\/b>, <b>Nagarhole<\/b> and <b>Mudumalai<\/b> form one great forest, part of the <b>Nilgiri Biosphere Reserve<\/b> — the best place in the world to see Asian elephants. Kerala's <b>Silent Valley<\/b> was saved from a dam in the 1980s and protects the <b>lion-tailed macaque<\/b>; <b>Eravikulam<\/b> protects the <b>Nilgiri tahr<\/b>.<\/p><p>Off Tamil Nadu, the <b>Gulf of Mannar Marine National Park<\/b> protects coral reefs and dugongs; <b>Guindy<\/b> sits inside Chennai.<\/p>"},{"k":"mapfig","title":"The south: every national park","vb":"100 435 145 145","pins":[["1",76.55,11.7,"Bandipur — Karnataka","n"],["2",76.15,12,"Nagarhole (Rajiv Gandhi) — Karnataka","n"],["3",75.25,13.2,"Kudremukh — Karnataka","n"],["4",77.58,12.8,"Bannerghatta — Karnataka","n"],["5",74.4,15,"Anshi — Karnataka","n"],["6",77.2,9.5,"Periyar — Kerala","n"],["7",77.07,10.15,"Eravikulam — Kerala","n"],["8",76.45,11.08,"Silent Valley — Kerala","n"],["9",77.1,10.25,"Anamudi Shola — Kerala","n"],["10",77.25,9.98,"Mathikettan Shola — Kerala","n"],["11",77.2,10.12,"Pambadum Shola — Kerala","n"],["12",76.6,11.6,"Mudumalai — Tamil Nadu","n"],["13",76.5,11.35,"Mukurthi — Tamil Nadu","n"],["14",77,10.4,"Anamalai (Indira Gandhi) — Tamil Nadu","n"],["15",79,9.15,"Gulf of Mannar Marine — Tamil Nadu","n"],["16",80.23,13,"Guindy — Tamil Nadu","n"]],"facts":[["1 · Bandipur","Karnataka — Tigers and elephants; part of the Nilgiri Biosphere Reserve"],["2 · Nagarhole (Rajiv Gandhi)","Karnataka — Tigers and elephants"],["3 · Kudremukh","Karnataka — 'Horse face' peak; shola grasslands"],["4 · Bannerghatta","Karnataka — Near Bengaluru; India's first butterfly park"],["5 · Anshi","Karnataka — Part of the Kali Tiger Reserve"],["6 · Periyar","Kerala — Elephants; a tiger reserve on the Periyar lake"],["7 · Eravikulam","Kerala — Nilgiri tahr; Neelakurinji blooms"],["8 · Silent Valley","Kerala — Lion-tailed macaque; saved by a famous campaign"],["9 · Anamudi Shola","Kerala"],["10 · Mathikettan Shola","Kerala"],["11 · Pambadum Shola","Kerala"],["12 · Mudumalai","Tamil Nadu — Elephants and tigers; Nilgiris"],["13 · Mukurthi","Tamil Nadu — Nilgiri tahr; Nilgiris"],["14 · Anamalai (Indira Gandhi)","Tamil Nadu — Lion-tailed macaque; Coimbatore"],["15 · Gulf of Mannar Marine","Tamil Nadu — Corals and dugongs; India's first marine biosphere reserve"],["16 · Guindy","Tamil Nadu — Inside Chennai; blackbuck"]],"cap":"Numbers match the list. Places are approximate park centres. Use ＋ or ⛶ to zoom in."},{"k":"table","title":"National parks of the south","head":["Park","State / UT","Remember"],"rows":[["Bandipur","Karnataka","Tigers and elephants; part of the Nilgiri Biosphere Reserve."],["Nagarhole (Rajiv Gandhi)","Karnataka","Tigers and elephants."],["Kudremukh","Karnataka","'Horse face' peak; shola grasslands."],["Bannerghatta","Karnataka","Near Bengaluru; India's first butterfly park."],["Anshi","Karnataka","Part of the Kali Tiger Reserve."],["Periyar","Kerala","Elephants; a tiger reserve on the Periyar lake."],["Eravikulam","Kerala","Nilgiri tahr; Neelakurinji blooms."],["Silent Valley","Kerala","Lion-tailed macaque; saved by a famous campaign."],["Anamudi Shola","Kerala",""],["Mathikettan Shola","Kerala",""],["Pambadum Shola","Kerala",""],["Mudumalai","Tamil Nadu","Elephants and tigers; Nilgiris."],["Mukurthi","Tamil Nadu","Nilgiri tahr; Nilgiris."],["Anamalai (Indira Gandhi)","Tamil Nadu","Lion-tailed macaque; Coimbatore."],["Gulf of Mannar Marine","Tamil Nadu","Corals and dugongs; India's first marine biosphere reserve."],["Guindy","Tamil Nadu","Inside Chennai; blackbuck."]]},{"k":"trick","h":"The tri-junction trio — <b>“Bandipur–Nagarhole–Mudumalai”<\/b> (Karnataka, Karnataka, Tamil Nadu) plus Wayanad (Kerala, a sanctuary) — one forest, four names."},{"k":"trap","h":"<b>Periyar<\/b> is in <b>Kerala<\/b>, though the Periyar lake's dam (Mullaperiyar) is run by Tamil Nadu. <b>Anamalai<\/b> (Tamil Nadu) is also called <b>Indira Gandhi<\/b> National Park; <b>Nagarhole<\/b> is also <b>Rajiv Gandhi<\/b> National Park."}],"sum":["Karnataka: Bandipur, Nagarhole, Kudremukh, Bannerghatta, Anshi.","Kerala: Periyar, Eravikulam (Nilgiri tahr), Silent Valley (lion-tailed macaque) and three sholas.","Tamil Nadu: Mudumalai, Mukurthi, Anamalai, Gulf of Mannar Marine, Guindy (Chennai).","Bandipur–Nagarhole–Mudumalai lie in the Nilgiri Biosphere Reserve."],"part":["Part 3 · The south, the islands, animals and news","दक्षिण, द्वीप, जीव और समाचार"],"g":"np"},
{"id":"N8","heat":2,"title":"Andhra Pradesh, Telangana and the islands","hi":"आंध्र, तेलंगाना और द्वीप","blocks":[{"k":"hot","h":"Most asked: the <b>Andaman and Nicobar parks<\/b> (smallest — South Button; marine parks — Mahatma Gandhi and Rani Jhansi; Saddle Peak), and Hyderabad's three city parks."},{"k":"story","h":"<p>The <b>Andaman and Nicobar Islands<\/b> have nine national parks — more than any state except Madhya Pradesh. Two are <b>marine<\/b> parks of coral reefs (<b>Mahatma Gandhi<\/b> at Wandoor and <b>Rani Jhansi<\/b>), three are tiny islands (the <b>Button<\/b> islands, including India's smallest park), and <b>Campbell Bay<\/b> and <b>Galathea Bay<\/b> guard the rainforest of Great Nicobar.<\/p><p>Telangana's three national parks are all in or around <b>Hyderabad<\/b>. Andhra Pradesh has <b>Papikonda<\/b> on the Godavari gorge and <b>Sri Venkateswara<\/b> near Tirupati.<\/p>"},{"k":"mapfig","title":"Andhra, Telangana and the islands: every national park","vb":"175 385 320 240","pins":[["1",81.6,17.5,"Papikonda — Andhra Pradesh","n"],["2",79.3,13.6,"Sri Venkateswara — Andhra Pradesh","n"],["3",78.55,14.73,"Rajiv Gandhi (Rameswaram) — Andhra Pradesh","n"],["4",78.42,17.42,"Kasu Brahmananda Reddy — Telangana","n"],["5",78.35,17.37,"Mrugavani — Telangana","n"],["6",78.57,17.33,"Mahavir Harina Vanasthali — Telangana","n"],["7",92.6,11.6,"Mahatma Gandhi Marine (Wandoor) — Andaman and Nicobar Islands","n"],["8",93.03,12.05,"Rani Jhansi Marine — Andaman and Nicobar Islands","n"],["9",92.95,13.15,"Saddle Peak — Andaman and Nicobar Islands","n"],["10",92.73,11.72,"Mount Harriet (Mount Manipur) — Andaman and Nicobar Islands","n"],["11",93.9,7,"Campbell Bay — Andaman and Nicobar Islands","n"],["12",93.85,6.85,"Galathea Bay — Andaman and Nicobar Islands","n"],["13",93.02,12.22,"South Button Island — Andaman and Nicobar Islands","n"],["14",93,12.27,"Middle Button Island — Andaman and Nicobar Islands","n"],["15",92.98,12.32,"North Button Island — Andaman and Nicobar Islands","n"]],"facts":[["1 · Papikonda","Andhra Pradesh — On the Godavari gorge"],["2 · Sri Venkateswara","Andhra Pradesh — Tirupati"],["3 · Rajiv Gandhi (Rameswaram)","Andhra Pradesh — Kadapa"],["4 · Kasu Brahmananda Reddy","Telangana — Inside Hyderabad"],["5 · Mrugavani","Telangana — Hyderabad"],["6 · Mahavir Harina Vanasthali","Telangana — Deer park near Hyderabad"],["7 · Mahatma Gandhi Marine (Wandoor)","Andaman and Nicobar Islands — Coral reefs near Sri Vijaya Puram"],["8 · Rani Jhansi Marine","Andaman and Nicobar Islands — Ritchie's Archipelago"],["9 · Saddle Peak","Andaman and Nicobar Islands — The highest point of the islands"],["10 · Mount Harriet (Mount Manipur)","Andaman and Nicobar Islands — Renamed Mount Manipur National Park in 2021"],["11 · Campbell Bay","Andaman and Nicobar Islands — Great Nicobar"],["12 · Galathea Bay","Andaman and Nicobar Islands — Great Nicobar; leatherback turtles"],["13 · South Button Island","Andaman and Nicobar Islands — India's smallest national park"],["14 · Middle Button Island","Andaman and Nicobar Islands"],["15 · North Button Island","Andaman and Nicobar Islands"]],"cap":"Numbers match the list. Places are approximate park centres. Use ＋ or ⛶ to zoom in."},{"k":"table","title":"National parks of AP, Telangana and the islands","head":["Park","State / UT","Remember"],"rows":[["Papikonda","Andhra Pradesh","On the Godavari gorge."],["Sri Venkateswara","Andhra Pradesh","Tirupati."],["Rajiv Gandhi (Rameswaram)","Andhra Pradesh","Kadapa."],["Kasu Brahmananda Reddy","Telangana","Inside Hyderabad."],["Mrugavani","Telangana","Hyderabad."],["Mahavir Harina Vanasthali","Telangana","Deer park near Hyderabad."],["Mahatma Gandhi Marine (Wandoor)","Andaman and Nicobar Islands","Coral reefs near Sri Vijaya Puram."],["Rani Jhansi Marine","Andaman and Nicobar Islands","Ritchie's Archipelago."],["Saddle Peak","Andaman and Nicobar Islands","The highest point of the islands."],["Mount Harriet (Mount Manipur)","Andaman and Nicobar Islands","Renamed Mount Manipur National Park in 2021."],["Campbell Bay","Andaman and Nicobar Islands","Great Nicobar."],["Galathea Bay","Andaman and Nicobar Islands","Great Nicobar; leatherback turtles."],["South Button Island","Andaman and Nicobar Islands","India's smallest national park."],["Middle Button Island","Andaman and Nicobar Islands",""],["North Button Island","Andaman and Nicobar Islands",""]]},{"k":"trick","h":"The Andamans' nine — <b>“3 Buttons, 2 Marines, 2 Bays, Saddle and Harriet”<\/b>."},{"k":"trap","h":"<b>Mount Harriet<\/b> was renamed <b>Mount Manipur<\/b> National Park in 2021. <b>Lakshadweep<\/b> has no national park. The capital Port Blair is now <b>Sri Vijaya Puram<\/b>."}],"sum":["A&N Islands: 9 national parks — South, Middle and North Button; Mahatma Gandhi and Rani Jhansi Marine; Campbell Bay, Galathea Bay; Saddle Peak; Mount Harriet (Mount Manipur).","Telangana: Kasu Brahmananda Reddy, Mrugavani, Mahavir Harina Vanasthali — all around Hyderabad.","Andhra Pradesh: Papikonda, Sri Venkateswara, Rajiv Gandhi (Rameswaram)."],"part":["Part 3 · The south, the islands, animals and news","दक्षिण, द्वीप, जीव और समाचार"],"g":"np"},
{"id":"N9","heat":3,"title":"Animals and their parks","hi":"जीव और उनके उद्यान","blocks":[{"k":"hot","h":"Most asked: <b>animal → park<\/b> — lion–Gir, rhino–Kaziranga, hangul–Dachigam, sangai–Keibul Lamjao, barasingha–Kanha, Nilgiri tahr–Eravikulam, saltwater crocodile–Bhitarkanika, great Indian bustard–Desert, cheetah–Kuno."},{"k":"story","h":"<p>Many parks exist to save one animal. The <b>Asiatic lion<\/b> survives only in and around <b>Gir<\/b>; the <b>hangul<\/b> only in <b>Dachigam<\/b>; the <b>sangai<\/b> only on the floating meadows of <b>Keibul Lamjao<\/b>. <b>Kanha<\/b> brought the hard-ground <b>barasingha<\/b> back from about 66 animals in 1970.<\/p><p>Learn these as pairs — exams give the animal and ask for the park, or the other way round.<\/p>"},{"k":"table","title":"Animal → park","head":["Animal","Park","Note"],"rows":[["Asiatic lion","Gir","Gujarat — the only wild population."],["one-horned rhinoceros","Kaziranga","Also Manas, Orang, Jaldapara, Gorumara."],["snow leopard","Hemis",""],["hangul (Kashmir stag)","Dachigam",""],["sangai (brow-antlered deer)","Keibul Lamjao","Manipur's state animal."],["hard-ground barasingha","Kanha","Madhya Pradesh's state animal."],["Nilgiri tahr","Eravikulam",""],["Lion-tailed macaque","Silent Valley",""],["saltwater crocodile","Bhitarkanika",""],["great Indian bustard","Desert","Rajasthan's state bird."],["blackbuck","Velavadar (Blackbuck)",""],["wild water buffalo","Indravati","Chhattisgarh's state animal."],["golden langur","Manas",""],["cheetah","Kuno","Brought from Namibia and South Africa (2022–23)."],["red panda","Singalila","Also Neora Valley."],["migratory birds (once the Siberian crane)","Keoladeo Ghana",""],["dugong and its coral reefs","Gulf of Mannar Marine",""]]},{"k":"photos","title":"The animals in pictures","items":[["Asiatic_lion","Asiatic lion","Gir"],["Indian_rhinoceros","One-horned rhino","Kaziranga"],["Snow_leopard","Snow leopard","Hemis"],["Kashmir_stag","Hangul","Dachigam"],["Eld's_deer","Sangai","Keibul Lamjao"],["Barasingha","Barasingha","Kanha"],["Nilgiri_tahr","Nilgiri tahr","Eravikulam"],["Lion-tailed_macaque","Lion-tailed macaque","Silent Valley"],["Saltwater_crocodile","Saltwater crocodile","Bhitarkanika"],["Great_Indian_bustard","Great Indian bustard","Desert NP"],["Wild_water_buffalo","Wild water buffalo","Indravati"],["Golden_langur","Golden langur","Manas"],["Cheetah","Cheetah","Kuno"],["Red_panda","Red panda","Singalila"],["Blackbuck","Blackbuck","Velavadar"]]},{"k":"trick","h":"Endemic pairs — <b>“Lion Gir, Hangul Dachi, Sangai Keibul, Tahr Eravi”<\/b>: one animal, one place."},{"k":"trap","h":"<b>Rhinos<\/b> live in several parks (Kaziranga, Manas, Orang, Jaldapara, Gorumara, Dudhwa) — but the answer for 'best known' is <b>Kaziranga<\/b>. The <b>cheetah<\/b> came back to <b>Kuno<\/b>, not Gir."}],"sum":["Lion — Gir; rhino — Kaziranga; snow leopard — Hemis; hangul — Dachigam; sangai — Keibul Lamjao.","Barasingha — Kanha; Nilgiri tahr — Eravikulam; lion-tailed macaque — Silent Valley.","Saltwater crocodile — Bhitarkanika; great Indian bustard — Desert NP; wild buffalo — Indravati.","Cheetah — Kuno (2022); red panda — Singalila."],"part":["Part 3 · The south, the islands, animals and news","दक्षिण, द्वीप, जीव और समाचार"],"g":"np"},
{"id":"N10","heat":2,"title":"World Heritage parks and parks in the news","hi":"विश्व धरोहर उद्यान और समाचार","blocks":[{"k":"hot","h":"Most asked: which national parks are <b>natural World Heritage sites<\/b> and when, <b>Project Cheetah<\/b> (Kuno 2022), new and renamed parks (Dihing Patkai, Raimona, Mount Manipur), and tiger reserves that are also national parks."},{"k":"story","h":"<p>Seven of India's natural (or mixed) World Heritage sites are national parks: <b>Kaziranga, Manas and Keoladeo<\/b> (1985), the <b>Sundarbans<\/b> (1987), <b>Nanda Devi<\/b> (1988, with the Valley of Flowers added in 2005), the <b>Great Himalayan<\/b> (2014) and <b>Khangchendzonga<\/b> (2016, mixed). The eighth natural site, the <b>Western Ghats<\/b>, is a chain of many parks and sanctuaries.<\/p><p><b>Project Cheetah<\/b> brought eight cheetahs from Namibia to <b>Kuno<\/b> on 17 September 2022, and twelve more from South Africa in 2023. Assam added <b>Dihing Patkai<\/b> and <b>Raimona<\/b> in 2021.<\/p>"},{"k":"table","title":"National parks on the World Heritage list","head":["Park","Year listed","Note"],"rows":[["Kaziranga","1985","Assam — natural World Heritage site."],["Manas","1985","Assam."],["Keoladeo Ghana","1985","Rajasthan."],["Sundarban","1987","West Bengal."],["Nanda Devi and Valley of Flowers","1988","Valley of Flowers added 2005."],["Great Himalayan","2014","Himachal Pradesh."],["Khangchendzonga","2016","Sikkim — India's only mixed (natural and cultural) site."]]},{"k":"tlfig","title":"World Heritage parks, year by year","rows":[[1985,"Kaziranga","Assam"],[1985,"Manas","Assam"],[1985,"Keoladeo Ghana","Rajasthan"],[1987,"Sundarban","West Bengal"],[1988,"Nanda Devi and Valley of Flowers","Valley of Flowers added 2005"],[2014,"Great Himalayan","Himachal Pradesh"],[2016,"Khangchendzonga","Sikkim"]],"cap":"Kaziranga, Manas and Keoladeo were the first (1985); Khangchendzonga (2016) is the only mixed site."},{"k":"photos","title":"In pictures","items":[["Kaziranga_National_Park","Kaziranga","1985"],["Keoladeo_National_Park","Keoladeo","1985"],["Sundarbans_National_Park","Sundarbans","1987"],["Valley_of_Flowers_National_Park","Valley of Flowers","2005"],["Great_Himalayan_National_Park","Great Himalayan","2014"],["Khangchendzonga_National_Park","Khangchendzonga","2016"]]},{"k":"facts","title":"In the news","rows":[["Project Cheetah","Kuno, 17 September 2022 (from Namibia); more from South Africa, February 2023"],["Second cheetah home","Gandhi Sagar Wildlife Sanctuary, MP (2025)"],["New national parks","Dihing Patkai and Raimona, Assam (2021)"],["Renamed","Mount Harriet → Mount Manipur (2021); Orang → Rajiv Gandhi Orang"],["Madhav (MP)","Declared a tiger reserve in 2025"]]},{"k":"trick","h":"The 1985 trio — <b>“K-M-K”<\/b>: <b>K<\/b>aziranga, <b>M<\/b>anas, <b>K<\/b>eoladeo. Then Sundarbans 1987, Nanda Devi 1988, Great Himalayan 2014, Khangchendzonga 2016."},{"k":"trap","h":"<b>Khangchendzonga<\/b> is <b>mixed<\/b> (natural and cultural) — the only one in India. The <b>Valley of Flowers<\/b> was added to Nanda Devi in <b>2005<\/b>, not 1988."}],"sum":["Natural World Heritage parks: Kaziranga, Manas, Keoladeo (1985); Sundarbans (1987); Nanda Devi (1988) and Valley of Flowers (2005); Great Himalayan (2014); Khangchendzonga (2016, mixed).","Project Cheetah: Kuno, 17 September 2022.","Dihing Patkai and Raimona became national parks in 2021; Mount Harriet is now Mount Manipur."],"part":["Part 3 · The south, the islands, animals and news","दक्षिण, द्वीप, जीव और समाचार"],"g":"np"}
];

/* ---------- quiz games (60 seconds) ---------- */
function labDeck(id){
  const d = LAB_CONF.decks.find(x => x.id === id);
  const ask = (pre, t) => pre ? `${pre} ${t}${/[?:]$/.test(pre) ? "" : "?"}` : t;
  let items = d.make ? d.make() : d.pairs.map(p => ({ p: ask(d.q, p[0]), a: p[1], note: p[2] || "", raw: p[0], pool: "a" }));
  if (d.rq && !d.make) {   // also ask the other way round, where an answer belongs to one prompt only
    const n = {}; d.pairs.forEach(p => { n[p[1]] = (n[p[1]] || 0) + 1; });
    items = items.concat(d.pairs.filter(p => n[p[1]] === 1).map(p => ({ p: ask(d.rq, p[1]), a: p[0], note: p[2] || "", raw: p[1], pool: "p" })));
  }
  return { d, items };
}
function labIntro(id){

      <p style="margin:0">${L.best[d.id] ? "Your best: <b>" + L.best[d.id] + "</b>" : "First go — no pressure."}</p>
      <div class="row" style="justify-content:center"><button class="btn pri" type="button" id="labgo">▶ Start</button><button class="btn" type="button" id="labpairs">See all pairs</button>${d.lesson ? `<button class="btn ghost" type="button" id="lablesson">Read the lesson</button>` : ""}</div></div>
    <div id="labpairlist"></div></section>`;
  labBindHome();
  $("#labgo").onclick = () => labRun(id);
  $("#labpairs").onclick = () => { $("#labpairlist").innerHTML = `<div class="block"><h3>${list.length} pairs to know</h3><div class="lab-pairs">${list.map(p => `<div><span>${esc(p[0])}</span><b>${esc(p[1])}</b></div>`).join("")}</div></div>`; };
  const lb = $("#lablesson"); if (lb) lb.onclick = () => openLesson(d.lesson, "learn");
}
let LG = null;
function labRun(id){
  labStop();
  const { d, items } = labDeck(id);
  LG = { d, items: shuffle(items), i: 0, score: 0, right: 0, tried: 0, combo: 0, maxc: 0, left: 60, miss: [], lock: false };
  $("#app").innerHTML = `<section class="view stack lab-play">
    <div class="lab-hud"><button class="back" type="button" id="labquit">✕ Stop</button><span class="lab-combo" id="labcombo"></span><span class="sc" id="labscore">0</span></div>
    <div class="lab-time" id="labtime"><i style="width:100%"></i></div>
    <div class="lab-q" id="labq" aria-live="polite"></div>
    <div class="lab-opts" id="labopts"></div>
    <div class="lab-flash" id="labflash"></div></section>`;
  $("#labquit").onclick = () => { labStop(); labOver(); };
  labNext();
  LAB.timer = setInterval(() => {
    LG.left--; const t = $("#labtime"); if (!t) { labStop(); return; }
    t.firstElementChild.style.width = (LG.left / 60 * 100) + "%"; t.classList.toggle("low", LG.left <= 10);
    if (LG.left <= 0) { labStop(); labOver(); }
  }, 1000);
}
function labOptions(it){
  const d = LG.d;
  if (d.opts) return d.opts.slice();
  if (d.options) return d.options(it);
  // wrong options come from the same side of the deck as the answer (names with names, dates with dates)
  const answers = [...new Set(it.all || LG.items.filter(x => x.pool === it.pool).map(x => x.a))].filter(a => a !== it.a);
  const pool = shuffle(answers).slice(0, 3);
  return shuffle([it.a].concat(pool));
}
function labNext(){
  if (LG.i >= LG.items.length) { LG.items = shuffle(LG.items); LG.i = 0; }
  const it = LG.items[LG.i], opts = labOptions(it);
  LG.cur = it; LG.lock = false;
  const q = $("#labq"); q.innerHTML = `<span class="lab-pop">${esc(it.p)}</span>`;
  const box = $("#labopts"); box.className = "lab-opts" + (opts.length === 3 ? " three" : "");
  box.innerHTML = opts.map(o => `<button type="button" data-o="${esc(o)}">${esc(o)}</button>`).join("");
  box.querySelectorAll("button").forEach(b => b.onclick = () => labPick(b));
}
function labPick(b){
  if (LG.lock) return; LG.lock = true;
  const it = LG.cur, ok = b.dataset.o === it.a;
  LG.tried++;
  if (ok) {
    LG.right++; LG.combo++; LG.maxc = Math.max(LG.maxc, LG.combo);
    const gain = 10 + Math.min(LG.combo - 1, 5) * 2;
    LG.score += gain; b.classList.add("ok");
    $("#labflash").textContent = it.note ? it.note : "+" + gain;
  } else {
    LG.combo = 0; b.classList.add("no");
    $("#labopts").querySelectorAll("button").forEach(x => { if (x.dataset.o === it.a) x.classList.add("ok"); });
    LG.miss.push(it); $("#labflash").textContent = (it.note ? it.note + " · " : "") + "Answer: " + it.a;
  }
  $("#labscore").textContent = LG.score;
  $("#labcombo").textContent = LG.combo >= 2 ? "🔥 ×" + LG.combo : "";
  LG.i++;
  setTimeout(() => { if (LAB.timer && $("#labopts")) labNext(); }, ok ? 450 : 1200);
}
function labOver(){
  const L = labS(), id = LG.d.id, best = !L.best[id] || LG.score > L.best[id];
  if (best && LG.score > 0) L.best[id] = LG.score;
  L.xp = (L.xp || 0) + LG.right; L.plays = (L.plays || 0) + 1; save();
  const acc = LG.tried ? Math.round(LG.right * 100 / LG.tried) : 0, seen = new Set();
  const miss = LG.miss.filter(m => { if (seen.has(m.p)) return false; seen.add(m.p); return true; });
  const { r } = labRank(L.xp);
  $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}
    <div class="block lab-res lab-pop"><span class="eyebrow">${esc(LG.d.title)}</span><div class="big">${LG.score}</div>
      <p>${best && LG.score > 0 ? "🎉 New best!" : "Best: " + (L.best[id] || 0)} · ${LG.right}/${LG.tried} right (${acc}%) · longest combo ${LG.maxc} · +${LG.right} XP</p>
      <p class="muted" style="margin:0">${r[2]} ${r[1]} · ${L.xp} XP</p>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn pri" type="button" id="again">Play again</button><button class="btn" type="button" data-lab-home>More games</button></div></div>
    ${miss.length ? `<div class="block"><h3>Fix these ${miss.length}</h3><div class="lab-miss">${miss.map(m => `<div><span>${esc(m.p)}</span><b>${esc(m.a)}</b></div>`).join("")}</div></div>` : (LG.tried ? `<div class="block"><p style="margin:0">💯 No mistakes — try to beat your score.</p></div>` : "")}
  </section>`;
  labBindHome();
  $("#again").onclick = () => labRun(id);
}

/* ---------- memory match ---------- */
function labMatch(){
  labStop();
  const all = LAB_CONF.decks.find(d => d.id === LAB_CONF.match.deck).pairs, n = {};
  all.forEach(p => { n[p[1]] = (n[p[1]] || 0) + 1; });
  const pairs = shuffle(all.filter(p => n[p[1]] === 1)).slice(0, 6);
  const cards = shuffle(pairs.flatMap((p, i) => [{ k: i, t: p[0] }, { k: i, t: p[1] }]));
  const M = { cards, up: [], done: new Set(), moves: 0, t0: Date.now() };
  const draw = () => {
    $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}
      <div class="lab-hud"><div><span class="eyebrow">Memory Match</span><h2 style="margin:4px 0 0">${esc(LAB_CONF.match.title)}</h2></div><span class="sc">${M.moves} moves</span></div>
      <div class="mm">${M.cards.map((c, i) => `<button type="button" data-i="${i}" class="${M.done.has(c.k) ? "done" : M.up.includes(i) ? "up" : ""}" aria-label="${M.done.has(c.k) || M.up.includes(i) ? esc(c.t) : "Hidden card " + (i + 1)}">${M.done.has(c.k) || M.up.includes(i) ? esc(c.t) : "?"}</button>`).join("")}</div></section>`;
    labBindHome();
    $("#app").querySelectorAll(".mm button").forEach(b => b.onclick = () => flip(+b.dataset.i));
  };
  const flip = i => {
    if (M.up.length === 2 || M.up.includes(i) || M.done.has(M.cards[i].k)) return;
    M.up.push(i); draw();
    if (M.up.length === 2) {
      M.moves++;
      const [a, b] = M.up;
      if (M.cards[a].k === M.cards[b].k) { M.done.add(M.cards[a].k); M.up = []; setTimeout(() => { draw(); if (M.done.size === 6) done(); }, 250); }
      else setTimeout(() => { M.up = []; draw(); }, 900);
    }
  };
  const done = () => {
    const L = labS(), best = !L.match || M.moves < L.match; if (best) L.match = M.moves;
    L.xp = (L.xp || 0) + 12; L.plays = (L.plays || 0) + 1; save();
    $("#app").innerHTML = `<section class="view stack lab-play">${labBack()}<div class="block lab-res lab-pop"><span class="eyebrow">Memory Match</span><div class="big">${M.moves}</div>
      <p>moves · ${Math.round((Date.now() - M.t0) / 1000)} s · ${best ? "🎉 New best!" : "Best: " + L.match + " moves"} · +12 XP</p>
      <div class="lab-pairs" style="text-align:left">${pairs.map(p => `<div><span>${esc(p[0])}</span><b>${esc(p[1])}</b></div>`).join("")}</div>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn pri" type="button" id="again">New cards</button><button class="btn" type="button" data-lab-home>More games</button></div></div></section>`;
    labBindHome(); $("#again").onclick = labMatch;
  };
  draw(); window.scrollTo(0, 0);
}


/* ---------- decks from the lessons' own tables ---------- */
/** Rows of a lesson's n-th table as [prompt, answer, note] (tags stripped), so a deck never repeats the data. */
function labRows(lessonId, n){
  const strip = s => String(s == null ? "" : s).replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&minus;/g, "−").trim();
  const l = LESSONS.find(x => x.id === lessonId), t = l ? l.blocks.filter(b => b.k === "table")[n || 0] : null;
  return t ? t.rows.map(r => [strip(r[0]), strip(r[1]), strip(r[2])]) : [];
}
/** A "grand mix" deck: a few rows from every listed deck, with each deck's own question wording. */
function labMix(decks){
  // wrong options come from the whole deck (all), so a deck drawn only once or twice in the 80 still has enough
  return shuffle(decks.flatMap(d => { const all = [...new Set(d.pairs.map(p => p[1]))];
    return d.pairs.map(p => ({ p: d.q ? `${d.q} ${p[0]}${/[?:]$/.test(d.q) ? "" : "?"}` : p[0], a: p[1], note: p[2] || "", pool: d.id, all })); })).slice(0, 80);
}

<script>

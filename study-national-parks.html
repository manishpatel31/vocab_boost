{"id":"N1","heat":3,"title":"National parks: the basics and the records","hi":"राष्ट्रीय उद्यान: मूल बातें और रिकॉर्ड","blocks":[{"k":"hot","h":"Most asked: the <b>first<\/b> national park (Hailey, now Corbett, 1936), the <b>largest<\/b> (Hemis) and <b>smallest<\/b> (South Button Island), the state with the <b>most<\/b> (Madhya Pradesh), the <b>floating<\/b> park (Keibul Lamjao), and the difference between a <b>national park and a sanctuary<\/b>."},{"k":"story","h":"<p>A <b>national park<\/b> is the strictest kind of protected area under the <b>Wildlife (Protection) Act, 1972<\/b>. No grazing, no private rights, no human activity except tourism and research is allowed inside. A <b>wildlife sanctuary<\/b> is gentler: some local use goes on. A state government declares both; only the state legislature (with the National Board for Wildlife's advice) can change a national park's boundary.<\/p><p>India's first national park was <b>Hailey National Park<\/b> (1936), in the Kumaon hills — today's <b>Jim Corbett<\/b>. India now has about <b>106<\/b> national parks, covering a little over 1% of its land. <b>Madhya Pradesh<\/b> has the most.<\/p>"},{"k":"mapfig","title":"The record-holders","pins":[["Corbett — first (1936)",78.8,29.55,"","l"],["Hemis — largest",77.4,33.85,""],["South Button — smallest",93.02,12.22,"","l"],["Keibul Lamjao — floating",93.85,24.5,""],["Kuno — cheetahs (2022)",77.35,25.7,"","l"],["Gir — lions",70.8,21.15,""]],"cap":"First, largest, smallest, floating — and the two big-cat homes."},{"k":"table","title":"Records","head":["Record","Park","Note"],"rows":[["The first national park","Jim Corbett (Uttarakhand)","Set up in 1936 as Hailey National Park; renamed Ramganga, then Corbett (1957)."],["The largest national park","Hemis (Ladakh)","About 4,400 sq km — home of the snow leopard."],["The smallest national park","South Button Island (Andaman and Nicobar)","Less than 1 sq km."],["The state with the most national parks","Madhya Pradesh","Eleven — with the Andaman and Nicobar Islands (nine) close behind."],["The only floating national park","Keibul Lamjao (Manipur)","On the phumdis of Loktak Lake — home of the sangai deer."],["Where cheetahs came back to India","Kuno (Madhya Pradesh)","Project Cheetah, 17 September 2022 — cheetahs from Namibia."],["The only home of the wild Asiatic lion","Gir (Gujarat)",""],["The largest mangrove national park","Sundarban (West Bengal)","Also a tiger reserve and World Heritage site."]]},{"k":"indiamap","title":"Tap a state to see its national parks","cap":"Every national park in this app, by state. Punjab, Delhi and Lakshadweep have none."},{"k":"statechart","title":"National parks per state","cap":"Madhya Pradesh leads with 11, then the Andaman and Nicobar Islands (9)."},{"k":"table","title":"National park, sanctuary, tiger reserve","head":["","National park","Wildlife sanctuary"],"rows":[["Law","Wildlife (Protection) Act, 1972 (Section 35)","Wildlife (Protection) Act, 1972 (Section 18)"],["Human activity","None allowed — no grazing, no private rights","Some allowed if it does not harm wildlife"],["Boundaries","Changed only by the state legislature","Changed by the state government"],["About how many","About 106","About 570"],["Tiger reserve?","A tiger reserve is a separate label (NTCA) — its core is often a national park","Same"]]},{"k":"trick","h":"Records in one breath — <b>“First Corbett, Big Hemis, Tiny Button, Most MP, Floating Manipur”<\/b>."},{"k":"trap","h":"The <b>largest<\/b> national park is <b>Hemis<\/b>, but the largest <b>tiger reserve<\/b> is Nagarjunasagar-Srisailam and the largest <b>biosphere reserve<\/b> is the Great Rann of Kutch. Corbett was first called <b>Hailey<\/b>, then Ramganga."}],"sum":["National parks are declared under the Wildlife (Protection) Act, 1972 — no human activity inside.","First: Hailey (1936), now Jim Corbett. Largest: Hemis (Ladakh). Smallest: South Button Island.","Madhya Pradesh has the most national parks (11); the Andaman and Nicobar Islands have 9.","Keibul Lamjao (Manipur) floats on Loktak Lake; Kuno brought cheetahs back (2022).","India has about 106 national parks."],"part":["Part 1 · The basics and the north","मूल बातें और उत्तर भारत"],"g":"np"},
{"id":"N2","heat":3,"title":"The north: J&K, Ladakh, Himachal, Haryana, Uttarakhand, UP","hi":"उत्तर भारत के राष्ट्रीय उद्यान","blocks":[{"k":"hot","h":"Most asked: <b>Hemis<\/b> (Ladakh), <b>Dachigam<\/b> (hangul), <b>Great Himalayan<\/b> and <b>Pin Valley<\/b> (Himachal), <b>Corbett, Rajaji, Nanda Devi, Valley of Flowers<\/b> (Uttarakhand) and <b>Dudhwa<\/b> (UP)."},{"k":"story","h":"<p>The northern parks climb from the Terai grasslands to the high Himalaya. <b>Dudhwa<\/b> on the Nepal border has swamp deer and rhinos; <b>Corbett<\/b> and <b>Rajaji<\/b> in the Shivalik foothills have tigers and elephants. Higher up, <b>Nanda Devi<\/b> and the <b>Valley of Flowers<\/b> form a World Heritage site; <b>Great Himalayan<\/b> in Kullu is another.<\/p><p>Beyond the main range lie cold deserts: <b>Pin Valley<\/b> in Spiti and <b>Hemis<\/b> in Ladakh — India's largest national park and the best place to see the <b>snow leopard<\/b>. In the Kashmir valley, <b>Dachigam<\/b> protects the last <b>hangul<\/b>.<\/p>"},{"k":"mapfig","title":"The north: every national park","vb":"90 30 175 170","pins":[["1",77.4,33.85,"Hemis — Ladakh","n"],["2",75,34.13,"Dachigam — Jammu and Kashmir","n"],["3",75.9,33.4,"Kishtwar — Jammu and Kashmir","n"],["4",74.2,34.2,"Kazinag — Jammu and Kashmir","n"],["5",74.82,34.1,"City Forest (Salim Ali) — Jammu and Kashmir","n"],["6",77.6,31.75,"Great Himalayan — Himachal Pradesh","n"],["7",78,31.95,"Pin Valley — Himachal Pradesh","n"],["8",77.25,32,"Inderkilla — Himachal Pradesh","n"],["9",77.45,31.95,"Khirganga — Himachal Pradesh","n"],["10",77.45,30.45,"Simbalbara — Himachal Pradesh","n"],["11",77.5,30.35,"Kalesar — Haryana","n"],["12",76.89,28.46,"Sultanpur — Haryana","n"],["13",78.8,29.55,"Jim Corbett — Uttarakhand","n"],["14",78.15,30.05,"Rajaji — Uttarakhand","n"],["15",79.85,30.4,"Nanda Devi — Uttarakhand","n"],["16",79.6,30.72,"Valley of Flowers — Uttarakhand","n"],["17",79,31,"Gangotri — Uttarakhand","n"],["18",78.3,31.1,"Govind — Uttarakhand","n"],["19",80.6,28.5,"Dudhwa — Uttar Pradesh","n"]],"facts":[["1 · Hemis","Ladakh — The largest national park; snow leopard"],["2 · Dachigam","Jammu and Kashmir — Hangul (Kashmir stag)"],["3 · Kishtwar","Jammu and Kashmir — A high-altitude park"],["4 · Kazinag","Jammu and Kashmir — Markhor"],["5 · City Forest (Salim Ali)","Jammu and Kashmir — In Srinagar"],["6 · Great Himalayan","Himachal Pradesh — World Heritage site (2014); Kullu"],["7 · Pin Valley","Himachal Pradesh — Cold desert in Lahaul and Spiti; ibex, snow leopard"],["8 · Inderkilla","Himachal Pradesh — Kullu"],["9 · Khirganga","Himachal Pradesh — Kullu"],["10 · Simbalbara","Himachal Pradesh — Sirmaur; renamed Sher Jang National Park"],["11 · Kalesar","Haryana — Yamunanagar, in the Shivaliks"],["12 · Sultanpur","Haryana — A bird park near Gurugram; Ramsar site"],["13 · Jim Corbett","Uttarakhand — India's first national park; on the Ramganga"],["14 · Rajaji","Uttarakhand — Elephants; near Haridwar"],["15 · Nanda Devi","Uttarakhand — World Heritage site with the Valley of Flowers"],["16 · Valley of Flowers","Uttarakhand — Alpine meadows; World Heritage site"],["17 · Gangotri","Uttarakhand"],["18 · Govind","Uttarakhand — Uttarkashi"],["19 · Dudhwa","Uttar Pradesh — Swamp deer (barasingha), rhinos reintroduced; Lakhimpur Kheri"]],"cap":"Numbers match the list. Places are approximate park centres. Use ＋ or ⛶ to zoom in."},{"k":"table","title":"National parks of the north","head":["Park","State / UT","Remember"],"rows":[["Hemis","Ladakh","The largest national park; snow leopard."],["Dachigam","Jammu and Kashmir","Hangul (Kashmir stag)."],["Kishtwar","Jammu and Kashmir","A high-altitude park."],["Kazinag","Jammu and Kashmir","Markhor."],["City Forest (Salim Ali)","Jammu and Kashmir","In Srinagar."],["Great Himalayan","Himachal Pradesh","World Heritage site (2014); Kullu."],["Pin Valley","Himachal Pradesh","Cold desert in Lahaul and Spiti; ibex, snow leopard."],["Inderkilla","Himachal Pradesh","Kullu."],["Khirganga","H {"id":"N3","heat":3,"title":"The west: Rajasthan, Gujarat, Goa, Maharashtra","hi":"पश्चिम भारत के राष्ट्रीय उद्यान","blocks":[{"k":"hot","h":"Most asked: <b>Ranthambore, Sariska, Keoladeo, Desert<\/b> (Rajasthan), <b>Gir<\/b> and the <b>Marine National Park<\/b> (Gujarat), <b>Sanjay Gandhi<\/b> in Mumbai and <b>Tadoba<\/b>."},{"k":"story","h":"<p>Rajasthan's parks range from dry forest to desert: <b>Ranthambore<\/b> and <b>Sariska<\/b> for tigers, <b>Keoladeo<\/b> at Bharatpur for birds, and the <b>Desert National Park<\/b> near Jaisalmer, the last stronghold of the <b>great Indian bustard<\/b>.<\/p><p>Gujarat has <b>Gir<\/b>, the only wild home of the <b>Asiatic lion<\/b>, <b>Velavadar<\/b> for blackbuck and India's first <b>marine national park<\/b> in the Gulf of Kutch. In Maharashtra, <b>Sanjay Gandhi National Park<\/b> sits inside Mumbai, and <b>Tadoba<\/b> is the state's best-known tiger reserve.<\/p>"},{"k":"mapfig","title":"The west: every national park","vb":"20 190 230 265","pins":[["1",76.45,26,"Ranthambore — Rajasthan","n"],["2",76.4,27.3,"Sariska — Rajasthan","n"],["3",77.52,27.17,"Keoladeo Ghana — Rajasthan","n"],["4",70.6,26.5,"Desert — Rajasthan","n"],["5",75.9,24.9,"Mukundra Hills — Rajasthan","n"],["6",70.8,21.15,"Gir — Gujarat","n"],["7",72.05,22.03,"Velavadar (Blackbuck) — Gujarat","n"],["8",69.9,22.5,"Gulf of Kutch Marine — Gujarat","n"],["9",73.4,20.75,"Vansda — Gujarat","n"],["10",74.25,15.35,"Bhagwan Mahavir (Mollem) — Goa","n"],["11",72.9,19.22,"Sanjay Gandhi (Borivali) — Maharashtra","n"],["12",79.35,20.25,"Tadoba — Maharashtra","n"],["13",79.2,21.6,"Pench (Jawaharlal Nehru) — Maharashtra","n"],["14",77.1,21.4,"Gugamal — Maharashtra","n"],["15",73.85,17.15,"Chandoli — Maharashtra","n"],["16",80.15,20.95,"Nawegaon — Maharashtra","n"]],"facts":[["1 · Ranthambore","Rajasthan — Tigers among old ruins; Sawai Madhopur"],["2 · Sariska","Rajasthan — Tigers relocated after they were wiped out (2004–05); Alwar"],["3 · Keoladeo Ghana","Rajasthan — Bha  Reserve."],["Chandoli","Maharashtra","Sahyadri Tiger Reserve."],["Nawegaon","Maharashtra","Gondia."]]},{"k":"trick","h":"Rajasthan's five — <b>“Ran-Sar-Keo-Des-Muk”<\/b>: Ranthambore, Sariska, Keoladeo, Desert, Mukundra Hills."},{"k":"trap","h":"<b>Keoladeo<\/b> is a <b>national park<\/b> (and World Heritage site), though people call it the Bharatpur Bird Sanctuary. <b>Pench<\/b> is split between Madhya Pradesh and Maharashtra — each side is a separate national park."}],"sum":["Rajasthan: Ranthambore, Sariska, Keoladeo (Bharatpur), Desert (great Indian bustard), Mukundra Hills.","Gujarat: Gir (Asiatic lion), Velavadar (blackbuck), Gulf of Kutch Marine (first marine NP, 1982), Vansda.","Goa: Bhagwan Mahavir (Mollem).","Maharashtra: Sanjay Gandhi (Mumbai), Tadoba, Pench, Gugamal, Chandoli, Nawegaon."],"part":["Part 2 · West, centre, east and north-east","पश्चिम, मध्य, पूर्व और पूर्वोत्तर"],"g":"np"},
{"id":"N4","heat":3,"title":"The centre: Madhya Pradesh and Chhattisgarh","hi":"मध्य भारत के राष्ट्रीय उद्यान","blocks":[{"k":"hot","h":"Most asked: <b>Kanha<\/b> (barasingha), <b>Bandhavgarh<\/b>, <b>Panna<\/b>, <b>Pench<\/b>, <b>Kuno<\/b> (cheetahs) and <b>Madhya Pradesh having the most national parks<\/b>; in Chhattisgarh, <b>Indravati<\/b> (wild buffalo) and <b>Kanger Ghati<\/b> (caves)."},{"k":"story","h":"<p><b>Madhya Pradesh<\/b> is the 'Tiger State' and has the most national parks — eleven. <b>Kanha<\/b> saved the hard-ground <b>barasingha<\/b> from extinction; <b>Bandhavgarh<\/b> has one of the highest densities of tigers; <b>Panna<\/b> lost all its tigers and then brought them back. In 2022 <b>Kuno<\/b> became the home of India's reintroduced <b>cheetahs<\/b>.<\/p><p>MP also has two unusual parks: the <b>Fossil National Park<\/b> at Ghughua with plant fossils, and the <b>Dinosaur Fossil National Park<\/b> in Dhar with dinosaur eggs. <b>Chhattisgarh<\/b>'s <b>Indravati<\/b> protects the wild water buffalo.<\/p>"},{"k":"mapfig","title":"The centre: every national park","vb":"110 220 170 165","pins":[["1",80.6,22.3,"Kanha — Madhya Pradesh","n"],["2",81,23.7,"Bandhavgarh — Madhya Pradesh","n"],["3",80,24.7,"Panna — Madhya Pradesh","n"],["4",79.3,21.8,"Pench (Indira Priyadarshini) — Madhya Pradesh","n"],["5",78.2,22.5,"Satpura — Madhya Pradesh","n"],["6",77.35,25.7,"Kuno — Madhya Pradesh","n"],["7",77.85,25.45,"Madhav — Madhya Pradesh","n"],["8",82,23.85,"Sanjay — Madhya Pradesh","n"],["9",77.37,23.23,"Van Vihar — Madhya Pradesh","n"],["10",80.8,23,"Fossil (Ghughua) — Madhya Pradesh","n"],["11",74.8,22.4,"Dinosaur Fossil — Madhya Pradesh","n"],["12",80.7,19.2,"Indravati — Chhattisgarh","n"],["13",81.95,18.85,"Kanger Ghati (Kanger Valley) — Chhattisgarh","n"],["14",82.3,23.6,"Guru Ghasidas — Chhattisgarh","n"]],"facts":[["1 · Kanha","Madhya Pradesh — Hard-ground barasingha; the setting of The Jungle Book"],["2 · Bandhavgarh","Madhya Pradesh — A high density of tigers; Umaria"],["3 · Panna","Madhya Pradesh — Tigers brought back; on the Ken; biosphere reserve"],["4 · Pench (Indira Priyadarshini)","Madhya Pradesh — Seoni — The Jungle Book country"],["5 · Satpura","Madhya Pradesh — Pachmarhi"],["6 · Kuno","Madhya Pradesh — Project Cheetah (2022)"],["7 · Madhav","Madhya Pradesh — Shivpuri; became a tiger reserve in 2025"],["8 · Sanjay","Madhya Pradesh — Sidhi"],["9 · Van Vihar","Madhya Pradesh — In Bhopal"],["10 · Fossil (Ghughua)","Madhya Pradesh — Plant fossils; Dindori"],["11 · Dinosaur Fossil","Madhya Pradesh — Dinosaur eggs; Dhar"],["12 · Indravati","Chhattisgarh — Wild buffalo; Bijapur"],["13 · Kanger Ghati (Kanger Valley)","Chhattisgarh — Limestone caves; Bastar"],["14 · Guru Ghasidas","Chhattisgarh — Koriya; now in the Guru Ghasidas–Tamor Pingla Tiger Reserve"]],"cap":"Numbers match the list. Places are approximate park centres. Use ＋ or ⛶ to zoom in."},{"k":"table","title":"National parks of Madhya Pradesh and Chhattisgarh","head":["Park","State / UT","Remember"],"rows":[["Kanha","Madhya Pradesh","Hard-ground barasingha; the setting of The Jungle Book."],["Bandhavgarh","Madhya Pradesh","A high density of tigers; Umaria."],["Panna","Madhya Pradesh","Tigers brought back; on the Ken; biosphere reserve."],["Pench (Indira Priyadarshini)","Madhya Pradesh","Seoni — The Jungle Book country."],["Satpura","Madhya Pradesh","Pachmarhi."],["Kuno","Madhya Pradesh","Project Cheetah (2022)."],["Madhav","Madhya Pradesh","Shivpuri; became a tiger reserve in 2025."],["Sanjay","Madhya Pradesh","Sidhi."],["Van Vihar","Madhya Pradesh","In Bhopal."],["Fossil (Ghughua)","Madhya Pradesh","Plant fossils; Dindori."],["Dinosaur Fossil","Madhya Pradesh","Dinosaur eggs; Dhar."],["Indravati","Chhattisgarh","Wild buffalo; Bijapur."],["Kanger Ghati (Kanger Valley)","Chhattisgarh","Limestone caves; Bastar."],["Guru Ghasidas","Chhattisgarh","Koriya; now in the Guru Ghasidas–Tamor Pingla Tiger Reserve."]]},{"k":"trick","h":"MP's big tiger four — <b>“Kanha Bandh Panna Pench”<\/b>. Add <b>Kuno<\/b> for cheetahs and <b>Satpura<\/b> for Pachmarhi."},{"k":"trap","h":"<b>Kuno<\/b> is in <b>Madhya Pradesh<\/b>, not Rajasthan. The second cheetah home (2025) is <b>Gandhi Sagar<\/b> Wildlife Sanctuary, also in MP — a sanctuary, not a national park."}],"sum":["Madhya Pradesh has the most national parks: Kanha, Bandhavgarh, Panna, Pench, Satpura, Kuno, Madhav, Sanjay, Van Vihar, and two fossil parks.","Kanha — barasingha; Kuno — cheetahs (2022).","Chhattisgarh: Indravati (wild buffalo), Kanger Ghati (caves), Guru Ghasidas."],"part":["Part 2 · West, centre, east and north-east","पश्चिम, मध्य, पूर्व और पूर्वोत्तर"],"g":"np"},
{"id":"N5","heat":3,"title":"The east: Bihar, Jharkhand, Odisha, West Bengal, Sikkim","hi":"पूर्वी भारत के राष्ट्रीय उद्यान","blocks":[{"k":"hot","h":"Most asked: <b>Valmiki<\/b> (Bihar's only), <b>Betla<\/b> (Jharkhand's only), <b>Simlipal<\/b> and <b>Bhitarkanika<\/b> (Odisha), <b>Sundarban<\/b>, <b>Jaldapara<\/b> and <b>Singalila<\/b> (West Bengal), and <b>Khangchendzonga<\/b> (Sikkim)."},{"k":"story","h":"<p><b>West Bengal<\/b> runs from the mangroves of the <b>Sundarbans<\/b> to the snows of <b>Singalila<\/b>, where red pandas live on the Nepal border. In between, the Dooars parks — <b>Jaldapara<\/b> and <b>Gorumara<\/b> — have one-horned rhinos.<\/p><p><b>Odisha<\/b> has <b>Simlipal<\/b> (tigers, waterfalls) and <b>Bhitarkanika<\/b>, home of the saltwater crocodile. <b>Sikkim<\/b>'s <b>Khangchendzonga<\/b> is India's only <b>mixed<\/b> World Heritage site. Bihar and Jharkhand each have just one: <b>Valmiki<\/b> and <b>Betla<\/b>.<\/p>"},{"k":"mapfig","title":"The east: every national park","vb":"280 180 140 170","pins":[["1",84.1,27.3,"Valmiki — Bihar","n"],["2",84.2,23.9,"Betla — Jharkhand","n"],["3",86.4,21.8,"Simlipal — Odisha","n"],["4",86.95,20.7,"Bhitarkanika — Odisha","n"],["5",88.9,21.95,"Sundarban — West Bengal","n"],["6",89.3,26.65,"Jaldapara — West Bengal","n"],["7",88.8,26.7,"Gorumara — West Bengal","n"],["8",89.5,26.7,"Buxa — West Bengal","n"],["9",88.75,27.05,"Neora Valley — West Bengal","n"],["10",88,27.15,"Singalila — West Bengal","n"],["11",88.3,27.65,"Khangchendzonga — Sikkim","n"]],"facts":[["1 · Valmiki","Bihar — Bihar's only national park and tiger reserve; West Champaran"],["2 · Betla","Jharkhand — Jharkhand's only national park; Palamau"],["3 · Simlipal","Odisha — Tigers; Mayurbhanj; also a biosphere reserve"],["4 · Bhitarkanika","Odisha — Saltwater crocodiles and mangroves"],["5 · Sundarban","West Bengal — Mangroves and tigers; World Heritage site"],["6 · Jaldapara","West Bengal — One-horned rhinos; Alipurduar"],["7 · Gorumara","West Bengal — Rhinos; the Dooars"],["8 · Buxa","West Bengal — Tiger reserve; Alipurduar"],["9 · Neora Valley","West Bengal — Red panda; Kalimpong"],["10 · Singalila","West Bengal — Red panda; Darjeeling"],["11 · Khangchendzonga","Sikkim — India's only mixed World Heritage site (2016)"]],"cap":"Numbers match the list. Places are approximate park centres. Use ＋ or ⛶ to zoom in."},{"k":"table","title":"National parks of the east","head":["Park","State / UT","Remember"],"rows":[["Valmiki","Bihar","Bihar's only national park and tiger reserve; West Champaran."],["Betla","Jharkhand","Jharkhand's only national park; Palamau."],["Simlipal","Odisha","Tigers; Mayurbhanj; also a biosphere reserve."],["Bhitarkanika","Odisha","Saltwater crocodiles and mangroves."],["Sundarban","West Bengal","Mangroves and tigers; World Heritage site."],["Jaldapara","West Bengal","One-horned rhinos; Alipurduar."],["Gorumara","West Bengal","Rhinos; the Dooars."],["Buxa","West Bengal","Tiger reserve; Alipurduar."],["Neora Valley","West Bengal","Red panda; Kalimpong."],["Singalila","West Bengal","Red panda; Darjeeling."],["Khangchendzonga","Sikkim","India's only mixed World Heritage site (2016)."]]},{"k":"trick","h":"One-park states of the east — <b>“Valmiki Bihar, Betla Jharkhand”<\/b> — like a pair of rhymes."},{"k":"trap","h":"<b>Bhitarkanika<\/b> (Odisha) is for <b>saltwater crocodiles<\/b>; the <b>Sundarbans<\/b> (West Bengal) is for tigers in mangroves — both have mangroves. <b>Khangchendzonga<\/b> is a <b>mixed<\/b> site, not purely natural."}],"sum":["Bihar: Valmiki; Jharkhand: Betla — one each.","Odisha: Simlipal (tigers), Bhitarkanika (saltwater crocodiles).","West Bengal: Sundarban, Jaldapara, Gorumara, Buxa, Neora Valley, Singalila (red panda).","Sikkim: Khangchendzonga — India's only mixed World Heritage site (2016)."],"part":["Part 2 · West, centre, east and north-east","पश्चिम, मध्य, पूर्व और पूर्वोत्तर"],"g":"np"},
{"id":"N6","heat":3,"title":"The north-east","hi":"पूर्वोत्तर भारत के राष्ट्रीय उद्यान","blocks":[{"k":"hot","h":"Most asked: <b>Kaziranga<\/b> and <b>Manas<\/b> (Assam), <b>Keibul Lamjao<\/b> (floating, sangai), <b>Namdapha<\/b> (four big cats), <b>Nokrek<\/b> and <b>Balphakram<\/b> (Meghalaya), and Assam's two new parks of 2021."},{"k":"story","h":"<p><b>Assam<\/b> has seven national parks. <b>Kaziranga<\/b> holds about two-thirds of the world's <b>one-horned rhinos<\/b>; <b>Manas<\/b>, on the Bhutan border, has golden langurs and the tiny pygmy hog. <b>Dihing Patkai<\/b> and <b>Raimona<\/b> became national parks in 2021.<\/p><p>In Arunachal, <b>Namdapha<\/b> is the only park with <b>four big cats<\/b> — tiger, leopard, clouded leopard and snow leopard. Manipur's <b>Keibul Lamjao<\/b> floats on mats of vegetation (phumdis) on Loktak Lake and is the last home of the <b>sangai<\/b> deer.<\/p>"},{"k":"mapfig","title":"The north-east: every national park","vb":"395 165 150 145","pins":[["1",93.4,26.6,"Kaziranga — Assam","n"],["2",91,26.7,"Manas — Assam","n"],["3",92.8,26.95,"Nameri — Assam","n"],["4",92.3,26.55,"Orang (Rajiv Gandhi) — Assam","n"],["5",95.4,27.6,"Dibru-Saikhowa — Assam","n"],["6",95.5,27.3,"Dihing Patkai — Assam","n"],["7",89.95,26.6,"Raimona — Assam","n"],["8",96.4,27.5,"Namdapha — Arunachal Pradesh","n"],["9",94.9,28.6,"Mouling — Arunachal Pradesh","n"],["10",93.85,24.5,"Keibul Lamjao — Manipur","n"],["11",94.5,25.1,"Sirohi — Manipur","n"],["12",90.3,25.68,"Nokrek — Meghalaya","n"],["13",90.85,25.35,"Balphakram — Meghalaya","n"],["14",93,22.65,"Phawngpui (Blue Mountain) — Mizoram","n"],["15",93.3,23.6,"Murlen — Mizoram","n"],["16",93.5,25.6,"Ntangki (Intanki) — Nagaland","n"],["17",91.32,23.66,"Clouded Leopard — Tripura","n"],["18",91.75,23.4,"Bison (Rajbari) — Tripura","n"]],"facts":[["1 · Kaziranga","Assam — One-horned rhinos; World Heritage site"],["2 · Manas","Assam — World Heritage site; golden langur, pygmy hog"],["3 · Nameri","Assam — White-winged wood duck"],["4 · Orang (Rajiv Gandhi)","Assam — 'Mini Kaziranga'"],["5 · Dibru-Saikhowa","Assam — Feral horses; also a biosphere reserve"],["6 · Dihing Patkai","Assam — Notified 2021"],["7 · Raimona","Assam — Notified 2021"],["8 · Namdapha","Arunachal Pradesh — Four big cats: tiger, leopard, clouded and snow leopard"],["9 · Mouling","Arunachal Pradesh"],["10 · Keibul Lamjao","Manipur — The floating park; sangai deer"],["11 · Sirohi","Manipur — Shirui lily"],["12 · Nokrek","Meghalaya — Wild citrus; biosphere reserve"],["13 · Balphakram","Meghalaya — 'Land of perpetual winds'"],["14 · Phawngpui (Blue Mountain)","Mizoram"],["15 · Murlen","Mizoram"],["16 · Ntangki (Intanki)","Nagaland — Nagaland's only national park"],["17 · Clouded Leopard","Tripura — Inside Sepahijala"],["18 · Bison (Rajbari)","Tripura"]],"cap":"Numbers match the list. Places are approximate park centres. Use ＋ or ⛶ to zoom in."},{"k":"table","title":"National parks of the north-east","head":["Park","State / UT","Remember"],"rows":[["Kaziranga","Assam","One-horned rhinos; World Heritage site."],["Manas","Assam","World Heritage site; golden langur, pygmy hog."],["Nameri","Assam","White-winged wood duck."],["Orang (Rajiv Gandhi)","Assam","'Mini Kaziranga'."],["Dibru-Saikhowa","Assam","Feral horses; also a biosphere reserve."],["Dihing Patkai","Assam","Notified 2021."],["Raimona","Assam","Notified 2021."],["Namdapha","Arunachal Pradesh","Four big cats: tiger, leopard, clouded and snow leopard."],["Mouling","Arunachal Pradesh",""],["Keibul Lamjao","Manipur","The floating park; sangai deer."],["Sirohi","Manipur","Shirui lily."],["Nokrek","Meghalaya","Wild citrus; biosphere reserve."],["Balphakram","Meghalaya","'Land of perpetual winds'."],["Phawngpui (Blue Mountain)","Mizoram",""],["Murlen","Mizoram",""],["Ntangki (Intanki)","Nagaland","Nagaland's only national park."],["Clouded Leopard","Tripura","Inside Sepahijala."],["Bison (Rajbari)","Tripura",""]]},{"k":"trick","h":"Assam's seven — <b>“Kazi Manas Nameri Orang Dibru Dihing Raimona”<\/b>."},{"k":"trap","h":"<b>Keibul Lamjao<\/b> is in <b>Manipur<\/b> (on Loktak Lake), not Assam. <b>Nokrek<\/b> is a national park <i>and<\/i> a biosphere reserve in Meghalaya. <b>Ntangki<\/b> is Nagaland's only national park."}],"sum":["Assam: Kaziranga (rhino), Manas (World Heritage), Nameri, Orang, Dibru-Saikhowa, Dihing Patkai and Raimona (2021).","Arunachal: Namdapha (four big cats), Mouling.","Manipur: Keibul Lamjao (floating, sangai), Sirohi.","Meghalaya: Nokrek, Balphakram; Mizoram: Phawngpui, Murlen; Nagaland: Ntangki; Tripura: Clouded Leopard, Bison."],"part":["Part 2 · West, centre, east and north-east","पश्चिम, मध्य, पूर्व और पूर्वोत्तर"],"g":"np"},
{"id":"N7","heat":3,"title":"The south: Karnataka, Kerala, Tamil Nadu","hi":"दक्षिण भारत के राष्ट्रीय उद्यान","blocks":[{"k":"hot","h":"Most asked: <b>Bandipur, Nagarhole<\/b> (Karnataka), <b>Periyar, Eravikulam, Silent Valley<\/b> (Kerala), <b>Mudumalai<\/b> and the <b>Gulf of Mannar<\/b> (Tamil Nadu) — and which animal each protects."},{"k":"story","h":"<p>Where Karnataka, Kerala and Tamil Nadu meet, <b>Bandipur<\/b>, <b>Nagarhole<\/b> and <b>Mudumalai<\/b> form one great forest, part of the <b>Nilgiri Biosphere Reserve<\/b> — the best place in the world to see Asian elephants. Kerala's <b>Silent Valley<\/b> was saved from a dam in the 1980s and protects the <b>lion-tailed macaque<\/b>; <b>Eravikulam<\/b> protects the <b>Nilgiri tahr<\/b>.<\/p><p>Off Tamil Nadu, the <b>Gulf of Mannar Marine National Park<\/b> protects coral reefs and dugongs; <b>Guindy<\/b> sits inside Chennai.<\/p>"},{"k":"mapfig","title":"The south: every national park","vb":"100 435 145 145","pins":[["1",76.55,11.7,"Bandipur — Karnataka","n"],["2",76.15,12,"Nagarhole (Rajiv Gandhi) — Karnataka","n"],["3",75.25,13.2,"Kudremukh — Karnataka","n"],["4",77.58,12.8,"Bannerghatta — Karnataka","n"],["5",74.4,15,"Anshi — Karnataka","n"],["6",77.2,9.5,"Periyar — Kerala","n"],["7",77.07,10.15,"Eravikulam — Kerala","n"],["8",76.45,11.08,"Silent Valley — Kerala","n"],["9",77.1,10.25,"Anamudi Shola — Kerala","n"],["10",77.25,9.98,"Mathikettan Shola — Kerala","n"],["11",77.2,10.12,"Pambadum Shola — Kerala","n"],["12",76.6,11.6,"Mudumalai — Tamil Nadu","n"],["13",76.5,11.35,"Mukurthi — Tamil Nadu","n"],["14",77,10.4,"Anamalai (Indira Gandhi) — Tamil Nadu","n"],["15",79,9.15,"Gulf of Mannar Marine — Tamil Nadu","n"],["16",80.23,13,"Guindy — Tamil Nadu","n"]],"facts":[["1 · Bandipur","Karnataka — Tigers and elephants; part of the Nilgiri Biosphere Reserve"],["2 · Nagarhole (Rajiv Gandhi)","Karnataka — Tigers and elephants"],["3 · Kudremukh","Karnataka — 'Horse face' peak; shola grasslands"],["4 · Bannerghatta","Karnataka — Near Bengaluru; India's first butterfly park"],["5 · Anshi","Karnataka — Part of the Kali Tiger Reserve"],["6 · Periyar","Kerala — Elephants; a tiger reserve on the Periyar lake"],["7 · Eravikulam","Kerala — Nilgiri tahr; Neelakurinji blooms"],["8 · Silent Valley","Kerala — Lion-tailed macaque; saved by a famous campaign"],["9 · Anamudi Shola","Kerala"],["10 · Mathikettan Shola","Kerala"],["11 · Pambadum Shola","Kerala"],["12 · Mudumalai","Tamil Nadu — Elephants and tigers; Nilgiris"],["13 · Mukurthi","Tamil Nadu — Nilgiri tahr; Nilgiris"],["14 · Anamalai (Indira Gandhi)","Tamil Nadu — Lion-tailed macaque; Coimbatore"],["15 · Gulf of Mannar Marine","Tamil Nadu — Corals and dugongs; India's first marine biosphere reserve"],["16 · Guindy","Tamil Nadu — Inside Chennai; blackbuck"]],"cap":"Numbers match the list. Places are approximate park centres. Use ＋ or ⛶ to zoom in."},{"k":"table","title":"National parks of the south","head":["Park","State / UT","Remember"],"rows":[["Bandipur","Karnataka","Tigers and elephants; part of the Nilgiri Biosphere Reserve."],["Nagarhole (Rajiv Gandhi)","Karnataka","Tigers and elephants."],["Kudremukh","Karnataka","'Horse face' peak; shola grasslands."],["Bannerghatta","Karnataka","Near Bengaluru; India's first butterfly park."],["Anshi","Karnataka","Part of the Kali Tiger Reserve."],["Periyar","Kerala","Elephants; a tiger reserve on the Periyar lake."],["Eravikulam","Kerala","Nilgiri tahr; Neelakurinji blooms."],["Silent Valley","Kerala","Lion-tailed macaque; saved by a famous campaign."],["Anamudi Shola","Kerala",""],["Mathikettan Shola","Kerala",""],["Pambadum Shola","Kerala",""],["Mudumalai","Tamil Nadu","Elephants and tigers; Nilgiris."],["Mukurthi","Tamil Nadu","Nilgiri tahr; Nilgiris."],["Anamalai (Indira Gandhi)","Tamil Nadu","Lion-tailed macaque; Coimbatore."],["Gulf of Mannar Marine","Tamil Nadu","Corals and dugongs; India's first marine biosphere reserve."],["Guindy","Tamil Nadu","Inside Chennai; blackbuck."]]},{"k":"trick","h":"The tri-junction trio — <b>“Bandipur–Nagarhole–Mudumalai”<\/b> (Karnataka, Karnataka, Tamil Nadu) plus Wayanad (Kerala, a sanctuary) — one forest, four names."},{"k":"trap","h":"<b>Periyar<\/b> is in <b>Kerala<\/b>, though the Periyar lake's dam (Mullaperiyar) is run by Tamil Nadu. <b>Anamalai<\/b> (Tamil Nadu) is also called <b>Indira Gandhi<\/b> National Park; <b>Nagarhole<\/b> is also <b>Rajiv Gandhi<\/b> National Park."}],"sum":["Karnataka: Bandipur, Nagarhole, Kudremukh, Bannerghatta, Anshi.","Kerala: Periyar, Eravikulam (Nilgiri tahr), Silent Valley (lion-tailed macaque) and three sholas.","Tamil Nadu: Mudumalai, Mukurthi, Anamalai, Gulf of Mannar Marine, Guindy (Chennai).","Bandipur–Nagarhole–Mudumalai lie in the Nilgiri Biosphere Reserve."],"part":["Part 3 · The south, the islands, animals and news","दक्षिण, द्वीप, जीव और समाचार"],"g":"np"},
{"id":"N8","heat":2,"title":"Andhra Pradesh, Telangana and the islands","hi":"आंध्र, तेलंगाना और द्वीप","blocks":[{"k":"hot","h":"Most asked: the <b>Andaman and Nicobar parks<\/b> (smallest — South Button; marine parks — Mahatma Gandhi and Rani Jhansi; Saddle Peak), and Hyderabad's three city parks."},{"k":"story","h":"<p>The <b>Andaman and Nicobar Islands<\/b> have nine national parks — more than any state except Madhya Pradesh. Two are <b>marine<\/b> parks of coral reefs (<b>Mahatma Gandhi<\/b> at Wandoor and <b>Rani Jhansi<\/b>), three are tiny islands (the <b>Button<\/b> islands, including India's smallest park), and <b>Campbell Bay<\/b> and <b>Galathea Bay<\/b> guard the rainforest of Great Nicobar.<\/p><p>Telangana's three national parks are all in or around <b>Hyderabad<\/b>. Andhra Pradesh has <b>Papikonda<\/b> on the Godavari gorge and <b>Sri Venkateswara<\/b> near Tirupati.<\/p>"},{"k":"mapfig","title":"Andhra, Telangana and the islands: every national park","vb":"175 385 320 240","pins":[["1",81.6,17.5,"Papikonda — Andhra Pradesh","n"],["2",79.3,13.6,"Sri Venkateswara — Andhra Pradesh","n"],["3",78.55,14.73,"Rajiv Gandhi (Rameswaram) — Andhra Pradesh","n"],["4",78.42,17.42,"Kasu Brahmananda Reddy — Telangana","n"],["5",78.35,17.37,"Mrugavani — Telangana","n"],["6",78.57,17.33,"Mahavir Harina Vanasthali — Telangana","n"],["7",92.6,11.6,"Mahatma Gandhi Marine (Wandoor) — Andaman and Nicobar Islands","n"],["8",93.03,12.05,"Rani Jhansi Marine — Andaman and Nicobar Islands","n"],["9",92.95,13.15,"Saddle Peak — Andaman and Nicobar Islands","n"],["10",92.73,11.72,"Mount Harriet (Mount Manipur) — Andaman and Nicobar Islands","n"],["11",93.9,7,"Campbell Bay — Andaman and Nicobar Islands","n"],["12",93.85,6.85,"Galathea Bay — Andaman and Nicobar Islands","n"],["13",93.02,12.22,"South Button Island — Andaman and Nicobar Islands","n"],["14",93,12.27,"Middle Button Island — Andaman and Nicobar Islands","n"],["15",92.98,12.32,"North Button Island — Andaman and Nicobar Islands","n"]],"facts":[["1 · Papikonda","Andhra Pradesh — On the Godavari gorge"],["2 · Sri Venkateswara","Andhra Pradesh — Tirupati"],["3 · Rajiv Gandhi (Rameswaram)","Andhra Pradesh — Kadapa"],["4 · Kasu Brahmananda Reddy","Telangana — Inside Hyderabad"],["5 · Mrugavani","Telangana — Hyderabad"],["6 · Mahavir Harina Vanasthali","Telangana — Deer park near Hyderabad"],["7 · Mahatma Gandhi Marine (Wandoor)","Andaman and Nicobar Islands — Coral reefs near Sri Vijaya Puram"],["8 · Rani Jhansi Marine","Andaman and Nicobar Islands — Ritchie's Archipelago"],["9 · Saddle Peak","Andaman and Nicobar Islands — The highest point of the islands"],["10 · Mount Harriet (Mount Manipur)","Andaman and Nicobar Islands — Renamed Mount Manipur National Park in 2021"],["11 · Campbell Bay","Andaman and Nicobar Islands — Great Nicobar"],["12 · Galathea Bay","Andaman and Nicobar Islands — Great Nicobar; leatherback turtles"],["13 · South Button Island","Andaman and Nicobar Islands — India's smallest national park"],["14 · Middle Button Island","Andaman and Nicobar Islands"],["15 · North Button Island","Andaman and Nicobar Islands"]],"cap":"Numbers match the list. Places are approximate park centres. Use ＋ or ⛶ to zoom in."},{"k":"table","title":"National parks of AP, Telangana and the islands","head":["Park","State / UT","Remember"],"rows":[["Papikonda","Andhra Pradesh","On the Godavari gorge."],["Sri Venkateswara","Andhra Pradesh","Tirupati."],["Rajiv Gandhi (Rameswaram)","Andhra Pradesh","Kadapa."],["Kasu Brahmananda Reddy","Telangana","Inside Hyderabad."],["Mrugavani","Telangana","Hyderabad."],["Mahavir Harina Vanasthali","Telangana","Deer park near Hyderabad."],["Mahatma Gandhi Marine (Wandoor)","Andaman and Nicobar Islands","Coral reefs near Sri Vijaya Puram."],["Rani Jhansi Marine","Andaman and Nicobar Islands","Ritchie's Archipelago."],["Saddle Peak","Andaman and Nicobar Islands","The highest point of the islands."],["Mount Harriet (Mount Manipur)","Andaman and Nicobar Islands","Renamed Mount Manipur National Park in 2021."],["Campbell Bay","Andaman and Nicobar Islands","Great Nicobar."],["Galathea Bay","Andaman and Nicobar Islands","Great Nicobar; leatherback turtles."],["South Button Island","Andaman and Nicobar Islands","India's smallest national park."],["Middle Button Island","Andaman and Nicobar Islands",""],["North Button Island","Andaman and Nicobar Islands",""]]},{"k":"trick","h":"The Andamans' nine — <b>“3 Buttons, 2 Marines, 2 Bays, Saddle and Harriet”<\/b>."},{"k":"trap","h":"<b>Mount Harriet<\/b> was renamed <b>Mount Manipur<\/b> National Park in 2021. <b>Lakshadweep<\/b> has no national park. The capital Port Blair is now <b>Sri Vijaya Puram<\/b>."}],"sum":["A&N Islands: 9 national parks — South, Middle and North Button; Mahatma Gandhi and Rani Jhansi Marine; Campbell Bay, Galathea Bay; Saddle Peak; Mount Harriet (Mount Manipur).","Telangana: Kasu Brahmananda Reddy, Mrugavani, Mahavir Harina Vanasthali — all around Hyderabad.","Andhra Pradesh: Papikonda, Sri Venkateswara, Rajiv Gandhi (Rameswaram)."],"part":["Part 3 · The south, the islands, animals and news","दक्षिण, द्वीप, जीव और समाचार"],"g":"np"},
{"id":"N9","heat":3,"title":"Animals and their parks","hi":"जीव और उनके उद्यान","blocks":[{"k":"hot","h":"Most asked: <b>animal → park<\/b> — lion–Gir, rhino–Kaziranga, hangul–Dachigam, sangai–Keibul Lamjao, barasingha–Kanha, Nilgiri tahr–Eravikulam, saltwater crocodile–Bhitarkanika, great Indian bustard–Desert, cheetah–Kuno."},{"k":"story","h":"<p>Many parks exist to save one animal. The <b>Asiatic lion<\/b> survives only in and around <b>Gir<\/b>; the <b>hangul<\/b> only in <b>Dachigam<\/b>; the <b>sangai<\/b> only on the floating meadows of <b>Keibul Lamjao<\/b>. <b>Kanha<\/b> brought the hard-ground <b>barasingha<\/b> back from about 66 animals in 1970.<\/p><p>Learn these as pairs — exams give the animal and ask for the park, or the other way round.<\/p>"},{"k":"table","title":"Animal → park","head":["Animal","Park","Note"],"rows":[["Asiatic lion","Gir","Gujarat — the only wild population."],["one-horned rhinoceros","Kaziranga","Also Manas, Orang, Jaldapara, Gorumara."],["snow leopard","Hemis",""],["hangul (Kashmir stag)","Dachigam",""],["sangai (brow-antlered deer)","Keibul Lamjao","Manipur's state animal."],["hard-ground barasingha","Kanha","Madhya Pradesh's state animal."],["Nilgiri tahr","Eravikulam",""],["Lion-tailed macaque","Silent Valley",""],["saltwater crocodile","Bhitarkanika",""],["great Indian bustard","Desert","Rajasthan's state bird."],["blackbuck","Velavadar (Blackbuck)",""],["wild water buffalo","Indravati","Chhattisgarh's state animal."],["golden langur","Manas",""],["cheetah","Kuno","Brought from Namibia and South Africa (2022–23)."],["red panda","Singalila","Also Neora Valley."],["migratory birds (once the Siberian crane)","Keoladeo Ghana",""],["dugong and its coral reefs","Gulf of Mannar Marine",""]]},{"k":"photos","title":"The animals in pictures","items":[["Asiatic_lion","Asiatic lion","Gir"],["Indian_rhinoceros","One-horned rhino","Kaziranga"],["Snow_leopard","Snow leopard","Hemis"],["Kashmir_stag","Hangul","Dachigam"],["Eld's_deer","Sangai","Keibul Lamjao"],["Barasingha","Barasingha","Kanha"],["Nilgiri_tahr","Nilgiri tahr","Eravikulam"],["Lion-tailed_macaque","Lion-tailed macaque","Silent Valley"],["Saltwater_crocodile","Saltwater crocodile","Bhitarkanika"],["Great_Indian_bustard","Great Indian bustard","Desert NP"],["Wild_water_buffalo","Wild water buffalo","Indravati"],["Golden_langur","Golden langur","Manas"],["Cheetah","Cheetah","Kuno"],["Red_panda","Red panda","Singalila"],["Blackbuck","Blackbuck","Velavadar"]]},{"k":"trick","h":"Endemic pairs — <b>“Lion Gir, Hangul Dachi, Sangai Keibul, Tahr Eravi”<\/b>: one animal, one place."},{"k":"trap","h":"<b>Rhinos<\/b> live in several parks (Kaziranga, Manas, Orang, Jaldapara, Gorumara, Dudhwa) — but the answer for 'best known' is <b>Kaziranga<\/b>. The <b>cheetah<\/b> came back to <b>Kuno<\/b>, not Gir."}],"sum":["Lion — Gir; rhino — Kaziranga; snow leopard — Hemis; hangul — Dachigam; sangai — Keibul Lamjao.","Barasingha — Kanha; Nilgiri tahr — Eravikulam; lion-tailed macaque — Silent Valley.","Saltwater crocodile — Bhitarkanika; great Indian bustard — Desert NP; wild buffalo — Indravati.","Cheetah — Kuno (2022); red panda — Singalila."],"part":["Part 3 · The south, the islands, animals and news","दक्षिण, द्वीप, जीव और समाचार"],"g":"np"},
{"id":"N10","heat":2,"title":"World Heritage parks and parks in the news","hi":"विश्व धरोहर उद्यान और समाचार","blocks":[{"k":"hot","h":"Most asked: which national parks are <b>natural World Heritage sites<\/b> and when, <b>Project Cheetah<\/b> (Kuno 2022), new and renamed parks (Dihing Patkai, Raimona, Mount Manipur), and tiger reserves that are also national parks."},{"k":"story","h":"<p>Seven of India's natural (or mixed) World Heritage sites are national parks: <b>Kaziranga, Manas and Keoladeo<\/b> (1985), the <b>Sundarbans<\/b> (1987), <b>Nanda Devi<\/b> (1988, with the Valley of Flowers added in 2005), the <b>Great Himalayan<\/b> (2014) and <b>Khangchendzonga<\/b> (2016, mixed). The eighth natural site, the <b>Western Ghats<\/b>, is a chain of many parks and sanctuaries.<\/p><p><b>Project Cheetah<\/b> brought eight cheetahs from Namibia to <b>Kuno<\/b> on 17 September 2022, and twelve more from South Africa in 2023. Assam added <b>Dihing Patkai<\/b> and <b>Raimona<\/b> in 2021.<\/p>"},{"k":"table","title":"National parks on the World Heritage list","head":["Park","Year listed","Note"],"rows":[["Kaziranga","1985","Assam — natural World Heritage site."],["Manas","1985","Assam."],["Keoladeo Ghana","1985","Rajasthan."],["Sundarban","1987","West Bengal."],["Nanda Devi and Valley of Flowers","1988","Valley of Flowers added 2005."],["Great Himalayan","2014","Himachal Pradesh."],["Khangchendzonga","2016","Sikkim — India's only mixed (natural and cultural) site."]]},{"k":"tlfig","title":"World Heritage parks, year by year","rows":[[1985,"Kaziranga","Assam"],[1985,"Manas","Assam"],[1985,"Keoladeo Ghana","Rajasthan"],[1987,"Sundarban","West Bengal"],[1988,"Nanda Devi and Valley of Flowers","Valley of Flowers added 2005"],[2014,"Great Himalayan","Himachal Pradesh"],[2016,"Khangchendzonga","Sikkim"]],"cap":"Kaziranga, Manas and Keoladeo were the first (1985); Khangchendzonga (2016) is the only mixed site."},{"k":"photos","title":"In pictures","items":[["Kaziranga_National_Park","Kaziranga","1985"],["Keoladeo_National_Park","Keoladeo","1985"],["Sundarbans_National_Park","Sundarbans","1987"],["Valley_of_Flowers_National_Park","Valley of Flowers","2005"],["Great_Himalayan_National_Park","Great Himalayan","2014"],["Khangchendzonga_National_Park","Khangchendzonga","2016"]]},{"k":"facts","title":"In the news","rows":[["Project Cheetah","Kuno, 17 September 2022 (from Namibia); more from South Africa, February 2023"],["Second cheetah home","Gandhi Sagar Wildlife Sanctuary, MP (2025)"],["New national parks","Dihing Patkai and Raimona, Assam (2021)"],["Renamed","Mount Harriet → Mount Manipur (2021); Orang → Rajiv Gandhi Orang"],["Madhav (MP)","Declared a tiger reserve in 2025"]]},{"k":"trick","h":"The 1985 trio — <b>“K-M-K”<\/b>: <b>K<\/b>aziranga, <b>M<\/b>anas, <b>K<\/b>eoladeo. Then Sundarbans 1987, Nanda Devi 1988, Great Himalayan 2014, Khangchendzonga 2016."},{"k":"trap","h":"<b>Khangchendzonga<\/b> is <b>mixed<\/b> (natural and cultural) — the only one in India. The <b>Valley of Flowers<\/b> was added to Nanda Devi in <b>2005<\/b>, not 1988."}],"sum":["Natural World Heritage parks: Kaziranga, Manas, Keoladeo (1985); Sundarbans (1987); Nanda Devi (1988) and Valley of Flowers (2005); Great Himalayan (2014); Khangchendzonga (2016, mixed).","Project Cheetah: Kuno, 17 September 2022.","Dihing Patkai and Raimona became national parks in 2021; Mount Harriet is now Mount Manipur."],"part":["Part 3 · The south, the islands, animals and news","दक्षिण, द्वीप, जीव और समाचार"],"g":"np"}
];

  .nav button[aria-current="page"] span{border-bottom:0!important}

  /* home: intro beside progress */
  .hero{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);column-gap:48px;align-items:end;padding-bottom:10px}
  .hero > .eyebrow,.hero > h1,.hero > p{grid-column:1}
  .hero > .meter{grid-column:2;grid-row:3;align-self:center}
  .hero > .row{grid-column:2;grid-row:2;align-self:end}

  /* lesson reader: facts, timelines, tricks sit side by side */
  .lhead{margin-bottom:0}
  .steps{max-width:640px}
  .steps + .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .steps + .stack > .plain,.steps + .stack > .row,.steps + .stack > p,.steps + .stack > .fig,.steps + .stack > h2,.steps + .stack > .tbl{grid-column:1/-1}
  .steps + .stack > .plain{max-width:86ch;font-size:17px}
  .steps + .stack > .hot,.steps + .stack > .story{grid-column:1/-1}
  .steps + .stack > .story{max-width:none;padding:20px 24px;font-size:17.5px}
  .steps + .stack > .story p{max-width:80ch}
  .steps + .stack:not(:has(> .block ~ .block)) > .block{grid-column:1/-1}
  .block,.qcard{padding:18px 20px;border-radius:14px}

  /* quizzes and question bank */
  #lq > .stack{display:grid;grid-template-columns:minmax(0,1fr);max-width:980px;gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qt{font-size:18px}
  #plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #plist .opts{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:wrap;overflow:visible}

  /* mock test: question with the answer grid alongside */
  .mbar{top:calc(env(safe-area-inset-top,0px) + 67px)}
  .view > .qcard{max-width:1000px}
  .view > .row.between{max-width:1000px}
  .view > #msub{max-width:1000px;width:100%}
  .view > .block.stack{max-width:760px}
  .pal{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .kpis{max-width:760px}

  /* revise: summary cards and sheets in columns */
  #rv > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #rv > .stack > .grph,#rv > .stack > p,#rv > .stack > .search,#rv > .stack > .callout{grid-column:1/-1}
  #dgl,#lml,#tll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #dgl > .grph,#dgl > p,#lml > p,#tll > .grph{grid-column:1/-1}
  #rv .search,#rv > #dgl ~ .search{max-width:520px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flash{min-height:300px;max-width:760px;margin:0 auto;padding:32px 36px}
  .flash .front{font-size:22px}

  /* learn: era cards across the top */
  .eras{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}
  .les{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}

</style>
<script id="shabd-deeplink">
(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();
</script>

<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>

"use strict";
const LESSONS = [
{ id:"L1", heat:2, title:"Basics: perimeter, area, units & π", hi:"परिमाप, क्षेत्रफल, इकाइयाँ और π", blocks:[
 {k:"hot", h:"<b>Hidden inside every 2D question.</b> Tier 1 rarely asks a pure conversion, but CHSL/MTS and CGL often hide a <b>hectare → m²</b> step inside a fencing or cultivation cost question. Tier 2 expects you to pick the right π in one glance."},
 {k:"p", h:"<b>Perimeter</b> is the length of the boundary (unit: m, cm). <b>Area</b> is the surface enclosed (unit: m², cm²). Fencing, wire, rope, border, boundary → perimeter. Painting, carpeting, tiling, ploughing, levelling → area."},
 {k:"formula", title:"Unit ladder (learn the squares!)", rows:[["Length","1 m = 100 cm, 1 km = 1000 m","Square the factor for area"],["Area: m² → cm²","1 m² = 100 × 100 = 10,000 cm²","Not 100!"],["Area: cm² → mm²","1 cm² = 100 mm²","10 mm × 10 mm"],["Are","1 are = 100 m²","A 10 m × 10 m plot"],["Hectare","1 ha = 100 are = 10,000 m²","A 100 m × 100 m plot"],["Square km","1 km² = 100 ha = 10<sup>6</sup> m²","1000 m × 1000 m"],["Cost","Cost = (area or perimeter) × rate","Rate per m² → area; rate per m → perimeter"]]},
 {k:"figs", title:"Perimeter vs area", items:[
  {svg:'<svg viewBox="0 0 240 150" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><rect x="40" y="25" width="150" height="90" style="fill:var(--accent-bg)"/><text x="115" y="75" text-anchor="middle" fill="currentColor" stroke="none">Area = l × b</text><text x="115" y="134" text-anchor="middle" fill="currentColor" stroke="none">l</text><text x="26" y="74" text-anchor="middle" fill="currentColor" stroke="none">b</text></svg>', cap:"Area: the surface inside (m²)."},
  {svg:'<svg viewBox="0 0 240 150" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><rect x="40" y="25" width="150" height="90" style="stroke:var(--accent)" stroke-width="3"/><text x="115" y="75" text-anchor="middle" fill="currentColor" stroke="none">P = 2(l + b)</text><text x="115" y="134" text-anchor="middle" fill="currentColor" stroke="none">l</text><text x="26" y="74" text-anchor="middle" fill="currentColor" stroke="none">b</text></svg>', cap:"Perimeter: the boundary length (m)."}]},
 {k:"fig", title:"Why 1 m² = 10,000 cm²", svg:'<svg viewBox="0 0 260 180" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><g stroke-width="0.5" opacity="0.6"><path d="M70 20 V160 M84 20 V160 M98 20 V160 M112 20 V160 M126 20 V160 M140 20 V160 M154 20 V160 M168 20 V160 M182 20 V160"/><path d="M56 34 H196 M56 48 H196 M56 62 H196 M56 76 H196 M56 90 H196 M56 104 H196 M56 118 H196 M56 132 H196 M56 146 H196"/></g><rect x="56" y="20" width="140" height="140"/><rect x="56" y="20" width="14" height="14" style="fill:var(--accent)" stroke="none"/><text x="126" y="175" text-anchor="middle" fill="currentColor" stroke="none">1 m = 100 cm</text><text x="210" y="94" fill="currentColor" stroke="none">1 m</text></svg>', cap:"Each small square drawn is 10 cm × 10 cm = 100 cm². There are 100 of them → 10,000 cm²."},
 {k:"formula", title:"Which π to use?", rows:[["π = 22/7","When r, d or the answer is a multiple of 7","r = 7, 14, 21, 3.5, 10.5 …"],["π = 3.14","When r is 10, 5, 20 … or the question says 3.14","Area of r = 10 → 314"],["Leave as π","When options contain π","Never convert if options have π"],["Useful numbers","2π × 7 = 44, π × 7² = 154","2π × 21 = 132, π × 21² = 1386"]]},
 {k:"ex", src:"SSC CHSL 2018 · 7 Mar S1", q:"The area of a circular cricket ground is 24.64 hectares. Find the cost of making a rope boundary at ₹5.40 per metre.", steps:["24.64 ha = 24.64 × 10,000 = 2,46,400 m²","πr² = 2,46,400 → r² = 2,46,400 × 7/22 = 78,400 → r = 280 m","Boundary = 2πr = 2 × 22/7 × 280 = 1760 m","Cost = 1760 × 5.40 = ₹9,504"], ans:"₹9,504", tip:"Rope/boundary → perimeter; cost per metre. Convert hectare first."},
 {k:"ex", q:"A lawn is a rectangle with breadth : length = 3 : 4 and area 1/12 hectare. Find the breadth.", steps:["Area = 10,000/12 m²","3x × 4x = 12x² = 10,000/12 → x² = 10,000/144 → x = 100/12","Breadth = 3x = 300/12 = 25 m"], ans:"25 m", tip:"12x² = 10,000/12 → x = 100/12: square roots are easy when you keep it as a fraction."},
 {k:"trick", h:"<b>Square the scale.</b> If every length is multiplied by k, the perimeter becomes k times and the area k² times. Doubling the side of a square → 4 × area. Use this before any formula."},
 {k:"trick", h:"<b>Remember the 7-family:</b> r = 7 → C = 44, A = 154; r = 14 → C = 88, A = 616; r = 21 → C = 132, A = 1386; r = 3.5 → C = 22, A = 38.5."},
 {k:"trap", h:"<b>1 m² is NOT 100 cm².</b> Area units convert by the square of the length factor: 1 m² = 10,000 cm², 1 hectare = 10,000 m² (not 1,000)."},
 {k:"link", h:"Scaling (k → k²) is the base of L11 (percentage change in area). The 22/7 habits are used in every circle lesson (L5–L7, L10)."},
 {k:"q", q:"2.5 hectares = ? m²", o:["25,000 m²","2,500 m²","2,50,000 m²","250 m²"], e:"1 ha = 10,000 m² → 2.5 × 10,000."},
 {k:"q", q:"Painting a wall is paid per…", o:["m² (area)","m (perimeter)","m³ (volume)","per corner"], e:"Painting covers a surface → area."}
], sum:["Perimeter = boundary (m); area = surface (m²)","1 m² = 10,000 cm²; 1 are = 100 m²; 1 ha = 10,000 m²; 1 km² = 100 ha","Lengths × k → area × k²","π = 22/7 for multiples of 7; keep π if options have π"]},
{ id:"L2", heat:3, title:"Triangles", hi:"त्रिभुज का क्षेत्रफल", blocks:[
 {k:"hot", h:"<b>Most-asked 2D shape.</b> Tier 1: equilateral area from side/perimeter/height, Heron on a 'nice' triple, isosceles area. Tier 2: medians (4/3 rule), ½ab sinC, and triangle area equated to a square/rectangle."},
 {k:"formula", title:"Area of a triangle", rows:[["Base–height","A = ½ × b × h","h ⊥ to the chosen base"],["Heron","A = √[s(s−a)(s−b)(s−c)], s = (a+b+c)/2","All three sides known"],["Two sides + angle","A = ½ ab sin C","C = angle between a and b"],["Right triangle","A = ½ × leg₁ × leg₂","Legs are base and height"],["Equilateral","A = (√3/4) a², h = (√3/2) a","Perimeter 3a"],["Isosceles (a, a, b)","A = (b/4)√(4a² − b²)","h = √(a² − b²/4)"],["From medians","A = (4/3) × area of triangle with sides m₁, m₂, m₃","Not 3/4!"],["Inradius link","A = r × s","r = A/s (see L9)"]]},
 {k:"figs", title:"Heights to remember", items:[
  {svg:'<svg viewBox="0 0 240 160" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M90 20 L20 130 L220 130 Z"/><path d="M90 20 V130" style="stroke:var(--accent)" stroke-dasharray="4 3"/><path d="M90 120 H100 V130"/><text x="86" y="14" fill="currentColor" stroke="none">A</text><text x="8" y="140" fill="currentColor" stroke="none">B</text><text x="224" y="140" fill="currentColor" stroke="none">C</text><text x="95" y="82" fill="currentColor" stroke="none">h</text><text x="150" y="148" fill="currentColor" stroke="none">b</text></svg>', cap:"A = ½ b h — h is the perpendicular height."},
  {svg:'<svg viewBox="0 0 240 160" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M120 14 L50 135 L190 135 Z"/><path d="M120 14 V135" style="stroke:var(--accent)" stroke-dasharray="4 3"/><path d="M120 125 H130 V135"/><text x="72" y="62" fill="currentColor" stroke="none">a</text><text x="164" y="70" fill="currentColor" stroke="none">a</text><text x="82" y="152" fill="currentColor" stroke="none">a</text><text x="125" y="100" fill="currentColor" stroke="none">h</text><text x="236" y="30" text-anchor="end" fill="currentColor" stroke="none" font-size="11">h = (√3/2)a</text></svg>', cap:"Equilateral: h = (√3/2)a, A = (√3/4)a²."},
  {svg:'<svg viewBox="0 0 240 160" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M120 20 L60 135 L180 135 Z"/><path d="M120 20 V135" style="stroke:var(--accent)" stroke-dasharray="4 3"/><path d="M120 125 H130 V135"/><path d="M86 74 l8 4 M154 74 l-8 4"/><text x="70" y="70" fill="currentColor" stroke="none">a</text><text x="160" y="70" fill="currentColor" stroke="none">a</text><text x="86" y="152" fill="currentColor" stroke="none">b/2</text><text x="140" y="152" fill="currentColor" stroke="none">b/2</text><text x="125" y="96" fill="currentColor" stroke="none">h</text></svg>', cap:"Isosceles: the altitude bisects the base, h = √(a² − b²/4)."}]},
 {k:"ex", src:"SSC CGL 2023 · 26 Jul S3", q:"Find the area of an equilateral triangle whose sides are 16 cm each.", steps:["A = (√3/4) a²","= (√3/4) × 256 = 64√3 cm²"], ans:"64√3 cm²", tip:"a²/4 then attach √3: 16² / 4 = 64 → 64√3."},
 {k:"ex", src:"SSC CHSL 2021 · 19 Apr (Morning)", q:"The area of a triangular field with sides 65 m, 72 m and 97 m equals the area of a rectangular park whose sides are in the ratio 5 : 13. Find the perimeter of the park.", steps:["65² + 72² = 4225 + 5184 = 9409 = 97² → right triangle!","Area = ½ × 65 × 72 = 2340 m²","5x × 13x = 65x² = 2340 → x² = 36 → x = 6","Park 30 m × 78 m → perimeter 2(30 + 78) = 216 m"], ans:"216 m", tip:"Check for a Pythagorean triple before using Heron — it saves a minute."},
 {k:"ex", q:"The medians of a triangle are 28 cm, 45 cm and 53 cm. Find its area.", steps:["28² + 45² = 784 + 2025 = 2809 = 53² → the median-triangle is right-angled","Median-triangle area = ½ × 28 × 45 = 630","Triangle area = (4/3) × 630 = 840 cm²"], ans:"840 cm²"},
 {k:"trick", h:"<b>Triples first, Heron last.</b> Test a² + b² = c² (3-4-5, 5-12-13, 7-24-25, 8-15-17, 20-21-29, 65-72-97). Also learn <b>13-14-15 → 84</b> and <b>25-39-56 → 420</b>: these Heron sets repeat in SSC."},
 {k:"trick", h:"<b>Heron for isosceles in one line:</b> sides a, a, b → A = (b/4)√(4a² − b²). For 10, 10, 12: (12/4)√(400 − 144) = 3 × 16 = 48."},
 {k:"trap", h:"<b>Medians → multiply by 4/3</b>, not 3/4. The triangle is bigger than the triangle made of its medians."},
 {k:"trap", h:"In ½ab sin C, C must be the angle <b>between</b> sides a and b. Using any other angle gives a wrong area."},
 {k:"link", h:"Area = r × s and R = abc/(4A) connect this lesson to incircle/circumcircle questions in L9. Triangles inside hexagons appear in L8."},
 {k:"q", q:"Sides 13, 14, 15 cm. Area = ?", o:["84 cm²","42 cm²","168 cm²","91 cm²"], e:"s = 21 → √(21 × 8 × 7 × 6) = √7056 = 84."}
], sum:["A = ½bh; Heron for three sides; ½ab sinC for two sides + included angle","Equilateral: (√3/4)a², h = (√3/2)a","Isosceles: (b/4)√(4a² − b²)","Medians: 4/3 × area of median-triangle","Check Pythagorean triples before Heron"]},
{ id:"L3", heat:3, title:"Rectangle & square", hi:"आयत और वर्ग", blocks:[
 {k:"hot", h:"<b>1–2 questions in most CGL/CHSL shifts.</b> Favourites: path/border around or inside a field, two cross-roads, diagonal from area + perimeter, fencing/carpeting cost. Tier 2 mixes them with ratio and algebra."},
 {k:"formula", title:"Rectangle (l × b)", rows:[["Area","A = l × b",""],["Perimeter","P = 2(l + b)",""],["Diagonal","d = √(l² + b²)","Pythagoras"],["Key identity","(l + b)² = d² + 2A","Get l + b from d and A"],["Carpet length","Area of floor ÷ width of carpet","Convert cm to m first"]]},
 {k:"formula", title:"Square (side a)", rows:[["Area","A = a² = d²/2","Area straight from the diagonal"],["Perimeter","P = 4a",""],["Diagonal","d = a√2",""]]},
 {k:"formula", title:"Paths and roads (width w)", rows:[["Path outside","2w(l + b + 2w)","= (l+2w)(b+2w) − lb"],["Path inside","2w(l + b − 2w)","= lb − (l−2w)(b−2w)"],["Two cross-roads","w(l + b) − w²","Centre square counted twice"],["Lawn left after cross-roads","(l − w)(b − w)","Slide roads to the edges"]]},
 {k:"figs", title:"Path and cross-roads", items:[
  {svg:'<svg viewBox="0 0 260 170" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><rect x="20" y="15" width="220" height="140" style="fill:var(--accent-bg)"/><rect x="45" y="40" width="170" height="90" style="fill:var(--sheet)"/><text x="130" y="90" text-anchor="middle" fill="currentColor" stroke="none">field l × b</text><path d="M130 15 V40" style="stroke:var(--accent)"/><text x="136" y="32" fill="currentColor" stroke="none">w</text><text x="130" y="148" text-anchor="middle" fill="currentColor" stroke="none">path</text></svg>', cap:"Path outside: outer (l+2w)(b+2w) minus field lb."},
  {svg:'<svg viewBox="0 0 260 170" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><rect x="20" y="15" width="220" height="140"/><rect x="20" y="75" width="220" height="20" style="fill:var(--accent-bg)"/><rect x="120" y="15" width="20" height="140" style="fill:var(--accent-bg)"/><rect x="120" y="75" width="20" height="20" style="fill:var(--accent)" stroke="none" opacity="0.6"/><text x="70" y="50" text-anchor="middle" fill="currentColor" stroke="none">lawn</text><text x="190" y="130" text-anchor="middle" fill="currentColor" stroke="none">lawn</text><text x="146" y="35" fill="currentColor" stroke="none">w</text><text x="60" y="90" fill="currentColor" stroke="none">w</text></svg>', cap:"Cross-roads: w·l + w·b − w² (the dark square is shared)."}]},
 {k:"ex", src:"SSC CGL Tier 2 2016 · 1 Dec", q:"A rectangular park 60 m long and 40 m wide has two concrete cross-roads running in the middle; the rest is a lawn of area 2109 m². Find the width of the road.", steps:["Slide the roads to the edges: lawn = (60 − w)(40 − w)","Try options: w = 3 → 57 × 37 = 2109 ✓"], ans:"3 m", tip:"2109 = 57 × 37 → both factors differ from 60 and 40 by the same 3."},
 {k:"ex", src:"SSC MTS 2023 · 8 Sep S2", q:"A path of uniform width 2.5 m runs around the outside of a rectangular field 45 m × 35 m. Find the area of the path.", steps:["Outer rectangle = 50 × 40 = 2000 m²","Field = 45 × 35 = 1575 m²","Path = 2000 − 1575 = 425 m²"], ans:"425 m²", tip:"2w(l + b + 2w) = 5 × 85 = 425."},
 {k:"ex", src:"SSC Selection Post 2020 · 9 Nov S2", q:"The diagonal of a rectangular field is 18 m and its area is 126 m². Find the cost of fencing it at ₹9 per metre.", steps:["(l + b)² = d² + 2A = 324 + 252 = 576 → l + b = 24","Perimeter = 48 m","Cost = 48 × 9 = ₹432"], ans:"₹432", tip:"Never find l and b separately — the identity gives l + b directly."},
 {k:"trick", h:"<b>Slide the roads.</b> The lawn left after cross-roads of width w is always (l − w)(b − w), wherever the roads run. For a path outside, add 2w to each side; inside, subtract 2w."},
 {k:"trick", h:"<b>Square from diagonal:</b> A = d²/2. Diagonal 10 → area 50; diagonal 8√2 → area 64. No need to find the side."},
 {k:"trap", h:"<b>Cross-roads:</b> w·l + w·b counts the centre w × w square twice — subtract w² once. <b>Path outside</b> adds 2w, not w, to each dimension."},
 {k:"trap", h:"<b>Carpet width</b> is usually in cm (e.g. 75 cm). Length of carpet = floor area ÷ 0.75 m, not ÷ 75."},
 {k:"link", h:"Equal perimeter → the square has the largest area of all rectangles (L11). Square in a circle / circle in a square is in L9."},
 {k:"q", q:"Diagonal of a square is 10 cm. Its area is:", o:["50 cm²","100 cm²","25 cm²","50√2 cm²"], e:"d²/2 = 100/2."}
], sum:["Rectangle: A = lb, P = 2(l+b), d = √(l²+b²), (l+b)² = d² + 2A","Square: A = a² = d²/2, d = a√2","Path outside 2w(l+b+2w); inside 2w(l+b−2w)","Cross-roads w(l+b) − w²; lawn (l−w)(b−w)"]},
{ id:"L4", heat:2, title:"Parallelogram, rhombus, trapezium & kite", hi:"समांतर चतुर्भुज, समचतुर्भुज, समलंब", blocks:[
 {k:"hot", h:"<b>About one question per CGL shift.</b> Rhombus side + one diagonal → area (Pythagoras on half-diagonals) is the favourite; trapezium 'find the height / other side' is the common CHSL/CPO form. Tier 2 adds parallelogram from sides + diagonal (Heron)."},
 {k:"formula", title:"Parallelogram & rhombus", rows:[["Parallelogram","A = base × height = ab sin θ","θ = angle between sides a, b"],["Parallelogram diagonals","d₁² + d₂² = 2(a² + b²)",""],["Parallelogram from a, b, diagonal d","A = 2 × Heron(a, b, d)","A diagonal splits it into two equal triangles"],["Rhombus area","A = ½ d₁ d₂ = a² sin θ = a × h","Diagonals ⊥ and bisect each other"],["Rhombus side","a = ½√(d₁² + d₂²)","Half-diagonals are the legs"],["Rhombus perimeter","4a = 2√(d₁² + d₂²)",""],["Sum of diagonals L, side a","A = ¼[L² − 4a²]","(d₁+d₂)² − (d₁²+d₂²) = 2d₁d₂"]]},
 {k:"formula", title:"Trapezium, kite, any quadrilateral", rows:[["Trapezium","A = ½ (a + b) h","a ∥ b, h = gap between them"],["Isosceles trapezium height","h = √(c² − ((b − a)/2)²)","c = slant side"],["Kite","A = ½ d₁ d₂","Diagonals ⊥"],["Any quadrilateral","A = ½ × d × (h₁ + h₂)","h₁, h₂ = offsets (perpendiculars) on diagonal d"]]},
 {k:"figs", title:"Where the right angles are", items:[

  {svg:'<svg viewBox="0 0 240 160" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M70 30 H190 L230 130 H20 Z"/><path d="M70 30 V130" style="stroke:var(--accent)" stroke-dasharray="4 3"/><path d="M70 120 H80 V130"/><text x="127" y="22" fill="currentColor" stroke="none">a</text><text x="125" y="148" fill="currentColor" stroke="none">b</text><text x="76" y="84" fill="currentColor" stroke="none">h</text></svg>', cap:"Trapezium: ½ × (sum of parallel sides) × gap."},
  {svg:'<svg viewBox="0 0 240 160" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M60 30 H230 L180 130 H10 Z"/><path d="M60 30 V130" style="stroke:var(--accent)" stroke-dasharray="4 3"/><path d="M60 120 H70 V130"/><text x="90" y="148" fill="currentColor" stroke="none">base b</text><text x="66" y="84" fill="currentColor" stroke="none">h</text><text x="212" y="86" fill="currentColor" stroke="none">a</text></svg>', cap:"Parallelogram: base × height (not base × slant side)."}]},
 {k:"ex", src:"SSC CGL Tier 2 2017 · 12 Jan", q:"The area of a rhombus having one side 10 cm and one diagonal 12 cm is:", steps:["Half-diagonal = 6; side = 10 → other half = √(100 − 36) = 8","Other diagonal = 16","Area = ½ × 12 × 16 = 96 cm²"], ans:"96 cm²", tip:"Spot the triple 6-8-10 at once."},
 {k:"ex", src:"SSC CHSL 2022 · 17 Mar 2023 S3", q:"Parallel sides of a trapezium are 21 cm and 14 cm and its area is 875 cm². Find the distance between the parallel sides.", steps:["875 = ½ × (21 + 14) × h","h = 1750 ÷ 35 = 50 cm"], ans:"50 cm"},
 {k:"ex", src:"SSC CPO 2022 · 11 Nov (Morning)", q:"The sum of the diagonals of a rhombus is L and its perimeter is 4P. Find its area.", steps:["Side = P → d₁² + d₂² = 4P²","(d₁ + d₂)² = L² → 2d₁d₂ = L² − 4P²","Area = ½ d₁d₂ = ¼(L² − 4P²)"], ans:"¼(L² − 4P²)", tip:"Value-put: d₁ = 6, d₂ = 8 → L = 14, P = 5, area 24 → ¼(196 − 100) = 24 ✓."},
 {k:"trick", h:"<b>Rhombus = four right triangles.</b> Halve both diagonals; side² = (d₁/2)² + (d₂/2)². Triples: (5, 12, 13), (6, 8, 10), (9, 12, 15), (12, 16, 20)."},
 {k:"trick", h:"<b>Parallelogram from two sides + a diagonal:</b> the diagonal cuts it into two congruent triangles → area = 2 × Heron. Sides 15, 7, diagonal 20 → Heron = 42 → area 84."},
 {k:"trap", h:"<b>Height, not slant side.</b> Parallelogram area is base × perpendicular height; base × slant side only works for a rectangle. And trapezium uses the <b>sum</b> of the parallel sides, halved."},
 {k:"trap", h:"Rhombus area is ½ d₁ d₂ — forgetting the ½ (or using side × diagonal) is the classic wrong option."},
 {k:"link", h:"Square vs rhombus on the same base: area ratio = 1 : sin θ (L11). The regular hexagon in L8 is six equilateral triangles — or two trapeziums."},
 {k:"q", q:"Diagonals of a rhombus are 10 cm and 24 cm. Its side is:", o:["13 cm","17 cm","26 cm","12 cm"], e:"√(5² + 12²) = 13."}
], sum:["Parallelogram A = bh = ab sinθ","Rhombus A = ½d₁d₂, side = ½√(d₁²+d₂²)","Trapezium A = ½(a+b)h","Kite ½d₁d₂; any quadrilateral ½ × d × (h₁+h₂)"]},
{ id:"L5", heat:3, title:"Circle, semicircle & quadrant", hi:"वृत्त, अर्धवृत्त और चतुर्थांश", blocks:[
 {k:"hot", h:"<b>Asked in almost every shift (often inside another shape).</b> Tier 1: circumference ↔ area, semicircle perimeter (πr + 2r), wire bent from square to circle. Tier 2: circle combined with a square/triangle and answers in π."},
 {k:"formula", title:"Circle (radius r, diameter d = 2r)", rows:[["Circumference","C = 2πr = πd","With π = 22/7: C = 44r/7"],["Area","A = πr² = πd²/4",""],["Area from C","A = C²/(4π)","No need to find r"],["A and C link","A = ½ × C × r","Like ½ × base × height of an unrolled triangle"],["C − d","(π − 1)d = (15/7)d","'Circumference exceeds diameter by…'"]]},
 {k:"formula", title:"Semicircle & quadrant", rows:[["Semicircle perimeter","πr + 2r = (36/7) r","Arc + diameter"],["Semicircle area","πr²/2",""],["Quadrant perimeter","πr/2 + 2r = (25/7) r","Arc + two radii"],["Quadrant area","πr²/4",""]]},
 {k:"figs", title:"Circle family", items:[
  {svg:'<svg viewBox="0 0 200 160" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><circle cx="100" cy="80" r="64" style="fill:var(--accent-bg)"/><path d="M36 80 H100" stroke-dasharray="4 3"/><path d="M100 80 H164" style="stroke:var(--accent)" stroke-width="2.2"/><circle cx="100" cy="80" r="2.5" fill="currentColor"/><text x="96" y="96" fill="currentColor" stroke="none">O</text><text x="128" y="74" fill="currentColor" stroke="none">r</text><text x="62" y="74" fill="currentColor" stroke="none">r</text></svg>', cap:"C = 2πr, A = πr²."},
  {svg:'<svg viewBox="0 0 240 140" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M20 115 A100 100 0 0 1 220 115 Z" style="fill:var(--accent-bg)"/><path d="M20 115 A100 100 0 0 1 220 115" style="stroke:var(--accent)" stroke-width="2.2"/><circle cx="120" cy="115" r="2.5" fill="currentColor"/><text x="116" y="132" fill="currentColor" stroke="none">2r</text><text x="112" y="34" fill="currentColor" stroke="none">πr</text></svg>', cap:"Semicircle: perimeter = πr + 2r (don't forget the diameter)."},
  {svg:'<svg viewBox="0 0 200 160" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M40 140 V30 A110 110 0 0 1 150 140 Z" style="fill:var(--accent-bg)"/><path d="M40 30 A110 110 0 0 1 150 140" style="stroke:var(--accent)" stroke-width="2.2"/><path d="M40 130 H50 V140"/><text x="26" y="90" fill="currentColor" stroke="none">r</text><text x="92" y="155" fill="currentColor" stroke="none">r</text><text x="124" y="62" fill="currentColor" stroke="none">πr/2</text></svg>', cap:"Quadrant: perimeter = πr/2 + 2r, area = πr²/4."}]},
 {k:"ex", src:"SSC CHSL 2018 · 17 Mar S2", q:"If the perimeter of a semicircle is 72 cm, find its area.", steps:["πr + 2r = (36/7) r = 72 → r = 14","Area = ½ × 22/7 × 14 × 14 = 308 cm²"], ans:"308 cm²", tip:"Semicircle perimeter = 36r/7: 36 in the numerator means r is a multiple of 7 when the perimeter is a multiple of 36."},
 {k:"ex", src:"SSC CHSL 2021 · 13 Apr (Afternoon)", q:"A wire is bent to form a square of area 169 m². If the same wire is bent into a circle, what is its area (to the nearest m²)?", steps:["Side = 13 → wire = 52 m","2πr = 52 → r = 52 × 7/44 = 91/11 m","Area = C²/(4π) = 52² × 7/88 = 215.09 ≈ 215 m²"], ans:"215 m²", tip:"Use A = C²/4π directly — no need to find r."},
 {k:"ex", src:"SSC CHSL 2024 · 8 Jul S2", q:"Find the perimeter of a square whose area equals the area of a semicircle of radius 2√2 cm.", steps:["Semicircle area = ½ × π × 8 = 4π","Square side = √(4π) = 2√π","Perimeter = 8√π cm"], ans:"8√π cm"},
 {k:"trick", h:"<b>Ratios ignore π.</b> Circumference ∝ r, area ∝ r². If circumferences are 3 : 4, areas are 9 : 16. If areas are 4 : 9, radii are 2 : 3."},
 {k:"trick", h:"<b>The 7-multipliers:</b> C = 44r/7, semicircle perimeter = 36r/7, quadrant perimeter = 25r/7, C − d = 15d/7, C − r = 37r/7, C + d = 29d/7. Divide the given number by the multiplier → r at once."},
 {k:"trap", h:"<b>Semicircle perimeter ≠ πr.</b> 'Perimeter' includes the straight diameter: πr + 2r. Only 'length of the arc / curved part' is πr."},
 {k:"trap", h:"Read radius vs diameter carefully — using d in πr² makes the answer 4 times too big (a favourite wrong option)."},
 {k:"link", h:"Fixed wire → circle has the largest area of all shapes (L11). Sectors (L6) are just θ/360 of these formulas."},
 {k:"q", q:"Circumference of a circle is 88 cm. Its area is:", o:["616 cm²","154 cm²","1232 cm²","308 cm²"], e:"r = 88 × 7/44 = 14 → 22/7 × 196 = 616."}
], sum:["C = 2πr, A = πr² = C²/4π","Semicircle P = πr + 2r = 36r/7, A = πr²/2","Quadrant P = πr/2 + 2r = 25r/7, A = πr²/4","Areas scale as r²; ratios ignore π"]},
{ id:"L6", heat:3, title:"Sector, arc & segment", hi:"त्रिज्यखंड, चाप और वृत्तखंड", blocks:[
 {k:"hot", h:"<b>Rising fast: three different CGL 2023 shifts asked a sector question.</b> Forms: radius from sector area + angle, sector perimeter (arc + 2r), area from arc length, clock-hand area. Tier 2: segment = sector − triangle and overlapping circles (L10)."},
 {k:"formula", title:"Sector of angle θ (in degrees)", rows:[["Arc length","l = (θ/360) × 2πr",""],["Sector area","A = (θ/360) × πr²",""],["Area from arc","A = ½ × l × r","No θ needed!"],["Sector perimeter","l + 2r","Arc plus both radii"],["Angle from fraction","Sector = 1/n of circle → θ = 360/n",""]]},
 {k:"formula", title:"Segment & clock", rows:[["Segment area","Sector − △ = (θ/360)πr² − ½r² sin θ","Region between chord and arc"],["θ = 90°","(π/4 − ½) r² = (2/7) r² (π = 22/7)","r = 14 → 56"],["θ = 60°","(π/6 − √3/4) r²",""],["Minute hand","6° per minute","15 min → 90°, 45 min → 270°"],["Hour hand","30° per hour = ½° per minute",""]]},
 {k:"figs", title:"Sector vs segment", items:[
  {svg:'<svg viewBox="0 0 240 170" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M60 140 L190 140 A130 130 0 0 0 125 27.4 Z" style="fill:var(--accent-bg)"/><path d="M190 140 A130 130 0 0 0 125 27.4" style="stroke:var(--accent)" stroke-width="2.2"/><path d="M84 140 A24 24 0 0 0 72 119.2"/><circle cx="60" cy="140" r="2.5" fill="currentColor"/><text x="46" y="156" fill="currentColor" stroke="none">O</text><text x="90" y="133" fill="currentColor" stroke="none">θ</text><text x="122" y="158" fill="currentColor" stroke="none">r</text><text x="80" y="82" fill="currentColor" stroke="none">r</text><text x="178" y="70" fill="currentColor" stroke="none">l</text></svg>', cap:"Sector: (θ/360) of the circle. Perimeter = l + 2r."},
  {svg:'<svg viewBox="0 0 240 170" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><circle cx="120" cy="100" r="66"/><path d="M73.3 53.3 A66 66 0 0 1 166.7 53.3 Z" style="fill:var(--accent)" opacity="0.45" stroke="none"/><path d="M73.3 53.3 L120 100 L166.7 53.3" stroke-dasharray="4 3"/><path d="M73.3 53.3 H166.7"/><path d="M113 93 L120 86 L127 93"/><circle cx="120" cy="100" r="2.5" fill="currentColor"/><text x="115" y="117" fill="currentColor" stroke="none">O</text><text x="58" y="50" fill="currentColor" stroke="none">A</text><text x="172" y="50" fill="currentColor" stroke="none">B</text></svg>', cap:"Segment (shaded) = sector OAB − △OAB. Here ∠AOB = 90°."}]},
 {k:"ex", src:"SSC CGL 2023 · 26 Jul S2", q:"The area of a sector of a circle is 110 cm² and its central angle is 56°. Find the radius (π = 22/7).", steps:["(56/360) × 22/7 × r² = 110","r² = 110 × 360 × 7 / (56 × 22) = 225","r = 15 cm"], ans:"15 cm"},
 {k:"ex", src:"SSC CGL 2022 · 12 Dec S1", q:"The minute hand of a clock is 20 cm long. Find the area swept by it between 8:00 a.m. and 8:45 a.m.", steps:["45 minutes → 45 × 6° = 270° = ¾ of a circle","Area = ¾ × 22/7 × 400 = 6600/7 cm²"], ans:"6600/7 cm²", tip:"Convert minutes to a fraction of the circle: 45/60 = ¾."},
 {k:"ex", src:"SSC CGL 2023 · 27 Jul S1", q:"The length of arc AB equals five times the radius r. Find the area of sector AOB.", steps:["Area = ½ × l × r","= ½ × 5r × r = 5r²/2"], ans:"5r²/2", tip:"Arc given → use ½ lr, never find θ."},
 {k:"trick", h:"<b>Fractions, not degrees.</b> 60° = ⅙, 90° = ¼, 120° = ⅓, 45° = ⅛, 72° = ⅕, 36° = 1/10. Multiply the full-circle value (C or A) by that fraction."},
 {k:"trick", h:"<b>Quarter-circle segment = (2/7) r²</b> with π = 22/7: (11/14 − 1/2) r² = (4/14) r². r = 7 → 14, r = 14 → 56, r = 21 → 126."},
 {k:"trap", h:"<b>Sector perimeter</b> = arc + 2r, not just the arc. <b>Segment</b> = sector − triangle; the triangle is ½r² sin θ, not ½r²(θ)."},
 {k:"trap", h:"Clock: the <b>minute</b> hand turns 6° per minute; the <b>hour</b> hand only 30° per hour. 'Area swept by the minute hand in 20 minutes' = ⅓ of the circle."},
 {k:"link", h:"Overlapping circles, leaves and rangoli shapes in L10 are built from sectors and segments. Arcs of wheels and tracks link to L7."},
 {k:"q", q:"Arc length of a sector of radius 21 cm with angle 60° is:", o:["22 cm","44 cm","11 cm","231 cm"], e:"⅙ × 2 × 22/7 × 21 = 22."}
], sum:["Arc l = (θ/360)2πr; sector A = (θ/360)πr² = ½lr","Sector perimeter = l + 2r","Segment = sector − ½r² sinθ; 90° segment = (2/7)r²","Minute hand 6°/min; hour hand 0.5°/min"]},
{ id:"L7", heat:2, title:"Rings, paths & wheels", hi:"वलय, पथ और पहिए", blocks:[
 {k:"hot", h:"<b>Steady 1 question every few shifts.</b> Circular path around/inside a park, width from two circumferences, wheel revolutions/speed. Tier 2: running tracks (rectangle + semicircles) and two wheels of different radii."},
 {k:"formula", title:"Ring (annulus)", rows:[["Ring area","π(R² − r²) = π(R + r)(R − r)","R outer, r inner"],["Path of width w outside circle r","π[(r + w)² − r²] = πw(2r + w)","R = r + w"],["Path of width w inside circle R","π[R² − (R − w)²]","r = R − w"],["Width from circumferences","w = (C<sub>out</sub> − C<sub>in</sub>)/(2π)","Difference of C = 2πw"]]},
 {k:"formula", title:"Wheels & tracks", rows:[["One revolution","Distance = circumference = 2πr",""],["n revolutions","Distance = n × 2πr","Revolutions = distance ÷ 2πr"],["Speed","Speed = (rev per unit time) × 2πr","Then convert cm/min → km/h"],["Two wheels, same distance","n₁ r₁ = n₂ r₂","Bigger wheel turns fewer times"],["Track (rectangle + 2 semicircles)","Perimeter = 2l + 2πr; area = 2rl + πr²","Two semicircles = one circle"]]},
 {k:"figs", title:"Ring and running track", items:[
  {svg:'<svg viewBox="0 0 220 170" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M35 85 a75 75 0 1 0 150 0 a75 75 0 1 0 -150 0 Z M60 85 a50 50 0 1 0 100 0 a50 50 0 1 0 -100 0 Z" fill-rule="evenodd" style="fill:var(--accent-bg)" stroke="none"/><circle cx="110" cy="85" r="75"/><circle cx="110" cy="85" r="50"/><path d="M110 85 H160" style="stroke:var(--accent)"/><path d="M110 85 L57 138" stroke-dasharray="4 3"/><circle cx="110" cy="85" r="2.5" fill="currentColor"/><text x="130" y="79" fill="currentColor" stroke="none">r</text><text x="86" y="130" fill="currentColor" stroke="none">R</text><text x="166" y="80" fill="currentColor" stroke="none">w</text></svg>', cap:"Ring = πR² − πr²; width w = R − r."},
  {svg:'<svg viewBox="0 0 260 150" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M75 25 H185 A50 50 0 0 1 185 125 H75 A50 50 0 0 1 75 25 Z" style="fill:var(--accent-bg)"/><path d="M75 25 V125 M185 25 V125" stroke-dasharray="4 3"/><text x="126" y="18" fill="currentColor" stroke="none">l</text><text x="126" y="142" fill="currentColor" stroke="none">l</text><text x="80" y="80" fill="currentColor" stroke="none">2r</text><path d="M75 75 H25" style="stroke:var(--accent)"/><text x="46" y="70" fill="currentColor" stroke="none">r</text></svg>', cap:"Track: 2 straights + 2 semicircles → P = 2l + 2πr."}]},
 {k:"ex", src:"SSC CGL 2022 · 6 Dec S1", q:"A circular playground has a circular path around it. The difference between the circumferences of the outer and inner circles is 144 cm. Find the approximate width of the path (π = 22/7).", steps:["2πR − 2πr = 2π(R − r) = 144","R − r = 144 × 7/44 = 22.9","Width ≈ 23 cm"], ans:"≈ 23 cm", tip:"Difference of circumferences ÷ 2π = width directly."},
 {k:"ex", src:"SSC MTS 2019 · 13 Aug S3", q:"Each wheel of a bus makes 7 revolutions per second. If the diameter of a wheel is 56 cm, find the speed of the bus in cm/s.", steps:["Circumference = πd = 22/7 × 56 = 176 cm","Speed = 7 × 176 = 1232 cm/s"], ans:"1232 cm/s"},
 {k:"ex", q:"A circular park has area 1386 m². A path 7 m wide is laid along the inside of its boundary. Find the area of the path.", steps:["πR² = 1386 → R = 21","Inner radius = 21 − 7 = 14 → inner area 616","Path = 1386 − 616 = 770 m²"], ans:"770 m²", tip:"Inside path → subtract w from the radius; outside path → add w."},
 {k:"trick", h:"<b>Ring in one product:</b> π(R + r)(R − r). With R − r = width w, ring area = π × w × (R + r) = width × mean circumference."},
 {k:"trick", h:"<b>Wheel units:</b> 1 km = 1,00,000 cm. A wheel of radius 35 cm has circumference 220 cm → 500 revolutions per 1.1 km. Speed in km/h = (cm per minute) × 60 ÷ 1,00,000."},
 {k:"trap", h:"<b>Inside vs outside path:</b> inside → inner radius = R − w; outside → outer radius = r + w. Mixing them gives 1078 instead of 770 for the park above — both appear in options."},
 {k:"trap", h:"Revolutions use the <b>circumference</b> (2πr), not the area. And if the diameter is given, C = πd — don't double it again."},
 {k:"link", h:"Same as rectangular paths in L3, just with circles. Distance/speed questions link to the Time & Distance app."},
 {k:"q", q:"A wheel of radius 21 cm covers how much distance in 10 revolutions?", o:["1320 cm","660 cm","132 cm","13,860 cm"], e:"10 × 2 × 22/7 × 21 = 1320."}
], sum:["Ring = π(R² − r²) = π(R+r)(R−r)","Width = (C_out − C_in)/2π","Distance = revolutions × 2πr; n₁r₁ = n₂r₂","Track: P = 2l + 2πr, A = 2rl + πr²"]},
{ id:"L8", heat:1, title:"Regular polygons", hi:"सम बहुभुज", blocks:[
 {k:"hot", h:"<b>Occasional but predictable.</b> Tier 1 asks hexagon area from side (CGL 2017 had it in two shifts) and simple angle/side facts. Tier 2 asks a triangle cut from a hexagon (△ABC, △ACE) or an octagon cut from a square."},
 {k:"formula", title:"Any regular n-gon (side a)", rows:[["Exterior angle","360°/n","Sum of exterior angles = 360°"],["Interior angle","(n − 2) × 180°/n","Hexagon 120°, octagon 135°"],["Area","½ × perimeter × apothem","Apothem = inradius (centre to side)"],["Area (trig form)","(n a²/4) cot(180°/n)","Gives the special cases below"]]},
 {k:"formula", title:"Hexagon and octagon", rows:[["Regular hexagon area","(3√3/2) a² = 6 × (√3/4) a²","Six equilateral triangles"],["Hexagon radii","Circumradius R = a, inradius = (√3/2) a",""],["Hexagon diagonals","Long = 2a, short = √3 a",""],["△ABC (adjacent vertices)","(√3/4) a² = ⅙ of hexagon","½ a² sin 120°"],["△ACE (alternate vertices)","½ of hexagon","Equilateral with side √3 a"],["Regular octagon area","2(1 + √2) a²",""],["Octagon from square of side L","a = L(√2 − 1); corner cut x = a/√2","x + a + x = L"]]},
 {k:"figs", title:"Hexagon = 6 triangles; octagon = square − 4 corners", items:[
  {svg:'<svg viewBox="0 0 220 175" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><path d="M180 85 L145 24.4 L75 24.4 L40 85 L75 145.6 L145 145.6 Z" style="fill:var(--accent-bg)"/><path d="M110 85 L180 85 M110 85 L145 24.4 M110 85 L75 24.4 M110 85 L40 85 M110 85 L75 145.6 M110 85 L145 145.6" stroke-dasharray="4 3"/><path d="M110 85 V145.6" style="stroke:var(--accent)"/><circle cx="110" cy="85" r="2.5" fill="currentColor"/><text x="106" y="18" fill="currentColor" stroke="none">a</text><text x="150" y="80" fill="currentColor" stroke="none">a</text><text x="120" y="80" fill="currentColor" stroke="none">O</text></svg>', cap:"Six equilateral triangles of side a; apothem (accent) = (√3/2)a."},
  {svg:'<svg viewBox="0 0 200 190" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><rect x="30" y="30" width="140" height="140" stroke-dasharray="4 3"/><path d="M30 30 H71 L30 71 Z M129 30 H170 V71 Z M170 129 V170 H129 Z M71 170 H30 V129 Z" style="fill:var(--accent-bg)" stroke="none"/><path d="M71 30 H129 L170 71 V129 L129 170 H71 L30 129 V71 Z" style="stroke:var(--accent)" stroke-width="2"/><text x="44" y="24" fill="currentColor" stroke="none">x</text><text x="96" y="24" fill="currentColor" stroke="none">a</text><text x="146" y="24" fill="currentColor" stroke="none">x</text><text x="58" y="186" fill="currentColor" stroke="none">L = x + a + x</text></svg>', cap:"Cut four right-isosceles corners: x√2 = a, so a = L(√2 − 1)."}]},
 {k:"ex", src:"SSC CGL 2017 · 23 Aug S3", q:"What is the area of a regular hexagon of side 9 cm?", steps:["A = (3√3/2) a²","= (3√3/2) × 81 = 243√3/2 cm²"], ans:"243√3/2 cm²", tip:"Six times the equilateral triangle: 6 × (√3/4) × 81."},
 {k:"ex", src:"SSC CGL Tier 2 2022 · 8 Aug", q:"ABCDEF is a regular hexagon of side 36 cm. Find the area of △ABC.", steps:["AB = BC = 36, ∠ABC = 120°","Area = ½ × 36 × 36 × sin 120° = 648 × √3/2","= 324√3 cm²"], ans:"324√3 cm²", tip:"△ABC = ⅙ of the hexagon = one equilateral triangle of side a: (√3/4) × 1296 = 324√3."},
 {k:"ex", q:"A regular octagon is cut from a square of side 18 cm by trimming its corners. Find the side and area of the octagon.", steps:["Corners are right isosceles triangles with legs x and hypotenuse a = x√2","x + a + x = 18 → a(1 + √2) = 18 → a = 18(√2 − 1)","Area = 2(1 + √2) a² = 2(1 + √2) × 324(√2 − 1)² = 648(√2 − 1) cm²"], ans:"a = 18(√2 − 1) cm, area = 648(√2 − 1) ≈ 268.4 cm²", tip:"Some websites cut equilateral corners and get 36(9 − √3) — wrong: a regular octagon needs 45° corner cuts."},
 {k:"trick", h:"<b>Hexagon = 6 triangles.</b> Any hexagon question → work with one equilateral triangle of side a (area (√3/4)a²) and multiply. △ABC = 1 piece, △ACE = 3 pieces, quadrilateral ABCD = 3 pieces."},
 {k:"trick", h:"<b>Angles:</b> exterior = 360/n. Interior = 180 − exterior. Exterior 30° → 12 sides; interior 140° → exterior 40° → 9 sides."},

{ id:"L9", heat:3, title:"Inscribed & circumscribed figures", hi:"अंतर्गत और परिगत आकृतियाँ", blocks:[
 {k:"hot", h:"<b>A Tier 2 favourite; Tier 1 asks it every few shifts.</b> Forms: circle in a square / square in a circle, incircle and circumcircle of an equilateral triangle (1 : 4 areas), inradius of a right triangle from its sides, and chains (circle in triangle → square in that circle)."},
 {k:"p", h:"<b>Inscribed</b> = drawn inside, touching. <b>Circumscribed</b> = drawn outside, through the corners. Every question reduces to one link: which length of the inner figure equals which length of the outer one (side = diameter, diagonal = diameter, hypotenuse = diameter …)."},
 {k:"formula", title:"Square and circle", rows:[["Circle in a square (side a)","r = a/2, area = πa²/4","Diameter = side"],["Square in a circle (radius r)","side = r√2, area = 2r²","Diagonal = diameter"],["Rectangle in a circle","Diagonal √(l² + b²) = 2R","Any rectangle; R = d/2"],["Largest circle in a rectangle","r = b/2 (smaller side)","Not the length!"],["Outer circle : inner circle","Areas 2 : 1","Square between them"],["Outer square : inner square","Areas 2 : 1","Circle between them"]]},
 {k:"formula", title:"Triangles and their circles", rows:[["Any triangle","r = A/s, R = abc/(4A)","s = semi-perimeter"],["Equilateral (side a)","r = a/(2√3), R = a/√3","R = 2r; h = 3r = r + R"],["Equilateral areas","Incircle : circumcircle = 1 : 4","Because R = 2r"],["Right triangle","R = c/2 (half the hypotenuse)","Hypotenuse = diameter"],["Right triangle inradius","r = (a + b − c)/2","a, b legs; c hypotenuse"],["Right triangle area","A = r × s = r(r + 2R)","s = r + 2R"],["Hexagon in a circle","side = R","Six equilateral triangles"],["Circle in a rhombus","r = (height)/2 = d₁d₂/(4a)","Rhombus area = 2ar"]]},

 {k:"ex", src:"SSC CPO 2019 · 12 Dec S1", q:"A circle is inscribed in an equilateral triangle of side 24 cm. What is the area of a square inscribed in the circle?", steps:["Inradius r = a/(2√3) = 24/(2√3) = 4√3 cm","Square in a circle: area = 2r² = 2 × 48","= 96 cm²"], ans:"96 cm²", tip:"r² = a²/12 = 576/12 = 48 → area 2r² = 96."},

 {k:"trick", h:"<b>Nesting halves the area.</b> Circle → square inside → circle inside: each step halves the area (2 : 1). Two steps → 4 : 1."},

{ id:"L10", heat:2, title:"Shaded regions & combined figures", hi:"छायांकित भाग और संयुक्त आकृतियाँ", blocks:[
 {k:"hot", h:"<b>Tier 2 loves these; Tier 1 asks one every few shifts.</b> Fixed patterns: four circles at the corners of a square, three touching circles (area between them / string around them), the 'leaf' made by two quadrants, grazing animals and rangoli petals. Answers often come as (a√3 − bπ) or a multiple of 1/7."},
 {k:"p", h:"<b>Never integrate — subtract.</b> Shaded = (whole simple figure) − (pieces you can name). The pieces are always squares, triangles, sectors, quadrants or segments from L2–L6. Corner pieces of a polygon add up: their angles sum to the polygon's angle sum."},
 {k:"formula", title:"Standard shaded shapes (π = 22/7 values)", rows:[["Square minus inscribed circle","a²(1 − π/4) = (3/14) a²","Same as square minus 4 corner quadrants of radius a/2"],["Square minus one quadrant (radius a)","a²(1 − π/4) = (3/14) a²","Corner left outside the arc"],["Leaf (two quadrants in a square)","(π/2 − 1) a² = (4/7) a²","= 2 × (90° segment)"],["Four-petal rangoli (semicircles on 4 sides)","(π/2 − 1) a² = (4/7) a²","Same as the leaf!"],["4 touching circles (radius r)","(4 − π) r² = (6/7) r²","Square of side 2r − 4 quadrants"],["3 touching circles (radius r)","(√3 − π/2) r²","Equilateral △ of side 2r − three 60° sectors"],["Circle minus inscribed square","(π − 2) r² = (8/7) r²",""],["Circle in a quadrant (radius R)","r = R(√2 − 1)","r√2 + r = R"]]},
 {k:"formula", title:"Belts, ropes and grazing", rows:[["Belt round n equal touching circles","Perimeter of centre-polygon + 2πr","Arcs always add up to one full circle"],["3 circles in a triangle","6r + 2πr",""],["4 circles in a square","8r + 2πr",""],["Grazing at a corner of angle θ","(θ/360) πr²","Square corner → quadrant"],["Animals at all corners of a polygon (n sides)","(n − 2) × 180/360 × πr²","Triangle → semicircle; quadrilateral → full circle"]]},

 {k:"ex", src:"SSC CGL Tier 2 2016 · 1 Dec", q:"Four circles of equal radii are drawn about the four corners of a square so that each touches two of the others. If each side of the square is 140 cm, find the area enclosed between the circles (π = 22/7).", steps:["r = 140/2 = 70 cm","Four quarter-circles = one full circle = 22/7 × 4900 = 15,400","Square − circle = 19,600 − 15,400 = 4200 cm²"], ans:"4200 cm²", tip:"(3/14) × side² = (3/14) × 19,600 = 4200."},
 {k:"ex", src:"SSC CHSL 2022 · 10 Mar 2023 S3", q:"Three circles of radius 7 cm are placed so that each touches the other two. Find the area of the portion enclosed by the three circles.", steps:["Centres form an equilateral triangle of side 14 → area (√3/4) × 196 = 49√3","Three 60° sectors = half a circle = ½ × 22/7 × 49 = 77","Enclosed area = 49√3 − 77 cm²"], ans:"(49√3 − 77) cm²", tip:"Angles of the triangle add to 180° → the three sectors make exactly one semicircle."},
 {k:"ex", src:"SSC CGL 2022 · 5 Dec S4", q:"Three circles of radius 4 cm are kept touching each other. A string is tied tightly around them. Find the length of the string.", steps:["Straight parts: three, each equal to 2r = 8 → 24 cm","Curved parts: each 120° → total 360° = one circumference = 2π × 4 = 8π","Length = 24 + 8π cm"], ans:"(24 + 8π) cm"},
 {k:"ex", q:"ABCD is a square of side 14 cm. Quadrants are drawn with centres A and C and radius 14 cm. Find the area of the leaf where they overlap.", steps:["Each quadrant = ¼ × 22/7 × 196 = 154","Triangle ABD (half the square) = 98 → one segment = 154 − 98 = 56","Leaf = 2 × 56 = 112 cm²"], ans:"112 cm²", tip:"(4/7) × a² = (4/7) × 196 = 112."},
 {k:"trick", h:"<b>The 1/7 family (π = 22/7):</b> square − circle = <b>3/14</b> a²; leaf or 4-petal rangoli = <b>4/7</b> a²; four touching circles = <b>6/7</b> r²; circle − square = <b>8/7</b> r²; 90° segment = <b>2/7</b> r². One multiplication and done."},
 {k:"trick", h:"<b>Corner sectors add up.</b> Equal circles at the corners of a triangle → sectors total 180° = ½ circle; at the corners of any quadrilateral → 360° = 1 full circle; pentagon → 1.5 circles."},
 {k:"trap", h:"<b>Belt length:</b> the straight parts equal the distances between centres (2r each), not the diameters around the outside, and the curved parts make <b>one</b> full circle in total — not one per circle."},
 {k:"trap", h:"<b>Leaf vs leftover:</b> the leaf is the overlap (4/7 a²); the two corner pieces outside both quadrants are a² − 4/7 a² = 3/7 a². Read which part is shaded."},
 {k:"link", h:"Every piece here comes from L5 (quadrants), L6 (sectors and segments) and L9 (inscribed figures). Rangoli and petals are popular in Tier 2 picture questions."},
 {k:"q", q:"ABCD is a square of side 7 cm. Quadrants of radius 7 cm are drawn from B and D. The area of the overlapping leaf is:", o:["28 cm²","14 cm²","21 cm²","38.5 cm²"], e:"(4/7) × 49 = 28."}
], sum:["Shaded = whole − named pieces","Square − inscribed circle = (3/14)a²; leaf = rangoli = (4/7)a²","4 touching circles (4 − π)r²; 3 touching circles (√3 − π/2)r²","Belt = centre-polygon perimeter + 2πr","Corner sectors of a polygon add to (n − 2) × 180°"]},
{ id:"L11", heat:2, title:"Percentage change in area & ratios", hi:"क्षेत्रफल में प्रतिशत परिवर्तन और अनुपात", blocks:[
 {k:"hot", h:"<b>About one question every two CGL/CHSL shifts</b> — and it is the fastest mark in mensuration. Forms: side/radius +x% → area?; length +x%, breadth −y% → area?; keep the area constant; similar figures; equal perimeters → which area is bigger. Tier 2 adds 'area +44% → side?'."},
 {k:"p", h:"<b>Area is length × length</b>, so every length change is applied twice. That is why +10% on every side gives +21% area, not +20%. Perimeter and circumference are single lengths, so they change by the same % as the sides."},
 {k:"formula", title:"Percentage change", rows:[["Two changes (rectangle)","x + y + xy/100 %","Use −x for a decrease"],["Every length +x% (square, circle, any similar figure)","2x + x²/100 %","+10% → +21%, +20% → +44%"],["+x% and −x%","Always a fall of x²/100 %","+20, −20 → −4%"],["Keep area constant","Other side falls by 100x/(100 + x) %","+25% length → −20% breadth"],["Area +k% → side","Side +[√(1 + k/100) − 1] × 100 %","+21% → 10%, +44% → 20%, +69% → 30%"],["Perimeter / circumference","Same % as the side or radius","Linear, not squared"]]},
 {k:"formula", title:"Ratios and equal perimeters", rows:[["Similar figures","Area ratio = (side ratio)²","Perimeter ratio = side ratio"],["Circles","A₁ : A₂ = r₁² : r₂² = C₁² : C₂²",""],["Equal perimeter: circle vs square","Areas 4 : π = 14 : 11","Circle wins"],["Equal perimeter: square vs equilateral △","Areas 9 : 4√3 (≈ 1.3 : 1)",""],["Equal perimeter, all rectangles","Square has the largest area","l = b"],["Equal area","Circle has the least perimeter",""],["Square and circle of equal area","side : radius = √π : 1",""]]},
 {k:"figs", title:"Why x + y + xy", items:[
  {svg:'<svg viewBox="0 0 240 170" fill="none" stroke="currentColor" stroke-width="1.6" font-family="inherit" font-size="12"><rect x="30" y="20" width="140" height="90" style="fill:var(--accent-bg)"/><rect x="170" y="20" width="35" height="90" style="fill:var(--accent)" opacity="0.35"/><rect x="30" y="110" width="140" height="25" style="fill:var(--blue)" opacity="0.3"/><rect x="170" y="110" width="35" height="25" style="fill:var(--accent)" opacity="0.8" stroke="none"/><rect x="30" y="20" width="175" height="115"/><text x="100" y="70" text-anchor="middle" fill="currentColor" stroke="none">lb</text><text x="187" y="70" text-anchor="middle" fill="currentColor" stroke="none">x%</text><text x="100" y="127" text-anchor="middle" fill="currentColor" stroke="none">y%</text><text x="187" y="160" text-anchor="middle" fill="currentColor" stroke="none">xy/100</text><text x="100" y="156" text-anchor="middle" fill="currentColor" stroke="none">l → l(1 + x%)</text></svg>', cap:"New area = old + x% strip + y% strip + the small corner xy/100."},

 {k:"ex", src:"SSC CGL 2019 · 3 Mar 2020 S1", q:"If the length of a rectangle is increased by 40% and the breadth is decreased by 20%, the area increases by x%. Find x.", steps:["x + y + xy/100 with x = 40, y = −20","40 − 20 − 800/100 = 20 − 8 = 12"], ans:"12", tip:"Multiply factors: 1.4 × 0.8 = 1.12 → +12%."},
 {k:"ex", src:"SSC MTS 2021 · 7 Jul 2022 S1", q:"The side of a square is increased by 25%. What is the percentage increase in its area?", steps:["2x + x²/100 = 50 + 625/100","= 56.25%"], ans:"56.25%", tip:"1.25² = 1.5625."},
 {k:"ex", q:"The length of a rectangle is increased by 25%. By what percentage must the breadth be decreased to keep the area unchanged?", steps:["New length = 5/4 of old → breadth must become 4/5 of old","Decrease = 1/5 = 20%"], ans:"20%", tip:"100x/(100 + x) = 2500/125 = 20."},
 {k:"ex", q:"A circle and a square have the same perimeter. Find the ratio of their areas (π = 22/7).", steps:["2πr = 4a → a = πr/2","Circle : square = πr² : π²r²/4 = 4 : π","= 4 : 22/7 = 28 : 22 = 14 : 11"], ans:"14 : 11"},
 {k:"trick", h:"<b>Use fractions as factors.</b> +25% = ×5/4, −20% = ×4/5, +50% = ×3/2, −33⅓% = ×2/3, +12.5% = ×9/8. Multiply the factors; the product minus 1 is the change."},
 {k:"trick", h:"<b>Perfect squares give the side change:</b> area ×1.21 → side ×1.1; ×1.44 → ×1.2; ×1.69 → ×1.3; ×2.25 → ×1.5; ×0.81 → ×0.9; ×0.64 → ×0.8."},
 {k:"trap", h:"<b>+x% then −x% is never 'no change'.</b> The area always falls by x²/100 %. +20%/−20% → −4%; +50%/−50% → −25%."},
 {k:"trap", h:"<b>'Doubled' means +100%, not +200%.</b> Radius doubled → area ×4 → increase of 300%. Radius tripled → ×9 → +800%."},
 {k:"link", h:"This is L1's scaling rule (lengths × k → area × k²) written in percent. The same x + y + xy/100 rule is used in the Percentage app (successive change) and, cubed, in Mensuration 3D for volumes."},

/b> (Ramsay MacDonald) gave separate electorates to the Depressed Classes → Gandhi's fast → <b>Poona Pact, 24 Sept 1932<\/b> (Gandhi–Ambedkar): reserved seats instead of separate electorates"]]},{"k":"trick","h":"<b>Gandhi's first three<\/b> — <span class=\"mn\">Cham-Khe-Ahm<\/span> in <span class=\"mn\">17-18-18<\/span>: <b>Cham<\/b>paran (indigo, Bihar), <b>Khe<\/b>da (revenue, Gujarat), <b>Ahm<\/b>edabad (mill wages). First satyagraha = Champaran; first hunger strike = Ahmedabad.<br><b>Why movements ended<\/b>: Non-Cooperation → <b>Chauri Chaura<\/b>; Civil Disobedience → <b>Gandhi-Irwin Pact<\/b>; Quit India → arrests."},{"k":"table","title":"Three Round Table Conferences (London)","head":["RTC","Date","Congress","Note"],"rows":[["First","Nov 1930 – Jan 1931","<b>Boycotted<\/b>","Ambedkar and the Princes attended"],["Second","Sept – Dec 1931","<b>Gandhi attended<\/b> — the only one","As the sole Congress representative, after the Gandhi-Irwin Pact; deadlocked on minorities"],["Third","Nov – Dec 1932","Boycotted","Led to the White Paper and the <b>Act of 1935<\/b>"]]},{"k":"facts","title":"Gandhi — names, papers, ideas","rows":[["Full name","Mohandas Karamchand Gandhi; born <b>2 Oct 1869, Porbandar<\/b>; died <b>30 Jan 1948<\/b> (Nathuram Godse)"],["Titles","\"<b>Mahatma<\/b>\" from <b>Rabindranath Tagore<\/b>; \"<b>Father of the Nation<\/b>\" from <b>Subhas Chandra Bose<\/b>; \"<b>half-naked fakir<\/b>\" from Churchill"],["Papers","<b><i>Young India<\/i><\/b> (English), <b><i>Harijan<\/i><\/b>, <i>Navajivan<\/i> (Gujarati), <i>Indian Opinion<\/i> (South Africa)"],["Books","<b><i>My Experiments with Truth<\/i><\/b> (autobiography), <i>Hind Swaraj<\/i> (1909)"],["Political guru","<b>Gopal Krishna Gokhale<\/b>"],["First Congress session he presided","<b>Belgaum, 1924<\/b> — the only one"],["Ashrams","Phoenix &amp; Tolstoy Farm (South Africa), Kochrab &amp; Sabarmati (Ahmedabad), <b>Sevagram/Wardha<\/b> (1936)"]]},{"k":"trap","h":"The Dandi March began <b>12 March 1930<\/b> and the salt law was broken on <b>6 April 1930<\/b> — two different dates. Gandhi attended <b>only the Second<\/b> Round Table Conference. He presided over <b>only one<\/b> Congress session, at <b>Belgaum in 1924<\/b>. The <b>Nagpur session (1920)<\/b> approved Non-Cooperation; the <b>Calcutta special session (Sept 1920)<\/b> first adopted it."}],"sum":["Champaran 1917 (indigo, first satyagraha in India) → Ahmedabad mill strike & Kheda 1918 → Rowlatt + Jallianwala Bagh 13 April 1919.","Non-Cooperation 1920–22, approved at Nagpur, withdrawn after Chauri Chaura (5 Feb 1922). Swaraj Party 1923 (C. R. Das & Motilal Nehru).","Simon Commission 1928 ('Go back Simon'); Nehru Report & Bardoli 1928; Lahore session 1929 — Purna Swaraj, 26 Jan 1930 first Independence Day.","Dandi March 12 March – 6 April 1930, 385 km, 78 followers. Gandhi-Irwin Pact 5 March 1931. Communal Award 1932 → Poona Pact 24 Sept 1932.","Gandhi attended only the Second RTC and presided over only one Congress session (Belgaum, 1924). 'Mahatma' from Tagore; 'Father of the Nation' from Subhas Chandra Bose."],"app":"histmodern"},
{"id":"L32","g":"mod","heat":2,"title":"Women & lesser-known heroes of the freedom struggle","hi":"स्वतंत्रता संग्राम की महिलाएँ एवं गुमनाम नायक","blocks":[{"k":"hot","h":"SSC now asks about <b>lesser-known heroes<\/b> — 'Kanaklata Barua belonged to which state?', 'who led the Rampa rebellion?', 'who founded the Swadeshi Steam Navigation Company?'. Match each <b>name to a place and one deed<\/b>."},{"k":"story","h":"<p>History books often remember a few big names, but the freedom struggle was fought in every corner of India — by queens, poets, students and tribal chiefs. Long before 1857, <b>Rani Velu Nachiyar<\/b> of Sivaganga won back her kingdom from the Company in 1780 with Hyder Ali's help, and <b>Rani Chennamma<\/b> of Kittur took up the sword in 1824 when the British refused to accept her adopted son.<\/p><p>In the hills, the Company's roads, taxes and forest rules angered tribes who had lived freely for centuries. <b>Tirot Sing<\/b> of the Khasis, <b>Tilka Manjhi<\/b> near Bhagalpur and <b>Alluri Sitarama Raju<\/b> in the Rampa hills fought back with bows and guns. Most were captured or killed, but their courage lived on in local songs.<\/p><p>Under Gandhi, women came out in thousands. <b>Usha Mehta<\/b> ran a secret radio in 1942; <b>Matangini Hazra<\/b>, aged 73, and <b>Kanaklata Barua<\/b>, just 17, were shot while carrying the tricolour. In the south, <b>V. O. Chidambaram Pillai<\/b> even started an Indian shipping company to break the British hold on the sea trade. Their stories show that freedom was won by ordinary people as much as by famous leaders.<\/p>"},{"k":"table","title":"Women of the struggle","head":["Name","Region","Remember her for"],"rows":[["<b>Rani Velu Nachiyar<\/b>","<b>Sivaganga<\/b> (Tamil Nadu)","Fought the Company and regained her kingdom in <b>1780<\/b> with <b>Hyder Ali<\/b>'s help; called 'Veeramangai'"],["<b>Kittur Rani Chennamma<\/b>","<b>Kittur<\/b> (Karnataka)","Revolt of <b>1824<\/b> when the British refused to recognise her adopted son; the collector Thackeray was killed; died in captivity (1829); ally <b>Sangolli Rayanna<\/b>"],["<b>Rani Avantibai<\/b>","<b>Ramgarh<\/b> (Madhya Pradesh)","Fought in <b>1857<\/b>; took her own life in 1858 rather than surrender"],["<b>Jhalkari Bai<\/b>","<b>Jhansi<\/b>","In Rani Lakshmibai's women's army; dressed as the Rani to mislead the British (1857–58)"],["<b>Bhikaji Cama<\/b>","Bombay → Paris","Unfurled an Indian flag at the International Socialist Congress, <b>Stuttgart (Germany), 22 Aug 1907<\/b>"],["<b>Sarojini Naidu<\/b>","Hyderabad","'<b>Nightingale of India<\/b>'; led the <b>Dharasana<\/b> salt raid (1930); <b>first woman Governor<\/b> (United Provinces, 1947); her birthday, 13 Feb, is National Women's Day"],["<b>Kasturba Gandhi<\/b>","Gujarat","Died in detention at the <b>Aga Khan Palace, Pune<\/b>, 22 Feb 1944"],["<b>Aruna Asaf Ali<\/b>","Delhi / Bombay","Hoisted the flag at Gowalia Tank, 9 Aug 1942; <b>first Mayor of Delhi (1958)<\/b>"],["<b>Usha Mehta<\/b>","Bombay","Ran the secret <b>Congress Radio<\/b> during Quit India (1942)"],["<b>Matangini Hazra<\/b>","<b>Tamluk<\/b>, Midnapore (Bengal)","'<b>Gandhi Buri<\/b>'; shot at 73 leading a march on the Tamluk police station, <b>Sept 1942<\/b>"],["<b>Kanaklata Barua<\/b>","<b>Gohpur<\/b> (Assam)","Shot at 17 while trying to hoist the flag at the Gohpur police station, <b>Sept 1942<\/b>"],["<b>Sucheta Kripalani<\/b>","Uttar Pradesh","Founded the All India Mahila Congress (1940); <b>India's first woman Chief Minister<\/b> (UP, 1963)"],["<b>Kamaladevi Chattopadhyay<\/b>","Mangalore (Karnataka)","<b>First Indian woman to contest a legislative election<\/b> (Madras, 1926); revived handicrafts after 1947"],["<b>Pritilata Waddedar<\/b>","Chittagong","Led the attack on the <b>Pahartali European Club<\/b> (1932); took poison to avoid arrest"],["<b>Kalpana Dutta<\/b>","Chittagong","Comrade of Surya Sen in the Chittagong group; sentenced to transportation for life"],["<b>Bina Das<\/b>","Calcutta","Fired at Bengal Governor <b>Stanley Jackson<\/b> at the Calcutta University convocation (1932)"],["<b>Rani Gaidinliu<\/b>","Manipur / Naga hills","<b>Zeliangrong Naga<\/b> leader; jailed at 16 in 1932 and freed only in 1947; Nehru called her 'Rani'"]]},{"k":"table","title":"Tribal and regional heroes","head":["Hero","Area","What they did"],"rows":[["<b>Tilka Manjhi<\/b>","Bhagalpur region (Bihar / Jharkhand)","Led an early Adivasi revolt in the 1780s; tradition says he shot Collector <b>Augustus Cleveland<\/b>; hanged at Bhagalpur"],["<b>Tirot Sing<\/b>","<b>Khasi hills<\/b> (Meghalaya)","Chief of Nongkhlaw; <b>Anglo-Khasi war, 1829–33<\/b>, against a British road through his land; died in Dhaka jail (1835)"],["<b>U Kiang Nongbah<\/b>","<b>Jaintia hills<\/b> (Meghalaya)","Led the Jaintia rising of <b>1860–62<\/b>; hanged at <b>Jowai<\/b>, 1862"],["<b>Veer Narayan Singh<\/b>","<b>Sonakhan<\/b> (Chhattisgarh)","Gave hoarded grain to the starving in the 1856 famine; joined 1857; hanged at Raipur — <b>Chhattisgarh's first martyr of 1857<\/b>"],["<b>Alluri Sitarama Raju<\/b>","<b>Rampa<\/b>, Godavari agency (Andhra)","<b>Rampa rebellion, 1922–24<\/b>, against forest laws; killed in 1924"],["<b>V. O. Chidambaram Pillai<\/b>","<b>Tuticorin<\/b> (Tamil Nadu)","<b>Swadeshi Steam Navigation Company (1906)<\/b>; '<b>Kappalottiya Tamizhan<\/b>' (the Tamil helmsman); given two life sentences (1908)"],["<b>Subramania Bharati<\/b>","Tamil Nadu","Patriotic poet, '<b>Mahakavi<\/b>'; edited the weekly <i>India<\/i>; escaped to French <b>Pondicherry<\/b> (1908)"],["<b>Vanchinathan<\/b>","Tirunelveli (Tamil Nadu)","Shot Collector <b>Robert Ashe<\/b> at <b>Maniyachi<\/b> station (17 June 1911), then shot himself"],["<b>Tirupur Kumaran<\/b>","Tirupur (Tamil Nadu)","Beaten to death in 1932 while holding the national flag — '<b>Kodi Kaatha Kumaran<\/b>' (Kumaran who saved the flag)"]]},{"k":"facts","title":"Khilafat leaders","rows":[["Why the movement","After the First World War the Turkish Sultan, the <b>Khalifa<\/b> of Sunni Muslims, lost his power; Indian Muslims protested and <b>Gandhi joined<\/b> them (1919–24)"],["Khilafat Day","<b>17 October 1919<\/b>"],["<b>Ali brothers<\/b>","<b>Mohammad Ali (Jauhar)<\/b> and <b>Shaukat Ali<\/b> — the main Khilafat leaders; Mohammad Ali presided over the Congress at <b>Kakinada (1923)<\/b>"],["<b>Hakim Ajmal Khan<\/b>","Presided over the <b>Ahmedabad<\/b> Congress (1921); a founder of <b>Jamia Millia Islamia<\/b> (1920)"],["<b>M. A. Ansari<\/b>","Presided over the <b>Madras<\/b> Congress (1927); led a medical mission to Turkey (1912); later Chancellor of Jamia"],["End","Lost its purpose when <b>Mustafa Kemal Ataturk<\/b> abolished the Caliphate in 1924"]]},{"k":"trick","h":"<b>Two women martyrs of 1942<\/b> — <span class=\"mn\">MM–KA<\/span>: <b>M<\/b>atangini – <b>M<\/b>idnapore (Tamluk); <b>K<\/b>anaklata – <b>A<\/b>ssam (Gohpur).<br><b>Meghalaya's two chiefs<\/b> — <span class=\"mn\">T-K, K-J<\/span>: <b>T<\/b>irot – <b>K<\/b>hasi; <b>K<\/b>iang – <b>J<\/b>aintia.<br><b>V.O.C.<\/b> = '<span class=\"mn\">Very Own Company<\/span>' — he founded an Indian shipping company."},{"k":"trap","h":"<b>Aruna Asaf Ali hoisted the flag; Usha Mehta ran the radio<\/b>. <b>Sucheta Kripalani = first woman Chief Minister<\/b>; <b>Sarojini Naidu = first woman Governor<\/b>. <b>Kittur Chennamma (1824)<\/b> fought 33 years before 1857 — do not put her in the 1857 list; <b>Avantibai and Jhalkari Bai<\/b> belong to 1857. <b>Tirot Sing<\/b> (Khasi, 1829–33) and <b>U Kiang Nongbah<\/b> (Jaintia, 1860–62) are both from Meghalaya but from different hills and decades. <b>Alluri Sitarama Raju<\/b> led Rampa; <b>Birsa Munda<\/b> led the Munda Ulgulan."}],"sum":["Before 1857: Rani Velu Nachiyar of Sivaganga regained her kingdom in 1780 with Hyder Ali's help; Kittur Rani Chennamma revolted in 1824. In 1857: Rani Avantibai of Ramgarh and Jhalkari Bai of Jhansi.","Bhikaji Cama flew an Indian flag at Stuttgart in 1907; Sarojini Naidu was the first woman Governor; Sucheta Kripalani the first woman Chief Minister; Kasturba died at the Aga Khan Palace in 1944.","Quit India 1942: Aruna Asaf Ali hoisted the flag, Usha Mehta ran Congress Radio, Matangini Hazra was shot at Tamluk and Kanaklata Barua at Gohpur, Assam.","Tribal heroes: Tilka Manjhi (Bhagalpur), Tirot Sing (Khasi, 1829-33), U Kiang Nongbah (Jaintia, 1862), Veer Narayan Singh (Chhattisgarh, 1857), Alluri Sitarama Raju (Rampa, 1922-24), Rani Gaidinliu (Naga).","South: V. O. Chidambaram Pillai founded the Swadeshi Steam Navigation Company in 1906; Vanchinathan shot Collector Ashe in 1911. Khilafat: the Ali brothers, Hakim Ajmal Khan and M. A. Ansari."],"app":"histmodern"},
{"id":"L24","g":"mod","heat":3,"title":"Revolutionaries, INA & Independence","hi":"क्रांतिकारी · आज़ाद हिंद फौज · स्वतंत्रता","blocks":[{"k":"hot","h":"Bhagat Singh, Azad, the Kakori and Lahore conspiracy cases, Bose and the INA, Quit India, and the 1946–47 plans — expect at least one, often two."},{"k":"story","h":"<p>Not everyone believed peaceful protest alone would win freedom. From the early 1900s young <b>revolutionaries<\/b> chose bombs and guns. In Bengal, groups like the Anushilan Samiti formed, and <b>Khudiram Bose<\/b> was hanged at 18. Abroad, Indians formed the Ghadar Party in San Francisco. In 1925 Ramprasad Bismil's group robbed a train at Kakori. Then <b>Bhagat Singh<\/b>, Chandra Shekhar Azad and their comrades shot the officer Saunders to avenge Lala Lajpat Rai, and threw bombs in the Assembly to be heard. Bhagat Singh, Sukhdev and Rajguru were hanged in 1931.<\/p><p>During the Second World War, Britain wanted India's help but would not promise freedom. Gandhi answered with <b>Quit India<\/b> on 8 August 1942: Do or Die. Leaders were jailed at once, but people set up parallel governments in places like Ballia and Satara. Abroad, <b>Subhas Chandra Bose<\/b> led the Indian National Army to fight the British.<\/p><p>After the war, the INA trials and the navy mutiny of 1946 showed Britain it could no longer rely on Indian soldiers. Plans like the Cabinet Mission failed to keep India united, and violence grew. Finally the Mountbatten Plan divided the country, and India became free on 15 August 1947.<\/p>","key":"Revolutionaries, Quit India and Bose's INA together shook British rule, and after the war Britain left, dividing the country in 1947."},{"k":"facts","title":"Revolutionary movement","rows":[["<b>Anushilan Samiti<\/b> (1902) &amp; <b>Yugantar<\/b>","Bengal — Barindra Kumar Ghosh, Bhupendranath Datta, Pulin Behari Das"],["<b>Abhinav Bharat<\/b> (1904)","<b>V. D. Savarkar<\/b>, Nasik; book <i>The Indian War of Independence 1857<\/i>"],["<b>Muzaffarpur bomb<\/b> (1908)","<b>Khudiram Bose<\/b> &amp; <b>Prafulla Chaki<\/b> — targeted Kingsford, killed the Kennedys. Khudiram hanged at 18"],["<b>Alipore Conspiracy Case<\/b> (1908)","Aurobindo Ghosh, Barindra Ghosh; Chittaranjan Das defended Aurobindo"],["<b>Delhi Conspiracy<\/b> (1912)","Rash Behari Bose &amp; Sachindra Nath Sanyal — bomb on Hardinge II"],["<b>Ghadar Party<\/b> (1913, San Francisco)","Lala Hardayal, Sohan Singh Bhakna, Kartar Singh Sarabha; paper <i>Ghadar<\/i>; <b>Komagata Maru<\/b> incident (1914)"],["<b>Berlin Committee<\/b> (1915)","Virendranath Chattopadhyay; <b>Provisional Government of India at Kabul (1915)<\/b> — Raja Mahendra Pratap"],["<b>Hindustan Republican Association<\/b> (1924, Kanpur)","Sachindra Nath Sanyal, Ramprasad Bismil, Jogesh Chatterjee"],["<b>Kakori Conspiracy<\/b> (9 Aug 1925)","Train robbery; <b>Ramprasad Bismil, Ashfaqullah Khan, Roshan Singh, Rajendra Lahiri hanged<\/b>"],["<b>HSRA<\/b> (1928, Feroz Shah Kotla)","Renamed <b>Hindustan Socialist Republican Association<\/b> — <b>Chandra Shekhar Azad<\/b>, <b>Bhagat Singh<\/b>, Sukhdev, Rajguru, Bhagwati Charan Vohra"],["<b>Saunders killed<\/b> (17 Dec 1928)","Bhagat Singh, Rajguru, Azad — revenge for Lala Lajpat Rai"],["<b>Assembly bomb<\/b> (8 April 1929)","<b>Bhagat Singh &amp; Batukeshwar Dutt<\/b> threw bombs in the Central Legislative Assembly — \"to make the deaf hear\""],["<b>Lahore Conspiracy Case<\/b>","<b>Bhagat Singh, Sukhdev &amp; Rajguru hanged at Lahore on 23 March 1931<\/b> — now <b>Shaheed Diwas<\/b>. Jatin Das died after a 63-day hunger strike (1929)"],["<b>Chandra Shekhar Azad<\/b>","Died fighting at <b>Alfred Park, Allahabad, 27 Feb 1931<\/b>"],["<b>Chittagong Armoury Raid<\/b> (1930)","<b>Surya Sen \"Masterda\"<\/b>, with Kalpana Dutta &amp; Pritilata Waddedar"],["<b>Bina Das<\/b> / <b>Shanti Ghosh &amp; Suniti Chaudhary<\/b>","Fired at the Bengal Governor (1932) / killed the Comilla magistrate (1931)"],["Books/slogans","<b>\"Inquilab Zindabad\"<\/b> — Bhagat Singh (coined by Hasrat Mohani); <i>Why I am an Atheist<\/i> — Bhagat Singh; <b>\"Sarfaroshi ki tamanna\"<\/b> — Bismil Azimabadi, made famous by Ramprasad Bismil"]]},{"k":"trick","h":"<b>Four hanged in Kakori<\/b> — <span class=\"mn\">BARR<\/span>: <b>B<\/b>ismil, <b>A<\/b>shfaqullah, <b>R<\/b>oshan Singh, <b>R<\/b>ajendra Lahiri.<br><b>Three hanged in Lahore<\/b> — <span class=\"mn\">B-S-R<\/span>: <b>B<\/b>hagat Singh, <b>S<\/b>ukhdev, <b>R<\/b>ajguru, on <b>23 March 1931<\/b>."},{"k":"facts","title":"Subhas Chandra Bose & the INA","rows":[["Early career","Resigned from the ICS (1921); Congress President at <b>Haripura (1938)<\/b> &amp; <b>Tripuri (1939)<\/b>; resigned and founded the <b>Forward Bloc (1939)<\/b>"],["Escape","Escaped from house arrest in Jan 1941 to Germany via Kabul as \"Ziauddin\"; ran <b>Azad Hind Radio<\/b> from Berlin — where he was first called \"<b>Netaji<\/b>\""],["<b>INA / Azad Hind Fauj<\/b>","First raised by <b>Mohan Singh<\/b> (1942) with <b>Rash Behari Bose<\/b>'s Indian Independence League; Bose took command at <b>Singapore, 4 July 1943<\/b> — \"<b>Give me blood and I will give you freedom<\/b>\""],["<b>Azad Hind Government<\/b>","Proclaimed at Singapore, <b>21 October 1943<\/b>; took Andaman &amp; Nicobar (renamed <b>Shahid<\/b> &amp; <b>Swaraj<\/b> islands), Dec 1943"],["Brigades","Gandhi, Nehru, Azad and <b>Rani Jhansi<\/b> (women's regiment under <b>Capt. Lakshmi Sahgal<\/b>) brigades; slogans <b>\"Jai Hind\"<\/b> and \"Chalo Delhi\""],["End","Died in an air crash at <b>Taihoku (Taipei), 18 August 1945<\/b> (officially); <b>INA trials<\/b> at the Red Fort (1945–46), defended by Bhulabhai Desai, Nehru, Asaf Ali, Tej Bahadur Sapru"],["<b>RIN Mutiny<\/b>","<b>18 February 1946<\/b> — Royal Indian Navy ratings at Bombay; the last big shock to British confidence"]]},{"k":"tl","title":"Quit India to Independence","rows":[["<b>Aug 1940<\/b>","<b>August Offer<\/b> — dominion status after the war; rejected"],["<b>Oct 1940<\/b>","Individual Satyagraha — <b>Vinoba Bhave<\/b> the first satyagrahi, <b>Nehru<\/b> the second"],["<b>Mar 1942<\/b>","<b>Cripps Mission<\/b> — dominion status and the right of provinces to opt out; rejected. Gandhi called it \"a post-dated cheque\""],["<b>8 Aug 1942<\/b>","<b>Quit India Resolution<\/b> at Gowalia Tank, Bombay — \"<b>Do or Die<\/b>\"; leaders arrested on 9 Aug (<b>August Kranti<\/b>); parallel governments at <b>Ballia (Chittu Pandey)<\/b>, <b>Tamluk/Midnapore (Jatiya Sarkar)<\/b> and <b>Satara (Prati Sarkar, Y. B. Chavan &amp; Nana Patil)<\/b>; Aruna Asaf Ali hoisted the flag; Usha Mehta ran the Congress Radio"],["<b>1944<\/b>","<b>C. R. Formula<\/b> (Rajagopalachari) and the Gandhi-Jinnah talks fail"],["<b>1945<\/b>","<b>Wavell Plan<\/b> &amp; the <b>Simla Conference<\/b> — failed over the League's claim to name all Muslim members"],["<b>Mar 1946<\/b>","<b>Cabinet Mission<\/b> — <b>Pethick-Lawrence, Stafford Cripps, A. V. Alexander<\/b>; proposed a three-tier federation and a Constituent Assembly; rejected Pakistan"],["<b>16 Aug 1946<\/b>","<b>Direct Action Day<\/b> — the League's call; Calcutta killings"],["<b>2 Sept 1946<\/b>","<b>Interim Government<\/b> under <b>Nehru<\/b>; League joined in October"],["<b>9 Dec 1946<\/b>","<b>Constituent Assembly<\/b> first meets; Sachchidananda Sinha temporary chairman, <b>Rajendra Prasad<\/b> elected President on 11 Dec"],["<b>20 Feb 1947<\/b>","<b>Attlee's declaration<\/b> — British withdrawal by June 1948"],["<b>3 June 1947<\/b>","<b>Mountbatten Plan<\/b> — partition; date advanced to <b>15 August 1947<\/b>"],["<b>18 July 1947<\/b>","<b>Indian Independence Act<\/b> passed; <b>Radcliffe Commission<\/b> drew the boundary"],["<b>14–15 Aug 1947<\/b>","Independence; Nehru's \"Tryst with Destiny\"; Gandhi was in <b>Noakhali<\/b>, not Delhi"]]},{"k":"trick","h":"<b>Cabinet Mission's three members<\/b> — <span class=\"mn\">PCA<\/span>: <b>P<\/b>ethick-Lawrence, <b>C<\/b>ripps, <b>A<\/b>lexander.<br><b>Parallel governments in Quit India<\/b> — <span class=\"mn\">BTS<\/span>: <b>B<\/b>allia, <b>T<\/b>amluk, <b>S<\/b>atara."},{"k":"trap","h":"<b>Bhagat Singh was hanged for the Saunders murder (Lahore Conspiracy Case), not the Assembly bombing<\/b> — for the Assembly bombing he was given life. <b>Quit India began 8 August 1942<\/b> (resolution) with arrests on <b>9 August<\/b>. The <b>Cripps Mission (1942)<\/b> and the <b>Cabinet Mission (1946)<\/b> are different — Cripps was in both."}],"sum":["Kakori 1925 — Bismil, Ashfaqullah, Roshan Singh, Rajendra Lahiri hanged. HSRA 1928. Saunders killed Dec 1928; Assembly bomb 8 April 1929; Bhagat Singh, Sukhdev, Rajguru hanged 23 March 1931. Azad died at Alfred Park, 27 Feb 1931.","Chittagong Armoury Raid 1930 — Surya Sen. Ghadar Party 1913 San Francisco. Abhinav Bharat 1904 — Savarkar.","INA first raised by Mohan Singh; Bose took command at Singapore 4 July 1943; Azad Hind Government 21 Oct 1943; Rani Jhansi regiment under Capt. Lakshmi Sahgal; Bose died at Taihoku, 18 Aug 1945. RIN Mutiny 18 Feb 1946.","August Offer 1940 → Cripps Mission 1942 → Quit India 8 Aug 1942 ('Do or Die') with parallel governments at Ballia, Tamluk, Satara → Wavell Plan 1945 → Cabinet Mission 1946 (Pethick-Lawrence, Cripps, Alexander) → Direct Action Day 16 Aug 1946.","Constituent Assembly first met 9 Dec 1946; Mountbatten Plan 3 June 1947; Indian Independence Act 18 July 1947; freedom 15 Aug 1947; Radcliffe drew the boundary."],"app":"histmodern"},
{"id":"L25","g":"mod","heat":2,"title":"Constitutional development & economic policy","hi":"संवैधानिक विकास · आर्थिक नीति","blocks":[{"k":"hot","h":"The Acts from 1773 to 1947 — \"which Act introduced X\" is a standing question. Add the three land revenue settlements and the Drain Theory."},{"k":"story","h":"<p>The British ruled India through a chain of laws passed in London. Each Act gave the government a little more shape and, slowly, gave Indians a little more space. First Parliament reined in the Company: the <b>Regulating Act<\/b> of 1773 created a Governor-General of Bengal, and the 1833 Act made him Governor-General of India. After 1857, the <b>1858 Act<\/b> handed India to the Crown. Then Indians were let in step by step: nominated members (1861), indirect elections (1892), separate electorates (1909), dyarchy (shared power) in the provinces (1919), and provincial autonomy under the <b>1935 Act<\/b>, the main source of India's Constitution.<\/p><p>The other half of this lesson is money. To collect land tax, the British used three systems. In Bengal, Cornwallis's <b>Permanent Settlement<\/b> fixed the tax forever and made zamindars the owners. In Madras and Bombay, the Ryotwari system dealt directly with the farmer. In the north-west, the Mahalwari system dealt with the whole village. Heavy taxes, forced cash crops like indigo and the ruin of handicrafts made people poor; Naoroji called this the drain of wealth. Peasants and tribal people rose again and again, from the Santhals to Birsa Munda's Ulgulan. The tables give each Act and each settlement.<\/p>","key":"British Acts slowly gave Indians a share in government, while British land revenue systems and the drain of wealth made peasants poorer."},{"k":"table","title":"Acts 1773–1947 — one feature each","head":["Act","Year","The one thing it introduced"],"rows":[["<b>Regulating Act<\/b>","1773","First British interference; <b>Governor-General of Bengal<\/b> (Warren Hastings); Supreme Court at Calcutta (1774)"],["Pitt's India Act","1784","<b>Board of Control<\/b> — dual government of the Company and the Crown"],["Charter Act","1793","Company's monopoly extended 20 years; Governor-General given power over the presidencies"],["<b>Charter Act<\/b>","1813","Ended the Company's monopoly except in tea &amp; China; <b>₹1 lakh for education<\/b>; allowed missionaries"],["<b>Charter Act<\/b>","1833","<b>Governor-General of India<\/b> (Bentinck); Company becomes a purely administrative body; <b>Law Member (Macaulay)<\/b> added; Law Commission"],["<b>Charter Act<\/b>","1853","First to separate legislative and executive functions; introduced <b>open competition<\/b> for the civil services (Macaulay Committee)"],["<b>Government of India Act<\/b>","<b>1858<\/b>","Crown rule; <b>Secretary of State for India<\/b>; Viceroy; \"Act for the Good Government of India\""],["<b>Indian Councils Act<\/b>","1861","<b>Portfolio system<\/b>; Indians nominated to the legislative council for the first time; ordinance power"],["Indian Councils Act","1892","Indirect <b>elections<\/b> introduced (nomination by recommendation); budget discussion allowed"],["<b>Morley-Minto / Indian Councils Act<\/b>","<b>1909<\/b>","<b>Separate electorates<\/b> for Muslims; <b>Satyendra Prasad Sinha<\/b> became the first Indian in the Viceroy's Executive Council"],["<b>Montagu-Chelmsford / GoI Act<\/b>","<b>1919<\/b>","<b>Dyarchy<\/b> in the provinces (transferred and reserved subjects); <b>bicameral<\/b> central legislature; separation of central and provincial budgets; a <b>Public Service Commission (1926)<\/b>; franchise widened"],["<b>Government of India Act<\/b>","<b>1935<\/b>","<b>Provincial autonomy<\/b> (dyarchy ended in provinces, introduced at the centre); <b>All-India Federation<\/b> proposed; <b>RBI<\/b>; <b>Federal Court (1937)<\/b>; separate electorates extended; Burma separated; the <b>main source of our Constitution<\/b>"],["Indian Independence Act","1947","Two dominions; the Constituent Assembly made fully sovereign; the office of Secretary of State abolished"]]},{"k":"trick","h":"<b>Three \"first\" Acts<\/b> — <span class=\"mn\">1773 Bengal, 1833 India, 1858 Crown<\/span>: first Governor-General <i>of Bengal<\/i> (1773), first Governor-General <i>of India<\/i> (1833), first <i>Crown<\/i> rule (1858).<br><b>Dyarchy<\/b>: introduced in the <b>provinces by 1919<\/b>, moved to the <b>centre by 1935<\/b> — it travels upward."},{"k":"table","title":"Land revenue settlements","head":["System","Who · Year","Where","How it worked"],"rows":[["<b>Permanent Settlement / Zamindari<\/b>","<b>Cornwallis, 1793<\/b> (idea: John Shore)","Bengal, Bihar, Odisha, Varanasi, north Madras — <b>~19%<\/b> of British India","Zamindar fixed as owner, revenue fixed forever at 10/11 to the state; peasants became tenants"],["<b>Ryotwari<\/b>","<b>Thomas Munro &amp; Capt. Read, 1820<\/b>","Madras, Bombay, Assam, Coorg — <b>~51%<\/b>","Settlement directly with the <b>ryot<\/b> (cultivator); revisable every 20–30 years"],["<b>Mahalwari<\/b>","<b>Holt Mackenzie, 1822<\/b>; revised by <b>William Bentinck, 1833<\/b>","North-West Provinces, Punjab, Central India — <b>~30%<\/b>","Settlement with the <b>village/mahal<\/b> as a unit through the headman"]]},{"k":"facts","title":"Economic impact — terms SSC asks","rows":[["<b>Drain of wealth<\/b>","<b>Dadabhai Naoroji<\/b>, <i>Poverty and Un-British Rule in India<\/i> (1901)"],["De-industrialisation","Ruin of handloom and handicraft; India turned into a supplier of raw material and a market for British goods"],["<b>Commercialisation of agriculture<\/b>","Forced cash crops — indigo, cotton, jute, opium"],["<b>Indigo revolt<\/b>","<b>1859–60, Bengal<\/b> — Digambar &amp; Bishnu Biswas; <i>Nil Darpan<\/i> by <b>Dinabandhu Mitra<\/b>"],["Deccan riots","1875 — against moneylenders; led to the Deccan Agriculturists' Relief Act 1879"],["Santhal rebellion","1855–56 — <b>Sidhu &amp; Kanhu<\/b>"],["<b>Munda rebellion / Ulgulan<\/b>","1899–1900 — <b>Birsa Munda<\/b> (his birthday, <b>15 November<\/b>, is Janjatiya Gaurav Divas)"],["Kol, Bhil, Khond, Ahom rebellions","Kol 1831 (Buddho Bhagat), Bhil 1818, Khond 1846, Ahom 1828"],["Moplah revolt","1921, Malabar"],["<b>Champaran<\/b> &amp; <b>Bardoli<\/b>","Indigo tinkathia (1917) and revenue hike (1928)"],["Peasant bodies","<b>Kisan Sabha, 1918<\/b> (Awadh, Baba Ramchandra); <b>All India Kisan Sabha, 1936<\/b> (Sahajanand Saraswati); Eka movement 1921"],["Early railways &amp; famine","First railway 1853; <b>Famine Commissions<\/b> — Campbell (1866), Strachey (1880), Lyall (1896), MacDonnell (1900)"]]},{"k":"trap","h":"<b>Permanent Settlement = Cornwallis 1793<\/b>; <b>Ryotwari = Munro<\/b>; <b>Mahalwari = Mackenzie/Bentinck<\/b>. The <b>largest area<\/b> was under <b>Ryotwari (~51%)<\/b>, not Zamindari. The <b>1935 Act<\/b> — not 1919 — is the main source of the Indian Constitution."}],"sum":["1773 Regulating Act — Governor-General of Bengal. 1784 Pitt's India Act — Board of Control. 1813 — ₹1 lakh for education. 1833 — Governor-General of India. 1853 — open competition for the civil services.","1858 — Crown rule, Secretary of State, Viceroy. 1861 — portfolio system. 1909 — separate electorates. 1919 — dyarchy in provinces, bicameral centre. 1935 — provincial autonomy, RBI, Federal Court; main source of the Constitution.","Permanent Settlement/Zamindari — Cornwallis 1793, ~19%. Ryotwari — Munro 1820, ~51% (largest). Mahalwari — Mackenzie 1822/Bentinck 1833, ~30%.","Drain theory — Dadabhai Naoroji, Poverty and Un-British Rule in India. Indigo revolt 1859–60; Nil Darpan by Dinabandhu Mitra.","Tribal revolts: Santhal 1855 (Sidhu & Kanhu), Munda Ulgulan 1899–1900 (Birsa Munda), Kol 1831, Moplah 1921. All India Kisan Sabha 1936."],"app":"histmodern"},
{"id":"L33","g":"mod","heat":2,"title":"India after 1947: integration & reorganisation","hi":"स्वतंत्रता के बाद · एकीकरण एवं राज्य पुनर्गठन","blocks":[{"k":"hot","h":"Post-1947 history is now a regular SSC topic: <b>how Junagadh, Hyderabad and Kashmir joined<\/b>, the <b>year each state was formed<\/b>, and the <b>members of the States Reorganisation Commission<\/b>. It overlaps with Polity questions."},{"k":"story","h":"<p>On 15 August 1947 India was free, but it was not yet one country on the map. Besides the British provinces there were over 560 <b>princely states<\/b>, big and small, and the British had told them they could join India, join Pakistan or try to stay independent. A broken map would have meant a weak nation.<\/p><p><b>Sardar Vallabhbhai Patel<\/b>, the Home Minister, and his secretary <b>V. P. Menon<\/b> took on the job. They asked each ruler to sign an <b>Instrument of Accession<\/b>, handing over only defence, external affairs and communications. Using persuasion, pensions and, when needed, pressure, they brought nearly every state in by 15 August. Only three held out: <b>Junagadh<\/b> joined after a plebiscite in 1948, <b>Hyderabad<\/b> after the army's <b>Operation Polo<\/b>, and <b>Kashmir<\/b> when Maharaja Hari Singh signed in October 1947 as raiders attacked.<\/p><p>Next came the question of language. People wanted states where their own language was spoken. When <b>Potti Sriramulu<\/b> died fasting for a Telugu state in 1952, Andhra was created in 1953. The <b>Fazl Ali Commission<\/b> then studied the whole map, and the <b>States Reorganisation Act of 1956<\/b> made language the main basis of our states.<\/p>"},{"k":"facts","title":"Integrating the princely states","rows":[["<b>States Ministry<\/b>","Set up in July 1947 — minister <b>Sardar Patel<\/b>, secretary <b>V. P. Menon<\/b>"],["<b>Instrument of Accession<\/b>","The ruler handed over only <b>defence, external affairs and communications<\/b>"],["Standstill Agreement","Kept existing arrangements running until a final decision"],["Number of states","Over 560"],["Patel","'<b>Iron Man of India<\/b>'; his birthday, <b>31 October<\/b>, is <b>Rashtriya Ekta Diwas<\/b>; <b>Statue of Unity<\/b> (2018) at Kevadia, Gujarat"],["V. P. Menon's book","<i>The Story of the Integration of the Indian States<\/i> (1956)"]]},{"k":"table","title":"The holdouts and the later additions","head":["Territory","Problem","How and when it joined"],"rows":[["<b>Junagadh<\/b>","The Nawab acceded to <b>Pakistan<\/b> though most of his people were Hindu","Indian control in Nov 1947; <b>plebiscite, Feb 1948<\/b> — overwhelmingly for India"],["<b>Hyderabad<\/b>","The <b>Nizam<\/b> (Mir Osman Ali Khan) wanted independence; <b>Razakars<\/b> under Qasim Rizvi","<b>Operation Polo<\/b> ('police action'), <b>13–17 Sept 1948<\/b>"],["<b>Jammu &amp; Kashmir<\/b>","<b>Maharaja Hari Singh<\/b> delayed; tribal raiders from Pakistan invaded","Instrument of Accession signed <b>26 Oct 1947<\/b>; Indian troops flown in on 27 Oct"],["Dadra &amp; Nagar Haveli","Portuguese enclave","Freed by volunteers in 1954; merged with India in 1961"],["<b>Pondicherry<\/b>","French settlements","<b>De facto transfer 1954<\/b>; de jure 1962"],["<b>Goa, Daman &amp; Diu<\/b>","The Portuguese refused to leave","<b>Operation Vijay, Dec 1961<\/b>; Goa became a state in 1987"],["<b>Sikkim<\/b>","Protectorate under the Chogyal","<b>36th Amendment, 1975<\/b> — India's <b>22nd state<\/b>"]]},{"k":"tl","title":"Language and the new map","rows":[["1948","<b>Dhar Commission<\/b> (S. K. Dhar) — preferred administrative convenience to language"],["Dec 1948","<b>JVP Committee<\/b> — <b>J<\/b>awaharlal Nehru, <b>V<\/b>allabhbhai Patel, <b>P<\/b>attabhi Sitaramayya; also rejected language as the basis for now"],["<b>1952<\/b>","<b>Potti Sriramulu<\/b>'s fast unto death for a Telugu state; he died on 15 Dec 1952"],["<b>1 Oct 1953<\/b>","<b>Andhra State<\/b> — the first state formed on a linguistic basis after Independence; capital Kurnool"],["<b>Dec 1953<\/b>","<b>States Reorganisation Commission<\/b> — <b>Fazl Ali<\/b> (chairman), <b>K. M. Panikkar<\/b>, <b>H. N. Kunzru<\/b>; report 1955"],["<b>1 Nov 1956<\/b>","<b>States Reorganisation Act<\/b> — <b>14 states and 6 Union Territories<\/b>"]]},{"k":"tl","title":"New states after 1956","rows":[["<b>1960<\/b>","<b>Maharashtra and Gujarat<\/b> (Bombay State split), 1 May"],["<b>1963<\/b>","<b>Nagaland<\/b>"],["<b>1966<\/b>","<b>Haryana<\/b> (from Punjab); Chandigarh a Union Territory"],["<b>1971<\/b>","<b>Himachal Pradesh<\/b>"],["<b>1972<\/b>","<b>Manipur, Meghalaya, Tripura<\/b>"],["<b>1975<\/b>","<b>Sikkim<\/b> — 22nd state"],["<b>1987<\/b>","<b>Mizoram, Arunachal Pradesh, Goa<\/b>"],["<b>2000<\/b>","<b>Chhattisgarh<\/b> (from MP, 1 Nov), <b>Uttarakhand<\/b> (from UP, 9 Nov), <b>Jharkhand<\/b> (from Bihar, 15 Nov)"],["<b>2014<\/b>","<b>Telangana<\/b> (from Andhra Pradesh, 2 June) — 29th state"],["<b>2019<\/b>","<b>J&amp;K<\/b> reorganised into two Union Territories, <b>J&amp;K and Ladakh<\/b> (31 Oct) — India now has 28 states"],["<b>2020<\/b>","<b>Dadra &amp; Nagar Haveli<\/b> and <b>Daman &amp; Diu<\/b> merged into one Union Territory (26 Jan)"]]},{"k":"facts","title":"The Republic begins","rows":[["Constitution adopted","<b>26 November 1949<\/b> — now <b>Constitution Day<\/b>"],["Constitution in force","<b>26 January 1950<\/b> — chosen because 26 Jan 1930 was the first Purna Swaraj day"],["First President","<b>Dr Rajendra Prasad<\/b>"],["<b>First general election<\/b>","<b>Oct 1951 – Feb 1952<\/b>; first Chief Election Commissioner <b>Sukumar Sen<\/b>; Nehru continued as Prime Minister"],["Renamed states","Madras → <b>Tamil Nadu<\/b> (1969); Mysore → <b>Karnataka<\/b> (1973); Orissa → <b>Odisha<\/b> (2011)"]]},{"k":"trick","h":"<b>Three holdouts<\/b> — <span class=\"mn\">J-H-K<\/span>: <b>J<\/b>unagadh – plebiscite; <b>H<\/b>yderabad – Polo; <b>K<\/b>ashmir – Instrument.<br><b>SRC members<\/b> — <span class=\"mn\">FPK<\/span>: <b>F<\/b>azl Ali, <b>P<\/b>anikkar, <b>K<\/b>unzru. Do not mix with <b>JVP<\/b> (Jawaharlal, Vallabhbhai, Pattabhi).<br><b>November 2000 triplets<\/b> — <span class=\"mn\">C-U-J = 1, 9, 15<\/span>: Chhattisgarh, Uttarakhand, Jharkhand."},{"k":"trap","h":"<b>Andhra State (1953)<\/b> was the first linguistic state after Independence; <b>Andhra Pradesh<\/b> came in 1956. Before Independence, <b>Orissa (1936)<\/b> was the first province formed on language. <b>Operation Polo = Hyderabad (1948)<\/b>; <b>Operation Vijay = Goa (1961)<\/b>. Goa became a <b>Union Territory in 1961<\/b> but a <b>state only in 1987<\/b>. Pondicherry: <b>de facto 1954, de jure 1962<\/b>. The Constitution was <b>adopted on 26 Nov 1949<\/b> but <b>came into force on 26 Jan 1950<\/b>."}],"sum":["Sardar Patel and V. P. Menon brought over 560 princely states in through the Instrument of Accession, which gave India only defence, external affairs and communications.","The three holdouts: Junagadh (plebiscite, Feb 1948), Hyderabad (Operation Polo, Sept 1948) and Kashmir (accession by Hari Singh, 26 Oct 1947). Goa was freed by Operation Vijay in 1961; Sikkim became the 22nd state in 1975.","Potti Sriramulu's fast led to Andhra State in 1953; the Fazl Ali Commission (Fazl Ali, Panikkar, Kunzru) led to the States Reorganisation Act of 1956, which made 14 states and 6 Union Territories.","Later states: Maharashtra and Gujarat 1960, Nagaland 1963, Haryana 1966, Himachal 1971, Manipur, Meghalaya and Tripura 1972, Mizoram, Arunachal and Goa 1987, Chhattisgarh, Uttarakhand and Jharkhand 2000, Telangana 2014.","The Constitution was adopted on 26 Nov 1949 and came into force on 26 Jan 1950; the first general election was held in 1951-52 under Sukumar Sen; J and K became two Union Territories in 2019."],"app":"histmodern"},
{"id":"L26","g":"art","heat":3,"title":"Classical dance & music","hi":"शास्त्रीय नृत्य एवं संगीत","blocks":[{"k":"hot","h":"A guaranteed 1–2 marks. Only two things matter: <b>dance ↔ state<\/b> and <b>exponent ↔ dance<\/b>; then gharanas and instruments."},{"k":"story","h":"<p>Indian classical dance and music grew over many centuries in temples and royal courts. The oldest guide to both is the <b>Natyashastra<\/b> of Bharata Muni, which describes the nine rasas (moods) a performance should create. Today eight dances are officially classical. What the exam really asks is which dance belongs to which state, and who its famous dancers are.<\/p><p>So build a mental map of India. Start in the south: Tamil Nadu has <b>Bharatanatyam<\/b>, the oldest; Kerala has two, Kathakali (men, heavy make-up) and Mohiniyattam (women); Andhra Pradesh has Kuchipudi. Move up the east coast to Odisha for Odissi, then to the north-east: Manipur for Manipuri, and Assam for Sattriya, the newest, added in 2000. Finally go to Uttar Pradesh for <b>Kathak<\/b>, the only one shaped by the Mughal court. Three dances carry their place in their name: Odissi, Manipuri and Kuchipudi.<\/p><p>Music splits north and south in the same way. <b>Hindustani<\/b> music in the north grew with Persian contact, with forms like khayal and instruments like sitar and tabla. <b>Carnatic<\/b> music in the south stayed closer to the old Sanskrit tradition, with its trinity of composers led by Tyagaraja. For musicians, learn one instrument per famous name.<\/p>","key":"Picture the map: four dances in the south, three in the east and north-east, and Kathak in the north, then split music into Hindustani and Carnatic."},{"k":"table","title":"Eight classical dances","head":["Dance","State","Famous exponents · note"],"rows":[["<b>Bharatanatyam<\/b>","Tamil Nadu","Rukmini Devi Arundale, Balasaraswati, Yamini Krishnamurthy, Padma Subrahmanyam. Oldest; from the Devadasi tradition; \"fire dance\""],["<b>Kathak<\/b>","Uttar Pradesh","Birju Maharaj, Sitara Devi, Shambhu Maharaj, Lachhu Maharaj. The only classical dance with a <b>Muslim/Mughal influence<\/b>; gharanas <b>Lucknow, Jaipur, Banaras<\/b>"],["<b>Kathakali<\/b>","Kerala","Kalamandalam Gopi, Kavungal Chathunni Panicker, Guru Kunchu Kurup. All-male, elaborate make-up (<i>chutti<\/i>); \"story-play\""],["<b>Kuchipudi<\/b>","Andhra Pradesh","Raja &amp; Radha Reddy, Yamini Krishnamurthy, Vempati Chinna Satyam. Dancing on the rim of a brass plate (<i>Tarangam<\/i>)"],["<b>Odissi<\/b>","Odisha","Kelucharan Mohapatra, Sonal Mansingh, Sanjukta Panigrahi. <b>Tribhanga<\/b> posture; linked to the Jagannath temple and the <i>Maharis<\/i>"],["<b>Manipuri<\/b>","Manipur","Jhaveri sisters, Guru Bipin Singh, Nirmala Mehta. <b>Ras Leela<\/b>; gentle, no sharp foot-strikes; <b>Sankirtana &amp; Pung Cholom<\/b>"],["<b>Mohiniyattam<\/b>","Kerala","Sunanda Nair, Kalamandalam Kalyanikutty Amma, Bharati Shivaji. Solo, by women; \"dance of the enchantress\""],["<b>Sattriya<\/b>","Assam","Began with <b>Shankaradeva<\/b>; performed in <i>sattras<\/i> (monasteries); recognised as classical in <b>2000<\/b>"]]},{"k":"trick","h":"<b>Two from Kerala<\/b>: <b>Ka<\/b>thakali (men) and <b>Mo<\/b>hiniyattam (women) — <span class=\"mn\">Kerala = Ka + Mo<\/span>.<br><b>Dance ↔ state<\/b> by first letters: <b>Bh<\/b>aratanatyam–Tamil Nadu, <b>Kath<\/b>ak–UP, <b>Kuch<\/b>ipudi–Andhra, <b>O<\/b>dissi–<b>O<\/b>disha, <b>Mani<\/b>puri–<b>Mani<\/b>pur, <b>Satt<\/b>riya–Assam. Three are self-naming (Odissi, Manipuri, and Kuchipudi is a village in Andhra)."},{"k":"facts","title":"Dance theory","rows":[["<b>Natyashastra<\/b>","By <b>Bharata Muni<\/b> — the oldest text on dance/drama; called the <b>fifth Veda<\/b>"],["<b>Abhinaya Darpana<\/b>","By <b>Nandikeshvara<\/b>"],["Nine rasas (Navarasa)","Shringara, Hasya, Karuna, Raudra, Veera, Bhayanaka, Vibhatsa, Adbhuta, Shanta"],["<b>Nritta / Nritya / Natya<\/b>","Pure rhythm / expressive dance / dance-drama"],["<b>Tandava / Lasya<\/b>","Vigorous (masculine) / graceful (feminine)"],["Three elements","<b>Bhava, Raga, Tala<\/b> — hence \"<b>Bharata<\/b>\" natyam"]]},{"k":"table","title":"Hindustani vs Carnatic music","head":["Point","Hindustani (north)","Carnatic (south)"],"rows":[["Origin","Grew with Persian/Central Asian contact","Stayed closer to the Natyashastra and Sanskrit tradition"],["Founder figure","<b>Amir Khusrau<\/b> credited with the Khayal and the sitar","<b>Purandara Dasa<\/b> — \"father of Carnatic music\""],["Forms","<b>Dhrupad, Khayal, Thumri, Tappa, Tarana, Ghazal, Dadra<\/b>","<b>Kriti, Varnam, Ragam-Tanam-Pallavi, Kirtanam<\/b>"],["Ragas","About 6 main ragas, many <i>raginis<\/i>","72 <b>melakartas<\/b>; emphasis on the composition"],["Trinity","—","<b>Tyagaraja, Muthuswami Dikshitar, Shyama Shastri<\/b>"],["Main instrument pair","Sitar/sarod + tabla","Veena + mridangam, violin, ghatam"]]},{"k":"facts","title":"Gharanas and famous musicians","rows":[["<b>Gwalior gharana<\/b>","Oldest Khayal gharana — Haddu &amp; Hassu Khan"],["<b>Kirana gharana<\/b>","Abdul Karim Khan, <b>Bhimsen Joshi<\/b>, Gangubai Hangal"],["<b>Jaipur-Atrauli<\/b>","Alladiya Khan, Kishori Amonkar"],["<b>Agra, Patiala, Rampur-Sahaswan<\/b>","Faiyaz Khan / Bade Ghulam Ali Khan / Rashid Khan"],["Sitar","<b>Ravi Shankar<\/b>, Vilayat Khan, Nikhil Banerjee, Anoushka Shankar"],["Sarod","<b>Ali Akbar Khan<\/b>, <b>Amjad Ali Khan<\/b>"],["Shehnai","<b>Bismillah Khan<\/b> (Bharat Ratna)"],["Flute (bansuri)","<b>Hariprasad Chaurasia<\/b>, Pannalal Ghosh"],["Santoor","<b>Shivkumar Sharma<\/b>"],["Tabla","<b>Zakir Hussain<\/b>, Alla Rakha, Kishan Maharaj"],["Sarangi","Ram Narayan"],["Violin (Carnatic)","<b>L. Subramaniam<\/b>, T. N. Krishnan"],["Mandolin","U. Shrinivas"],["Rudra Veena","Asad Ali Khan"],["Vocal (Carnatic)","<b>M. S. Subbulakshmi<\/b> (first musician to get the Bharat Ratna), Semmangudi Srinivasa Iyer"],["Mohan Veena","Vishwa Mohan Bhatt"]]},{"k":"trap","h":"<b>Sattriya was added in 2000<\/b> — before that there were seven classical dances; a favourite \"how many\" question. <b>Kathak<\/b> is the only one with Mughal court influence; <b>Kathakali ≠ Kathak<\/b>. <b>Mohiniyattam<\/b> is from Kerala, not Karnataka — Karnataka's famous forms (<b>Yakshagana<\/b>, <b>Bayalata<\/b>) are <i>folk<\/i>, not classical."}],"sum":["Eight classical dances: Bharatanatyam–TN, Kathak–UP, Kathakali & Mohiniyattam–Kerala, Kuchipudi–AP, Odissi–Odisha, Manipuri–Manipur, Sattriya–Assam (added 2000).","Natyashastra by Bharata Muni (the fifth Veda); Abhinaya Darpana by Nandikeshvara; nine rasas; Tandava vs Lasya.","Hindustani forms: Dhrupad, Khayal, Thumri, Tappa, Tarana. Carnatic: Kriti, Varnam; trinity Tyagaraja, Muthuswami Dikshitar, Shyama Shastri; Purandara Dasa the father of Carnatic music.","Instruments: sitar–Ravi Shankar, sarod–Amjad Ali Khan, shehnai–Bismillah Khan, flute–Hariprasad Chaurasia, santoor–Shivkumar Sharma, tabla–Zakir Hussain, sarangi–Ram Narayan.","M. S. Subbulakshmi was the first musician to receive the Bharat Ratna."],"app":"artculture"},
{"id":"L27","g":"art","heat":2,"title":"Architecture — stupas, caves & temples","hi":"स्थापत्य कला","blocks":[{"k":"hot","h":"Standard questions: the three temple styles with examples, which caves are where and whose, and \"who built the Taj/Qutub/Charminar\". The style table is the whole chapter."},{"k":"story","h":"<p>India's buildings tell the story of its religions and rulers. The earliest great monuments were Buddhist. Ashoka began the stupa at <b>Sanchi<\/b>, a solid dome built over relics. Monks also cut prayer halls and living rooms out of hillsides. These caves run from Barabar in Bihar, the oldest, to <b>Ajanta<\/b>, famous for its paintings, and <b>Ellora<\/b>, where Buddhist, Hindu and Jain caves stand side by side.<\/p><p>Later, Hindu temples were built in stone, and three regional styles grew. The north built <b>Nagara<\/b> temples with a curved tower, like Khajuraho and Konark. The south built <b>Dravida<\/b> temples with a pyramid-shaped tower, tall gateways and walls, like Brihadeshwara at Thanjavur. The Deccan, in between, mixed the two in the Vesara style, seen at Pattadakal and Belur.<\/p><p>From the Delhi Sultanate on, Islamic builders brought the true arch and dome, along with stone inlay, jali screens and garden tombs. This tradition runs from the Qutub Minar to its peak in the Taj Mahal. Finally the British built in Gothic and Indo-Saracenic styles, and Lutyens and Baker designed New Delhi. The tables give the styles, the caves and the builders.<\/p>","key":"Learn Indian architecture in layers: Buddhist stupas and caves, three temple styles by region, Indo-Islamic arches and domes, then colonial buildings."},{"k":"table","title":"Three temple styles","head":["Style","Where","Marks of the style","Examples"],"rows":[["<b>Nagara<\/b>","North India","Curvilinear <b>shikhara<\/b>; no boundary wall or gateway; square sanctum with projections; <b>amalaka<\/b> &amp; <b>kalasha<\/b> on top","Khajuraho (Kandariya Mahadeva), Konark Sun temple, Lingaraja (Bhubaneswar), Dashavatara (Deogarh), Somnath"],["<b>Dravida<\/b>","South India","Pyramidal <b>vimana<\/b>; tall <b>gopuram<\/b> gateways; boundary wall; temple tank; <b>stupika/shikhara<\/b> is the crowning element","Brihadeshwara (Thanjavur), Shore temple &amp; rathas (Mahabalipuram), Meenakshi (Madurai), Kailasanatha (Kanchipuram)"],["<b>Vesara<\/b>","Deccan — a mix","Nagara shikhara on a Dravida plan; star-shaped plans in the Hoysala version","Pattadakal, Aihole, Badami; Hoysaleshwara (Halebid), Chennakeshava (Belur)"]]},{"k":"trick","h":"<b>Style ↔ region<\/b>: <b>Na<\/b>gara = <b>No<\/b>rth, <b>Dra<\/b>vida = <b>D<\/b>own south, <b>Ve<\/b>sara = <b>Ve<\/b>ech (between) — the Deccan.<br><b>Gopuram only in the south<\/b>; a <b>curved shikhara only in the north<\/b>."},{"k":"facts","title":"Stupas and Buddhist architecture","rows":[["<b>Sanchi<\/b> (MP)","Begun by <b>Ashoka<\/b>; railings and gateways (<i>toranas<\/i>) added by the <b>Sungas &amp; Satavahanas<\/b>; UNESCO site; the <b>largest stupa<\/b> and the best preserved"],["<b>Bharhut<\/b> (MP)","Sunga-period railings with Jataka scenes"],["<b>Amaravati<\/b> (AP)","Satavahana; white marble narrative panels"],["<b>Dhamek Stupa, Sarnath<\/b>","Marks Buddha's first sermon"],["<b>Nalanda &amp; Ratnagiri / Lalitgiri / Udayagiri<\/b> (Odisha)","Monastic complexes — the \"Diamond Triangle\""],["Parts of a stupa","<b>Medhi<\/b> (base), <b>Anda<\/b> (dome), <b>Harmika<\/b> (square railing), <b>Yashti<\/b> (mast), <b>Chhatra<\/b> (umbrella), <b>Pradakshina Patha<\/b> (circumambulation), <b>Torana<\/b> (gateway)"]]},{"k":"table","title":"Cave architecture","head":["Caves","State","Whose / what"],"rows":[["<b>Ajanta<\/b>","Maharashtra","<b>Buddhist only<\/b>, 29 caves; <b>paintings<\/b> (fresco/tempera) of Jataka tales; 2nd c. BCE–6th c. CE; UNESCO"],["<b>Ellora<\/b>","Maharashtra","<b>All three — Buddhist, Hindu, Jain<\/b>, 34 caves; <b>Kailasa temple (Cave 16)<\/b> cut from one rock by <b>Krishna I (Rashtrakuta)<\/b>; UNESCO"],["<b>Elephanta<\/b>","Maharashtra","Shaivite; the <b>Trimurti<\/b> / Maheshmurti; Rashtrakuta period; UNESCO"],["<b>Bagh<\/b>","Madhya Pradesh","Buddhist paintings, like Ajanta's"],["<b>Udayagiri &amp; Khandagiri<\/b>","Odisha","<b>Jain<\/b>; Kharavela's <b>Hathigumpha inscription<\/b>"],["<b>Karla, Bhaja, Bedsa, Nasik, Kanheri<\/b>","Maharashtra","Buddhist <b>chaityas<\/b> &amp; <b>viharas<\/b>; Karla has the largest chaitya hall"],["<b>Barabar<\/b>","Bihar","<b>Oldest<\/b> rock-cut caves, Mauryan period (Lomas Rishi)"],["<b>Sittanavasal<\/b>","Tamil Nadu","Jain paintings"],["<b>Badami<\/b>","Karnataka","Chalukyan, Hindu &amp; Jain"]]},{"k":"trick","h":"<b>Ajanta vs Ellora<\/b> — \"<b>A<\/b>janta is <b>A<\/b>ll Buddhist and has the <b>A<\/b>rt (paintings); <b>E<\/b>llora is <b>E<\/b>verybody's (three religions) and has the <b>E<\/b>normous Kailasa.\"<br><b>Elephanta<\/b> → <b>Trimurti<\/b> of Shiva."},{"k":"facts","title":"Indo-Islamic and colonial","rows":[["<b>Delhi Sultanate style<\/b>","<b>Quwwat-ul-Islam mosque<\/b> &amp; <b>Qutub Minar<\/b> (Aibak–Iltutmish), <b>Alai Darwaza<\/b> (Alauddin Khalji), <b>Tughlaqabad<\/b>, <b>Lodi tombs<\/b>"],["<b>Mughal peak<\/b>","<b>Humayun's tomb<\/b> (first garden tomb), <b>Fatehpur Sikri &amp; Buland Darwaza<\/b> (Akbar), <b>Itimad-ud-Daulah<\/b> (first full marble, <i>pietra dura<\/i>), <b>Taj Mahal<\/b> (Shah Jahan; Ustad Ahmad Lahauri), <b>Red Fort &amp; Jama Masjid<\/b>"],["<b>Provincial<\/b>","<b>Gol Gumbaz<\/b> (Bijapur), <b>Charminar<\/b> (Hyderabad, 1591), Atala Masjid (Jaunpur), Jama Masjid of Ahmedabad"],["<b>Features<\/b>","<b>True arch &amp; dome<\/b> (as against the Indian corbelled arch), <b>pietra dura<\/b> (stone inlay), <b>jali<\/b> screens, <b>charbagh<\/b> garden, <b>chhatri<\/b>, <b>pishtaq<\/b> (arched portal), <b>iwan<\/b>"],["<b>Colonial<\/b>","Victoria Memorial &amp; Writers' Building (Kolkata), Gateway of India &amp; CST (Mumbai — <b>Indo-Saracenic/Gothic<\/b>), Rashtrapati Bhavan &amp; India Gate (New Delhi, by <b>Edwin Lutyens<\/b> and <b>Herbert Baker<\/b>)"],["<b>Temple cities / UNESCO<\/b>","Hampi, Pattadakal, Mahabalipuram, Khajuraho, Konark, Great Living Chola Temples, Ajanta, Ellora, Elephanta, Sanchi, Bodh Gaya, Qutub Minar, Humayun's tomb, Red Fort, Taj Mahal, Fatehpur Sikri, Rani ki Vav, Dholavira, Jaipur city, Ahmedabad city, Victorian &amp; Art Deco Mumbai, Santiniketan, Hoysala temples"]]},{"k":"trap","h":"The <b>Kailasa temple at Ellora is rock-cut<\/b> (carved out of a hill, top-down) — <b>Brihadeshwara<\/b> is built up from stone blocks. <b>Konark<\/b> is Nagara, not Dravida. The <b>Taj Mahal's architect<\/b> is <b>Ustad Ahmad Lahauri<\/b>, and it was built for <b>Mumtaz Mahal<\/b> (Arjumand Banu)."}],"sum":["Nagara (north): curved shikhara, no gopuram — Khajuraho, Konark, Lingaraja. Dravida (south): vimana + gopuram + tank — Brihadeshwara, Meenakshi, Mahabalipuram. Vesara (Deccan): Pattadakal, Halebid, Belur.","Ajanta = Buddhist only + paintings; Ellora = Buddhist + Hindu + Jain, with the rock-cut Kailasa temple (Krishna I); Elephanta = Shaivite Trimurti; Barabar = oldest rock-cut caves.","Sanchi stupa begun by Ashoka, gateways by Sungas/Satavahanas. Stupa parts: medhi, anda, harmika, yashti, chhatra, torana.","Indo-Islamic features: true arch and dome, pietra dura, jali, charbagh, chhatri. Humayun's tomb = first garden tomb; Itimad-ud-Daulah = first full marble.","New Delhi was designed by Edwin Lutyens and Herbert Baker."],"app":"artculture"},
{"id":"L35","g":"art","heat":3,"title":"UNESCO world heritage of India","hi":"भारत की यूनेस्को विश्व धरोहर","blocks":[{"k":"hot","h":"Asked every year, usually as <b>site ↔ state<\/b>, <b>which year<\/b>, <b>the first four<\/b> or <b>the only mixed site<\/b>, plus whichever site was added most recently. The intangible list (Garba, Durga Puja, Kumbh, Yoga) is asked just as often."},{"k":"story","h":"<p>UNESCO keeps a <b>World Heritage List<\/b> of places so valuable that they belong to all humanity. Each place is put in one of three boxes: <b>cultural<\/b> (made by people — temples, forts, cities), <b>natural<\/b> (forests, mountains, wildlife) or <b>mixed<\/b> (both at once).<\/p><p>As of the <b>2025<\/b> session, India has <b>44 sites<\/b>: <b>36 cultural, 7 natural and 1 mixed<\/b>. The story starts in <b>1983<\/b> with four: two cave sites in Maharashtra (<b>Ajanta, Ellora<\/b>) and two Mughal monuments in Agra (<b>Agra Fort, Taj Mahal<\/b>). The seven natural sites are easy to picture as a journey — rhinos and wild buffalo in <b>Assam<\/b> (Kaziranga, Manas), birds in <b>Rajasthan<\/b> (Keoladeo), tigers in the mangroves of <b>Bengal<\/b> (Sundarbans), the high <b>Himalaya<\/b> (Nanda Devi, Great Himalayan NP) and the long <b>Western Ghats<\/b>. The one mixed site is <b>Khangchendzonga<\/b> in Sikkim.<\/p><p>There is a second list for things you cannot touch — songs, dances, festivals and crafts. This is the <b>intangible cultural heritage<\/b> list. India has <b>15 elements<\/b> on it up to <b>Garba of Gujarat (2023)<\/b>. Anything added after the 2025 site session, or after 2023 on the intangible list, is not counted in this lesson.<\/p>"},{"k":"facts","title":"Key numbers and firsts","rows":[["Total sites (as of 2025)","<b>44<\/b> — 36 cultural, 7 natural, 1 mixed"],["First sites (1983)","<b>Ajanta, Ellora, Agra Fort, Taj Mahal<\/b>"],["Only mixed site","<b>Khangchendzonga National Park<\/b>, Sikkim (2016)"],["First Indian city","<b>Ahmedabad<\/b> (2017); Jaipur followed in 2019"],["First Harappan site in India","<b>Dholavira<\/b>, Gujarat (2021)"],["Temple named after its sculptor","<b>Ramappa<\/b> (Kakatiya Rudreshwara) temple, Telangana (2021)"],["First cultural site of the North-East","<b>Moidams<\/b> — Ahom mound burials at Charaideo, Assam (2024)"],["Latest (2025)","<b>Maratha Military Landscapes<\/b> — 12 forts: 11 in Maharashtra and <b>Gingee<\/b> in Tamil Nadu"],["India hosted the committee","46th World Heritage Committee session, <b>New Delhi, July 2024<\/b>"],["On currency notes","₹10 Konark wheel, ₹20 Ellora, ₹50 Hampi stone chariot, ₹100 <b>Rani ki Vav<\/b>, ₹200 Sanchi, ₹500 Red Fort"],["World Heritage Day","<b>18 April<\/b>"]]},{"k":"table","title":"India's 44 World Heritage Sites (as of 2025)","head":["Site","State","Year","Type"],"rows":[["<b>Ajanta Caves<\/b>","Maharashtra","1983","Cultural"],["<b>Ellora Caves<\/b>","Maharashtra","1983","Cultural"],["<b>Agra Fort<\/b>","Uttar Pradesh","1983","Cultural"],["<b>Taj Mahal<\/b>","Uttar Pradesh","1983","Cultural"],["Group of Monuments at <b>Mahabalipuram<\/b>","Tamil Nadu","1984","Cultural"],["<b>Sun Temple, Konark<\/b>","Odisha","1984","Cultural"],["<b>Kaziranga<\/b> National Park","Assam","1985","Natural"],["<b>Manas<\/b> Wildlife Sanctuary","Assam","1985","Natural"],["<b>Keoladeo<\/b> National Park (Bharatpur)","Rajasthan","1985","Natural"],["Churches and Convents of <b>Goa<\/b>","Goa","1986","Cultural"],["<b>Khajuraho<\/b> Group of Monuments","Madhya Pradesh","1986","Cultural"],["Group of Monuments at <b>Hampi<\/b>","Karnataka","1986","Cultural"],["<b>Fatehpur Sikri<\/b>","Uttar Pradesh","1986","Cultural"],["Group of Monuments at <b>Pattadakal<\/b>","Karnataka","1987","Cultural"],["<b>Elephanta Caves<\/b>","Maharashtra","1987","Cultural"],["<b>Great Living Chola Temples<\/b> (Thanjavur, Gangaikondacholapuram, Darasuram)","Tamil Nadu","1987 (extended 2004)","Cultural"],["<b>Sundarbans<\/b> National Park","West Bengal","1987","Natural"],["<b>Nanda Devi<\/b> and Valley of Flowers","Uttarakhand","1988 (extended 2005)","Natural"],["Buddhist Monuments at <b>Sanchi<\/b>","Madhya Pradesh","1989","Cultural"],["<b>Humayun's Tomb<\/b>","Delhi","1993","Cultural"],["<b>Qutb Minar<\/b> and its Monuments","Delhi","1993","Cultural"],["<b>Mountain Railways of India<\/b> (Darjeeling 1999, Nilgiri 2005, Kalka–Shimla 2008)","West Bengal, Tamil Nadu, Himachal Pradesh","1999","Cultural"],["<b>Mahabodhi<\/b> Temple Complex, Bodh Gaya","Bihar","2002","Cultural"],["Rock Shelters of <b>Bhimbetka<\/b>","Madhya Pradesh","2003","Cultural"],["<b>Champaner-Pavagadh<\/b> Archaeological Park","Gujarat","2004","Cultural"],["<b>Chhatrapati Shivaji Terminus<\/b>","Maharashtra","2004","Cultural"],["<b>Red Fort<\/b> Complex","Delhi","2007","Cultural"],["<b>Jantar Mantar<\/b>, Jaipur","Rajasthan","2010","Cultural"],["<b>Western Ghats<\/b>","Kerala, Karnataka, Tamil Nadu, Maharashtra","2012","Natural"],["<b>Hill Forts of Rajasthan<\/b> (Chittorgarh, Kumbhalgarh, Ranthambore, Gagron, Amber, Jaisalmer)","Rajasthan","2013","Cultural"],["<b>Rani ki Vav<\/b>, Patan","Gujarat","2014","Cultural"],["<b>Great Himalayan National Park<\/b>","Himachal Pradesh","2014","Natural"],["<b>Nalanda Mahavihara<\/b>","Bihar","2016","Cultural"],["<b>Khangchendzonga<\/b> National Park","Sikkim","2016","<b>Mixed<\/b>"],["<b>Capitol Complex<\/b>, Chandigarh (Le Corbusier)","Chandigarh","2016","Cultural"],["Historic City of <b>Ahmedabad<\/b>","Gujarat","2017","Cultural"],["<b>Victorian Gothic and Art Deco<\/b> Ensembles of Mumbai","Maharashtra","2018","Cultural"],["<b>Jaipur<\/b> City","Rajasthan","2019","Cultural"],["<b>Ramappa<\/b> (Kakatiya Rudreshwara) Temple","Telangana","2021","Cultural"],["<b>Dholavira<\/b>, a Harappan city","Gujarat","2021","Cultural"],["<b>Santiniketan<\/b>","West Bengal","2023","Cultural"],["Sacred Ensembles of the <b>Hoysalas<\/b> (Belur, Halebidu, Somanathapura)","Karnataka","2023","Cultural"],["<b>Moidams<\/b> of the Ahom dynasty, Charaideo","Assam","2024","Cultural"],["<b>Maratha Military Landscapes<\/b> of India","Maharashtra, Tamil Nadu","2025","Cultural"]]},{"k":"tl","title":"Intangible cultural heritage of India (15 elements, up to 2023)","rows":[["2008","<b>Koodiyattam<\/b> (Sanskrit theatre, Kerala), <b>Ramlila<\/b>, <b>Vedic chanting<\/b> — first proclaimed 2001–05, inscribed 2008"],["2009","<b>Ramman<\/b> — religious festival and ritual theatre of the Garhwal Himalayas, Uttarakhand"],["2010","<b>Mudiyettu<\/b> (ritual dance-drama, Kerala), <b>Kalbelia<\/b> (folk songs and dances, Rajasthan), <b>Chhau<\/b> (Odisha, Jharkhand, West Bengal)"],["2012","<b>Buddhist chanting of Ladakh<\/b>"],["2013","<b>Sankirtana<\/b> — ritual singing, drumming and dancing of Manipur"],["2014","Brass and copper utensil craft of the <b>Thatheras of Jandiala Guru<\/b>, Punjab"],["2016","<b>Navroz<\/b> (shared with other countries) and <b>Yoga<\/b>"],["2017","<b>Kumbh Mela<\/b>"],["2021","<b>Durga Puja in Kolkata<\/b>"],["2023","<b>Garba of Gujarat<\/b>"]]},{"k":"trick","h":"<b>First four (1983)<\/b>: <span class=\"mn\">A-E + A-T<\/span> — two caves (<b>A<\/b>janta, <b>E<\/b>llora) and two Agra monuments (<b>A<\/b>gra Fort, <b>T<\/b>aj).<br><b>Seven natural sites<\/b>: <span class=\"mn\">K-K-M-S-N-W-G<\/span> — 'Kind King Manas Saw Nanda's White Goat' = Kaziranga, Keoladeo, Manas, Sundarbans, Nanda Devi, Western Ghats, Great Himalayan NP. Everything else is cultural, except the one mixed site, Khangchendzonga."},{"k":"trick","h":"<b>Intangible years<\/b>: <span class=\"mn\">K-R-V = 2008<\/span> (Koodiyattam, Ramlila, Vedic chanting); <span class=\"mn\">M-K-C = 2010<\/span> (Mudiyettu, Kalbelia, Chhau). The rest come one or two at a time: Ramman 09, Ladakh 12, Sankirtana 13, Thatheras 14, Navroz and Yoga 16, Kumbh 17, Durga Puja 21, Garba 23."},{"k":"trap","h":"The only <b>mixed<\/b> site is <b>Khangchendzonga<\/b>, not Nanda Devi. <b>Keoladeo is in Rajasthan<\/b>, not Gujarat; <b>Ramappa is in Telangana<\/b>, not Andhra; <b>Rani ki Vav is in Gujarat<\/b>, not Rajasthan. <b>Matheran's railway is not part of the Mountain Railways site<\/b>. <b>Kumbh Mela and Yoga<\/b> are <i>intangible<\/i> heritage, not World Heritage Sites. <b>Ahmedabad<\/b> was the first Indian city, not Jaipur."}],"sum":["As of the 2025 session India has 44 World Heritage Sites: 36 cultural, 7 natural and 1 mixed.","The first four, in 1983, were Ajanta, Ellora, Agra Fort and the Taj Mahal; the only mixed site is Khangchendzonga in Sikkim (2016).","Natural sites: Kaziranga and Manas (Assam), Keoladeo (Rajasthan), Sundarbans (West Bengal), Nanda Devi and Valley of Flowers (Uttarakhand), Western Ghats and Great Himalayan NP (Himachal).","Recent sites: Ramappa and Dholavira 2021, Santiniketan and Hoysala temples 2023, Moidams of Assam 2024, Maratha Military Landscapes 2025.","Intangible heritage: Koodiyattam, Ramlila and Vedic chanting 2008; Ramman 2009; Mudiyettu, Kalbelia and Chhau 2010; Yoga 2016; Kumbh Mela 2017; Durga Puja 2021; Garba 2023."],"app":"artculture"},
{"id":"L28","g":"art","heat":2,"title":"Painting, crafts, theatre & puppetry","hi":"चित्रकला · शिल्प · रंगमंच","blocks":[{"k":"hot","h":"Asked as \"which painting style belongs to which state\" and \"which craft has a GI tag from where\". The folk-painting table below is the money table."},{"k":"story","h":"<p>Long before galleries existed, Indians painted on walls, cloth and paper to tell stories of gods and heroes and to mark festivals. Each region kept its own style, made with local materials. That is why exam questions ask which painting belongs to which state. This lesson also covers court painting, folk theatre, puppets and crafts, so do not read it as one long list. Sort it into four boxes.<\/p><p><b>Box 1: folk paintings, by region.<\/b> East: Madhubani (Bihar), Pattachitra (Odisha), Kalighat (Bengal). West: Warli (Maharashtra), Phad (Rajasthan). Centre: Gond (Madhya Pradesh). South: Kalamkari (Andhra Pradesh), Cheriyal (Telangana). Mountains: Thangka (Sikkim and Ladakh). <b>Box 2: court painting, by ruler.<\/b> The Mughal school began under Humayun, grew under Akbar and peaked under <b>Jahangir<\/b>. Rajasthani and Pahari schools grew in the courts of Rajasthan and the hills, and the Bengal School of Abanindranath Tagore brought a national style.<\/p><p><b>Box 3: theatre and puppets, by state<\/b>: Nautanki in Uttar Pradesh, Tamasha in Maharashtra, Yakshagana in Karnataka, Kathputli string puppets in Rajasthan. <b>Box 4: crafts and textiles, by town<\/b>: Banarasi silk, Chikankari from Lucknow, Patola from Patan. Learn one box at a time.<\/p>","key":"Sort this lesson into four boxes: folk paintings by region, court painting by ruler, theatre and puppets by state, and crafts by town."},{"k":"table","title":"Folk & tribal paintings","head":["Painting","State","Marks"],"rows":[["<b>Madhubani / Mithila<\/b>","Bihar","Done by women on walls and paper; no space left blank; natural dyes; Sita Devi, Mahasundari Devi"],["<b>Warli<\/b>","Maharashtra","White geometric figures (circle–triangle–square) on a mud-red ground; Jivya Soma Mashe"],["<b>Pattachitra<\/b>","Odisha &amp; West Bengal","Cloth scroll painting; Jagannath themes"],["<b>Kalamkari<\/b>","Andhra Pradesh","Pen (<i>kalam<\/i>) work on cloth; Srikalahasti &amp; Machilipatnam schools"],["<b>Phad<\/b>","Rajasthan","Long cloth scrolls of Pabuji &amp; Devnarayan"],["<b>Pithora<\/b>","Gujarat &amp; MP (Rathwa/Bhil)","Ritual horse figures on walls"],["<b>Gond<\/b>","Madhya Pradesh","Dots and dashes; Jangarh Singh Shyam"],["<b>Saura<\/b>","Odisha","Tribal wall art (<i>ikons<\/i>)"],["<b>Thangka<\/b>","Sikkim · Ladakh","Buddhist scroll paintings"],["<b>Cheriyal scroll<\/b>","Telangana","Narrative scrolls, bright red backgrounds"],["<b>Kalighat<\/b>","West Bengal","19th-century Kolkata watercolour style"],["<b>Aipan<\/b> / <b>Likhnu<\/b>","Uttarakhand / Himachal","Ritual floor and wall designs"],["<b>Manjusha<\/b>","Bihar (Bhagalpur)","\"Snake painting\"; Bihula-Bishahari story"],["<b>Bhil (Pithora/dot art)<\/b>","Madhya Pradesh","Dotted fill; Bhuri Bai"]]},{"k":"facts","title":"Court painting schools","rows":[["<b>Mughal school<\/b>","Began under <b>Humayun<\/b> (Mir Sayyid Ali, Abdus Samad), flowered under <b>Akbar<\/b>, <b>peaked under Jahangir<\/b> (Ustad Mansur — birds &amp; animals; Abul Hasan, Bishandas), declined under Aurangzeb"],["<b>Rajasthani / Rajput<\/b>","Sub-schools: <b>Mewar, Bundi, Kishangarh (Bani-Thani)<\/b>, Kota, Marwar, Amber-Jaipur"],["<b>Pahari<\/b>","<b>Basohli<\/b> (bold, Devi Mahatmya), <b>Kangra<\/b> (lyrical, Gita Govinda; under Sansar Chand), Guler, Chamba"],["<b>Deccani<\/b>","Ahmadnagar, Bijapur, Golconda"],["<b>Bengal School<\/b>","<b>Abanindranath Tagore<\/b> (\"Bharat Mata\"), Nandalal Bose (illustrated the Constitution), Asit Kumar Haldar"],["<b>Modern<\/b>","Raja Ravi Varma (oil, Kerala), Amrita Sher-Gil, Jamini Roy, M. F. Husain, Tyeb Mehta"]]},{"k":"facts","title":"Folk theatre & puppetry","rows":[["<b>Nautanki<\/b>","Uttar Pradesh"],["<b>Ramlila / Raslila<\/b>","Uttar Pradesh"],["<b>Tamasha<\/b>","Maharashtra"],["<b>Bhavai<\/b>","Gujarat &amp; Rajasthan"],["<b>Jatra<\/b>","West Bengal &amp; Odisha"],["<b>Bhaona / Ankia Nat<\/b>","Assam (Shankaradeva)"],["<b>Yakshagana<\/b>","Karnataka"],["<b>Therukoothu<\/b>","Tamil Nadu"],["<b>Burrakatha<\/b>","Andhra Pradesh"],["<b>Swang<\/b>","Haryana"],["<b>Khyal<\/b>","Rajasthan"],["<b>Maach<\/b>","Madhya Pradesh"],["<b>Dashavatar<\/b>","Goa &amp; Konkan"],["<b>Krishnattam / Koodiyattam<\/b>","Kerala (Koodiyattam is UNESCO-listed)"],["<b>Kathputli<\/b> — string puppets","Rajasthan"],["<b>Togalu Gombeyatta<\/b> — shadow puppets","Karnataka"],["<b>Tholu Bommalata<\/b> — shadow","Andhra Pradesh"],["<b>Putul Nautch<\/b> — rod puppets","West Bengal"],["<b>Pavakoothu<\/b> — glove puppets","Kerala"],["<b>Ravanachhaya<\/b> — shadow","Odisha"]]},{"k":"facts","title":"Crafts & textiles (common GI questions)","rows":[["Pashmina / Kani shawl","Jammu &amp; Kashmir"],["<b>Banarasi silk<\/b>","Uttar Pradesh"],["<b>Chikankari<\/b>","Lucknow, UP"],["<b>Bandhani<\/b>","Gujarat &amp; Rajasthan"],["<b>Patola<\/b>","Patan, Gujarat"],["<b>Pochampally Ikat<\/b>","Telangana"],["<b>Kanjeevaram silk<\/b>","Tamil Nadu"],["<b>Baluchari<\/b>","West Bengal"],["<b>Chanderi &amp; Maheshwari<\/b>","Madhya Pradesh"],["<b>Phulkari<\/b>","Punjab"],["<b>Kalamkari<\/b>","Andhra Pradesh"],["<b>Muga silk<\/b>","Assam"],["<b>Bidriware<\/b>","Bidar, Karnataka"],["<b>Dhokra<\/b> metal craft","Chhattisgarh &amp; West Bengal"],["<b>Blue pottery<\/b>","Jaipur, Rajasthan"],["<b>Channapatna toys<\/b>","Karnataka"],["<b>Zardozi<\/b>","Lucknow &amp; Bhopal"],["<b>Pattachitra<\/b>","Odisha"]]},{"k":"trick","h":"<span class='mn'>W flipped is M<\/span>: <b>Warli<\/b> = Maharashtra. <b>Thanda<\/b> (cold) Thangka = icy Sikkim &amp; Ladakh. <b>Gond<\/b> sits in the middle = Madhya Pradesh. <b>Kalam<\/b> (pen) writes Andhra's Kalamkari; next door, <b>Cheriyal<\/b> is Telangana's. <b>Patta<\/b> goes to Puri = Odisha. <b>Madhu<\/b> (honey) from Mithila = Bihar. <b>Phad<\/b> sings of Pabuji in the desert = Rajasthan."},{"k":"trap","h":"<b>Madhubani = Bihar<\/b>, <b>Warli = Maharashtra<\/b>, <b>Pattachitra = Odisha<\/b>, <b>Kalamkari = Andhra<\/b> — these four are the ones SSC rotates. Mughal painting <b>peaked under Jahangir<\/b> (not Shah Jahan or Akbar). <b>Yakshagana is folk theatre<\/b> from Karnataka, not a classical dance."}],"sum":["Madhubani–Bihar, Warli–Maharashtra, Pattachitra–Odisha/WB, Kalamkari–AP, Phad–Rajasthan, Gond–MP, Cheriyal–Telangana, Thangka–Sikkim/Ladakh, Manjusha–Bihar.","Mughal painting began under Humayun, flowered under Akbar, peaked under Jahangir (Ustad Mansur). Pahari: Basohli & Kangra. Rajasthani: Mewar, Bundi, Kishangarh (Bani-Thani).","Bengal School: Abanindranath Tagore (Bharat Mata), Nandalal Bose (illustrated the Constitution).","Theatre: Nautanki–UP, Tamasha–Maharashtra, Jatra–WB, Bhavai–Gujarat, Yakshagana–Karnataka, Bhaona–Assam, Swang–Haryana, Maach–MP, Koodiyattam–Kerala (UNESCO).","Puppets: Kathputli (string)–Rajasthan, Tholu Bommalata (shadow)–AP, Togalu Gombeyatta–Karnataka, Putul Nautch (rod)–WB, Pavakoothu (glove)–Kerala, Ravanachhaya–Odisha."],"app":"artculture"},
{"id":"L34","g":"art","heat":2,"title":"Literature, languages & scripts","hi":"साहित्य, भाषाएँ एवं लिपियाँ","blocks":[{"k":"hot","h":"SSC asks <b>book ↔ author<\/b> almost every shift, and since 2024 the <b>classical languages<\/b> count (now <b>11<\/b>) is a favourite. Add the <b>Eighth Schedule<\/b> number (<b>22<\/b>) and the <b>first Jnanpith<\/b>, and this lesson is pure recall marks."},{"k":"story","h":"<p>Think of Indian literature as <b>three shelves<\/b> in a library. The <b>top shelf is Sanskrit<\/b>. It begins with the grammarians — <b>Panini<\/b> wrote the rules, <b>Patanjali<\/b> explained them. Then come the playwrights: <b>Bhasa<\/b> (the oldest), <b>Shudraka<\/b>, <b>Kalidasa<\/b>, <b>Vishakhadatta<\/b> and <b>Bhavabhuti<\/b>. Next to them sit the long poems: <b>Bharavi<\/b> and <b>Magha<\/b> both took their stories from the Mahabharata. At the end are <b>Jayadeva<\/b>, the singer of Radha and Krishna, and <b>Kalhana<\/b>, the historian of Kashmir.<\/p><p>The <b>middle shelf is Persian and Urdu<\/b>. <b>Amir Khusrau<\/b> wrote for the Delhi Sultans, <b>Mirza Ghalib<\/b> for the last Mughal, and <b>Muhammad Iqbal<\/b> gave us <i>Saare Jahan Se Achha<\/i>.<\/p><p>The <b>bottom shelf is modern<\/b>: <b>Bankim Chandra<\/b> (Vande Mataram), <b>Tagore<\/b> (two national anthems — India's and Bangladesh's), <b>Premchand<\/b> (Godaan) and the Tamil poet <b>Subramania Bharati<\/b>. Beside the shelves is a box of <b>scripts<\/b>: <b>Brahmi<\/b>, the mother script, runs left to right; <b>Kharosthi<\/b> alone runs <b>right to left<\/b>. Finally, the government keeps two lists: the <b>Eighth Schedule<\/b> (22 languages) and the much shorter <b>classical languages<\/b> list (11).<\/p>"},{"k":"table","title":"Sanskrit authors and their works","head":["Author","Work","Remember it by"],"rows":[["<b>Bhasa<\/b>","<i>Swapnavasavadatta<\/i>, <i>Pratijnayaugandharayana<\/i>","The oldest known playwright; his 13 plays were found in Kerala by T. Ganapati Shastri in 1912"],["<b>Shudraka<\/b>","<i>Mrichchhakatika<\/i> (The Little Clay Cart)","Love of the poor Brahmin <b>Charudatta<\/b> and the courtesan <b>Vasantasena<\/b>"],["<b>Kalidasa<\/b> (recap)","Plays: <i>Abhijnanashakuntalam<\/i>, <i>Malavikagnimitram<\/i>, <i>Vikramorvashiyam<\/i>; poems: <i>Meghaduta<\/i>, <i>Raghuvamsha<\/i>, <i>Kumarasambhava<\/i>, <i>Ritusamhara<\/i>","Linked by tradition to Chandragupta II's court"],["<b>Bharavi<\/b>","<i>Kiratarjuniya<\/i>","Arjuna fights Shiva, who comes as a <i>kirata<\/i> (hunter)"],["<b>Magha<\/b>","<i>Shishupalavadha<\/i>","Krishna kills Shishupala"],["<b>Sriharsha<\/b>","<i>Naishadhiyacharita<\/i>","Story of Nala and Damayanti"],["<b>Dandin<\/b>","<i>Dashakumaracharita<\/i>, <i>Kavyadarsha<\/i>","Prose tales of ten princes"],["<b>Bhavabhuti<\/b>","<i>Uttararamacharita<\/i>, <i>Malatimadhava<\/i>, <i>Mahaviracharita<\/i>","Court of <b>Yashovarman of Kannauj<\/b>"],["<b>Vishakhadatta<\/b>","<i>Mudrarakshasa<\/i>, <i>Devichandraguptam<\/i>","Chanakya's plots for Chandragupta Maurya"],["<b>Harshavardhana<\/b>","<i>Ratnavali<\/i>, <i>Priyadarshika<\/i>, <i>Nagananda<\/i>","A king who was also a playwright"],["<b>Banabhatta<\/b>","<i>Harshacharita<\/i>, <i>Kadambari<\/i>","Harsha's court poet"],["<b>Jayadeva<\/b>","<i>Gita Govinda<\/i>","Court of <b>Lakshmana Sena<\/b> of Bengal, 12th century"],["<b>Kalhana<\/b>","<i>Rajatarangini<\/i> (1148–49 CE)","History of Kashmir in eight books (<i>tarangas<\/i>)"],["<b>Bilhana<\/b>","<i>Vikramankadevacharita<\/i>","Life of the Chalukya king Vikramaditya VI"]]},{"k":"facts","title":"Grammar, and the Persian–Urdu shelf","rows":[["<b>Panini<\/b>","<i>Ashtadhyayi<\/i> — the oldest surviving Sanskrit grammar"],["<b>Katyayana<\/b>","<i>Vartika<\/i> — notes on Panini"],["<b>Patanjali<\/b>","<i>Mahabhashya<\/i> — the 'great commentary' on Panini; the grammar trio is Panini–Katyayana–Patanjali"],["<b>Amir Khusrau<\/b>","'Tuti-i-Hind'; disciple of Nizamuddin Auliya; <i>Khazain-ul-Futuh<\/i> (Alauddin Khalji's conquests), <i>Nuh Sipihr<\/i>, <i>Qiran-us-Sadain<\/i>; wrote in Persian and Hindavi"],["<b>Mirza Ghalib<\/b> (1797–1869)","Great Urdu and Persian poet in the time of <b>Bahadur Shah Zafar<\/b>; <i>Dastanbuy<\/i> is his diary of 1857 in Delhi"],["<b>Muhammad Iqbal<\/b>","<i>Saare Jahan Se Achha<\/i> (Tarana-e-Hind, 1904); <i>Asrar-i-Khudi<\/i>; Rakesh Sharma quoted the line from space in 1984"]]},{"k":"facts","title":"Modern writers","rows":[["<b>Bankim Chandra Chattopadhyay<\/b>","<i>Durgeshnandini<\/i> (1865), <i>Kapalkundala<\/i>, <i>Anandamath<\/i> (1882) — which carries <b>Vande Mataram<\/b>, the national song"],["<b>Rabindranath Tagore<\/b>","Wrote <b>Jana Gana Mana<\/b> (first sung at the Calcutta Congress, <b>27 Dec 1911<\/b>; adopted <b>24 Jan 1950<\/b>) and <b>Amar Shonar Bangla<\/b> (1905, now Bangladesh's anthem)"],["<b>Premchand<\/b>","Real name <b>Dhanpat Rai Srivastava<\/b>; 'Upanyas Samrat'; novels <i>Godaan<\/i> (1936), <i>Gaban<\/i>, <i>Nirmala<\/i>, <i>Rangbhoomi<\/i>; stories <i>Kafan<\/i>, <i>Idgah<\/i>; early Urdu collection <i>Soz-e-Watan<\/i> was seized by the British"],["<b>Subramania Bharati<\/b>","Tamil 'Mahakavi'; <i>Panchali Sabatham<\/i>, <i>Kuyil Pattu<\/i>, <i>Kannan Pattu<\/i>"],["<b>Bharatendu Harishchandra<\/b>","Father of modern Hindi literature"],["<b>Jaishankar Prasad<\/b> / <b>Maithili Sharan Gupt<\/b>","<i>Kamayani<\/i> / <i>Bharat-Bharati<\/i> (Gupt is called 'Rashtrakavi')"]]},{"k":"table","title":"Scripts","head":["Script","Direction · region","Note"],"rows":[["<b>Indus script<\/b>","Harappan seals","Still <b>undeciphered<\/b>"],["<b>Brahmi<\/b>","<b>Left to right<\/b>; all over India","Mother of most Indian scripts; most Ashokan edicts; read by James Prinsep, 1837"],["<b>Kharosthi<\/b>","<b>Right to left<\/b>; north-west (Gandhara)","Grew from Aramaic; used in Ashoka's Shahbazgarhi and Mansehra edicts"],["<b>Sharada<\/b>","Left to right; <b>Kashmir<\/b>","Grew out of Gupta-period Brahmi; used for Kashmiri and Sanskrit"],["<b>Grantha<\/b>","Left to right; <b>Tamil country<\/b>","Used to write <b>Sanskrit<\/b> in the south; the Malayalam script grew from it"],["<b>Devanagari<\/b>","Left to right; north and west India","Hindi, Sanskrit, Marathi, Nepali, Konkani; Article 343 — Hindi in Devanagari is the Union's official language"],["<b>Ol Chiki<\/b>","Left to right; east India","Script for <b>Santhali<\/b>, created by Raghunath Murmu (1925)"]]},{"k":"tl","title":"Languages and awards — the dates","rows":[["1950","Eighth Schedule begins with <b>14<\/b> languages"],["1954","<b>Sahitya Akademi<\/b> set up (12 March)"],["1965","First <b>Jnanpith Award<\/b> — <b>G. Sankara Kurup<\/b> (Malayalam) for <i>Odakkuzhal<\/i>"],["1967","<b>Sindhi<\/b> added (21st Amendment) → 15"],["1992","<b>Konkani, Manipuri, Nepali<\/b> added (71st Amendment) → 18"],["2003","<b>Bodo, Dogri, Maithili, Santhali<\/b> added (92nd Amendment) → <b>22<\/b>"],["2004","<b>Tamil<\/b> — the first classical language"],["2005","<b>Sanskrit<\/b>"],["2008","<b>Telugu<\/b> and <b>Kannada<\/b>"],["2013","<b>Malayalam<\/b>"],["2014","<b>Odia<\/b> — the sixth"],["Oct 2024","<b>Marathi, Pali, Prakrit, Assamese, Bengali<\/b> — total <b>11<\/b>"]]},{"k":"trick","h":"<b>Classical languages in order<\/b>: <span class=\"mn\">T-S-TK-M-O<\/span> — 'Tea, Sugar, Two Kettles, More Oranges' = Tamil 2004, Sanskrit 2005, Telugu + Kannada 2008, Malayalam 2013, Odia 2014. The 2024 five: <span class=\"mn\">MAP-PB<\/span> — Marathi, Assamese, Pali, Prakrit, Bengali.<br><b>92nd Amendment four<\/b>: <span class=\"mn\">B-D-M-S<\/span> — 'Big Dogs Make Sounds' = Bodo, Dogri, Maithili, Santhali."},{"k":"trick","h":"<b>Mahabharata poems<\/b>: <b>Bha<\/b>ravi → Arjuna (<b>Bha<\/b>rat's hero); <b>Ma<\/b>gha → <b>Ma<\/b>dhava (Krishna) kills Shishupala.<br><b>Ra<\/b>ma plays go to <b>Bha<\/b>vabhuti — <span class=\"mn\">Uttara-RAMA = BhavabhUti<\/span>."},{"k":"trap","h":"<b>Swapnavasavadatta = Bhasa<\/b>, <b>Mrichchhakatika = Shudraka<\/b> — SSC swaps them. <b>Kiratarjuniya (Bharavi)<\/b> and <b>Shishupalavadha (Magha)<\/b> are both Mahabharata epics — don't flip them. <b>Saare Jahan Se Achha is Iqbal<\/b>, not Ghalib. <b>22 languages<\/b> are in the Eighth Schedule, but only <b>11 are classical<\/b>; <b>Odia (2014)<\/b> was already classical before the 2024 batch. <b>Kharosthi<\/b> is the one script that runs right to left."}],"sum":["Bhasa wrote Swapnavasavadatta; Shudraka wrote Mrichchhakatika; Bharavi wrote Kiratarjuniya; Magha wrote Shishupalavadha; Dandin wrote Dashakumaracharita; Bhavabhuti wrote Uttararamacharita.","Panini wrote the Ashtadhyayi and Patanjali the Mahabhashya; Jayadeva wrote the Gita Govinda and Kalhana the Rajatarangini.","Amir Khusrau served the Delhi Sultans, Ghalib lived under Bahadur Shah Zafar, and Iqbal wrote Saare Jahan Se Achha; Tagore wrote both Jana Gana Mana and Amar Shonar Bangla.","Brahmi runs left to right and Kharosthi right to left; Sharada belongs to Kashmir and Grantha was used for Sanskrit in the Tamil country.","The Eighth Schedule has 22 languages (Bodo, Dogri, Maithili, Santhali added in 2003); there are 11 classical languages, Tamil first in 2004; the first Jnanpith went to G. Sankara Kurup in 1965."],"app":"artculture"},
{"id":"L36","g":"wld","heat":1,"title":"The ancient world to the Age of Discovery","hi":"प्राचीन विश्व से खोज-यात्राओं के युग तक","blocks":[{"k":"hot","h":"An occasional one-mark question: <b>which river ↔ which civilisation<\/b>, <b>Alexander and Porus<\/b>, <b>Magna Carta 1215<\/b>, <b>Martin Luther 1517<\/b> or <b>who discovered what<\/b>. Learn the dates in the timeline and you are covered."},{"k":"story","h":"<p>The first cities grew up beside big rivers, because rivers gave water, fertile mud and an easy road for trade. In <b>Mesopotamia<\/b> ('land between the rivers' — the Tigris and Euphrates, today's Iraq) people pressed wedge-shaped <b>cuneiform<\/b> marks into clay, and King <b>Hammurabi<\/b> of Babylon carved one of the first written law codes. <b>Egypt<\/b> grew along the <b>Nile<\/b>, wrote in picture-signs called <b>hieroglyphics<\/b> and built the <b>pyramids<\/b>. China began on the <b>Huang He<\/b>, and India on the <b>Indus<\/b>.<\/p><p>Next came <b>Greece<\/b>, a land of small city-states. Athens tried <b>democracy<\/b>, and three teachers followed one another: <b>Socrates → Plato → Aristotle<\/b>. Aristotle taught <b>Alexander<\/b>, who reached India in <b>326 BCE<\/b> and fought <b>Porus<\/b> on the Jhelum. Then <b>Rome<\/b> rose: <b>Julius Caesar<\/b> was a general, and <b>Augustus<\/b> became the first emperor.<\/p><p>Jump to Europe after 1200: <b>Magna Carta (1215)<\/b> limited the king; Constantinople fell to the Turks (<b>1453<\/b>); the <b>Renaissance<\/b> and the printing press spread new ideas; <b>Luther<\/b> challenged the Church (<b>1517<\/b>); and sailors went looking for a sea route to India — <b>Columbus<\/b> found America instead (1492), <b>Vasco da Gama<\/b> reached Calicut (1498).<\/p>"},{"k":"table","title":"River-valley civilisations","head":["Civilisation","River","Writing","Famous for"],"rows":[["<b>Mesopotamia<\/b> (Sumer, Babylon) — Iraq","<b>Tigris and Euphrates<\/b>","<b>Cuneiform<\/b> (wedge marks on clay)","<b>Code of

  {k:"trap", h:"<b>Brahmo Samaj = 1828 Ram Mohan Roy; Arya Samaj = 1875 Dayanand Saraswati</b> — the most-swapped pair in the paper. The <b>Theosophical Society was founded in New York</b> (1875), with its Indian HQ at Adyar from 1882. <b>Annie Besant was the first woman Congress President (1917)</b>; <b>Sarojini Naidu was the first Indian woman</b> President (1925, Kanpur)."}
], sum:[
  "Brahmo Samaj 1828 (Ram Mohan Roy); Prarthana Samaj 1867 (Atmaram Pandurang, Ranade); Arya Samaj 1875 (Dayanand Saraswati, 'Back to the Vedas', Satyarth Prakash).",
  "Theosophical Society 1875 New York, Adyar HQ 1882, later Annie Besant. Ramakrishna Mission 1897 at Belur (Vivekananda; Chicago speech 1893).",
  "Satyashodhak Samaj 1873 (Jyotiba Phule, Gulamgiri); SNDP 1903 (Sree Narayana Guru); Self-Respect Movement 1925 (Periyar); Bahishkrit Hitkarini Sabha 1924 (Ambedkar).",
  "Ram Mohan Roy = sati abolished 1829; Vidyasagar = Widow Remarriage Act 1856; Malabari = Age of Consent Act 1891; Sarda Act 1929.",
  "Annie Besant = first woman Congress President (1917); Sarojini Naidu = first Indian woman President (1925)."
]},

{id:"L22", g:"mod", heat:3, title:"Congress, Moderates & Extremists", hi:"कांग्रेस · नरमपंथी एवं गरमपंथी", blocks:[
  {k:"hot", h:"Guaranteed: the 1885 founding details, the Surat split, the Partition of Bengal and Swadeshi, Lucknow Pact, Home Rule League — with years and presidents."},
  {k:"facts", title:"The founding of the Congress", rows:[
    ["Founded","<b>28 December 1885</b> at <b>Gokuldas Tejpal Sanskrit College, Bombay</b>"],
    ["Founder","<b>Allan Octavian Hume</b>, a retired British civil servant; Sir William Wedderburn and Dadabhai Naoroji helped him"],
    ["First President","<b>W. C. Bonnerjee</b> (Womesh Chandra Banerjee); 72 delegates"],
    ["Viceroy then","<b>Lord Dufferin</b>"],
    ["Earlier bodies","Bangabhasha Prakashika Sabha (1836), Landholders' Society (1838), British India Society (1839), <b>British Indian Association (1851)</b>, <b>East India Association (1866, Dadabhai Naoroji, London)</b>, <b>Indian Association (1876, Surendranath Banerjee &amp; Anand Mohan Bose)</b>, Madras Mahajan Sabha (1884), Bombay Presidency Association (1885)"],
    ["\"Safety valve\" theory","Lala Lajpat Rai's reading of Hume's intent, from Hume's own papers (W. Wedderburn's biography)"]
  ]},
  {k:"table", title:"Moderates vs Extremists", head:["Point","Moderates (1885–1905)","Extremists (1905–1919)"], rows:[
    ["Leaders","<b>Dadabhai Naoroji</b>, <b>G. K. Gokhale</b>, Surendranath Banerjee, Pherozeshah Mehta, W. C. Bonnerjee, Badruddin Tyabji, R. C. Dutt","<b>Lal-Bal-Pal</b> — <b>Lala Lajpat Rai</b>, <b>Bal Gangadhar Tilak</b>, <b>Bipin Chandra Pal</b>; also Aurobindo Ghosh"],
    ["Method","Petitions, prayers, resolutions — \"<b>political mendicancy</b>\" (Tilak's jibe)","Swadeshi, boycott, passive resistance, national education"],
    ["Goal","Reform within the empire","<b>Swaraj</b> — \"<b>Swaraj is my birthright and I shall have it</b>\" (Tilak)"],
    ["Key ideas","Naoroji's <b>Drain Theory</b> (<i>Poverty and Un-British Rule in India</i>); Gokhale was Gandhi's \"political guru\"","Tilak: <i>Kesari</i> (Marathi) &amp; <i>Maratha</i> (English); started <b>Ganapati (1893)</b> and <b>Shivaji (1895)</b> festivals; <b>first to demand Swaraj</b>"]
  ]},
  {k:"tl", title:"1905–1916, the decisive decade", rows:[
    ["<b>1905</b>","<b>Partition of Bengal</b> announced by <b>Curzon</b> (16 Oct 1905 = the day it took effect, observed as a day of mourning); <b>Swadeshi &amp; Boycott movement</b> begins — the first mass movement"],
    ["<b>1906</b>","<b>Muslim League</b> founded at <b>Dhaka</b> by Nawab Salimullah &amp; Aga Khan; Congress (Dadabhai Naoroji, Calcutta) adopts <b>Swaraj</b> as the goal"],
    ["<b>1907</b>","<b>Surat Split</b> — Congress divides into Moderates and Extremists; president Rash Behari Ghosh"],
    ["<b>1909</b>","<b>Morley-Minto Reforms</b> — <b>separate electorates</b> for Muslims"],
    ["<b>1911</b>","Partition of Bengal <b>annulled</b>; capital moved to Delhi"],
    ["<b>1915–16</b>","Tilak and Annie Besant start the <b>Home Rule Leagues</b> (Tilak: April 1916, Pune; Besant: September 1916, Madras)"],
    ["<b>1916</b>","<b>Lucknow Pact</b> — Congress and Muslim League come together, and the Moderates and Extremists reunite; president <b>Ambica Charan Majumdar</b>"],
    ["<b>1917</b>","<b>Annie Besant</b> becomes the first woman Congress President; <b>Champaran</b> satyagraha; <b>Montagu Declaration (August Declaration)</b> promises responsible government"]
  ]},
  {k:"trick", h:"<b>Lal-Bal-Pal</b> gives you all three Extremists at once: <b>Lal</b>a Lajpat Rai (Punjab), <b>Bal</b> Gangadhar Tilak (Maharashtra), <b>Pal</b> = Bipin Chandra Pal (Bengal) — one from each region.<br><b>1905-06-07</b> is a run: <b>Partition → Muslim League → Surat Split</b>."},
  {k:"facts", title:"Presidents you must know", rows:[
    ["First President","<b>W. C. Bonnerjee</b> (1885)"],
    ["First Muslim President","<b>Badruddin Tyabji</b> (1887, Madras)"],
    ["First English President","George Yule (1888)"],
    ["Only President three times","<b>Dadabhai Naoroji</b> (1886, 1893, 1906) — \"<b>Grand Old Man of India</b>\", also the first Indian in the British Parliament"],
    ["First woman President","<b>Annie Besant</b> (1917, Calcutta)"],
    ["First Indian woman President","<b>Sarojini Naidu</b> (1925, Kanpur) — the \"Nightingale of India\""],
    ["President at Lahore (1929, Purna Swaraj)","<b>Jawaharlal Nehru</b>"],
    ["President at Karachi (1931, Fundamental Rights resolution)","<b>Sardar Vallabhbhai Patel</b>"],
    ["President at Haripura (1938) &amp; Tripuri (1939)","<b>Subhas Chandra Bose</b> — resigned in 1939 after beating Gandhi's candidate Pattabhi Sitaramayya, and founded the <b>Forward Bloc</b>"],
    ["President at the time of Independence","<b>J. B. Kripalani</b> (1947)"],
    ["Youngest &amp; longest-serving President","<b>Maulana Abul Kalam Azad</b> — youngest ever at 35 (1923, Delhi special session) and President right through 1940–46, the longest stretch"]
  ]},
  {k:"trap", h:"The Partition of Bengal was <b>announced in 1905 and annulled in 1911</b>; Curzon ordered it, Hardinge II annulled it. The <b>Surat Split was 1907</b> and the <b>reunion was 1916 at Lucknow</b>. Dadabhai Naoroji was president <b>three</b> times — nobody else in the early period."}
], sum:[
  "Congress founded 28 Dec 1885 at Gokuldas Tejpal Sanskrit College, Bombay, by A. O. Hume; first President W. C. Bonnerjee; Viceroy Dufferin.",
  "Moderates: Naoroji (Drain Theory), Gokhale, Surendranath Banerjee. Extremists: Lal-Bal-Pal; Tilak's papers Kesari and Maratha; 'Swaraj is my birthright'.",
  "1905 Partition of Bengal (Curzon) → Swadeshi; 1906 Muslim League at Dhaka; 1907 Surat Split; 1909 separate electorates; 1911 partition annulled; 1916 Home Rule Leagues + Lucknow Pact.",
  "Presidents: first W. C. Bonnerjee; first Muslim Badruddin Tyabji (1887); thrice Dadabhai Naoroji; first woman Annie Besant (1917); first Indian woman Sarojini Naidu (1925).",
  "Lahore 1929 (Purna Swaraj) — Nehru. Karachi 1931 (Fundamental Rights) — Sardar Patel. Haripura 1938 & Tripuri 1939 — Subhas Chandra Bose, who then founded the Forward Bloc."
]},

{id:"L23", g:"mod", heat:3, title:"Gandhian era — 1917 to 1934", hi:"गांधी युग", blocks:[
  {k:"hot", h:"The most asked single stretch in all of History. Fix the <b>four movements in order with their years</b>, why each ended, and the three Round Table Conferences."},
  {k:"tl", title:"Gandhi's movements in order", rows:[
    ["1893–1914","South Africa — first satyagraha at <b>Johannesburg (1906)</b> against the Asiatic Registration Act; founded <b>Phoenix Settlement</b> &amp; <b>Tolstoy Farm</b>; paper <i>Indian Opinion</i>"],
    ["<b>1915</b>","Returns to India (9 Jan — now <b>Pravasi Bharatiya Divas</b>); founds the <b>Sabarmati/Satyagraha Ashram</b> (Kochrab 1915, Sabarmati 1917)"],
    ["<b>1917</b>","<b>Champaran Satyagraha</b> (Bihar) — against the <b>tinkathia</b> indigo system; his <b>first satyagraha in India</b>; invited by Rajkumar Shukla"],
    ["<b>1918</b>","<b>Ahmedabad Mill Strike</b> — his first <b>hunger strike</b>; <b>Kheda Satyagraha</b> (Gujarat) — his first <b>non-cooperation</b>, for revenue remission in a famine; Sardar Patel joined here"],
    ["<b>1919</b>","<b>Rowlatt Act</b> (\"no vakil, no dalil, no appeal\") → first all-India <b>hartal, 6 April</b>; <b>Jallianwala Bagh, 13 April 1919</b> (Gen. <b>Dyer</b>; Punjab Lt-Gov <b>O'Dwyer</b>); <b>Hunter Commission</b>; Tagore returned his knighthood; <b>Khilafat</b> movement starts"],
    ["<b>1920–22</b>","<b>Non-Cooperation Movement</b> — approved at the <b>Nagpur session (Dec 1920)</b>; surrender of titles, boycott of councils, schools, courts and foreign cloth; withdrawn after <b>Chauri Chaura (5 Feb 1922, Gorakhpur)</b>"],
    ["<b>1923–27</b>","<b>Swaraj Party</b> (C. R. Das &amp; Motilal Nehru, 1923); <b>Simon Commission (1927/28)</b> — \"<b>Go back Simon</b>\", all-white, no Indian member; <b>Lala Lajpat Rai injured at Lahore (Oct 1928)</b> and died"],
    ["<b>1928</b>","<b>Nehru Report</b> (Motilal Nehru) — dominion status; <b>Bardoli Satyagraha</b> — Vallabhbhai Patel wins the title <b>Sardar</b> from the women of Bardoli"],
    ["<b>1929</b>","<b>Lahore session</b>, Nehru presiding — <b>Purna Swaraj</b>; the tricolour hoisted on the Ravi on <b>31 Dec 1929</b>; <b>26 January 1930</b> observed as the first <b>Independence Day</b>"],
    ["<b>1930–34</b>","<b>Civil Disobedience</b> — <b>Dandi March, 12 March to 6 April 1930</b>, 385 km from Sabarmati to Dandi with <b>78 followers</b>; salt law broken 6 April; <b>Gandhi-Irwin Pact, 5 March 1931</b> suspended it; relaunched after the 2nd RTC; finally withdrawn <b>1934</b>"],
    ["<b>1932</b>","<b>Communal Award</b> (Ramsay MacDonald) gave separate electorates to the Depressed Classes → Gandhi's fast → <b>Poona Pact, 24 Sept 1932</b> (Gandhi–Ambedkar): reserved seats instead of separate electorates"]
  ]},
  {k:"trick", h:"<b>Gandhi's first three</b> — <span class=\"mn\">Cham-Khe-Ahm</span> in <span class=\"mn\">17-18-18</span>: <b>Cham</b>paran (indigo, Bihar), <b>Khe</b>da (revenue, Gujarat), <b>Ahm</b>edabad (mill wages). First satyagraha = Champaran; first hunger strike = Ahmedabad.<br><b>Why movements ended</b>: Non-Cooperation → <b>Chauri Chaura</b>; Civil Disobedience → <b>Gandhi-Irwin Pact</b>; Quit India → arrests."},
  {k:"table", title:"Three Round Table Conferences (London)", head:["RTC","Date","Congress","Note"], rows:[
    ["First","Nov 1930 – Jan 1931","<b>Boycotted</b>","Ambedkar and the Princes attended"],
    ["Second","Sept – Dec 1931","<b>Gandhi attended</b> — the only one","As the sole Congress representative, after the Gandhi-Irwin Pact; deadlocked on minorities"],
    ["Third","Nov – Dec 1932","Boycotted","Led to the White Paper and the <b>Act of 1935</b>"]
  ]},
  {k:"facts", title:"Gandhi — names, papers, ideas", rows:[
    ["Full name","Mohandas Karamchand Gandhi; born <b>2 Oct 1869, Porbandar</b>; died <b>30 Jan 1948</b> (Nathuram Godse)"],
    ["Titles","\"<b>Mahatma</b>\" from <b>Rabindranath Tagore</b>; \"<b>Father of the Nation</b>\" from <b>Subhas Chandra Bose</b>; \"<b>half-naked fakir</b>\" from Churchill"],
    ["Papers","<b><i>Young India</i></b> (English), <b><i>Harijan</i></b>, <i>Navajivan</i> (Gujarati), <i>Indian Opinion</i> (South Africa)"],
    ["Books","<b><i>My Experiments with Truth</i></b> (autobiography), <i>Hind Swaraj</i> (1909)"],
    ["Political guru","<b>Gopal Krishna Gokhale</b>"],
    ["First Congress session he presided","<b>Belgaum, 1924</b> — the only one"],
    ["Ashrams","Phoenix &amp; Tolstoy Farm (South Africa), Kochrab &amp; Sabarmati (Ahmedabad), <b>Sevagram/Wardha</b> (1936)"]
  ]},
  {k:"trap", h:"The Dandi March began <b>12 March 1930</b> and the salt law was broken on <b>6 April 1930</b> — two different dates. Gandhi attended <b>only the Second</b> Round Table Conference. He presided over <b>only one</b> Congress session, at <b>Belgaum in 1924</b>. The <b>Nagpur session (1920)</b> approved Non-Cooperation; the <b>Calcutta special session (Sept 1920)</b> first adopted it."}
], sum:[
  "Champaran 1917 (indigo, first satyagraha in India) → Ahmedabad mill strike & Kheda 1918 → Rowlatt + Jallianwala Bagh 13 April 1919.",
  "Non-Cooperation 1920–22, approved at Nagpur, withdrawn after Chauri Chaura (5 Feb 1922). Swaraj Party 1923 (C. R. Das & Motilal Nehru).",
  "Simon Commission 1928 ('Go back Simon'); Nehru Report & Bardoli 1928; Lahore session 1929 — Purna Swaraj, 26 Jan 1930 first Independence Day.",
  "Dandi March 12 March – 6 April 1930, 385 km, 78 followers. Gandhi-Irwin Pact 5 March 1931. Communal Award 1932 → Poona Pact 24 Sept 1932.",
  "Gandhi attended only the Second RTC and presided over only one Congress session (Belgaum, 1924). 'Mahatma' from Tagore; 'Father of the Nation' from Subhas Chandra Bose."
]},

{id:"L24", g:"mod", heat:3, title:"Revolutionaries, INA & Independence", hi:"क्रांतिकारी · आज़ाद हिंद फौज · स्वतंत्रता", blocks:[

  {k:"facts", title:"Subhas Chandra Bose & the INA", rows:[

  "Kakori 1925 — Bismil, Ashfaqullah, Roshan Singh, Rajendra Lahiri hanged. HSRA 1928. Saunders killed Dec 1928; Assembly bomb 8 April 1929; Bhagat Singh, Sukhdev, Rajguru hanged 23 March 1931. Azad died at Alfred Park, 27 Feb 1931.",

{id:"L25", g:"mod", heat:2, title:"Constitutional development & economic policy", hi:"संवैधानिक विकास · आर्थिक नीति", blocks:[
  {k:"hot", h:"The Acts from 1773 to 1947 — \"which Act introduced X\" is a standing question. Add the three land revenue settlements and the Drain Theory."},
  {k:"table", title:"Acts 1773–1947 — one feature each", head:["Act","Year","The one thing it introduced"], rows:[
    ["<b>Regulating Act</b>","1773","First British interference; <b>Governor-General of Bengal</b> (Warren Hastings); Supreme Court at Calcutta (1774)"],
    ["Pitt's India Act","1784","<b>Board of Control</b> — dual government of the Company and the Crown"],
    ["Charter Act","1793","Company's monopoly extended 20 years; Governor-General given power over the presidencies"],
    ["<b>Charter Act</b>","1813","Ended the Company's monopoly except in tea &amp; China; <b>₹1 lakh for education</b>; allowed missionaries"],
    ["<b>Charter Act</b>","1833","<b>Governor-General of India</b> (Bentinck); Company becomes a purely administrative body; <b>Law Member (Macaulay)</b> added; Law Commission"],
    ["<b>Charter Act</b>","1853","First to separate legislative and executive functions; introduced <b>open competition</b> for the civil services (Macaulay Committee)"],
    ["<b>Government of India Act</b>","<b>1858</b>","Crown rule; <b>Secretary of State for India</b>; Viceroy; \"Act for the Good Government of India\""],
    ["<b>Indian Councils Act</b>","1861","<b>Portfolio system</b>; Indians nominated to the legislative council for the first time; ordinance power"],
    ["Indian Councils Act","1892","Indirect <b>elections</b> introduced (nomination by recommendation); budget discussion allowed"],
    ["<b>Morley-Minto / Indian Councils Act</b>","<b>1909</b>","<b>Separate electorates</b> for Muslims; <b>Satyendra Prasad Sinha</b> became the first Indian in the Viceroy's Executive Council"],
    ["<b>Montagu-Chelmsford / GoI Act</b>","<b>1919</b>","<b>Dyarchy</b> in the provinces (transferred and reserved subjects); <b>bicameral</b> central legislature; separation of central and provincial budgets; a <b>Public Service Commission (1926)</b>; franchise widened"],
    ["<b>Government of India Act</b>","<b>1935</b>","<b>Provincial autonomy</b> (dyarchy ended in provinces, introduced at the centre); <b>All-India Federation</b> proposed; <b>RBI</b>; <b>Federal Court (1937)</b>; separate electorates extended; Burma separated; the <b>main source of our Constitution</b>"],
    ["Indian Independence Act","1947","Two dominions; the Constituent Assembly made fully sovereign; the office of Secretary of State abolished"]
  ]},
  {k:"trick", h:"<b>Three \"first\" Acts</b> — <span class=\"mn\">1773 Bengal, 1833 India, 1858 Crown</span>: first Governor-General <i>of Bengal</i> (1773), first Governor-General <i>of India</i> (1833), first <i>Crown</i> rule (1858).<br><b>Dyarchy</b>: introduced in the <b>provinces by 1919</b>, moved to the <b>centre by 1935</b> — it travels upward."},
  {k:"table", title:"Land revenue settlements", head:["System","Who · Year","Where","How it worked"], rows:[
    ["<b>Permanent Settlement / Zamindari</b>","<b>Cornwallis, 1793</b> (idea: John Shore)","Bengal, Bihar, Odisha, Varanasi, north Madras — <b>~19%</b> of British India","Zamindar fixed as owner, revenue fixed forever at 10/11 to the state; peasants became tenants"],
    ["<b>Ryotwari</b>","<b>Thomas Munro &amp; Capt. Read, 1820</b>","Madras, Bombay, Assam, Coorg — <b>~51%</b>","Settlement directly with the <b>ryot</b> (cultivator); revisable every 20–30 years"],
    ["<b>Mahalwari</b>","<b>Holt Mackenzie, 1822</b>; revised by <b>William Bentinck, 1833</b>","North-West Provinces, Punjab, Central India — <b>~30%</b>","Settlement with the <b>village/mahal</b> as a unit through the headman"]
  ]},
  {k:"facts", title:"Economic impact — terms SSC asks", rows:[
    ["<b>Drain of wealth</b>","<b>Dadabhai Naoroji</b>, <i>Poverty and Un-British Rule in India</i> (1901)"],
    ["De-industrialisation","Ruin of handloom and handicraft; India turned into a supplier of raw material and a market for British goods"],
    ["<b>Commercialisation of agriculture</b>","Forced cash crops — indigo, cotton, jute, opium"],
    ["<b>Indigo revolt</b>","<b>1859–60, Bengal</b> — Digambar &amp; Bishnu Biswas; <i>Nil Darpan</i> by <b>Dinabandhu Mitra</b>"],
    ["Deccan riots","1875 — against moneylenders; led to the Deccan Agriculturists' Relief Act 1879"],
    ["Santhal rebellion","1855–56 — <b>Sidhu &amp; Kanhu</b>"],
    ["<b>Munda rebellion / Ulgulan</b>","1899–1900 — <b>Birsa Munda</b> (his birthday, <b>15 November</b>, is Janjatiya Gaurav Divas)"],
    ["Kol, Bhil, Khond, Ahom rebellions","Kol 1831 (Buddho Bhagat), Bhil 1818, Khond 1846, Ahom 1828"],
    ["Moplah revolt","1921, Malabar"],
    ["<b>Champaran</b> &amp; <b>Bardoli</b>","Indigo tinkathia (1917) and revenue hike (1928)"],
    ["Peasant bodies","<b>Kisan Sabha, 1918</b> (Awadh, Baba Ramchandra); <b>All India Kisan Sabha, 1936</b> (Sahajanand Saraswati); Eka movement 1921"],
    ["Early railways &amp; famine","First railway 1853; <b>Famine Commissions</b> — Campbell (1866), Strachey (1880), Lyall (1896), MacDonnell (1900)"]
  ]},
  {k:"trap", h:"<b>Permanent Settlement = Cornwallis 1793</b>; <b>Ryotwari = Munro</b>; <b>Mahalwari = Mackenzie/Bentinck</b>. The <b>largest area</b> was under <b>Ryotwari (~51%)</b>, not Zamindari. The <b>1935 Act</b> — not 1919 — is the main source of the Indian Constitution."}
], sum:[
  "1773 Regulating Act — Governor-General of Bengal. 1784 Pitt's India Act — Board of Control. 1813 — ₹1 lakh for education. 1833 — Governor-General of India. 1853 — open competition for the civil services.",
  "1858 — Crown rule, Secretary of State, Viceroy. 1861 — portfolio system. 1909 — separate electorates. 1919 — dyarchy in provinces, bicameral centre. 1935 — provincial autonomy, RBI, Federal Court; main source of the Constitution.",
  "Permanent Settlement/Zamindari — Cornwallis 1793, ~19%. Ryotwari — Munro 1820, ~51% (largest). Mahalwari — Mackenzie 1822/Bentinck 1833, ~30%.",
  "Drain theory — Dadabhai Naoroji, Poverty and Un-British Rule in India. Indigo revolt 1859–60; Nil Darpan by Dinabandhu Mitra.",
  "Tribal revolts: Santhal 1855 (Sidhu & Kanhu), Munda Ulgulan 1899–1900 (Birsa Munda), Kol 1831, Moplah 1921. All India Kisan Sabha 1936."
]}
);

  ]},
  {k:"trick", h:"<b>Style ↔ region</b>: <b>Na</b>gara = <b>No</b>rth, <b>Dra</b>vida = <b>D</b>own south, <b>Ve</b>sara = <b>Ve</b>ech (between) — the Deccan.<br><b>Gopuram only in the south</b>; a <b>curved shikhara only in the north</b>."},
  {k:"facts", title:"Stupas and Buddhist architecture", rows:[
    ["<b>Sanchi</b> (MP)","Begun by <b>Ashoka</b>; railings and gateways (<i>toranas</i>) added by the <b>Sungas &amp; Satavahanas</b>; UNESCO site; the <b>largest stupa</b> and the best preserved"],
    ["<b>Bharhut</b> (MP)","Sunga-period railings with Jataka scenes"],
    ["<b>Amaravati</b> (AP)","Satavahana; white marble narrative panels"],
    ["<b>Dhamek Stupa, Sarnath</b>","Marks Buddha's first sermon"],
    ["<b>Nalanda &amp; Ratnagiri / Lalitgiri / Udayagiri</b> (Odisha)","Monastic complexes — the \"Diamond Triangle\""],
    ["Parts of a stupa","<b>Medhi</b> (base), <b>Anda</b> (dome), <b>Harmika</b> (square railing), <b>Yashti</b> (mast), <b>Chhatra</b> (umbrella), <b>Pradakshina Patha</b> (circumambulation), <b>Torana</b> (gateway)"]
  ]},
  {k:"table", title:"Cave architecture", head:["Caves","State","Whose / what"], rows:[
    ["<b>Ajanta</b>","Maharashtra","<b>Buddhist only</b>, 29 caves; <b>paintings</b> (fresco/tempera) of Jataka tales; 2nd c. BCE–6th c. CE; UNESCO"],
    ["<b>Ellora</b>","Maharashtra","<b>All three — Buddhist, Hindu, Jain</b>, 34 caves; <b>Kailasa temple (Cave 16)</b> cut from one rock by <b>Krishna I (Rashtrakuta)</b>; UNESCO"],
    ["<b>Elephanta</b>","Maharashtra","Shaivite; the <b>Trimurti</b> / Maheshmurti; Rashtrakuta period; UNESCO"],
    ["<b>Bagh</b>","Madhya Pradesh","Buddhist paintings, like Ajanta's"],
    ["<b>Udayagiri &amp; Khandagiri</b>","Odisha","<b>Jain</b>; Kharavela's <b>Hathigumpha inscription</b>"],
    ["<b>Karla, Bhaja, Bedsa, Nasik, Kanheri</b>","Maharashtra","Buddhist <b>chaityas</b> &amp; <b>viharas</b>; Karla has the largest chaitya hall"],
    ["<b>Barabar</b>","Bihar","<b>Oldest</b> rock-cut caves, Mauryan period (Lomas Rishi)"],
    ["<b>Sittanavasal</b>","Tamil Nadu","Jain paintings"],
    ["<b>Badami</b>","Karnataka","Chalukyan, Hindu &amp; Jain"]
  ]},
  {k:"trick", h:"<b>Ajanta vs Ellora</b> — \"<b>A</b>janta is <b>A</b>ll Buddhist and has the <b>A</b>rt (paintings); <b>E</b>llora is <b>E</b>verybody's (three religions) and has the <b>E</b>normous Kailasa.\"<br><b>Elephanta</b> → <b>Trimurti</b> of Shiva."},
  {k:"facts", title:"Indo-Islamic and colonial", rows:[
    ["<b>Delhi Sultanate style</b>","<b>Quwwat-ul-Islam mosque</b> &amp; <b>Qutub Minar</b> (Aibak–Iltutmish), <b>Alai Darwaza</b> (Alauddin Khalji), <b>Tughlaqabad</b>, <b>Lodi tombs</b>"],
    ["<b>Mughal peak</b>","<b>Humayun's tomb</b> (first garden tomb), <b>Fatehpur Sikri &amp; Buland Darwaza</b> (Akbar), <b>Itimad-ud-Daulah</b> (first full marble, <i>pietra dura</i>), <b>Taj Mahal</b> (Shah Jahan; Ustad Ahmad Lahauri), <b>Red Fort &amp; Jama Masjid</b>"],
    ["<b>Provincial</b>","<b>Gol Gumbaz</b> (Bijapur), <b>Charminar</b> (Hyderabad, 1591), Atala Masjid (Jaunpur), Jama Masjid of Ahmedabad"],
    ["<b>Features</b>","<b>True arch &amp; dome</b> (as against the Indian corbelled arch), <b>pietra dura</b> (stone inlay), <b>jali</b> screens, <b>charbagh</b> garden, <b>chhatri</b>, <b>pishtaq</b> (arched portal), <b>iwan</b>"],
    ["<b>Colonial</b>","Victoria Memorial &amp; Writers' Building (Kolkata), Gateway of India &amp; CST (Mumbai — <b>Indo-Saracenic/Gothic</b>), Rashtrapati Bhavan &amp; India Gate (New Delhi, by <b>Edwin Lutyens</b> and <b>Herbert Baker</b>)"],
    ["<b>Temple cities / UNESCO</b>","Hampi, Pattadakal, Mahabalipuram, Khajuraho, Konark, Great Living Chola Temples, Ajanta, Ellora, Elephanta, Sanchi, Bodh Gaya, Qutub Minar, Humayun's tomb, Red Fort, Taj Mahal, Fatehpur Sikri, Rani ki Vav, Dholavira, Jaipur city, Ahmedabad city, Victorian &amp; Art Deco Mumbai, Santiniketan, Hoysala temples"]
  ]},
  {k:"trap", h:"The <b>Kailasa temple at Ellora is rock-cut</b> (carved out of a hill, top-down) — <b>Brihadeshwara</b> is built up from stone blocks. <b>Konark</b> is Nagara, not Dravida. The <b>Taj Mahal's architect</b> is <b>Ustad Ahmad Lahauri</b>, and it was built for <b>Mumtaz Mahal</b> (Arjumand Banu)."}
], sum:[
  "Nagara (north): curved shikhara, no gopuram — Khajuraho, Konark, Lingaraja. Dravida (south): vimana + gopuram + tank — Brihadeshwara, Meenakshi, Mahabalipuram. Vesara (Deccan): Pattadakal, Halebid, Belur.",
  "Ajanta = Buddhist only + paintings; Ellora = Buddhist + Hindu + Jain, with the rock-cut Kailasa temple (Krishna I); Elephanta = Shaivite Trimurti; Barabar = oldest rock-cut caves.",
  "Sanchi stupa begun by Ashoka, gateways by Sungas/Satavahanas. Stupa parts: medhi, anda, harmika, yashti, chhatra, torana.",
  "Indo-Islamic features: true arch and dome, pietra dura, jali, charbagh, chhatri. Humayun's tomb = first garden tomb; Itimad-ud-Daulah = first full marble.",
  "New Delhi was designed by Edwin Lutyens and Herbert Baker."
]},

{id:"L29", g:"wld", heat:2, title:"World revolutions & the World Wars", hi:"विश्व क्रांतियाँ एवं विश्व युद्ध", blocks:[
  {k:"hot", h:"Usually one question — most often the French Revolution's slogan/date, the Russian Revolution's year and leader, or a World War treaty. Dates and \"who said what\" are enough."},
  {k:"facts", title:"Revolutions", rows:[
    ["<b>Glorious Revolution</b>","<b>1688</b>, England — bloodless; the Bill of Rights (1689) made Parliament supreme"],
    ["<b>American Revolution</b>","<b>1775–83</b>; Boston Tea Party <b>1773</b>; <b>Declaration of Independence 4 July 1776</b> (drafted by <b>Thomas Jefferson</b>); slogan \"<b>No taxation without representation</b>\"; Treaty of Paris 1783; first President <b>George Washington</b>"],
    ["<b>French Revolution</b>","<b>1789</b> — fall of the <b>Bastille, 14 July 1789</b>; slogan \"<b>Liberty, Equality, Fraternity</b>\"; thinkers <b>Rousseau</b> (<i>Social Contract</i>), <b>Voltaire</b>, <b>Montesquieu</b> (separation of powers); the Reign of Terror (Robespierre); Napoleon took over in 1799"],
    ["<b>Industrial Revolution</b>","Began in <b>England</b>, ~1760; <b>James Watt</b> — steam engine; Hargreaves — spinning jenny; Arkwright — water frame; Crompton — mule; Cartwright — power loom; Stephenson — railway engine (Rocket)"],
    ["<b>Russian Revolution</b>","<b>1917</b> — the <b>February (March) Revolution</b> ended Tsar <b>Nicholas II</b>; the <b>October (November) Revolution</b> brought the <b>Bolsheviks</b> under <b>Lenin</b> to power; slogan \"<b>Peace, Land and Bread</b>\"; Treaty of Brest-Litovsk 1918; USSR formed 1922"],
    ["<b>Chinese Revolution</b>","1911 — Sun Yat-sen ends the Manchu dynasty; <b>1949</b> — <b>Mao Zedong</b> founds the People's Republic; Long March 1934–35"],
    ["<b>Meiji Restoration</b>","1868, Japan — modernisation under the Emperor"],
    ["Unifications","<b>Italy</b> — Mazzini, <b>Garibaldi</b>, Cavour, 1870; <b>Germany</b> — <b>Bismarck</b> (\"blood and iron\"), 1871"]
  ]},
  {k:"facts", title:"First World War (1914–18)", rows:[
    ["Immediate cause","Assassination of <b>Archduke Franz Ferdinand</b> at <b>Sarajevo, 28 June 1914</b>, by Gavrilo Princip"],
    ["Sides","<b>Allies</b> — Britain, France, Russia, later Italy, Japan, USA (1917) · <b>Central Powers</b> — Germany, Austria-Hungary, Ottoman Turkey, Bulgaria"],
    ["Ended","<b>11 November 1918</b>; <b>Treaty of Versailles, 28 June 1919</b> — punished Germany (war guilt clause, reparations, loss of colonies)"],
    ["<b>League of Nations</b>","Set up <b>1920</b>, HQ <b>Geneva</b>, proposed by US President <b>Woodrow Wilson</b> (his <b>Fourteen Points</b>); the USA never joined; it failed and was dissolved in 1946"]
  ]},
  {k:"facts", title:"Second World War (1939–45)", rows:[
    ["Cause","Germany's invasion of <b>Poland, 1 September 1939</b>; the harshness of Versailles and the rise of <b>Hitler</b> (Nazi), <b>Mussolini</b> (Fascist) and Japan"],
    ["Sides","<b>Allies</b> — Britain, France, USSR, USA, China · <b>Axis</b> — Germany, Italy, Japan"],
    ["Turning points","Pearl Harbor (<b>7 Dec 1941</b>) brought in the USA; Stalingrad (1942–43); <b>D-Day, 6 June 1944</b>"],
    ["End","Germany surrendered <b>8 May 1945</b> (VE Day); atom bombs on <b>Hiroshima (6 Aug 1945, \"Little Boy\")</b> and <b>Nagasaki (9 Aug 1945, \"Fat Man\")</b>; Japan surrendered <b>2 September 1945</b>"],
    ["<b>United Nations</b>","Charter signed <b>26 June 1945</b> at San Francisco; came into force <b>24 October 1945</b> — <b>UN Day</b>; HQ <b>New York</b>; 51 founding members, India among them"],
    ["After","<b>Cold War</b>; NATO 1949, Warsaw Pact 1955; Berlin Wall 1961–1989; USSR dissolved 1991"]
  ]},
  {k:"trick", h:"<b>War dates</b> — \"<b>14 to 18, 39 to 45</b>\"; each war ends with a treaty town: WWI → <b>Versailles</b>, WWII → <b>no single treaty</b> (Potsdam/Yalta conferences instead).<br><b>League vs UN</b>: <b>League = Geneva, 1920, after WWI</b>; <b>UN = New York, 1945, after WWII</b>."},
  {k:"trap", h:"The <b>October Revolution</b> of 1917 is the one that brought the Bolsheviks to power (it falls in November by the modern calendar). <b>Woodrow Wilson proposed the League of Nations but the USA never joined it.</b> <b>Hiroshima</b> came first (6 Aug), Nagasaki second (9 Aug)."}
], sum:[
  "American Revolution: Boston Tea Party 1773, Declaration of Independence 4 July 1776 (Jefferson), 'no taxation without representation'.",
  "French Revolution 1789: Bastille fell 14 July 1789; 'Liberty, Equality, Fraternity'; Rousseau, Voltaire, Montesquieu.",
  "Russian Revolution 1917: February ended Tsar Nicholas II; October brought Lenin's Bolsheviks; slogan 'Peace, Land and Bread'.",
  "WWI 1914–18: triggered at Sarajevo 28 June 1914; Treaty of Versailles 28 June 1919; League of Nations 1920 at Geneva (Woodrow Wilson's idea; USA never joined).",
  "WWII 1939–45: began with Poland 1 Sept 1939; Pearl Harbor 7 Dec 1941; D-Day 6 June 1944; Hiroshima 6 Aug & Nagasaki 9 Aug 1945; UN came into force 24 Oct 1945."
]},

["L6","The Amaravati school of art chiefly used:",["White marble","Red sandstone","Grey schist","Terracotta"],"Amaravati, in Andhra under the Satavahanas, worked in white marble with narrative panels.","p"],

/* L7 */
["L7","The Allahabad Pillar inscription (Prayag Prashasti) praises:",["Samudragupta","Chandragupta I","Chandragupta II","Skandagupta"],"It was composed by Samudragupta's court poet Harisena and engraved on an Ashokan pillar.","p"],
["L7","Samudragupta has been called the 'Indian Napoleon' by:",["V. A. Smith","R. C. Majumdar","D. D. Kosambi","James Prinsep"],"The historian V. A. Smith gave him that name for his many conquests.","p"],
["L7","The Gupta era began in:",["319–320 CE","78 CE","58 BCE","78 BCE"],"Chandragupta I started the Gupta era in 319–20 CE; the Saka era is 78 CE and the Vikrama Samvat 58 BCE.","p"],
["L7","Nalanda University was founded by:",["Kumaragupta I","Harshavardhana","Dharmapala","Chandragupta II"],"Kumaragupta I founded Nalanda; Harsha only patronised it later and Dharmapala founded Vikramashila.","p"],
["L7","Fa-Hien visited India during the reign of:",["Chandragupta II","Samudragupta","Harshavardhana","Kanishka"],"Fa-Hien came in Chandragupta II's time and wrote Fo-Kuo-Ki; Hiuen Tsang came under Harsha.","p"],
["L7","Which Gupta ruler took the title 'Shakari' after defeating the Shakas?",["Chandragupta II","Samudragupta","Skandagupta","Kumaragupta I"],"Chandragupta II 'Vikramaditya' destroyed the Western Kshatrapas and took the title Shakari.","p"],
["L7","Aryabhata's major astronomical work is:",["Aryabhatiya","Brihat Samhita","Panchasiddhantika","Brahmasphuta Siddhanta"],"Aryabhatiya and Surya Siddhanta are Aryabhata's; Brihat Samhita is Varahamihira's.","p"],
["L7","Who stated that the earth rotates on its axis and explained eclipses scientifically?",["Aryabhata","Varahamihira","Brahmagupta","Sushruta"],"Aryabhata said the earth is round and rotates, and explained solar and lunar eclipses.","p"],
["L7","The Sushruta Samhita deals mainly with:",["Surgery","Astrology","Grammar","Statecraft"],"Sushruta is called the father of plastic surgery; Charaka's Samhita deals with general medicine.","p"],
["L7","Kalidasa's play about Shakuntala is called:",["Abhijnanashakuntalam","Meghaduta","Raghuvamsha","Kumarasambhava"],"Abhijnanashakuntalam is his best-known play; Meghaduta is a poem.","p"],
["L7","Gupta gold coins were known as:",["Dinara","Pana","Tanka","Varaha"],"The Guptas issued gold dinaras — the largest number of gold coins in ancient India.","p"],
["L7","Which Gupta ruler repelled the Huna invasion?",["Skandagupta","Kumaragupta I","Chandragupta II","Samudragupta"],"Skandagupta defeated the Hunas and also repaired the Sudarshana lake, as his Junagadh inscription records.","p"],
["L7","The Dashavatara temple at Deogarh belongs to which period?",["Gupta","Maurya","Kushana","Chalukya"],"It is a Gupta-period temple, one of the earliest examples of the Nagara style.","p"],
["L7","Which Gupta ruler issued the famous 'Lyrist' (veena-playing) coin?",["Samudragupta","Chandragupta I","Chandragupta II","Kumaragupta I"],"Samudragupta's lyrist type shows him playing the veena, pointing to his love of music.","p"],
["L7","Who was the court poet who composed the Allahabad Prashasti?",["Harisena","Banabhatta","Ravikirti","Vishakhadatta"],"Harisena served Samudragupta; Ravikirti wrote the Aihole inscription for Pulakeshin II.","p"],
["L7","Chandragupta I married a princess of which clan, strengthening his position?",["Lichchhavi","Shakya","Jnatrika","Malla"],"His marriage to the Lichchhavi princess Kumaradevi is commemorated on his coins.","p"],

["L8","The biography of Harshavardhana, the Harshacharita, was written by:",["Banabhatta","Harisena","Kalhana","Bilhana"],"Banabhatta, Harsha's court poet, also wrote Kadambari.","p"],
["L8","The rock-cut Kailasa temple at Ellora was built by:",["Krishna I of the Rashtrakutas","Rajaraja I of the Cholas","Narasimhavarman I of the Pallavas","Dhanga of the Chandelas"],"Krishna I had it carved out of a single rock from the top down.","p"],

["L8","The Konark Sun temple was built by:",["Narasimhadeva I of the Eastern Gangas","Amoghavarsha","Rana Kumbha","Rajendra Chola"],"Narasimhadeva I of the Eastern Ganga dynasty built it in the 13th century.","p"],
["L8","The Dilwara Jain temples at Mount Abu were built under the:",["Solankis (Chalukyas of Gujarat)","Chandelas","Rashtrakutas","Pratiharas"],"They belong to the Solanki period, which also produced the Modhera Sun temple and Rani ki Vav.","p"],

["L8","The Shore temple and the rathas at Mahabalipuram were built by the:",["Pallavas","Cholas","Chalukyas","Rashtrakutas"],"Narasimhavarman I 'Mamalla' gave Mamallapuram (Mahabalipuram) its name and monuments.","p"],
["L8","The tripartite struggle for Kannauj was fought among the:",["Palas, Pratiharas and Rashtrakutas","Cholas, Pandyas and Cheras","Chalukyas, Pallavas and Cholas","Senas, Palas and Chandelas"],"The three powers fought over Kannauj through the 8th and 9th centuries.","p"],

["L8","The bronze Nataraja image is the finest achievement of which dynasty's art?",["Chola","Pallava","Gupta","Rashtrakuta"],"Chola bronzes, cast by the lost-wax method, are famous above all for the dancing Shiva.","p"],
["L8","Which ancient university was destroyed by Bakhtiyar Khalji in 1193?",["Nalanda","Takshashila","Valabhi","Odantapuri"],"Nalanda was sacked by Bakhtiyar Khalji; it is now a UNESCO World Heritage site.","p"]

/* L10 */
["L10","The Delhi Sultanate was founded in 1206 by:",["Qutb-ud-din Aibak","Iltutmish","Muhammad Ghori","Balban"],"Aibak, Ghori's slave general, founded the Slave (Mamluk) dynasty in 1206.","p"],
["L10","The construction of the Qutub Minar was begun by Aibak and completed by:",["Iltutmish","Balban","Alauddin Khalji","Firoz Shah Tughlaq"],"Iltutmish completed it; Firoz Shah Tughlaq later repaired it after lightning damage.","p"],
["L10","Who introduced the Iqta system in India?",["Iltutmish","Alauddin Khalji","Balban","Muhammad bin Tughlaq"],"Iltutmish introduced the Iqta — a revenue assignment in place of a cash salary.","p"],
["L10","The silver Tanka and the copper Jital were introduced by:",["Iltutmish","Sher Shah Suri","Alauddin Khalji","Qutb-ud-din Aibak"],"Iltutmish issued the silver tanka and copper jital, giving the Sultanate a standard currency.","p"],
["L10","The only woman ever to sit on the throne of Delhi was:",["Razia Sultan","Nur Jahan","Chand Bibi","Rani Durgavati"],"Razia Sultan, daughter of Iltutmish, ruled from 1236 to 1240.","p"],

["L10","Alauddin Khalji's market control was supervised by an officer called the:",["Shahna-i-Mandi","Barid","Amir-i-Kohi","Muhtasib"],"The Shahna-i-Mandi was the superintendent of markets under the Diwan-i-Riyasat.","p"],
["L10","Who established the first permanent standing army in medieval India?",["Alauddin Khalji","Balban","Iltutmish","Muhammad bin Tughlaq"],"Alauddin Khalji raised a permanent standing army paid in cash, with dagh (branding) and huliya (descriptive rolls).","p"],
["L10","Alauddin Khalji raised the land revenue demand to:",["50% of the produce","33% of the produce","25% of the produce","20% of the produce"],"He fixed it at half the produce and measured land (zabti) to assess it.","p"],
["L10","Malik Kafur was the general who led the southern campaigns of:",["Alauddin Khalji","Balban","Muhammad bin Tughlaq","Firoz Shah Tughlaq"],"Malik Kafur carried Khalji arms to Devagiri, Warangal, Dwarasamudra and Madurai.","p"],
["L10","Qutb-ud-din Aibak was called 'Lakh Baksh' because he:",["Gave away lakhs in charity","Won a hundred thousand battles","Minted a lakh of coins","Built a hundred thousand houses"],"Lakh Baksh means 'giver of lakhs', a reference to his generosity.","p"],
["L10","The Adhai Din ka Jhonpra at Ajmer was built by:",["Qutb-ud-din Aibak","Iltutmish","Alauddin Khalji","Balban"],"Aibak built it, along with the Quwwat-ul-Islam mosque at Delhi.","p"],
["L10","The Turkan-i-Chahalgani, or corps of forty nobles, was created by:",["Iltutmish","Balban","Aibak","Razia Sultan"],"Iltutmish created it; Balban later broke its power.","p"],
["L10","Which Sultan assumed the title 'Sikandar-i-Sani' (Second Alexander)?",["Alauddin Khalji","Balban","Muhammad bin Tughlaq","Sikandar Lodi"],"Alauddin Khalji took the title, reflecting his ambition of world conquest.","p"],
["L10","Amir Khusrau, called the 'Parrot of India', lived at the court of:",["Several Sultans from Balban to Muhammad bin Tughlaq","Akbar","Mahmud of Ghazni","Sher Shah Suri"],"He served a succession of Delhi Sultans and was a disciple of Nizamuddin Auliya.","p"],
["L10","Aibak shifted his capital to Lahore; who moved it to Delhi?",["Iltutmish","Balban","Razia Sultan","Alauddin Khalji"],"Iltutmish made Delhi the seat of the Sultanate.","p"],

["L11","The First Battle of Panipat, in which Ibrahim Lodi was killed, was fought on:",["21 April 1526","14 January 1761","5 November 1556","23 June 1757"],"Babur defeated and killed Ibrahim Lodi on 21 April 1526, ending the Delhi Sultanate.","p"],
["L11","The Tarikh-i-Firozshahi was written by:",["Ziauddin Barani","Minhaj-us-Siraj","Amir Khusrau","Isami"],"Barani's Tarikh-i-Firozshahi is a major source on Alauddin Khalji and the Tughlaqs.","p"],
["L11","The Sultanate department dealing with royal correspondence was the:",["Diwan-i-Insha","Diwan-i-Arz","Diwan-i-Risalat","Diwan-i-Wizarat"],"Insha = writing. Arz = military, Risalat = religious and foreign affairs, Wizarat = finance.","p"],

["L11","The administrative units of the Delhi Sultanate, from largest to smallest, were:",["Iqta – Shiq – Pargana – Gram","Suba – Sarkar – Pargana – Mauza","Mandalam – Nadu – Ur","Rajya – Vishaya – Grama"],"Suba–Sarkar–Pargana–Mauza is the Mughal order; the Sultanate used Iqta, Shiq, Pargana and Gram.",""],

["L26","The Natyashastra, the oldest treatise on dance and drama, was written by:",["Bharata Muni","Nandikeshvara","Abhinavagupta","Panini"],"It is often called the fifth Veda; Nandikeshvara wrote the Abhinaya Darpana.","p"],
["L26","Birju Maharaj was a celebrated exponent of:",["Kathak","Kathakali","Odissi","Bharatanatyam"],"He belonged to the Lucknow gharana of Kathak.","p"],
["L26","Kelucharan Mohapatra is associated with which dance form?",["Odissi","Kuchipudi","Manipuri","Kathak"],"He was the foremost Odissi guru of the 20th century.","p"],
["L26","Rukmini Devi Arundale is associated with:",["Bharatanatyam","Kathak","Mohiniyattam","Sattriya"],"She founded Kalakshetra and revived Bharatanatyam.","p"],
["L26","Pandit Bhimsen Joshi belonged to which gharana?",["Kirana","Gwalior","Agra","Patiala"],"The Kirana gharana also produced Abdul Karim Khan and Gangubai Hangal.","p"],
["L26","Ustad Bismillah Khan was a master of the:",["Shehnai","Sarod","Sitar","Santoor"],"He was awarded the Bharat Ratna for his shehnai.","p"],
["L26","Pandit Shivkumar Sharma popularised which instrument in classical music?",["Santoor","Sarangi","Sarod","Flute"],"He brought the Kashmiri santoor into Hindustani classical music.","p"],
["L26","Amjad Ali Khan is famous for playing the:",["Sarod","Sitar","Shehnai","Tabla"],"Ali Akbar Khan and Amjad Ali Khan are the best-known sarod players.","p"],
["L26","Who is called the father of Carnatic music?",["Purandara Dasa","Tyagaraja","Muthuswami Dikshitar","Shyama Shastri"],"Purandara Dasa laid its foundations; the later trinity was Tyagaraja, Dikshitar and Shyama Shastri.","p"],
["L26","The Carnatic music trinity consists of:",["Tyagaraja, Muthuswami Dikshitar and Shyama Shastri","Purandara Dasa, Tyagaraja and Annamacharya","Tyagaraja, Swathi Thirunal and Dikshitar","Dikshitar, Shyama Shastri and Purandara Dasa"],"These three near-contemporaries defined the Carnatic kriti.","p"],
["L26","Khayal, Thumri and Dhrupad are forms of:",["Hindustani music","Carnatic music","Folk music of Bengal","Qawwali"],"The Carnatic forms are kriti, varnam and ragam-tanam-pallavi.","p"],
["L26","The first musician to receive the Bharat Ratna was:",["M. S. Subbulakshmi","Bismillah Khan","Ravi Shankar","Bhimsen Joshi"],"The Carnatic vocalist M. S. Subbulakshmi received it in 1998.","p"],
["L26","How many rasas are described in Indian aesthetics?",["Nine","Seven","Eight","Ten"],"The Navarasa are Shringara, Hasya, Karuna, Raudra, Veera, Bhayanaka, Vibhatsa, Adbhuta and Shanta.","p"],

/* L27 */
["L27","The Nagara style of temple architecture is characterised by a:",["Curvilinear shikhara","Pyramidal vimana with a gopuram","Star-shaped plan only","Flat roof with a courtyard"],"Nagara temples of the north have a curved shikhara topped by an amalaka and kalasha, and no gopuram.","p"],

["L27","The Vesara style of temple architecture developed in:",["The Deccan","Bengal","Kashmir","Gujarat"],"Vesara mixes Nagara and Dravida features; Pattadakal, Halebid and Belur are examples.","p"],
["L27","The Ajanta caves contain:",["Only Buddhist art","Buddhist, Hindu and Jain art","Only Jain art","Only Hindu art"],"Ajanta is entirely Buddhist and famous for its paintings; Ellora has all three faiths.","p"],
["L27","Which cave complex contains Buddhist, Hindu and Jain caves?",["Ellora","Ajanta","Elephanta","Bagh"],"Ellora's 34 caves cover all three religions and include the rock-cut Kailasa temple.","p"],
["L27","The Trimurti sculpture of Shiva is found at:",["Elephanta","Ellora","Ajanta","Badami"],"The Maheshmurti or Trimurti is the most famous sculpture in the Elephanta caves.","p"],
["L27","The oldest rock-cut caves in India, of the Mauryan period, are at:",["Barabar, Bihar","Ajanta","Karla","Udayagiri"],"The Barabar caves, including Lomas Rishi, date from Ashoka's time.","p"],
["L27","The Udayagiri and Khandagiri caves in Odisha are:",["Jain","Buddhist","Hindu","Shaivite"],"They are Jain caves and contain Kharavela's Hathigumpha inscription.","p"],
["L27","The hemispherical dome of a stupa is called the:",["Anda","Medhi","Harmika","Yashti"],"Medhi is the base, anda the dome, harmika the square railing and yashti the mast.","p"],
["L27","The first garden tomb built in India was:",["Humayun's tomb","the Taj Mahal","Akbar's tomb at Sikandra","Itimad-ud-Daulah's tomb"],"Humayun's tomb set the charbagh model that the Taj Mahal later perfected.","p"],
["L27","The decorative technique of inlaying coloured stones, used in the Taj Mahal, is called:",["Pietra dura","Jali","Fresco","Chhatri"],"Pietra dura first appeared fully in Itimad-ud-Daulah's tomb.","p"],
["L27","The Alai Darwaza at the Qutub complex was built by:",["Alauddin Khalji","Qutb-ud-din Aibak","Iltutmish","Firoz Shah Tughlaq"],"Alauddin Khalji built it in 1311 as a gateway to the Quwwat-ul-Islam mosque.","p"],
["L27","New Delhi was designed by:",["Edwin Lutyens and Herbert Baker","Le Corbusier","Frederick Stevens","Charles Correa"],"Lutyens and Baker designed the new capital, inaugurated in 1931.","p"],
["L27","The Meenakshi temple at Madurai is an example of which style?",["Dravida","Nagara","Vesara","Indo-Islamic"],"Its towering gopurams make it a classic Dravida temple.","p"],
["L27","The Sanchi stupa was originally built by:",["Ashoka","Pushyamitra Sunga","Kanishka","Chandragupta II"],"Ashoka built the core stupa; the Sungas and Satavahanas added railings and gateways.","p"],
["L27","The largest chaitya hall in India is at:",["Karla","Bhaja","Bedsa","Kanheri"],"The Karla chaitya in Maharashtra is the biggest rock-cut chaitya hall.",""],

["L28","Tamasha is a folk theatre form of:",["Maharashtra","Gujarat","Karnataka","Madhya Pradesh"],"Nautanki belongs to UP, Jatra to Bengal, Bhavai to Gujarat and Tamasha to Maharashtra.","p"],
["L28","Yakshagana is a folk theatre form of:",["Karnataka","Kerala","Andhra Pradesh","Tamil Nadu"],"It is folk theatre, not a classical dance.","p"],
["L28","Bhaona, or Ankia Nat, is a traditional theatre of:",["Assam","Manipur","Tripura","Nagaland"],"Shankaradeva created it as part of the Assamese Vaishnava tradition.","p"],

["L28","Pavakoothu, a glove puppet form, belongs to:",["Kerala","Tamil Nadu","Odisha","Karnataka"],"Putul Nautch of Bengal uses rod puppets and Ravanachhaya of Odisha shadow puppets.","p"],
["L28","Chikankari embroidery is associated with:",["Lucknow","Bhopal","Jaipur","Hyderabad"],"Zardozi is also associated with Lucknow and Bhopal.","p"],
["L28","Bidriware, a metal inlay craft, comes from:",["Karnataka","Telangana","Maharashtra","Madhya Pradesh"],"It is named after Bidar in Karnataka.","p"],

["L28","Muga silk is a speciality of:",["Assam","West Bengal","Odisha","Bihar"],"Muga, the golden silk, has a GI tag from Assam.","p"],
["L28","Phulkari embroidery belongs to:",["Punjab","Haryana","Himachal Pradesh","Rajasthan"],"Phulkari means 'flower work' and is done on shawls and odhnis.","p"],
["L28","Channapatna, famous for wooden toys, is in:",["Karnataka","Tamil Nadu","Andhra Pradesh","Kerala"],"Channapatna toys, with their lacquer finish, hold a GI tag.","p"],

/* L29 */
["L29","The Bastille fell on:",["14 July 1789","4 July 1776","26 August 1789","1 September 1939"],"The fall of the Bastille is treated as the start of the French Revolution.","p"],
["L29","'Liberty, Equality, Fraternity' was the slogan of the:",["French Revolution","American Revolution","Russian Revolution","Glorious Revolution"],"The French Revolution of 1789 gave the world this slogan.","p"],
["L29","The Social Contract was written by:",["Jean-Jacques Rousseau","Voltaire","Montesquieu","John Locke"],"Montesquieu wrote The Spirit of the Laws, setting out the separation of powers.","p"],
["L29","The American Declaration of Independence was adopted on:",["4 July 1776","14 July 1789","1 September 1783","16 December 1773"],"Thomas Jefferson drafted it; the Boston Tea Party was in 1773.","p"],
["L29","'No taxation without representation' was the slogan of the:",["American Revolution","French Revolution","Chinese Revolution","Russian Revolution"],"The American colonists objected to being taxed without seats in Parliament.","p"],
["L29","The steam engine was improved and made practical by:",["James Watt","James Hargreaves","Richard Arkwright","Edmund Cartwright"],"Hargreaves made the spinning jenny, Arkwright the water frame and Cartwright the power loom.","p"],
["L29","The Bolshevik Revolution took place in:",["October (November) 1917","February (March) 1917","1905","1921"],"The February Revolution ended the Tsar; the October Revolution brought Lenin to power.","p"],
["L29","'Peace, Land and Bread' was the slogan of:",["Lenin and the Bolsheviks","the French revolutionaries","Mao Zedong","Mussolini"],"It summed up the Bolshevik promise in 1917.","p"],
["L29","The last Tsar of Russia was:",["Nicholas II","Alexander III","Peter the Great","Kerensky"],"Nicholas II abdicated in March 1917 and was later executed.","p"],
["L29","The First World War was triggered by the assassination of Archduke Franz Ferdinand at:",["Sarajevo","Vienna","Berlin","Belgrade"],"He was shot on 28 June 1914 by Gavrilo Princip.","p"],
["L29","The Treaty of Versailles was signed on:",["28 June 1919","11 November 1918","26 June 1945","2 September 1945"],"It punished Germany with the war-guilt clause, reparations and loss of colonies.","p"],
["L29","The League of Nations had its headquarters at:",["Geneva","New York","Paris","The Hague"],"It was set up in 1920 on Woodrow Wilson's proposal, though the USA never joined.","p"],
["L29","The Fourteen Points were put forward by:",["Woodrow Wilson","Lloyd George","Clemenceau","Winston Churchill"],"The US President's Fourteen Points included the idea of a League of Nations.","p"],
["L29","The Second World War began with Germany's invasion of:",["Poland","France","Russia","Czechoslovakia"],"Germany invaded Poland on 1 September 1939.","p"],
["L29","The atomic bomb was dropped on Hiroshima on:",["6 August 1945","9 August 1945","2 September 1945","8 May 1945"],"Hiroshima came first (Little Boy) and Nagasaki on 9 August (Fat Man).","p"],
["L29","The United Nations came into existence on:",["24 October 1945","26 June 1945","2 September 1945","1 January 1942"],"The Charter was signed on 26 June at San Francisco and came into force on 24 October — UN Day.","p"],
["L29","The unification of Germany in 1871 was achieved under:",["Otto von Bismarck","Garibaldi","Cavour","Mazzini"],"Bismarck's 'blood and iron' policy unified Germany; Garibaldi, Cavour and Mazzini unified Italy.","p"],
["L29","The People's Republic of China was proclaimed in 1949 by:",["Mao Zedong","Sun Yat-sen","Chiang Kai-shek","Zhou Enlai"],"Sun Yat-sen had ended the Manchu dynasty in 1911.","p"],
["L29","The Meiji Restoration of 1868 took place in:",["Japan","China","Korea","Vietnam"],"It began Japan's rapid modernisation under imperial rule.","p"],
["L29","D-Day, the Allied landing in Normandy, took place on:",["6 June 1944","7 December 1941","8 May 1945","1 September 1939"],"Pearl Harbor was attacked on 7 December 1941; Germany surrendered on 8 May 1945.","p"],

["L30","Lala Lajpat Rai was known as:",["Sher-e-Punjab","Deshbandhu","Lokmanya","Loknayak"],"Deshbandhu was C. R. Das, Lokmanya was Tilak and Loknayak was Jayaprakash Narayan.","p"],
["L30","Khan Abdul Ghaffar Khan was popularly called:",["Frontier Gandhi","Deshbandhu","Netaji","Rajaji"],"He was also known as Badshah Khan and led the Khudai Khidmatgars.","p"],

["L30","'The Indian Struggle' was written by:",["Subhas Chandra Bose","V. D. Savarkar","Jawaharlal Nehru","Lala Lajpat Rai"],"Savarkar wrote The Indian War of Independence 1857 and Lajpat Rai Unhappy India.","p"],
["L30","Rabindranath Tagore won the Nobel Prize for Literature in 1913 for:",["Gitanjali","Gora","Chokher Bali","Ghare Baire"],"He was the first Asian to win the Nobel Prize for Literature.","p"],

["L1","The Sanskrit grammar 'Ashtadhyayi' was composed by:",["Panini","Patanjali","Kautilya","Kalhana"],"Panini's Ashtadhyayi is the oldest surviving Sanskrit grammar; Patanjali wrote the Mahabhashya, a commentary on it.","p"],
["L1","Neolithic ash mounds have been found mainly in:",["Karnataka","Kashmir","Bihar","Assam"],"Sanganakallu and Piklihal in Karnataka are the famous ash-mound sites. Kashmir (Burzahom) is known for pit dwellings instead.",""],
["L1","The rock paintings of Bhimbetka were brought to light in 1957 by:",["V. S. Wakankar","Robert Bruce Foote","Daya Ram Sahni","Alexander Cunningham"],"Wakankar discovered the Bhimbetka shelters in 1957. Bruce Foote had found India's first Palaeolithic tool at Pallavaram in 1863.","p"],
["L1","The 'Mahabhashya', a commentary on Panini's grammar, was written by:",["Patanjali","Panini","Kautilya","Vishakhadatta"],"Patanjali's Mahabhashya explains the Ashtadhyayi and is also a source for Sunga-period history.",""],
["L1","The first metal to be used by human beings was:",["Copper","Iron","Bronze","Tin"],"Copper came first, which is why the Stone-Copper phase is called Chalcolithic; iron appears much later, in the Later Vedic age.","p"],

["L2","Which Harappan site was the first to be excavated after Independence?",["Ropar","Lothal","Kalibangan","Dholavira"],"Ropar (Rupnagar) on the Sutlej was taken up first after 1947; it also gave a dog buried with a human.",""],
["L2","The mature phase of the Harappan civilisation is dated to:",["2600–1900 BCE","3500–3000 BCE","1900–1500 BCE","1500–1000 BCE"],"The mature or urban phase ran from about 2600 to 1900 BCE; decline set in around 1900 BCE.","p"],

["L2","The Greeks called the cotton grown in the Indus region:",["Sindon","Kalingam","Patola","Carbasina"],"Cotton was first cultivated by the Harappans, and the Greeks named it Sindon after the Sindhu (Indus).","p"],
["L2","Coffin burial and the R-37 cemetery are associated with which Harappan site?",["Harappa","Mohenjodaro","Lothal","Surkotada"],"Harappa gave the coffin burial and cemetery R-37; Lothal is famous for a double burial instead.","p"],

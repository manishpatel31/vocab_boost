const LESSONS = [
{"id":"L1","g":"anc","heat":2,"title":"Sources & the Stone Age","hi":"इतिहास के स्रोत · पाषाण काल","blocks":[{"k":"hot","h":"One question most years, almost always from the <b>same three things<\/b>: how history is divided, which site gave the first evidence of something (fire, agriculture, burial), and which source is literary vs archaeological. Learn the <i>firsts<\/i> — SSC asks \"earliest evidence of X was found at …\"."},{"k":"story","h":"<p>How do we know anything about people who lived thousands of years ago? We use <b>sources<\/b> (clues left behind). Some are things we dig up: stone tools, pots, coins, carvings on rock. These are archaeological sources. Others are things people wrote, like the Vedas or a traveller's account. These are literary sources. Historians also split the past by writing. The time before any writing is <b>prehistory<\/b>. Writing we cannot yet read, like the Harappan script, is proto-history. Once we can read it, it is history.<\/p><p>The longest chapter of the human story is the Stone Age, when tools were made of stone. Early humans hunted, gathered food and kept moving. Over time their tools got smaller and sharper (tiny blades called microliths). Then came a big change: people learned to farm and keep animals, so they settled in villages and made pottery. Later they mixed stone with copper, the first metal humans used.<\/p><p>So the order is simple: Old Stone, Middle Stone, New Stone, then Stone-and-Copper. Each step left clues at real places: the earliest fire at Kurnool caves, early farming at <b>Mehrgarh<\/b> and Lahuradewa, rock paintings at <b>Bhimbetka<\/b>. The tables tell you which clue was found where.<\/p>","key":"History is divided by writing, and the Stone Age moved step by step from wandering hunters to settled farmers."},{"k":"p","h":"History is studied from <b>sources<\/b>. <b>Archaeological<\/b> sources are things you dig up or read off stone — inscriptions, coins, monuments, pottery. <b>Literary<\/b> sources are written works — the Vedas, Puranas, Sangam texts, and accounts of foreign travellers. Anything before writing is <b>prehistory<\/b>; the phase with writing we cannot yet read (Harappan) is <b>proto-history<\/b>; once we can read the script, it is <b>history<\/b>."},{"k":"facts","title":"The three words SSC loves","rows":[["Prehistory","No writing at all — Stone Age"],["Proto-history","Writing exists but is undeciphered — Harappan"],["History","Writing exists and is readable — from the Vedic/Mahajanapada age on"],["Epigraphy","Study of inscriptions"],["Numismatics","Study of coins"],["Palaeography","Study of old scripts / writing"],["Archaeology","Study of material remains by excavation"]]},{"k":"table","title":"Stone Age at a glance","head":["Age","Rough date","Tools","Life"],"rows":[["Palaeolithic (Old Stone)","~2 mya – 12,000 BCE","Hand-axe, cleaver, quartzite","Hunting &amp; gathering; nomadic"],["Mesolithic (Middle Stone)","12,000 – 10,000 BCE","Microliths (tiny blades)","Hunting + first animal taming (dog)"],["Neolithic (New Stone)","10,000 – 2,500 BCE","Polished, ground tools; pottery","Farming, herding, settled villages"],["Chalcolithic (Stone–Copper)","2,500 – 700 BCE","Stone + copper","Villages, painted pottery"]]},{"k":"facts","title":"Firsts — pure marks","rows":[["Earliest evidence of fire","Kurnool caves (Andhra Pradesh)"],["Earliest evidence of agriculture","Lahuradewa (UP) — rice; Mehrgarh (now Pakistan) — wheat/barley"],["Earliest human burial","Bhimbetka region / Mesolithic sites; dog buried with human at Burzahom (Kashmir)"],["Rock paintings","Bhimbetka, MP — UNESCO site, discovered 1957 by V. S. Wakankar"],["First Palaeolithic tool found in India","Pallavaram (Chennai), 1863, by Robert Bruce Foote"],["Pit dwellings","Burzahom, Kashmir"],["Ash mounds","Sanganakallu / Piklihal, Karnataka"],["Oldest Neolithic site (India)","Mehrgarh (Balochistan) — also earliest farming"]]},{"k":"trick","h":"<b>Age order<\/b> — <span class=\"mn\">Pa-Me-Ne-Cha<\/span> = Palaeolithic → Mesolithic → Neolithic → Chalcolithic. Tool size <i>shrinks<\/i> then life <i>settles<\/i>: big hand-axe → tiny microlith → polished axe + pot.<br><b>Bruce Foote<\/b> gave the first tool at <b>Pallavaram<\/b> — both start with P."},{"k":"trap","h":"Bhimbetka is <b>rock paintings<\/b>, not the oldest farming. The oldest <b>farming<\/b> evidence is Mehrgarh (wheat/barley) and Lahuradewa (rice). And the <b>first metal<\/b> used by humans was <b>copper<\/b>, not iron."},{"k":"facts","title":"Who wrote what (literary sources)","rows":[["Arthashastra","Kautilya / Chanakya — Mauryan statecraft"],["Indica","Megasthenes — Greek envoy at Chandragupta Maurya's court"],["Mudrarakshasa","Vishakhadatta — on Chandragupta's rise"],["Rajatarangini","Kalhana — history of Kashmir"],["Harshacharita","Banabhatta — on Harshavardhana"],["Ashtadhyayi","Panini — Sanskrit grammar"],["Mahabhashya","Patanjali"],["Si-Yu-Ki","Hiuen Tsang (Xuanzang) — \"Records of the Western World\""]]}],"sum":["Prehistory = no writing · Proto-history = undeciphered writing (Harappa) · History = readable writing.","Order: Palaeolithic → Mesolithic → Neolithic → Chalcolithic (Pa-Me-Ne-Cha).","Fire → Kurnool caves. Rice farming → Lahuradewa. Wheat/barley + oldest Neolithic → Mehrgarh. Rock art → Bhimbetka (Wakankar, 1957).","First Palaeolithic tool in India: Pallavaram, 1863, Robert Bruce Foote.","Epigraphy = inscriptions · Numismatics = coins · Palaeography = scripts."],"app":"histancient"},
{"id":"L2","g":"anc","heat":3,"title":"Indus Valley Civilisation","hi":"सिंधु घाटी सभ्यता","blocks":[{"k":"hot","h":"<b>The single most asked ancient topic.<\/b> Expect 1–2 questions every CGL shift: site ↔ river, site ↔ discovery (dockyard, great bath, ploughed field, stadium), who excavated it, and the \"which of these is in India / Pakistan\" trap. Memorise the site table cold."},{"k":"story","h":"<p>About 4,500 years ago, along the Indus river and its neighbours, people built some of the world's first planned cities. Then they were forgotten. In 1921 <b>Daya Ram Sahni<\/b> dug at Harappa, and a year later R. D. Banerji found <b>Mohenjodaro<\/b>. That is why we call it the Harappan or Indus Valley Civilisation.<\/p><p>Why did cities grow here? Rivers gave water, fertile soil and easy transport. Farmers grew wheat, barley and cotton; they were among the first people in the world to grow cotton. Extra food let towns grow. The towns were laid out in a grid, with streets crossing at right angles and covered drains running under them. Bricks had the same fixed shape everywhere. Traders used standard weights and stamped seals. They knew copper and bronze but not iron, so this is a Bronze Age culture. Their script still cannot be read.<\/p><p>Each big site is remembered for one special find: the Great Bath at Mohenjodaro, a dockyard at <b>Lothal<\/b>, water reservoirs at Dholavira, a ploughed field at Kalibangan. After about 1900 BCE the cities declined. No one knows exactly why; floods, drying rivers and other ideas are all suggested. The tables pair each site with its river and its famous find.<\/p>","key":"The Indus people built planned, well-drained cities beside rivers, and each site is remembered for one special find."},{"k":"p","h":"Also called the <b>Harappan Civilisation<\/b> (after the first site found) and the <b>Bronze Age<\/b> civilisation of India. Discovered in <b>1921<\/b> by <b>Daya Ram Sahni<\/b> at Harappa; Mohenjodaro found <b>1922<\/b> by <b>R. D. Banerji<\/b>. Mature phase <b>2600–1900 BCE<\/b>. It belonged to the <b>Bronze Age<\/b> — copper and bronze were known, <b>iron was not<\/b>."},{"k":"table","title":"Site ↔ river ↔ what was found (learn this row by row)","head":["Site","River / place","Famous for"],"rows":[["Harappa","Ravi · Pakistan","First site found (1921, Daya Ram Sahni); granaries, coffin burial, R-37 cemetery"],["Mohenjodaro","Indus · Pakistan","<b>Great Bath<\/b>, Great Granary (largest building), bronze Dancing Girl, Pashupati seal, bearded priest; \"Mound of the Dead\""],["Lothal","Bhogavo · Gujarat","<b>Dockyard<\/b> — \"Manchester of the Indus\"; rice husk, fire altars, double burial"],["Dholavira","Khadir island · Gujarat","Water reservoirs, <b>stadium<\/b>, Harappan signboard, three-part town; UNESCO site"],["Kalibangan","Ghaggar · Rajasthan","<b>Ploughed field<\/b> (earliest), fire altars, camel bones; \"black bangles\""],["Rakhigarhi","Ghaggar · Haryana","<b>Largest Harappan site in India<\/b>"],["Banawali","Haryana","Toy plough, barley, lacks the usual grid"],["Chanhudaro","Sindh · Pakistan","<b>Bead-making<\/b> factory; only site without a citadel; cat chased by dog footprints"],["Surkotada","Gujarat","First true <b>horse bones<\/b>"],["Ropar / Rupnagar","Sutlej · Punjab","First site excavated after Independence; dog buried with human"],["Alamgirpur","Hindon · UP","<b>Easternmost<\/b> site"],["Sutkagendor","Dasht · Pakistan","<b>Westernmost<\/b> site"],["Daimabad","Pravara · Maharashtra","<b>Southernmost<\/b> site; bronze chariot"],["Manda","Chenab · J&amp;K","<b>Northernmost<\/b> site"]]},{"k":"trick","h":"<b>Corners of the Harappan map<\/b> — <span class=\"mn\">MAD-S<\/span>: <b>M<\/b>anda = North, <b>A<\/b>lamgirpur = East, <b>D<\/b>aimabad = South, <b>S<\/b>utkagendor = West.<br><b>Lothal = dock<\/b> (both have an \"L/o\" boat feel: <i>Lothal has the Lo-ading dock<\/i>). <b>Dholavira = \"Dho\" = water<\/b> → reservoirs. <b>Kalibangan = Kal (plough) + bangan<\/b> → ploughed field."},{"k":"facts","title":"Town planning & society","rows":[["Layout","<b>Grid pattern<\/b>, streets cutting at right angles; citadel (west, upper) + lower town (east)"],["Bricks","Burnt mud bricks in ratio <b>4:2:1<\/b>, laid in English bond"],["Drainage","Covered underground drains with manholes — the civilisation's hallmark"],["Weights","Binary and decimal: 1, 2, 4, 8, 16, 32 … (16 and its multiples); chert cubes"],["Script","<b>Boustrophedon<\/b> — right to left, then left to right; pictographic; still undeciphered"],["Seals","Mostly <b>steatite<\/b>; commonest animal on seals = <b>humped bull / unicorn<\/b>; <b>no horse<\/b> on seals"],["Metals known","Copper, bronze, gold, silver, lead, tin — <b>no iron<\/b>"],["Crops","Wheat, barley, cotton (first in the world — Greeks called it <i>Sindon<\/i>), peas; rice only at Lothal &amp; Rangpur"],["Animals","Bull, buffalo, elephant, rhino, dog, cat — <b>lion and horse absent<\/b> from seals"],["Worship","Mother Goddess, Pashupati (proto-Shiva), pipal tree, humped bull; <b>no temple found<\/b>"],["Great Bath","Mohenjodaro — 11.88 × 7.01 m, 2.43 m deep; bitumen-lined"],["Port towns","Lothal, Sutkagendor, Balakot, Allahdino, Kuntasi, Rangpur"]]},{"k":"trap","h":"<b>Horse<\/b>: bones at Surkotada, but <b>no horse on any seal<\/b> — a classic trick option. <b>Iron was unknown<\/b> (it is a Bronze Age culture). <b>No temple<\/b> has been found anywhere. The <b>largest site overall<\/b> is Mohenjodaro; the <b>largest in India<\/b> is Rakhigarhi."},{"k":"tl","title":"Who found what","rows":[["1921","Harappa — Daya Ram Sahni (under John Marshall, ASI head)"],["1922","Mohenjodaro — R. D. Banerji"],["1931","Chanhudaro — N. G. Majumdar"],["1953","Kalibangan — A. Ghosh; Lothal — S. R. Rao (1955)"],["1967–68","Dholavira — J. P. Joshi; excavated by R. S. Bisht (1990)"],["1963","Rakhigarhi — Suraj Bhan"]]},{"k":"p","h":"<b>Decline (1900 BCE)<\/b> — no single accepted reason. Theories: Aryan invasion (Wheeler), floods (Marshall, S. R. Rao), drying of the Ghaggar-Hakra, earthquake (Dales), deforestation and ecological change (Fairservis)."}],"sum":["Harappa 1921 (Daya Ram Sahni) · Mohenjodaro 1922 (R. D. Banerji) · ASI head John Marshall. Mature phase 2600–1900 BCE.","Great Bath + Dancing Girl + Pashupati seal = Mohenjodaro. Dockyard = Lothal. Reservoirs + stadium = Dholavira. Ploughed field = Kalibangan. Bead factory = Chanhudaro. Horse bones = Surkotada.","Corners MAD-S: Manda N, Alamgirpur E, Daimabad S, Sutkagendor W. Largest site = Mohenjodaro; largest in India = Rakhigarhi.","Bricks 4:2:1 · grid streets · covered drains · weights in multiples of 16 · boustrophedon script, undeciphered.","Knew copper/bronze, first cotton growers; did NOT know iron; no horse on seals; no temple found."],"app":"histancient"},
{"id":"L3","g":"anc","heat":3,"title":"Vedic Age","hi":"वैदिक काल","blocks":[{"k":"hot","h":"Asked every year: which Veda has what, the four <b>Vedangas/Upavedas<\/b>, \"Satyameva Jayate\" and other mottos' source, river names (Sindhu most mentioned, Saraswati most holy), and Early vs Later Vedic differences."},{"k":"story","h":"<p>After the Indus cities faded, we meet a people called the Aryans in the land of seven rivers, the <b>Sapta-Sindhu<\/b> (the Punjab region). We know them not from cities but from their hymns, the <b>Vedas<\/b>. These were sung and memorised long before they were written down. The oldest, the <b>Rigveda<\/b>, praises gods like Indra and Agni and names many rivers.<\/p><p>Life in the Early (Rig) Vedic age, about 1500 to 1000 BCE, was simple. People herded cattle, and cows meant wealth. Tribes had chiefs and met in assemblies like the Sabha and Samiti. Then people moved east into the Ganga plains. With iron ploughs (iron tools for farming) they became settled farmers. Chiefs grew into kings who held huge sacrifices. Society became stricter, with four fixed varnas (social classes), and women lost some of their earlier place. This is the Later Vedic age, 1000 to 600 BCE.<\/p><p>Four Vedas came out of this time: Rig (hymns), Yajur (rituals), Sama (melodies) and Atharva (charms and medicine). Around them grew more texts, ending with the <b>Upanishads<\/b> (books of philosophy), the source of India's motto Satyameva Jayate. The tables sort out which Veda has what, and how Early and Later Vedic life differed.<\/p>","key":"Cattle-herders of the Rigveda became farming kingdoms in the Later Vedic age, and the four Vedas record that change."},{"k":"p","h":"<b>Early (Rig) Vedic 1500–1000 BCE<\/b>, <b>Later Vedic 1000–600 BCE<\/b>. The Aryans' home is debated — Max Müller said Central Asia, Bal Gangadhar Tilak said the Arctic, Dayanand Saraswati said Tibet, A. C. Das said the Sapta-Sindhu region itself."},{"k":"table","title":"The four Vedas — one line each","head":["Veda","What it is","Keys"],"rows":[["<b>Rigveda<\/b>","1,028 hymns in 10 mandalas; oldest text in the world still in use","Mandalas II–VII oldest; IX = Soma; X = <b>Purusha Sukta<\/b> (varna origin) and <b>Nadi Sukta<\/b> (rivers); <b>Gayatri Mantra<\/b> in III. Priest: <b>Hotri<\/b>"],["<b>Yajurveda<\/b>","Rituals — how to perform the sacrifice; prose + verse","Shukla (white) &amp; Krishna (black) recensions. Priest: <b>Adhvaryu<\/b>"],["<b>Samaveda<\/b>","Melodies for the hymns — <b>root of Indian music<\/b>","Priest: <b>Udgatri<\/b>"],["<b>Atharvaveda<\/b>","Charms, spells, medicine, magic — the \"people's Veda\"","Latest; also called Brahmaveda. Priest: <b>Brahma<\/b>"]]},{"k":"trick","h":"<b>Priest ↔ Veda<\/b> — <span class=\"mn\">HAUB<\/span> in Veda order R-Y-S-A: <b>H<\/b>otri (Rig), <b>A<\/b>dhvaryu (Yajur), <b>U<\/b>dgatri (Sama), <b>B<\/b>rahma (Atharva).<br><b>Sa<\/b>maveda → <b>Sa<\/b>ngeet (music). <b>Atharva<\/b> → <b>a<\/b>ushadhi (medicine/magic)."},{"k":"facts","title":"Mottos and where they come from","rows":[["Satyameva Jayate (India)","<b>Mundaka Upanishad<\/b>"],["Yogakshema Samriddhi (LIC)","—; LIC motto <i>Yogakshemam Vahamyaham<\/i> — Bhagavad Gita"],["Shramev Jayate","Labour Ministry"],["Dhyeyo Mahadhyeyah / \"Sarve Bhavantu Sukhinah\"","Upanishads"],["Asato Ma Sadgamaya","Brihadaranyaka Upanishad"],["Vasudhaiva Kutumbakam","Maha Upanishad"],["\"Charaiveti\" (keep moving)","Aitareya Brahmana"]]},{"k":"facts","title":"Vedic literature family","rows":[["Brahmanas","Prose explanations of the rituals of each Veda"],["Aranyakas","\"Forest books\" — philosophy of sacrifice"],["Upanishads","Philosophy; 108 in all, <b>13 principal<\/b>; source of \"Satyameva Jayate\""],["Vedangas (6)","Shiksha, Kalpa, Vyakarana, Nirukta, Chhanda, Jyotisha"],["Upavedas (4)","Ayurveda (medicine), Dhanurveda (archery), Gandharvaveda (music), Shilpaveda/Sthapatyaveda (architecture)"],["Six schools (Shad-darshana)","Samkhya (Kapila), Yoga (Patanjali), Nyaya (Gautama), Vaisheshika (Kanada), Mimamsa (Jaimini), Vedanta (Badarayana/Shankara)"],["Epics","Ramayana (Valmiki) · Mahabharata (Ved Vyasa) — longest poem in the world"]]},{"k":"table","title":"Rivers in the Rigveda","head":["Vedic name","Modern name"],"rows":[["Sindhu","Indus — <b>most mentioned<\/b>"],["Saraswati","Ghaggar-Hakra — <b>holiest / Naditama<\/b>"],["Vitasta","Jhelum"],["Askini / Chandrabhaga","Chenab"],["Parushni / Iravati","Ravi"],["Vipasha","Beas"],["Shutudri","Sutlej"],["Drishadvati","Chautang / Ghaggar branch"],["Kubha","Kabul"],["Suvastu","Swat"]]},{"k":"trick","h":"<b>Five Punjab rivers, west → east<\/b> — <span class=\"mn\">Ji-Che-Ra-Be-Sa<\/span> (Jhelum, Chenab, Ravi, Beas, Sutlej) and their Vedic names in the same order: <span class=\"mn\">Vi-As-Pa-Vi-Shu<\/span> (Vitasta, Askini, Parushni, Vipasha, Shutudri)."},{"k":"table","title":"Early vs Later Vedic — the comparison SSC asks","head":["Point","Early (Rig) Vedic","Later Vedic"],"rows":[["Area","Sapta-Sindhu, Punjab–Haryana","Doab — Kuru, Panchala, Kosala, Videha; eastward"],["Economy","Pastoral; cattle = wealth (<i>gavishti<\/i> = war for cows)","Agriculture dominant; iron (<i>shyama/krishna ayas<\/i>) ploughs"],["Chief god","<b>Indra<\/b> (250 hymns), then Agni (200), Varuna","<b>Prajapati<\/b>, then Rudra and Vishnu rise; Indra, Agni fall"],["Politics","Tribal chief (<i>rajan<\/i>); assemblies <b>Sabha, Samiti, Vidatha, Gana<\/b>","Large kingdoms; big sacrifices — Rajasuya, Ashvamedha, Vajapeya; Sabha &amp; Samiti decline, Vidatha vanishes"],["Society","Varna by occupation, flexible; women attended Sabha","Rigid 4 varnas; <b>four ashramas<\/b> appear; women's position falls"],["Pottery","Ochre Coloured Pottery","<b>Painted Grey Ware<\/b> then Northern Black Polished Ware"]]},{"k":"trap","h":"<b>Indra<\/b> is the Rigveda's chief god — Vishnu and Shiva become major only later. <b>Vidatha<\/b> is the <i>oldest<\/i> assembly and the only one where women took part; it is the one that <b>disappears<\/b> in the Later Vedic age. The Gayatri Mantra is in Mandala <b>III<\/b> (dedicated to Savitri/Savitra), not Mandala I."}],"sum":["Rigveda: 1,028 hymns, 10 mandalas; Gayatri Mantra in Mandala III; Purusha Sukta (varna) and Nadi Sukta in Mandala X.","Priests H-A-U-B: Hotri (Rig), Adhvaryu (Yajur), Udgatri (Sama), Brahma (Atharva). Samaveda = music; Atharvaveda = medicine/magic.","Satyameva Jayate → Mundaka Upanishad. 108 Upanishads, 13 principal.","Sindhu = most mentioned river; Saraswati = holiest (Naditama). Vedic names Vi-As-Pa-Vi-Shu = Jhelum, Chenab, Ravi, Beas, Sutlej.","Early Vedic: Indra, cattle wealth, Sabha–Samiti–Vidatha. Later Vedic: Prajapati, iron ploughs, big sacrifices, Vidatha gone, 4 ashramas."],"app":"histancient"},
{"id":"L4","g":"anc","heat":3,"title":"Mahajanapadas, Buddhism & Jainism","hi":"महाजनपद · बौद्ध एवं जैन धर्म","blocks":[{"k":"hot","h":"Two or three questions a shift between the two religions: Buddhist councils (year–place–king–president), the Four Noble Truths, Jain Tirthankaras and their symbols, Mahavira's five vows, and which text belongs to which religion."},{"k":"story","h":"<p>By about 600 BCE, farming had made the Ganga plains rich. Small tribes grew into sixteen big states called <b>Mahajanapadas<\/b>. They fought each other, and one won: <b>Magadha<\/b> in Bihar. It had iron ore, elephants and fertile land. Its kings, starting with Bimbisara, built the power that the Mauryas later turned into an empire.<\/p><p>The same time was full of big questions. Later Vedic rituals had become costly and caste rules tight. Many thinkers asked: why do people suffer, and how can we be free? Two answers lasted. A Shakya prince, Gautama, gave up palace life, found enlightenment at Bodh Gaya and became the <b>Buddha<\/b>. He taught a Middle Path, the Four Noble Truths and the Eightfold Path, in Pali, the people's language. <b>Mahavira<\/b>, the 24th Tirthankara (teacher-saint) of Jainism, taught strict non-violence and five vows, in Prakrit.<\/p><p>Both spoke to ordinary people, not just priests, and both won royal support. Kings like Ashoka and Kanishka backed Buddhism; Chandragupta Maurya turned Jain. Monks met in councils to protect the teachings, and in time both faiths split into sects. The tables compare the two founders, list the four Buddhist councils and give the Jain Tirthankaras.<\/p>","key":"Magadha won the race among sixteen states, while Buddha and Mahavira offered ordinary people a way out of suffering beyond costly rituals."},{"k":"facts","title":"16 Mahajanapadas — only what is asked","rows":[["Source","<b>Anguttara Nikaya<\/b> (Buddhist) lists 16; Jain <i>Bhagavati Sutra<\/i> also lists them"],["The four that fought for supremacy","Magadha, Kosala, Avanti, Vatsa"],["Winner","<b>Magadha<\/b> — iron ore at Rajgir, elephants, two capitals (Rajgriha then Pataliputra)"],["Only republics (gana-sangha)","<b>Vajji<\/b> (Vaishali) and <b>Malla<\/b>"],["Dynasties of Magadha in order","Haryanka → Shishunaga → Nanda → Maurya"],["Haryanka","Bimbisara (capital Rajgriha; contemporary of Buddha &amp; Mahavira) → Ajatashatru (founded Pataliputra's fort) → Udayin (shifted capital to <b>Pataliputra<\/b>)"],["Shishunaga","Shishunaga destroyed Avanti; Kalashoka held the <b>2nd Buddhist Council<\/b>"],["Nanda","Mahapadma Nanda \"Ugrasena\"; last ruler <b>Dhanananda<\/b>, beaten by Chandragupta Maurya"]]},{"k":"table","title":"Buddhism vs Jainism — the compare question","head":["Point","Buddhism","Jainism"],"rows":[["Founder","<b>Gautama Buddha<\/b> (563–483 BCE)","<b>Vardhamana Mahavira<\/b> — 24th Tirthankara (540–468 BCE)"],["Born at","<b>Lumbini<\/b> (Nepal); mother Mahamaya, father Suddhodana (Shakya clan)","<b>Kundagrama<\/b>, Vaishali; father Siddhartha, mother Trishala (Jnatrika clan)"],["Enlightenment","<b>Bodh Gaya<\/b> under a pipal tree, age 35 — \"Nirvana/Bodhi\"","<b>Jrimbhikagrama<\/b> on the Rijupalika river, age 42 — \"Kaivalya\""],["First sermon","<b>Sarnath<\/b> (Deer Park) — <i>Dharmachakra Pravartana<\/i>","Preached in <b>Prakrit<\/b> (Ardha-Magadhi)"],["Death","<b>Kushinagar<\/b> (UP), age 80 — <i>Mahaparinirvana<\/i>","<b>Pavapuri<\/b> (Bihar), age 72"],["Language","<b>Pali<\/b>","<b>Prakrit<\/b>"],["Goal","Nirvana — end suffering, Middle Path","Kaivalya — free the soul; extreme non-violence"],["Sects","<b>Mahayana<\/b> (idol worship, Sanskrit, Bodhisattva) · <b>Hinayana/Theravada<\/b> (Pali) · Vajrayana (Tantric, Tibet)","<b>Digambara<\/b> (naked, Bhadrabahu) · <b>Svetambara<\/b> (white-clad, Sthulabhadra)"],["Key texts","<b>Tripitaka<\/b>: Vinaya, Sutta, Abhidhamma (all in Pali); Jatakas; Milindapanho","<b>Agamas / 12 Angas<\/b>; Kalpasutra (Bhadrabahu); Acharanga Sutra"],["Royal patrons","Bimbisara, Ajatashatru, <b>Ashoka<\/b>, Kanishka, Harsha","Bimbisara, <b>Chandragupta Maurya<\/b>, Kharavela, Amoghavarsha, Kumarapala"]]},{"k":"facts","title":"Buddhism — the doctrine","rows":[["Four Noble Truths","(1) <i>Dukkha<\/i> — there is suffering (2) <i>Dukkha Samudaya<\/i> — it has a cause, desire (3) <i>Dukkha Nirodha<\/i> — it can be ended (4) <i>Dukkha Nirodha Marga<\/i> — the Eightfold Path ends it"],["Eightfold Path (Ashtangika Marga)","Right view, intention, speech, action, livelihood, effort, mindfulness, concentration"],["Triratna","<b>Buddha, Dhamma, Sangha<\/b>"],["Five symbols of Buddha's life","Lotus &amp; bull = birth · <b>Horse = renunciation<\/b> (Mahabhinishkramana) · <b>Bodhi tree = enlightenment<\/b> · <b>Wheel = first sermon<\/b> · <b>Stupa = death<\/b>"],["First disciples","Sariputta &amp; Moggallana; first woman: <b>Mahaprajapati Gotami<\/b> (his aunt), through Ananda"],["Teachers before enlightenment","Alara Kalama, Ramaputta Udraka"],["Horse / charioteer","Horse <b>Kanthaka<\/b>; charioteer <b>Channa<\/b>"]]},{"k":"table","title":"Four Buddhist Councils — year, place, king, president","head":["#","Year","Place","King","President / result"],"rows":[["1st","483 BCE","<b>Rajgriha<\/b> (Sattapanni cave)","Ajatashatru","<b>Mahakassapa<\/b> — Vinaya &amp; Sutta Pitaka compiled"],["2nd","383 BCE","<b>Vaishali<\/b>","Kalashoka","Sabakami — split into Sthaviravadin &amp; Mahasanghika"],["3rd","250 BCE","<b>Pataliputra<\/b>","<b>Ashoka<\/b>","<b>Moggaliputta Tissa<\/b> — Abhidhamma Pitaka added; missions sent abroad"],["4th","~72 CE","<b>Kundalvana, Kashmir<\/b>","<b>Kanishka<\/b>","<b>Vasumitra<\/b> (vice: Ashvaghosha) — final split into Mahayana &amp; Hinayana; Sanskrit adopted"]]},{"k":"trick","h":"<b>Councils<\/b> — <span class=\"mn\">Ra-Vai-Pa-Ka<\/span> (Rajgriha, Vaishali, Pataliputra, Kashmir) under <span class=\"mn\">A-Ka-A-Ka<\/span> (Ajatashatru, Kalashoka, Ashoka, Kanishka).<br><b>Presidents<\/b>: <span class=\"mn\">Ma-Sa-Mo-Va<\/span> — Mahakassapa, Sabakami, Moggaliputta Tissa, Vasumitra."},{"k":"facts","title":"Jainism — the doctrine","rows":[["Five vows","<b>Ahimsa<\/b> (non-violence), <b>Satya<\/b> (truth), <b>Asteya<\/b> (non-stealing), <b>Aparigraha<\/b> (non-possession), <b>Brahmacharya<\/b> (celibacy) — the 5th added by <b>Mahavira<\/b>; first four by Parshvanatha"],["Three jewels (Triratna)","Right faith, right knowledge, right conduct"],["Core ideas","<b>Syadvada / Anekantavada<\/b> — many-sidedness of truth; <b>Kaivalya<\/b>; <b>Sallekhana<\/b> (fast unto death)"],["1st Tirthankara","<b>Rishabhanatha / Adinath<\/b> — symbol bull; mentioned in the Rigveda"],["23rd Tirthankara","<b>Parshvanatha<\/b> — symbol snake"],["24th Tirthankara","<b>Mahavira<\/b> — symbol <b>lion<\/b>"],["22nd Tirthankara","Neminatha — symbol conch"],["Jain councils","1st: Pataliputra (~300 BCE, Chandragupta Maurya, Sthulabhadra) → Digambara/Svetambara split. 2nd: <b>Valabhi<\/b> (512 CE, Devardhi Kshamasramana) — Agamas written down"],["Mahavira's first disciple","Jamali (also his son-in-law); 11 Ganadharas"]]},{"k":"trap","h":"Jainism was <b>not founded<\/b> by Mahavira — he is the <b>24th<\/b> Tirthankara and a <i>reformer<\/i>; Rishabhanatha was the first. Buddha attained enlightenment at <b>Bodh Gaya<\/b> but gave his <b>first sermon at Sarnath<\/b> — don't swap them. Buddha was born at <b>Lumbini<\/b>, died at <b>Kushinagar<\/b>."},{"k":"facts","title":"Other sects of the time","rows":[["Ajivika","<b>Makkhali Gosala<\/b> — strict fatalism (niyati)"],["Charvaka / Lokayata","Materialism — <b>Brihaspati<\/b>; \"eat, drink, be merry\""],["Ajnana","Sanjaya Belatthiputta — agnosticism"],["Akriyavada","Purana Kassapa"]]}],"sum":["Buddha: born Lumbini, enlightened Bodh Gaya, first sermon Sarnath, died Kushinagar. Language Pali; Tripitaka = Vinaya + Sutta + Abhidhamma.","Four Noble Truths + Eightfold Path + Triratna (Buddha, Dhamma, Sangha). Symbols: horse = renunciation, bodhi tree = enlightenment, wheel = first sermon, stupa = death.","Councils Ra-Vai-Pa-Ka under Ajatashatru, Kalashoka, Ashoka, Kanishka; presidents Mahakassapa, Sabakami, Moggaliputta Tissa, Vasumitra. 4th = Mahayana–Hinayana split.","Mahavira = 24th Tirthankara (symbol lion), born Kundagrama, died Pavapuri; language Prakrit; added the 5th vow Brahmacharya.","Magadha dynasties: Haryanka → Shishunaga → Nanda → Maurya. Vajji and Malla were the republics."],"app":"histancient"},
{"id":"L5","g":"anc","heat":3,"title":"Mauryan Empire","hi":"मौर्य साम्राज्य","blocks":[{"k":"hot","h":"Ashoka is a <b>guaranteed<\/b> area: which edict says what, where the pillars stand, the Kalinga war year, Megasthenes, and Mauryan officials (<i>Sitadhyaksha<\/i>, <i>Panyadhyaksha<\/i>…). Also the Arthashastra's famous terms."},{"k":"story","h":"<p>Around 322 BCE a young man named <b>Chandragupta Maurya<\/b>, guided by the clever teacher <b>Chanakya<\/b> (Kautilya), overthrew the Nanda king of Magadha. He built India's first great empire, with its capital at Pataliputra. He even beat the Greek general Seleucus, who then sent an ambassador, Megasthenes, to his court. Chanakya's book, the Arthashastra, shows how the state was run: officers for farming, trade, mines and tolls, and spies everywhere.<\/p><p>His grandson <b>Ashoka<\/b> made the empire bigger still. In 261 BCE he conquered Kalinga (in Odisha). The war killed and uprooted huge numbers of people, and Ashoka was filled with regret. He turned to Buddhism and decided to rule by dhamma (a code of good conduct): kindness, tolerance and care for people and animals.<\/p><p>To spread this message he had it carved on rocks and pillars across the land. These edicts are our best record of him, and one of his pillars, at Sarnath, gave India its National Emblem. After Ashoka the empire weakened, and in 185 BCE the last Maurya, Brihadratha, was killed by his own general, <b>Pushyamitra Sunga<\/b>. The tables cover the rulers, the edicts and the officials.<\/p>","key":"Chandragupta and Chanakya built the empire by force and planning; Ashoka, shaken by the Kalinga war, ruled by dhamma and carved it in stone."},{"k":"tl","title":"The dynasty in order","rows":[["322/321 BCE","<b>Chandragupta Maurya<\/b> founds the empire with Chanakya's help, defeating Dhanananda"],["305 BCE","Beats <b>Seleucus Nicator<\/b>; treaty gives him Kabul, Kandahar, Herat, Balochistan; marries Helena. Seleucus sends <b>Megasthenes<\/b> as envoy"],["298 BCE","Abdicates, turns Jain under <b>Bhadrabahu<\/b>, dies by <i>sallekhana<\/i> at <b>Shravanabelagola<\/b> (Karnataka)"],["298–273 BCE","<b>Bindusara<\/b> \"Amitraghata\" (slayer of foes); Greek envoy <b>Deimachus<\/b>"],["273/268–232 BCE","<b>Ashoka<\/b> \"Devanampiya Piyadassi\" — crowned 269 BCE"],["261 BCE","<b>Kalinga War<\/b> — described in his own <b>13th Rock Edict<\/b>; he turns to Buddhism (teacher Upagupta/Nigrodha)"],["250 BCE","<b>3rd Buddhist Council<\/b> at Pataliputra; sends son <b>Mahendra<\/b> and daughter <b>Sanghamitra<\/b> to Sri Lanka"],["185/184 BCE","Last ruler <b>Brihadratha<\/b> killed by his general <b>Pushyamitra Sunga<\/b>"]]},{"k":"facts","title":"Ashoka's inscriptions — the most asked table","rows":[["Script &amp; language","Mostly <b>Brahmi<\/b> in Prakrit; <b>Kharosthi<\/b> in the north-west (Shahbazgarhi, Mansehra); Greek &amp; Aramaic at Kandahar/Shar-i-Kuna"],["Deciphered by","<b>James Prinsep<\/b> (1837) — Brahmi"],["Major Rock Edicts","14 in number"],["Rock Edict XIII","Longest — the <b>Kalinga war<\/b> and remorse; names 5 Greek kings"],["Rock Edict XII","<b>Religious tolerance<\/b>"],["Rock Edict I","Bans animal sacrifice and festive gatherings"],["Rock Edict II","Medical help for men and animals"],["Minor Rock Edict (Maski &amp; Gujarra)","The only ones that use his personal name <b>\"Ashoka\"<\/b> — elsewhere he is \"Devanampiya Piyadassi\""],["Pillar Edict VII","Summary of his dhamma work — longest pillar edict"],["Rummindei / Lumbini pillar","Records his visit to Buddha's birthplace and tax relief for the village"],["Schism / Sarnath–Sanchi edict","Warns monks against splitting the Sangha"],["Queen's Edict","Mentions queen <b>Karuvaki<\/b>, mother of Tivara"],["Sarnath Lion Capital","<b>National Emblem<\/b> (adopted 26 Jan 1950); the <b>Ashoka Chakra<\/b> of 24 spokes from its abacus is on the flag"]]},{"k":"trick","h":"<b>Edict numbers<\/b> — \"<b>One<\/b> stops sacrifice, <b>Two<\/b> gives treatment, <b>Twelve<\/b> gives tolerance, <b>Thirteen<\/b> tells of Kalinga.\" Remember <span class=\"mn\">1-sacrifice, 2-doctor, 12-tolerance, 13-Kalinga<\/span>.<br><b>Only two edicts name \"Ashoka\"<\/b>: <span class=\"mn\">MG<\/span> = <b>M<\/b>aski, <b>G<\/b>ujarra (also Nittur &amp; Udegolam)."},{"k":"facts","title":"Mauryan administration (from the Arthashastra)","rows":[["Capital","Pataliputra; four provinces — Taxila, Ujjain, Suvarnagiri, Tosali (+ Kalinga later)"],["Provincial governor","<b>Kumara / Aryaputra<\/b> (usually a prince)"],["Sitadhyaksha","In charge of <b>crown/state agriculture<\/b>"],["Panyadhyaksha","<b>Commerce<\/b>"],["Akaradhyaksha","<b>Mines<\/b>"],["Lohadhyaksha","Metals / iron"],["Navadhyaksha","Ships / shipping"],["Sulkadhyaksha","<b>Tolls and customs<\/b>"],["Pautavadhyaksha","Weights and measures"],["Samsthadhyaksha","Markets"],["Sannidhata","<b>Treasurer<\/b>"],["Samaharta","<b>Chief revenue collector<\/b>"],["Rajjukas","Land measurement and justice in the districts"],["Dhamma Mahamatta","New post created by <b>Ashoka<\/b> to spread dhamma"],["Spies","<i>Gudhapurusha<\/i>; stationary = <b>Samstha<\/b>, wandering = <b>Sanchara<\/b>"],["Tax","<b>Bhaga<\/b> = 1/6 of produce; <b>Bali<\/b>, <b>Pindakara<\/b>, <b>Hiranya<\/b> (cash)"],["Coins","<b>Punch-marked silver<\/b> coins called <i>Pana<\/i> / Karshapana"]]},{"k":"facts","title":"Megasthenes' Indica — what SSC quotes","rows":[["He was","Greek ambassador of Seleucus at <b>Chandragupta Maurya's<\/b> court"],["Society","Said Indian society had <b>7 castes<\/b> (not 4) and that there was <b>no slavery<\/b>"],["City","Pataliputra was run by 6 committees of 5 members each; it had 64 gates and 570 towers"],["Army","Chandragupta's army: 6 lakh infantry, 30,000 cavalry, 9,000 elephants"]]},{"k":"trap","h":"Chandragupta Maurya became a <b>Jain<\/b>; Ashoka became a <b>Buddhist<\/b> — a favourite swap. Ashoka did <b>not<\/b> make Buddhism the state religion or stop ruling; his <i>dhamma<\/i> was a code of conduct. Brahmi was deciphered by <b>James Prinsep<\/b>, not William Jones. The Sarnath capital has <b>four lions<\/b>, and only <b>three are visible<\/b> in the emblem."}],"sum":["322 BCE Chandragupta + Chanakya beat Dhanananda; 305 BCE treaty with Seleucus; Megasthenes writes Indica. Chandragupta dies a Jain at Shravanabelagola.","Ashoka: crowned 269 BCE, Kalinga War 261 BCE (Rock Edict XIII), 3rd Buddhist Council 250 BCE at Pataliputra.","Edicts: I bans sacrifice, II medical aid, XII tolerance, XIII Kalinga. Only Maski & Gujarra name 'Ashoka'. Brahmi deciphered by James Prinsep, 1837.","Officials: Sitadhyaksha (agriculture), Panyadhyaksha (commerce), Akaradhyaksha (mines), Sulkadhyaksha (tolls), Sannidhata (treasury), Samaharta (revenue).","Last Maurya Brihadratha killed by Pushyamitra Sunga, 185 BCE. Sarnath Lion Capital = National Emblem."],"app":"histancient"},
{"id":"L6","g":"anc","heat":2,"title":"Post-Mauryan & the Sangam Age","hi":"मौर्योत्तर काल · संगम युग","blocks":[{"k":"hot","h":"Kanishka and the Gandhara/Mathura schools are the certainty here; add Satavahana coinage, Kharavela's Hathigumpha inscription, and Sangam literature (Tolkappiyam, Thirukkural)."},{"k":"story","h":"<p>When the Mauryan empire broke up, no single power held India. Many smaller dynasties took its place. Some were local, like the Sungas who replaced the Mauryas, and the <b>Satavahanas<\/b> in the Deccan. Others came in from the north-west: Indo-Greeks, Shakas and Kushanas. The greatest Kushana king, <b>Kanishka<\/b>, ruled from Purushapura (Peshawar) and started the Saka era of 78 CE, which India still uses as its national calendar.<\/p><p>With so many peoples meeting and trading, ideas mixed, and you can see it in art. For the first time the Buddha was carved as a human figure instead of a symbol. In <b>Gandhara<\/b> the style looked Greek, with wavy hair and folded robes in grey stone. In <b>Mathura<\/b> it was purely Indian, in red sandstone. Kings also left long inscriptions and new coins.<\/p><p>Meanwhile the far south had its own story. Three Tamil kingdoms, the Cheras, Cholas and Pandyas, traded pepper, cotton and pearls from busy ports. Poets met in assemblies called Sangams at Madurai, so this is the <b>Sangam Age<\/b>. Their works, like the Thirukkural, are the oldest Tamil literature. The tables list the dynasties, compare the art schools and map the Sangam kingdoms.<\/p>","key":"After the Mauryas many smaller kings, some from outside, ruled; their mixing gave new art in Gandhara and Mathura, while the Tamil south had its Sangam Age."},{"k":"table","title":"Dynasties after the Mauryas","head":["Dynasty","Founder / famous ruler","Must-know"],"rows":[["<b>Sunga<\/b> (185–73 BCE)","Pushyamitra Sunga","Capital Pataliputra/Vidisha; Patanjali in his court; <b>Sanchi &amp; Bharhut stupa railings<\/b>; Brahmanical revival"],["<b>Kanva<\/b> (73–28 BCE)","Vasudeva","Short-lived, ended by Satavahanas"],["<b>Satavahana<\/b> (1st c. BCE–2nd c. CE)","Simuka; greatest <b>Gautamiputra Satakarni<\/b>","Capital <b>Pratishthana/Paithan<\/b>; first to issue <b>lead<\/b> coins; land grants to Brahmins; Nasik &amp; Nanaghat inscriptions; <b>matrilineal names<\/b> (Gautamiputra, Vasishthiputra)"],["<b>Indo-Greek<\/b>","<b>Menander<\/b> (Milinda)","First to issue <b>gold coins<\/b> in India; turned Buddhist via Nagasena — <i>Milindapanho<\/i>"],["<b>Shaka<\/b> (Western Kshatrapas)","<b>Rudradaman I<\/b>","<b>Junagadh / Girnar inscription<\/b> — first long Sanskrit inscription; repaired Sudarshana lake. Shakas defeated by <b>Chandragupta II<\/b>"],["<b>Kushana<\/b> (1st–3rd c. CE)","Kujula Kadphises; greatest <b>Kanishka<\/b> (78 CE)","Capital <b>Purushapura (Peshawar)<\/b> &amp; Mathura; started the <b>Saka era (78 CE)<\/b>; 4th Buddhist Council; patron of Ashvaghosha, Charaka, Nagarjuna, Vasumitra; purest <b>gold coins<\/b>"],["<b>Chedi / Mahameghavahana<\/b>","<b>Kharavela<\/b> of Kalinga","<b>Hathigumpha inscription<\/b> (Udayagiri, Odisha); a Jain"]]},{"k":"table","title":"Gandhara vs Mathura school — the compare question","head":["Point","Gandhara","Mathura"],"rows":[["Influence","<b>Greek / Hellenistic<\/b>","Purely <b>indigenous<\/b>"],["Material","Blue-grey schist / stucco","<b>Red sandstone<\/b> (spotted, from Sikri)"],["Look","Wavy hair, muscular, Apollo-like, heavy drapery with folds","Heavy body, shaven head/ushnisha, thin clinging robe, smiling"],["Patron","Kushanas","Kushanas"],["Note","<b>First images of Buddha<\/b> made here (and at Mathura) — before this he was shown only by symbols","Also carved Jain and Hindu images"]]},{"k":"p","h":"The third school, <b>Amaravati<\/b> (Andhra, Satavahana), used <b>white marble<\/b> and favoured narrative panels of Buddha's life."},{"k":"facts","title":"Sangam Age (c. 300 BCE – 300 CE) — Tamilakam","rows":[["Three kingdoms","<b>Chera<\/b> (capital Vanji, port Muziris — pepper), <b>Chola<\/b> (Uraiyur, port Puhar/Kaveripattinam — cotton), <b>Pandya<\/b> (Madurai, port Korkai — pearls)"],["Sangams","Three assemblies of poets at Madurai under Pandya patronage"],["<b>Tolkappiyam<\/b>","Oldest Tamil work — grammar, by Tolkappiyar"],["<b>Thirukkural<\/b> / Kural","By <b>Thiruvalluvar<\/b> — \"the Tamil Veda\"; ethics in 1,330 couplets"],["Silappadikaram","Ilango Adigal — earliest Tamil epic"],["Manimekalai","Sattanar — Buddhist epic"],["Ettutogai / Pattuppattu","Eight anthologies &amp; ten idylls — the Sangam corpus"],["Famous ruler","<b>Karikala<\/b> (Chola) — won the battle of Venni; <b>Senguttuvan<\/b> (Chera); <b>Nedunjeliyan<\/b> (Pandya)"]]},{"k":"trick","h":"<b>Sangam capitals<\/b> — <span class=\"mn\">Che-Va, Cho-U, Pan-Ma<\/span>: <b>Che<\/b>ra–<b>Va<\/b>nji, <b>Cho<\/b>la–<b>U<\/b>raiyur, <b>Pan<\/b>dya–<b>Ma<\/b>durai. Ports: <b>M<\/b>uziris–<b>M<\/b>asala/pepper (Chera), <b>P<\/b>uhar–cotton (Chola), <b>K<\/b>orkai–pearls (Pandya)."},{"k":"trap","h":"The <b>Saka era (78 CE)<\/b> was started by <b>Kanishka<\/b> and is India's <b>national calendar<\/b> (adopted 22 March 1957). The <b>Vikrama Samvat (58 BCE)<\/b> is linked to Vikramaditya of Ujjain, and the <b>Gupta era (319–20 CE)<\/b> to Chandragupta I. Don't confuse them."}],"sum":["Sunga: Pushyamitra, Sanchi/Bharhut railings. Satavahana: Gautamiputra Satakarni, Paithan, first lead coins, matrilineal names.","Kanishka: Purushapura capital, Saka era 78 CE (India's national calendar), 4th Buddhist Council, purest gold coins, patron of Ashvaghosha & Charaka.","Rudradaman I: Junagadh/Girnar inscription — first long Sanskrit inscription. Kharavela: Hathigumpha inscription.","Gandhara = Greek style, grey schist. Mathura = indigenous, red sandstone. Amaravati = white marble.","Sangam: Chera-Vanji, Chola-Uraiyur, Pandya-Madurai. Tolkappiyam = oldest Tamil text; Thirukkural by Thiruvalluvar."],"app":"histancient"},
{"id":"L7","g":"anc","heat":3,"title":"Gupta Empire — the golden age","hi":"गुप्त साम्राज्य","blocks":[{"k":"hot","h":"Asked almost every shift: Samudragupta's <b>Allahabad/Prayag Prashasti<\/b> (and who wrote it), Chandragupta II's titles and his court's \"nine gems\", Aryabhata–Varahamihira–Sushruta, and Fa-Hien's visit."},{"k":"story","h":"<p>Around 320 CE a family from Magadha rose to unite much of north India again. These were the <b>Guptas<\/b>. Chandragupta I began their era and took the title of great king of kings. His son <b>Samudragupta<\/b> won so many wars that a historian later called him the Indian Napoleon; his court poet Harisena listed his victories on a pillar at Allahabad. Then <b>Chandragupta II<\/b>, called Vikramaditya, defeated the Shakas and made the empire rich and secure. (Do not mix him up with Chandragupta Maurya, who lived about 600 years earlier.)<\/p><p>Peace and wealth gave people time for learning and art, which is why this is called a golden age. <b>Aryabhata<\/b> said the earth turns and explained eclipses. Sushruta wrote on surgery. <b>Kalidasa<\/b> wrote plays and poems like Abhijnanashakuntalam. Stone temples began to rise, and the Guptas issued more gold coins than any earlier rulers. Kumaragupta I founded Nalanda, a great university. The Chinese pilgrim Fa-Hien visited and wrote about the land.<\/p><p>Later the Hunas attacked. Skandagupta beat them back, but weaker rulers followed, and the empire broke up by about 550 CE. The tables give the kings in order and match each scholar to his work.<\/p>","key":"The Gupta kings united the north, and the peace that followed produced a golden age of science, poetry and art."},{"k":"tl","title":"The Gupta line","rows":[["240 CE","<b>Sri Gupta<\/b> founds the family; son Ghatotkacha"],["319–335 CE","<b>Chandragupta I<\/b> — first great ruler; title <b>Maharajadhiraja<\/b>; married Lichchhavi princess <b>Kumaradevi<\/b>; started the <b>Gupta era (319–20 CE)<\/b>"],["335–375 CE","<b>Samudragupta<\/b> — \"<b>Indian Napoleon<\/b>\" (named so by V. A. Smith); <b>Allahabad Pillar Prashasti<\/b> by his court poet <b>Harisena<\/b>; performed Ashvamedha; issued the <b>Lyrist (veena-playing) coin<\/b>"],["375–415 CE","<b>Chandragupta II \"Vikramaditya\"<\/b> — destroyed the Shakas, took title <b>Shakari<\/b>; first Gupta to issue <b>silver<\/b> coins; <b>Fa-Hien<\/b> visited; <b>Mehrauli iron pillar<\/b> linked to \"Chandra\"; <b>nine gems (Navaratna)<\/b> in court"],["415–455 CE","<b>Kumaragupta I \"Mahendraditya\"<\/b> — founded <b>Nalanda University<\/b>; worshipped Kartikeya"],["455–467 CE","<b>Skandagupta<\/b> — beat the <b>Hunas<\/b>; repaired Sudarshana lake (Junagadh inscription)"],["~550 CE","Empire breaks up; last notable ruler Vishnugupta"]]},{"k":"facts","title":"Science, art and letters","rows":[["<b>Aryabhata<\/b>","<i>Aryabhatiya<\/i>, <i>Surya Siddhanta<\/i> — said the earth is round and rotates; explained eclipses; value of π"],["<b>Varahamihira<\/b>","<i>Panchasiddhantika<\/i>, <i>Brihat Samhita<\/i>, <i>Brihat Jataka<\/i> — astronomy, astrology"],["<b>Brahmagupta<\/b>","<i>Brahmasphuta Siddhanta<\/i> — <b>zero as a number<\/b>, gravity hint (7th c., post-Gupta)"],["<b>Sushruta<\/b>","<i>Sushruta Samhita<\/i> — surgery; \"father of plastic surgery\""],["<b>Charaka<\/b>","<i>Charaka Samhita<\/i> — medicine (Kushana period)"],["<b>Kalidasa<\/b>","<i>Abhijnanashakuntalam<\/i>, <i>Meghaduta<\/i>, <i>Raghuvamsha<\/i>, <i>Kumarasambhava<\/i>, <i>Malavikagnimitram<\/i>, <i>Ritusamhara<\/i>"],["Nine gems (Navaratna)","Kalidasa, Amarasimha, Dhanvantari, Varahamihira, Vararuchi, Ghatakarpara, Kshapanaka, Shanku, Vetala Bhatta"],["<b>Fa-Hien<\/b>","Chinese pilgrim, came under Chandragupta II; book <i>Fo-Kuo-Ki<\/i>; stayed 6 years; said there was no capital punishment"],["Art","Ajanta murals, Dashavatara temple at <b>Deogarh<\/b>, Bhitargaon brick temple, Udayagiri caves; <b>Nagara temple style<\/b> begins"],["Coins","<b>Dinara<\/b> — gold coins; Guptas issued the <b>largest number of gold coins<\/b> in ancient India"],["Land grant terms","<i>Agrahara<\/i> (to Brahmins, tax-free), <i>Devagrahara<\/i> (to temples), <i>Nivi-dharma<\/i>"]]},{"k":"trick","h":"<b>Gupta kings in order<\/b> — <span class=\"mn\">Sri-Gha-Cha-Sa-Cha-Ku-Ska<\/span>: Sri Gupta → Ghatotkacha → Chandragupta I → Samudragupta → Chandragupta II → Kumaragupta → Skandagupta.<br><b>Traveller ↔ king<\/b>: <b>Fa<\/b>-Hien → <b>Cha<\/b>ndragupta II (<i>Fa for Four-hundred CE<\/i>); <b>Hiuen Tsang<\/b> → <b>Harsha<\/b> (both H); <b>I-tsing<\/b> → late 7th c."},{"k":"trap","h":"<b>Chandragupta Maurya<\/b> (322 BCE, Mauryan) ≠ <b>Chandragupta I/II<\/b> (Gupta) — SSC mixes these constantly. The <b>Allahabad Prashasti<\/b> is Samudragupta's, written by <b>Harisena<\/b>, and it is engraved on an <b>Ashokan pillar<\/b>. Nalanda was founded by <b>Kumaragupta I<\/b>, not Harsha (Harsha only patronised it)."}],"sum":["Chandragupta I started the Gupta era (319–20 CE), title Maharajadhiraja. Samudragupta = Indian Napoleon; Allahabad Prashasti by Harisena; Lyrist coin.","Chandragupta II Vikramaditya: beat the Shakas (title Shakari), first silver coins, Fa-Hien visited, nine gems in court.","Kumaragupta I founded Nalanda. Skandagupta defeated the Hunas.","Aryabhata (earth rotates), Varahamihira, Sushruta (surgery), Brahmagupta (zero). Kalidasa wrote Abhijnanashakuntalam and Meghaduta.","Gupta gold coins = Dinara, the largest number of gold coins in ancient India; Nagara temple style begins."],"app":"histancient"},
{"id":"L8","g":"anc","heat":2,"title":"Harsha & the southern kingdoms","hi":"हर्षवर्धन · दक्षिण भारत","blocks":[{"k":"hot","h":"Harsha + Hiuen Tsang is a standard pair. In the south, learn the temple-building credit: Pallava = Mahabalipuram, Rashtrakuta = Ellora Kailasa, Chola = Brihadeshwara, Chandela = Khajuraho, Solanki = Dilwara."},{"k":"story","h":"<p>After the Guptas, <b>Harshavardhana<\/b> was the last great king to unite much of north India, ruling from Kannauj from 606 CE. We know him well thanks to two writers. His court poet <b>Banabhatta<\/b> wrote his life story, the Harshacharita. The Chinese pilgrim <b>Hiuen Tsang<\/b> stayed for years, studied at Nalanda and described Harsha's kingdom. But Harsha could not conquer the south: the Chalukya king Pulakeshin II stopped him on the Narmada river.<\/p><p>That defeat points to the bigger picture. Power was now spread among many regional kingdoms. They fought each other, but they also competed to build splendid temples. That is why this lesson is really a list of builders. The Pallavas carved the temples at Mahabalipuram. The Rashtrakutas cut the Kailasa temple at Ellora out of a single rock. The <b>Cholas<\/b> built the giant Brihadeshwara temple at Thanjavur and sent a navy across the sea; their villages even elected their own assemblies.<\/p><p>Further north, the Palas, Pratiharas and Rashtrakutas spent years fighting over Kannauj. The Chandelas built Khajuraho and the Eastern Gangas built Konark. The tables pair each dynasty with its capital, its great king and its famous temple.<\/p>","key":"Harsha was the last big northern king; after him regional dynasties competed, and each is remembered by the temple it built."},{"k":"facts","title":"Harshavardhana (606–647 CE)","rows":[["Dynasty &amp; capital","<b>Pushyabhuti / Vardhana<\/b> dynasty; capital shifted from Thanesar to <b>Kannauj<\/b>"],["Titles","<b>Siladitya<\/b>; last great ruler of ancient north India"],["Biographer","<b>Banabhatta<\/b> — <i>Harshacharita<\/i> and <i>Kadambari<\/i>"],["Chinese visitor","<b>Hiuen Tsang (Xuanzang)<\/b>, 629–645 CE; book <i>Si-Yu-Ki<\/i>; called \"Prince of Pilgrims\"; studied at Nalanda"],["His own plays","<i>Nagananda<\/i>, <i>Ratnavali<\/i>, <i>Priyadarshika<\/i>"],["Defeat","Beaten by <b>Pulakeshin II<\/b> (Chalukya) on the Narmada — recorded in the <b>Aihole inscription<\/b> (by Ravikirti)"],["Assemblies","Kannauj assembly (643 CE) and Prayag assembly (every 5 years, gave away all wealth)"]]},{"k":"table","title":"Southern & regional dynasties — who built what","head":["Dynasty","Capital","Greatest ruler","Famous for"],"rows":[["<b>Pallava<\/b>","Kanchipuram","<b>Narasimhavarman I \"Mamalla\"<\/b>","<b>Mahabalipuram<\/b> rathas &amp; Shore temple; Dravidian style begins; beat Pulakeshin II"],["<b>Chalukya of Badami<\/b>","Vatapi / Badami","<b>Pulakeshin II<\/b>","<b>Aihole<\/b>, Badami &amp; Pattadakal temples; Vesara style; defeated Harsha"],["<b>Rashtrakuta<\/b>","Manyakheta","<b>Amoghavarsha<\/b> (wrote <i>Kavirajamarga<\/i>), Krishna I","<b>Kailasa temple, Ellora<\/b> (Krishna I); Elephanta caves"],["<b>Chola<\/b>","Thanjavur / Gangaikondacholapuram","<b>Rajaraja I<\/b> &amp; <b>Rajendra I<\/b>","<b>Brihadeshwara temple<\/b> (Rajaraja I); navy took Sri Lanka &amp; SE Asia; <b>local self-government<\/b> (Ur, Sabha/Mahasabha, Nagaram); Uttaramerur inscription; bronze <b>Nataraja<\/b>"],["<b>Pala<\/b>","Munger/Pataliputra","Dharmapala, Devapala","Founded <b>Vikramashila<\/b> university; Buddhism's last royal patrons"],["<b>Pratihara<\/b>","Kannauj","Mihir Bhoja","Fought the \"tripartite struggle\" for Kannauj with Palas &amp; Rashtrakutas"],["<b>Chandela<\/b>","Khajuraho","Dhanga, Vidyadhara","<b>Khajuraho temples<\/b> (Kandariya Mahadeva)"],["<b>Solanki / Chalukya of Gujarat<\/b>","Anhilwara","Bhima I, Kumarapala","<b>Dilwara Jain temples<\/b>, Modhera Sun temple, Rani ki Vav"],["<b>Eastern Ganga<\/b>","Kalinga","Narasimhadeva I, Anantavarman","<b>Konark Sun temple<\/b> (Narasimhadeva I), Jagannath Puri temple"],["<b>Sena<\/b>","Bengal","Lakshmanasena","Jayadeva's <i>Gita Govinda<\/i>; ended by Bakhtiyar Khalji"]]},{"k":"trick","h":"<b>Temple ↔ dynasty<\/b> — <span class=\"mn\">Ma-Pa, Ka-Ra, Bri-Cho, Kha-Cha, Di-So, Ko-Ga<\/span>: <b>Ma<\/b>habalipuram–<b>Pa<\/b>llava, <b>Ka<\/b>ilasa–<b>Ra<\/b>shtrakuta, <b>Bri<\/b>hadeshwara–<b>Cho<\/b>la, <b>Kha<\/b>juraho–<b>Cha<\/b>ndela, <b>Di<\/b>lwara–<b>So<\/b>lanki, <b>Ko<\/b>nark–Eastern <b>Ga<\/b>nga."},{"k":"facts","title":"Ancient universities","rows":[["Nalanda","Bihar; founded by <b>Kumaragupta I<\/b>; destroyed by Bakhtiyar Khalji (1193); UNESCO site"],["Vikramashila","Bihar; founded by <b>Dharmapala<\/b> (Pala)"],["Takshashila","Now in Pakistan; oldest; Chanakya and Charaka linked to it"],["Valabhi","Gujarat; Maitraka patronage; I-tsing studied here"],["Odantapuri","Bihar; Pala period; oldest Mahavihara of Bihar"]]},{"k":"trap","h":"<b>Chola local self-government<\/b> is the standard answer for \"village administration\" in ancient India — the Uttaramerur inscription records how village assemblies were elected. Note that the <b>Kailasa temple at Ellora is rock-cut<\/b> (carved top-down from one rock) while Brihadeshwara is built up from blocks."}],"sum":["Harsha: Vardhana dynasty, capital Kannauj; Banabhatta wrote Harshacharita; Hiuen Tsang visited (Si-Yu-Ki); beaten by Pulakeshin II (Aihole inscription).","Mahabalipuram = Pallava; Kailasa Ellora = Rashtrakuta (Krishna I); Brihadeshwara = Chola (Rajaraja I); Khajuraho = Chandela; Dilwara = Solanki; Konark = Eastern Ganga.","Cholas: strong navy, bronze Nataraja, famous village self-government (Uttaramerur inscription).","Nalanda — Kumaragupta I; Vikramashila — Dharmapala; Takshashila the oldest.","Tripartite struggle for Kannauj: Palas vs Pratiharas vs Rashtrakutas."],"app":"histancient"},
{"id":"L9","g":"med","heat":2,"title":"Arab & Turkish invasions","hi":"अरब एवं तुर्क आक्रमण","blocks":[{"k":"hot","h":"Short but certain: 712 Sindh, Mahmud of Ghazni's 17 raids and Somnath, and the <b>three battles of Tarain<\/b> with their years and winners."},{"k":"story","h":"<p>India's wealth drew attention from the west. In 712 CE an Arab general, <b>Muhammad bin Qasim<\/b>, conquered Sindh by defeating Raja Dahir. But the Arabs did not push further in. The bigger push came about 300 years later, from Turks based in Afghanistan.<\/p><p><b>Mahmud of Ghazni<\/b> raided India 17 times between 1000 and 1027. He was not trying to rule India; he wanted its riches. Temples held great treasure, so he looted them, including Somnath in 1025, and carried the wealth home. A scholar who came with him, Al-Beruni, wrote a careful book about India. The kings of the north were brave, but they were divided and rarely stood together.<\/p><p>Then came <b>Muhammad Ghori<\/b>, who wanted land, not just loot. At Tarain in 1191 he was beaten by the Rajput king <b>Prithviraj Chauhan<\/b>. He came back the next year, 1192, and won. In 1194 he defeated Jaichand of Kannauj at Chandawar. When Ghori died in 1206, his slave-general Qutb-ud-din Aibak stayed on and founded the Delhi Sultanate. So raids for treasure slowly turned into rule. The timeline shows each step with its year.<\/p>","key":"Arabs took Sindh, Mahmud raided for wealth, and Ghori's win at Tarain in 1192 turned raids into lasting Turkish rule."},{"k":"tl","title":"How the Turks came in","rows":[["<b>712 CE<\/b>","<b>Muhammad bin Qasim<\/b> conquers <b>Sindh<\/b>, defeating Raja Dahir — the first Arab conquest. Sindh is called \"the gateway of Islam in India\"; Chachnama records it"],["1000–1027","<b>Mahmud of Ghazni<\/b> raids India <b>17 times<\/b>; sacked <b>Somnath (1025)<\/b>; brought <b>Al-Beruni<\/b>, who wrote <i>Kitab-ul-Hind / Tahqiq-i-Hind<\/i>; Firdausi (<i>Shahnama<\/i>) was his court poet"],["1191","<b>First Battle of Tarain<\/b> — <b>Prithviraj Chauhan beats Muhammad Ghori<\/b>"],["1192","<b>Second Battle of Tarain<\/b> — <b>Ghori beats Prithviraj Chauhan<\/b>; the real foundation of Turkish rule"],["1194","<b>Battle of Chandawar<\/b> — Ghori beats <b>Jaichand<\/b> of Kannauj"],["1206","Ghori dies; his slave <b>Qutb-ud-din Aibak<\/b> founds the Delhi Sultanate"]]},{"k":"trick","h":"<b>Tarain<\/b> — \"<b>First to Prithviraj, Second to the Sultan<\/b>\": 1191 → <b>P<\/b>rithviraj wins; 1192 → <b>G<\/b>hori wins. One digit apart, opposite results.<br>Also: <span class=\"mn\">1191-1192-1194<\/span> = Tarain I, Tarain II, Chandawar — three straight."},{"k":"facts","title":"Also asked","rows":[["Prithviraj Raso","By <b>Chand Bardai<\/b> — on Prithviraj Chauhan"],["Taj-ul-Maasir","By <b>Hasan Nizami<\/b> — first official history of the Sultanate"],["Tabaqat-i-Nasiri","By <b>Minhaj-us-Siraj<\/b>"],["Al-Beruni","Came with Mahmud of Ghazni; \"first anthropologist of India\""],["Bakhtiyar Khalji","Conquered Bihar &amp; Bengal; destroyed <b>Nalanda<\/b> (1193)"]]}],"sum":["712 CE: Muhammad bin Qasim conquers Sindh (beat Raja Dahir).","Mahmud of Ghazni: 17 raids, sacked Somnath 1025; brought Al-Beruni (Kitab-ul-Hind).","Tarain I 1191 — Prithviraj wins. Tarain II 1192 — Ghori wins. Chandawar 1194 — Ghori beats Jaichand.","Prithviraj Raso by Chand Bardai. Nalanda destroyed by Bakhtiyar Khalji, 1193."],"app":"histmedieval"},
{"id":"L10","g":"med","heat":3,"title":"Delhi Sultanate I — Slave & Khalji","hi":"दिल्ली सल्तनत · गुलाम एवं ख़िलजी","blocks":[{"k":"hot","h":"Heavily asked. Fix in your head: who built Qutub Minar vs who finished it, Iltutmish's <i>Iqta<\/i> and coins, Razia as the <b>only woman<\/b> Sultan, Balban's <i>Sijda<\/i>/<i>Paibos<\/i>, and Alauddin Khalji's market control + <b>first permanent standing army<\/b>."},{"k":"story","h":"<p>In 1206 Muhammad Ghori's slave-general <b>Qutb-ud-din Aibak<\/b> became the first Sultan of Delhi. For the next 320 years five dynasties ruled from Delhi: Slave, Khalji, Tughlaq, Sayyid and Lodi. This lesson covers the first two. Aibak ruled from Lahore and began the Qutub Minar, but he died within a few years, after a fall while playing polo.<\/p><p>The real builder of the Sultanate was <b>Iltutmish<\/b>. He moved the capital to Delhi, finished the Qutub Minar, issued silver and copper coins, and paid his officers with iqtas (land whose tax they could collect instead of a salary). His daughter <b>Razia<\/b> became the only woman ever to rule Delhi. Later Balban crushed the proud group of forty nobles and taught that the king was the shadow of God, making people bow and kiss his feet.<\/p><p>The Khaljis took over in 1290. <b>Alauddin Khalji<\/b> faced repeated Mongol attacks, so he needed a big army all the time. To pay for it cheaply, he fixed market prices, paid soldiers in cash, branded horses to stop cheating, and raised land tax to half the crop. His general Malik Kafur led campaigns deep into the south. The tables go ruler by ruler, so you can match each reform to the right Sultan.<\/p>","key":"Iltutmish built the Sultanate's system, Balban made the Sultan feared, and Alauddin fixed prices to pay a big army against the Mongols."},{"k":"table","title":"Five dynasties of the Delhi Sultanate (1206–1526)","head":["Dynasty","Years","Founder","Last ruler"],"rows":[["<b>Slave / Mamluk / Ilbari<\/b>","1206–1290","Qutb-ud-din Aibak","Kayumars (Shamsuddin)"],["<b>Khalji<\/b>","1290–1320","Jalal-ud-din Khalji","Khusrau Khan"],["<b>Tughlaq<\/b>","1320–1414","Ghiyas-ud-din Tughlaq","Nasir-ud-din Mahmud"],["<b>Sayyid<\/b>","1414–1451","Khizr Khan","Alam Shah"],["<b>Lodi<\/b>","1451–1526","Bahlol Lodi","Ibrahim Lodi"]]},{"k":"trick","h":"<b>Five dynasties in order<\/b> — <span class=\"mn\">SKTSL<\/span> = \"<b>S<\/b>lave <b>K<\/b>ings <b>T<\/b>ook <b>S<\/b>ultanate's <b>L<\/b>and\": Slave, Khalji, Tughlaq, Sayyid, Lodi."},{"k":"facts","title":"Slave dynasty — ruler by ruler","rows":[["<b>Qutb-ud-din Aibak<\/b> (1206–10)","Founder; capital <b>Lahore<\/b>; began the <b>Qutub Minar<\/b> (for Khwaja Qutbuddin Bakhtiyar Kaki) and built <b>Quwwat-ul-Islam mosque<\/b> &amp; <b>Adhai Din ka Jhonpra<\/b> (Ajmer); called <b>Lakh Baksh<\/b> (giver of lakhs); died playing <i>chaugan<\/i> (polo) at Lahore"],["<b>Aram Shah<\/b> (1210–11)","Weak; removed"],["<b>Iltutmish<\/b> (1211–36)","Real consolidator; shifted capital to <b>Delhi<\/b>; <b>completed the Qutub Minar<\/b>; started the <b>Iqta<\/b> system; issued the silver <b>Tanka<\/b> and copper <b>Jital<\/b>; created the <b>Turkan-i-Chahalgani<\/b> (corps of forty); got the <i>khilat<\/i> (letter of recognition) from the Caliph in 1229; built Hauz-i-Shamsi &amp; Sultan Ghari (first Islamic mausoleum in India)"],["<b>Razia Sultan<\/b> (1236–40)","<b>Only woman<\/b> to rule Delhi; raised Jamal-ud-din Yaqut; killed near Kaithal"],["<b>Balban<\/b> (1266–87)","Crushed the Chahalgani; theory of <b>kingship as divine<\/b> — titles <b>Zil-i-Ilahi<\/b> (shadow of God) and <b>Niyabat-i-Khudai<\/b>; court customs <b>Sijda<\/b> (prostration) &amp; <b>Paibos<\/b> (kissing the feet); Persian <b>Nauroz<\/b> festival; policy of \"blood and iron\"; set up the <b>Diwan-i-Arz<\/b> (military department); poet <b>Amir Khusrau<\/b> began here"],["<b>Kaiqubad / Kayumars<\/b>","End of the dynasty, 1290"]]},{"k":"facts","title":"Khalji dynasty","rows":[["<b>Jalal-ud-din Khalji<\/b> (1290–96)","Founder; mild policy"],["<b>Alauddin Khalji<\/b> (1296–1316)","Title <b>Sikandar-i-Sani<\/b> (Second Alexander); the strongest Sultan"],["Market control","Four separate markets &amp; the <i>Diwan-i-Riyasat<\/i> under <b>Shahna-i-Mandi<\/b>; fixed prices; <b>first to pay soldiers in cash<\/b>"],["Army","<b>First permanent standing army<\/b> in India; branding of horses (<b>dagh<\/b>) and descriptive muster roll (<b>huliya/chehra<\/b>)"],["Revenue","Land measured (<b>zabti<\/b>); tax raised to <b>50% of produce<\/b>; taxes on grazing (<i>charai<\/i>) and houses (<i>ghari<\/i>)"],["Conquests","Gujarat, Ranthambore, Chittor (1303), Malwa, Devagiri, Warangal, Madurai — south campaigns led by <b>Malik Kafur<\/b>"],["Mongols","Repeatedly defeated them; built the <b>Siri fort<\/b> and <b>Alai Darwaza<\/b>; Hauz Khas"],["Court","<b>Amir Khusrau<\/b> (\"Parrot of India\", <i>Tuti-i-Hind<\/i>); <b>Barani<\/b>'s <i>Tarikh-i-Firozshahi<\/i> describes his reign"]]},{"k":"trap","h":"Qutub Minar: <b>begun<\/b> by Aibak, <b>completed<\/b> by Iltutmish, <b>repaired<\/b> by Firoz Shah Tughlaq after lightning. Aibak's capital was <b>Lahore<\/b>, Iltutmish moved it to <b>Delhi<\/b>. The <b>Iqta<\/b> system is Iltutmish's, the <b>market control<\/b> is Alauddin's, the <b>token currency<\/b> is Muhammad bin Tughlaq's — never mix these three."}],"sum":["Dynasties SKTSL: Slave (1206) → Khalji (1290) → Tughlaq (1320) → Sayyid (1414) → Lodi (1451–1526).","Aibak: founder, capital Lahore, began Qutub Minar, built Quwwat-ul-Islam & Adhai Din ka Jhonpra, called Lakh Baksh.","Iltutmish: capital Delhi, completed Qutub Minar, Iqta system, silver Tanka & copper Jital, Chahalgani.","Razia Sultan — the only woman ruler of Delhi. Balban: Zil-i-Ilahi, Sijda & Paibos, blood and iron, Diwan-i-Arz.","Alauddin Khalji: Sikandar-i-Sani, market control under Shahna-i-Mandi, first permanent standing army, dagh & huliya, tax at 50%; Malik Kafur led the southern campaigns."],"app":"histmedieval"},
{"id":"L11","g":"med","heat":3,"title":"Delhi Sultanate II — Tughlaq to Lodi","hi":"तुग़लक़ से लोदी","blocks":[{"k":"hot","h":"Muhammad bin Tughlaq's \"five failed experiments\" and Firoz Shah's canals/jizya are repeat favourites. Also: who shifted the capital where, who was called a mixture of opposites, and the end of the Sultanate in 1526."},{"k":"story","h":"<p>The Tughlaqs came to power in 1320. <b>Muhammad bin Tughlaq<\/b> was clever and learned, but his bold plans kept failing. He moved the capital from Delhi to Devagiri, renamed Daulatabad, and then back again. He issued cheap brass and copper coins to be used like silver, but people forged them at home and the plan collapsed. He raised taxes in the Doab during a famine, and people rebelled. A historian called him a mixture of opposites. The Moroccan traveller Ibn Battuta saw his rule.<\/p><p>The next Sultan, <b>Firoz Shah Tughlaq<\/b>, chose a calmer path. He dug canals, built towns like Hisar and Jaunpur, and set up departments for charity and slaves. But he also made iqtas hereditary, and the Sultan's grip loosened. In 1398 the Central Asian conqueror <b>Timur<\/b> sacked Delhi, and the Sultanate never fully recovered.<\/p><p>Two short dynasties followed. Khizr Khan, Timur's deputy, founded the Sayyids. The Lodis were the first Afghan rulers of Delhi; Sikandar Lodi founded Agra. The last Sultan, <b>Ibrahim Lodi<\/b>, was defeated and killed by Babur at the First Battle of Panipat in 1526. That ended the Sultanate. The tables list each Sultan's work and the Sultanate's departments.<\/p>","key":"Muhammad bin Tughlaq's failed experiments and Timur's raid of 1398 weakened Delhi until Babur ended the Sultanate at Panipat in 1526."},{"k":"facts","title":"Tughlaq dynasty (1320–1414)","rows":[["<b>Ghiyas-ud-din Tughlaq<\/b> (1320–25)","Founder; built <b>Tughlaqabad<\/b>; died when a pavilion collapsed at Afghanpur"],["<b>Muhammad bin Tughlaq<\/b> (1325–51)","The learned but unlucky Sultan — Barani called him \"a mixture of opposites\"; <b>Ibn Battuta<\/b> (Morocco) visited and was made Qazi of Delhi (<i>Rehla<\/i>)"],["Experiment 1","Shifted the capital from Delhi to <b>Devagiri → renamed Daulatabad<\/b> (1327), then back"],["Experiment 2","<b>Token currency<\/b> of brass/copper (1329–30) at the value of silver — forged everywhere, withdrawn"],["Experiment 3","Raised taxes in the <b>Doab<\/b> during a famine — rebellion"],["Experiment 4","Khurasan &amp; Qarachil (Kumaon) expeditions — both failed"],["Experiment 5","Created the <b>Diwan-i-Kohi<\/b> — a department of agriculture to extend cultivation"],["<b>Firoz Shah Tughlaq<\/b> (1351–88)","Built <b>Firozabad, Fatehabad, Hisar, Jaunpur<\/b>; dug <b>five canals<\/b> (largest from Yamuna to Hisar); set up the <b>Diwan-i-Khairat<\/b> (charity) and <b>Diwan-i-Bandagan<\/b> (slaves); <b>first to levy jizya on Brahmins<\/b>; made iqtas hereditary; wrote <i>Futuhat-i-Firozshahi<\/i>; shifted two Ashokan pillars to Delhi; repaired the Qutub Minar"],["<b>1398<\/b>","<b>Timur<\/b> invades and sacks Delhi under Nasir-ud-din Mahmud Shah"]]},{"k":"trick","h":"<b>MBT's failures<\/b> — <span class=\"mn\">CAT-DD<\/span>: <b>C<\/b>apital shift, <b>A<\/b>griculture dept (Diwan-i-Kohi), <b>T<\/b>oken currency, <b>D<\/b>oab taxes, <b>D<\/b>istant campaigns (Khurasan/Qarachil).<br><b>Firoz = Farmer<\/b> → canals, gardens, towns. <b>MBT = Money<\/b> → token currency."},{"k":"facts","title":"Sayyid & Lodi","rows":[["<b>Khizr Khan<\/b> (1414)","Founded the Sayyid dynasty; Timur's deputy, never took the title Sultan"],["<b>Bahlol Lodi<\/b> (1451)","Founded the Lodi dynasty — the <b>first Afghan<\/b> dynasty of Delhi"],["<b>Sikandar Lodi<\/b> (1489–1517)","Founded <b>Agra (1504)<\/b> and shifted the capital there; introduced the <b>Gaz-i-Sikandari<\/b> (yard) for measuring land; wrote under the pen name <i>Gulrukhi<\/i>"],["<b>Ibrahim Lodi<\/b> (1517–26)","Lost the <b>First Battle of Panipat (21 April 1526)<\/b> to <b>Babur<\/b> — the only Delhi Sultan killed on the battlefield"]]},{"k":"facts","title":"Sultanate administration — the exam words","rows":[["Diwan-i-Wizarat","Finance, under the <b>Wazir<\/b>"],["Diwan-i-Arz","Military (Balban)"],["Diwan-i-Insha","Royal correspondence"],["Diwan-i-Risalat","Religious / appeals &amp; foreign affairs"],["Diwan-i-Kohi","Agriculture (Muhammad bin Tughlaq)"],["Diwan-i-Khairat","Charity (Firoz Shah)"],["Diwan-i-Bandagan","Slaves (Firoz Shah)"],["Diwan-i-Mustakharaj","Arrears of revenue (Alauddin Khalji)"],["Iqta","Land assignment for salary; holder = <b>Iqtadar / Muqti<\/b>"],["Khalisa","Land kept directly under the crown"],["Kharaj","Land tax on Muslims (1/3 to 1/2); <b>Jizya<\/b> = tax on non-Muslims; <b>Zakat<\/b> = 2.5% on Muslims; <b>Khums<\/b> = 1/5 share of war booty"],["Barid / Munhiyan","Intelligence officers / news-writers"]]},{"k":"trap","h":"Token currency = <b>Muhammad bin Tughlaq<\/b>, not Firoz Shah. Capital at <b>Daulatabad<\/b> = Muhammad bin Tughlaq; capital at <b>Agra<\/b> = Sikandar Lodi. Firoz Shah was the <b>first to charge jizya from Brahmins<\/b> — jizya itself existed earlier. Timur invaded in <b>1398<\/b>, not 1526; Babur came in 1526."}],"sum":["Ghiyas-ud-din built Tughlaqabad. Muhammad bin Tughlaq: capital to Daulatabad, token currency, Doab tax rise, Khurasan/Qarachil, Diwan-i-Kohi; Ibn Battuta visited.","Firoz Shah Tughlaq: five canals, Firozabad/Hisar/Jaunpur, Diwan-i-Khairat & Diwan-i-Bandagan, first to take jizya from Brahmins, wrote Futuhat-i-Firozshahi.","Timur invaded Delhi in 1398. Khizr Khan founded the Sayyid dynasty (1414); Bahlol Lodi the Lodi (1451) — first Afghan dynasty.","Sikandar Lodi founded Agra (1504) and introduced Gaz-i-Sikandari. Ibrahim Lodi died at the First Battle of Panipat, 21 April 1526.","Departments: Wizarat (finance), Arz (army), Insha (letters), Risalat (religion), Kohi (agriculture), Khairat (charity), Bandagan (slaves)."],"app":"histmedieval"},
{"id":"L12","g":"med","heat":2,"title":"Vijayanagara, Bahmani & regional kingdoms","hi":"विजयनगर · बहमनी · क्षेत्रीय राज्य","blocks":[{"k":"hot","h":"Krishnadeva Raya + the Battle of Talikota are near-certain; add the foreign travellers who visited Vijayanagara and the \"who built which regional monument\" line."},{"k":"story","h":"<p>While Delhi was weakening in the 14th century, new kingdoms rose in the south. In 1336 the brothers <b>Harihara and Bukka<\/b> founded Vijayanagara on the Tungabhadra river, with its capital at Hampi. In 1347 Alauddin Hasan Bahman Shah founded the <b>Bahmani<\/b> kingdom just to the north. For nearly two hundred years these two neighbours fought each other.<\/p><p>Vijayanagara reached its peak under <b>Krishnadeva Raya<\/b> (1509 to 1529). He was a warrior, a poet in Telugu and a temple builder. Foreign visitors, like the Portuguese Domingo Paes, wrote about the city's wealth. The Bahmani kingdom had a great minister, <b>Mahmud Gawan<\/b>, but after he was executed on a false charge the kingdom broke into five sultanates: Bijapur, Ahmadnagar, Golconda, Berar and Bidar.<\/p><p>These five sultanates usually quarrelled among themselves. But in 1565 they joined hands against Vijayanagara and crushed it at the <b>Battle of Talikota<\/b>. Their own monuments still stand, like the Gol Gumbaz at Bijapur and the Charminar at Hyderabad. Elsewhere, regional rulers such as Rana Kumbha of Mewar and Zain-ul-Abidin of Kashmir ran their own states. The tables sort these kingdoms, their rulers and their buildings.<\/p>","key":"Vijayanagara and the Bahmanis fought for two centuries; the Bahmanis split into five sultanates, which together broke Vijayanagara at Talikota in 1565."},{"k":"facts","title":"Vijayanagara (1336–1646)","rows":[["Founded","<b>1336<\/b> by <b>Harihara I &amp; Bukka Raya<\/b> (Sangama dynasty) on the <b>Tungabhadra<\/b>; capital <b>Hampi<\/b> — UNESCO site"],["Four dynasties","<b>Sangama → Saluva → Tuluva → Aravidu<\/b>"],["<b>Krishnadeva Raya<\/b> (1509–29)","Greatest ruler, Tuluva dynasty; wrote <b><i>Amuktamalyada<\/i><\/b> in Telugu; patron of the <b>Ashtadiggajas<\/b> (eight Telugu poets, incl. Allasani Peddana); built the <b>Vittalaswamy<\/b> &amp; <b>Hazara Rama<\/b> temples; Portuguese envoy <b>Domingo Paes<\/b> at his court"],["<b>Battle of Talikota / Rakshasa-Tangadi<\/b>","<b>1565<\/b> — the Deccan sultanates crushed Vijayanagara under <b>Ramaraya<\/b> (Aravidu)"],["Travellers who came","<b>Nicolo Conti<\/b> (Italian, Devaraya I), <b>Abdur Razzaq<\/b> (Persian, Devaraya II), <b>Domingo Paes<\/b> &amp; <b>Nuniz<\/b> (Portuguese), <b>Athanasius Nikitin<\/b> (Russian, Bahmani)"],["Administration","Province = <b>Mandalam/Rajya<\/b> under a Nayaka; the <b>Amara-nayaka<\/b> (military fief) system; gold coin = <b>Varaha / Pagoda<\/b>"]]},{"k":"facts","title":"Bahmani kingdom (1347–1526)","rows":[["Founded","<b>1347<\/b> by <b>Alauddin Hasan Bahman Shah<\/b> (Hasan Gangu); capital <b>Gulbarga<\/b>, later <b>Bidar<\/b>"],["Great minister","<b>Mahmud Gawan<\/b> — built the Madrasa at Bidar; executed on a false charge, after which the kingdom broke up"],["Broke into five","<b>Bijapur (Adil Shahi), Golconda (Qutb Shahi), Ahmadnagar (Nizam Shahi), Berar (Imad Shahi), Bidar (Barid Shahi)<\/b>"],["Monuments","<b>Gol Gumbaz<\/b>, Bijapur (Muhammad Adil Shah) — one of the largest domes in the world; <b>Charminar<\/b>, Hyderabad (Quli Qutb Shah, 1591); <b>Ibrahim Rauza<\/b>, Bijapur"]]},{"k":"trick","h":"<b>Five Deccan sultanates<\/b> — <span class=\"mn\">BAGHB<\/span>: <b>B<\/b>ijapur, <b>A<\/b>hmadnagar, <b>G<\/b>olconda, <b>B<\/b>erar, <b>B<\/b>idar. Their houses: Adil, Nizam, Qutb, Imad, Barid.<br><b>Vijayanagara dynasties<\/b> — <span class=\"mn\">SA-SA-TU-AR<\/span>: Sangama, Saluva, Tuluva, Aravidu."},{"k":"table","title":"Other regional kingdoms","head":["Kingdom","Ruler to remember","For"],"rows":[["<b>Malwa<\/b> (Mandu)","Hoshang Shah","Jama Masjid, Hindola Mahal; Baz Bahadur &amp; Rupmati"],["<b>Gujarat<\/b>","Ahmad Shah I","Founded <b>Ahmedabad (1411)<\/b>; Mahmud Begarha built Champaner"],["<b>Jaunpur<\/b> (Sharqi)","Ibrahim Sharqi","Atala Masjid; a centre of learning — \"Shiraz of India\""],["<b>Bengal<\/b>","Alauddin Husain Shah","Patron of Bengali; Chaitanya's time"],["<b>Kashmir<\/b>","<b>Zain-ul-Abidin<\/b>","\"<b>Akbar of Kashmir<\/b>\"; abolished jizya, promoted shawl weaving &amp; papier-mâché"],["<b>Mewar<\/b>","<b>Rana Kumbha<\/b> (Vijaya Stambha, Chittor), <b>Rana Sanga<\/b>, <b>Maharana Pratap<\/b>","Rana Sanga lost at <b>Khanwa (1527)<\/b>; Pratap fought <b>Haldighati (1576)<\/b>"],["<b>Marwar<\/b>","Rao Jodha","Founded Jodhpur; Mehrangarh fort"],["<b>Amber<\/b>","Man Singh","Akbar's general"]]},{"k":"trap","h":"Talikota (<b>1565<\/b>) destroyed Vijayanagara — it is not a Mughal battle. Hampi and Vijayanagara are the <b>same city<\/b>. Charminar was built by <b>Quli Qutb Shah of Golconda<\/b>, not by a Mughal."}],"sum":["Vijayanagara founded 1336 by Harihara I & Bukka Raya at Hampi on the Tungabhadra; dynasties Sangama–Saluva–Tuluva–Aravidu.","Krishnadeva Raya (Tuluva) wrote Amuktamalyada and kept the Ashtadiggajas; Domingo Paes visited him. Battle of Talikota 1565 ended Vijayanagara's power.","Bahmani founded 1347 by Alauddin Hasan Bahman Shah; capital Gulbarga then Bidar; minister Mahmud Gawan; broke into BAGHB (Bijapur, Ahmadnagar, Golconda, Berar, Bidar).","Gol Gumbaz = Bijapur; Charminar = Quli Qutb Shah, 1591; Madrasa of Bidar = Mahmud Gawan.","Zain-ul-Abidin = 'Akbar of Kashmir'. Rana Kumbha built the Vijaya Stambha at Chittor."],"app":"histmedieval"},
{"id":"L13","g":"med","heat":2,"title":"Bhakti & Sufi movements","hi":"भक्ति एवं सूफ़ी आंदोलन","blocks":[{"k":"hot","h":"One sure question: saint ↔ place ↔ language ↔ guru. Learn the North/South split and who belongs to the <i>Nirguna<\/i> (formless) vs <i>Saguna<\/i> (with form) school."},{"k":"story","h":"<p>Imagine a time when worship meant costly rituals in Sanskrit, done by priests, and many people were kept out because of caste. The <b>Bhakti<\/b> movement said something simple: anyone can reach God through love and devotion, in their own language. It began in the Tamil south with the Alvars (devotees of Vishnu) and Nayanars (devotees of Shiva). Teachers like Shankaracharya and <b>Ramanuja<\/b> gave it a philosophy, and from the 13th century it spread north.<\/p><p>In the north, saints wrote songs that ordinary people could sing. Some, like <b>Kabir<\/b> and Guru Nanak, prayed to a God without form (Nirguna) and mocked empty ritual in every religion. Guru Nanak's teaching became Sikhism. Others, like Tulsidas, Surdas and Mirabai, loved God in a form, as Rama or Krishna (Saguna). Each wrote in a local language: Awadhi, Braj, Marathi, Kannada and more.<\/p><p>At the same time Muslim mystics called <b>Sufis<\/b> taught love of God, simple living and music. Their khanqahs (hospices) were open to all. The Chishti order, brought to Ajmer by Moinuddin Chishti, became the most popular in India. The tables link each saint to a place, a language and an idea.<\/p>","key":"Bhakti saints and Sufis both taught that love of God matters more than ritual or caste, and they taught it in the people's own languages."},{"k":"p","h":"<b>Bhakti<\/b> = devotion to a personal god, open to all castes, in the <b>people's language<\/b> rather than Sanskrit. It began in the south with the <b>Alvars<\/b> (devotees of Vishnu) and <b>Nayanars<\/b> (devotees of Shiva), and moved north from the 13th century."},{"k":"table","title":"Bhakti saints — the table that gets asked","head":["Saint","Place / language","Remember"],"rows":[["<b>Shankaracharya<\/b> (8th c.)","Kaladi, Kerala","<b>Advaita<\/b> (non-dualism); set up four mathas — Sringeri, Dwarka, Puri, Badrinath"],["<b>Ramanuja<\/b> (11th c.)","Sriperumbudur, TN","<b>Vishishtadvaita<\/b> (qualified non-dualism); teacher of the north Indian Bhakti stream"],["<b>Madhvacharya<\/b>","Karnataka","<b>Dvaita<\/b> (dualism)"],["<b>Nimbarka<\/b> / <b>Vallabhacharya<\/b>","—","Dvaitadvaita / <b>Shuddhadvaita<\/b>; Vallabha founded the <b>Pushtimarg<\/b>, Krishna devotion"],["<b>Ramananda<\/b>","Prayag/Banaras","First to bring Bhakti to the north in Hindi; guru of Kabir and Ravidas"],["<b>Kabir<\/b>","Banaras · Hindi (Sadhukkadi)","<b>Nirguna<\/b>; <i>Bijak<\/i>, dohas; verses in the Guru Granth Sahib; attacked ritual in both religions"],["<b>Guru Nanak<\/b> (1469–1539)","Talwandi/Nankana Sahib · Punjabi","Founder of <b>Sikhism<\/b>; <i>Japji<\/i>; \"<i>Ek Onkar<\/i>\""],["<b>Chaitanya Mahaprabhu<\/b>","Nadia, Bengal","Krishna bhakti, <b>kirtan<\/b> and sankirtan; Gaudiya Vaishnavism"],["<b>Mirabai<\/b>","Mewar · Rajasthani/Braj","Krishna devotion; <i>padas<\/i>"],["<b>Surdas<\/b>","Braj · Brajbhasha","<i>Sursagar<\/i>, <i>Sahitya Lahari<\/i>; blind poet of Krishna"],["<b>Tulsidas<\/b>","Awadh · Awadhi","<b><i>Ramcharitmanas<\/i><\/b>, <i>Vinaya Patrika<\/i>; Akbar's time"],["<b>Namdev<\/b> &amp; <b>Tukaram<\/b> &amp; <b>Eknath<\/b>","Maharashtra · Marathi","Varkari tradition; Tukaram was Shivaji's contemporary"],["<b>Jnaneshwar<\/b>","Maharashtra","<i>Jnaneshwari<\/i> — Marathi commentary on the Gita"],["<b>Basava<\/b>","Karnataka · Kannada","<b>Lingayat / Virashaiva<\/b> movement; <i>vachanas<\/i>"],["<b>Ravidas<\/b>","Banaras","Nirguna; against caste"],["<b>Dadu Dayal<\/b> / <b>Shankaradeva<\/b>","Rajasthan / Assam","Dadu-panth; Shankaradeva began <b>Vaishnavism in Assam<\/b>, Borgeet &amp; Sattriya"],["<b>Andal<\/b>","Tamil Nadu","Only woman among the 12 Alvars"],["<b>Akka Mahadevi<\/b>","Karnataka","Woman Lingayat saint"]]},{"k":"trick","h":"<b>Philosophies<\/b> — <span class=\"mn\">Sha-A, Ra-Vi, Ma-Dva, Va-Shu, Ni-Dvaidva<\/span>: <b>Sha<\/b>nkara–<b>A<\/b>dvaita, <b>Ra<\/b>manuja–<b>Vi<\/b>shishtadvaita, <b>Ma<\/b>dhva–<b>Dva<\/b>ita, <b>Va<\/b>llabha–<b>Shu<\/b>ddhadvaita, <b>Ni<\/b>mbarka–<b>Dvaitadva<\/b>ita.<br><b>Nirguna (formless)<\/b>: Kabir, Nanak, Ravidas, Dadu. <b>Saguna (with form)<\/b>: Tulsidas, Surdas, Mira, Chaitanya."},{"k":"facts","title":"Sufism — orders and saints","rows":[["<b>Chishti<\/b> order","Brought by <b>Khwaja Moinuddin Chishti<\/b> to <b>Ajmer<\/b>; the most popular order in India"],["Chishti line","Moinuddin Chishti → <b>Qutbuddin Bakhtiyar Kaki<\/b> (Delhi) → <b>Baba Farid<\/b> (Ajodhan, Punjab) → <b>Nizamuddin Auliya<\/b> (Delhi) → <b>Nasiruddin Chiragh-i-Dehlvi<\/b>"],["<b>Suhrawardi<\/b> order","<b>Bahauddin Zakariya<\/b>, Multan — accepted state service and wealth, unlike the Chishtis"],["<b>Qadiri<\/b> order","Shaikh Abdul Qadir Jilani's line; popular in Punjab/Sindh"],["<b>Naqshbandi<\/b> order","<b>Shaikh Ahmad Sirhindi<\/b> — orthodox, opposed Akbar's liberalism"],["<b>Amir Khusrau<\/b>","Disciple of Nizamuddin Auliya; \"Parrot of India\"; credited with developing the <b>Khayal<\/b> and the <b>sitar/tabla<\/b> tradition and <i>Qawwali<\/i>"],["Key words","<b>Khanqah<\/b> (hospice), <b>Pir/Murshid<\/b> (master), <b>Murid<\/b> (disciple), <b>Sama<\/b> (music/dance), <b>Silsila<\/b> (order), <b>Wahdat-ul-Wujud<\/b> (unity of being), <b>Urs<\/b> (death anniversary)"]]},{"k":"trap","h":"<b>Kabir and Nanak are Nirguna<\/b> (god without form) — Tulsidas and Surdas are Saguna. <b>Ajmer = Moinuddin Chishti<\/b>, <b>Delhi = Nizamuddin Auliya<\/b>; Baba Farid's dargah is at <b>Pakpattan (Ajodhan)<\/b>. Lingayats follow <b>Shiva<\/b> (Basava), not Vishnu."}],"sum":["Alvars = Vishnu, Nayanars = Shiva — Bhakti began in the Tamil south.","Shankara–Advaita, Ramanuja–Vishishtadvaita, Madhva–Dvaita, Vallabha–Shuddhadvaita, Nimbarka–Dvaitadvaita.","Nirguna: Kabir, Nanak, Ravidas, Dadu. Saguna: Tulsidas (Ramcharitmanas), Surdas (Sursagar), Mirabai, Chaitanya.","Basava began the Lingayat movement in Kannada; Shankaradeva brought Vaishnavism to Assam; Jnaneshwari is a Marathi Gita commentary.","Chishti order: Moinuddin Chishti (Ajmer) → Bakhtiyar Kaki → Baba Farid → Nizamuddin Auliya. Suhrawardi = Bahauddin Zakariya (Multan); Naqshbandi = Ahmad Sirhindi."],"app":"histmedieval"},

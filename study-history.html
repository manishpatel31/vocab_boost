/* L3 */
["L3","Which Mandala of the Rigveda is devoted entirely to the god Soma?",["Ninth","Third","Tenth","First"],"Mandala IX is the Soma Mandala. Mandala III has the Gayatri Mantra and Mandala X the Purusha Sukta.","p"],
["L3","The Mahabharata, the longest poem in the world, is attributed to:",["Ved Vyasa","Valmiki","Kalidasa","Panini"],"Ved Vyasa composed the Mahabharata; Valmiki composed the Ramayana.","p"],
["L3","Which scholar held that the original home of the Aryans was the Arctic region?",["Bal Gangadhar Tilak","Max Muller","Dayanand Saraswati","A. C. Das"],"Tilak argued for an Arctic home. Max Muller said Central Asia, Dayanand said Tibet and A. C. Das the Sapta-Sindhu itself.","p"],
["L3","Which Veda has two recensions known as Shukla and Krishna?",["Yajurveda","Rigveda","Samaveda","Atharvaveda"],"The Yajurveda, the book of sacrificial ritual, survives in a White (Shukla) and a Black (Krishna) recension.","p"],
["L3","The prayer 'Asato Ma Sadgamaya' is taken from the:",["Brihadaranyaka Upanishad","Mundaka Upanishad","Maha Upanishad","Aitareya Brahmana"],"It comes from the Brihadaranyaka Upanishad. 'Satyameva Jayate' is from the Mundaka and 'Vasudhaiva Kutumbakam' from the Maha Upanishad.",""],

/* L4 */
["L4","The First Buddhist Council was held at:",["Rajgriha","Vaishali","Pataliputra","Kundalvana"],"It met in the Sattapanni cave at Rajgriha under Ajatashatru, and compiled the Vinaya and Sutta Pitakas.","p"],
["L4","Gautama Buddha attained enlightenment at the age of:",["35","29","40","80"],"He renounced the world at 29, gained enlightenment at 35 at Bodh Gaya, and died at 80 at Kushinagar.","p"],
["L4","The Jain Agamas were finally written down at the second Jain council held at:",["Valabhi","Pataliputra","Vaishali","Mathura"],"The Valabhi council of 512 CE, under Devardhi Kshamasramana, put the Agamas in writing; the first council at Pataliputra had led to the Digambara-Svetambara split.",""],
["L4","The first woman to be admitted into the Buddhist Sangha was:",["Mahaprajapati Gotami","Trishala","Yashodhara","Sanghamitra"],"Buddha's aunt and foster-mother Mahaprajapati Gotami was admitted on Ananda's pleading.","p"],
["L4","The Charvaka or Lokayata school of materialism is traditionally attributed to:",["Brihaspati","Makkhali Gosala","Purana Kassapa","Sanjaya Belatthiputta"],"Brihaspati is named as the founder of Charvaka materialism. Makkhali Gosala founded the fatalist Ajivika sect.",""],
["L4","Which of these was NOT one of the four Mahajanapadas that fought for supremacy in north India?",["Vajji","Magadha","Kosala","Avanti"],"The four contenders were Magadha, Kosala, Avanti and Vatsa. Vajji was a republic, not one of the four monarchies in that struggle.","p"],

/* L5 */
["L5","Which of these was NOT a provincial capital of the Mauryan empire?",["Kaushambi","Taxila","Ujjain","Suvarnagiri"],"The provincial capitals were Taxila, Ujjain, Suvarnagiri and Tosali, with Pataliputra as the imperial capital.","p"],
["L5","A Mauryan provincial governor, usually a prince of the royal house, was called:",["Kumara","Rajjuka","Pradeshika","Yukta"],"The Kumara or Aryaputra headed a province. Rajjukas measured land and Pradeshikas were district officers.",""],
["L5","The queen named in Ashoka's so-called 'Queen's Edict' is:",["Karuvaki","Kumaradevi","Trishala","Mahamaya"],"The edict mentions queen Karuvaki, mother of prince Tivara. Kumaradevi was the Lichchhavi wife of Chandragupta I.",""],
["L5","Which Ashokan rock edict prohibits animal sacrifice and festive gatherings?",["Rock Edict I","Rock Edict II","Rock Edict XII","Rock Edict XIII"],"Edict I bans animal sacrifice, Edict II provides medical aid, Edict XII preaches tolerance and Edict XIII describes Kalinga.","p"],
["L5","Ashoka sent which two of his children to spread Buddhism in Sri Lanka?",["Mahendra and Sanghamitra","Tivara and Charumati","Dasharatha and Samprati","Kunala and Jalauka"],"His son Mahendra and daughter Sanghamitra led the mission to Sri Lanka after the Third Buddhist Council.","p"],
["L5","The Mauryan official called the Akaradhyaksha was in charge of:",["Mines","Ships","Markets","Weights and measures"],"Akara means mine. Navadhyaksha looked after shipping, Samsthadhyaksha markets and Pautavadhyaksha weights.","p"],

/* L6 */
["L6","'Buddhacharita', a Sanskrit life of the Buddha, was written by:",["Ashvaghosha","Nagasena","Vasumitra","Charaka"],"Ashvaghosha, who lived at Kanishka's court, wrote the Buddhacharita and was vice-president of the Fourth Buddhist Council.","p"],
["L6","The Tamil epic 'Silappadikaram' was composed by:",["Ilango Adigal","Sattanar","Thiruvalluvar","Tolkappiyar"],"Ilango Adigal wrote Silappadikaram; Sattanar wrote Manimekalai, the other great Sangam epic.","p"],
["L6","'Manimekalai', a Sangam-age Buddhist epic, was written by:",["Sattanar","Ilango Adigal","Nakkirar","Thiruvalluvar"],"Sattanar composed Manimekalai as a sequel to Silappadikaram.",""],
["L6","The Sangam assemblies of Tamil poets were held under the patronage of which dynasty?",["Pandya","Chera","Chola","Satavahana"],"The three Sangams were held at Madurai under Pandya patronage, which is why Madurai is the Sangam city.","p"],
["L6","The physician Charaka, author of the Charaka Samhita, was patronised by:",["Kanishka","Ashoka","Chandragupta II","Harshavardhana"],"Charaka was a court physician of Kanishka, who also patronised Ashvaghosha and Nagarjuna.","p"],
["L6","The railings of the Bharhut stupa, carved with Jataka scenes, belong to which period?",["Sunga","Maurya","Gupta","Kushana"],"Bharhut in Madhya Pradesh has Sunga-period railings, just as the Sungas added the railings at Sanchi.",""],

/* L7 */
["L7","Brahmagupta's major work on mathematics and astronomy is:",["Brahmasphuta Siddhanta","Aryabhatiya","Brihat Samhita","Sushruta Samhita"],"Brahmagupta's Brahmasphuta Siddhanta gave the first clear rules for calculating with zero.","p"],
["L7","'Panchasiddhantika' and 'Brihat Samhita' were written by:",["Varahamihira","Aryabhata","Brahmagupta","Charaka"],"Varahamihira, one of the nine gems, wrote both. Aryabhata wrote the Aryabhatiya.","p"],
["L7","Which Gupta ruler was the first of the line to take the title 'Maharajadhiraja'?",["Chandragupta I","Sri Gupta","Samudragupta","Skandagupta"],"Chandragupta I took the grand title and started the Gupta era in 319–20 CE; his predecessors used only 'Maharaja'.",""],
["L7","The 'nine gems' or navaratnas of the court, said to include Kalidasa, are associated with:",["Chandragupta II","Samudragupta","Kumaragupta I","Harshavardhana"],"Tradition places the navaratnas, Kalidasa and Varahamihira among them, at the court of Chandragupta II Vikramaditya.","p"],
["L7","The iron pillar at Mehrauli in Delhi, famous for resisting rust, is attributed to:",["Chandragupta II","Ashoka","Samudragupta","Kanishka"],"Its inscription names a king 'Chandra', generally identified with Chandragupta II, and shows Gupta skill in metallurgy.","p"],

/* L8 */
["L8","Pulakeshin II, who defeated Harshavardhana, belonged to which dynasty?",["Chalukyas of Badami","Rashtrakutas","Pallavas","Cholas"],"Pulakeshin II was a Chalukya of Vatapi (Badami); his victory is recorded in the Aihole inscription of Ravikirti.","p"],
["L8","The capital of the Rashtrakuta dynasty was:",["Manyakheta","Vatapi","Kanchipuram","Thanjavur"],"Manyakheta (Malkhed) was the Rashtrakuta capital. Vatapi was Chalukyan and Kanchipuram Pallava.","p"],
["L8","The Hoysaleshwara temple at Halebid and the Chennakeshava temple at Belur were built by the:",["Hoysalas","Chalukyas","Kakatiyas","Cholas"],"These star-shaped Vesara temples are Hoysala work, now UNESCO World Heritage sites.","p"],
["L8","Which Chola ruler assumed the title 'Gangaikonda Chola' after his northern campaign?",["Rajendra I","Rajaraja I","Karikala","Kulottunga I"],"Rajendra I reached the Ganga and took the title; he also built a new capital, Gangaikondacholapuram.","p"],
["L8","In Chola administration, the largest territorial division was called a:",["Mandalam","Nadu","Ur","Kurram"],"The Chola order ran Mandalam (province), then Valanadu and Nadu, down to the Ur or village.",""],
["L8","Which is regarded as the oldest university of ancient India?",["Takshashila","Nalanda","Vikramashila","Valabhi"],"Takshashila is the oldest centre of learning; Nalanda was founded later by Kumaragupta I and Vikramashila by Dharmapala.","p"],

/* L9 */
["L9","The 'Chachnama' is the main source for the history of:",["The Arab conquest of Sindh","The battles of Tarain","Mahmud of Ghazni's raids","The Slave dynasty"],"The Chachnama records Muhammad bin Qasim's conquest of Sindh in 712 CE and the defeat of Raja Dahir.",""],
["L9","'Tabaqat-i-Nasiri' was written by:",["Minhaj-us-Siraj","Hasan Nizami","Ziauddin Barani","Amir Khusrau"],"Minhaj-us-Siraj wrote it in Iltutmish's and Balban's time. Hasan Nizami wrote Taj-ul-Maasir.","p"],
["L9","Bakhtiyar Khalji conquered which two regions for the Turks?",["Bihar and Bengal","Gujarat and Malwa","Sindh and Multan","Punjab and Kashmir"],"He overran Bihar and Bengal and destroyed Nalanda in 1193.","p"],
["L9","Muhammad Ghori died, leaving the way open for Turkish rule in India, in:",["1206","1192","1194","1210"],"Ghori died in 1206, and his slave general Qutb-ud-din Aibak then founded the Delhi Sultanate.","p"],
["L9","Mahmud of Ghazni belonged to which dynasty?",["Ghaznavid","Ghurid","Khalji","Ilbari"],"Mahmud was a Ghaznavid. Muhammad Ghori belonged to the rival Ghurid house that displaced the Ghaznavids.",""],

/* L10 */
["L10","Qutb-ud-din Aibak died in 1210 at Lahore while playing:",["Chaugan (polo)","Chess","Chausar","Kabaddi"],"He fell from his horse during a game of chaugan, the medieval form of polo.","p"],
["L10","The Qutub Minar was raised in honour of which Sufi saint?",["Khwaja Qutbuddin Bakhtiyar Kaki","Moinuddin Chishti","Nizamuddin Auliya","Baba Farid"],"Aibak dedicated it to Bakhtiyar Kaki of Delhi, the successor of Moinuddin Chishti of Ajmer.","p"],
["L10","Iltutmish obtained a khilat, a letter of recognition as Sultan, in 1229 from the:",["Caliph of Baghdad","Mongol Khan","Sultan of Ghazni","Shah of Persia"],"The Caliph's recognition made Iltutmish the legal sovereign of Delhi and gave the Sultanate standing.",""],
["L10","Who founded the Khalji dynasty in 1290?",["Jalal-ud-din Khalji","Alauddin Khalji","Khusrau Khan","Malik Kafur"],"Jalal-ud-din Khalji founded it with a mild policy; his nephew and son-in-law Alauddin murdered him in 1296.","p"],
["L10","The Diwan-i-Riyasat, the department supervising commerce and market control, was created by:",["Alauddin Khalji","Balban","Iltutmish","Firoz Shah Tughlaq"],"It worked under Alauddin Khalji's market-control scheme, with the Shahna-i-Mandi as market superintendent.","p"],
["L10","Which Sultan built the Siri fort at Delhi?",["Alauddin Khalji","Qutb-ud-din Aibak","Ghiyas-ud-din Tughlaq","Sikandar Lodi"],"Alauddin Khalji built Siri and the Alai Darwaza as part of his defences against the Mongols.","p"],

/* L11 */
["L11","Who described Muhammad bin Tughlaq as 'a mixture of opposites'?",["Ziauddin Barani","Ibn Battuta","Amir Khusrau","Minhaj-us-Siraj"],"Barani, the historian of the Tughlaq court, used the phrase for the learned but unlucky Sultan.","p"],
["L11","Ghiyas-ud-din Tughlaq died in 1325 when:",["A pavilion collapsed on him at Afghanpur","He fell while playing polo","He was poisoned at court","He was killed fighting the Mongols"],"The wooden pavilion built to welcome him at Afghanpur fell on him; Aibak, by contrast, died playing chaugan.","p"],
["L11","'Futuhat-i-Firozshahi' was written by:",["Firoz Shah Tughlaq himself","Ziauddin Barani","Shams Siraj Afif","Amir Khusrau"],"The Sultan wrote this account of his own achievements; Afif wrote a separate Tarikh-i-Firozshahi.","p"],
["L11","Which Sultan had two Ashokan pillars shifted to Delhi?",["Firoz Shah Tughlaq","Alauddin Khalji","Muhammad bin Tughlaq","Sikandar Lodi"],"Firoz Shah moved pillars from Topra and Meerut to Delhi and also repaired the Qutub Minar.","p"],
["L11","Sikandar Lodi wrote Persian verse under which pen name?",["Gulrukhi","Gulbadan","Zafar","Rangila"],"Sikandar Lodi used the pen name Gulrukhi. Bahadur Shah II wrote as 'Zafar'.",""],
["L11","The Diwan-i-Mustakharaj, a department for arrears of revenue, was set up by:",["Alauddin Khalji","Firoz Shah Tughlaq","Muhammad bin Tughlaq","Balban"],"Alauddin Khalji created it to recover revenue arrears; the Diwan-i-Kohi for agriculture was Muhammad bin Tughlaq's.","p"],

/* L12 */
["L12","Hampi, the capital of Vijayanagara, stood on the banks of which river?",["Tungabhadra","Krishna","Kaveri","Godavari"],"Harihara I and Bukka Raya founded the city on the Tungabhadra; its ruins at Hampi are a UNESCO site.","p"],
["L12","The Vittalaswamy and Hazara Rama temples at Hampi were built by:",["Krishnadeva Raya","Harihara I","Devaraya II","Ramaraya"],"Krishnadeva Raya, the greatest Vijayanagara ruler, built both.",""],
["L12","Vijayanagara was led at the Battle of Talikota by:",["Ramaraya","Krishnadeva Raya","Harihara II","Devaraya II"],"Ramaraya of the Aravidu line commanded the Vijayanagara army in 1565 and was killed; Krishnadeva Raya had died in 1529.","p"],
["L12","The Italian traveller Nicolo Conti visited the court of:",["Devaraya I","Devaraya II","Krishnadeva Raya","Ramaraya"],"Nicolo Conti came under Devaraya I, while the Persian envoy Abdur Razzaq came under Devaraya II.","p"],
["L12","Jaunpur, a great centre of learning under the Sharqi rulers, was known as:",["The Shiraz of India","The Manchester of India","The Venice of the East","The Rome of the East"],"Jaunpur was called the Shiraz of India for its scholarship; its Atala Masjid is the best-known Sharqi building.","p"],
["L12","The Vijayanagara practice of granting territory to military commanders in return for troops was called the:",["Amara-nayaka system","Iqta system","Mansabdari system","Zamindari system"],"Under the amara-nayaka system a nayaka held land and maintained soldiers for the king, somewhat like the earlier iqta.",""],

/* L13 */
["L13","The four mathas at Sringeri, Dwarka, Puri and Badrinath were established by:",["Shankaracharya","Ramanuja","Madhvacharya","Basava"],"Shankaracharya, born at Kaladi in Kerala, set up the four mathas and taught Advaita.","p"],
["L13","Who was the only woman among the twelve Alvar saints?",["Andal","Akka Mahadevi","Mirabai","Lalleshwari"],"Andal of Tamil Nadu was the one woman Alvar. Akka Mahadevi was a woman Lingayat saint of Karnataka.","p"],
["L13","The Pushtimarg sect of Krishna devotion was founded by:",["Vallabhacharya","Nimbarka","Chaitanya Mahaprabhu","Ramananda"],"Vallabhacharya, who taught Shuddhadvaita, founded the Pushtimarg.",""],
["L13","The 'Bijak', a collection of verses, is associated with:",["Kabir","Guru Nanak","Ravidas","Dadu Dayal"],"The Bijak gathers Kabir's dohas and sakhis; some of his verses are also in the Guru Granth Sahib.","p"],
["L13","The dargah of Baba Farid, the Chishti saint, is at:",["Pakpattan (Ajodhan)","Ajmer","Delhi","Multan"],"Baba Farid's dargah is at Pakpattan. Ajmer has Moinuddin Chishti's and Delhi Nizamuddin Auliya's.","p"],

/* L14 */
["L14","At the Battle of Haldighati in 1576, Akbar's army was led against Maharana Pratap by:",["Raja Man Singh","Bairam Khan","Raja Todar Mal","Abdur Rahim Khan-i-Khanan"],"Man Singh of Amber commanded the Mughal force; Pratap withdrew but never submitted.","p"],
["L14","The Battle of Samugarh in 1659 was fought between Aurangzeb and:",["Dara Shikoh","Shah Shuja","Murad Baksh","Shah Jahan"],"Aurangzeb defeated his eldest brother Dara Shikoh at Samugarh in the war of succession.","p"],
["L14","Babur wrote his memoir, the Baburnama, in which language?",["Turki","Persian","Arabic","Urdu"],"Babur wrote in Turki; Abdur Rahim Khan-i-Khanan later translated it into Persian. Jahangir's memoir was in Persian.","p"],
["L14","The only notable follower of Akbar's Din-i-Ilahi was:",["Birbal","Abul Fazl","Todar Mal","Tansen"],"Din-i-Ilahi, proclaimed in 1582, won almost no converts; Birbal is the one courtier named as joining it.","p"],
["L14","Babur was invited to invade India against Ibrahim Lodi by:",["Daulat Khan Lodi","Rana Sanga of Mewar","Hemu","Medini Rai"],"Daulat Khan Lodi, the governor of Punjab, and Alam Khan invited Babur, who then won the First Battle of Panipat.",""],
["L14","'Padmavat' was composed during the reign of Sher Shah Suri by:",["Malik Muhammad Jayasi","Abul Fazl","Tulsidas","Jayadeva"],"Jayasi wrote the Awadhi poem Padmavat at Sher Shah's time; Tulsidas wrote the Ramcharitmanas under Akbar.","p"],

/* L15 */
["L15","The Mughal official who kept land records at the village level was the:",["Patwari","Amil","Faujdar","Subedar"],"The Patwari kept village records and the Qanungo those of the pargana; the Amil collected revenue.",""],
["L15","The head of the city police in Mughal administration was the:",["Kotwal","Faujdar","Subedar","Amalguzar"],"The Kotwal policed the city, while the Faujdar had charge of a sarkar or district.","p"],
["L15","Which later Mughal emperor was nicknamed 'Shah-i-Bekhabar'?",["Bahadur Shah I","Jahandar Shah","Muhammad Shah","Alamgir II"],"Bahadur Shah I was called the heedless king. Muhammad Shah was nicknamed 'Rangila'.",""],
["L15","Niccolao Manucci, who wrote 'Storia do Mogor', came from:",["Italy","France","England","Portugal"],"Manucci was Italian. Bernier and Tavernier were French, and Hawkins and Roe English.","p"],
["L15","A revenue-free grant made to scholars and religious men was called:",["Inam","Jagir","Khalisa","Watan jagir"],"Inam was revenue-free. A jagir carried a revenue assignment for service, and khalisa land paid into the treasury.","p"],

/* L16 */
["L16","Shivaji's mother and his spiritual guru were:",["Jijabai and Ramdas","Tarabai and Tukaram","Jijabai and Tukaram","Soyarabai and Ramdas"],"His mother was Jijabai and his guru Samarth Ramdas, author of Dasbodh; Dadaji Kondadev was his teacher.","p"],
["L16","Shivaji plundered the rich Mughal port of Surat in:",["1664","1659","1666","1674"],"He raided Surat in 1664, a year after attacking Shaista Khan at Pune.","p"],
["L16","In Shivaji's Ashtapradhan, the minister in charge of justice was the:",["Nyayadhish","Panditrao","Sachiv","Mantri"],"Nyayadhish handled justice and Panditrao religion and charity; the Sachiv looked after correspondence.",""],
["L16","Who led the Sikhs against the Mughals after the death of Guru Gobind Singh in 1708?",["Banda Bahadur","Maharaja Ranjit Singh","Jassa Singh Ahluwalia","Gulab Singh"],"Banda Bahadur fought the Mughals from 1708 to 1716; Ranjit Singh built the Sikh kingdom much later.","p"],
["L16","The Akal Takht at Amritsar was established by:",["Guru Hargobind","Guru Arjan Dev","Guru Ram Das","Guru Gobind Singh"],"The sixth Guru, Hargobind, built the Akal Takht and adopted the two swords of miri and piri.","p"],

/* L17 */
["L17","The Dutch set up their first factory in India at:",["Masulipatnam","Tranquebar","Surat","Pondicherry"],"The Dutch began at Masulipatnam in 1605. Tranquebar was Danish and Pondicherry French.","p"],
["L17","The First Carnatic War ended with the:",["Treaty of Aix-la-Chapelle","Treaty of Paris","Treaty of Pondicherry","Treaty of Madras"],"Aix-la-Chapelle (1748) closed the inconclusive first war; the Treaty of Paris (1763) ended the third.","p"],
["L17","The English East India Company's first factory in India was established in 1613 at:",["Surat","Madras","Masulipatnam","Calcutta"],"The Surat factory was set up in 1613 under Jahangir, after Hawkins' and Roe's missions.","p"],
["L17","Which French Governor of Pondicherry was recalled after the Second Carnatic War?",["Dupleix","Count de Lally","La Bourdonnais","Colbert"],"Dupleix was recalled in 1754. Lally lost at Wandiwash in 1760 and Colbert had founded the French company in 1664.",""],
["L17","The great Bengal famine in which about a third of the population is said to have died occurred in:",["1770","1757","1764","1793"],"The famine of 1770 followed the Company's revenue exactions under the dual government.","p"],

/* L18 */
["L18","The First Anglo-Mysore War ended with the:",["Treaty of Madras","Treaty of Mangalore","Treaty of Seringapatam","Treaty of Salbai"],"The Treaty of Madras (1769) closed the first war with Haidar Ali; Mangalore ended the second in 1784.","p"],
["L18","The Second Anglo-Mysore War was ended by the Treaty of:",["Mangalore","Madras","Seringapatam","Bassein"],"Tipu Sultan signed the Treaty of Mangalore in 1784 after Haidar Ali's death in 1782.","p"],
["L18","Tipu Sultan was popularly known as:",["The Tiger of Mysore","The Lion of Punjab","The Napoleon of the East","Sher-e-Bengal"],"Tipu was the Tiger of Mysore; Ranjit Singh was the Lion of Punjab and Samudragupta the Indian Napoleon.","p"],
["L18","Which ruling family was restored in Mysore after Tipu Sultan's death in 1799?",["The Wodeyars","The Nizams","The Gaekwads","The Holkars"],"The Wodeyars were put back on the throne under a subsidiary alliance with Wellesley.",""],
["L18","Jhansi was annexed under the Doctrine of Lapse in:",["1853","1848","1854","1856"],"Satara went first in 1848, Jhansi in 1853 and Nagpur in 1854; Awadh in 1856 was taken for misgovernment.","p"],
["L18","The Koh-i-Noor diamond was taken to England after the British annexation of:",["Punjab","Sindh","Awadh","Nagpur"],"Punjab was annexed in 1849 after the Second Anglo-Sikh War, and the diamond passed from Dalip Singh to the Crown.","p"],
["L18","India's first telegraph line was laid between:",["Calcutta and Agra","Bombay and Thane","Madras and Bangalore","Delhi and Lahore"],"Both the first telegraph line (Calcutta-Agra) and the first railway (Bombay-Thane) date from 1853, under Dalhousie.","p"],

/* L19 */
["L19","The Supreme Court at Calcutta was set up in 1774 during the time of:",["Warren Hastings","Lord Cornwallis","Robert Clive","Lord Wellesley"],"It followed the Regulating Act of 1773, under the first Governor-General of Bengal, Warren Hastings.","p"],
["L19","Fort William College at Calcutta was founded in 1800 by:",["Lord Wellesley","Warren Hastings","Lord Cornwallis","Lord William Bentinck"],"Wellesley founded it to train Company servants in Indian languages.","p"],
["L19","Slavery was abolished in India in 1843 under which Governor-General?",["Lord Ellenborough","Lord Auckland","Lord Hardinge I","Lord Dalhousie"],"Ellenborough, who also annexed Sindh in 1843, abolished slavery. Hardinge I banned human sacrifice.","p"],
["L19","The universities of Calcutta, Bombay and Madras were established in 1857 during the term of:",["Lord Canning","Lord Dalhousie","Lord Ripon","Lord Mayo"],"They were set up under Canning, following Wood's Despatch of 1854.","p"],
["L19","The Ilbert Bill controversy arose during the viceroyalty of:",["Lord Ripon","Lord Lytton","Lord Dufferin","Lord Curzon"],"Ripon's Ilbert Bill of 1883 sought to let Indian judges try Europeans, and European opposition forced its dilution.","p"],
["L19","The Durand Line between British India and Afghanistan was drawn in 1893 under:",["Lord Lansdowne","Lord Curzon","Lord Minto II","Lord Elgin"],"Lansdowne's term saw the Durand Line and the Indian Councils Act of 1892.",""],
["L19","Queen Victoria was proclaimed 'Kaiser-i-Hind' at the Delhi Durbar of 1877 held by:",["Lord Lytton","Lord Mayo","Lord Ripon","Lord Curzon"],"Lytton held the durbar in the middle of a severe famine, and also passed the Vernacular Press and Arms Acts of 1878.","p"],

/* L20 */
["L20","Mangal Pandey belonged to which regiment?",["34th Native Infantry","19th Native Infantry","3rd Light Cavalry","7th Awadh Irregular Infantry"],"He served in the 34th Native Infantry at Barrackpore and was hanged on 8 April 1857.",""],
["L20","Who led the revolt of 1857 at Kanpur?",["Nana Saheb","Bakht Khan","Kunwar Singh","Khan Bahadur Khan"],"Nana Saheb led Kanpur with his general Tantia Tope; Bakht Khan commanded at Delhi.","p"],
["L20","Which British commander died while defending Lucknow in 1857?",["Henry Lawrence","John Nicholson","Hugh Rose","Colin Campbell"],"Henry Lawrence died in the Lucknow residency; Colin Campbell later relieved the city.",""],
["L20","Rani Lakshmibai died fighting in June 1858 near:",["Gwalior","Jhansi","Kalpi","Kanpur"],"She left Jhansi, joined Tantia Tope and died in action near Gwalior — a point SSC often tests.","p"],
["L20","Who held that the Revolt of 1857 was 'neither first, nor national, nor a war of independence'?",["R. C. Majumdar","V. D. Savarkar","Karl Marx","Benjamin Disraeli"],"R. C. Majumdar rejected all three claims, while Savarkar called it the First War of Indian Independence.","p"],
["L20","The revolt of 1857 at Allahabad was led by:",["Liaquat Ali","Shah Mal","Devi Singh","Kandarpeshwar Singh"],"Maulvi Liaquat Ali led Allahabad and was put down by Colonel Neill; Kandarpeshwar Singh led in Assam.",""],

/* L21 */
["L21","The Atmiya Sabha was founded in 1815 by:",["Raja Ram Mohan Roy","Debendranath Tagore","Keshab Chandra Sen","David Hare"],"Ram Mohan Roy founded the Atmiya Sabha first and then the Brahmo Samaj in 1828.","p"],
["L21","The Tattvabodhini Sabha was founded in 1839 by:",["Debendranath Tagore","Keshab Chandra Sen","Shivnath Shastri","Atmaram Pandurang"],"Debendranath Tagore founded it and later led the Brahmo Samaj; Keshab Chandra Sen formed the Brahmo Samaj of India in 1866.",""],
["L21","The Deoband movement was started in 1866 by:",["Muhammad Qasim Nanautavi and Rashid Ahmad Gangohi","Sir Syed Ahmad Khan","Mirza Ghulam Ahmad","Nawab Salimullah"],"Deoband was an orthodox movement of religious education, unlike Sir Syed's Aligarh movement of English education.","p"],
["L21","The journal 'Tahzib-ul-Akhlaq' was published by:",["Sir Syed Ahmad Khan","Maulana Abul Kalam Azad","Mirza Ghulam Ahmad","Badruddin Tyabji"],"Sir Syed used it to spread his ideas of social reform and modern education among Muslims.",""],
["L21","The Central Hindu College at Banaras, which later became the nucleus of Banaras Hindu University, was founded by:",["Annie Besant","Madan Mohan Malaviya","Dayanand Saraswati","Swami Vivekananda"],"Annie Besant founded the college in 1898; Malaviya built BHU on its base in 1916.","p"],

/* L22 */
["L22","How many delegates attended the first session of the Indian National Congress?",["72","64","100","50"],"Seventy-two delegates met at Gokuldas Tejpal Sanskrit College, Bombay, in December 1885.","p"],
["L22","The Surat session of 1907, at which the Congress split, was presided over by:",["Rash Behari Ghosh","Dadabhai Naoroji","Gopal Krishna Gokhale","Bal Gangadhar Tilak"],"Rash Behari Ghosh was the Moderates' choice as president, and the Extremists' opposition broke up the session.",""],
["L22","The Lucknow session of 1916, which saw the Congress reunite, was presided over by:",["Ambica Charan Majumdar","Annie Besant","Bal Gangadhar Tilak","M. A. Jinnah"],"Ambica Charan Majumdar presided when the Moderates and Extremists reunited and the Lucknow Pact was signed.",""],
["L22","Who started the Ganapati and Shivaji festivals to spread nationalist feeling?",["Bal Gangadhar Tilak","Bipin Chandra Pal","Aurobindo Ghosh","Lala Lajpat Rai"],"Tilak began the Ganapati festival in 1893 and the Shivaji festival in 1895.","p"],
["L22","Who was the youngest ever President of the Indian National Congress?",["Maulana Abul Kalam Azad","Jawaharlal Nehru","Subhas Chandra Bose","Gopal Krishna Gokhale"],"Azad presided at 35 in 1923 and was also president for the longest stretch, from 1940 to 1946.","p"],
["L22","Who was the President of the Indian National Congress at the time of Independence in 1947?",["J. B. Kripalani","Maulana Abul Kalam Azad","Rajendra Prasad","Jawaharlal Nehru"],"J. B. Kripalani held the office in 1947; Azad's long term had ended in 1946.","p"],

/* L23 */
["L23","The Rowlatt Act of 1919 was popularly summed up in the phrase:",["'No vakil, no dalil, no appeal'","'Do or Die'","'Go back Simon'","'A post-dated cheque'"],"The Act allowed detention without trial, hence the phrase. 'A post-dated cheque' was Gandhi's verdict on the Cripps Mission.","p"],
["L23","The first all-India hartal against the Rowlatt Act was observed on:",["6 April 1919","13 April 1919","10 March 1919","1 August 1920"],"Gandhi called the hartal for 6 April 1919; the Jallianwala Bagh firing followed on 13 April.",""],
["L23","Which commission was appointed to enquire into the Jallianwala Bagh massacre?",["Hunter Commission","Peel Commission","Simon Commission","Sadler Commission"],"The Hunter Commission of 1919 enquired into the Punjab disturbances; the Peel Commission had reorganised the army in 1859.","p"],
["L23","The Non-Cooperation Movement was formally approved at the Congress session held at:",["Nagpur","Calcutta","Lahore","Belgaum"],"The Calcutta special session of September 1920 adopted it and the Nagpur session of December 1920 confirmed it.","p"],
["L23","Gandhi offered his first satyagraha anywhere in the world in 1906 in:",["South Africa","Champaran","Kheda","London"],"His first satyagraha was at Johannesburg against the Asiatic Registration Act; Champaran in 1917 was the first in India.","p"],
["L23","The Nehru Report of 1928, which demanded dominion status, was prepared under the chairmanship of:",["Motilal Nehru","Jawaharlal Nehru","C. R. Das","Tej Bahadur Sapru"],"Motilal Nehru headed the committee that drafted it as an Indian answer to the Simon Commission.","p"],

/* L24 */
["L24","The Hindustan Republican Association was founded in 1924 at:",["Kanpur","Lahore","Allahabad","Calcutta"],"Sachindra Nath Sanyal, Ramprasad Bismil and Jogesh Chatterjee founded it at Kanpur; it became the HSRA in 1928.",""],
["L24","Jatin Das died in jail in 1929 after a hunger strike lasting:",["63 days","21 days","40 days","90 days"],"Jatindra Nath Das fasted for 63 days in Lahore jail demanding better treatment for political prisoners.","p"],
["L24","J. P. Saunders was shot dead in December 1928 in revenge for the death of:",["Lala Lajpat Rai","Bal Gangadhar Tilak","Jatin Das","Khudiram Bose"],"Bhagat Singh, Rajguru and Azad killed Saunders after Lajpat Rai died of injuries from a lathi charge.","p"],

<script>
"use strict";
/* ============================================================
   HELPERS & STATE
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hash = s => { let h = 5381; for (let i=0;i<s.length;i++) h = ((h<<5)+h + s.charCodeAt(i))|0; return "q"+(h>>>0).toString(36); };
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; };
const L = id => LESSONS.find(l => l.id === id);
const LNUM = id => LESSONS.findIndex(l => l.id === id) + 1;
const G = id => GROUPS.find(g => g.id === id) || GROUPS[0];
const inEra = eid => LESSONS.filter(l => l.g === eid);

const QS = QB.map(r => {
  const fixed = !!r[6];
  return { t:r[0], q:r[1], o:r[2], e:r[3], p:(r[4]||"").includes("p"), a: fixed ? (r[5]||0) : 0, fixed, id:hash(r[1]) };
});
const byLesson = id => QS.filter(q => q.t === id);
const byEra = eid => QS.filter(q => L(q.t).g === eid);
const makePerm = q => q.fixed ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i));

const KEY = APP.key;
let S = { ans:{}, bm:{}, les:{}, mocks:[], plan:null };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const record = (q, ok) => { S.ans[q.id] = ok ? 1 : 0; save(); renderTop(); };

const lesDone = l => !!(S.les[l.id] && S.les[l.id].done);
const heatDots = n => `<span class="dots" aria-label="Weightage ${n} of 3">${[1,2,3].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>`;

function renderTop(){
  const ids = Object.keys(S.ans).filter(k => QS.some(q => q.id === k));
  const right = ids.filter(k => S.ans[k] === 1).length;
  const pct = ids.length ? Math.round(right*100/ids.length) : 0;
  $("#topstat").innerHTML = `<b>${ids.length}</b>/${QS.length} tried<br><b>${pct}%</b> right now`;
}

/* ============================================================
   ROUTING
   ============================================================ */
let TAB = "learn";
let timerId = null;
function go(tab){
  TAB = tab;
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.tab===tab ? "page" : "false"));
  if (tab === "learn") renderLearn();
  if (tab === "practice") renderPractice();
  if (tab === "mock") renderMock();
  if (tab === "revise") renderRevise();
  if (tab === "plan") renderPlan();
  window.scrollTo(0,0);
  try { history.replaceState(null, "", "#"+tab); } catch(e) {}
}
document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => {
  if (TAB === "mock" && M && M.running && b.dataset.tab !== "mock") { go("mock"); showMockLeave(b.dataset.tab); return; }
  go(b.dataset.tab);
}));

/* ============================================================
   LEARN — bifurcated by era
   ============================================================ */
let ERA = null;                         // null = show every era
function renderLearn(){
  const done = LESSONS.filter(lesDone).length;
  const list = ERA ? inEra(ERA) : LESSONS;
  const nextL = list.find(l => !lesDone(l)) || LESSONS.find(l => !lesDone(l));
  const eraCards = GROUPS.map(g => {
    const ls = inEra(g.id), d = ls.filter(lesDone).length;
    return `<button type="button" class="erac" data-era="${g.id}" aria-pressed="${ERA===g.id}">
      <b>${esc(g.name)}</b><span class="hi">${g.hi}</span>
      <div class="meter"><i style="width:${ls.length?d/ls.length*100:0}%"></i></div>
      <span class="mt">${d}/${ls.length} lessons · ${byEra(g.id).length} Q</span></button>`;
  }).join("");
  $("#app").innerHTML = `<section class="view stack">
    <div class="hero">
      <span class="eyebrow">Ancient · Medieval · Modern · Art &amp; Culture · World</span>
      <h1>History, era by era</h1>
      <p>${LESSONS.length} lessons and ${QS.length} exam-style questions, split the way the syllabus is actually taught. Every lesson ends with a quiz and a one-screen summary, and carries its own tricks and traps. The dots show how often the topic is asked in CGL.</p>
      <div class="meter" aria-label="Lessons done"><i style="width:${done/LESSONS.length*100}%"></i></div>
      <div class="row between"><span class="muted num" style="font-size:13px">${done}/${LESSONS.length} lessons done</span>
      ${nextL ? `<button class="btn pri sm" type="button" data-open="${nextL.id}">${done? "Continue" : "Start"}: ${esc(nextL.title)}</button>` : `<span class="muted" style="font-size:13px">All lessons done. Try a mock test.</span>`}</div>
    </div>
    <div class="eras">${eraCards}</div>
    ${ERA ? `<div class="row"><button class="btn sm ghost" type="button" id="allera">Show all eras</button></div>` : ""}
    ${(ERA ? [G(ERA)] : GROUPS).map(g => {
      const ls = inEra(g.id);
      if (!ls.length) return "";
      return `<div class="grph"><h2>${esc(g.name)}</h2><span>${ls.length} lessons</span></div>
      <p class="muted" style="font-size:13px;margin:-8px 0 2px">${esc(g.note)}</p>
      <div class="lessons">${ls.map(l => {
        const st = S.les[l.id] || {}, n = byLesson(l.id).length;
        return `<button type="button" class="les ${lesDone(l)?"done":""} ${nextL&&l.id===nextL.id?"next":""}" data-open="${l.id}">
          <span class="no">${lesDone(l) ? "✓" : LNUM(l.id)}</span>
          <span class="t"><b>${esc(l.title)}${heatDots(l.heat)}</b><span>${l.hi} · ${n} questions</span></span>
          <span class="sc">${st.best!=null ? `best<br>${st.best}/${n}` : ""}</span></button>`;}).join("")}
      </div>`;
    }).join("")}
    <p class="foot">Dates for the ancient period are approximate, as historians themselves differ. Where a commonly taught figure is disputed or often misremembered, the lesson flags it in a red &ldquo;Trap&rdquo; box.</p>
  </section>`;
  $("#app").querySelectorAll("[data-era]").forEach(b => b.addEventListener("click", () => { ERA = (ERA===b.dataset.era) ? null : b.dataset.era; renderLearn(); }));
  const ae = $("#allera"); if (ae) ae.onclick = () => { ERA = null; renderLearn(); };
  $("#app").querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openLesson(b.dataset.open, "learn")));
}

function blockHTML(b){
  if (b.k==="p") return `<div class="plain"><p>${b.h}</p></div>`;
  if (b.k==="hot") return `<div class="hot"><span class="lab">Why it is asked</span>${b.h}</div>`;
  if (b.k==="trick") return `<div class="trick"><span class="lab">Trick</span>${b.h}</div>`;
  if (b.k==="trap") return `<div class="trap"><span class="lab">Trap · don't mix these up</span>${b.h}</div>`;
  if (b.k==="link") return `<div class="link"><span class="lab">Link it up</span>${b.h}</div>`;
  if (b.k==="facts") return `<div class="block"><h3>${b.title}</h3><dl class="facts">${b.rows.map(r=>`<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join("")}</dl></div>`;
  if (b.k==="tl") return `<div class="block"><h3>${b.title}</h3><ul class="tl">${b.rows.map(r=>`<li><span class="y">${r[0]}</span><span>${r[1]}</span></li>`).join("")}</ul></div>`;
  if (b.k==="table") return `<div class="block"><h3>${b.title}</h3><div class="tbl"><table><thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  if (b.k==="fig") return `<div class="block"><h3>${b.title}</h3><figure class="fig">${b.svg}<figcaption>${b.cap}</figcaption></figure></div>`;
  return "";
}

let LQ = null;
function openLesson(id, step){
  const l = L(id), i = LNUM(id), g = G(l.g);
  if (step === "quiz") { LQ = { id, list: shuffle(byLesson(id)).map(q => ({q, perm:makePerm(q)})), i:0, score:0, picked:null }; }
  const head = `<div class="lhead"><button class="back" type="button" id="lback">‹ Lessons</button></div>
    <span class="eyebrow">${esc(g.name)} · Lesson ${i} of ${LESSONS.length} · ${l.hi}</span><h1>${esc(l.title)}</h1>
    <p class="muted" style="font-size:13px">Asked in CGL ${heatDots(l.heat)} ${l.heat===3?"— almost every shift":l.heat===2?"— often":"— occasionally"}</p>
    <div class="steps" role="tablist">
      <button type="button" data-step="learn" aria-current="${step==="learn"?"step":"false"}">1 · Learn</button>
      <button type="button" data-step="quiz" aria-current="${step==="quiz"?"step":"false"}">2 · Quiz</button>
      <button type="button" data-step="sum" aria-current="${step==="sum"?"step":"false"}">3 · Summary</button>
    </div>`;
  let body = "";
  if (step === "learn") {
    body = `<div class="stack">${l.blocks.map(blockHTML).join("")}
      <div class="row end"><button class="btn pri" type="button" id="toquiz">Take the quiz · ${byLesson(id).length} questions</button></div></div>`;
  } else if (step === "quiz") {
    body = `<div id="lq"></div>`;
  } else {
    const nxt = LESSONS[i];
    body = `<div class="stack"><div class="block"><h3>Remember these</h3><ul class="sum">${l.sum.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
      <div class="row between"><button class="btn" type="button" id="relearn">Read again</button>
      ${nxt ? `<button class="btn pri" type="button" id="nextles">Next: ${esc(nxt.title)}</button>` : `<button class="btn pri" type="button" id="tomock">Take a mock test</button>`}</div></div>`;
    S.les[id] = Object.assign(S.les[id]||{}, {done:1}); save();
  }
  $("#app").innerHTML = `<section class="view stack">${head}${body}</section>`;
  $("#lback").onclick = () => renderLearn();
  $("#app").querySelectorAll("[data-step]").forEach(b => b.onclick = () => openLesson(id, b.dataset.step));
  if (step==="learn") $("#toquiz").onclick = () => openLesson(id,"quiz");
  if (step==="quiz") renderLQ();
  if (step==="sum") {
    $("#relearn").onclick = () => openLesson(id,"learn");
    const n = $("#nextles"); if (n) n.onclick = () => openLesson(LESSONS[i].id,"learn");
    const m = $("#tomock"); if (m) m.onclick = () => go("mock");
  }
  window.scrollTo(0,0);
}

function optsHTML(q, perm, state){
  return perm.map((oi, k) => {
    let cls = "opt";
    if (state.reveal) { if (oi === q.a) cls += " ok"; else if (oi === state.picked) cls += " no"; }
    else if (state.sel === oi) cls += " sel";
    return `<button type="button" class="${cls}" data-oi="${oi}" ${state.reveal?"disabled":""}><span class="k">${"ABCD"[k]}</span><span>${esc(q.o[oi])}</span></button>`;
  }).join("");
}
function expHTML(q, picked){
  const ok = picked === q.a;
  return `<div class="exp">${ok ? `<b class="okl">Correct.</b>` : `<b class="nol">Answer: ${esc(q.o[q.a])}.</b>`} ${esc(q.e)}</div>`;
}
function metaHTML(q, no){
  const l = L(q.t);
  return `<div class="qmeta"><span class="qno">${no}</span><span class="tag">${esc(G(l.g).name)} · L${LNUM(q.t)} ${esc(l.title)}</span>${q.p?`<span class="tag pyq">Exam-asked</span>`:""}
  <button type="button" class="bm" data-bm="${q.id}" aria-pressed="${S.bm[q.id]?"true":"false"}" aria-label="Bookmark">${S.bm[q.id]?"★":"☆"}</button></div>`;
}

function renderLQ(){
  const box = $("#lq");
  if (LQ.i >= LQ.list.length) {
    const n = LQ.list.length;
    const st = S.les[LQ.id] || {}; st.best = Math.max(st.best||0, LQ.score); S.les[LQ.id] = st; save();
    box.innerHTML = `<div class="stack"><div class="block stack"><span class="eyebrow">Quiz done</span>
      <div class="scorebig"><span class="num">${LQ.score}</span><span class="muted">/ ${n} correct</span></div>
      <p class="muted">${LQ.score===n ? "Full marks." : LQ.score >= n*0.8 ? "Strong. Review the ones you missed under Practice → Mistakes." : "Read the lesson once more, then retry. Missed questions are saved under Practice → Mistakes."}</p></div>
      <div class="row between"><button class="btn" type="button" id="retry">Retry quiz</button><button class="btn pri" type="button" id="tosum">See summary</button></div></div>`;
    $("#retry").onclick = () => openLesson(LQ.id,"quiz");
    $("#tosum").onclick = () => openLesson(LQ.id,"sum");
    return;
  }
  const it = LQ.list[LQ.i], q = it.q;
  const reveal = LQ.picked !== null;
  box.innerHTML = `<div class="stack"><div class="meter"><i style="width:${LQ.i/LQ.list.length*100}%"></i></div>
    <article class="qcard">${metaHTML(q, `Q${LQ.i+1}/${LQ.list.length}`)}
    <p class="qt">${esc(q.q)}</p><div class="opts">${optsHTML(q, it.perm, {picked:LQ.picked, reveal})}</div>
    ${reveal ? expHTML(q, LQ.picked) : ""}</article>
    ${reveal ? `<div class="row end"><button class="btn pri" type="button" id="lqnext">${LQ.i+1 < LQ.list.length ? "Next question" : "Finish"}</button></div>` : `<p class="muted" style="font-size:13px">Score so far: <span class="num">${LQ.score}</span></p>`}</div>`;
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (LQ.picked !== null) return;
    LQ.picked = +b.dataset.oi; const ok = LQ.picked === q.a; if (ok) LQ.score++; record(q, ok); renderLQ();
  });
  bindBM(box);
  const nx = $("#lqnext"); if (nx) nx.onclick = () => { LQ.i++; LQ.picked = null; renderLQ(); window.scrollTo(0,0); };
}

function bindBM(root){
  root.querySelectorAll("[data-bm]").forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    const id = b.dataset.bm; if (S.bm[id]) delete S.bm[id]; else S.bm[id] = 1; save();
    b.setAttribute("aria-pressed", S.bm[id] ? "true":"false"); b.textContent = S.bm[id] ? "★" : "☆";
  });
}

/* ============================================================
   PRACTICE
   ============================================================ */
let PF = "all", PSHOW = 20, PORDER = null, PPERM = {}, PPICK = {};
function practiceList(){
  let list = QS;
  if (PF === "pyq") list = QS.filter(q => q.p);
  else if (PF === "hot") list = QS.filter(q => L(q.t).heat === 3);
  else if (PF === "wrong") list = QS.filter(q => S.ans[q.id] === 0);
  else if (PF === "new") list = QS.filter(q => S.ans[q.id] === undefined);
  else if (PF === "bm") list = QS.filter(q => S.bm[q.id]);
  else if (PF.indexOf("g:") === 0) list = byEra(PF.slice(2));
  else if (PF !== "all") list = QS.filter(q => q.t === PF);
  if (PORDER) { const pos = new Map(PORDER.map((id,i)=>[id,i])); list = list.slice().sort((a,b)=>(pos.get(a.id)??0)-(pos.get(b.id)??0)); }
  return list;
}
function renderPractice(){
  const wrongN = QS.filter(q => S.ans[q.id] === 0).length, bmN = QS.filter(q=>S.bm[q.id]).length;
  const pyqN = QS.filter(q=>q.p).length, hotN = QS.filter(q=>L(q.t).heat===3).length;
  const chips = [["all",`All ${QS.length}`],["new","Not tried"],["wrong",`Mistakes ${wrongN}`],["hot",`Most-asked topics ${hotN}`],["pyq",`Exam-asked ${pyqN}`],["bm",`Starred ${bmN}`]]
    .concat(GROUPS.map(g=>["g:"+g.id, g.name]))
    .concat(LESSONS.map(l=>[l.id,`L${LNUM(l.id)} ${l.title}`]));
  const list = practiceList();
  $("#app").innerHTML = `<section class="view stack">
    <div class="stack" style="gap:6px"><span class="eyebrow">Question bank · ${QS.length} questions</span><h1>Practice</h1>
    <p class="muted">Tap an option to check it. Wrong answers go to <b>Mistakes</b> until you get them right. <b>Most-asked topics</b> is every question from the lessons marked three dots.</p></div>
    <div class="chips" role="group" aria-label="Filter">${chips.map(c=>`<button type="button" class="chip" data-f="${c[0]}" aria-pressed="${PF===c[0]}">${esc(c[1])}</button>`).join("")}</div>
    <div class="row between"><span class="muted num" style="font-size:13px">${list.length} questions</span>
      <div class="row"><button class="btn sm ghost" type="button" id="pshuf">${PORDER?"In order":"Shuffle"}</button></div></div>
    <div class="stack" id="plist"></div>
  </section>`;
  $("#app").querySelectorAll("[data-f]").forEach(b => b.onclick = () => { PF = b.dataset.f; PSHOW = 20; PPICK = {}; renderPractice(); });

function pCard(q, idx){

function bindP(box){ box.querySelectorAll(".qcard").forEach(bindCard); }
function bindCard(card){
  card.querySelectorAll(".opt").forEach(b => b.onclick = () => {

/* ============================================================

let M = null, MCFG = {n:25, scope:"all", neg:1}, LEAVE_TO = null;
function mockPool(scope){
  if (scope === "all") return QS;
  if (scope === "pyq") return QS.filter(q=>q.p);
  if (scope === "hot") return QS.filter(q=>L(q.t).heat===3);
  if (scope === "wrong") return QS.filter(q=>S.ans[q.id]===0);
  if (scope.indexOf("g:") === 0) return byEra(scope.slice(2));
  return QS.filter(q=>q.t===scope);
}
function renderMock(){

function startTimer(){

}
function showMockLeave(tab){ LEAVE_TO = tab; drawMockRun(); }
function submitMock(){
  if (!M || !M.running) return;
  clearInterval(timerId);
  M.running = false; M.done = true; M.confirm = false;
  let c=0,w=0,sk=0; const per = {};
  M.list.forEach((it,k) => {
    const a = M.ans[k]; const gid = L(it.q.t).g; per[gid] = per[gid] || {c:0,n:0}; per[gid].n++;
    if (a===null) sk++; else if (a===it.q.a) { c++; per[gid].c++; S.ans[it.q.id]=1; } else { w++; S.ans[it.q.id]=0; }
  });
  const max = M.list.length*2, score = +(c*2 - (M.neg? w*0.5 : 0)).toFixed(1);
  const used = Math.min(M.secs, Math.round((Date.now()-M.start)/1000));
  M.res = {c,w,sk,score,max,used,per, acc: (c+w) ? Math.round(c*100/(c+w)) : 0};
  const d = new Date(); const ds = d.toLocaleDateString("en-IN",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
  S.mocks = (S.mocks||[]).concat([{d:ds, n:M.list.length, score, max, acc:M.res.acc}]).slice(-20); save(); renderTop();

}

  }

/* ============================================================
   PLAN MAKER — 5 / 7 / 10 / 15 / 30 days
   A plan is generated, never stored: only the length, the start date and
   which boxes are ticked live in localStorage, so the plan survives an
   update to the lessons.
   ============================================================ */
const PLANLEN = [
  {d:5,  label:"5 days",  note:"Crash course. Only the lessons marked three dots — the rest is left out on purpose."},
  {d:7,  label:"7 days",  note:"One week. Most-asked topics plus Art &amp; Culture, which is a near-certain mark."},
  {d:10, label:"10 days", note:"Full syllabus, four lessons a day. Tight but it covers everything."},
  {d:15, label:"15 days", note:"Full syllabus at a sane pace, with recap days built in."},
  {d:30, label:"30 days", note:"Full syllabus, one or two lessons a day, each era revised again before you move on."}

const DAYMS = 86400000;

/* which lessons a plan of n days covers, in teaching order */
function planLessons(days){
  if (days <= 5) return LESSONS.filter(l => l.heat === 3);
  if (days <= 7) return LESSONS.filter(l => l.heat === 3 || l.g === "art");
  return LESSONS.slice();
}

/* The revision days that close a plan. Built first, so a plan is always
   exactly `days` long: the study days are whatever is left over. */
function planTailDays(days, pool){
  const t = [];
  if (days >= 30) {
    GROUPS.filter(g => pool.some(l => l.g === g.id)).slice(0,3).forEach(g => t.push({
      title:"Revision", sub:g.name,
      tasks:[{k:"digest", label:`Revise → 30 days: read the ${g.name} summaries`, sub:"Every summary for the era"},
             {k:"prac", label:`Practice 30 ${g.name} questions`, sub:"Practice → the era chip"},
             {k:"mock", label:`25-question mock from ${g.name}`, sub:"Mock → pick the era"}]}));
  }
  if (days >= 15) t.push({ title:"Revision", sub:"Timeline, tricks and traps",
    tasks:[{k:"time", label:"Revise → Timeline, top to bottom", sub:"Be able to place every date"},
           {k:"tricks", label:"Revise → Tricks, all of them", sub:"The mnemonics"},
           {k:"traps", label:"Revise → Traps, all of them", sub:"The pairs SSC swaps"}]});
  if (days >= 10) t.push({ title:"Revision", sub:"Full-length test",
    tasks:[{k:"mock", label:"100-question mock, timed", sub:"Mock → Everything · 60 min"},
           {k:"mistakes", label:"Go through every mistake it throws up", sub:"Practice → Mistakes"}]});
  t.push({ title:"The day before", sub:"and the hour before",
    tasks:[{k:"digest7", label:"Revise → 7 days: the most-asked lessons only", sub:"About an hour"},
           {k:"flash", label:"Flashcards from your mistakes deck", sub:"Revise → Flashcards → My mistakes"},
           {k:"last", label:"Revise → Last moment, in the final hour", sub:"The pairings sheet — nothing new today"}]});
  return t;
}

function buildPlan(days){
  const pool = planLessons(days);
  const tail = planTailDays(days, pool);
  const studyDays = Math.max(1, days - tail.length);
  const out = [];
  /* Spread the lessons evenly rather than front-loading them, so a long plan
     is one or two lessons a day throughout instead of a rush and then nothing. */
  for (let d = 0; d < studyDays; d++) {
    const from = Math.round(d * pool.length / studyDays);
    const to   = Math.round((d+1) * pool.length / studyDays);
    const mine = pool.slice(from, to);
    const prev = d > 0 ? out[d-1].lessons : null;
    const tasks = [];
    if (mine.length) {
      mine.forEach(l => tasks.push({k:"read", id:l.id, label:`Read L${LNUM(l.id)} · ${l.title}`, sub:`${l.hi} · ${byLesson(l.id).length} questions`}));
      mine.forEach(l => tasks.push({k:"quiz", id:l.id, label:`Quiz: ${l.title}`, sub:"Lesson → step 2"}));
    }
    if (prev && prev.length) tasks.push({k:"recap", label:"Re-read yesterday's summaries", sub:prev.map(l=>"L"+LNUM(l.id)).join(", ")});
    if (mine.length) tasks.push({k:"prac", label:`Practice ${mine.length>1?30:20} questions on today's topics`, sub:"Practice → the lesson chip"});
    else { tasks.push({k:"mistakes", label:"Clear your Mistakes list", sub:"Practice → Mistakes"});
           tasks.push({k:"mock", label:"25-question mock", sub:"Mock → Everything"}); }
    out.push({ title:"Day", sub: mine.length ? [...new Set(mine.map(l=>l.g))].map(id=>G(id).name).join(" + ") : "Catch-up and mistakes",
               lessons: mine, tasks });
  }
  tail.forEach(x => out.push(x));
  return { days, list: out, pool, dropped: LESSONS.filter(l => pool.indexOf(l) === -1) };
}

function planState(){
  if (!S.plan || !PLANLEN.some(p=>p.d===S.plan.days)) return null;
  return S.plan;
}
function startPlan(days){
  S.plan = { days, start: Date.now(), done:{} }; save(); renderPlan();
}
function planToday(st, total){
  const d = Math.floor((Date.now() - st.start) / DAYMS);
  return Math.min(Math.max(d, 0), total - 1);
}

function renderPlan(){
  const st = planState();
  if (!st) {
    $("#app").innerHTML = `<section class="view stack">
      <div class="stack" style="gap:6px"><span class="eyebrow">Plan maker</span><h1>How long do you have?</h1>
      <p class="muted">Pick a length and the app lays out what to read, quiz and practise each day, with recap days built in. Tick the boxes as you go; the plan remembers where you are.</p></div>
      <div class="plancfg">${PLANLEN.map(p => {
        const pl = buildPlan(p.d);
        return `<button type="button" class="pday" data-days="${p.d}" style="text-align:left;cursor:pointer;width:100%;border-width:1px">
          <div style="padding:12px 14px;display:grid;gap:6px">
            <div class="row between"><b style="font-family:var(--f-display);font-size:17px">${p.label}</b>
            <span class="num muted" style="font-size:12px">${pl.pool.length} lessons · ${pl.pool.reduce((a,l)=>a+byLesson(l.id).length,0)} Q</span></div>
            <span class="muted" style="font-size:13px">${p.note}</span>
            ${pl.dropped.length ? `<span style="font-size:12px;color:var(--bad)">Leaves out ${pl.dropped.length} lesson${pl.dropped.length>1?"s":""}</span>` : `<span style="font-size:12px;color:var(--good)">Covers all ${LESSONS.length} lessons</span>`}
          </div></button>`;
      }).join("")}</div>
      <p class="foot">A shorter plan does not squeeze the syllabus &mdash; it drops the lessons that are asked least, and tells you which ones. If the exam is further away than 30 days, start the 30-day plan and repeat it.</p>
    </section>`;
    $("#app").querySelectorAll("[data-days]").forEach(b => b.onclick = () => startPlan(+b.dataset.days));
    return;
  }
  const pl = buildPlan(st.days);
  const total = pl.list.length;
  const today = planToday(st, total);
  const allTasks = pl.list.reduce((a,d)=>a+d.tasks.length, 0);
  const doneTasks = pl.list.reduce((a,d,i)=>a + d.tasks.filter((_,j)=>st.done[`d${i}t${j}`]).length, 0);
  $("#app").innerHTML = `<section class="view stack">
    <div class="hero"><span class="eyebrow">${st.days}-day plan · started ${new Date(st.start).toLocaleDateString("en-IN",{day:"numeric",month:"short"})}</span>
      <h1>Day ${today+1} of ${total}</h1>
      <p>${esc(PLANLEN.find(p=>p.d===st.days).note.replace(/&amp;/g,"&"))}</p>
      <div class="meter" aria-label="Plan progress"><i style="width:${allTasks?doneTasks/allTasks*100:0}%"></i></div>
      <div class="row between"><span class="muted num" style="font-size:13px">${doneTasks}/${allTasks} tasks done</span>
        <button class="btn sm ghost" type="button" id="pchg">Change plan</button></div></div>
    ${pl.dropped.length ? `<div class="trap"><span class="lab">Left out of this plan</span>${pl.dropped.map(l=>`L${LNUM(l.id)} ${esc(l.title)}`).join(" · ")}. Open them from the Learn tab if you find time.</div>` : ""}
    ${pl.list.map((d,i) => {
      const dn = d.tasks.filter((_,j)=>st.done[`d${i}t${j}`]).length;
      const all = dn === d.tasks.length;
      return `<details class="pday ${i===today?"cur":""} ${all?"allgood":""}" ${i===today?"open":""}>
        <summary><span class="dno">${all?"✓ ":""}Day ${i+1}</span>
          <span class="dt">${esc(d.title==="Day"?d.sub:d.title+" · "+d.sub)}<small>${d.tasks.length} task${d.tasks.length>1?"s":""}${i===today?" · today":""}</small></span>
          <span class="dp">${dn}/${d.tasks.length}</span></summary>
        <div class="body">${d.tasks.map((t,j) => {
          const key = `d${i}t${j}`;
          return `<button type="button" class="ptask" data-k="${key}" aria-pressed="${st.done[key]?"true":"false"}">
            <span class="box">${st.done[key]?"✓":""}</span>
            <span class="lbl">${esc(t.label)}<small>${esc(t.sub||"")}</small></span></button>`;
        }).join("")}
        ${d.lessons ? `<div class="row" style="padding-top:4px">${d.lessons.map(l=>`<button class="btn sm" type="button" data-plopen="${l.id}">Open L${LNUM(l.id)}</button>`).join("")}</div>` : ""}
        </div></details>`;
    }).join("")}
    <p class="foot">Ticks are yours alone &mdash; nothing is marked for you. &ldquo;Today&rdquo; is counted from the day you started the plan, so a missed day stays visible instead of quietly disappearing.</p>
  </section>`;
  $("#pchg").onclick = () => {
    if (confirm("Change the plan? Your ticks on this plan will be cleared.")) { S.plan = null; save(); renderPlan(); }
  };
  $("#app").querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (st.done[k]) delete st.done[k]; else st.done[k] = 1;
    save(); renderPlan();
  });
  $("#app").querySelectorAll("[data-plopen]").forEach(b => b.onclick = () => openLesson(b.dataset.plopen, "learn"));
  const cur = $(".pday.cur"); if (cur) cur.scrollIntoView({block:"center"});
}

/* boot */
renderTop();
const TABS = ["learn","practice","mock","revise","plan"];
const hashTab = () => (location.hash||"").replace("#","");
go(TABS.includes(hashTab()) ? hashTab() : "learn");
/* the back button, or a link that only changes the fragment, should move tabs */
window.addEventListener("hashchange", () => {
  const t = hashTab();
  if (TABS.includes(t) && t !== TAB && !(M && M.running)) go(t);
});
</script>

<script id="shabd-deeplink">
(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();
</script>
</body>

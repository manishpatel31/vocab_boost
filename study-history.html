 Hammurabi<\/b> (c. 1750 BCE); ziggurats; Epic of Gilgamesh; counting in 60s (hence 60 minutes); traded with the Indus people, whom they called Meluhha"],["<b>Egypt<\/b>","<b>Nile<\/b> — 'the gift of the Nile' (Herodotus)","<b>Hieroglyphics<\/b> on papyrus","<b>Pyramids<\/b> (Great Pyramid of Giza for Khufu), the Sphinx, mummies, pharaohs; the <b>Rosetta Stone<\/b> let Champollion read hieroglyphs (1822)"],["<b>China<\/b>","<b>Huang He<\/b> (Yellow River) — 'China's Sorrow'","Characters on oracle bones (Shang dynasty)","Silk; later the Great Wall (Qin Shi Huang) and paper (Han period)"],["<b>Indus / Harappan<\/b>","<b>Indus<\/b>","Indus script — undeciphered","Planned cities, drains, Great Bath (see the Harappan lesson)"]]},{"k":"facts","title":"Greece and Rome","rows":[["City-state (<i>polis<\/i>)","Athens (democracy) and Sparta (military state) were the two leaders"],["Athenian democracy","<b>Cleisthenes<\/b> (508 BCE) is its father; it peaked under <b>Pericles<\/b>"],["<b>Socrates<\/b>","Taught by questioning; sentenced to drink hemlock (399 BCE)"],["<b>Plato<\/b>","Pupil of Socrates; wrote <i>The Republic<\/i>; founded the Academy"],["<b>Aristotle<\/b>","Pupil of Plato; tutor of Alexander; wrote <i>Politics<\/i>; founded the Lyceum"],["Other 'fathers'","<b>Herodotus<\/b> — history; <b>Hippocrates<\/b> — medicine"],["<b>Alexander<\/b>","Son of Philip II of Macedon; Ambhi of Taxila submitted; beat <b>Porus<\/b> at the <b>Battle of the Hydaspes (Jhelum), 326 BCE<\/b>; his army refused to cross the <b>Beas<\/b>; died at Babylon, 323 BCE"],["<b>Julius Caesar<\/b>","Crossed the Rubicon (49 BCE); 'Veni, vidi, vici'; Julian calendar; killed on the Ides of March, 44 BCE; July is named after him"],["<b>Augustus<\/b> (Octavian)","<b>First Roman emperor<\/b>, 27 BCE; began the Pax Romana; August is named after him"],["Later Rome","<b>Constantine<\/b> — first Christian emperor, founded Constantinople (330 CE); the Western Empire fell in <b>476 CE<\/b>"]]},{"k":"table","title":"Founders of religions","head":["Founder","Faith","Place","Book · fact"],"rows":[["<b>Zoroaster<\/b> (Zarathustra)","Zoroastrianism","Persia (Iran)","<i>Avesta<\/i>; god Ahura Mazda; fire temples; followers in India are the Parsis"],["<b>Confucius<\/b> (551–479 BCE)","Confucianism","China","<i>Analects<\/i>; a contemporary of the Buddha and Mahavira"],["<b>Lao Tzu<\/b>","Taoism","China","<i>Tao Te Ching<\/i>"],["<b>Moses<\/b>","Judaism","Israel","<i>Torah<\/i>"],["<b>Jesus Christ<\/b>","Christianity","Born at Bethlehem; crucified at Jerusalem","<i>Bible<\/i>; born in the reign of Augustus"],["<b>Prophet Muhammad<\/b>","Islam","Born at Mecca (c. 570 CE); died at Medina (632 CE)","<i>Quran<\/i>; the <b>Hijra<\/b>, his migration from Mecca to Medina in <b>622 CE<\/b>, begins the Islamic calendar"]]},{"k":"facts","title":"Renaissance and Reformation","rows":[["Renaissance","'Rebirth' of learning; began in <b>Italy<\/b> (Florence) in the 14th century; patrons the Medici family"],["<b>Petrarch<\/b> / <b>Dante<\/b>","Father of humanism / <i>Divine Comedy<\/i>"],["<b>Leonardo da Vinci<\/b>","<i>Mona Lisa<\/i>, <i>The Last Supper<\/i>"],["<b>Michelangelo<\/b>","<i>David<\/i>, <i>Pieta<\/i>, the <b>Sistine Chapel<\/b> ceiling"],["<b>Raphael<\/b> / <b>Machiavelli<\/b>","<i>School of Athens<\/i> / <i>The Prince<\/i>"],["<b>Johannes Gutenberg<\/b>","Movable-type printing press, <b>c. 1440<\/b>, Mainz, Germany; Gutenberg Bible c. 1455"],["<b>Copernicus<\/b>","The Sun, not the Earth, is the centre (1543)"],["<b>Martin Luther<\/b>","<b>Ninety-five Theses<\/b> against the sale of indulgences, Wittenberg, <b>1517<\/b> — the Reformation and Protestantism"],["Others","<b>John Calvin<\/b> (Geneva); <b>Henry VIII<\/b> founded the Church of England (1534)"],["Counter-Reformation","<b>Jesuits<\/b> founded by <b>Ignatius Loyola<\/b> (1540); the Jesuit <b>Francis Xavier<\/b> reached Goa in 1542"]]},{"k":"tl","title":"From Magna Carta to Magellan","rows":[["1215","<b>Magna Carta<\/b> — King <b>John<\/b> of England, at Runnymede, accepts limits on royal power"],["c. 1440","<b>Gutenberg's<\/b> printing press"],["1453","<b>Fall of Constantinople<\/b> to the Ottoman Turks under <b>Mehmed II<\/b>; end of the Byzantine Empire; the old land route to the East is blocked"],["1488","<b>Bartolomeu Dias<\/b> rounds the Cape of Good Hope"],["1492","<b>Columbus<\/b>, sailing for <b>Spain<\/b>, reaches the Bahamas — the 'West Indies'; America is later named after Amerigo Vespucci"],["1494","Treaty of Tordesillas divides new lands between Spain and Portugal"],["1498","<b>Vasco da Gama<\/b> reaches <b>Calicut<\/b> (see the European companies lesson)"],["1500","<b>Pedro Alvares Cabral<\/b> reaches <b>Brazil<\/b> for Portugal, then sails on to Calicut"],["1517","<b>Martin Luther<\/b>'s Ninety-five Theses"],["1519–22","<b>Magellan's<\/b> expedition makes the first voyage round the world; he names the <b>Pacific<\/b>, is killed in the Philippines (1521), and <b>Elcano<\/b> brings the ship <i>Victoria<\/i> home"]]},{"k":"trick","h":"<b>River ↔ civilisation<\/b>: <span class=\"mn\">TE-M, N-E, H-C<\/span> — Tigris–Euphrates = Mesopotamia, Nile = Egypt, Huang He = China.<br><b>Greek chain<\/b>: <span class=\"mn\">S → P → A → A<\/span> — Socrates taught Plato, Plato taught Aristotle, Aristotle taught Alexander.<br><b>Explorers in order<\/b>: <span class=\"mn\">D-C-V-C-M<\/span> — 'Dear Children, Visit Calicut by Map' = Dias 1488, Columbus 1492, Vasco 1498, Cabral 1500, Magellan 1519."},{"k":"trap","h":"<b>Columbus sailed for Spain<\/b>, not Portugal, and never reached India. <b>Magellan died on the way<\/b> — the voyage was finished by <b>Elcano<\/b>. <b>Julius Caesar was never emperor<\/b>; <b>Augustus<\/b> was the first. The <b>Hydaspes is the Jhelum<\/b>, but the river where Alexander's army <b>stopped<\/b> is the <b>Beas<\/b>. <b>Cuneiform = Mesopotamia<\/b>, <b>hieroglyphics = Egypt<\/b>. <b>Magna Carta<\/b> is 1215 (King John), not the 1689 Bill of Rights."}],"sum":["Mesopotamia grew on the Tigris and Euphrates with cuneiform writing and Hammurabi's code; Egypt on the Nile with hieroglyphics and pyramids; China on the Huang He.","Socrates taught Plato, Plato taught Aristotle, and Aristotle taught Alexander, who defeated Porus on the Hydaspes (Jhelum) in 326 BCE and turned back at the Beas.","Julius Caesar was killed in 44 BCE and Augustus became the first Roman emperor in 27 BCE; the Prophet's Hijra to Medina in 622 CE begins the Islamic calendar.","Magna Carta came in 1215, Constantinople fell in 1453, Gutenberg built his press around 1440, and Martin Luther posted his Ninety-five Theses in 1517.","Dias rounded the Cape in 1488, Columbus reached America in 1492, Vasco da Gama reached Calicut in 1498, Cabral reached Brazil in 1500, and Magellan's voyage of 1519 to 1522 was the first round the world."],"app":"worldhist"},
{"id":"L29","g":"wld","heat":2,"title":"World revolutions & the World Wars","hi":"विश्व क्रांतियाँ एवं विश्व युद्ध","blocks":[{"k":"hot","h":"Usually one question — most often the French Revolution's slogan/date, the Russian Revolution's year and leader, or a World War treaty. Dates and \"who said what\" are enough."},{"k":"story","h":"<p>Indian history did not happen alone, and the exam asks about a few big world events. Start with the revolutions, which share one idea: people, not kings alone, should decide how they are ruled. In England (1688) Parliament became supreme. In America (1776) colonists refused taxes without a say and declared independence. In <b>France (1789)<\/b> people stormed the Bastille under the slogan Liberty, Equality, Fraternity. In <b>Russia (1917)<\/b> the Tsar fell and Lenin's Bolsheviks took power. Meanwhile the Industrial Revolution in England brought machines and factories.<\/p><p>In 1914 an assassination at Sarajevo set off the <b>First World War<\/b>. It ended in 1918, and the Treaty of Versailles punished Germany hard. The League of Nations was set up to keep the peace, but it failed. Germany's anger at Versailles helped <b>Hitler<\/b> rise. In 1939 Germany invaded Poland, and the <b>Second World War<\/b> began. The USA joined after Japan attacked Pearl Harbor in 1941. The war ended in 1945, after atom bombs fell on Hiroshima and Nagasaki.<\/p><p>To stop another such war, the United Nations was set up in 1945, with India among its founding members. The tables list the dates, slogans and treaties to remember.<\/p>","key":"Revolutions spread the idea of rule by the people, and two World Wars, linked by the harsh Treaty of Versailles, ended with the founding of the UN."},{"k":"facts","title":"Revolutions","rows":[["<b>Glorious Revolution<\/b>","<b>1688<\/b>, England — bloodless; the Bill of Rights (1689) made Parliament supreme"],["<b>American Revolution<\/b>","<b>1775–83<\/b>; Boston Tea Party <b>1773<\/b>; <b>Declaration of Independence 4 July 1776<\/b> (drafted by <b>Thomas Jefferson<\/b>); slogan \"<b>No taxation without representation<\/b>\"; Treaty of Paris 1783; first President <b>George Washington<\/b>"],["<b>French Revolution<\/b>","<b>1789<\/b> — fall of the <b>Bastille, 14 July 1789<\/b>; slogan \"<b>Liberty, Equality, Fraternity<\/b>\"; thinkers <b>Rousseau<\/b> (<i>Social Contract<\/i>), <b>Voltaire<\/b>, <b>Montesquieu<\/b> (separation of powers); the Reign of Terror (Robespierre); Napoleon took over in 1799"],["<b>Industrial Revolution<\/b>","Began in <b>England<\/b>, ~1760; <b>James Watt<\/b> — steam engine; Hargreaves — spinning jenny; Arkwright — water frame; Crompton — mule; Cartwright — power loom; Stephenson — railway engine (Rocket)"],["<b>Russian Revolution<\/b>","<b>1917<\/b> — the <b>February (March) Revolution<\/b> ended Tsar <b>Nicholas II<\/b>; the <b>October (November) Revolution<\/b> brought the <b>Bolsheviks<\/b> under <b>Lenin<\/b> to power; slogan \"<b>Peace, Land and Bread<\/b>\"; Treaty of Brest-Litovsk 1918; USSR formed 1922"],["<b>Chinese Revolution<\/b>","1911 — Sun Yat-sen ends the Manchu dynasty; <b>1949<\/b> — <b>Mao Zedong<\/b> founds the People's Republic; Long March 1934–35"],["<b>Meiji Restoration<\/b>","1868, Japan — modernisation under the Emperor"],["Unifications","<b>Italy<\/b> — Mazzini, <b>Garibaldi<\/b>, Cavour, 1870; <b>Germany<\/b> — <b>Bismarck<\/b> (\"blood and iron\"), 1871"]]},{"k":"facts","title":"First World War (1914–18)","rows":[["Immediate cause","Assassination of <b>Archduke Franz Ferdinand<\/b> at <b>Sarajevo, 28 June 1914<\/b>, by Gavrilo Princip"],["Sides","<b>Allies<\/b> — Britain, France, Russia, later Italy, Japan, USA (1917) · <b>Central Powers<\/b> — Germany, Austria-Hungary, Ottoman Turkey, Bulgaria"],["Ended","<b>11 November 1918<\/b>; <b>Treaty of Versailles, 28 June 1919<\/b> — punished Germany (war guilt clause, reparations, loss of colonies)"],["<b>League of Nations<\/b>","Set up <b>1920<\/b>, HQ <b>Geneva<\/b>, proposed by US President <b>Woodrow Wilson<\/b> (his <b>Fourteen Points<\/b>); the USA never joined; it failed and was dissolved in 1946"]]},{"k":"facts","title":"Second World War (1939–45)","rows":[["Cause","Germany's invasion of <b>Poland, 1 September 1939<\/b>; the harshness of Versailles and the rise of <b>Hitler<\/b> (Nazi), <b>Mussolini<\/b> (Fascist) and Japan"],["Sides","<b>Allies<\/b> — Britain, France, USSR, USA, China · <b>Axis<\/b> — Germany, Italy, Japan"],["Turning points","Pearl Harbor (<b>7 Dec 1941<\/b>) brought in the USA; Stalingrad (1942–43); <b>D-Day, 6 June 1944<\/b>"],["End","Germany surrendered <b>8 May 1945<\/b> (VE Day); atom bombs on <b>Hiroshima (6 Aug 1945, \"Little Boy\")<\/b> and <b>Nagasaki (9 Aug 1945, \"Fat Man\")<\/b>; Japan surrendered <b>2 September 1945<\/b>"],["<b>United Nations<\/b>","Charter signed <b>26 June 1945<\/b> at San Francisco; came into force <b>24 October 1945<\/b> — <b>UN Day<\/b>; HQ <b>New York<\/b>; 51 founding members, India among them"],["After","<b>Cold War<\/b>; NATO 1949, Warsaw Pact 1955; Berlin Wall 1961–1989; USSR dissolved 1991"]]},{"k":"trick","h":"<b>War dates<\/b> — \"<b>14 to 18, 39 to 45<\/b>\"; each war ends with a treaty town: WWI → <b>Versailles<\/b>, WWII → <b>no single treaty<\/b> (Potsdam/Yalta conferences instead).<br><b>League vs UN<\/b>: <b>League = Geneva, 1920, after WWI<\/b>; <b>UN = New York, 1945, after WWII<\/b>."},{"k":"trap","h":"The <b>October Revolution<\/b> of 1917 is the one that brought the Bolsheviks to power (it falls in November by the modern calendar). <b>Woodrow Wilson proposed the League of Nations but the USA never joined it.<\/b> <b>Hiroshima<\/b> came first (6 Aug), Nagasaki second (9 Aug)."}],"sum":["American Revolution: Boston Tea Party 1773, Declaration of Independence 4 July 1776 (Jefferson), 'no taxation without representation'.","French Revolution 1789: Bastille fell 14 July 1789; 'Liberty, Equality, Fraternity'; Rousseau, Voltaire, Montesquieu.","Russian Revolution 1917: February ended Tsar Nicholas II; October brought Lenin's Bolsheviks; slogan 'Peace, Land and Bread'.","WWI 1914–18: triggered at Sarajevo 28 June 1914; Treaty of Versailles 28 June 1919; League of Nations 1920 at Geneva (Woodrow Wilson's idea; USA never joined).","WWII 1939–45: began with Poland 1 Sept 1939; Pearl Harbor 7 Dec 1941; D-Day 6 June 1944; Hiroshima 6 Aug & Nagasaki 9 Aug 1945; UN came into force 24 Oct 1945."],"app":"worldhist"},
{"id":"L30","g":"wld","heat":3,"title":"Travellers, titles, books & slogans","hi":"यात्री · उपाधियाँ · पुस्तकें · नारे","blocks":[{"k":"hot","h":"This is a pure-marks lesson: SSC loves \"who was called X\", \"who wrote Y\", \"who gave the slogan Z\". Nothing to understand — only to recall. Read it last before the exam."},{"k":"story","h":"<p>This lesson has no story of its own. It collects who-is-who facts from every other lesson: travellers, titles, slogans and books. The best way to learn it is to hang each item on a story you already know.<\/p><p><b>Travellers<\/b>: put them on the line of kings. Megasthenes comes to Chandragupta Maurya, Fa-Hien to Chandragupta II, Hiuen Tsang to Harsha, Al-Beruni with Mahmud of Ghazni, Ibn Battuta to Muhammad bin Tughlaq, Domingo Paes to Krishnadeva Raya, and Englishmen like Thomas Roe to Jahangir. If you can say the kings in order, the travellers follow.<\/p><p><b>Titles<\/b>: group them by era. Older ones: Indian Napoleon (Samudragupta), Parrot of India (Amir Khusrau), Tiger of Mysore (Tipu). Freedom-era ones: Grand Old Man (Naoroji), Lokmanya (Tilak), Netaji (Bose), Sardar (Patel). <b>Slogans<\/b>: link each to its movement. Swaraj is my birthright goes with Tilak and the Extremists, Do or Die with Gandhi and Quit India, Give me blood with Bose and the INA. <b>Books<\/b>: pair each writer with his age, from Kautilya's Arthashastra and Abul Fazl's Ain-i-Akbari to Gandhi's Hind Swaraj. Read this lesson last, as revision before the exam.<\/p>","key":"Hang every traveller, title, slogan and book on a king or a movement you already know, and revise this lesson last."},{"k":"table","title":"Foreign travellers — who, when, under whom","head":["Traveller","From","Came under","Book"],"rows":[["<b>Megasthenes<\/b>","Greece","Chandragupta Maurya","<i>Indica<\/i>"],["Deimachus","Greece","Bindusara","—"],["Dionysius","Greece (Ptolemy's envoy)","Ashoka","—"],["<b>Fa-Hien<\/b>","China","Chandragupta II","<i>Fo-Kuo-Ki<\/i>"],["<b>Hiuen Tsang<\/b>","China","Harshavardhana","<i>Si-Yu-Ki<\/i>"],["<b>I-tsing<\/b>","China","late 7th c.","—"],["<b>Al-Beruni<\/b>","Persia","came with Mahmud of Ghazni","<i>Kitab-ul-Hind / Tahqiq-i-Hind<\/i>"],["<b>Marco Polo<\/b>","Venice","Pandya kingdom, 13th c.","<i>The Book of Ser Marco Polo<\/i>"],["<b>Ibn Battuta<\/b>","Morocco","Muhammad bin Tughlaq","<i>Rehla / Kitab-ul-Rehla<\/i>"],["<b>Nicolo Conti<\/b>","Italy","Devaraya I (Vijayanagara)","—"],["<b>Abdur Razzaq<\/b>","Persia","Devaraya II","—"],["<b>Athanasius Nikitin<\/b>","Russia","Bahmani kingdom","—"],["<b>Domingo Paes<\/b> &amp; Nuniz","Portugal","Krishnadeva Raya","—"],["<b>Ralph Fitch<\/b>","England","Akbar","—"],["<b>William Hawkins<\/b> / <b>Thomas Roe<\/b>","England","Jahangir","—"],["<b>Bernier<\/b> / <b>Tavernier<\/b> / <b>Manucci<\/b>","France / France / Italy","Shah Jahan (&amp; Aurangzeb)","<i>Travels in the Mogul Empire<\/i> / <i>Travels in India<\/i> / <i>Storia do Mogor<\/i>"]]},{"k":"facts","title":"Titles and nicknames","rows":[["Grand Old Man of India","<b>Dadabhai Naoroji<\/b>"],["Father of the Nation","<b>Mahatma Gandhi<\/b> (title given by Subhas Chandra Bose)"],["Mahatma","Gandhi — from <b>Rabindranath Tagore<\/b>"],["Gurudev","<b>Rabindranath Tagore<\/b> — from Gandhi"],["Netaji","<b>Subhas Chandra Bose<\/b>"],["Iron Man of India / Sardar","<b>Vallabhbhai Patel<\/b> (\"Sardar\" from the women of Bardoli)"],["Lokmanya","<b>Bal Gangadhar Tilak<\/b> — also \"Father of Indian unrest\" (Valentine Chirol)"],["Punjab Kesari / Sher-e-Punjab","<b>Lala Lajpat Rai<\/b>"],["Deshbandhu","<b>Chittaranjan Das<\/b>"],["Rajaji","<b>C. Rajagopalachari<\/b>"],["Frontier Gandhi / Badshah Khan","<b>Khan Abdul Ghaffar Khan<\/b>"],["Nightingale of India","<b>Sarojini Naidu<\/b>"],["Loknayak","<b>Jayaprakash Narayan<\/b>"],["Babasaheb","<b>B. R. Ambedkar<\/b>"],["Indian Napoleon","<b>Samudragupta<\/b>"],["Tiger of Mysore","<b>Tipu Sultan<\/b>"],["Parrot of India (Tuti-i-Hind)","<b>Amir Khusrau<\/b>"],["Prince of Pilgrims","<b>Hiuen Tsang<\/b>"],["Akbar of Kashmir","<b>Zain-ul-Abidin<\/b>"],["Napoleon of the East / Lakh Baksh","Muhammad bin Tughlaq-era usage / <b>Qutb-ud-din Aibak<\/b>"],["Maker of modern India","<b>Lord Dalhousie<\/b> (also said of Ram Mohan Roy)"],["Father of local self-government","<b>Lord Ripon<\/b>"],["Father of the Indian civil services","<b>Lord Cornwallis<\/b>"],["Father of the Indian Renaissance","<b>Raja Ram Mohan Roy<\/b>"],["Mother of the Indian Revolution","<b>Madam Bhikaji Cama<\/b>"]]},{"k":"facts","title":"Slogans — who said it","rows":[["\"Swaraj is my birthright and I shall have it\"","<b>Bal Gangadhar Tilak<\/b>"],["\"Do or Die\" (Karo ya Maro)","<b>Mahatma Gandhi<\/b> (Quit India, 1942)"],["\"Give me blood and I will give you freedom\"","<b>Subhas Chandra Bose<\/b>"],["\"Jai Hind\"","<b>Subhas Chandra Bose<\/b> (coined by Abid Hasan)"],["\"Inquilab Zindabad\"","<b>Bhagat Singh<\/b> (coined by <b>Hasrat Mohani<\/b>)"],["\"Sarfaroshi ki tamanna ab hamare dil mein hai\"","<b>Bismil Azimabadi<\/b>, made famous by <b>Ramprasad Bismil<\/b>"],["\"Vande Mataram\"","<b>Bankim Chandra Chatterjee<\/b> — in <i>Anandamath<\/i> (1882)"],["\"Jai Jawan Jai Kisan\"","<b>Lal Bahadur Shastri<\/b>"],["\"Aram Haram Hai\"","<b>Jawaharlal Nehru<\/b>"],["\"Satyameva Jayate\"","<b>Mundaka Upanishad<\/b>"],["\"Delhi Chalo\"","<b>Subhas Chandra Bose<\/b>"],["\"Swaraj for me means freedom for the meanest of my countrymen\"","<b>Mahatma Gandhi<\/b>"],["\"Simon Go Back\"","<b>Yusuf Meherally<\/b>, 1928 (he also coined \"Quit India\")"],["\"Who lives if India dies?\"","<b>Jawaharlal Nehru<\/b>"]]},{"k":"facts","title":"Books & their authors (most asked)","rows":[["Arthashastra","Kautilya"],["Indica","Megasthenes"],["Rajatarangini","Kalhana"],["Harshacharita &amp; Kadambari","Banabhatta"],["Mudrarakshasa","Vishakhadatta"],["Baburnama","Babur"],["Humayun-nama","Gulbadan Begum"],["Akbarnama &amp; Ain-i-Akbari","Abul Fazl"],["Tuzuk-i-Jahangiri","Jahangir"],["Tarikh-i-Firozshahi","Ziauddin Barani"],["Rehla","Ibn Battuta"],["Amuktamalyada","Krishnadeva Raya"],["Padmavat","Malik Muhammad Jayasi"],["Ramcharitmanas","Tulsidas"],["Gita Govinda","Jayadeva"],["Satyarth Prakash","Dayanand Saraswati"],["Gulamgiri","Jyotiba Phule"],["Anandamath","Bankim Chandra Chatterjee"],["Gitanjali","Rabindranath Tagore (Nobel 1913)"],["Poverty and Un-British Rule in India","Dadabhai Naoroji"],["Hind Swaraj &amp; My Experiments with Truth","Mahatma Gandhi"],["Discovery of India &amp; Glimpses of World History","Jawaharlal Nehru"],["Indian War of Independence 1857","V. D. Savarkar"],["Why I am an Atheist","Bhagat Singh"],["The Indian Struggle","Subhas Chandra Bose"],["Annihilation of Caste","B. R. Ambedkar"],["India Wins Freedom","Maulana Abul Kalam Azad"],["Gita Rahasya","Bal Gangadhar Tilak"],["Unhappy India","Lala Lajpat Rai"],["Nil Darpan","Dinabandhu Mitra"]]},{"k":"trick","h":"<b>Traveller ↔ king, by initials<\/b>: <b>M<\/b>egasthenes–<b>M<\/b>aurya, <b>F<\/b>a-Hien–<b>F<\/b>irst Chandragupta II (gold age), <b>H<\/b>iuen Tsang–<b>H<\/b>arsha, <b>I<\/b>bn Battuta–<b>I<\/b>bn under Muhammad bin <b>T<\/b>ughlaq (<i>Battuta brought a Rehla to the Tughlaq<\/i>), <b>B<\/b>ernier–<b>B<\/b>uilder Shah Jahan."},{"k":"trap","h":"<b>Ibn Battuta → Muhammad bin Tughlaq<\/b> and <b>Al-Beruni → Mahmud of Ghazni<\/b> — never swap them. <b>Hawkins came to Jahangir<\/b>, not Akbar; <b>Ralph Fitch<\/b> was Akbar's English visitor. \"Quit India\" and \"Simon Go Back\" were both coined by <b>Yusuf Meherally<\/b>, not Gandhi."}],"sum":["Megasthenes–Chandragupta Maurya; Fa-Hien–Chandragupta II; Hiuen Tsang–Harsha; Al-Beruni–Mahmud of Ghazni; Ibn Battuta–Muhammad bin Tughlaq; Marco Polo–Pandya; Nicolo Conti & Abdur Razzaq–Vijayanagara; Hawkins & Thomas Roe–Jahangir; Bernier & Tavernier–Shah Jahan.","Titles: Grand Old Man–Naoroji; Netaji–Bose; Sardar–Patel; Lokmanya–Tilak; Deshbandhu–C. R. Das; Frontier Gandhi–Ghaffar Khan; Indian Napoleon–Samudragupta; Tiger of Mysore–Tipu; Parrot of India–Amir Khusrau.","Slogans: 'Swaraj is my birthright'–Tilak; 'Do or Die'–Gandhi; 'Give me blood…' & 'Jai Hind'–Bose; 'Inquilab Zindabad'–Bhagat Singh (Hasrat Mohani); 'Jai Jawan Jai Kisan'–Shastri; 'Quit India' & 'Simon Go Back'–Yusuf Meherally.","Books: Arthashastra–Kautilya; Rajatarangini–Kalhana; Ain-i-Akbari–Abul Fazl; Padmavat–Jayasi; Gulamgiri–Phule; Anandamath–Bankim Chandra; India Wins Freedom–Azad; Gita Rahasya–Tilak.","Vande Mataram comes from Bankim Chandra Chatterjee's Anandamath (1882)."],"app":"worldhist"}

const ERANOTE = {"anc":"Start with Indus Valley sites and Buddhism-Jainism terminology, then Mauryan and Gupta rulers - ancient India usually carries 2-3 marks in CGL Tier-1.","med":"Revise Delhi Sultanate innovations and Mughal battle years first, then Bhakti-Sufi saints - medieval India is good for about 1-2 marks in Tier-1.","mod":"Drill the 1757-1947 chronology, the Acts and the Gandhian movements before anything else - modern India alone is worth 2-4 marks, the densest slice of the history section.","art":"Fix classical dance-state and folk painting-state pairs first, then temple architecture styles - art and culture reliably gives 1-2 marks in Tier-1.","wld":"Skim the World Wars, the French and Russian revolutions and the traveller-slogan-book lists - these miscellaneous one-liners add up to roughly 1 mark."};
const INTROS = {"histancient":{"lead":"Ancient India runs from the first stone tools to about 650 CE: the Indus cities, the Vedas, Buddha and Mahavira, and the empires of the Mauryas and Guptas. It is the story of how wandering hunters became farmers, then kingdoms, then empires that left temples, books and ideas still alive today.","tip":"Read each story first, then learn the tables as a chain of cause and effect; keep one simple timeline and add each dynasty to it as you go.","order":"Do L1 to L8 in order, because each period grows out of the one before it, from the Stone Age to Harsha."},"histmedieval":{"lead":"Medieval India covers roughly 700 to 1760 CE: the Turkish invasions, the Delhi Sultanate, Vijayanagara and the Bahmanis, the Mughals, and the rise of the Marathas and Sikhs. It is mostly a story of rulers and their reforms, plus the Bhakti and Sufi saints who changed everyday religion.","tip":"Keep one list of dynasties in order and pin every reform, building or battle to a named ruler, because most exam traps swap two rulers.","order":"Do L9 to L12 for the invasions, the Sultanate and the southern kingdoms, then L13 on the saints, then L14 to L16 on the Mughals, Marathas and Sikhs, since that is the order in which they happened."},"histmodern":{"lead":"Modern India is the story of how a European trading company took control of India and how Indians fought back to win freedom in 1947. It runs from Vasco da Gama in 1498 through Plassey, 1857, the Congress and Gandhi, to independence and the years after it.","tip":"Learn it as one long timeline; most questions ask who did what in which year, so link every event to its date and to the Viceroy of the time.","order":"Go L17 to L25 in order, then do the lessons on press and education, women and lesser-known heroes, and India after 1947, because they build on the main storyline."},"artculture":{"lead":"Art and Culture covers India's dances, music, buildings, paintings, crafts, literature, languages and world heritage sites. It is less about events and more about matching: which dance comes from which state, which temple belongs to which style, which painting to which region.","tip":"Study with a map of India open and place each dance, painting and monument on it; short, frequent revision works better than one long session.","order":"Start with L27 on architecture because it links back to the history lessons, then L26 on dance and music, L28 on painting and crafts, then literature and languages, and finish with UNESCO heritage, which reuses what you have learned."},"worldhist":{"lead":"World History covers the big events outside India that the exam asks about: early civilisations, the Age of Discovery, the great revolutions and the two World Wars. Who's Who collects the famous travellers, titles, slogans and books from all of Indian history.","tip":"For world events, learn a few key dates and one slogan or treaty per event; for Who's Who, link each name to a king or movement you already know.","order":"Read the lesson on ancient civilisations to the Age of Discovery first, then L29 on revolutions and the World Wars, so events stay in time order, and keep L30 for last as quick revision."}};

  h1{font-size:34px} h2{font-size:22px} h3{font-size:17px}

  /* bottom tab bar becomes a left sidebar */
  .nav{top:0;bottom:0;left:0;right:auto;width:var(--side);height:auto;border-top:0;border-right:1px solid var(--rule);padding:84px 14px 20px;display:block;overflow:auto}

  .nav button svg{width:20px;height:20px;flex-shrink:0}
  .nav button:hover{background:var(--sunk)}
  .nav button[aria-current="page"]{background:var(--blue-bg)}
  .nav button[aria-current="page"] span{border-bottom:0!important}

  .hero{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);column-gap:48px;align-items:end;padding-bottom:10px}

  .hero > .row{grid-column:2;grid-row:2;align-self:end}

  /* lesson reader: facts, timelines, tricks sit side by side */
  .lhead{margin-bottom:0}
  .steps{max-width:640px}
  .steps + .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .steps + .stack > .plain,.steps + .stack > .row,.steps + .stack > p,.steps + .stack > .fig,.steps + .stack > h2,.steps + .stack > .tbl{grid-column:1/-1}
  .steps + .stack > .plain{max-width:86ch;font-size:17px}
  .steps + .stack > .hot,.steps + .stack > .story{grid-column:1/-1}
  .steps + .stack > .story{max-width:none;padding:20px 24px;font-size:17.5px}
  .steps + .stack > .story p{max-width:80ch}
  .steps + .stack:not(:has(> .block ~ .block)) > .block{grid-column:1/-1}
  .block,.qcard{padding:18px 20px;border-radius:14px}

  /* quizzes and question bank */
  #lq > .stack{display:grid;grid-template-columns:minmax(0,1fr);max-width:980px;gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qt{font-size:18px}
  #plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #plist .opts{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:wrap;overflow:visible}

  /* mock test: question with the answer grid alongside */
  .mbar{top:calc(env(safe-area-inset-top,0px) + 67px)}
  .view > .qcard{max-width:1000px}
  .view > .row.between{max-width:1000px}
  .view > #msub{max-width:1000px;width:100%}
  .view > .block.stack{max-width:760px}
  .pal{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .kpis{max-width:760px}

  /* revise: summary cards and sheets in columns */
  #rv > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #rv > .stack > .grph,#rv > .stack > p,#rv > .stack > .search,#rv > .stack > .callout{grid-column:1/-1}
  #dgl,#lml,#tll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #dgl > .grph,#dgl > p,#lml > p,#tll > .grph{grid-column:1/-1}
  #rv .search,#rv > #dgl ~ .search{max-width:520px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flash{min-height:300px;max-width:760px;margin:0 auto;padding:32px 36px}
  .flash .front{font-size:22px}

  /* learn: era cards across the top */
  .eras{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}
  .les{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}

</style>
<script id="shabd-deeplink">
(function(){
  var l; try{ l = new URLSearchParams(location.search).get('lesson'); }catch(e){}
  if(!l) return;
  function run(){
    try{
      if(typeof openLesson === 'function' && typeof LESSONS !== 'undefined'){ if(LESSONS.some(function(x){ return x.id === l; })) openLesson(l, 'learn'); }
      else if(typeof openRule === 'function'){ var n = parseInt(String(l).replace(/\D/g, ''), 10); if(n) openRule(n, 'learn'); }
      else if(typeof COURSE !== 'undefined' && typeof go === 'function'){ var i = COURSE.findIndex(function(c){ return c.id === l; }); if(i >= 0) go({ name: 'lesson', i: i, step: 0, ans: {}, score: 0 }); }
    }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(run, 30); }); else setTimeout(run, 30);
})();
</script>

{"id":"L14","g":"med","heat":3,"title":"Mughals — Babur to Aurangzeb","hi":"मुग़ल साम्राज्य","blocks":[{"k":"hot","h":"The <b>heaviest medieval topic<\/b>. Battles with years, Akbar's reforms, Jahangir's and Shah Jahan's buildings, Aurangzeb's policies — 1–2 questions every shift. The battle table below is worth more than any paragraph."},{"k":"story","h":"<p>In 1526 <b>Babur<\/b>, a Central Asian prince descended from Timur, defeated Ibrahim Lodi at the First Battle of Panipat. His field guns and new tactics won the day, and the Mughal empire began. His son Humayun lost the throne to the Afghan <b>Sher Shah Suri<\/b>, who in just five years rebuilt the Grand Trunk Road and issued the silver rupiya. Humayun won the throne back in 1555 but died the next year.<\/p><p>His son <b>Akbar<\/b> was still young, so Bairam Khan won the Second Battle of Panipat for him in 1556. Akbar saw that force alone could not hold so varied a land. He gave Rajput chiefs like Man Singh high command, abolished the jizya (a tax on non-Muslims), and held debates between religions. He ranked his officers in the Mansabdari system and, with Todar Mal, fixed land tax on ten-year averages.<\/p><p>Jahangir loved painting and justice; <b>Shah Jahan<\/b> built the Taj Mahal and the Red Fort. Then <b>Aurangzeb<\/b> turned away from Akbar's tolerance, brought back the jizya, and fought long wars in the Deccan that drained the treasury. The empire was huge when he died, but worn out. The tables give every battle and each emperor's work.<\/p>","key":"Babur founded the empire, Akbar held it together through tolerance and good administration, and Aurangzeb's harsh policies and Deccan wars wore it out."},{"k":"table","title":"Every Mughal battle SSC asks","head":["Year","Battle","Who won / lost"],"rows":[["<b>1526<\/b>","<b>First Panipat<\/b>","<b>Babur<\/b> beat <b>Ibrahim Lodi<\/b> — Mughal rule begins; first Indian use of <i>tulughma<\/i> &amp; field guns"],["<b>1527<\/b>","<b>Khanwa<\/b>","Babur beat <b>Rana Sanga<\/b> of Mewar"],["<b>1528<\/b>","Chanderi","Babur beat Medini Rai"],["<b>1529<\/b>","Ghaghra","Babur beat the Afghans of Bihar/Bengal"],["<b>1539<\/b>","Chausa","<b>Sher Shah Suri<\/b> beat <b>Humayun<\/b>"],["<b>1540<\/b>","Kannauj / Bilgram","Sher Shah beat Humayun again — Humayun flees to Persia"],["<b>1556<\/b>","<b>Second Panipat<\/b>","<b>Bairam Khan<\/b> (for Akbar) beat <b>Hemu<\/b> — Mughal restoration"],["<b>1565<\/b>","Talikota","Deccan sultanates beat Vijayanagara (not Mughal)"],["<b>1576<\/b>","<b>Haldighati<\/b>","Akbar's army (Man Singh) vs <b>Maharana Pratap<\/b> — Pratap withdrew, never submitted"],["<b>1659<\/b>","Samugarh","<b>Aurangzeb<\/b> beat <b>Dara Shikoh<\/b>"],["<b>1739<\/b>","Karnal","<b>Nadir Shah<\/b> beat Muhammad Shah; took the <b>Peacock Throne<\/b> &amp; <b>Koh-i-Noor<\/b>"],["<b>1761<\/b>","<b>Third Panipat<\/b>","<b>Ahmad Shah Abdali<\/b> beat the <b>Marathas<\/b>"]]},{"k":"trick","h":"<b>Three Panipats<\/b> — <span class=\"mn\">1526 · 1556 · 1761<\/span>: <b>B<\/b>abur beats Lodi → <b>A<\/b>kbar(Bairam) beats Hemu → <b>A<\/b>bdali beats Marathas. \"<i>Babur began it, Akbar restored it, Abdali broke the Marathas.<\/i>\"<br><b>Babur's four wins<\/b>: <span class=\"mn\">Pa-Kha-Cha-Gha<\/span> = Panipat, Khanwa, Chanderi, Ghaghra (1526-27-28-29, one per year)."},{"k":"facts","title":"Babur (1526–30) & Humayun (1530–40, 1555–56)","rows":[["Babur","Descendant of <b>Timur (father's side)<\/b> and <b>Genghis Khan (mother's side)<\/b>; ruler of Farghana; invited by Daulat Khan Lodi"],["Babur's memoir","<b><i>Tuzuk-i-Baburi / Baburnama<\/i><\/b> in <b>Turki<\/b> — translated into Persian by Abdur Rahim Khan-i-Khanan"],["Humayun","Lost to Sher Shah, fled to Persia, returned in 1555 with Bairam Khan's help; died falling from the stairs of Din Panah library"],["<b>Humayun's tomb<\/b>","Delhi, built by his widow <b>Hamida Banu Begum (Haji Begum)<\/b>; architect Mirak Mirza Ghiyas; the <b>first garden-tomb<\/b> in India and the model for the Taj — UNESCO site"],["<b>Gulbadan Begum<\/b>","Humayun's sister; wrote <b><i>Humayun-nama<\/i><\/b>"]]},{"k":"facts","title":"Sher Shah Suri (1540–45) — the interlude that is always asked","rows":[["Real name","<b>Farid Khan<\/b>; title Sher Khan for killing a tiger"],["Roads","Rebuilt the <b>Grand Trunk Road<\/b> (Sadak-e-Azam) from Sonargaon (Bengal) to the Indus; built <i>sarais<\/i> every 2 kos"],["Currency","Issued the silver <b>Rupiya<\/b> (178 grains) and copper <b>Dam<\/b> — the ancestor of today's rupee"],["Revenue","Land survey, <b>Patta<\/b> (title deed) &amp; <b>Qabuliyat<\/b> (deed of agreement); tax 1/3 of produce in cash or kind"],["Buildings","<b>Purana Qila<\/b> (Delhi), <b>Rohtasgarh<\/b> fort, his own tomb at <b>Sasaram<\/b> (Bihar)"],["Died","1545, besieging <b>Kalinjar<\/b>"],["Court","<b>Malik Muhammad Jayasi<\/b> wrote <b><i>Padmavat<\/i><\/b> in his time"]]},{"k":"facts","title":"Akbar (1556–1605)","rows":[["Regent","<b>Bairam Khan<\/b> till 1560"],["Revenue system","<b>Zabti / Dahsala<\/b> (1580) under <b>Raja Todar Mal<\/b> — average of 10 years' prices and yields; 1/3 of produce; also Ghalla-bakshi, Nasaq, Kankut"],["<b>Mansabdari<\/b>","Rank system — <b>Zat<\/b> (personal rank) and <b>Sawar<\/b> (cavalry obligation); <b>dagh<\/b> (branding) continued"],["Religion","Abolished <b>jizya (1564)<\/b> and the pilgrimage tax; <b>Din-i-Ilahi (1582)<\/b> — its only notable follower was <b>Birbal<\/b>; built the <b>Ibadat Khana<\/b> (1575) at Fatehpur Sikri for debates; <b>Mahzar/Mazhar<\/b> of 1579 made him the final religious authority"],["<b>Nine jewels (Navaratnas)<\/b>","Abul Fazl, Faizi, Tansen, Birbal, Raja Todar Mal, Abdur Rahim Khan-i-Khanan, Raja Man Singh, Mulla Do Piaza, Fakir Aziao-Din"],["Books of his reign","<b><i>Akbarnama<\/i><\/b> &amp; <b><i>Ain-i-Akbari<\/i><\/b> by <b>Abul Fazl<\/b>; <i>Tabaqat-i-Akbari<\/i> by Nizamuddin Ahmad; <i>Muntakhab-ut-Tawarikh<\/i> by Badauni"],["Buildings","<b>Fatehpur Sikri<\/b> (incl. <b>Buland Darwaza<\/b>, built to mark the Gujarat victory 1573; Panch Mahal; Jodha Bai's palace), Agra Fort, Lahore Fort, Allahabad Fort, Humayun's tomb completed"],["Conquests","Gujarat 1572–73, Bengal 1576, Kabul 1585, Kashmir 1586, Sindh 1591, Kandahar 1595, Khandesh/Asirgarh 1601"]]},{"k":"facts","title":"Jahangir, Shah Jahan, Aurangzeb","rows":[["<b>Jahangir<\/b> (1605–27)","Real name Salim; memoir <b><i>Tuzuk-i-Jahangiri<\/i><\/b>; the <b>chain of justice<\/b> (<i>zanjir-i-adl<\/i>) at Agra fort; married <b>Nur Jahan<\/b> (1611); <b>peak of Mughal painting<\/b> (Ustad Mansur, Abul Hasan); <b>Captain Hawkins<\/b> (1608) and <b>Sir Thomas Roe<\/b> (1615) came; executed <b>Guru Arjan Dev<\/b> (1606)"],["Jahangir's buildings","<b>Itimad-ud-Daulah's tomb<\/b>, Agra (by Nur Jahan for her father) — first full <b>marble<\/b> &amp; <i>pietra dura<\/i> building; Shalimar Bagh, Kashmir; Akbar's tomb at Sikandra"],["<b>Shah Jahan<\/b> (1628–58)","The \"golden age of Mughal architecture\"; built the <b>Taj Mahal<\/b> (for Mumtaz Mahal; architect Ustad Ahmad Lahauri), <b>Red Fort<\/b> &amp; <b>Jama Masjid<\/b> (Delhi), <b>Moti Masjid<\/b> (Agra), <b>Shahjahanabad<\/b>, the <b>Peacock Throne<\/b>; shifted the capital from Agra to <b>Shahjahanabad (Delhi)<\/b> in 1648; travellers <b>Peter Mundy, Bernier, Tavernier, Manucci<\/b>"],["<b>Aurangzeb<\/b> (1658–1707)","Title <b>Alamgir<\/b>, called <b>Zinda Pir<\/b> (living saint); <b>re-imposed jizya (1679)<\/b>; banned music and court painting; longest-reigning Mughal (49 years); executed <b>Guru Tegh Bahadur (1675)<\/b> and <b>Sambhaji (1689)<\/b>; built <b>Bibi ka Maqbara<\/b> (Aurangabad) and <b>Badshahi Masjid<\/b> (Lahore), <b>Moti Masjid<\/b> in the Red Fort; his Deccan wars drained the empire — \"the Deccan ulcer\""]]},{"k":"trick","h":"<b>Memoirs<\/b> — only <b>two<\/b> Mughals wrote their own: <b>Babur<\/b> (<i>Baburnama<\/i>, in Turki) and <b>Jahangir<\/b> (<i>Tuzuk-i-Jahangiri<\/i>, in Persian). Akbar's was written <i>for<\/i> him by Abul Fazl, because Akbar was illiterate.<br><b>Tomb ↔ builder<\/b>: Humayun's tomb → his <b>wife<\/b>; Taj → Shah Jahan for his <b>wife<\/b>; Itimad-ud-Daulah → Nur Jahan for her <b>father<\/b>; Bibi ka Maqbara → Aurangzeb for his <b>wife<\/b>."},{"k":"trap","h":"Jizya was abolished by <b>Akbar (1564)<\/b> and re-imposed by <b>Aurangzeb (1679)<\/b>. <b>Hawkins came under Jahangir<\/b> (1608), not Akbar. Din-i-Ilahi was <b>not a religion with followers<\/b> — essentially only Birbal joined. Mughal <b>painting peaked under Jahangir<\/b>, while <b>architecture peaked under Shah Jahan<\/b>."}],"sum":["Battles: Panipat I 1526 (Babur–Ibrahim Lodi), Khanwa 1527 (Rana Sanga), Chausa 1539 & Kannauj 1540 (Sher Shah–Humayun), Panipat II 1556 (Bairam Khan–Hemu), Haldighati 1576, Samugarh 1659, Karnal 1739, Panipat III 1761.","Sher Shah Suri: Grand Trunk Road, silver Rupiya & copper Dam, Patta–Qabuliyat, Purana Qila, tomb at Sasaram; Padmavat by Jayasi.","Akbar: Dahsala/Zabti under Todar Mal, Mansabdari (Zat & Sawar), jizya abolished 1564, Ibadat Khana 1575, Din-i-Ilahi 1582, Fatehpur Sikri & Buland Darwaza; Akbarnama/Ain-i-Akbari by Abul Fazl.","Jahangir: Tuzuk-i-Jahangiri, chain of justice, Nur Jahan, Hawkins 1608 & Thomas Roe 1615, painting at its peak, Itimad-ud-Daulah's tomb.","Shah Jahan: Taj Mahal, Red Fort, Jama Masjid, Peacock Throne. Aurangzeb: Alamgir/Zinda Pir, jizya back in 1679, longest reign, Bibi ka Maqbara."],"app":"histmedieval"},
{"id":"L15","g":"med","heat":2,"title":"Mughal administration, art & Later Mughals","hi":"मुग़ल प्रशासन · कला · परवर्ती मुग़ल","blocks":[{"k":"hot","h":"Pure terminology marks: Mansabdari words, Jagir types, who held which office, and which European traveller came under which emperor. Later Mughals appear as \"who was the puppet when X happened\"."},{"k":"story","h":"<p>How did the emperors run a land this huge? Through a ladder of officers. Near the top, the <b>Wazir<\/b> handled money and the <b>Mir Bakhshi<\/b> handled the army. The empire was split into provinces called subas, then sarkars (districts), then parganas, then villages, each with its own officers. Most nobles were paid with a <b>jagir<\/b>: the right to collect tax from some land. They did not own that land, and the emperor could move them. Land tax was worked out in several ways, which is why there are so many revenue words to learn.<\/p><p>Many Europeans came to the court and wrote about it. Englishmen like <b>Thomas Roe<\/b> came under Jahangir to win trading rights; Frenchmen like Bernier and Tavernier described Shah Jahan's India.<\/p><p>After Aurangzeb died in 1707, the system cracked. Weak emperors followed one another quickly, and powerful nobles like the Sayyid brothers made and unmade kings. Bengal, Awadh and the Deccan went their own way. In 1739 the Persian ruler <b>Nadir Shah<\/b> invaded and carried off the Peacock Throne. By the time of Plassey and Buxar, the emperor was only a figurehead. The last, Bahadur Shah Zafar, was exiled after 1857. The tables give the offices, the land words and the puppet emperors.<\/p>","key":"The Mughal empire ran on a ladder of officers paid by jagirs, and after 1707 that system cracked under weak emperors and invaders."},{"k":"facts","title":"Officers of the empire","rows":[["<b>Wazir / Diwan-i-Ala<\/b>","Head of revenue and finance"],["<b>Mir Bakhshi<\/b>","Head of the military department &amp; intelligence; paid the mansabdars"],["<b>Mir Saman / Khan-i-Saman<\/b>","Royal household and karkhanas"],["<b>Sadr-us-Sudur<\/b>","Religious affairs, charity and endowments"],["<b>Qazi-ul-Quzat<\/b>","Chief judge"],["<b>Muhtasib<\/b>","Censor of public morals"],["<b>Subedar<\/b>","Provincial governor (province = <b>Suba<\/b>)"],["<b>Faujdar<\/b> / <b>Kotwal<\/b>","Head of a <i>sarkar<\/i> (district) / city police chief"],["<b>Amil / Amalguzar<\/b>","Revenue collector of a <i>pargana<\/i>"],["<b>Qanungo<\/b> &amp; <b>Patwari<\/b>","Keepers of land records"],["Administrative units","<b>Suba → Sarkar → Pargana → Mauza (village)<\/b>"]]},{"k":"facts","title":"Land and jagir words","rows":[["<b>Jagir<\/b>","Revenue assignment in place of salary; holder = <b>Jagirdar<\/b> (he had no ownership of the land)"],["<b>Khalisa<\/b>","Land whose revenue went straight to the imperial treasury"],["<b>Inam<\/b>","Revenue-free grant, usually to scholars/religious men"],["<b>Watan Jagir<\/b>","Hereditary homeland jagir of a Rajput chief"],["<b>Polaj / Parauti / Chachar / Banjar<\/b>","Akbar's four land classes — annually cultivated / left fallow a year / fallow 2–3 years / fallow 5+ years"],["<b>Zabti / Dahsala<\/b>","Measured land, cash rate per bigha from 10-year averages"],["<b>Ghalla-bakshi (Batai)<\/b>","Crop sharing"],["<b>Nasaq<\/b>","Rough estimate from past figures"],["<b>Kankut<\/b>","Estimate by eye of the standing crop"]]},{"k":"table","title":"European travellers ↔ emperor","head":["Traveller","Country","Came under"],"rows":[["<b>Captain William Hawkins<\/b>","England","Jahangir (1608)"],["<b>Sir Thomas Roe<\/b>","England","Jahangir (1615) — got the Surat trading rights"],["<b>Edward Terry<\/b>","England","Jahangir"],["<b>Peter Mundy<\/b>","England","Shah Jahan — wrote on Indian village life"],["<b>Francois Bernier<\/b>","France","Shah Jahan &amp; Aurangzeb — <i>Travels in the Mogul Empire<\/i>; called India's land \"owned by the king\""],["<b>Jean-Baptiste Tavernier<\/b>","France","Shah Jahan — jeweller; described the Peacock Throne"],["<b>Niccolao Manucci<\/b>","Italy","Shah Jahan/Aurangzeb — <i>Storia do Mogor<\/i>"],["<b>Jean de Thevenot<\/b>","France","Aurangzeb"],["<b>Ralph Fitch<\/b>","England","Akbar — first Englishman to visit"],["<b>Father Monserrate<\/b>","Portugal","Akbar"]]},{"k":"facts","title":"Later Mughals — who was on the throne when","rows":[["<b>Bahadur Shah I<\/b> (1707–12)","\"Shah-i-Bekhabar\"; released Shahu"],["<b>Jahandar Shah<\/b> (1712–13)","Put up by Zulfiqar Khan; abolished jizya"],["<b>Farrukhsiyar<\/b> (1713–19)","Gave the <b>1717 farman<\/b> (\"Magna Carta of the Company\") to the English; killed by the <b>Sayyid brothers<\/b> — the \"kingmakers\""],["<b>Muhammad Shah \"Rangila\"<\/b> (1719–48)","<b>Nadir Shah's invasion 1739<\/b>; Deccan, Awadh &amp; Bengal became independent"],["<b>Ahmad Shah<\/b> (1748–54)","Ahmad Shah Abdali's raids begin"],["<b>Alamgir II<\/b> (1754–59)","<b>Battle of Plassey 1757<\/b> in his reign"],["<b>Shah Alam II<\/b> (1759–1806)","<b>Battle of Buxar 1764<\/b>; gave the <b>Diwani of Bengal<\/b> to the Company (1765); first to accept Company protection (1803)"],["<b>Akbar II<\/b> (1806–37)","Gave <b>Ram Mohan Roy<\/b> the title \"Raja\""],["<b>Bahadur Shah II \"Zafar\"<\/b> (1837–57)","<b>Last Mughal<\/b>; made the figurehead of 1857; exiled to <b>Rangoon<\/b>, died 1862"]]},{"k":"trick","h":"<b>Battle ↔ puppet emperor<\/b>: Nadir Shah 1739 → <b>Muhammad Shah<\/b>; Plassey 1757 → <b>Alamgir II<\/b>; Buxar 1764 → <b>Shah Alam II<\/b>; 1857 → <b>Bahadur Shah Zafar<\/b>.<br><b>Units<\/b>, big to small — <span class=\"mn\">Su-Sa-Pa-Mau<\/span> = Suba, Sarkar, Pargana, Mauza."},{"k":"trap","h":"A <b>jagirdar owned no land<\/b> — only the right to collect its revenue; jagirs were transferable. <b>Mir Bakhshi<\/b> is the <i>military<\/i> head, not the finance head (that is the Wazir/Diwan). <b>Thomas Roe<\/b> came to Jahangir, <b>Ralph Fitch<\/b> to Akbar — Roe is the famous one for the Surat <i>farman<\/i>."}],"sum":["Wazir/Diwan = finance; Mir Bakhshi = military; Mir Saman = household; Sadr-us-Sudur = religion; Qazi-ul-Quzat = chief judge; Muhtasib = public morals.","Units Suba → Sarkar → Pargana → Mauza. Jagir = revenue assignment, not land ownership; Khalisa = crown land.","Akbar's land classes: Polaj, Parauti, Chachar, Banjar. Revenue methods: Zabti/Dahsala, Ghalla-bakshi, Nasaq, Kankut.","Hawkins 1608 & Thomas Roe 1615 → Jahangir; Bernier, Tavernier, Peter Mundy, Manucci → Shah Jahan; Ralph Fitch → Akbar.","Farrukhsiyar gave the 1717 farman; Nadir Shah invaded under Muhammad Shah (1739); Bahadur Shah Zafar was the last Mughal, exiled to Rangoon."],"app":"histmedieval"},
{"id":"L16","g":"med","heat":2,"title":"Marathas & the Sikhs","hi":"मराठा · सिख","blocks":[{"k":"hot","h":"Shivaji's coronation and his eight ministers, the Peshwas in order, the three Anglo-Maratha wars, and the ten Sikh Gurus — all repeat questions."},{"k":"story","h":"<p>As Mughal power weakened, two peoples built their own states: the Marathas in the west and the Sikhs in Punjab. <b>Shivaji<\/b>, son of Shahji Bhonsle and Jijabai, used the hills and forts of Maharashtra to fight much bigger armies. He killed the general Afzal Khan, raided Surat and escaped from Aurangzeb's detention at Agra. In 1674 he was crowned Chhatrapati at Raigad. He ran his kingdom with eight ministers and collected chauth, a quarter of the revenue.<\/p><p>After him, real power passed to the chief ministers, the <b>Peshwas<\/b>. Under Baji Rao I Maratha power spread into north India. But in 1761 Ahmad Shah Abdali crushed them at the Third Battle of Panipat. They recovered, but three wars with the British, ending in 1818, finished Maratha power.<\/p><p>The Sikh story is a line of ten Gurus, starting with Guru Nanak. Mughal pressure, including the execution of Guru Arjan Dev and <b>Guru Tegh Bahadur<\/b>, turned a peaceful community into a fighting one. In 1699 <b>Guru Gobind Singh<\/b> founded the Khalsa. Later Maharaja Ranjit Singh built a Sikh kingdom at Lahore. The tables list the ministers, Peshwas, wars and Gurus.<\/p>","key":"As the Mughals weakened, Shivaji and the Peshwas built Maratha power and the Sikh Gurus built the Khalsa, until the British ended both."},{"k":"facts","title":"Shivaji (1627/30–1680)","rows":[["Parents","Father <b>Shahji Bhonsle<\/b>, mother <b>Jijabai<\/b>; guru Ramdas (<i>Dasbodh<\/i>); teacher Dadaji Kondadev"],["Coronation","<b>1674 at Raigad<\/b>; title <b>Chhatrapati<\/b> (also Haindava Dharmoddharak)"],["Afzal Khan","Killed at <b>Pratapgarh (1659)<\/b>"],["Shaista Khan","Attacked at Pune (1663); Shivaji raided <b>Surat (1664)<\/b>"],["<b>Treaty of Purandar<\/b>","<b>1665<\/b> with <b>Jai Singh<\/b> — gave up 23 forts"],["Agra","Escaped from Aurangzeb's detention at Agra, 1666"],["<b>Ashtapradhan<\/b> — eight ministers","<b>Peshwa<\/b> (PM) · <b>Amatya/Majumdar<\/b> (finance) · <b>Sachiv/Shurunavis<\/b> (correspondence) · <b>Mantri/Waqia-navis<\/b> (personal records) · <b>Senapati/Sari-i-Naubat<\/b> (army) · <b>Sumant/Dabir<\/b> (foreign affairs) · <b>Nyayadhish<\/b> (justice) · <b>Panditrao<\/b> (religion &amp; charity)"],["Taxes","<b>Chauth<\/b> = 1/4 of revenue; <b>Sardeshmukhi<\/b> = extra 1/10 as hereditary right"],["Successors","<b>Sambhaji<\/b> (executed by Aurangzeb, 1689) → Rajaram → Tarabai (regent) → <b>Shahu<\/b> (1707)"]]},{"k":"facts","title":"The Peshwas (real power after 1713)","rows":[["<b>Balaji Vishwanath<\/b> (1713–20)","First Peshwa; got Chauth &amp; Sardeshmukhi rights from the Mughals (1719)"],["<b>Baji Rao I<\/b> (1720–40)","Greatest Peshwa; \"the fighting Peshwa\"; Maratha confederacy spreads north"],["<b>Balaji Baji Rao / Nana Saheb<\/b> (1740–61)","<b>Third Battle of Panipat, 14 Jan 1761<\/b> — crushing defeat by <b>Ahmad Shah Abdali<\/b>; Vishwas Rao &amp; Sadashiv Rao Bhau died"],["<b>Madhav Rao I<\/b>","Revived Maratha power"],["<b>Baji Rao II<\/b>","Last Peshwa; signed the <b>Treaty of Bassein (1802)<\/b>, deposed 1818"],["Great houses","<b>Gaekwad<\/b> (Baroda), <b>Holkar<\/b> (Indore), <b>Scindia<\/b> (Gwalior), <b>Bhonsle<\/b> (Nagpur)"]]},{"k":"table","title":"Anglo-Maratha wars","head":["War","Years","Ended by","Result"],"rows":[["First","1775–82","<b>Treaty of Salbai<\/b> (1782)","Status quo; 20 years of peace. (Treaty of Surat 1775 and Wadgaon 1779 came in between)"],["Second","1803–05","Treaties of Deogaon, Surji-Arjungaon","Marathas broken up after the <b>Treaty of Bassein (1802)<\/b> put Baji Rao II under subsidiary alliance"],["Third","1817–18","—","Peshwaship abolished; <b>Maratha power ends<\/b> under Lord Hastings"]]},{"k":"facts","title":"The ten Sikh Gurus","rows":[["1. <b>Guru Nanak<\/b> (1469–1539)","Founder; born Talwandi (Nankana Sahib)"],["2. Guru Angad","Created the <b>Gurmukhi<\/b> script"],["3. Guru Amar Das","Started the <b>Manji<\/b> system; Akbar visited"],["4. <b>Guru Ram Das<\/b>","Founded <b>Amritsar<\/b>; Akbar granted the land"],["5. <b>Guru Arjan Dev<\/b>","Compiled the <b>Adi Granth<\/b>; built the <b>Harmandir Sahib<\/b>; <b>executed by Jahangir (1606)<\/b> — the first martyr"],["6. Guru Hargobind","Militarised the Sikhs; <b>Akal Takht<\/b>; the two swords (<i>miri<\/i> &amp; <i>piri<\/i>)"],["7. Guru Har Rai · 8. Guru Har Krishan","Short tenures"],["9. <b>Guru Tegh Bahadur<\/b>","<b>Executed by Aurangzeb (1675)<\/b> at Chandni Chowk"],["10. <b>Guru Gobind Singh<\/b>","Founded the <b>Khalsa at Anandpur Sahib, 1699<\/b> (Baisakhi); the <b>five Ks<\/b>; made the <b>Guru Granth Sahib<\/b> the eternal Guru; <i>Dasam Granth<\/i>; died 1708 at Nanded"],["After the Gurus","<b>Banda Bahadur<\/b> (1708–16) fought the Mughals; <b>Maharaja Ranjit Singh<\/b> (1799–1839) built the Sikh kingdom at Lahore, held the Koh-i-Noor"]]},{"k":"trick","h":"<b>Ashtapradhan's first two<\/b>: <b>Peshwa<\/b> = prime, <b>Amatya<\/b> = accounts (both start with the work they do). <b>Chauth = chaar (1/4)<\/b>, <b>Sardeshmukhi = 1/10<\/b>.<br><b>Gurus to remember by number<\/b>: <span class=\"mn\">4-Amritsar, 5-Adi Granth, 10-Khalsa<\/span>."},{"k":"trap","h":"Shivaji's coronation is <b>1674<\/b> at <b>Raigad<\/b>, not Pratapgarh (that is where he killed Afzal Khan, 1659). The <b>Third Battle of Panipat (1761)<\/b> was Marathas vs <b>Ahmad Shah Abdali<\/b> — the British were not involved. <b>Guru Arjan Dev<\/b> was executed by <b>Jahangir<\/b>; <b>Guru Tegh Bahadur<\/b> by <b>Aurangzeb<\/b>."}],"sum":["Shivaji: crowned 1674 at Raigad as Chhatrapati; killed Afzal Khan at Pratapgarh 1659; Treaty of Purandar 1665; Ashtapradhan of eight ministers; taxes Chauth (1/4) and Sardeshmukhi (1/10).","Peshwas: Balaji Vishwanath → Baji Rao I → Balaji Baji Rao (Panipat III, 14 Jan 1761, lost to Ahmad Shah Abdali) → Madhav Rao I → Baji Rao II (Treaty of Bassein 1802).","Anglo-Maratha wars: I ended by the Treaty of Salbai 1782; II after Bassein 1802; III (1817–18) ended Maratha power and the Peshwaship.","Sikh Gurus: 2nd Angad made Gurmukhi, 4th Ram Das founded Amritsar, 5th Arjan Dev compiled the Adi Granth (killed by Jahangir, 1606), 9th Tegh Bahadur killed by Aurangzeb (1675), 10th Gobind Singh founded the Khalsa in 1699.","Maratha houses: Gaekwad–Baroda, Holkar–Indore, Scindia–Gwalior, Bhonsle–Nagpur."],"app":"histmedieval"},
{"id":"L17","g":"mod","heat":3,"title":"Europeans arrive · Plassey & Buxar","hi":"यूरोपीय आगमन · प्लासी एवं बक्सर","blocks":[{"k":"hot","h":"Order of arrival, factory locations, and the <b>Plassey–Buxar pair<\/b> are asked every year. The one-line difference: <b>Plassey gave the Company Bengal; Buxar gave it the legal right to Bengal.<\/b>"},{"k":"story","h":"<p>In 1498 the Portuguese sailor <b>Vasco da Gama<\/b> reached Calicut by sea. Europe wanted Indian spices and cloth, and now it had a sea route. The Dutch, English, Danes and French followed. Each set up trading companies and factories (trading posts, not workshops) along the coast. At first they were only traders who needed the permission of Indian rulers.<\/p><p>But the companies also had soldiers and forts, and they fought each other. In the south the English beat the French in the Carnatic Wars. In Bengal, the young Nawab <b>Siraj-ud-Daulah<\/b> distrusted the English East India Company. The English commander <b>Robert Clive<\/b> won over the Nawab's commander <b>Mir Jafar<\/b> with a promise: betray your master and you will be Nawab. At Plassey on 23 June 1757 Siraj was betrayed and lost. In one afternoon the traders became the real power in Bengal.<\/p><p>The next Nawab, Mir Qasim, tried to stop the Company's abuse of its trade passes. He joined the Nawab of Awadh and the Mughal emperor Shah Alam II, but all three lost at <b>Buxar<\/b> in 1764. In 1765 the emperor gave the Company the Diwani, the legal right to collect Bengal's revenue. Plassey gave power; Buxar gave the right.<\/p>","key":"European trading companies fought over India's trade; Plassey (1757) gave the English power in Bengal and Buxar (1764) gave them the legal right."},{"k":"table","title":"Who came when (order of arrival)","head":["Power","Came","First factory","Note"],"rows":[["<b>Portuguese<\/b>","<b>1498<\/b> — Vasco da Gama lands at <b>Calicut<\/b>, welcomed by the Zamorin","Cochin (1500/1503)","First in, <b>last out<\/b> (Goa, Daman &amp; Diu freed in <b>1961<\/b>); first Viceroy <b>Francisco de Almeida<\/b>; real founder <b>Alfonso de Albuquerque<\/b> (took Goa, 1510)"],["<b>Dutch<\/b>","1602 — United East India Company","<b>Masulipatnam<\/b> (1605)","Beaten by the English at the <b>Battle of Bedara (1759)<\/b>; traded in spices &amp; textiles; Pulicat mint"],["<b>English<\/b>","1600 charter from Elizabeth I","<b>Surat<\/b> (1613, under Jahangir)","Factories: Surat, Masulipatnam, <b>Madras/Fort St George (1639)<\/b>, <b>Bombay (1668, from Charles II)<\/b>, <b>Calcutta/Fort William (1690, Job Charnock)<\/b>"],["<b>Danish<\/b>","1616","<b>Tranquebar<\/b> (1620), Serampore","Sold their settlements to the English in 1845"],["<b>French<\/b>","1664 — under Colbert, Louis XIV","<b>Surat<\/b> (1668), then <b>Pondicherry (1674)<\/b>","Chandernagore, Mahe, Karaikal, Yanam; lost the Carnatic wars"]]},{"k":"trick","h":"<b>Order of arrival<\/b> — <span class=\"mn\">Po-Du-En-Da-Fr<\/span>: <b>Po<\/b>rtuguese (1498), <b>Du<\/b>tch, <b>En<\/b>glish, <b>Da<\/b>nish, <b>Fr<\/b>ench. \"<i>Portuguese came first and left last.<\/i>\"<br><b>English presidency forts<\/b>: <b>Madras = Fort St George<\/b>, <b>Calcutta = Fort William<\/b>, <b>Bombay = Fort St David? No —<\/b> Fort St David is <b>Cuddalore<\/b>. Remember <span class=\"mn\">George–Madras, William–Calcutta, David–Cuddalore<\/span>."},{"k":"table","title":"Carnatic Wars (English vs French)","head":["War","Years","Treaty / result"],"rows":[["First","1746–48","<b>Treaty of Aix-la-Chapelle<\/b> — inconclusive"],["Second","1749–54","Treaty of Pondicherry; <b>Dupleix<\/b> recalled; English gain"],["Third","1758–63","<b>Battle of Wandiwash (1760)<\/b> — Eyre Coote crushes Lally; <b>Treaty of Paris (1763)<\/b> ends French ambitions in India"]]},{"k":"facts","title":"Bengal: the two battles that made an empire","rows":[["<b>Black Hole tragedy<\/b>","1756 — alleged suffocation of English prisoners by <b>Siraj-ud-Daulah<\/b>; reported by Holwell"],["<b>Battle of Plassey<\/b>","<b>23 June 1757<\/b> — <b>Robert Clive<\/b> beat <b>Siraj-ud-Daulah<\/b>, who was betrayed by <b>Mir Jafar<\/b>, Rai Durlabh and Jagat Seth. Mir Jafar became Nawab"],["Mir Qasim","Replaced Mir Jafar (1760), then resisted the Company's misuse of <i>dastak<\/i> — abolished all inland duties"],["<b>Battle of Buxar<\/b>","<b>22 October 1764<\/b> — <b>Hector Munro<\/b> beat the joint army of <b>Mir Qasim + Shuja-ud-Daulah (Awadh) + Shah Alam II (Mughal)<\/b>. The decisive one"],["<b>Treaty of Allahabad<\/b>","<b>1765<\/b> — Awadh returned to Shuja-ud-Daulah as a buffer; the Company got <b>Kara &amp; Allahabad<\/b>"],["<b>Diwani rights<\/b>","1765 — Shah Alam II granted the Company the <b>Diwani (revenue collection) of Bengal, Bihar &amp; Odisha<\/b>"],["<b>Dual government<\/b>","1765–72, set up by <b>Clive<\/b> — the Company collected revenue (Diwani) while the Nawab kept administration (Nizamat); ended by <b>Warren Hastings<\/b> in 1772"],["<b>Bengal famine<\/b>","1770 — about a third of Bengal's population died"]]},{"k":"trick","h":"<b>Plassey vs Buxar<\/b> — <span class=\"mn\">P 1757 = Power, B 1764 = Bill of rights<\/span>. Plassey made the Company the real master of Bengal; Buxar + the 1765 Diwani made it the <i>legal<\/i> master. Dates read like a ladder: <b>57 → 64 → 65<\/b>."},{"k":"trap","h":"<b>Clive<\/b> fought Plassey; <b>Hector Munro<\/b> fought Buxar — don't give Clive both. The Diwani was granted in <b>1765<\/b>, not 1757. The <b>Battle of Wandiwash (1760)<\/b> settled the French question, while <b>Bedara (1759)<\/b> settled the Dutch."}],"sum":["Order: Portuguese (1498, Vasco da Gama at Calicut) → Dutch (Masulipatnam) → English (Surat 1613) → Danish (Tranquebar) → French (Pondicherry 1674).","Forts: Fort St George–Madras (1639), Fort William–Calcutta (1690, Job Charnock), Fort St David–Cuddalore. Bombay came from Charles II in 1668.","Carnatic Wars: I ended by Aix-la-Chapelle; III decided at Wandiwash 1760 and the Treaty of Paris 1763. Dutch beaten at Bedara 1759.","Plassey 23 June 1757 — Clive beat Siraj-ud-Daulah (betrayed by Mir Jafar). Buxar 22 Oct 1764 — Munro beat Mir Qasim + Shuja-ud-Daulah + Shah Alam II.","Treaty of Allahabad 1765; Diwani of Bengal, Bihar & Odisha granted 1765; Dual government 1765–72 (Clive), ended by Warren Hastings."],"app":"histmodern"},
{"id":"L18","g":"mod","heat":2,"title":"British expansion — Mysore, Sikh & annexations","hi":"ब्रिटिश विस्तार","blocks":[{"k":"hot","h":"The Anglo-Mysore and Anglo-Sikh wars with their treaties, plus the two tools of expansion — <b>Subsidiary Alliance (Wellesley)<\/b> and <b>Doctrine of Lapse (Dalhousie)<\/b> — and which states each swallowed."},{"k":"story","h":"<p>Once the Company held Bengal, it wanted more, and it grew in two ways: war and clever treaties. In the south, <b>Haidar Ali<\/b> and his son <b>Tipu Sultan<\/b> of Mysore were its toughest enemies. They fought four wars. Tipu, the Tiger of Mysore, died defending his capital Seringapatam in 1799. In the north-west, the Sikh kingdom fell after two wars, and Punjab was annexed in 1849.<\/p><p>Wars cost money, so the British also used rules. <b>Lord Wellesley<\/b> brought in the Subsidiary Alliance (1798). An Indian king kept his throne but had to keep and pay for a British army, accept a British officer called a Resident at his court, and give up his own foreign policy. Hyderabad signed first. Slowly such rulers became powerless.<\/p><p>Fifty years later <b>Lord Dalhousie<\/b> used the Doctrine of Lapse: if a ruler died without a natural heir, his state passed to the Company. Satara, Jhansi and Nagpur were taken this way. In 1856 he took Awadh too, on the charge of misgovernment. Wars with Nepal, Burma and Afghanistan, and the annexation of Sindh, filled out the map. Anger over these lost kingdoms fed straight into 1857. The tables give each war, treaty and annexation.<\/p>","key":"The Company grew by wars against Mysore and the Sikhs and by two tools: Wellesley's Subsidiary Alliance and Dalhousie's Doctrine of Lapse."},{"k":"table","title":"Anglo-Mysore Wars","head":["War","Years","Against","Ended by"],"rows":[["First","1767–69","Haidar Ali","Treaty of Madras"],["Second","1780–84","Haidar Ali, then <b>Tipu Sultan<\/b>","<b>Treaty of Mangalore (1784)<\/b> — Haidar died in 1782"],["Third","1790–92","Tipu Sultan vs <b>Cornwallis<\/b>","<b>Treaty of Seringapatam (1792)<\/b> — Tipu lost half his kingdom"],["Fourth","1799","Tipu vs <b>Wellesley<\/b>","<b>Tipu died defending Seringapatam<\/b>, 4 May 1799 — the \"Tiger of Mysore\"; Wodeyars restored under subsidiary alliance"]]},{"k":"table","title":"Anglo-Sikh Wars","head":["War","Years","Ended by","Result"],"rows":[["First","1845–46","<b>Treaty of Lahore<\/b> (1846) &amp; Treaty of Bhairowal","Jalandhar Doab taken; Kashmir sold to <b>Gulab Singh<\/b> (Treaty of Amritsar, 1846)"],["Second","1848–49","—","<b>Punjab annexed<\/b> by <b>Dalhousie<\/b>; Dalip Singh exiled; <b>Koh-i-Noor<\/b> taken to England"]]},{"k":"facts","title":"Two tools of annexation","rows":[["<b>Subsidiary Alliance<\/b> — Lord Wellesley (1798)","The ruler keeps his throne but must keep a British force, pay for it, accept a British Resident, and have no foreign relations. Order of signing: <b>Hyderabad (1798, first)<\/b> → Mysore (1799) → Awadh (1801) → <b>Peshwa Baji Rao II (Bassein, 1802)<\/b> → Scindia, Bhonsle"],["<b>Doctrine of Lapse<\/b> — Lord Dalhousie (1848–56)","If a ruler died without a <b>natural<\/b> heir, the state \"lapsed\" to the Company. Annexed: <b>Satara (1848, first)<\/b>, Jaitpur &amp; Sambalpur (1849), Baghat (1850), <b>Udaipur (1852)<\/b>, <b>Jhansi (1853)<\/b>, <b>Nagpur (1854)<\/b>. <b>Awadh (1856)<\/b> was taken not by lapse but on the charge of <b>misgovernment<\/b>"]]},{"k":"trick","h":"<b>Doctrine of Lapse victims<\/b> — <span class=\"mn\">SA-JA-SA-BA-U-JH-NA<\/span>: Satara, Jaitpur, Sambalpur, Baghat, Udaipur, Jhansi, Nagpur. Remember <b>Satara first, Nagpur last, Awadh not at all<\/b> (Awadh = misgovernment, 1856).<br><b>Subsidiary Alliance firsts<\/b>: <b>H<\/b>yderabad was the <b>first<\/b> to sign — <i>H for \"head of the queue\"<\/i>."},{"k":"facts","title":"Other wars and annexations","rows":[["Anglo-Burmese","1824–26 (Treaty of <b>Yandabo<\/b>), 1852, 1885 — Burma fully annexed"],["Anglo-Afghan","1839–42, 1878–80 (Treaty of Gandamak), 1919 (Treaty of Rawalpindi)"],["Anglo-Nepal","1814–16 — <b>Treaty of Sugauli (1816)<\/b>; gave the British Shimla, Kumaon, Garhwal and the Gurkha recruitment right"],["Sindh","Annexed <b>1843<\/b> by Charles Napier"],["<b>1853 firsts<\/b>","First <b>railway<\/b> (Bombay–Thane, 16 April 1853, 34 km), first <b>telegraph<\/b> (Calcutta–Agra) — both under <b>Dalhousie<\/b>"],["Dalhousie's other work","<b>Wood's Despatch (1854)<\/b> — \"Magna Carta of English education in India\"; Public Works Department; postage stamp (1854); Widow Remarriage preparation"]]},{"k":"trap","h":"<b>Awadh was annexed in 1856 for misgovernment, not under the Doctrine of Lapse<\/b> — the single most common trap in this chapter. Tipu Sultan died in the <b>Fourth<\/b> Anglo-Mysore war (1799), not the third. Punjab was annexed after the <b>Second<\/b> Anglo-Sikh war (1849)."}],"sum":["Anglo-Mysore: II ended by Mangalore 1784, III by Seringapatam 1792, IV (1799) killed Tipu Sultan.","Anglo-Sikh: I ended by the Treaty of Lahore 1846 (Kashmir sold to Gulab Singh at Amritsar); II (1849) annexed Punjab and took the Koh-i-Noor.","Subsidiary Alliance = Wellesley, 1798; Hyderabad signed first, then Mysore, Awadh, the Peshwa (Bassein 1802).","Doctrine of Lapse = Dalhousie; Satara first (1848), then Jaitpur, Sambalpur, Baghat, Udaipur, Jhansi, Nagpur. Awadh (1856) went for misgovernment.","Treaty of Sugauli 1816 (Nepal), Yandabo 1826 (Burma); Sindh annexed 1843; first railway and telegraph 1853 under Dalhousie; Wood's Despatch 1854."],"app":"histmodern"},
{"id":"L19","g":"mod","heat":3,"title":"Governors-General & Viceroys","hi":"गवर्नर-जनरल एवं वायसराय","blocks":[{"k":"hot","h":"Pure \"who did what\" marks — 1 to 2 questions a shift. Learn each name with <b>one or two signature acts<\/b>, and the order of the big ones."},{"k":"story","h":"<p>This lesson is a long list of British rulers, each with a few famous acts. Do not learn it as a list. Learn it as three phases, and inside each phase tie every name to one big act.<\/p><p><b>Phase 1: the Company conquers (1772 to 1856).<\/b> Governors-General build the system and take land. Warren Hastings is the first Governor-General of Bengal. Cornwallis fixes land revenue with the Permanent Settlement. Wellesley spreads the Subsidiary Alliance. Bentinck is the reformer: he abolishes sati and brings English education. <b>Dalhousie<\/b> is the great annexer and moderniser: Doctrine of Lapse, railways, telegraph. Their acts are about land, law and expansion.<\/p><p><b>Phase 2: the Crown rules and Indians wake up (1858 to 1905).<\/b> After 1857 the Governor-General becomes Viceroy; Canning is the last of one and the first of the other. Mayo holds the first census, Lytton gags the Indian-language press, Ripon brings local self-government, and under Dufferin the Congress is born. <b>Phase 3: the freedom struggle (1905 to 1947).<\/b> Each Viceroy now matches a turning point: Curzon partitions Bengal, Minto II brings separate electorates, Chelmsford sees Jallianwala, Irwin signs a pact with Gandhi, Linlithgow faces Quit India, and Mountbatten hands over power. The trick box gives the pairs.<\/p>","key":"Think in three phases, Company conquest, Crown rule with Indian awakening, and the freedom struggle, and tie each ruler to one big act."},{"k":"facts","title":"Governors of Bengal / Governors-General","rows":[["<b>Robert Clive<\/b> (1757–60, 1765–67)","Plassey; <b>Dual government<\/b> in Bengal"],["<b>Warren Hastings<\/b> (1772–85)","First <b>Governor-General of Bengal<\/b> (Regulating Act 1773); ended dual government; <b>Asiatic Society of Bengal (1784, with William Jones)<\/b>; Supreme Court at Calcutta (1774); first Anglo-Maratha and second Anglo-Mysore wars; impeached in England (Edmund Burke)"],["<b>Lord Cornwallis<\/b> (1786–93)","<b>Permanent Settlement of Bengal (1793)<\/b>; <b>Cornwallis Code<\/b>; separated revenue and justice; \"<b>father of Indian civil services<\/b>\"; policy of <b>Europeanisation<\/b>; third Anglo-Mysore war"],["<b>Sir John Shore<\/b> (1793–98)","Policy of <b>non-intervention<\/b>; Charter Act 1793"],["<b>Lord Wellesley<\/b> (1798–1805)","<b>Subsidiary Alliance<\/b>; fourth Anglo-Mysore war (Tipu killed); Fort William College (1800); called himself \"Bengal Tiger\""],["<b>Lord Minto I<\/b> (1807–13)","<b>Treaty of Amritsar (1809)<\/b> with Ranjit Singh"],["<b>Lord Hastings<\/b> (1813–23)","Ended the Marathas (third war); Treaty of Sugauli; ended the \"ring-fence\" policy"],["<b>Lord Amherst<\/b> (1823–28)","First Anglo-Burmese war"],["<b>Lord William Bentinck<\/b> (1828–35)","<b>Abolished sati (1829)<\/b>; suppressed <b>thugee<\/b> and infanticide; <b>English made the medium of instruction (1835, with Macaulay's Minute)<\/b>; Charter Act 1833 made him the first <b>Governor-General of India<\/b>"],["<b>Lord Auckland<\/b> (1836–42)","First Anglo-Afghan war"],["<b>Lord Ellenborough<\/b> (1842–44)","Annexed <b>Sindh (1843)<\/b>; abolished slavery (1843)"],["<b>Lord Hardinge I<\/b> (1844–48)","First Anglo-Sikh war; banned human sacrifice"],["<b>Lord Dalhousie<\/b> (1848–56)","<b>Doctrine of Lapse<\/b>; annexed Punjab &amp; Awadh; <b>first railway and telegraph (1853)<\/b>; <b>Wood's Despatch (1854)<\/b>; postal reform; PWD; Widow Remarriage groundwork; \"maker of modern India\""],["<b>Lord Canning<\/b> (1856–62)","<b>Revolt of 1857<\/b>; last Governor-General and <b>first Viceroy<\/b>; universities of Calcutta, Bombay &amp; Madras (1857); Indian Councils Act 1861; Indian Penal Code enforced (1860)"]]},{"k":"facts","title":"Viceroys (from 1858)","rows":[["<b>Lord Mayo<\/b> (1869–72)","First <b>census<\/b> (1872, non-synchronous); Department of Agriculture; Rajkumar College; <b>only Viceroy murdered in office<\/b> (Andaman, 1872)"],["<b>Lord Lytton<\/b> (1876–80)","Delhi Durbar 1877 (Victoria as <b>Kaiser-i-Hind<\/b>) during a famine; <b>Vernacular Press Act (1878)<\/b>; <b>Arms Act (1878)<\/b>; lowered the ICS age to 19"],["<b>Lord Ripon<\/b> (1880–84)","\"<b>Father of local self-government<\/b>\" (1882); repealed the Vernacular Press Act; <b>Ilbert Bill (1883)<\/b> controversy; first <b>Factory Act (1881)<\/b>; Hunter Commission on education"],["<b>Lord Dufferin<\/b> (1884–88)","<b>Indian National Congress founded (1885)<\/b>; third Anglo-Burmese war"],["<b>Lord Lansdowne<\/b> (1888–94)","Indian Councils Act 1892; <b>Durand Line (1893)<\/b>; Factory Act 1891"],["<b>Lord Curzon<\/b> (1899–1905)","<b>Partition of Bengal (1905)<\/b>; <b>Indian Universities Act (1904)<\/b>; <b>Ancient Monuments Preservation Act (1904)<\/b> — set up the modern ASI; Police Commission (Fraser); created the <b>NWFP<\/b>; famine commission"],["<b>Lord Minto II<\/b> (1905–10)","<b>Morley-Minto Reforms / Indian Councils Act 1909<\/b> — <b>separate electorates<\/b> for Muslims; Muslim League founded 1906 (Dhaka)"],["<b>Lord Hardinge II<\/b> (1910–16)","<b>Capital shifted from Calcutta to Delhi (1911)<\/b>; <b>Partition of Bengal annulled (1911)<\/b>; Delhi Durbar for George V; Hindu Mahasabha (1915)"],["<b>Lord Chelmsford<\/b> (1916–21)","<b>Montagu-Chelmsford Reforms / Act of 1919<\/b>; <b>Rowlatt Act &amp; Jallianwala Bagh (1919)<\/b>; Sadler Commission; Khilafat &amp; Non-Cooperation begin"],["<b>Lord Reading<\/b> (1921–26)","Chauri Chaura (1922); Moplah revolt; <b>repealed the Press Act &amp; the Rowlatt Act (1922)<\/b>; Kakori (1925)"],["<b>Lord Irwin<\/b> (1926–31)","<b>Simon Commission (1928)<\/b>; <b>Lahore session &amp; Purna Swaraj (1929)<\/b>; Dandi March; <b>Gandhi-Irwin Pact (5 March 1931)<\/b>"],["<b>Lord Willingdon<\/b> (1931–36)","Second &amp; third <b>Round Table Conferences<\/b>; <b>Communal Award (1932)<\/b> &amp; <b>Poona Pact<\/b>; <b>Government of India Act 1935<\/b>; RBI set up (1935)"],["<b>Lord Linlithgow<\/b> (1936–43)","Second World War; <b>August Offer (1940)<\/b>; <b>Cripps Mission &amp; Quit India (1942)<\/b>; Bengal famine (1943)"],["<b>Lord Wavell<\/b> (1943–47)","<b>Wavell Plan &amp; Simla Conference (1945)<\/b>; <b>Cabinet Mission (1946)<\/b>; Direct Action Day; INA trials"],["<b>Lord Mountbatten<\/b> (1947–48)","<b>Last Viceroy<\/b>; <b>3 June Plan<\/b>; <b>Indian Independence Act 1947<\/b>; first Governor-General of free India"],["<b>C. Rajagopalachari<\/b> (1948–50)","<b>First and only Indian Governor-General<\/b>"]]},{"k":"trick","h":"<b>Reform ↔ Viceroy pairs<\/b> — <span class=\"mn\">Ri-Lo, Cu-Par, Mi-Sep, Ha-Del, Che-Row, Ir-Pact, Wi-Act35, Lin-QI, Wa-Cab, Mo-Free<\/span>:<br><b>Ri<\/b>pon–<b>Lo<\/b>cal bodies · <b>Cu<\/b>rzon–<b>Par<\/b>tition of Bengal · <b>Mi<\/b>nto II–<b>Sep<\/b>arate electorates · <b>Ha<\/b>rdinge II–<b>Del<\/b>hi capital · <b>Che<\/b>lmsford–<b>Row<\/b>latt/Jallianwala · <b>Ir<\/b>win–Gandhi-Irwin <b>Pact<\/b> · <b>Wi<\/b>llingdon–<b>Act 1935<\/b> · <b>Lin<\/b>lithgow–<b>Q<\/b>uit <b>I<\/b>ndia · <b>Wa<\/b>vell–<b>Cab<\/b>inet Mission · <b>Mo<\/b>untbatten–<b>Free<\/b>dom."},{"k":"trap","h":"<b>Bentinck<\/b> abolished sati (1829) and brought in English education (1835) — not Dalhousie or Ripon. <b>Canning<\/b> is both the <b>last Governor-General<\/b> and the <b>first Viceroy<\/b>. <b>Lytton<\/b> passed the Vernacular Press Act and <b>Ripon repealed<\/b> it. <b>Mayo<\/b> is the census + the only murdered Viceroy."}],"sum":["Warren Hastings = first Governor-General of Bengal; Bentinck = first Governor-General of India; Canning = last Governor-General and first Viceroy; Mountbatten = last Viceroy; Rajagopalachari = only Indian Governor-General.","Cornwallis: Permanent Settlement 1793, father of the Indian civil services. Wellesley: Subsidiary Alliance. Dalhousie: Doctrine of Lapse, railways & telegraph 1853, Wood's Despatch 1854.","Bentinck: sati abolished 1829, English education 1835 (Macaulay's Minute). Mayo: first census 1872; the only Viceroy murdered in office.","Lytton: Vernacular Press Act & Arms Act 1878. Ripon: local self-government 1882, Factory Act 1881, Ilbert Bill 1883. Dufferin: Congress founded 1885. Curzon: Partition of Bengal 1905, Ancient Monuments Act 1904.","Minto II: separate electorates 1909. Hardinge II: capital to Delhi 1911 and partition annulled. Chelmsford: 1919 Act, Rowlatt, Jallianwala. Irwin: Simon Commission, Purna Swaraj, Gandhi-Irwin Pact. Willingdon: Act of 1935, Poona Pact. Linlithgow: Quit India. Wavell: Cabinet Mission."],"app":"histmodern"},
{"id":"L20","g":"mod","heat":3,"title":"Revolt of 1857","hi":"1857 का विद्रोह","blocks":[{"k":"hot","h":"A certainty. The exam asks: who led where, who suppressed it, the immediate cause, which places stayed quiet, and what changed after it."},{"k":"story","h":"<p>By 1857, anger against the Company had piled up. Kings had lost their states to the Doctrine of Lapse, and Awadh had been seized. Craftsmen were ruined and peasants paid heavy land tax. Many feared the British wanted to change their religion. Indian soldiers (sepoys) had low pay and little hope of promotion. Then came the spark: cartridges for the new Enfield rifle, said to be greased with cow and pig fat. This offended Hindu and Muslim soldiers alike.<\/p><p>At Barrackpore, <b>Mangal Pandey<\/b> fired on his officers in March 1857. On 10 May the soldiers at <b>Meerut<\/b> rose, marched to Delhi and declared the old Mughal king Bahadur Shah Zafar their emperor. The revolt spread across north India, and in each centre a local leader took charge: Nana Saheb at Kanpur, Begum Hazrat Mahal at Lucknow, <b>Rani Lakshmibai<\/b> at Jhansi, Kunwar Singh in Bihar.<\/p><p>But Punjab, Bengal and most of the south stayed quiet, and many princes helped the British. By July 1858 the revolt was declared over. Yet it changed everything: Company rule ended, and the British Crown took direct control through a Viceroy. The tables match each centre with its leader and its British suppressor.<\/p>","key":"Years of anger met a spark in the greased cartridges; the revolt failed, but it ended Company rule and brought in the Crown."},{"k":"facts","title":"Causes and the spark","rows":[["Political","Doctrine of Lapse; annexation of Awadh (1856); the Mughal title to be ended after Bahadur Shah"],["Economic","Ruin of handicrafts, heavy land revenue, drain of wealth, <i>Inam<\/i> commission in the Deccan"],["Social/religious","Fear of conversion; abolition of sati and widow remarriage seen as interference; <b>Religious Disabilities Act (1850)<\/b>"],["Military","Indians' low pay and no promotion; <b>General Service Enlistment Act (1856)<\/b> forced overseas service"],["<b>Immediate cause<\/b>","The new <b>Enfield P-53 rifle<\/b> cartridges, greased with cow and pig fat"],["<b>Start<\/b>","<b>29 March 1857 — Mangal Pandey<\/b> at <b>Barrackpore<\/b> (34th Native Infantry) fired on his officers; hanged 8 April. Full revolt at <b>Meerut on 10 May 1857<\/b>; Delhi taken 11–12 May"],["Figurehead","<b>Bahadur Shah II \"Zafar\"<\/b> proclaimed emperor; exiled to <b>Rangoon<\/b> (died 1862)"]]},{"k":"table","title":"Centre ↔ Indian leader ↔ British suppressor","head":["Centre","Indian leader","Suppressed by"],"rows":[["<b>Delhi<\/b>","Bahadur Shah II, <b>Bakht Khan<\/b>","John Nicholson, Hudson, Lt. Willoughby"],["<b>Kanpur<\/b>","<b>Nana Saheb<\/b> &amp; <b>Tantia Tope<\/b> (Ramchandra Pandurang)","<b>Sir Colin Campbell<\/b> / Hugh Wheeler, Havelock"],["<b>Lucknow<\/b>","<b>Begum Hazrat Mahal<\/b> &amp; Birjis Qadr","Colin Campbell &amp; Henry Lawrence (Lawrence died)"],["<b>Jhansi &amp; Gwalior<\/b>","<b>Rani Lakshmibai<\/b> (d. 17/18 June 1858) &amp; Tantia Tope","<b>Sir Hugh Rose<\/b>"],["<b>Bareilly<\/b>","<b>Khan Bahadur Khan<\/b>","Sir Colin Campbell"],["<b>Arrah / Bihar<\/b>","<b>Kunwar Singh<\/b> &amp; Amar Singh","William Taylor, Vincent Eyre"],["<b>Faizabad<\/b>","<b>Maulvi Ahmadullah Shah<\/b>","—"],["<b>Allahabad<\/b>","Liaquat Ali","Colonel Neill"],["<b>Mathura / Barout<\/b>","Devi Singh / Shah Mal","—"],["<b>Assam<\/b>","Kandarpeshwar Singh","—"]]},{"k":"trick","h":"<b>Leader ↔ place<\/b> — \"<b>K<\/b>anpur has <b>N<\/b>ana, <b>L<\/b>ucknow has the <b>Begum<\/b>, <b>J<\/b>hansi has the <b>Rani<\/b>, <b>B<\/b>areilly has <b>Khan<\/b>, <b>A<\/b>rrah has <b>Kunwar<\/b>.\" The British suppressor to remember: <b>Hugh Rose for Jhansi<\/b>, <b>Colin Campbell for Kanpur &amp; Lucknow<\/b>.<br><b>Dates<\/b> — <span class=\"mn\">29 March (Mangal Pandey) → 10 May (Meerut) → 8 July 1858 (declared over)<\/span>."},{"k":"facts","title":"Character, and what changed after","rows":[["Which places stayed calm","<b>Punjab, Sindh, Rajputana, Kashmir, most of South India, Bengal<\/b>; Sikh and Gurkha troops helped the British"],["Who stayed loyal to the British","Scindia of Gwalior, Nizam of Hyderabad, Raja of Jodhpur, Nawab of Bhopal, rulers of Patiala/Nabha/Jind, Holkar"],["Who called it what","<b>V. D. Savarkar<\/b> — \"<b>First War of Indian Independence<\/b>\"; <b>Benjamin Disraeli<\/b> — \"a national rising\"; <b>Sir John Lawrence &amp; Seeley<\/b> — \"a mere sepoy mutiny\"; <b>R. C. Majumdar<\/b> — neither first, nor national, nor a war of independence; <b>Karl Marx<\/b> — a national revolt"],["<b>Government of India Act 1858<\/b>","Company rule ended; power to the <b>Crown<\/b>; office of the <b>Secretary of State for India<\/b> with a 15-member Council created; the <b>Governor-General became Viceroy<\/b>; the Court of Directors and Board of Control abolished"],["<b>Queen's Proclamation (1 Nov 1858)<\/b>","Read at Allahabad by Canning; promised no more annexation and respect for Indian religions and treaties"],["Army reorganised","Ratio of European to Indian troops raised; artillery kept with Europeans; recruitment shifted to \"martial races\" (Punjab, Nepal); Peel Commission (1859)"]]},{"k":"trap","h":"Mangal Pandey's act was at <b>Barrackpore<\/b> (Bengal), while the real revolt broke out at <b>Meerut<\/b> — SSC swaps these. <b>Rani Lakshmibai died at Gwalior<\/b>, not Jhansi. Nana Saheb's general was <b>Tantia Tope<\/b>, whose real name was <b>Ramchandra Pandurang<\/b>. The revolt was declared over on <b>8 July 1858<\/b>."}],"sum":["Immediate cause: Enfield P-53 greased cartridges. Mangal Pandey at Barrackpore, 29 March 1857; revolt from Meerut, 10 May 1857; declared over 8 July 1858.","Delhi–Bakht Khan; Kanpur–Nana Saheb & Tantia Tope; Lucknow–Begum Hazrat Mahal; Jhansi–Rani Lakshmibai (suppressed by Hugh Rose); Bareilly–Khan Bahadur Khan; Arrah–Kunwar Singh; Faizabad–Maulvi Ahmadullah Shah.","Punjab, Sindh, Rajputana, Kashmir, Bengal and most of the south stayed quiet; Sikh and Gurkha troops aided the British.","Savarkar called it the First War of Independence; Sir John Lawrence called it a sepoy mutiny; R. C. Majumdar denied all three claims.","Government of India Act 1858: Crown rule, Secretary of State for India, Governor-General becomes Viceroy. Queen's Proclamation, 1 Nov 1858, read at Allahabad."],"app":"histmodern"},
{"id":"L21","g":"mod","heat":2,"title":"Socio-religious reform movements","hi":"सामाजिक-धार्मिक सुधार आंदोलन","blocks":[{"k":"hot","h":"One question nearly every shift: <b>who founded which organisation, in which year, in which city<\/b>, and their newspaper or slogan. Learn the table, not the story."},{"k":"story","h":"<p>In the 1800s, educated Indians looked hard at their own society. They saw evils like sati (burning a widow on her husband's pyre), child marriage, the ban on widows remarrying, and untouchability. They formed societies to reform things from within. The table looks long, but it sorts easily into four groups.<\/p><p><b>1. The Bengal pioneers<\/b> came first. <b>Raja Ram Mohan Roy<\/b>, the father of the Indian Renaissance, founded the Brahmo Samaj (1828) and helped end sati. Vidyasagar won the right of widows to remarry. <b>2. The revivalists<\/b> looked back to old roots: <b>Dayanand Saraswati's<\/b> Arya Samaj (Back to the Vedas), the Theosophists with Annie Besant, and Vivekananda's Ramakrishna Mission. <b>3. Voices against caste<\/b>: Jyotiba Phule's Satyashodhak Samaj in Pune, Sree Narayana Guru in Kerala, Periyar, and Ambedkar. <b>4. Muslim and Sikh reform<\/b>: Sir Syed Ahmad Khan's Aligarh movement for modern education, the Deoband school, and the Singh Sabha.<\/p><p>Next, tie each group to a city: Brahmo to Calcutta, Prarthana to Bombay, Satyashodhak to Pune, Ramakrishna to Belur. Finally, note that many campaigns ended in a law: sati banned in 1829, widow remarriage allowed in 1856, the Age of Consent Act in 1891. Learn the founder and the year as a pair.<\/p>","key":"Group the reformers into Bengal pioneers, revivalists, anti-caste fighters, and Muslim and Sikh reformers, then tie each to a city and a law."},{"k":"table","title":"Organisation ↔ founder ↔ year ↔ place","head":["Organisation","Founder","Year · Place"],"rows":[["<b>Atmiya Sabha<\/b>","Raja Ram Mohan Roy","1815 · Calcutta"],["<b>Brahmo Samaj<\/b>","<b>Raja Ram Mohan Roy<\/b>","<b>1828<\/b> · Calcutta"],["Tattvabodhini Sabha","Debendranath Tagore","1839 · Calcutta"],["Brahmo Samaj of India","<b>Keshab Chandra Sen<\/b>","1866"],["Sadharan Brahmo Samaj","Anand Mohan Bose &amp; Shivnath Shastri","1878"],["<b>Prarthana Samaj<\/b>","Atmaram Pandurang (with <b>M. G. Ranade<\/b> &amp; R. G. Bhandarkar)","1867 · Bombay"],["<b>Arya Samaj<\/b>","<b>Swami Dayanand Saraswati<\/b>","<b>1875<\/b> · Bombay (HQ later Lahore); slogan \"<b>Back to the Vedas<\/b>\"; book <b><i>Satyarth Prakash<\/i><\/b>; <b>Shuddhi<\/b> movement"],["<b>Theosophical Society<\/b>","<b>Madame Blavatsky &amp; Col. H. S. Olcott<\/b>","1875 · New York; Indian HQ <b>Adyar, Madras (1882)<\/b>; later led by <b>Annie Besant<\/b>"],["<b>Ramakrishna Mission<\/b>","<b>Swami Vivekananda<\/b>","<b>1897<\/b> · Belur, Calcutta; guru <b>Ramakrishna Paramahamsa<\/b>; Vivekananda spoke at the <b>Chicago Parliament of Religions, 1893<\/b>"],["<b>Satyashodhak Samaj<\/b>","<b>Jyotiba Phule<\/b>","1873 · Pune; book <b><i>Gulamgiri<\/i><\/b>; opened the first girls' school (1848) with Savitribai Phule"],["<b>Aligarh Movement / MAO College<\/b>","<b>Sir Syed Ahmad Khan<\/b>","1875 · Aligarh (became AMU in 1920); journal <i>Tahzib-ul-Akhlaq<\/i>"],["<b>Deoband Movement<\/b>","Muhammad Qasim Nanautavi &amp; Rashid Ahmad Gangohi","1866 · Deoband (UP)"],["<b>Ahmadiya Movement<\/b>","Mirza Ghulam Ahmad","1889 · Qadian"],["<b>Singh Sabha<\/b>","Thakur Singh &amp; Gyani Gyan Singh","1873 · Amritsar"],["<b>Servants of India Society<\/b>","<b>Gopal Krishna Gokhale<\/b>","1905 · Bombay"],["<b>Self-Respect Movement<\/b>","<b>E. V. Ramaswami Naicker \"Periyar\"<\/b>","1925 · Tamil Nadu"],["<b>Bahishkrit Hitkarini Sabha<\/b>","<b>B. R. Ambedkar<\/b>","1924 · Bombay; papers <i>Mooknayak<\/i>, <i>Bahishkrit Bharat<\/i>"],["<b>Sree Narayana Dharma Paripalana (SNDP)<\/b>","<b>Sree Narayana Guru<\/b>","1903 · Kerala; \"one caste, one religion, one God\""],["<b>Young Bengal Movement<\/b>","<b>Henry Vivian Derozio<\/b>","1820s–30s · Hindu College, Calcutta"],["Dev Samaj","Shiv Narayan Agnihotri","1887 · Lahore"],["Radhaswami Movement","Tulsi Ram (Shiv Dayal Saheb)","1861 · Agra"]]},{"k":"trick","h":"<b>1875 is a double year<\/b>: <b>Arya Samaj<\/b> AND the <b>Theosophical Society<\/b> AND <b>MAO College, Aligarh<\/b>. Remember <span class=\"mn\">1875 = A-T-A<\/span>.<br><b>Samaj ↔ city<\/b>: <b>Brahmo<\/b>–Calcutta, <b>Prarthana<\/b>–Bombay (Pune region), <b>Arya<\/b>–Bombay/Lahore, <b>Satyashodhak<\/b>–Pune, <b>Ramakrishna<\/b>–Belur."},{"k":"facts","title":"Reformers — the one line each","rows":[["<b>Raja Ram Mohan Roy<\/b>","\"<b>Father of the Indian Renaissance<\/b>\"; got <b>sati abolished (1829)<\/b> with Bentinck; paper <b><i>Sambad Kaumudi<\/i><\/b> (Bengali) &amp; <i>Mirat-ul-Akhbar<\/i> (Persian); title \"Raja\" from Akbar II; died at Bristol, 1833"],["<b>Ishwar Chandra Vidyasagar<\/b>","<b>Widow Remarriage Act, 1856<\/b>; founded Bethune school; paper <i>Som Prakash<\/i>"],["<b>Swami Dayanand Saraswati<\/b>","Arya Samaj; \"Back to the Vedas\"; <i>Satyarth Prakash<\/i>; opposed idol worship and caste"],["<b>Swami Vivekananda<\/b>","Ramakrishna Mission; <i>Rajyoga<\/i>, <i>Karmayoga<\/i>; Chicago speech 1893; his birthday (<b>12 January<\/b>) is National Youth Day"],["<b>Annie Besant<\/b>","Theosophist; <b>Central Hindu College, Banaras (1898)<\/b> which grew into BHU; <b>Home Rule League (1916, Madras)<\/b>; <b>first woman President of the Congress (1917, Calcutta)<\/b>; paper <i>New India<\/i>"],["<b>Jyotiba Phule<\/b>","Satyashodhak Samaj; <i>Gulamgiri<\/i>; first school for girls and for untouchables"],["<b>B. R. Ambedkar<\/b>","Mahad Satyagraha (1927), Kalaram temple entry (1930); <b>Poona Pact (1932)<\/b> with Gandhi; chairman of the <b>Drafting Committee<\/b>; <i>Annihilation of Caste<\/i>; adopted Buddhism, 1956"],["<b>Sir Syed Ahmad Khan<\/b>","Aligarh movement; <i>Asar-us-Sanadid<\/i>; loyalist, urged Muslims to take English education"],["<b>Veerasalingam Pantulu<\/b>","Widow remarriage in Andhra — \"Vidyasagar of the South\""],["<b>Behramji Malabari<\/b>","<b>Age of Consent Act, 1891<\/b>"],["<b>Pandita Ramabai<\/b>","Arya Mahila Samaj; <b>Sharda Sadan<\/b> (1889) for widows"],["<b>Dhondo Keshav Karve<\/b>","Widows' home and the first Indian women's university (SNDT, 1916)"],["<b>Gopal Hari Deshmukh \"Lokahitawadi\"<\/b>","Maharashtra social reform through journalism"]]},{"k":"facts","title":"Reform laws — year and reformer","rows":[["Sati abolished","<b>1829<\/b> — Bentinck + Ram Mohan Roy (Regulation XVII)"],["Slavery abolished","1843 — Ellenborough"],["<b>Hindu Widow Remarriage Act<\/b>","<b>1856<\/b> — Vidyasagar's campaign, under Dalhousie/Canning"],["Female infanticide banned","1795, 1802, 1870 (Act VIII)"],["<b>Age of Consent Act<\/b>","<b>1891<\/b> — Malabari; raised the age to 12"],["<b>Sarda Act (Child Marriage Restraint)<\/b>","<b>1929<\/b> — marriage age 14 for girls, 18 for boys"],["Caste Disabilities Removal Act","1850"]]},{"k":"trap","h":"<b>Brahmo Samaj = 1828 Ram Mohan Roy; Arya Samaj = 1875 Dayanand Saraswati<\/b> — the most-swapped pair in the paper. The <b>Theosophical Society was founded in New York<\/b> (1875), with its Indian HQ at Adyar from 1882. <b>Annie Besant was the first woman Congress President (1917)<\/b>; <b>Sarojini Naidu was the first Indian woman<\/b> President (1925, Kanpur)."}],"sum":["Brahmo Samaj 1828 (Ram Mohan Roy); Prarthana Samaj 1867 (Atmaram Pandurang, Ranade); Arya Samaj 1875 (Dayanand Saraswati, 'Back to the Vedas', Satyarth Prakash).","Theosophical Society 1875 New York, Adyar HQ 1882, later Annie Besant. Ramakrishna Mission 1897 at Belur (Vivekananda; Chicago speech 1893).","Satyashodhak Samaj 1873 (Jyotiba Phule, Gulamgiri); SNDP 1903 (Sree Narayana Guru); Self-Respect Movement 1925 (Periyar); Bahishkrit Hitkarini Sabha 1924 (Ambedkar).","Ram Mohan Roy = sati abolished 1829; Vidyasagar = Widow Remarriage Act 1856; Malabari = Age of Consent Act 1891; Sarda Act 1929.","Annie Besant = first woman Congress President (1917); Sarojini Naidu = first Indian woman President (1925)."],"app":"histmodern"},
{"id":"L31","g":"mod","heat":2,"title":"Press, education & newspapers","hi":"प्रेस · शिक्षा · समाचार पत्र","blocks":[{"k":"hot","h":"Expect one question on <b>who started which newspaper<\/b> and one on an <b>education commission or press law, with its year and Viceroy<\/b>. Pairs like <b>Al-Hilal–Azad<\/b>, <b>Comrade–Mohammad Ali<\/b>, <b>Hunter Commission–Ripon<\/b> and <b>Metcalfe–liberator of the press<\/b> come back again and again."},{"k":"story","h":"<p>When the East India Company first ruled Bengal, there was no newspaper at all. In <b>1780<\/b> an Irishman, <b>James Augustus Hicky<\/b>, printed <i>Hicky's Bengal Gazette<\/i> in Calcutta. He mocked Company officials, and in 1782 his press was seized. From the very start, the rulers feared the printed word.<\/p><p>Indians soon learned to use this weapon. <b>Raja Ram Mohan Roy<\/b> wrote papers in Bengali and Persian; later <i>Amrita Bazar Patrika<\/i>, <i>The Hindu<\/i> and Tilak's <i>Kesari<\/i> carried news of famine, unfair taxes and the Congress to every town. The British answered with laws. <b>Lord Lytton's Vernacular Press Act (1878)<\/b> gagged Indian-language papers, so <i>Amrita Bazar Patrika<\/i> switched to English almost overnight to escape it. New press laws in 1908 and 1910 were aimed at the angry Swadeshi papers.<\/p><p>Schooling followed a similar path. At first the Company backed Persian and Sanskrit learning. Then <b>Macaulay's Minute (1835)<\/b> made English the language of higher education, and <b>Wood's Despatch (1854)<\/b> led to the first three universities in 1857. The result surprised the rulers: English-educated Indians read about liberty and democracy, and used that same English to demand freedom.<\/p>"},{"k":"table","title":"Newspaper ↔ founder ↔ year","head":["Paper","Founder / editor","Year · language · note"],"rows":[["<b><i>Hicky's Bengal Gazette<\/i><\/b>","<b>James Augustus Hicky<\/b>","<b>1780<\/b> · English · Calcutta — <b>India's first newspaper<\/b> (also called the <i>Calcutta General Advertiser<\/i>)"],["<i>Sambad Kaumudi<\/i>","<b>Raja Ram Mohan Roy<\/b>","1821 · Bengali"],["<i>Mirat-ul-Akhbar<\/i>","<b>Raja Ram Mohan Roy<\/b>","1822 · <b>Persian<\/b>; closed in protest against the press regulation of 1823"],["<b><i>Bombay Samachar<\/i><\/b>","Fardunjee Marzban","<b>1822<\/b> · <b>Gujarati<\/b>; still published — among the oldest newspapers in Asia"],["<b><i>Amrita Bazar Patrika<\/i><\/b>","<b>Sisir Kumar Ghosh &amp; Motilal Ghosh<\/b>","<b>1868<\/b> · began in <b>Bengali<\/b>; turned <b>English<\/b> in 1878 to escape the Vernacular Press Act"],["<b><i>The Hindu<\/i><\/b>","G. Subramania Iyer &amp; M. Veeraraghavachariar","<b>1878<\/b> · English · <b>Madras<\/b> (began as a weekly)"],["<i>Kesari<\/i> / <i>Maratha<\/i>","<b>Bal Gangadhar Tilak<\/b> (with Agarkar &amp; Chiplunkar)","1881 · Marathi / English"],["<b><i>Bengalee<\/i><\/b>","<b>Surendranath Banerjee<\/b> (editor from 1879)","English · Calcutta; he was jailed for contempt of court in 1883"],["<b><i>Bande Mataram<\/i><\/b>","<b>Bipin Chandra Pal<\/b>; edited by <b>Aurobindo Ghosh<\/b>","1906 · English daily · Calcutta — voice of the Extremists"],["<b><i>Comrade<\/i><\/b>","<b>Maulana Mohammad Ali<\/b>","1911 · <b>English<\/b> · Calcutta, later Delhi; his Urdu paper was <i>Hamdard<\/i>"],["<b><i>Al-Hilal<\/i><\/b>","<b>Maulana Abul Kalam Azad<\/b>","<b>1912<\/b> · <b>Urdu<\/b> weekly · Calcutta; banned in 1914, followed by <i>Al-Balagh<\/i>"],["<i>Young India<\/i> / <i>Navajivan<\/i>","<b>Mahatma Gandhi<\/b> (from 1919)","English / Gujarati weeklies"],["<i>Harijan<\/i>","<b>Mahatma Gandhi<\/b>","1933 · weekly against untouchability"]]},{"k":"tl","title":"Press laws — tightening and loosening","rows":[["1799","<b>Censorship of the Press Act<\/b> — <b>Wellesley<\/b>, out of fear of French propaganda"],["1823","<b>Licensing Regulations<\/b> — acting Governor-General <b>John Adam<\/b>; Ram Mohan Roy stopped <i>Mirat-ul-Akhbar<\/i> in protest"],["<b>1835<\/b>","<b>Metcalfe's Act<\/b> — <b>Charles Metcalfe<\/b> repealed the 1823 rules: the '<b>liberator of the Indian press<\/b>'"],["1857","Licensing Act — <b>Canning<\/b>, during the Revolt"],["1867","Press and Registration of Books Act — <b>John Lawrence<\/b>"],["<b>1878<\/b>","<b>Vernacular Press Act<\/b> — <b>Lytton<\/b>; the 'gagging act', aimed only at Indian-language papers; <b>repealed by Ripon in 1882<\/b>"],["<b>1908<\/b>","<b>Newspapers (Incitement to Offences) Act<\/b> — <b>Minto II<\/b>, after the Muzaffarpur bomb"],["<b>1910<\/b>","<b>Indian Press Act<\/b> — <b>Minto II<\/b>; papers had to deposit security money"],["1922","The 1908 and 1910 Acts repealed under <b>Reading<\/b>"],["1931","Indian Press (Emergency Powers) Act — during Civil Disobedience"]]},{"k":"tl","title":"Education — institutions, reports and plans","rows":[["<b>1781<\/b>","<b>Calcutta Madrasa<\/b> — <b>Warren Hastings<\/b> (Persian and Arabic learning)"],["1784","Asiatic Society of Bengal — <b>William Jones<\/b>"],["<b>1791<\/b>","<b>Sanskrit College, Benares<\/b> — <b>Jonathan Duncan<\/b>, the British Resident"],["<b>1800<\/b>","<b>Fort William College<\/b>, Calcutta — <b>Wellesley<\/b>"],["<b>1813<\/b>","<b>Charter Act<\/b> — first state money for education: ₹1 lakh a year"],["1817","Hindu College, Calcutta"],["<b>1835<\/b>","<b>Macaulay's Minute<\/b> (2 Feb) — English as the medium of higher education; accepted by <b>Bentinck<\/b>"],["<b>1854<\/b>","<b>Wood's Despatch<\/b> — <b>Dalhousie<\/b>; the 'Magna Carta of English education in India'"],["<b>1857<\/b>","Universities of <b>Calcutta, Bombay &amp; Madras<\/b> on the London University model — <b>Canning<\/b>"],["<b>1882<\/b>","<b>Hunter Commission<\/b> (W. W. Hunter) — <b>Ripon<\/b>; primary and secondary education"],["<b>1902 / 1904<\/b>","<b>Raleigh Commission<\/b> → <b>Indian Universities Act, 1904<\/b> — <b>Curzon<\/b>"],["<b>1917–19<\/b>","<b>Sadler Commission<\/b> (Calcutta University Commission) — <b>Chelmsford<\/b>"],["<b>1929<\/b>","<b>Hartog Committee<\/b> — auxiliary committee of the <b>Simon Commission<\/b>"],["<b>1937<\/b>","<b>Wardha Scheme / Basic Education (Nai Talim)<\/b> — Gandhi's idea, worked out by a committee under <b>Zakir Hussain<\/b>"],["<b>1944<\/b>","<b>Sargent Plan<\/b> — John Sargent, Educational Adviser to the government"]]},{"k":"facts","title":"Education reports — the one line each","rows":[["<b>Macaulay's Minute<\/b>","English for higher education; the idea of '<b>downward filtration<\/b>' — teach a few in English and learning would trickle down; claimed 'a single shelf of a good European library' was worth all the native literature of India and Arabia"],["<b>Wood's Despatch<\/b>","<b>Sir Charles Wood<\/b>, President of the Board of Control: an education department in every province, <b>universities<\/b> in the presidency towns, grants-in-aid, vernacular primary schools, women's education"],["<b>Hunter Commission<\/b>","Handed primary education to district and municipal boards"],["<b>Raleigh Commission / 1904 Act<\/b>","Tighter government control over universities — nationalists saw it as an attack on higher education"],["<b>Sadler Commission<\/b>","Michael Sadler; a <b>12-year school course<\/b> and an intermediate stage; Asutosh Mukherjee was a member"],["<b>Hartog Committee<\/b>","Philip Hartog; warned of '<b>wastage and stagnation<\/b>' — consolidate primary education rather than expand it"],["<b>Wardha Scheme<\/b>","Free, compulsory education for seven years in the mother tongue, built around a <b>productive craft<\/b>"],["<b>Sargent Plan<\/b>","Free, compulsory education for children aged <b>6 to 14<\/b>, to be reached in 40 years"]]},{"k":"trick","h":"<b>Education reports in order<\/b> — <span class=\"mn\">My Wise Hunter Rides Swiftly Home With Sargent<\/span>: <b>M<\/b>acaulay 1835 → <b>W<\/b>ood 1854 → <b>H<\/b>unter 1882 → <b>R<\/b>aleigh 1902 → <b>S<\/b>adler 1917 → <b>H<\/b>artog 1929 → <b>W<\/b>ardha 1937 → <b>S<\/b>argent 1944.<br><b>Paper ↔ Maulana<\/b>: <span class=\"mn\">A-A<\/span> = <b>A<\/b>zad – <b>A<\/b>l-Hilal (Urdu); <span class=\"mn\">M-C<\/span> = <b>M<\/b>ohammad Ali – <b>C<\/b>omrade (English)."},{"k":"trap","h":"<b>Metcalfe freed the press (1835); Lytton gagged it (1878); Ripon repealed the gag (1882).<\/b> The <b>Hunter Commission of 1882<\/b> (education, Ripon) is not the <b>Hunter Committee of 1919<\/b> (Jallianwala Bagh). <i>Amrita Bazar Patrika<\/i> did not close under the 1878 Act — it <b>changed to English<\/b>. The newspaper <i>Bande Mataram<\/i> (Pal and Aurobindo) is not Bankim's song. <i>Comrade<\/i> was in <b>English<\/b>, <i>Al-Hilal<\/i> in <b>Urdu<\/b>."}],"sum":["Hicky's Bengal Gazette (1780, Calcutta) was India's first newspaper; Ram Mohan Roy ran Sambad Kaumudi in Bengali and Mirat-ul-Akhbar in Persian.","Amrita Bazar Patrika (1868, Sisir Kumar and Motilal Ghosh) turned English overnight to escape Lytton's Vernacular Press Act of 1878; The Hindu also began in 1878 at Madras.","Al-Hilal (Urdu) was Maulana Azad's paper, Comrade (English) was Mohammad Ali's, Bengalee was Surendranath Banerjee's, and Bande Mataram was run by Bipin Chandra Pal and Aurobindo Ghosh.","Metcalfe freed the press in 1835 and is called its liberator; Ripon repealed the Vernacular Press Act in 1882; the Newspapers Act of 1908 and Indian Press Act of 1910 hit the Swadeshi press.","Education: Calcutta Madrasa 1781, Sanskrit College Benares 1791, Macaulay's Minute 1835, Wood's Despatch 1854, Hunter 1882, Raleigh 1902 and Universities Act 1904, Sadler 1917, Hartog 1929, Wardha 1937, Sargent 1944."],"app":"histmodern"},
{"id":"L22","g":"mod","heat":3,"title":"Congress, Moderates & Extremists","hi":"कांग्रेस · नरमपंथी एवं गरमपंथी","blocks":[{"k":"hot","h":"Guaranteed: the 1885 founding details, the Surat split, the Partition of Bengal and Swadeshi, Lucknow Pact, Home Rule League — with years and presidents."},{"k":"story","h":"<p>By the 1880s, educated Indians wanted a voice in how they were ruled. In 1885 a retired British officer, <b>A. O. Hume<\/b>, helped them found the <b>Indian National Congress<\/b> in Bombay. Its early leaders, the Moderates, like <b>Dadabhai Naoroji<\/b> and Gokhale, were polite and patient. They sent petitions and made speeches asking for reforms within British rule. Naoroji also showed how British rule drained India's wealth.<\/p><p>Many younger Indians grew tired of asking politely. The anger burst out in 1905, when Lord Curzon split Bengal in two. Bengal answered with Swadeshi (use Indian goods) and boycott of British goods, the first mass movement. The Extremists, Lal-Bal-Pal, led by <b>Bal Gangadhar Tilak<\/b>, demanded Swaraj (self-rule) as a birthright. The two camps clashed, and in 1907 the Congress split at Surat. Meanwhile the Muslim League was founded in 1906, and in 1909 the British gave Muslims separate electorates.<\/p><p>The protests worked: the partition was cancelled in 1911. In 1916 the Moderates and Extremists reunited, and the Congress and the League signed the <b>Lucknow Pact<\/b>. Tilak and Annie Besant started Home Rule Leagues. The tables give the dates and the Congress presidents.<\/p>","key":"The Congress began with polite petitions; the 1905 Partition of Bengal pushed it toward Swadeshi and Swaraj, a split in 1907 and a reunion in 1916."},{"k":"facts","title":"The founding of the Congress","rows":[["Founded","<b>28 December 1885<\/b> at <b>Gokuldas Tejpal Sanskrit College, Bombay<\/b>"],["Founder","<b>Allan Octavian Hume<\/b>, a retired British civil servant; Sir William Wedderburn and Dadabhai Naoroji helped him"],["First President","<b>W. C. Bonnerjee<\/b> (Womesh Chandra Banerjee); 72 delegates"],["Viceroy then","<b>Lord Dufferin<\/b>"],["Earlier bodies","Bangabhasha Prakashika Sabha (1836), Landholders' Society (1838), British India Society (1839), <b>British Indian Association (1851)<\/b>, <b>East India Association (1866, Dadabhai Naoroji, London)<\/b>, <b>Indian Association (1876, Surendranath Banerjee &amp; Anand Mohan Bose)<\/b>, Madras Mahajan Sabha (1884), Bombay Presidency Association (1885)"],["\"Safety valve\" theory","Lala Lajpat Rai's reading of Hume's intent, from Hume's own papers (W. Wedderburn's biography)"]]},{"k":"table","title":"Moderates vs Extremists","head":["Point","Moderates (1885–1905)","Extremists (1905–1919)"],"rows":[["Leaders","<b>Dadabhai Naoroji<\/b>, <b>G. K. Gokhale<\/b>, Surendranath Banerjee, Pherozeshah Mehta, W. C. Bonnerjee, Badruddin Tyabji, R. C. Dutt","<b>Lal-Bal-Pal<\/b> — <b>Lala Lajpat Rai<\/b>, <b>Bal Gangadhar Tilak<\/b>, <b>Bipin Chandra Pal<\/b>; also Aurobindo Ghosh"],["Method","Petitions, prayers, resolutions — \"<b>political mendicancy<\/b>\" (Tilak's jibe)","Swadeshi, boycott, passive resistance, national education"],["Goal","Reform within the empire","<b>Swaraj<\/b> — \"<b>Swaraj is my birthright and I shall have it<\/b>\" (Tilak)"],["Key ideas","Naoroji's <b>Drain Theory<\/b> (<i>Poverty and Un-British Rule in India<\/i>); Gokhale was Gandhi's \"political guru\"","Tilak: <i>Kesari<\/i> (Marathi) &amp; <i>Maratha<\/i> (English); started <b>Ganapati (1893)<\/b> and <b>Shivaji (1895)<\/b> festivals; <b>first to demand Swaraj<\/b>"]]},{"k":"tl","title":"1905–1916, the decisive decade","rows":[["<b>1905<\/b>","<b>Partition of Bengal<\/b> announced by <b>Curzon<\/b> (16 Oct 1905 = the day it took effect, observed as a day of mourning); <b>Swadeshi &amp; Boycott movement<\/b> begins — the first mass movement"],["<b>1906<\/b>","<b>Muslim League<\/b> founded at <b>Dhaka<\/b> by Nawab Salimullah &amp; Aga Khan; Congress (Dadabhai Naoroji, Calcutta) adopts <b>Swaraj<\/b> as the goal"],["<b>1907<\/b>","<b>Surat Split<\/b> — Congress divides into Moderates and Extremists; president Rash Behari Ghosh"],["<b>1909<\/b>","<b>Morley-Minto Reforms<\/b> — <b>separate electorates<\/b> for Muslims"],["<b>1911<\/b>","Partition of Bengal <b>annulled<\/b>; capital moved to Delhi"],["<b>1915–16<\/b>","Tilak and Annie Besant start the <b>Home Rule Leagues<\/b> (Tilak: April 1916, Pune; Besant: September 1916, Madras)"],["<b>1916<\/b>","<b>Lucknow Pact<\/b> — Congress and Muslim League come together, and the Moderates and Extremists reunite; president <b>Ambica Charan Majumdar<\/b>"],["<b>1917<\/b>","<b>Annie Besant<\/b> becomes the first woman Congress President; <b>Champaran<\/b> satyagraha; <b>Montagu Declaration (August Declaration)<\/b> promises responsible government"]]},{"k":"trick","h":"<b>Lal-Bal-Pal<\/b> gives you all three Extremists at once: <b>Lal<\/b>a Lajpat Rai (Punjab), <b>Bal<\/b> Gangadhar Tilak (Maharashtra), <b>Pal<\/b> = Bipin Chandra Pal (Bengal) — one from each region.<br><b>1905-06-07<\/b> is a run: <b>Partition → Muslim League → Surat Split<\/b>."},{"k":"facts","title":"Presidents you must know","rows":[["First President","<b>W. C. Bonnerjee<\/b> (1885)"],["First Muslim President","<b>Badruddin Tyabji<\/b> (1887, Madras)"],["First English President","George Yule (1888)"],["Only President three times","<b>Dadabhai Naoroji<\/b> (1886, 1893, 1906) — \"<b>Grand Old Man of India<\/b>\", also the first Indian in the British Parliament"],["First woman President","<b>Annie Besant<\/b> (1917, Calcutta)"],["First Indian woman President","<b>Sarojini Naidu<\/b> (1925, Kanpur) — the \"Nightingale of India\""],["President at Lahore (1929, Purna Swaraj)","<b>Jawaharlal Nehru<\/b>"],["President at Karachi (1931, Fundamental Rights resolution)","<b>Sardar Vallabhbhai Patel<\/b>"],["President at Haripura (1938) &amp; Tripuri (1939)","<b>Subhas Chandra Bose<\/b> — resigned in 1939 after beating Gandhi's candidate Pattabhi Sitaramayya, and founded the <b>Forward Bloc<\/b>"],["President at the time of Independence","<b>J. B. Kripalani<\/b> (1947)"],["Youngest &amp; longest-serving President","<b>Maulana Abul Kalam Azad<\/b> — youngest ever at 35 (1923, Delhi special session) and President right through 1940–46, the longest stretch"]]},{"k":"trap","h":"The Partition of Bengal was <b>announced in 1905 and annulled in 1911<\/b>; Curzon ordered it, Hardinge II annulled it. The <b>Surat Split was 1907<\/b> and the <b>reunion was 1916 at Lucknow<\/b>. Dadabhai Naoroji was president <b>three<\/b> times — nobody else in the early period."}],"sum":["Congress founded 28 Dec 1885 at Gokuldas Tejpal Sanskrit College, Bombay, by A. O. Hume; first President W. C. Bonnerjee; Viceroy Dufferin.","Moderates: Naoroji (Drain Theory), Gokhale, Surendranath Banerjee. Extremists: Lal-Bal-Pal; Tilak's papers Kesari and Maratha; 'Swaraj is my birthright'.","1905 Partition of Bengal (Curzon) → Swadeshi; 1906 Muslim League at Dhaka; 1907 Surat Split; 1909 separate electorates; 1911 partition annulled; 1916 Home Rule Leagues + Lucknow Pact.","Presidents: first W. C. Bonnerjee; first Muslim Badruddin Tyabji (1887); thrice Dadabhai Naoroji; first woman Annie Besant (1917); first Indian woman Sarojini Naidu (1925).","Lahore 1929 (Purna Swaraj) — Nehru. Karachi 1931 (Fundamental Rights) — Sardar Patel. Haripura 1938 & Tripuri 1939 — Subhas Chandra Bose, who then founded the Forward Bloc."],"app":"histmodern"},
{"id":"L23","g":"mod","heat":3,"title":"Gandhian era — 1917 to 1934","hi":"गांधी युग","blocks":[{"k":"hot","h":"The most asked single stretch in all of History. Fix the <b>four movements in order with their years<\/b>, why each ended, and the three Round Table Conferences."},{"k":"story","h":"<p><b>Mohandas Karamchand Gandhi<\/b> spent about twenty years in South Africa, where he developed satyagraha: fighting injustice through peaceful refusal and a readiness to suffer. He returned to India in 1915. First he tried it on local problems: indigo farmers at <b>Champaran<\/b> (1917), mill workers in Ahmedabad and peasants of Kheda (1918). He won, and became a leader of ordinary people.<\/p><p>In 1919 the Rowlatt Act let the British jail people without trial. At Jallianwala Bagh in Amritsar, General Dyer fired on an unarmed crowd. Gandhi then launched the <b>Non-Cooperation Movement<\/b> (1920): give up titles, leave British schools and courts, boycott foreign cloth. When a crowd killed policemen at Chauri Chaura in 1922, he called it off, because the struggle had to stay non-violent.<\/p><p>In 1928 the all-British Simon Commission was met with Go back Simon. In 1929, at Lahore, the Congress demanded <b>Purna Swaraj<\/b> (complete independence). In 1930 Gandhi walked to Dandi and made salt, breaking a British law and starting Civil Disobedience. The Gandhi-Irwin Pact paused it, and Gandhi attended the Second Round Table Conference in London. The tables put these events in order, year by year.<\/p>","key":"Gandhi's peaceful mass movements grew step by step, from local satyagrahas to Non-Cooperation and the Salt March, and each one ended for a clear reason."},{"k":"tl","title":"Gandhi's movements in order","rows":[["1893–1914","South Africa — first satyagraha at <b>Johannesburg (1906)<\/b> against the Asiatic Registration Act; founded <b>Phoenix Settlement<\/b> &amp; <b>Tolstoy Farm<\/b>; paper <i>Indian Opinion<\/i>"],["<b>1915<\/b>","Returns to India (9 Jan — now <b>Pravasi Bharatiya Divas<\/b>); founds the <b>Sabarmati/Satyagraha Ashram<\/b> (Kochrab 1915, Sabarmati 1917)"],["<b>1917<\/b>","<b>Champaran Satyagraha<\/b> (Bihar) — against the <b>tinkathia<\/b> indigo system; his <b>first satyagraha in India<\/b>; invited by Rajkumar Shukla"],["<b>1918<\/b>","<b>Ahmedabad Mill Strike<\/b> — his first <b>hunger strike<\/b>; <b>Kheda Satyagraha<\/b> (Gujarat) — his first <b>non-cooperation<\/b>, for revenue remission in a famine; Sardar Patel joined here"],["<b>1919<\/b>","<b>Rowlatt Act<\/b> (\"no vakil, no dalil, no appeal\") → first all-India <b>hartal, 6 April<\/b>; <b>Jallianwala Bagh, 13 April 1919<\/b> (Gen. <b>Dyer<\/b>; Punjab Lt-Gov <b>O'Dwyer<\/b>); <b>Hunter Commission<\/b>; Tagore returned his knighthood; <b>Khilafat<\/b> movement starts"],["<b>1920–22<\/b>","<b>Non-Cooperation Movement<\/b> — approved at the <b>Nagpur session (Dec 1920)<\/b>; surrender of titles, boycott of councils, schools, courts and foreign cloth; withdrawn after <b>Chauri Chaura (5 Feb 1922, Gorakhpur)<\/b>"],["<b>1923–27<\/b>","<b>Swaraj Party<\/b> (C. R. Das &amp; Motilal Nehru, 1923); <b>Simon Commission (1927/28)<\/b> — \"<b>Go back Simon<\/b>\", all-white, no Indian member; <b>Lala Lajpat Rai injured at Lahore (Oct 1928)<\/b> and died"],["<b>1928<\/b>","<b>Nehru Report<\/b> (Motilal Nehru) — dominion status; <b>Bardoli Satyagraha<\/b> — Vallabhbhai Patel wins the title <b>Sardar<\/b> from the women of Bardoli"],["<b>1929<\/b>","<b>Lahore session<\/b>, Nehru presiding — <b>Purna Swaraj<\/b>; the tricolour hoisted on the Ravi on <b>31 Dec 1929<\/b>; <b>26 January 1930<\/b> observed as the first <b>Independence Day<\/b>"],["<b>1930–34<\/b>","<b>Civil Disobedience<\/b> — <b>Dandi March, 12 March to 6 April 1930<\/b>, 385 km from Sabarmati to Dandi with <b>78 followers<\/b>; salt law broken 6 April; <b>Gandhi-Irwin Pact, 5 March 1931<\/b> suspended it; relaunched after the 2nd RTC; finally withdrawn <b>1934<\/b>"],["<b>1932<\/b>","<b>Communal Award<\

<!doctype html><html><head><meta charset=utf8>
<script>
/* शब्दRegister bridge: follows the app's look (Paper / Indigo) and Light / Dark / Auto choice. */
(function(){
  var root = document.documentElement;
  function theme(t){ if(t === 'dark' || t === 'light') root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
  function skin(s){ if(s === 'paper' || s === 'indigo') root.setAttribute('data-skin', s); }
  try{
    var q = new URLSearchParams(location.search);
    theme(q.get('theme'));
    skin(q.get('skin') || (q.get('embed') ? 'paper' : ''));
    if(q.get('embed')) root.classList.add('in-shabd');
  }catch(e){}
  window.addEventListener('message', function(e){
    if(e.origin !== location.origin || !e.data || e.data.type !== 'shabd-theme') return;
    theme(e.data.theme);
    if(e.data.skin) skin(e.data.skin);
  });
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">

<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Indian History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: a manuscript folio — parchment paper, maroon ink, gold figures; one-column app with a bottom tab bar. */
:root{
  --paper:#f3efe4; --sheet:#fffdf6; --sunk:#e8e1cf;
  --ink:#241c14; --ink2:#5d5141; --rule:#d8cdb4;
  --blue:#7a2230; --on-blue:#ffffff; --blue-bg:#f4e2e1;
  --accent:#9a6a12; --accent-bg:#f8ecc9;
  --good:#1b6b4a; --good-bg:#ddefe4; --bad:#a8291f; --bad-bg:#f8e0dc;
  --warn-bg:#fcf0cf;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Instrument Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15110d; --sheet:#1f1a14; --sunk:#2a231a;
  --ink:#f0e7d6; --ink2:#b6a991; --rule:#3a3125;
  --blue:#e8929a; --on-blue:#1b120f; --blue-bg:#3a1f22;
  --accent:#e6b85c; --accent-bg:#3a2d12;
  --good:#63cfa0; --good-bg:#14331f; --bad:#ff9288; --bad-bg:#3c1b17;
  --warn-bg:#352c14; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.stat{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] span{border-bottom:2px solid var(--blue)}

/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}
h1{font-size:24px;font-weight:800}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink2)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.view{padding-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-weight:600;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}

/* hero */
.hero{display:grid;gap:10px;padding:4px 0 6px}
.hero p{color:var(--ink2)}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:99px}

/* era groups on the Learn screen */
.eras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.erac{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;display:grid;gap:6px}
.erac b{font-family:var(--f-display);font-size:15px;font-weight:700;line-height:1.25}
.erac .hi{font-size:12px;color:var(--ink2)}
.erac .mt{font-family:var(--f-num);font-size:11px;color:var(--ink2)}
.erac .meter{height:6px}
.erac[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.grph{display:flex;align-items:baseline;gap:8px;padding:14px 2px 4px;border-top:2px solid var(--ink);margin-top:4px}
.grph h2{font-size:17px}
.grph span{font-size:12px;color:var(--ink2);margin-left:auto;font-family:var(--f-num)}

/* lesson list */
.lessons{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.les{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.les .no{font-family:var(--f-num);font-weight:600;font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--rule);color:var(--ink2)}
.les.done .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.les .t{min-width:0}
.les .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.les .t span{font-size:13px;color:var(--ink2)}
.les .sc{font-family:var(--f-num);font-size:12px;color:var(--ink2);text-align:right}
.les.next .no{border-color:var(--blue);color:var(--blue)}
.dots{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--rule);display:block}
.dots i.on{background:var(--accent)}

/* lesson reader */
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{background:none;border:0;padding:8px 8px 8px 0;cursor:pointer;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.steps button[aria-current="step"]{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.block{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.block h3{margin-bottom:8px}
.block p + p{margin-top:8px}
.plain{padding:0 2px}
.hot{background:var(--blue-bg);border-radius:var(--r);padding:12px 14px;font-size:15px}
.hot .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--blue)}
.facts{display:grid;gap:0}
.facts div{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dashed var(--rule)}
.facts div:first-child{border-top:0}
.facts dt{font-size:14px;color:var(--ink2);margin:0}
.facts dd{margin:0;font-weight:600;min-width:0}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--rule)}
.tl li:first-child{border-top:0}
.tl .y{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.trick,.trap,.link{border-radius:var(--r);padding:12px 14px;border:1px solid var(--rule)}
.trick{background:var(--accent-bg);border-color:transparent}
.trap{background:var(--bad-bg);border-color:transparent}
.link{background:var(--sunk);border-color:transparent}
.trick .lab,.trap .lab,.link .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trick .lab{color:var(--accent)}
.trap .lab{color:var(--bad)}
.link .lab{color:var(--ink2)}
.mn{font-family:var(--f-num);font-weight:600;background:var(--sheet);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tbl{overflow-x:auto;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink2);margin-top:6px}
.sum{margin:0;padding-left:20px;display:grid;gap:6px}

/* questions */
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.qno{font-family:var(--f-num);font-weight:600;color:var(--ink2)}
.tag{background:var(--sunk);color:var(--ink2);border-radius:99px;padding:1px 9px;font-weight:600}
.tag.pyq{background:var(--accent-bg);color:var(--accent)}
.bm{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:4px}
.bm[aria-pressed="true"]{color:var(--accent)}
.qt{font-weight:600;font-size:16px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:9px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .k{font-family:var(--f-num);font-weight:600;color:var(--ink2);font-size:14px;padding-top:1px}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.ok .k{color:var(--good)} .opt.no .k{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.exp{font-size:15px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.exp b.okl{color:var(--good)} .exp b.nol{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* score panel */
.scorebig{display:flex;align-items:baseline;gap:8px}
.scorebig .num{font-size:44px;font-weight:600;line-height:1;color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px;text-align:center}
.kpi .num{display:block;font-size:20px;font-weight:600}
.kpi span{font-size:12px;color:var(--ink2)}
.kpi.g .num{color:var(--good)} .kpi.b .num{color:var(--bad)}

/* mock */
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:10;background:var(--paper);padding:10px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.timer{font-family:var(--f-num);font-weight:600;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.pal button{height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);font-family:var(--f-num);font-weight:600;font-size:13px;cursor:pointer}
.pal button.a{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pal button.m{box-shadow:inset 0 -4px 0 var(--accent)}
.pal button.cur{outline:2px solid var(--ink);outline-offset:1px}
.confirm{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-weight:700;margin-bottom:6px;padding:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:6px 14px;font-weight:600;cursor:pointer;font-size:14px}
.radios input{position:absolute;opacity:0;pointer-events:none}
.radios input:checked + span{color:var(--blue)}
.radios label:has(input:checked){border-color:var(--blue);background:var(--blue-bg)}
.radios label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
select{font:inherit;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;max-width:100%}
.hist{display:grid;gap:0}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--rule);font-size:14px}

/* revise */
.search{width:100%;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.tile .num{display:block;font-size:22px;font-weight:600;color:var(--accent);line-height:1.2}
.tile span{font-size:13px;color:var(--ink2)}
.flash{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;min-height:240px;padding:20px 18px;display:grid;align-content:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.flash .side{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.flash .front{font-size:18px;font-weight:600}
.flash .ans{font-size:20px;font-weight:700;color:var(--good)}
.empty{padding:24px 4px;color:var(--ink2);text-align:center}
.foot{font-size:13px;color:var(--ink2);padding-top:10px}
/* one-line revision rows (last week / last moment) */
.lines{display:grid;gap:0}
.lines div{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:10px;padding:6px 0;border-top:1px dashed var(--rule);font-size:15px}
.lines div:first-child{border-top:0}
.lines b{font-weight:700}
.lines span{color:var(--ink2)}
.callout{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;font-size:15px}

/* plan maker */
.plancfg{display:grid;gap:12px}
.pday{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.pday > summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pday > summary::-webkit-details-marker{display:none}
.pday .dno{font-family:var(--f-num);font-weight:700;font-size:13px;background:var(--sunk);border-radius:99px;padding:2px 10px;white-space:nowrap}
.pday.cur .dno{background:var(--blue);color:var(--on-blue)}
.pday.allgood .dno{background:var(--good-bg);color:var(--good)}
.pday .dt{min-width:0;font-weight:600;font-size:15px}
.pday .dt small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
.pday .dp{font-family:var(--f-num);font-size:12px;color:var(--ink2);white-space:nowrap}
.pday .body{padding:0 14px 12px;display:grid;gap:8px;border-top:1px dashed var(--rule);margin-top:2px;padding-top:10px}
.ptask{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;background:none;border:0;padding:6px 0;text-align:left;cursor:pointer;width:100%;font-size:15px}
.ptask .box{width:22px;height:22px;border-radius:6px;border:1.6px solid var(--rule);display:grid;place-items:center;font-size:14px;color:var(--on-blue);margin-top:1px}
.ptask[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.ptask[aria-pressed="true"] .lbl{text-decoration:line-through;color:var(--ink2)}
.ptask .lbl small{display:block;font-size:12px;color:var(--ink2);text-decoration:none}
@media (prefers-reduced-motion: no-preference){ .opt,.chip,.btn{transition:background-color .15s, border-color .15s} }
</style>
<style>[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px)}</style>

<body>


<header class="top">
  <div class="top-in">
    <div class="brand">Indian History<small>इतिहास · SSC CGL workbook</small></div>
    <div class="stat" id="topstat"></div>
  </div>
</header>

<main class="wrap" id="app"></main>

<nav class="nav" aria-label="Sections">
  <div class="nav-in">
    <button type="button" id="nav-learn" data-tab="learn"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg><span>Learn</span></button>

/* ============================================================

   heat 3 = asked in almost every shift · 2 = asked often · 1 = occasional

const LESSONS = [

{id:"L1", g:"anc", heat:2, title:"Sources & the Stone Age", hi:"इतिहास के स्रोत · पाषाण काल", blocks:[
  {k:"hot", h:"One question most years, almost always from the <b>same three things</b>: how history is divided, which site gave the first evidence of something (fire, agriculture, burial), and which source is literary vs archaeological. Learn the <i>firsts</i> — SSC asks \"earliest evidence of X was found at …\"."},
  {k:"p", h:"History is studied from <b>sources</b>. <b>Archaeological</b> sources are things you dig up or read off stone — inscriptions, coins, monuments, pottery. <b>Literary</b> sources are written works — the Vedas, Puranas, Sangam texts, and accounts of foreign travellers. Anything before writing is <b>prehistory</b>; the phase with writing we cannot yet read (Harappan) is <b>proto-history</b>; once we can read the script, it is <b>history</b>."},
  {k:"facts", title:"The three words SSC loves", rows:[
    ["Prehistory","No writing at all — Stone Age"],
    ["Proto-history","Writing exists but is undeciphered — Harappan"],
    ["History","Writing exists and is readable — from the Vedic/Mahajanapada age on"],
    ["Epigraphy","Study of inscriptions"],
    ["Numismatics","Study of coins"],
    ["Palaeography","Study of old scripts / writing"],
    ["Archaeology","Study of material remains by excavation"]
  ]},
  {k:"table", title:"Stone Age at a glance", head:["Age","Rough date","Tools","Life"], rows:[
    ["Palaeolithic (Old Stone)","~2 mya – 12,000 BCE","Hand-axe, cleaver, quartzite","Hunting &amp; gathering; nomadic"],
    ["Mesolithic (Middle Stone)","12,000 – 10,000 BCE","Microliths (tiny blades)","Hunting + first animal taming (dog)"],
    ["Neolithic (New Stone)","10,000 – 2,500 BCE","Polished, ground tools; pottery","Farming, herding, settled villages"],
    ["Chalcolithic (Stone–Copper)","2,500 – 700 BCE","Stone + copper","Villages, painted pottery"]
  ]},
  {k:"facts", title:"Firsts — pure marks", rows:[
    ["Earliest evidence of fire","Kurnool caves (Andhra Pradesh)"],
    ["Earliest evidence of agriculture","Lahuradewa (UP) — rice; Mehrgarh (now Pakistan) — wheat/barley"],
    ["Earliest human burial","Bhimbetka region / Mesolithic sites; dog buried with human at Burzahom (Kashmir)"],
    ["Rock paintings","Bhimbetka, MP — UNESCO site, discovered 1957 by V. S. Wakankar"],
    ["First Palaeolithic tool found in India","Pallavaram (Chennai), 1863, by Robert Bruce Foote"],
    ["Pit dwellings","Burzahom, Kashmir"],
    ["Ash mounds","Sanganakallu / Piklihal, Karnataka"],
    ["Oldest Neolithic site (India)","Mehrgarh (Balochistan) — also earliest farming"]
  ]},
  {k:"trick", h:"<b>Age order</b> — <span class=\"mn\">Pa-Me-Ne-Cha</span> = Palaeolithic → Mesolithic → Neolithic → Chalcolithic. Tool size <i>shrinks</i> then life <i>settles</i>: big hand-axe → tiny microlith → polished axe + pot.<br><b>Bruce Foote</b> gave the first tool at <b>Pallavaram</b> — both start with P."},
  {k:"trap", h:"Bhimbetka is <b>rock paintings</b>, not the oldest farming. The oldest <b>farming</b> evidence is Mehrgarh (wheat/barley) and Lahuradewa (rice). And the <b>first metal</b> used by humans was <b>copper</b>, not iron."},
  {k:"facts", title:"Who wrote what (literary sources)", rows:[
    ["Arthashastra","Kautilya / Chanakya — Mauryan statecraft"],
    ["Indica","Megasthenes — Greek envoy at Chandragupta Maurya's court"],
    ["Mudrarakshasa","Vishakhadatta — on Chandragupta's rise"],
    ["Rajatarangini","Kalhana — history of Kashmir"],
    ["Harshacharita","Banabhatta — on Harshavardhana"],
    ["Ashtadhyayi","Panini — Sanskrit grammar"],
    ["Mahabhashya","Patanjali"],
    ["Si-Yu-Ki","Hiuen Tsang (Xuanzang) — \"Records of the Western World\""]
  ]}
], sum:[
  "Prehistory = no writing · Proto-history = undeciphered writing (Harappa) · History = readable writing.",
  "Order: Palaeolithic → Mesolithic → Neolithic → Chalcolithic (Pa-Me-Ne-Cha).",
  "Fire → Kurnool caves. Rice farming → Lahuradewa. Wheat/barley + oldest Neolithic → Mehrgarh. Rock art → Bhimbetka (Wakankar, 1957).",
  "First Palaeolithic tool in India: Pallavaram, 1863, Robert Bruce Foote.",
  "Epigraphy = inscriptions · Numismatics = coins · Palaeography = scripts."
]},

{id:"L2", g:"anc", heat:3, title:"Indus Valley Civilisation", hi:"सिंधु घाटी सभ्यता", blocks:[
  {k:"hot", h:"<b>The single most asked ancient topic.</b> Expect 1–2 questions every CGL shift: site ↔ river, site ↔ discovery (dockyard, great bath, ploughed field, stadium), who excavated it, and the \"which of these is in India / Pakistan\" trap. Memorise the site table cold."},
  {k:"p", h:"Also called the <b>Harappan Civilisation</b> (after the first site found) and the <b>Bronze Age</b> civilisation of India. Discovered in <b>1921</b> by <b>Daya Ram Sahni</b> at Harappa; Mohenjodaro found <b>1922</b> by <b>R. D. Banerji</b>. Mature phase <b>2600–1900 BCE</b>. It belonged to the <b>Bronze Age</b> — copper and bronze were known, <b>iron was not</b>."},
  {k:"table", title:"Site ↔ river ↔ what was found (learn this row by row)", head:["Site","River / place","Famous for"], rows:[
    ["Harappa","Ravi · Pakistan","First site found (1921, Daya Ram Sahni); granaries, coffin burial, R-37 cemetery"],
    ["Mohenjodaro","Indus · Pakistan","<b>Great Bath</b>, Great Granary (largest building), bronze Dancing Girl, Pashupati seal, bearded priest; \"Mound of the Dead\""],
    ["Lothal","Bhogavo · Gujarat","<b>Dockyard</b> — \"Manchester of the Indus\"; rice husk, fire altars, double burial"],
    ["Dholavira","Khadir island · Gujarat","Water reservoirs, <b>stadium</b>, Harappan signboard, three-part town; UNESCO site"],
    ["Kalibangan","Ghaggar · Rajasthan","<b>Ploughed field</b> (earliest), fire altars, camel bones; \"black bangles\""],
    ["Rakhigarhi","Ghaggar · Haryana","<b>Largest Harappan site in India</b>"],
    ["Banawali","Haryana","Toy plough, barley, lacks the usual grid"],
    ["Chanhudaro","Sindh · Pakistan","<b>Bead-making</b> factory; only site without a citadel; cat chased by dog footprints"],
    ["Surkotada","Gujarat","First true <b>horse bones</b>"],
    ["Ropar / Rupnagar","Sutlej · Punjab","First site excavated after Independence; dog buried with human"],
    ["Alamgirpur","Hindon · UP","<b>Easternmost</b> site"],
    ["Sutkagendor","Dasht · Pakistan","<b>Westernmost</b> site"],
    ["Daimabad","Pravara · Maharashtra","<b>Southernmost</b> site; bronze chariot"],
    ["Manda","Chenab · J&amp;K","<b>Northernmost</b> site"]
  ]},
  {k:"trick", h:"<b>Corners of the Harappan map</b> — <span class=\"mn\">MAD-S</span>: <b>M</b>anda = North, <b>A</b>lamgirpur = East, <b>D</b>aimabad = South, <b>S</b>utkagendor = West.<br><b>Lothal = dock</b> (both have an \"L/o\" boat feel: <i>Lothal has the Lo-ading dock</i>). <b>Dholavira = \"Dho\" = water</b> → reservoirs. <b>Kalibangan = Kal (plough) + bangan</b> → ploughed field."},
  {k:"facts", title:"Town planning & society", rows:[
    ["Layout","<b>Grid pattern</b>, streets cutting at right angles; citadel (west, upper) + lower town (east)"],
    ["Bricks","Burnt mud bricks in ratio <b>4:2:1</b>, laid in English bond"],
    ["Drainage","Covered underground drains with manholes — the civilisation's hallmark"],
    ["Weights","Binary and decimal: 1, 2, 4, 8, 16, 32 … (16 and its multiples); chert cubes"],
    ["Script","<b>Boustrophedon</b> — right to left, then left to right; pictographic; still undeciphered"],
    ["Seals","Mostly <b>steatite</b>; commonest animal on seals = <b>humped bull / unicorn</b>; <b>no horse</b> on seals"],
    ["Metals known","Copper, bronze, gold, silver, lead, tin — <b>no iron</b>"],
    ["Crops","Wheat, barley, cotton (first in the world — Greeks called it <i>Sindon</i>), peas; rice only at Lothal &amp; Rangpur"],
    ["Animals","Bull, buffalo, elephant, rhino, dog, cat — <b>lion and horse absent</b> from seals"],
    ["Worship","Mother Goddess, Pashupati (proto-Shiva), pipal tree, humped bull; <b>no temple found</b>"],
    ["Great Bath","Mohenjodaro — 11.88 × 7.01 m, 2.43 m deep; bitumen-lined"],
    ["Port towns","Lothal, Sutkagendor, Balakot, Allahdino, Kuntasi, Rangpur"]
  ]},
  {k:"trap", h:"<b>Horse</b>: bones at Surkotada, but <b>no horse on any seal</b> — a classic trick option. <b>Iron was unknown</b> (it is a Bronze Age culture). <b>No temple</b> has been found anywhere. The <b>largest site overall</b> is Mohenjodaro; the <b>largest in India</b> is Rakhigarhi."},
  {k:"tl", title:"Who found what", rows:[
    ["1921","Harappa — Daya Ram Sahni (under John Marshall, ASI head)"],
    ["1922","Mohenjodaro — R. D. Banerji"],
    ["1931","Chanhudaro — N. G. Majumdar"],
    ["1953","Kalibangan — A. Ghosh; Lothal — S. R. Rao (1955)"],
    ["1967–68","Dholavira — J. P. Joshi; excavated by R. S. Bisht (1990)"],
    ["1963","Rakhigarhi — Suraj Bhan"]
  ]},
  {k:"p", h:"<b>Decline (1900 BCE)</b> — no single accepted reason. Theories: Aryan invasion (Wheeler), floods (Marshall, S. R. Rao), drying of the Ghaggar-Hakra, earthquake (Dales), deforestation and ecological change (Fairservis)."}
], sum:[
  "Harappa 1921 (Daya Ram Sahni) · Mohenjodaro 1922 (R. D. Banerji) · ASI head John Marshall. Mature phase 2600–1900 BCE.",
  "Great Bath + Dancing Girl + Pashupati seal = Mohenjodaro. Dockyard = Lothal. Reservoirs + stadium = Dholavira. Ploughed field = Kalibangan. Bead factory = Chanhudaro. Horse bones = Surkotada.",
  "Corners MAD-S: Manda N, Alamgirpur E, Daimabad S, Sutkagendor W. Largest site = Mohenjodaro; largest in India = Rakhigarhi.",
  "Bricks 4:2:1 · grid streets · covered drains · weights in multiples of 16 · boustrophedon script, undeciphered.",
  "Knew copper/bronze, first cotton growers; did NOT know iron; no horse on seals; no temple found."
]},

  {k:"p", h:"<b>Early (Rig) Vedic 1500–1000 BCE</b>, <b>Later Vedic 1000–600 BCE</b>. The Aryans' home is debated — Max Müller said Central Asia, Bal Gangadhar Tilak said the Arctic, Dayanand Saraswati said Tibet, A. C. Das said the Sapta-Sindhu region itself."},

  {k:"facts", title:"Mottos and where they come from", rows:[

  {k:"facts", title:"Vedic literature family", rows:[
    ["Brahmanas","Prose explanations of the rituals of each Veda"],
    ["Aranyakas","\"Forest books\" — philosophy of sacrifice"],
    ["Upanishads","Philosophy; 108 in all, <b>13 principal</b>; source of \"Satyameva Jayate\""],
    ["Vedangas (6)","Shiksha, Kalpa, Vyakarana, Nirukta, Chhanda, Jyotisha"],
    ["Upavedas (4)","Ayurveda (medicine), Dhanurveda (archery), Gandharvaveda (music), Shilpaveda/Sthapatyaveda (architecture)"],
    ["Six schools (Shad-darshana)","Samkhya (Kapila), Yoga (Patanjali), Nyaya (Gautama), Vaisheshika (Kanada), Mimamsa (Jaimini), Vedanta (Badarayana/Shankara)"],
    ["Epics","Ramayana (Valmiki) · Mahabharata (Ved Vyasa) — longest poem in the world"]

  {k:"table", title:"Rivers in the Rigveda", head:["Vedic name","Modern name"], rows:[

    ["Saraswati","Ghaggar-Hakra — <b>holiest / Naditama</b>"],

  {k:"trick", h:"<b>Five Punjab rivers, west → east</b> — <span class=\"mn\">Ji-Che-Ra-Be-Sa</span> (Jhelum, Chenab, Ravi, Beas, Sutlej) and their Vedic names in the same order: <span class=\"mn\">Vi-As-Pa-Vi-Shu</span> (Vitasta, Askini, Parushni, Vipasha, Shutudri)."},
  {k:"table", title:"Early vs Later Vedic — the comparison SSC asks", head:["Point","Early (Rig) Vedic","Later Vedic"], rows:[
    ["Area","Sapta-Sindhu, Punjab–Haryana","Doab — Kuru, Panchala, Kosala, Videha; eastward"],
    ["Economy","Pastoral; cattle = wealth (<i>gavishti</i> = war for cows)","Agriculture dominant; iron (<i>shyama/krishna ayas</i>) ploughs"],

    ["Politics","Tribal chief (<i>rajan</i>); assemblies <b>Sabha, Samiti, Vidatha, Gana</b>","Large kingdoms; big sacrifices — Rajasuya, Ashvamedha, Vajapeya; Sabha &amp; Samiti decline, Vidatha vanishes"],
    ["Society","Varna by occupation, flexible; women attended Sabha","Rigid 4 varnas; <b>four ashramas</b> appear; women's position falls"],

  {k:"trap", h:"<b>Indra</b> is the Rigveda's chief god — Vishnu and Shiva become major only later. <b>Vidatha</b> is the <i>oldest</i> assembly and the only one where women took part; it is the one that <b>disappears</b> in the Later Vedic age. The Gayatri Mantra is in Mandala <b>III</b> (dedicated to Savitri/Savitra), not Mandala I."}
], sum:[

{id:"L4", g:"anc", heat:3, title:"Mahajanapadas, Buddhism & Jainism", hi:"महाजनपद · बौद्ध एवं जैन धर्म", blocks:[

  {k:"facts", title:"Buddhism — the doctrine", rows:[

  {k:"table", title:"Four Buddhist Councils — year, place, king, president", head:["#","Year","Place","King","President / result"], rows:[

{id:"L7", g:"anc", heat:3, title:"Gupta Empire — the golden age", hi:"गुप्त साम्राज्य", blocks:[

  {k:"facts", title:"Science, art and letters", rows:[

    ["Land grant terms","<i>Agrahara</i> (to Brahmins, tax-free), <i>Devagrahara</i> (to temples), <i>Nivi-dharma</i>"]

  {k:"trick", h:"<b>Gupta kings in order</b> — <span class=\"mn\">Sri-Gha-Cha-Sa-Cha-Ku-Ska</span>: Sri Gupta → Ghatotkacha → Chandragupta I → Samudragupta → Chandragupta II → Kumaragupta → Skandagupta.<br><b>Traveller ↔ king</b>: <b>Fa</b>-Hien → <b>Cha</b>ndragupta II (<i>Fa for Four-hundred CE</i>); <b>Hiuen Tsang</b> → <b>Harsha</b> (both H); <b>I-tsing</b> → late 7th c."},
  {k:"trap", h:"<b>Chandragupta Maurya</b> (322 BCE, Mauryan) ≠ <b>Chandragupta I/II</b> (Gupta) — SSC mixes these constantly. The <b>Allahabad Prashasti</b> is Samudragupta's, written by <b>Harisena</b>, and it is engraved on an <b>Ashokan pillar</b>. Nalanda was founded by <b>Kumaragupta I</b>, not Harsha (Harsha only patronised it)."}

  "Gupta gold coins = Dinara, the largest number of gold coins in ancient India; Nagara temple style begins."

    ["<b>Sena</b>","Bengal","Lakshmanasena","Jayadeva's <i>Gita Govinda</i>; ended by Bakhtiyar Khalji"]
  ]},
  {k:"trick", h:"<b>Temple ↔ dynasty</b> — <span class=\"mn\">Ma-Pa, Ka-Ra, Bri-Cho, Kha-Cha, Di-So, Ko-Ga</span>: <b>Ma</b>habalipuram–<b>Pa</b>llava, <b>Ka</b>ilasa–<b>Ra</b>shtrakuta, <b>Bri</b>hadeshwara–<b>Cho</b>la, <b>Kha</b>juraho–<b>Cha</b>ndela, <b>Di</b>lwara–<b>So</b>lanki, <b>Ko</b>nark–Eastern <b>Ga</b>nga."},
  {k:"facts", title:"Ancient universities", rows:[
    ["Nalanda","Bihar; founded by <b>Kumaragupta I</b>; destroyed by Bakhtiyar Khalji (1193); UNESCO site"],
    ["Vikramashila","Bihar; founded by <b>Dharmapala</b> (Pala)"],
    ["Takshashila","Now in Pakistan; oldest; Chanakya and Charaka linked to it"],
    ["Valabhi","Gujarat; Maitraka patronage; I-tsing studied here"],
    ["Odantapuri","Bihar; Pala period; oldest Mahavihara of Bihar"]
  ]},
  {k:"trap", h:"<b>Chola local self-government</b> is the standard answer for \"village administration\" in ancient India — the Uttaramerur inscription records how village assemblies were elected. Note that the <b>Kailasa temple at Ellora is rock-cut</b> (carved top-down from one rock) while Brihadeshwara is built up from blocks."}
], sum:[
  "Harsha: Vardhana dynasty, capital Kannauj; Banabhatta wrote Harshacharita; Hiuen Tsang visited (Si-Yu-Ki); beaten by Pulakeshin II (Aihole inscription).",
  "Mahabalipuram = Pallava; Kailasa Ellora = Rashtrakuta (Krishna I); Brihadeshwara = Chola (Rajaraja I); Khajuraho = Chandela; Dilwara = Solanki; Konark = Eastern Ganga.",
  "Cholas: strong navy, bronze Nataraja, famous village self-government (Uttaramerur inscription).",
  "Nalanda — Kumaragupta I; Vikramashila — Dharmapala; Takshashila the oldest.",
  "Tripartite struggle for Kannauj: Palas vs Pratiharas vs Rashtrakutas."
]}
);

LESSONS.push(
{id:"L9", g:"med", heat:2, title:"Arab & Turkish invasions", hi:"अरब एवं तुर्क आक्रमण", blocks:[
  {k:"hot", h:"Short but certain: 712 Sindh, Mahmud of Ghazni's 17 raids and Somnath, and the <b>three battles of Tarain</b> with their years and winners."},
  {k:"tl", title:"How the Turks came in", rows:[
    ["<b>712 CE</b>","<b>Muhammad bin Qasim</b> conquers <b>Sindh</b>, defeating Raja Dahir — the first Arab conquest. Sindh is called \"the gateway of Islam in India\"; Chachnama records it"],
    ["1000–1027","<b>Mahmud of Ghazni</b> raids India <b>17 times</b>; sacked <b>Somnath (1025)</b>; brought <b>Al-Beruni</b>, who wrote <i>Kitab-ul-Hind / Tahqiq-i-Hind</i>; Firdausi (<i>Shahnama</i>) was his court poet"],
    ["1191","<b>First Battle of Tarain</b> — <b>Prithviraj Chauhan beats Muhammad Ghori</b>"],
    ["1192","<b>Second Battle of Tarain</b> — <b>Ghori beats Prithviraj Chauhan</b>; the real foundation of Turkish rule"],
    ["1194","<b>Battle of Chandawar</b> — Ghori beats <b>Jaichand</b> of Kannauj"],
    ["1206","Ghori dies; his slave <b>Qutb-ud-din Aibak</b> founds the Delhi Sultanate"]
  ]},
  {k:"trick", h:"<b>Tarain</b> — \"<b>First to Prithviraj, Second to the Sultan</b>\": 1191 → <b>P</b>rithviraj wins; 1192 → <b>G</b>hori wins. One digit apart, opposite results.<br>Also: <span class=\"mn\">1191-1192-1194</span> = Tarain I, Tarain II, Chandawar — three straight."},
  {k:"facts", title:"Also asked", rows:[
    ["Prithviraj Raso","By <b>Chand Bardai</b> — on Prithviraj Chauhan"],
    ["Taj-ul-Maasir","By <b>Hasan Nizami</b> — first official history of the Sultanate"],
    ["Tabaqat-i-Nasiri","By <b>Minhaj-us-Siraj</b>"],
    ["Al-Beruni","Came with Mahmud of Ghazni; \"first anthropologist of India\""],
    ["Bakhtiyar Khalji","Conquered Bihar &amp; Bengal; destroyed <b>Nalanda</b> (1193)"]
  ]}
], sum:[
  "712 CE: Muhammad bin Qasim conquers Sindh (beat Raja Dahir).",
  "Mahmud of Ghazni: 17 raids, sacked Somnath 1025; brought Al-Beruni (Kitab-ul-Hind).",
  "Tarain I 1191 — Prithviraj wins. Tarain II 1192 — Ghori wins. Chandawar 1194 — Ghori beats Jaichand.",
  "Prithviraj Raso by Chand Bardai. Nalanda destroyed by Bakhtiyar Khalji, 1193."
]},

{id:"L10", g:"med", heat:3, title:"Delhi Sultanate I — Slave & Khalji", hi:"दिल्ली सल्तनत · गुलाम एवं ख़िलजी", blocks:[
  {k:"hot", h:"Heavily asked. Fix in your head: who built Qutub Minar vs who finished it, Iltutmish's <i>Iqta</i> and coins, Razia as the <b>only woman</b> Sultan, Balban's <i>Sijda</i>/<i>Paibos</i>, and Alauddin Khalji's market control + <b>first permanent standing army</b>."},
  {k:"table", title:"Five dynasties of the Delhi Sultanate (1206–1526)", head:["Dynasty","Years","Founder","Last ruler"], rows:[
    ["<b>Slave / Mamluk / Ilbari</b>","1206–1290","Qutb-ud-din Aibak","Kayumars (Shamsuddin)"],
    ["<b>Khalji</b>","1290–1320","Jalal-ud-din Khalji","Khusrau Khan"],
    ["<b>Tughlaq</b>","1320–1414","Ghiyas-ud-din Tughlaq","Nasir-ud-din Mahmud"],
    ["<b>Sayyid</b>","1414–1451","Khizr Khan","Alam Shah"],
    ["<b>Lodi</b>","1451–1526","Bahlol Lodi","Ibrahim Lodi"]
  ]},
  {k:"trick", h:"<b>Five dynasties in order</b> — <span class=\"mn\">SKTSL</span> = \"<b>S</b>lave <b>K</b>ings <b>T</b>ook <b>S</b>ultanate's <b>L</b>and\": Slave, Khalji, Tughlaq, Sayyid, Lodi."},
  {k:"facts", title:"Slave dynasty — ruler by ruler", rows:[
    ["<b>Qutb-ud-din Aibak</b> (1206–10)","Founder; capital <b>Lahore</b>; began the <b>Qutub Minar</b> (for Khwaja Qutbuddin Bakhtiyar Kaki) and built <b>Quwwat-ul-Islam mosque</b> &amp; <b>Adhai Din ka Jhonpra</b> (Ajmer); called <b>Lakh Baksh</b> (giver of lakhs); died playing <i>chaugan</i> (polo) at Lahore"],
    ["<b>Aram Shah</b> (1210–11)","Weak; removed"],
    ["<b>Iltutmish</b> (1211–36)","Real consolidator; shifted capital to <b>Delhi</b>; <b>completed the Qutub Minar</b>; started the <b>Iqta</b> system; issued the silver <b>Tanka</b> and copper <b>Jital</b>; created the <b>Turkan-i-Chahalgani</b> (corps of forty); got the <i>khilat</i> (letter of recognition) from the Caliph in 1229; built Hauz-i-Shamsi &amp; Sultan Ghari (first Islamic mausoleum in India)"],
    ["<b>Razia Sultan</b> (1236–40)","<b>Only woman</b> to rule Delhi; raised Jamal-ud-din Yaqut; killed near Kaithal"],
    ["<b>Balban</b> (1266–87)","Crushed the Chahalgani; theory of <b>kingship as divine</b> — titles <b>Zil-i-Ilahi</b> (shadow of God) and <b>Niyabat-i-Khudai</b>; court customs <b>Sijda</b> (prostration) &amp; <b>Paibos</b> (kissing the feet); Persian <b>Nauroz</b> festival; policy of \"blood and iron\"; set up the <b>Diwan-i-Arz</b> (military department); poet <b>Amir Khusrau</b> began here"],
    ["<b>Kaiqubad / Kayumars</b>","End of the dynasty, 1290"]
  ]},
  {k:"facts", title:"Khalji dynasty", rows:[
    ["<b>Jalal-ud-din Khalji</b> (1290–96)","Founder; mild policy"],
    ["<b>Alauddin Khalji</b> (1296–1316)","Title <b>Sikandar-i-Sani</b> (Second Alexander); the strongest Sultan"],
    ["Market control","Four separate markets &amp; the <i>Diwan-i-Riyasat</i> under <b>Shahna-i-Mandi</b>; fixed prices; <b>first to pay soldiers in cash</b>"],
    ["Army","<b>First permanent standing army</b> in India; branding of horses (<b>dagh</b>) and descriptive muster roll (<b>huliya/chehra</b>)"],
    ["Revenue","Land measured (<b>zabti</b>); tax raised to <b>50% of produce</b>; taxes on grazing (<i>charai</i>) and houses (<i>ghari</i>)"],
    ["Conquests","Gujarat, Ranthambore, Chittor (1303), Malwa, Devagiri, Warangal, Madurai — south campaigns led by <b>Malik Kafur</b>"],
    ["Mongols","Repeatedly defeated them; built the <b>Siri fort</b> and <b>Alai Darwaza</b>; Hauz Khas"],
    ["Court","<b>Amir Khusrau</b> (\"Parrot of India\", <i>Tuti-i-Hind</i>); <b>Barani</b>'s <i>Tarikh-i-Firozshahi</i> describes his reign"]
  ]},
  {k:"trap", h:"Qutub Minar: <b>begun</b> by Aibak, <b>completed</b> by Iltutmish, <b>repaired</b> by Firoz Shah Tughlaq after lightning. Aibak's capital was <b>Lahore</b>, Iltutmish moved it to <b>Delhi</b>. The <b>Iqta</b> system is Iltutmish's, the <b>market control</b> is Alauddin's, the <b>token currency</b> is Muhammad bin Tughlaq's — never mix these three."}
], sum:[
  "Dynasties SKTSL: Slave (1206) → Khalji (1290) → Tughlaq (1320) → Sayyid (1414) → Lodi (1451–1526).",
  "Aibak: founder, capital Lahore, began Qutub Minar, built Quwwat-ul-Islam & Adhai Din ka Jhonpra, called Lakh Baksh.",
  "Iltutmish: capital Delhi, completed Qutub Minar, Iqta system, silver Tanka & copper Jital, Chahalgani.",
  "Razia Sultan — the only woman ruler of Delhi. Balban: Zil-i-Ilahi, Sijda & Paibos, blood and iron, Diwan-i-Arz.",
  "Alauddin Khalji: Sikandar-i-Sani, market control under Shahna-i-Mandi, first permanent standing army, dagh & huliya, tax at 50%; Malik Kafur led the southern campaigns."
]},

{id:"L11", g:"med", heat:3, title:"Delhi Sultanate II — Tughlaq to Lodi", hi:"तुग़लक़ से लोदी", blocks:[
  {k:"hot", h:"Muhammad bin Tughlaq's \"five failed experiments\" and Firoz Shah's canals/jizya are repeat favourites. Also: who shifted the capital where, who was called a mixture of opposites, and the end of the Sultanate in 1526."},
  {k:"facts", title:"Tughlaq dynasty (1320–1414)", rows:[
    ["<b>Ghiyas-ud-din Tughlaq</b> (1320–25)","Founder; built <b>Tughlaqabad</b>; died when a pavilion collapsed at Afghanpur"],
    ["<b>Muhammad bin Tughlaq</b> (1325–51)","The learned but unlucky Sultan — Barani called him \"a mixture of opposites\"; <b>Ibn Battuta</b> (Morocco) visited and was made Qazi of Delhi (<i>Rehla</i>)"],
    ["Experiment 1","Shifted the capital from Delhi to <b>Devagiri → renamed Daulatabad</b> (1327), then back"],
    ["Experiment 2","<b>Token currency</b> of brass/copper (1329–30) at the value of silver — forged everywhere, withdrawn"],
    ["Experiment 3","Raised taxes in the <b>Doab</b> during a famine — rebellion"],
    ["Experiment 4","Khurasan &amp; Qarachil (Kumaon) expeditions — both failed"],
    ["Experiment 5","Created the <b>Diwan-i-Kohi</b> — a department of agriculture to extend cultivation"],
    ["<b>Firoz Shah Tughlaq</b> (1351–88)","Built <b>Firozabad, Fatehabad, Hisar, Jaunpur</b>; dug <b>five canals</b> (largest from Yamuna to Hisar); set up the <b>Diwan-i-Khairat</b> (charity) and <b>Diwan-i-Bandagan</b> (slaves); <b>first to levy jizya on Brahmins</b>; made iqtas hereditary; wrote <i>Futuhat-i-Firozshahi</i>; shifted two Ashokan pillars to Delhi; repaired the Qutub Minar"],
    ["<b>1398</b>","<b>Timur</b> invades and sacks Delhi under Nasir-ud-din Mahmud Shah"]
  ]},
  {k:"trick", h:"<b>MBT's failures</b> — <span class=\"mn\">CAT-DD</span>: <b>C</b>apital shift, <b>A</b>griculture dept (Diwan-i-Kohi), <b>T</b>oken currency, <b>D</b>oab taxes, <b>D</b>istant campaigns (Khurasan/Qarachil).<br><b>Firoz = Farmer</b> → canals, gardens, towns. <b>MBT = Money</b> → token currency."},
  {k:"facts", title:"Sayyid & Lodi", rows:[
    ["<b>Khizr Khan</b> (1414)","Founded the Sayyid dynasty; Timur's deputy, never took the title Sultan"],
    ["<b>Bahlol Lodi</b> (1451)","Founded the Lodi dynasty — the <b>first Afghan</b> dynasty of Delhi"],
    ["<b>Sikandar Lodi</b> (1489–1517)","Founded <b>Agra (1504)</b> and shifted the capital there; introduced the <b>Gaz-i-Sikandari</b> (yard) for measuring land; wrote under the pen name <i>Gulrukhi</i>"],
    ["<b>Ibrahim Lodi</b> (1517–26)","Lost the <b>First Battle of Panipat (21 April 1526)</b> to <b>Babur</b> — the only Delhi Sultan killed on the battlefield"]
  ]},
  {k:"facts", title:"Sultanate administration — the exam words", rows:[
    ["Diwan-i-Wizarat","Finance, under the <b>Wazir</b>"],
    ["Diwan-i-Arz","Military (Balban)"],
    ["Diwan-i-Insha","Royal correspondence"],
    ["Diwan-i-Risalat","Religious / appeals &amp; foreign affairs"],
    ["Diwan-i-Kohi","Agriculture (Muhammad bin Tughlaq)"],
    ["Diwan-i-Khairat","Charity (Firoz Shah)"],
    ["Diwan-i-Bandagan","Slaves (Firoz Shah)"],
    ["Diwan-i-Mustakharaj","Arrears of revenue (Alauddin Khalji)"],
    ["Iqta","Land assignment for salary; holder = <b>Iqtadar / Muqti</b>"],
    ["Khalisa","Land kept directly under the crown"],
    ["Kharaj","Land tax on Muslims (1/3 to 1/2); <b>Jizya</b> = tax on non-Muslims; <b>Zakat</b> = 2.5% on Muslims; <b>Khums</b> = 1/5 share of war booty"],
    ["Barid / Munhiyan","Intelligence officers / news-writers"]
  ]},
  {k:"trap", h:"Token currency = <b>Muhammad bin Tughlaq</b>, not Firoz Shah. Capital at <b>Daulatabad</b> = Muhammad bin Tughlaq; capital at <b>Agra</b> = Sikandar Lodi. Firoz Shah was the <b>first to charge jizya from Brahmins</b> — jizya itself existed earlier. Timur invaded in <b>1398</b>, not 1526; Babur came in 1526."}
], sum:[
  "Ghiyas-ud-din built Tughlaqabad. Muhammad bin Tughlaq: capital to Daulatabad, token currency, Doab tax rise, Khurasan/Qarachil, Diwan-i-Kohi; Ibn Battuta visited.",
  "Firoz Shah Tughlaq: five canals, Firozabad/Hisar/Jaunpur, Diwan-i-Khairat & Diwan-i-Bandagan, first to take jizya from Brahmins, wrote Futuhat-i-Firozshahi.",
  "Timur invaded Delhi in 1398. Khizr Khan founded the Sayyid dynasty (1414); Bahlol Lodi the Lodi (1451) — first Afghan dynasty.",
  "Sikandar Lodi founded Agra (1504) and introduced Gaz-i-Sikandari. Ibrahim Lodi died at the First Battle of Panipat, 21 April 1526.",
  "Departments: Wizarat (finance), Arz (army), Insha (letters), Risalat (religion), Kohi (agriculture), Khairat (charity), Bandagan (slaves)."
]},

{id:"L12", g:"med", heat:2, title:"Vijayanagara, Bahmani & regional kingdoms", hi:"विजयनगर · बहमनी · क्षेत्रीय राज्य", blocks:[
  {k:"hot", h:"Krishnadeva Raya + the Battle of Talikota are near-certain; add the foreign travellers who visited Vijayanagara and the \"who built which regional monument\" line."},
  {k:"facts", title:"Vijayanagara (1336–1646)", rows:[
    ["Founded","<b>1336</b> by <b>Harihara I &amp; Bukka Raya</b> (Sangama dynasty) on the <b>Tungabhadra</b>; capital <b>Hampi</b> — UNESCO site"],
    ["Four dynasties","<b>Sangama → Saluva → Tuluva → Aravidu</b>"],
    ["<b>Krishnadeva Raya</b> (1509–29)","Greatest ruler, Tuluva dynasty; wrote <b><i>Amuktamalyada</i></b> in Telugu; patron of the <b>Ashtadiggajas</b> (eight Telugu poets, incl. Allasani Peddana); built the <b>Vittalaswamy</b> &amp; <b>Hazara Rama</b> temples; Portuguese envoy <b>Domingo Paes</b> at his court"],
    ["<b>Battle of Talikota / Rakshasa-Tangadi</b>","<b>1565</b> — the Deccan sultanates crushed Vijayanagara under <b>Ramaraya</b> (Aravidu)"],
    ["Travellers who came","<b>Nicolo Conti</b> (Italian, Devaraya I), <b>Abdur Razzaq</b> (Persian, Devaraya II), <b>Domingo Paes</b> &amp; <b>Nuniz</b> (Portuguese), <b>Athanasius Nikitin</b> (Russian, Bahmani)"],
    ["Administration","Province = <b>Mandalam/Rajya</b> under a Nayaka; the <b>Amara-nayaka</b> (military fief) system; gold coin = <b>Varaha / Pagoda</b>"]
  ]},
  {k:"facts", title:"Bahmani kingdom (1347–1526)", rows:[
    ["Founded","<b>1347</b> by <b>Alauddin Hasan Bahman Shah</b> (Hasan Gangu); capital <b>Gulbarga</b>, later <b>Bidar</b>"],
    ["Great minister","<b>Mahmud Gawan</b> — built the Madrasa at Bidar; executed on a false charge, after which the kingdom broke up"],
    ["Broke into five","<b>Bijapur (Adil Shahi), Golconda (Qutb Shahi), Ahmadnagar (Nizam Shahi), Berar (Imad Shahi), Bidar (Barid Shahi)</b>"],
    ["Monuments","<b>Gol Gumbaz</b>, Bijapur (Muhammad Adil Shah) — one of the largest domes in the world; <b>Charminar</b>, Hyderabad (Quli Qutb Shah, 1591); <b>Ibrahim Rauza</b>, Bijapur"]
  ]},
  {k:"trick", h:"<b>Five Deccan sultanates</b> — <span class=\"mn\">BAGHB</span>: <b>B</b>ijapur, <b>A</b>hmadnagar, <b>G</b>olconda, <b>B</b>erar, <b>B</b>idar. Their houses: Adil, Nizam, Qutb, Imad, Barid.<br><b>Vijayanagara dynasties</b> — <span class=\"mn\">SA-SA-TU-AR</span>: Sangama, Saluva, Tuluva, Aravidu."},
  {k:"table", title:"Other regional kingdoms", head:["Kingdom","Ruler to remember","For"], rows:[
    ["<b>Malwa</b> (Mandu)","Hoshang Shah","Jama Masjid, Hindola Mahal; Baz Bahadur &amp; Rupmati"],
    ["<b>Gujarat</b>","Ahmad Shah I","Founded <b>Ahmedabad (1411)</b>; Mahmud Begarha built Champaner"],
    ["<b>Jaunpur</b> (Sharqi)","Ibrahim Sharqi","Atala Masjid; a centre of learning — \"Shiraz of India\""],
    ["<b>Bengal</b>","Alauddin Husain Shah","Patron of Bengali; Chaitanya's time"],
    ["<b>Kashmir</b>","<b>Zain-ul-Abidin</b>","\"<b>Akbar of Kashmir</b>\"; abolished jizya, promoted shawl weaving &amp; papier-mâché"],
    ["<b>Mewar</b>","<b>Rana Kumbha</b> (Vijaya Stambha, Chittor), <b>Rana Sanga</b>, <b>Maharana Pratap</b>","Rana Sanga lost at <b>Khanwa (1527)</b>; Pratap fought <b>Haldighati (1576)</b>"],
    ["<b>Marwar</b>","Rao Jodha","Founded Jodhpur; Mehrangarh fort"],
    ["<b>Amber</b>","Man Singh","Akbar's general"]
  ]},
  {k:"trap", h:"Talikota (<b>1565</b>) destroyed Vijayanagara — it is not a Mughal battle. Hampi and Vijayanagara are the <b>same city</b>. Charminar was built by <b>Quli Qutb Shah of Golconda</b>, not by a Mughal."}
], sum:[
  "Vijayanagara founded 1336 by Harihara I & Bukka Raya at Hampi on the Tungabhadra; dynasties Sangama–Saluva–Tuluva–Aravidu.",
  "Krishnadeva Raya (Tuluva) wrote Amuktamalyada and kept the Ashtadiggajas; Domingo Paes visited him. Battle of Talikota 1565 ended Vijayanagara's power.",
  "Bahmani founded 1347 by Alauddin Hasan Bahman Shah; capital Gulbarga then Bidar; minister Mahmud Gawan; broke into BAGHB (Bijapur, Ahmadnagar, Golconda, Berar, Bidar).",
  "Gol Gumbaz = Bijapur; Charminar = Quli Qutb Shah, 1591; Madrasa of Bidar = Mahmud Gawan.",
  "Zain-ul-Abidin = 'Akbar of Kashmir'. Rana Kumbha built the Vijaya Stambha at Chittor."
]},

{id:"L13", g:"med", heat:2, title:"Bhakti & Sufi movements", hi:"भक्ति एवं सूफ़ी आंदोलन", blocks:[
  {k:"hot", h:"One sure question: saint ↔ place ↔ language ↔ guru. Learn the North/South split and who belongs to the <i>Nirguna</i> (formless) vs <i>Saguna</i> (with form) school."},
  {k:"p", h:"<b>Bhakti</b> = devotion to a personal god, open to all castes, in the <b>people's language</b> rather than Sanskrit. It began in the south with the <b>Alvars</b> (devotees of Vishnu) and <b>Nayanars</b> (devotees of Shiva), and moved north from the 13th century."},
  {k:"table", title:"Bhakti saints — the table that gets asked", head:["Saint","Place / language","Remember"], rows:[
    ["<b>Shankaracharya</b> (8th c.)","Kaladi, Kerala","<b>Advaita</b> (non-dualism); set up four mathas — Sringeri, Dwarka, Puri, Badrinath"],
    ["<b>Ramanuja</b> (11th c.)","Sriperumbudur, TN","<b>Vishishtadvaita</b> (qualified non-dualism); teacher of the north Indian Bhakti stream"],
    ["<b>Madhvacharya</b>","Karnataka","<b>Dvaita</b> (dualism)"],
    ["<b>Nimbarka</b> / <b>Vallabhacharya</b>","—","Dvaitadvaita / <b>Shuddhadvaita</b>; Vallabha founded the <b>Pushtimarg</b>, Krishna devotion"],
    ["<b>Ramananda</b>","Prayag/Banaras","First to bring Bhakti to the north in Hindi; guru of Kabir and Ravidas"],
    ["<b>Kabir</b>","Banaras · Hindi (Sadhukkadi)","<b>Nirguna</b>; <i>Bijak</i>, dohas; verses in the Guru Granth Sahib; attacked ritual in both religions"],
    ["<b>Guru Nanak</b> (1469–1539)","Talwandi/Nankana Sahib · Punjabi","Founder of <b>Sikhism</b>; <i>Japji</i>; \"<i>Ek Onkar</i>\""],
    ["<b>Chaitanya Mahaprabhu</b>","Nadia, Bengal","Krishna bhakti, <b>kirtan</b> and sankirtan; Gaudiya Vaishnavism"],
    ["<b>Mirabai</b>","Mewar · Rajasthani/Braj","Krishna devotion; <i>padas</i>"],
    ["<b>Surdas</b>","Braj · Brajbhasha","<i>Sursagar</i>, <i>Sahitya Lahari</i>; blind poet of Krishna"],
    ["<b>Tulsidas</b>","Awadh · Awadhi","<b><i>Ramcharitmanas</i></b>, <i>Vinaya Patrika</i>; Akbar's time"],
    ["<b>Namdev</b> &amp; <b>Tukaram</b> &amp; <b>Eknath</b>","Maharashtra · Marathi","Varkari tradition; Tukaram was Shivaji's contemporary"],
    ["<b>Jnaneshwar</b>","Maharashtra","<i>Jnaneshwari</i> — Marathi commentary on the Gita"],

{id:"L14", g:"med", heat:3, title:"Mughals — Babur to Aurangzeb", hi:"मुग़ल साम्राज्य", blocks:[
  {k:"hot", h:"The <b>heaviest medieval topic</b>. Battles with years, Akbar's reforms, Jahangir's and Shah Jahan's buildings, Aurangzeb's policies — 1–2 questions every shift. The battle table below is worth more than any paragraph."},
  {k:"table", title:"Every Mughal battle SSC asks", head:["Year","Battle","Who won / lost"], rows:[
    ["<b>1526</b>","<b>First Panipat</b>","<b>Babur</b> beat <b>Ibrahim Lodi</b> — Mughal rule begins; first Indian use of <i>tulughma</i> &amp; field guns"],
    ["<b>1527</b>","<b>Khanwa</b>","Babur beat <b>Rana Sanga</b> of Mewar"],

    ["<b>1529</b>","Ghaghra","Babur beat the Afghans of Bihar/Bengal"],
    ["<b>1539</b>","Chausa","<b>Sher Shah Suri</b> beat <b>Humayun</b>"],
    ["<b>1540</b>","Kannauj / Bilgram","Sher Shah beat Humayun again — Humayun flees to Persia"],
    ["<b>1556</b>","<b>Second Panipat</b>","<b>Bairam Khan</b> (for Akbar) beat <b>Hemu</b> — Mughal restoration"],
    ["<b>1565</b>","Talikota","Deccan sultanates beat Vijayanagara (not Mughal)"],
    ["<b>1576</b>","<b>Haldighati</b>","Akbar's army (Man Singh) vs <b>Maharana Pratap</b> — Pratap withdrew, never submitted"],
    ["<b>1659</b>","Samugarh","<b>Aurangzeb</b> beat <b>Dara Shikoh</b>"],
    ["<b>1739</b>","Karnal","<b>Nadir Shah</b> beat Muhammad Shah; took the <b>Peacock Throne</b> &amp; <b>Koh-i-Noor</b>"],
    ["<b>1761</b>","<b>Third Panipat</b>","<b>Ahmad Shah Abdali</b> beat the <b>Marathas</b>"]
  ]},
  {k:"trick", h:"<b>Three Panipats</b> — <span class=\"mn\">1526 · 1556 · 1761</span>: <b>B</b>abur beats Lodi → <b>A</b>kbar(Bairam) beats Hemu → <b>A</b>bdali beats Marathas. \"<i>Babur began it, Akbar restored it, Abdali broke the Marathas.</i>\"<br><b>Babur's four wins</b>: <span class=\"mn\">Pa-Kha-Cha-Gha</span> = Panipat, Khanwa, Chanderi, Ghaghra (1526-27-28-29, one per year)."},
  {k:"facts", title:"Babur (1526–30) & Humayun (1530–40, 1555–56)", rows:[
    ["Babur","Descendant of <b>Timur (father's side)</b> and <b>Genghis Khan (mother's side)</b>; ruler of Farghana; invited by Daulat Khan Lodi"],
    ["Babur's memoir","<b><i>Tuzuk-i-Baburi / Baburnama</i></b> in <b>Turki</b> — translated into Persian by Abdur Rahim Khan-i-Khanan"],
    ["Humayun","Lost to Sher Shah, fled to Persia, returned in 1555 with Bairam Khan's help; died falling from the stairs of Din Panah library"],
    ["<b>Humayun's tomb</b>","Delhi, built by his widow <b>Hamida Banu Begum (Haji Begum)</b>; architect Mirak Mirza Ghiyas; the <b>first garden-tomb</b> in India and the model for the Taj — UNESCO site"],
    ["<b>Gulbadan Begum</b>","Humayun's sister; wrote <b><i>Humayun-nama</i></b>"]
  ]},
  {k:"facts", title:"Sher Shah Suri (1540–45) — the interlude that is always asked", rows:[
    ["Real name","<b>Farid Khan</b>; title Sher Khan for killing a tiger"],
    ["Roads","Rebuilt the <b>Grand Trunk Road</b> (Sadak-e-Azam) from Sonargaon (Bengal) to the Indus; built <i>sarais</i> every 2 kos"],
    ["Currency","Issued the silver <b>Rupiya</b> (178 grains) and copper <b>Dam</b> — the ancestor of today's rupee"],
    ["Revenue","Land survey, <b>Patta</b> (title deed) &amp; <b>Qabuliyat</b> (deed of agreement); tax 1/3 of produce in cash or kind"],
    ["Buildings","<b>Purana Qila</b> (Delhi), <b>Rohtasgarh</b> fort, his own tomb at <b>Sasaram</b> (Bihar)"],
    ["Died","1545, besieging <b>Kalinjar</b>"],
    ["Court","<b>Malik Muhammad Jayasi</b> wrote <b><i>Padmavat</i></b> in his time"]
  ]},
  {k:"facts", title:"Akbar (1556–1605)", rows:[
    ["Regent","<b>Bairam Khan</b> till 1560"],
    ["Revenue system","<b>Zabti / Dahsala</b> (1580) under <b>Raja Todar Mal</b> — average of 10 years' prices and yields; 1/3 of produce; also Ghalla-bakshi, Nasaq, Kankut"],
    ["<b>Mansabdari</b>","Rank system — <b>Zat</b> (personal rank) and <b>Sawar</b> (cavalry obligation); <b>dagh</b> (branding) continued"],
    ["Religion","Abolished <b>jizya (1564)</b> and the pilgrimage tax; <b>Din-i-Ilahi (1582)</b> — its only notable follower was <b>Birbal</b>; built the <b>Ibadat Khana</b> (1575) at Fatehpur Sikri for debates; <b>Mahzar/Mazhar</b> of 1579 made him the final religious authority"],
    ["<b>Nine jewels (Navaratnas)</b>","Abul Fazl, Faizi, Tansen, Birbal, Raja Todar Mal, Abdur Rahim Khan-i-Khanan, Raja Man Singh, Mulla Do Piaza, Fakir Aziao-Din"],
    ["Books of his reign","<b><i>Akbarnama</i></b> &amp; <b><i>Ain-i-Akbari</i></b> by <b>Abul Fazl</b>; <i>Tabaqat-i-Akbari</i> by Nizamuddin Ahmad; <i>Muntakhab-ut-Tawarikh</i> by Badauni"],
    ["Buildings","<b>Fatehpur Sikri</b> (incl. <b>Buland Darwaza</b>, built to mark the Gujarat victory 1573; Panch Mahal; Jodha Bai's palace), Agra Fort, Lahore Fort, Allahabad Fort, Humayun's tomb completed"],
    ["Conquests","Gujarat 1572–73, Bengal 1576, Kabul 1585, Kashmir 1586, Sindh 1591, Kandahar 1595, Khandesh/Asirgarh 1601"]
  ]},
  {k:"facts", title:"Jahangir, Shah Jahan, Aurangzeb", rows:[
    ["<b>Jahangir</b> (1605–27)","Real name Salim; memoir <b><i>Tuzuk-i-Jahangiri</i></b>; the <b>chain of justice</b> (<i>zanjir-i-adl</i>) at Agra fort; married <b>Nur Jahan</b> (1611); <b>peak of Mughal painting</b> (Ustad Mansur, Abul Hasan); <b>Captain Hawkins</b> (1608) and <b>Sir Thomas Roe</b> (1615) came; executed <b>Guru Arjan Dev</b> (1606)"],
    ["Jahangir's buildings","<b>Itimad-ud-Daulah's tomb</b>, Agra (by Nur Jahan for her father) — first full <b>marble</b> &amp; <i>pietra dura</i> building; Shalimar Bagh, Kashmir; Akbar's tomb at Sikandra"],
    ["<b>Shah Jahan</b> (1628–58)","The \"golden age of Mughal architecture\"; built the <b>Taj Mahal</b> (for Mumtaz Mahal; architect Ustad Ahmad Lahauri), <b>Red Fort</b> &amp; <b>Jama Masjid</b> (Delhi), <b>Moti Masjid</b> (Agra), <b>Shahjahanabad</b>, the <b>Peacock Throne</b>; shifted the capital from Agra to <b>Shahjahanabad (Delhi)</b> in 1648; travellers <b>Peter Mundy, Bernier, Tavernier, Manucci</b>"],
    ["<b>Aurangzeb</b> (1658–1707)","Title <b>Alamgir</b>, called <b>Zinda Pir</b> (living saint); <b>re-imposed jizya (1679)</b>; banned music and court painting; longest-reigning Mughal (49 years); executed <b>Guru Tegh Bahadur (1675)</b> and <b>Sambhaji (1689)</b>; built <b>Bibi ka Maqbara</b> (Aurangabad) and <b>Badshahi Masjid</b> (Lahore), <b>Moti Masjid</b> in the Red Fort; his Deccan wars drained the empire — \"the Deccan ulcer\""]
  ]},
  {k:"trick", h:"<b>Memoirs</b> — only <b>two</b> Mughals wrote their own: <b>Babur</b> (<i>Baburnama</i>, in Turki) and <b>Jahangir</b> (<i>Tuzuk-i-Jahangiri</i>, in Persian). Akbar's was written <i>for</i> him by Abul Fazl, because Akbar was illiterate.<br><b>Tomb ↔ builder</b>: Humayun's tomb → his <b>wife</b>; Taj → Shah Jahan for his <b>wife</b>; Itimad-ud-Daulah → Nur Jahan for her <b>father</b>; Bibi ka Maqbara → Aurangzeb for his <b>wife</b>."},
  {k:"trap", h:"Jizya was abolished by <b>Akbar (1564)</b> and re-imposed by <b>Aurangzeb (1679)</b>. <b>Hawkins came under Jahangir</b> (1608), not Akbar. Din-i-Ilahi was <b>not a religion with followers</b> — essentially only Birbal joined. Mughal <b>painting peaked under Jahangir</b>, while <b>architecture peaked under Shah Jahan</b>."}
], sum:[
  "Battles: Panipat I 1526 (Babur–Ibrahim Lodi), Khanwa 1527 (Rana Sanga), Chausa 1539 & Kannauj 1540 (Sher Shah–Humayun), Panipat II 1556 (Bairam Khan–Hemu), Haldighati 1576, Samugarh 1659, Karnal 1739, Panipat III 1761.",
  "Sher Shah Suri: Grand Trunk Road, silver Rupiya & copper Dam, Patta–Qabuliyat, Purana Qila, tomb at Sasaram; Padmavat by Jayasi.",
  "Akbar: Dahsala/Zabti under Todar Mal, Mansabdari (Zat & Sawar), jizya abolished 1564, Ibadat Khana 1575, Din-i-Ilahi 1582, Fatehpur Sikri & Buland Darwaza; Akbarnama/Ain-i-Akbari by Abul Fazl.",
  "Jahangir: Tuzuk-i-Jahangiri, chain of justice, Nur Jahan, Hawkins 1608 & Thomas Roe 1615, painting at its peak, Itimad-ud-Daulah's tomb.",
  "Shah Jahan: Taj Mahal, Red Fort, Jama Masjid, Peacock Throne. Aurangzeb: Alamgir/Zinda Pir, jizya back in 1679, longest reign, Bibi ka Maqbara."
]},

{id:"L15", g:"med", heat:2, title:"Mughal administration, art & Later Mughals", hi:"मुग़ल प्रशासन · कला · परवर्ती मुग़ल", blocks:[
  {k:"hot", h:"Pure terminology marks: Mansabdari words, Jagir types, who held which office, and which European traveller came under which emperor. Later Mughals appear as \"who was the puppet when X happened\"."},
  {k:"facts", title:"Officers of the empire", rows:[

    ["<b>Subedar</b>","Provincial governor (province = <b>Suba</b>)"],
    ["<b>Faujdar</b> / <b>Kotwal</b>","Head of a <i>sarkar</i> (district) / city police chief"],

    ["<b>Khalisa</b>","Land whose revenue went straight to the imperial treasury"],
    ["<b>Inam</b>","Revenue-free grant, usually to scholars/religious men"],
    ["<b>Watan Jagir</b>","Hereditary homeland jagir of a Rajput chief"],

    ["<b>Ghalla-bakshi (Batai)</b>","Crop sharing"],

  {k:"table", title:"European travellers ↔ emperor", head:["Traveller","Country","Came under"], rows:[

    ["<b>Ralph Fitch</b>","England","Akbar — first Englishman to visit"],
    ["<b>Father Monserrate</b>","Portugal","Akbar"]
  ]},
  {k:"facts", title:"Later Mughals — who was on the throne when", rows:[
    ["<b>Bahadur Shah I</b> (1707–12)","\"Shah-i-Bekhabar\"; released Shahu"],
    ["<b>Jahandar Shah</b> (1712–13)","Put up by Zulfiqar Khan; abolished jizya"],

    ["<b>Muhammad Shah \"Rangila\"</b> (1719–48)","<b>Nadir Shah's invasion 1739</b>; Deccan, Awadh &amp; Bengal became independent"],
    ["<b>Ahmad Shah</b> (1748–54)","Ahmad Shah Abdali's raids begin"],
    ["<b>Alamgir II</b> (1754–59)","<b>Battle of Plassey 1757</b> in his reign"],
    ["<b>Shah Alam II</b> (1759–1806)","<b>Battle of Buxar 1764</b>; gave the <b>Diwani of Bengal</b> to the Company (1765); first to accept Company protection (1803)"],
    ["<b>Akbar II</b> (1806–37)","Gave <b>Ram Mohan Roy</b> the title \"Raja\""],
    ["<b>Bahadur Shah II \"Zafar\"</b> (1837–57)","<b>Last Mughal</b>; made the figurehead of 1857; exiled to <b>Rangoon</b>, died 1862"]

  {k:"trick", h:"<b>Battle ↔ puppet emperor</b>: Nadir Shah 1739 → <b>Muhammad Shah</b>; Plassey 1757 → <b>Alamgir II</b>; Buxar 1764 → <b>Shah Alam II</b>; 1857 → <b>Bahadur Shah Zafar</b>.<br><b>Units</b>, big to small — <span class=\"mn\">Su-Sa-Pa-Mau</span> = Suba, Sarkar, Pargana, Mauza."},
  {k:"trap", h:"A <b>jagirdar owned no land</b> — only the right to collect its revenue; jagirs were transferable. <b>Mir Bakhshi</b> is the <i>military</i> head, not the finance head (that is the Wazir/Diwan). <b>Thomas Roe</b> came to Jahangir, <b>Ralph Fitch</b> to Akbar — Roe is the famous one for the Surat <i>farman</i>."}
], sum:[
  "Wazir/Diwan = finance; Mir Bakhshi = military; Mir Saman = household; Sadr-us-Sudur = religion; Qazi-ul-Quzat = chief judge; Muhtasib = public morals.",
  "Units Suba → Sarkar → Pargana → Mauza. Jagir = revenue assignment, not land ownership; Khalisa = crown land.",
  "Akbar's land classes: Polaj, Parauti, Chachar, Banjar. Revenue methods: Zabti/Dahsala, Ghalla-bakshi, Nasaq, Kankut.",
  "Hawkins 1608 & Thomas Roe 1615 → Jahangir; Bernier, Tavernier, Peter Mundy, Manucci → Shah Jahan; Ralph Fitch → Akbar.",
  "Farrukhsiyar gave the 1717 farman; Nadir Shah invaded under Muhammad Shah (1739); Bahadur Shah Zafar was the last Mughal, exiled to Rangoon."
]},

  {k:"trick", h:"<b>Ashtapradhan's first two</b>: <b>Peshwa</b> = prime, <b>Amatya</b> = accounts (both start with the work they do). <b>Chauth = chaar (1/4)</b>, <b>Sardeshmukhi = 1/10</b>.<br><b>Gurus to remember by number</b>: <span class=\"mn\">4-Amritsar, 5-Adi Granth, 10-Khalsa</span>."},

{id:"L17", g:"mod", heat:3, title:"Europeans arrive · Plassey & Buxar", hi:"यूरोपीय आगमन · प्लासी एवं बक्सर", blocks:[
  {k:"hot", h:"Order of arrival, factory locations, and the <b>Plassey–Buxar pair</b> are asked every year. The one-line difference: <b>Plassey gave the Company Bengal; Buxar gave it the legal right to Bengal.</b>"},
  {k:"table", title:"Who came when (order of arrival)", head:["Power","Came","First factory","Note"], rows:[
    ["<b>Portuguese</b>","<b>1498</b> — Vasco da Gama lands at <b>Calicut</b>, welcomed by the Zamorin","Cochin (1500/1503)","First in, <b>last out</b> (Goa, Daman &amp; Diu freed in <b>1961</b>); first Viceroy <b>Francisco de Almeida</b>; real founder <b>Alfonso de Albuquerque</b> (took Goa, 1510)"],
    ["<b>Dutch</b>","1602 — United East India Company","<b>Masulipatnam</b> (1605)","Beaten by the English at the <b>Battle of Bedara (1759)</b>; traded in spices &amp; textiles; Pulicat mint"],
    ["<b>English</b>","1600 charter from Elizabeth I","<b>Surat</b> (1613, under Jahangir)","Factories: Surat, Masulipatnam, <b>Madras/Fort St George (1639)</b>, <b>Bombay (1668, from Charles II)</b>, <b>Calcutta/Fort William (1690, Job Charnock)</b>"],
    ["<b>Danish</b>","1616","<b>Tranquebar</b> (1620), Serampore","Sold their settlements to the English in 1845"],
    ["<b>French</b>","1664 — under Colbert, Louis XIV","<b>Surat</b> (1668), then <b>Pondicherry (1674)</b>","Chandernagore, Mahe, Karaikal, Yanam; lost the Carnatic wars"]
  ]},
  {k:"trick", h:"<b>Order of arrival</b> — <span class=\"mn\">Po-Du-En-Da-Fr</span>: <b>Po</b>rtuguese (1498), <b>Du</b>tch, <b>En</b>glish, <b>Da</b>nish, <b>Fr</b>ench. \"<i>Portuguese came first and left last.</i>\"<br><b>English presidency forts</b>: <b>Madras = Fort St George</b>, <b>Calcutta = Fort William</b>, <b>Bombay = Fort St David? No —</b> Fort St David is <b>Cuddalore</b>. Remember <span class=\"mn\">George–Madras, William–Calcutta, David–Cuddalore</span>."},
  {k:"table", title:"Carnatic Wars (English vs French)", head:["War","Years","Treaty / result"], rows:[
    ["First","1746–48","<b>Treaty of Aix-la-Chapelle</b> — inconclusive"],
    ["Second","1749–54","Treaty of Pondicherry; <b>Dupleix</b> recalled; English gain"],
    ["Third","1758–63","<b>Battle of Wandiwash (1760)</b> — Eyre Coote crushes Lally; <b>Treaty of Paris (1763)</b> ends French ambitions in India"]
  ]},
  {k:"facts", title:"Bengal: the two battles that made an empire", rows:[
    ["<b>Black Hole tragedy</b>","1756 — alleged suffocation of English prisoners by <b>Siraj-ud-Daulah</b>; reported by Holwell"],
    ["<b>Battle of Plassey</b>","<b>23 June 1757</b> — <b>Robert Clive</b> beat <b>Siraj-ud-Daulah</b>, who was betrayed by <b>Mir Jafar</b>, Rai Durlabh and Jagat Seth. Mir Jafar became Nawab"],
    ["Mir Qasim","Replaced Mir Jafar (1760), then resisted the Company's misuse of <i>dastak</i> — abolished all inland duties"],
    ["<b>Battle of Buxar</b>","<b>22 October 1764</b> — <b>Hector Munro</b> beat the joint army of <b>Mir Qasim + Shuja-ud-Daulah (Awadh) + Shah Alam II (Mughal)</b>. The decisive one"],
    ["<b>Treaty of Allahabad</b>","<b>1765</b> — Awadh returned to Shuja-ud-Daulah as a buffer; the Company got <b>Kara &amp; Allahabad</b>"],
    ["<b>Diwani rights</b>","1765 — Shah Alam II granted the Company the <b>Diwani (revenue collection) of Bengal, Bihar &amp; Odisha</b>"],
    ["<b>Dual government</b>","1765–72, set up by <b>Clive</b> — the Company collected revenue (Diwani) while the Nawab kept administration (Nizamat); ended by <b>Warren Hastings</b> in 1772"],
    ["<b>Bengal famine</b>","1770 — about a third of Bengal's population died"]
  ]},
  {k:"trick", h:"<b>Plassey vs Buxar</b> — <span class=\"mn\">P 1757 = Power, B 1764 = Bill of rights</span>. Plassey made the Company the real master of Bengal; Buxar + the 1765 Diwani made it the <i>legal</i> master. Dates read like a ladder: <b>57 → 64 → 65</b>."},
  {k:"trap", h:"<b>Clive</b> fought Plassey; <b>Hector Munro</b> fought Buxar — don't give Clive both. The Diwani was granted in <b>1765</b>, not 1757. The <b>Battle of Wandiwash (1760)</b> settled the French question, while <b>Bedara (1759)</b> settled the Dutch."}
], sum:[
  "Order: Portuguese (1498, Vasco da Gama at Calicut) → Dutch (Masulipatnam) → English (Surat 1613) → Danish (Tranquebar) → French (Pondicherry 1674).",
  "Forts: Fort St George–Madras (1639), Fort William–Calcutta (1690, Job Charnock), Fort St David–Cuddalore. Bombay came from Charles II in 1668.",
  "Carnatic Wars: I ended by Aix-la-Chapelle; III decided at Wandiwash 1760 and the Treaty of Paris 1763. Dutch beaten at Bedara 1759.",
  "Plassey 23 June 1757 — Clive beat Siraj-ud-Daulah (betrayed by Mir Jafar). Buxar 22 Oct 1764 — Munro beat Mir Qasim + Shuja-ud-Daulah + Shah Alam II.",
  "Treaty of Allahabad 1765; Diwani of Bengal, Bihar & Odisha granted 1765; Dual government 1765–72 (Clive), ended by Warren Hastings."
]},

{id:"L18", g:"mod", heat:2, title:"British expansion — Mysore, Sikh & annexations", hi:"ब्रिटिश विस्तार", blocks:[
  {k:"hot", h:"The Anglo-Mysore and Anglo-Sikh wars with their treaties, plus the two tools of expansion — <b>Subsidiary Alliance (Wellesley)</b> and <b>Doctrine of Lapse (Dalhousie)</b> — and which states each swallowed."},
  {k:"table", title:"Anglo-Mysore Wars", head:["War","Years","Against","Ended by"], rows:[
    ["First","1767–69","Haidar Ali","Treaty of Madras"],
    ["Second","1780–84","Haidar Ali, then <b>Tipu Sultan</b>","<b>Treaty of Mangalore (1784)</b> — Haidar died in 1782"],
    ["Third","1790–92","Tipu Sultan vs <b>Cornwallis</b>","<b>Treaty of Seringapatam (1792)</b> — Tipu lost half his kingdom"],
    ["Fourth","1799","Tipu vs <b>Wellesley</b>","<b>Tipu died defending Seringapatam</b>, 4 May 1799 — the \"Tiger of Mysore\"; Wodeyars restored under subsidiary alliance"]
  ]},
  {k:"table", title:"Anglo-Sikh Wars", head:["War","Years","Ended by","Result"], rows:[
    ["First","1845–46","<b>Treaty of Lahore</b> (1846) &amp; Treaty of Bhairowal","Jalandhar Doab taken; Kashmir sold to <b>Gulab Singh</b> (Treaty of Amritsar, 1846)"],
    ["Second","1848–49","—","<b>Punjab annexed</b> by <b>Dalhousie</b>; Dalip Singh exiled; <b>Koh-i-Noor</b> taken to England"]
  ]},
  {k:"facts", title:"Two tools of annexation", rows:[
    ["<b>Subsidiary Alliance</b> — Lord Wellesley (1798)","The ruler keeps his throne but must keep a British force, pay for it, accept a British Resident, and have no foreign relations. Order of signing: <b>Hyderabad (1798, first)</b> → Mysore (1799) → Awadh (1801) → <b>Peshwa Baji Rao II (Bassein, 1802)</b> → Scindia, Bhonsle"],
    ["<b>Doctrine of Lapse</b> — Lord Dalhousie (1848–56)","If a ruler died without a <b>natural</b> heir, the state \"lapsed\" to the Company. Annexed: <b>Satara (1848, first)</b>, Jaitpur &amp; Sambalpur (1849), Baghat (1850), <b>Udaipur (1852)</b>, <b>Jhansi (1853)</b>, <b>Nagpur (1854)</b>. <b>Awadh (1856)</b> was taken not by lapse but on the charge of <b>misgovernment</b>"]
  ]},
  {k:"trick", h:"<b>Doctrine of Lapse victims</b> — <span class=\"mn\">SA-JA-SA-BA-U-JH-NA</span>: Satara, Jaitpur, Sambalpur, Baghat, Udaipur, Jhansi, Nagpur. Remember <b>Satara first, Nagpur last, Awadh not at all</b> (Awadh = misgovernment, 1856).<br><b>Subsidiary Alliance firsts</b>: <b>H</b>yderabad was the <b>first</b> to sign — <i>H for \"head of the queue\"</i>."},
  {k:"facts", title:"Other wars and annexations", rows:[
    ["Anglo-Burmese","1824–26 (Treaty of <b>Yandabo</b>), 1852, 1885 — Burma fully annexed"],
    ["Anglo-Afghan","1839–42, 1878–80 (Treaty of Gandamak), 1919 (Treaty of Rawalpindi)"],
    ["Anglo-Nepal","1814–16 — <b>Treaty of Sugauli (1816)</b>; gave the British Shimla, Kumaon, Garhwal and the Gurkha recruitment right"],
    ["Sindh","Annexed <b>1843</b> by Charles Napier"],
    ["<b>1853 firsts</b>","First <b>railway</b> (Bombay–Thane, 16 April 1853, 34 km), first <b>telegraph</b> (Calcutta–Agra) — both under <b>Dalhousie</b>"],
    ["Dalhousie's other work","<b>Wood's Despatch (1854)</b> — \"Magna Carta of English education in India\"; Public Works Department; postage stamp (1854); Widow Remarriage preparation"]
  ]},
  {k:"trap", h:"<b>Awadh was annexed in 1856 for misgovernment, not under the Doctrine of Lapse</b> — the single most common trap in this chapter. Tipu Sultan died in the <b>Fourth</b> Anglo-Mysore war (1799), not the third. Punjab was annexed after the <b>Second</b> Anglo-Sikh war (1849)."}
], sum:[
  "Anglo-Mysore: II ended by Mangalore 1784, III by Seringapatam 1792, IV (1799) killed Tipu Sultan.",
  "Anglo-Sikh: I ended by the Treaty of Lahore 1846 (Kashmir sold to Gulab Singh at Amritsar); II (1849) annexed Punjab and took the Koh-i-Noor.",
  "Subsidiary Alliance = Wellesley, 1798; Hyderabad signed first, then Mysore, Awadh, the Peshwa (Bassein 1802).",
  "Doctrine of Lapse = Dalhousie; Satara first (1848), then Jaitpur, Sambalpur, Baghat, Udaipur, Jhansi, Nagpur. Awadh (1856) went for misgovernment.",
  "Treaty of Sugauli 1816 (Nepal), Yandabo 1826 (Burma); Sindh annexed 1843; first railway and telegraph 1853 under Dalhousie; Wood's Despatch 1854."
]},

{id:"L19", g:"mod", heat:3, title:"Governors-General & Viceroys", hi:"गवर्नर-जनरल एवं वायसराय", blocks:[

    ["<b>Lord Linlithgow</b> (1936–43)","Second World War; <b>August Offer (1940)</b>; <b>Cripps Mission &amp; Quit India (1942)</b>; Bengal famine (1943)"],
    ["<b>Lord Wavell</b> (1943–47)","<b>Wavell Plan &amp; Simla Conference (1945)</b>; <b>Cabinet Mission (1946)</b>; Direct Action Day; INA trials"],
    ["<b>Lord Mountbatten</b> (1947–48)","<b>Last Viceroy</b>; <b>3 June Plan</b>; <b>Indian Independence Act 1947</b>; first Governor-General of free India"],
    ["<b>C. Rajagopalachari</b> (1948–50)","<b>First and only Indian Governor-General</b>"]
  ]},
  {k:"trick", h:"<b>Reform ↔ Viceroy pairs</b> — <span class=\"mn\">Ri-Lo, Cu-Par, Mi-Sep, Ha-Del, Che-Row, Ir-Pact, Wi-Act35, Lin-QI, Wa-Cab, Mo-Free</span>:<br><b>Ri</b>pon–<b>Lo</b>cal bodies · <b>Cu</b>rzon–<b>Par</b>tition of Bengal · <b>Mi</b>nto II–<b>Sep</b>arate electorates · <b>Ha</b>rdinge II–<b>Del</b>hi capital · <b>Che</b>lmsford–<b>Row</b>latt/Jallianwala · <b>Ir</b>win–Gandhi-Irwin <b>Pact</b> · <b>Wi</b>llingdon–<b>Act 1935</b> · <b>Lin</b>lithgow–<b>Q</b>uit <b>I</b>ndia · <b>Wa</b>vell–<b>Cab</b>inet Mission · <b>Mo</b>untbatten–<b>Free</b>dom."},
  {k:"trap", h:"<b>Bentinck</b> abolished sati (1829) and brought in English education (1835) — not Dalhousie or Ripon. <b>Canning</b> is both the <b>last Governor-General</b> and the <b>first Viceroy</b>. <b>Lytton</b> passed the Vernacular Press Act and <b>Ripon repealed</b> it. <b>Mayo</b> is the census + the only murdered Viceroy."}

    ["<b>Assam</b>","Kandarpeshwar Singh","—"]
  ]},
  {k:"trick", h:"<b>Leader ↔ place</b> — \"<b>K</b>anpur has <b>N</b>ana, <b>L</b>ucknow has the <b>Begum</b>, <b>J</b>hansi has the <b>Rani</b>, <b>B</b>areilly has <b>Khan</b>, <b>A</b>rrah has <b>Kunwar</b>.\" The British suppressor to remember: <b>Hugh Rose for Jhansi</b>, <b>Colin Campbell for Kanpur &amp; Lucknow</b>.<br><b>Dates</b> — <span class=\"mn\">29 March (Mangal Pandey) → 10 May (Meerut) → 8 July 1858 (declared over)</span>."},
  {k:"facts", title:"Character, and what changed after", rows:[
    ["Which places stayed calm","<b>Punjab, Sindh, Rajputana, Kashmir, most of South India, Bengal</b>; Sikh and Gurkha troops helped the British"],
    ["Who stayed loyal to the British","Scindia of Gwalior, Nizam of Hyderabad, Raja of Jodhpur, Nawab of Bhopal, rulers of Patiala/Nabha/Jind, Holkar"],
    ["Who called it what","<b>V. D. Savarkar</b> — \"<b>First War of Indian Independence</b>\"; <b>Benjamin Disraeli</b> — \"a national rising\"; <b>Sir John Lawrence &amp; Seeley</b> — \"a mere sepoy mutiny\"; <b>R. C. Majumdar</b> — neither first, nor national, nor a war of independence; <b>Karl Marx</b> — a national revolt"],
    ["<b>Government of India Act 1858</b>","Company rule ended; power to the <b>Crown</b>; office of the <b>Secretary of State for India</b> with a 15-member Council created; the <b>Governor-General became Viceroy</b>; the Court of Directors and Board of Control abolished"],
    ["<b>Queen's Proclamation (1 Nov 1858)</b>","Read at Allahabad by Canning; promised no more annexation and respect for Indian religions and treaties"],
    ["Army reorganised","Ratio of European to Indian troops raised; artillery kept with Europeans; recruitment shifted to \"martial races\" (Punjab, Nepal); Peel Commission (1859)"]
  ]},
  {k:"trap", h:"Mangal Pandey's act was at <b>Barrackpore</b> (Bengal), while the real revolt broke out at <b>Meerut</b> — SSC swaps these. <b>Rani Lakshmibai died at Gwalior</b>, not Jhansi. Nana Saheb's general was <b>Tantia Tope</b>, whose real name was <b>Ramchandra Pandurang</b>. The revolt was declared over on <b>8 July 1858</b>."}
], sum:[
  "Immediate cause: Enfield P-53 greased cartridges. Mangal Pandey at Barrackpore, 29 March 1857; revolt from Meerut, 10 May 1857; declared over 8 July 1858.",
  "Delhi–Bakht Khan; Kanpur–Nana Saheb & Tantia Tope; Lucknow–Begum Hazrat Mahal; Jhansi–Rani Lakshmibai (suppressed by Hugh Rose); Bareilly–Khan Bahadur Khan; Arrah–Kunwar Singh; Faizabad–Maulvi Ahmadullah Shah.",
  "Punjab, Sindh, Rajputana, Kashmir, Bengal and most of the south stayed quiet; Sikh and Gurkha troops aided the British.",
  "Savarkar called it the First War of Independence; Sir John Lawrence called it a sepoy mutiny; R. C. Majumdar denied all three claims.",
  "Government of India Act 1858: Crown rule, Secretary of State for India, Governor-General becomes Viceroy. Queen's Proclamation, 1 Nov 1858, read at Allahabad."
]}
);

  {k:"facts", title:"Reformers — the one line each", rows:[
    ["<b>Raja Ram Mohan Roy</b>","\"<b>Father of the Indian Renaissance</b>\"; got <b>sati abolished (1829)</b> with Bentinck; paper <b><i>Sambad Kaumudi</i></b> (Bengali) &amp; <i>Mirat-ul-Akhbar</i> (Persian); title \"Raja\" from Akbar II; died at Bristol, 1833"],

    ["<b>Annie Besant</b>","Theosophist; <b>Central Hindu College, Banaras (1898)</b> which grew into BHU; <b>Home Rule League (1916, Madras)</b>; <b>first woman President of the Congress (1917, Calcutta)</b>; paper <i>New India</i>"],
    ["<b>Jyotiba Phule</b>","Satyashodhak Samaj; <i>Gulamgiri</i>; first school for girls and for untouchables"],

    ["<b>Behramji Malabari</b>","<b>Age of Consent Act, 1891</b>"],
    ["<b>Pandita Ramabai</b>","Arya Mahila Samaj; <b>Sharda Sadan</b> (1889) for widows"],
    ["<b>Dhondo Keshav Karve</b>","Widows' home and the first Indian women's university (SNDT, 1916)"],
    ["<b>Gopal Hari Deshmukh \"Lokahitawadi\"</b>","Maharashtra social reform through journalism"]
  ]},
  {k:"facts", title:"Reform laws — year and reformer", rows:[
    ["Sati abolished","<b>1829</b> — Bentinck + Ram Mohan Roy (Regulation XVII)"],
    ["Slavery abolished","1843 — Ellenborough"],
    ["<b>Hindu Widow Remarriage Act</b>","<b>1856</b> — Vidyasagar's campaign, under Dalhousie/Canning"],
    ["Female infanticide banned","1795, 1802, 1870 (Act VIII)"],
    ["<b>Age of Consent Act</b>","<b>1891</b> — Malabari; raised the age to 12"],

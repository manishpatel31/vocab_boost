oes not conduct","Panchayat and municipal elections (State Election Commissions)"],["Holder as of 2025–26 (not quizzed)","Gyanesh Kumar became CEC in February 2025 — check before the exam"]]},{"k":"table","title":"Election milestones","head":["Event","Year","Note"],"rows":[["Election Commission set up (25 January)","1950","25 January is now National Voters' Day."],["First general elections","1951–52","Under CEC Sukumar Sen."],["EVMs first used (Paravur, Kerala)","1982","In a single assembly seat."],["Commission first made multi-member (briefly)","1989","Went back to one member in 1990."],["Commission made permanently multi-member (CEC + 2 ECs)","1993","From 1 October 1993."],["EVMs used in every Lok Sabha seat","2004",""],["First National Voters' Day","2011","Held every year on 25 January."],["NOTA added to the ballot (Supreme Court order)","2013","PUCL case, September 2013."],["New law on choosing the CEC and ECs","2023","The Chief Election Commissioner and Other Election Commissioners Act."]]},{"k":"tlfig","title":"Elections, year by year","rows":[[1950,"Election Commission set up",""],[1951,"First general elections",""],[1982,"EVMs first used",""],[1989,"Commission first made multi-member",""],[1993,"Commission made permanently multi-member",""],[2004,"EVMs used in every Lok Sabha seat",""],[2011,"First National Voters' Day",""],[2013,"NOTA added to the ballot",""],[2023,"New law on choosing the CEC and ECs",""]],"cap":"The first general election (1951–52) under Sukumar Sen; EVMs across the country from 2004; VVPAT in all seats from 2019."},{"k":"photos","title":"Voting in pictures","items":[["Electronic_voting_machine","EVM","EVM"],["Voter-verified_paper_audit_trail","VVPAT","VVPAT"],["Election_ink","Indelible ink","Indelible ink — Mysore Paints"],["T._N._Seshan","T. N. Seshan","CEC who enforced the code"],["Sukumar_Sen","Sukumar Sen","First CEC"]]},{"k":"trick","h":"<b>“6–65, Judge-like”<\/b>: CEC serves <b>6<\/b> years or to <b>65<\/b> and goes only the way a <b>Supreme Court judge<\/b> goes. The other ECs need the <b>CEC's<\/b> word to be removed."},{"k":"trap","h":"The <b>ECI does not<\/b> hold <b>panchayat<\/b> or <b>municipal<\/b> elections. The <b>Rajya Sabha Deputy Chairman<\/b> and the <b>Lok Sabha Speaker<\/b> are elected inside the Houses — not by the ECI. The CEC is removed like an SC judge, but an <b>EC<\/b> is removed by the President on the <b>CEC's recommendation<\/b>."}],"sum":["Article 324: the ECI conducts elections to Parliament, state legislatures, President and Vice-President.","Set up 25 January 1950 (National Voters' Day); permanently three-member since 1993.","CEC and ECs: 6 years or age 65; CEC removed like a Supreme Court judge.","2023 Act: selection panel of PM, Leader of Opposition (Lok Sabha) and a Cabinet Minister.","First CEC Sukumar Sen; T. N. Seshan brought voter ID cards (1993); NOTA came in 2013."],"part":["Part 1 · Constitutional bodies","संवैधानिक निकाय"],"g":"cb"},
{"id":"C3","heat":2,"title":"UPSC and State Public Service Commissions","hi":"संघ और राज्य लोक सेवा आयोग","blocks":[{"k":"hot","h":"Asked: <b>Articles 315–323<\/b>, who <b>appoints<\/b> (President for UPSC, Governor for State PSC), who <b>removes<\/b> (the President in both cases), the <b>term<\/b> (6 years or 65 for UPSC, 62 for State PSC) and to whom they <b>report<\/b>."},{"k":"story","h":"<p>Recruiting civil servants on merit began with the <b>Public Service Commission<\/b> of <b>1926<\/b>, set up on the <b>Lee Commission<\/b>'s advice with <b>Sir Ross Barker<\/b> as chairman. The 1935 Act made it the Federal PSC, and in 1950 it became the <b>Union Public Service Commission<\/b> under <b>Article 315<\/b>. The President appoints its chairman and members, and decides how many there are.<\/p><p>Every state has its own <b>State PSC<\/b>, whose members the <b>Governor<\/b> appoints — but only the <b>President<\/b> can remove them. Two or more states can share a <b>Joint State PSC<\/b>, made by a law of Parliament, with members appointed by the President. The UPSC sends its yearly report to the <b>President<\/b>; a State PSC to the <b>Governor<\/b> (Article 323).<\/p>","key":"UPSC: appointed by the President; State PSC: by the Governor — but both are removed only by the President."},{"k":"table","title":"Articles 315–323","head":["Article","Deals with","Note"],"rows":[["Article 315","Public Service Commissions for the Union and the states",""],["Article 316","Appointment and term of members",""],["Article 317","Removal and suspension of members",""],["Article 318","Conditions of service and staff",""],["Article 319","Bar on holding office after ceasing to be a member",""],["Article 320","Functions of the Public Service Commissions",""],["Article 321","Power to extend their functions",""],["Article 322","Expenses of the Public Service Commissions",""],["Article 323","Reports of the Public Service Commissions",""]]},{"k":"table","title":"UPSC vs State PSC","head":["","UPSC","State PSC"],"rows":[["Appointed by","The President","The Governor"],["Removed by","The President","The President (not the Governor)"],["Term","6 years or age 65","6 years or age 62"],["Resignation goes to","The President","The Governor"],["Annual report goes to","The President","The Governor"],["After leaving","Chairman: no further government job","Chairman may become UPSC chairman or member"]]},{"k":"trick","h":"<b>“Governor hires, President fires”<\/b> — for State PSC members. And <b>65 vs 62<\/b>: the Union is the bigger number."},{"k":"trap","h":"The <b>Governor appoints<\/b> State PSC members but <b>cannot remove<\/b> them — only the President can, after a <b>Supreme Court<\/b> inquiry for misbehaviour. A <b>Joint State PSC<\/b> is <b>statutory<\/b> (made by Parliament), not constitutional."}],"sum":["Articles 315–323 cover the UPSC and State PSCs; Article 320 lists their functions.","UPSC members: appointed by the President; 6 years or age 65.","State PSC members: appointed by the Governor; 6 years or age 62; removed only by the President.","Reports: UPSC to the President, State PSC to the Governor (Article 323).","The first Public Service Commission (1926) followed the Lee Commission; Sir Ross Barker was chairman."],"part":["Part 1 · Constitutional bodies","संवैधानिक निकाय"],"g":"cb"},
{"id":"C4","heat":3,"title":"Finance Commission, CAG and GST Council","hi":"वित्त आयोग, नियंत्रक-महालेखापरीक्षक और जीएसटी परिषद","blocks":[{"k":"hot","h":"Asked: Finance Commission <b>Article 280<\/b> and its <b>chairmen<\/b> (1st K. C. Neogy, 15th N. K. Singh, 16th Arvind Panagariya); CAG <b>Article 148<\/b>, term (6 years or 65), <b>removal like an SC judge<\/b>, reports (<b>Article 151<\/b>); GST Council <b>Article 279A<\/b>, chaired by the <b>Union Finance Minister<\/b>."},{"k":"story","h":"<p>Three bodies guard India's money. The <b>Finance Commission<\/b> (Article 280) is set up by the <b>President<\/b> every five years with a <b>chairman and four members<\/b>. It recommends how the taxes the Centre collects are shared with the states. The 15th (N. K. Singh) gave the states <b>41%<\/b>; the <b>16th<\/b> (Arvind Panagariya, set up 31 December 2023) covers <b>2026–31<\/b>. Its advice is not binding; the report is laid before Parliament (Article 281).<\/p><p>The <b>Comptroller and Auditor General<\/b> (Articles 148–151) audits every rupee spent from the Consolidated Funds. Appointed by the President by warrant for <b>6 years or till 65<\/b>, the CAG can be removed only like a <b>Supreme Court judge<\/b>, and cannot take any government job afterwards. The <b>GST Council<\/b> (Article 279A, 101st Amendment, 2016) is chaired by the <b>Union Finance Minister<\/b>, with every state's finance minister as a member.<\/p>","key":"FC 280 (chairman + 4, every 5 years) · CAG 148 (6 yrs/65, removed like an SC judge, reports under 151) · GST Council 279A (Union FM chairs)."},{"k":"facts","title":"The three money bodies","rows":[["Finance Commission","Article 280 · chairman + 4 members · set up by the President every 5 years · advisory"],["CAG","Articles 148–151 · single person · 6 years or 65 · salary equal to a Supreme Court judge"],["CAG reports","Union accounts → President → Parliament; state accounts → Governor → state legislature"],["CAG and Parliament","Called the 'friend, philosopher and guide' of the Public Accounts Committee"],["GST Council","Article 279A · chaired by the Union Finance Minister · state finance ministers are members"],["GST Council voting","Decisions need 3/4 of weighted votes — Centre 1/3, all states together 2/3"],["Holders as of 2025–26 (not quizzed)","CAG K. Sanjay Murthy (from November 2024) — check before the exam"]]},{"k":"table","title":"Finance Commission chairmen","head":["Commission","Chairman","Note"],"rows":[["1st Finance Commission (1951)","K. C. Neogy","The first one."],["10th Finance Commission","K. C. Pant",""],["11th Finance Commission","A. M. Khusro",""],["12th Finance Commission","C. Rangarajan",""],["13th Finance Commission","Vijay Kelkar",""],["14th Finance Commission","Y. V. Reddy","Raised the states' share to 42%."],["15th Finance Commission","N. K. Singh","Covered 2021–26; states' share 41%."],["16th Finance Commission","Arvind Panagariya","Set up on 31 December 2023; covers 2026–31."]]},{"k":"tlfig","title":"Finance Commissions and their chairmen","rows":[[1951,"1st Finance Commission — K. C. Neogy",""]],"cap":"A Finance Commission comes every five years under Article 280 to share central taxes with the states."},{"k":"table","title":"CAG and Finance Commission Articles","head":["Article","Deals with","Note"],"rows":[["Article 148","Appointment and conditions of the CAG",""],["Article 149","Duties and powers of the CAG",""],["Article 150","Form of the accounts of the Union and the states",""],["Article 151","The CAG's audit reports","Union reports go to the President, state reports to the Governor."],["Article 281","Finance Commission's recommendations laid before Parliament",""]]},{"k":"trick","h":"<b>“2-8-0 = share the dough”<\/b> — Article 280 shares tax money. <b>“1-4-8 = check the ledger”<\/b> — Article 148 audits it. <b>“Neogy began, Singh was 15, Panagariya 16.”<\/b>"},{"k":"trap","h":"The CAG is removed like a <b>Supreme Court judge<\/b> but <b>appointed<\/b> by the President alone (no panel). The GST Council is chaired by the <b>Union Finance Minister<\/b>, not the PM. The <b>State<\/b> Finance Commission (243I) is a different body, set up by the <b>Governor<\/b>."}],"sum":["Finance Commission: Article 280, chairman + 4 members, set up by the President every five years.","First FC K. C. Neogy (1951); 15th N. K. Singh (41% to states); 16th Arvind Panagariya (2026–31).","CAG: Article 148; 6 years or 65; removed like a Supreme Court judge; no government job afterwards.","CAG reports (Article 151) go to the President (Union) or the Governor (state).","GST Council: Article 279A (101st Amendment, 2016), chaired by the Union Finance Minister."],"part":["Part 1 · Constitutional bodies","संवैधानिक निकाय"],"g":"cb"},
{"id":"C5","heat":2,"title":"Attorney General and Advocate General","hi":"महान्यायवादी और महाधिवक्ता","blocks":[{"k":"hot","h":"Asked: <b>Article 76<\/b> (Attorney General) and <b>Article 165<\/b> (Advocate General), who <b>appoints<\/b> them, their <b>qualification<\/b> (fit to be an SC / HC judge), <b>no fixed term<\/b>, the right to <b>speak but not vote<\/b> (Articles 88 and 177) and the <b>first AG<\/b> (M. C. Setalvad)."},{"k":"story","h":"<p>The <b>Attorney General for India<\/b> (Article 76) is the Union government's chief lawyer. The <b>President<\/b> appoints a person <b>qualified to be a Supreme Court judge<\/b>, and the AG holds office <b>during the pleasure of the President<\/b> — the Constitution fixes no term. The AG can <b>speak<\/b> in both Houses of Parliament and their committees but <b>cannot vote<\/b> (Article 88), and has the right of audience in every court in India. The first AG was <b>M. C. Setalvad<\/b>.<\/p><p>Each state has an <b>Advocate General<\/b> (Article 165), appointed by the <b>Governor<\/b> from people <b>qualified to be High Court judges<\/b>, holding office at the Governor's pleasure. The AG is helped by the <b>Solicitor General<\/b> and Additional Solicitors General, but those posts are <b>not<\/b> in the Constitution.<\/p>","key":"AG: Article 76, President, SC-judge qualification, no fixed term, speaks in Parliament (88). Advocate General: Article 165, Governor, HC-judge qualification (177)."},{"k":"table","title":"Attorney General vs Advocate General","head":["","Attorney General","Advocate General"],"rows":[["Article","76","165"],["Appointed by","The President","The Governor"],["Qualification","Fit to be a Supreme Court judge","Fit to be a High Court judge"],["Term","Not fixed — at the President's pleasure","Not fixed — at the Governor's pleasure"],["Speaks (no vote) in","Parliament — Article 88","State legislature — Article 177"],["Pay","Decided by the President","Decided by the Governor"]]},{"k":"table","title":"Which law officer?","head":["Clue","Post","Note"],"rows":[["Highest law officer of India","Attorney General for India",""],["Highest law officer of a state","Advocate General",""],["Appointed by the Governor and holds office at his pleasure","Advocate General",""],["Must be qualified to be a Supreme Court judge","Attorney General for India",""],["Must be qualified to be a High Court judge","Advocate General",""],["May speak in both Houses of Parliament but cannot vote (Article 88)","Attorney General for India",""],["May speak in the state legislature but cannot vote (Article 177)","Advocate General",""],["Second law officer of India — not a constitutional post","Solicitor General of India",""]]},{"k":"trick","h":"<b>“76 trombones lead the nation”<\/b> — the AG leads India's legal band; <b>“165”<\/b> is a smaller state band. <b>A<\/b>ttorney = <b>A<\/b>ll-India; <b>Ad<\/b>vocate = <b>Ad<\/b>ministration of a state."},{"k":"trap","h":"The AG is <b>not<\/b> a member of Parliament or the Cabinet, yet may <b>speak<\/b> in Parliament. The AG is <b>not<\/b> barred from private practice (only from advising against the Government of India). The <b>Solicitor General<\/b> is <b>not<\/b> a constitutional post."}],"sum":["Attorney General: Article 76, appointed by the President, qualified to be a Supreme Court judge.","No fixed term — holds office during the President's pleasure.","May speak in Parliament but cannot vote (Article 88).","Advocate General: Article 165, appointed by the Governor, qualified to be a High Court judge (Article 177 for the legislature).","First AG: M. C. Setalvad; the Solicitor General is not a constitutional post."],"part":["Part 1 · Constitutional bodies","संवैधानिक निकाय"],"g":"cb"},
{"id":"C6","heat":2,"title":"Commissions for SCs, STs, BCs, linguistic minorities and the Inter-State Council","hi":"अनुसूचित जाति, जनजाति, पिछड़ा वर्ग आयोग और अंतर-राज्य परिषद","blocks":[{"k":"hot","h":"Asked: <b>338 / 338A / 338B<\/b>, the <b>89th<\/b> (NCSC–NCST split) and <b>102nd<\/b> (NCBC) Amendments, the <b>Special Officer for Linguistic Minorities<\/b> (350B), and the <b>Inter-State Council<\/b> (263, chaired by the PM, set up in 1990)."},{"k":"story","h":"<p>At first a single <b>Special Officer<\/b> (Commissioner) watched over the safeguards for Scheduled Castes and Tribes under Article 338. The <b>65th Amendment (1990)<\/b> made it a multi-member commission, and the <b>89th Amendment (2003)<\/b> split it: the <b>NCSC<\/b> (338) and the <b>NCST<\/b> (338A) have worked separately since <b>2004<\/b>. Each has a chairperson, a vice-chairperson and three members appointed by the <b>President<\/b> by warrant, and each reports to the President.<\/p><p>The <b>NCBC<\/b> began as a statutory body in <b>1993<\/b> after the Indra Sawhney judgment and became constitutional through the <b>102nd Amendment (2018)<\/b> — Article 338B. The <b>Special Officer for Linguistic Minorities<\/b> (350B, 7th Amendment, 1956) is appointed by the President and reports to him. The <b>Inter-State Council<\/b> (263) was set up by a Presidential order in <b>1990<\/b> on the Sarkaria Commission's advice; the <b>Prime Minister<\/b> chairs it.<\/p>","key":"338 SC · 338A ST (89th, 2003) · 338B BC (102nd, 2018) · 350B linguistic minorities (7th, 1956) · 263 Inter-State Council (1990, PM chairs)."},{"k":"table","title":"Milestones","head":["Event","Year","Note"],"rows":[["Mandal Commission report on backward classes","1980","Set up in 1979 under B. P. Mandal."],["Sarkaria Commission on Centre–state relations set up","1983","Its report (1988) led to the Inter-State Council."],["Inter-State Council set up by a Presidential order","1990",""],["Indra Sawhney (Mandal) judgment","1992","Upheld 27% OBC quota; asked for a permanent backward classes body."],["NCBC set up by law (NCBC Act)","1993","A statutory body at first."],["NCSC and NCST start working separately","2004","After the 89th Amendment (2003)."],["NCBC made a constitutional body","2018","102nd Amendment — Article 338B."],["States get back the power to list OBCs","2021","105th Amendment."],["Special Officer for Linguistic Minorities added","1956","7th Amendment — Article 350B."]]},{"k":"tlfig","title":"Commissions, year by year","rows":[[1956,"Special Officer for Linguistic Minorities added",""],[1980,"Mandal Commission report on backward classes",""],[1983,"Sarkaria Commission on Centre–state relations set up",""],[1990,"Inter-State Council set up by a Presidential order",""],[1992,"Indra Sawhney (Mandal) judgment",""],[1993,"NCBC set up by law (NCBC Act)",""],[2004,"NCSC and NCST start working separately",""],[2018,"NCBC made a constitutional body",""],[2021,"States get back the power to list OBCs",""]]},{"k":"table","title":"Three commissions side by side","head":["","NCSC","NCST","NCBC"],"rows":[["Article","338","338A","338B"],["Came from","Original Constitution (as a Special Officer)","89th Amendment, 2003","102nd Amendment, 2018"],["Members","Chairperson, vice-chairperson, 3 members","Chairperson, vice-chairperson, 3 members","Chairperson, vice-chairperson, 3 members"],["Appointed by","The President","The President","The President"],["Reports to","The President","The President","The President"]]},{"k":"trick","h":"<b>“A for Adivasi, B for Backward”<\/b> — 338A is the ST commission, 338B the BC commission. And <b>89 → split, 102 → BC<\/b>."},{"k":"trap","h":"The <b>NCBC<\/b> was <b>statutory<\/b> (1993) before it became <b>constitutional<\/b> (2018) — both answers can appear. The <b>National Commission for Minorities<\/b> is <b>statutory<\/b> (1992 Act), but the <b>Special Officer for Linguistic Minorities<\/b> is <b>constitutional<\/b> (350B). The Inter-State Council is chaired by the <b>PM<\/b>; the Zonal Councils by the <b>Home Minister<\/b>."}],"sum":["NCSC (Article 338) and NCST (338A) separated by the 89th Amendment, working apart since 2004.","NCBC: statutory in 1993, constitutional by the 102nd Amendment (2018), Article 338B.","All three have a chairperson, vice-chairperson and three members, appointed by the President.","Special Officer for Linguistic Minorities: Article 350B (7th Amendment, 1956), reports to the President.","Inter-State Council: Article 263, set up in 1990 on the Sarkaria Commission's advice, chaired by the PM."],"part":["Part 1 · Constitutional bodies","संवैधानिक निकाय"],"g":"cb"},
{"id":"C7","heat":3,"title":"Watchdogs: NHRC, CVC, Lokpal and CIC","hi":"निगरानी निकाय: मानवाधिकार आयोग, सीवीसी, लोकपाल, सीआईसी","blocks":[{"k":"hot","h":"Asked: the <b>Act and year<\/b> (NHRC 1993, CIC 2005 via RTI, CVC Act 2003, Lokpal Act 2013), the <b>selection panels<\/b>, the <b>tenure<\/b> (NHRC 3 yrs/70, CVC 4 yrs/65, Lokpal 5 yrs/70) and that all four are <b>statutory<\/b>, not constitutional."},{"k":"story","h":"<p>In <b>1962<\/b> the <b>Santhanam Committee<\/b> looked at corruption; its advice gave India the <b>CVC<\/b> (by resolution, <b>1964<\/b>) and the <b>CBI<\/b> (1963). The CVC became <b>statutory<\/b> with the <b>CVC Act, 2003<\/b>: a Central Vigilance Commissioner and up to two Vigilance Commissioners, chosen by the PM, the Home Minister and the Leader of the Opposition, for <b>4 years or till 65<\/b>. The word <b>Lokpal<\/b> (coined by L. M. Singhvi, 1963) became law only with the <b>Lokpal and Lokayuktas Act, 2013<\/b>; the first Lokpal, <b>Pinaki Chandra Ghose<\/b>, came in <b>2019<\/b>. The Lokpal has a chairperson and up to <b>8 members<\/b>, half of them judicial.<\/p><p>The <b>NHRC<\/b> was set up on <b>12 October 1993<\/b> under the <b>Protection of Human Rights Act<\/b>; its first chairperson was former CJI <b>Ranganath Misra<\/b>. Since the 2019 amendment its members serve <b>3 years or till 70<\/b>, and a retired Supreme Court judge (not only a former CJI) can head it. The <b>Central Information Commission<\/b> came from the <b>RTI Act, 2005<\/b>: a Chief Information Commissioner and up to <b>10<\/b> Information Commissioners; the first CIC was <b>Wajahat Habibullah<\/b>.<\/p>","key":"NHRC 1993 · CIC 2005 (RTI) · CVC 1964 → Act 2003 · Lokpal Act 2013, first Lokpal 2019 — all statutory."},{"k":"facts","title":"The four watchdogs","rows":[["NHRC","Chairperson + 5 full-time members (+ heads of national commissions as deemed members) · 3 years or 70"],["CVC","Central Vigilance Commissioner + up to 2 Vigilance Commissioners · 4 years or 65 · reports to the President"],["Lokpal","Chairperson + up to 8 members (half judicial) · 5 years or 70 · can inquire into the PM, with safeguards"],["CIC","Chief Information Commissioner + up to 10 Information Commissioners · term set by the Centre since 2019 (3 years by the 2019 rules)"],["Removal (all four)","By the President, after a Supreme Court inquiry where misbehaviour is alleged"],["Lokayukta","The state-level Lokpal — set up by each state's own law; Maharashtra was first (1971)"]]},{"k":"table","title":"Which Act?","head":["Body","Created under","Note"],"rows":[["National Human Rights Commission","Protection of Human Rights Act, 1993","State Human Rights Commissions come from the same Act."],["Central Vigilance Commission","Central Vigilance Commission Act, 2003","It existed from 1964 by resolution; statutory since 2003."],["Lokpal","Lokpal and Lokayuktas Act, 2013","Came into force in January 2014."],["Central Information Commission","Right to Information Act, 2005","State Information Commissions come from the same Act."],["Central Bureau of Investigation (its powers)","Delhi Special Police Establishment Act, 1946","The CBI itself was set up by a resolution in 1963."]]},{"k":"table","title":"Milestones","head":["Event","Year","Note"],"rows":[["Santhanam Committee on corruption set up","1962","Led to the CVC and the CBI."],["The word 'Lokpal' coined by L. M. Singhvi","1963",""],["CVC first set up by a government resolution","1964","On the Santhanam Committee's advice."],["First Lokayukta in India (Maharashtra)","1971",""],["NHRC set up (12 October)","1993","Under the Protection of Human Rights Act."],["CVC made a statutory body by an Act","2003",""],["Central Information Commission set up","2005","The RTI Act came fully into force on 12 October 2005."],["Lokpal and Lokayuktas Act passed by Parliament","2013","Signed by the President on 1 January 2014."],["First Lokpal chairperson appointed","2019","Justice Pinaki Chandra Ghose."]]},{"k":"tlfig","title":"The watchdogs, year by year","rows":[[1962,"Santhanam Committee on corruption set up",""],[1963,"The word 'Lokpal' coined by L. M. Singhvi",""],[1964,"CVC first set up by a government resolution",""],[1971,"First Lokayukta in India (Maharashtra)",""],[1993,"NHRC set up (12 October)",""],[2003,"CVC made a statutory body by an Act",""],[2005,"Central Information Commission set up",""],[2013,"Lokpal and Lokayuktas Act passed by Parliament",""],[2019,"First Lokpal chairperson appointed",""]],"cap":"From the Santhanam Committee (1962) to the Lokpal and Lokayuktas Act (2013) and the first Lokpal (2019)."},{"k":"table","title":"Who selects?","head":["Post","Selection panel","Note"],"rows":[["Chief Election Commissioner","PM + Leader of Opposition (Lok Sabha) + a Cabinet Minister","2023 Act."],["Chief Information Commissioner","PM + Leader of Opposition (Lok Sabha) + a Cabinet Minister","RTI Act, 2005."],["Central Vigilance Commissioner","PM + Home Minister + Leader of Opposition (Lok Sabha)","CVC Act, 2003."],["NHRC chairperson","PM + Speaker + Home Minister + RS Deputy Chairman + both Leaders of Opposition","Six members in all."],["Lokpal chairperson","PM + Speaker + Leader of Opposition + CJI (or a judge) + an eminent jurist","Five members."],["CBI Director","PM + Leader of Opposition (Lok Sabha) + CJI (or a judge)","Under the DSPE Act as amended in 2014."]]},{"k":"trick","h":"Tenures in a ladder — <b>“3-4-5”<\/b>: NHRC <b>3<\/b> years, CVC <b>4<\/b> years, Lokpal <b>5<\/b> years. Age limits: NHRC and Lokpal <b>70<\/b>, CVC <b>65<\/b>."},{"k":"trap","h":"The <b>CVC<\/b> is older (<b>1964<\/b>) than its Act (<b>2003<\/b>) — both years are asked. The <b>CVC panel<\/b> has the <b>Home Minister<\/b>; the <b>CIC panel<\/b> has a <b>Cabinet Minister named by the PM<\/b>. The Lokpal Act was <b>2013<\/b>, but the first Lokpal came only in <b>2019<\/b>."}],"sum":["NHRC: Protection of Human Rights Act, 1993 (12 Oct 1993); first chairperson Ranganath Misra; 3 years or 70.","CVC: resolution 1964 (Santhanam Committee), statutory by the CVC Act 2003; 4 years or 65.","Lokpal: Lokpal and Lokayuktas Act 2013; first Lokpal P. C. Ghose (2019); chairperson + up to 8 members.","CIC: RTI Act 2005; CIC + up to 10 ICs; first CIC Wajahat Habibullah.","All four are statutory bodies; their heads are appointed by the President on a selection panel's advice."],"part":["Part 2 · Statutory bodies","वैधानिक निकाय"],"g":"cb"},
{"id":"C8","heat":2,"title":"Commissions, tribunals and regulators","hi":"आयोग, न्यायाधिकरण और नियामक","blocks":[{"k":"hot","h":"Asked: <b>the Act and year<\/b> (NCW 1990, NCM 1992, SEBI 1992, TRAI 1997, IRDA 1999, Competition 2002, Disaster Management 2005, FSS 2006, NGT 2010, PFRDA 2013), <b>headquarters<\/b> (SEBI Mumbai, IRDAI Hyderabad) and <b>what each regulates<\/b>."},{"k":"story","h":"<p>Parliament creates a <b>statutory body<\/b> whenever a field needs a referee. Markets got <b>SEBI<\/b> (set up 1988, statutory by the SEBI Act 1992, HQ Mumbai). Telecom got <b>TRAI<\/b> (1997), insurance <b>IRDAI<\/b> (1999, Hyderabad), competition the <b>CCI<\/b> (Competition Act 2002, replacing the MRTP Commission), food <b>FSSAI<\/b> (2006 Act) and pensions <b>PFRDA<\/b> (2013 Act, runs the NPS). The <b>RBI<\/b> itself is statutory too — RBI Act, 1934.<\/p><p>Social justice got commissions: the <b>National Commission for Women<\/b> (Act 1990, set up 31 January 1992, first chairperson Jayanti Patnaik), the <b>National Commission for Minorities<\/b> (Act 1992) and the <b>NCPCR<\/b> for children (Act 2005). Nature got the <b>National Green Tribunal<\/b> (2010) — principal bench in <b>New Delhi<\/b>, zonal benches at Bhopal, Pune, Kolkata and Chennai — and disasters the <b>NDMA<\/b> (Disaster Management Act 2005), chaired by the <b>Prime Minister<\/b>.<\/p>","key":"Every regulator and national commission here is statutory — learn its Act year and HQ: SEBI 1992 Mumbai, IRDAI 1999 Hyderabad, NGT 2010 Delhi."},{"k":"table","title":"Act → year","head":["Act","Year","Note"],"rows":[["National Commission for Women Act","1990","The NCW was set up on 31 January 1992."],["National Commission for Minorities Act","1992",""],["SEBI Act","1992","SEBI began in 1988 as a non-statutory body."],["TRAI Act","1997",""],["IRDA Act","1999","Followed the Malhotra Committee."],["Competition Act (CCI)","2002","CCI replaced the MRTP Commission."],["Commissions for Protection of Child Rights Act (NCPCR)","2005","NCPCR set up in 2007."],["Disaster Management Act (NDMA)","2005",""],["Food Safety and Standards Act (FSSAI)","2006","FSSAI set up in 2008."],["National Investigation Agency Act","2008","Passed after the 26/11 Mumbai attacks."],["National Green Tribunal Act","2010","NGT set up on 18 October 2010."],["PFRDA Act","2013","PFRDA had worked by government order since 2003."],["Reserve Bank of India Act","1934","RBI began on 1 April 1935."]]},{"k":"table","title":"Headquarters","head":["Body","Headquarters","Note"],"rows":[["SEBI","Mumbai",""],["Reserve Bank of India","Mumbai",""],["IRDAI","Hyderabad","Moved from Delhi in 2001."],["TRAI","New Delhi",""],["Competition Commission of India","New Delhi",""],["FSSAI","New Delhi","Under the Ministry of Health."],["PFRDA","New Delhi",""],["National Green Tribunal (principal bench)","New Delhi","Zonal benches: Bhopal, Pune, Kolkata, Chennai."]]},{"k":"mapfig","title":"Where the regulators sit","pins":[["Mumbai",72.88,19.08,"SEBI, Reserve Bank of India","l"],["Hyderabad",78.49,17.39,"IRDAI",""],["New Delhi",77.21,28.61,"TRAI, Competition Commission of India, FSSAI, PFRDA, National Green Tribunal",""]],"cap":"Money regulators (RBI, SEBI) sit in Mumbai; IRDAI in Hyderabad; most others in New Delhi."},{"k":"table","title":"Who looks after what?","head":["Body","Looks after","Note"],"rows":[["SEBI","Securities and the stock market",""],["TRAI","Telecom and broadcasting",""],["Competition Commission of India","Fair competition and monopolies",""],["FSSAI","Food safety",""],["IRDAI","Insurance",""],["PFRDA","Pensions and the National Pension System",""],["National Green Tribunal","Environment and forest cases",""],["NDMA","Disaster management","Chaired by the Prime Minister."],["National Commission for Women","Rights of women",""],["NCPCR","Rights of children",""],["National Commission for Minorities","Rights of notified minorities","Six minorities; Jains added in 2014."]]},{"k":"trick","h":"In order of the Acts: <b>“Women Meet Stock Traders In Competitive Child Disaster Food Investigations; Green Pensions”<\/b> — NCW 90, NCM 92, SEBI 92, TRAI 97, IRDA 99, CCI 2002, NCPCR 05, NDMA 05, FSSAI 06, NIA 08, NGT 10, PFRDA 13."},{"k":"trap","h":"<b>SEBI<\/b> began in <b>1988<\/b> but became statutory in <b>1992<\/b>. <b>IRDAI<\/b> is in <b>Hyderabad<\/b>, not Mumbai. The <b>NIA<\/b> is statutory (2008 Act), but the <b>CBI<\/b> is not. The <b>NCM<\/b> is statutory, unlike the constitutional NCSC, NCST and NCBC."}],"sum":["NCW Act 1990 (NCW set up 1992); NCM Act 1992; NCPCR Act 2005.","SEBI Act 1992 (Mumbai); TRAI Act 1997; IRDA Act 1999 (Hyderabad); PFRDA Act 2013.","Competition Act 2002 set up the CCI in place of the MRTP Commission.","Disaster Management Act 2005 — NDMA chaired by the PM; FSS Act 2006 — FSSAI.","National Green Tribunal Act 2010 — principal bench New Delhi; zonal benches Bhopal, Pune, Kolkata, Chennai."],"part":["Part 2 · Statutory bodies","वैधानिक निकाय"],"g":"cb"},
{"id":"C9","heat":3,"title":"Constitutional, statutory or neither? NITI Aayog, CBI, NDC","hi":"संवैधानिक, वैधानिक या कार्यकारी? नीति आयोग, सीबीआई, एनडीसी","blocks":[{"k":"hot","h":"The classic trap: <b>“Which of these is NOT a constitutional / statutory body?”<\/b> Remember the three <b>executive<\/b> bodies — <b>NITI Aayog<\/b> (2015), <b>CBI<\/b> (1963) and the <b>National Development Council<\/b> (1952) — and that the old <b>Planning Commission<\/b> (1950) was executive too."},{"k":"story","h":"<p>Sort every body into three boxes. <b>Constitutional<\/b>: an Article creates it (EC, UPSC, FC, CAG, GST Council, NCSC/NCST/NCBC). <b>Statutory<\/b>: an Act of Parliament creates it (NHRC, CVC, Lokpal, CIC, NCW, NCM, NGT, NDMA, NIA, SEBI, the Zonal Councils). <b>Executive<\/b> (non-constitutional, non-statutory): a simple government resolution creates it.<\/p><p>The <b>Planning Commission<\/b> was born by a Cabinet resolution on <b>15 March 1950<\/b>; the <b>NDC<\/b> by another in <b>1952<\/b>. The <b>CBI<\/b> was set up by a Home Ministry resolution on <b>1 April 1963<\/b> — it uses powers from the <b>Delhi Special Police Establishment Act, 1946<\/b>, but no Act created it. On <b>1 January 2015<\/b> the <b>NITI Aayog<\/b> (National Institution for Transforming India) replaced the Planning Commission, again by a Cabinet resolution. The <b>PM<\/b> chairs NITI Aayog; its first Vice-Chairperson was <b>Arvind Panagariya<\/b>.<\/p>","key":"Executive bodies: Planning Commission 1950, NDC 1952, CBI 1963, NITI Aayog 2015. NIA (2008 Act) and Zonal Councils (1956 Act) are statutory."},{"k":"table","title":"Which kind of body?","head":["Body","Kind","Basis"],"rows":[["Election Commission","Constitutional body","Article 324."],["Union Public Service Commission","Constitutional body","Article 315."],["Finance Commission","Constitutional body","Article 280."],["Comptroller and Auditor General","Constitutional body","Article 148."],["GST Council","Constitutional body","Article 279A."],["National Commission for Scheduled Castes","Constitutional body","Article 338."],["National Commission for Backward Classes (today)","Constitutional body","Article 338B since 2018."],["Inter-State Council","Constitutional body","Provided for in Article 263; set up by Presidential order in 1990."],["National Human Rights Commission","Statutory body","Protection of Human Rights Act, 1993."],["Central Vigilance Commission","Statutory body","CVC Act, 2003."],["Lokpal","Statutory body","Lokpal and Lokayuktas Act, 2013."],["Central Information Commission","Statutory body","RTI Act, 2005."],["National Commission for Women","Statutory body","NCW Act, 1990."],["National Commission for Minorities","Statutory body","NCM Act, 1992."],["National Green Tribunal","Statutory body","NGT Act, 2010."],["National Disaster Management Authority","Statutory body","Disaster Management Act, 2005."],["National Investigation Agency","Statutory body","NIA Act, 2008."],["Zonal Councils","Statutory body","States Reorganisation Act, 1956."],["NITI Aayog","Executive body (neither constitutional nor statutory)","Cabinet resolution, 1 January 2015."],["Central Bureau of Investigation","Executive body (neither constitutional nor statutory)","Home Ministry resolution, 1963; powers from the DSPE Act, 1946."],["National Development Council","Executive body (neither constitutional nor statutory)","Executive resolution, 1952."],["Planning Commission (1950–2014)","Executive body (neither constitutional nor statutory)","Cabinet resolution, 1950."]]},{"k":"info","title":"Constitutional, statutory or executive?","html":"<div class=\"fam\"><div style=\"border-top:5px solid #c0503a\"><b>Constitutional body<\/b><small><b style=\"color:#c0503a\">Election Commission<\/b> — Article 324<\/small><small><b style=\"color:#c0503a\">Union Public Service Commission<\/b> — Article 315<\/small><small><b style=\"color:#c0503a\">Finance Commission<\/b> — Article 280<\/small><small><b style=\"color:#c0503a\">Comptroller and Auditor General<\/b> — Article 148<\/small><small><b style=\"color:#c0503a\">GST Council<\/b> — Article 279A<\/small><small><b style=\"color:#c0503a\">National Commission for Scheduled Castes<\/b> — Article 338<\/small><small><b style=\"color:#c0503a\">National Commission for Backward Classes (today)<\/b> — Article 338B since 2018<\/small><small><b style=\"color:#c0503a\">Inter-State Council<\/b> — Provided for in Article 263; set up by Presidential order in 1990<\/small><\/div><div style=\"border-top:5px solid #2f6db5\"><b>Statutory body<\/b><small><b style=\"color:#2f6db5\">National Human Rights Commission<\/b> — Protection of Human Rights Act, 1993<\/small><small><b style=\"color:#2f6db5\">Central Vigilance Commission<\/b> — CVC Act, 2003<\/small><small><b style=\"color:#2f6db5\">Lokpal<\/b> — Lokpal and Lokayuktas Act, 2013<\/small><small><b style=\"color:#2f6db5\">Central Information Commission<\/b> — RTI Act, 2005<\/small><small><b style=\"color:#2f6db5\">National Commission for Women<\/b> — NCW Act, 1990<\/small><small><b style=\"color:#2f6db5\">National Commission for Minorities<\/b> — NCM Act, 1992<\/small><small><b style=\"color:#2f6db5\">National Green Tribunal<\/b> — NGT Act, 2010<\/small><small><b style=\"color:#2f6db5\">National Disaster Management Authority<\/b> — Disaster Management Act, 2005<\/small><small><b style=\"color:#2f6db5\">National Investigation Agency<\/b> — NIA Act, 2008<\/small><small><b style=\"color:#2f6db5\">Zonal Councils<\/b> — States Reorganisation Act, 1956<\/small><\/div><div style=\"border-top:5px solid #2f8f4e\"><b>Executive body<\/b><small><b style=\"color:#2f8f4e\">NITI Aayog<\/b> — Cabinet resolution, 1 January 2015<\/small><small><b style=\"color:#2f8f4e\">Central Bureau of Investigation<\/b> — Home Ministry resolution, 1963; powers from the DSPE Act, 1946<\/small><small><b style=\"color:#2f8f4e\">National Development Council<\/b> — Executive resolution, 1952<\/small><small><b style=\"color:#2f8f4e\">Planning Commission (1950–2014)<\/b> — Cabinet resolution, 1950<\/small><\/div><\/div>","cap":"Constitutional: named in the Constitution. Statutory: made by an Act of Parliament. Executive: made by a government resolution (NITI Aayog, once the Planning Commission)."},{"k":"table","title":"When were they set up?","head":["Event","Year","Note"],"rows":[["Delhi Special Police Establishment Act passed","1946","The CBI's powers still come from it."],["Planning Commission set up (15 March)","1950","Nehru its first chairman."],["National Development Council set up","1952","To approve the Five-Year Plans."],["Zonal Councils created","1956","Under the States Reorganisation Act."],["CBI set up (1 April) by a Home Ministry resolution","1963","On the Santhanam Committee's advice."],["NITI Aayog replaces the Planning Commission (1 January)","2015","By a Cabinet resolution."]]},{"k":"table","title":"Who chairs it?","head":["Body","Chaired by","Note"],"rows":[["NITI Aayog","Prime Minister","The PM is the chairperson; a Vice-Chairperson and CEO run it."],["National Development Council","Prime Minister",""],["Inter-State Council","Prime Minister",""],["NDMA","Prime Minister",""],["GST Council","Union Finance Minister",""],["Zonal Councils","Union Home Minister",""]]},{"k":"trick","h":"The executive four — <b>“PNCN”<\/b>, <b>“Plans Need CBI's Nod”<\/b>: <b>P<\/b>lanning Commission, <b>N<\/b>DC, <b>C<\/b>BI, <b>N<\/b>ITI Aayog. Everything else in this app has an Article or an Act."},{"k":"trap","h":"The <b>CBI<\/b> is <b>not<\/b> statutory even though it works under the <b>DSPE Act, 1946<\/b>. The <b>NIA<\/b> <b>is<\/b> statutory. The <b>Zonal Councils<\/b> are statutory (1956 Act), while the <b>Inter-State Council<\/b> is constitutional (Article 263). NITI Aayog <b>does not<\/b> give grants to states — the Planning Commission did."}],"sum":["Executive (non-constitutional, non-statutory) bodies: Planning Commission (1950), NDC (1952), CBI (1963), NITI Aayog (2015).","NITI Aayog replaced the Planning Commission on 1 January 2015 by a Cabinet resolution; the PM chairs it.","The CBI was set up by a Home Ministry resolution (1963); its powers come from the DSPE Act, 1946.","NIA (2008), NHRC, CVC, Lokpal, CIC, NGT, NDMA and the Zonal Councils are statutory.","The PM chairs NITI Aayog, NDC, NDMA and the Inter-State Council; the Home Minister chairs the Zonal Councils."],"part":["Part 3 · Which is which, and comparisons","कौन क्या है और तुलना"],"g":"cb"},
{"id":"C10","heat":3,"title":"Comparison tables: tenure, removal, composition","hi":"तुलना: कार्यकाल, पद से हटाना, संरचना","blocks":[{"k":"hot","h":"Statement questions mix these up: <b>“6 years or 65”<\/b> (CEC, CAG, UPSC), <b>62<\/b> for State PSC, <b>“removed like an SC judge”<\/b> (CEC, CAG), <b>“removed by the President after an SC inquiry”<\/b> (UPSC, NHRC, CVC) and the <b>number of members<\/b> in each body."},{"k":"story","h":"<p>Put the bodies side by side and three patterns appear. The posts that must be most independent — the <b>CEC<\/b> and the <b>CAG<\/b> — can be removed only <b>like a Supreme Court judge<\/b>, by a special majority in both Houses. The <b>commission members<\/b> — UPSC, State PSC, NHRC, CVC, Lokpal — are removed by the <b>President<\/b>, usually after a <b>Supreme Court inquiry<\/b> into misbehaviour. The <b>law officers<\/b> — AG and Advocate General — simply serve at the <b>pleasure<\/b> of the President or Governor.<\/p><p>Terms follow a similar logic: <b>6 years<\/b> for the constitutional heavyweights (with an age cap of <b>65<\/b>, or <b>62<\/b> for State PSCs), and shorter terms with a higher age cap (<b>70<\/b>) for the judge-led commissions — Lokpal 5 years, NHRC 3 years.<\/p>","key":"Removed like an SC judge: CEC, CAG. By the President after an SC inquiry: UPSC, State PSC, NHRC, CVC, Lokpal. At pleasure: AG, Advocate General."},{"k":"table","title":"Tenure","head":["Post","Term","Note"],"rows":[["Chief Election Commissioner","6 years or age 65","Election Commissioners: the same."],["Comptroller and Auditor General","6 years or age 65",""],["UPSC chairman and members","6 years or age 65",""],["State PSC chairman and members","6 years or age 62",""],["Lokpal chairperson and members","5 years or age 70",""],["NHRC chairperson and members","3 years or age 70","Cut from 5 years in 2019."],["Central Vigilance Commissioner","4 years or age 65",""],["Attorney General for India","No fixed term (President's pleasure)","Advocate General: the Governor's pleasure."],["CBI Director","At least 2 years (extendable up to 5)","Extensions allowed since 2021."]]},{"k":"cards","title":"Term and removal at a glance","rows":[["Chief Election Commissioner","6 years or age 65","Removed: Like a Supreme Court judge (special majority in both Houses)","⏳"],["Comptroller and Auditor General","6 years or age 65","Removed: Like a Supreme Court judge (special majority in both Houses)","⏳"],["UPSC chairman and members","6 years or age 65","","⏳"],["State PSC chairman and members","6 years or age 62","","⏳"],["Lokpal chairperson and members","5 years or age 70","","⏳"],["NHRC chairperson and members","3 years or age 70","","⏳"],["Central Vigilance Commissioner","4 years or age 65","Removed: By the President after a Supreme Court inquiry","⏳"],["Attorney General for India","No fixed term (President's pleasure)","Removed: At the pleasure of the President","⏳"],["CBI Director","At least 2 years (extendable up to 5)","","⏳"]]},{"k":"table","title":"How removed","head":["Post","Removal","Note"],"rows":[["Chief Election Commissioner","Like a Supreme Court judge (special majority in both Houses)",""],["Comptroller and Auditor General","Like a Supreme Court judge (special majority in both Houses)",""],["An Election Commissioner","By the President on the CEC's recommendation",""],["UPSC member","By the President after a Supreme Court inquiry","For misbehaviour; also for insolvency or other jobs (Article 317)."],["State PSC member","By the President after a Supreme Court inquiry","Not by the Governor."],["NHRC chairperson","By the President after a Supreme Court inquiry",""],["Central Vigilance Commissioner","By the President after a Supreme Court inquiry",""],["Attorney General for India","At the pleasure of the President",""],["Advocate General","At the pleasure of the Governor",""]]},{"k":"table","title":"Composition","head":["Body","Members","Note"],"rows":[["Election Commission","CEC + 2 Election Commissioners","Since 1993."],["Finance Commission","Chairman + 4 members",""],["NCSC / NCST / NCBC","Chairperson + vice-chairperson + 3 members",""],["Central Vigilance Commission","CVC + up to 2 Vigilance Commissioners",""],["Lokpal","Chairperson + up to 8 members (half judicial)",""],["Central Information Commission","CIC + up to 10 Information Commissioners",""],["Comptroller and Auditor General","A single person",""]]},{"k":"trick","h":"<b>“Six-Five for the Big Three”<\/b> — CEC, CAG, UPSC: 6 years / 65. <b>“State stops at 62.”<\/b> <b>“Judges' bodies live to 70”<\/b> — Lokpal and NHRC."},{"k":"trap","h":"<b>State PSC<\/b> members are appointed by the Governor but removed by the <b>President<\/b>. An <b>Election Commissioner<\/b> is not removed like a judge — only the <b>CEC<\/b> is. The <b>CAG<\/b> is a single person, not a commission."}],"sum":["6 years or age 65: CEC and ECs, CAG, UPSC members; State PSC members: 6 years or 62.","Lokpal: 5 years or 70; NHRC: 3 years or 70; CVC: 4 years or 65.","CEC and CAG are removed like a Supreme Court judge; an EC only on the CEC's recommendation.","UPSC, State PSC, NHRC and CVC members are removed by the President after a Supreme Court inquiry.","EC: CEC + 2; FC: chairman + 4; Lokpal: chairperson + up to 8; CIC: up to 10 ICs; CVC: up to 2 VCs."],"part":["Part 3 · Which is which, and comparisons","कौन क्या है और तुलना"],"g":"cb"}
];

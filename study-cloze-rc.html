const LESSONS = [
{"id":"CZ1","heat":3,"title":"How SSC sets cloze and RC — and the method","hi":"SSC क्लोज़ टेस्ट और अपठित गद्यांश कैसे पूछता है — हल करने की विधि","blocks":[{"k":"hot","h":"In most Tier 1 shifts of SSC CGL and CHSL, the English section (25 questions) carries <b>one cloze passage with 5 blanks<\/b> and <b>one reading passage with 5 questions<\/b> — about ten questions, or 20 marks, between them. They are the slowest questions of the section, so a fixed method saves the most time."},{"k":"story","h":"<p>A <b>cloze test<\/b> is a short paragraph — usually 120 to 180 words — with five words taken out. For each gap you get four words, and only one fits the grammar <i>and<\/i> the meaning of the passage. The examiner tests the same small set of skills again and again: words that go together (<i>heavy rain<\/i>), the right preposition (<i>depend on<\/i>), the right linking word (<i>however<\/i>, <i>therefore<\/i>), the right tense, the right word among near-synonyms, and articles.<\/p><p>A <b>reading comprehension<\/b> (RC) passage is a little longer, often 250 to 400 words, on a neutral topic: the environment, health, technology, society or the history of an idea. The five questions nearly always come from the same five families: the <b>main idea or title<\/b>, a <b>fact<\/b> stated in the passage, an <b>inference<\/b>, the <b>meaning of a word<\/b> as used, and the <b>tone<\/b> of the author.<\/p><p>Neither test needs outside knowledge. Every answer is decided by the passage itself.<\/p>","key":"Cloze: read the whole passage first, then let the words on both sides of the blank decide. RC: find the lines the question points to, and answer only from them."},{"k":"table","title":"The two tests at a glance","head":["","Cloze test","Reading comprehension"],"rows":[["How many questions","5 blanks, one passage","5 questions on one passage"],["Length (typical)","120–180 words","250–400 words"],["What it checks","Grammar, collocation, linking words, word choice","Understanding: main idea, facts, inference, vocabulary, tone"],["Where the answer is","In the words around the blank and the flow of the passage","In particular lines of the passage — never in your general knowledge"],["Marks (Tier 1)","2 each, &minus;0.5 for a wrong answer","2 each, &minus;0.5 for a wrong answer"],["Time to aim for","3–4 minutes for the whole passage","5–7 minutes for the whole passage"]]},{"k":"table","title":"Question stems and their type","head":["The question says…","Type","Where to look"],"rows":[["Which is the most suitable title for the passage?","Main idea / title","The whole passage — often the first and last lines"],["What is the central theme of the passage?","Main idea / title","The point every paragraph supports"],["According to the passage, …","Fact / detail","The line that holds the key word of the question"],["Which of these is NOT mentioned in the passage?","Fact / detail","Check each option against the text"],["Which of the following can be inferred?","Inference","What the lines suggest without saying it outright"],["The author would most likely agree that …","Inference","The author's stated views, taken one small step further"],["The word ‘…’ as used in the passage means","Vocabulary in context","The sentence the word sits in"],["Choose the word opposite in meaning to ‘…’","Vocabulary in context","The sentence the word sits in"],["The tone of the passage is","Tone / attitude","The author's choice of words: praise, blame, worry, irony"],["The author's attitude towards … is","Tone / attitude","How the author describes that thing"]]},{"k":"table","title":"The cloze method in five steps","head":["Step","What you do","Why"],"rows":[["1. Read it all","Read the whole passage once, quickly, without filling anything","You learn the topic, the tense and the tone — the three things that decide most blanks"],["2. Name the slot","For each blank, ask: what part of speech fits here — noun, verb, preposition, linking word, article?","Often two options are the wrong part of speech and go at once"],["3. Look both sides","Read the words just before and just after the blank","Collocations (<i>pay ___ attention<\/i>) and prepositions (<i>___ of<\/i>) are decided by the neighbours"],["4. Check the logic","Does the sentence agree with, contrast with, or follow from the one before?","This decides linking words: <i>however<\/i> (contrast), <i>therefore<\/i> (result), <i>moreover<\/i> (addition)"],["5. Read it back","Put your five answers in and read the passage once more","A wrong choice usually sounds wrong when the passage is read as a whole"]]},{"k":"table","title":"The RC method in five steps","head":["Step","What you do","Why"],"rows":[["1. Skim the passage","Read it once at a steady speed; note what each paragraph is about in two or three words","You build a map, so you can find any line again in seconds"],["2. Read the question","Find its type (title, fact, inference, word, tone) and its key word","The type tells you where to look and what a right answer looks like"],["3. Go back to the lines","Find the key word in the passage and read the sentence before and after it","Answers are taken from the text, not from memory of it"],["4. Strike out","Remove options that are too narrow, too broad, extreme (<i>always<\/i>, <i>never<\/i>) or not in the passage","Wrong options are usually wrong for one of these four reasons"],["5. Prove it","Before you mark, point to the words that support your answer","If you cannot point to them, think again — or leave it (negative marking)"]]},{"k":"ex","h":"<p><b>Worked cloze passage 1.<\/b> Read it once, then look at the reasoning.<\/p><p>Trees in a city do far more than give shade. On a hot afternoon, a street lined with trees can be several degrees (1) ___ than an open road nearby. Their leaves trap dust, and their roots help rainwater sink (2) ___ the soil instead of flooding the drains. (3) ___, many cities have cut down old trees to widen roads. Planners now realise that a few extra metres of road are (4) ___ worth the loss. Some towns have begun to plant trees along every new road, and residents are asked to (5) ___ care of the saplings near their homes.<\/p><p>Options: (1) cooler / cool / coolest / coldly · (2) into / onto / at / over · (3) Yet / Therefore / Moreover / Besides · (4) rarely / always / mostly / highly · (5) take / make / do / give<\/p>"},{"k":"table","title":"Worked cloze 1: answers and reasoning","head":["Blank","Answer","Why, and why not the others"],"rows":[["1","cooler","<i>than<\/i> follows the blank, so a comparative is needed; <i>cool<\/i>, <i>coolest<\/i> and <i>coldly<\/i> cannot go with <i>than<\/i>."],["2","into","Water sinks <i>into<\/i> the soil (movement inside). <i>Onto<\/i> is movement on to a surface; <i>at<\/i> and <i>over<\/i> do not show going in."],["3","Yet","The sentence goes against what came before (trees help, yet they were cut): contrast. <i>Therefore<\/i> is result; <i>Moreover<\/i> and <i>Besides<\/i> add a point."],["4","rarely","Planners have realised the road is not worth the loss of trees — <i>rarely worth<\/i> says that. <i>Always<\/i> and <i>mostly<\/i> say the opposite; <i>highly worth<\/i> is not English."],["5","take","The fixed pair is <i>take care of<\/i>. We do not <i>make<\/i>, <i>do<\/i> or <i>give care of<\/i>."]]},{"k":"ex","h":"<p><b>Worked RC passage 1.<\/b> Read it once.<\/p><p>For most of history, people believed that diseases were caused by bad air or by an imbalance in the body. In the nineteenth century, scientists showed that many illnesses are spread by germs too small to see. The idea seemed strange at first, and some doctors refused to wash their hands between patients. Over time, however, hospitals that adopted cleanliness saw far fewer deaths. Today, washing hands with soap is one of the cheapest ways to prevent disease.<\/p>"},{"k":"table","title":"Worked RC 1: the five questions","head":["Question","Answer","How to find it"],"rows":[["Best title?","How the germ theory changed medicine","It covers the old belief, the new idea, the resistance and today's practice. ‘Bad air in history’ is only the first line — too narrow."],["According to the passage, what did some doctors refuse to do?","Wash their hands between patients","Stated in line 3 — find the key word <i>refused<\/i>."],["What can be inferred about hospitals before cleanliness was adopted?","More patients died in them","‘Hospitals that adopted cleanliness saw far fewer deaths’ implies higher deaths before. Not stated outright — inferred."],["‘Adopted’ as used in the passage means","Took up and began to use","A hospital cannot ‘take a child as its own’ — the other dictionary sense does not fit here."],["The tone of the passage?","Informative","It explains facts without praise, blame or irony."]]},{"k":"trick","h":"<b>Cloze: “Whole – Slot – Sides – Sense – Sound.”<\/b> Read the whole, name the slot, look at both sides, check the sense, sound it out. <b>RC: “Type – Key word – Lines – Prove.”<\/b>"},{"k":"trap","h":"In RC, an option can be <b>true in real life<\/b> and still be wrong, because the passage does not say it. Options with <b>always, never, all, only<\/b> usually go further than the passage. In a cloze test, do not fill each blank by its own sentence alone — the <b>tense and tone of the whole passage<\/b> decide many blanks."}],"sum":["Tier 1 English usually has one cloze passage (5 blanks) and one RC passage (5 questions) — about 20 marks.","Cloze method: read the whole passage, name the slot, look at both sides of the blank, check the logic, read it back.","RC method: skim, find the question type and key word, go back to the lines, strike out bad options, prove your answer.","RC question families: main idea or title, fact, inference, vocabulary in context, tone.","Answer only from the passage; true-in-life but unstated options are wrong.","Extreme options (always, never, only, all) are usually traps."],"part":["Part 1 · The method and the six cloze skills","विधि और क्लोज़ टेस्ट के छह कौशल"],"g":"cz"},
{"id":"CZ2","heat":2,"title":"Collocations and fixed pairs","hi":"कोलोकेशन — साथ चलने वाले शब्द","blocks":[{"k":"hot","h":"Nearly every cloze passage has one blank decided by a <b>collocation<\/b> — a word that habitually goes with another: <i>heavy rain<\/i>, <i>make a decision<\/i>, <i>pay attention<\/i>, <i>raise awareness<\/i>. The wrong options are often near-synonyms that mean the same but are simply not said."},{"k":"story","h":"<p>Why do we say <i>heavy rain<\/i> and not <i>strong rain<\/i>, or <i>strong tea<\/i> and not <i>powerful tea<\/i>? There is no rule of logic — English speakers have just always put these words together. Such habitual partners are called <b>collocations<\/b>.<\/p><p>The commonest kind in a cloze test is a <b>verb with a noun<\/b>: we <i>make<\/i> a mistake but <i>do<\/i> homework, <i>take<\/i> a break but <i>pay<\/i> attention. The second kind is an <b>adjective with a noun<\/b> (<i>heavy traffic<\/i>, <i>high temperature<\/i>). The third is a <b>fixed pair<\/b> joined by <i>and<\/i> (<i>safe and sound<\/i>, <i>pros and cons<\/i>), whose order never changes.<\/p><p>You cannot work these out — you learn them as whole phrases, the way you learn a phone number.<\/p>","key":"Learn the phrase, not the single word: ‘make a mistake’, ‘do homework’, ‘pay attention’."},{"k":"table","title":"Verb + noun: which verb goes with it?","head":["Words","Verb","Example"],"rows":[["___ a mistake","make","Everyone makes a mistake now and then."],["___ an effort","make","She made an effort to speak slowly."],["___ a wish","make","Close your eyes and make a wish."],["___ progress","make","The patient is making good progress."],["___ the bed","make","He makes the bed every morning."],["___ a noise","make","Please do not make a noise in the library."],["___ homework","do","The children do their homework after tea."],["___ the dishes","do","I will do the dishes tonight."],["___ (someone) a favour","do","Could you do me a favour?"],["___ business with (a firm)","do","We have done business with them for years."],["___ research","do","She is doing research on soil health."],["___ a photograph","take","Tourists took photographs of the fort."],["___ a break (a short rest)","take","Let us take a short break."],["___ a nap","take","Grandfather takes a nap after lunch."],["___ place (happen)","take","The meeting will take place on Friday."],["___ attention","pay","Pay attention to the road signs."],["___ tribute","pay","The nation paid tribute to the soldiers."],["___ the price","pay","The town paid the price for its carelessness."],["___ a fine","pay","He paid a fine for parking on the footpath."],["___ a cold","catch","She caught a cold in the rain."],["___ fire (begin to burn)","catch","Dry grass can catch fire easily."],["___ a glimpse","catch","We caught a glimpse of the tiger."],["___ a secret","keep","Can you keep a secret?"],["___ a diary","keep","He kept a diary during the trip."],["___ calm","keep","Keep calm and leave the building."],["___ track of","keep","Keep track of your expenses."],["___ awareness","raise","The campaign raised awareness about clean water."],["___ funds","raise","Students raised funds for the flood victims."],["___ the alarm","raise","The guard raised the alarm when he saw smoke."]]},{"k":"table","title":"Fixed pairs: the order never changes","head":["Begins","Ends with","Meaning"],"rows":[["bread and …","butter","one’s means of living"],["safe and …","sound","unharmed"],["null and …","void","having no legal force"],["odds and …","ends","small things of little value"],["pros and …","cons","arguments for and against"],["ups and …","downs","good and bad times"],["law and …","order","the keeping of public peace"],["wear and …","tear","damage from ordinary use"],["by and …","large","on the whole"],["now and …","then","sometimes"],["hale and …","hearty","healthy and strong"],["kith and …","kin","friends and relatives"],["part and …","parcel","an essential part"],["first and …","foremost","most importantly"],["spick and …","span","neat and clean"],["hue and …","cry","a loud public protest"]]},{"k":"table","title":"Adjective + noun: the natural partner","head":["Say","Not","Note"],"rows":[["heavy rain, heavy traffic","strong rain, big traffic","<i>heavy<\/i> for a large amount"],["strong tea, strong coffee","powerful tea","<i>strong<\/i> for a lot of flavour"],["high temperature, high price","tall temperature, big price","<i>high<\/i> for levels and amounts"],["dense fog, dense forest","crowded fog","<i>thick fog<\/i> is also right"],["deep sleep, sound sleep","strong sleep","—"],["sharp memory, sharp rise","pointed memory","<i>sharp<\/i> for quick or clear"],["hard work","heavy work (for effort)","<i>hard<\/i> for effort"],["bitter truth","sour truth","—"],["narrow escape","thin escape","only just escaped"],["golden opportunity","silver opportunity","a very good chance"],["open secret","public secret","something everyone knows"]]},{"k":"ex","h":"<p><b>Worked example.<\/b> ‘After weeks of talks, the panel finally ___ a decision on the new bus routes.’ Options: <i>made / did / gave / put<\/i>.<\/p><p><i>Decision<\/i> goes with <i>make<\/i> (and, in Indian and British English, <i>take<\/i>). <i>Did a decision<\/i>, <i>gave a decision<\/i> and <i>put a decision<\/i> are not said. Answer: <b>made<\/b>.<\/p>"},{"k":"trick","h":"<b>MAKE<\/b> creates something new (a cake, a plan, a noise, a profit). <b>DO<\/b> is for work, tasks and duties (homework, the dishes, one’s duty, a favour). When in doubt: <i>make<\/i> = produce, <i>do<\/i> = perform."},{"k":"trap","h":"<b>Commit<\/b> goes with <i>crime<\/i>, <i>murder<\/i> and <i>suicide<\/i>, but we <b>make<\/b> a mistake. We <b>raise<\/b> funds and awareness (the verb takes an object) — things <b>rise<\/b> by themselves (prices rise). <b>Lodge<\/b> or <b>file<\/b> a complaint, not <i>put<\/i> one."}],"sum":["A collocation is a word pair English speakers habitually use: heavy rain, strong tea, make a decision.","make — a mistake, an effort, a profit, progress, a noise; do — homework, the dishes, a favour, one’s best, research.","take — a photograph, a break, place; pay — attention, tribute, a fine, the price; catch — a cold, fire, a glimpse.","keep — a secret, a diary, calm, track of; raise — awareness, funds, the alarm; give — birth to, rise to.","Fixed pairs never change order: safe and sound, null and void, pros and cons, law and order, wear and tear.","Commit a crime but make a mistake; raise funds but prices rise."],"part":["Part 1 · The method and the six cloze skills","विधि और क्लोज़ टेस्ट के छह कौशल"],"g":"cz"},
{"id":"CZ3","heat":2,"title":"Prepositions in context","hi":"प्रसंग में पूर्वसर्ग (Prepositions)","blocks":[{"k":"hot","h":"About one blank in three of a cloze passage is a <b>preposition<\/b>. Most are decided by the word just before it — <i>depend <b>on<\/b><\/i>, <i>accused <b>of<\/b><\/i>, <i>prefer X <b>to<\/b> Y<\/i> — and the rest by time and place (<i>at<\/i> 6 o’clock, <i>on<\/i> Monday, <i>in<\/i> June)."},{"k":"story","h":"<p>A preposition is a small word that links a noun to the rest of the sentence: <i>in<\/i>, <i>on<\/i>, <i>at<\/i>, <i>of<\/i>, <i>for<\/i>, <i>with<\/i>, <i>from<\/i>, <i>to<\/i>. It is the hardest blank to guess, because the meaning seldom helps — we are <i>interested <b>in<\/b><\/i> music but <i>fond <b>of<\/b><\/i> it, and both mean almost the same.<\/p><p>The way through is to learn each word <b>with<\/b> its preposition, as one unit: not <i>accuse<\/i> but <i>accuse … of<\/i>; not <i>prefer<\/i> but <i>prefer … to<\/i>. For time and place, three words do most of the work: <b>at<\/b> for a point, <b>on<\/b> for a day or a surface, <b>in<\/b> for a longer period or an enclosed space.<\/p>","key":"Learn the word and its preposition together: depend on, accused of, prefer to, interested in."},{"k":"table","title":"Words and the preposition they take","head":["Word","Preposition","Example"],"rows":[["accused ___ (a crime)","of","He was accused of theft."],["afraid ___ (the dark)","of","The child is afraid of the dark."],["aware ___ (the risk)","of","Are you aware of the risk?"],["capable ___ (doing it)","of","She is capable of leading the team."],["fond ___ (music)","of","He is fond of old songs."],["proud ___ (her work)","of","She is proud of her work."],["ashamed ___ (his lie)","of","He was ashamed of his lie."],["jealous ___ (his success)","of","Some were jealous of his success."],["addicted ___ (mobile games)","to","Many teenagers are addicted to mobile games."],["married ___ (a doctor)","to","She is married to a doctor."],["superior ___ (the old model)","to","This phone is superior to the old model."],["similar ___ (mine)","to","Your bag is similar to mine."],["accustomed ___ (the heat)","to","We are accustomed to the heat."],["prefer tea ___ coffee","to","I prefer tea to coffee."],["object ___ (the plan)","to","The villagers objected to the plan."],["devoted ___ (her students)","to","She is devoted to her students."],["interested ___ (science)","in","He is interested in science."],["rich ___ (minerals)","in","The region is rich in minerals."],["believe ___ (hard work)","in","I believe in hard work."],["lacking ___ (courage)","in","He is not lacking in courage."],["confidence ___ (oneself)","in","Have confidence in yourself."],["participate ___ (the debate)","in","Ten schools participated in the debate."],["depend ___ (the weather)","on","Our plans depend on the weather."],["insist ___ (paying)","on","She insisted on paying."],["rely ___ (friends)","on","You can rely on your friends."],["keen ___ (cricket)","on","My brother is keen on cricket."],["comment ___ (the issue)","on","The minister refused to comment on the issue."],["arrive ___ a conclusion","at","The panel arrived at a conclusion."],["stare ___ (the stranger)","at","Do not stare at strangers."],["comply ___ (the rules)","with","All shops must comply with the rules."],["cope ___ (stress)","with","Exercise helps us cope with stress."],["filled ___ (water)","with","The pot was filled with water."],["suffer ___ (fever)","from","She is suffering from fever."],["refrain ___ (smoking)","from","Please refrain from smoking."],["abstain ___ (alcohol)","from","He abstains from alcohol."],["recover ___ (an illness)","from","He has recovered from the illness."],["famous ___ (its sweets)","for","The town is famous for its sweets."],["eligible ___ (the post)","for","Graduates are eligible for the post."],["apologise ___ (the delay)","for","The airline apologised for the delay."],["burst ___ tears","into","The child burst into tears."],["crash ___ (a wall)","into","The car crashed into a wall."]]},{"k":"table","title":"Time and place: at, on, in","head":["Preposition","Used for","Examples"],"rows":[["at","A point of time; a point or address","at 6 a.m., at noon, at night; at the station, at 12 Park Road"],["on","Days and dates; a surface","on Monday, on 15 August; on the table, on the wall"],["in","Months, years, seasons, parts of the day; inside a space","in June, in 2024, in winter, in the morning; in the room, in Delhi"],["since","A point in the past up to now (with the present perfect)","I have lived here since 2015."],["for","A length of time","He has been ill for three weeks."],["by","Not later than","Submit the form by Friday."],["into","Movement to the inside","She walked into the room."],["between / among","Two things / more than two","between the two brothers; among the five friends"]]},{"k":"ex","h":"<p><b>Worked example.<\/b> ‘The success of the scheme depends ___ the support of local people.’ Options: <i>on / in / at / to<\/i>.<\/p><p>Look only at the word before the blank: <i>depend<\/i> always takes <b>on<\/b> (or <i>upon<\/i>). Answer: <b>on<\/b>.<\/p>"},{"k":"trick","h":"<b>“Prefer TO, not THAN”<\/b>: I prefer tea <i>to<\/i> coffee. <b>“Since a point, for a period”<\/b>: since 2015, for ten years. <b>“Into for motion, in for position”<\/b>: he jumped into the pool; he is swimming in the pool."},{"k":"trap","h":"<b>Prefer … to<\/b>, not <i>prefer … than<\/i>. <b>Superior/inferior/senior/junior to<\/b>, not <i>than<\/i>. <b>Accused of<\/b> but <b>charged with<\/b>. <b>Congratulate on<\/b> a success. <b>Discuss<\/b> and <b>enter<\/b> take no preposition: we discuss a plan (not <i>discuss about<\/i>), enter a room (not <i>enter into<\/i>)."}],"sum":["Most prepositions are fixed by the word before them: depend on, accused of, interested in, prefer to.","of — afraid, aware, capable, fond, proud, ashamed, jealous; to — addicted, married, superior, similar, accustomed, object.","in — interested, rich, believe, succeed, confidence, participate; on — depend, insist, rely, keen, congratulate (on a success), comment.","with — comply, cope, filled; from — suffer, refrain, abstain, recover; for — famous, eligible, apologise.","Time: at a point, on a day or date, in a month, year or season; since a point, for a period.","Discuss and enter take no preposition; prefer and superior take to, not than."],"part":["Part 1 · The method and the six cloze skills","विधि और क्लोज़ टेस्ट के छह कौशल"],"g":"cz"},
{"id":"CZ4","heat":3,"title":"Linking words and connectors","hi":"संयोजक शब्द — however, therefore, despite, although","blocks":[{"k":"hot","h":"One or two blanks in almost every cloze passage need a <b>linking word<\/b>. The test is about <b>logic<\/b> — does the next idea go against, follow from, or add to the last one? — and then about <b>grammar<\/b>: <i>despite<\/i> takes a noun, <i>although<\/i> takes a clause."},{"k":"story","h":"<p>Linking words are the road signs of a passage. <b>However<\/b> says ‘turn: the next idea goes against the last’. <b>Therefore<\/b> says ‘this follows from what came before’. <b>Moreover<\/b> says ‘one more point in the same direction’.<\/p><p>So the method is simple. Read the sentence before the blank and the sentence after it, and ask what the second does to the first. Does it <b>contrast<\/b> with it? Is it a <b>result<\/b>? An <b>addition<\/b>? A <b>reason<\/b>, a <b>condition<\/b>, an <b>example<\/b>? Once you know the job, only one or two options remain, and the grammar picks between them.<\/p><p>Example: ‘It rained heavily. ___, the match went ahead.’ A match going ahead in heavy rain is unexpected — a contrast — so <i>Nevertheless<\/i> or <i>However<\/i>, not <i>Therefore<\/i>.<\/p>","key":"First decide the job (contrast, result, addition, reason, condition, purpose, example, time), then check the grammar."},{"k":"table","title":"Connectors and their jobs","head":["Connector","Job","Example"],"rows":[["however","Contrast","The plan was cheap; however, it failed."],["although","Contrast","Although it rained, the match went ahead."],["despite","Contrast","Despite the rain, the match went ahead."],["in spite of","Contrast","In spite of his injury, he finished the race."],["nevertheless","Contrast","He was tired; nevertheless, he kept working."],["whereas","Contrast","Cities are crowded, whereas villages are quiet."],["on the other hand","Contrast","City life is fast; village life, on the other hand, is slow."],["therefore","Result","The roads were flooded; therefore, schools were shut."],["consequently","Result","The factory polluted the river; consequently, the fish died."],["hence","Result","The shop was crowded; hence, we left."],["as a result","Result","Prices rose; as a result, sales fell."],["moreover","Addition","The scheme is cheap; moreover, it is quick."],["furthermore","Addition","The road is narrow; furthermore, it has no lights."],["in addition","Addition","It helps the poor; in addition, it creates jobs."],["besides","Addition","Besides English, she speaks Tamil."],["because","Reason","He was late because the bus broke down."],["because of","Reason","The match was called off because of rain."],["owing to","Reason","Owing to heavy traffic, we were late."],["unless","Condition","You will miss the bus unless you hurry."],["provided that","Condition","You may go, provided that you finish your work."],["in case","Condition","Take an umbrella in case it rains."],["so that","Purpose","She saved money so that she could study abroad."],["in order to","Purpose","He left early in order to catch the train."],["lest","Purpose","Walk carefully lest you should slip."],["for instance","Example","Some fruits, for instance amla, are rich in vitamin C."],["such as","Example","Millets such as ragi need little water."],["meanwhile","Time","The rice was cooking; meanwhile, she cut the vegetables."],["subsequently","Time","He joined as a clerk and was subsequently promoted."]]},{"k":"table","title":"Words that come in pairs","head":["First part","Second part","Example"],"rows":[["No sooner …","than","No sooner had the bell rung than the children ran out."],["Hardly …","when","Hardly had we arrived when it began to rain."],["Scarcely …","when","Scarcely had he sat down when the phone rang."],["Not only …","but also","She is not only a singer but also a dancer."],["Either …","or","Either you pay now or you pay a fine."],["Neither …","nor","Neither the teacher nor the students knew."],["Both …","and","Both rice and wheat are grown here."],["Whether …","or","Whether you agree or not, the rule stays."],["So + adjective …","that","He was so tired that he fell asleep."],["Rather …","than","I would rather walk than wait."]]},{"k":"table","title":"The grammar of connectors","head":["Connector","What follows it","Right / wrong"],"rows":[["despite, in spite of","A noun or -ing (no clause)","Despite the rain ✓ · Despite it rained ✗"],["although, though, even though","A full clause","Although it rained ✓ · Although the rain ✗"],["because of, owing to, due to","A noun","because of the strike ✓"],["because","A full clause","because the workers went on strike ✓"],["however, therefore, moreover","Usually a new clause; set off by commas","…; however, it failed."],["lest","should + V1 (or the plain verb)","lest he should fall ✓ · lest he does not fall ✗"],["unless","A positive clause (it already means ‘if not’)","unless you hurry ✓ · unless you do not hurry ✗"]]},{"k":"ex","h":"<p><b>Worked example.<\/b> ‘___ his injury, he completed the race.’ Options: <i>Despite / Although / However / Because<\/i>.<\/p><p>Job: an injured man finishing a race is a <b>contrast<\/b> — so <i>Despite<\/i>, <i>Although<\/i> or <i>However<\/i>. Grammar: what follows is a noun (<i>his injury<\/i>), not a clause, so <i>Although<\/i> fails; <i>However<\/i> cannot join a noun to a clause. Answer: <b>Despite<\/b>.<\/p>"},{"k":"trick","h":"<b>“Despite takes a thing, although takes a sentence.”<\/b> Despite <i>the rain<\/i>; although <i>it rained<\/i>. And <b>never<\/b> write <i>despite of<\/i> — it is <i>despite<\/i> or <i>in spite of<\/i>."},{"k":"trap","h":"<b>No sooner … than<\/b> (not <i>then<\/i> or <i>when<\/i>); <b>hardly / scarcely … when<\/b> (not <i>than<\/i>). <b>Unless<\/b> and <b>lest<\/b> already contain ‘not’, so do not add another <i>not<\/i>. <b>Although … but<\/b> is wrong — use one or the other."}],"sum":["First find the job of the blank: contrast, result, addition, reason, condition, purpose, example or time.","Contrast: however, although, despite, in spite of, nevertheless, whereas, on the other hand.","Result: therefore, consequently, hence, as a result. Addition: moreover, furthermore, in addition, besides.","Despite and in spite of take a noun; although takes a clause. Never ‘despite of’.","No sooner … than; hardly / scarcely … when; not only … but also; either … or; neither … nor.","Unless and lest are already negative; do not add ‘not’ after them."],"part":["Part 1 · The method and the six cloze skills","विधि और क्लोज़ टेस्ट के छह कौशल"],"g":"cz"},
{"id":"CZ5","heat":2,"title":"Tense and verb form from the context","hi":"प्रसंग से काल (Tense) और क्रिया-रूप","blocks":[{"k":"hot","h":"When the options are four forms of one verb (<i>has been working / is working / was working / works<\/i>), the blank is about <b>tense<\/b>. The passage gives the answer through <b>signal words<\/b> (<i>since<\/i>, <i>by the time<\/i>, <i>yesterday<\/i>) and through the tense of the sentences around it."},{"k":"story","h":"<p>A passage keeps to one time frame. A story about the freedom movement is told in the past; an article on climate change speaks of the present and the future. So the first clue to a tense blank is <b>the tense of the whole passage<\/b> — which you noticed on your first reading.<\/p><p>The second clue is a <b>signal word<\/b>. <i>Since 2018<\/i> or <i>for three years<\/i> joined to ‘now’ calls for the present perfect (<i>has worked<\/i>, <i>has been working<\/i>). <i>By the time<\/i> + a past event calls for the past perfect (<i>had left<\/i>). <i>Yesterday<\/i>, <i>ago<\/i>, <i>last year<\/i> call for the simple past.<\/p><p>The third clue is a <b>fixed verb pattern<\/b>: <i>look forward to<\/i> takes <i>-ing<\/i>; <i>used to<\/i> takes the plain verb; <i>make someone<\/i> takes the plain verb without <i>to<\/i>.<\/p>","key":"Tense of the passage first, then the signal word, then the fixed pattern."},{"k":"table","title":"Signal words and the tense they call for","head":["Signal","Tense or form","Example"],"rows":[["every day, usually, always (a habit)","Simple present","She walks for an hour every morning."],["a universal truth","Simple present","Water boils at 100 °C."],["now, at the moment, Look!","Present continuous","Look! The children are playing."],["since 2018 / for three years (up to now)","Present perfect","She has worked here since 2018."],["just, already, yet","Present perfect","The train has just left."],["yesterday, ago, last year, in 2010","Simple past","He visited Agra last year."],["while + an action going on in the past","Past continuous","While I was cooking, the lights went out."],["by the time / before + a past event","Past perfect","The train had left before we arrived."],["tomorrow, next week","Simple future","We will meet tomorrow."],["at this time tomorrow","Future continuous","At this time tomorrow I will be flying to Chennai."],["by next year / by the time + a future event","Future perfect","By next year she will have finished the course."],["If + simple past (unreal now)","would + V1","If I were rich, I would build a school."],["If + had + V3 (unreal past)","would have + V3","If he had studied, he would have passed."],["It is high time …","Past form","It is high time we left."]]},{"k":"table","title":"The verb form after certain words","head":["Word or pattern","Form that follows","Example"],"rows":[["look forward to","-ing","I look forward to meeting you."],["be used to (be familiar with)","-ing","He is used to getting up early."],["avoid","-ing","She avoided answering."],["enjoy","-ing","They enjoy reading."],["mind","-ing","Would you mind closing the door?"],["finish","-ing","He finished writing the report."],["used to (past habit)","V1 (bare)","He used to walk to school."],["let (someone)","V1 (bare)","Let him speak."],["make (someone)","V1 (bare)","The teacher made us repeat the poem."],["had better","V1 (bare)","You had better leave now."],["would rather","V1 (bare)","I would rather stay home."],["decide","to + V1","She decided to join the course."],["want","to + V1","They want to win."],["refuse","to + V1","He refused to sign."],["hope","to + V1","We hope to see you soon."],["have (something) …","V3 (past participle)","I had my watch repaired."],["get (something) …","V3 (past participle)","She got her eyes tested."]]},{"k":"ex","h":"<p><b>Worked example.<\/b> ‘By the time the fire brigade arrived, the house ___ down.’ Options: <i>had burnt / has burnt / will burn / is burning<\/i>.<\/p><p>Signal: <i>by the time<\/i> + a past event (<i>arrived<\/i>). The burning was complete <b>before<\/b> that past moment — past perfect. Answer: <b>had burnt<\/b>.<\/p>"},{"k":"trick","h":"<b>“Used TO + V1, used to + ING”<\/b>: <i>I used to walk<\/i> (I no longer do) but <i>I am used to walking<\/i> (it is normal for me). The little word <b>am / is / are<\/b> before <i>used to<\/i> changes everything."},{"k":"trap","h":"<b>Since<\/b> needs the present perfect, not the simple present: <i>I have lived here since 2015<\/i>, not <i>I live here since 2015<\/i>. In an <b>if<\/b>-clause about the future, use the simple present: <i>If it rains tomorrow<\/i>, not <i>If it will rain<\/i>. After <b>wish<\/b> about the past, use the past perfect: <i>I wish I had known<\/i>."}],"sum":["Keep to the tense of the passage unless a signal word changes it.","since / for + up to now → present perfect; by the time + past → past perfect; yesterday, ago → simple past.","If + present → will; if + past → would + V1; if + had + V3 → would have + V3.","look forward to, be used to, avoid, enjoy, mind, finish → -ing.","used to, let, make, had better, would rather → V1; decide, want, refuse, hope → to + V1; have/get something → V3.","It is high time and wish (present) take the past form."],"part":["Part 1 · The method and the six cloze skills","विधि और क्लोज़ टेस्ट के छह कौशल"],"g":"cz"},
{"id":"CZ6","heat":3,"title":"Near-synonyms: the right word by meaning and tone","hi":"समान-अर्थी शब्दों में सही शब्द — अर्थ और भाव","blocks":[{"k":"hot","h":"Some blanks offer four words of about the same meaning — <i>famous, renowned, notorious, celebrated<\/i>. Only one fits the <b>shade<\/b> of the sentence (good or bad), or the exact <b>meaning<\/b> (<i>economic<\/i> vs <i>economical<\/i>). Look-alike pairs (<i>affect/effect<\/i>, <i>principal/principle<\/i>) are also tested this way."},{"k":"story","h":"<p>Words that look alike in a dictionary can feel very different in a sentence. A <i>thrifty<\/i> man and a <i>miserly<\/i> man both spend little — but the first is praised and the second is blamed. <i>Childlike<\/i> wonder is charming; <i>childish<\/i> behaviour is silly. <i>Famous<\/i> and <i>notorious<\/i> both mean ‘well known’, but only a criminal is notorious.<\/p><p>So when the options look like synonyms, ask two questions. First, <b>is the sentence approving or disapproving?<\/b> Words such as <i>finally arrested<\/i>, <i>shameful<\/i> or <i>praised<\/i> tell you. Second, <b>what exactly is meant?<\/b> A car that saves petrol is <i>economical<\/i>; a crisis about money and jobs is <i>economic<\/i>.<\/p>","key":"Ask: is the sentence praising or blaming? Then pick the word with the same shade and the exact meaning."},{"k":"table","title":"Look-alikes and near-synonyms in a sentence","head":["Sentence","Right word","Look-alike (wrong here)","Why"],"rows":[["The ___ smuggler was finally arrested.","notorious","famous","Notorious = well known for something bad."],["The scientist is ___ for her work on clean water.","renowned","notorious","Renowned = famous for something good."],["He never wastes money but helps the needy; he is ___.","thrifty","miserly","Thrifty is praise; miserly is blame."],["Throwing a tantrum over a game is ___ behaviour.","childish","childlike","Childish = silly; childlike = innocent."],["She looked at the world with ___ wonder.","childlike","childish","Childlike wonder is fresh and innocent."],["Be ___ to the feelings of others.","sensitive","sensible","Sensitive = aware of feelings."],["It would be ___ to carry an umbrella today.","sensible","sensitive","Sensible = wise, reasonable."],["This car is very ___ on petrol.","economical","economic","Economical = saving money."],["The country faces an ___ crisis.","economic","economical","Economic = about the economy."],["Loud noise can ___ your hearing.","affect","effect","Affect is the verb (to influence)."],["The new rule had a good ___ on traffic.","effect","affect","Effect is the noun (a result)."],["The ___ of the school spoke to parents.","principal","principle","Principal = head of a school."],["Lying is against my ___.","principles","principals","Principle = a rule of conduct."],["Everyone came ___ Ravi.","except","accept","Except = leaving out."],["Please ___ my apology.","accept","except","Accept = take willingly."],["Do not ___ your ticket.","lose","loose","Lose = misplace."],["The screw is ___; tighten it.","loose","lose","Loose = not tight."],["The red scarf is a perfect ___ to her dress.","complement","compliment","Complement = something that completes."],["He paid her a ___ on her speech.","compliment","complement","Compliment = words of praise."],["A storm is ___; boats must return.","imminent","eminent","Imminent = about to happen."],["Dr Rao is an ___ surgeon.","eminent","imminent","Eminent = distinguished."],["The equator is an ___ line.","imaginary","imaginative","Imaginary = not real."],["The child wrote an ___ story.","imaginative","imaginary","Imaginative = full of fresh ideas."],["The damage was ___ — a tiny scratch.","negligible","negligent","Negligible = too small to matter."],["The guard was ___ and left the gate open.","negligent","negligible","Negligent = careless in duty."],["Masked men ___ the bank.","robbed","stole","We rob a person or place; we steal a thing."],["Someone ___ my bicycle.","stole","robbed","We steal a thing from someone."]]},{"k":"table","title":"Same idea, different shade","head":["Word","Shade","Its partner with the other shade"],"rows":[["thrifty","Approving (+)","miserly, stingy"],["miserly","Disapproving (−)","thrifty"],["confident","Approving (+)","arrogant"],["arrogant","Disapproving (−)","confident"],["firm","Approving (+)","stubborn, obstinate"],["stubborn","Disapproving (−)","firm, determined"],["curious","Approving (+)","nosy"],["nosy","Disapproving (−)","curious"],["slim","Approving (+)","skinny"],["skinny","Disapproving (−)","slim"],["renowned","Approving (+)","notorious"],["notorious","Disapproving (−)","renowned, famous"],["childlike","Approving (+)","childish"],["childish","Disapproving (−)","childlike"],["courageous","Approving (+)","reckless"],["reckless","Disapproving (−)","courageous, brave"],["generous","Approving (+)","extravagant"],["extravagant","Disapproving (−)","generous"],["assertive","Approving (+)","aggressive"],["aggressive","Disapproving (−)","assertive"],["frank","Approving (+)","blunt, rude"],["gracious","Approving (+)","haughty"],["curt","Disapproving (−)","brief, polite"],["diligent","Approving (+)","negligent"]]},{"k":"ex","h":"<p><b>Worked example.<\/b> ‘Even after losing the final, the captain remained ___ and praised the winners.’ Options: <i>gracious / arrogant / bitter / sullen<\/i>.<\/p><p>The clue is <i>praised the winners<\/i> — an approving sentence. <i>Arrogant<\/i>, <i>bitter<\/i> and <i>sullen<\/i> are all disapproving and would not go with praising the rivals. Answer: <b>gracious<\/b>.<\/p>"},{"k":"trick","h":"<b>“A-ffect is the A-ction (verb); E-ffect is the E-nd result (noun).”<\/b> <b>“The princi-PAL is your PAL”<\/b> (a person); a princi-PLE is a ru-LE."},{"k":"trap","h":"<b>Famous<\/b> and <b>renowned<\/b> are for good fame; <b>notorious<\/b> and <b>infamous<\/b> for bad. <b>Rob<\/b> a person or a place; <b>steal<\/b> a thing. <b>Negligible<\/b> describes an amount; <b>negligent<\/b> describes a person."}],"sum":["When options look like synonyms, ask whether the sentence approves or disapproves.","Approving: thrifty, confident, firm, curious, slim, renowned, childlike, courageous, generous.","Disapproving: miserly, arrogant, stubborn, nosy, skinny, notorious, childish, reckless, extravagant.","affect (verb) / effect (noun); principal (head, main) / principle (rule); accept / except; lose / loose.","economical (saving money) / economic (of the economy); sensible (wise) / sensitive (feeling).","imminent (about to happen) / eminent (distinguished); negligible (tiny) / negligent (careless)."],"part":["Part 1 · The method and the six cloze skills","विधि और क्लोज़ टेस्ट के छह कौशल"],"g":"cz"},
{"id":"CZ7","heat":1,"title":"Articles and determiners","hi":"आर्टिकल और निर्धारक (a, an, the, few, little)","blocks":[{"k":"hot","h":"Article blanks appear now and then: <b>a<\/b> or <b>an<\/b> (decided by the <b>sound<\/b>, not the letter), <b>the<\/b> for something particular or unique, or <b>no article<\/b>. Determiners such as <i>few / a few<\/i>, <i>little / a little<\/i>, <i>much / many<\/i> are tested in the same slot."},{"k":"story","h":"<p><b>A<\/b> and <b>an<\/b> mean ‘one, any one’. Which you use depends on the first <b>sound<\/b> of the next word: <i>an<\/i> before a vowel sound (<i>an hour<\/i>, <i>an MBA<\/i>), <i>a<\/i> before a consonant sound (<i>a university<\/i>, <i>a one-rupee coin<\/i>). The spelling can mislead you; say the word aloud.<\/p><p><b>The<\/b> points to something particular — one the reader already knows, or one of a kind: <i>the sun<\/i>, <i>the Ganga<\/i>, <i>the Ramayana<\/i>, <i>the best student<\/i>.<\/p><p>Many nouns take <b>no article<\/b> when used in general: names of most countries and cities (<i>India<\/i>, <i>Mumbai<\/i>), languages (<i>Hindi<\/i>), games (<i>cricket<\/i>), meals (<i>breakfast<\/i>) and abstract ideas (<i>honesty<\/i>).<\/p>","key":"a/an by sound; the for particular or unique; no article for general names, games, meals and ideas."},{"k":"table","title":"a or an: go by the sound","head":["Word","Article","Because it begins with the sound"],"rows":[["hour","an","‘our’ (silent h)"],["honest man","an","‘on’ (silent h)"],["honour","an","‘on’ (silent h)"],["heir","an","‘air’ (silent h)"],["hospital","a","‘h’ (h is sounded)"],["hotel","a","‘h’ (h is sounded)"],["university","a","‘yoo’ (a consonant sound)"],["European","a","‘yoo’"],["unique idea","a","‘yoo’"],["uniform","a","‘yoo’"],["useful book","a","‘yoo’"],["one-rupee coin","a","‘wun’ (a consonant sound)"],["umbrella","an","‘uh’ (a vowel sound)"],["unusual habit","an","‘uh’"],["MBA","an","‘em’"],["MLA","an","‘em’"],["FIR","an","‘ef’"],["X-ray","an","‘eks’"],["SSC exam","an","‘es’"],["NGO","an","‘en’"],["UPSC exam","a","‘yoo’"],["orange","an","‘o’"],["engineer","an","‘e’"]]},{"k":"table","title":"the, or no article?","head":["Phrase","Article","Rule"],"rows":[["___ Ganga","the","Rivers take the."],["___ Himalayas","the","Mountain ranges take the."],["___ Mount Everest","no article","A single peak takes no article."],["___ Indian Ocean","the","Oceans and seas take the."],["___ sun","the","One of a kind."],["___ India","no article","Most country names take no article."],["___ United States","the","Names with States, Kingdom, Republic take the."],["___ Ramayana","the","Holy books and epics take the."],["___ best student","the","Superlatives take the."],["___ rich (as a class)","the","the + adjective = a whole group of people."],["play ___ cricket","no article","Games take no article."],["play ___ flute","the","Musical instruments take the."],["have ___ lunch","no article","Meals in general take no article."],["___ honesty (in general)","no article","Abstract nouns in general take no article."],["speak ___ Hindi","no article","A language name alone takes no article."],["___ Taj Mahal","the","Famous buildings take the."],["___ Mumbai","no article","City names take no article."],["travel by ___ bus","no article","by + a means of transport."],["___ Sahara","the","Deserts take the."],["___ Times of India","the","Newspapers take the."],["on ___ Monday (in general)","no article","Days of the week take no article."],["___ north (a direction)","the","Directions take the: in the north."]]},{"k":"table","title":"Determiners of amount","head":["Word","Used with","Example"],"rows":[["much / little / a little","Uncountable nouns (water, money, time)","There is little time left."],["many / few / a few","Countable plural nouns (books, friends)","Only a few students came."],["few / little","Negative: hardly any","Few people know this (almost nobody)."],["a few / a little","Positive: some, a small number","I have a few friends here (I am not alone)."],["each / every","Singular noun, singular verb","Every student has a card."],["either / neither","One of two; singular verb","Either road leads to the station."],["fewer / less","fewer + countable; less + uncountable","fewer cars, less traffic"]]},{"k":"ex","h":"<p><b>Worked example.<\/b> ‘It was ___ unique chance to meet the scientist.’ Options: <i>a / an / much / any<\/i>.<\/p><p><i>Unique<\/i> starts with the sound ‘yoo’ — a consonant sound — so <b>a<\/b>, not <i>an<\/i>. <i>Much<\/i> and <i>any<\/i> do not fit a single countable noun here. Answer: <b>a<\/b>.<\/p>"},{"k":"trick","h":"<b>“Say it, don’t spell it.”<\/b> Read the next word aloud: <i>an<\/i> hour, <i>a<\/i> university, <i>an<\/i> MLA, <i>a<\/i> one-way road. The letter does not decide — the sound does."},{"k":"trap","h":"<b>Few<\/b> means ‘hardly any’ (negative); <b>a few<\/b> means ‘some’ (positive) — the same for <b>little / a little<\/b>. <i>Mount Everest<\/i> takes no article, but <i>the Himalayas<\/i> does. <i>The<\/i> + adjective (<i>the rich<\/i>, <i>the poor<\/i>) takes a <b>plural<\/b> verb: <i>The rich should help the poor<\/i>."}],"sum":["a before a consonant sound, an before a vowel sound: an hour, an MBA, a university, a one-rupee coin.","the: rivers, oceans, mountain ranges, deserts, holy books, newspapers, famous buildings, superlatives, unique things.","No article: most countries and cities, languages, games, meals, abstract nouns in general, single peaks.","the + adjective = a class of people with a plural verb: the rich, the poor.","few / little = hardly any; a few / a little = some.","much and little with uncountable nouns; many and few with countable plurals; fewer cars but less traffic."],"part":["Part 1 · The method and the six cloze skills","विधि और क्लोज़ टेस्ट के छह कौशल"],"g":"cz"},
{"id":"CZ8","heat":2,"title":"RC: the main idea and the title","hi":"अपठित गद्यांश: मुख्य विचार और शीर्षक","blocks":[{"k":"hot","h":"Almost every SSC passage has one question on the <b>main idea<\/b>, the <b>central theme<\/b> or the <b>most suitable title<\/b>. The right option covers the <b>whole<\/b> passage; the wrong ones are a single detail, something far too wide, or a twist of what was said."},{"k":"story","h":"<p>Imagine telling a friend in one breath what a passage was about. That sentence is its <b>main idea<\/b>. A <b>title<\/b> is the same idea squeezed into a few words.<\/p><p>The main idea is usually stated or shaped in the <b>first<\/b> sentence and rounded off in the <b>last<\/b>. The middle gives reasons and examples. So read the first and last lines again, and ask: which option would every sentence of the passage agree to support?<\/p><p>Then test each option. Is it <b>too narrow<\/b> — only one example? <b>Too broad<\/b> — about the whole world when the passage is about one town? <b>Distorted<\/b> — the passage’s words, but a claim it never made? <b>Extreme<\/b> — <i>always<\/i>, <i>never<\/i>, <i>all<\/i>? What survives is the answer.<\/p>","key":"The main idea is the one claim every sentence of the passage supports — not too narrow, not too broad."},{"k":"table","title":"Testing a main-idea option","head":["The option is…","What it looks like","Verdict"],"rows":[["Too narrow","One example or one sentence of the passage","Wrong — it is a detail"],["Too broad","A claim about everything (all cities, the whole world)","Wrong — the passage is more limited"],["Distorted","Uses the passage’s words but changes the claim","Wrong — check it against the lines"],["Extreme","Always, never, all, only, completely","Usually wrong"],["Outside","True in life but not discussed in the passage","Wrong"],["Just right","Covers the beginning, the middle and the end","Right"]]},{"k":"table","title":"Where the main idea hides","head":["Passage shape","Where to look","Example"],"rows":[["Problem → solution","The solution, often in the last line","‘Unless shoppers carry their own bags, rules will change little.’"],["Old belief → new view","The new view","‘Zero is a number, not merely an empty place.’"],["Gains and losses","Both sides together","‘The change has given privacy … at the same time, the elderly live alone.’"],["Praise of one thing","The thing and why it matters","‘A brisk walk … its benefits are remarkable.’"]]},{"k":"ex","h":"<p><b>Worked RC passage.<\/b> ‘Bees do much more than make honey. As they move from flower to flower, they carry pollen that many crops need in order to produce fruit and seed. Farmers who grow mustard, apples or sunflowers depend on them more than they realise. When bee numbers fall because of pesticides, harvests can fall too.’<\/p><p><b>Main idea?<\/b> (a) Bees make honey — <i>too narrow, and the passage says ‘much more than’<\/i>. (b) Pesticides are harmful to all life — <i>too broad<\/i>. (c) Without bees every crop dies — <i>extreme<\/i>. (d) <b>Bees matter to farming because they carry pollen that crops need<\/b> — covers all four sentences. <b>Best title:<\/b> ‘Bees: The Farmer’s Hidden Helpers’.<\/p>"},{"k":"trick","h":"<b>“First line + last line = main idea.”<\/b> Then use the <b>umbrella test<\/b>: the right option is an umbrella under which every sentence of the passage can stand."},{"k":"trap","h":"A title that repeats a striking word from the passage is <b>not<\/b> automatically right. ‘Water Tankers’ appears in a passage on rainwater harvesting, but it is only a detail. And a title should name the <b>topic<\/b>, not a <b>moral<\/b> the passage never draws."}],"sum":["The main idea is the one claim every sentence supports; a title says it in a few words.","Look at the first and last lines first.","Reject options that are too narrow (one detail), too broad, distorted, extreme or outside the passage.","For a ‘gains and losses’ passage, the main idea mentions both sides.","A striking word from the passage does not make an option right."],"part":["Part 2 · Reading comprehension skills","अपठित गद्यांश के कौशल"],"g":"cz"},
{"id":"CZ9","heat":3,"title":"RC: fact and detail questions","hi":"अपठित गद्यांश: तथ्य और विवरण के प्रश्न","blocks":[{"k":"hot","h":"Two of the five RC questions are usually <b>fact questions<\/b> — ‘According to the passage…’, ‘Which is NOT mentioned…’, ‘Why did…’. They are the surest marks in the section, because the answer is written in the passage, though usually in <b>different words<\/b>."},{"k":"story","h":"<p>A fact question is a treasure hunt with a map. The <b>key word<\/b> of the question — a name, a number, an unusual word — is the map. Find it in the passage, read the sentence it is in and the one around it, and the answer is there.<\/p><p>The examiner rarely copies the passage word for word into the right option. He <b>rephrases<\/b> it: ‘buy far fewer water tankers’ may become ‘need less water from outside’. Meanwhile a wrong option often copies the passage’s words exactly but gets the fact wrong. So match the <b>meaning<\/b>, not the words.<\/p><p>For a <b>NOT mentioned<\/b> question, turn it round: tick off each option you can find in the passage; the one left over is the answer.<\/p>","key":"Find the key word, read its sentence, match the meaning (not the exact words)."},{"k":"table","title":"Fact question stems and the move to make","head":["Stem","Move"],"rows":[["According to the passage, …","Find the key word; read one sentence before and after"],["Which of the following is true?","Check each option against the passage; one contradiction kills it"],["Which is NOT mentioned / NOT true?","Tick off the options you find; the leftover is the answer"],["Why did …?","Look for because, since, so, as a result near the key word"],["What happened when / after …?","Follow the order of events in the passage"]]},{"k":"table","title":"How wrong fact options are made","head":["Trick","Example from a passage on electric buses"],"rows":[["Opposite of the text","‘Fares are higher than on the old buses’ (the passage says they are the same)"],["Right words, wrong link","‘The buses are charged at stops during the day’ (they are charged overnight at the depot)"],["Not in the passage","‘The buses were made in India’ (never stated)"],["Wrong number or name","‘Each bus can run 100 km on a charge’ (the passage says 200)"]]},{"k":"ex","h":"<p><b>Worked RC passage.<\/b> ‘The city’s first electric buses began running in March. Each bus can travel about 200 kilometres on one charge and is charged overnight at the depot. The buses are quieter than diesel ones and give off no smoke. Fares are the same as on the old buses.’<\/p><p><b>Q.<\/b> According to the passage, when are the buses charged? Key word: <i>charged<\/i> → sentence 2 → <b>overnight, at the depot<\/b>. <b>Q.<\/b> Which is NOT mentioned? (a) the buses are quieter ✓ found; (b) they give off no smoke ✓ found; (c) fares are unchanged ✓ found; (d) <b>they were made in India<\/b> — not found, so this is the answer.<\/p>"},{"k":"trick","h":"<b>“Key word → line → meaning.”<\/b> Never answer a fact question from memory of the passage; go back to the line every time — it takes ten seconds and saves two and a half marks."},{"k":"trap","h":"An option that copies a whole phrase from the passage can still be wrong if it joins it to the <b>wrong subject or time<\/b>. And in a NOT question, an option that is <b>true in real life<\/b> but absent from the passage is the answer, not a wrong option."}],"sum":["Fact questions: According to the passage, which is true, which is NOT mentioned, why did.","Find the key word, read its sentence and the one around it.","Right options usually rephrase the passage; wrong ones often copy its words with a changed fact.","For NOT mentioned, tick off what you find; the leftover is the answer.","Watch for opposites, wrong links, wrong numbers and outside facts."],"part":["Part 2 · Reading comprehension skills","अपठित गद्यांश के कौशल"],"g":"cz"},
{"id":"CZ10","heat":2,"title":"RC: inference questions","hi":"अपठित गद्यांश: अनुमान (Inference) के प्रश्न","blocks":[{"k":"hot","h":"‘It can be inferred…’, ‘The passage suggests…’, ‘The author would most likely agree…’. One RC question in many shifts asks for what the passage <b>implies<\/b> but does not say. The right answer is <b>one small, safe step<\/b> beyond the text — never a leap."},{"k":"story","h":"<p>If a friend comes in with a wet umbrella, you infer that it is raining outside. You did not see the rain, but the umbrella makes it almost certain. That is an <b>inference<\/b>: a conclusion the facts force on you.<\/p><p>Notice what you did <i>not<\/i> infer: that it will rain all week, or that your friend hates rain. Those may be true, but the umbrella does not prove them.<\/p><p>Inference questions work the same way. The right option is something the passage makes <b>almost certain<\/b>. A wrong option either just repeats a stated fact (that is a fact question, not an inference), or goes much further than the passage allows.<\/p>","key":"An inference is one small step the passage forces — not a big leap it merely allows."},{"k":"table","title":"Is it a sound inference?","head":["The option…","Verdict","Why"],"rows":[["Must be true if the passage is true","Right","This is what an inference is"],["Could be true, but the passage does not show it","Wrong","A guess, not an inference"],["Goes against something the passage says","Wrong","A contradiction"],["Uses extreme words (all, never, only)","Usually wrong","Too big a step"],["Brings in outside knowledge","Wrong","The passage must support it"]]},{"k":"table","title":"Clues that point to an inference","head":["The passage says…","You may infer…"],"rows":[["‘X can raise the level of water in wells’","The level was lower before"],["‘less need to keep change’","They needed to keep change before"],["‘If batteries become cheaper too …’","Batteries are costly now"],["‘not wicked; they simply believe …’","They mean well"],["‘Truly, technology has made our lives simpler’ after describing a long process","The author means the opposite (irony)"]]},{"k":"ex","h":"<p><b>Worked RC passage.<\/b> ‘When the new road reached the village, the weekly bus became a daily one. Within a year, two clinics and a bank branch opened near the bus stand. Girls who had left school after Class 8 began to travel to the high school in the town.’<\/p><p><b>What can be inferred?<\/b> (a) <b>Before the road, the village was harder to reach and had fewer services<\/b> — forced by the facts ✓. (b) Every girl in the village now goes to college — <i>extreme leap<\/i>. (c) The bank was built by the government — <i>outside the passage<\/i>. (d) The bus now runs daily — <i>stated, so not an inference<\/i>.<\/p>"},{"k":"trick","h":"<b>The “must be true” test<\/b>: read each option and ask, ‘If everything in the passage is true, <i>must<\/i> this be true as well?’ Only one option passes."},{"k":"trap","h":"An option that is stated in so many words is <b>not<\/b> an inference, though it is true — prefer the option that follows from the text. And do not choose a statement just because you agree with it."}],"sum":["An inference is what the passage makes almost certain without saying it.","The right option is one small step from the text; wrong ones are leaps, guesses or contradictions.","Use the must-be-true test on every option.","‘The author would most likely agree’ asks for a view in line with the author’s stated views.","Irony: when praise does not match the facts, the author means the opposite."],"part":["Part 2 · Reading comprehension skills","अपठित गद्यांश के कौशल"],"g":"cz"},
{"id":"CZ11","heat":2,"title":"RC: vocabulary in context","hi":"अपठित गद्यांश: प्रसंग में शब्दार्थ","blocks":[{"k":"hot","h":"One or two RC questions ask the meaning (or the opposite) of a word ‘<b>as used in the passage<\/b>’. The trap is a <b>true dictionary meaning that does not fit this sentence<\/b> — <i>modest<\/i> as ‘humble in manner’ when the passage means ‘a modest budget’ (a small one)."},{"k":"story","h":"<p>Many English words have several meanings. <i>Recall<\/i> can mean ‘remember’ or ‘call back a faulty product’. <i>Common<\/i> can mean ‘widespread’ or ‘vulgar’. <i>Struck<\/i> can mean ‘hit’ or ‘went on strike’. In a passage, only one meaning is alive.<\/p><p>So never answer a vocabulary question from the word alone. Go to its sentence and <b>replace the word with each option<\/b>. The right option keeps the sentence’s meaning; a wrong one makes it odd or changes it.<\/p><p>For an <b>antonym<\/b> question, first find the word’s meaning in the sentence, then pick its opposite in that same sense.<\/p>","key":"Put each option in place of the word; the one that keeps the sentence’s meaning is right."},{"k":"table","title":"Words whose meaning changes with the sentence","head":["Word","In this sentence…","…it means"],"rows":[["modest","The mission was run on a modest budget.","small, limited"],["modest","Despite his fame, he remained modest.","humble"],["recall","Many people recall their first library visit.","remember"],["recall","The company will recall the faulty phones.","call back"],["common","Mobile payments have become common.","widespread"],["common","The two villages share a common well.","shared"],["struck","When floods struck the district …","hit suddenly"],["struck","The workers struck for higher wages.","went on strike"],["sharp","Prices showed a sharp rise.","sudden and large"],["sharp","She gave him a sharp reply.","harsh"],["sound","It is a sound plan.","sensible, reliable"],["sound","The child slept a sound sleep.","deep"],["table","They will table the proposal at the meeting.","present for discussion"],["humble","These humble grains are back on the plate.","simple, ordinary"]]},{"k":"table","title":"The four-step method","head":["Step","What you do"],"rows":[["1","Find the word in the passage and read its whole sentence"],["2","Guess the meaning in your own words before looking at the options"],["3","Replace the word with each option and read the sentence again"],["4","Reject the option that is a real meaning of the word but not the one used here"]]},{"k":"ex","h":"<p><b>Worked example.<\/b> ‘The mission cost far less than many space projects abroad, showing what careful planning can achieve on a <b>modest<\/b> budget.’<\/p><p>Options: <i>small / shy / humble in manner / decent in dress<\/i>. A budget cannot be shy or humble; those are meanings for people. Put <b>small<\/b> in: ‘on a small budget’ — the sentence keeps its sense. Answer: <b>small<\/b>.<\/p>"},{"k":"trick","h":"<b>“Swap and read.”<\/b> Swap the word for each option and read the sentence aloud in your head. The right one sounds like the passage; the trap sounds like a dictionary."},{"k":"trap","h":"The <b>most familiar<\/b> meaning is often the trap. And in an <b>antonym<\/b> question, one option is usually a <b>synonym<\/b> — read the question twice so you do not pick the same meaning when the opposite is asked."}],"sum":["Answer ‘as used in the passage’ — the meaning in that sentence, not the commonest one.","Guess the meaning first, then swap each option into the sentence.","Familiar dictionary meanings that do not fit are the usual traps (modest, recall, common, struck).","For an antonym, fix the sense first, then find its opposite; watch for a synonym among the options."],"part":["Part 2 · Reading comprehension skills","अपठित गद्यांश के कौशल"],"g":"cz"},
{"id":"CZ12","heat":2,"title":"RC: tone and the author’s attitude","hi":"अपठित गद्यांश: लेखक का भाव और दृष्टिकोण","blocks":[{"k":"hot","h":"‘The tone of the passage is…’ or ‘The author’s attitude towards X is…’ comes up in many shifts. The options are tone words — <i>critical, appreciative, objective, ironic, nostalgic, optimistic<\/i> — so you need to know what each means and which <b>signal words<\/b> reveal it."},{"k":"story","h":"<p>The same fact can be told in many voices. ‘The new road was finished in two years.’ — that is <b>objective<\/b>. ‘At last, after two long years of dust and delay, the road is finished!’ — that is <b>relieved<\/b>, even <b>critical<\/b> of the delay. ‘A mere two years for one kilometre — what speed!’ — that is <b>ironic<\/b>: the words praise, but the facts mock.<\/p><p>Tone lives in the author’s <b>choice of words<\/b>. Praise words (<i>remarkable<\/i>, <i>gift<\/i>, <i>pride<\/i>) give an appreciative tone. Blame words (<i>ignored<\/i>, <i>careless<\/i>, <i>fails<\/i>) give a critical one. Worry words (<i>harm<\/i>, <i>danger<\/i>, <i>may be lost<\/i>) give a concerned one. Plain facts with no such words give an objective one.<\/p><p>SSC passages are usually <b>moderate<\/b>. Extreme tones such as <i>furious<\/i>, <i>hysterical<\/i> or <i>despairing<\/i> are rarely right.<\/p>","key":"Tone is in the word choice: praise, blame, worry, hope, longing — or none (objective)."},{"k":"table","title":"Tone words and what they mean","head":["Tone word","Meaning","Signal in the text"],"rows":[["objective","Without personal feeling","Facts and figures; no praise or blame"],["critical","Finding fault","‘ignored’, ‘fails’, ‘left untouched’"],["appreciative","Valuing, praising","‘remarkable’, ‘gift’, ‘pride’"],["ironic","Saying the opposite of what is meant","Praise that the facts contradict"],["sarcastic","Mocking, meant to wound","‘Oh, brilliant work!’ for a failure"],["satirical","Using humour to attack foolishness","Exaggeration of a public folly"],["nostalgic","Longing for the past","‘in those days’, ‘once upon a time’"],["optimistic","Hopeful about the future","‘could’, ‘promising’, ‘may save many lives’"],["pessimistic","Expecting the worst","‘nothing will change’, ‘doomed’"],["didactic","Teaching a moral lesson","‘we must’, ‘one should always’"],["cynical","Believing people act only for themselves","‘as usual’, ‘of course they did’"],["sympathetic","Sharing others’ hardship","‘struggle’, ‘hardship’, ‘fair price’"],["indifferent","Showing no interest","Flat, uncaring language"],["laudatory","Full of high praise","‘heroic’, ‘outstanding’"],["condescending","Looking down on others","‘simple folk who cannot understand’"],["humorous","Meant to amuse","Jokes, light exaggeration"]]},{"k":"ex","h":"<p><b>Worked RC passage.<\/b> ‘Our town proudly opened a new “smart” parking system last year. Drivers now download an app, create an account, verify their phone number, choose a slot and pay online, all to park for ten minutes outside the vegetable market. Truly, technology has made our lives simpler.’<\/p><p>The last line praises, but the long list of steps shows the opposite — parking became harder. When the words and the facts disagree, the tone is <b>ironic<\/b>. It is not <i>appreciative<\/i> (that reads the words, not the facts) and not <i>objective<\/i> (the author clearly has a view).<\/p>"},{"k":"trick","h":"<b>“Count the feeling words.”<\/b> No feeling words → objective. Praise → appreciative. Blame → critical. Worry → concerned. Hope → optimistic. Praise that the facts mock → ironic."},{"k":"trap","h":"<b>Ironic<\/b> and <b>sarcastic<\/b> are close: irony says the opposite of what is meant; sarcasm is irony meant to hurt someone. <b>Indifferent<\/b> (not caring) is not the same as <b>objective<\/b> (fair, without bias). Avoid extreme tones unless the passage is extreme."}],"sum":["Tone is shown by the author’s choice of words.","Objective = no feeling words; critical = blame; appreciative = praise; concerned = worry; optimistic = hope.","Ironic = the words say the opposite of what the facts show; sarcastic = irony meant to wound.","Nostalgic = longing for the past; didactic = teaching a lesson; cynical = doubting people’s motives.","SSC passages are usually moderate; extreme tones are rarely right.","Objective is not indifferent."],"part":["Part 2 · Reading comprehension skills","अपठित गद्यांश के कौशल"],"g":"cz"},
{"id":"CZ13","heat":3,"title":"Full mixed practice: cloze and RC together","hi":"मिश्रित अभ्यास: क्लोज़ टेस्ट और गद्यांश एक साथ","blocks":[{"k":"hot","h":"In the exam the skills come mixed: one cloze blank is a collocation, the next a connector, the next a tense. This lesson puts them together — two full cloze passages and two full RC passages worked out step by step, then practice in the exam’s own format."},{"k":"story","h":"<p>On exam day the cloze and RC passages are usually the last English questions, and many candidates reach them in a hurry. A plan helps. Give the cloze passage about <b>three or four minutes<\/b> and the RC passage about <b>six<\/b>. Read each passage once before you answer anything.<\/p><p>For each cloze blank, name the skill it tests — collocation, preposition, connector, tense, word choice or article — and use that lesson’s rule. For each RC question, name its family — main idea, fact, inference, vocabulary or tone — and go back to the lines.<\/p><p>If a blank or question still has two good options after a proper look, it is fine to leave it: a wrong answer costs half a mark.<\/p>","key":"Name the skill first, then use its rule: that is the whole method."},{"k":"table","title":"Exam-day plan for the two passages","head":["Minute","Cloze passage","RC passage"],"rows":[["0–1","Read the whole passage once","Skim the passage; note each paragraph’s topic"],["1–3","Fill the easy blanks: collocations, prepositions, articles","Answer the fact and vocabulary questions first"],["3–4","Fill the logic blanks: connectors, tense, word choice","Answer the main idea, inference and tone questions"],["Last","Read the passage back with your answers","Check that each answer can be pointed to in the text"]]},{"k":"ex","h":"<p><b>Worked cloze passage 2.<\/b> Sleep is not wasted time. While we rest, the body (1) ___ damaged cells and the brain sorts the day’s memories. Adults need seven to eight hours a night, (2) ___ many get far less because of late work or mobile phones. A short night now and then does little harm, but a regular (3) ___ of sleep raises the risk of heart disease and weakens the body’s defences. Doctors suggest going to bed at the same time every night and keeping screens out of the bedroom. Such small changes can make a big (4) ___ to how we feel (5) ___ the day.<\/p><p>Options: (1) repairs / repaired / repairing / is repair · (2) yet / so / because / unless · (3) lack / lacking / lacks / lacked · (4) difference / variety / distance / division · (5) during / since / among / beside<\/p>"},{"k":"table","title":"Worked cloze 2: answers and the skill tested","head":["Blank","Answer","Skill and reasoning"],"rows":[["1","repairs","Tense: the passage is in the simple present (<i>sorts<\/i>), and the subject <i>the body<\/i> is singular."],["2","yet","Connector: people need eight hours, yet they get less — contrast. <i>So<\/i> and <i>because<\/i> give a false link; <i>unless<\/i> makes no sense."],["3","lack","Part of speech: after <i>a regular<\/i> we need a noun; the others are verb forms."],["4","difference","Collocation: <i>make a difference to<\/i>. We do not <i>make a variety<\/i> or <i>a distance<\/i> to something."],["5","during","Preposition of time: <i>during the day<\/i>. <i>Since the day<\/i> needs a starting point; <i>among<\/i> and <i>beside<\/i> are not time words."]]},{"k":"ex","h":"<p><b>Worked cloze passage 3.<\/b> For generations, the village post office was more than a place to buy stamps. People came to it to send money (1) ___ their families, to open small savings accounts and to hear news from the town. With the spread of mobile phones, many expected it to (2) ___ away. Instead, it has changed with the times. Today many post offices run banks, deliver parcels for online shops and help elderly people (3) ___ their pensions. (4) ___ its old letters have almost vanished, the post office is busier than it (5) ___ been for years.<\/p><p>Options: (1) to / at / by / with · (2) fade / break / give / put · (3) collect / collecting / collected / collects · (4) Although / Because / Unless / Despite · (5) has / had / have / is<\/p>"},{"k":"table","title":"Worked cloze 3: answers and the skill tested","head":["Blank","Answer","Skill and reasoning"],"rows":[["1","to","Preposition: we send something <i>to<\/i> someone."],["2","fade","Phrasal verb: <i>fade away<\/i> = slowly disappear. <i>Break away<\/i> means to separate; <i>give away<\/i> and <i>put away<\/i> need an object."],["3","collect","Verb form: <i>help someone<\/i> + V1 (or <i>to<\/i> + V1). <i>Collecting<\/i>, <i>collected<\/i> and <i>collects<\/i> do not follow <i>help someone<\/i>."],["4","Although","Connector and grammar: letters vanished, yet it is busier — contrast; a full clause follows, so <i>Although<\/i>, not <i>Despite<\/i>."],["5","has","Tense: <i>is busier than it has been for years<\/i> — present perfect with <i>for years<\/i>, matching <i>is<\/i>."]]},{"k":"ex","h":"<p><b>Worked RC passage 2.<\/b> Old phones, chargers and laptops are piling up in Indian homes. When they are thrown out with ordinary rubbish, they often reach informal yards where workers burn the plastic to recover copper and gold. The smoke carries lead and other poisons into the air, and the workers rarely have masks or gloves. Yet the same devices, if sent to proper recycling units, can yield valuable metals safely. What is missing is not technology but a simple, trusted way for families to hand over their old gadgets.<\/p>"},{"k":"table","title":"Worked RC 2: the five questions","head":["Question","Answer","Family and reasoning"],"rows":[["Main idea?","E-waste is handled dangerously, though safe recycling exists; families need an easy way to hand it over","Main idea: it covers the problem, the safe option and the missing link. ‘Workers burn plastic’ alone is too narrow."],["Why do workers burn the plastic?","To recover copper and gold","Fact: sentence 2, key word <i>burn<\/i>."],["What can be inferred about most families today?","They lack a simple way to send old gadgets for proper recycling","Inference: ‘what is missing is … a simple, trusted way’ implies families do not have one now."],["‘Yield’ as used in the passage means","Produce, give","Vocabulary: devices <i>yield metals<\/i> — produce them. ‘Give way, surrender’ is another sense that does not fit."],["Tone?","Concerned but constructive","Tone: worry about poisons, then a practical way forward."]]},{"k":"ex","h":"<p><b>Worked RC passage 3.<\/b> The idea that every child should go to school is surprisingly recent. For most of history, learning to read was a privilege of priests, scholars and the wealthy. In the nineteenth and twentieth centuries, many countries began to treat basic education as a duty of the state. In India, the Right to Education Act of 2009 made free schooling a legal right for children between six and fourteen. The struggle now is less about getting children into classrooms than about making sure they actually learn there.<\/p>"},{"k":"table","title":"Worked RC 3: the five questions","head":["Question","Answer","Family and reasoning"],"rows":[["Best title?","From Privilege to Right: Schooling for All","Title: it covers the old privilege, the new right and today’s challenge."],["For which ages did the 2009 Act make schooling a right?","Six to fourteen","Fact: sentence 4."],["What can be inferred?","Many children who attend school are not learning enough","Inference: the struggle is now ‘making sure they actually learn’, which implies many do not."],["‘Privilege’ as used in the passage means","A special advantage open to only a few","Vocabulary: reading belonged to priests, scholars and the wealthy — a few."],["Tone?","Informative and reflective","Tone: it traces history calmly and ends with a thoughtful point."]]},{"k":"trick","h":"<b>“Name it, then solve it.”<\/b> Every cloze blank and every RC question belongs to one of eleven families you have studied. Saying the family’s name in your head — ‘connector’, ‘inference’ — calls up its rule."},{"k":"trap","h":"Do not let one hard blank eat your time: fill the others first, then come back — the filled passage often makes the hard one clear. In RC, do not answer the main idea question first if you are unsure; the fact questions you answer first will show you what the passage is about."}],"sum":["Give the cloze passage about three or four minutes and the RC passage about six.","Read each passage once before answering anything.","Name the skill of each cloze blank: collocation, preposition, connector, tense, word choice or article.","Name the family of each RC question: main idea, fact, inference, vocabulary or tone.","Do the easy blanks and fact questions first; come back to the hard ones.","Leave a question only after a proper look leaves two equally good options."],"part":["Part 3 · Full mixed practice","मिश्रित अभ्यास"],"g":"cz"}
];

["CZ1","What is the best first step in a cloze test?",["Read the whole passage once without filling the blanks","Fill the first blank at once and move on","Read only the sentences that contain blanks","Start with the blank whose options look hardest"],"Reading the whole passage first tells you its topic, tense and tone, which decide most blanks."],
["CZ1","In a cloze test, which words help most in choosing a preposition or a collocation for a blank?",["The words just before and just after the blank","The title of the passage","The longest word among the options","The first sentence of the passage"],"Prepositions and collocations are fixed by their neighbours — for example, ‘depend ___’ needs ‘on’."],
["CZ1","A cloze sentence reads: ‘The plan was cheap; ___, it failed within a month.’ Which kind of word does the blank need?",["A contrast word such as ‘however’","A result word such as ‘therefore’","An addition word such as ‘moreover’","A time word such as ‘meanwhile’"],"A cheap plan that failed is a turn against what we expect, so the blank needs contrast: ‘however’."],
["CZ1","A question says: ‘Which of the following can be inferred from the passage?’ What type of question is this?",["Inference","Vocabulary in context","Main idea","Tone"],"‘Can be inferred’ asks for what the passage suggests without saying it outright."],
["CZ1","A question says: ‘The word “steady”, as used in the passage, most nearly means’. What type of question is this?",["Vocabulary in context","Fact or detail","Inference","Main idea"],"It asks the meaning of a word in the sentence where it appears — vocabulary in context."],
["CZ1","A question says: ‘The author’s attitude towards the new law is’. What type of question is this?",["Tone and attitude","Fact or detail","Vocabulary in context","Title"],"Attitude questions ask how the author feels about something, judged from the words used."],
["CZ1","A question says: ‘According to the passage, why did the farmers leave the village?’ What type of question is this?",["Fact or detail","Inference","Tone","Main idea"],"‘According to the passage’ asks for something the passage states directly."],
["CZ1","A question says: ‘Choose the most suitable title for the passage.’ What type of question is this?",["Main idea or title","Inference","Vocabulary in context","Fact or detail"],"A title must cover the main idea of the whole passage."],
["CZ1","In a reading comprehension test, an option is true in real life but is not stated or suggested in the passage. You should:",["reject it, because the answer must come from the passage","choose it, because facts are always right","choose it only if it is the longest option","choose it if it contains the word ‘always’"],"RC answers come only from the passage; outside knowledge is not the test."],
["CZ1","In a main idea question, an option that describes only one example from the passage is usually:",["too narrow to be the main idea","the best answer","too broad to be the main idea","a tone word"],"The main idea covers the whole passage; a single example is a detail."],
["CZ1","In RC options, words such as ‘always’, ‘never’ and ‘only’ are usually a sign that the option:",["goes further than the passage supports","is copied from the passage","is the correct answer","is about vocabulary"],"Passages rarely make absolute claims, so extreme words often mark a wrong option."],
["CZ1","For a fact question, where should you look for the answer?",["In the lines that contain the question’s key word","Only in the first line of the passage","In your general knowledge of the topic","Only in the last line of the passage"],"Find the key word of the question in the passage and read around it."],
["CZ1","Two options seem to fit a cloze blank. What is the best next step?",["Read the sentences before and after the blank for logic and tone","Pick the longer word","Pick the word you have seen less often","Leave the whole passage"],"The flow of the passage — what comes before and after — usually rules one option out."],
["CZ1","Why is it useful to name the part of speech a cloze blank needs (noun, verb, preposition, etc.)?",["Options of the wrong part of speech can be removed at once","It tells you the title of the passage","It decides the tone of the passage","It shows which blank carries more marks"],"If the slot needs a verb, the noun and adjective options go straight away."],
["CZ1","Which of these is NOT one of the usual question families in an SSC reading passage?",["Spotting a spelling error in the passage","Main idea or title","Inference","Vocabulary in context"],"The usual five families are main idea, fact, inference, vocabulary and tone; spelling is tested elsewhere in the section."],
["CZ1","Fill in the blank: ‘A street lined with trees can be several degrees ___ than an open road nearby.’",["cooler","cool","coolest","coldly"],"‘Than’ after the blank needs a comparative adjective: cooler."],
["CZ1","Fill in the blank: ‘Residents are asked to ___ care of the saplings planted near their homes.’",["take","make","do","give"],"The fixed phrase is ‘take care of’."],

["CZ2","Fill in the blank: ‘The weather office has warned of ___ rain in the coastal districts over the next two days.’",["heavy","strong","big","thick"],"The collocation is ‘heavy rain’; ‘strong rain’ and ‘big rain’ are not used."],
["CZ2","Fill in the blank: ‘After weeks of discussion, the committee finally ___ a decision on the new bus routes.’",["made","did","gave","put"],"We ‘make’ (or ‘take’) a decision; ‘did’, ‘gave’ and ‘put’ a decision are not English."],
["CZ2","Fill in the blank: ‘Passengers are requested to ___ attention to the safety instructions before take-off.’",["pay","make","take","keep"],"The collocation is ‘pay attention’."],
["CZ2","Fill in the blank: ‘My grandmother likes her tea ___, with very little milk and plenty of leaves.’",["strong","powerful","heavy","hard"],"Tea with a lot of flavour is ‘strong tea’; ‘powerful tea’ is not said."],
["CZ2","Fill in the blank: ‘The new campaign aims to ___ awareness about the dangers of drunk driving.’",["raise","rise","lift","grow"],"We ‘raise awareness’. ‘Rise’ takes no object — prices rise by themselves."],

["CZ2","Fill in the blank: ‘Despite the slowdown, the company ___ a healthy profit in the last quarter.’",["made","did","gave","built"],"We ‘make a profit’."],
["CZ2","Fill in the blank: ‘We must ___ our best to finish the project before the rains begin.’",["do","make","take","have"],"The phrase is ‘do one’s best’."],
["CZ2","Fill in the blank: ‘The thief was caught ___-handed while breaking the lock of the shop.’",["red","black","blue","white"],"‘Caught red-handed’ means caught in the act."],
["CZ2","Fill in the blank: ‘For the fishermen of the coast, the sea is not a hobby; it is their bread and ___.’",["butter","jam","milk","salt"],"‘Bread and butter’ means one’s means of living."],
["CZ2","Fill in the blank: ‘After years of quarrelling over the land, the two brothers finally decided to bury the ___.’",["hatchet","sword","knife","spade"],"‘Bury the hatchet’ means to end a quarrel and make peace."],
["CZ2","Fill in the blank: ‘She has a ___ memory and never forgets a face she has seen once.’",["sharp","pointed","heavy","tall"],"A memory that is quick and clear is a ‘sharp memory’."],
["CZ2","Fill in the blank: ‘Passengers must ___ their seat belts fastened until the plane stops completely.’",["keep","hold","stay","remain"],"‘Keep something fastened’ is right; ‘stay’ and ‘remain’ cannot take an object here, and ‘hold’ is not used with ‘fastened’."],
["CZ2","Fill in the blank: ‘He ___ a cold after walking home in the rain without an umbrella.’",["caught","held","kept","made"],"We ‘catch a cold’."],
["CZ2","Fill in the blank: ‘The teacher asked the students to ___ their homework neatly in the new notebooks.’",["do","make","take","play"],"Tasks and work take ‘do’: ‘do homework’."],
["CZ2","Fill in the blank: ‘Rescue teams worked round the ___ to reach the miners trapped underground.’",["clock","day","watch","time"],"‘Round the clock’ means all day and all night."],
["CZ2","Fill in the blank: ‘It is an ___ secret in the town that the old bridge is unsafe; everyone knows it.’",["open","clear","public","plain"],"An ‘open secret’ is something supposed to be secret that everyone knows."],
["CZ2","Fill in the blank: ‘The shopkeeper has ___ a complaint with the police about the theft.’",["lodged","put","thrown","placed"],"We ‘lodge’ (or ‘file’) a complaint."],
["CZ2","Fill in the blank: ‘The police believe that the man ___ the crime alone, without any help.’",["committed","made","performed","acted"],"Crimes are ‘committed’."],
["CZ2","Fill in the blank: ‘The lost child was found the next morning, safe and ___.’",["sound","well","fine","secure"],"The fixed pair is ‘safe and sound’ — unharmed."],
["CZ2","Fill in the blank: ‘Before choosing a college, list the pros and ___ of each one.’",["cons","minus","against","negatives"],"The fixed pair is ‘pros and cons’ — arguments for and against."],
["CZ2","Fill in the blank: ‘The tourists ___ a glimpse of the snow leopard before it vanished among the rocks.’",["caught","held","kept","made"],"We ‘catch a glimpse’ of something."],
["CZ2","Fill in the blank: ‘The court declared the contract null and ___ because it had been signed under pressure.’",["void","empty","blank","zero"],"‘Null and void’ means having no legal force."],
["CZ2","Fill in the blank: ‘The whole nation ___ tribute to the soldiers who died defending the border.’",["paid","gave","made","took"],"The collocation is ‘pay tribute’."],
["CZ3","Fill in the blank: ‘The officer was accused ___ taking a bribe from a contractor.’",["of","for","with","about"],"‘Accuse someone of something’. (We say ‘charged with’, but ‘accused of’.)"],
["CZ3","Fill in the blank: ‘My sister has been suffering ___ fever since Monday.’",["from","by","of","at"],"We ‘suffer from’ an illness."],
["CZ3","Fill in the blank: ‘The success of the water scheme depends ___ the support of the local people.’",["on","in","at","to"],"‘Depend’ always takes ‘on’ (or ‘upon’)."],
["CZ3","Fill in the blank: ‘Many office workers prefer walking ___ driving when the distance is short.’",["to","than","from","against"],"‘Prefer A to B’ — never ‘prefer … than’."],
["CZ3","Fill in the blank: ‘The students congratulated their teacher ___ her national award.’",["on","at","with","about"],"We ‘congratulate someone on’ a success."],
["CZ3","Fill in the blank: ‘Jharkhand is rich ___ minerals such as coal and iron ore.’",["in","of","at","by"],"‘Rich in’ something."],
["CZ3","Fill in the blank: ‘The meeting will begin ___ 10 a.m. sharp, so please be seated early.’",["at","on","in","since"],"A point of time takes ‘at’."],
["CZ3","Fill in the blank: ‘India became independent ___ 15 August 1947.’",["on","in","at","since"],"Dates take ‘on’."],
["CZ3","Fill in the blank: ‘We have lived in this town ___ 2015, and we still love it.’",["since","for","by","at"],"A point in the past up to now takes ‘since’ with the present perfect."],
["CZ3","Fill in the blank: ‘The old man has been ill ___ three weeks and needs rest.’",["for","since","from","by"],"A length of time takes ‘for’."],

["CZ3","Fill in the blank: ‘The teacher divided the class ___ four groups for the project.’",["into","to","among","by"],"Splitting something into parts takes ‘divide into’."],
["CZ3","Fill in the blank: ‘The novel was translated ___ Bengali into English last year.’",["from","of","by","with"],"‘Translate from one language into another’."],
["CZ3","Fill in the blank: ‘Although it was late, she insisted ___ paying the whole bill herself.’",["on","for","to","at"],"‘Insist on’ something."],

["CZ8","Read the passage: “In many Indian towns, rain that falls on rooftops simply runs into drains and is lost. A simple pit or tank can capture this water and send it back into the ground. Over a few years, such pits can raise the level of water in nearby wells. Several housing societies that tried the idea now buy far fewer water tankers in summer. The method is cheap, needs little upkeep and can be copied almost anywhere.” What is the main idea of the passage?",["Collecting rooftop rainwater in pits is a cheap and effective way to save water","Towns in India should build more and bigger drains","Water tankers cost housing societies too much in summer","The wells of Indian towns have dried up completely"],"The passage describes the problem, the method, its results and its low cost — all about rooftop rainwater harvesting. The tankers are only one result.",""],

["CZ8","Read the passage: “Children today spend hours each day in front of screens. Doctors warn that too much screen time, especially late at night, can disturb sleep and strain the eyes. Yet screens are not harmful in themselves; a well-chosen video can teach a child more about the planets than a dull textbook. The real task for parents is not to ban devices but to set sensible limits and choose good content.” What is the main idea of the passage?",["Screens should be used with sensible limits and good content rather than banned","Screens are the main cause of poor sleep in children","Videos teach children better than any textbook can","Parents should take all devices away from their children"],"The last sentence gives the point: not a ban, but limits and good content. The passage says a good video beats a dull textbook — not every textbook.",""],
["CZ8","Read the passage: “The idea of zero as a number, and not merely an empty place, was developed by Indian mathematicians more than a thousand years ago. Brahmagupta, writing in the seventh century, gave rules for adding and subtracting with zero. The idea travelled west through Arab scholars and slowly changed how people everywhere did arithmetic. Without it, much of modern mathematics and computing would be hard to imagine.” What is the main idea of the passage?",["The Indian idea of zero as a number changed mathematics across the world","Brahmagupta was the greatest mathematician of all time","Arab scholars invented modern arithmetic","Computers cannot work without Indian scholars"],"The passage traces zero from India through the Arab world to all of modern mathematics. The other options are extreme or distorted.",""],

["CZ8","Read the passage: “Every year, crores of plastic bags are used for a few minutes and then thrown away. They choke drains, harm cattle that swallow them and break into tiny pieces that remain in the soil for centuries. Bans have been announced many times, but in many markets they are quietly ignored. Unless shoppers carry their own bags and shopkeepers stop offering free plastic, rules on paper will change little.” What is the main idea of the passage?",["Bans on plastic bags will work only if shoppers and shopkeepers change their habits","Plastic bags are useful for a few minutes","Cattle in Indian markets are often sick","No rule about plastic bags has ever been announced"],"The passage moves from the harm of plastic bags to failed bans and ends with the real solution: a change in habits.",""],
["CZ8","Read the passage: “In the past few years, paying through a mobile phone has become common even at small tea stalls in India. A customer scans a code, enters a PIN, and the money moves within seconds. For shopkeepers, this means less need to keep change and fewer trips to the bank. However, the ease of these payments has also attracted fraudsters, who trick people into sharing their PINs. Users therefore need to be as careful with their phones as they are with their wallets.” What is the main idea of the passage?",["Mobile payments are convenient, but users must guard against fraud","Tea stalls in India have stopped taking cash","Banks are no longer needed in India","Shopkeepers dislike mobile payments"],"The passage gives the benefits and then the danger of fraud — both sides belong in the main idea.",""],
["CZ8","Read the passage: “A brisk walk of thirty minutes a day costs nothing, yet its benefits are remarkable. Regular walkers tend to have healthier hearts, better control over their weight and a calmer mind. Unlike many sports, walking needs no special skill, partner or equipment. It is perhaps the easiest habit a busy person can build for a healthier life.” What is the main idea of the passage?",["A daily brisk walk is a free and simple habit with many health benefits","Walking is better than every sport","Busy people have no time for exercise","Walking needs special shoes and a partner"],"Every sentence supports the value and ease of a daily walk. ‘Better than every sport’ is extreme; the last option contradicts the passage.",""],
["CZ8","Read the passage: “For centuries, many Indian households were joint families, with grandparents, parents and children living under one roof. As people moved to cities for work, smaller nuclear families became more common. The change has given young couples more privacy and freedom of choice. At the same time, many elderly people now live alone, missing the daily company and care that the old system offered.” What is the main idea of the passage?",["The shift from joint to nuclear families has brought both gains and losses","Joint families were always better than nuclear families","Young couples in cities do not want privacy","Elderly people prefer to live alone"],"The passage gives a gain (privacy, freedom) and a loss (the elderly alone) — a balanced main idea.",""],
["CZ8","Read the passage: “India receives plenty of sunshine for most of the year, and the cost of solar panels has fallen sharply over the last decade. As a result, solar power is now among the cheapest sources of new electricity in the country. Farmers are using solar pumps to water their fields, and many villages that once had no power now light their homes with the sun. If storage batteries become cheaper too, the sun could meet a much larger share of India’s needs.” What is the main idea of the passage?",["Falling costs have made solar power a growing and promising source of energy in India","India has the sunniest weather in the world","Farmers in India no longer need electricity","Storage batteries have already become very cheap"],"The passage explains why solar power is now cheap, how it is used and how it could grow.",""],

["CZ10","Read the passage: “Before the printing press, every book had to be copied by hand, so books were rare and costly. When Gutenberg began printing with movable metal type in Europe around 1450, books could be produced quickly and in large numbers. Ideas now spread faster than ever, and more people learned to read. Many historians see printing as one of the inventions that shaped the modern world.” It can be inferred that before printing:",["fewer people could read","everyone owned many books","ideas spread faster than they do today","books were cheap to buy"],"After printing ‘more people learned to read’, so fewer could read before.",""],
["CZ10","Read the passage: “Mangrove forests grow along muddy coasts where rivers meet the sea. Their tangled roots hold the soil together and slow down storm waves before they reach villages. They also shelter young fish, which later support the fishing families of the coast. Despite this, large stretches of mangroves have been cleared for fish farms and buildings, leaving the coast more open to storms.” The passage suggests that clearing mangroves may also:",["hurt fishing families in the long run","increase the number of young fish","make the coast safer from storms","help hold the soil in place"],"Mangroves shelter young fish that later support fishing families; removing them removes that shelter.",""],

};

/* ===== Desktop layout (PC / tablet landscape) ===== */
@media (min-width: 1024px){
  :root{--side:236px}
  body{padding-left:var(--side);font-size:16.5px}
  .top{border-bottom:1px solid var(--rule)}
  .top-in{max-width:1320px;padding:16px 36px}
  .brand{font-size:21px}
  .brand small{font-size:13px}
  .stat{font-size:13px}
  .wrap{max-width:1320px;padding:0 36px 56px}
  .view{padding-top:28px}
  h1{font-size:34px} h2{font-size:22px} h3{font-size:17px}

  /* bottom tab bar becomes a left sidebar */
  .nav{top:0;bottom:0;left:0;right:auto;width:var(--side);height:auto;border-top:0;border-right:1px solid var(--rule);padding:84px 14px 20px;display:block;overflow:auto}
  .nav-in{display:flex;flex-direction:column;gap:4px;height:auto;max-width:none;margin:0}
  .nav-in::before{content:"Sections";display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:0 14px 8px}
  .nav button{flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-size:15px;min-height:0;height:auto;width:100%;text-align:left}
  .nav button svg{width:20px;height:20px;flex-shrink:0}
  .nav button:hover{background:var(--sunk)}
  .nav button[aria-current="page"]{background:var(--blue-bg)}
  .nav button[aria-current="page"] span{border-bottom:0!important}

  /* home: intro beside progress */
  .hero{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);column-gap:48px;align-items:end;padding-bottom:10px}
  .hero > .eyebrow,.hero > h1,.hero > p{grid-column:1}
  .hero > .meter{grid-column:2;grid-row:3;align-self:center}
  .hero > .row{grid-column:2;grid-row:2;align-self:end}

  /* lesson reader: facts, timelines, tricks sit side by side */
  .lhead{margin-bottom:0}
  .steps{max-width:640px}
  .steps + .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .steps + .stack > .plain,.steps + .stack > .row,.steps + .stack > p,.steps + .stack > .fig,.steps + .stack > h2,.steps + .stack > .tbl{grid-column:1/-1}
  .steps + .stack > .plain{max-width:86ch;font-size:17px}
  .steps + .stack > .hot,.steps + .stack > .story{grid-column:1/-1}
  .steps + .stack > .story{max-width:none;padding:20px 24px;font-size:17.5px}
  .steps + .stack > .story p{max-width:80ch}
  .steps + .stack:not(:has(> .block ~ .block)) > .block{grid-column:1/-1}
  .block,.qcard{padding:18px 20px;border-radius:14px}

  /* quizzes and question bank */
  #lq > .stack{display:grid;grid-template-columns:minmax(0,1fr);max-width:980px;gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .qt{font-size:18px}
  #plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #plist .opts{grid-template-columns:minmax(0,1fr)}
  .chips{flex-wrap:wrap;overflow:visible}

  /* mock test: question with the answer grid alongside */
  .mbar{top:calc(env(safe-area-inset-top,0px) + 67px)}
  .view > .qcard{max-width:1000px}
  .view > .row.between{max-width:1000px}
  .view > #msub{max-width:1000px;width:100%}
  .view > .block.stack{max-width:760px}
  .pal{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .kpis{max-width:760px}

  /* revise: summary cards and sheets in columns */
  #rv > .stack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #rv > .stack > .grph,#rv > .stack > p,#rv > .stack > .search,#rv > .stack > .callout{grid-column:1/-1}
  #dgl,#lml,#tll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #dgl > .grph,#dgl > p,#lml > p,#tll > .grph{grid-column:1/-1}
  #rv .search,#rv > #dgl ~ .search{max-width:520px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .flash{min-height:300px;max-width:760px;margin:0 auto;padding:32px 36px}
  .flash .front{font-size:22px}

  /* learn: era cards across the top */
  .eras{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;border-top:0}
  .les{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
  .les:hover{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 14px 30px -22px rgba(0,0,0,.45)}
  .les.next{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

  /* hub: the five apps in two columns */
  .appcs{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  /* plan: day cards in two columns, the open one full width */
  .plancfg{grid-template-columns:repeat(2,minmax(0,1fr));display:grid;gap:12px}
  .view > .pday{max-width:none}
  .pday .body{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pday .body > .row{grid-column:1/-1}
}
@media (min-width: 1500px){
  #plist,#dgl,#lml,#tll{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plancfg{grid-template-columns:repeat(3,minmax(0,1fr))}
}
